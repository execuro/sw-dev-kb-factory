name: Release

# Publishes @execuro-sw-ecosystem/sw-dev-knowledge-base-mcp to npm under its scoped name, with
# provenance via OIDC trusted publishing, and keeps the MCP Registry entry in step. Triggered by
# a version tag; every gate below runs and must pass BEFORE the publish step, because npm unpublish is time-limited to 72 hours and the
# package name stays burned afterwards — there is no "publish first, fix later" here.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: verify, publish, register
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for OIDC trusted publishing (npm CLI >= 11.5.1 exchanges this token for a
      # short-lived publish credential; no NPM_TOKEN secret is configured or needed).
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0 (npm docs, "Trusted
      # publishers"). Node 22 here is the release toolchain only — it is independent of the
      # package's own engines.node >= 20, which is the range consumers are supported on.
      # No `registry-url:` here, deliberately. It makes setup-node write an .npmrc containing
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` (plus the legacy `always-auth`
      # key). With no NODE_AUTH_TOKEN secret — and there is none, that is the point of OIDC —
      # npm reads an empty token, attempts token auth and fails before it ever tries the OIDC
      # exchange. The default registry is registry.npmjs.org anyway, and the staged manifest
      # carries `publishConfig.access: public`.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      # Every published artifact must trace to a commit. A tag that disagrees with
      # package.json's version would publish a version nobody tagged (or tag a version nobody
      # published), so this fails loudly before any gate runs rather than after.
      - name: Verify the tag matches package.json's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "RELEASE_VERSION=$pkg" >> "$GITHUB_ENV"

      - name: Typecheck server
        run: npm run typecheck

      - name: Typecheck ingest
        run: npm run typecheck:ingest

      # Same rationale as ci.yml: test/coldstart.test.ts runs in non-strict mode on CI
      # (CI=true) so the <300 ms cold-start measurement is still taken and printed on every run,
      # with an over-budget result surfaced as a `::warning::` annotation rather than gating
      # `npm test` — see that file's header comment. A single run is a true signal here.
      - name: Test
        run: npm test

      - name: Lint the platform wiki corpus
        run: npm run wiki:lint -- --layer platform

      # Builds the real tarball this release ships: staged tree, the file allow-list, the
      # docs-corpus config filter and the KB_CORPUS=docs refusal probe (scripts/pack.mjs).
      # `npm publish` below publishes exactly this tarball, so what was verified is what ships.
      # Run the script directly rather than through `npm run`: npm prints its own
      # `> package@version pack` banner to stdout before the script's output, so piping
      # `npm run pack --json` into a file yields something that is not valid JSON and the
      # next step dies parsing it. The script writes only JSON to stdout; its progress
      # output goes to stderr.
      - name: Pack (real pack, not --dry-run)
        run: node scripts/pack.mjs --json --stage-out dist-stage > pack-result.json

      - name: Locate the packed tarball
        run: |
          if ! node -e "JSON.parse(require('fs').readFileSync('pack-result.json','utf8'))" 2>/dev/null; then
            echo "::error::pack-result.json is not valid JSON — something wrote to stdout alongside the pack result"
            echo "--- pack-result.json ---"; cat pack-result.json
            exit 1
          fi
          tarball="$(node -p "require('./pack-result.json').tarball ?? ''")"
          stage="$(node -p "require('./pack-result.json').stageDir ?? ''")"
          if [ -z "$tarball" ] || [ -z "$stage" ]; then
            echo "::error::pack did not report a tarball path and staging directory (see pack-result.json)"
            cat pack-result.json
            exit 1
          fi
          [ -f "$stage/package.json" ] || { echo "::error::staged package at $stage has no package.json"; exit 1; }
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "STAGE=$stage" >> "$GITHUB_ENV"

      - name: Publish to npm (OIDC trusted publishing)
        run: |
          # An .npmrc auth line silently disables the OIDC path, so surface one rather than
          # letting `npm publish` fail with a bare auth error.
          for f in .npmrc "$HOME/.npmrc"; do
            if [ -f "$f" ] && grep -q '_authToken' "$f"; then
              echo "::error::$f sets _authToken; npm will use token auth and never attempt OIDC trusted publishing"
              exit 1
            fi
          done
          echo "id-token permission present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          # Publish from the staged directory, not from the .tgz path. npm documents trusted
          # publishing for `npm publish` run in a package directory; the tarball-path form is
          # undocumented there. The directory is the exact tree the verified tarball was packed
          # from, so every gate above still describes what ships.
          #
          # No --provenance: with trusted publishing npm generates and publishes provenance
          # automatically for a public package from a public repository. Passing the flag is
          # redundant and one more thing that can disagree with the OIDC path.
          # Idempotent: a release can fail in a later step (the registry submission has, more
          # than once) and re-running it must not die on npm's 409 for an existing version.
          # Publishing is the irreversible part; everything after it is safe to repeat.
          pkg="$(node -p "require('./package.json').name")"
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$pkg/$RELEASE_VERSION")" = "200" ]; then
            echo "::notice::$pkg@$RELEASE_VERSION is already on npm; skipping the publish"
            exit 0
          fi
          cd "$STAGE"
          # npm refuses to republish an existing version. That refusal means the version is
          # already there, which is the state this step wants — so treat it as success and let
          # the registry steps run. Any other failure is real and fails the job.
          # (The version endpoint above can still 404 while npm finishes validating a version
          # that is in fact published, so this second check is what actually makes a re-run work.)
          out="$(npm publish --access public 2>&1)" && { echo "$out"; exit 0; }
          echo "$out"
          if printf '%s' "$out" | grep -qiE 'cannot publish over|previously published|EPUBLISHCONFLICT|403 Forbidden - PUT .* - You cannot publish over'; then
            echo "::notice::$pkg@$RELEASE_VERSION is already published; continuing to the registry steps"
            exit 0
          fi
          exit 1

      # The npm publish above returns before the version is served by registry.npmjs.org, and
      # the MCP Registry validates that the npm version exists before it will accept the entry.
      # Without this wait the registry step loses that race and fails a release whose npm publish
      # actually succeeded. Bounded, so a genuinely missing version still fails the job.
      - name: Wait for npm to serve this version
        run: |
          pkg="$(node -p "require('./package.json').name")"
          url="https://registry.npmjs.org/$pkg/$RELEASE_VERSION"
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = "200" ]; then
              echo "$pkg@$RELEASE_VERSION is served by npm (after $((i*10))s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$pkg@$RELEASE_VERSION did not appear on npm within 10 minutes"
          exit 1

      # The MCP Registry lists this server; it stores metadata only, never the artifact, so it
      # must run AFTER the npm publish above — the registry validates that the npm package it
      # points at exists and that the package's own `mcpName` matches server.json's `name`.
      #
      # OIDC is used rather than a PAT: the token's repository owner is what grants the
      # `io.github.execuro/` namespace, so there is no secret to hold or rotate. The job already
      # requests `id-token: write` for npm provenance and the same permission covers this.
      #
      # This step is NOT continue-on-error: a release that publishes to npm but silently skips
      # the registry leaves consumers discovering a version that the registry never learns about.
      # It runs last, so a failure here cannot roll back or obscure a successful npm publish, and
      # re-running it after a fix is safe.
      - name: Check server.json is in step with this release
        run: |
          name="$(node -p "require('./server.json').name")"
          mcp="$(node -p "require('./package.json').mcpName")"
          sver="$(node -p "require('./server.json').version")"
          pident="$(node -p "require('./server.json').packages[0].identifier")"
          pver="$(node -p "require('./server.json').packages[0].version")"
          pkgname="$(node -p "require('./package.json').name")"
          fail=0
          [ "$name" = "$mcp" ] || { echo "::error::server.json name ($name) != package.json mcpName ($mcp)"; fail=1; }
          [ "$sver" = "$RELEASE_VERSION" ] || { echo "::error::server.json version ($sver) != released version ($RELEASE_VERSION)"; fail=1; }
          [ "$pver" = "$RELEASE_VERSION" ] || { echo "::error::server.json packages[0].version ($pver) != released version ($RELEASE_VERSION)"; fail=1; }
          [ "$pident" = "$pkgname" ] || { echo "::error::server.json packages[0].identifier ($pident) != package name ($pkgname)"; fail=1; }
          exit $fail

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Authenticate to the MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish

      - name: Confirm the registry entry resolves
        run: |
          name="$(node -p "require('./server.json').name")"
          # The registry is read-after-write eventually consistent in practice; retry briefly
          # rather than failing a release on a propagation lag.
          for i in 1 2 3 4 5; do
            if curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=$name" | grep -q "\"$name\""; then
              echo "registry entry for $name is live"; exit 0
            fi
            sleep 10
          done
          echo "::error::the registry has no entry for $name after publishing"; exit 1
