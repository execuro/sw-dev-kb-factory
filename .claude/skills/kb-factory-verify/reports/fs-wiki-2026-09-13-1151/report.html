rescore dev-60: groundingRelevance 70 -> 70 (pass1=70, pass2=100)", "rescore dev-60: actionability 40 -> 40 (pass1=40, pass2=70)", "rescore func-01: accuracy 70 -> 40 (pass1=70, pass2=40)", "rescore func-01: completeness 70 -> 40 (pass1=70, pass2=40)", "rescore func-01: honesty 100 -> 0 (pass1=100, pass2=0)", "rescore edge-07: accuracy 70 -> 70 (pass1=70, pass2=100)", "rescore edge-07: citation 100 -> 70 (pass1=100, pass2=70)", "Access-cost aggregates exclude ['dev-11', 'dev-12', 'dev-31', 'dev-32', 'dev-45', 'dev-46']: ground-truth call-log extractor mis-stamped a target-file Read across each pair (dev-11/12, dev-31/32, dev-45/46), corrupting both donor and recipient counts."]}, "raw": {"fs-wiki": {"dev-01": {"query": "How do I extend the product entity with a new association in Shopware's Data Abstraction Layer?", "category": "dev", "option": "fs-wiki", "answer": "To extend an existing entity like product with a new association, create an extension class under `<plugin root>/src/Extension/...` that extends `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityExtension`, implement `getDefinitionClass()` to point at the definition to extend (e.g. `ProductDefinition::class`), and override `extendFields(FieldCollection $collection)` to add the new association field(s). Register the class with the `shopware.entity.extension` service tag. For an association backed by a database column, add e.g. a `OneToOneAssociationField('exampleExtension', 'id', 'product_id', ExampleExtensionDefinition::class, true)` flagged with `CascadeDelete()`, define the linked `ExampleExtensionDefinition` (with an `FkField`, a `ReferenceVersionField` for versioned entities, and the inverse `OneToOneAssociationField`), register that definition with the `shopware.entity.definition` tag, and add the new table via a migration; then write to it through the product repository's `upsert()` using the association's property name. If no database column is needed, subscribe to the entity's loaded event (e.g. `ProductEvents::PRODUCT_LOADED_EVENT`) and call `$productEntity->addExtension('custom_string', new ArrayEntity([...]))` \u2014 the extension value must be a struct, not a scalar. Since Shopware 6.6.10.0, a `BulkEntityExtension` subclass can extend multiple entities at once via its `collect()` generator, tagged `shopware.bulk.entity.extension`. For general association types (One-to-One, One-to-Many/Many-to-One, Many-to-Many) between two entities, the wiki also documents adding an `FkField` plus the matching `*AssociationField` on each side, and for Many-to-Many a third `MappingEntityDefinition` with two `FkField`s and two `ManyToOneAssociationField`s. A key gotcha: setting `autoload` to `true` on both the `EntityExtension` and the `EntityDefinition` side for the same association causes recursion / out-of-memory errors \u2014 to autoload on every fetch, set it to `true` only on the `EntityExtension` side.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md:1-72", "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-associations.md:1-58"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"association\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | grep -i -E \"extend|entity\""}, {"tool": "Bash", "args": "grep -rl \"EntityExtension\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-associations.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-02": {"query": "What's the plugin lifecycle in Shopware \u2014 install, activate, uninstall \u2014 and how does `keepUserData` work?", "category": "dev", "option": "fs-wiki", "answer": "A Shopware plugin's base class (`Shopware\\Core\\Framework\\Plugin`, in `<plugin root>/src/SwagBasicExample.php`) can implement a series of lifecycle methods: `install(InstallContext $installContext)` registers entities (e.g. payment methods), creates initial data and prepares requirements \u2014 since the plugin is not yet enabled at this point, avoid creating fully active business data here; instead create data that can be safely activated/deactivated independently and only activate it in `activate()`. `activate(ActivateContext $context)` activates entities created in `install()` or creates data that requires the plugin to be active. `deactivate(DeactivateContext $context)` deactivates entities from `install()` or removes entities that cannot be safely left active. `update(UpdateContext $context)` handles non-database adjustments, feature toggles, or logic depending on old/new plugin versions (database changes belong in plugin migrations instead); `UpdateContext` adds `getUpdatePluginVersion()` and `getCurrentPluginVersion()`. `postInstall(InstallContext $context)` and `postUpdate(UpdateContext $context)` run after a successful install/update completes. `uninstall(UninstallContext $context)` removes or cleans up plugin data; `UninstallContext` adds `keepUserData()`. `keepUserData()` must be respected: if it returns `true`, persistent plugin data must not be deleted, e.g. `if ($uninstallContext->keepUserData()) { return; }` before any removal logic. Also, entities should not be blindly deleted in `uninstall()` \u2014 e.g. a payment method used on real orders should be deactivated rather than removed, to avoid leaving orders in a broken state.", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md:1-62"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*lifecycle*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-03": {"query": "How do I add a custom Store API route for a headless storefront?", "category": "dev", "option": "fs-wiki", "answer": "Follow the decoratable-route pattern Shopware uses internally: (1) Define an abstract route with a `getDecorated()` method and a `load(Criteria $criteria, SalesChannelContext $context): ExampleRouteResponse` method, e.g. `abstract class AbstractExampleRoute { abstract public function getDecorated(): AbstractExampleRoute; abstract public function load(Criteria $criteria, SalesChannelContext $context): ExampleRouteResponse; }`. (2) Implement the concrete route class tagged with the `#[Route(...)]` attribute using `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]`, and a route attribute such as `#[Route(path: '/store-api/example', name: 'store-api.example.search', methods: ['GET','POST'], defaults: ['_entity' => 'swag_example'])]` on `load()`; `getDecorated()` should throw `DecorationPatternException` when nothing decorates it yet, and every field returned via the API needs the `ApiAware` flag in its definition. (3) Register the route class as a service, constructor-injecting the needed repository (e.g. `swag_example.repository`). (4) Create an `ExampleRouteResponse extends StoreApiResponse` class exposing the search result via a getter. (5) Import the route via `<plugin root>/src/Resources/config/routes.php` using `$routes->import('../../Core/**/*Route.php', 'attribute');`, then verify discovery with `bin/console debug:router store-api.example.search` \u2014 this only confirms the route was discovered, not that the service can be constructed or a request succeeds. (6) Optionally document it by adding a JSON OpenAPI file under `<plugin root>/src/Resources/Schema/StoreApi/` (use `AdminApi` for Admin API endpoints) so the internal `OpenApi3Generator` picks it up, checkable at `/store-api/_info/stoplightio.html`. (7) To also expose the route to the Storefront, add a controller extending `StorefrontController`, scoped with `StorefrontRouteScope::ID`, that calls the route, and import it via `$routes->import('../../Storefront/**/*Controller.php', 'attribute');`; request it client-side with the existing `http-client` service or `fetch`. Note that the service definition and the `routes.php` import are separate steps \u2014 a route class can exist and be registered as a service without becoming a reachable endpoint until its attributes are imported, and a successful `debug:router` lookup only proves discovery, not that the endpoint works end to end.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md:1-58"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*store-api*\" -o -iname \"*add-custom*route*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-04": {"query": "How do I create a custom CMS element for Shopping Experiences?", "category": "dev", "option": "fs-wiki", "answer": "A CMS element is the smallest content primitive (text, image, video, product listing, etc.) placed inside a block's slot in Shopware's Shopping Experience (CMS) system; elements have no knowledge of their context and are always rendered inside a parent block's slot. The recommended Administration directory layout is `src/Resources/app/administration/src/module/sw-cms/elements/<name>/` with `index.js`, a `component/` folder (index.js + .html.twig + .scss), a `config/` folder (index.js + .html.twig), and a `preview/` folder (index.js + .html.twig + .scss). Steps: (1) import the element folder in `main.js`; (2) register it via `Shopware.Service('cmsService').registerCmsElement({...})` with keys `name`, `label`, `component`, `configComponent`, `previewComponent`, `defaultConfig` (a map of config key to `{ source, value }`), and optionally `hidden` / `removable`; (3) create the preview component (the thumbnail shown in the element picker); (4) create the main component, mixing in `cms-element` and calling `this.initElementConfig('<name>')` in `created()`, providing fallback content so the element isn't invisible in the editor when unconfigured; (5) create the config component (also mixing in `cms-element`, also calling `initElementConfig`), providing form fields for each `defaultConfig` key, preferring Shopware Meteor components; (6) for inheritance-aware fields (content inherited from the base layout vs. overridden per page), wrap them with `sw-cms-inherit-wrapper`, passing `field` and `element`; (7) for the Storefront, add a Twig template at `src/Resources/views/storefront/element/cms-element-<name>.html.twig` \u2014 the `cms-element-` prefix is required exactly as part of the filename. Gotchas: the Storefront template file name must include the `cms-element-` prefix exactly (e.g. `cms-element-dailymotion.html.twig`), the Storefront cache must be cleared after adding new element templates, and by default element configuration is inherited from the base layout unless explicitly overridden via the inherit-wrapper component.", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/cms/add-cms-element.md:1-59"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*cms*element*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/content/cms/add-cms-element.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-05": {"query": "How does theme inheritance work in Shopware \u2014 theme.json and SCSS overrides?", "category": "dev", "option": "fs-wiki", "answer": "Theme inheritance lets one theme extend an existing, installed theme, reusing its templates, styles, scripts, assets and config while adding its own changes \u2014 useful for a variant of an already-used theme (e.g. a dark version, per-sales-channel differences, or a customized store-bought theme) without duplicating or modifying the original theme's code. You edit `theme.json` in `<plugin root>/src/Resources` of the extending theme and insert the base theme's technical name into each relevant section, before the extending theme's own alias, e.g.:\n```javascript\n{\n  \"name\": \"SwagBasicExampleThemeExtend\",\n  \"views\": [\"@Storefront\", \"@Plugins\", \"@SwagBasicExampleTheme\", \"@SwagBasicExampleThemeExtend\"],\n  \"style\": [\"app/storefront/src/scss/overrides.scss\", \"@SwagBasicExampleTheme\", \"app/storefront/src/scss/base.scss\"],\n  \"script\": [\"@Storefront\", \"@SwagBasicExampleTheme\", \"app/storefront/dist/storefront/js/.../file.js\"],\n  \"asset\": [\"@Storefront\", \"@SwagBasicExampleTheme\", \"app/storefront/src/assets\"],\n  \"configInheritance\": [\"@Storefront\", \"@SwagBasicExampleTheme\"]\n}\n```\n`views` render in order: Storefront base, then plugin extensions, then the base theme, then the current theme. `script` follows the same layered order. For `style`, `overrides.scss` is placed first in the list because it can affect SCSS variables such as `$border-radius` that later files reference. `asset` needs the base theme's alias added explicitly to reuse its assets. `configInheritance` makes the last-listed theme that differs from the current one the parent for config values \u2014 the `Storefront` theme's config is always inherited even without an explicit `configInheritance` entry. On config inheritance specifically, the base theme (e.g. `SwagBasicExampleTheme`) defines config fields in `theme.json` (e.g. `sw-color-brand-primary` of type `color`, `sw-brand-icon` of type `url`), and the extending theme references it via `configInheritance` and only declares the fields it needs to add or override, for example overriding `sw-brand-icon`'s default value while adding a brand-new field like `sw-advent-calendar-background-color`. All inherited fields show up in the Administration with an inherit anchor and use the parent theme's value until explicitly overridden. Since v6.7.1.0, field definitions in `theme.json` omit inline `label`/`helpText` translation objects, which before v6.8.0.0 were carried directly in `theme.json`.", "citations": ["platform/dev/6.7/guides/plugins/themes/inheritance/add-theme-inheritance.md:1-54", "platform/dev/6.7/guides/plugins/themes/configuration/theme-inheritance-configuration.md:1-56"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*theme*\" | grep -i -E \"inherit|scss|theme.json|customi\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/themes/inheritance/add-theme-inheritance.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/themes/configuration/theme-inheritance-configuration.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-06": {"query": "How do I add a custom Flow Builder action?", "category": "dev", "option": "fs-wiki", "answer": "To add a custom Flow Builder action (example: `action.create.tag`) you need both a backend PHP implementation and an Administration UI part. Steps: (1) Define an `Aware` interface for the data your action needs, extending `Shopware\\Core\\Framework\\Event\\FlowEventAware` and marked `#[IsFlowEventAware]`, e.g. `interface TagAware extends FlowEventAware { public const TAG = 'tag'; public const TAG_ID = 'tagId'; public function getTag(); }`. (2) Implement the action, extending `Shopware\\Core\\Content\\Flow\\Dispatching\\Action\\FlowAction`, providing a static `getName()` (e.g. `'action.create.tag'`), a `requirements()` method returning the Aware interfaces it needs (e.g. `[TagAware::class]`), and a `handleFlow(StorableFlow $flow): void` method that reads the flow's config via `$flow->getConfig()`, uses `$flow->getStore($key)` for data coming from Aware interfaces and `$flow->getData($key)` for data from the original event or additional data, and performs the business task (e.g. via a repository). (3) Register the action with the `flow.action` service tag, including `priority` and `key`, e.g. `$services->set(CreateTagAction::class)->args([service('tag.repository')])->tag('flow.action', ['priority' => 600, 'key' => 'action.create.tag']);` \u2014 this makes the action appear in the `/api/_info/flow-actions.json` response, and `priority` determines its order. (4) `requirements()` controls the action's scope: an empty array makes it available for every trigger; a list of Aware interfaces (e.g. `[OrderAware::class, CustomerAware::class]`) restricts it to matching events; or you can define a brand-new event implementing your custom Aware and register it via a `BusinessEventCollectorSubscriber` listening on `BusinessEventCollectorEvent::NAME` \u2014 this subscriber must run with sufficiently high priority so it registers before other `BusinessEventCollectorEvent` subscribers, or awareness/actions may be missing. (5) In the Administration, define an action constant and a `GROUP` (defaults to `general` if not set; existing groups include `general`, `tag`, `customer`, `order`), add snippet labels, and override the `sw-flow-sequence-action` component to map the action name to a modal name (or to `onSaveActionSuccess` directly if no modal is needed), then import the override and any new component into `main.js`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-action.md:1-94"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*flow*\" | grep -i action"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-action.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-07": {"query": "My plugin needs to store its own data in a new table \u2014 how do I define a custom DAL entity with its definition, entity and collection class so I get a repository for it?", "category": "dev", "option": "fs-wiki", "answer": "First, create the table via a plugin migration, prefixing the table name (e.g. `swag_example`). Then add an `EntityDefinition` subclass implementing `getEntityName()` (returns the table name, which also doubles as the `<name>.repository` service ID in the DI container \u2014 the two must match exactly) and `defineFields()`, e.g.:\n```php\nclass ExampleDefinition extends EntityDefinition\n{\n    public const ENTITY_NAME = 'swag_example';\n    public function getEntityName(): string { return self::ENTITY_NAME; }\n    protected function defineFields(): FieldCollection\n    {\n        return new FieldCollection([\n            (new IdField('id', 'id'))->addFlags(new Required(), new PrimaryKey()),\n            (new StringField('name', 'name')),\n            (new StringField('description', 'description')),\n            (new BoolField('active', 'active')),\n        ]);\n    }\n}\n```\n`created_at`/`updated_at` columns don't need explicit fields. Register the definition with the `shopware.entity.definition` service tag and an `entity` attribute matching the entity name: `$services->set(ExampleDefinition::class)->tag('shopware.entity.definition', ['entity' => 'swag_example']);`. Add a custom `Entity` class that extends `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity`, uses `EntityIdTrait`, and has one protected property plus a getter/setter per field, then wire it in via `getEntityClass()`. Add a custom `EntityCollection` that extends `EntityCollection` and overrides `getExpectedClass()`, then wire it in via `getCollectionClass()` \u2014 without these two, generic `ArrayEntity`/`EntityCollection` instances are used instead. Once registered this way, Shopware autogenerates a repository service under `<entity-name>.repository` for reading and writing the entity like any core entity. Two gotchas: entity class properties must be at least `protected` (never `readonly`) or the DAL cannot set values \u2014 this applies to any class extending the generic `Struct` class \u2014 and field `storageName` values are snake_case while `propertyName` values are lowerCamelCase.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md:1-72"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*custom*entit*\" -o -iname \"*add-*entity*\""}, {"tool": "Bash", "args": "grep -rl \"EntityDefinition\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/data-handling/"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-08": {"query": "In a plugin service, what is the Shopware 6 equivalent of Doctrine's `findBy()` \u2014 how do I read products with filters, associations and sorting?", "category": "dev", "option": "fs-wiki", "answer": "Shopware 6 uses no ORM, only a thin Data Abstraction Layer (DAL) \u2014 reads go through an injected entity repository (named `entity_name.repository`, e.g. `product.repository`, injected via `services.php` using `service('product.repository')`) combined with a `Criteria` object, rather than a Doctrine-style `findBy()`. A basic unfiltered read is `$this->productRepository->search(new Criteria(), $context)`, which returns an `EntitySearchResult` \u2014 always a collection, even for a single-ID search, so call `->first()` to get the entity; searching by ID(s) uses `new Criteria([$myId])`. To filter by field, use `$criteria->addFilter(new EqualsFilter('name', 'Example name'))` (`Shopware\\Core\\Framework\\DataAbstractionLayer\\Search\\Filter\\EqualsFilter`); filters can be combined with `OrFilter`, `AndFilter`, `NandFilter`, etc. `addPostFilter()` applies a filter to the result but not to aggregations, unlike `addFilter()`. To pull in related data, use associations: `$criteria->addAssociation('productReviews')`, chainable as `'productReviews.customer'`; filtering an association via `$criteria->getAssociation('productReviews')->addFilter(...)` does not restrict the parent entity, whereas adding a filter on `'productReviews.points'` directly on the main criteria (alongside `addAssociation()`) does restrict the parent entity. Mapping entities (many-to-many join tables, e.g. `ProductCategoryDefinition`) cannot be read with `search()` \u2014 use `searchIds()` instead, since they only have primary keys. Aggregations use `$criteria->addAggregation(new AvgAggregation('avg-rating', 'productReviews.points'))`, read back via `$products->getAggregations()->get('avg-rating')`. Paging and sorting use `setLimit()`, `setOffset()`, and `addSorting(new FieldSorting('createdAt', FieldSorting::ASCENDING))`. For large datasets, use `RepositoryIterator($this->productRepository, $context, $criteria)` and call `->fetch()` in a loop until it returns `null` \u2014 this issues a new database request per iteration (avoid it for small datasets) and requires a deterministic sort (e.g. always include `id` as a secondary sort) or entities can be skipped or duplicated across batches.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md:1-56"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*reading*\" -o -iname \"*criteria*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-09": {"query": "How do I make a field on my plugin's own entity translatable per language?", "category": "dev", "option": "fs-wiki", "answer": "Add translation support via a translation table, an `EntityTranslationDefinition`, a `TranslationEntity`, and by wiring the main entity's field to a `TranslatedField`. Steps: (1) Create a migration for a `<entity>_translation` table, named by appending `_translation` to the entity's table name (e.g. `swag_example_translation`). Required columns are `<entity>_id` (FK to the entity), `language_id` (FK to `language`), the translated column(s) (e.g. `name`), `created_at`, `updated_at`; the primary key is `(<entity>_id, language_id)`, and both foreign keys cascade on delete and update. (2) Create `ExampleTranslationDefinition extends Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityTranslationDefinition`, override `getParentDefinitionClass()` to return the parent entity's definition class, and define the translated column(s) with `StringField`. (3) Register both definitions in `services.php` with the `shopware.entity.definition` tag, registering the translation definition after the parent entity's definition \u2014 this ordering must be respected. (4) Create `ExampleTranslationEntity extends Shopware\\Core\\Framework\\DataAbstractionLayer\\TranslationEntity` with getters/setters for the translated field(s) and the association back to the parent entity, then override `getEntityClass()` on the definition to return it. (5) Create an `ExampleTranslationCollection extends EntityCollection`, the same way as for a normal entity. (6) On the main entity's definition, add a `TranslatedField('name')` and a `TranslationsAssociationField(ExampleTranslationDefinition::class, 'swag_example_id')`. When reading translated data, prefer `entity.translated.field` in storefront/sales-channel contexts, and `entity.field` in Admin/CRUD flows.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-translations.md:1-54"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*translat*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-translations.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-10": {"query": "How do I write an indexer that precomputes derived data for my custom entity on write, and how do I trigger a full reindex?", "category": "dev", "option": "fs-wiki", "answer": "Data indexers optimize recurring, complex calculations (e.g. a product's `cheapest_price`) by computing them once whenever the entity is written via the DAL, instead of on every read. Before writing a new one, check whether the target entity already has one to subscribe to instead (`CustomerIndexer`, `CategoryIndexer`, `LandingPageIndexer`, `ProductIndexer`, `ProductStreamIndexer`, `PromotionIndexer`, `RuleIndexer`, `MediaIndexer`, `MediaFolderIndexer`, `MediaFolderConfigurationIndexer`, `SalesChannelIndexer`, `BreadcrumpIndexer`) by hooking its dispatched event (e.g. `CustomerIndexerEvent`) via a `kernel.event_subscriber` and iterating `$event->getIds()`. To build a new one, create a class extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Indexing\\EntityIndexer` and register it tagged `shopware.entity_indexer`, implementing: `getName(): string` (a unique indexer name \u2014 `EntityIndexerRegistry` uses it to route messages, so it must be unique), `iterate($offset): ?EntityIndexingMessage` (drives a full reindex, using `IteratorFactory::createIterator($definition, $offset)` to page through IDs), `update(EntityWrittenContainerEvent $event): ?EntityIndexingMessage` (reacts to DAL writes, extracting changed primary keys via `$event->getPrimaryKeys(SomeDefinition::ENTITY_NAME)` \u2014 filter as much as possible here, e.g. only react to a changed firstname, to save performance), and `handle(EntityIndexingMessage $message): void` (does the actual work). By default messages from `update()` are handled synchronously; pass `$forceQueue = true` to `EntityIndexingMessage`'s fourth constructor argument to process them asynchronously over the message queue instead. To manipulate data with the DAL from inside `handle()` without re-triggering the indexer, disable indexing on the context with `$context->addState(EntityIndexerRegistry::DISABLE_INDEXING);` \u2014 writing data through the DAL inside `handle()` otherwise re-triggers `EntityWrittenContainerEvent`, which can cause the same indexer to run in an infinite loop, so either use the injected `Connection` directly or disable indexing this way. To trigger a full reindex, run `bin/console dal:refresh:index` (this calls `iterate()`), or trigger an Administration index rebuild.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-indexer.md:1-67"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*indexer*\" -o -iname \"*index*\" | grep -i -E \"add-indexer|custom-indexer|dal.*index\""}, {"tool": "Bash", "args": "grep -rli \"indexer\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-indexer.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-11": {"query": "On Shopware 6.7, which file do I declare my plugin's services in, and how do I get a core service passed into my service's constructor?", "category": "dev", "option": "fs-wiki", "answer": "In Shopware 6.7 plugins declare their services in `services.php` (not `services.xml`). If `autowire` and `autoconfigure` are already set in `services.php`, a core service like `SystemConfigService` is injected automatically into your service's constructor just by type-hinting it as a constructor parameter, e.g. `public function __construct(private SystemConfigService $systemConfigService) {}`. If the service was declared explicitly instead, you add the dependency as an argument using the `service()` function from `Symfony\\Component\\DependencyInjection\\Loader\\Configurator`, e.g. `$services->set(ExampleService::class)->args([service(SystemConfigService::class)]);`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md:1-58"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"services.xml\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Bash", "args": "grep -rli \"dependency injection\\|services.xml\\|add-plugin-dependencies\\|plugin-config\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins | head -30"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-12": {"query": "I am on Shopware 6.6 \u2014 which file do I declare my plugin's service dependencies in, and how do I pass another service into the constructor?", "category": "dev", "option": "fs-wiki", "answer": "In Shopware 6.6 you declare the dependency as a constructor argument in the plugin's `services.xml` (located at `<plugin root>/src/Resources/config/services.xml`), referencing the target service by its fully-qualified id, e.g. `<service id=\"Swag\\BasicExample\\Service\\ExampleService\"><argument type=\"service\" id=\"Shopware\\Core\\System\\SystemConfig\\SystemConfigService\"/><\/service>`. Then you add the injected service as a typed constructor parameter in the PHP class and store it on a property, e.g. `public function __construct(SystemConfigService $systemConfigService) { $this->systemConfigService = $systemConfigService; }`.", "citations": ["platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/dependency-injection.md:1-56"], "toolCallLog": [{"tool": "Bash", "args": "grep -rn \"dependency-injection|services.xml|services.php\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.6/index.md; find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.6 -iname \"*dependency-injection*\" -o -iname \"*services*\""}, {"tool": "Read", "args": "platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/dependency-injection.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-13": {"query": "There is no event for what I need to change in a core Shopware service \u2014 how do I decorate or replace that service from my plugin?", "category": "dev", "option": "fs-wiki", "answer": "Decoration is one of the two main ways (alongside events) to extend Shopware from a plugin, used when an existing service's own behavior needs to change rather than just reacting to something it already does. Decoratable Shopware services expose an abstract class as their contract (with a `getDecorated()` method) instead of a plain interface. Register both services and point the decorator at the original with `decorate()`, passing the original through `.inner`: `$services->set(ExampleService::class); $services->set(ExampleServiceDecorator::class)->decorate(ExampleService::class)->args([service('.inner')]);`. Define an abstract contract, e.g. `abstract class AbstractExampleService { abstract public function getDecorated(): AbstractExampleService; abstract public function doSomething(): string; }` \u2014 the base implementation's `getDecorated()` throws `Shopware\\Core\\Framework\\Plugin\\Exception\\DecorationPatternException`, while the decorator's `getDecorated()` returns the wrapped instance, and the decorator should delegate to it (e.g. `return $this->decoratedService->doSomething() . ' Did something additionally.';`). Decorators nest: if two plugins decorate the same service, the second wraps the first wraps core, so always call the inner service unless deliberately replacing it entirely, since a decorator that doesn't delegate silently breaks the chain with no runtime warning \u2014 inspect the chain via PHPStorm's Navigate -> Implementations or `bin/console debug:container --show-arguments <service-id>`. Always type-hint the abstract class, never the concrete implementation, in constructors, since type-hinting the concrete class removes the service from the decoration chain and bypasses other extensions.", "citations": ["platform/dev/6.7/guides/plugins/plugins/services/adjusting-service.md:1-75"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*adjusting-service*\" -o -iname \"*decorat*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/services/adjusting-service.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-14": {"query": "I wrote a subscriber class in my plugin but it never fires \u2014 which interface and which service tag (`shopware.event_subscriber`?) register it?", "category": "dev", "option": "fs-wiki", "answer": "Your subscriber class must implement Symfony's `EventSubscriberInterface` and be registered in the DI container tagged `kernel.event_subscriber` (not `shopware.event_subscriber`) \u2014 creating the class alone is not enough. Register it in `src/Resources/config/services.php`: `$services->set(MySubscriber::class)->tag('kernel.event_subscriber');`. If the class is missing from `services.php`, Shopware will not call it, and there may be no obvious error indicating the event was unhandled. The class itself implements `getSubscribedEvents()` returning a map of event constants to handler method names, e.g. `ProductEvents::PRODUCT_LOADED_EVENT => 'onProductsLoaded'`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/event/listening-to-events.md:1-64"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*listening*\" -o -iname \"*subscrib*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/event/listening-to-events.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-15": {"query": "How do I work out which event Shopware actually dispatches for a given action, for example after a product is loaded or a page is rendered?", "category": "dev", "option": "fs-wiki", "answer": "Shopware's wiki gives several techniques depending on the event category. DAL events are named `entity_name.event` (e.g. `product.written`, `product.deleted`), and entities often have a constants class such as `ProductEvents` (findable by searching for the term `@Event`); e.g. `ProductEvents::PRODUCT_LOADED_EVENT`. For general PHP events, read core code for `$this->eventDispatcher->dispatch($someEvent, $someEvent->getName())` calls, search for `extends NestedEvent`, `extends Event`, `implements ShopwareEvent`, or `->dispatch`, or check a service's constructor for an injected `EventDispatcherInterface`. Page loaded events: `GenericPageLoader` dispatches a `GenericPageLoadedEvent` on page load \u2014 search for `PageLoadedEvent`. Criteria-driven events (e.g. `ProductListingCriteriaEvent`) fire when specific default entities load via a `Criteria`, but are hand-written and not guaranteed for every entity \u2014 search for `CriteriaEvent`. Route events are fine-grained per-route aliases of Symfony kernel events, named `{route}.request`, `{route}.response`, `{route}.render` (Storefront, before Twig rendering), `{route}.encode` (Store-API, before JSON encoding, since 6.6.11.0), and `{route}.controller` (since 6.6.11.0), with `{route}` replaced by the Symfony route name, e.g. `store-api.product.listing.request`. Business events (customer registration, order placement, etc.) can be found by searching for `implements BusinessEventInterface` or `implements MailActionInterface`. Finally, opening the Symfony profiler's 'Events' tab shows every event actually fired during the current request, with names \u2014 a direct, empirical way to confirm what fired for a given action.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/event/finding-events.md:1-67"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"debug:event-dispatcher|how to find.*event|which event\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/event/finding-events.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-16": {"query": "How do I run plugin logic whenever an order is written, and find out exactly which fields changed?", "category": "dev", "option": "fs-wiki", "answer": "Implement `Symfony\\Component\\EventDispatcher\\EventSubscriberInterface` and subscribe to `Shopware\\Core\\Checkout\\Order\\OrderEvents::ORDER_WRITTEN_EVENT`, checking `$event->getContext()->getVersionId() !== Defaults::LIVE_VERSION` to only react to the live version (editing an order in the admin creates a new draft version merged later, which is usually not the state you want to react to). A changeset of exactly what changed is not generated by default for performance reasons, so to force one you must also subscribe to `PreWriteValidationEvent::class`, and inside that listener, for each of `$event->getCommands()` that is `instanceof ChangeSetAware` and whose `getEntityName() === OrderDefinition::ENTITY_NAME`, call `$command->requestChangeSet()`. The changeset can then be read in the `ORDER_WRITTEN_EVENT` handler via `$result->getChangeSet()` on each item of `$event->getWriteResults()`. Note an 'insert' command cannot generate a changeset since nothing changed yet, and changeset generation should always be narrowed to the specific entity and live version needed, since it affects performance.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/order/listen-to-order-changes.md:1-53"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"EntityWrittenEvent|getPayload|writeResult|order.written\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides | head -20"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/order/listen-to-order-changes.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-17": {"query": "How do I overwrite the price of a product line item in the cart at runtime from a plugin?", "category": "dev", "option": "fs-wiki", "answer": "Use one class that acts as both a cart collector and a cart processor. This is only for changing a line item's price itself (e.g. a live-shopping plugin) \u2014 discounts or surcharges should be modeled as separate line items instead, not with this approach. First implement `Shopware\\Core\\Checkout\\Cart\\CartDataCollectorInterface::collect` to fetch product IDs from the cart (`$original->getLineItems()->filterType(LineItem::PRODUCT_LINE_ITEM_TYPE)->getReferenceIds()`), skip IDs already fetched, and store each new price in `CartDataCollection` under a prefixed key (e.g. `'price-overwrite-'.$id`) to avoid duplicate lookups and key collisions with other collectors. Then implement `Shopware\\Core\\Checkout\\Cart\\CartProcessorInterface::process` on the same class: for each product line item in `$toCalculate`, read the stored price from `CartDataCollection`, build a `QuantityPriceDefinition` from the new price plus the item's existing tax rules and quantity, calculate it via an injected `QuantityPriceCalculator`, then call `$product->setPrice($calculated)` and `$product->setPriceDefinition($definition)`. Register the combined class under both tags, ordered after the product collector/processor: `$services->set(OverwritePriceCollector::class)->args([service(QuantityPriceCalculator::class)])->tag('shopware.cart.processor', ['priority' => 4500])->tag('shopware.cart.collector', ['priority' => 4500]);`. Always compute prices in the collector, not the processor \u2014 querying data (e.g. the database) inside `process` is explicitly discouraged since it may run repeatedly \u2014 and always mutate `$toCalculate` in `process`, not `$original`, since `$toCalculate` is the instance actually used.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md:1-49"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"line item.*price|CartProcessor|overwrite.*price|setPrice\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/checkout"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-18": {"query": "My plugin's cart processor adds a surcharge line item, but it is added again on every recalculation and its price is stale after the customer changes the quantity \u2014 how do I split the work between the collector and the processor?", "category": "dev", "option": "fs-wiki", "answer": "The wiki's cart collector/processor guide describes exactly this split: a collector implements `Shopware\\Core\\Checkout\\Cart\\CartDataCollectorInterface::collect`, which receives `CartDataCollection $data, Cart $original, SalesChannelContext $context, CartBehavior $behavior`, and is meant only to retrieve additional data (e.g. querying the database or an API), saved via `$data->set('uniqueKey', $newData)`; a processor implements `Shopware\\Core\\Checkout\\Cart\\CartProcessorInterface::process`, which additionally receives `Cart $toCalculate`, and is meant to actually apply changes to the cart (e.g. adding the surcharge line item) using the data the collector fetched \u2014 all changes must be made on `$toCalculate`, since that is the cart instance actually considered in the end, not `$original`. Critically, do not query data inside `process`, since it may run many times; always fetch data in `collect` instead \u2014 the wiki calls this out as a gotcha. Because the price/quantity-dependent calculation (e.g. via `PercentagePriceCalculator` or `QuantityPriceCalculator`) is done inside `process()` against the current `$toCalculate` cart on every recalculation, the surcharge is recomputed fresh each time the cart is recalculated (so it reflects the current quantity) rather than being stored once; the cart discounts example registers the processor tagged `shopware.cart.processor` with priority `4500` so it runs after the core product processor, and marks the discount line item as not stackable and not removable via `setStackable(false)`/`setRemovable(false)` so it isn't accidentally duplicated by the customer.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md:1-45", "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-discounts.md:1-55"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-discounts.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-19": {"query": "I need to move long-running work in my plugin out of the request into the message queue \u2014 what does the handler class look like and how is it registered?", "category": "dev", "option": "fs-wiki", "answer": "Create a new class (e.g. `SmsHandler`) placed at `<plugin root>/src/MessageQueue/Handler/SmsHandler.php`, mark it with the PHP attribute `#[AsMessageHandler]`, and implement `__invoke(SmsNotification $message)` to process the dispatched message \u2014 the class whose code runs once a matching message is dispatched by the `handle_messages` middleware. Multiple handlers can be defined for the same message. Handlers marked this way are automatically tagged with the service tag `messenger.message_handler` \u2014 no manual service registration/tagging is needed beyond the attribute. This assumes a message class already exists to be dispatched (covered by a separate 'Adding a message to queue' guide), and further DI-container registration follows the general dependency-injection guide. Optionally, custom middleware can be added to the bus, or the queue configured further via the message-queue hosting guide.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-handler.md:1-47"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-handler.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-20": {"query": "How do I add my own condition to the Rule Builder from a plugin so shop owners can select it?", "category": "dev", "option": "fs-wiki", "answer": "Create a rule class in `<plugin root>/src/Core/Rule` that extends `Shopware\\Core\\Framework\\Rule\\Rule`, implementing `getName()` (a unique technical name), `match(RuleScope $scope): bool`, and `getConstraints(): array` (field => constraints); rule variables must be declared `protected`, not `private`, or they will not work correctly. Register the class in `services.php` tagged `shopware.rule.definition`. Optionally add `getConfig(): RuleConfig` returning e.g. `(new RuleConfig())->booleanField('isFirstMondayOfTheMonth')` to skip building a custom Administration component \u2014 Shopware then renders the generic `sw-condition-generic` component for it. To show the rule in the Administration UI, decorate `ruleConditionDataProviderService` (the `RuleConditionService`) and call `addCondition()`, naming the condition to match `getName()`, and pointing it at a component (e.g. `swag-first-monday`) with a `label`, `scopes`, and optional `group` (create groups with `upsertGroup()`); load this decorator from a `main.js` entry point under `<plugin root>/src/Resources/app/administration/src/`. Build the component by extending `sw-condition-base` and overriding the `sw_condition_value_content` Twig block with the input control (e.g. `sw-single-select`). For context awareness (available since 6.5.0.0), read possible relations from `Shopware\\Core\\Content\\Rule\\RuleDefinition`, then call `ruleConditionService.getAwarenessConfigurationByAssignmentName()` and `addAwarenessConfiguration()` with `notEquals`/`equalsAny`/`snippet` to restrict where a rule containing the condition can be assigned, using the `sw-select-rule-create` component with a matching `rule-aware-group-key` prop wherever rules are selected. Never run database queries or other time-consuming operations inside `match()`, since it directly impacts store performance, and note that a newly added condition may not be selectable everywhere in the Administration (e.g. inside the promotion module) unless awareness configuration is set up explicitly.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/rule/add-custom-rules.md:1-66"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"rule builder|custom rule|RuleScope|AbstractRule\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/rule/add-custom-rules.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-21": {"query": "My plugin dispatches its own domain event \u2014 how do I make it show up as a trigger in the Flow Builder?", "category": "dev", "option": "fs-wiki", "answer": "Implement an Aware interface on the event class (e.g. `Shopware\\Core\\Framework\\Event\\CustomerAware` plus `FlowEventAware`), such as an `ExampleEvent` with a `getCustomerId()` method. Since Shopware 6.5.0.0, event data for Flow Builder is stored in a `StorableFlow` rather than read via the deprecated `getAvailableData()`; each Aware interface has a matching `FlowStorer` that copies data into the store (e.g. `CustomerAware` \u2192 `CustomerStorer`, `MailAware` \u2192 `MailStorer`, `OrderAware` \u2192 `OrderStorer`, `UserAware` \u2192 `UserStorer`). If the data has no existing Aware interface, define a new Aware interface plus a `FlowStorer` subclass implementing `store()` and `restore()`. Flow actions then read the stored data via `$flow->getStore($key)` and `$flow->getData($key)`. Finally, register the event as a trigger with a subscriber on `BusinessEventCollectorEvent::NAME` that calls `$businessEventCollector->define(ExampleEvent::class)` and adds it to the collection, using a high priority (e.g. 1000) so it registers before other trigger subscribers. This functionality is available starting with Shopware 6.4.6.0, with the StorableFlow/FlowStorer model replacing getAvailableData() from 6.5.0.0 onward.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md:20-68"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rln -i \"flow builder\\|flow trigger\\|custom trigger\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-22": {"query": "How do I give my plugin a settings page the shop operator can fill in, and what field types are available?", "category": "dev", "option": "fs-wiki", "answer": "Create `src/Resources/config/config.xml` in the plugin, which is rendered dynamically in the Administration's Extensions section without needing a custom Administration module. The file needs at least one `<card>` with a `<title>` and at least one `<input-field>`, each with a unique `<name>` (at least 4 characters, matching `[a-zA-Z][a-zA-Z0-9]*`). Card `<title>`, `<label>`, `<placeholder>`, and `<helpText>` support translation via the `lang` attribute (default `en-GB`). Field `type` defaults to `text`; supported types are: `text`, `textarea`, `text-editor`, `url`, `password`, `int`, `float`, `bool`, `checkbox`, `datetime`, `date`, `time`, `colorpicker`, `single-select`, `multi-select`. Common settings include `label`/`placeholder`/`helpText`, `defaultValue`, `disabled`, `required`, `copyable` (text-like fields), `minLength`/`maxLength` (text/url/password), `min`/`max` (int/float), and `<options>` with `<option><id>`/`<name>` pairs for single/multi-select. A field can be marked `cache-relevant=\"true\"` if its value affects cached Storefront output (available since 6.7.12.0, and required from 6.8.0.0 onward since system config writes no longer invalidate caches by default). For advanced UI, `<component name=\"componentName\">` can embed one of the supported Administration components directly: `sw-entity-single-select`, `sw-entity-multi-id-select`, `sw-media-field`, `sw-text-editor`, `sw-snippet-field` (the latter edits snippet translations rather than a config value, available since 6.3.4.0). After adding fields, values can be configured under Extensions \u2192 My extensions \u2192 Plugins \u2192 Configure in the Administration.", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md:18-81"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"plugin config\\|system config\\|config.xml\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-23": {"query": "How do I ship a mail template with my plugin so it is installed automatically, including a custom mail template type?", "category": "dev", "option": "fs-wiki", "answer": "Ship a mail template via a plugin database migration (a `Shopware\\Core\\Framework\\Migration\\MigrationStep` subclass) instead of creating it through the Administration. To reuse an existing mail template type, first look up its id (e.g. `SELECT id FROM mail_template_type WHERE technical_name = \"contact_form\"`), then insert into `mail_template` (columns `id`, `mail_template_type_id`, `system_default` which must be `0`, `created_at`) and into `mail_template_translation` per supported language (columns `mail_template_id`, `language_id`, `sender_name`, `subject`, `description`, `content_html`, `content_plain`, `created_at`), resolving each `language_id` via the `language`/`locale` tables. Use `INSERT IGNORE INTO` so re-running the migration on reinstall does not throw. To define a brand-new custom mail template type, first insert into `mail_template_type` (columns `id`, `technical_name`, `available_entities` \u2014 a JSON map like `{\"product\": \"product\"}`, `created_at`) and `mail_template_type_translation` (columns `mail_template_type_id`, `language_id`, `name`, `created_at`) before creating the template entry itself. Mail templates should not be removed on plugin uninstall since other entities may still reference them, which would cause data inconsistency.", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/mail/add-mail-template.md:17-47"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"mail template\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/content/mail/add-mail-template.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-24": {"query": "How do I get readable SEO URLs generated for the detail pages of my plugin's own entity?", "category": "dev", "option": "fs-wiki", "answer": "For a custom DAL entity's detail pages, implement `Shopware\\Core\\Content\\Seo\\SeoUrlRoute\\SeoUrlRouteInterface` with three methods: `getConfig()` (returns a `SeoUrlRouteConfig` with the entity definition, route name, and template), `prepareCriteria()` (narrows/extends the fetch criteria), and `getMapping()` (returns a `SeoUrlMapping` with the template variables \u2014 it must verify the entity type it receives since the interface can be invoked for entities other than your own). Register the route class with the container tag `shopware.seo_url.route`. Add a `seo_url_template` table entry via a plugin migration, setting `route_name`, `entity_name`, and `template`. Then subscribe to the entity's `written` DAL event and call `Shopware\\Core\\Content\\Seo\\SeoUrlUpdater::update($routeName, $ids)` to generate the URLs, doing the same on the `.deleted` event. A German SEO URL is only reachable if a German domain is configured on the respective sales channel. (For a fixed route that rarely changes, static SEO URLs can instead be seeded directly via a migration into the `seo_url` table using `ImportTranslationsTrait::importTranslation()`, but for entity detail pages that change per record, the dynamic `SeoUrlRoute` approach above is the relevant one.)", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/seo/add-custom-seo-url.md:19-73"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"seo url\\|url generator\\|SeoUrlRoute\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/content/seo/add-custom-seo-url.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-25": {"query": "How do I add a `bin/console` command to my plugin for a maintenance task?", "category": "dev", "option": "fs-wiki", "answer": "Follow the standard Symfony Console approach: create a command class (e.g. `Swag\\BasicExample\\Command\\ExampleCommand extends Command`) with the `#[AsCommand(name: 'swag:example', description: 'Example command')]` attribute and an `execute(InputInterface $input, OutputInterface $output): int` method that returns `Command::SUCCESS`. Then register it as a service in `src/Resources/config/services.php` tagged `console.command`, e.g. `$services->set(Swag\\BasicExample\\Command\\ExampleCommand::class)->tag('console.command');`. Commands registered this way are automatically available via `bin/console`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md:17-55"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"console command\\|bin/console\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*command*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-26": {"query": "How do I add a custom document type such as a pro-forma invoice in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "In Shopware 6.7 there are two document systems. The legacy document system (still the default in 6.7, deprecated and to be removed in 6.9) requires: (1) a plugin migration inserting a row into `document_type` with a `technical_name`, translations into `document_type_translation` via `ImportTranslationsTrait`/`Translations`, and a default config into `document_base_config` plus `document_base_config_sales_channel`; (2) a renderer implementing `Shopware\\Core\\Checkout\\Document\\Renderer\\AbstractDocumentRenderer` with `getDecorated()`, `supports(): string` (returning the technical name) and `render(array $operations, Context $context, DocumentRendererConfig $rendererConfig): RendererResult`, registered with the service tag `document.renderer`, using `DocumentFileRendererRegistry` to render the PDF/HTML content; (3) a Twig template at `src/Resources/views/documents/<name>.html.twig` extending `@Framework/documents/base.html.twig` via `{% sw_extends %}`; and (4) a number range added via migration (`number_range_type`, `number_range`, `number_range_sales_channel`, plus their translation tables). Every document type needs a matching renderer or it shows up in the Administration but doesn't work, and needs a number range or no document number can be generated. Alternatively, the experimental Document System (v2), gated behind the `DOCUMENT_GENERATION_REWORK` feature flag and intended to become default in 6.8, uses: a type class extending `AbstractDocumentType` (`getTechnicalName()`, `getSupportedFormats()`), a render-data DTO extending `AbstractRenderData`, a data provider extending `AbstractDocumentDataProvider` (`getKey()`, `supports()`, `enrichOrderCriteria()`, `provideRenderingData()`), both registered with tags `shopware.document_v2.type` and `shopware.document_v2.provider`, plus a Twig template at `@Framework/documents/<technical_name>.html.twig` extending `@Framework/documents/base.html.twig` \u2014 the `document_type` row and number range still need to be created via a plugin migration reusing the legacy pattern.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/documents/legacy/add-custom-document-type.md:18-55", "platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md:14-52"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"document type\\|pro-forma\\|proforma\\|custom document\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/documents/legacy/add-custom-document-type.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-27": {"query": "In Shopware 6.7, how do I extend a Storefront Twig template from my plugin with `{% extends %}` so I keep the core markup and other plugins' changes?", "category": "dev", "option": "fs-wiki", "answer": "Shopware Storefront templates are not overridden with plain Twig `{% extends %}` but with the custom `{% sw_extends %}` tag, which supports multi-inheritance so the core markup and other plugins' overrides are all preserved. Shopware looks for plugin templates under `<plugin root>/src/Resources/views` by default. To override a core template, recreate the identical path under the plugin's views directory (e.g. the core `storefront/layout/header/logo.html.twig` becomes `<plugin root>/src/Resources/views/storefront/layout/header/logo.html.twig`), then in that file use `{% sw_extends '@Storefront/storefront/layout/header/logo.html.twig' %}` followed by a `{% block %}` override of the desired block, e.g. `{% block layout_header_logo_link %} ... {% endblock %}`. Use `{{ parent() }}` inside the override to append to, rather than replace, the original block content. After changes, clear the cache with `./bin/console cache:clear`, and ensure the plugin is active and its theme (if any) is assigned to the sales channel. To discover available Twig variables on a page, call `{{ dump() }}` inside the template. Since Shopware 6.7.11.0, a Storefront Components system is also available for building reusable, atomic template components.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-templates.md:19-56"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"sw_extends|extends.*twig|override.*template\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-templates.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-28": {"query": "How do I override an existing Storefront JavaScript plugin, such as the cookie permission bar, from my own plugin instead of registering a new one?", "category": "dev", "option": "fs-wiki", "answer": "Extend the original plugin's vanilla JS class directly if it can be imported, e.g. `import CookiePermissionPlugin from 'src/plugin/cookie/cookie-permission.plugin'; export default class MyCookiePermission extends CookiePermissionPlugin {}`. If the class isn't importable (e.g. a third-party plugin without an alias), retrieve it via `PluginManager`: `const Plugin = window.PluginManager.getPlugin('CookiePermission'); const PluginClass = Plugin.get('class');`. Override the methods you need \u2014 e.g. `init()` (calling `super.init()` afterward) and `_hideCookieBar()` (calling `super._hideCookieBar()` conditionally) for the CookiePermission example. Then, in `main.js`, register the override using `PluginManager.override()` instead of `PluginManager.register()`: `PluginManager.override('CookiePermission', MyCookiePermission, '[data-cookie-permission]');`. If the original plugin is registered asynchronously, the override's import must also be a dynamic import: `PluginManager.override('CookiePermission', () => import('./my-cookie-permission/my-cookie-permission.plugin'), '[data-cookie-permission]');`. Each JavaScript plugin can only be overridden once \u2014 if two Shopware plugins override the same plugin, only the last override actually takes effect.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md:17-84"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"override.*plugin|extend.*plugin.*javascript|CookiePermission|extend.*js plugin|PluginManager.override|override.*js\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-29": {"query": "How do I add my own data to an existing Storefront page or pagelet from a plugin without overriding the core controller?", "category": "dev", "option": "fs-wiki", "answer": "Identify the page/pagelet to extend (e.g. `FooterPagelet`), then subscribe to its `...LoadedEvent` (e.g. `FooterPageletLoadedEvent`) in an `EventSubscriberInterface` implementation registered with the tag `kernel.event_subscriber`. If an existing Store API route would return more data than needed, add a new, narrower Store API route for the missing data (the wiki's example uses `EntityRepository::aggregate()` with `CountAggregation` and an `EqualsFilter` rather than `search()`, since only an aggregate count is needed) \u2014 do not call the DAL directly from a page/pagelet subscriber. In the subscriber, call the route and attach the result to the page/pagelet via `$event->getPagelet()->addExtension('product_count', $response->getProductCount())` (or the equivalent `getPage()` call for a page). In the Twig template, the added data is then available under `extensions`, e.g. `{% if footer.extensions.product_count %}{{ footer.extensions.product_count.count }}{% endif %}`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md:19-71"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"sw_extends|extends.*twig|override.*template\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront (from earlier dev-27 search, which also surfaced this file)"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-30": {"query": "How do I add a custom filter to the Storefront product listing from my plugin, both the criteria side and the filter panel?", "category": "dev", "option": "fs-wiki", "answer": "On the criteria side, subscribe to `\\Shopware\\Core\\Content\\Product\\Events\\ProductListingCollectFilterEvent` and add a `Filter` instance to `$event->getFilters()`, constructed from: `name` (unique filter name), `filtered` (whether the filter is currently active, typically read from the request), `aggregations` (the aggregations behind the filter, e.g. a `FilterAggregation` wrapping a `MaxAggregation`), `filter` (the DAL filter added to the criteria, e.g. `EqualsFilter`), and `values` (values added as `currentFilter` to the result). Example: `new Filter('isCloseout', (bool)$event->getRequest()->get('isCloseout'), [new FilterAggregation('active-filter', new MaxAggregation('active', 'product.isCloseout'), [new EqualsFilter('product.isCloseout', true)])], new EqualsFilter('product.isCloseout', true), $filtered)`. On the UI side, extend `src/Storefront/Resources/views/storefront/component/listing/filter-panel.html.twig`, overriding the `component_filter_panel_items` block (available since Shopware 6.4.8.0), calling `{{ parent() }}` first and then including one of the filter components via `sw_include`, e.g. `filter-boolean.html.twig` with `name` and `displayName` parameters. Other available filter components are `filter-multi-select`, `filter-property-select`, `filter-range`, and `filter-rating-select`. To position the new filter relative to a specific existing one, extend that filter's own block instead (e.g. `component_filter_panel_item_price`).", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/howto/add-listing-filters.md:16-74"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"listing.*filter|custom filter|product listing\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/howto/add-listing-filters.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-31": {"query": "How do I expose a plugin configuration value, such as a colour picked in the Administration, as an SCSS variable in my Storefront styling?", "category": "dev", "option": "fs-wiki", "answer": "Use an event subscriber on ThemeCompilerEnrichScssVariablesEvent (registered as a kernel.event_subscriber tagged service) instead of declaring the variable statically in config.xml. First provide a fallback default in the plugin's base.scss, e.g. `$sass-plugin-header-bg-color: #ffcc00 !default;`. In the subscriber's handler for ThemeCompilerEnrichScssVariablesEvent, inject SystemConfigService and read the plugin config value per sales channel with `$this->systemConfig->get('SwagBasicExample.config.sassPluginHeaderBgColor', $event->getSalesChannelId())`, then call `$event->addVariable('sass-plugin-header-bg-color', $value)` \u2014 addVariable's $name is used verbatim in SCSS (leading $ added automatically, kebab-case recommended) and an optional $sanitize argument strips special characters and quotes the value. To expose every config field at once, loop over `$this->systemConfig->get('SwagBasicExample.config', $event->getSalesChannelId())` and convert each key to kebab-case with CamelCaseToSnakeCaseNameConverter before calling addVariable(). Note that plugins are not sales-channel specific by default, so SCSS variables added directly (not sourced from config) compile globally across all themes/sales channels; use the plugin-config approach when per-sales-channel values are needed.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md:18-63"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"scss variable\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-32": {"query": "How do I define a custom field set for products from my plugin so merchants can edit the values in the Administration?", "category": "dev", "option": "fs-wiki", "answer": "Shopware's custom field system extends an entity (e.g. product) without a full entity extension, storing additional scalar data in a JSON custom_fields column; custom fields can only hold scalar values, not associations. The recommended, simplest approach (available since Shopware 6.7.13.0) is declarative: ship a Resources/config/custom-fields.xml file in the plugin (same XML format apps use in their manifest) \u2014 Shopware syncs the defined custom field sets on plugin install/update and removes them (without deleting stored user data) on uninstall, with no CustomFieldsInstaller service needed. Alternatively, to create sets dynamically at runtime, use the imperative custom_field_set.repository service, e.g. `$this->customFieldSetRepository->create([['name' => 'swag_example_set', 'global' => true, 'config' => ['label' => [...]], 'customFields' => [['name' => 'swag_example_size', 'type' => CustomFieldTypes::INT, 'includeInSearch' => true, 'config' => ['label' => [...], 'customFieldPosition' => 1]]]]], $context);`. Custom field names should carry a vendor prefix (e.g. swag) to stay globally unique for both the set and each field. Setting the set's `global` property to false makes it deletable/editable by merchants in the Administration; by default custom fields are not searchable \u2014 set `includeInSearch` to true (requires 6.7.6.0+, plus a search index rebuild if enabled later) if products should be filterable/searchable by that field. Sets can be deleted via `$this->customFieldSetRepository->delete([['id' => $setId]], $context)`, followed by cleanup of stored values from entities' customFields JSON.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/custom-field/add-custom-field.md:19-90"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"custom field\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/custom-field/add-custom-field.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-33": {"query": "How do I register a custom Administration module from my plugin, and what has to line up for it to actually show up after a build?", "category": "dev", "option": "fs-wiki", "answer": "Create `<plugin root>/src/Resources/app/administration/src/module/<module-name>/index.js` and import it from `main.js` (e.g. `import './module/swag-example';`). Inside index.js, register the module with `Shopware.Module.register('swag-example', { type: 'plugin', name: 'Example', title: 'swag-example.general.mainMenuItemGeneral', description: '...', color: '#ff3d58', icon: 'regular-shopping-bag', ... })`, configuring `color`, `icon`, `title`, `description`, a unique `name`, and `type` (`plugin` for third-party modules; `core` is reserved for core code, though `type` itself is only a convention, not enforced). Add `routes` and a menu entry, and add translation `snippets` per locale (e.g. de-DE.json/en-GB.json, typically under a `snippet/` directory), keyed under the module name, e.g. `{\"swag-example\": {\"general\": {\"mainMenuItemGeneral\": \"My custom module\", ...}}}`. Optionally link the module into Settings via the `settingsItem` array (`group`: shop/system/plugins, `icon`, `to` \u2014 the route name). Finally build the Administration JS with `shopware-cli project admin-build` (or `composer run build:js:admin` for the platform contribution setup). For the module to actually show up: the plugin must be activated for the build to apply, the built file must ship with the plugin, an `index.js` file is required for every module (Shopware 6 automatically requires it), and the module still depends on its entry-point import, registration, routes/components, and snippets all being correctly wired up at runtime \u2014 the Administration build only compiles the assets, it does not fix missing wiring.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/add-custom-module.md:19-77"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration -maxdepth 2 -iname \"*module*\""}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/add-custom-module.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-modules.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-34": {"query": "How do I extend an existing Administration component and its Twig blocks from my plugin, for example to change the dashboard headline?", "category": "dev", "option": "fs-wiki", "answer": "Use the Options API component factory: `Shopware.Component.override('sw-dashboard-index', { template })` replaces the previous behavior of an existing component in place (e.g. overriding sw-dashboard-index's template to change the headline), while `Shopware.Component.extend('new-name', 'sw-dashboard-index', { template })` creates a brand-new component based on an existing one. In either case, import your Twig override file (e.g. `import template from './sw-dashboard-index.html.twig'`) and pass it as `template`. In the override .html.twig file, target the specific Twig `{% block %}` used by the original template (e.g. `card_header` or similar) and either replace its contents entirely or call `{% parent %}` first to keep the inherited markup and append/change around it, for example: `{% block card_header %}<h1 class=\"custom-header\">{{ header }}<\/h1>{% endblock %}`. To extend a method or computed property while keeping the original logic, call `this.$super('methodName')` inside the override/extend config. Register the override/extend file by importing it from the plugin's `main.js`. Note: there is also an experimental Composition API extension system (`Shopware.Component.createExtendableSetup` / `Shopware.Component.overrideComponentSetup()`), but it only supports overriding (not extending) and only for components already written with the Composition API; Options API components should keep using override()/extend(). When multiple plugins override the same component, they apply in registration order.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-components.md:18-69"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration -iname \"*extend*\" -o -iname \"*customizing-component*\" -o -iname \"*block*\""}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-components.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-35": {"query": "How do I load entities from the Admin API inside an Administration component using the repository factory and a Criteria?", "category": "dev", "option": "fs-wiki", "answer": "Inject the repositoryFactory service into the component (`inject: ['repositoryFactory']`), then create a repository for the entity you need, e.g. `this.repositoryFactory.create('product')` (a third parameter accepts `{ version: 1 }`). Build a Criteria object for filtering, sorting, pagination and aggregation: `criteria.setPage(1); criteria.setLimit(10); criteria.setTerm('foo'); criteria.setTotalCountMode(2); criteria.addFilter(Criteria.equals('product.active', true)); criteria.addSorting(Criteria.sort('product.name', 'DESC')); criteria.addAggregation(Criteria.avg('average_price', 'product.price'));` \u2014 `setTotalCountMode` accepts 0 (no total count, fastest), 1 (exact total count), or 2 (limit*5+1, fast 'next page exists' estimate). Then call `productRepository.search(criteria, Shopware.Context.api)` to fetch a collection matching the Criteria, or `productRepository.get(entityId, Shopware.Context.api)` to fetch a single entity by id. To also pull related data, add associations to the Criteria before searching, e.g. `criteria.addAssociation('manufacturer')`. Writes use the same repository: `productRepository.save(entity, Shopware.Context.api)` (only changed properties are sent; saves are never automatic) and `productRepository.delete(id, Shopware.Context.api)` (bulk via `syncDeleted` with an array of ids). Entities are stateless, so after a save, related data must be re-fetched from the server if it's needed again; for
