"dev-70": {"query": "How do I implement a payment method in an app with `pay-url` and `finalize-url`, and what must the app server return in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Define the payment method in the app manifest; whether `finalize-url` is present distinguishes an asynchronous payment from a synchronous one, and omitting `pay-url` leaves the transaction open with no app communication (the app server must be reachable from Shopware, e.g. via a tunneling service during development). For a synchronous method (only `pay-url` set), Shopware calls `pay-url` and expects a JSON response with a `status` field (and optional `message` on failure). For an asynchronous method, Shopware POSTs to `pay-url` with `order`, `orderTransaction`, and a `returnUrl`; the app must respond with a `redirectUrl`; after the payment provider redirects the customer back, Shopware POSTs to `finalize-url` with `orderTransaction` and the provider's query parameters, and the app again responds with `status`/optional `message`. The response envelope for pay/finalize/validate is `{\"status\": \"authorize\", \"message\": \"optional failure reason\"}` (fields vary by stage). Valid payment states include `open`, `paid`, `cancelled`, `refunded`, `failed`, `authorize`, `unconfirmed`, `in_progress`, `reminded`, `chargeback`. On the App PHP SDK, resolve the shop, assemble the stage-specific context, and sign the response, e.g. `$signer->signResponse(PaymentResponse::paid(), $shop)`; the Symfony Bundle instead type-hints action classes like `PaymentPayAction`/`PaymentFinalizeAction` as controller arguments and returns the `PaymentResponse` directly. Do not change a payment method's manifest identifier after release, or Shopware creates a new payment method instead of reusing it; and from 6.7.0.0 onward, the app server must respond with a payment state whenever it intends to change the transaction state.", "citations": ["platform/dev/6.7/guides/plugins/apps/checkout/payment.md:17-66"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln 'pay-url|finalize-url|payment-methods' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/apps -il"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/apps/checkout/payment.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-71": {"query": "How does an app define its own custom entities in Shopware 6.7 and read them back through the API?", "category": "dev", "option": "fs-wiki", "answer": "An app defines custom entities by registering them in its `Resources/entities.xml` file (validated against the `entity-1.0.xsd` schema), where each `<entity name=\"...\">` element declares fields (e.g. `string`, `price`, `many-to-many`) and can mark fields `store-api-aware=\"true\"` to expose them via the Store API. Registered entities automatically get a repository reachable from App scripts via `services.repository.search('custom_entity_bundle', criteria)`, and via the Admin API at `POST /api/search/custom-entity-bundle` (entity name dashes replace underscores in the API route). To let a custom field reference a custom entity, add `custom-fields-aware=\"true\"` and `label-property=\"name\"` to the entity element. Since Shopware 6.4.15.0, entity names may use the `ce_` shorthand prefix (e.g. `ce_bundle`) to avoid database name-length restrictions, and that prefix must be used consistently in repository and API calls (e.g. `POST /api/search/ce_blog`). Custom entities with custom-field support require Shopware 6.5.1.0+, cannot be renamed once created (renaming deletes existing data), and associations referencing core tables still require corresponding manifest permissions.", "citations": ["platform/dev/6.7/guides/plugins/apps/custom-data/custom-entities.md:19-55"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"custom entit\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/apps/custom-data/custom-entities.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-01": {"query": "How do I create a product with variants and configure its visibility per sales channel, and why might it not show up in the storefront?", "category": "func", "option": "fs-wiki", "answer": "In Catalogues > Products, first save the product with the required fields (Title, Product number, Tax rate, Price gross/net, Stock) \u2014 only after that first save do the other tabs (Specifications, Extended Prices, Variants, Layout, SEO, Cross-Selling) appear. On the Variants tab, use the Variant Generator to pick properties/options, define price surcharges, optionally exclude specific combinations under Value exclusion, then click Generate variants; the product-list display mode can be set to show a Single main variant or to Fan out properties in the product list. Separately, sales channels are the unit that exposes a catalog to an audience (storefront domain, headless client, or feed): the key table `product_visibility` holds per-channel visibility and is required for a product to appear in that channel, alongside the channel's own audience defaults (language, currency, country, tax mode, customer group) and navigation-root category. A product can fail to show up in the storefront for reasons including: it isn't assigned/visible for that specific sales channel (no `product_visibility` entry), the product or its parent variant is inactive, it isn't placed under the sales channel's configured navigation-root category, or (for combining root-domain and sub-path channels) session/cookie isolation issues between channels sharing a root domain \u2014 subdomains are recommended instead. It could also be that stock/availability, pricing per sales channel, or currency/language assignment for that channel is missing.", "citations": ["platform/func/catalogues/products.md:20-41", "platform/dev/6.7/concepts/commerce/catalog/sales-channels.md:14-43"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"variant\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/catalogues -iname \"*variant*\""}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/catalogues/products.md"}, {"tool": "Bash", "args": "grep -rli \"not visible|not showing|not display|storefront\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/catalogues .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/tutorials-and-faq"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/catalogues/product-overview.md"}, {"tool": "Bash", "args": "grep -i \"product\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/hubs/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/hubs/sales-channel.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/concepts/commerce/catalog/sales-channels.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-02": {"query": "How do Rule Builder conditions work for shipping and payment methods?", "category": "func", "option": "fs-wiki", "answer": "The Rule Builder (Settings > Automation > Rule Builder) lets merchants build reusable rules from combinations of conditions and operators, which are then used to control availability of payment and shipping methods (among other things like promotions, prices, flows, and visibility). A rule consists of General information (Name, Description, Priority \u2014 higher runs sooner, Type, Tags) plus one or more Conditions; conditions are combined with AND (all must match) or OR (any must match), and switching between AND/OR automatically creates subconditions. The condition catalog spans General (e.g. Sales Channel, Currency, Date range, Day of the week, Time range), Orders, Flow Builder, Customers, Marketing & Promotions, Items in shopping cart, and Shopping cart groups, with operators such as Is equal to, Is one of, Is greater than, etc.; some conditions accept an optional narrowing filter. For shipping methods specifically, under Settings > Commerce > Shipping each method has an Availability rule field that uses a Rule Builder rule to determine when the method can be selected at checkout (a new rule can be created inline if none fits), and price matrices can also apply restriction rules from the Rule Builder to gate tiered pricing; the shipping method additionally must be assigned to a sales channel to appear at checkout. Payment methods are configured similarly and are also gated by Rule Builder rules for availability. In the Rule Builder's own Assignments tab, you can see every place a given rule is currently used, including payment/shipping method availability and shipping cost calculation, as a read-only navigation aid.", "citations": ["platform/func/settings/rules.md:32-68", "platform/func/settings/shipping.md:19-48"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/rules.md"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings -iname \"*payment*\" -o -iname \"*shipping*\""}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/shipping.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-03": {"query": "How do promotions and discount codes work, including individually generated codes?", "category": "func", "option": "fs-wiki", "answer": "Promotions are configured under Marketing > Promotions. The General tab sets Name, Priority (higher priority number applies before lower), Valid from/until, Max. total uses, Max. uses per customer, and Active toggle. Promotion codes can be: none required (automatic promotion), a single Fixed promotion code shared by all customers (optionally auto-generated), or Individual promotion codes generated per order, where each individual code can only be redeemed once. Individual code patterns can be configured by code length, an optional prefix/suffix, or a custom pattern using `%s` for a random letter (A-Z) and `%d` for a random digit (0-9), e.g. `SW-%s%d%s%d%s-TEST`; regenerating codes invalidates the previous ones. The Conditions tab restricts which sales channels the promotion applies to, whether it can combine with other promotions, and adds Rule Builder-based conditions (Customer rules, Shopping cart rules, Order rules, and 'Promote sets of products' set groups with Mode/Value/Sorting/Product rules); if multiple rules of the same type are selected only one needs to match (OR logic) \u2014 separate promotions are needed to require all conditions together. The Discounts tab defines what the discount applies to (entire cart, shipping costs, entire product set, or a specific set group), an optional restriction to a specific range of products, the discount Type (Absolute, Percentage, Fixed price, or Fixed unit price \u2014 fixed price cannot exceed the normal price), the Value, a Maximum discount value (percentage type only), and per-currency overrides; discount settings become read-only once the promotion has been used in an order. In the storefront, customers enter a code via 'Enter voucher code' in the cart and confirm with the tick button. To track redeemed individual codes, open the promotion and check the 'Redeemed' count, or filter the order overview by promotion code (this also works for fixed codes). A key gotcha: only one individual promotion code can be redeemed per promotion at a time, and placing product exclusions in the shopping-cart conditions (rather than the discount's product rules) blocks the whole promotion instead of just excluding those products from the discount.", "citations": ["platform/func/marketing/promotions.md:19-51"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func -iname \"*promotion*\""}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/marketing/promotions.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-04": {"query": "What does the Shopware Migration Assistant transfer automatically from Shopware 5, and what has to be mapped by hand before the migration starts?", "category": "func", "option": "fs-wiki", "answer": "The Migration Assistant automatically transfers several selectable data groups (Basic data is mandatory): Basic data (categories, customer groups, currencies, sales channels, number ranges); Products (products, properties, product options, product properties, translations, cross-selling, main variant relations); Customers & orders (customers, shipping methods, orders, order documents); Promotions (customers, promotions); SEO URLs (products, properties, product options, product properties, translations, cross-selling, main variant relations, SEO URLs); and Product reviews (products, properties, product options, product properties, translations, cross-selling, main variant relations, customers, reviews, media). Before the migration starts, these fields must be manually mapped by creating matching entities in Shopware 6 first: payment methods, the standard payment method, salutation, delivery time, and the standard delivery time \u2014 and note that fields cannot be re-mapped after the migration has been executed, even after a reset; remapping requires deleting and recreating the migration entirely. Separately, despite 'shipping methods' being listed under the Customers & orders migration group, shipping and payment methods are not actually transferred automatically because Shopware 6 uses the Rule Builder for shipping cost rules and payment risk management, so they must be recreated manually under Settings > Commerce > Shipping and Settings > Commerce > Payment methods. Several other areas also require post-migration manual rework: sales channel domain settings (Shopware 6 already ships two default sales channels, so migrated shops become additional channels needing domain adjustment), countries (checked under Settings > Localisation > Countries), document templates (redesigned, reconfigured under Settings > Commerce > Documents), email templates (now Twig-based and not reusable from Shopware 5, managed under Settings > Content > Email templates), Shopping Worlds/shop pages (become Shopping Experiences and must be recreated under Content > Shopping Experiences), storefront templates (cannot be reused due to the redesigned architecture), and the B2B Suite (cannot be transferred at all).", "citations": ["platform/func/migration-en/what-is-migrated.md:35-64"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/migration-en/what-is-migrated.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-05": {"query": "How do I set up a sales channel \u2014 storefront versus headless type, domains, languages and currencies \u2014 and where do I get its API access key?", "category": "func", "option": "fs-wiki", "answer": "Create a sales channel via the plus icon next to Sales Channel in the administration main menu, choosing either a Sales Channel with HTML storefront, a headless sales channel (API only), or a product comparison export channel. In General settings you configure Name, favourite marking, the entry-point navigation (main navigation, navigation levels, footer navigation, service navigation), the default Customer group for new/anonymous customers, Countries, Languages, and standard units of measurement. Under Payment and shipping you assign Payment methods (plus a default), Shipping methods (plus a default), Currencies (plus a default), and the tax calculation method. Domains are configured per self-hosted instance: each domain has its own URL, Language, Currency, Snippet set, and unit system, which is how multi-language shops on separate URLs are set up (a consistent protocol per domain avoids duplicate-content issues); cloud instances instead get an auto-generated URL with all traffic forwarded over an encrypted connection. Hreflang can be activated with a chosen default domain as fallback to prevent duplicate-content classification across language versions. The API Access ID/key for the channel is generated under the channel's API access section. Other configuration areas include Status (disable the channel, enable maintenance mode, IP-whitelist access \u2014 whitelisting behind a proxy requires TRUSTED_PROXIES set in .env), a Products tab to assign/remove products, categories or dynamic product groups to the channel, a Theme tab, Google Analytics 4 connection, and Agentic files (llms.txt, agents.md, ai-catalog.json). Note the preinstalled headless sales channel should never be deleted since extensions like the B2B Suite depend on it \u2014 hide it via favourites instead if you don't need it visible.", "citations": ["platform/func/settings/saleschannel.md:33-68"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/saleschannel.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-06": {"query": "Which triggers and actions does the Flow Builder offer, and how do I make it send a mail when an order is placed?", "category": "func", "option": "fs-wiki", "answer": "Flow Builder (Settings > Automation > Flow Builder) automates business processes by combining an event trigger, optional Rule Builder conditions, and one or more actions. Example trigger names include `checkout.order.placed`, `checkout.customer.register`, `state_enter.order.state.completed`, `state_leave.order_transaction.state.paid`, `newsletter.register`, and `mail.before.send`. Available actions (availability depends on the trigger) include: Assign account status, Assign affiliate and campaign code, Assign customer group, Generate a document, Send mail (to Administrator, Customer, or custom addresses), Assign status (payment/shipping/order status), Stop flow, Set download access, Change custom field content (customer or order), and Add Tag / Remove Tag; Delayed Actions (Beyond plan) can add a delay before an action fires, and Webhook Actions (Evolve plan + Shopware Commercial) can call an external URL. To send a mail when an order is placed: create a new flow via Add Flow, fill in the General tab (Name, Description, Priority, Active), then on the Flow tab choose the `checkout.order.placed` trigger, optionally add Rule Builder conditions, and add the Send mail action, choosing the recipient (Customer, Administrator, or custom addresses) and the mail content/template. Note that sending mail to 'Administrator' reaches every admin-flagged user, including external agencies using an admin account for API access, and that 'Stop flow' halts the entire flow including parallel branches.", "citations": ["platform/func/settings/Flow-Builder.md:19-52"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func -iname \"*flow*\""}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/Flow-Builder.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-07": {"query": "How do I import products from a CSV with an import/export profile \u2014 column mapping, matching identifiers and a dry run?", "category": "func", "option": "fs-wiki", "answer": "The Import/Export module lives at Settings > Automation > Import/Export. CSV files must use UTF-8, a semicolon field separator, quotation-mark string separator, and a dot (not comma) as the decimal separator for prices. Under the Profiles tab you manage standard or user-created profiles: Profile name, Usage (import/export/both), Object type (e.g. Product, Customer), Separator character (default semicolon), Enclosure character, and Import settings (Create new records / Update existing data); a profile requires the default system language selected or import/export is not possible. Column mapping is done under Mappings: Add new mapping to pair a CSV column name with a database entry, plus Required, Default Value, and Position settings. To match import rows to existing entities via an alternate identifier instead of the record UUID (e.g. `productNumber` instead of the product's UUID), use the Second Unique Identifier setting on the profile's Advanced Settings tab \u2014 note that if the chosen identifier isn't actually unique, only the first matching record is resolved. For a plain product import, select the Default product profile and leave 'Import product variants' unchecked; mandatory product fields are `id`, `taxId`, `productNumber`, `stock`, `name`. On the Import tab you Upload CSV file, Select profile, then either Start import or Start dry run \u2014 dry run validates the file and mapping without writing any data \u2014 and Import activity (last 30 days) lets you re-download the source or erroneous CSVs per run. Note that import can only add data, not remove it \u2014 e.g. it will not clear an existing sales channel assignment.", "citations": ["platform/func/shopware-en/settings/importexport.md:34-79"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/shopware-en/settings/importexport.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-08": {"query": "How do custom field sets work \u2014 entity assignment, field types and technical name \u2014 and can a custom field be written through the Store API?", "category": "func", "option": "fs-wiki", "answer": "Custom fields (Settings > System > Custom fields) let merchants add their own data fields to entities such as products or categories, for use in the Rule Builder, storefront templates, or Shopping Experiences. Custom fields are grouped into sets; a set is created via New set and given a unique, unchangeable technical name, a Position, a translatable Label, and the program areas (entities) it applies to \u2014 a set created with no assigned area exists but is unavailable anywhere. Within a set, individual fields are created via New custom field, each requiring a technical name that also cannot be changed later. Field types include Select, Object selection (references products, categories, countries, shipping/payment methods, etc. \u2014 its object type cannot be changed after creation), Text field, Media, Number (integer/float, with Steps/Min/Max), Date/Time, Checkbox, Active/Inactive switch (boolean 0/1), Text Editor, and Color picker. Custom fields are automatically created as snippets in all snippet sets, requiring no database changes. Regarding the Store API: yes, a custom field can be written through it, but only if its 'Modifiable via Store API' option is explicitly enabled on the field \u2014 this marks the field public, and the documentation warns never to enable it for sensitive data such as customer information. There is also a separate 'Available in shopping carts' flag, required if the field needs to be usable in the Rule Builder or custom templates. Gotchas: technical names for both sets and fields cannot be changed after creation, they must avoid Twig special characters like `-` or `#` (or product exports can error), custom fields must be edited in the store's default language for inheritance/rules to work consistently across languages, and Object selection's object type is fixed once the field is created.", "citations": ["platform/func/settings/custom-fields.md:36-65"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func -iname \"*custom-field*\" -o -iname \"*customfield*\""}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/custom-fields.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-09": {"query": "Why doesn't my payment method appear in the checkout \u2014 what has to be configured in the administration?", "category": "func", "option": "fs-wiki", "answer": "Payment methods are managed under Settings > Commerce > Payment methods. The four standard active methods are cash on delivery, invoice, prepayment, and direct debit, but the documentation notes that a method also needs to be assigned in the relevant sales channel to actually appear to customers there \u2014 this is a common reason a method is missing at checkout even though it exists and is active. Each method has its own Active toggle in the overview, which must be on. A method also has an Availability rule field using Rule Builder conditions to control when it is offered at checkout; if this rule doesn't evaluate to true for the current cart/customer/context, the method won't be offered (leaving it blank/NULL means unrestricted availability). Other configurable fields include name, Technical name (a unique identifier \u2014 changing it on an existing method can make it inoperable), Position (storefront display order), description, logo, and 'Allow change of payment method after order completion.' So to troubleshoot a missing payment method: check it is Active, check it is assigned to the sales channel being used, and check its Availability rule conditions match the current context.", "citations": ["platform/func/settings/Paymentmethods.md:20-32"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/Paymentmethods.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-10": {"query": "How do dynamic product groups work in the administration and where can the resulting group be used?", "category": "func", "option": "fs-wiki", "answer": "Dynamic product groups are found under Catalogues > Dynamic product groups. They are groups of products formed by rule-based conditions. In 'General information' you set a Name (required), Description, and toggle 'Keep matching variants grouped' (grouped under the shared main product when enabled, shown individually when disabled \u2014 this affects categories, cross-selling, and CMS product sliders). In 'Conditions' you select a property and a condition, chain further conditions with AND or OR, and nest conditions indefinitely with SUB-CONDITION (an item must satisfy the main condition and the sub-condition); a Preview button shows matching products. For multi-value properties (products, categories, manufacturers, tags, properties) the available operators are: Is equal to, Is not equal to, Is equal to any of, Is not equal to any of, Is equal to all of, Is not equal to all of. Custom fields can be used as condition properties alongside standard ones, and Delivery time conditions use merchant-defined delivery times (deleting a delivery time used in a condition breaks it). The resulting dynamic product group can be used to fill category content dynamically (e.g. sale or manufacturer categories), to feed product comparison content, or to power the product slider CMS element in Shopping Experiences. A group's status becomes 'invalid' if it depends on rules from a plugin that is currently deactivated.", "citations": ["platform/func/shopware-6-de/Catalogues/Dynamicproductgroups.md:33-71"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"dynamic product group\\|product stream\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func -iname \"*dynamic*\""}, {"tool": "Read", "args": "platform/func/shopware-6-de/Catalogues/Dynamicproductgroups.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-11": {"query": "How do I create an integration for Admin API access in the administration and give it the right privileges?", "category": "func", "option": "fs-wiki", "answer": "Integrations are created under Settings > System > Integrations, and let you create dedicated API access (an access ID and security key) for external applications connecting to Shopware. To create one, click Create integration and assign a name; then decide whether the integration should have full administrator permissions, or instead select an existing role to scope its privileges. Shopware then issues an access ID and a security key; the security key is shown only at creation time, so it must be saved immediately since it is never displayed again afterward. The overview lists integrations with their name and permissions, and you can click the name (or use the context menu) to edit or delete it. If credentials need to be rotated, use 'Regenerate API access key' in the edit view \u2014 this regenerates both the security key and the access ID together, invalidating the previous credentials.", "citations": ["platform/func/settings/system/integrationen.md:21-45"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func -iname \"*integration*\""}, {"tool": "Read", "args": "platform/func/settings/system/integrationen.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-12": {"query": "A spec asks for customer-specific pricing and for a flow that calls an external URL when an order is placed \u2014 before I build either of them, does Shopware already ship them, and what has to be licensed or installed for them to exist in the shop?", "category": "func", "option": "fs-wiki", "answer": "Both exist out of the box, but with different licensing requirements. Customer-specific pricing is available from the Shopware Beyond plan via the Shopware Commercial extension \u2014 it lets a shop offer individually calculated prices (list prices, graduated prices, or currency-dependent prices) per customer, synced in from an external system such as an ERP via a speed-optimised Admin API. There is no Administration UI for it: creating, reading, changing and deleting custom prices is only possible via the 'bulk edit custom prices' Admin API endpoint. Note that variant price inheritance does not apply \u2014 each variant needs its own priced entry \u2014 and the individual price is shown in the storefront only while the matching customer is logged in. So the requirement needs a Shopware Beyond plan plus the Commercial extension installed/enabled; no custom development of the pricing mechanism itself is needed. The second requirement \u2014 calling an external URL when an order is placed \u2014 is covered natively by Flow Builder's webhook actions, which are built into Shopware (no extra extension or plan mentioned). A flow is created in Flow Builder using a webhook action triggered by an event such as a new order; the webhook then notifies the receiving server or asks it to act on the transferred data. So this needs no licensing, just a Flow Builder flow configured with a webhook action.", "citations": ["platform/func/extensions/customer-specific-pricing.md:21-43", "platform/func/features/webhook-actions-in-flow-builder.md:21-37"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func -iname \"*price*\" -o -iname \"*flow*\""}, {"tool": "Bash", "args": "grep -rln \"customer.specific price\\|individual price\\|customer group price\\|net price\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func"}, {"tool": "Read", "args": "platform/func/features/customer-specific-pricing.md"}, {"tool": "Read", "args": "platform/func/extensions/customer-specific-pricing.md"}, {"tool": "Read", "args": "platform/func/features/webhook-actions-in-flow-builder.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-01": {"query": "How do I configure Shopware 6's built-in GraphQL API for the Store API?", "category": "edge", "option": "fs-wiki", "answer": "Nothing in the corpus supports a premise of a built-in GraphQL API. A search across platform/dev for 'GraphQL' and a check of the synonyms index returned no hits at all. The corpus's Store API page instead describes the Store API as a JSON-over-HTTP interface: 'The Store API is the customer-facing surface of Shopware, designed for storefront/frontend interactions such as product browsing, cart handling, checkout, and customer account management... core business logic is exposed through HTTP routes,' with a Stoplight (OpenAPI/REST) reference, not a GraphQL schema. There is no configuration procedure to report because Shopware does not ship a built-in GraphQL API for the Store API in this documentation \u2014 the Store API is REST/JSON-based.", "citations": ["platform/dev/6.7/concepts/api/store-api.md:14-30"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"GraphQL\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms* -maxdepth 1"}, {"tool": "Bash", "args": "grep -in \"graphql\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/*.md"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*store-api*\""}, {"tool": "Read", "args": "platform/dev/6.7/concepts/api/store-api.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "edge-02": {"query": "How do I get the DI container with `Shopware()->Container()` and override the product listing Smarty template in Shopware 6?", "category": "edge", "option": "fs-wiki", "answer": "The corpus has no matches for either `Smarty` or `Shopware()->Container()` anywhere under platform/dev, nor in the synonyms index \u2014 these are Shopware 5 concepts, not Shopware 6. Shopware 5 used the global `Shopware()` legacy container accessor and Smarty as its templating engine; Shopware 6 replaced both: plugin services are wired through Symfony's dependency injection container (services are registered in `services.xml`/DI configuration and injected via constructor, not fetched through a global `Shopware()` function), and the Storefront templating engine is Twig, not Smarty, with template overriding done via Twig template inheritance/block overrides in plugin `Resources/views` directories. [from memory] Nothing in this corpus documents `Shopware()->Container()` or Smarty for Shopware 6 because neither exists in that version.", "citations": [], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"Smarty\\|Shopware()->Container\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev"}, {"tool": "Bash", "args": "grep -in \"smarty\\|Shopware()\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/*.md"}, {"tool": "Bash", "args": "grep -rli \"dependency injection\\|DI container\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}], "notFoundClaim": true, "memoryClaims": ["Shopware 5 used the global `Shopware()` legacy container accessor and Smarty as its templating engine; Shopware 6 replaced both: plugin services are wired through Symfony's dependency injection container (services are registered in `services.xml`/DI configuration and injected via constructor, not fetched through a global `Shopware()` function), and the Storefront templating engine is Twig, not Smarty, with template overriding done via Twig template inheritance/block overrides in plugin `Resources/views` directories."], "sourceVerdict": "no"}, "edge-03": {"query": "Where do the `#[ORM\\Entity]` mapping attributes for my plugin's entity go in Shopware 6, and how do I get Doctrine's `EntityManager` injected into my service so I can persist it?", "category": "edge", "option": "fs-wiki", "answer": "This premise does not apply to Shopware 6: the corpus's Data Abstraction Layer page explicitly states it 'describes the Data Abstraction Layer (DAL), Shopware's thin, non-ORM interface for database access, used instead of an ORM like Doctrine.' There is no `#[ORM\\Entity]` attribute and no Doctrine `EntityManager` to inject in Shopware 6 plugins. Instead, persistence goes through `EntityRepository`, which is 'the recommended way to interact with the DAL/database,' injected via constructor injection with autowiring (e.g. `public function __construct(EntityRepository $productRepository)`) or explicitly registered in the DI container (`$services->set(...)->args([service('product.repository')])`). Entity definitions in Shopware 6 are plain PHP field/definition classes registered with the DAL, not Doctrine-mapped classes with `#[ORM\\Entity]` attributes.", "citations": ["platform/dev/6.7/concepts/framework/data-abstraction-layer.md:18-43"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"Doctrine\\|EntityManager\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/concepts/framework/data-abstraction-layer.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-04": {"query": "How do I fetch products with `GET /sales-channel-api/v3/product` on Shopware 6.7?", "category": "edge", "option": "fs-wiki", "answer": "That endpoint is not available on Shopware 6.7. The corpus's Store API architecture page states as a core principle: 'Do not implement the Sales Channel API \u2014 deprecated as of 6.4,' and repeats in its Gotchas section: 'The Sales Channel API is deprecated as of Shopware 6.4 \u2014 new routes must not implement it.' The `/sales-channel-api/...` route family was the predecessor of today's `/store-api/...` routes. On 6.7 you would instead fetch products through the Store API, e.g. its product listing/search route, which returns a `StoreApiResponse` and follows the `StoreApiRouteScope`/route conventions described on that page; the corpus's Store API concept page points to the Stoplight Store API reference (`https://shopware.stoplight.io/docs/store-api/7b972a75a8d8d-shopware-store-api`) for the exact current product endpoints.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/store-api/_index.md:18-53"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"sales-channel-api\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev"}, {"tool": "Bash", "args": "grep -in \"sales-channel-api\\|/store-api/\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/*.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/store-api/_index.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-05": {"query": "How do I enable Shopware's built-in MCP server on a Shopware 6.6 shop?", "category": "edge", "option": "fs-wiki", "answer": "The corpus's MCP server documentation only exists under platform/dev/6.7 \u2014 there is no MCP-server page under platform/dev/6.6, and 6.6's index has no mention of 'mcp'. The 6.7 Getting Started guide states the prerequisite explicitly: 'Shopware 6.7.14.0+ (on 6.7.11.0\u20136.7.13.x, set `MCP_SERVER=1` in `.env` first and skip discovery); `symfony/mcp-bundle` installed.' This means the built-in MCP server requires Shopware 6.7.11.0 or later \u2014 it is not available on a Shopware 6.6 shop according to this corpus. On a supported 6.7 shop, the steps are: install `symfony/mcp-bundle`, create an integration with `bin/console integration:create \"My MCP Client\" --admin` (outputs `SHOPWARE_ACCESS_KEY_ID`/`SHOPWARE_SECRET_ACCESS_KEY`), configure the AI client (Claude Desktop/Cursor use `streamable-http` pointing at `/api/_mcp` with `sw-access-key`/`sw-secret-access-key` headers; Claude Code uses the `http` transport in `.mcp.json`; Codex uses `~/.codex/config.toml`), then verify with `bin/console debug:mcp`.", "citations": ["platform/dev/6.7/products/tools/mcp-server/getting-started.md:20-47"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev -path \"*mcp-server*\""}, {"tool": "Read", "args": "platform/dev/6.7/products/tools/mcp-server/getting-started.md"}, {"tool": "Bash", "args": "grep -in \"mcp\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.6/index.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "partial"}, "edge-06": {"query": "I'm coming from Magento \u2014 what are the Shopware equivalents of store views, extensions, attribute sets and `di.xml`?", "category": "func", "option": "fs-wiki", "answer": "The corpus's Magento-to-Shopware term dictionary (platform/func/migration-en/magento-keywords.md) gives direct mappings for three of the four terms. Store View/Store/Website -> Sales channel with different languages and domains (under Settings mappings). Extension -> Plugin (under Development mappings), while Magento's Community Code Pool maps to Extensions/Community Store (Extensions > Store) and Local Code Pool maps to Extensions (Settings > My extensions). Attribute Sets -> Custom field sets (groups of custom fields), and the related Catalog > Attributes (Manage Attributes / Attribute Sets) setting maps to Settings > Content > Custom fields. For `di.xml`, the dictionary page does not mention it directly, but Shopware's developer docs describe the equivalent mechanism: Shopware plugins use the Symfony dependency-injection container, and services are registered in a plugin's `services.xml` (found under a plugin's `Resources/config` directory) rather than Magento's `di.xml` \u2014 this is documented across multiple developer pages on plugin dependency injection and service registration (e.g. `platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/dependency-injection.md` and `platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/add-custom-service.md`, found via the synonyms index) though I did not open those pages in this session. [from memory] `di.xml` in Magento configures dependency injection preferences, plugins (interceptors) and virtual types; Shopware's `services.xml` plays the closest structural role for service registration and constructor-argument wiring, though Shopware also has its own separate 'plugin' concept (event subscribers/service decoration) that is not a 1:1 match for Magento's interceptor-style plugins.", "citations": ["platform/func/migration-en/magento-keywords.md:20-55"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"magento\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform"}, {"tool": "Read", "args": "platform/func/migration-en/magento-keywords.md"}, {"tool": "Bash", "args": "grep -in \"di.xml\\|services.xml\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/migration-en/*.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/*.md"}], "notFoundClaim": false, "memoryClaims": ["`di.xml` in Magento configures dependency injection preferences, plugins (interceptors) and virtual types; Shopware's `services.xml` plays the closest structural role for service registration and constructor-argument wiring, though Shopware also has its own separate 'plugin' concept (event subscribers/service decoration) that is not a 1:1 match for Magento's interceptor-style plugins."], "sourceVerdict": "partial"}, "edge-07": {"query": "How do I set up Shopware PWA as the storefront for a Shopware 6.7 shop?", "category": "edge", "option": "fs-wiki", "answer": "The corpus's only Shopware PWA page lives under platform/dev/6.6, not 6.7, and it flags the product itself as no longer actively developed: 'Shopware PWA is a Single Page Application built with JavaScript and Vue.js that provides a decoupled storefront, integrating Shopware functionality into an extensible frontend application. It is based on the Store API,' but 'Shopware PWA is currently in maintenance mode; Composable Frontends is recommended as the future direction for headless commerce with Shopware.' There is no setup guide for it in this corpus at all (only the product overview page), and no PWA-specific page exists under platform/dev/6.7, consistent with it being maintenance-only. For a Shopware 6.7 shop, the corpus instead points to Composable Frontends as the recommended headless/decoupled storefront path (present under platform/dev/6.7/products/paas/shopware/composable-frontends and .../shopware-paas/composable-frontends), which I did not open in this session. Because there is no 6.7 setup procedure for Shopware PWA in the corpus, I cannot give load-bearing setup steps for it on 6.7 beyond noting it is in maintenance mode.", "citations": ["platform/dev/6.6/products/pwa.md:15-25"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"shopware pwa\\|shopware-pwa\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform"}, {"tool": "Read", "args": "platform/dev/6.6/products/pwa.md"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*composable*\""}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "partial"}, "edge-08": {"query": "Which service do I type-hint to read products \u2014 `EntityRepositoryInterface` \u2014 and how do I inject it into my plugin service?", "category": "edge", "option": "fs-wiki", "answer": "The wiki's reading-data guide type-hints the concrete `EntityRepository` class (aliased for you as `entity_name.repository`, e.g. `product.repository`), not an `EntityRepositoryInterface` \u2014 the corpus gives no evidence such an interface is what you're meant to type-hint. To inject the product repository into a plugin service, add it as a constructor parameter typed `EntityRepository $productRepository`, and wire it via `services.php` using `service('product.repository')` as an explicit argument (or rely on autowire/autoconfigure, per the Dependency Injection guide, if the service ID resolves automatically \u2014 though repository services generally need the explicit `service('product.repository')` argument because they're keyed by entity name, not by class). Example: `$services->set(ExampleService::class)->args([service('product.repository')]);` then `public function __construct(private EntityRepository $productRepository) {}`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md:20-56", "platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md:17-58"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"EntityRepository\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/data-handling -type f"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "partial"}, "edge-09": {"query": "Where do I configure Business Events so that a mail is sent when an order is placed in Shopware 6.7?", "category": "edge", "option": "fs-wiki", "answer": "Business Events are configured under Settings > Shop > Business Events; click 'Add Business-Event', set a Title, mark it Active, choose the triggering Event 'Order placed' (technical name `checkout.order.placed`), and pick the Email template to send, optionally scoping it to a Sales Channel and/or restricting it with Rule Builder rules. Note that if you also enter internal Email recipients on that event, the customer will no longer automatically receive the mail \u2014 you'd need a second, otherwise identical event to still notify the customer while separately notifying internal recipients. The wiki flags Business Events as a legacy feature: as of major release 6.4.8.0 it was superseded by the Flow Builder for everything except the B2B-Suite, so in a 6.7 shop the recommended way to send an order-placed mail is normally a Flow Builder flow (trigger `checkout.order.placed` \u2192 action 'Send email'), with Business Events retained only for B2B-Suite compatibility.", "citations": ["platform/func/settings/Business-Events.md:21-43"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"business event\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/Business-Events.md"}, {"tool": "Bash", "args": "grep -rli \"flow builder\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-01": {"query": "How do I add my own Admin API endpoint under `/api/...` from a plugin \u2014 a controller with the api route scope and its ACL?", "category": "gap", "option": "fs-wiki", "answer": "The corpus has no dedicated 'Add Admin API Route' article, but the Store API guide documents the same decoratable-route pattern Shopware uses for both API types, and states explicitly that Admin API endpoints are documented under `src/Resources/Schema/AdminApi/` (versus `StoreApi/` for the Store API) \u2014 confirming the pattern carries over. Following that pattern for the Admin API: define an abstract route with `getDecorated()` and a `load()` method, implement the concrete route class tagged with a `#[Route(...)]` attribute whose `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE` is set to the Admin API scope (`AdminApiRouteScope::ID`, mirroring `StoreApiRouteScope::ID` used for Store API routes) [from memory], register the route class as a service, and import it via `<plugin root>/src/Resources/config/routes.php` with `$routes->import('../../Core/**/*Route.php', 'attribute')`; verify discovery with `bin/console debug:router <route-name>`. For access control on Admin API endpoints, the wiki's ACL guide documents the Administration UI side \u2014 register a privilege via `Shopware.Service('privileges').addPrivilegeMappingEntry(...)`, protect routes/menus with `meta: { privilege: 'key.role' }`, and check with `acl.can('key.role')` \u2014 but it explicitly warns that ACL rules in the Administration UI only gate visibility/behavior there and can be bypassed by direct API calls, i.e. they do not by themselves protect the backend Admin API route; the corpus does not document a PHP-side `#[Acl(...)]`/permission attribute for gating an Admin API controller, so that enforcement mechanism could not be confirmed from this corpus.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md:19-57", "platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:14-73"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"route scope\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -ipath \"*api*controller*\""}, {"tool": "Bash", "args": "grep -rln -i \"add-admin-api-route|admin api route|adminapi|api-controller|api route\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins -iname \"*acl*\" -o -iname \"*permission*\""}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}, {"tool": "Bash", "args": "grep -rln \"AdminApiRouteScope|ApiRouteScope\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework -maxdepth 1 -type d"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling -type f"}], "notFoundClaim": false, "memoryClaims": ["define an abstract route with `getDecorated()` and a `load()` method, implement the concrete route class tagged with a `#[Route(...)]` attribute whose `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE` is set to the Admin API scope (`AdminApiRouteScope::ID`, mirroring `StoreApiRouteScope::ID` used for Store API routes) [from memory]"], "sourceVerdict": "partial"}, "gap-02": {"query": "Shopware 6.7 removed the RSA JWT key files and `system:generate-jwt-secret` \u2014 what signs Admin API tokens now, and what do I have to do when upgrading?", "category": "gap", "option": "fs-wiki", "answer": "The corpus does not document this change. Searching the 6.7 developer docs, the upgrade guide (`upgrades-migrations/upgrade-shopware.md`), the environment-variables reference, and the CLI helper-commands page turned up no mention of RSA JWT key removal, a replacement signing mechanism, or migration steps. Two indirect signals were found but neither confirms the claim: the 6.7 `guides/hosting/configurations/shopware/environment-variables.md` page no longer lists `JWT_PRIVATE_KEY`/`JWT_PUBLIC_KEY` among its environment variables (only `APP_SECRET`, `APP_ENV`, `APP_URL`, etc.), unlike the 6.6 version of the same page which does list them; and the `shopware-cli` helper-commands page notes that `generate-jwt` \u2018is only required for Shopware versions before 6.5 \u2014 6.5+ generates JWT secrets automatically,\u2019 which describes 6.5's automatic secret generation, not a 6.7-specific removal of RSA keys or of the `system:generate-jwt-secret` console command. Nothing in the corpus states what signs Admin API tokens in 6.7 or lists upgrade steps for this change, so I cannot answer from the wiki.", "citations": ["platform/dev/6.7/products/tools/cli/project-commands/helper-commands.md:18-71", "platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md:24-34"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"jwt\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Bash", "args": "grep -rln -i \"generate-jwt-secret|JWT\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform; find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*upgrade*\" -o -iname \"*migration-guide*\" -o -iname \"*changelog*\" -o -iname \"*breaking*\""}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations -type f"}, {"tool": "Bash", "args": "grep -n -i \"jwt\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/part-1.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/tools/cli/project-commands/helper-commands.md"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*environment-variables*\"; grep -rln \"generate-jwt-secret|APP_SECRET\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Bash", "args": "grep -n -i \"APP_SECRET|JWT\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md"}, {"tool": "Bash", "args": "grep -n -i \"jwt|rsa|APP_SECRET\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "gap-03": {"query": "My ERP integration stopped logging in after the 6.7 upgrade \u2014 what changed in the Admin API OAuth flow (`/api/oauth/authorize`, the `scope` format)?", "category": "gap", "option": "fs-wiki", "answer": "The corpus's Admin API auth pages (the APIs quick-start and 'Authentication and API Requests') only document `POST /api/oauth/token` with `grant_type=client_credentials` (integrations) or the local-only `grant_type=password` shortcut, and they show `scopes: write` as a plain string in the password-grant example; there is no `/api/oauth/authorize` endpoint documented anywhere in the 6.7 developer docs, and no page describing any 6.7-specific change to the OAuth flow or to the `scope` parameter's format. I could not find anything in the wiki confirming or explaining a 6.7 change to the Admin API OAuth flow, so this could not be answered from the corpus.", "citations": ["platform/dev/6.7/guides/development/integrations-api/_index.md:19-48", "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md:19-45"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"oauth\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md"}, {"tool": "Bash", "args": "grep -n -i \"oauth|scope\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/concepts/api/_index.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/integrations-api/_index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/integrations-api/_index.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "gap-04": {"query": "After upgrading to 6.7 my plugin fatals on load because core class properties now have native PHP types \u2014 which properties must I retype in my subclasses?", "category": "gap", "option": "fs-wiki", "answer": "Nothing in the corpus addresses this. The Upgrades and Migrations section index points at reviewing `RELEASE_INFO-6.7.md` and `UPGRADE-6.7.md` and checking 'breaking changes per layer (Core / Admin / Storefront / API)' as the general workflow for this kind of issue, but the wiki does not itself enumerate any core class or list which properties gained native PHP types in 6.7, nor a fatal-error/property-retyping issue for plugin subclasses. I searched the 6.7 upgrade guide, the upgrades-migrations index, and the data-handling/entities-via-attributes page (the only other hit for 'property type' terms, which covers DAL entity field definitions, not core class inheritance) without finding this topic, so this could not be answered from the corpus.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/_index.md:20-53"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"native type|typed propert|property type\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Bash", "args": "grep -n -i \"native type|typed propert|property type\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/_index.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "gap-05": {"query": "My plugin decorates `CachedProductRoute` to add cache tags \u2014 where did the `Cached*Route` classes go in Shopware 6.7 and how do I cache a Store API route now?", "category": "gap", "option": "fs-wiki", "answer": "The corpus's 6.7 caching guides describe no `Cached*Route` decorator classes at all \u2014 caching is handled centrally rather than per-route. To mark a route cacheable, set the route default `_httpCache: true` on its `#[Route(...)]` attribute (shown for a Storefront controller: `#[Route(path: '/example', name: 'frontend.example.example', methods: ['GET'], defaults: ['_httpCache' => true])]`); the first request in a given cache-relevant state (tracked via the `logged-in` and `cart-filled` states) generates the response and later requests in the same state reuse it. To add cache tags for your own data, use `$this->cacheTagCollector->addTag('my-custom-entity-' . $id)` and, on change, `$this->cacheInvalidator->invalidate(['my-custom-entity-' . $id])` (pass `true` as the second argument, or set the `sw-force-cache-invalidate: 1` request header, to bypass the default 5-minute delayed/batched invalidation). For a Storefront controller specifically, cache invalidation follows the Store API routes it calls: 'all data loaded by a controller comes from Store API routes, so the HTTP cache entry's tags are the sum of the Store API tags generated or loaded during the request' \u2014 a controller that loads data exclusively through Store API routes needs no additional invalidation logic of its own. The wiki does not explicitly say the `Cached*Route` decorator classes were removed in 6.7 (that detail is outside what these condensed pages state), but the documented mechanism for both routes and controllers in 6.7 is this `_httpCache`/`CacheTagCollector`/`CacheInvalidator` approach, not route decoration.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/caching/_index.md:20-79", "platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-caching-to-custom-controller.md:17-48"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"CachedProductRoute|Cached.*Route\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/caching -type f"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/caching/_index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki
