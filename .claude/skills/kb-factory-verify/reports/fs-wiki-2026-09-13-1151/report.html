 a new, unsaved entity, associations can't be sent to the server yet (the parent isn't persisted), so they are stored locally on the parent and sent together when the parent is saved.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md:14-59"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"Criteria\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration; grep -rn \"repositoryFactory\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-36": {"query": "How do I register ACL privileges for my plugin's Administration module and check them in a component or template?", "category": "dev", "option": "fs-wiki", "answer": "Admin privileges are identifiers made of a `key` and a `role`, joined by a dot (e.g. `product.viewer`). Register a privilege with the privilege service's addPrivilegeMappingEntry, conventionally called from `<component>/acl/index.js` (imported by `<component>/index.js`) before the roles detail page is visited: `Shopware.Service('privileges').addPrivilegeMappingEntry({ category: 'permissions', parent: null, key: 'your_key', roles: { viewer: { privileges: ['entity_name:operation'], dependencies: [] }, editor: { privileges: [], dependencies: [] }, creator: { privileges: [], dependencies: [] }, deleter: { privileges: [], dependencies: [] } } });` \u2014 use category 'permissions' for normal CRUD-style roles (viewer/editor/creator/deleter) or 'additional_permissions' for a non-CRUD custom role key. You can reuse another mapping's privileges via `Shopware.Service('privileges').getPrivileges('rule.viewer')`. Protect a route, menu entry, or settings item by adding `privilege` to its meta/config, e.g. `meta: { privilege: 'your_key.your_role' }`; protect a shortcut by giving it an object with an active() method instead of a plain key binding. Add snippet translations at `sw.privileges.${category}.${key}.label` (and `sw.privileges.${category}.${key}.${role_key}` for additional_permissions). To check a privilege in a component or template, inject the `acl` service and call `acl.can('key.role')`, e.g. `this.acl.can('sales_channel.creator')` in JS or `v-if=\"acl.can('review.editor')\"` in a template. To ship additional privileges onto existing roles from PHP, override `Plugin::enrichPrivileges()`, returning e.g. `['product.viewer' => ['my_custom_privilege:read']]`. Note that ACL rules in the Administration UI only gate visibility/behavior in the UI \u2014 they can be bypassed via direct API calls and do not protect the API itself \u2014 and granting a role's viewer privilege does not automatically give access to the related module; module access must be granted separately.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:14-72"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"acl|privilege\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md -i"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-37": {"query": "How do I set up and run PHPUnit integration tests for my Shopware plugin, including tests that boot the kernel?", "category": "dev", "option": "fs-wiki", "answer": "Install the flex template `dev-tools` package (`composer require --dev dev-tools`) to use PHPUnit in a plugin. Create `phpunit.xml` in the plugin root (it can be autogenerated via `bin/console plugin:create`), e.g. with `bootstrap=\"tests/TestBootstrap.php\"`, `executionOrder=\"random\"`, a coverage include of `./src/`, server var `KERNEL_CLASS=Shopware\\Core\\Kernel`, env `APP_ENV=test`, and testsuites for e.g. `migration` (Migration/Test dir) and a general suite (Test dir). `plugin:create` also generates `tests/TestBootstrap.php`, which uses `Shopware\\Core\\TestBootstrapper` with `->addCallingPlugin()`, `->addActivePlugins(...)`, and `->setForceInstallPlugins(true)` \u2014 the last of which is what ensures the plugin gets installed and activated even if the test database already exists. For an integration test that boots the kernel, extend `PHPUnit\\Framework\\TestCase` and use the `Shopware\\Core\\Framework\\Test\\TestCaseBase\\IntegrationTestBehaviour` trait, which gives automatic database transactions and cache clearing per test. For migration tests specifically, use the `Shopware\\Core\\Framework\\Test\\TestCaseBase\\KernelTestBehaviour` trait for container/database access, and name the test class `<MigrationClassName>Test`. To vary service behavior only in tests, add `<plugin root>/Resources/config/services_test.php`, which overrides `Resources/config/services.php` for the test environment. Run tests with `./vendor/bin/phpunit --configuration=\"custom/plugins/SwagBasicExample\" --testsuite \"migration\"` (omit `--testsuite` to run all suites; use `--filter <ClassOrMethod>` to run a single class or method).", "citations": ["platform/dev/6.7/guides/development/testing/unit/php-unit.md:18-62"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"PHPUnit|integration test\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md -i"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/testing/unit/php-unit.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-38": {"query": "How do I write Jest unit tests for my Administration components in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Test files live next to the file under test, named with the suffix `.spec.js` or `.spec.ts`. Services and isolated ES modules can be imported and tested directly without mocking, e.g. `import Sanitizer from 'src/core/helper/sanitizer.helper'; describe('core/helper/sanitizer.helper.js', () => { it('should sanitize the html', () => { ... }); });`. Administration components are registered globally via `Shopware.Component.register('name', {...})` and built into a real Vue component via `Shopware.Component.build('name')`, which resolves template inheritance/overrides \u2014 this is required because Shopware components support template inheritance and third-party extendability, unlike plain Vue tests. Generate test boilerplate with `composer run admin:create:test` (paste the component/service path when prompted); install JS dependencies first with `composer run init:js`. Mount components with `mount()` or the preferred `shallowMount()` (which stubs child components) from `@vue/test-utils`, passing `props`, `stubs`, `mocks`, and `attachTo: document.body` as needed. Several preconfigured mocks/globals are available: ACL via `global.activeAclRoles = ['product.editor']`; feature flags via `global.activeFeatureFlags = ['FEATURE_NEXT_12345']`; repository factory mocking via `global.repositoryFactoryMock.responses.addResponse({ method, url, status, response })` (and `global.repositoryFactoryMock.showWarning = false` to silence the missing-mock warning); global mocks like `$tc`, `$device`, `$store`, `$router` overridden via `mount`'s `mocks` option; missing directives (e.g. `clipboard`) stubbed via `createLocalVue()` and `localVue.directive('clipboard', {})`; and missing injections (e.g. `mediaService`) provided via `provide: { mediaService: { renameMedia: () => Promise.resolve() } }` or registered globally with `Shopware.Service.register('mediaService', {...})` in `beforeAll`. Run all tests with coverage using `composer run admin:unit`, or only changed-file tests in watch mode with `composer run admin:unit:watch`. Unresolved child components, directives, injections, or services will surface as `[Vue warn]` messages during test runs and must be stubbed or mocked explicitly.", "citations": ["platform/dev/6.7/guides/development/testing/unit/jest-admin.md:14-57"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md, offset=100, limit=15"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/testing/unit/jest-admin.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-39": {"query": "How do I write end-to-end Cypress tests for my plugin against a Shopware 6.7 store?", "category": "dev", "option": "fs-wiki", "answer": "In Shopware 6.7 the corpus explicitly marks Cypress-based E2E testing as legacy: 'Cypress has been deprecated and is no longer maintained; use Playwright for new projects instead,' and the Cypress guide itself says it is 'only relevant for existing Cypress-based test suites; new projects should use Playwright instead.' So for a 6.7 project the recommended path is Playwright (see platform/dev/6.7/guides/development/testing/e2e-playwright/_index.md), not Cypress. That said, the corpus still documents the legacy Cypress workflow if you must maintain an existing suite: start from a clean Shopware installation (no categories/products/settings) initialized with `composer run init`, then install E2E dependencies with `npm install` in the relevant E2E folder (e.g. `src/Administration/Resources/app/administration/test/e2e`); tests run against production mode and a theme must be assigned. The `@shopware-ag/e2e-testsuite-platform` package (built on Cypress plus cypress-select-tests, cypress-log-to-output, cypress-file-upload) supplies commands, helpers, and test data management. For a plugin, create the folder structure `Resources/app/<environment>/test/e2e/cypress/{fixtures,integration,plugins,support}`, run `npm init -y`, install `@shopware-ag/e2e-testsuite-platform`, then create `e2e/cypress/plugins/index.js` requiring `@shopware-ag/e2e-testsuite-platform/cypress/plugins` and `e2e/cypress/support/index.js` requiring `@shopware-ag/e2e-testsuite-platform/cypress/support`. In the Dockerized platform project setup, run `composer run e2e:setup` (outside the container, first-time prep), `composer run e2e:prepare` (inside the container, if already clean), then `composer run e2e:open` (outside, opens the runner), or headlessly via `composer e2e:cypress -- run --spec=\"cypress/e2e/administration/**/*.cy.js\"`. Test files go under `fixtures` (static JSON via cy.fixture), `integration` (*.spec.js test files, which must sit in one of the recognized subfolders \u2014 catalogue, content, customer, general, media-marketing, order, rule-product-stream, settings \u2014 or CI won't pick them up), `plugins`, and `support` (custom commands/overrides), alongside `cypress.json`/`cypress.env.json`. Use `describe()`/`context()` to group tests and `it()` (Shopware's preferred convention over `specify()`) for individual tests; prefer `beforeEach` cleanup over `after`/`afterEach` since a failed test can skip the latter. Create test fixtures via the REST API rather than the UI: `ApiService` wraps axios/shared request logic, and `cy.createDefaultFixture(endpoint, data, jsonPath)` sends a fixture JSON file's contents to the API; custom services extend `AdminFixtureService`/`FixturesService`. Avoid relying on UUID-based IDs as selectors since they can change between installations.", "citations": ["platform/dev/6.7/guides/development/testing/legacy/_index.md:16-22", "platform/dev/6.7/guides/development/testing/legacy/cypress/_index.md:19-46"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"cypress|e2e\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md -i"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/testing/legacy/_index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/testing/legacy/cypress/_index.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-40": {"query": "How do I upgrade a Composer-based Shopware project from 6.6 to 6.7 \u2014 which composer.json constraint do I change, and which console commands do I run afterwards?", "category": "dev", "option": "fs-wiki", "answer": "The recommended path is the Shopware CLI upgrade wizard from a clean Git working tree: `shopware-cli project upgrade` (it checks readiness, lets you pick the target version, verifies Composer-managed extension compatibility, and resolves the target dependency set before applying locally); for CI or a read-only check use `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run`. If the wizard can't be used, the manual Composer process is: 1) enable maintenance mode on a running environment with `bin/console sales-channel:maintenance:enable --all`; 2) adjust the Shopware (and, if used, `shopware/commercial`) version constraints in `composer.json` \u2014 this is the constraint you change to move from 6.6 to 6.7 \u2014 then run `composer update --no-scripts` (the flag avoids running scripts that depend on not-yet-updated recipes); 3) optionally force-update Symfony Flex-managed config files with `composer recipes:update`; 4) finalize with `bin/console system:update:finish`, which runs database migrations and recompiles themes; 5) disable maintenance mode with `bin/console sales-channel:maintenance:disable --all`. Failing to update the version constraints in composer.json before `composer update` means the command just resolves to the currently installed Shopware version, so no actual upgrade happens \u2014 and skipping major versions should be avoided unless the full upgrade path has been explicitly tested.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md:19-55"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"upgrade|6.6 to 6.7|composer.json constraint\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md -i"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-41": {"query": "`composer update` to Shopware 6.7 aborts on a platform requirement and my admin build then fails too \u2014 which PHP, database and Node versions does 6.7 actually require, and how do I check the machine I am on against them before I retry?", "category": "dev", "option": "fs-wiki", "answer": "Shopware 6.7's recommended stack: PHP 8.2+ (recommended up to 8.4) with memory_limit >= 512M, max_execution_time >= 30s, and required extensions ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, openssl, pcre, pdo_mysql, phar, simplexml, xml, xmlreader, zip, zlib (amqp optional); Composer 2.2+ recommended. Database: MariaDB >= 10.11.6 or MySQL >= 8.0.22 (Innovation releases unsupported), recommended MariaDB 11.4 / MySQL 8.4, with max_allowed_packet >= 32M. Node.js/npm: Node 20.0.0+ minimum, recommended Node 24 / npm 10 \u2014 this is what the admin build (webpack/vite) depends on, so an outdated Node is the likely cause of the admin build failure. To verify your machine against these before retrying composer update, the wiki recommends running: `php -v`, `php -m`, `php -i | grep memory_limit`, `composer -V`, `node -v`, `npm -v`. A gotcha noted: multiple PHP versions may be installed on a system, and CLI vs FPM often use different php.ini files, so make sure you're checking the correct binary/ini. Separately, on the workstation/OS level, Shopware 6.7 requires a Unix-based system (macOS 13+, 64-bit Linux, or Windows 10/11 Pro via WSL2/Docker Desktop), 8 GB RAM minimum (16 GB recommended), and ~10 GB free disk space.", "citations": ["platform/dev/6.7/guides/hosting/_index.md:16-41", "platform/dev/6.7/guides/installation/system-requirements.md:14-49"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "ls .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/"}, {"tool": "Bash", "args": "grep -n -i \"requirement|php version|node version|database version|system requirement\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/_index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/installation/system-requirements.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-42": {"query": "How do I check extension compatibility before upgrading with shopware-cli, and why does it report my plugins in custom/plugins as blocking?", "category": "dev", "option": "fs-wiki", "answer": "Use `shopware-cli project upgrade` (optionally with `--no-interaction --target latest-patch --dry-run` for a non-interactive preflight). It runs a local-first, six-phase wizard \u2014 readiness check, version choice, extension/Composer analysis, plan review, apply, and report \u2014 and analyzes your Composer-managed extensions plus verifies the target dependency set with Composer, surfacing extension compatibility issues and Composer resolution problems before any files change; it writes a shareable report to `.shopware-cli/upgrade/report.md`. Run it on a Git branch or disposable copy (`--disable-git` skips Git working-tree checks). It reports plugins in `custom/plugins` as blocking because one of the wizard's prerequisites is that ALL extensions must be Composer-managed \u2014 plugins that are only locally present in `custom/plugins` (not required via Composer) fail this readiness check. The fix is to migrate them first with `shopware-cli project autofix composer-plugins`, which converts locally cloned extensions into Composer-managed packages, before re-running the upgrade wizard. Note the wizard does not rewrite incompatible custom extension code, create missing vendor releases, remove hosting constraints, replace application testing, or deploy to production \u2014 extension compatibility still needs to be tested separately.", "citations": ["platform/dev/6.7/products/tools/cli/project-commands/upgrade.md:19-69", "platform/dev/6.7/guides/upgrades-migrations/_index.md:20-53"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"shopware-cli|compatibility\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/tools/cli/project-commands/upgrade.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/_index.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-43": {"query": "My admin plugin still ships a webpack.config.js \u2014 how do I move the administration build to Vite for Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Shopware 6.7 replaces the Webpack-based build for the Administration's Vue.js app with Vite (Webpack had become slow and its loaders/maintainers stopped receiving significant updates). This only matters if your plugin extends the admin build via a custom webpack.config.js \u2014 apps are unaffected since their build is already decoupled. To migrate: 1) Create `vite.config.mts` in `YourApp/src/Resources/app/administration/src` (replacing the old `webpack.config.js` that lived under `YourApp/src/Resources/app/administration/build/`); 2) Remove the old `webpack.config.js`; 3) Remove Webpack-related dependencies from `package.json`; 4) Add the Vite dependencies to `package.json`. A minimal `vite.config.mts` uses `defineConfig` from `vite`, e.g. setting `resolve.alias` for custom module aliases (equivalent to what webpackMerge/resolve.alias did before). You can test the new system via the feature flag `ADMIN_VITE`. Bundle/plugin info is written to `<shopwareRoot>/var/plugins.json` by `Shopware\\Core\\Framework\\Plugin\\Command\\BundleDumpCommand` (`bin/console bundle:dump`, also run as part of `composer build:js:admin`/`watch:admin`). Extensions are built via `<shopwareRoot>/src/Administration/Resources/app/administration/build/plugins.vite.ts`, still invoked through `composer build:js:admin`. In production, asset info is loaded through the Symfony bundle `pentatrion_vite` and its generated `entrypoints.json`; in dev/HMR mode, `shopware-vite-plugin-serve-multiple-static` serves an `sw-plugin-dev.json` requested by `application.ts`. Gotcha: Vite can only hot-reload `.vue` files, so HMR stays limited until templates fully move to Single File Components; the `vue-globals` plugin rewrites Vue imports to destructure from `Shopware.Vue` to avoid multiple Vue instances, and `override-component` auto-registers `*.override.vue` files via `Shopware.Component.registerOverrideComponent`.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/vite.md:15-59"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"vite|webpack.config\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/administration/vite.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-44": {"query": "After the Vue 3 upgrade my admin plugin broke \u2014 this.$parent resolves to the wrong component and a prop default that calls this.$tc throws. What do I have to change?", "category": "dev", "option": "fs-wiki", "answer": "Both symptoms are known Vue 3 migration pitfalls documented for the Administration (Vue 3 since Shopware 6.6, mandatory since Vue 2 reached EOL on 2023-12-31). `this.$parent` is unreliable in Vue 3 because Vue wraps async components, so `this.$parent` sometimes points to the `AsyncComponentWrapper` rather than the component you expect \u2014 the wiki says this sometimes requires `this.$parent.$parent`, but the recommended fix is to stop relying on `this.$parent` altogether and instead use services or event communication. For the prop default: prop default functions in Vue 3 no longer have access to `this`, so `this.$tc` inside a prop default throws \u2014 replace it with `Shopware.Snippet.tc` instead of `this.$tc`. More broadly, the wiki recommends: align your plugin's npm dependencies with the Administration's package.json, replace all `sw-field` usages with their dedicated component replacements, check `v-model` usage/event listeners/deprecated slot syntax/`router-view` transitions/`key` attributes/filters against the official Vue 3 migration guide, search your code for other `this.$` internal API calls (most break except `this.$tc` itself when not used in a prop default), test with `composer run watch:admin`, and optionally enable the Vue 3 ESLint rule set. Other related gotchas: `@hook:mounted` and similar lifecycle hooks can fire twice for async components (once for the wrapper, once for the underlying component); checking `this.$slots` for a slot name is no longer sufficient \u2014 you must verify it contains an actual v-node; Vuex stores lose reactivity if a getter mutates state; form fields no longer keep the previous DOM id, so tests need a unique `name` attribute; and mutating props now throws hard errors instead of being silently allowed.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/vue3.md:15-49"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/administration/vue3.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-45": {"query": "Shopware.State is deprecated in 6.7 \u2014 how do I convert my administration Vuex module into a Pinia store?", "category": "dev", "option": "fs-wiki", "answer": "With Shopware 6.7, Vuex is replaced by Pinia as the Administration's state management library. Register a store with `Shopware.Store.register('<storeName>', { state, getters, actions })`, where `state` must be a function returning the initial state (not a static object), e.g.:\n```javascript\nconst store = Shopware.Store.register('<storeName>', {\n    state: () => ({ /* initial state */ }),\n    getters: { /* ... */ },\n    actions: { /* ... */ },\n});\nexport default store;\n```\nA store can alternatively be registered with an `id` property instead of a name argument; re-registering an existing store id overwrites it, and `Shopware.Store.unregister('<storeName>')` removes one. To register a store, simply import its file \u2014 `import './state/products.state'` replaces the old `Shopware.State.registerModule('product', productsStore)`. Key differences from Vuex: mutations are removed entirely \u2014 update state directly inside actions (e.g. `this.productName = newName`); getters cannot share a name with a state property since both are exposed at the same level; for TypeScript, define `StoreType` via `ReturnType<typeof store>` and extend the global `PiniaRootState` interface with it for typed access; stores can also be defined as composables returning reactive refs/computed/functions (Pinia devtools only track returned variables and functions); access changes from `Shopware.State.get('<storeName>')` to `Shopware.Store.get('<storeName>')`. For tests, import the store file to register it and call `store.$reset()` in `beforeEach`; component tests using Pinia stores should call `setActivePinia(pinia)` with a `createPinia()` instance and pass `plugins: [pinia]` to the mount config.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/pinia.md:15-56"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"pinia|vuex\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/administration/pinia.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-46": {"query": "sw-button and sw-card are deprecated in Shopware 6.7 \u2014 how do I migrate my plugin's admin templates to the Meteor components, and is there a codemod that does it?", "category": "dev", "option": "fs-wiki", "answer": "Yes, there is a codemod. With Shopware 6.7, several Administration components (like sw-button and sw-card) are being replaced with components from the Meteor Component Library, Shopware's official reusable component collection built on the Shopware Design System. Run the codemod tool to automatically replace old components with Meteor Components in a plugin located under `custom/plugins`: `composer run admin:code-mods` (example: `composer run admin:code-mods -- --plugin-name example-plugin --fix -v 6.7`). The tool replaces compatible components automatically, adds guidance comments where manual migration is required, and fixes some other deprecated code. To support cross-version compatibility, Shopware components gained a `deprecated` prop (default `false`, meaning the new Meteor Component is used by default); setting `deprecated: true` renders the old component instead, letting a plugin support both Shopware 6.6 and 6.7 from a single codebase without migrating immediately. The old components remain usable via the `deprecated` prop, but Shopware recommends migrating to Meteor Components as soon as possible to stay aligned with future development; timelines and specific implementation details described for this migration are subject to change.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/meteor-components.md:15-43"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/administration/meteor-components.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-47": {"query": "My payment plugin implements `AsynchronousPaymentHandlerInterface` and is tagged `shopware.payment.method.async` \u2014 how do I write a payment handler for Shopware 6.7 instead?", "category": "dev", "option": "fs-wiki", "answer": "From Shopware 6.7.0.0, all payment handling goes through a single `Shopware\\Core\\Checkout\\Payment\\Cart\\PaymentHandler\\AbstractPaymentHandler` class instead of the multiple pre-6.7 interfaces. Before 6.7, handlers implemented separate interfaces \u2014 `SynchronousPaymentHandlerInterface` (`pay`), `AsynchronousPaymentHandlerInterface` (`finalize`), `PreparedPaymentHandlerInterface` (`validate`, previously also `capture`), `RecurringPaymentHandlerInterface` (`recurring`), and `RefundPaymentHandlerInterface` (`refund`) \u2014 each registered with its own tag (`shopware.payment.method.sync`, `.async`, `.prepared`, `.recurring`, `.refund`). To migrate: 1) Create a class extending `AbstractPaymentHandler` and implement `supports(PaymentHandlerType $type, string $paymentMethodId, Context $context): bool` plus the relevant method(s): `pay(Request, PaymentTransactionStruct, Context, ?Struct): ?RedirectResponse` (always called during checkout; return `null` for synchronous flows or a `RedirectResponse` to trigger `finalize` afterward), `finalize(Request, PaymentTransactionStruct, Context): void` (called after redirect back from an external provider \u2014 this replaces your current `AsynchronousPaymentHandlerInterface::finalize`), `validate`, `refund`, and/or `recurring` as needed. 2) Register the handler with the single tag `shopware.payment.method` (replacing `shopware.payment.method.async`): `$services->set(MyCustomPaymentHandler::class)->tag('shopware.payment.method');`. 3) Use `Shopware\\Core\\Checkout\\Order\\Aggregate\\OrderTransaction\\OrderTransactionStateHandler` to update transaction state, and throw `PaymentException` (e.g. `PaymentException::asyncProcessInterrupted`, `::customerCanceled`) to fail the transaction. 4) Register the payment method itself in plugin lifecycle (install/activate/deactivate) via `payment_method.repository` with fields including `handlerIdentifier`, `name`, `description`, `pluginId`, `afterOrderEnabled`, and `technicalName`. Never remove the payment method on uninstall \u2014 only set it inactive, since orders may still reference it. Gotcha: `technicalName` is required for plugin-provided payment methods from 6.7 onward and must be unique with a plugin-specific prefix; an omitted `technicalName` can prevent installation/activation, so check existing payment plugins when migrating since older versions allowed it to be omitted.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:17-72"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"payment\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-48": {"query": "After upgrading, my storefront JavaScript plugin no longer loads \u2014 how do I register it asynchronously with `PluginManager` and where does the compiled file have to be shipped?", "category": "dev", "option": "fs-wiki", "answer": "Write the plugin as a vanilla ES6 class extending the base `PluginBaseClass`, at `<plugin root>/src/Resources/app/storefront/src/<plugin-dir>/example-plugin.plugin.js`, e.g.:\n```javascript\nconst { PluginBaseClass } = window;\nexport default class ExamplePlugin extends PluginBaseClass {\n    init() {\n        window.addEventListener('scroll', this.onScroll.bind(this));\n    }\n}\n```\n`init()` runs on `DOMContentLoaded`. Register it (synchronously) in `main.js` (auto-loaded from `<plugin root>/src/Resources/app/storefront/src`) with `PluginManager.register('ExamplePlugin', ExamplePlugin, '[data-example-plugin]')`, which binds the plugin only to DOM elements matching the given selector (accessible inside the plugin as `this.el`). For asynchronous registration \u2014 the part you're asking about \u2014 use a dynamic import in place of the class reference: `PluginManager.register('ExamplePlugin', () => import('./example-plugin/example-plugin.plugin'), '[data-example-plugin]');`. An async plugin registered this way is excluded from the main `storefront.js` bundle and is downloaded on demand only when its selector is present on the page \u2014 synchronously imported plugins are always bundled into `storefront.js` on every page load, which is the key difference to watch for. You can also configure the plugin via a static `options` object plus a `data-{plugin-name-kebab-case}-options` JSON attribute, and extend (rather than overwrite) existing options using the `replace_recursive` Twig filter. Rebuild the Storefront with `shopware-cli project storefront-build` (template setups) or `composer run build:js:storefront` (platform contribution setups). The compiled output must be written to and shipped at `<plugin root>/src/Resources/app/storefront/dist/storefront/js/<plugin-name>/<plugin-name>.js` \u2014 if your plugin no longer loads after upgrading, check that this compiled file exists and was rebuilt/shipped with the plugin.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md:18-81"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"PluginManager|storefront plugin|register.*plugin\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-49": {"query": "My storefront controller still uses the `@Route` and `@RouteScope` annotations from 6.4 \u2014 what is the attribute form in Shopware 6.7 and how are the routes wired?", "category": "dev", "option": "fs-wiki", "answer": "PHP annotations are replaced by native PHP attributes. The `@RouteScope` annotation is deprecated (replaced already in 6.4.11.0 by the `_routeScope` route default, then formalized as the `#[Route(defaults: ...)]` attribute from 6.5 onward). In Shopware 6.7 you declare both the controller-class-wide (or per-route) scope and the route itself using the `#[Route]` PHP attribute:\n```php\n#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]])]\nclass ExampleController extends StorefrontController\n{\n    #[Route(path: '/example', name: 'frontend.example.example', methods: ['GET'])]\n    public function showExample(): Response\n    {\n        return $this->renderStorefront('@SwagBasicExample/storefront/page/example.html.twig', [\n            'example' => 'Hello world'\n        ]);\n    }\n}\n```\nRoute names should use the `frontend`, `widgets`, `payment`, `api` or `store-api` prefix so the router recognizes the route as a Storefront route; the route scope can also be set per-route instead of class-wide. Wiring: register the controller as a public service in `services.php`, calling `setContainer`: `$services->set(ExampleController::class)->public()->call('setContainer', [service('service_container')]);`. Then import the controller's routes in `routes.php` using the attribute loader: `$routes->import('../../Storefront/Controller/*Controller.php', 'attribute');`. Since Shopware 6.7.2.0, a plugin can allow custom route names without one of the standard prefixes by adding a `storefront.router.allowed_routes` config entry (e.g. `storefront: router: allowed_routes: [swag.test.foo-bar]`) loaded from the plugin's `build()` method.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:18-84"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"@Route|RouteScope|Route attribute|#\\[Route\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-50": {"query": "My `ScheduledTaskHandler` stopped running after the upgrade \u2014 how must a scheduled task and its handler be declared in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Register both the task and its handler separately in the plugin's `services.php`:\n```php\n$services->set(ExampleTask::class)\n    ->tag('shopware.scheduled.task');\n\n$services->set(ExampleTaskHandler::class)\n    ->args([service('scheduled_task.repository'), service('logger')])\n    ->tag('messenger.message_handler');\n```\nThe task class extends `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTask` and implements `getTaskName()` (a vendor-prefixed technical name, e.g. `swag.example_task`) and `getDefaultInterval()` (in seconds). The handler class extends `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTaskHandler`, must be annotated `#[AsMessageHandler(handles: ExampleTask::class)]`, and implements `run()`. These are two separate runtime roles that both must be wired even when generated together: the task describes when work is due (tagged `shopware.scheduled.task`), and the handler is the Messenger consumer that actually executes `run()` (tagged `messenger.message_handler`) \u2014 if only one of the two tags/registrations is missing or broken after an upgrade, the handler stops running. Since Shopware 6.7.13.0, a handler can additionally implement `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\DynamicallyScheduledTaskHandler` with `getNextExecutionTime(ScheduledTask $task, ScheduledTaskEntity $taskEntity): ?\\DateTimeInterface`, called after `run()` finishes, to control the next run time from domain data instead of a fixed interval (returning `null` falls back to `nextExecutionTime + runInterval`, capped to now if in the past). To register and test without reinstalling: `bin/console scheduled-task:register`, `bin/console scheduled-task:run`, `bin/console messenger:consume`. Gotcha: the task's `status` must be `scheduled` in the `scheduled_task` table for `scheduled-task:run` to pick it up (unless using the admin worker) \u2014 worth checking directly if the task silently stopped firing after upgrade.", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md:20-71"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-51": {"query": "Custom entities declared in `Resources/config/entities.xml` no longer work for my plugin in Shopware 6.7 \u2014 how do I define and register a DAL entity with PHP attributes instead?", "category": "dev", "option": "fs-wiki", "answer": "Since Shopware v6.6.3.0, entities can be registered via PHP attributes on a class extending `Entity`, instead of writing separate `EntityDefinition`, `EntityEntity`, and `EntityCollection` classes (this replaces the old `entities.xml` DAL definition approach). To define an entity: extend `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity` and add `#[Entity('entity_name', collectionClass: ...)]` (attribute class `Shopware\\Core\\Framework\\DataAbstractionLayer\\Attribute\\Entity`); `name` is required and must be unique, `collectionClass` defaults to `EntityCollection` (custom collection classes need 6.6.9.0+). Add a primary key with `#[PrimaryKey]` on a property (typically a `string` UUID). Register the class in `services.php` with the `shopware.entity` tag: `$services->set(Examples\\ExampleEntity::class)->tag('shopware.entity');` \u2014 Shopware then auto-registers an `EntityDefinition` and `EntityRepository` named `example_entity.definition`/`example_entity.repository`. Define fields with `#[Field(type: FieldType::...)]` (or, since 6.6.9.0, directly with a FQCN extending `Field`, e.g. `#[Field(type: PriceField::class)]`). Special attributes include `AutoIncrement` and `ForeignKey(entity: '...')`; JSON fields with custom (de)serialization use `#[Serialized(serializer: ...)]`. Custom fields use `EntityCustomFieldsTrait` or `#[CustomFields]` on a nullable `array` property. Fields are hidden from the API by default \u2014 use `#[Field(..., api: true)]` or `api: [AdminApiSource::class]`/`api: [SalesChannelApiSource::class]` to expose them. For translations, set `translated: true` on a nullable `#[Field]` property (auto-creates a `TranslatedField` and `EntityTranslationDefinition`), and add `#[Translations]` on a nullable `array` property to load all translations via the `translations` association. Non-nullable properties are required by default; `#[Required]` can be added explicitly and is necessary for translated fields since those must be nullable. Associations (`OneToOne`, `OneToMany`, `ManyToOne`, `ManyToMany`) are declared on nullable array (to-many) or typed (to-one) properties, paired with `#[ForeignKey(entity: '...')]`. Gotchas: translated properties must be nullable; custom collection classes and direct field-class references require 6.6.9.0+; with attribute-based entities you no longer write getters/setters, `EntityTranslationDefinition`, or `EntityCollection` classes manually.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md:1-62"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"entities.xml\\|EntityDefinition\\|attribute\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | grep -i \"custom-entit\\|entity\" | head -30"}, {"tool": "Bash", "args": "grep -rl \"add custom complex data\\|add-custom-complex-data\\|EntityDefinition\\|Entity attribute\\|#\\[Entity\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | head -30; find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*entit*\""}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-52": {"query": "What must a plugin database migration class implement in Shopware 6.7, and where does the database cleanup on uninstall belong?", "category": "dev", "option": "fs-wiki", "answer": "A plugin migration file lives by default in `<plugin root>/src/Migration`, named `Migration<timestamp><Description>.php`. Every migration class must extend `Shopware\\Core\\Framework\\Migration\\MigrationStep` and implement `getCreationTimestamp(): int` (returning the timestamp embedded in the class name) and `update(Connection $connection): void` (where all schema/data changes go). Skeletons can be generated with `./bin/console database:create-migration -p SwagBasicExample --name ExampleDescription`, or a full migration including SQL can be generated from an entity definition with `./bin/console dal:migration:create --bundle=SwagBasicExample --entities=your_entity,your_other_entity`. Migrations run automatically on plugin install/update, or can be run manually with `./bin/console database:migrate SwagBasicExample --all`. For finer control, the plugin's update method can call `$updateContext->setAutoMigrate(false)` and drive the `MigrationCollection` (obtained via `InstallContext`/`UpdateContext`/`ActivateContext`) directly, e.g. `$migrationCollection->migrateInPlace(1576143014)`. Migrations can be relocated by overriding `getMigrationNamespace()` in the plugin base class and renaming the directory to match. Crucially, there is no migration rollback: database cleanup on removal belongs in the plugin's `uninstall` lifecycle method, not in the migration. Also, `MigrationStep::updateDestructive()` is only used by Shopware core for delayed, major-version destructive changes \u2014 plugin install/update never runs it, and it should not be relied on for uninstall cleanup either. A migration that has already been executed must never be modified, since each migration runs only once.", "citations": ["platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md:1-78"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*migrat*\" | grep -iv \"b2b|assistant|profile\""}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-53": {"query": "My theme config labels disappeared from the Theme Manager after 6.7 \u2014 how do I define `theme.json` config fields and where do their translations go now?", "category": "dev", "option": "fs-wiki", "answer": "Field definitions in `theme.json` changed between v6.7.1.0 and v6.8.0.0: before v6.8.0.0, fields (and tabs/blocks/sections) carried inline `label`/`helpText` translation objects directly in `theme.json`, but since v6.7.1.0, `label`/`helpText` are already being omitted from `theme.json` field objects as translations move to Administration snippets \u2014 this is why config labels disappear after upgrading if the plugin still only defines them inline in `theme.json`. `theme.json` lives at `<plugin root>/src/Resources/theme.json`; after changes, run `bin/console theme:refresh` to apply them (this also updates `configInheritance` relationships). Config fields are defined under `config.fields.<field-key>` with parameters: `label`/`helpText` (translation arrays, deprecated for v6.8), `type` (`color`, `text`, `number`, `fontFamily`, `media`, `checkbox`, `switch`, `url`), `editable`, `tab`, `block`, `section`, `custom` (raw data exposed via API only), `scss` (set `false` to skip SCSS variable injection), and `fullWidth`. These fields appear in the Administration Theme Manager and are merged with (inherit from) the Storefront config; only changed values need to be provided. Since v6.8.0.0, field translations no longer live in `theme.json` at all; instead snippet keys are used, stored in files such as `<plugin root>/src/Resources/app/administration/src/app/snippet/de.json` (locale-specific `de-DE.json`/`en-GB.json` also supported). The snippet key structure is: Tab `sw-theme.<technicalName>.<tabName>.label`; Block `sw-theme.<technicalName>.<tabName>.<blockName>.label`; Section `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.label`; Field `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.<fieldName>.label` / `.helpText`; Option `...<fieldName>.<index>.label`. Unnamed tab/block/section segments use `default` in the key.", "citations": ["platform/dev/6.7/guides/plugins/themes/configuration/theme-configuration.md:1-78"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*theme*\" | grep -i \"config|manager|json\""}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/themes/configuration/theme-configuration.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-54": {"query": "How do I register a plugin cookie in the storefront cookie consent manager in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Register a listener for `Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent`: `$services->set(CookieListener::class)->tag('kernel.event_listener', ['event' => 'Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent']);`. In the listener's `__invoke(CookieGroupCollectEvent $event)`, fetch a group from `$event->cookieGroupCollection` (e.g. via `CookieProvider::SNIPPET_NAME_COOKIE_GROUP_COMFORT_FEATURES`), get or create its `CookieEntryCollection`, and add a `CookieEntry`: `$cookieEntry = new CookieEntry('my-cookie-key'); $cookieEntry->name = 'cookie.myCookieName'; $cookieEntry->value = '1'; $cookieEntry->expiration = 30; $entries->add($cookieEntry);`. Cookie groups must not carry the `cookie`, `value`, `expiration`, or `isRequired` parameters \u2014 those belong only on individual `CookieEntry` objects. Since Shopware 6.7.3.0, cookies use the structured `CookieEntry`/`CookieGroup` objects instead of arrays (the array format is deprecated); `CookieProviderInterface` still works for backward compatibility with the old array syntax but is deprecated in favor of `CookieGroupCollectEvent`. Since 6.7.3.0, cookie configurations carry a hash, stored client-side in the `cookie-config-hash` cookie keyed per language ID; any change to the configuration changes the hash and triggers a re-consent prompt for the affected language. The relevant store API endpoint for reading cookie groups is `/store-api/cookie/groups`. 6.7.2 and earlier used `CookieProviderInterface` with array-based cookie definitions; 6.7.3.0 introduced the structured objects and the configuration hash / re-consent mechanism.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md:1-63"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"cookie consent|CookieConfiguration|addCookie|cookie manager\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-55": {"query": "How do the breaking storefront accessibility changes reach my theme in Shopware 6.7, and what must an extension that overrides the affected Twig blocks do?", "category": "dev", "option": "fs-wiki", "answer": "Shopware rolls out storefront accessibility improvements (commitment to WCAG 2.1 AA and BITV 2.0) behind the `ACCESSIBILITY_TWEAKS` feature flag rather than in one big 'accessibility release'. Breaking accessibility changes ship inside regular minor releases but stay inactive by default until the flag is set (`ACCESSIBILITY_TWEAKS=1` in `.env`, the same mechanism as major version flags like `V6_7_0_0`); with major version v6.7.0, all accessibility improvements \u2014 including previously flag-gated breaking ones \u2014 become the default. A change is typically implemented with both the old and new markup guarded by `feature('ACCESSIBILITY_TWEAKS')` in Twig, for example rendering `component_list_items_inner` inside a `<ul>` when the flag is on, versus the old `component_list_items` block inside a `<div>` when it is off. An extension overriding the old block must also implement the new block (e.g. `component_list_items_inner`) via `{% sw_extends %}` so it keeps working once the flag/version default flips \u2014 otherwise, if a breaking accessibility change ships and an extension still assumes the old markup, it can render incorrect HTML once the core switches structure. Testing tooling referenced includes Google Lighthouse, AXE DevTools, WAVE, and manual keyboard/screen-reader checks (NVDA, VoiceOver). Accessibility improvements started with Shopware 6.6+, with further enhancements in 6.7+; Shopware 5 has no accessibility support.", "citations": ["platform/dev/6.7/guides/development/accessibility/storefront-accessibility.md:1-81"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"accessibility\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/accessibility/storefront-accessibility.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-56": {"query": "Header and footer are loaded through ESI sub-requests in Shopware 6.7, so page data is gone in my header template \u2014 how do I pass my own data into the header/footer now?", "category": "dev", "option": "fs-wiki", "answer": "Since the Storefront header and footer are loaded via ESI sub-requests, they are no longer dependent on the current page's data by default. To pass current-page data into the ESI request, extend `base.html.twig` and override the `base_esi_header` (or `base_esi_footer`) block to merge extra parameters into `headerParameters`/`footerParameters`: `{% sw_extends '@Storefront/storefront/base.html.twig' %} {% block base_esi_header %} {% set headerParameters = headerParameters|merge({ 'vendorPrefixPluginName': { 'activeRoute': activeRoute } }) %} {{ parent() }} {% endblock %}`. Because `headerParameters`/`footerParameters` are passed as query parameters to the header/footer ESI route, they must be scalar values only. The value can then be read back in the header template, e.g. by extending `layout/header.html.twig` and using `{{ headerParameters.vendorPrefixPluginName.activeRoute }}` inside the `header` block. In plugins, the `StorefrontRenderEvent` can also add data \u2014 guarded by checking the current route is `frontend.header` (the ESI sub-request's route name) \u2014 via `$event->getParameter('headerParameters')` / `$event->setParameter('headerParameters', ...)`. It is also possible to load an entirely custom header/footer template (as core does for the checkout confirm page), but this overwrites customizations from every other extension, and any custom template must still receive the `header`/`footer` data it extends. For data unrelated to the current page, the separate 'Add data to storefront page' guide should be used instead.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-header-footer.md:1-75"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"ESI\\|sub-request\\|sub request\\|header.*footer|footer.*header\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Bash", "args": "grep -rli \"\\besi\\b\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20; grep -rli \"esi|sub-request\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms* 2>/dev/null"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-header-footer.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-57": {"query": "B2B Suite support ends with 6.8 \u2014 how do I run the B2B Suite Migration to B2B Components and check that it finished?", "category": "dev", "option": "fs-wiki", "answer": "The B2B Suite to B2B Commercial migration is run and monitored with the `b2b:migrate:commercial` and `b2b:migrate:progress` console commands. To migrate everything, run `bin/console b2b:migrate:commercial`. To migrate only specific components, pass their configurator technical names, e.g. `bin/console b2b:migrate:commercial quote_management shopping_list` \u2014 `employee_management` is always migrated first regardless of argument order, since it is a prerequisite for all other components, and the overall order otherwise follows configurator priority. Batch size can be tuned with `bin/console b2b:migrate:commercial --batch-size=100`. Because `b2b:migrate:commercial` queues work and returns before the migration finishes, completion must be checked separately: run `bin/console b2b:migrate:progress --watch` in a separate terminal to watch live status, which reports columns Total, Valid, Newly, Migrated, Pending, Error, with status values `Complete`, `Pending`, `In progress`, `Complete with error`, or `Has new records`. One gotcha: Budget Management leaves the Organization Unit empty on migrated budgets, which requires B2B Commercial 7.6.0+.", "citations": ["platform/dev/6.7/products/extensions/b2b-suite-migration/execution/running-migration.md:1-54"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"b2b suite migration|migration.*b2b component|b2b.*migration\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/extensions/b2b-suite-migration/execution/running-migration.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-58": {"query": "My shopware.yaml still uses redis_url \u2014 how do I define the named Redis connections in Shopware 6.7 and which eviction policy does each one need?", "category": "dev", "option": "fs-wiki", "answer": "Since a single Redis instance cannot apply different eviction policies to different databases, Shopware recommends separate Redis instances/connections per data category rather than one shared instance/`redis_url`. Named connections are configured (since v6.6.8.0) under `shopware.redis.connections` in `shopware.yaml`: `shopware: redis: connections: ephemeral: dsn: 'redis://host1:port/dbindex' persistent: dsn: 'redis://host2:port/dbindex'`. Env vars can be used in the DSN, e.g. `dsn: '%env(REDIS_EPHEMERAL)%/1'`, and connection pooling can be enabled with the `persistent=1` DSN flag, e.g. `dsn: 'redis://host:port/dbindex?persistent=1'`. There are three data categories with recommended eviction policies: (1) Ephemeral data (HTTP cache, object cache) \u2014 `volatile-lru`, no persistence needed; (2) Durable but aging data (sessions) \u2014 `allkeys-lru`, persisted via RDB/AOF; (3) Durable and critical data (cart, number range, lock store, increment) \u2014 `volatile-lru`. A gotcha: a cache Redis hitting its memory limit is normal for `volatile-lru`, but it can only evict keys that have a TTL \u2014 Symfony's tag-aware cache adapter stores tag-index sets without a TTL, which accumulate as orphaned entries and can starve eviction if never pruned.", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/redis.md:1-72"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"redis_url|redis:\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/infrastructure/redis.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-59": {"query": "After upgrading to Shopware 6.7 my Varnish cache is never invalidated \u2014 what changed in the reverse proxy configuration?", "category": "dev", "option": "fs-wiki", "answer": "The Varnish-with-Redis/LUA-based BAN approach is deprecated from v6.6.x and was removed entirely in v6.7.0, in favor of `XKey`-based invalidation \u2014 this is the likely cause of cache never being invalidated after upgrading, since a config still targeting the old BAN/Redis-LUA mechanism no longer works. The reverse proxy config key also changed from `storefront.reverse_proxy` (up to 6.5.x) to `shopware.http_cache.reverse_proxy` (from 6.6.0.0), requiring a config update on upgrade. Current configuration in `config/packages/storefront.yaml` (with `SHOPWARE_HTTP_CACHE_ENABLED=1` in `.env`) looks like: `shopware: http_cache: reverse_proxy: enabled: true ban_method: \"BAN\" hosts: [ \"http://varnish\" ] max_parallel_invalidations: 3 use_varnish_xkey: true` \u2014 `use_varnish_xkey: true` must be set to use the current XKey-based invalidation. Symfony must also be told to trust the reverse proxy so it reads the real client IP, via `SYMFONY_TRUSTED_PROXIES` (e.g. `SYMFONY_TRUSTED_PROXIES=127.0.0.1,10.0.0.0/8` or `SYMFONY_TRUSTED_PROXIES=REMOTE_ADDR`) \u2014 since Shopware 6.6, plain `TRUSTED_PROXIES` is no longer read automatically. Soft purge (serve stale content while refreshing) can be enabled in the Varnish VCL by replacing `xkey.purge(req.http.xkey)` with `xkey.softpurge(req.http.xkey)`. Relevant cache-clear commands: `bin/console cache:clear` (clears/warms the application cache; before 6.7 it also cleared the HTTP cache), `bin/console cache:clear:all` (clears everything including HTTP cache, since 6.6.8), `bin/console cache:clear:http` (clears just the reverse proxy cache, since 6.6.10), and `bin/console cache:pool:clear --all` (object cache only).", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/reverse-http-cache.md:1-89"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"varnish|reverse proxy\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/infrastructure/reverse-http-cache.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-60": {"query": "Which transports do my Shopware message queue workers have to consume in production, and how do I turn off the admin worker?", "category": "dev", "option": "fs-wiki", "answer": "By default Shopware messages are stored in the database and worked off via the browser (admin worker) while a user is logged into the Administration \u2014 this is not recommended in production because it only runs while someone is logged in and can cause high CPU load with multiple concurrent admin users. Instead, run one or more CLI workers, e.g. `bin/console messenger:consume async --time-limit=60 --memory-limit=128M` and `bin/console messenger:consume async low_priority` \u2014 so the CLI workers must consume the `async` and `low_priority` transports (plus any custom transports configured under `framework.messenger.transports`). A CLI worker must also be set up for the failed queue, otherwise failed messages are never processed; failed messages are retried automatically 3 times, then deleted, via the Doctrine-backed failed transport (`MESSENGER_TRANSPORT_FAILURE_DSN`). To turn off the admin worker once CLI workers are running, set in `config/packages/shopware.yaml`: `shopware: admin_worker: enable_admin_worker: false`. If the admin worker is still used, it can instead be configured with `enable_admin_worker: true`, `poll_interval: 30`, and `transports: [\"async\", \"low_priority\"]`. Custom transports and routing (including sending mail asynchronously via `framework.mailer.message_bus: 'messenger.default_bus'`) are configured in `framework.yaml`. To overwrite routing (instead of adding to it) for a message implementing `AsyncMessageInterface`, use `shopware.messenger.routing_overwrite` in `shopware.yaml` (added in 6.6.4.0 and 6.5.12.0). Note: cron jobs won't cap the maximum number of workers the way supervisor/systemd can, so overlapping long-running messages risk starting an unwanted amount of workers.", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/message-queue.md:1-94"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"message queue|admin worker|messenger\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | grep -i \"hosting|worker|queue\" | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/infrastructure/message-queue.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-61": {"query": "After the upgrade my Elasticsearch index has to be rebuilt \u2014 where do I set the shard and replica counts and which reindex command do I run?", "category": "dev", "option": "fs-wiki", "answer": "Shard and replica counts are overridden in `config/packages/elasticsearch.yml` under `elasticsearch.index_settings.number_of_shards` and `number_of_replicas` (the default since 6.4.12.0 is 3/3). To rebuild the index: clear cache first (`bin/console cache:clear`), then run `bin/console es:index` for basic indexing, or `bin/console dal:refresh:index --use-queue` to reindex the whole shop (Elasticsearch, SEO URLs, product index, etc.) \u2014 always with `--use-queue`. Some systems also need `bin/console es:create:alias` afterward, and indexing is processed via the message queue, so run `bin/console messenger:consume` to process the queued jobs (add `-vv` for output).", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md:26-66"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "grep -rln 'elasticsearch' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-62": {"query": "I changed a setting in `.env` on a deployed 6.7 shop but it still behaves the old way \u2014 what takes precedence between `.env`, `.env.local` and the real environment variables, and which settings does Shopware not read from `.env` at all?", "category": "dev", "option": "fs-wiki", "answer": "Shopware runs on Symfony's standard dotenv loading, where real process/server environment variables always win over any `.env*` file value, and `.env.local` overrides the committed `.env` (this is standard Symfony behavior, not specific to Shopware) [from memory]. The wiki's environment-variables reference page lists the variables Shopware actually reads this way (APP_ENV, APP_URL, APP_SECRET, DATABASE_URL, MESSENGER_TRANSPORT_DSN, REDIS_URL, the Elasticsearch/OpenSearch variables, etc.), so on a deployed shop the effective value is whatever the real server-level environment variable is set to, not what is written in a `.env`/`.env.local` file that got overridden at deploy time. Separately, most merchant-facing settings (e.g. `core.listing.allowBuyInListing`) are stored in the database as \"system config\", not read from `.env` at all \u2014 unless you explicitly wire them in with `config/packages/<name>.yaml` under `shopware.system_config`, optionally pulling from an env var via `%env(...)%`; once a key is set that way, it permanently overlays/overwrites the database value and can no longer be changed in the Administration UI.", "citations": ["platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md:16-41", "platform/dev/6.7/guides/hosting/configurations/shopware/static-system-config.md:15-62"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md"}, {"tool": "Bash", "args": "grep -rln '.env.local|env_file|dotenv' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/configurations/shopware/static-system-config.md"}, {"tool": "Bash", "args": "grep -n '.env' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/installation/legacy-setups/symfony-cli-setup.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/start-developing.md"}, {"tool": "Bash", "args": "grep -rln 'precedence|override.*env|env.*override' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -il"}], "notFoundClaim": false, "memoryClaims": ["Shopware runs on Symfony's standard dotenv loading, where real process/server environment variables always win over any `.env*` file value, and `.env.local` overrides the committed `.env` (this is standard Symfony behavior, not specific to Shopware) [from memory]."], "sourceVerdict": "partial"}, "dev-63": {"query": "I deployed a plugin update to a 6.7 staging shop and my new migration never ran \u2014 which `bin/console` command applies the pending migrations of that one plugin, and what do I have to pass to it?", "category": "dev", "option": "fs-wiki", "answer": "Run `./bin/console database:migrate <PluginName> --all` (e.g. `./bin/console database:migrate SwagBasicExample --all`) to apply all pending migrations of that specific plugin \u2014 pass the plugin's technical name and the `--all` flag. Note that migrations normally auto-run on plugin install/update, so if it didn't run automatically, this manual command is the fallback; also note there is no rollback, and a migration that already executed once will never run again even if changed.", "citations": ["platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md:18-77"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln 'migration:migrate|database:migrate|plugin migration' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-64": {"query": "How do I get an Admin API OAuth token \u2014 with client_credentials for an integration, or the password grant for local testing \u2014 and how long is each token valid?", "category": "dev", "option": "fs-wiki", "answer": "For a real integration, create one in Administration under Settings \u2192 System \u2192 Integrations with the \"Administrator\" toggle enabled to get an access key ID (`client_id`) and secret access key (`client_secret`), then POST to `/api/oauth/token` with `{\"grant_type\": \"client_credentials\", \"client_id\": \"...\", \"client_secret\": \"...\"}`; the response contains `token_type`, `expires_in`, and `access_token`. For local development only, there's a password-grant shortcut: POST to `/api/oauth/token` with `grant_type: password`, `client_id: administration`, `scopes: write`, and the default Administration username/password \u2014 the response also has `token_type`, `expires_in`, `access_token`, and `refresh_token`. The wiki flags the password grant as a local-only shortcut that should not replace `client_credentials` for integrations or reproducible setups, but it does not state the exact `expires_in` seconds for either grant type in the corpus text I retrieved.", "citations": ["platform/dev/6.7/guides/development/integrations-api/_index.md:25-47", "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md:27-45"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln 'client_credentials|password grant|oauth' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -il | grep -i 'auth|api'"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/integrations-api/_index.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "partial"}, "dev-65": {"query": "What can I put in the JSON body of `POST /api/search/{entity}` for filtering, associations, sorting, aggregations and getting an exact total count?", "category": "dev", "option": "fs-wiki", "answer": "The search endpoint accepts a JSON search-criteria object with the same shape as a DAL criteria. Key parameters: `associations` loads related data (like a SQL join), with nested sort/filter/limit per association; `includes` restricts returned fields per type, keyed by each response's `apiAlias` (e.g. `product`, `product_manufacturer`); `ids` looks up records directly by ID; `filter` filters results and aggregations (same filter types as the DAL, and nested-field filters like `transactions.stateMachineState.technicalName` require the association to be requested first); `post-filter` filters like `filter` but does not affect aggregations; `query` is a weighted search where each sub-query has a `score` summed into `extensions.search._score` (don't combine with `term`); `term` is a text search across fields flagged `SearchRanking` in the entity definition; `sort` takes one or more `{field, order}` entries, supports `naturalSorting: true` and a `type: \"count\"` sort (introduced in 6.4.12.0); `aggregations` computes metrics/facets using the same types as the DAL; `grouping` groups results by one or more fields; `page` (1-indexed) and `limit` handle pagination. For an exact total count, set `total-count-mode: 1`, which runs `SQL_CALC_FOUND_ROWS` for exact pagination (performance-intensive) \u2014 the default `0` returns no total for best performance, and `2` only indicates whether a next page exists (good for infinite scroll).", "citations": ["platform/dev/6.7/guides/development/integrations-api/search-criteria.md:18-61"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/integrations-api/search-criteria.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-66": {"query": "Which request headers change Admin API behaviour for language, entity version, parent-child inheritance and skipping flow triggers during a bulk import?", "category": "dev", "option": "fs-wiki", "answer": "`sw-language-id` returns entities in the given language ID instead of the system language (e.g. `sw-language-id: be01bd336c204f20ab86eab45bbdbe45`). `sw-version-id` tells the API which entity version to return (e.g. `sw-version-id: 0fa91ce3e96a4bc2be4bd9ce752c3425`). `sw-inheritance` makes the API consider parent-child inheritance, such as for product variants (e.g. `sw-inheritance: 1`). `sw-skip-trigger-flow` skips flow triggers (like \"send email on customer creation\") during bulk imports via the sync API (e.g. `sw-skip-trigger-flow: 1`).", "citations": ["platform/dev/6.7/guides/development/integrations-api/request-headers.md:16-37"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/integrations-api/request-headers.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-67": {"query": "What does a minimal app folder and `manifest.xml` need to contain, and which console commands install and activate the app on my local Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Create an app folder under `custom/apps/<TechnicalName>` using an UpperCamelCase technical name (e.g. `MyExampleApp`), with a `manifest.xml` inside it (`custom/apps/MyExampleApp/manifest.xml`). The manifest needs a `<meta>` block with `name`, `label`, `description`, `author`, `copyright`, `version`, `icon`, and `license` \u2014 the folder name must match `<meta><name>`, and `<author>`/`<copyright>` are required or `bin/console app:refresh` fails. Then run `bin/console app:refresh` to register the app, and `bin/console app:install --activate MyExampleApp` to install and activate it in one step (installing uses the technical name from `<meta><name>`, not a filesystem path); without `--activate` you can activate later via Extensions \u2192 My Extensions \u2192 Apps or `bin/console app:activate MyExampleApp`. Use `bin/console app:list` to inspect installed apps, `bin/console cache:clear` (or `cache:clear:http`/`cache:clear:all`) after activating, `--no-validate` on `app:install` to skip validation while debugging, and `bin/console app:validate` to find configuration issues.", "citations": ["platform/dev/6.7/guides/plugins/apps/app-base-guide.md:19-42"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln 'manifest.xml' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -il | grep -i app"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/apps/app-base-guide.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-68": {"query": "How does the registration handshake between Shopware and my app backend work \u2014 shop id, proof, shop secret and the confirmation call?", "category": "dev", "option": "fs-wiki", "answer": "Registration is a `GET` request Shopware sends to the URL declared in the manifest, with query parameters `shop-id`, `shop-url`, `timestamp`, and header `shopware-app-signature` (HMAC-SHA256 of the query string, signed with the app's `app-secret`; `$signature = hash_hmac('sha256', $queryString, $appSecret)`), plus `sw-version` (since 6.4.1.0), and \u2014 on re-registration \u2014 `shopware-shop-signature` signed with the shop's current `shop-secret`. On success the app backend responds with a `proof` (SHA-256 HMAC of `shopId . shopUrl . appName` using the `app-secret`), a generated `shop-secret` (64\u2013255 characters), and a `confirmation_url`, e.g. `{\"proof\": \"...\", \"secret\": \"random secret string\", \"confirmation_url\": \"https://my.example.com/registration/confirm\"}`. On a failed setup precondition it responds with `{\"error\": \"...\"}` instead. If the proof matches, Shopware sends a `POST` to the `confirmation_url` with `apiKey`, `secretKey`, `timestamp`, `shopUrl`, `shopId` in the body, signed via the `shopware-shop-signature` header (HMAC-SHA256 of the body with `shop-secret`); the app backend then uses `apiKey`/`secretKey` as OAuth `client_id`/`client_secret` against the Admin API. Re-registration additionally carries a `shopware-shop-signature-previous` header signed with the previous `shop-secret`, so the backend can validate both and accept the old secret for a short grace period (e.g. 1 minute) to handle secret rotation. Registration and confirmation requests time out after 5 seconds, and the `app-secret` must never be published \u2014 it stays with the Shopware Account.", "citations": ["platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md:19-41", "platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md:90-92"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-69": {"query": "How does an app subscribe to an event like `product.written`, what does Shopware POST to the webhook URL, and how do I verify the request is genuine?", "category": "dev", "option": "fs-wiki", "answer": "Declare a webhook in the manifest's `<webhooks>` section, naming the webhook and the `event` it listens to (e.g. `product.written`). Shopware then POSTs a payload shaped like `{\"data\": {\"payload\": [{\"entity\": ..., \"operation\": ..., \"primaryKey\": ..., \"updatedFields\": []}], \"event\": ...}, \"source\": {\"url\": ..., \"appVersion\": ..., \"shopId\": ..., \"eventId\": ...}, \"timestamp\": 0}` \u2014 `source.url`/`appVersion`/`shopId`/`eventId` identify the sending shop instance (`eventId` stays stable across retries, since 6.4.11.0), and `timestamp` (since 6.4.1.0) can be used to reject stale/replayed requests. The request also carries the `sw-version` header (since 6.4.1.0) and `sw-context-language`/`sw-user-language` headers (since 6.4.5.0). `entity.written` payloads (like `product.written`) only reference the changed record by `primaryKey`, not the full entity, so the app must fetch it via the shop API itself; you can also restrict a webhook to the live version with `onlyLiveVersion` in the manifest (since 6.5.7.0, only checked for `HookableEntityWrittenEvent`). To verify authenticity, check the `shopware-shop-signature` header \u2014 a SHA256 HMAC of the request body, signed with the secret assigned during app registration (the same mechanism used for the registration confirmation request).", "citations": ["platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md:18-47"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/apps/lifecycle -iname '*webhook*'"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"},
