efine the payment method in your manifest.xml. Whether it's synchronous or asynchronous depends on whether you provide a finalize-url: if no finalize-url is defined, Shopware defaults to a synchronous payment; if you don't need any app communication at all you can omit pay-url too and the payment stays 'open' at checkout.\n\nSynchronous payment (pay-url only): Shopware POSTs JSON to pay-url with `source` (url, shopId, appVersion), `orderTransaction`, and `order`. Your app responds with a `status` (see status list below), optionally with a `message` for failing states, e.g. {\"status\": \"authorize\"} or {\"status\": \"authorize\", \"message\": \"The customer failed to pass the credit check.\"}.\n\nAsynchronous payment (pay-url + finalize-url):\n1. Shopware sends the first POST to pay-url with `source`, `orderTransaction`, `order`, and a `returnUrl` where the customer should land after paying with the provider.\n2. Your app server responds with a `redirectUrl` pointing to the payment provider, e.g. {\"redirectUrl\": \"https://payment.app/customer/gotoPaymentProvider\"}. The browser is redirected there, and afterward the provider redirects the customer back to the returnUrl.\n3. Shopware then sends a second POST to finalize-url with `orderTransaction` (for identification) and `requestData` (the query parameters the payment provider passed back). Your app responds with a `status` (and optional `message`), e.g. {\"status\": \"paid\"}.\n\nAll possible payment `status` values the app server can return: open, paid, cancelled, refunded, failed, authorize, unconfirmed, in_progress, reminded, chargeback.\n\nImportant Shopware 6.7 requirement: from Shopware 6.7.0.0 onward, your app-server MUST respond with a payment state (`status`) in its response if you intend to change the transaction state — this applies to pay, finalize, prepared-payment validate/pay, refund, and recurring-capture calls alike; simply returning nothing/omitting status will no longer change the transaction state as it may have implicitly done before.\n\nOther related endpoints in the payment app system: prepared payments (validate call + pay call, since 6.4.9.0) for deeper checkout integration, refund (since 6.4.12.0, returns a refund status such as completed), and recurring captures (subscriptions, paid-plan feature) which reuse the synchronous payment-style payload/response.","citations":["developer/guides/plugins/apps/checkout/payment.md:1-800"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/plugins/apps/checkout/payment.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-71":{"query":"How does an app define its own custom entities in Shopware 6.7 and read them back through the API?","category":"dev","option":"mcp-docs","answer":"An app defines custom entities by registering them in its `Resources/entities.xml` file (validated against the `entity-1.0.xsd` schema), e.g. `<entity name=\"custom_entity_bundle\"><fields><string name=\"name\" required=\"true\" translatable=\"true\" store-api-aware=\"true\"/>...<\/fields><\/entity>`. Registered entities automatically get a repository, which is accessible in App Scripts via `services.repository.search('custom_entity_blog', criteria)`, and are also accessible via the Admin API, e.g. `POST /api/search/custom-entity-blog` (dashes replace underscores in the route). Since v6.4.15.0 you can use a `ce_` shorthand prefix for entity names to avoid DB name-length restrictions (e.g. `ce_bundle`), and the same shorthand must then be used consistently in the repository and API calls (`POST /api/search/ce_blog`). Entities can also be made custom-fields-aware (`custom-fields-aware=\"true\"` plus `label-property`) so they can be referenced by an 'Entity Select' custom field. Permissions: an app automatically has full access to its own custom entities, but needs explicit `<permissions>` entries for any core entities its custom entity associations reference. Custom entities cannot be renamed later without losing their data.","citations":["developer/guides/plugins/apps/custom-data/custom-entities.md:1-127"],"toolCallLog":[{"tool":"kb_status","args":"{}"},{"tool":"read_doc","args":"path=developer/index.md"},{"tool":"read_doc","args":"path=merchant/index.md"},{"tool":"grep_docs","args":"pattern=custom entities, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/apps/custom-data/custom-entities.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-01":{"query":"How do I configure Shopware 6's built-in GraphQL API for the Store API?","category":"edge","option":"mcp-docs","answer":"No such feature was found in the corpus, and the premise appears false: a search for \"graphql\" across the entire developer documentation and the entire merchant documentation returned zero matches in both. Shopware 6's Store API (and Admin API) is a REST/JSON HTTP API, not a GraphQL API, so there is nothing built-in to configure as a GraphQL API for the Store API [from memory]. I could not find any configuration steps in the corpus because the feature does not appear to exist.","citations":[],"toolCallLog":[{"tool":"grep_docs","args":"pattern=graphql, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=graphql, path=merchant, mode=files"}],"notFoundClaim":true,"memoryClaims":["Shopware 6's Store API and Admin API are REST-based HTTP APIs; Shopware does not ship a built-in GraphQL API."],"sourceVerdict":"no"},"edge-02":{"query":"How do I get the DI container with `Shopware()->Container()` and override the product listing Smarty template in Shopware 6?","category":"edge","option":"mcp-docs","answer":"The premise is false for Shopware 6: `Shopware()->Container()` and Smarty templates are Shopware 5 concepts and do not exist in Shopware 6 [from memory]. Searches of the entire developer documentation for \"Smarty\" and for the literal string \"Shopware()->Container()\" both returned zero matches, while a search for \"Twig\" returned matches in dozens of developer docs pages (e.g. developer/guides/plugins/apps/storefront/customize-templates.md), confirming Shopware 6's Storefront uses the Symfony Twig templating engine, not Smarty. Symfony's dependency injection container is used instead of a `Shopware()` global helper: services are defined/tagged in a plugin's `services.xml` and auto-wired, and storefront templates are customized by placing files under an app or plugin's `Resources/views` (mirroring the core's `src/Storefront/Resources/views` structure) and extending/overriding Twig blocks, as shown in developer/guides/plugins/apps/storefront/customize-templates.md. To override the product listing template specifically you would locate its Twig file under the Storefront bundle (e.g. by searching the core `src/Storefront` templates) and create a matching-path override with `{% sw_extends %}` in your own plugin/app views directory, not a Smarty template.","citations":["developer/guides/plugins/apps/storefront/customize-templates.md:1-40"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=Smarty, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=Shopware()->Container(), path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=Twig, path=developer, mode=count"},{"tool":"read_doc","args":"path=developer/guides/plugins/apps/storefront/customize-templates.md, limit=40"},{"tool":"grep_docs","args":"pattern=get the container, path=developer, mode=files"}],"notFoundClaim":true,"memoryClaims":["Shopware()->Container() and Smarty templates are Shopware 5 concepts that do not exist in Shopware 6."],"sourceVerdict":"partial"},"edge-03":{"query":"Where do the `#[ORM\\Entity]` mapping attributes for my plugin's entity go in Shopware 6, and how do I get Doctrine's `EntityManager` injected into my service so I can persist it?","category":"edge","option":"mcp-docs","answer":"The premise is false: Shopware 6 does not use Doctrine ORM's `#[ORM\\Entity]` attributes or an `EntityManager` for plugin entities. Searches of the entire developer documentation for the literal strings \"ORM\\\\Entity\" and \"EntityManager\" both returned zero matches. Instead, Shopware 6 has its own Data Abstraction Layer (DAL). Since Shopware 6.6.3.0 you can define an entity by creating a class that extends `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity` and adding Shopware's own `#[Entity('your_entity_name')]` attribute (from `Shopware\\Core\\Framework\\DataAbstractionLayer\\Attribute\\Entity`) to the class, marking the primary-key property with `#[PrimaryKey]` and typing fields with `#[Field(type: FieldType::...)]`. You then register the entity class in the DI container (in `services.php`/`services.xml`) tagged with `shopware.entity`; Shopware automatically creates and registers an `EntityDefinition` and an `EntityRepository` for it (as `<entity_name>.definition` and `<entity_name>.repository` DI services). To persist data you inject/fetch that generated `EntityRepository` service (not a Doctrine `EntityManager`) and call its `upsert`/`create`/`update` methods against the DAL.","citations":["developer/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md:1-80"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=ORM\\\\Entity, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=EntityManager, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=EntityDefinition, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md, limit=80"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"edge-04":{"query":"How do I fetch products with `GET /sales-channel-api/v3/product` on Shopware 6.7?","category":"edge","option":"mcp-docs","answer":"That exact route does not exist on current Shopware 6 (including 6.7): a search of the developer docs for \"sales-channel-api\" returned only two unrelated architecture-decision-record pages, and neither documents an active `/sales-channel-api/v3/*` route. The current customer-facing API is called the Store API and is served under the base path `/store-api/*` (documented in developer/concepts/api/store-api.md and developer/guides/development/integrations-api/index.md); its endpoints are authenticated with the sales channel's `sw-access-key` header rather than a versioned `/sales-channel-api/v3/...` path. To fetch products you would instead call the Store API's product endpoint, e.g. `curl -s \"http://<host>/store-api/product\" -H \"sw-access-key: YOUR_ACCESS_KEY\"`, where the access key is copied from Administration under Sales Channels > (your sales channel) > API access. A successful call returns JSON with an `elements` array (empty if no matching products exist).","citations":["developer/concepts/api/store-api.md:1-17","developer/guides/development/integrations-api/index.md:1-170"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=sales-channel-api, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=store-api, path=developer, mode=files, maxMatches=20"},{"tool":"read_doc","args":"path=developer/concepts/api/store-api.md, limit=60"},{"tool":"read_doc","args":"path=developer/guides/development/integrations-api/index.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"edge-05":{"query":"How do I enable Shopware's built-in MCP server on a Shopware 6.6 shop?","category":"edge","option":"mcp-docs","answer":"This is not possible: the built-in MCP server does not exist on Shopware 6.6 at all. Per developer/products/tools/mcp-server/index.md's Status section, the Shopware MCP Server is an experimental feature that was 'Introduced in Shopware 6.7.11.0', with progressive tool discovery and removal of the `MCP_SERVER` feature flag only in 6.7.14.0 -- there is no 6.6 release that ships it. The getting-started guide (developer/products/tools/mcp-server/getting-started.md) confirms the prerequisite is 'Shopware 6.7.14.0 or later. On 6.7.11.0 to 6.7.13.x, set `MCP_SERVER=1` in your `.env` file first', plus the `symfony/mcp-bundle` Composer package. So on a 6.7.11.0+ shop you would run `bin/console integration:create \"My MCP Client\" --admin` to get API credentials, then configure your AI client (e.g. Claude Desktop, Cursor) to talk to the shop over streamable-http using those credentials -- but none of this is available on 6.6, and there is no documented backport or workaround to enable it there.","citations":["developer/products/tools/mcp-server/index.md:150-164","developer/products/tools/mcp-server/getting-started.md:1-50"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/plugins/apps/mcp-server.md"},{"tool":"list_docs","args":"path=developer/products/tools/mcp-server"},{"tool":"read_doc","args":"path=developer/products/tools/mcp-server/getting-started.md, limit=50"},{"tool":"grep_docs","args":"pattern=Introduced in Shopware, path=developer/products/tools/mcp-server/index.md"},{"tool":"read_doc","args":"path=developer/products/tools/mcp-server/index.md, offset=150, limit=15"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"edge-06":{"query":"I'm coming from Magento — what are the Shopware equivalents of store views, extensions, attribute sets and `di.xml`?","category":"edge","option":"mcp-docs","answer":"Shopware publishes a dedicated Magento<->Shopware dictionary (merchant/content/en/shopware-6/migration-en/magento-keywords/v1-1-0-0.md) that answers most of this directly: 'Store view / Store / Website' maps to a 'Sales channel with different languages and domains' in Shopware (Settings are scoped per sales channel instead of per store view/website/store). 'Extension' (Magento's Local/Community Code Pool concept) maps to Shopware's 'Plugin' (installed/managed under Settings > My extensions) or, more broadly, 'Extensions' installed via the Extensions > Store (Community Store); Magento's core code pool corresponds to the Shopware Platform itself. 'Attribute Sets' (Catalog > Attributes > Manage Attribute Sets) map to Shopware's 'Custom field sets', which group custom fields into logical collections (the article notes Magento's flat 'Attributes' concept is actually split in Shopware 6 into Custom fields, which extend a product/entity with extra information, and Properties, which are used for variants and storefront filtering). `di.xml` has no documented 1:1 equivalent article in this corpus, but based on Shopware 6's general architecture [from memory] the corresponding mechanism is Symfony's dependency-injection configuration: a plugin/app registers and tags its services in its own `Resources/config/services.xml` (or `services.php`), the same DI container mechanism the corpus shows being used to register data-abstraction-layer entities (developer/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md, which registers a service class tagged `shopware.entity` in `services.php`) — there is no single global `di.xml`, each plugin/bundle ships its own service configuration file that Symfony compiles into the container.","citations":["merchant/content/en/shopware-6/migration-en/magento-keywords/v1-1-0-0.md:1-92","developer/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md:1-80"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=Magento, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=Magento, path=merchant, mode=files"},{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/migration-en/magento-keywords/v1-1-0-0.md"},{"tool":"grep_docs","args":"pattern=services.xml, path=developer, mode=files, maxMatches=5"},{"tool":"grep_docs","args":"pattern=services.xml, path=developer/guides/plugins/plugins/plugin-fundamentals, mode=files"}],"notFoundClaim":false,"memoryClaims":["Shopware 6 plugins/apps register DI services via their own Resources/config/services.xml (or services.php), compiled into the Symfony container, with no single global di.xml equivalent."],"sourceVerdict":"partial"},"edge-07":{"query":"How do I set up Shopware PWA as the storefront for a Shopware 6.7 shop?","category":"edge","option":"mcp-docs","answer":"No documentation for a product literally named \"Shopware PWA\" exists in this corpus: searching the literal string \"Shopware PWA\" returned zero matches in both the developer docs and the merchant docs. The corpus's current headless-frontend offering is called \"Composable Frontends\" (previously also referred to in places as Frontends), documented under developer/products/paas/shopware/composable-frontends/index.md and referenced from developer/concepts/api/store-api.md as 'Shopware provides Composable Frontends as a headless frontend implementation based on the Store API.' Composable Frontends are deployed like any Shopware PaaS Native application via an `application.yaml` with `kind: cfe`, a chosen Node.js runtime (22, 24, or 26), listening on port 3000, and exposing a `/api/healthz` liveness/readiness endpoint. I could not find setup instructions specifically for a product named 'Shopware PWA' in this corpus, so I cannot confirm whether that product still exists, has been renamed, or is unsupported on 6.7 -- only that this documentation set does not mention it and instead documents Composable Frontends as the current headless storefront path.","citations":["developer/products/paas/shopware/composable-frontends/index.md:1-60"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=Shopware PWA, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=PWA, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=Composable Frontends, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/products/paas/shopware/composable-frontends/index.md, limit=60"},{"tool":"grep_docs","args":"pattern=Shopware PWA, path=merchant, mode=files"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"edge-08":{"query":"Which service do I type-hint to read products — `EntityRepositoryInterface` — and how do I inject it into my plugin service?","category":"edge","option":"mcp-docs","answer":"The premise in the query is slightly off: current Shopware 6 docs type-hint `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository` (not an `EntityRepositoryInterface`) to read products. To inject it into a plugin service: register the entity's repository service (naming pattern `entity_name.repository`, e.g. `product.repository`) as a constructor argument in your service definition (`src/Resources/config/services.php`), e.g. `$services->set(ReadingData::class)->args([service('product.repository')]);`, then type-hint the constructor parameter as `EntityRepository $productRepository` in your service class. You can then call `$this->productRepository->search(new Criteria(), $context)` to read products.","citations":["developer/guides/plugins/plugins/framework/data-handling/reading-data.md:1-390"],"toolCallLog":[{"tool":"kb_status","args":"{}"},{"tool":"read_doc","args":"path=developer/index.md"},{"tool":"grep_docs","args":"pattern=EntityRepository $productRepository, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/data-handling/reading-data.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"edge-09":{"query":"Where do I configure Business Events so that a mail is sent when an order is placed in Shopware 6.7?","category":"edge","option":"mcp-docs","answer":"\"Business Events\" (the old Settings > Shop section) was replaced by the Flow Builder as of major release 6.4.8.0; Business Events continues to exist only for the B2B Suite. In Shopware 6.7 you configure this under Settings > Automation > Flow Builder. Create a new flow, choose the trigger `checkout.order.placed` (\"Triggers when an order is placed\"), optionally add conditions from the Rule Builder, and add the action \"Send mail\", where you pick a reply-to address, a recipient (administrator, customer, or custom email addresses), the email template to send, and any documents to attach.","citations":["merchant/content/en/shopware-6/settings/Business-Events/v1-0-0.md:1-62","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:1-327"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=business event, path=merchant, mode=files"},{"tool":"list_docs","args":"path=merchant/content/en/shopware-6, glob=**/*flow*"},{"tool":"list_docs","args":"path=merchant/content/en/shopware-6/settings/Flow-Builder"},{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/settings/Business-Events/v1-0-0.md"},{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-01":{"query":"How do I create a product with variants and configure its visibility per sales channel, and why might it not show up in the storefront?","category":"func","option":"mcp-docs","answer":"To create variants: after saving a base product, open the 'Variants' tab and use the Variant Generator. Under 'Select values' choose the property (e.g. colour, size) to base variants on and activate the desired options via checkboxes; you can define price surcharges per option before generating, and use 'Value exclusion' to exclude specific combinations (e.g. no blue in size L) using AND-linked rules similar to the Rule Builder. Clicking 'Generate variants' creates all combinations, shown in a sortable table (by name, price, stock, product number, active). You can then set the storefront display order of properties/options and assign per-variant images, and choose a listing presentation mode: 'Single main variant' (product shown without a preselected variant, or with 'Single Variant' preselected via a dropdown that can be added straight to cart from the listing) or 'Fan out properties in product list' to show each property-value combination as its own listing entry. Individual variants can have inheritance from the main product removed (via the chain icon) to set custom name/description/price/stock/etc., and 'Bulk edit' lets you change many variants at once with Overwrite/Clear/Add/Remove modes.\n\nFor visibility: in the product's 'General > Visibility & structure' section you assign the product to one or more 'Sales channels', and check 'Active for all selected sales channels' to control whether it is displayed and purchasable in the storefront. 'Categories' assigns the product to category trees so it appears there. 'Configure extended visibility' lets you set per-product search/listing behavior: default 'Visible' (shown in both search and listing), 'Hide in listing' (still findable via search), or 'Hide in listing and search' (only reachable via the direct product URL).\n\nReasons a product might not show up in the storefront include: the product is not assigned to the relevant sales channel, 'Active for all selected sales channels' is unchecked, it isn't assigned to any category shown in navigation, extended visibility is set to hide it from listing/search, its release date is in the future (blocks purchase until reached), required fields/price/stock weren't set, or (for clearance-sale items) stock has been depleted.","citations":["merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md:1-682"],"toolCallLog":[{"tool":"list_docs","args":"path=merchant/content/en/shopware-6/catalogues/products, depth=3"},{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-02":{"query":"How do Rule Builder conditions work for shipping and payment methods?","category":"func","option":"mcp-docs","answer":"Shopware's Rule Builder (Settings > Automation > Rule Builder) lets you define rules made of general information (name, description, priority, type, tags) and conditions. Each condition consists of: a Condition (the parameter to query, e.g. 'Applied shipping method' or 'Applied payment method'), an Operator (e.g. Is equal to, Is one of, Is greater than, etc.), and an Input value; multiple conditions can be linked with AND (all must be true) or OR (at least one must be true), and switching between AND/OR automatically creates subconditions for nested logic. In the 'Shopping cart' condition group there are explicit conditions 'Applied shipping method' (multi-selection, compares a specific shipping method e.g. 'Express' with the one used in the evaluation context) and 'Applied payment method' (multi-selection, compares a specific payment method e.g. 'Invoice' with the one used). You can also condition on 'Shipping costs' amount. To actually gate which shipping/payment methods are offered at checkout, a rule is assigned in the shipping method's or payment method's own configuration as its 'Availability rule' — the Rule Builder's Assignments tab (per rule) shows every place a rule is currently used, including 'Availability of payment methods', 'Availability of shipping methods', and 'Calculation of shipping costs' (shipping price matrices), and lets you navigate directly to the relevant shipping/payment method configuration. A rule with priority X is evaluated before rules of lower priority. Preview mode (Rise plan and higher) lets you test a rule's conditions against real order data before saving.","citations":["merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md:1-274"],"toolCallLog":[{"tool":"list_docs","args":"path=merchant/content/en/shopware-6/settings/rules"},{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-03":{"query":"How do promotions and discount codes work, including individually generated codes?","category":"func","option":"mcp-docs","answer":"Promotions are created under Marketing > Promotions > Create action. General settings include name, priority (higher priority applied first when several rules apply), valid from/until, max. total uses, max. uses per customer, and an Active switch. 'Promotion codes' controls redemption: 'No promotional code required' applies the discount automatically once conditions are met; 'Fixed promotion code' lets you set one shared code (e.g. EASTER21) for everyone, or auto-generate a random one; 'Individual promotion codes' generates a unique code per use, each redeemable only once — the code list shows which codes have been redeemed and by whom. To generate individual codes, click 'generate codes' and configure: code length (number of random characters), optional prefix/suffix, or a 'custom pattern' using %s for a random letter and %d for a random digit (e.g. SW-%s%d%s%d%s-TEST), with a live preview, then set the number of codes to generate. Regenerating codes invalidates the previous ones. Only one individual code from a given promotion can be applied per order.\n\nThe Conditions tab restricts when a promotion is valid: general conditions include which sales channels it applies to and whether to prevent combination with other promotions (with a 'do not combine with' list). Rule-based conditions use the Rule Builder for customer rules (who qualifies), shopping cart rules (e.g. cart total >= 100€), order rules (e.g. specific payment/shipping methods), and 'Promote sets of products' (set groups defined by mode [number/gross value/net value], value, sort order, and product rules) for combo promotions like '3 for 2'. If multiple rules of the same type are selected, only one needs to trigger.\n\nThe Discounts tab defines what is discounted: 'Apply to' (entire cart, shipping costs, entire product set, or a specific set group), optionally restricted to specific products via product rules, sorting, and 'apply to Nth item'; discount 'Type' is absolute, percentage, fixed price, or fixed unit price, with a Value and (for percentage) an optional maximum discount value cap; multiple discounts can run on one promotion. Discount settings can't be changed once the promotion has been used in an order.\n\nIn the storefront, if a code is required, the customer enters it in the 'Enter voucher code' field in the OffCanvas or full shopping cart and confirms; the applied discount then appears in the cart's article overview. Redeemed individual codes can be traced back to the order under Marketing > Promotions (see 'Redeemed') or filtered in the order overview by 'promotion code'.","citations":["merchant/content/en/shopware-6/marketing/promotions/v1-7-0-0.md:1-303"],"toolCallLog":[{"tool":"list_docs","args":"path=merchant/content/en/shopware-6/marketing/promotions"},{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/marketing/promotions/v1-7-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-04":{"query":"What does the Shopware Migration Assistant transfer automatically from Shopware 5, and what has to be mapped by hand before the migration starts?","category":"func","option":"mcp-docs","answer":"To migrate from Shopware 5, you install the Migration Assistant extension in both the Shopware 5 source shop and the Shopware 6 target shop, then create a connection (Settings > Extensions > Migration in Shopware 6) using either an API connection (API key + username of a Shopware 5 admin user in the 'local_admins' group, plus shop domain) or a Local/direct DB connection (DB host, port, user, password, DB name, installation root path).\n\nAfter the connection is established you reach the migration overview, where you pick which data to migrate ('Data selection' — the list shows whether each entry is shop data or third-party extension/plugin data, and how many records will be migrated). The wizard then runs a 'Data check': it automatically tries to match data from the old shop to the new shop. Automatic writing (the 'Writing' step of the actual migration) creates customer groups, categories, languages, currencies and sales channels in Shopware 6 automatically if they don't already exist, and all read data gets a checksum so unchanged data isn't migrated twice on repeat runs.\n\nWhat must be mapped/assigned by hand: anything the automatic data check could not match correctly — the example given is the standard payment type. When such unassigned data is found, migration cannot continue until you manually assign it in the 'Processed assignments' screen; only once everything is assigned can you click Continue. Third-party extensions may also require their own migration profile handled by the extension provider rather than automatic mapping. Separately (independent of manual assignment), some Shopware 5 metadata is truncated automatically during migration because the underlying column type changes from mediumtext to varchar(255) — affecting s_article.description and s_categories.metadescription/metakeywords, which get cut off after 255 characters; this is not something you map, just something to be aware of before migrating. Also note: connection names must not contain hyphens, since Shopware 5 free-text fields are migrated as custom fields named after the connection, and a hyphen breaks their storefront display.\n\nThe full migration then proceeds through six steps: Data reading, Error resolution (a 'smart pause' where you can fix inconsistent records directly in the admin instead of the whole migration failing), Writing, Media downloading, Cleanup, and Indexing.","citations":["merchant/content/en/shopware-6/migration-en/Migrationprocess/v1-1-0-0.md:1-84","merchant/content/en/shopware-6/migration-en/shopware6-Migrationsprocess/v1-1-0-0.md:1-160"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=Migration Assistant, path=merchant, mode=files"},{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/migration-en/Migrationprocess/v1-1-0-0.md"},{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/migration-en/shopware6-Migrationsprocess/v1-1-0-0.md"},{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/migration-en/index.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"func-05":{"query":"How do I set up a sales channel — storefront versus headless type, domains, languages and currencies — and where do I get its API access key?","category":"func","option":"mcp-docs","answer":"In Shopware Administration, go to the 'Sales Channel' menu item and click the plus icon to add one. In the pop-up you choose the type: a 'Sales Channel with HTML storefront', a 'headless sales channel' (API-only, no storefront), or a product comparison export (for comparison portals/marketplaces).\n\nGeneral settings for the new channel include: Name (internal identifier), 'Mark Sales Channel as favourite' (shows it in the admin sidebar), entry-point categories for main navigation / footer navigation / service navigation, default Customer group (assigned to new/anonymous visitors), Countries available in the channel plus a default country, Languages available plus a default language, and standard units of measurement.\n\nPayment and shipping settings let you pick which payment methods and shipping methods are available in the channel (each with a default), which Currencies are available (with a default — editable centrally under Settings > Localisation > Currencies), and how tax is calculated for orders in this channel.\n\nDomains: for a self-hosted instance, under 'Domain' you can add multiple domains, each with its own virtual URL, language, currency, snippet set and unit system — useful for running several language shops off one sales channel (recommended to use only http or only https consistently to avoid duplicate content). For a cloud instance, a URL is auto-generated on creation; to use a custom domain you first add it under Settings > System > Domains, then attach it via 'Add domain', selecting its language, currency, snippet set, and hreflang localisation mode (ISO standard or browser language) — cloud domains are always forwarded to https server-side. The Hreflang tab lets you pick a default fallback domain when multiple language versions exist, to avoid Google flagging duplicate content.\n\nAPI access: under the 'API access' section of the sales channel settings you can generate an API Access ID for that specific sales channel (the docs point to the developer documentation on the Sales Channel API for how to use it).\n\nOther tabs: 'Status' lets you disable the channel or put it in maintenance mode with an IP whitelist; 'Products' lets you assign products/categories/dynamic product groups directly to the channel; 'Theme' assigns a storefront theme; 'Analytics' configures Google Analytics 4 tracking; 'Agentic files' manages llms.txt/agents.md/ai-catalog.json. The preinstalled Headless sales channel should never be deleted, since many extensions (e.g. B2B Suite) rely on it — it can instead be hidden from the sidebar by marking other channels as favourites.","citations":["merchant/content/en/shopware-6/settings/saleschannel/v1-5-2-0.md:1-296"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=sales channel, path=merchant/content/en/shopware-6/settings, mode=files"},{"tool":"list_docs","args":"path=merchant/content/en/shopware-6/settings, glob=**/*sales*channel*"},{"tool":"list_docs","args":"path=merchant/content/en/shopware-6"},{"tool":"list_docs","args":"path=merchant/content/en/shopware-6/settings/saleschannel"},{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/settings/saleschannel/v1-5-2-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-06":{"query":"Which triggers and actions does the Flow Builder offer, and how do I make it send a mail when an order is placed?","category":"func","option":"mcp-docs","answer":"Flow Builder lives under Settings > Automation > Flow Builder. Each flow has a General tab (Name, Description, Priority — for ordering when several flows share a trigger, Active toggle) and a Flow tab where you pick a Trigger, then attach Conditions and Actions via the plus icon.\n\nAvailable triggers include (non-exhaustive list from the docs): checkout.customer.before.login, checkout.customer.login/logout, checkout.customer.register/guest_register, checkout.customer.double_opt_in_guest_order/registration, checkout.customer.deleted, checkout.order.payment_method.changed, checkout.order.placed (order placed), contact_form.send, customer.group.registration.accepted/declined, customer.recovery.request, mail.after.create.message, mail.before.send, mail.sent, newsletter.confirm/register/unsubscribe, product_export.log, review_form.send, user.recovery.request, plus a large family of order/delivery/transaction/capture state_enter.* and state_leave.* triggers (e.g. state_enter.order.state.completed, state_enter.order_transaction.state.paid, etc.). Since 6.5.3.0, apps can also register Custom Triggers, and flows can call out to or be triggered by third-party systems via webhooks.\n\nConditions reuse Rule Builder rules (existing or newly created inline) and branch True/False, each branch able to carry further conditions or actions. Delayed Actions (Beyond plan) let you fire an action after a configured delay (Hour/Day/Week/Month/custom) — useful e.g. for a review-request mail a week after an order.\n\nAvailable actions include: Assign account status (activate/deactivate customer), Assign affiliate and campaign code (with override option), Assign customer group, Generate a document, Send mail, Assign status (payment/shipping/order status, with dependency rules e.g. Refunded requires prior Paid), Stop flow (halts the rest of the flow), Set download access (grant/revoke digital product download), Change custom field content (customer or order entity), Add Tag/Remove Tag. With the Shopware Commercial extension (Evolve plan) a Webhook 'Call URL' action is also available, supporting GET/POST/PUT/PATCH/DELETE, custom parameters, headers, body and Basic Auth.\n\nTo send a mail when an order is placed: create a new flow, select the trigger 'checkout.order.placed', then add the action 'Send mail'. In the Send mail configuration choose a reply-to address, a recipient (Administrator, Customer, and/or one or more custom email addresses — note selecting 'Administrator' emails every admin-flagged user, including external/API-only admin accounts), select the email template to send, and specify whether/which documents to attach.","citations":["merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:1-327"],"toolCallLog":[{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-07":{"query":"How do I import products from a CSV with an import/export profile — column mapping, matching identifiers and a dry run?","category":"func","option":"mcp-docs","answer":"Import/Export lives under Settings > Automation > Import/Export. The CSV file must be UTF-8 encoded, semicolon-separated, with quotation marks as the string/enclosure separator (most spreadsheet tools, e.g. LibreOffice, let you set this on export). Prices must use a dot as the decimal separator (e.g. 5.00), not a comma. Import can only add/update data, never remove existing associations (e.g. it cannot remove a product's existing sales-channel assignment).\n\nProfiles (Settings > Import/Export > Profiles tab) determine which database entries/columns are read or written. You can duplicate an existing (including standard) profile via its context menu, or click 'add new profile' to build one from scratch, optionally seeding it by uploading an existing CSV file whose columns you then map. A profile's General settings include: Profile name, Usage (import, export, or both — import-only profiles cannot be used for export), Object type (which entity/table the profile accesses, e.g. Product, Customer, Category), Separator character (default semicolon), Enclosure character, and Import settings ('Create new records' — allowed when the ID column is left empty — and 'Update existing data' to overwrite existing records).\n\nColumn/database mapping is configured in the profile's Mappings tab: 'Add new mapping' adds a row where you pick a database entry and enter the matching CSV column name (must exactly match the CSV header); you can mark a mapped field as Required, set a Default value to use when the CSV cell is empty, and set its Position (expected column order in the file). Mandatory fields are pre-added automatically for new profiles — for the Product object type these are at minimum id, taxId, productNumber, stock and name (leave 'id' empty when creating new products; it's auto-generated).\n\nMatching identifiers ('Second Unique Identifier', Advanced settings tab of a profile): by default the import matches rows to existing entities via UUID. You can instead choose a different unique identifier — e.g. productNumber instead of the product UUID — so your CSV doesn't need to carry Shopware's internal UUIDs. This is set per entity in the profile's Advanced Settings by picking a new identifier from a dropdown; be careful not to choose a field that isn't actually unique (e.g. product name), since the system will then only recognize/import the first matching record.\n\nDry run: on the Import tab, after selecting the CSV file and the profile, click 'Start dry run' to fully validate the whole file without actually writing anything, so you can catch problems before committing to a real import — this is separate from 'Start import', which performs the real import, keeps the correctly-processed rows, and bundles any erroneous rows into a downloadable CSV of failures. Import Activity keeps a 30-day history of past import runs, including access to the original CSV, the profile used, and any error file.","citations":["merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md:1-80","merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md:81-200"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=import.export, path=merchant/content/en/shopware-6, mode=files, regex=true"},{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md (limit=80)"},{"tool":"grep_docs","args":"pattern=identifier, path=merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md, context=2"},{"tool":"grep_docs","args":"pattern=mapping, path=merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md, context=2"},{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md, offset=81, limit=120"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-08":{"query":"How do custom field sets work — entity assignment, field types and technical name — and can a custom field be written through the Store API?","category":"func","option":"mcp-docs","answer":"Custom fields (Settings > System > Custom fields) let you add your own fields to areas like products or categories, usable in the Rule Builder or shown in the storefront. Custom fields should be edited in the store's default language, since that's what other languages inherit from; only override per language when you deliberately want a different value there — otherwise a rule relying on that field may fail to apply in non-default languages.\n\nCustom fields are organized into 'sets': each set can bundle several thematically related fields and is then assigned to one or more program areas (e.g. products, categories) via the 'New set' dialog. A set requires a unique technical name (cannot be changed afterwards), a Position (determines display order — higher numeric value = further back), and an optional Label per administration language. You must select at least one program area for the set to actually be usable anywhere; if none is chosen the set exists but appears nowhere.\n\nWithin a set you create individual custom fields ('New custom field'). Every field type requires a unique Technical name (cannot be changed later) and generally supports Position, Required, Label, and (for most types) Help text and/or Placeholder. Available field types: Select (single or multi-select from defined options, each option also needing its own technical name and label), Object selection (direct reference to another entity — dynamic product group, experience world, manufacturer, category, customer, country, delivery method, product, sales channel, or payment method; the object type can't be changed after creation; can allow single or multiple selection), Text field, Media (attach a media file, shown via template customization), Number (integer or float, with step/min/max), Date/Time, Checkbox, Active/Inactive switch (boolean 0/1), Text Editor (rich/styled text), and Color picker (palette or HEX code). Custom fields must avoid Twig special characters like '-' or '#' in their technical names, or product exports can break. Creating a field auto-generates its snippet across all snippet sets — no database changes needed.\n\nStore API writability: yes — every custom field type includes a 'Modifiable via Store API' option. When enabled, the field is made 'public', meaning the Store API is allowed to read AND write it (e.g. to let a storefront form, such as an extended registration form, save custom data into that field). The docs explicitly warn not to enable this for fields holding sensitive/critical information (e.g. customer data), since anyone with Store API access could then read it.","citations":["merchant/content/en/shopware-6/settings/custom-fields/v1-3-1.md:1-235"],"toolCallLog":[{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/settings/custom-fields/v1-3-1.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-09":{"query":"Why doesn't my payment method appear in the checkout — what has to be configured in the administration?","category":"func","option":"mcp-docs","answer":"Payment methods are managed under Settings > Commerce > Payment methods. By default only Cash on delivery, Invoice, Prepayment and Direct debit are activated, but activating a payment method does not automatically make it available to customers in the storefront — there are two more prerequisites that commonly cause a method to be 'missing' at checkout:\n\n1. Sales channel assignment: the payment method must be explicitly assigned in the relevant sales channel's 'Payment and shipping' settings (Settings > Sales Channel > [your channel] > Payment methods). A method that is Active globally but not selected for that sales channel simply won't show up there.\n\n2. Availability rule: each payment method can have an 'Availability rule' built with the Rule Builder that restricts when it's offered (e.g. only for certain customer groups, cart totals, countries, etc.). If an availability rule is set and the current cart/customer/order context doesn't satisfy it, the method is hidden at checkout even though it's active and assigned to the sales channel. For a payment method that should always be available without restriction, the availability rule field should be left blank (NULL).\n\nOther configuration to check: the method's own 'Active' toggle must be on; and 'Allow change of payment method after order completion' only affects whether customers can switch to/from this method after the order is placed (in their account), not initial checkout visibility. Also worth checking the technical name hasn't been changed after installation, since altering a payment method's technical name can render it inoperable (the docs recommend leaving it to the extension's own updates, or setting it immediately if self-created).","citations":["merchant/content/en/shopware-6/settings/Paymentmethods/v1-4-0-0.md:1-57"],"toolCallLog":[{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/settings/Paymentmethods/v1-4-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-10":{"query":"How do dynamic product groups work in the administration and where can the resulting group be used?","category":"func","option":"mcp-docs","answer":"Dynamic product groups are managed in the admin under Catalogues > Dynamic product groups. Each group is created with a Name and optional Description, plus a 'Keep matching variants grouped' toggle that controls whether matching variants display grouped under a shared main product or individually (affecting categories, cross-selling, and CMS product sliders). Membership is defined in a Conditions module built on the Rule Builder: you pick a property and a condition/operator (Is equal to, Is not equal to, Is equal to any of, Is not equal to any of, Is equal to all of, Is not equal to all of), and can combine conditions with AND/OR logic and nested sub-conditions; a Preview button shows which products currently match. Conditions can be based on products, categories, manufacturers, tags, properties/property values, price, stock, custom fields, or delivery time. The overview lists all created groups with name, description, last-changed date, and a status showing whether the group's rules are still valid (e.g. it becomes invalid if it depends on a now-deactivated plugin); groups can be edited, duplicated, or deleted from there. Once created, a dynamic product group can be assigned/used in three places: (1) Categories - to dynamically fill a category's product content (e.g. for sale or manufacturer-specific categories) by setting the category's Type to 'Dynamic product group' and selecting the group; (2) Product comparison - to feed the product comparison feed with content; (3) Shopping Experiences - via the product slider element in the Commerce block category, to fill product sliders.","citations":["merchant/content/en/shopware-6/shopware-6-de/Catalogues/Dynamicproductgroups/v1-3-0-0.md:1-149","merchant/content/en/shopware-6/catalogues/categories/v1-3-1.md:115-119"],"toolCallLog":[{"tool":"kb_status","args":"{}"},{"tool":"read_doc","args":"path=merchant/index.md"},{"tool":"read_doc","args":"path=developer/index.md"},{"tool":"grep_docs","args":"pattern=dynamic product group, path=merchant, mode=files"},{"tool":"list_docs","args":"path=merchant/content/en/shopware-6/catalogues/products, glob=**/*4-2*"},{"tool":"grep_docs","args":"pattern=dynamic product group, path=merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md, context=2"},{"tool":"list_docs","args":"path=merchant/content/en/shopware-6/catalogues, depth=2"},{"tool":"grep_docs","args":"pattern=Dynamic product group, path=merchant/content/en/shopware-6/catalogues/categories/v1-3-1.md, context=3"},{"tool":"list_docs","args":"path=merchant, glob=**/*ynamicproduct*"},{"tool":"list_docs","args":"path=merchant/content/en/shopware-6/shopware-6-de/Catalogues/Dynamicproductgroups"},{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/shopware-6-de/Catalogues/Dynamicproductgroups/v1-3-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-11":{"query":"How do I create an integration for Admin API access in the administration and give it the right privileges?","category":"func","option":"mcp-docs","answer":"Go to Settings > System > Integrations in the Shopware admin and click 'Create integration'. Assign it a name, then either grant it the permissions of the administrator, or (recommended for scoped access) pick a specific role from a dropdown of roles already defined under Settings > System > Users & Permissions > Roles. Saving the integration then displays an access ID and a security key; the security key is shown only once, so it must be saved immediately (it can later be regenerated via 'Regenerate API access key', which rotates both the key and the access ID). To give it the right privileges, first create/edit a Role under Settings > System > Users & Permissions: in the Authorisations tab you tick per-admin-area checkboxes for View, Edit, Create, Delete, or All (permissions build left-to-right: Edit implies View, Create implies Edit+View; Delete only implies View). There are also 'Additional permissions' for cross-cutting rights not tied to one area (e.g. Basic configurations, Run Updates, Maintain/Upload extensions, Logging, Clear cache, Import/Export, Shopware Store, Update own profile, Create discounts, Apps). For fine-grained cases (e.g. custom entities added by extensions without proper privileges), a Detailed permissions tab lets you assign read/write/create/delete by technical/technical-name permission. Once the role has the desired privileges, assign that role to the integration when creating or editing it, and the integration's API access will be limited to that role's privileges.","citations":["merchant/content/en/shopware-6/settings/system/integrationen/v1-1-0.md:1-35","merchant/content/en/shopware-6/settings/system/user/v1-3-0.md:61-155"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=integration, path=merchant, mode=files, glob=**/settings/**"},{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/settings/system/integrationen/v1-1-0.md"},{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/settings/system/user/v1-3-0.md, section=roles"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-12":{"query":"A spec asks for customer-specific pricing and for a flow that calls an external URL when an order is placed — before I build either of them, does Shopware already ship them, and what has to be licensed or installed for them to exist in the shop?","category":"func","option":"mcp-docs","answer":"Both already exist as shipped/paid features — you would not need to build them from scratch, but neither is available on a plain/base Shopware installation. Customer-specific pricing: available from the Shopware Beyond plan via the Shopware Commercial extension. It lets you offer individually calculated prices (list, graduated, or currency-dependent) per customer; prices are pushed in via a dedicated bulk-edit Admin API (e.g. from an ERP) — there is no admin-UI module and no separate store extension to install beyond enabling Shopware Commercial, since creating/reading/updating/deleting custom prices is API-only. Requirements: a Shopware Beyond plan plus the Shopware Commercial extension. Calling an external URL when an order is placed: this is the Flow Builder's 'Call URL (Webhook)' action (Settings > Automation > Flow Builder), which lets you fire GET/POST/PUT/PATCH/DELETE requests to a URL with parameters, headers and a body when a chosen trigger (such as an order placed event) fires. This Webhook Actions extension to Flow Builder is available from the Evolve plan onward and likewise requires the Shopware Commercial extension to be installed/enabled. So for the spec, both features require licensing the appropriate Commercial plan (Beyond for customer-specific pricing, Evolve or higher for Webhook flow actions) and having the Shopware Commercial extension installed — no custom development is needed for the core capability itself, only for the ERP-side integration and the specific webhook payload/trigger configuration.","citations":["merchant/content/en/shopware-6/extensions/customer-specific-pricing/v1-0-0-1.md:1-34","merchant/content/en/shopware-6/features/customer-specific-pricing/v1-0-0-0.md:1-14","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:245-289"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=customer-specific price, path=merchant, mode=files"},{"tool":"grep_docs","args":"pattern=call external URL, path=merchant, mode=files"},{"tool":"grep_docs","args":"pattern=customer-specific, path=merchant, mode=files"},{"tool":"grep_docs","args":"pattern=webhook, path=merchant, mode=files"},{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/extensions/customer-specific-pricing/v1-0-0-1.md"},{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/features/customer-specific-pricing/v1-0-0-0.md"},{"tool":"list_docs","args":"path=merchant/content/en/shopware-6/settings/Flow-Builder"},{"tool":"grep_docs","args":"pattern=URL, path=merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md, context=3"},{"tool":"read_doc","args":"path=merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md, offset=245, limit=45"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-01":{"query":"How do I add my own Admin API endpoint under `/api/...` from a plugin — a controller with the api route scope and its ACL?","category":"gap","option":"mcp-docs","answer":"No single dedicated guide for a plugin 'Admin API controller' was found in this corpus (only Store API and Storefront controller guides exist as worked examples), but the pieces to build one are documented in two places. Route scope and ACL are both configured via the `defaults` array of the Symfony `#[Route]` attribute on the controller (this replaced the old `@RouteScope`/`@Acl` annotations, deprecated for removal in 6.5.0): `@RouteScope` -> `_routeScope`, and `@Acl` -> `_acl` (developer/resources/references/adr/2022-02-09-controller-configuration-route-defaults.md). So an Admin API controller method would use `#[Route(path: '/api/example', name: 'api.example', methods: ['GET'], defaults: ['_routeScope' => ['api'], '_acl' => ['my_key:read']])]` (by analogy with the documented Storefront pattern `defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]]`, using the `api` route scope id instead — this specific `api` scope class name/id was not directly located in the corpus, only the `_routeScope`/`_acl` mechanism). For the ACL side: register the privilege identifier (e.g. `my_key:read`) via the Administration privilege service `Shopware.Service('privileges').addPrivilegeMappingEntry(...)`, and note the privilege strings placed under `privileges` (structure `entity_name:operation`, e.g. `product:read`) are the actual API permissions checked — these are what you'd put in your controller's `_acl` default so only users/integrations with that privilege can call the endpoint (developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md). You also need a `routes.php` importing your controller class by attribute (as shown for Storefront controllers) and to register the controller as a public service in `services.php`.","citations":["developer/resources/references/adr/2022-02-09-controller-configuration-route-defaults.md:1-60","developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:1-447","developer/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:1-324"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=api-route-scope, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=RouteScope(\"api\"), path=developer, mode=files"},{"tool":"list_docs","args":"path=developer, glob=**/*admin-api*"},{"tool":"grep_docs","args":"pattern=route scope, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/storefront/controllers/add-custom-controller.md"},{"tool":"grep_docs","args":"pattern=acl, path=developer/guides/plugins/plugins/framework, mode=files"},{"tool":"grep_docs","args":"pattern=ApiRouteScope, path=developer, mode=files"},{"tool":"list_docs","args":"path=developer/guides/plugins/plugins/framework"},{"tool":"grep_docs","args":"pattern=add-acl-rules|acl-privileges|admin-api-route|api_action, path=developer, regex=true, mode=files"},{"tool":"list_docs","args":"path=developer/guides/plugins/plugins/administration"},{"tool":"grep_docs","args":"pattern=ApiRouteScope::ID, path=developer, mode=content"},{"tool":"grep_docs","args":"pattern=custom-endpoint, path=developer/guides/plugins, mode=files"},{"tool":"grep_docs","args":"pattern=Administration\\\\Controller|Api\\\\Controller, path=developer, regex=true, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"},{"tool":"grep_docs","args":"pattern=route-scope|RouteScope, path=developer/resources/references, regex=true, mode=files"},{"tool":"grep_docs","args":"pattern=ApiRouteScope, path=developer, mode=content"},{"tool":"read_doc","args":"path=developer/resources/references/adr/2022-02-09-controller-configuration-route-defaults.md"}],"notFoundClaim":true,"memoryClaims":["The Admin API route scope class is typically `Shopware\\Core\\Framework\\Api\\Acl\\Role\\...` / route scope id `api` (e.g. via `Shopware\\Core\\Framework\\Routing\\Annotation\\RouteScope` historically `AdministrationRouteScope`); exact current class name not confirmed in this corpus."],"sourceVerdict":"partial"},"gap-02":{"query":"Shopware 6.7 removed the RSA JWT key files and `system:generate-jwt-secret` — what signs Admin API tokens now, and what do I have to do when upgrading?","category":"gap","option":"mcp-docs","answer":"Not found: no page in this corpus documents removal of the RSA JWT key files or a `system:generate-jwt-secret` command in 6.7, nor what replaces RSA signing for Admin API tokens. What the corpus does say points the other way and is not 6.7-specific: the CLI helper-commands reference states JWT private/public key generation via `shopware-cli project generate-jwt` (which stores keys in `<project>/config/jwt/`) is 'Required only for Shopware versions before 6.5; in 6.5+, JWT secrets are generated automatically' (developer/products/tools/cli/project-commands/helper-commands.md:220-250), and the Deployer guide still lists `config/jwt` as a shared/writable directory to back up and restore during deployments, with a `sw:writable:jwt` task, without noting any 6.7 removal (developer/guides/hosting/installation-updates/deployments/deployment-with-deployer.md:180-319). No upgrade guide, environment-variables reference, or ADR located in this corpus mentions a 6.7-specific change to Admin API token signing (e.g. dropping RSA key files or a `system:generate-jwt-secret` command). I could not confirm the premise of the query against this corpus.","citations":["developer/products/tools/cli/project-commands/helper-commands.md:220-250","developer/guides/hosting/installation-updates/deployments/deployment-with-deployer.md:180-319"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=jwt, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=generate-jwt-secret, path=developer, mode=files"},{"tool":"list_docs","args":"path=developer, glob=**/*upgrade*"},{"tool":"grep_docs","args":"pattern=jwt, path=developer, mode=content, caseSensitive=false"},{"tool":"grep_docs","args":"pattern=jwt, path=developer/guides/upgrades-migrations, mode=content"},{"tool":"grep_docs","args":"pattern=oauth, path=developer/guides/upgrades-migrations, mode=content"},{"tool":"read_doc","args":"path=developer/guides/upgrades-migrations/upgrade-shopware.md"},{"tool":"grep_docs","args":"pattern=jwt, path=developer/resources/references/core-reference/commands-reference.md, mode=content"},{"tool":"grep_docs","args":"pattern=6.7.0.0, path=developer, regex=true, mode=files"},{"tool":"grep_docs","args":"pattern=APP_SECRET|app secret, path=developer, regex=true, mode=files"},{"tool":"read_doc","args":"path=developer/guides/hosting/configurations/shopware/environment-variables.md"},{"tool":"grep_docs","args":"pattern=config/jwt, path=developer, mode=content"},{"tool":"grep_docs","args":"pattern=HMAC|symmetric key|signing key, path=developer, regex=true, mode=files"},{"tool":"read_doc","args":"path=developer/guides/hosting/installation-updates/deployments/deployment-with-deployer.md, offset=180, limit=140"},{"tool":"read_doc","args":"path=developer/products/tools/cli/project-commands/helper-commands.md, offset=220, limit=40"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"gap-03":{"query":"My ERP integration stopped logging in after the 6.7 upgrade — what changed in the Admin API OAuth flow (`/api/oauth/authorize`, the `scope` format)?","category":"gap","option":"mcp-docs","answer":"Not found: this corpus documents no `/api/oauth/authorize` endpoint at all (only `/api/oauth/token` for `client_credentials` and, for local dev only, `password` grants), and no page mentions any 6.7-specific change to the Admin API OAuth flow or to the `scope`/`scopes` parameter format. What is documented (not tied to a version) is: get a token via `POST /api/oauth/token` with JSON body `{grant_type: client_credentials, client_id, client_secret}` using an integration's Access key ID/Secret access key (developer/guides/development/integrations-api/index.md:1-170), and, for local development only, a `password` grant against `/api/oauth/token` with a field literally named `scopes` (e.g. `\"scopes\": \"write\"`) (developer/guides/development/integrations-api/auth-api-requests.md:1-143). Neither of these mentions an `/authorize` endpoint or a 6.7 breaking change to the OAuth flow. I could not confirm the premise of the query (that 6.7 changed the OAuth authorize endpoint or scope format) against this corpus.","citations":["developer/guides/development/integrations-api/index.md:1-170","developer/guides/development/integrations-api/auth-api-requests.md:1-143"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=oauth, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=/api/oauth/, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/development/integrations-api/auth-api-requests.md"},{"tool":"read_doc","args":"path=developer/guides/development/integrations-api/index.md"},{"tool":"grep_docs","args":"pattern=authorize, path=developer, mode=content"},{"tool":"grep_docs","args":"pattern=\"scope\"|scopes\\b, path=developer/guides/development/integrations-api, regex=true, mode=content"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"gap-04":{"query":"After upgrading to 6.7 my plugin fatals on load because core class properties now have native PHP types — which properties must I retype in my subclasses?","category":"gap","option":"mcp-docs","answer":"Not found: no page in this corpus lists which core class properties gained native PHP types in 6.7, or gives a migration list of properties plugin subclasses must retype. The Upgrades and Migrations index describes 'Core' upgrades generically as covering 'Framework-level changes, data abstraction layer (DAL) updates, APIs, feature removals, and backend behavior' and points to the external `UPGRADE-6.7.md`/`RELEASE_INFO-6.7.md` files on GitHub for the concrete breaking-change list, but does not reproduce that list itself (developer/guides/upgrades-migrations/index.md:1-94). No dedicated guide about typed properties, strict types, or core class property signatures for 6.7 was found via search. I could not confirm the specifics of this claim against this corpus; the corpus's own advice is to consult the external `UPGRADE-6.7.md` file on the shopware/shopware GitHub repository for the exact list.","citations":["developer/guides/upgrades-migrations/index.md:1-94"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=native type, path=developer, mode=files"},{"tool":"list_docs","args":"path=developer/guides/upgrades-migrations"},{"tool":"grep_docs","args":"pattern=typed propert, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=entity extension|property type, path=developer/guides/upgrades-migrations, regex=true, mode=files"},{"tool":"read_doc","args":"path=developer/guides/upgrades-migrations/index.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"gap-05":{"query":"My plugin decorates `CachedProductRoute` to add cache tags — where did the `Cached*Route` classes go in Shopware 6.7 and how do I cache a Store API route now?","category":"gap","option":"mcp-docs","answer":"Two ADRs in this corpus describe the new HTTP cache model that replaces the old `Cached*Route` decorator pattern (they don't literally say 'CachedProductRoute was removed', but describe the reworked caching mechanism). Per 'Improved HTTP Cache Layer' (2025-11-03): the cache layer is being reworked so caching works for both Storefront and Store API, using route-level configurable caching policies (moved out of code into configuration) instead of hardcoded per-route `Cached*Route` decorators, a single `sw-cache-hash` header/cookie replaces the old cookie-based state, and only cache-relevant rule ids are included in the cache hash. Store-API routes will be cached by default; this whole set of breaking changes can currently be opted into via the `CACHE_REWORK` feature flag (developer/resources/references/adr/2025-11-03-improved-http-cache-layer.md:1-81). The companion 'Caching Strategy for Store API' ADR (2025-09-15) gives the concrete mechanism to cache a Store API route now: mark the route cacheable via the `'_httpCache' => true` route-defaults attribute (the same attribute Storefront already uses), which `CacheResponseSubscriber` (extended to also handle Store API) turns into a `Cache-Control` header (default `public, max-age=0, s-maxage=1800, stale-while-revalidate=86400, stale-if-error=7200` for cacheable routes, `no-cache, private` otherwise); context differentiation is done via headers/`Vary` (`sw-currency-id`, `sw-language-id`, `sw-context-hash`) instead of cookies; and cache invalidation still reuses the existing cache-tag mechanism — the ADR states explicitly 'Extensions can opt into caching using the same route flags,' i.e. a custom/decorated Store API route should just set `_httpCache => true` (and add cache tags via the existing tag mechanism) rather than decorating a dedicated `Cached*Route` class (developer/resources/references/adr/2025-09-15-store-api-cache-strategy.md:1-118).","citations":["developer/resources/references/adr/2025-11-03-improved-http-cache-layer.md:1-81","developer/resources/references/adr/2025-09-15-store-api-cache-strategy.md:1-118"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=CachedProductRoute|Cached.*Route, path=developer, regex=true, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/caching"},{"tool":"read_doc","args":"path=developer/resources/references/adr/2025-11-03-improved-http-cache-layer.md"},{"tool":"grep_docs","args":"pattern=store-api-cache-strategy, path=developer/resources/references/adr, mode=files"},{"tool":"read_doc","args":"path=developer/resources/references/adr/2025-09-15-store-api-cache-strategy.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"gap-06":{"query":"How do I create a shipping method from my plugin's installer or migration, including the `technicalName` that 6.7 requires?","category":"gap","option":"mcp-docs","answer":"This corpus does not have a dedicated 'Add Shipping Method' guide, but two sources together answer the question. The ADR 'Introduction of Unique Identifiers for Checkout Methods' (2023-10-17) explains the `technicalName` requirement: a new `technicalName` property was added to both the `payment_method` and `shipping_method` entities to uniquely identify them; it was optional in the database/API at first (mandatory only in the Administration) but 'Starting from version 6.7.0.0, this `technicalName` field will also become required within the database and the API.' For Shopware's own default shipping methods it is auto-generated (Standard -> `shipping_standard`, Express -> `shipping_express`), and for app-provided methods it's generated as `shipping_{AppName}_{identifier}` (e.g. `shipping_MyApp_my_shipping_method`); the ADR concludes 'Plugin developers will be required to supply a `technicalName` for their payment and shipping methods, at least beginning with version 6.7.0.0' (developer/resources/references/adr/2023-10-17-add-unique-identifiers-for-checkout-methods.md:1-52). The concrete plugin-installer pattern is documented for the analogous `payment_method` entity in the 'Add Payment Plugin' guide, and the same pattern applies to `shipping_method`: in your plugin's `install()` (or a migration), get the repository service (`payment_method.repository` in the documented example; by analogy `shipping_method.repository` for shipping) and call `->create([...], $context)` with your method's data, including a `technicalName` key using a plugin-specific prefix (the guide's example: `'technicalName' => 'swag_example-example_payment'`). Its warning states this is 'required for plugin-provided payment methods starting with Shopware 6.7 ... must be unique and should use a plugin-specific prefix ... An omitted technical name can prevent the plugin from being installed or activated' (developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:1-846). Only deactivate (never delete) the method in `uninstall()` to avoid breaking historical orders, following the same pattern shown for payment methods.","citations":["developer/resources/references/adr/2023-10-17-add-unique-identifiers-for-checkout-methods.md:1-52","developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:1-846"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=shipping_method.repository, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=technicalName, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=shipping, path=developer/resources/references/adr/2023-10-17-add-unique-identifiers-for-checkout-methods.md, mode=content"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"},{"tool":"read_doc","args":"path=developer/resources/references/adr/2023-10-17-add-unique-identifiers-for-checkout-methods.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"gap-07":{"query":"How do I create a media entity from a file on disk in PHP from my plugin (e.g. during an import) and generate its thumbnails?","category":"gap","option":"mcp-docs","answer":"No dedicated 'create a media entity from a local file in your own plugin' code guide was found in this corpus. What is documented, and is the closest available material: (1) Shopware's own Migration Assistant extension uses a `MediaFileService::saveMediaFile()` call during conversion to queue a media file for import by URI/path (`uri`, `fileName`, `fileSize`, `mediaId`), and a `LocalMediaProcessor` (implementing `MediaFileProcessorInterface`) that resolves local file paths and copies the files into Shopware's media storage during a separate processing step — this is the internal pattern Shopware itself uses to import media from disk, though it is part of the Migration Assistant plugin's own architecture rather than a generic public API guide (developer/products/extensions/migration-assistant/concept/media-processing.md:1-195). (2) For thumbnails: the core service is `ThumbnailService`, whose `generate()`/`updateThumbnails()`/`deleteThumbnails()` methods are the ones that produce thumbnail files/records (only documented indirectly, in the context of the Remote Thumbnail Generation feature, which explains that enabling remote thumbnails makes these methods throw `MediaException::thumbnailGenerationDisabled()`) (developer/guides/plugins/plugins/content/media/remote-thumbnail-generation.md:1-132). The corpus also documents an admin CLI command `media:generate-thumbnails` — 'Generates the thumbnails for all media entities' — which is the operational way to (re)generate thumbnails for existing media without writing PHP (developer/resources/references/core-reference/commands-reference.md:248-259). I could not find a step-by-step plugin-facing example (e.g. exact `MediaService`/`FileSaver` method signatures to persist an uploaded/local file as a `media` entity) in this corpus, so this answer is partial.","citations":["developer/products/extensions/migration-assistant/concept/media-processing.md:1-195","developer/guides/plugins/plugins/content/media/remote-thumbnail-generation.md:1-132","developer/resources/references/core-reference/commands-reference.md:248-259"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=MediaService|generateThumbnails, path=developer, regex=true, mode=files"},{"tool":"list_docs","args":"path=developer/guides/plugins/plugins/content"},{"tool":"list_docs","args":"path=developer/guides/plugins/plugins/content/media"},{"tool":"grep_docs","args":"pattern=MediaService, path=developer, mode=content"},{"tool":"grep_docs","args":"pattern=saveMediaFile|FileSaver|UploadedFile, path=developer, regex=true, mode=files"},{"tool":"read_doc","args":"path=developer/products/extensions/migration-assistant/concept/media-processing.md"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/content/media/remote-thumbnail-generation.md"},{"tool":"grep_docs","args":"pattern=ThumbnailService|generateMediaThumbnails|media:generate-thumbnails, path=developer, regex=true, mode=files"},{"tool":"grep_docs","args":"pattern=media:generate-thumbnails, path=developer/resources/references/core-reference/commands-reference.md, mode=content, context=3"},{"tool":"read_doc","args":"path=developer/resources/references/core-reference/commands-reference.md, offset=248, limit=12"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"gap-08":{"query":"How do I set up a Nuxt project with Shopware Composable Frontends against my shop's Store API — endpoint, access token, and why do I get HTTP 412?","category":"gap","option":"mcp-docs","answer":"Partially found, and the HTTP 412 part is not found. This corpus only contains PaaS-hosting documentation for Composable Frontends (deployment on Shopware PaaS Native), not a getting-started guide for scaffolding/configuring a Nuxt project against the Store API. What is documented: Composable Frontends are described as 'a headless frontend implementation based on the Store API' (developer/concepts/api/store-api.md:1-17), which for full endpoint/auth/schema details points to the external Store API Stoplight reference rather than documenting the Store API access key setup itself. On the PaaS side, a composable frontend is deployed with `kind: cfe` in `application.yaml`, must listen on port 3000, expose a `/api/healthz` endpoint, and its `nuxt.config.ts` can use `routeRules` for ISR/cache headers (developer/products/paas/shopware/composable-frontends/index.md). The Composable-Frontends Performance page notes that Store API currently relies heavily on uncacheable `POST /store-api/` requests, recommends routing `/store-api/` requests through the same domain/Fastly service as the frontend to avoid CORS preflight (`OPTIONS`) requests, and that a `sw-cache-hash` cookie is set once an item is added to the cart, affecting cache hit ratio (developer/products/paas/shopware-paas/composable-frontends/performance.md:1-108). No page in this corpus documents the Store API `sw-access-key` / sales-channel access-token setup specifically for a Nuxt Composable Frontends project, nor an HTTP 412 error or its cause. I could not confirm what triggers HTTP 412 against this corpus.","citations":["developer/concepts/api/store-api.md:1-17","developer/products/paas/shopware-paas/composable-frontends/performance.md:1-108"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=Composable Frontends, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=412, path=developer, mode=files"},{"tool":"list_docs","args":"path=developer/products/paas/shopware/composable-frontends"},{"tool":"grep_docs","args":"pattern=nuxt, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/products/paas/shopware-paas/composable-frontends/performance.md"},{"tool":"grep_docs","args":"pattern=sw-access-key|NUXT_PUBLIC|SHOPWARE_ENDPOINT, path=developer, regex=true, mode=files"},{"tool":"read_doc","args":"path=developer/concepts/api/store-api.md"},{"tool":"grep_docs","args":"pattern=sw-access-key, path=developer/products/tools/mcp-server/troubleshooting.md, mode=content, context=3"},{"tool":"grep_docs","args":"pattern=frontends, path=developer, mode=files"}],"notFoundClaim":true,"memoryClaims":["HTTP 412 from Shopware's Store API is typically returned when a required context/session header such as `sw-context-token` is missing or
