 })`. To load a single entity by id (e.g. for an edit form) use `this.productRepository.get(entityId, Shopware.Context.api[, criteria]).then(entity => { this.entity = entity; })`. Repositories also expose `save()`, `delete()`, `create()`, `assign()` (for ManyToMany) for writing, and OneToMany/ManyToMany associations can be reached via a sub-repository created from `this.product.prices.entity`/`.source` (or the association's local collection for unsaved parent entities).","citations":["developer/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md:1-882"],"toolCallLog":[{"tool":"list_docs","args":"path=developer/guides/plugins/plugins/administration/data-handling-processing"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-36":{"query":"How do I register ACL privileges for my plugin's Administration module and check them in a component or template?","category":"dev","option":"mcp-docs","answer":"Register privileges via the privilege service using `Shopware.Service('privileges').addPrivilegeMappingEntry({...})`, ideally in `<plugin root>/src/Resources/app/administration/src/<your-component>/acl/index.js`, imported from that component's `index.js`, which is in turn imported from `main.js`. The entry object needs `category` ('permissions' for normal CRUD-style privileges or 'additional_permissions' for non-CRUD actions), `parent` (a parent key for nesting, or `null`), `key` (groups privileges together, usually the module name), and `roles`: for `permissions` use the four fixed roles `viewer`/`editor`/`creator`/`deleter`; for `additional_permissions` you can invent custom role keys (e.g. `clear_cache`). Each role has a `privileges` array of API permission strings in `entity_name:operation` form (e.g. `product_review:read`) and an optional `dependencies` array of other identifiers (`key.role`) that get auto-checked too. You can pull in privileges from another mapping with `Shopware.Service('privileges').getPrivileges('rule.viewer')`. To protect a route, add `meta: { privilege: 'your_key.your_role' }` to the route config; to hide a menu entry, add `privilege: 'your_key.your_role'` to the `navigation` or `settingsItem` entry; to protect a keyboard shortcut, give it an `active()` function returning `this.acl.can(...)`. To check privileges in code, inject the `acl` service (`inject: ['acl']`) and call `this.acl.can('key.role')` (e.g. `this.acl.can('sales_channel.creator')`), or use it directly in a template, e.g. `<button v-if=\"acl.can('review.editor')\">` or bind `:disabled=\"!acl.can('review.editor')\"`. Add translation snippets for the privilege labels at the auto-generated paths `sw.privileges.${category}.${key}.label` (and `sw.privileges.${category}.${key}.${role_key}` for additional_permissions). Finally, to inject your plugin's custom privileges into other existing roles at runtime, override the PHP `enrichPrivileges()` method on your plugin's main `Plugin` class, returning an array keyed by role identifier (e.g. `'product.viewer'`) mapping to arrays of extra privilege strings.","citations":["developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:1-447"],"toolCallLog":[{"tool":"list_docs","args":"path=developer/guides/plugins/plugins/administration/permissions-error-handling"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-37":{"query":"How do I set up and run PHPUnit integration tests for my Shopware plugin, including tests that boot the kernel?","category":"dev","option":"mcp-docs","answer":"Create a `phpunit.xml` in the plugin root (can be auto-generated by `bin/console plugin:create`) with `bootstrap=\"tests/TestBootstrap.php\"`, `<server name=\"KERNEL_CLASS\" value=\"Shopware\\Core\\Kernel\"/>`, `<env name=\"APP_ENV\" value=\"test\"/>`, `APP_DEBUG=1`, `SYMFONY_DEPRECATIONS_HELPER=weak`, and `<testsuites>` pointing at your test directories (e.g. `Test`, `Migration/Test`). The generator also creates `<plugin root>/tests/TestBootstrap.php`, which uses `Shopware\\Core\\TestBootstrapper` (`addCallingPlugin()`, `addActivePlugins('YourPlugin')`, `setForceInstallPlugins(true)`, `bootstrap()->getClassLoader()`) to ensure the plugin is installed/active even against an existing test database, and registers the plugin's PSR-4 namespace. For an integration-style test that boots the kernel and needs DB/container access, extend PHPUnit's `TestCase` and use the `IntegrationTestBehaviour` trait (which sets up a DB transaction and clears the cache before each test) or `KernelTestBehaviour` (for tests that only need a DB connection from the container, e.g. migration tests). Example: a class-instantiation smoke test using `IntegrationTestBehaviour`, and a migration test using `KernelTestBehaviour` that fetches `Connection::class` from `$this->getContainer()`. To override services for the test environment only (e.g. to avoid real file deletion or API calls), add a `<plugin root>/Resources/config/services_test.php` which overrides `services.php` just during tests. Run tests with the PHPUnit binary from `vendor/bin`: `./vendor/bin/phpunit --configuration=\"custom/plugins/SwagBasicExample\"` for all tests, add `--testsuite \"migration\"` for a specific suite, or `--filter testNoChanges` / `--filter Migration...Test` for a single method/class. If using the Symfony Flex project template, install the `dev-tools` dev dependency (`composer require --dev dev-tools`) to be able to run PHPUnit tests.","citations":["developer/guides/development/testing/unit/php-unit.md:1-214","developer/guides/development/testing/index.md:1-63"],"toolCallLog":[{"tool":"list_docs","args":"path=developer/guides/plugins/plugins/testing"},{"tool":"grep_docs","args":"pattern=phpunit, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/development/testing/unit/php-unit.md"},{"tool":"read_doc","args":"path=developer/guides/development/testing/index.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-38":{"query":"How do I write Jest unit tests for my Administration components in Shopware 6.7?","category":"dev","option":"mcp-docs","answer":"Place test files next to the file under test, named with the suffix `.spec.js`/`.spec.ts`. Because components register to the global `Shopware` object via `Shopware.Component.register()`, you import a component file for its side effect (registration) and then build a real Vue component from it via `Shopware.Component.build('component-name')` (this resolves all template overrides/extensions) before mounting it with Vue Test Utils' `shallowMount()` (preferred, stubs child components) or `mount()`. You can scaffold a spec file automatically with `composer run admin:create:test` (paste the component/service path when prompted) after installing admin JS deps with `composer run init:js`. Run tests with the PSH commands `composer run admin:unit` (all tests + coverage) or `composer run admin:unit:watch` (watch mode, re-runs only changed files) — note these commands are for the core Administration; a plugin needs its own test scripts. A typical test: import the component, `shallowMount(Shopware.Component.build('sw-multi-select'), { props: {...}, stubs: { 'sw-select-base': Shopware.Component.build('sw-select-base'), ... } })`, then assert with `wrapper.vm` truthy or `wrapper.find('.selector').text()`. To satisfy dependencies Shopware pre-registers many mocks/helpers: set `global.activeAclRoles = ['product.editor']` to grant ACL rights in a test, set `global.activeFeatureFlags = ['FEATURE_NEXT_12345']` for feature flags, use the built-in repository-factory mock (`global.repositoryFactoryMock.responses.addResponse({ method, url, status, response })`) to stub Admin API calls, override injected services via `Shopware.Service.register('mediaService', { renameMedia: () => Promise.resolve() })` or a component's `provide` option, override global mocks like `$tc`/`$device`/`$router` via the `mocks` option, and use `createLocalVue().directive('clipboard', {})` plus the `localVue` mount option to stub custom directives that Vue can't resolve otherwise.","citations":["developer/guides/development/testing/unit/jest-admin.md:1-599"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/development/testing/unit/jest-admin.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-39":{"query":"How do I write end-to-end Cypress tests for my plugin against a Shopware 6.7 store?","category":"dev","option":"mcp-docs","answer":"Important caveat first: in the current developer docs, the Cypress E2E guide lives under `developer/guides/development/testing/legacy/cypress/` and the top-level Testing index states 'Shopware recommends end-to-end (E2E) testing. Playwright is the officially supported tool' with its own guide at `developer/guides/development/testing/e2e-playwright/`. Cypress is documented as the legacy approach. That said, the legacy Cypress guide describes the following for plugins: ensure a clean Shopware installation (`composer run init`) and a theme assigned, then create the folder structure `Resources/app/<environment>/test/e2e/cypress/{fixtures,integration,plugins,support}` inside your plugin. Run `npm init -y` in `Resources/app/<environment>/test/e2e`, add an `open` script (`\"open\": \"node_modules/.bin/cypress open\"`), and install the test suite package with `npm install @shopware-ag/e2e-testsuite-platform`. Create `e2e/cypress/plugins/index.js` with `module.exports = require('@shopware-ag/e2e-testsuite-platform/cypress/plugins');` and `e2e/cypress/support/index.js` with `require('@shopware-ag/e2e-testsuite-platform/cypress/support');`. Write tests as `*.spec.js` files under `integration/`, using Mocha-style `describe()`/`it()` blocks, Cypress commands (`cy.get(...).click()`, `.type()`, etc.) and Chai/BDD assertions (`.should(...)`). Use lifecycle hooks (`beforeEach`) to build up state via the REST API rather than the UI — the testsuite ships fixture/service helpers (`cy.createDefaultFixture('tax')`, JSON fixtures loaded via `cy.fixture()`, and custom fixture services extending `AdminFixtureService`) to create test data quickly and keep each test isolated. To run the tests: `CYPRESS_baseUrl=<your-url> npm run open` from the plugin's e2e folder to launch the interactive Cypress Test Runner against your store's Storefront URL.","citations":["developer/guides/development/testing/legacy/cypress/index.md:1-548","developer/guides/development/testing/index.md:1-63"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/development/testing/legacy/cypress/index.md"},{"tool":"list_docs","args":"path=developer/guides/development/testing"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"dev-40":{"query":"How do I upgrade a Composer-based Shopware project from 6.6 to 6.7 — which composer.json constraint do I change, and which console commands do I run afterwards?","category":"dev","option":"mcp-docs","answer":"The recommended path is `shopware-cli project upgrade` (an interactive wizard that checks readiness, extension compatibility, and Composer resolution before applying changes; use `--no-interaction --target latest-patch --dry-run` for CI/preflight). If doing it manually with Composer instead: (1) put the environment into maintenance mode with `bin/console sales-channel:maintenance:enable --all`; (2) in `composer.json`, adjust the required Shopware version constraint to the target version (e.g. bump from a 6.6.x constraint to a 6.7.x constraint) — and if using the Commercial plugin, also update the `shopware/commercial` requirement to a compatible version; skipping this step means `composer update` will just resolve back to the currently installed version and no upgrade happens; (3) run `composer update --no-scripts` to update dependencies without executing Shopware CLI-dependent scripts; (4) optionally run `composer recipes:update` to force-update Symfony Flex-managed configuration files, reviewing the diff carefully; (5) finalize with `bin/console system:update:finish`, which runs the required update routines for the new version, including database migrations and theme recompilation; (6) disable maintenance mode again with `bin/console sales-channel:maintenance:disable --all`. Afterwards: clear caches, rebuild Administration/Storefront assets if needed, and test checkout/login/API flows plus installed extensions and custom project code. Best practices include starting from a clean Git working tree with a DB backup, testing on staging first, reviewing changelogs/UPGRADE files and extension compatibility, not skipping major versions untested, and committing `composer.json`/`composer.lock` plus reviewed recipe changes.","citations":["developer/guides/upgrades-migrations/upgrade-shopware.md:1-108"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=6.7, path=developer/guides, glob=**/*upgrad*, mode=files"},{"tool":"list_docs","args":"path=developer/guides/installation"},{"tool":"grep_docs","args":"pattern=upgrade, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/upgrades-migrations/upgrade-shopware.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-41":{"query":"`composer update` to Shopware 6.7 aborts on a platform requirement and my admin build then fails too — which PHP, database and Node versions does 6.7 actually require, and how do I check the machine I am on against them before I retry?","category":"dev","option":"mcp-docs","answer":"Shopware 6's officially supported stack (per the hosting guide's 'Recommended stack and supported versions' table) requires: PHP 8.2+ (8.4 recommended), with memory_limit >= 512M, max_execution_time >= 30s, and required extensions ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, openssl, pcre, pdo_mysql, phar, simplexml, xml, xmlreader, zip, zlib (optional: amqp), Composer 2.2+ recommended; Database: MariaDB >= 10.11.6 or MySQL >= 8.0.22 (Innovation releases not supported), recommended MariaDB 11.4 / MySQL 8.4, with max_allowed_packet >= 32M; Node.js/npm: Node 20.0.0+ required, Node 24 / npm 10 recommended (needed for the Administration/Storefront build). To check your machine against these before retrying the upgrade, use the Shopware CLI upgrade wizard: run `shopware-cli project upgrade` (or `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run` for a non-interactive, read-only preflight). It runs readiness checks (PHP/Composer availability through the project's configured environment), analyzes extension compatibility, and does a Composer dry-run resolution against the target version before any files are changed, writing a report to `.shopware-cli/upgrade/report.md` that includes readiness and PHP requirement information. You can also run `shopware-cli project validate` beforehand to catch code-level incompatibilities. General system prerequisites (hardware/OS) are covered separately in the installation guide's System Requirements page, which defers to the hosting guide for the actual version matrix.","citations":["developer/guides/hosting/index.md:15-29","developer/products/tools/cli/project-commands/upgrade.md:1-159","developer/guides/installation/system-requirements.md:1-53"],"toolCallLog":[{"tool":"kb_status","args":"{}"},{"tool":"read_doc","args":"path=developer/index.md"},{"tool":"grep_docs","args":"pattern=6.7, path=developer, mode=files"},{"tool":"list_docs","args":"path=developer, glob=**/*upgrade*"},{"tool":"read_doc","args":"path=developer/guides/upgrades-migrations/upgrade-shopware.md"},{"tool":"read_doc","args":"path=developer/guides/upgrades-migrations/index.md"},{"tool":"grep_docs","args":"pattern=PHP 8, path=developer, context=2, maxMatches=40"},{"tool":"list_docs","args":"path=developer/guides/installation"},{"tool":"read_doc","args":"path=developer/guides/installation/system-requirements.md"},{"tool":"read_doc","args":"path=developer/guides/hosting/index.md, section=recommended-stack-and-supported-versions"},{"tool":"read_doc","args":"path=developer/products/tools/cli/project-commands/upgrade.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-42":{"query":"How do I check extension compatibility before upgrading with shopware-cli, and why does it report my plugins in custom/plugins as blocking?","category":"dev","option":"mcp-docs","answer":"Run `shopware-cli project upgrade` (interactive) or, for CI/scripting, `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run`. The wizard's phase 3 analyzes extension compatibility and runs a Composer dry-run resolution: it combines extension/repository/Store metadata (an early compatibility signal) with an actual Composer resolution check for the target dependency set, and classifies extensions as ready, needs update, needs manual review, or blocking. Before that, you can also run `shopware-cli project validate` (optionally with `--only phpstan`) to catch references to Shopware classes/interfaces/traits that were removed or renamed for the target version — point `shopware/core` in composer.json at the target version and validate a clean checkout without `vendor/` so PHPStan actually resolves against the target constraint. Plugins living in `custom/plugins` (i.e. not managed through Composer/vendor) block the upgrade readiness check specifically because the wizard resolves and pins extension versions with Composer, and extensions outside `vendor/` cannot participate in that resolution. The fix is to migrate them into Composer management first, via `shopware-cli project autofix composer-plugins` (see 'Migrate custom/plugins extensions to Composer').","citations":["developer/products/tools/cli/project-commands/upgrade.md:1-159","developer/products/tools/cli/validation.md:1-390"],"toolCallLog":[],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-43":{"query":"My admin plugin still ships a webpack.config.js — how do I move the administration build to Vite for Shopware 6.7?","category":"dev","option":"mcp-docs","answer":"Shopware 6.7 switches the Administration build from Webpack to Vite. Apps are unaffected (their build is already decoupled). For a plugin with a custom `webpack.config.js`, migrate as follows: 1) Create a new `vite.config.mts` file in `YourApp/src/Resources/app/administration/src` (the old webpack config lived in `YourApp/src/Resources/app/administration/build/webpack.config.js`). 2) Remove the old `webpack.config.js` file. 3) Remove all webpack-related dependencies from `package.json`. 4) Add the Vite dependencies to `package.json`. Then translate the config: e.g. a webpack `module.exports = () => ({ resolve: { alias: { '@example': 'src/example' } } })` becomes a Vite config using `import { defineConfig } from 'vite'; export default defineConfig({ resolve: { alias: { '@example': 'src/example' } } });`. More complex webpack configs need proportionally more manual translation — consult the official Vite config docs. Building continues to work through the same commands: `composer build:js:admin` builds core + extensions (via the internal `build/plugins.vite.ts` script, which reads `var/plugins.json` produced by `php bin/console bundle:dump`), and `composer watch:admin` runs the Vite dev/HMR server. You can test the new pipeline early behind the `ADMIN_VITE` feature flag. Note the doc is explicitly marked as a forward-looking roadmap page whose specifics 'are subject to change.'","citations":["developer/guides/upgrades-migrations/administration/vite.md:1-158"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/upgrades-migrations/administration/vite.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-44":{"query":"After the Vue 3 upgrade my admin plugin broke — this.$parent resolves to the wrong component and a prop default that calls this.$tc throws. What do I have to change?","category":"dev","option":"mcp-docs","answer":"Both are documented Known Issues of the Shopware Administration's Vue 3 upgrade (Vue 3 since Shopware 6.6): (1) `this.$parent` — Vue 3 wraps asynchronous components in an `AsyncWrapperComponent`, which makes the virtual DOM tree differ from Vue 2's, so a `this.$parent` call that worked in Vue 2 may need to become `this.$parent.$parent` in Vue 3. The doc recommends avoiding `this.$parent` communication altogether (calling it an anti-pattern) and using services or event communication instead. (2) Prop defaults calling `this.$tc` — prop default functions no longer have access to the component's `this` scope in Vue 3, so `this.$tc` inside a prop default function throws; use `Shopware.Snippet.tc` instead of `this.$tc` in that context. More broadly, the migration guide suggests searching your code for `this.$` usages (an indicator of Vue's internal API) since these are very likely to break, except `this.$tc` used in normal (non-default-function) contexts, which is fine.","citations":["developer/guides/upgrades-migrations/administration/vue3.md:1-138"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=\\$parent, path=developer, regex=true, context=2, maxMatches=30"},{"tool":"grep_docs","args":"pattern=\\$tc, path=developer, regex=true, context=2, maxMatches=30"},{"tool":"grep_docs","args":"pattern=prop default, path=developer/guides/upgrades-migrations/administration/vue3.md, context=3"},{"tool":"read_doc","args":"path=developer/guides/upgrades-migrations/administration/vue3.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-45":{"query":"Shopware.State is deprecated in 6.7 — how do I convert my administration Vuex module into a Pinia store?","category":"dev","option":"mcp-docs","answer":"With Shopware 6.7, Vuex is replaced by Pinia. To migrate a Vuex module: replace the `export default { namespaced: true, state: {...}, mutations: {...}, getters: {...}, actions: {...} }` object with `const store = Shopware.Store.register('<storeName>', { state: () => ({...}), getters: {...}, actions: {...} }); export default store;` (you can also pass an `id` property inside the definition object instead of a separate name argument). Key changes: `state` must be a function returning the initial state (not a static object); Vuex `mutations` are removed entirely — modify state directly inside `actions` instead of dispatching separate mutations; getters cannot share a name with a state property since both are exposed at the same level. Registration triggers by import: instead of `import productsStore from './state/products.state'; Shopware.State.registerModule('product', productsStore);`, you just `import './state/products.state';` (the module registers itself via `Shopware.Store.register`). Re-registering an existing store name overwrites it; you can also explicitly `Shopware.Store.unregister('<storeName>')`. Access changes from `Shopware.State.get('<storeName>')` to `Shopware.Store.get('<storeName>')`. TypeScript is recommended: export `type StoreType = ReturnType<typeof store>` and extend the global `PiniaRootState` interface with it. Stores can also be defined as composables (a function returning `ref`/`computed` state and action functions) rather than an options object. For testing, import the store file to register it and call `store.$reset()` before each test; when testing components that use Pinia stores, create and set an active Pinia instance (`createPinia()`/`setActivePinia()`) and pass it as a plugin to the mounted component.","citations":["developer/guides/upgrades-migrations/administration/pinia.md:1-263"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/upgrades-migrations/administration/pinia.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-46":{"query":"sw-button and sw-card are deprecated in Shopware 6.7 — how do I migrate my plugin's admin templates to the Meteor components, and is there a codemod that does it?","category":"dev","option":"mcp-docs","answer":"Yes — Shopware 6.7 replaces several administration components with components from the Meteor Component Library, and Shopware ships a codemod tool to automate the migration. Prerequisites: a development installation of Shopware, and your plugin located in the `custom/plugins` folder. Run `composer run admin:code-mods` (the bare command prints help text), e.g. `composer run admin:code-mods -- --plugin-name example-plugin --fix -v 6.7`, providing your plugin name and the target Shopware version. The tool automatically replaces compatible components with Meteor Components, adds guidance comments where a component needs manual migration, and fixes some other deprecated code where possible. For cross-version compatibility while you migrate, a new `deprecated` prop was added to Shopware components (default `false`, meaning it uses the new Meteor component by default): `<sw-button />` renders `mt-button` in 6.7 (and `sw-button-deprecated` in 6.6), while `<sw-button deprecated />` forces the old deprecated component (`sw-button-deprecated`) in both 6.6 and 6.7 — letting you keep one codebase compatible with both versions. Shopware still recommends migrating to Meteor Components fully whenever possible. Note this page is explicitly flagged as a 'Future Development Roadmap' document whose specifics are subject to change.","citations":["developer/guides/upgrades-migrations/administration/meteor-components.md:1-85"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/upgrades-migrations/administration/meteor-components.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-47":{"query":"My payment plugin implements `AsynchronousPaymentHandlerInterface` and is tagged `shopware.payment.method.async` — how do I write a payment handler for Shopware 6.7 instead?","category":"dev","option":"mcp-docs","answer":"From Shopware 6.7.0.0, payment handling is unified around a single `Shopware\\Core\\Checkout\\Payment\\Cart\\PaymentHandler\\AbstractPaymentHandler` abstract class instead of the old interface set. Migration steps: (1) Stop implementing `Shopware\\Core\\Checkout\\Payment\\Cart\\PaymentHandler\\PaymentHandlerInterface` variants; extend `AbstractPaymentHandler` and implement the needed methods. The old `AsynchronousPaymentHandlerInterface` maps to the `pay` method (always called during checkout, return a `RedirectResponse` to trigger the async flow) plus `finalize` (only called if `pay` returned a `RedirectResponse` — this replaces the old async-only 'finalize' contract). You must also implement `supports(PaymentHandlerType $type, string $paymentMethodId, Context $context): bool` — return `false` if you don't support recurring/refund, or check `PaymentHandlerType::RECURRING`/`::REFUND` if you do. (2) In your service definition, remove the old interface-specific tag `shopware.payment.method.async` (and any of `shopware.payment.method.sync`, `.prepared`, `.recurring`, `.refund`) and tag the service with the single new tag `shopware.payment.method` only. (3) In `pay`, catch failures and throw `PaymentException` (e.g. `PaymentException::asyncProcessInterrupted(...)`) instead of failing silently; Shopware sets the transaction to `failed`. In `finalize`, check request state (e.g. a cancel query flag) and throw `PaymentException::customerCanceled(...)` if the customer canceled, otherwise call `$transactionStateHandler->paid(...)`. (4) Starting with Shopware 6.7, plugin-provided payment methods also require a unique `technicalName` field (with a plugin-specific prefix) when created via `payment_method.repository` in the plugin's `install()` — an omitted technical name can prevent the plugin from installing or activating; older versions allowed omitting it, so check existing plugins when migrating.","citations":["developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:1-846"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=AsynchronousPaymentHandlerInterface, path=developer, mode=files"},{"tool":"list_docs","args":"path=developer/guides/plugins/plugins/checkout/payment"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-48":{"query":"After upgrading, my storefront JavaScript plugin no longer loads — how do I register it asynchronously with `PluginManager` and where does the compiled file have to be shipped?","category":"dev","option":"mcp-docs","answer":"Storefront JS plugins are vanilla ES6 classes extending the global `PluginBaseClass`, placed at `<plugin root>/src/Resources/app/storefront/src/<plugin-name>/<plugin-name>.plugin.js`. Registration happens in `<plugin root>/src/Resources/app/storefront/src/main.js` (Shopware auto-loads this file as the storefront JS entry point) via the global `window.PluginManager`. For a synchronous registration: `import ExamplePlugin from './example-plugin/example-plugin.plugin'; const PluginManager = window.PluginManager; PluginManager.register('ExamplePlugin', ExamplePlugin, '[data-example-plugin]');` (the third, optional argument is a CSS selector that scopes when the plugin executes). To register it asynchronously instead, replace the static import with a dynamic import passed directly as the second argument: `PluginManager.register('ExamplePlugin', () => import('./example-plugin/example-plugin.plugin'), '[data-example-plugin]');`. Supplying a dynamic/async import causes the PluginManager to automatically treat the plugin as async: it is then excluded from the main bundled `storefront.js` and is only downloaded on demand when an element matching the bound selector (e.g. `[data-example-plugin]`) is found on the page — useful for reducing initial JS payload for plugins not needed on every page. As for shipping: your source `main.js` lives under `.../app/storefront/src`, but Shopware compiles it and expects the compiled output at `<plugin root>/src/Resources/app/storefront/dist/storefront/js/<plugin-name>/<plugin-name>.js` — this compiled `dist` file must be shipped with the plugin (Shopware recognizes it automatically from that dist path). Build it with `shopware-cli project storefront-build` (template setups) or `composer run build:js:storefront` (platform/contribution setups) and reload the storefront to verify the plugin loads.","citations":["developer/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md:1-273"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=PluginManager, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-49":{"query":"My storefront controller still uses the `@Route` and `@RouteScope` annotations from 6.4 — what is the attribute form in Shopware 6.7 and how are the routes wired?","category":"dev","option":"mcp-docs","answer":"Since Shopware 6.4.11.0, `@RouteScope` annotation-based configuration is deprecated (removed for the 6.5 major version), and routes use PHP 8 attributes instead of annotations. Use `Symfony\\Component\\Routing\\Attribute\\Route` and set the scope via the `defaults` array, not a separate `@RouteScope`. On the class: `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]])] class ExampleController extends StorefrontController { ... }` (imports: `Shopware\\Core\\PlatformRequest`, `Shopware\\Storefront\\Framework\\Routing\\StorefrontRouteScope`). On a method, add a separate `#[Route(path: '/example', name: 'frontend.example.example', methods: ['GET'])]` — the scope can also be repeated per-method inside the method's own `defaults` if needed, instead of only on the class. Route names must be prefixed with `frontend`, `widgets`, `payment`, `api`, or `store-api` to be recognized correctly (the first three identify Storefront routes); since Shopware 6.7.2.0 you can instead allow custom unprefixed route names via a `storefront.router.allowed_routes` config entry in `Resources/config/packages/storefront.yaml`, provided your plugin overrides `build()` to load that packages directory. Wiring: the controller must be registered as a public service in `Resources/config/services.php` (`$services->set(ExampleController::class)->public()->call('setContainer', [service('service_container')]);`), and Shopware must be told to scan for its routes via a `Resources/config/routes.php` importing the controller directory with the `attribute` type loader: `$routes->import('../../Storefront/Controller/*Controller.php', 'attribute');`. Without that `routes.php` import, a properly attributed and registered controller still exposes no URL.","citations":["developer/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:1-324"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=RouteScope, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=#\\[Route, path=developer/guides/plugins/plugins/storefront/controllers, regex=true, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/storefront/controllers/add-custom-controller.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-50":{"query":"My `ScheduledTaskHandler` stopped running after the upgrade — how must a scheduled task and its handler be declared in Shopware 6.7?","category":"dev","option":"mcp-docs","answer":"A ScheduledTask and its handler must be registered in the plugin's `services.php` (under `Resources/config/`) with two distinct tags: the task class gets `->tag('shopware.scheduled.task')`, and the handler class gets `->tag('messenger.message_handler')` (plus its constructor args, typically `scheduled_task.repository` and `logger`). The task class must extend `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTask` and implement `getTaskName(): string` (a vendor-prefixed technical name, e.g. `swag.example_task`, to avoid collisions) and `getDefaultInterval(): int` (interval in seconds). The handler class must extend `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTaskHandler`, be annotated with the Symfony Messenger attribute `#[AsMessageHandler(handles: ExampleTask::class)]`, and implement `run(): void` with the actual task logic. If both the task and handler classes exist but are missing either tag (or the handler's `#[AsMessageHandler]` attribute doesn't point to the task class), the task will not execute even though it looks correctly implemented — registration of the task and the handler's Messenger wiring are two separate concerns. If the task isn't registering after an upgrade (e.g. without reinstalling the plugin), run `bin/console scheduled-task:register`; to actually process due tasks you also need `bin/console scheduled-task:run` (dispatches the message once due) and `bin/console messenger:consume` (executes dispatched messages) — unless you're using the admin worker. Also verify the task's `status` is `scheduled` in the `scheduled_task` database table. Optionally, since Shopware 6.7.13.0, a handler can implement `DynamicallyScheduledTaskHandler` with a `getNextExecutionTime(ScheduledTask $task, ScheduledTaskEntity $taskEntity): ?\\DateTimeInterface` method to control the next run time dynamically instead of the fixed default interval.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md:1-173"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-51":{"query":"Custom entities declared in `Resources/config/entities.xml` no longer work for my plugin in Shopware 6.7 — how do I define and register a DAL entity with PHP attributes instead?","category":"dev","option":"mcp-docs","answer":"Shopware 6.7 (available since 6.6.3.0) supports defining DAL entities via PHP attributes instead of `entities.xml`. Create a class extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity` and add the `#[Entity('your_entity_name', collectionClass: YourEntityCollection::class)]` attribute (the `name` parameter is required and must be unique; `collectionClass` is optional, defaulting to `EntityCollection`, available since 6.6.9.0). Define the primary key by adding `#[PrimaryKey]` plus `#[Field(type: FieldType::UUID)]` to a public property (UUID recommended). Add further fields with `#[Field(type: FieldType::...)]` (or a fully-qualified Field class name since 6.6.9.0), special field attributes such as `#[AutoIncrement]` or `#[ForeignKey(entity: '...')]`, `#[Serialized(serializer: ...)]` for JSON fields with custom serialization, `#[CustomFields]` or the `EntityCustomFieldsTrait` for custom fields, `api: true` (or a scope array) on `#[Field]` to expose it via the API, `translated: true` on `#[Field]` plus a `#[Translations]` property to support translations, `#[Required]` for required/validated fields, and `#[OneToOne]`, `#[OneToMany]`, `#[ManyToOne]`, `#[ManyToMany]` attributes for associations. With this pattern you no longer need getter/setter methods, or separate `EntityTranslationDefinition`/`EntityCollection` classes (properties are public and directly accessed). Finally, register the entity by tagging the class in the DI container's `services.php`: `$services->set(Examples\\ExampleEntity::class)->tag('shopware.entity');`. Shopware then automatically registers an `EntityDefinition` and `EntityRepository` for it (e.g. `example_entity.definition` and `example_entity.repository`).","citations":["developer/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md:1-620"],"toolCallLog":[{"tool":"kb_status","args":""},{"tool":"read_doc","args":"path=developer/index.md"},{"tool":"list_docs","args":"path=developer"},{"tool":"grep_docs","args":"pattern=entities.xml, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=attribute, path=developer, glob=**/*entit*, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-52":{"query":"What must a plugin database migration class implement in Shopware 6.7, and where does the database cleanup on uninstall belong?","category":"dev","option":"mcp-docs","answer":"A plugin migration class must extend `Shopware\\Core\\Framework\\Migration\\MigrationStep`, live under `<plugin root>/src/Migration` (filename starting with `Migration<timestamp><Description>.php`), and implement `getCreationTimestamp(): int` (returning the timestamp embedded in the filename) and `update(Connection $connection): void`, in which you implement all schema and data changes for the plugin — this is what Shopware runs automatically on plugin install/update. `MigrationStep` also defines an optional `updateDestructive()` method, but plugin install and update never call it (it is reserved for Shopware core's delayed, major-version destructive changes; merchants/platforms also don't run `database:migrate-destructive` for plugins), so everything the plugin needs must go into `update()`. There is no migration rollback mechanism — cleaning up the database when the plugin is removed belongs in the plugin lifecycle method `uninstall()` (see the Plugin Lifecycle guide's uninstall section), not in the migration class.","citations":["developer/guides/plugins/plugins/database/database-migrations.md:1-211"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=MigrationStep, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/resources/guidelines/code/core/database-migations.md"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/database/database-migrations.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-53":{"query":"My theme config labels disappeared from the Theme Manager after 6.7 — how do I define `theme.json` config fields and where do their translations go now?","category":"dev","option":"mcp-docs","answer":"In `theme.json` (`<plugin root>/src/Resources/theme.json`), config fields are defined under `config.fields`, each keyed by its technical name, with parameters like `type` (color, text, number, fontFamily, media, checkbox, switch, url), `editable`, `tab`, `block`, `section`, `custom`, `scss`, and `fullWidth`. As of v6.7.1.0 (and mandatory before v6.8.0.0), the inline `label` and `helpText` translation arrays on fields/blocks/sections/tabs are deprecated — 'Translations are now handled via Administration snippets'. Since these translations are only used by the Theme Manager in the administration, translations must instead be stored as snippet keys in Administration snippet files, e.g. `<plugin root>/src/Resources/app/administration/src/app/snippet/de.json` and `.../en.json` (locale-specific files like `de-DE.json`/`en-GB.json` are also supported and override the base language files). Each snippet key starts with `sw-theme`, followed by the theme's technical name (or parent theme name, since snippets inherit from the parent theme), then the relevant tab/block/section/field names (using `default` for any unnamed element), and ends in `label` (or `helpText` for fields, or a numeric index + `label` for field options). Example key structure: `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.<fieldName>.label`. After editing `theme.json`, run `bin/console theme:refresh` to apply the changes.","citations":["developer/guides/plugins/themes/configuration/theme-configuration.md:1-1023"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/plugins/themes/configuration/theme-configuration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-54":{"query":"How do I register a plugin cookie in the storefront cookie consent manager in Shopware 6.7?","category":"dev","option":"mcp-docs","answer":"Adding a custom cookie requires listening to the `Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent` and adding your cookie to the event's cookie group collection. First register an event listener in `<plugin root>/src/Resources/config/services.php` tagging your listener class with `kernel.event_listener` for the `CookieGroupCollectEvent`. Then implement the listener with an `__invoke(CookieGroupCollectEvent $event)` method: fetch the desired cookie group (e.g. via `$event->cookieGroupCollection->get(CookieProvider::SNIPPET_NAME_COOKIE_GROUP_COMFORT_FEATURES)`), get or create its `CookieEntryCollection` of entries, then build a `new CookieEntry('my-cookie-key')` and set its `name`, `value`, and `expiration` properties before adding it to the entries collection. Since Shopware 6.7.3.0, cookies use structured objects (`CookieEntry` and `CookieGroup`) instead of arrays for type safety — the older array format and the `CookieProviderInterface` approach (used in 6.7.2 and earlier) are now deprecated in favor of this event-based system, though `CookieProviderInterface` still works for backward compatibility with the old array syntax. After loading the storefront, the new cookie appears in the cookie consent manager. Note also that since 6.7.3.0 cookie configurations include a hash tracking changes, so adding/removing/changing cookies via a plugin automatically triggers a re-consent flow for users (hash stored per-language in the browser's `cookie-config-hash` cookie).","citations":["developer/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md:1-154"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-55":{"query":"How do the breaking storefront accessibility changes reach my theme in Shopware 6.7, and what must an extension that overrides the affected Twig blocks do?","category":"dev","option":"mcp-docs","answer":"Breaking accessibility changes (HTML/Twig structure or CSS changes needed for WCAG 2.1 AA compliance) are not enabled by default before they become mandatory; they are shipped behind the feature flag `ACCESSIBILITY_TWEAKS=1` (set in `.env`), similar to major feature flags like `V6_7_0_0`. Enabling this flag activates all currently available accessibility improvements, letting you preview upcoming changes and check if your project/extension is affected before they become the default; after enabling it you must recompile the theme with `bin/console theme:compile`. With Shopware 6.7.0 as the major version, all accessibility improvements became the default (no longer gated by the flag). For an extension overriding an affected Twig block: Shopware ships both the old and new markup guarded by `{% if feature('ACCESSIBILITY_TWEAKS') %} ... {% else %} ... {% endif %}`, with the new/renamed inner block (e.g. `component_list_items_inner`) marked `@deprecated tag:v6.7.0` alongside the old block (e.g. `component_list_items`). An extension must therefore override both blocks during the transition period: extend the new inner block (e.g. `component_list_items_inner`) to already account for the new structure (such as `<li>` instead of `<div>`), while keeping the old block override too (which can be removed once v6.7.0 lands and the old branch is gone). Developers can also consult the accessibility improvements changelog table and the accessibility checklist for the full history of breaking vs. non-breaking changes per release.","citations":["developer/guides/development/accessibility/storefront-accessibility.md:1-228"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/development/accessibility/storefront-accessibility.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-56":{"query":"Header and footer are loaded through ESI sub-requests in Shopware 6.7, so page data is gone in my header template — how do I pass my own data into the header/footer now?","category":"dev","option":"mcp-docs","answer":"Since header and footer are now loaded via ESI as separate sub-requests, they are no longer dependent on (and no longer automatically receive) the current page's data. To pass custom data into them, extend `Storefront/Resources/views/storefront/base.html.twig` in your plugin/app and override the `base_esi_header` (or `base_esi_footer`) block, merging your own values into the `headerParameters` (or `footerParameters`) variable, e.g.: `{% block base_esi_header %}{% set headerParameters = headerParameters|merge({ 'vendorPrefixPluginName': { 'activeRoute': activeRoute } }) %}{{ parent() }}{% endblock %}`. These parameters are passed to the header ESI route as query parameters and forwarded to the header template, where you can access them, e.g. `{{ headerParameters.vendorPrefixPluginName.activeRoute }}` after extending `storefront/layout/header.html.twig`. This approach works in both plugins and apps. In plugins specifically, you can alternatively listen to the `StorefrontRenderEvent`, check that `$event->getRequest()->attributes->get('_route')` is `frontend.header` (or the footer route), and call `$event->setParameter('headerParameters', $headerParameters)` to inject data that way. Important restriction: `headerParameters`/`footerParameters` can only contain scalar values because they are passed as query parameters to the ESI routes. You can also load fully custom header/footer templates (as core does for the checkout confirm page), but this overwrites every other extension's customizations and you must ensure the `header`/`footer` data is still available if your custom template extends the original.","citations":["developer/guides/plugins/plugins/storefront/templates/customize-header-footer.md:1-103"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=ESI, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/storefront/templates/customize-header-footer.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-57":{"query":"B2B Suite support ends with 6.8 — how do I run the B2B Suite Migration to B2B Components and check that it finished?","category":"dev","option":"mcp-docs","answer":"B2B Suite will no longer be supported starting Shopware 6.8, so migration to B2B Components should be planned promptly. Prerequisites: back up your database (the migration only adds data to B2B Commercial, it does not remove data from B2B Suite), ensure the message queue worker is running (migration is processed via the message queue in the background), and ensure your B2B Suite version is 4.9.3 or above (Budget Management specifically also requires B2B Commercial 7.6.0+). To run the migration, use `bin/console b2b:migrate:commercial`, which transfers all components/entities per the configuration; you can restrict it to specific components by name (e.g. `bin/console b2b:migrate:commercial quote_management shopping_list`) — note `employee_management` is always migrated first regardless of the order given, as it is a prerequisite for all other components, and overall order is governed by configurator priority in the service definition. You can also tune batch size with `--batch-size=100` to manage memory/performance. To check that migration finished, run `bin/console b2b:migrate:progress` (ideally in a separate terminal while migration runs, optionally with `--watch` to auto-refresh every 5 seconds). It displays a table with Total/Valid/Newly/Migrated/Pending/Error record counts and a Status column showing `Complete`, `Pending`, `In progress`, `Complete with error` (check the `b2b_components_migration_errors` table), or `Has new records`. Note: for Budget Management, the Organization Unit of each budget will be empty after migration and must be manually reassigned in B2B Commercial afterward — this is expected behavior.","citations":["developer/products/extensions/b2b-suite-migration/execution/running-migration.md:1-101","developer/products/extensions/b2b-suite-migration/execution/prerequisites.md:1-31"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=b2b-suite, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/products/extensions/b2b-suite/index.md"},{"tool":"list_docs","args":"path=developer/products/extensions"},{"tool":"list_docs","args":"path=developer/products/extensions/b2b-suite-migration, depth=2"},{"tool":"read_doc","args":"path=developer/products/extensions/b2b-suite-migration/execution/running-migration.md"},{"tool":"read_doc","args":"path=developer/products/extensions/b2b-suite-migration/execution/prerequisites.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-58":{"query":"My shopware.yaml still uses redis_url — how do I define the named Redis connections in Shopware 6.7 and which eviction policy does each one need?","category":"dev","option":"mcp-docs","answer":"Since v6.6.8.0, Shopware supports configuring multiple, reusable, named Redis connections in `config/packages/shopware.yaml` under `shopware.redis.connections`, e.g.:\n```yaml\nshopware:\n    redis:\n        connections:\n            ephemeral:\n                dsn: 'redis://host1:port/dbindex'\n            persistent:\n                dsn: 'redis://host2:port/dbindex'\n```\nConnection names should reflect their purpose, be unique, and follow service naming conventions since they're used as part of the container service names; you can then reference each named connection from the configuration of different subsystems. Environment variables can be used in the DSN (e.g. `%env(REDIS_EPHEMERAL)%/1`), and for high-load scenarios you can enable connection pooling by adding `?persistent=1` to the DSN (this affects connection pooling, not data persistence).\n\nShopware classifies Redis data into three categories, each needing its own instance/connection with its own eviction policy, because current Redis versions cannot apply different eviction policies to different databases within the same instance:\n1. Ephemeral data (HTTP cache & object cache) — no durable persistence needed; use eviction policy `volatile-lru` (evicts only keys with an expiring TTL, since the app manages TTLs explicitly). Watch out for cache-tag-index keys stored without a TTL, which `volatile-lru` cannot evict and which can exhaust memory over time.\n2. Durable but 'aging' data (sessions) — configure the Redis instance with disk persistence (RDB snapshots / AOF); use eviction policy `allkeys-lru` since older data becomes less important over time.\n3. Durable and critical data (cart, number ranges, lock store, increment data) — must be persisted to disk as well, and should use `volatile-lru` so that non-expired, critical data is never evicted.","citations":["developer/guides/hosting/infrastructure/redis.md:1-109"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=redis, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/hosting/infrastructure/redis.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-59":{"query":"After upgrading to Shopware 6.7 my Varnish cache is never invalidated — what changed in the reverse proxy configuration?","category":"dev","option":"mcp-docs","answer":"The classic Varnish + Redis BAN-based invalidation method (using LUA scripts to determine URLs for the BAN request) was deprecated starting v6.6.x and has been removed in v6.7.0. That method also didn't support Redis clusters and could cause problems depending on setup/network. Since it's gone in 6.7, Varnish must instead be integrated using the Varnish `XKey` module (a surrogate-key cache module, available for Varnish 6.0+, not included in the default Varnish installation and needing separate installation). To configure it, enable reverse proxy support with `use_varnish_xkey: true` in `config/packages/shopware.yaml` (note: the config key itself also changed from `storefront.reverse_proxy` to `shopware.http_cache.reverse_proxy` starting with Shopware 6.6):\n```yaml\nshopware:\n  http_cache:\n      reverse_proxy:\n        enabled: true\n        use_varnish_xkey: true\n        hosts:\n          - 'varnish-host'\n```\nAlso set `SHOPWARE_HTTP_CACHE_ENABLED=1` in `.env`, and set `SYMFONY_TRUSTED_PROXIES` (the `TRUSTED_PROXIES` env var is no longer honored since 6.6). The Shopware Varnish Docker image ships a default VCL configured for `xkey` usage (see the 6.7 VCL reference). If invalidation still doesn't work after switching, verify with curl that the app returns a `Cache-Control: public, s-maxage=...` header and an `Xkey: ...` header — their absence means reverse proxy mode isn't actually enabled in the app config. Also note cache-clear command changes: `bin/console cache:clear` in versions before 6.7 also cleared the HTTP cache, but this behavior changed; use `bin/console cache:clear:http` (since 6.6.10) to specifically clear the reverse proxy/HTTP cache, or `bin/console cache:clear:all` (since 6.6.8) to clear everything.","citations":["developer/guides/hosting/infrastructure/reverse-http-cache.md:1-237"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/hosting/infrastructure/reverse-http-cache.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-60":{"query":"Which transports do my Shopware message queue workers have to consume in production, and how do I turn off the admin worker?","category":"dev","option":"mcp-docs","answer":"On production, the recommended way to process the message queue is via the CLI worker (`messenger:consume`), not the browser-based admin worker. You should run one or more workers consuming at minimum the `async` transport, and it's also recommended to consume the `low_priority` transport to prioritize messages (as suggested by Symfony docs), e.g.: `bin/console messenger:consume async --time-limit=60 --memory-limit=128M` or `bin/console messenger:consume async low_priority`. You must also set up a CLI worker for the failed transport, otherwise failed messages will never be processed/retried. Use a process control system (systemd or supervisor) to keep the worker(s) running after they stop due to time/memory limits (a plain cron job is discouraged since it doesn't limit the max number of concurrent workers). Out of the box Shopware wires these environment variables to transports: `MESSENGER_TRANSPORT_DSN` (default 'async' transport, e.g. `doctrine://default`), `MESSENGER_TRANSPORT_LOW_PRIORITY_DSN` (low priority transport, e.g. `doctrine://default?queue_name=low_priority`), and `MESSENGER_TRANSPORT_FAILURE_DSN` (failed transport, default Doctrine transport, retried automatically 3 times then deleted).\n\nTo turn off the admin worker once a CLI worker is configured, edit `config/packages/shopware.yaml`:\n```yaml\nshopware:\n    admin_worker:\n        enable_admin_worker: false\n```\n(The admin worker, when enabled instead, requires configuring `enable_admin_worker: true`, a `poll_interval`, and an explicit `transports` array listing every transport it should poll, e.g. `transports: [\"async\", \"low_priority\"]`.)","citations":["developer/guides/hosting/infrastructure/message-queue.md:1-235"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=admin worker, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/hosting/infrastructure/message-queue.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-61":{"query":"After the upgrade my Elasticsearch index has to be rebuilt — where do I set the shard and replica counts and which reindex command do I run?","category":"dev","option":"mcp-docs","answer":"By default Shopware creates the ES index with 3 shards and 3 replicas. To override this, add a config file at config/packages/elasticsearch.yml (available since Shopware 6.4.12.0) with:\nelasticsearch:\n  index_settings:\n    number_of_shards: 1\n    number_of_replicas: 0\nFor the reindex itself, first clear cache (bin/console cache:clear) so .env changes are picked up, then run bin/console es:index for basic Elasticsearch indexing. If you want to reindex the whole shop (Elasticsearch, SEO URLs, product index, etc.) run bin/console dal:refresh:index --use-queue (use --use-queue since there are usually too many products to index without the message queue). Some systems additionally require bin/console es:create:alias after indexing completes if products still don't show in the storefront.","citations":["developer/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md:1-247"],"toolCallLog":[{"tool":"kb_status","args":"{}"},{"tool":"read_doc","args":"path=developer/index.md"},{"tool":"grep_docs","args":"pattern=SHOPWARE_ES_NUMBER_OF_SHARDS, path=developer"},{"tool":"list_docs","args":"path=developer, glob=**/*elasticsearch*"},{"tool":"read_doc","args":"path=developer/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-62":{"query":"I changed a setting in .env on a deployed 6.7 shop but it still behaves the old way — what takes precedence between .env, .env.local and the real environment variables, and which settings does Shopware not read from .env at all?","category":"dev","option":"mcp-docs","answer":"The docs' configuration overview (developer/guides/hosting/configurations/shopware/index.md) lists `.env`, `.env.local`, and the server/container environment as the three places environment variables can be set for deployment/infrastructure values, with `.env` described as the committed-to-repo file holding lowest-priority defaults (this exact wording is used for the analogous PaaS environment-variable sources page, developer/products/paas/shopware/fundamentals/environment-variables.md, which states variables are listed 'from lowest to highest priority' with the .env file lowest and states 'When the same variable is defined in multiple sources, the higher-priority source wins'). Standard Symfony Dotenv behavior — which Shopware follows and which the docs build on via `bin/console system:setup --dump-env` / `bin/console dotenv:dump` — is that real environment variables set on the server/container are never overwritten by the .env files; Symfony's Dotenv component only fills in variables that aren't already present in the real environment, and `.env.local` (not committed, machine-specific) overrides plain `.env` [from memory]. In production, Shopware/Symfony recommends dumping the resolved variables into a `.env.local.php` file instead of a `.env` file so parsing is skipped on every request (developer/guides/hosting/performance/performance-tweaks.md, section '.env.local.php'); if such a compiled `.env.local.php` exists it is what's actually read at runtime, so editing `.env` afterwards has no effect until you re-run the dump command (`bin/console system:setup --dump-env` or `bin/console dotenv:dump {APP_ENV}`) or delete the compiled file — this is the most common reason a changed .env value 'still behaves the old way' after deployment.\n\nAs for what Shopware does NOT read from `.env` at all: shop/merchant settings that are changed through the Administration, Admin API, or by app/plugin code are stored as database-backed system configuration, not in `.env` (developer/guides/hosting/configurations/shopware/index.md, table row 'Database-backed system configuration'). These can be pinned to a fixed value via 'Static system configuration' files under config/packages/*.yaml (shopware.system_config key), which acts as an overlay on top of the database value and, only if you explicitly wire it with Symfony's %env(...)% processor, can itself be driven by an .env variable (developer/guides/hosting/configurations/shopware/static-system-config.md) — but by default database-backed settings (e.g. sales channel/store configuration, most things configurable in Administration) are untouched by anything in .env.","citations":["developer/guides/hosting/configurations/shopware/index.md:1-30","developer/products/paas/shopware/fundamentals/environment-variables.md:1-55","developer/guides/hosting/performance/performance-tweaks.md:210-239","developer/guides/hosting/configurations/shopware/static-system-config.md:1-58"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=.env.local, path=developer, mode=files"},{"tool":"list_docs","args":"path=developer, glob=**/*environment*"},{"tool":"read_doc","args":"path=developer/guides/hosting/configurations/shopware/environment-variables.md"},{"tool":"read_doc","args":"path=developer/guides/hosting/configurations/shopware/static-system-config.md"},{"tool":"grep_docs","args":"pattern=env.local, path=developer/guides/development/start-developing.md, context=3"},{"tool":"read_doc","args":"path=developer/products/paas/shopware/fundamentals/environment-variables.md"},{"tool":"grep_docs","args":"pattern=\\.env, path=developer/guides/hosting, regex=true, context=2, maxMatches=30"},{"tool":"read_doc","args":"path=developer/guides/hosting/configurations/shopware/index.md"},{"tool":"read_doc","args":"path=developer/guides/hosting/performance/performance-tweaks.md, offset=210, limit=30"}],"notFoundClaim":false,"memoryClaims":["Standard Symfony Dotenv behavior is that real environment variables set on the server/container are never overwritten by the .env files; Symfony's Dotenv component only fills in variables not already present in the real environment, and .env.local (not committed, machine-specific) overrides plain .env."],"sourceVerdict":"partial"},"dev-63":{"query":"I deployed a plugin update to a 6.7 staging shop and my new migration never ran — which bin/console command applies the pending migrations of that one plugin, and what do I have to pass to it?","category":"dev","option":"mcp-docs","answer":"Use `bin/console database:migrate <identifier> --all`, e.g. `./bin/console database:migrate SwagBasicExample --all`. The (optional) identifier argument decides which migrations get executed — by default it runs the Shopware Core migrations, so to apply your plugin's pending migrations you must explicitly pass your plugin's bundle name (e.g. SwagBasicExample) as the identifier. The command calls the update() methods of any unhandled/new migrations for that identifier. Note: normally new migrations are executed automatically when a plugin is installed or updated via the Plugin Manager (the migration directory is registered in a MigrationCollection); database:migrate is what you run by hand if that didn't happen or during development.","citations":["developer/guides/plugins/plugins/database/database-migrations.md:140-189"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=database:migrate, path=developer"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/database/database-migrations.md, offset=140, limit=50"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-64":{"query":"How do I get an Admin API OAuth token — with client_credentials for an integration, or the password grant for local testing — and how long is each token valid?","category":"dev","option":"mcp-docs","answer":"client_credentials (integration, the default/recommended approach): create an integration in the Administration under Settings → System → Integrations, toggle it as 'Administrator' to get integration permissions, then copy its Access key ID (client_id) and Secret access key (client_secret). Request a token with:\ncurl -s \"http://127.0.0.1:8000/api/oauth/token\" -H \"Content-Type: application/json\" -d '{\"grant_type\": \"client_credentials\", \"client_id\": \"YOUR_ACCESS_KEY_ID\", \"client_secret\": \"YOUR_SECRET_ACCESS_KEY\"}'\nThe response is {\"token_type\":\"Bearer\",\"expires_in\":3600,\"access_token\":\"...\"} — so a client_credentials token is valid for 3600 seconds (1 hour).\n\npassword grant (local development shortcut only, using default Administration credentials admin/shopware):\ncurl -X POST \"http://localhost:8000/api/oauth/token\" -H \"Content-Type: application/json\" -d '{\"grant_type\": \"password\", \"client_id\": \"administration\", \"scopes\": \"write\", \"username\": \"admin\", \"password\": \"shopware\"}'\nThe response is {\"token_type\":\"Bearer\",\"expires_in\":600,\"access_token\":\"...\",\"refresh_token\":\"...\"} — so a password-grant token is valid for only 600 seconds (10 minutes), but it also returns a refresh_token. The docs explicitly say to prefer client_credentials for integrations/reproducible setups and to use the password grant only as a local shortcut.","citations":["developer/guides/development/integrations-api/index.md:1-170","developer/guides/development/integrations-api/auth-api-requests.md:1-143"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=client_credentials, path=developer, mode=files"},{"tool":"list_docs","args":"path=developer, glob=**/*auth*"},{"tool":"read_doc","args":"path=developer/guides/development/integrations-api/auth-api-requests.md"},{"tool":"read_doc","args":"path=developer/guides/development/integrations-api/index.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-65":{"query":"What can I put in the JSON body of POST /api/search/{entity} for filtering, associations, sorting, aggregations and getting an exact total count?","category":"dev","option":"mcp-docs","answer":"The 'search criteria' body accepts the following top-level parameters: `associations` (load additional related data, similar to a SQL join; can contain nested criteria e.g. limit/filter/sort for that association), `includes` (restrict returned fields per entity/apiAlias), `ids` (limit search to a list of IDs), `total-count-mode` (whether/how to compute the total), `page` and `limit` (pagination, page is 1-indexed), `filter` (filters results AND aggregations, same filter types as the DAL), `post-filter` (filters results but not aggregations, useful for facets), `query` (weighted search returning a per-record `_score` in `extensions.search`, each sub-query needs a `score`), `term` (free-text ranking search using the entity's SearchRanking-flagged fields; don't combine with `query`), `sort` (array of {field, order, naturalSorting, type}; type: count sorts by association count, e.g. ORDER BY COUNT(field)), and `grouping` (group results by one or more fields, e.g. one product per manufacturer).\n\nFor an exact total count, set `total-count-mode: 1` in the body — this determines the exact total (uses SQL_CALC_FOUND_ROWS, so it is performance intensive) and should be used when you need to display an exact page count. (`0`, the default, computes no total at all — best performance, use when pagination isn't needed; `2` only determines whether there is a next page — good performance, useful for infinite scrolling.)\n\nExample combining several of these:\n{\n  \"limit\": 10,\n  \"total-count-mode\": 1,\n  \"associations\": {\"manufacturer\": {}},\n  \"filter\": [{\"type\": \"equals\", \"field\": \"active\", \"value\": true}],\n  \"sort\": [{\"field\": \"name\", \"order\": \"ASC\"}],\n  \"aggregations\": [{\"name\": \"average-price\", \"type\": \"avg\", \"field\": \"price\"}]\n}","citations":["developer/guides/development/integrations-api/search-criteria.md:1-444"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/development/integrations-api/search-criteria.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-66":{"query":"Which request headers change Admin API behaviour for language, entity version, parent-child inheritance and skipping flow triggers during a bulk import?","category":"dev","option":"mcp-docs","answer":"`sw-language-id`: returns entities in the given language (the API's plain translatable fields are only populated when there's an explicit translation for that language; the nested `translated` object always has a value with inheritance/fallback applied). Example: POST /api/search/product with header `sw-language-id: be01bd336c204f20ab86eab45bbdbe45`.\n\n`sw-version-id`: entities (e.g. orders) can have multiple versions; without this header the API returns only the most recent record. Include `sw-version-id: <id>` to tell the API which version to return, e.g. POST /api/search/order with `sw-version-id: 0fa91ce3e96a4bc2be4bd9ce752c3425`.\n\n`sw-inheritance`: by default the API returns only an entity's own record without considering parent-child inheritance (e.g. product variants inheriting fields from their parent). Send `sw-inheritance: 1` to make the API resolve inherited fields, e.g. POST /api/search/product with header `sw-inheritance: 1`.\n\n`sw-skip-trigger-flow`: for bulk operations like importing customers via the Sync API, you often don't want flows (e.g. 'send email on customer creation') to fire for every record. Pass `sw-skip-trigger-flow: 1` (e.g. on POST /api/_action/sync) to skip triggering flows for that request.","citations":["developer/guides/development/integrations-api/request-headers.md:1-90"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/development/integrations-api/request-headers.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-67":{"query":"What does a minimal app folder and manifest.xml need to contain, and which console commands install and activate the app on my local Shopware 6.7?","category":"dev","option":"mcp-docs","answer":"Folder structure: apps live under custom/apps/<AppName>/ with a manifest.xml inside, e.g.\ncustom/apps/MyExampleApp/manifest.xml\nThe folder name and the <meta><name> value in manifest.xml must match exactly. A minimal manifest looks like:\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<manifest xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:noNamespaceSchemaLocation=\"https://raw.githubusercontent.com/shopware/shopware/trunk/src/Core/Framework/App/Manifest/Schema/manifest-3.0.xsd\">\n    <meta>\n        <name>MyExampleApp<\/name>\n        <label>Label<\/label>\n        <label lang=\"de-DE\">Name<\/label>\n        <description>A description<\/description>\n        <description lang=\"de-DE\">Eine Beschreibung<\/description>\n        <author>Your Company Ltd.<\/author>\n        <copyright>(c) by Your Company Ltd.<\/copyright>\n        <version>1.0.0<\/version>\n        <icon>Resources/config/plugin.png<\/icon>\n        <license>MIT<\/license>\n    <\/meta>\n<\/manifest>\n<author> and <copyright> are required — if missing/empty, bin/console app:refresh fails.\n\nConsole commands (run inside the PHP container from the project root):\n1. bin/console app:refresh — registers/refreshes any manually created app under custom/apps/<Name>/ (fixes validation errors and re-run if it reports any).\n2. bin/console app:install --activate MyExampleApp — installs the app (using its technical name from <meta><name>, not a filesystem path) and activates it in one step. Without --activate the app is installed inactive; activate it later via Administration (Extensions → My Extensions → Apps) or bin/console app:activate MyExampleApp.\n3. bin/console app:list — check the current app list if the app doesn't appear as expected.\n4. bin/console cache:clear (or cache:clear:http / cache:clear:all) — may be needed after activating an app for changes to take effect.\nAlso useful: bin/console app:validate to identify configuration issues, and --no-validate with app:install to skip validation while debugging.","citations":["developer/guides/plugins/apps/app-base-guide.md:1-120"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=manifest.xml, path=developer/guides/plugins/apps, mode=files"},{"tool":"list_docs","args":"path=developer/guides/plugins/apps"},{"tool":"read_doc","args":"path=developer/guides/plugins/apps/app-base-guide.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-68":{"query":"How does the registration handshake between Shopware and my app backend work — shop id, proof, shop secret and the confirmation call?","category":"dev","option":"mcp-docs","answer":"1. Registration request: Shopware sends a GET request to the URL declared in your manifest, with query params `shop-id` (unique shop identifier), `shop-url` (used later to access the Shopware API), and `timestamp`. Headers include `shopware-app-signature` (HMAC-SHA256 of the query string, signed with the app's own `app-secret`, which you receive from the Shopware Account when uploading the app to the store — for local dev you can set a `<secret>` in the manifest instead, and it's mandatory for private apps with an external app server), `sw-version` (since 6.4.1.0), and, on re-registration only, `shopware-shop-signature` (signed with the shop's current shop-secret). Your backend must recalculate the signature (hash_hmac('sha256', queryString, appSecret)) and compare it to verify the request is really from an authenticated Shopware shop.\n\n2. Registration response: if setup fails you can return {\"error\": \"...\"}. On success you must return a `proof` = SHA-256 HMAC of the concatenation of shopId + shopUrl + your app's name, signed with the app-secret (proves you hold the app-secret). You also generate and return a `secret` — the `shop-secret` — a randomly generated, per-shop secret (64–255 chars) that will be used to sign all further requests between this shop and your app. Finally you return a `confirmation_url` to which Shopware will POST the confirmation. Example response: {\"proof\": \"94b42d39...\", \"secret\": \"random secret string\", \"confirmation_url\": \"https://my.example.com/registration/confirm\"}.\n\n3. Confirmation request: if the proof matches what Shopware calculated, Shopware POSTs to your confirmation_url with a body containing `apiKey`, `secretKey` (used as client_id/client_secret for Admin API OAuth client_credentials), `timestamp`, `shopUrl`, and `shopId`. This request is signed with the shop-secret you provided, and the signature is sent in the `shopware-shop-signature` header — you must recalculate hash_hmac('sha256', requestBody, shopSecret) and compare to confirm the request actually came from that shop. During re-registration, an additional `shopware-shop-signature-previous` header (signed with the shop's previous shop-secret) lets you validate the request came from the same installation that registered before.\n\n4. Secret rotation / shop-url changes: a shop can re-initiate registration under an already-registered shopId (e.g. after a URL change). The re-registration request is signed with both the app-secret and the previous shop-secret; your app must validate both signatures, generate a new shop-secret, and should accept the old secret in parallel for a short grace period (e.g. 1 minute) to avoid breaking in-flight requests.","citations":["developer/guides/plugins/apps/lifecycle/app-registration-setup.md:1-519"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/plugins/apps/lifecycle/app-registration-setup.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-69":{"query":"How does an app subscribe to an event like product.written, what does Shopware POST to the webhook URL, and how do I verify the request is genuine?","category":"dev","option":"mcp-docs","answer":"Subscribing: add a <webhooks> element to your app's manifest.xml, defining a webhook name, a URL, and the event it should fire on, e.g. a webhook named product-changed with url https://example.com/event/product-changed and event=\"product.written\" — every time a product is written, Shopware POSTs to that URL. You can also restrict it to only the live version with onlyLiveVersion=\"true\" (e.g. <webhook name=\"order-created\" url=\"...\" event=\"order.written\" onlyLiveVersion=\"true\"/>, since 6.5.7.0; default is false, meaning all versions trigger it and this option is only honored for HookableEntityWrittenEvent).\n\nWhat gets POSTed: a JSON body with a `source` object (`url` — where your app can reach the Shopware instance/API, `appVersion`, `shopId`, and `eventId` — a stable id even across retries, since 6.4.11.0), a `data` object with `event` (the event name, so one endpoint can handle multiple events) and `payload` (an array of entries; for entity.written events the payload does NOT contain full entity data, only entity name, operation, primaryKey and updatedFields, so the app must fetch full data via the Shop API — this gives the app control over which associations to load), and a top-level `timestamp` (time the webhook was handled, useful to reject stale/replayed requests; available since 6.4.1.0). Example payload for product.written/delete:\n{\"data\":{\"payload\":[{\"entity\":\"product\",\"operation\":\"delete\",\"primaryKey\":\"7b04ebe416db4ebc93de4d791325e1d9\",\"updatedFields\":[]}],\"event\":\"product.written\"},\"source\":{\"url\":\"http://localhost:8000\",\"appVersion\":\"0.0.1\",\"shopId\":\"dgrH7nLU6tlE\",\"eventId\":\"7b04ebe416db4ebc93de4d791325e1d9\"},\"timestamp\":123123123}\nHeaders also include sw-version (since 6.4.1.0), sw-context-language and sw-user-language (since 6.4.5.0).\n\nVerifying authenticity: every webhook request carries a `shopware-shop-signature` header, which is a SHA-256 HMAC of the request body, signed with the shop-secret your app assigned that shop during registration. Recalculate the HMAC over the raw request body using that shop's shop-secret and compare it to the header value — this is the exact same verification mechanism used for the registration confirmation request. Also check the `timestamp` isn't too old to guard against replay attacks.","citations":["developer/guides/plugins/apps/lifecycle/webhook.md:1-145"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/plugins/apps/lifecycle/webhook.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-70":{"query":"How do I implement a payment method in an app with pay-url and finalize-url, and what must the app server return in Shopware 6.7?","category":"dev","option":"mcp-docs","answer":"D
