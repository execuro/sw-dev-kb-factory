edge-02: completeness 100 -> 70","rescore edge-02: actionability 100 -> 70","accuracy pass: all 84 flagged cases were confirmed status; settled against code evidence, zero live fetches, zero bands changed","rescore pass: borderline cases (10) re-scored independently; lower band taken per dimension on disagreement, moving dev-21 and gap-05 from partly to fail"]},"raw":{"mcp-docs":{"dev-01":{"query":"How do I extend the product entity with a new association in Shopware's Data Abstraction Layer?","category":"dev","option":"mcp-docs","answer":"Create an EntityExtension class in <plugin root>/src/Extension/Content/Product/ (e.g. CustomExtension) extending Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityExtension, implement getDefinitionClass() to return ProductDefinition::class, and override extendFields(FieldCollection $collection) to add the new association field (e.g. a OneToOneAssociationField pointing to a new ExampleExtensionDefinition, with autoload=true so it's loaded whenever the product is loaded; mark it with the CascadeDelete flag if it should be cloned/removed with the product). Register the extension in services.php tagged with 'shopware.entity.extension'. If the association needs its own storage, create a new entity definition (e.g. ExampleExtensionDefinition) with an IdField, a FkField('product_id', 'productId', ProductDefinition::class) (plus a ReferenceVersionField if the target entity is versioned), the new field(s), and the inverse OneToOneAssociationField back to the product; register that definition too (tag 'shopware.entity.definition'). Create the actual database table via a migration (with a foreign key constraint referencing product.id/version_id). You then write to the association through the product repository, e.g. $this->productRepository->upsert([['id' => $productId, 'exampleExtension' => ['customString' => 'foo bar']]], $context). If no database storage is needed, you can instead add the extra data at runtime by subscribing to the entity's loaded event (e.g. ProductEvents::PRODUCT_LOADED_EVENT) and calling $entity->addExtension('name', new ArrayEntity([...])). Since Shopware 6.6.10.0 you can also register a BulkEntityExtension (tag 'shopware.bulk.entity.extension') to extend several entities at once from one class. Note: setting autoload to true on both the EntityDefinition and the EntityExtension side causes a recursion/out-of-memory error; set it to true only on the EntityExtension side.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md:1-366","developer/guides/plugins/plugins/framework/data-handling/add-data-associations.md:1-287"],"toolCallLog":[{"tool":"kb_status","args":"{}"},{"tool":"read_doc","args":"path=developer/index.md"},{"tool":"grep_docs","args":"pattern=extend a product entity, path=developer, mode=files"},{"tool":"list_docs","args":"path=developer, glob=**/*association*"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/data-handling/add-data-associations.md"},{"tool":"list_docs","args":"path=developer/guides/plugins/plugins/framework/data-handling"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-02":{"query":"What's the plugin lifecycle in Shopware — install, activate, uninstall — and how does `keepUserData` work?","category":"dev","option":"mcp-docs","answer":"A Shopware plugin (extending Shopware\\Core\\Framework\\Plugin, implemented in <plugin root>/src/SwagBasicExample.php) goes through these lifecycle stages, each with a hook method: install() runs on plugin install (register entities such as payment methods, create initial but inactive data, prepare requirements — avoid creating fully active business data here); activate() runs before plugin activation and is where you activate entities created in install() or create new entities/data now that the plugin is active; deactivate() runs before deactivation and is the opposite — deactivate or remove entities that would otherwise interfere with the system while inactive; update() runs on plugin update for non-database adjustments (DB changes should go through migrations instead), and its UpdateContext additionally exposes getUpdatePluginVersion()/getCurrentPluginVersion(); postInstall()/postUpdate() run after a successful install/update completes; uninstall() runs on plugin uninstallation and should remove or clean up plugin-created data, but should not blindly delete entities that may be referenced by real production data (e.g. a payment method used in orders) — deactivating is safer than deleting. The uninstall() method receives an UninstallContext, which extends InstallContext's info and adds a keepUserData() flag: if $uninstallContext->keepUserData() returns true, the plugin must NOT delete the persistent data it created (the merchant chose to keep it during uninstall), and the uninstall() implementation should check this flag and return early instead of removing data.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md:1-188"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=keepUserData, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-03":{"query":"How do I add a custom Store API route for a headless storefront?","category":"dev","option":"mcp-docs","answer":"1) Create an abstract route class (e.g. AbstractExampleRoute) with an abstract getDecorated(): self method and an abstract load(Criteria $criteria, SalesChannelContext $context): ExampleRouteResponse method, so the route stays decoratable. 2) Create the concrete route class (e.g. ExampleRoute) extending the abstract class, tagged with the PHP #[Route] attribute using defaults [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]] at the class level, and another #[Route] attribute on the load() method giving the path (e.g. '/store-api/example'), a route name (e.g. 'store-api.example.search'), methods (['GET','POST']), and defaults like ['_entity' => 'swag_example']. getDecorated() must throw DecorationPatternException since there is no decoration yet; load() performs the actual work (e.g. $this->exampleRepository->search($criteria, $context->getContext())) and returns an ExampleRouteResponse. 3) Create the response class (e.g. ExampleRouteResponse extends Shopware\\Core\\System\\SalesChannel\\StoreApiResponse), which wraps an EntitySearchResult in its $object property and exposes a getter (e.g. getExamples()) returning the entity collection. 4) Register the route class as a service in <plugin root>/src/Resources/config/services.php, injecting the relevant repository (e.g. 'swag_example.repository'). 5) Add/verify a routes.php file at <plugin root>/src/Resources/config/ that imports the route classes for Symfony's attribute routing, e.g. $routes->import('../../Core/**/*Route.php', 'attribute') — without this import step the route will not be registered as an endpoint even if the class and service exist. 6) Verify with `./bin/console debug:router store-api.example.search`. 7) Optionally document the endpoint for the Stoplight/OpenAPI UI by adding a JSON OpenAPI schema file under <plugin root>/src/Resources/Schema/StoreApi/ (use the AdminApi subfolder for Admin API routes instead), viewable at /store-api/_info/stoplightio.html. 8) To also expose the same functionality to a (non-headless) Storefront, add a Storefront controller (e.g. ExampleController extends StorefrontController) in the storefront route scope that wraps and calls the AbstractExampleRoute, register it as a service, and extend routes.php to also import '../../Storefront/**/*Controller.php'; then it can be requested from custom Storefront JavaScript via fetch(). All fields intended to be exposed via the API on the underlying entity definition must carry the ApiAware flag.","citations":["developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md:1-420"],"toolCallLog":[{"tool":"list_docs","args":"path=developer, glob=**/*store-api*"},{"tool":"grep_docs","args":"pattern=add a custom Store API route, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-04":{"query":"How do I create a custom CMS element for Shopping Experiences?","category":"dev","option":"mcp-docs","answer":"A CMS element is the smallest content primitive in the Shopping Experience (CMS) hierarchy (Page > Section > Block > Slot > Element), placed inside a block's slot. To add a custom one (example uses a 'dailymotion' element): Administration side — under <plugin root>/src/Resources/app/administration/src/, create module/sw-cms/elements/<element-name>/ with index.js, component/ (index.js + .html.twig + .scss), config/ (index.js + .html.twig), and preview/ (index.js + .html.twig + .scss). Import the element folder in main.js. In the element's index.js, call Shopware.Service('cmsService').registerCmsElement({ name, label, component, configComponent, previewComponent, defaultConfig, [hidden], [removable] }) to register it — name is the technical name, label the UI snippet key, component/configComponent/previewComponent the Vue component names, defaultConfig the default config values (each keyed by config property with a {source, value} object). Create the preview component (thumbnail shown in the element picker), the main component (rendered in the editor, using the 'cms-element' mixin and calling this.initElementConfig('<name>') in created()), and the config component (form fields for each defaultConfig property, shown in a modal, also using the cms-element mixin). For inheritance support (so content managers can inherit config from a base layout or override it per page), wrap individual fields with the provided <sw-cms-inherit-wrapper> component. Storefront side — create a Twig template at src/Resources/views/storefront/element/cms-element-<name>.html.twig (the 'cms-element-' prefix plus the technical name is a required naming convention); the `element` variable containing config/meta data is passed into the template automatically; clear the Storefront cache after adding it. Finally, use the new element inside a CMS block (see the 'Add custom CMS block' guide) to make it available in a layout.","citations":["developer/guides/plugins/plugins/content/cms/add-cms-element.md:1-253"],"toolCallLog":[{"tool":"list_docs","args":"path=developer, glob=**/*cms-element*"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/content/cms/add-cms-element.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-05":{"query":"How does theme inheritance work in Shopware — theme.json and SCSS overrides?","category":"dev","option":"mcp-docs","answer":"Every Shopware theme is configured via a theme.json file at <plugin root>/src/Resources/theme.json, which declares four (plus one) resource sections as ordered lists: views, style, script, asset, and optionally configInheritance. Every theme already inherits the default Shopware theme called @Storefront (referenced as that placeholder in each section) even without any extra configuration. To make one theme inherit/extend another custom theme (e.g. a theme 'SwagBasicExampleThemeExtend' extending 'SwagBasicExampleTheme'), you add the parent theme's placeholder (e.g. @SwagBasicExampleTheme) into the relevant section's array, positioned between @Storefront and your own theme's files/placeholder: views: [\"@Storefront\", \"@Plugins\", \"@SwagBasicExampleTheme\", \"@SwagBasicExampleThemeExtend\"] — templates are resolved in that order: base Storefront template, then plugin extensions, then the parent theme's overrides, then finally your own theme's changes. script works the same way (base Storefront JS, then parent theme JS, then your theme's JS last). style (SCSS) is similar but your own overrides.scss file is listed FIRST (before @Storefront/@SwagBasicExampleTheme, with base.scss last), because overrides.scss is meant to affect SCSS variables (e.g. $border-radius) which must be set before the rest of the styles compile — see the 'Override Bootstrap variables in a theme' guide for detail. asset requires you to explicitly add the parent theme's placeholder to the asset array if you want to reuse its assets. configInheritance uses the field configuration from the listed themes and treats the last theme in that list (that differs from the current one) as the parent for the Administration theme-config UI; the Storefront's own theme configuration is always inherited even if configInheritance is omitted entirely.","citations":["developer/guides/plugins/themes/inheritance/add-theme-inheritance.md:1-122"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=theme.json, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/themes/inheritance/add-theme-inheritance.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-06":{"query":"How do I add a custom Flow Builder action?","category":"dev","option":"mcp-docs","answer":"Backend (PHP) part, inside a plugin: 1) Define an 'Aware' interface for your action (e.g. TagAware in <plugin root>/src/Core/Framework/Event/TagAware.php) extending Shopware\\Core\\Framework\\Event\\FlowEventAware and annotated with #[IsFlowEventAware]; it declares constants (e.g. TAG, TAG_ID) and getter methods. 2) Create the action class (e.g. CreateTagAction in <plugin root>/src/Core/Content/Flow/Dispatching/Action/CreateTagAction.php) extending Shopware\\Core\\Content\\Flow\\Dispatching\\Action\\FlowAction, implementing: getName(): string (a unique technical name, e.g. 'action.create.tag'); requirements(): array (the Aware interfaces this action needs — empty array = available for all triggers, a list of specific Aware interfaces like OrderAware/CustomerAware = only for events implementing those, or your own new Aware interface for a brand-new event); and handleFlow(StorableFlow $flow): void, which reads $flow->getConfig() for the admin-configured settings, $flow->getStore($key) for aware-interface data (e.g. TAG_ID), and $flow->getData($key) for original event/additional data, then performs the actual work (e.g. creating tag entities via a repository). 3) Register the action as a service tagged 'flow.action' with a priority (e.g. 600) and a 'key' matching getName(), in <plugin root>/src/Resources/config/services.php — this tag makes it appear in the /api/_info/flow-actions.json response. 4) If introducing a brand-new triggering event (rather than reusing existing ones), create an Event class implementing your new Aware interface, plus a BusinessEventCollectorSubscriber that listens to BusinessEventCollectorEvent and registers the event definition, and add a snippet entry under sw-flow.triggers for its label. Administration (Vue) part: 1) Define a JS constant for the action name (e.g. ACTION.CREATE_TAG = 'action.create.tag') and a GROUP constant (must match one of the known group names general/tag/customer/order, else defaults to 'general'). 2) Add snippet translations (en-GB.json/de-DE.json) for labels. 3) Override the core 'sw-flow-sequence-action' component (Component.override) to: push your GROUP into actionGroups, return your custom modal's name (e.g. 'sw-flow-create-tag-modal') from modalName() when your action is selected, and return your action's label/icon/group from getActionTitle()/getActionDescriptions(). Import this override file in main.js. 4) Build the configuration modal component (e.g. sw-flow-create-tag-modal, with its own index.js + twig template) which emits a 'process-finish' event carrying the sequence with its config object (built from user input, e.g. selected tag IDs) — import it in main.js as well. Alternatively, for actions that don't need a modal, override openDynamicModal() in sw-flow-sequence-action to detect your action name and call onSaveActionSuccess({config}) directly with a computed config, skipping the modal UI entirely.","citations":["developer/guides/plugins/plugins/framework/flow/add-flow-builder-action.md:1-734"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=custom flow action, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/flow/add-flow-builder-action.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-07":{"query":"My plugin needs to store its own data in a new table — how do I define a custom DAL entity with its definition, entity and collection class so I get a repository for it?","category":"dev","option":"mcp-docs","answer":"1) Create the database table first via a plugin migration (<plugin root>/src/Migration/Migration<timestamp>Example.php extending MigrationStep, implementing getCreationTimestamp() and update(Connection $connection) which runs a CREATE TABLE statement, e.g. table swag_example with id BINARY(16) PK, name, description, active, created_at, updated_at). Always prefix custom tables with your manufacturer/plugin prefix. 2) Create an EntityDefinition class (e.g. <plugin root>/src/Core/Content/Example/ExampleDefinition.php extending Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityDefinition). Implement getEntityName(): string returning the exact table name (e.g. 'swag_example' via a public ENTITY_NAME const) — this name is also used as the DI repository service id (<name>.repository). Implement defineFields(): FieldCollection returning a FieldCollection of Field objects matching your table's columns (created_at/updated_at are automatic and don't need to be declared); e.g. IdField('id','id') flagged Required+PrimaryKey, StringField('name','name'), StringField('description','description'), BoolField('active','active'). Field constructors take a snake_case storageName and a lowerCamelCase propertyName. 3) Register the definition in services.php tagged 'shopware.entity.definition' with ['entity' => 'swag_example'] — this is what makes Shopware aware of the entity and creates the swag_example.repository service; at this point you can already inject and use the repository to read/write data, but you'll get generic ArrayEntity instances. 4) (Recommended) Create an Entity class (e.g. ExampleEntity extends Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity, using the EntityIdTrait) with one protected property (getter/setter) per field defined in the definition (excluding id, handled by the trait) — properties must be at least protected (never private, never readonly) or the DAL cannot set them. Then override getEntityClass(): string in the definition to return ExampleEntity::class so repository reads return typed ExampleEntity instances instead of ArrayEntity. 5) (Recommended) Create an EntityCollection class (e.g. ExampleCollection extends Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityCollection), overriding getExpectedClass(): string to return ExampleEntity::class (optionally add custom helper/filter methods). Override getCollectionClass(): string in the definition to return ExampleCollection::class. After these steps the entity is fully registered, accessible through the API, and usable for full CRUD via its repository.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md:1-315"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-08":{"query":"In a plugin service, what is the Shopware 6 equivalent of Doctrine's `findBy()` — how do I read products with filters, associations and sorting?","category":"dev","option":"mcp-docs","answer":"Shopware 6's Data Abstraction Layer (DAL) replaces a Doctrine ORM/findBy() pattern with EntityRepository::search(Criteria $criteria, Context $context), returning an EntitySearchResult (an iterable EntityCollection). Inject the repository via DI using the service name '<entity_name>.repository' (e.g. 'product.repository'), typed as Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository. Basic read: $this->productRepository->search(new Criteria(), $context). To search by ID(s), pass an array of IDs into the Criteria constructor: new Criteria([$myId]), then ->first() to get a single entity (or null). To filter by any other field, add filters to the Criteria object, e.g. $criteria->addFilter(new EqualsFilter('name', 'Example name')) (Shopware\\Core\\Framework\\DataAbstractionLayer\\Search\\Filter\\EqualsFilter — analogous to WHERE field = value); filters can be combined with OrFilter/AndFilter/NandFilter etc. addPostFilter() applies a filter to the main result set without affecting aggregations. Associations are loaded with $criteria->addAssociation('productReviews') (dot-chainable, e.g. 'productReviews.customer'); to filter within an association use $criteria->getAssociation('productReviews')->addFilter(new RangeFilter('points', [RangeFilter::GTE => 4])) — note that filtering via getAssociation only limits which related rows are attached, while adding the same field filter directly to the main Criteria (e.g. on 'productReviews.points') restricts which top-level entities are returned at all. Many-to-many mapping entities (e.g. ProductCategoryDefinition) cannot be read via search(); use searchIds() instead. Aggregations use $criteria->addAggregation(new AvgAggregation('avg-rating', 'productReviews.points')) and are read from $result->getAggregations()->get('avg-rating') (do not call first() when you need aggregation data). Limiting/paging/sorting: $criteria->setLimit(10), $criteria->setOffset(1), $criteria->addSorting(new FieldSorting('createdAt', FieldSorting::ASCENDING)) — for RepositoryIterator-based iteration over huge result sets, ensure the sorting is deterministic (e.g. always include a unique field like 'id' in the sort) to avoid entities being skipped or duplicated across batches. For very large datasets, use Shopware\\Core\\Framework\\DataAbstractionLayer\\Dbal\\Common\\RepositoryIterator, which fetches data in configurable batches via repeated iterator->fetch() calls instead of loading everything at once.","citations":["developer/guides/plugins/plugins/framework/data-handling/reading-data.md:1-390"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/data-handling/reading-data.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-09":{"query":"How do I make a field on my plugin's own entity translatable per language?","category":"dev","option":"mcp-docs","answer":"Given an existing custom entity (e.g. swag_example): 1) Create a migration for a new translation table named '<entity>_translation' (e.g. swag_example_translation) with columns swag_example_id (FK to swag_example.id, ON DELETE/UPDATE CASCADE), language_id (FK to language.id, cascade), the translated column(s) (e.g. name), created_at, updated_at, and a composite PRIMARY KEY (swag_example_id, language_id). 2) Create a translation EntityDefinition (e.g. ExampleTranslationDefinition, placed under <Entity>/Aggregate/<Entity>Translation/) extending Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityTranslationDefinition instead of the plain EntityDefinition. Implement getEntityName() (returning 'swag_example_translation') and override getParentDefinitionClass() to return the parent entity's definition class (ExampleDefinition::class); defineFields() only needs to declare the actual translatable field(s) (e.g. a StringField('name','name') flagged Required) — the language_id and other base translation fields are added automatically by EntityTranslationDefinition. 3) Register both definitions in services.php tagged 'shopware.entity.definition', registering the translation definition after the main entity definition. 4) Create a translation Entity class (e.g. ExampleTranslationEntity extends Shopware\\Core\\Framework\\DataAbstractionLayer\\TranslationEntity, which already provides language_id handling) with properties+getters/setters for the parent id (e.g. exampleId), the translated field(s) (e.g. name), and an association property back to the parent entity (e.g. example: ExampleEntity); wire it in via getEntityClass() on the translation definition. 5) Create a translation EntityCollection (e.g. ExampleTranslationCollection extends EntityCollection, overriding getExpectedClass() to return ExampleTranslationEntity::class) and set it via getCollectionClass(). 6) On the MAIN entity's definition (e.g. ExampleDefinition), add a TranslatedField('name') (flagged ApiAware + Required) instead of a plain StringField for the field you want translatable, and add a TranslationsAssociationField(ExampleTranslationDefinition::class, 'swag_example_id') (also flagged ApiAware + Required) so the DAL knows how to join to the translation table. When reading data back, prefer entity.translated.field (e.g. product.translated.name) in Storefront/sales-channel contexts to get the resolved value for the current language/fallback chain, and the plain entity.field in Admin/CRUD contexts where you need the value as stored for the currently active language.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-data-translations.md:1-298"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/data-handling/add-data-translations.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-10":{"query":"How do I write an indexer that precomputes derived data for my custom entity on write, and how do I trigger a full reindex?","category":"dev","option":"mcp-docs","answer":"Create a class (e.g. ExampleIndexer in <plugin root>/src/Core/Framework/DataAbstractionLayer/Indexing/ExampleIndexer.php) extending Shopware\\Core\\Framework\\DataAbstractionLayer\\Indexing\\EntityIndexer and implement: getName(): string — a unique indexer name used by the EntityIndexerRegistry (e.g. 'swag.basic.example.indexer'); iterate($offset): ?EntityIndexingMessage — called for a FULL index run, uses an IteratorFactory (Shopware\\Core\\Framework\\DataAbstractionLayer\\Dbal\\Common\\IteratorFactory) against the repository's definition to fetch a batch of IDs by offset and returns an EntityIndexingMessage(ids, newOffset), or null when there is nothing left to process; update(EntityWrittenContainerEvent $event): ?EntityIndexingMessage — called whenever entities are written through the DAL, pulls the changed primary keys via $event->getPrimaryKeys(<EntityDefinition>::ENTITY_NAME), and returns an EntityIndexingMessage(ids, null, $event->getContext()) (or null if nothing changed) — you can inspect the event to filter only relevant column changes for efficiency; handle(EntityIndexingMessage $message): void — actually performs the precomputation/derived-data write for the given IDs (e.g. calculating and persisting a value), run either synchronously right after update() or asynchronously via the message queue. Register the indexer service tagged 'shopware.entity_indexer' (this tag is required for it to be picked up). To avoid infinite loops, do NOT use the DAL/repository to write inside handle() — writing through the DAL would re-trigger EntityWrittenContainerEvent and re-trigger the same indexer; instead write with the raw Doctrine\\DBAL\\Connection directly. If you must use the DAL anyway, disable indexing for that write by calling $context->addState(EntityIndexerRegistry::DISABLE_INDEXING) on the context passed into the new EntityIndexingMessage. By default messages from update() are handled synchronously (handle() runs immediately); pass true as the EntityIndexingMessage's 4th constructor parameter ($forceQueue) to process them asynchronously through the message queue instead. Alternative for reacting to CHANGES on existing core entities: instead of writing your own indexer, subscribe to the event dispatched by an existing core indexer's handle() method (e.g. CustomerIndexerEvent, and similarly for CategoryIndexer, LandingPageIndexer, ProductIndexer, ProductStreamIndexer, PromotionIndexer, RuleIndexer, MediaIndexer, MediaFolderIndexer, MediaFolderConfigurationIndexer, SalesChannelIndexer, BreadcrumpIndexer) via a normal event subscriber tagged 'kernel.event_subscriber', again writing with the Connection directly rather than the DAL to avoid the same infinite-loop risk. To trigger a full reindex: the console command `bin/console dal:refresh:index` performs a full entity index (this is what internally invokes each registered indexer's iterate() over all records); a full reindex can also be requested by a user from the Administration settings.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-data-indexer.md:1-288"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/data-handling/add-data-indexer.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-11":{"query":"On Shopware 6.7, which file do I declare my plugin's services in, and how do I get a core service passed into my service's constructor?","category":"dev","option":"mcp-docs","answer":"On Shopware 6.7 you declare plugin services in `src/Resources/config/services.php` (PHP config using Symfony's `ContainerConfigurator`) — the older `services.xml` format is deprecated in 6.7 and removed in 6.8 (per the migration ADR). To create a service, register it in `services.php`, e.g. `$services->set(ExampleService::class);` or use `->defaults()->autowire()->autoconfigure()` plus `$services->load('Swag\\\\BasicExample\\\\', '../../')` to auto-register everything under `src`. To get a core service (e.g. `SystemConfigService`) injected into your service's constructor: if autowire/autoconfigure is enabled, simply type-hint the core service as a constructor parameter (`public function __construct(private SystemConfigService $systemConfigService) {}`) and Symfony wires it automatically. If you declared the service explicitly (no autowiring), add it as an explicit argument in `services.php` using the `service()` helper, e.g. `$services->set(ExampleService::class)->args([service(SystemConfigService::class)]);`.","citations":["developer/guides/plugins/plugins/services/add-custom-service.md:1-123","developer/guides/plugins/plugins/services/dependency-injection.md:1-78","developer/resources/references/adr/2026-07-30-migrate-container-configuration-from-xml-to-php.md:1-36"],"toolCallLog":[{"tool":"kb_status","args":"{}"},{"tool":"read_doc","args":"path=developer/index.md"},{"tool":"grep_docs","args":"pattern=services.xml, path=developer, mode=files"},{"tool":"list_docs","args":"path=developer"},{"tool":"list_docs","args":"path=developer/guides/plugins, depth=3"},{"tool":"read_doc","args":"path=developer/resources/references/adr/2026-07-30-migrate-container-configuration-from-xml-to-php.md"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/services/dependency-injection.md"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/services/add-custom-service.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-12":{"query":"I am on Shopware 6.6 — which file do I declare my plugin's service dependencies in, and how do I pass another service into the constructor?","category":"dev","option":"mcp-docs","answer":"This docs corpus is an unversioned, current snapshot (reflecting the 6.7/6.8-era migration to PHP config), so it no longer carries a dedicated 6.6 services.xml guide with worked examples — the current 'Add Custom Service' and 'Dependency Injection' pages only show the `services.php` (ContainerConfigurator) approach. However, the migration ADR confirms that prior to 6.7, plugins declared services 'by convention' in `Resources/config/services.xml`, and XML service tags (e.g. `<service id=\"...\"><tag name=\"...\"/><\/service>`) are shown as the historical format in one ADR example. Based on that context and standard Symfony XML service configuration (which the ADR references as the format being migrated away from), on 6.6 you would declare services in `<plugin root>/src/Resources/config/services.xml`, and to inject another service into the constructor you would add it as an `<argument type=\"service\" id=\"...\"/>` under the `<service>` definition (Symfony's XML DI syntax) [from memory, since the corpus does not retain a full 6.6 XML services.xml worked example]. The corpus does not contain a citable page showing the full XML constructor-injection example.","citations":["developer/resources/references/adr/2026-07-30-migrate-container-configuration-from-xml-to-php.md:1-36","developer/resources/references/adr/2026-03-17-mcp-server-placement-and-extensibility.md:240-279","developer/guides/plugins/plugins/services/add-custom-service.md:1-123"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=services.xml, path=developer, context=3"},{"tool":"read_doc","args":"path=developer/resources/references/adr/2026-03-17-mcp-server-placement-and-extensibility.md, offset=240, limit=40"}],"notFoundClaim":true,"memoryClaims":["On Shopware 6.6, plugin services are declared in src/Resources/config/services.xml, and a constructor dependency is passed via <argument type=\"service\" id=\"...\"/> inside the <service> tag (standard Symfony XML DI syntax)."],"sourceVerdict":"partial"},"dev-13":{"query":"There is no event for what I need to change in a core Shopware service — how do I decorate or replace that service from my plugin?","category":"dev","option":"mcp-docs","answer":"Use service decoration. Shopware services designed for decoration expose an abstract class as their contract (with a getDecorated() method) instead of a plain interface, so new methods can be added later without breaking existing decorators. In your plugin's services.php, register your decorator service and call ->decorate(OriginalService::class), passing service('.inner') as an argument so your decorator receives the original (or next-in-chain) service instance:\n\n```php\n$services->set(ExampleServiceDecorator::class)\n    ->decorate(ExampleService::class)\n    ->args([service('.inner')]);\n```\n\nYour decorator class extends the same abstract class as the original service, implements getDecorated() to return the wrapped instance, and can call the inner service before/after adding its own logic, modify arguments/return values, or replace the logic entirely. Key rules: always type-hint the abstract class (never the concrete class) in constructors so you stay part of the decoration chain; always delegate to the inner service unless you intentionally want to discard the rest of the chain, since decorators nest (multiple plugins decorating the same service each wrap the next); and prefer decoration only when there is no purpose-built extension point (extension points, subscribed via `.pre`/`.post`/`.error` events, allow multiple plugins to participate without forming a fragile chain).","citations":["developer/guides/plugins/plugins/services/adjusting-service.md:1-224"],"toolCallLog":[],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-14":{"query":"I wrote a subscriber class in my plugin but it never fires — which interface and which service tag (`shopware.event_subscriber`?) register it?","category":"dev","option":"mcp-docs","answer":"Your subscriber class must implement Symfony's `EventSubscriberInterface` (from `Symfony\\Component\\EventDispatcher\\EventSubscriberInterface`) and define a static `getSubscribedEvents()` method mapping event names to handler methods. That alone is not enough: the class must also be registered in your plugin's `src/Resources/config/services.php` and tagged with `kernel.event_subscriber` (not `shopware.event_subscriber` — that tag name does not appear in the docs). Example:\n\n```php\n$services->set(MySubscriber::class)\n    ->tag('kernel.event_subscriber');\n```\n\nIf the class is missing from services.php (or missing the tag), Shopware will not call it, and there is no obvious error indicating the event was not handled — this is exactly the symptom of 'subscriber never fires'.","citations":["developer/guides/plugins/plugins/framework/event/listening-to-events.md:1-144"],"toolCallLog":[{"tool":"list_docs","args":"path=developer/guides/plugins/plugins/framework/event"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/event/listening-to-events.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-15":{"query":"How do I work out which event Shopware actually dispatches for a given action, for example after a product is loaded or a page is rendered?","category":"dev","option":"mcp-docs","answer":"The 'Finding Events' guide gives several concrete techniques: (1) DAL events follow the pattern `entity_name.event`, e.g. `product.loaded`/`product.written`/`product.deleted`; some entities also expose an 'Event class' with constants (e.g. ProductEvents) found by searching for `@Event`. (2) For general PHP events, read the core code for `$this->eventDispatcher->dispatch($someEvent, $someEvent->getName())` calls, or search the codebase for `extends NestedEvent`, `extends Event`, `implements ShopwareEvent`, or `->dispatch`. (3) Check a service's constructor/service definition for `event_dispatcher` / EventDispatcherInterface to see which services can fire events. (4) Page-loaded events: Storefront page loaders (e.g. GenericPageLoader) dispatch a `<Page>LoadedEvent` (e.g. GenericPageLoadedEvent) every time a page loads — search for the term 'PageLoadedEvent'. (5) Criteria events (e.g. ProductListingCriteriaEvent) fire whenever a DAL Criteria-based entity load happens — search for 'CriteriaEvent'. (6) Route-specific events: Shopware adds `{route}.request`, `{route}.response`, `{route}.render` (Storefront, before twig rendering), `{route}.encode` (Store-API, before JSON encoding, since 6.6.11.0), and `{route}.controller` (since 6.6.11.0) — substitute the actual Symfony route name, e.g. `store-api.product.listing.request`. (7) Business events (e.g. CustomerLoginEvent) can be found via `implements BusinessEventInterface` or `implements MailActionInterface`. (8) Easiest in practice: use the Symfony Profiler's 'Events' tab to see every event fired during the current request, with the exact name to subscribe to.","citations":["developer/guides/plugins/plugins/framework/event/finding-events.md:1-310"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/event/finding-events.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-16":{"query":"How do I run plugin logic whenever an order is written, and find out exactly which fields changed?","category":"dev","option":"mcp-docs","answer":"Create a subscriber implementing EventSubscriberInterface and subscribe to `OrderEvents::ORDER_WRITTEN_EVENT` (handler receives `EntityWrittenEvent`); guard with `if ($event->getContext()->getVersionId() !== Defaults::LIVE_VERSION) { return; }` since orders are versioned and you usually only want the live version. By default no changeset is generated (for performance), so to see exactly which fields changed you additionally subscribe to `PreWriteValidationEvent` (fired before the write result set is built). In that handler, iterate `$event->getCommands()`, skip any command that is not `ChangeSetAware` or whose entity name is not `OrderDefinition::ENTITY_NAME`, and call `$command->requestChangeSet()` on the matching command(s). Then, back in your `ORDER_WRITTEN_EVENT` handler, iterate `$event->getWriteResults()` and call `$result->getChangeSet()` on each to read the actual before/after field changes. Register the subscriber in `src/Resources/config/services.php` tagged `kernel.event_subscriber`.","citations":["developer/guides/plugins/plugins/checkout/order/listen-to-order-changes.md:1-138"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=order.written, path=developer, mode=files"},{"tool":"list_docs","args":"path=developer/guides/plugins/plugins/framework/data-handling"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/data-handling/using-database-events.md"},{"tool":"grep_docs","args":"pattern=ChangeSet, path=developer"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/checkout/order/listen-to-order-changes.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-17":{"query":"How do I overwrite the price of a product line item in the cart at runtime from a plugin?","category":"dev","option":"mcp-docs","answer":"Directly changing a line item's price like this should be rare (prefer a discount/surcharge for normal cases — see Add Cart Discounts); it is meant for cases like live-shopping pricing. Implement one class that plays both roles: a collector implementing `Shopware\\Core\\Checkout\\Cart\\CartDataCollectorInterface::collect()` and a processor implementing `Shopware\\Core\\Checkout\\Cart\\CartProcessorInterface::process()`. In `collect()`, filter the original Cart's line items to `LineItem::PRODUCT_LINE_ITEM_TYPE`, fetch the new price for each product (from your own data source), and store it into the `CartDataCollection` keyed by a prefixed line-item id (e.g. `price-overwrite-<id>`), skipping ids you've already fetched to avoid duplicate lookups across recalculations. In `process()`, iterate the product line items of `$toCalculate` (not `$original` — that's the cart that will actually be used), look up the stored price for each by the same key, build a `QuantityPriceDefinition($newPrice, $product->getPrice()->getTaxRules(), $product->getPrice()->getQuantity())`, calculate it via an injected `Shopware\\Core\\Checkout\\Cart\\Price\\QuantityPriceCalculator::calculate($definition, $context)`, then call `$product->setPrice($calculated)` and `$product->setPriceDefinition($definition)`. Never query the database inside `process()` — only inside `collect()`. Finally, register the class in `services.php` tagged with both `shopware.cart.processor` and `shopware.cart.collector` (e.g. priority 4500 to run after the core product processor).","citations":["developer/guides/plugins/plugins/checkout/cart/change-price-of-item.md:1-289"],"toolCallLog":[{"tool":"list_docs","args":"path=developer/guides/plugins/plugins/checkout/cart"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/checkout/cart/change-price-of-item.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-18":{"query":"My plugin's cart processor adds a surcharge line item, but it is added again on every recalculation and its price is stale after the customer changes the quantity — how do I split the work between the collector and the processor?","category":"dev","option":"mcp-docs","answer":"Both symptoms trace back to putting the wrong work in the wrong stage. The collector's job (implementing `CartDataCollectorInterface::collect(CartDataCollection $data, Cart $original, SalesChannelContext $context, CartBehavior $behavior)`) is only to fetch/cache external data you need (DB query, API call, computed rate) and store it in `$data` under a unique key — it must not touch the cart's line items itself, and it should skip ids it already fetched (checking `$data->has($key)`) so repeated recalculations in one request don't re-query. The processor's job (`CartProcessorInterface::process(CartDataCollection $data, Cart $original, Cart $toCalculate, SalesChannelContext $context, CartBehavior $behavior)`) is where you actually add/modify line items — and crucially it must always work against the current state of `$toCalculate` (which reflects the customer's latest quantity/cart state) rather than any price value cached from a previous run, and it must never query the database itself (only read what the collector already put into `$data`). Because `$toCalculate` is rebuilt fresh for each cart recalculation, adding your surcharge line item inside `process()` on every call is expected and correct — it is not 'added again' as a bug, it is how the processor re-derives the cart each time; the actual bug causing duplication/staleness is usually (a) adding the line item during `collect()` instead of `process()`, or (b) computing/caching the surcharge amount once in the collector using a quantity that becomes stale, instead of recalculating the price definition (e.g. via `QuantityPriceDefinition` + `QuantityPriceCalculator::calculate()`, using the line item's *current* quantity/price from `$toCalculate`) fresh inside `process()` every time. Register your combined class with both `shopware.cart.collector` and `shopware.cart.processor` tags in `services.php`.","citations":["developer/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md:1-110","developer/guides/plugins/plugins/checkout/cart/change-price-of-item.md:1-289"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/checkout/cart/add-cart-discounts.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"dev-19":{"query":"I need to move long-running work in my plugin out of the request into the message queue — what does the handler class look like and how is it registered?","category":"dev","option":"mcp-docs","answer":"Shopware integrates Symfony Messenger. First, define a message class (a plain, serializable PHP object carrying the data your handler needs), e.g. under `<plugin root>/src/MessageQueue/Message/SmsNotification.php`, implementing `Shopware\\Core\\Framework\\MessageQueue\\AsyncMessageInterface` so it is handled asynchronously instead of synchronously (implement `LowPriorityMessageInterface` instead/additionally, 6.5.7.0+, if it should go to the low-priority queue). Dispatch it from a service by injecting `Symfony\\Component\\Messenger\\MessageBusInterface` and calling `$this->bus->dispatch(new SmsNotification($message));` (or wrap it in a `Symfony\\Component\\Messenger\\Envelope` with stamps like `DelayStamp` for metadata).\n\nThe handler class looks like this:\n```php\n// <plugin root>/src/MessageQueue/Handler/SmsHandler.php\n<?php declare(strict_types=1);\n\nnamespace Swag\\BasicExample\\MessageQueue\\Handler;\n\nuse Symfony\\Component\\Messenger\\Attribute\\AsMessageHandler;\nuse Swag\\BasicExample\\MessageQueue\\Message\\SmsNotification;\n\n#[AsMessageHandler]\nclass SmsHandler\n{\n    public function __invoke(SmsNotification $message)\n    {\n        // ... do the actual (long-running) work\n    }\n}\n```\nMark the class with the `#[AsMessageHandler]` PHP attribute and implement `__invoke()` typed to the message class; the `handle_messages` middleware calls it once the message is dispatched. Registration is done by tagging the service with `messenger.message_handler` (the `#[AsMessageHandler]` attribute triggers this tag automatically in a Symfony/Shopware DI setup). You can define multiple handlers for the same message class.","citations":["developer/guides/plugins/plugins/framework/message-queue/add-message-handler.md:1-51","developer/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md:1-143"],"toolCallLog":[{"tool":"list_docs","args":"path=developer/guides/plugins/plugins/framework/message-queue"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/message-queue/add-message-handler.md"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-20":{"query":"How do I add my own condition to the Rule Builder from a plugin so shop owners can select it?","category":"dev","option":"mcp-docs","answer":"You need both a PHP rule class and an Administration registration. PHP side: create a class (e.g. `FirstMondayOfTheMonthRule`) under `<plugin root>/src/Core/Rule` extending the abstract `Shopware\\Core\\Framework\\Rule\\Rule`. Implement `getName(): string` (a unique technical name, e.g. `first_monday`), `match(RuleScope $scope): bool` (the actual condition logic — never run DB queries or slow operations here), and `getConstraints(): array` (declares the configurable fields and their validation types, e.g. `['isFirstMondayOfTheMonth' => [new Type('bool')]]`); condition properties must be `protected`, not `private`. Optionally implement `getConfig(): RuleConfig` (e.g. `(new RuleConfig())->booleanField('isFirstMondayOfTheMonth')`) to auto-generate a generic `sw-condition-generic` UI and skip building a custom component. Register the rule class in `services.php` tagged `shopware.rule.definition`.\n\nAdministration side (if not using getConfig()): create `src/Resources/app/administration/src/decorator/rule-condition-service-decoration.js` and use `Shopware.Application.addServiceProviderDecorator('ruleConditionDataProviderService', (ruleConditionService) => { ruleConditionService.addCondition('first_monday', { component: 'swag-first-monday', label: 'Is first monday of the month', scopes: ['global'] }); return ruleConditionService; });` — the condition name must match `getName()` in PHP. Optionally group it via `ruleConditionService.upsertGroup(...)` plus a `group` property on the condition. Build a Vue component (e.g. `swag-first-monday`) extending `sw-condition-base` with a template overriding the `sw_condition_value_content` block, and register it plus the decorator import from a `main.js` entry point. Note: rules can be 'context-aware' (restricted to certain assignment targets like promotions/advanced prices) via `getAwarenessConfigurationByAssignmentName` and `addAwarenessConfiguration` on the same service, if you need to restrict where the new condition can be used.","citations":["developer/guides/plugins/plugins/framework/rule/add-custom-rules.md:1-368"],"toolCallLog":[{"tool":"list_docs","args":"path=developer/guides/plugins/plugins/framework/rule"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/rule/add-custom-rules.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-21":{"query":"My plugin dispatches its own domain event — how do I make it show up as a trigger in the Flow Builder?","category":"dev","option":"mcp-docs","answer":"Make your event class implement Shopware's FlowEventAware interface (plus one of the more specific *Aware interfaces such as CustomerAware, OrderAware, MailAware, UserAware, or SalesChannelAware depending on the data it carries, or define your own custom Aware interface + FlowStorer if none fit) and implement `getName()` plus a static `getAvailableData()`. Then register the event with the Flow Builder by adding an EventSubscriber on `BusinessEventCollectorEvent` (with a high priority, e.g. 1000, so it runs before other subscribers) that calls `$businessEventCollector->define(YourEvent::class)` and adds the resulting definition to the collection via `$collection->set($definition->getName(), $definition)`. Register that subscriber as a service tagged `kernel.event_subscriber` in `src/Resources/config/services.php`. After that, the event appears as a selectable trigger named after its EVENT_NAME under Administration > Settings > Flow Builder > Add flow, together with the actions its Aware interfaces unlock (e.g. add/remove tag for CustomerAware/OrderAware).","citations":["developer/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md:1-409"],"toolCallLog":[{"tool":"kb_status","args":""},{"tool":"read_doc","args":"path=developer/index.md"},{"tool":"grep_docs","args":"pattern=flow builder, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-22":{"query":"How do I give my plugin a settings page the shop operator can fill in, and what field types are available?","category":"dev","option":"mcp-docs","answer":"Create `src/Resources/config/config.xml` in your plugin (referencing the config.xsd schema); Shopware renders it dynamically in the Administration as a plugin configuration page — no custom Administration module needed. The file is organized into `<card>` elements, each with a `<title>` and at least one `<input-field>`. Each `<input-field>` needs a `<name>` (4+ chars, letters/numbers, not starting with a number) and a `type` attribute controlling the rendered control; supported basic types are: text, textarea, text-editor, url, password, int, float, bool, checkbox, datetime, date, time, colorpicker, single-select, and multi-select (single/multi-select need an `<options>` list of `<option>` id/name pairs). Common settings apply across types: label/placeholder/helpText (translatable via `lang` attribute), defaultValue, disabled, required, copyable (for text-like fields), min/maxLength (text/url/password), min/max (int/float), and `cache-relevant=\"true\"` (6.7.12+) to mark fields that affect cached storefront output. For more complex needs you can use a `<component name=\"...\">` element instead of `<input-field>`, e.g. sw-entity-single-select, sw-entity-multi-id-select, sw-media-field, sw-text-editor, and sw-snippet-field. Once saved, the shop operator fills in values via Administration > Extensions > My extensions > Plugins > (your plugin) > Configure.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md:1-477"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=plugin config, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-23":{"query":"How do I ship a mail template with my plugin so it is installed automatically, including a custom mail template type?","category":"dev","option":"mcp-docs","answer":"Use a plugin database migration (not the Administration) to insert directly into the mail template tables so the template installs automatically when the plugin is installed. Steps: (1) get or create a `mail_template_type` ID — to reuse an existing type (e.g. 'contact_form') just SELECT its id by technical_name; to create a custom type, INSERT IGNORE into `mail_template_type` with a new UUID, a unique `technical_name` (e.g. 'custom_mail_template_type'), and `available_entities` as a JSON map of entity aliases (e.g. `{'product':'product'}`) that should be available as template variables, then INSERT the translated names into `mail_template_type_translation` per language. (2) INSERT IGNORE into `mail_template` with a new UUID, the `mail_template_type_id`, and `system_default = 0`. (3) INSERT IGNORE into `mail_template_translation` for each language you support (looked up via the `language`/`locale` tables), providing sender_name, subject, description, content_html and content_plain. Always use `INSERT IGNORE` so re-running the migration on update/reinstall doesn't throw, and never delete mail templates on uninstall since they may be referenced elsewhere. Once the plugin (with its migration) is installed, the template and its type appear automatically in Shopware/Administration.","citations":["developer/guides/plugins/plugins/content/mail/add-mail-template.md:1-309"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=mail template, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/content/mail/add-mail-template.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-24":{"query":"How do I get readable SEO URLs generated for the detail pages of my plugin's own entity?","category":"dev","option":"mcp-docs","answer":"This is the 'Dynamic SEO URLs for entities' case. Create a class implementing `SeoUrlRouteInterface` (e.g. `ExamplePageSeoUrlRoute`) with: `getConfig()` returning a `SeoUrlRouteConfig` built from your entity's definition, the technical detail-page route name (e.g. 'frontend.example.example'), and a default SEO path template such as `'{{ example.name }}'`; `prepareCriteria()` to narrow/extend the Criteria used to fetch entities for SEO generation (e.g. filter to active entities, add associations); and `getMapping()` returning a `SeoUrlMapping` with the foreign key (e.g. `['exampleId' => $entity->getId()]`) and the data available to the template (e.g. `['example' => $entity->jsonSerialize()]`). Register this class as a service tagged `shopware.seo_url.route`. Then add an event subscriber listening to your entity's DAL `<entity>.written` (and `<entity>.deleted`) events that calls `SeoUrlUpdater::update($routeName, $event->getIds())` so a SEO URL is (re)generated whenever an entity is written, and marked `is_deleted` when it's deleted. Finally, add a plugin migration inserting a row into `seo_url_template` with `route_name`, `entity_name` (your entity's technical name), and `template` (the same default template constant) — this seeds the template so `SeoUrlUpdater` knows how to build the path. After installing the plugin, every write of your entity automatically produces/updates a readable `seo_url` entry for its detail page route.","citations":["developer/guides/plugins/plugins/content/seo/add-custom-seo-url.md:1-573"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=seo url, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/content/seo/add-custom-seo-url.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-25":{"query":"How do I add a `bin/console` command to my plugin for a maintenance task?","category":"dev","option":"mcp-docs","answer":"Shopware CLI commands are just Symfony Console commands. Create a command class (e.g. `<plugin root>/src/Command/ExampleCommand.php`) extending Symfony's `Command`, using the `#[AsCommand(name: 'swag:example', description: '...')]` attribute, and implement `execute(InputInterface $input, OutputInterface $output): int` returning `Command::SUCCESS`. Then register it as a service in `src/Resources/config/services.php` and tag it with `console.command`: `$services->set(Swag\\BasicExample\\Command\\ExampleCommand::class)->tag('console.command');`. Once registered this way, the command is automatically available via `bin/console` (e.g. `bin/console swag:example`) with no further wiring needed.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md:1-48"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=console command, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=console.command, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-26":{"query":"How do I add a custom document type such as a pro-forma invoice in Shopware 6.7?","category":"dev","option":"mcp-docs","answer":"In Shopware 6.7 there are two coexisting document systems, and the docs cover both. The legacy system (deprecated, to be removed in 6.9, still the default in 6.7) requires: (1) a plugin migration inserting a row into `document_type` (technical_name, e.g. 'example') plus `document_type_translation` rows per language, and a `document_base_config` (+ `document_base_config_sales_channel`) row holding default settings like displayPrices/pageSize/companyName/etc.; (2) a renderer class implementing `Shopware\\Core\\Checkout\\Document\\Renderer\\AbstractDocumentRenderer` (methods `supports()` returning the technical name, `render()` building a `RendererResult`/`RenderedDocument` per order via the `DocumentFileRendererRegistry`, and `getDecorated()`), registered as a service tagged `document.renderer`; (3) a Twig template at `<plugin root>/src/Resources/views/documents/<type>.html.twig` that does `{% sw_extends '@Framework/documents/base.html.twig' %}` and overrides blocks; (4) a plugin migration adding a `number_range_type`/`number_range` (+ sales-channel assignment and translations) so documents of the new type get sequential numbers. Since Shopware 6.7 an experimental successor, Document System v2 (behind the `DOCUMENT_GENERATION_REWORK` feature flag, becoming default in 6.8), simplifies this: create a class extending `AbstractDocumentType` declaring `getTechnicalName()` and `getSupportedFormats()` (e.g. html/pdf), a render-data DTO extending `AbstractRenderData` plus a provider extending `AbstractDocumentDataProvider` (with `getKey()`, `supports()`, `enrichOrderCriteria()`, `provideRenderingData()`), register both services tagged `shopware.document_v2.type` and `shopware.document_v2.provider`, and add the template at `src/Resources/views/documents/<technical_name>.html.twig` extending `@Framework/documents/base.html.twig`. Even in v2 you still need the `document_type` DB row and a number range, reusing the same legacy migration pattern with your new technical name.","citations":["developer/guides/plugins/plugins/checkout/documents/legacy/add-custom-document-type.md:1-573","developer/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md:1-161"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=document type, path=developer, mode=files"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/checkout/documents/legacy/add-custom-document-type.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-27":{"query":"In Shopware 6.7, how do I extend a Storefront Twig template from my plugin with `{% extends %}` so I keep the core markup and other plugins' changes?","category":"dev","option":"mcp-docs","answer":"You don't actually use Twig's native `{% extends %}` — Shopware's Storefront templating uses its own tag `{% sw_extends %}`, which is designed to preserve the core markup plus any other plugin's overrides (unlike plain Twig `extends`, which would only inherit from one parent). Steps: register your plugin's own view path (Shopware looks for `<plugin root>/src/Resources/views` by default). Find the original template under `<shopware root>/src/Storefront/Resources/views/...` (e.g. `storefront/layout/header/logo.html.twig`) and recreate the exact same relative path under your plugin's `views` directory (e.g. `<plugin root>/src/Resources/views/storefront/layout/header/logo.html.twig`) so it's picked up automatically. In that file, put `{% sw_extends '@Storefront/storefront/layout/header/logo.html.twig' %}` at the very top, then override only the specific block you need, e.g. `{% block layout_header_logo_link %} ... {% endblock %}`; call `{{ parent() }}` inside the block if you want to keep/append to the original content instead of replacing it. Clear the cache (`bin/console cache:clear`) and make sure your theme is assigned to the sales channel to see the change. Since Shopware 6.7.11.0 there's also a Storefront Components system for building reusable atomic template components.","citations":["developer/guides/plugins/plugins/storefront/templates/customize-templates.md:1-128"],"toolCallLog":[{"tool":"grep_docs","args":"pattern=extends storefront template, path=developer, mode=files"},{"tool":"grep_docs","args":"pattern=override.*template, path=developer/guides/plugins/plugins/storefront, mode=files, regex=true"},{"tool":"list_docs","args":"path=developer/guides/plugins/plugins/storefront"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/storefront/templates/customize-templates.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"dev-28":{"query":"How do I override an existing Storefront JavaScript plugin, such as the cookie permission bar, from my own plugin instead of registering a new one?","category":"dev","option":"mcp-docs","answer":"Storefront JS plugins are vanilla JS classes, so you extend the original class. Create `<plugin root>/src/Resources/app/storefront/src/my-cookie-permission/my-cookie-permission.plugin.js` and write a class that extends the original, e.g. `import CookiePermissionPlugin from 'src/plugin/cookie/cookie-permission.plugin'; export default class MyCookiePermission extends CookiePermissionPlugin {}` (if you can't import the original class directly, e.g. for a third-party plugin without an alias, fetch it via `window.PluginManager.getPlugin('CookiePermission').get('class')`). Override whichever methods you need (e.g. `init()` to always show the bar, `_hideCookieBar()` to add a confirm dialog before calling `super._hideCookieBar()`). Then, instead of `PluginManager.register()`, register it with `PluginManager.override('CookiePermission', MyCookiePermission, '[data-cookie-permission]')` in your plugin's `main.js` entry point (for async plugins, pass a dynamic import function instead of the class). Note: each JS plugin can only be overridden once — if two plugins override the same one, only the last-loaded override wins. Rebuild the Storefront (`shopware-cli project storefront-build` or `composer run build:js:storefront`) and reload to see the change.","citations":["developer/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md:1-151"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-29":{"query":"How do I add my own data to an existing Storefront page or pagelet from a plugin without overriding the core controller?","category":"dev","option":"mcp-docs","answer":"Every Storefront page/pagelet fires a `...LoadedEvent` (e.g. `FooterPageletLoadedEvent` for the footer pagelet) right after it is loaded, and this is the intended extension point instead of overriding the controller. Workflow: 1) Register an event subscriber (tagged `kernel.event_subscriber`) listening on that Loaded event. 2) Since you're inside a Pagelet/Page event you should not call the DAL directly — instead use or create a store-api route to fetch the data you need (e.g. a custom `AbstractProductCountRoute`/`ProductCountRoute` using `EntityRepository::aggregate()` with a `CountAggregation`, returned via a `StoreApiResponse` subclass). 3) In the subscriber's handler, call your store-api route and attach the result to the page/pagelet with `$event->getPagelet()->addExtension('product_count', $result)` (or `$event->getPage()->addExtension(...)` for a Page event) — this makes the data available in Twig under `<page>.extensions.product_count`. 4) Extend the relevant template with `{% sw_extends '@Storefront/...' %}`, call `{{ parent() }}`, and render the new data, e.g. `{% if footer.extensions.product_count %}{{ footer.extensions.product_count.count }}{% endif %}`.","citations":["developer/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md:1-321"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-30":{"query":"How do I add a custom filter to the Storefront product listing from my plugin, both the criteria side and the filter panel?","category":"dev","option":"mcp-docs","answer":"Criteria side: create an event subscriber (e.g. `ExampleListingSubscriber`) listening to `Shopware\\Core\\Content\\Product\\Events\\ProductListingCollectFilterEvent`. In the handler, fetch existing filters via `$event->getFilters()` and the request via `$event->getRequest()`, then build a `Filter` object with: a unique `name`, a `filtered` bool (whether the filter is currently active, e.g. based on a request parameter), an array of `aggregations` (e.g. a `FilterAggregation` wrapping a `MaxAggregation` plus an `EqualsFilter`, used to compute counts/availability), the actual DAL `filter` to add to the criteria (e.g. `EqualsFilter('product.isCloseout', true)`), and the `values` to expose as `currentFilter`. Add it with `$filters->add($filter)`. Filter panel side: extend the core template `storefront/component/listing/filter-panel.html.twig` via `{% sw_extends '@Storefront/storefront/component/listing/filter-panel.html.twig' %}` and override the block `component_filter_panel_items` (available since 6.4.8.0) — call `{{ parent() }}` to keep existing filters, then use `{% sw_include '@Storefront/storefront/component/listing/filter/filter-boolean.html.twig' with { name: 'isCloseout', displayName: 'Closeout' } %}` (or `filter-multi-select`, `filter-property-select`, `filter-range`, `filter-rating-select`/`filter-rating-select-item` depending on the value type) to render the UI control. To position your filter next to a specific existing one instead of at the end, extend that filter's specific block instead (e.g. `component_filter_panel_item_price` to place it right after the price filter).","citations":["developer/guides/plugins/plugins/storefront/howto/add-listing-filters.md:1-182"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/storefront/howto/add-listing-filters.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-31":{"query":"How do I expose a plugin configuration value, such as a colour picked in the Administration, as an SCSS variable in my Storefront styling?","category":"dev","option":"mcp-docs","answer":"Add a colorpicker input field to your plugin's config.xml (e.g. `sassPluginHeaderBgColor` of type `colorpicker`), which shows an `sw-colorpicker` component in the Administration. Then create an event subscriber for `ThemeCompilerEnrichScssVariablesEvent` (registered as `kernel.event_subscriber`), inject `SystemConfigService`, read the value with `$this->systemConfig->get('SwagBasicExample.config.sassPluginHeaderBgColor', $event->getSalesChannelId())`, and pass it to `$event->addVariable('sass-plugin-header-bg-color', $configPluginHeaderBgColor)`. Provide a `!default` fallback for the SCSS variable in your plugin's base.scss (e.g. `$sass-plugin-header-bg-color: #ffcc00 !default;`) so it works before the subscriber overrides it. Because config is read per sales channel id, different sales channels can have different variable values. You can also loop over `$this->systemConfig->get('SwagBasicExample.config', $event->getSalesChannelId())` and call `addVariable()` for every field, converting camelCase keys to kebab-case with `CamelCaseToSnakeCaseNameConverter`.","citations":["developer/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md:1-249"],"toolCallLog":[{"tool":"kb_status","args":""},{"tool":"read_doc","args":"path=developer/index.md"},{"tool":"grep_docs","args":"pattern=theme.js config, path=developer, mode=files"},{"tool":"list_docs","args":"path=developer/guides/plugins/plugins/storefront"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-32":{"query":"How do I define a custom field set for products from my plugin so merchants can edit the values in the Administration?","category":"dev","option":"mcp-docs","answer":"There are two ways to define a custom field set. (1) Declaratively (Shopware 6.7.13.0+): ship a `<plugin root>/src/Resources/config/custom-fields.xml` file; Shopware then creates/updates/removes the sets automatically during plugin install/update/uninstall, no lifecycle code required. (2) Imperatively (needed for dynamic/runtime creation): inject the `custom_field_set.repository` service and call its `create()` method during your plugin's install lifecycle hook, e.g. `$this->customFieldSetRepository->create([['name' => 'swag_example_set', 'global' => true, 'config' => ['label' => [...]], 'customFields' => [['name' => 'swag_example_size', 'type' => CustomFieldTypes::INT, 'includeInSearch' => true, 'config' => ['label' => [...], 'customFieldPosition' => 1]]]]], $context);`. To restrict a set to products, associate it with the `product` entity relation (in the Administration this is filtered via `relations.entityName` equal to `product`). Names should carry a vendor prefix (e.g. `swag_`) to avoid collisions, and `global: false` if merchants should be able to edit/delete the set in the Administration UI. `includeInSearch: true` (available since 6.7.6.0) makes the field searchable. On uninstall, delete the custom field set via the repository and remove the values from the entity's `customFields` column. To actually make the field editable in the Administration, add the `sw-custom-field-set-renderer` component to your module's template, bound to a `customFieldSets` data property populated via `this.customFieldSetRepository.search(criteria, Shopware.Context.api)` where the criteria filters `relations.entityName` equal to `product` and sorts fields by `config.customFieldPosition`.","citations":["developer/guides/plugins/plugins/framework/custom-field/add-custom-field.md:1-373","developer/guides/plugins/plugins/administration/data-handling-processing/using-custom-fields.md:1-92"],"toolCallLog":[{"tool":"list_docs","args":"path=developer/guides/plugins/plugins, glob=**/*custom-field*"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/framework/custom-field/add-custom-field.md"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/administration/data-handling-processing/using-custom-fields.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-33":{"query":"How do I register a custom Administration module from my plugin, and what has to line up for it to actually show up after a build?","category":"dev","option":"mcp-docs","answer":"Create `<plugin root>/src/Resources/app/administration/src/module/swag-example/index.js` (Shopware requires an `index.js` per module), and import it from your plugin's `main.js` (`import './module/swag-example';`) so the entry point actually loads the module. Inside `index.js`, call `Shopware.Module.register('swag-example', { ... })` (a thin wrapper around the internal `ModuleFactory.registerModule`). The configuration object needs: a `type` of `'plugin'` (as opposed to `'core'`, used only by convention), a technically unique `name`, a `title`/`description` (as Vue-i18n translation keys), a primary `color` and an `icon` (used for the module's own icon, smart bar accent, global search tag — note this is separate from the menu-entry icon), a `routes` object defining e.g. list/detail/create routes tied to components, a `navigation` array for the menu entry, and a `snippets` object (`de-DE`/`en-GB` keys) supplying the translations referenced by `title`/`description`/labels, typically loaded from `snippet/de-DE.json` and `snippet/en-GB.json`. For settings-area modules you can add a `settingsItem` array (with `group`: 'shop'|'system'|'plugins', `icon`, and `to` pointing at a defined route name) to link the module under Settings. Finally the Administration must be rebuilt — `shopware-cli project admin-build` (or `composer run build:js:admin` in a platform/contribution setup) — with the plugin active; this compiles `main.js` into a minified JS file under `<plugin root>/src/Resources/public/administration/js/<plugin-name>.js`, which must be shipped with the plugin. As the docs stress, a successful build only means the assets compiled — the module still depends at runtime on the entry-point import, `Shopware.Module.register()` call, its routes/components, and its snippets all being correctly wired for it to actually appear.","citations":["developer/guides/plugins/plugins/administration/module-component-management/add-custom-module.md:1-318"],"toolCallLog":[{"tool":"list_docs","args":"path=developer/guides/plugins/plugins/administration/module-component-management"},{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/administration/module-component-management/add-custom-module.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-34":{"query":"How do I extend an existing Administration component and its Twig blocks from my plugin, for example to change the dashboard headline?","category":"dev","option":"mcp-docs","answer":"Use `Shopware.Component.override('component-name', { template })` to overwrite an existing component's behavior in place, or `Shopware.Component.extend('new-name', 'existing-name', { template })` to create a brand-new component based on an existing one. To customize just part of a template, use TwigJS `{% block %}` — redeclaring a block with the same name replaces it, and putting `{% parent %}` inside your block renders the original content in addition to your markup. You can similarly extend/override `methods` and `computed` properties; call `this.$super('methodName')` inside your override to invoke the original implementation before/after adding your own logic. For the dashboard-headline example specifically: inspect the component's twig template on GitHub to find the exact block to target — for `sw-dashboard-index` it is `sw_dashboard_index_content_intro_content_headline`. Create `<plugin root>/src/Resources/app/administration/src/sw-dashboard-index-override/sw-dashboard-index.html.twig` containing just `{% block sw_dashboard_index_content_intro_content_headline %}<h1>Welcome to a customized component<\/h1>{% endblock %}`, then register the override in `<plugin root>/src/Resources/app/administration/src/sw-dashboard-index-override/index.js` with `import template from './sw-dashboard-index.html.twig'; Shopware.Component.override('sw-dashboard-index', { template });`, and finally import that index.js from your plugin's `main.js` (`import './sw-dashboard-index-override/';`) so Shopware picks it up. Shopware 6 also has an experimental Composition-API extension system for components already migrated off the Options API: components made extendable via `Shopware.Component.createExtendableSetup` can be overridden (not extended) with `Shopware.Component.overrideComponentSetup()('componentName', (previousState, props, context) => ({ ...overrides }))`; multiple plugins' overrides apply in registration order, and `previousState._private` exposes (unsupported) access to private state.","citations":["developer/guides/plugins/plugins/administration/module-component-management/customizing-components.md:1-491"],"toolCallLog":[{"tool":"read_doc","args":"path=developer/guides/plugins/plugins/administration/module-component-management/customizing-components.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-35":{"query":"How do I load entities from the Admin API inside an Administration component using the repository factory and a Criteria?","category":"dev","option":"mcp-docs","answer":"Inject the `repositoryFactory` service into your component (`inject: ['repositoryFactory']`), then create a repository for the entity you need with `this.repositoryFactory.create('product')` (optionally with a source route and options as 2nd/3rd args, e.g. `{ version: 1 }`). To search multiple entities, build a `Criteria` object from `const { Criteria } = Shopware.Data;`: `criteria.setPage(1)`, `criteria.setLimit(10)`, `criteria.setTerm('foo')`, `criteria.setIds([...])`, `criteria.setTotalCountMode(2)` (0 = no total count, 1 = exact, 2 = fast estimate), `criteria.addFilter(Criteria.equals('product.active', true))`, `criteria.addSorting(Criteria.sort('product.name', 'DESC'))`, `criteria.addAggregation(Criteria.avg('average_price', 'product.price'))`, and `criteria.getAssociation('categories').addSorting(...)`/`criteria.addAssociation('manufacturer')` for nested associations. Then call `this.productRepository.search(criteria, Shopware.Context.api).then(result => { this.result = result;
