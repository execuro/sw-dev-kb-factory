e')`, e.g. `this.acl.can('sales_channel.creator')` in JS or `v-if=\"acl.can('review.editor')\"` in a template. To ship additional privileges onto existing core roles from PHP, override `Plugin::enrichPrivileges()`, e.g. returning `['product.viewer' => ['my_custom_privilege:read']]`. Note that ACL rules in the Administration UI only gate visibility/behavior there \u2014 they can be bypassed via direct API calls, so they don't replace API-level authorization \u2014 and granting a role's `viewer` privilege does not automatically give access to the related Administration module; module access must be granted separately.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:1-73"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"acl\\|privilege\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-37": {"query": "How do I set up and run PHPUnit integration tests for my Shopware plugin, including tests that boot the kernel?", "category": "dev", "option": "fs-wiki", "answer": "Create a `phpunit.xml` in the plugin root (autogenerated by `bin/console plugin:create`) that sets `bootstrap=\"tests/TestBootstrap.php\"`, `executionOrder=\"random\"`, a `KERNEL_CLASS` server var (`Shopware\\Core\\Kernel`), `APP_ENV=test`, and `<testsuites>` pointing at your test directories (e.g. one for `Migration/Test`, one for general `Test`). `plugin:create` also generates `tests/TestBootstrap.php`, which uses `Shopware\\Core\\TestBootstrapper` \u2014 call `->addCallingPlugin()`, `->addActivePlugins(...)`, and `->setForceInstallPlugins(true)` on it so the plugin is installed and activated even if the test database already exists. For integration tests that boot the kernel, extend `PHPUnit\\Framework\\TestCase` and use the `Shopware\\Core\\Framework\\Test\\TestCaseBase\\IntegrationTestBehaviour` trait, which gives you an automatic database transaction and cache clearing per test. For migration tests specifically, use the `Shopware\\Core\\Framework\\Test\\TestCaseBase\\KernelTestBehaviour` trait for container/database access and name the test class `<MigrationClassName>Test`. To vary service wiring only for the test environment, add `<plugin root>/Resources/config/services_test.php`, which overrides `Resources/config/services.php` when running under `APP_ENV=test`. Run tests with `./vendor/bin/phpunit --configuration=\"custom/plugins/SwagBasicExample\" --testsuite \"migration\"` (omit `--testsuite` to run all testsuites, or use `--filter <ClassOrMethod>` to run a single class/method). To use PHPUnit at all you first need the flex template's `dev-tools` package: `composer require --dev dev-tools`.", "citations": ["platform/dev/6.7/guides/development/testing/unit/php-unit.md:1-62"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -ipath \"*test*\" -iname \"*.md\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/development/testing/unit/php-unit.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-38": {"query": "How do I write Jest unit tests for my Administration components in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Place test files next to the file under test, named with the suffix `.spec.js` or `.spec.ts`. Services and isolated ES modules can be imported and tested directly without mocking (e.g. `import Sanitizer from 'src/core/helper/sanitizer.helper'`). Components, however, are registered globally via `Shopware.Component.register('name', {...})` and must be built into a real Vue component with `Shopware.Component.build('name')`, which resolves Shopware's template inheritance/override system. Generate a test boilerplate with `composer run admin:create:test` (pasting the component/service path when prompted), and install JS dependencies first with `composer run init:js`. Mount the built component using `mount()` or preferably `shallowMount()` (which stubs child components) from `@vue/test-utils`, passing `props`, `stubs`, `mocks`, and `attachTo: document.body` as needed. Shopware exposes several preconfigured mocks/globals for these tests: `global.activeAclRoles = ['product.editor']` for ACL, `global.activeFeatureFlags = ['FEATURE_NEXT_12345']` for feature flags, and `global.repositoryFactoryMock.responses.addResponse({ method, url, status, response })` to mock repository responses (disable its missing-mock warning with `global.repositoryFactoryMock.showWarning = false`). Override global mocks like `$tc`, `$device`, `$store`, `$router` via `mount`'s `mocks` option; for missing directives use `createLocalVue()` plus `localVue.directive('clipboard', {})`; for missing injections either provide a stub (`provide: { mediaService: { renameMedia: () => Promise.resolve() } }`) or register it globally with `Shopware.Service.register('mediaService', {...})` in `beforeAll`. Run all tests with coverage using `composer run admin:unit`, or only changed-file tests in watch mode with `composer run admin:unit:watch`. Because Shopware components support template inheritance and third-party extendability, their tests tend to be more involved than plain Vue tests \u2014 unresolved child components, directives, injections, or services will surface as `[Vue warn]` messages and must be stubbed/mocked explicitly.", "citations": ["platform/dev/6.7/guides/development/testing/unit/jest-admin.md:1-57"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/development/testing/unit/jest-admin.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-39": {"query": "How do I write end-to-end Cypress tests for my plugin against a Shopware 6.7 store?", "category": "dev", "option": "fs-wiki", "answer": "In Shopware 6.7 the Cypress-based approach is documented as legacy \u2014 new projects are recommended to use Playwright instead, and Cypress guidance is only for maintaining an existing Cypress suite. If you still need to set one up: start from a clean Shopware installation (no categories, products, or settings), initialized with `composer run init`, since tests run against production mode with a theme assigned. In your plugin, create the folder structure `Resources/app/<environment>/test/e2e/cypress/{fixtures,integration,plugins,support}`, run `npm init -y`, and install the `@shopware-ag/e2e-testsuite-platform` package (built on Cypress plus `cypress-select-tests`, `cypress-log-to-output`, and `cypress-file-upload`), which provides commands, helpers, and test data management. Create `e2e/cypress/plugins/index.js` requiring `@shopware-ag/e2e-testsuite-platform/cypress/plugins` and `e2e/cypress/support/index.js` requiring `@shopware-ag/e2e-testsuite-platform/cypress/support`. Put static JSON test data in `fixtures`, test files (`*.spec.js`) in `integration` \u2014 note test files must live in one of the recognized subfolders (`catalogue`, `content`, `customer`, `general`, `media-marketing`, `order`, `rule-product-stream`, `settings`) or CI ignores them \u2014 and custom commands/global overrides in `support`, alongside `cypress.json`/`cypress.env.json` config files. Group tests with `describe()`/`context()` and define individual tests with `it()` (Shopware's preferred convention over `specify()`); prefer `beforeEach` cleanup over `after`/`afterEach` since a failed test can skip the latter. Create test data through the REST API rather than the UI: the `ApiService` helper (in `e2e/cypress/support/service/api.service.js`) wraps axios, and `cy.createDefaultFixture(endpoint, data, jsonPath)` sends a fixture JSON file's contents to the API; custom fixture services extend `AdminFixtureService`/`FixturesService`. For the platform/Docker setup, run `composer run e2e:setup` (first-time, outside the container), `composer run e2e:prepare` (inside the container, if already clean), then `composer run e2e:open` to open the runner, or run headlessly with `composer e2e:cypress -- run --spec=\"cypress/e2e/administration/**/*.cy.js\"`. Avoid relying on UUID-based IDs as test selectors since they can differ between installations, and on Mac/Docker set the `DISPLAY` environment variable before creating the containers (changing it afterward has no effect until recreated).", "citations": ["platform/dev/6.7/guides/development/testing/legacy/cypress/_index.md:1-46"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/development/testing/legacy/cypress/_index.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-40": {"query": "How do I upgrade a Composer-based Shopware project from 6.6 to 6.7 \u2014 which composer.json constraint do I change, and which console commands do I run afterwards?", "category": "dev", "option": "fs-wiki", "answer": "The recommended path is `shopware-cli project upgrade` (run from a clean Git working tree), which is a wizard that checks readiness, target version selection, and Composer-managed extension compatibility before applying the upgrade locally; for CI or a read-only check use `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run`. If the wizard cannot be used, do it manually: first enable maintenance mode with `bin/console sales-channel:maintenance:enable --all`; then adjust the Shopware version constraint (and `shopware/commercial`'s, if used) in `composer.json` to target 6.7, and run `composer update --no-scripts` (the `--no-scripts` flag avoids running scripts that depend on not-yet-updated recipes) \u2014 note that if you forget to change the composer.json constraint first, `composer update` simply resolves back to the already-installed version and no upgrade happens. Optionally force-update Symfony Flex-managed config files with `composer recipes:update`. Finalize the upgrade with `bin/console system:update:finish`, which runs the database migrations and recompiles themes. Finally disable maintenance mode with `bin/console sales-channel:maintenance:disable --all`. Avoid skipping major versions unless the full upgrade path has been explicitly tested.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md:1-55"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*upgrade*\"; grep -rli \"6.6 to 6.7|upgrade guide\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-41": {"query": "`composer update` to Shopware 6.7 aborts on a platform requirement and my admin build then fails too \u2014 which PHP, database and Node versions does 6.7 actually require, and how do I check the machine I am on against them before I retry?", "category": "dev", "option": "fs-wiki", "answer": "Shopware 6.7's recommended stack (minimum \u2192 recommended) is: PHP `8.2+` (recommended `8.4`) with `memory_limit >= 512M`, `max_execution_time >= 30s`, and required extensions `ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, openssl, pcre, pdo_mysql, phar, simplexml, xml, xmlreader, zip, zlib` (optional `amqp`), plus Composer `2.2+` recommended; database is MariaDB `>= 10.11.6` or MySQL `>= 8.0.22` (Innovation releases unsupported), recommended MariaDB `11.4` / MySQL `8.4`, with `max_allowed_packet >= 32M`; Node.js/npm is `Node 20.0.0+` minimum, recommended `Node 24 / npm 10` (this covers the admin/storefront build). To check your machine before retrying the composer update, run `php -v`, `php -m`, `php -i | grep memory_limit`, `composer -V`, `node -v`, and `npm -v` and compare against these minimums (per platform/dev/6.7/guides/hosting/_index.md). Separately, physical workstation requirements (not the software stack) are: quad-core CPU recommended, 8GB RAM minimum (16GB recommended for Docker), ~10GB free disk, and a Unix-based OS (macOS 13+, 64-bit Linux, or Windows 10/11 Pro via WSL2/Docker Desktop) \u2014 see platform/dev/6.7/guides/installation/system-requirements.md. Also useful before retrying: `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run` performs a readiness/compatibility check without applying the upgrade, and if doing it manually you must first bump the Shopware (and shopware/commercial) version constraints in composer.json before running `composer update --no-scripts`, otherwise the update resolves to the already-installed version and appears to do nothing.", "citations": ["platform/dev/6.7/guides/hosting/_index.md:1-40", "platform/dev/6.7/guides/installation/system-requirements.md:1-49", "platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md:1-56"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "grep -rn \"PHP\\|requirement\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*upgrade*\" -o -iname \"*requirement*\" -o -iname \"*install*\""}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/installation/system-requirements.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md"}, {"tool": "Bash", "args": "grep -rln \"PHP 8\\|MySQL\\|MariaDB\\|Node\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/installation/ .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/installation/advanced-options.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/infrastructure/database.md"}, {"tool": "Bash", "args": "grep -rln \"MariaDB 10\\|MySQL 8\\|Node.js 2\\|Node 2\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/_index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/tools/cli/validation.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-42": {"query": "How do I check extension compatibility before upgrading with shopware-cli, and why does it report my plugins in custom/plugins as blocking?", "category": "dev", "option": "fs-wiki", "answer": "Run `shopware-cli project upgrade` (interactively) or, for a non-destructive preflight, `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run`. This runs a local-first, six-phase wizard (readiness, version choice, extension/Composer analysis, plan review, apply, report) that analyzes your Composer-managed extensions and verifies the target dependency set with Composer before anything changes, then writes a shareable report to `.shopware-cli/upgrade/report.md`. One of the wizard's prerequisite checks is that all extensions must be Composer-managed \u2014 plugins sitting only in `custom/plugins` without being required via Composer are not managed that way, so the wizard flags/blocks on them. The fix is to migrate locally managed extensions first with `shopware-cli project autofix composer-plugins` before re-running the upgrade. Note the wizard does not rewrite incompatible custom extension code itself, create missing vendor releases, or replace real application testing \u2014 it only surfaces compatibility and Composer resolution problems.", "citations": ["platform/dev/6.7/products/tools/cli/project-commands/upgrade.md:1-69"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"compatib\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/tools/cli/"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/tools/cli/project-commands/upgrade.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-43": {"query": "My admin plugin still ships a webpack.config.js \u2014 how do I move the administration build to Vite for Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Shopware 6.7 replaces the Webpack-based Administration build with Vite (Webpack had become slow and under-maintained). To migrate a plugin's custom Webpack config: 1) create `vite.config.mts` under `YourApp/src/Resources/app/administration/src` (replacing the old `webpack.config.js` that lived under `YourApp/src/Resources/app/administration/build/`); 2) remove the old `webpack.config.js`; 3) remove Webpack-related dependencies from `package.json`; 4) add the Vite dependencies to `package.json`. A minimal example config uses `defineConfig` from `vite` with a `resolve.alias` block. You can test the new build via the `ADMIN_VITE` feature flag. Bundle/plugin info is written to `<shopwareRoot>/var/plugins.json` by `Shopware\\Core\\Framework\\Plugin\\Command\\BundleDumpCommand` (`bin/console bundle:dump`, also run as part of `composer build:js:admin`/`watch:admin`); extensions are built via `<shopwareRoot>/src/Administration/Resources/app/administration/build/plugins.vite.ts`, invoked through the same `composer build:js:admin` command. In production, asset info is loaded via the Symfony `pentatrion_vite` bundle and its generated `entrypoints.json`; in dev mode/HMR, `shopware-vite-plugin-serve-multiple-static` serves an `sw-plugin-dev.json` consumed by `application.ts`. Note: HMR only works for `.vue` Single File Components, so hot-reload stays limited until templates are fully SFCs, and the `vue-globals` Vite plugin rewrites Vue imports to destructure from `Shopware.Vue` to avoid multiple Vue instances.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/vite.md:1-58"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"vite\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration/; grep -rln \"webpack\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/administration/vite.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-44": {"query": "After the Vue 3 upgrade my admin plugin broke \u2014 this.$parent resolves to the wrong component and a prop default that calls this.$tc throws. What do I have to change?", "category": "dev", "option": "fs-wiki", "answer": "Both symptoms are documented, known Vue 3 migration pitfalls in the Shopware Administration (which moved from Vue 2, EOL Dec 31 2023, to Vue 3 starting with Shopware 6.6). `this.$parent` is unreliable in Vue 3 because Vue wraps async components, so `this.$parent` sometimes needs to be `this.$parent.$parent` instead \u2014 but the wiki's actual recommendation is to stop relying on `$parent` traversal at all and prefer services or event communication instead. The prop-default crash happens because prop default functions no longer have access to `this` in Vue 3 \u2014 the fix is to replace `this.$tc` with the standalone `Shopware.Snippet.tc` call in that context (that is also the general guidance: search your code for `this.$` calls, since most break under Vue 3 except `this.$tc` when `this` is actually bound, e.g. inside component methods). Also relevant while you're in there: replace all `sw-field` usages with their dedicated component replacements, check `v-model` usage/event listeners/deprecated slot syntax/`router-view` transitions/`key` attributes/filters against the official Vue 3 migration guide, note that `@hook:mounted` and similar lifecycle hooks can now fire twice for async components (once for the `AsyncComponentWrapper`, once for the underlying component), that Vuex getters must not mutate state (it breaks reactivity), that mutating props now throws hard errors instead of being silently allowed, and that form fields no longer keep the old DOM id (add a `name` attribute for tests). Test changes with `composer run watch:admin` running locally, and consider enabling the Vue 3 ESLint rule set.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/vue3.md:1-48"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations -iname \"*vue*\""}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/administration/vue3.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-45": {"query": "Shopware.State is deprecated in 6.7 \u2014 how do I convert my administration Vuex module into a Pinia store?", "category": "dev", "option": "fs-wiki", "answer": "With Shopware 6.7, Vuex is replaced by Pinia as the Administration's state management library. Register a store with `Shopware.Store.register('<storeName>', { state, getters, actions })`, where `state` must be a function returning the initial state object (not a static object), e.g. `const store = Shopware.Store.register('<storeName>', { state: () => ({...}), getters: {...}, actions: {...} }); export default store;`. A store can alternatively be registered via an `id` property instead of a name argument; re-registering an existing store id overwrites it, and `Shopware.Store.unregister('<storeName>')` removes one. To actually register it, just import the store file (e.g. `import './state/products.state'`) \u2014 this replaces the old `Shopware.State.registerModule('product', productsStore)` call. Key differences from Vuex you must handle: mutations are removed \u2014 update state directly inside actions (e.g. `this.productName = newName`); getters can't share a name with a state property since both are exposed at the same level; for TypeScript, define `StoreType` via `ReturnType<typeof store>` and extend the global `PiniaRootState` interface with it; stores can also be written as composables returning reactive refs/computed/functions (Pinia devtools only track returned variables/functions); and any code reading state must change from `Shopware.State.get('<storeName>')` to `Shopware.Store.get('<storeName>')`. For tests, import the store file to register it and call `store.$reset()` in `beforeEach`, and for component tests using Pinia stores call `setActivePinia(pinia)` with a `createPinia()` instance and pass `plugins: [pinia]` to the mount config.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/pinia.md:1-55"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"pinia\\|Pinia\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/administration/pinia.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-46": {"query": "sw-button and sw-card are deprecated in Shopware 6.7 \u2014 how do I migrate my plugin's admin templates to the Meteor components, and is there a codemod that does it?", "category": "dev", "option": "fs-wiki", "answer": "Yes, there is a codemod. With Shopware 6.7, several Administration components (like sw-button and sw-card) are being replaced by components from the Meteor Component Library, Shopware's official reusable component collection built on the Shopware Design System. Run the codemod tool against a plugin under `custom/plugins`: `composer run admin:code-mods`, e.g. `composer run admin:code-mods -- --plugin-name example-plugin --fix -v 6.7`. The tool automatically replaces compatible components with their Meteor equivalents, adds guidance comments where manual migration is still required, and fixes some other deprecated code along the way. For cross-version compatibility, the affected Shopware components gained a `deprecated` prop (default `false`, meaning the new Meteor Component renders by default); setting `deprecated: true` on the component renders the old component instead, which lets a plugin support both Shopware 6.6 and 6.7 from a single codebase without migrating immediately \u2014 but Shopware recommends migrating to Meteor Components as soon as possible, and notes the timelines/implementation details of this migration are still subject to change.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/meteor-components.md:1-43"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"meteor\\|Meteor\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/administration/meteor-components.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-47": {"query": "My payment plugin implements `AsynchronousPaymentHandlerInterface` and is tagged `shopware.payment.method.async` \u2014 how do I write a payment handler for Shopware 6.7 instead?", "category": "dev", "option": "fs-wiki", "answer": "From Shopware 6.7.0.0, all payment handling goes through a single `Shopware\\Core\\Checkout\\Payment\\Cart\\PaymentHandler\\AbstractPaymentHandler` class instead of the pre-6.7 interfaces (`SynchronousPaymentHandlerInterface`, `AsynchronousPaymentHandlerInterface`, `PreparedPaymentHandlerInterface`, `RecurringPaymentHandlerInterface`, `RefundPaymentHandlerInterface`), each of which used to be registered with its own tag (`shopware.payment.method.sync`, `.async`, `.prepared`, `.recurring`, `.refund`). To migrate: 1) create a class extending `AbstractPaymentHandler` and implement `supports(PaymentHandlerType $type, string $paymentMethodId, Context $context): bool` plus the relevant method(s) \u2014 `pay(Request, PaymentTransactionStruct, Context, ?Struct): ?RedirectResponse` (always called during checkout; your old `AsynchronousPaymentHandlerInterface::pay` logic that redirects belongs here, returning a `RedirectResponse` to trigger `finalize` afterward, or `null` for synchronous flows), and `finalize(Request, PaymentTransactionStruct, Context): void` (called after the redirect back from the external provider \u2014 this replaces your old interface's `finalize` method directly). 2) Register the handler with the single tag `shopware.payment.method` (replacing `shopware.payment.method.async`): `$services->set(MyCustomPaymentHandler::class)->tag('shopware.payment.method');`. 3) Use `Shopware\\Core\\Checkout\\Order\\Aggregate\\OrderTransaction\\OrderTransactionStateHandler` to update transaction state (`->process(...)`, `->paid(...)`) and throw `PaymentException` (e.g. `PaymentException::asyncProcessInterrupted`, `::customerCanceled`) to fail the transaction. 4) Register the payment method itself in the plugin lifecycle (install/activate/deactivate) via the `payment_method.repository`, providing `handlerIdentifier`, `name`, `description`, `pluginId`, `afterOrderEnabled`, and \u2014 required from 6.7 onward \u2014 a unique, plugin-prefixed `technicalName` (omitting it can prevent installation/activation). Never remove the payment method on uninstall, only deactivate it, since orders may still reference it.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:1-72"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"AsynchronousPaymentHandlerInterface\\|payment.method.async\\|PaymentHandlerInterface\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-48": {"query": "After upgrading, my storefront JavaScript plugin no longer loads \u2014 how do I register it asynchronously with `PluginManager` and where does the compiled file have to be shipped?", "category": "dev", "option": "fs-wiki", "answer": "Write the plugin as a vanilla ES6 class extending the base `Plugin` class at `<plugin root>/src/Resources/app/storefront/src/<plugin-dir>/example-plugin.plugin.js`, e.g. `const { PluginBaseClass } = window; export default class ExamplePlugin extends PluginBaseClass { init() { ... } }` \u2014 `init()` runs on `DOMContentLoaded`. To register it asynchronously, in `main.js` (auto-loaded from `<plugin root>/src/Resources/app/storefront/src`) use a dynamic import instead of a top-level import: `PluginManager.register('ExamplePlugin', () => import('./example-plugin/example-plugin.plugin'), '[data-example-plugin]');` where `window.PluginManager` is the registrar. An async plugin registered this way is excluded from the main `storefront.js` bundle and is only downloaded on demand when an element matching its selector (e.g. `[data-example-plugin]`) is present on the page \u2014 this is different from a plain `PluginManager.register('ExamplePlugin', ExamplePlugin, '[data-example-plugin]')` call with a static top-level import, which is always bundled into `storefront.js` on every page. After writing the plugin, rebuild the Storefront with `shopware-cli project storefront-build` (template setups) or `composer run build:js:storefront` (platform contribution setups). The compiled output must be written to, and shipped with the plugin at, `<plugin root>/src/Resources/app/storefront/dist/storefront/js/<plugin-name>/<plugin-name>.js` \u2014 if that compiled file is missing after an upgrade (e.g. because the build step didn't run or its output path changed), the plugin will fail to load even though the source is correct.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md:1-80"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"PluginManager\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-49": {"query": "My storefront controller still uses the `@Route` and `@RouteScope` annotations from 6.4 \u2014 what is the attribute form in Shopware 6.7 and how are the routes wired?", "category": "dev", "option": "fs-wiki", "answer": "Both old annotations are replaced by PHP 8 attributes. The `@RouteScope` annotation (deprecated since the 6.5 major version, replaced starting 6.4.11.0) becomes the `_routeScope` route default set via `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]])]` placed on the controller class (class-wide) \u2014 this can also be set per-route instead. The `@Route` annotation itself becomes the `#[Route(...)]` attribute on each action method, e.g. `#[Route(path: '/example', name: 'frontend.example.example', methods: ['GET'])]`. A full example controller: `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]])] class ExampleController extends StorefrontController { #[Route(path: '/example', name: 'frontend.example.example', methods: ['GET'])] public function showExample(): Response { return $this->renderStorefront(...); } }`. Route names should use the `frontend`, `widgets`, `payment`, `api`, or `store-api` prefix so the router recognizes it as a Storefront route (since Shopware 6.7.2.0, a plugin can instead allow custom route names without a standard prefix by adding a `storefront.router.allowed_routes` config entry loaded from the plugin's `build()` method). To wire it up: register the controller as a public service in `services.php` calling `setContainer` \u2014 `$services->set(ExampleController::class)->public()->call('setContainer', [service('service_container')]);` \u2014 and import its routes in `routes.php` via `$routes->import('../../Storefront/Controller/*Controller.php', 'attribute');` (note the `'attribute'` type, matching the attribute-based routing).", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:1-83"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"RouteScope\\|#\\[Route\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-50": {"query": "My `ScheduledTaskHandler` stopped running after the upgrade \u2014 how must a scheduled task and its handler be declared in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Both the task and its handler must be explicitly registered in the plugin's `services.php` \u2014 the task with the `shopware.scheduled.task` tag and the handler with the `messenger.message_handler` tag, passing the handler its dependencies: `$services->set(ExampleTask::class)->tag('shopware.scheduled.task'); $services->set(ExampleTaskHandler::class)->args([service('scheduled_task.repository'), service('logger')])->tag('messenger.message_handler');`. The task class must extend `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTask` and implement `getTaskName()` (a vendor-prefixed technical name like `swag.example_task`) and `getDefaultInterval()` (seconds). The handler must extend `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTaskHandler`, be annotated `#[AsMessageHandler(handles: ExampleTask::class)]`, and implement `run()`. These are separate runtime roles that both need to be wired even when generated together \u2014 the task describes when work is due, the handler is the Messenger consumer that actually executes `run()`, so a missing tag on either side after an upgrade (e.g. a dropped `messenger.message_handler` tag or missing `#[AsMessageHandler]` attribute) would silently stop it from running. Since Shopware 6.7.13.0, a handler can additionally implement `DynamicallyScheduledTaskHandler` and its `getNextExecutionTime(ScheduledTask $task, ScheduledTaskEntity $taskEntity): ?\\DateTimeInterface`, called after `run()` finishes, to control the next run time dynamically instead of a fixed interval (returning `null` falls back to `nextExecutionTime + runInterval`, capped to now if in the past). To register/test without reinstalling the plugin: `bin/console scheduled-task:register`, `bin/console scheduled-task:run`, `bin/console messenger:consume`. Also check that the task's `status` is `scheduled` in the `scheduled_task` database table, since `scheduled-task:run` only picks up tasks in that state (unless using the admin worker).", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md:1-70"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"ScheduledTaskHandler\\|ScheduledTask\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-51": {"query": "Custom entities declared in `Resources/config/entities.xml` no longer work for my plugin in Shopware 6.7 \u2014 how do I define and register a DAL entity with PHP attributes instead?", "category": "dev", "option": "fs-wiki", "answer": "Since Shopware v6.6.3.0, entities can be registered via PHP attributes on a class extending `Entity`, instead of writing separate `EntityDefinition`, `EntityEntity`, and `EntityCollection` classes. Define the entity by extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity` and adding `#[Entity('entity_name', collectionClass: ...)]`; `name` is required and must be unique, and `collectionClass` defaults to `EntityCollection` (custom collection classes supported since 6.6.9.0). Add a primary key with `#[PrimaryKey]` on a property (typically a `string` UUID). Register the class in `services.php` with the `shopware.entity` tag, e.g. `$services->set(Examples\\ExampleEntity::class)->tag('shopware.entity');` \u2014 Shopware then auto-registers an `EntityDefinition` and `EntityRepository` named `example_entity.definition`/`example_entity.repository`. Define fields with `#[Field(type: FieldType::...)]` (or an FQCN extending `Field` directly since 6.6.9.0); use special attributes `AutoIncrement`, `ForeignKey(entity: '...')`, and `#[Serialized(serializer: ...)]` for JSON fields needing custom (de)serialization. Custom fields use `EntityCustomFieldsTrait` or `#[CustomFields]` on a `?array` property. Fields are hidden from the API by default; set `#[Field(..., api: true)]` or scope with `api: [AdminApiSource::class]`/`api: [SalesChannelApiSource::class]`. For translations, set `translated: true` on a nullable `#[Field]` to get an auto-created `TranslatedField`/`EntityTranslationDefinition`, and add `#[Translations]` on a nullable `array` property to load all translations via the `translations` association. Non-nullable properties are required by default; use `#[Required]` explicitly (needed for translated fields, which must be nullable). Associations use `OneToOne`, `OneToMany`, `ManyToOne`, `ManyToMany` attributes paired with `#[ForeignKey(entity: '...')]`. With this approach there is no need to write getters/setters, `EntityTranslationDefinition`, or `EntityCollection` classes manually.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md:1-62"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"attribute\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | grep -i entit"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-52": {"query": "What must a plugin database migration class implement in Shopware 6.7, and where does the database cleanup on uninstall belong?", "category": "dev", "option": "fs-wiki", "answer": "Migrations are PHP classes that manage incremental database schema changes for a plugin; Shopware's built-in migration system runs each migration's `update()` method automatically on plugin install/update. Migration files live by default in `<plugin root>/src/Migration`, named `Migration<timestamp><Description>.php`, and can be scaffolded with `./bin/console database:create-migration -p SwagBasicExample --name ExampleDescription` or generated from an entity definition with `./bin/console dal:migration:create --bundle=SwagBasicExample --entities=your_entity,your_other_entity`. Every migration must extend `Shopware\\Core\\Framework\\Migration\\MigrationStep` and implement `getCreationTimestamp(): int` (returning the timestamp embedded in the class name) and `update(Connection $connection): void`, where all schema/data changes go. Migrations can be run manually with `./bin/console database:migrate SwagBasicExample --all`. There is no migration rollback; cleanup on removal belongs in the plugin's `uninstall` lifecycle method, not in the migration. `MigrationStep::updateDestructive()` is only used by Shopware core for delayed, major-version destructive changes \u2014 plugin install/update never runs it. A migration that has already run should never be modified, since every migration runs only once.", "citations": ["platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md:1-78"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"migration\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | grep -i plugin"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-53": {"query": "My theme config labels disappeared from the Theme Manager after 6.7 \u2014 how do I define `theme.json` config fields and where do their translations go now?", "category": "dev", "option": "fs-wiki", "answer": "`theme.json` lives at `<plugin root>/src/Resources/theme.json` and controls a theme's structure, compiled assets, template inheritance and the customizable config fields shown in the Administration theme manager; after changes, run `bin/console theme:refresh` to apply them (this also updates `configInheritance` relationships). Config fields are defined under `config.fields.<field-key>` with parameters `type` (`color`, `text`, `number`, `fontFamily`, `media`, `checkbox`, `switch`, `url`), `value`, `editable`, `tab`, `block`, `section`, `custom` (raw data exposed via API only), `scss` (set `false` to skip SCSS variable injection), and `fullWidth`. Field definitions differ before/after v6.7.1.0: since v6.7.1.0, `label`/`helpText` are omitted from `theme.json` field objects entirely, and translations move to Administration snippets instead \u2014 before that they carried inline `label`/`helpText` translation objects directly in `theme.json`. Since v6.8.0.0 field translations no longer live in `theme.json` at all; snippet keys are used instead, stored in files such as `<plugin root>/src/Resources/app/administration/src/app/snippet/de.json` (or locale-specific `de-DE.json`/`en-GB.json`). The snippet key structure is: tab `sw-theme.<technicalName>.<tabName>.label`, block `sw-theme.<technicalName>.<tabName>.<blockName>.label`, section `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.label`, and field `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.<fieldName>.label` / `.helpText` (with `.<index>.label` for options); unnamed tab/block/section segments use `default` in the key. `label`/`helpText` inside `theme.json` are deprecated for v6.8 in favor of Administration snippets.", "citations": ["platform/dev/6.7/guides/plugins/themes/configuration/theme-configuration.md:1-78"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"theme.json\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | grep -i theme"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/themes/configuration/theme-configuration.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-54": {"query": "How do I register a plugin cookie in the storefront cookie consent manager in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Register a listener for `Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent`, e.g. `$services->set(CookieListener::class)->tag('kernel.event_listener', ['event' => 'Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent']);`. In the listener's `__invoke(CookieGroupCollectEvent $event)`, fetch a group from `$event->cookieGroupCollection` (e.g. via `CookieProvider::SNIPPET_NAME_COOKIE_GROUP_COMFORT_FEATURES`), get or create its `CookieEntryCollection`, and add a `CookieEntry`: `$cookieEntry = new CookieEntry('my-cookie-key'); $cookieEntry->name = 'cookie.myCookieName'; $cookieEntry->value = '1'; $cookieEntry->expiration = 30; $entries->add($cookieEntry);`. Cookie groups must not carry the `cookie`, `value`, `expiration`, or `isRequired` parameters \u2014 those belong only on individual `CookieEntry` objects. Since Shopware 6.7.3.0, cookies use the structured `CookieEntry`/`CookieGroup` objects instead of arrays; the older array format via `CookieProviderInterface` still works for backward compatibility but is deprecated in favor of `CookieGroupCollectEvent`. Since 6.7.3.0, cookie configurations carry a hash stored client-side in the `cookie-config-hash` cookie keyed per language ID; any change to the configuration changes the hash and triggers a re-consent prompt for the affected language. The relevant Store API endpoint is `/store-api/cookie/groups`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md:1-63"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"cookie\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | grep -i consent"}, {"tool": "Bash", "args": "grep -rli \"cookie\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-55": {"query": "How do the breaking storefront accessibility changes reach my theme in Shopware 6.7, and what must an extension that overrides the affected Twig blocks do?", "category": "dev", "option": "fs-wiki", "answer": "Shopware rolls out storefront accessibility improvements (targeting WCAG 2.1 AA and BITV 2.0) behind the `ACCESSIBILITY_TWEAKS` feature flag rather than in one big accessibility release. Breaking accessibility changes ship inside regular minor releases but stay inactive by default until the flag is set in `.env` (`ACCESSIBILITY_TWEAKS=1`), the same way major version flags like `V6_7_0_0` work; with major version v6.7.0 these breaking changes become the default. A change is typically implemented with both the old and new markup guarded by `feature('ACCESSIBILITY_TWEAKS')` in Twig, e.g. wrapping old markup (`<div class=\"sidebar-list\"><...block component_list_items.../><\/div>`) in the else-branch and new markup (`<ul class=\"sidebar-list\"><...block component_list_items_inner.../><\/ul>`) in the if-branch. An extension overriding the old block should also implement the new block (e.g. `component_list_items_inner`) via `{% sw_extends %}` so it keeps working once the flag/version default flips \u2014 if a breaking accessibility change ships without a feature flag and an extension still assumes the old markup, it can render incorrect HTML once the core switches structure. Testing tooling referenced includes Google Lighthouse, AXE DevTools, WAVE, and manual keyboard/screen-reader checks (NVDA, VoiceOver). Accessibility improvements started with Shopware 6.6+, with further enhancements in 6.7+, and all such improvements (including previously flag-gated breaking ones) become the default with major version v6.7.0.", "citations": ["platform/dev/6.7/guides/development/accessibility/storefront-accessibility.md:1-81"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"accessibility\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/development/accessibility/storefront-accessibility.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-56": {"query": "Header and footer are loaded through ESI sub-requests in Shopware 6.7, so page data is gone in my header template \u2014 how do I pass my own data into the header/footer now?", "category": "dev", "option": "fs-wiki", "answer": "Since the Storefront header and footer are now loaded via ESI sub-requests, they no longer depend on the current page's data by default. To pass current-page data into the ESI request, extend `@Storefront/storefront/base.html.twig` and override the `base_esi_header` or `base_esi_footer` block to merge extra parameters, e.g. `{% set headerParameters = headerParameters|merge({ 'vendorPrefixPluginName': { 'activeRoute': activeRoute } }) %}` before calling `{{ parent() }}`. `headerParameters` (and `footerParameters`) are passed as query parameters to the header/footer ESI route, so they must contain scalar values only. Read the value back by extending `@Storefront/storefront/layout/header.html.twig` and accessing e.g. `headerParameters.vendorPrefixPluginName.activeRoute` inside the `header` block. In plugins, `StorefrontRenderEvent` can also inject data, guarded by checking the current route is `frontend.header`: get `$event->getParameter('headerParameters') ?? []`, mutate it, and call `$event->setParameter('headerParameters', $headerParameters)`. It is also possible to load an entirely custom header/footer template (as core does for the checkout confirm page), but this overwrites customizations from every other extension, and any custom template must still receive the `header`/`footer` data it extends. To add data unrelated to the current page instead, the separate 'Add data to storefront page' guide applies.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-header-footer.md:1-75"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"ESI\\|esi\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | grep -i \"header\\|footer\\|esi\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-header-footer.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-57": {"query": "B2B Suite support ends with 6.8 \u2014 how do I run the B2B Suite Migration to B2B Components and check that it finished?", "category": "dev", "option": "fs-wiki", "answer": "Run the B2B Suite to B2B Commercial migration with `bin/console b2b:migrate:commercial` to migrate everything, or restrict to specific components by naming them (matching the configurator's technical name), e.g. `bin/console b2b:migrate:commercial quote_management shopping_list`. `employee_management` is always migrated first regardless of argument order since it is a prerequisite for all other components; overall order otherwise follows configurator priority. Batch size can be tuned with `--batch-size=100`. Because `b2b:migrate:commercial` queues work and returns before the migration finishes, check completion in a separate terminal with `bin/console b2b:migrate:progress --watch`, which shows columns Total, Valid, Newly, Migrated, Pending, Error, and status values `Complete`, `Pending`, `In progress`, `Complete with error`, `Has new records`. Note: Budget Management leaves the Organization Unit empty on migrated budgets (requires B2B Commercial 7.6.0+).", "citations": ["platform/dev/6.7/products/extensions/b2b-suite-migration/execution/running-migration.md:1-53"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"b2b suite\\|b2b-suite\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/products/extensions/b2b-suite-migration/execution/running-migration.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-58": {"query": "My shopware.yaml still uses redis_url \u2014 how do I define the named Redis connections in Shopware 6.7 and which eviction policy does each one need?", "category": "dev", "option": "fs-wiki", "answer": "Shopware recommends separate Redis instances/connections per data category rather than one shared instance, because a single Redis instance cannot apply different eviction policies to different databases. There are three data categories and recommended eviction policies: (1) ephemeral data (HTTP cache, object cache) \u2014 `volatile-lru`, no persistence needed; (2) durable but aging data (sessions) \u2014 `allkeys-lru`, persisted via RDB/AOF; (3) durable and critical data (cart, number range, lock store, increment) \u2014 `volatile-lru`. Since v6.6.8.0, named connections are configured under `shopware.redis.connections` in `shopware.yaml`, e.g.:\n```yaml\nshopware:\n    redis:\n        connections:\n            ephemeral:\n                dsn: 'redis://host1:port/dbindex'\n            persistent:\n                dsn: 'redis://host2:port/dbindex'\n```\nEnv vars can be used in the DSN (e.g. `dsn: '%env(REDIS_EPHEMERAL)%/1'`), and connection pooling can be enabled with the `persistent=1` DSN flag (e.g. `dsn: 'redis://host:port/dbindex?persistent=1'`). A cache Redis hitting its memory limit is normal for `volatile-lru`, but it can only evict keys that have a TTL; Symfony's tag-aware cache adapter stores tag-index sets without a TTL, which can accumulate as orphaned entries and starve eviction if never pruned.", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/redis.md:1-72"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"redis\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/hosting/infrastructure/redis.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-59": {"query": "After upgrading to Shopware 6.7 my Varnish cache is never invalidated \u2014 what changed in the reverse proxy configuration?", "category": "dev", "option": "fs-wiki", "answer": "The config key changed from `storefront.reverse_proxy` (up to 6.5.x) to `shopware.http_cache.reverse_proxy` (from 6.6.0.0), requiring a config update on upgrade. More importantly, the Varnish-with-Redis/LUA-based BAN approach is deprecated from v6.6.x and removed entirely in v6.7.0, in favor of `XKey`-based purging (`use_varnish_xkey: true`); Redis clusters were not supported by that older approach. The reverse proxy is enabled in `config/packages/storefront.yaml` with `SHOPWARE_HTTP_CACHE_ENABLED=1` set in `.env`, e.g.:\n```yaml\nshopware:\n    http_cache:\n        reverse_proxy:\n            enabled: true\n            ban_method: \"BAN\"\n            hosts: [ \"http://varnish\" ]\n            max_parallel_invalidations: 3\n            use_varnish_xkey: true\n```\nSince Shopware 6.6, `TRUSTED_PROXIES` is no longer read automatically \u2014 `SYMFONY_TRUSTED_PROXIES` must be set instead (e.g. `SYMFONY_TRUSTED_PROXIES=127.0.0.1,10.0.0.0/8`, or `REMOTE_ADDR` to trust only the directly connecting address) so Symfony reads the real client IP and Varnish invalidation targeting works correctly. For soft purge (serving stale content while refreshing) instead of the default hard purge, the Varnish VCL should use `xkey.softpurge(req.http.xkey)` instead of `xkey.purge(req.http.xkey)`. Cache-clearing commands: `bin/console cache:clear` (before 6.7 also cleared the HTTP cache), `bin/console cache:clear:all` (clears everything including HTTP cache, since 6.6.8), `bin/console cache:clear:http` (clears the reverse proxy cache, since 6.6.10), and `bin/console cache:pool:clear --all` (object cache only).", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/reverse-http-cache.md:1-89"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/hosting/infrastructure/reverse-http-cache.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-60": {"query": "Which transports do my Shopware message queue workers have to consume in production, and how do I turn off the admin worker?", "category": "dev", "option": "fs-wiki", "answer": "By default Shopware messages are stored in the database and worked off via the browser (admin worker) while a user is logged into the Administration, but the admin worker is not recommended for production since it only runs while someone is logged in and can cause high CPU load with multiple concurrent admin users. In production, run one or more CLI workers instead, e.g. `bin/console messenger:consume async --time-limit=60 --memory-limit=128M` and `bin/console messenger:consume async low_priority` \u2014 the transports named after `async` (default/normal priority) and `low_priority` must both be consumed. A CLI worker must also be set up for the failed queue, otherwise failed messages are never processed; failed messages are retried automatically 3 times, then deleted, via the Doctrine-backed failed transport (`MESSENGER_TRANSPORT_FAILURE_DSN`). Once CLI workers are running, disable the admin worker in `config/packages/shopware.yaml`:\n```yaml\nshopware:\n    admin_worker:\n        enable_admin_worker: false\n```\nIf the admin worker is still used, it can be configured with `enable_admin_worker: true`, `poll_interval: 30`, and a `transports` list (e.g. `[\"async\", \"low_priority\"]`). Custom transports and routing are configured under `framework.messenger` in `framework.yaml` (`transports.<name>.dsn`, `routing`), and routing for a message implementing `AsyncMessageInterface` can be overwritten (instead of added to) via `shopware.messenger.routing_overwrite` in `shopware.yaml` (added in 6.6.4.0 / 6.5.12.0). Note that cron jobs won't cap the maximum number of workers the way supervisor/systemd can, so overlapping long-running messages risk starting an unwanted amount of workers.", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/message-queue.md:1-94"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"admin worker\\|messenger:consume\\|message queue\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/hosting/infrastructure/message-queue.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-61": {"query": "After the upgrade my Elasticsearch index has to be rebuilt \u2014 where do I set the shard and replica counts and which reindex command do I run?", "category": "dev", "option": "fs-wiki", "answer": "You set shard/replica counts in `config/packages/elasticsearch.yml` under `elasticsearch.index_settings.number_of_shards` and `number_of_replicas` (default is 3/3 since Shopware 6.4.12.0; a common override is `number_of_shards: 1`, `number_of_replicas: 0`). To rebuild the index: clear the cache first with `bin/console cache:clear`, then run `bin/console es:index` for basic indexing, or `bin/console dal:refresh:index --use-queue` to reindex the whole shop (ES, SEO-URLs, product index, etc. \u2014 always with `--use-queue`); some systems additionally need `bin/console es:create:alias` afterward. Since indexing writes to the message queue, you must also run consumers with `bin/console messenger:consume` (add `-vv` for output; up to ~3 workers is typical, more requires RabbitMQ). For the separate Admin (AND/OR) search index, use `bin/console es:admin:index` instead.", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md:26-66"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"elasticsearch\\|shard\\|replica\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | head -30"}, {"tool": "Read", "args": "platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-62": {"query": "I changed a setting in `.env` on a deployed 6.7 shop but it still behaves the old way \u2014 what takes precedence between `.env`, `.env.local` and the real environment variables, and which settings does Shopware not read from `.env` at all?", "category": "dev", "category_note": "dev", "answer": "Symfony's standard dotenv loading order applies: real server/container/deployment-platform environment variables always win over anything defined in `.env.local`, which in turn overrides `.env` \u2014 so a value set directly in the container/host environment or in `.env.local` will silently shadow whatever you changed in the base `.env` file. [from memory] The corpus's config overview lists environment variables (`.env`, `.env.local`, server/container environment, deployment platform) as one of five separate configuration mechanisms, explicitly reserved for 'secrets, infrastructure values, deployment-specific values.' Shop/merchant settings that are 'changeable in Administration, Admin API, or app/plugin code' instead live in the database-backed system configuration and are read from there, not from `.env`, unless a developer explicitly wires a specific key to an env var via static system configuration (`config/packages/*.yaml` under `shopware.system_config`, e.g. `core.listing.allowBuyInListing: '%env(bool:ALLOW_BUY_IN_LISTING)%'` combined with `ALLOW_BUY_IN_LISTING=true` in `.env.local`) \u2014 and once such a key is statically overridden, the database/Administration value stops taking effect for it. In production, `.env.local.php` (produced via `bin/console system:setup --dump-env` or `bin/console dotenv:dump {APP_ENV}`) is recommended over parsing `.env` files at runtime for performance.", "citations": ["platform/dev/6.7/guides/hosting/configurations/shopware/_index.md:20-34", "platform/dev/6.7/guides/hosting/configurations/shopware/static-system-config.md:23-51", "platform/dev/6.7/guides/hosting/performance/performance-tweaks.md:49-49"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md"}, {"tool": "Bash", "args": "grep -rln \"\\.env\\.local|env precedence|system config|System Config\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | head -30"}, {"tool": "Bash", "args": "grep -n env .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/installation/advanced-options.md | head -30"}, {"tool": "Bash", "args": "grep -rn \"env.local|dotenv|precedence\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i"}, {"tool": "Read", "args": "platform/dev/6.7/guides/hosting/configurations/shopware/_index.md"}], "notFoundClaim": false, "memoryClaims": ["Symfony's standard dotenv loading order applies: real server/container/deployment-platform environment variables always win over anything defined in `.env.local`, which in turn overrides `.env` \u2014 so a value set directly in the container/host environment or in `.env.local` will silently shadow whatever you changed in the base `.env` file."], "sourceVerdict": "partial"}, "dev-63": {"query": "I deployed a plugin update to a 6.7 staging shop and my new migration never ran \u2014 which `bin/console` command applies the pending migrations of that one plugin, and what do I have to pass to it?", "category": "dev", "answer": "Run `./bin/console database:migrate <PluginName> --all` (e.g. `./bin/console database:migrate SwagBasicExample --all`), passing the plugin's technical name and the `--all` flag to apply all of its pending migrations. Note migrations normally auto-run on plugin install/update, so if the new one never fired, check whether the plugin's update method disabled auto-migration via `$updateContext->setAutoMigrate(false)` \u2014 in that case migrations must be driven manually through the `MigrationCollection` (e.g. `$migrationCollection->migrateInPlace(<timestamp>)`) instead of, or in addition to, the console command. Also remember a migration only ever runs once and there is no rollback, so an already-executed migration file must not be edited \u2014 create a new one instead.", "citations": ["platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md:26-77"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"migration\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | grep -i migrat | head -20"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-64": {"query": "How do I get an Admin API OAuth token \u2014 with client_credentials for an integration, or the password grant for local testing \u2014 and how long is each token valid?", "category": "dev", "answer": "For an integration, create one in Administration under Settings \u2192 System \u2192 Integrations with the 'Administrator' toggle enabled; its access key ID maps to OAuth `client_id` and its secret access key maps to `client_secret`. Then POST to `/api/oauth/token` with `{\"grant_type\": \"client_credentials\", \"client_id\": \"...\", \"client_secret\": \"...\"}`; the response contains `token_type`, `expires_in`, and `access_token`. For local-development-only testing, the wiki describes a password-grant shortcut: POST to `/api/oauth/token` with `grant_type: password`, `client_id: administration`, `scopes: write`, and the default Administration username/password \u2014 the response contains `token_type`, `expires_in`, `access_token`, and (unlike client_credentials) a `refresh_token`. The corpus explicitly warns that the password grant is a local-only shortcut using default Administration credentials and should not replace `client_credentials` for real integrations or reproducible setups. Neither page in the corpus states a concrete `expires_in` number of seconds for either grant \u2014 Shopware Admin API access tokens are commonly short-lived (around 10 minutes / 600 seconds) and the client_credentials flow has no refresh token, so the client must request a new token once it expires, while the password grant's `refresh_token` can be exchanged for a new access token. [from memory]", "citations": ["platform/dev/6.7/guides/development/integrations-api/_index.md:25-44", "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md:27-44"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"client_credentials|oauth|password grant|access_token\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | head -20"}, {"tool": "Read", "args": "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/development/integrations-api/_index.md"}], "notFoundClaim": false, "memoryClaims": ["Neither page in the corpus states a concrete `expires_in` number of seconds for either grant \u2014 Shopware Admin API access tokens are commonly short-lived (around 10 minutes / 600 seconds) and the client_credentials flow has no refresh token, so the client must request a new token once it expires, while the password grant's `refresh_token` can be exchanged for a new access token."], "sourceVerdict": "partial"}, "dev-65": {"query": "What can I put in the JSON body of `POST /api/search/{entity}` for filtering, associations, sorting, aggregations and getting an exact total count?", "category": "dev", "answer": "The endpoint accepts a DAL-style search-criteria JSON object with these parameters: `associations` to load related data (like a SQL join), where nested criteria (sort, filter, limit) can be applied per association; `includes` to restrict returned fields per type, keyed by each response type's `apiAlias` (e.g. `product`, `product_manufacturer`); `ids` to look up records directly by ID; `page` (1-indexed) and `limit` for pagination; `filter` to filter results and aggregations (same filter types as the DAL \u2014 nested-field filters like `transactions.stateMachineState.technicalName` require the association to be requested first); `post-filter`, which filters results like `filter` but does not affect aggregations; `query` for a weighted search (each sub-query has a `score`, summed into `extensions.search._score`) and `term` for text search across `SearchRanking`-flagged fields \u2014 the two must not be combined; `sort`, one or more `{field, order}` entries, supporting `naturalSorting: true` and a `type: \"count\"` sort (added in 6.4.12.0); `aggregations` to compute metrics or facet-like breakdowns (same aggregation types as the DAL); and `grouping` to group results by one or more fields. For an exact total record count, set `total-count-mode: 1` (uses `SQL_CALC_FOUND_ROWS`, more expensive) \u2014 the default `0` returns no total for best performance, and `2` only indicates whether a next page exists.", "citations": ["platform/dev/6.7/guides/development/integrations-api/search-criteria.md:26-61"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/development/integrations-api/search-criteria.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-66": {"query": "Which request headers change Admin API behaviour for language, entity version, parent-child inheritance and skipping flow triggers during a bulk import?", "category": "dev", "answer": "`sw-language-id` returns entities in the given language ID instead of the system language (e.g. `sw-language-id: be01bd336c204f20ab86eab45bbdbe45`). `sw-version-id` tells the API which entity version to return (e.g. `sw-version-id: 0fa91ce3e96a4bc2be4bd9ce752c3425`). `sw-inheritance` makes the API consider parent-child inheritance, such as product variants (e.g. `sw-inheritance: 1`). `sw-skip-trigger-flow` skips flow triggers (e.g. \"send email on customer creation\") during bulk imports via the sync API (e.g. `sw-skip-trigger-flow: 1`).", "citations": ["platform/dev/6.7/guides/development/integrations-api/request-headers.md:19-34"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/development/integrations-api/request-headers.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-67": {"query": "What does a minimal app folder and `manifest.xml` need to contain, and which console commands install and activate the app on my local Shopware 6.7?", "category": "dev", "answer": "Create the app folder under `custom/apps/<TechnicalName>/manifest.xml`, using an UpperCamelCase technical name (e.g. `MyExampleApp`). The `manifest.xml`'s `<meta>` block needs `name`, `label`, `description`, `author`, `copyright`, `version`, `icon`, and `license`; the folder name must match `<meta><name>`, and `<author>`/`<copyright>` are required or `bin/console app:refresh` fails. To register and activate it on local Shopware 6.7: run `bin/console app:refresh` to refresh the app registry, then `bin/console app:install --activate MyExampleApp` (using the technical name, not a filesystem path) to install and activate in one step \u2014 or install without `--activate` and activate later via Extensions \u2192 My Extensions \u2192 Apps or `bin/console app:activate MyExampleApp`. Use `bin/console app:list` to inspect installed apps, `bin/console app:validate` to find configuration issues, and `--no-validate` on `app:install` to skip validation while debugging. After activating, clear caches with `bin/console cache:clear` (or `cache:clear:http` / `cache:clear:all`). Commands must be run from inside the PHP container at the project root.", "citations": ["platform/dev/6.7/guides/plugins/apps/app-base-guide.md:19-42"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"manifest.xml\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | head -20"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/apps/app-base-guide.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-68": {"query": "How does the registration handshake between Shopware and my app backend work \u2014 shop id, proof, shop secret and the confirmation call?", "category": "dev", "answer": "Registration is a GET request Shopware sends to the URL declared in the app's manifest, with query parameters `shop-id`, `shop-url`, `timestamp`, and headers `shopware-app-signature` (HMAC-SHA256 of the query string, signed with the app's `app-secret`), `sw-version` (since 6.4.1.0), and \u2014 on re-registration \u2014 `shopware-shop-signature` (signed with the shop's current `shop-secret`; computed as `hash_hmac('sha256', $queryString, $appSecret)`). On success, the app backend responds with a `proof` (a SHA-256 HMAC of `shopId . shopUrl . appName`, using `app-secret`), a newly generated `shop-secret` (64\u2013255 characters), and a `confirmation_url`, e.g. `{ \"proof\": \"...\", \"secret\": \"random secret string\", \"confirmation_url\": \"https://my.example.com/registration/confirm\" }`. On a failed setup precondition, it responds with `{\"error\": \"...\"}` instead. If the proof matches, Shopware then POSTs to `confirmation_url` with `apiKey`, `secretKey`, `timestamp`, `shopUrl`, `shopId` in the body, signed via the `shopware-shop-signature` header (HMAC-SHA256 of the body with `shop-secret`); the app backend uses `apiKey`/`secretKey` as OAuth `client_id`/`client_secret` against the Admin API. On re-registration, Shopware also sends a `shopware-shop-signature-previous` header (signed with the previous `shop-secret`) so the backend can validate both and accept the old secret for a short grace period (e.g. one minute) during secret rotation. Registration and confirmation requests time out after 5 seconds, and the `app-secret` itself must never be published \u2014 it stays with the Shopware Account.", "citations": ["platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md:27-41", "platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md:90-92"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-69": {"query": "How does an app subscribe to an event like `product.written`, what does Shopware POST to the webhook URL, and how do I verify the request is genuine?", "category": "dev", "answer": "An app declares webhooks in the manifest's `<webhooks>` section, naming the webhook and the `event` it listens to (e.g. `product.written`). Shopware then POSTs a JSON payload shaped like: `{ \"data\": { \"payload\": [ { \"entity\": \"...\", \"operation\": \"...\", \"primaryKey\": \"...\", \"updatedFields\": [] } ], \"event\": \"...\" }, \"source\": { \"url\": \"...\", \"appVersion\": \"...\", \"shopId\": \"...\", \"eventId\": \"...\" }, \"timestamp\": 0 }`. `source.url`, `appVersion`, `shopId`, `eventId` identify the sending shop instance (`eventId` stays stable across retries, since 6.4.11.0); `timestamp` (since 6.4.1.0) records when the webhook was handled and should be used to reject stale/replayed requests. The request also carries `sw-version` (since 6.4.1.0) and `sw-context-language`/`sw-user-language` (since 6.4.5.0) headers. To verify authenticity, check the `shopware-shop-signature` header \u2014 a SHA-256 HMAC of the request body, signed with the shop secret assigned during app registration (the same mechanism used for the registration confirmation request). Note that `entity.written` payloads (e.g. `product.written`) only carry the changed record's `primaryKey`, not the full entity, so the app must fetch associations itself via the shop API, and the referenced entity may already be outdated by fetch time. A webhook can also be restricted to the live version only by adding `onlyLiveVersion` (since 6.5.7.0, default `false`), though this is only honored for `HookableEntityWrittenEvent`-type events.", "citations": ["platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md:26-59"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-70": {"query": "How do I implement a payment method in an app with `pay-url` and `finalize-url`, and what must the app server return in Shopware 6.7?", "category": "dev", "answer": "Define the payment method in the app's manifest with `pay-url` and (for asynchronous payments) `finalize-url` \u2014 the presence of `finalize-url` is what distinguishes an asynchronous method from a synchronous one; omitting `pay-url` leaves the transaction open with no app communication. Your app server must be reachable from Shopware (e.g. via a tunneling service in development). For a synchronous method (only `pay-url` set), Shopware calls it and expects a JSON response with a `status` field (and optional `message` on failure), e.g. `{\"status\": \"authorize\", \"message\": \"optional failure reason\"}`. For an asynchronous method, Shopware POSTs to the pay endpoint with `order`, `orderTransaction`, and a `returnUrl`; the app responds with a `redirectUrl` to send the customer to the payment provider; after the provider redirects the customer back, Shopware POSTs to `finalize-url` with `orderTransaction` and the provider's query parameters, and the app again responds with `status`/`message`. Optionally you can also support prepared payments (since 6.4.9.0, via a `validate` call returning an optional `preOrderPayment` object forwarded to the `pay` call), refunds (since 6.4.12.0, via a `refund` call responding with `status`), and recurring captures (reusing the synchronous payload against an existing billing agreement, requires Subscriptions). On the App PHP SDK, resolve the shop, assemble the stage-specific context, and sign the response, e.g. `$signer->signResponse(PaymentResponse::paid(), $shop)`; the Symfony Bundle instead type-hints action classes like `PaymentPayAction`/`PaymentFinalizeAction` as controller arguments and returns the `PaymentResponse`/`RefundResponse` directly. Important: never change a payment method's manifest identifier after release (Shopware would create a new payment method instead of reusing it), and from Shopware 6.7.0.0 onward the app server must respond with a payment state whenever it intends to change the transaction state.", "citations": ["platform/dev/6.7/guides/plugins/apps/checkout/payment.md:17-66"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"pay-url|finalize-url|payment\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/apps -i | head -20"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/apps/checkout/payment.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-71": {"query": "How does an app define its own custom entities in Shopware 6.7 and read them back through the API?", "category": "dev", "option": "fs-wiki", "answer": "An app defines new data structures by registering custom entities in the app's Resources/entities.xml file, validated against the entity-1.0.xsd schema. For example an <entity name=\"custom_entity_bundle\"> element with <fields> such as string, price, and many-to-many fields, optionally marked store-api-aware=\"true\" to expose them via the Store API. Registered entities automatically get a repository: they can be read from App Scripts via services.repository.search('custom_entity_bundle', criteria), and from the Admin API via POST /api/search/custom-entity-bundle (entity name with underscores replaced by hyphens in the URL). To let a custom field reference a custom entity as an 'Entity Select', add custom-fields-aware=\"true\" and label-property=\"name\" to the <entity> element. Since Shopware 6.4.15.0, entity names can use a ce_ shorthand prefix (e.g. ce_bundle) to avoid database name-length restrictions, and that prefix must be used consistently in repository and API calls (e.g. POST /api/search/ce_blog). Custom entities with custom-fields support requires Shopware 6.5.1.0+, custom entities cannot be renamed once created (renaming deletes existing data), and associations referencing core tables still require corresponding manifest permissions.", "citations": ["platform/dev/6.7/guides/plugins/apps/custom-data/custom-entities.md:19-54"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"custom entit\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/apps/custom-data/custom-entities.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-01": {"query": "How do I create a product with variants and configure its visibility per sales channel, and why might it not show up in the storefront?", "category": "func", "option": "fs-wiki", "answer": "In Catalogues > Products, first save the required fields (Title, Product number, Tax rate, Price gross/net, Stock) \u2014 only then do the other tabs (Specifications, Extended Prices, Variants, Layout, SEO, Cross-Selling, Bundles) appear. On the Variants tab, use the Variant Generator to pick properties/options, define price surcharges, optionally exclude specific combinations under Value exclusion, and click Generate variants; the product list display mode can then be set to 'Single ma
