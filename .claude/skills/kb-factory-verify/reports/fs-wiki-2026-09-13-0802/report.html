in variant' or 'Fan out properties in product list'. Sales channels themselves carry an 'availability' configuration that includes domains, payment/shipping methods, languages, currencies, countries, and product visibility, and Shopware stores this per-channel visibility in a dedicated product_visibility table which is described as 'required for a product to appear' on that channel. So a product can fail to show up in the storefront if it (or its parent, for variants) is not assigned as visible in the relevant sales channel's product_visibility entries, besides other common causes such as the product being inactive, out of stock with the wrong deliverability rule, or restricted by Rule Builder-based visibility rules such as Dynamic Access. [from memory: the specific 'Visibility' section on the product's General tab where sales channels are added with a visibility percentage is not covered verbatim in the retrieved pages, but is the standard place in the Administration where this is configured]", "citations": ["platform/func/catalogues/products.md:20-41", "platform/dev/6.7/concepts/commerce/catalog/sales-channels.md:18-22"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"variant\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func -i"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/products .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/catalogues -maxdepth 1"}, {"tool": "Bash", "args": "grep -in \"variant\" / \"visibility\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md"}, {"tool": "Read", "args": "platform/func/catalogues/products.md"}, {"tool": "Bash", "args": "grep -rln \"sales channel\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/catalogues .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/sales-channel* -i; find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func -iname \"*sales-channel*\" -o -iname \"*saleschannel*\""}, {"tool": "Bash", "args": "grep -n -i \"visib\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/saleschannel.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/catalogues/product-overview.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/catalogues/categories.md"}, {"tool": "Bash", "args": "grep -rn -i \"visibilit\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/part-1.md"}, {"tool": "Read", "args": "platform/dev/6.7/concepts/commerce/catalog/sales-channels.md"}], "notFoundClaim": false, "memoryClaims": ["the specific 'Visibility' section on the product's General tab where sales channels are added with a visibility percentage is not covered verbatim in the retrieved pages, but is the standard place in the Administration where this is configured"], "sourceVerdict": "partial"}, "func-02": {"query": "How do Rule Builder conditions work for shipping and payment methods?", "category": "func", "option": "fs-wiki", "answer": "The Rule Builder (Settings > Automation > Rule Builder) lets merchants define reusable rules made of conditions and operators, and one of its uses is controlling the availability of payment and shipping methods. A rule consists of General information (Name, Description, Priority, Type, Tags) plus one or more Conditions, combined with AND (all must match) or OR (any must match); switching between AND/OR automatically creates subconditions. The condition catalog spans General (Sales Channel, Currency, Language, Date range, Day of the week, Time range, Tax display, Triggered by Admin API), Orders, Flow Builder, Customers, Marketing & Promotions, Items in shopping cart, and Shopping cart groups; some conditions accept an optional narrowing filter. Operators include At least one, All, Is equal to, Is not equal to, Is one of, Is not one of, and the greater/less-than variants. On a Payment method (Settings > Commerce > Payment methods), the Availability rule field uses Rule Builder conditions to control when the method is offered, or a new rule can be created directly from that field; leaving it blank (NULL) means unrestricted availability \u2014 but the method must also be assigned to the relevant sales channel to actually appear there. On a Shipping method (Settings > Commerce > Shipping), the Availability rule likewise uses Rule Builder rules to determine when the method can be selected, and the shipping method must additionally be assigned to a sales channel (in that channel's general settings, shipping methods section) to be available at checkout; the price matrix can also carry its own restriction rule and be built on Rule Builder rules for tiered pricing. The Rule Builder's Assignments tab shows every place a given rule is currently used, including payment/shipping method availability and shipping cost calculation, as a read-only reference.", "citations": ["platform/func/settings/rules.md:32-50", "platform/func/settings/Paymentmethods.md:24-28", "platform/func/settings/shipping.md:27-34"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"rule builder\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func -i | grep -iE \"rule|shipping|payment\""}, {"tool": "Read", "args": "platform/func/settings/rules.md"}, {"tool": "Bash", "args": "grep -n -i \"rule\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/shipping.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/Paymentmethods.md"}, {"tool": "Read", "args": "platform/func/settings/Paymentmethods.md"}, {"tool": "Read", "args": "platform/func/settings/shipping.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-03": {"query": "How do promotions and discount codes work, including individually generated codes?", "category": "func", "option": "fs-wiki", "answer": "Promotions are configured under Marketing > Promotions. The General tab holds Name, Priority (higher priority applied first), Valid from/until, Max. total uses, Max. uses per customer, and an Active toggle. For codes, a promotion can have none required, a single Fixed promotion code shared by all customers (optionally auto-generated), or Individual promotion codes generated per order, where each individual code can only be redeemed once. Individual code generation supports options for code length, an optional prefix/suffix, or a custom pattern using %s for a random letter (A-Z) and %d for a random digit (0-9), e.g. SW-%s%d%s%d%s-TEST; regenerating codes invalidates the previously generated ones. The Conditions tab lets you restrict the promotion to specific sales channels, prevent combination with other promotions, and add Rule-Builder-based Customer/Shopping cart/Order rules plus 'Promote sets of products' (set groups with Mode, Value, Sorting, and Product rules); if multiple rules of the same type are selected only one needs to match (OR logic) \u2014 to require all conditions together you must create separate promotions. The Discounts tab defines what the discount applies to (entire cart, shipping costs, entire product set, or a specific set group), optionally restricts it to a range of products, and sets the Type (Absolute, Percentage, Fixed price, or Fixed unit price \u2014 fixed price cannot exceed the normal price), Value, Maximum discount value (percentage only), and per-currency overrides; once a promotion has been used in an order its discount settings become read-only. In the storefront, customers enter a code via 'Enter voucher code' in the cart. To track redeemed individual codes, open the promotion and check the Redeemed count, then filter the order overview by promotion code; fixed codes are looked up the same way. A key gotcha: putting an 'exclude these products' rule in the shopping-cart conditions blocks the whole promotion whenever an excluded product is in the cart \u2014 exclusions should instead go in the discount's product rules so the rest of the cart still gets discounted, and only one individual promotion code can be redeemed per promotion at a time.", "citations": ["platform/func/marketing/promotions.md:19-51"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"promotion\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func -i"}, {"tool": "Read", "args": "platform/func/marketing/promotions.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-04": {"query": "What does the Shopware Migration Assistant transfer automatically from Shopware 5, and what has to be mapped by hand before the migration starts?", "category": "func", "option": "fs-wiki", "answer": "The Migration Assistant automatically migrates selectable data groups from Shopware 5, of which Basic data is mandatory: Basic data (categories, customer groups, currencies, sales channels, number ranges); Products (products, properties, product options, product properties, translations, cross-selling, main variant relations); Customers & orders (customers, shipping methods, orders, order documents); Promotions (customers, promotions); SEO URLs (products, properties, product options, product properties, translations, cross-selling, main variant relations, SEO URLs); and Product reviews (products, properties, product options, product properties, translations, cross-selling, main variant relations, customers, reviews, media). Before the migration starts, several fields must be manually mapped by creating the equivalents in Shopware 6 first: payment methods, standard payment method, salutation, delivery time, and standard delivery time \u2014 and these mappings cannot be redone after the migration has been executed (even after a reset); remapping requires deleting and recreating the migration entirely. Separately, even though shipping methods are listed as automatically migrated data, the gotchas note that shipping and payment methods are in practice not transferred automatically because Shopware 6 uses the Rule Builder for shipping cost rules and payment risk management, so they must be recreated manually under Settings > Commerce > Shipping and Settings > Commerce > Payment methods after migration. Other things that need manual rework afterward include: sales channel domain settings (since Shopware 6 already has two default sales channels and migrated shops become additional channels), countries (checked under Settings > Localisation > Countries), document templates (redesigned, reconfigured under Settings > Commerce > Documents), email templates (now Twig-based, cannot reuse Shopware 5 templates), Shopping worlds/shop pages (become Shopping Experiences and must be recreated), storefront templates (cannot be reused due to the redesigned architecture), and the B2B Suite (cannot be transferred at all).", "citations": ["platform/func/migration-en/what-is-migrated.md:35-64"], "toolCallLog": [{"tool": "Read", "args": "platform/func/migration-en/what-is-migrated.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-05": {"query": "How do I set up a sales channel \u2014 storefront versus headless type, domains, languages and currencies \u2014 and where do I get its API access key?", "category": "func", "option": "fs-wiki", "answer": "Create a new sales channel via the plus icon next to Sales Channel in the administration, choosing between a Sales Channel with HTML storefront, a headless sales channel (API only), or a product comparison export channel. General settings include the Name, marking it as favourite, entry points for main/footer/service navigation, navigation levels, the default Customer group for new/anonymous customers, Countries, Languages, and standard units of measurement. Under Payment and shipping you configure the available Payment methods (with a default), Shipping methods (with a default), the available Currencies (with a default), and the Tax calculation method. For multi-language, multi-domain setups (self-hosted), each Domain has its own URL, Language, Currency, Snippet set, and unit system; using one consistent protocol across domains avoids duplicate-content issues, and after activation you pick a default domain for Hreflang used as a fallback for all languages. Cloud instances instead get an auto-generated URL with traffic forwarded over an encrypted connection. The API access key is obtained under the sales channel's API access section, where you generate an API Access ID for that channel. Other configurable areas include Status (temporarily disable the channel, enable maintenance mode, IP-whitelist access \u2014 which behind a proxy requires TRUSTED_PROXIES=IP_of_the_proxy in .env), a Products tab to assign/remove products, categories, or dynamic product groups to the channel, a Theme tab, Google Analytics 4 integration, and Agentic files (llms.txt, agents.md, ai-catalog.json). Gotchas: the preinstalled headless sales channel should never be deleted since several extensions (including B2B Suite) depend on it \u2014 hide it from the sidebar via favourites instead; and deleting a sales channel is irrevocable.", "citations": ["platform/func/settings/saleschannel.md:33-68"], "toolCallLog": [{"tool": "Read", "args": "platform/func/settings/saleschannel.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-06": {"query": "Which triggers and actions does the Flow Builder offer, and how do I make it send a mail when an order is placed?", "category": "func", "option": "fs-wiki", "answer": "The Flow Builder (Settings > Automation > Flow Builder) automates business processes by combining an event trigger, optional Rule Builder conditions, and one or more actions. Example trigger names include checkout.order.placed, checkout.customer.register, state_enter.order.state.completed, state_leave.order_transaction.state.paid, newsletter.register, mail.before.send, and checkout.order.payment_method.changed. Available actions (availability depends on the chosen trigger) include: Assign account status, Assign affiliate and campaign code (with an override option), Assign customer group, Generate a document, Send mail (recipients: Administrator \u2014 reaching all admin-flagged users including external API users \u2014, Customer, or custom addresses), Assign status (payment/shipping/order status, with interdependent status rules, e.g. Refunded/Partially Refunded/Chargeback require a prior Paid/Partially Paid status), Stop flow (halts the whole flow including parallel branches), Set download access, Change custom field content (customer or order), and Add Tag / Remove Tag. Delayed Actions (Shopware Beyond plan) let you set a delay (Hour/Day/Week/Month/custom SS.TT.WW.MM format) before an action fires. To send a mail when an order is placed: click Add Flow, fill in General (Name, Description, Priority, Active), go to the Flow tab, choose the checkout.order.placed trigger, optionally add Rule Builder conditions, then add the Send mail action and pick the recipient (Customer, Administrator, or custom addresses) and mail template/content. A gotcha to note: do not set order status to 'Open' via a flow triggered on checkout.order.payment_method.changed, since that status is already set automatically and the action will not work; and Stop flow halts the entire flow, not just the current branch.", "citations": ["platform/func/settings/Flow-Builder.md:19-48"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"flow builder\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func -i"}, {"tool": "Read", "args": "platform/func/settings/Flow-Builder.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-07": {"query": "How do I import products from a CSV with an import/export profile \u2014 column mapping, matching identifiers and a dry run?", "category": "func", "option": "fs-wiki", "answer": "The Import/Export module lives under Settings > Automation > Import/Export. CSV files must use UTF-8 character set, a semicolon field separator, quotation marks as string separator, and prices with a dot as decimal separator (e.g. 5.00, not 5,00). Profiles are managed in the Profiles tab: create a new profile with a name, Usage (import/export/both), Object type (e.g. Product), Separator character (default semicolon), Enclosure character, and Import settings (Create new records / Update existing data) \u2014 you must select the default system language or import/export is not possible. Column mapping is done via Mappings > Add new mapping, pairing each CSV column name with a database entry, plus flags for Required, a Default Value, and Position. For matching identifiers, the Second Unique Identifier setting (on the profile's Advanced Settings tab) lets you resolve import rows to entities via an alternate identifier instead of the record's UUID \u2014 e.g. using productNumber instead of the product ID; if that identifier is not actually unique (e.g. duplicate names), only the first matching record is resolved. For plain product import, select the Default product profile and leave 'Import product variants' unchecked; mandatory fields are id, taxId, productNumber, stock, and name (example CSV columns also include parent_id, product_number, active, stock, name, description, price_net, price_gross, tax_id, tax_rate, tax_name, cover_media_id, cover_media_url, manufacturer_id, manufacturer_name, categories, sales_channels). On the Import tab you upload the CSV, select the profile, and can click Start dry run to validate the file without writing any data, or Start import to run it for real; Import activity keeps a 30-day history with per-row context menu to re-download the source or erroneous CSV. Note that import can only add data, never remove it \u2014 e.g. it will not clear an existing sales-channel assignment on a product.", "citations": ["platform/func/shopware-en/settings/importexport.md:34-79"], "toolCallLog": [{"tool": "Read", "args": "platform/func/shopware-en/settings/importexport.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-08": {"query": "How do custom field sets work \u2014 entity assignment, field types and technical name \u2014 and can a custom field be written through the Store API?", "category": "func", "option": "fs-wiki", "answer": "Custom fields (Settings > System > Custom fields) let merchants add their own data fields to entities such as products or categories, for use in the Rule Builder, storefront templates, or Shopping Experiences. Custom fields are grouped into sets, and a set is assigned to one or more program areas (entities) such as products or categories; creating a set via New set requires a unique, unchangeable technical name, a Position, a translatable Label, and the program areas it applies to \u2014 a set with no assigned area is created but unavailable anywhere. Within a set, fields are added via New custom field; a technical name is always required and cannot be changed later, for either sets or fields. Field types include Select, Object selection (references entities like products, categories, countries, shipping/payment methods \u2014 its object type cannot be changed after creation), Text field, Media, Number (integer/float with Steps, Min, Max), Date/Time, Checkbox, Active/Inactive switch (boolean 0/1), Text Editor, and Color picker. Each field also has common options: Technical name, Position, 'Available in shopping carts' (required to use the field in the Rule Builder or custom templates), 'Modifiable via Store API', Label, Placeholder, and Help text. Yes \u2014 a custom field can be written through the Store API, but only if the 'Modifiable via Store API' option is explicitly enabled on that field, which marks it as public; the documentation warns this should never be enabled for sensitive data. Custom fields are automatically created as snippets in all snippet sets with no database changes needed, but custom field technical names must avoid Twig special characters such as '-' or '#' or product exports can error, and fields must be edited in the store's default language since other-language edits only override that language (a rule relying on the field can silently fail for un-maintained languages).", "citations": ["platform/func/settings/custom-fields.md:35-65"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"custom field\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func -i"}, {"tool": "Read", "args": "platform/func/settings/custom-fields.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-09": {"query": "Why doesn't my payment method appear in the checkout \u2014 what has to be configured in the administration?", "category": "func", "option": "fs-wiki", "answer": "Payment methods are managed under Settings > Commerce > Payment methods. For a payment method to actually appear to customers, several things must be configured: first, the method's Active toggle must be on (the overview lists methods with their active status) \u2014 the documentation notes the four standard active methods are cash on delivery, invoice, prepayment, and direct debit. Second, and explicitly called out, a method also needs to be assigned in the relevant sales channel to actually appear to customers there \u2014 simply being active is not enough if it is not assigned to that sales channel's available payment methods. Third, the method's Availability rule uses Rule Builder conditions to control when the method is offered; if an Availability rule is set and its conditions are not met by the current cart/customer/context, the method will not show at checkout \u2014 leaving the field blank (NULL) means unrestricted availability. When creating or editing a method, other fields such as name, Technical name (a unique identifier \u2014 changing it on an existing method can make it inoperable), Position (storefront display order), description, logo, and 'Allow change of payment method after order completion' are also configurable, but do not by themselves affect whether it initially appears in the checkout.", "citations": ["platform/func/settings/Paymentmethods.md:20-32"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"not.*appear\\|not showing\\|does not show\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func -i"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-10": {"query": "How do dynamic product groups work in the administration and where can the resulting group be used?", "category": "func", "option": "fs-wiki", "answer": "Dynamic product groups are configured under Catalogues > Dynamic product groups in the administration. Each group has General information (Name, Description, and 'Keep matching variants grouped' which controls whether matching variants are shown grouped under their main product or individually) and a Conditions section where you pick a property and condition, chain further conditions with AND/OR, and nest conditions indefinitely with SUB-CONDITION (an item must satisfy the main condition and the sub-condition); a Preview button shows the matching products. For multi-value properties (products, categories, manufacturers, tags, properties) the available operators are: Is equal to, Is not equal to, Is equal to any of, Is not equal to any of, Is equal to all of, Is not equal to all of. Custom fields can be used as condition properties alongside standard ones, and delivery-time conditions use the merchant's defined delivery times (deleting a used delivery time breaks that condition). The Overview list shows each group's name, description, last-change date, and status, which becomes 'invalid' if the group depends on rules from a currently deactivated plugin. The resulting dynamic product group can be used to fill category content dynamically (e.g. sale or manufacturer categories), to feed product comparison content, or to power the product slider CMS element in Shopping Experiences.", "citations": ["platform/func/shopware-6-de/Catalogues/Dynamicproductgroups.md:33-70"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"dynamic product group\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/shopware-6-de/Catalogues/Dynamicproductgroups.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-11": {"query": "How do I create an integration for Admin API access in the administration and give it the right privileges?", "category": "func", "option": "fs-wiki", "answer": "Go to Settings > System > Integrations and use 'Create integration': give it a name, then either grant it 'administrator permissions' (full access) or assign it an existing role instead. On creation Shopware issues an access ID and a security key; the security key is shown only once at creation time, so it must be saved immediately \u2014 it cannot be retrieved again afterwards. From the overview you can edit an integration (click its name) or delete it via the context menu; in edit mode you can use 'Regenerate API access key' to rotate the credentials, which regenerates both the access ID and the security key and invalidates the old ones. To give the integration fine-grained (non-administrator) privileges instead of full admin rights, create a role first under Settings > System > Users & Permissions ('New role'): give it a name/description, then assign Authorisations per area (e.g. Catalogues) using View, Edit, Create, Delete or All \u2014 Edit also grants View, Create also grants Edit and View, but Delete only implicitly grants View. There are also 'Additional permissions' not tied to one area (e.g. Basic configurations, Import/Export, Apps, Clear cache) which are edit-only rights, and a 'Detailed permissions' view that exposes every technical permission with read/write/create/delete rights for cases where an extension doesn't declare its privileges correctly. Once the role exists, select it for the integration instead of the administrator-permissions flag.", "citations": ["platform/func/settings/system/integrationen.md:21-45", "platform/func/settings/system/user.md:36-76"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i 'integration' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings; grep -rln -i 'admin api' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/system/integrationen.md"}, {"tool": "Bash", "args": "grep -rln -i 'role' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/system"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/system/user.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-12": {"query": "A spec asks for customer-specific pricing and for a flow that calls an external URL when an order is placed \u2014 before I build either of them, does Shopware already ship them, and what has to be licensed or installed for them to exist in the shop?", "category": "func", "option": "fs-wiki", "answer": "Both exist already, but with different licensing requirements. Customer-specific pricing (per-customer list, graduated or currency-dependent prices synced from an external system such as an ERP) is only available on the Shopware Beyond plan and requires the Shopware Commercial extension; there is no Administration UI for it at all, so the prices are created, read, changed and deleted purely via the Admin API's 'bulk edit custom prices' endpoint, and variant price inheritance does not apply (each variant needs its own priced entry). A flow that calls an external URL when an order is placed does not need any extra license: it is a built-in Flow Builder capability called a webhook action, which forwards data to a third-party API when a chosen trigger fires (e.g. a new order), either just notifying the server or asking it to act on the information \u2014 no plugin install or commercial license is mentioned as a requirement for it.", "citations": ["platform/func/extensions/customer-specific-pricing.md:21-44", "platform/func/features/webhook-actions-in-flow-builder.md:21-37"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/extensions/customer-specific-pricing.md"}, {"tool": "Bash", "args": "grep -rln -i 'webhook\\|call external\\|http request' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/features/webhook-actions-in-flow-builder.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-01": {"query": "How do I configure Shopware 6's built-in GraphQL API for the Store API?", "category": "edge", "option": "fs-wiki", "answer": "The corpus has no page or synonym entry for a GraphQL API, and the API concepts overview describes Shopware 6 as having exactly two HTTP APIs \u2014 the Store API and the Admin API \u2014 both of which exchange plain JSON over HTTP (the Admin API via OAuth 2.0, the Store API via contextual headers), with no mention of GraphQL at all. There is no built-in GraphQL API for the Store API in Shopware 6; the premise of the question does not match how the corpus describes the platform.", "citations": ["platform/dev/6.7/concepts/api/_index.md:15-39"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i 'graphql' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform"}, {"tool": "Bash", "args": "grep -rln -i 'graphql' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms*; find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms -maxdepth 1"}, {"tool": "Bash", "args": "grep -rln -i 'store api' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/concepts/api/_index.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-02": {"query": "How do I get the DI container with `Shopware()->Container()` and override the product listing Smarty template in Shopware 6?", "category": "edge", "option": "fs-wiki", "answer": "Nothing in the corpus mentions `Shopware()->Container()` or Smarty templates anywhere under platform/dev or the synonyms \u2014 a targeted grep across the whole platform tree returned no matches for either term. Those are Shopware 5 concepts (the legacy global `Shopware()` helper and the Smarty templating engine); Shopware 6 uses the Symfony service container (services are fetched via dependency injection or `$container->get(...)`, not a global `Shopware()->Container()` call) and Twig templates for the Storefront, not Smarty [from memory]. The corpus for the current platform (6.5/6.6/6.7) has pages on the Symfony-based architecture and Twig-based storefront components but no equivalent to the Shopware 5 API being asked about, so the question's premise does not apply to Shopware 6.", "citations": [], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i 'smarty' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform; grep -rln 'Shopware()->Container' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform"}, {"tool": "Bash", "args": "grep -rln -i 'twig\\|dependency injection' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}], "notFoundClaim": true, "memoryClaims": ["Those are Shopware 5 concepts (the legacy global `Shopware()` helper and the Smarty templating engine); Shopware 6 uses the Symfony service container (services are fetched via dependency injection or `$container->get(...)`, not a global `Shopware()->Container()` call) and Twig templates for the Storefront, not Smarty [from memory]."], "sourceVerdict": "partial"}, "edge-03": {"query": "Where do the `#[ORM\\Entity]` mapping attributes for my plugin's entity go in Shopware 6, and how do I get Doctrine's `EntityManager` injected into my service so I can persist it?", "category": "edge", "option": "fs-wiki", "answer": "Shopware 6 does not use Doctrine ORM for plugin entities, so there is no place to put `#[ORM\\Entity]` attributes and no `EntityManager` to inject. The corpus's Data Abstraction Layer page explicitly states the DAL is 'Shopware's thin, non-ORM interface for database access, used instead of an ORM like Doctrine.' Instead, a plugin entity is defined via an `EntityDefinition` class registered in the DI container, and persistence happens through an `EntityRepository` service (e.g. `product.repository`), which you get via constructor injection with autowiring or by explicitly wiring `service('product.repository')` in the service container \u2014 there is no Doctrine `EntityManager` equivalent to inject.", "citations": ["platform/dev/6.7/concepts/framework/data-abstraction-layer.md:18-49"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i 'doctrine\\|EntityManager' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/concepts/framework/data-abstraction-layer.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-04": {"query": "How do I fetch products with `GET /sales-channel-api/v3/product` on Shopware 6.7?", "category": "edge", "option": "fs-wiki", "answer": "On Shopware 6.7 the base path documented for the customer-facing API is `/store-api/*`, not `/sales-channel-api/v3/*`. The corpus's API quick-start guide gives the working call as `GET /store-api/product`, authenticated with the sales channel's API access key sent in the `sw-access-key` header (copied from Sales Channels > [channel] > API access; regenerating the key invalidates the old one). The only other corpus mention of `/sales-channel-api` is a security-measures note that field visibility for `/store-api` and `/sales-channel-api` is controlled per-field by flags, listing it only as a legacy/aliased path rather than describing it as the current endpoint. `/sales-channel-api/v3/product` was the old (Shopware 6.3-and-earlier) naming for what is now the Store API, so on 6.7 the correct endpoint is `GET /store-api/product` [from memory].", "citations": ["platform/dev/6.7/guides/development/integrations-api/_index.md:19-48", "platform/func/tutorials-and-faq/security-measures.md:47-61"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln 'sales-channel-api' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform"}, {"tool": "Bash", "args": "grep -n -i 'sales-channel-api' -B2 -A2 .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/tutorials-and-faq/security-measures.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/integrations-api/_index.md"}], "notFoundClaim": false, "memoryClaims": ["`/sales-channel-api/v3/product` was the old (Shopware 6.3-and-earlier) naming for what is now the Store API, so on 6.7 the correct endpoint is `GET /store-api/product` [from memory]."], "sourceVerdict": "yes"}, "edge-05": {"query": "How do I enable Shopware's built-in MCP server on a Shopware 6.6 shop?", "category": "edge", "option": "fs-wiki", "answer": "The corpus's MCP server documentation only exists under platform/dev/6.7 and lists its prerequisite explicitly as Shopware 6.7.14.0+ (with a narrower window of 6.7.11.0-6.7.13.x usable by setting `MCP_SERVER=1` in `.env` and skipping discovery), plus the `symfony/mcp-bundle` package. There is no mcp-server documentation, and no such flag or bundle requirement listed, for the 6.6 line \u2014 grepping dev/6.6 for MCP content returns nothing. So the built-in MCP server as documented does not exist for a Shopware 6.6 shop; it requires upgrading to the qualifying 6.7 patch level. Once on a qualifying 6.7 version, the setup is: create an integration with `bin/console integration:create \"My MCP Client\" --admin` (omit `--admin` in production and use a scoped ACL role instead), then configure the client (Claude Desktop/Cursor use `streamable-http`, Claude Code uses `http`, pointing at `/api/_mcp` with `sw-access-key`/`sw-secret-access-key` headers), and verify with `bin/console debug:mcp`.", "citations": ["platform/dev/6.7/products/tools/mcp-server/getting-started.md:20-47"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i 'mcp server\\|mcp-server\\| MCP ' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/tools/mcp-server/getting-started.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "partial"}, "edge-06": {"query": "I'm coming from Magento \u2014 what are the Shopware equivalents of store views, extensions, attribute sets and `di.xml`?", "category": "edge", "option": "fs-wiki", "answer": "The corpus's Magento-to-Shopware term dictionary gives direct mappings: Magento's Store View/Store/Website maps to a Shopware sales channel with different languages and domains. Magento's Extension maps to a Shopware Plugin (with the Community Code Pool mapping to Extensions/Community Store under Extensions > Store, and the Local Code Pool mapping to Extensions under Settings > My extensions). Magento's Attribute Sets map to Shopware custom field sets (groups of custom fields, managed under Settings > Content > Custom fields; Magento's plain Attributes map more broadly to Shopware Properties/Custom fields, since properties drive variants/filtering while custom fields extend a product with information). The dictionary itself does not cover `di.xml`, since it is a merchant-facing document without development/config-file mappings that specific; however Shopware's own developer docs show its dependency-injection config equivalent is the plugin's `services.php` file (using Symfony's DI configurator, with `autowire`/`autoconfigure` for automatic injection or explicit `->args([service(...)])` declarations), which is where a Shopware plugin declares and wires its services \u2014 the rough equivalent of Magento's `di.xml`.", "citations": ["platform/func/migration-en/magento-keywords.md:20-53", "platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md:17-57"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i 'magento' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/migration-en/magento-keywords.md"}, {"tool": "Bash", "args": "grep -rn -i 'di.xml\\|dependency injection' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/migration-en"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/services -maxdepth 1"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-07": {"query": "How do I set up Shopware PWA as the storefront for a Shopware 6.7 shop?", "category": "edge", "option": "fs-wiki", "answer": "The corpus's only Shopware PWA page is filed under platform/dev/6.6 (not 6.7), and it contains no setup/installation steps at all \u2014 it is a short overview stating that Shopware PWA is a Vue.js Single Page Application providing a decoupled storefront built on the Store API, and its single Gotcha is that 'Shopware PWA is currently in maintenance mode; Composable Frontends is recommended as the future direction for headless commerce with Shopware.' There is no 6.7-specific page and no configuration/setup guide for it in the corpus, consistent with it being a maintenance-mode product rather than the currently recommended path \u2014 for a 6.7 shop the corpus points toward Composable Frontends instead, though the corpus does not include a dedicated Composable Frontends setup page either. Given the lack of setup instructions and its maintenance status, treat this as a partial-answer/not-found for the 'how to set it up' part.", "citations": ["platform/dev/6.6/products/pwa.md:15-25"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i 'shopware pwa\\|shopware-pwa' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.6/products/pwa.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "partial"}, "edge-08": {"query": "Which service do I type-hint to read products \u2014 `EntityRepositoryInterface` \u2014 and how do I inject it into my plugin service?", "category": "edge", "option": "fs-wiki", "answer": "In Shopware 6, you don't type-hint an `EntityRepositoryInterface` \u2014 you type-hint the concrete `EntityRepository` class (the `entity_name.repository` service, e.g. `product.repository`, injected via `services.php` using `service('product.repository')`), and then call `search()`/`searchIds()` with a `Criteria` object to read products. To inject it into your own plugin service, add it as a constructor parameter typed as `EntityRepository` (private property promotion works: `public function __construct(private EntityRepository $productRepository) {}`); if `autowire`/`autoconfigure` are set in `services.php` this is enough, otherwise declare the service explicitly and pass `service('product.repository')` as an argument in `->args([...])`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md:20-56", "platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md:17-58"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"EntityRepositoryInterface\\|EntityRepository\" <home>/projects/host-project-kb-verify/.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Bash", "args": "find <home>/projects/host-project-kb-verify/.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/data-handling -type f"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-09": {"query": "Where do I configure Business Events so that a mail is sent when an order is placed in Shopware 6.7?", "category": "edge", "option": "fs-wiki", "answer": "In Shopware 6.7 you generally do not configure this via the legacy \"Business Events\" screen anymore \u2014 Business Events (Settings > Shop) was superseded by the Flow Builder as of major release 6.4.8.0 and today only remains relevant for shops still running the B2B-Suite. For sending mail on order placement in 6.7 you use the Flow Builder instead, under Settings > Automation > Flow Builder: create a flow with the trigger `checkout.order.placed`, optionally add Rule Builder conditions, and add a 'Send mail' action choosing the recipient (Administrator, Customer, or custom addresses) and email template. If a shop is still using the legacy Business Events screen (B2B-Suite only), the equivalent technical event there is also `checkout.order.placed`: go to Settings > Shop > Business Events, click 'Add Business-Event', set Title/Active, pick the Event 'Order placed' (technical name `checkout.order.placed`), choose the Email template, and optionally scope by Sales Channel and Rule Builder rules \u2014 noting that if internal Email recipients are added, the customer will not automatically receive the mail unless a second identical event is created for them.", "citations": ["platform/func/settings/Business-Events.md:21-43", "platform/func/settings/Flow-Builder.md:19-53"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"Business Event\\|business-events\\|BusinessEvent\" <home>/projects/host-project-kb-verify/.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func <home>/projects/host-project-kb-verify/.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/func/settings/Business-Events.md"}, {"tool": "Bash", "args": "grep -n \"Flow-Builder\\|Flow Builder\" <home>/projects/host-project-kb-verify/.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md"}, {"tool": "Read", "args": "platform/func/settings/Flow-Builder.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-01": {"query": "How do I add my own Admin API endpoint under `/api/...` from a plugin \u2014 a controller with the api route scope and its ACL?", "category": "gap", "option": "fs-wiki", "answer": "The corpus has no dedicated guide for adding a plugin controller under the Admin API route scope; the closest documented pattern is the Store API route guide, which the corpus itself says to adapt: a route class is tagged with the `#[Route(...)]` attribute carrying `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]` for Store API \u2014 for Admin API the analogous scope class is used instead \u2014 registered as a DI service, then discovered by importing `<plugin root>/src/Resources/config/routes.php` via `$routes->import('../../Core/**/*Route.php', 'attribute')`, and verified with `bin/console debug:router <route-name>` (which only confirms discovery, not that the service constructs or the request succeeds). The guide also notes that for documenting such a route in OpenAPI, Admin API endpoints get their schema JSON placed under `src/Resources/Schema/AdminApi/` instead of `StoreApi/`. On ACL specifically, the corpus's Administration ACL guide is explicit that ACL rules registered via `addPrivilegeMappingEntry`/`meta.privilege`/`acl.can()` only gate the Administration UI \u2014 they do **not** protect the API itself, so a plugin must not rely on Administration ACL alone to secure a custom `/api/...` controller. Constructing an Admin API controller with `AdminApiRouteScope::ID` and gating it with the `#[Acl(['my_permission'])]` route attribute (so the backend itself checks the caller's OAuth scope/permission) is standard Shopware practice, but this exact recipe and class name are not present in the ingested corpus pages I could reach \u2014 I could not confirm it from the wiki text itself. [from memory]", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md:19-58", "platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:14-73"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"api scope|route-scope|RouteScope|_routeScope|api-controller|admin api controller\" .../platform/dev/6.7"}, {"tool": "Bash", "args": "find .../platform/dev/6.7/guides/plugins/plugins/framework -type d; grep -rln \"acl|Acl|ACL\" .../platform/dev/6.7/guides/plugins/plugins/administration"}, {"tool": "Bash", "args": "grep -n \"custom controller|custom-controller|Custom Controller\" .../platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/_index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}, {"tool": "Bash", "args": "grep -rn \"AdminApiRouteScope|#\\[Acl(\" .../platform/dev"}, {"tool": "Bash", "args": "ls .../platform/synonyms*; grep -rln \"api controller|admin api endpoint|custom admin api\" .../platform/synonyms"}, {"tool": "Bash", "args": "grep -n \"api controller|admin api endpoint|custom admin api\" .../platform/synonyms/part-1.md"}], "notFoundClaim": false, "memoryClaims": ["Constructing an Admin API controller with `AdminApiRouteScope::ID` and gating it with the `#[Acl(['my_permission'])]` route attribute (so the backend itself checks the caller's OAuth scope/permission) is standard Shopware practice, but this exact recipe and class name are not present in the ingested corpus pages I could reach \u2014 I could not confirm it from the wiki text itself."], "sourceVerdict": "partial"}, "gap-02": {"query": "Shopware 6.7 removed the RSA JWT key files and `system:generate-jwt-secret` \u2014 what signs Admin API tokens now, and what do I have to do when upgrading?", "category": "gap", "option": "fs-wiki", "answer": "The corpus confirms the command was dropped: the 6.6 commands reference lists `system:generate-jwt-secret` among the `system:*` commands (`system:config:get`, `system:config:set`, `system:configure-shop`, `system:generate-app-secret`, `system:generate-jwt-secret`, `system:install`, `system:setup`, `system:update:finish`, `system:update:prepare`), while the equivalent 6.7 commands reference lists only `system:install`, `system:setup`, `system:config:get`, `system:config:set`, `system:check` under System \u2014 `system:generate-jwt-secret` and `system:generate-app-secret` are gone. The 6.7 environment-variables reference documents `APP_SECRET` (generated with `openssl rand -hex 32`) as the app-wide secret, which is the natural signing-key candidate replacing the RSA keypair, but the corpus pages I could reach do not explicitly state that Admin API OAuth tokens are now HMAC-signed with `APP_SECRET` instead of RSA-signed with the removed keys, nor do they give an explicit upgrade migration step for existing installations. Shopware 6.7 switched Admin API OAuth token signing from an RSA keypair (`public.pem`/`private.pem` generated by `system:generate-jwt-secret`) to a symmetric HMAC scheme keyed off `APP_SECRET`, so on upgrade you mainly need to ensure `APP_SECRET` is set (it already exists in most `.env` files) and can drop any deployment step that provisioned or synced the old JWT key files across app servers \u2014 but I could not confirm this replacement mechanism or the exact upgrade steps from the ingested wiki text itself. [from memory]", "citations": ["platform/dev/6.6/re e`, the `scope` format)?", "category": "gap", "option": "fs-wiki", "answer": "The corpus's Admin API authentication pages (the 6.7 integrations-api quick start, the follow-up Authentication and API Requests page, and the Admin API hub) only document the `client_credentials` and local `password` grants against `POST /api/oauth/token` \u2014 with `client_id`/`client_secret` (or, for the password grant, `client_id: administration`, `scopes: write`, plus username/password) \u2014 and none of them mention an `/api/oauth/authorize` endpoint or describe any change to the `scope` parameter's format between versions. I found no page in the ingested wiki (including the admin-api hub, the synonyms index, and both the 6.6 and 6.7 integrations-api guides) documenting a 6.7 breaking change to the OAuth authorize flow or scope format, so I cannot confirm from this corpus what changed for the ERP integration's login failure.", "citations": [], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"oauth/authorize|scope format|authorization_code|response_type\" .../platform/dev/6.7"}, {"tool": "Bash", "args": "grep -n \"oauth|OAuth\" .../platform/synonyms/part-1.md .../platform/synonyms/index.md; grep -rln \"oauth\" .../platform/hubs"}, {"tool": "Read", "args": "platform/hubs/admin-api.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/development/integrations-api/_index.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "gap-04": {"query": "After upgrading to 6.7 my plugin fatals on load because core class properties now have native PHP types \u2014 which properties must I retype in my subclasses?", "category": "gap", "option": "fs-wiki", "answer": "I found nothing in the corpus about a 6.7 change that added native PHP property types to core classes (e.g. `Entity` or DAL base classes), nor a list of which properties plugin subclasses must retype. The only related page, the entities-via-attributes guide, documents typed properties as part of the newer attribute-based entity definition syntax for defining new entities, not as a breaking change to existing core class properties, and it does not name any specific property that must be retyped. I checked the 6.7 upgrades-migrations index and the dev/6.7 index for a breaking-change or property-typing note and found none. This appears to be a genuine gap in the ingested corpus \u2014 I could not confirm or deny the premise from the wiki text.", "citations": [], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"native type|native PHP type|property type|typed propert\" .../platform/dev/6.7"}, {"tool": "Bash", "args": "grep -n \"native type|native PHP type|property type|typed propert\" -B3 -A5 .../platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md"}, {"tool": "Bash", "args": "grep -rln \"typed propert|strict_types|nullable propert|property.*type.*breaking|BC break\" .../platform/dev/6.7; grep -n \"native type|typed propert|property type\" .../platform/synonyms/part-1.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "gap-05": {"query": "My plugin decorates `CachedProductRoute` to add cache tags \u2014 where did the `Cached*Route` classes go in Shopware 6.7 and how do I cache a Store API route now?", "category": "gap", "option": "fs-wiki", "answer": "The corpus's Caching guide describes Shopware 6.7's current caching model without any `Cached*Route` decorator classes: caching is handled by the multi-layer cache system (an outer HTTP-Cache plus internal object caches) driven by the `CacheTagCollector`/`CacheInvalidator` services rather than by wrapping a route (e.g. `CachedProductRoute`) in a decorator. To add cache tags for your own data, inject `CacheTagCollector` and call `$this->cacheTagCollector->addTag('my-custom-entity-' . $id)`, and invalidate later via `$this->cacheInvalidator->invalidate(['my-custom-entity-' . $id])` (pass `true` as a second argument, or set the `sw-force-cache-invalidate: 1` request header, to force immediate invalidation instead of the default 5-minute batched invalidation run by the `shopware.invalidate_cache` scheduled task). Default tag invalidation is wired up via `CacheInvalidationSubscriber`, whose DI-configured event-listener tags can be removed or tweaked with a compiler pass using `RemoveEventListener`. To influence the cache hash/key itself (what varies the cached response), subscribe to `HttpCacheCookieEvent` (to add custom hash parts or call `$event->isCacheable = false`) or `HttpCacheKeyEvent` (for the exact Symfony cache key), and register custom cookies relevant to the hash via the `shopware.http_cache.cookies` config; note `HttpCacheKeyEvent`/`HttpCacheCookieEvent` fire on every request so expensive work (e.g. DB queries) should be avoided in their listeners. The corpus does not document a `CachedProductRoute` class by that name for 6.7, so the specific decorator this plugin currently uses may simply no longer exist under that name \u2014 but I could not find an explicit corpus statement that `CachedProductRoute` was removed or renamed, only that the documented current mechanism no longer relies on such per-route decorator classes.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/caching/_index.md:20-79"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"CachedProductRoute|Cached.*Route|http-cache|HttpCache|cache tags\" .../platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/caching/_index.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "partial"}, "gap-06": {"query": "How do I create a shipping method from my plugin's installer or migration, including the `technicalName` that 6.7 requires?", "category": "gap", "option": "fs-wiki", "answer": "The corpus has no dedicated guide for creating a shipping method from a plugin's PHP installer/migration (the only shipping-methods page found, `guides/plugins/apps/checkout/shipping-methods.md`, covers the separate, experimental app-manifest `<shipping-methods>` XML block, not a plugin repository call). It does, however, document the identical `technicalName` requirement for the sibling entity, payment methods, in the Add Payment Plugin guide: from Shopware 6.7.0.0 a plugin registers its payment method in `install`/`activate`/`deactivate` via the `payment_method.repository`, passing an array that includes `'technicalName' => 'swag_example-example_payment'` alongside `handlerIdentifier`, `name`, `description`, `pluginId`, `afterOrderEnabled`; the guide's gotcha is explicit that `technicalName` is required from 6.7 onward, must be unique with a plugin-specific prefix, and an omitted value can prevent the plugin from installing or activating \u2014 and, separately, that the method should never be deleted on `uninstall`, only deactivated, since orders may still reference it. By direct analogy, creating a shipping method from a plugin's installer/migration means upserting into the `shipping_method.repository` in the plugin's lifecycle class (or a migration), supplying a similarly unique, plugin-prefixed `technicalName` field alongside the other required shipping-method fields (name, availability rule, delivery time, etc.), and likewise deactivating rather than deleting it on uninstall \u2014 but I could not find a corpus page that documents the shipping-method-specific fields or confirms this pattern verbatim. [from memory]", "citations": ["platform/dev/6.7/guides/plugins/apps/checkout/shipping-methods.md:15-51", "platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:17-73"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"shipping method|ShippingMethod|technicalName\" .../platform/dev/6.7"}, {"tool": "Bash", "args": "grep -n \"shipping\" .../platform/dev/6.7/guides/plugins/plugins/checkout/_index.md; find .../platform/dev/6.7/guides/plugins/plugins/checkout -type f"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/apps/checkou   function sortableTable(container, columns, rows, defaultKey, defaultDir) {
    var wrap = el('div', { class: 'table-wrap' });
    var table = document.createElement('table');
    var thead = document.createElement('thead');
    var trh = document.createElement('tr');
    var sortKey = defaultKey;
    var sortDir = defaultDir || -1;
    columns.forEach(function (c) {
      var cell = th(c.label);
      cell.dataset.key = c.key;
      cell.addEventListener('click', function () {
        if (sortKey === c.key) sortDir *= -1; else { sortKey = c.key; sortDir = -1; }
        draw();
      });
      trh.appendChild(cell);

    thead.appendChild(trh);
    var tbody = document.createElement('tbody');
    table.appendChild(thead);
    table.appendChild(tbody);
    wrap.appendChild(table);
    container.appendChild(wrap);
    function draw() {
      var sorted = rows.slice().sort(function (a, b) {
        var av = a[sortKey], bv = b[sortKey];
        if (av === undefined || av === null) av = '';
        if (bv === undefined || bv === null) bv = '';
        if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sortDir;
        return String(av).localeCompare(String(bv)) * sortDir;
      });
      tbody.innerHTML = '';
      if (sorted.length === 0) {
        var tr = document.createElement('tr');
        var cell = document.createElement('td');
        cell.colSpan = columns.length;
        cell.className = 'empty';
        cell.textContent = 'No data.';
        tr.appendChild(cell);
        tbody.appendChild(tr);
        return;

      sorted.forEach(function (r) {
        var tr = document.createElement('tr');
        columns.forEach(function (c) {
          tr.appendChild(c.render ? c.render(r) : td(r[c.key]));

  (function renderCases() {

    corpusKv.appendChild(el('dd', { text: corpus.name }));
    corpusKv.appendChild(el('dt', { text: 'Probe' }));
    corpusKv.appendChild(el('dd', { text: probe && probe.ok !== undefined ? ((probe.ok ? 'ok' : 'failed') + (probe.detail ? ' — ' + probe.detail : '')) : null }));
    Object.keys(fp).forEach(function (k) {
      corpusKv.appendChild(el('dt', { text: k }));
      corpusKv.appendChild(el('dd', { text: fp[k] }));
    });
    panel.appendChild(corpusKv);

    panel.appendChild(el('h2', { text: 'Yardstick' }));
    var yardstick = scores.yardstick || {};
    var ykv = el('dl', { class: 'kv' });
    ['casesMdSha', 'rubricSha', 'briefSha'].forEach(function (k) {
      ykv.appendChild(el('dt', { text: k }));
      ykv.appendChild(el('dd', { text: yardstick[k] }));
    });
    panel.appendChild(ykv);

    if (scores.runs && Object.keys(scores.runs).length) {
      panel.appendChild(el('h2', { text: 'Runs (compare)' }));
      var rkv = el('dl', { class: 'kv' });
      Object.keys(scores.runs).forEach(function (k) {
        rkv.appendChild(el('dt', { text: k }));
        rkv.appendChild(el('dd', { text: scores.runs[k] }));
      });
      panel.appendChild(rkv);
    }

    panel.appendChild(el('h2', { text: 'Selector' }));
    panel.appendChild(el('p', { text: dash(scores.casesSelector) }));

    if (warnings.length) {
      panel.appendChild(el('h2', { text: 'Warnings' }));
      var ul = document.createElement('ul');
      warnings.forEach(function (msg) { ul.appendChild(el('li', { text: msg })); });
      panel.appendChild(ul);
    }

    panel.appendChild(el('h2', { text: 'scores.json' }));
    var details = document.createElement('details');
    details.appendChild(el('summary', { text: 'Show raw scores.json' }));
    details.appendChild(prettyJson(scores));
    panel.appendChild(details);
  })();

})();
</script>
</body>
</html>
