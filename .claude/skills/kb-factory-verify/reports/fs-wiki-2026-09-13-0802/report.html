2 70 (took 40)", "rescore edge-06: groundingRelevance 100 \u2192 70 (took 70)", "rescore edge-06: accuracy 70 \u2192 0 (took 0)", "rescore edge-06: completeness 70 \u2192 40 (took 40)", "rescore edge-06: actionability 70 \u2192 40 (took 40)", "rescore edge-09: groundingRelevance 100 \u2192 70 (took 70)", "rescore gap-01: accuracy 40 \u2192 100 (took 40)", "rescore gap-01: honesty 0 \u2192 100 (took 0)", "rescore gap-08: completeness 100 \u2192 70 (took 70)", "usage/cost totals exclude the 4 scoring-shard agents: they wrote their files successfully but hit the account rate limit before returning a usage block"]}, "raw": {"fs-wiki": {"dev-01": {"query": "How do I extend the product entity with a new association in Shopware's Data Abstraction Layer?", "category": "dev", "option": "fs-wiki", "answer": "To relate two entities in the DAL you add association fields to their EntityDefinitions. For a One-to-One relation, add an FkField (e.g. `foo_id`) plus a `OneToOneAssociationField` on the owning side, and just the inverse `OneToOneAssociationField` on the other side (no FkField needed there): `(new FkField('foo_id', 'fooId', FooDefinition::class))->addFlags(new Required())` and `new OneToOneAssociationField('foo', 'foo_id', 'id', FooDefinition::class, false)`. For One-to-Many/Many-to-One, the 'many' side gets an FkField and a `ManyToOneAssociationField`, while the 'one' side gets a `OneToManyAssociationField`, e.g. `new OneToManyAssociationField('foos', FooDefinition::class, 'bar_id')` on the 'one' definition and `new ManyToOneAssociationField('bar', 'bar_id', BarDefinition::class, 'id')` on the 'many' definition. For Many-to-Many, you need a third `MappingEntityDefinition` with two FkFields (both flagged PrimaryKey and Required) and two ManyToOneAssociationFields, plus a `ManyToManyAssociationField` added on each of the two main definitions, e.g. `new ManyToManyAssociationField('foos', FooDefinition::class, FooBarMappingDefinition::class, 'bar_id', 'foo_id')`. Important gotchas: setting `autoload` to true on both the EntityExtension side and the EntityDefinition side of the same association causes recursion/out-of-memory errors; ManyToOneAssociationField's and ManyToManyAssociationField's autoload defaults to false for performance reasons; and `storageName` parameters are snake_case while `propertyName` parameters are lowerCamelCase. To add an association specifically onto an existing core entity like Product, this is done via an EntityExtension class that adds the association field to the target definition's field collection (product's own definition is not modified directly).", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-associations.md:1-58"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -maxdepth 3 -type d"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins -maxdepth 3 -type d"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/data-handling -maxdepth 2"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-associations.md"}], "notFoundClaim": false, "memoryClaims": ["To add an association specifically onto an existing core entity like Product, this is done via an EntityExtension class that adds the association field to the target definition's field collection (product's own definition is not modified directly)."], "sourceVerdict": "yes"}, "dev-02": {"query": "What's the plugin lifecycle in Shopware \u2014 install, activate, uninstall \u2014 and how does `keepUserData` work?", "category": "dev", "option": "fs-wiki", "answer": "A Shopware plugin's base class (`Shopware\\Core\\Framework\\Plugin`, extending `Shopware\\Core\\Framework\\Bundle` and Symfony's `Bundle`, implemented in `<plugin root>/src/SwagBasicExample.php`) provides lifecycle methods for each stage: `install(InstallContext $installContext)` registers entities (e.g. payment methods), creates initial data, and prepares requirements \u2014 `InstallContext` exposes plugin/Shopware versions, system `Context`, plugin migrations, and auto-migration control (`isAutoMigrate`/`setAutoMigrate`). `activate(ActivateContext $context)` activates the entities created in `install()` or creates data requiring the plugin to be active. `deactivate(DeactivateContext $context)` deactivates entities from `install()` or removes entities that can't safely stay active. `update(UpdateContext $context)` handles non-database adjustments, feature toggles, or logic depending on old/new plugin versions (database changes belong in plugin migrations instead); `UpdateContext` adds `getUpdatePluginVersion()` and `getCurrentPluginVersion()`. `postInstall(InstallContext $context)`/`postUpdate(UpdateContext $context)` run after a successful install/update completes. Finally `uninstall(UninstallContext $context)` removes or cleans up plugin data, and `UninstallContext` adds `keepUserData()`: `public function uninstall(UninstallContext $context): void { if ($uninstallContext->keepUserData()) { return; } // Remove or deactivate the data created by the plugin }`. If `keepUserData()` returns true, persistent plugin data must not be deleted. Other gotchas: avoid creating fully active business data in `install()` since the plugin isn't yet enabled \u2014 create data that can be safely activated/deactivated and activate it only in `activate()`; and don't blindly delete entities in `uninstall()` (e.g. a payment method used on real orders should be deactivated, not removed, to avoid leaving orders broken).", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md:1-62"], "toolCallLog": [{"tool": "Bash", "args": "grep -rn \"lifecycle|keepUserData|uninstall\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-03": {"query": "How do I add a custom Store API route for a headless storefront?", "category": "dev", "option": "fs-wiki", "answer": "Follow Shopware's decoratable-route pattern: 1) Define an abstract route with a `getDecorated()` method and a `load(Criteria $criteria, SalesChannelContext $context): ExampleRouteResponse` method, e.g. `abstract class AbstractExampleRoute { abstract public function getDecorated(): AbstractExampleRoute; abstract public function load(Criteria $criteria, SalesChannelContext $context): ExampleRouteResponse; }`. 2) Implement the concrete route class tagged with the `#[Route(...)]` attribute using `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]`, and a route such as `#[Route(path: '/store-api/example', name: 'store-api.example.search', methods: ['GET','POST'], defaults: ['_entity' => 'swag_example'])]` on `load()`; `getDecorated()` throws `DecorationPatternException` when nothing decorates it yet, and any fields that should be returned via the API need the `ApiAware` flag in their definition. 3) Register the route class as a service, constructor-injecting the repository (e.g. `swag_example.repository`). 4) Create an `ExampleRouteResponse extends StoreApiResponse` exposing the search result via a getter. 5) Import the route via `<plugin root>/src/Resources/config/routes.php` using `$routes->import('../../Core/**/*Route.php', 'attribute');`, and verify discovery with `bin/console debug:router store-api.example.search` (this only confirms discovery, not that the service can be constructed or a request succeeds). 6) Optionally document the route with a JSON OpenAPI file under `<plugin root>/src/Resources/Schema/StoreApi/` so the internal `OpenApi3Generator` picks it up, checkable at `/store-api/_info/stoplightio.html`. 7) To also expose it to the Storefront, add a controller extending `StorefrontController`, scoped with `StorefrontRouteScope::ID`, that calls the route, and import it via `$routes->import('../../Storefront/**/*Controller.php', 'attribute');`. A key gotcha: the service definition connects the route to the DI container while the `routes.php` import is a separate discovery step \u2014 a route class can be registered as a service without becoming a reachable endpoint until its attributes are imported.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md:1-57"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/store-api -maxdepth 1"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-04": {"query": "How do I create a custom CMS element for Shopping Experiences?", "category": "dev", "option": "fs-wiki", "answer": "A CMS element is the smallest content primitive (text, image, video, product listing, etc.) placed inside a block's slot, with no knowledge of its context. The recommended Administration directory layout is `src/Resources/app/administration/src/module/sw-cms/elements/<name>/` with `index.js`, a `component/` (index.js + .html.twig + .scss), a `config/` (index.js + .html.twig), and a `preview/` (index.js + .html.twig + .scss). Steps: 1) import the element folder in `main.js`; 2) register it via `Shopware.Service('cmsService').registerCmsElement({...})` with keys `name`, `label`, `component`, `configComponent`, `previewComponent`, `defaultConfig` (a map of config key to `{ source, value }`), and optionally `hidden`/`removable`; 3) create the preview component (the thumbnail shown in the element picker); 4) create the main component, mixing in the `cms-element` mixin and calling `this.initElementConfig('<name>')` in `created()`, providing fallback content so the element isn't invisible in the editor when unconfigured; 5) create the config component (also mixing in `cms-element` and calling `initElementConfig`), with form fields for each `defaultConfig` key, preferably using Shopware Meteor components; 6) for inheritance-aware fields (content inherited from the base layout vs. overridden per page) wrap them with `sw-cms-inherit-wrapper`, passing `field` and `element`; 7) for the Storefront, add a Twig template at `src/Resources/views/storefront/element/cms-element-<name>.html.twig` \u2014 the `cms-element-` prefix is required exactly in the filename. Gotchas: clear the Storefront cache after adding new element templates, and by default element configuration is inherited from the base layout unless explicitly overridden, though the UI may not make this obvious without the inherit-wrapper component.", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/cms/add-cms-element.md:1-58"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/content/cms -maxdepth 1"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/content/cms/add-cms-element.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-05": {"query": "How does theme inheritance work in Shopware \u2014 theme.json and SCSS overrides?", "category": "dev", "option": "fs-wiki", "answer": "Theme inheritance lets one theme extend an existing, installed theme, reusing its templates, styles, scripts, assets, and config while adding its own changes \u2014 useful for a variant of a used theme (dark version, per-sales-channel differences, customized store-bought theme) without duplicating the original theme's code. It's configured by editing `theme.json` in `<plugin root>/src/Resources` of the extending theme, inserting the base theme's technical name into each relevant section before the extending theme's own alias, e.g.: `{ \"name\": \"SwagBasicExampleThemeExtend\", \"views\": [\"@Storefront\", \"@Plugins\", \"@SwagBasicExampleTheme\", \"@SwagBasicExampleThemeExtend\"], \"style\": [\"app/storefront/src/scss/overrides.scss\", \"@SwagBasicExampleTheme\", \"app/storefront/src/scss/base.scss\"], \"script\": [\"@Storefront\", \"@SwagBasicExampleTheme\", \"app/storefront/dist/storefront/js/.../file.js\"], \"asset\": [\"@Storefront\", \"@SwagBasicExampleTheme\", \"app/storefront/src/assets\"], \"configInheritance\": [\"@Storefront\", \"@SwagBasicExampleTheme\"] }`. For `views`, rendering order is Storefront base then plugin extensions then the base theme then the current theme. For `script` the order is layered the same way (Storefront JS, then base theme's JS, then current theme's JS). For `style`, `overrides.scss` stays first because it can affect SCSS variables like `$border-radius`. For `asset`, you must add the base theme explicitly (e.g. `@SwagBasicExampleTheme`) to reuse its assets. For `configInheritance`, the last listed theme that differs from the current one becomes the parent theme for config values, and the `Storefront` theme's config is always inherited even without an explicit `configInheritance` entry.", "citations": ["platform/dev/6.7/guides/plugins/themes/inheritance/add-theme-inheritance.md:1-54"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/themes -maxdepth 2"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/themes/inheritance/add-theme-inheritance.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-06": {"query": "How do I add a custom Flow Builder action?", "category": "dev", "option": "fs-wiki", "answer": "First define an `Aware` interface for the data your action needs, extending `Shopware\\Core\\Framework\\Event\\FlowEventAware` and marked `#[IsFlowEventAware]`, e.g. `#[IsFlowEventAware] interface TagAware extends FlowEventAware { public const TAG = 'tag'; public const TAG_ID = 'tagId'; public function getTag(); }`. Then implement the action by extending `Shopware\\Core\\Content\\Flow\\Dispatching\\Action\\FlowAction`, providing `getName()` (e.g. returning `'action.create.tag'`), `requirements()` (returning the required Aware interfaces, e.g. `[TagAware::class]`), and `handleFlow(StorableFlow $flow)` which reads config via `$flow->getConfig()`, `$flow->getStore($key)` for data from Aware interfaces, and `$flow->getData($key)` for data from the original event or additional data. Register the action with the `flow.action` service tag including `priority` and `key`, e.g. `$services->set(CreateTagAction::class)->args([service('tag.repository')])->tag('flow.action', ['priority' => 600, 'key' => 'action.create.tag']);` \u2014 this makes the action appear in the `/api/_info/flow-actions.json` response, with `priority` determining its order. `requirements()` controls scope: an empty array makes the action available for every trigger, a list of Aware interfaces (e.g. `[OrderAware::class, CustomerAware::class]`) restricts it to matching events, or you can define a brand-new event implementing your custom Aware and register it via a `BusinessEventCollectorSubscriber` listening on `BusinessEventCollectorEvent::NAME`. In the Administration, define an action constant and a `GROUP` (e.g. `export const ACTION = Object.freeze({ CREATE_TAG: 'action.create.tag' }); export const GROUP = 'customer';`), add snippet labels, and override `sw-flow-sequence-action` to map the action name to a modal (or to `onSaveActionSuccess` directly if no modal is needed), importing the override and any new component into `main.js`. Gotchas: the action's group defaults to `general` if `GROUP` isn't defined (existing groups include `general`, `tag`, `customer`, `order`), and a subscriber adding a new trigger event must run with sufficiently high priority to register before other `BusinessEventCollectorEvent` subscribers, or awareness/actions may be missing.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-action.md:1-93"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/flow -maxdepth 1"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-action.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-07": {"query": "My plugin needs to store its own data in a new table \u2014 how do I define a custom DAL entity with its definition, entity and collection class so I get a repository for it?", "category": "dev", "option": "fs-wiki", "answer": "First create the plugin's own database table via a plugin migration, prefixing the table name (e.g. `swag_example`). Then add an `EntityDefinition` subclass implementing `getEntityName()` (returns the table name, which also becomes the `<name>.repository` service id in the DI container) and `defineFields()`, returning a `FieldCollection` \u2014 e.g. an `IdField` flagged `Required`+`PrimaryKey`, plus StringField/BoolField properties. `created_at`/`updated_at` columns don't need explicit field definitions. Register the definition in the DI container tagged `shopware.entity.definition` with an `entity` attribute matching the entity name, e.g. `$services->set(ExampleDefinition::class)->tag('shopware.entity.definition', ['entity' => 'swag_example']);`. To get typed objects instead of generic `ArrayEntity`, add a custom `Entity` class (extends `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity`, uses the `EntityIdTrait`, with one protected property plus getter/setter per field) wired via `getEntityClass()`, and a custom `EntityCollection` (extends `EntityCollection`, overrides `getExpectedClass()`) wired via `getCollectionClass()`. Gotchas: entity class properties must be at least `protected` (never `readonly`) or the DAL cannot set values; `storageName` is snake_case while `propertyName` is lowerCamelCase; and `getEntityName()`'s return value is used as both the table name and the repository service id, so they must match exactly.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md:1-71"], "toolCallLog": [], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-08": {"query": "In a plugin service, what is the Shopware 6 equivalent of Doctrine's `findBy()` \u2014 how do I read products with filters, associations and sorting?", "category": "dev", "option": "fs-wiki", "answer": "Shopware 6 uses no ORM, only a thin Data Abstraction Layer (DAL); the equivalent of Doctrine's `findBy()` is injecting the entity repository (named `entity_name.repository`, e.g. `product.repository`, via `service('product.repository')` in `services.php`) and calling `search(Criteria $criteria, Context $context)`, which returns an `EntitySearchResult`. A basic unconditional read is `$this->productRepository->search(new Criteria(), $context)`; searching by ID(s) uses `new Criteria([$myId])` then `->first()`. Filter by field with `$criteria->addFilter(new EqualsFilter('name', 'Example name'))` (`Shopware\\Core\\Framework\\DataAbstractionLayer\\Search\\Filter\\EqualsFilter`), and combine filters with `OrFilter`, `AndFilter`, `NandFilter`, etc. `addPostFilter()` applies a filter to the result but not to aggregations. For associations, use `$criteria->addAssociation('productReviews')`, chainable as `'productReviews.customer'`; filtering the association itself via `$criteria->getAssociation('productReviews')->addFilter(...)` does not restrict the parent entity, whereas adding a filter on `'productReviews.points'` on the main criteria (alongside `addAssociation()`) does restrict the parent entity. Mapping entities (e.g. `ProductCategoryDefinition`) cannot be read with `search()` \u2014 use `searchIds()` instead, since they only have primary keys. For aggregations, use `$criteria->addAggregation(new AvgAggregation('avg-rating', 'productReviews.points'))` and read the result via `$products->getAggregations()->get('avg-rating')`. Paging/sorting use `setLimit()`, `setOffset()`, and `addSorting(new FieldSorting('createdAt', FieldSorting::ASCENDING))`. For large datasets, use `RepositoryIterator($this->productRepository, $context, $criteria)` and call `->fetch()` in a loop until it returns `null` \u2014 this requires a deterministic sort (e.g. always including `id` as a secondary sort) to avoid entities being skipped or duplicated across batches, and it issues a new database request per iteration so it should be avoided for small datasets. Note that `EntitySearchResult` is always a collection, even for a single-ID search, so `first()` must be called to get the entity.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md:1-55"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-09": {"query": "How do I make a field on my plugin's own entity translatable per language?", "category": "dev", "option": "fs-wiki", "answer": "Steps: 1) create a migration for a `<entity>_translation` table, named by appending `_translation` to the entity's table name (e.g. `swag_example_translation`), with required columns `<entity>_id` (FK to the entity), `language_id` (FK to `language`), the translated column(s) (e.g. `name`), `created_at`, `updated_at`, and a composite primary key `(<entity>_id, language_id)`. 2) Create `ExampleTranslationDefinition extends Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityTranslationDefinition`, override `getParentDefinitionClass()` to return the parent entity's definition class, and define the translated column(s) with `StringField`. 3) Register both definitions in `services.php` with the `shopware.entity.definition` tag, registering the translation definition after the parent entity's definition (`ExampleDefinition::class -> tag('shopware.entity.definition', ['entity' => 'swag_example'])` then `ExampleTranslationDefinition::class -> tag('shopware.entity.definition', ['entity' => 'swag_example_translation'])`). 4) Create `ExampleTranslationEntity extends Shopware\\Core\\Framework\\DataAbstractionLayer\\TranslationEntity` with getters/setters for the translated field(s) and the association back to the parent entity, and override `getEntityClass()` on the definition to return it. 5) Create an `ExampleTranslationCollection extends EntityCollection` the same way as for a normal entity. 6) On the main entity's definition, add a `TranslatedField('name')` and a `TranslationsAssociationField(ExampleTranslationDefinition::class, 'swag_example_id')`. When reading the data, prefer `entity.translated.field` in storefront/sales-channel contexts and `entity.field` in Admin/CRUD flows. Gotchas: the translation definition must be registered after the entity it translates, and the translation table's foreign keys (`<entity>_id`, `language_id`) both cascade on delete and update.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-translations.md:1-53"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-translations.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-10": {"query": "How do I write an indexer that precomputes derived data for my custom entity on write, and how do I trigger a full reindex?", "category": "dev", "option": "fs-wiki", "answer": "Data indexers optimize recurring, complex calculations (e.g. a product's `cheapest_price`) by computing them once whenever the entity is written via the DAL, instead of on every read. Before writing a new one, check whether the target entity already has one and prefer subscribing to its dispatched event instead (existing indexers include `CustomerIndexer`, `CategoryIndexer`, `LandingPageIndexer`, `ProductIndexer`, `ProductStreamIndexer`, `PromotionIndexer`, `RuleIndexer`, `MediaIndexer`, `MediaFolderIndexer`, `MediaFolderConfigurationIndexer`, `SalesChannelIndexer`, `BreadcrumpIndexer`). To write a custom one, create a class extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Indexing\\EntityIndexer` and register it tagged `shopware.entity_indexer`, implementing: `getName(): string` (a unique indexer name \u2014 `EntityIndexerRegistry` uses it to route messages, so it must be unique), `iterate($offset): ?EntityIndexingMessage` (full reindex, using `IteratorFactory::createIterator($definition, $offset)` to page through IDs, triggered by `bin/console dal:refresh:index` or an Administration index rebuild), `update(EntityWrittenContainerEvent $event): ?EntityIndexingMessage` (reacts to DAL writes, extracting changed primary keys via `$event->getPrimaryKeys(SomeDefinition::ENTITY_NAME)`), and `handle(EntityIndexingMessage $message): void` (does the actual work). By default messages from `update()` are handled synchronously; pass `$forceQueue = true` to `EntityIndexingMessage`'s fourth constructor argument to process them asynchronously over the message queue instead. To manipulate data with the DAL inside `handle()` without re-triggering the indexer, disable indexing on the context via `$context->addState(EntityIndexerRegistry::DISABLE_INDEXING);`. To trigger a full reindex, run `bin/console dal:refresh:index`. Gotchas: writing data through the DAL inside `handle()` re-triggers `EntityWrittenContainerEvent`, which can cause the same indexer to loop infinitely \u2014 use the injected `Connection` directly instead, or disable indexing via `EntityIndexerRegistry::DISABLE_INDEXING` if the DAL must be used; and filter entities/columns as much as possible in `update()` (e.g. only react to a changed firstname) for performance.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-indexer.md:1-66"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-indexer.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-11": {"query": "On Shopware 6.7, which file do I declare my plugin's services in, and how do I get a core service passed into my service's constructor?", "category": "dev", "option": "fs-wiki", "answer": "In Shopware 6.7 plugins, services are declared in `services.php` (the Symfony PHP-DSL config file). To get a core service passed into your service's constructor: if `autowire` and `autoconfigure` are already enabled in `services.php`, just add the dependency as a typed constructor parameter (e.g. `private SystemConfigService $systemConfigService`) and it is injected automatically. If the service is declared explicitly instead, add the dependency as an argument using the `service()` function, e.g. `$services->set(ExampleService::class)->args([service(SystemConfigService::class)]);`, using `Symfony\\Component\\DependencyInjection\\Loader\\Configurator\\service`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md:17-57"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rn \"services.xml\\|dependency injection\\|di container\" platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-12": {"query": "I am on Shopware 6.6 \u2014 which file do I declare my plugin's service dependencies in, and how do I pass another service into the constructor?", "category": "dev", "option": "fs-wiki", "answer": "In Shopware 6.6 plugins, service dependencies are declared in `<plugin root>/src/Resources/config/services.xml` (an XML file using the `http://symfony.com/schema/dic/services/services-1.0.xsd` schema). To pass another service into a constructor, add an `<argument type=\"service\" id=\"...\"/>` element inside the `<service>` definition referencing the target service's fully-qualified id (e.g. `Shopware\\Core\\System\\SystemConfig\\SystemConfigService`), then add a matching typed constructor parameter in the PHP class and store it on a property, e.g. `public function __construct(SystemConfigService $systemConfigService)`.", "citations": ["platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/dependency-injection.md:14-55"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"dependency-injection\\|services.xml\\|services.php\" platform/dev/6.6/index.md"}, {"tool": "Read", "args": "platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/dependency-injection.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-13": {"query": "There is no event for what I need to change in a core Shopware service \u2014 how do I decorate or replace that service from my plugin?", "category": "dev", "option": "fs-wiki", "answer": "Decoration is the mechanism for changing an existing service's behavior when no event covers it (events are for reacting to something Shopware already does; decoration is for changing how a service itself behaves). Decoratable Shopware services expose an abstract class as their contract, with a `getDecorated()` method returning the abstract type \u2014 the base implementation's `getDecorated()` throws `Shopware\\Core\\Framework\\Plugin\\Exception\\DecorationPatternException` since there is no decorator yet. In `services.php`, register both the original and the decorator, pointing the decorator at the original with `decorate()` and passing the original instance through `.inner`: `$services->set(ExampleServiceDecorator::class)->decorate(ExampleService::class)->args([service('.inner')]);`. The decorator implements the abstract contract, its `getDecorated()` returns the wrapped instance, and its methods should delegate to the inner service (e.g. `$this->decoratedService->doSomething() . ' Did something additionally.'`) unless deliberately replacing behavior. Always type-hint the abstract class (never the concrete implementation) in constructors, since type-hinting the concrete class removes the service from the decoration chain; use `bin/console debug:container --show-arguments <service-id>` to inspect the chain. Decorators nest \u2014 if plugin A decorates a core service and plugin B decorates the same service, B wraps A wraps core, and a decorator that doesn't delegate to the inner service silently breaks the rest of the chain with no runtime warning.", "citations": ["platform/dev/6.7/guides/plugins/plugins/services/adjusting-service.md:20-75"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/_index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/services/adjusting-service.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-14": {"query": "I wrote a subscriber class in my plugin but it never fires \u2014 which interface and which service tag (`shopware.event_subscriber`?) register it?", "category": "dev", "option": "fs-wiki", "answer": "The class must implement Symfony's `EventSubscriberInterface` (`Symfony\\Component\\EventDispatcher\\EventSubscriberInterface`) with a static `getSubscribedEvents()` method mapping event names to handler methods. The correct service tag is `kernel.event_subscriber` \u2014 not `shopware.event_subscriber` (that tag does not exist per this documentation). It must be registered in `src/Resources/config/services.php`, e.g. `$services->set(MySubscriber::class)->tag('kernel.event_subscriber');`. Creating the subscriber class alone is not enough: if it is missing from `services.php` (or missing the tag), Shopware will not call it, and there may be no obvious error indicating the event went unhandled.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/event/listening-to-events.md:17-63"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/event/listening-to-events.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-15": {"query": "How do I work out which event Shopware actually dispatches for a given action, for example after a product is loaded or a page is rendered?", "category": "dev", "option": "fs-wiki", "answer": "Several techniques exist depending on the kind of event: DAL events are named `entity_name.event` (e.g. `product.written`, `product.deleted`), and some entities have a constants class such as `ProductEvents` (findable by searching for the term `@Event`) \u2014 e.g. `ProductEvents::PRODUCT_LOADED_EVENT`. For general PHP events, read core code for `$this->eventDispatcher->dispatch($someEvent, $someEvent->getName())` calls, or check a service's constructor for `EventDispatcherInterface`; useful search terms are `extends NestedEvent`, `extends Event`, `implements ShopwareEvent`, `->dispatch`. Page-loaded events: `GenericPageLoader` dispatches a `GenericPageLoadedEvent` on page load \u2014 search for `PageLoadedEvent`. Criteria-based loads may fire a `CriteriaEvent` (e.g. `ProductListingCriteriaEvent`), but these are hand-written, not guaranteed for every entity. Route-level events are fine-grained aliases of Symfony kernel events: `{route}.request`, `{route}.response`, `{route}.render` (Storefront, before Twig), `{route}.encode` (Store-API, before JSON encoding, since 6.6.11.0) and `{route}.controller` (since 6.6.11.0), using the Symfony route name in place of `{route}`. Business/ecommerce actions fire events implementing `BusinessEventInterface` or `MailActionInterface`. The most direct way to see everything actually fired during a request is the Symfony profiler's 'Events' tab, which lists every event name fired for that request.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/event/finding-events.md:20-49"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"debug:event\" platform/dev/6.7/index.md (and commands-reference.md)"}, {"tool": "Read", "args": "platform/dev/6.7/resources/references/core-reference/commands-reference.md"}, {"tool": "Bash", "args": "grep -n \"toolbox|find.*event\" platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/event/finding-events.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-16": {"query": "How do I run plugin logic whenever an order is written, and find out exactly which fields changed?", "category": "dev", "option": "fs-wiki", "answer": "Implement `Symfony\\Component\\EventDispatcher\\EventSubscriberInterface` and subscribe to `Shopware\\Core\\Checkout\\Order\\OrderEvents::ORDER_WRITTEN_EVENT`; check `$event->getContext()->getVersionId() !== Defaults::LIVE_VERSION` to only react to the live version (note: editing an order in the admin creates a new draft version merged later into the live version, so that intermediate write is usually not the state you want). A changeset of exactly which fields changed is not generated by default for performance reasons \u2014 to force one, also subscribe to `PreWriteValidationEvent::class`, and inside that listener, for each `$event->getCommands()` that is `instanceof ChangeSetAware` and whose `getEntityName() === OrderDefinition::ENTITY_NAME`, call `$command->requestChangeSet()`. Then, in the `ORDER_WRITTEN_EVENT` handler, read the changeset via `$result->getChangeSet()` on each item of `$event->getWriteResults()`. An 'insert' command cannot generate a changeset since nothing changed yet, and changeset generation should be narrowed to the entity and live version needed since it affects performance.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/order/listen-to-order-changes.md:16-52"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"order.written|EntityWrittenEvent|written event|changed fields|payload|updatedFields\" platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/order/listen-to-order-changes.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-17": {"query": "How do I overwrite the price of a product line item in the cart at runtime from a plugin?", "category": "dev", "option": "fs-wiki", "answer": "Use one class that acts as both a cart collector and a cart processor (this technique is only for changing an existing line item's own price, e.g. a live-shopping plugin \u2014 not for discounts/surcharges, which should be modeled as separate line items instead). In `CartDataCollectorInterface::collect`, fetch product IDs from the cart via `$original->getLineItems()->filterType(LineItem::PRODUCT_LINE_ITEM_TYPE)->getReferenceIds()`, skip IDs already fetched, and store each new price in `CartDataCollection` under a prefixed key (e.g. `'price-overwrite-'.$id`). In `CartProcessorInterface::process` on the same class, for each product line item in `$toCalculate`, read the stored price from `CartDataCollection`, build a `QuantityPriceDefinition` from the new price plus the item's existing tax rules and quantity, calculate it via an injected `QuantityPriceCalculator`, then call `$product->setPrice($calculated)` and `$product->setPriceDefinition($definition)`. Register the combined class under both tags \u2014 `shopware.cart.processor` and `shopware.cart.collector` \u2014 with a priority ordering it after the product collector/processor (e.g. priority 4500). Always compute prices in the collector, never query data inside `process` (it may run repeatedly), and always mutate `$toCalculate`, not `$original`, in `process`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md:17-48"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"cart processor|price.*line item|CartProcessor|LineItem.*price|setPriceDefinition|CalculatedPrice\" platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-18": {"query": "My plugin's cart processor adds a surcharge line item, but it is added again on every recalculation and its price is stale after the customer changes the quantity \u2014 how do I split the work between the collector and the processor?", "category": "dev", "option": "fs-wiki", "answer": "The corpus describes the intended split as: use `CartDataCollector` (implementing `CartDataCollectorInterface::collect`) to load external data once \u2014 e.g. querying the database or an API for whatever determines the surcharge \u2014 and `CartProcessor` (implementing `CartProcessorInterface::process`) to apply/recompute the actual change to the cart every time, always working against `$toCalculate` (never `$original`, since `$toCalculate` is the cart instance actually used going forward). `CartDataCollectorInterface::collect()` must check whether its data was already loaded before appending it to `CartDataCollection`, to avoid unnecessary duplicate database queries \u2014 this is the documented mechanism for avoiding redundant work across the multiple recalculation passes Shopware runs per request. Price should always be recalculated via the appropriate `PriceCalculator` class (e.g. `PercentagePriceCalculator` for a percentage surcharge) inside `process()`, using current cart data such as `$products->getPrices()`/quantities from `$toCalculate`, rather than a value computed once and cached \u2014 that recalculation is exactly what keeps the surcharge price current after a quantity change. Cart discount/surcharge line items should also be marked `setStackable(false)` / `setRemovable(false)`, and the `PercentagePriceDefinition` (or equivalent) must be attached to the line item so the cart can recalculate it consistently. `CartProcessorInterface::process()` must never perform database queries itself, since it runs multiple times per request \u2014 all data fetching belongs in the collector. The corpus's own discount example does not show explicit duplicate-line-item-guard logic for the processor side (e.g. checking whether the surcharge item already exists in `$toCalculate` before re-adding it) beyond the general 'check whether already loaded' rule for the collector, so if the duplication persists after implementing this split, that specific guard against re-adding an already-present line item in `process()` is not detailed in the wiki content found and would need to be handled explicitly in the plugin's own logic. [from memory]", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md:16-44", "platform/dev/6.7/guides/plugins/plugins/architecture/cart-process.md:14-40", "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-discounts.md:15-54"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-discounts.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/architecture/cart-process.md"}, {"tool": "Bash", "args": "grep -rn \"already exists|remove.*line item|has(|surcharge\" platform/dev/6.7/guides/plugins/plugins/checkout/cart/*.md"}], "notFoundClaim": false, "memoryClaims": ["The corpus's own discount example does not show explicit duplicate-line-item-guard logic for the processor side (e.g. checking whether the surcharge item already exists in `$toCalculate` before re-adding it) beyond the general 'check whether already loaded' rule for the collector, so if the duplication persists after implementing this split, that specific guard against re-adding an already-present line item in `process()` is not detailed in the wiki content found and would need to be handled explicitly in the plugin's own logic."], "sourceVerdict": "partial"}, "dev-19": {"query": "I need to move long-running work in my plugin out of the request into the message queue \u2014 what does the handler class look like and how is it registered?", "category": "dev", "option": "fs-wiki", "answer": "First define a message class implementing `Shopware\\Core\\Framework\\MessageQueue\\AsyncMessageInterface` (or `LowPriorityMessageInterface` for lower-priority async handling), e.g. `class SmsNotification implements AsyncMessageInterface { public function __construct(private string $content) {} ... }`, and dispatch it via an injected `Symfony\\Component\\Messenger\\MessageBusInterface` (bus id `messenger.default_bus`), e.g. `$this->bus->dispatch(new SmsNotification($message));`. The handler class (e.g. placed at `<plugin root>/src/MessageQueue/Handler/SmsHandler.php`) is marked with the PHP attribute `#[AsMessageHandler]` and implements `__invoke(SmsNotification $message)` to process the message; multiple handlers can exist for the same message. Handlers registered this way are automatically tagged with `messenger.message_handler` \u2014 no manual `services.php` tagging is required beyond normal service registration. Optionally, dispatch a `Symfony\\Component\\Messenger\\Envelope` with stamps such as `DelayStamp` for metadata like a delay, and route specific message classes to a `low_priority` queue via `shopware.messenger.routing_overwrite` config instead of implementing an interface (the `low_priority` queue and `LowPriorityMessageInterface` require Shopware 6.5.7.0 or above).", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-handler.md:15-42", "platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md:20-84"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"message queue|MessageHandler|AsMessageHandler|messenger.message_handler|HandledMessage\" platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-handler.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-20": {"query": "How do I add my own condition to the Rule Builder from a plugin so shop owners can select it?", "category": "dev", "option": "fs-wiki", "answer": "Create a PHP rule class (e.g. under `<plugin root>/src/Core/Rule`) extending `Shopware\\Core\\Framework\\Rule\\Rule`, implementing `getName()` (a unique technical name), `match(RuleScope $scope): bool`, and `getConstraints(): array` (field => constraints); rule variables must be declared `protected`, not `private`, or they won't work correctly. Register the class in `services.php` tagged `shopware.rule.definition`. To skip building a custom Administration component, optionally add `getConfig(): RuleConfig` returning e.g. `(new RuleConfig())->booleanField('isFirstMondayOfTheMonth')`, which makes Shopware render the generic `sw-condition-generic` component. To show the condition in the Administration, decorate `ruleConditionDataProviderService` (the `RuleConditionService`) and call `addCondition()`, naming the condition to match `getName()` and pointing it at an Administration component (e.g. `swag-first-monday`) with a `label`, `scopes`, and an optional `group` (create groups via `upsertGroup()`); load this decorator from a `main.js` entry point under `<plugin root>/src/Resources/app/administration/src/`. Build the component by extending `sw-condition-base` and override the `sw_condition_value_content` Twig block with the input control (e.g. `sw-single-select`). Since 6.5.0.0, context awareness can restrict where a rule containing the condition may be assigned: read possible relations from `Shopware\\Core\\Content\\Rule\\RuleDefinition`, then call `ruleConditionService.getAwarenessConfigurationByAssignmentName()` and `addAwarenessConfiguration()` with `notEquals`/`equalsAny`/`snippet`, and use `sw-select-rule-create` with a matching `rule-aware-group-key` wherever rules are selected \u2014 otherwise the new condition may not be selectable everywhere (e.g. inside the promotion module). Never run database queries or other time-consuming operations inside `match()`, since it directly impacts store performance.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/rule/add-custom-rules.md:20-65"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"rule builder|Rule Builder|custom rule|RuleScope|add.*rule|AbstractRule\" platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/rule/add-custom-rules.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-21": {"query": "My plugin dispatches its own domain event \u2014 how do I make it show up as a trigger in the Flow Builder?", "category": "dev", "option": "fs-wiki", "answer": "Implement one of the Aware interfaces (e.g. Shopware\\Core\\Framework\\Event\\CustomerAware) plus Shopware\\Core\\Framework\\Event\\FlowEventAware on the event class. Since Shopware 6.5.0.0, event data for Flow Builder is read from a StorableFlow rather than getAvailableData(); each Aware interface has a matching FlowStorer that copies data into the store (e.g. CustomerAware -> Shopware\\Core\\Content\\Flow\\Dispatching\\Storer\\CustomerStorer, MailAware -> MailStorer, OrderAware -> OrderStorer, UserAware -> UserStorer). If the data has no existing Aware interface, define a new Aware interface and a FlowStorer subclass implementing store() and restore(). Flow actions then read the data via $flow->getStore($key) or $flow->getData($key). Finally, register the event as a Flow Builder trigger with a subscriber on BusinessEventCollectorEvent::NAME, calling $businessEventCollector->define(ExampleEvent::class) and adding it to the collection, giving the subscriber a high priority (e.g. 1000) so it registers before other trigger subscribers. Custom flow triggers are available starting with Shopware 6.4.6.0; the StorableFlow/FlowStorer model replaces getAvailableData() from 6.5.0.0 onward.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md:20-68"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rli \"flow\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | grep -i event"}, {"tool": "Bash", "args": "grep -rli \"FlowEventAware\\|flow-builder\\|add-flow\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-22": {"query": "How do I give my plugin a settings page the shop operator can fill in, and what field types are available?", "category": "dev", "option": "fs-wiki", "answer": "Create src/Resources/config/config.xml in the plugin; it is rendered dynamically as an Administration configuration page under Extensions -> My extensions -> Plugins -> Configure, with no custom Administration module needed. The file needs at least one <card> with a <title> and at least one <input-field>, each with a unique <name> (>=4 chars, matching [a-zA-Z][a-zA-Z0-9]*). Field type defaults to text; supported types are text, textarea, text-editor, url, password, int, float, bool, checkbox, datetime, date, time, colorpicker, single-select, multi-select, plus common settings like label/placeholder/helpText, defaultValue, disabled, required, copyable, minLength/maxLength, min/max, and <options> for select types. For advanced UI you can use <component name=\"componentName\"> to embed Administration components directly: sw-entity-single-select, sw-entity-multi-id-select, sw-media-field, sw-text-editor, and sw-snippet-field (which edits snippet translations rather than a system config value, available since 6.3.4.0). Since Shopware 6.7.12.0, mark a field cache-relevant=\"true\" if its value affects cached Storefront output; from 6.8.0.0 onward system config writes no longer invalidate caches by default so this attribute is required to trigger cache invalidation for such fields.", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md:18-80"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"plugin config\\|system config\\|settings page\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-23": {"query": "How do I ship a mail template with my plugin so it is installed automatically, including a custom mail template type?", "category": "dev", "option": "fs-wiki", "answer": "Ship the mail template via a database migration (a Shopware\\Core\\Framework\\Migration\\MigrationStep subclass) rather than creating it through the Administration, so it installs automatically with the plugin. To reuse an existing mail template type, look up its id with SELECT id FROM mail_template_type WHERE technical_name = \"contact_form\", then insert a row into mail_template (id, mail_template_type_id, system_default must be 0, created_at) and a row per supported language into mail_template_translation (mail_template_id, language_id, sender_name, subject, description, content_html, content_plain, created_at), resolving each language_id from the language/locale tables; use INSERT IGNORE INTO so re-running the migration on reinstall doesn't throw. To define a brand-new mail template type, first insert into mail_template_type (id, technical_name, available_entities as a JSON map like {\"product\": \"product\"}, created_at) and mail_template_type_translation (mail_template_type_id, language_id, name, created_at), then create the mail_template entry as above. Do not remove mail templates on plugin uninstall, since other entities may still reference them.", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/mail/add-mail-template.md:17-47"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"mail template\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/content/mail/add-mail-template.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-24": {"query": "How do I get readable SEO URLs generated for the detail pages of my plugin's own entity?", "category": "dev", "option": "fs-wiki", "answer": "For a custom DAL entity, implement Shopware\\Core\\Content\\Seo\\SeoUrlRoute\\SeoUrlRouteInterface with three methods: getConfig() (returns a SeoUrlRouteConfig with the entity definition, route name, and template), prepareCriteria() (narrow/extend the fetch criteria), and getMapping() (returns a SeoUrlMapping with the template variables); getMapping() must verify the entity type it receives since the method can be invoked for other entities too. Register the class with the container tag shopware.seo_url.route. Add a seo_url_template table entry via a plugin migration, setting route_name, entity_name, and template. Then subscribe to the entity's written DAL event and call Shopware\\Core\\Content\\Seo\\SeoUrlUpdater::update($routeName, $ids) to generate the URLs, doing the same on the .deleted event. (For a fixed, rarely-changing route instead, you can seed a static seo_url row per sales channel/language via a migration using ImportTranslationsTrait::importTranslation(), setting route_name, path_info, seo_path_info, is_canonical, is_modified, is_deleted.) Note a German SEO URL is only reachable if a German domain is configured on the respective sales channel, and marking a seo_url entry deleted only sets is_deleted=1 without removing the route, so the controller still needs to check whether the underlying content exists.", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/seo/add-custom-seo-url.md:19-73"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"seo url\\|seo-url\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/content/seo/add-custom-seo-url.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-25": {"query": "How do I add a `bin/console` command to my plugin for a maintenance task?", "category": "dev", "option": "fs-wiki", "answer": "Follow the standard Symfony approach: write a command class (e.g. Swag\\BasicExample\\Command\\ExampleCommand) extending Symfony\\Component\\Console\\Command\\Command, annotated with the #[AsCommand(name: 'swag:example', description: 'Example command')] attribute, implementing execute(InputInterface $input, OutputInterface $output): int and returning Command::SUCCESS. Register it as a service in src/Resources/config/services.php tagged console.command, e.g. $services->set(Swag\\BasicExample\\Command\\ExampleCommand::class)->tag('console.command'). Commands registered this way become automatically available via bin/console.", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md:17-55"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"console command\\|bin/console\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*command*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-26": {"query": "How do I add a custom document type such as a pro-forma invoice in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Shopware 6.7 has two document systems. The default is still the legacy document system (deprecated, removed in 6.9): add a plugin migration inserting a row into document_type (with a technical_name), translations into document_type_translation via Shopware\\Core\\Migration\\Traits\\ImportTranslationsTrait/Translations, and a default config into document_base_config plus document_base_config_sales_channel. Create a renderer implementing Shopware\\Core\\Checkout\\Document\\Renderer\\AbstractDocumentRenderer with getDecorated(), supports(): string (returning the type's technical name), and render(array $operations, Context $context, DocumentRendererConfig $rendererConfig): RendererResult, using DocumentFileRendererRegistry to render the actual PDF/HTML content; register it with the service tag document.renderer. Add a Twig template at src/Resources/views/documents/<name>.html.twig extending the base template with {% sw_extends '@Framework/documents/base.html.twig' %}. Finally add a number range via migration (rows in number_range_type, number_range, number_range_sales_channel, plus translations). Every document type needs a matching renderer or it will show in the Administration but not work, and it needs a number range or no document number can be generated. Alternatively, since 6.7 there is an experimental Document System (v2), gated by the DOCUMENT_GENERATION_REWORK feature flag and expected to become the default in 6.8: extend Shopware\\Core\\Checkout\\DocumentV2\\Type\\AbstractDocumentType (getTechnicalName(), getSupportedFormats() e.g. ['html','pdf']), create a render-data DTO extending AbstractRenderData, create a data provider extending AbstractDocumentDataProvider (getKey(), supports(), enrichOrderCriteria(), provideRenderingData()), register both with tags shopware.document_v2.type and shopware.document_v2.provider, add a Twig template at @Framework/documents/<technical_name>.html.twig (plus a zugferd XML template if that format is supported), and still create the document_type database row and number range via a migration reusing the legacy pattern.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/documents/legacy/add-custom-document-type.md:18-56", "platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md:14-53"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -ipath \"*document*\" | head -30"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/_index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/documents/legacy/add-custom-document-type.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-27": {"query": "In Shopware 6.7, how do I extend a Storefront Twig template from my plugin with `{% extends %}` so I keep the core markup and other plugins' changes?", "category": "dev", "option": "fs-wiki", "answer": "You should not use plain Twig {% extends %}; Shopware requires the custom sw_extends tag, which supports multi-inheritance so multiple plugins' overrides of the same template stack instead of clobbering each other. Shopware looks for plugin templates under <plugin root>/src/Resources/views by default. Find the core template to override, e.g. storefront/layout/header/logo.html.twig, and recreate the identical path under the plugin's views directory: <plugin root>/src/Resources/views/storefront/layout/header/logo.html.twig. In that new file, extend the original with {% sw_extends '@Storefront/storefront/layout/header/logo.html.twig' %} and override the desired block, e.g. {% block layout_header_logo_link %}...{% endblock %}. Use {{ parent() }} inside the override to append to, rather than replace, the original block content. After changes, clear the cache with ./bin/console cache:clear, and make sure the plugin is active and, if it has a theme, that the theme is assigned to the sales channel. Use {{ dump() }} inside a template to discover the available Twig variables on a page. Since Shopware 6.7.11.0, a separate Storefront Components system is also available for building reusable, atomic template components.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-templates.md:19-56"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"sw_extends\\|{% extends\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront | head -20"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-templates.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-28": {"query": "How do I override an existing Storefront JavaScript plugin, such as the cookie permission bar, from my own plugin instead of registering a new one?", "category": "dev", "option": "fs-wiki", "answer": "Extend the original plugin's vanilla JS class directly if it can be imported, e.g. `import CookiePermissionPlugin from 'src/plugin/cookie/cookie-permission.plugin'; export default class MyCookiePermission extends CookiePermissionPlugin {}`. If it cannot be imported (e.g. a third-party plugin without an alias), retrieve the class at runtime via `const Plugin = window.PluginManager.getPlugin('CookiePermission'); const PluginClass = Plugin.get('class')`. Override the methods you need, e.g. init() (calling super.init() afterward) and _hideCookieBar() to add a confirm dialog before calling super._hideCookieBar(). Register the override in main.js with PluginManager.override() instead of PluginManager.register(), e.g. `PluginManager.override('CookiePermission', MyCookiePermission, '[data-cookie-permission]')`. If the original plugin was registered asynchronously, the override's import must also be a dynamic import: `PluginManager.override('CookiePermission', () => import('./my-cookie-permission/my-cookie-permission.plugin'), '[data-cookie-permission]')`. Each JavaScript plugin can only be overridden once - if two Shopware plugins override the same plugin, only the last override actually takes effect.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md:17-84"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"override.*plugin\\|storefront plugin\\|cookie permission\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront | head -20"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-29": {"query": "How do I add my own data to an existing Storefront page or pagelet from a plugin without overriding the core controller?", "category": "dev", "option": "fs-wiki", "answer": "Subscribe to the page/pagelet's ...LoadedEvent (e.g. Shopware\\Storefront\\Pagelet\\Footer\\FooterPageletLoadedEvent) via an event subscriber tagged kernel.event_subscriber. If an existing Store API route would return more data than needed, add a new, tailored Store API route instead of reusing a broader one - do not call the DAL directly from the subscriber. In the subscriber, call the route and attach the result to the page/pagelet with $event->getPagelet()->addExtension('product_count', $response->getProductCount()) (or $event->getPage()->addExtension(...) for a page). Example: `class AddDataToPage implements EventSubscriberInterface { public static function getSubscribedEvents(): array { return [FooterPageletLoadedEvent::class => 'addActiveProductCount']; } public function addActiveProductCount(FooterPageletLoadedEvent $event): void { $response = $this->productCountRoute->load(new Criteria(), $event->getSalesChannelContext()); $event->getPagelet()->addExtension('product_count', $response->getProductCount()); } }`. The added data becomes available in the Twig template under extensions, e.g. `{{ footer.extensions.product_count.count }}`. The example route in the wiki uses EntityRepository::aggregate() with CountAggregation and an EqualsFilter('product.active', true), rather than search(), since only an aggregate count is needed.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md:19-71"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"override.*plugin\\|storefront plugin\\|cookie permission\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront | head -20"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-30": {"query": "How do I add a custom filter to the Storefront product listing from my plugin, both the criteria side and the filter panel?", "category": "dev", "option": "fs-wiki", "answer": "On the criteria/backend side, subscribe to \\Shopware\\Core\\Content\\Product\\Events\\ProductListingCollectFilterEvent and add a Filter instance built from: name (unique filter name), filtered (true if currently active), aggregations (aggregations behind the filter), filter (the DAL filter added to the criteria), values (values added as currentFilter to the result), and exclude (exclusion configuration). Example: `$filter = new Filter('isCloseout', (bool) $event->getRequest()->get('isCloseout'), [new FilterAggregation('active-filter', new MaxAggregation('active', 'product.isCloseout'), [new EqualsFilter('product.isCloseout', true)])], new EqualsFilter('product.isCloseout', true), $filtered); $event->getFilters()->add($filter);`. On the UI side, extend src/Storefront/Resources/views/storefront/component/listing/filter-panel.html.twig and its component_filter_panel_items block (available since Shopware 6.4.8.0), calling {{ parent() }} then including one of the filter components via sw_include, e.g. filter-boolean.html.twig with name and displayName parameters. Available filter components are filter-boolean, filter-multi-select, filter-property-select, filter-range, and filter-rating-select. To position the new filter relative to a specific existing one, extend that filter's own block instead (e.g. component_filter_panel_item_price).", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/howto/add-listing-filters.md:16-74"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"product listing.*filter\\|listing filter\\|criteria.*filter\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront | head -20"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/howto/add-listing-filters.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-31": {"query": "How do I expose a plugin configuration value, such as a colour picked in the Administration, as an SCSS variable in my Storefront styling?", "category": "dev", "option": "fs-wiki", "answer": "Provide a fallback default in your plugin's base.scss, e.g. `$sass-plugin-header-bg-color: #ffcc00 !default;`. Then create an event subscriber for `ThemeCompilerEnrichScssVariablesEvent`, register it as a `kernel.event_subscriber` tagged service, and in the listener call `$event->addVariable('sass-plugin-header-bg-color', $value)` \u2014 the leading `$` is added automatically and kebab-case names are recommended; an optional third `$sanitize` argument strips special characters and quotes the value. To source the value from the Administration-configured plugin config (e.g. a colour picker field) per sales channel, inject `SystemConfigService` and read it with `$this->systemConfig->get('SwagBasicExample.config.sassPluginHeaderBgColor', $event->getSalesChannelId())`, then pass that into `addVariable()`. To expose every config field at once, loop over `$this->systemConfig->get('SwagBasicExample.config', $event->getSalesChannelId())` and convert each key name with `CamelCaseToSnakeCaseNameConverter` before calling `addVariable()`. Note that plugins are not sales-channel specific by default, so variables added this way (as opposed to via config.xml) are compiled globally across all themes/sales channels unless you deliberately branch on `getSalesChannelId()`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md:1-64"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"scss\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | grep -i config"}, {"tool": "Bash", "args": "grep -rln \"plugin config\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i; find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*plugin-config*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-32": {"query": "How do I define a custom field set for products from my plugin so merchants can edit the values in the Administration?", "category": "dev", "option": "fs-wiki", "answer": "Product already has the DAL custom_fields JSON column, so from a plugin you attach a custom field set to it either declaratively or imperatively. Declaratively (Shopware 6.7.13.0+), ship a `Resources/config/custom-fields.xml` file in your plugin; Shopware syncs the defined sets on plugin install/update and removes them (without deleting stored data) on uninstall \u2014 no extra installer service is needed, and the XML format matches the one used in app manifests. Imperatively, use the `custom_field_set.repository` service, e.g. `$this->customFieldSetRepository->create([['name' => 'swag_example_set', 'global' => true, 'config' => ['label' => [...]], 'customFields' => [['name' => 'swag_example_size', 'type' => CustomFieldTypes::INT, 'includeInSearch' => true, 'config' => ['label' => [...], 'customFieldPosition' => 1]]]]], $context);`. Set `global` to `false` so the set/fields become editable and deletable by the merchant in the Administration; set `includeInSearch` to `true` if the field should be searchable (requires a search index rebuild if toggled on an existing field). Field and set names should carry a vendor prefix (e.g. `swag_`) since they are globally unique across the shop. To remove a set, delete it via the repository and also clean up the leftover values stored in each entity's `customFields` JSON column (e.g. via a batched SQL update using `JSON_REMOVE`).", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/custom-field/add-custom-field.md:1-91"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*custom-field*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/custom-field/add-custom-field.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-33": {"query": "How do I register a custom Administration module from my plugin, and what has to line up for it to actually show up after a build?", "category": "dev", "option": "fs-wiki", "answer": "Create `<plugin root>/src/Resources/app/administration/src/module/<module-name>/index.js` and import it from `main.js` (e.g. `import './module/swag-example';`). In that index.js, call `Shopware.Module.register('swag-example', { type: 'plugin', name: 'Example', title: '...', description: '...', color: '#ff3d58', icon: 'regular-shopping-bag', ... })`, setting a unique `name`, `color`, `icon`, `title`, `description`, and `type` (`plugin` for third-party modules; `type` is a convention rather than an enforced validation). Add `routes` and a menu entry (via the module's `navigation` config or a separate add-menu-entry step), and add translation `snippets` per locale (typically `de-DE.json`/`en-GB.json` under a `snippet/` directory), each keyed under the module name. Optionally add a `settingsItem` entry (`group`: `shop`, `system`, or `plugins`; `icon`; `to`: the route name) to link the module into Settings. Finally build the Administration JS with `shopware-cli project admin-build` (or `composer run build:js:admin` for the platform contribution setup) \u2014 the module only appears after this build. For it to actually show up: the plugin must be active for the build to apply, the built assets must ship with the plugin, an `index.js` is required for every module (Shopware auto-requires it), and the module still depends on the entry-point import, registration call, routes/components, and snippets all being wired up correctly at runtime \u2014 the build step alone only compiles assets, it does not fix a missing import or misregistration.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/add-custom-module.md:1-78"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration -iname \"*module*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/add-custom-module.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-34": {"query": "How do I extend an existing Administration component and its Twig blocks from my plugin, for example to change the dashboard headline?", "category": "dev", "option": "fs-wiki", "answer": "Use `Shopware.Component.override('component-name', { template })` to replace an existing component's behavior in place (e.g. override `sw-dashboard-index`'s template), or `Shopware.Component.extend('new-name', 'base-name', { template })` to create a new component based on an existing one. Provide a new Twig template file (imported as `template` and passed in the config) that overrides specific blocks of the original \u2014 e.g. `{% block card_header %}<h1 class=\"custom-header\">{{ header }}<\/h1>{% endblock %}` to replace a block entirely, or use `{% parent %}` inside the block to keep the inherited markup and append/prepend to it, e.g. `{% block card_content %}{% parent %}<div class=\"card-custom-content\">...<\/div>{% endblock %}`. To extend a method or computed property while keeping the original logic, call `this.$super('methodName')` inside the override. Register the override/extension file by importing it from the plugin's Administration `main.js`. There is also an experimental Composition API extension system (`Shopware.Component.createExtendableSetup` / `Shopware.Component.overrideComponentSetup()`), but it only supports overriding (not extending) components already written with the Composition API, has no committed release timeline, and Options API components should keep using the `Component.factory` override/extend approach. Note that multiple plugins overriding the same component are applied in registration order.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-components.md:1-74"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration -iname \"*component*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-components.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-35": {"query": "How do I load entities from the Admin API inside an Administration component using the repository factory and a Criteria?", "category": "dev", "option": "fs-wiki", "answer": "Inject the factory into your component via `inject: ['repositoryFactory']`, then create a repository for the entity you need, e.g. `this.repositoryFactory.create('product')` (a third argument accepts `{ version: 1 }`). Build a `Criteria` object for filtering, sorting, and pagination, and pass it together with `Shopware.Context.api` to `productRepository.search(criteria, Shopware.Context.api)` to fetch a collection, or use `productRepository.get(entityId, Shopware.Context.api)` to fetch a single entity by id. A typical Criteria looks like: `criteria.setPage(1); criteria.setLimit(10); criteria.setTerm('foo'); criteria.setTotalCountMode(2); criteria.addFilter(Criteria.equals('product.active', true)); criteria.addSorting(Criteria.sort('product.name', 'DESC')); criteria.addAggregation(Criteria.avg('average_price', 'product.price'));` \u2014 `setTotalCountMode` accepts `0` (no total count, fastest), `1` (exact total count), or `2` (`limit * 5 + 1`, a fast 'next page exists' check). To load associations, call `criteria.addAssociation('manufacturer')` before searching. Other repository methods available are `save(entity, Shopware.Context.api)` for create/update (only changed properties are sent, and saving is never automatic \u2014 you must call it explicitly) and `delete(id, Shopware.Context.api)` (bulk via `syncDeleted` with an array of ids). Note that entities are stateless: after `save()`, related data must be re-fetched from the server if you need it, and for a not-yet-saved entity, associations can't be sent to the server directly \u2014 they're kept locally and sent together when the parent is saved.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md:1-59"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"repositoryFactory\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration -i"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/administration/services-utilities/making-api-requests.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-36": {"query": "How do I register ACL privileges for my plugin's Administration module and check them in a component or template?", "category": "dev", "option": "fs-wiki", "answer": "Admin privileges are identifiers made of a `key` and a `role` joined by a dot (e.g. `product.viewer`). Register one with the privileges service's `addPrivilegeMappingEntry`, conventionally from `<component>/acl/index.js` imported by `<component>/index.js`: `Shopware.Service('privileges').addPrivilegeMappingEntry({ category: 'permissions', parent: null, key: 'your_key', roles: { viewer: { privileges: ['entity_name:operation'], dependencies: [] }, editor: {...}, creator: {...}, deleter: {...} } });` \u2014 use `category: 'permissions'` for normal CRUD-style roles (`viewer`/`editor`/`creator`/`deleter`) or `'additional_permissions'` for a custom non-CRUD role key. You can reuse another mapping's privileges with `Shopware.Service('privileges').getPrivileges('rule.viewer')`. Add snippet translations at `sw.privileges.${category}.${key}.label` (and `sw.privileges.${category}.${key}.${role_key}` for `additional_permissions`). Protect a route or menu entry/settings item by adding `meta: { privilege: 'your_key.your_role' }` to its config; protect a shortcut by giving it an object with an `active()` method instead of a plain key binding. To check a privilege in a component or template, inject the `acl` service and call `acl.can('key.rol
