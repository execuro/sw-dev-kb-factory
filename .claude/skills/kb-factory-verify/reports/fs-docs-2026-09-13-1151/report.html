s: ExampleEntityCollection::class)]`. Mark the primary key property with `#[PrimaryKey]` plus a `#[Field(type: FieldType::UUID)]` attribute. Add further properties with the `#[Field(type: FieldType::...)]` attribute (or a fully-qualified custom Field class), use special attributes like `#[AutoIncrement]` and `#[ForeignKey(entity: 'currency')]` for special columns, and `#[OneToOne]`, `#[OneToMany]`, `#[ManyToOne]`, `#[ManyToMany]` for associations. Expose fields to the API by setting `api: true` (or an array of API source classes) on the `Field` attribute. For translatable fields set `translated: true` (properties must then be nullable) and optionally add a `#[Translations]` property to load all translations. Use `#[Required]` to force a validation rule on fields that are otherwise nullable (e.g. translated fields). Custom fields can be added either via the `EntityCustomFieldsTrait` or the `#[CustomFields]` attribute. Finally register the entity by tagging its service definition with `shopware.entity` in `services.php`, e.g. `$services->set(Examples\\ExampleEntity::class)->tag('shopware.entity');`. This automatically creates and registers the `EntityDefinition` and `EntityRepository` (as `example_entity.definition` / `example_entity.repository`) \u2014 no separate EntityTranslationDefinition, EntityCollection, or getter/setter boilerplate is required.","citations":["developer/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md:1-621"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/ ; ls docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"grep -ril \"entities.xml|DAL entity|EntityDefinition\" docs/shopware-knowledge-bases/developer --include=*.md | grep -i attribut"},{"tool":"Read","args":"docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-38":{"query":"How do I write Jest unit tests for my Administration components in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Shopware's Administration uses Jest plus Vue Test Utils. Place test files next to the file under test, named `<file>.spec.js` (or `.spec.ts`). Run `composer run init:js` once to install Administration dependencies, then `composer run admin:unit` to run all tests with coverage, or `composer run admin:unit:watch` during development (note: these PSH commands apply to the Shopware-provided Administration itself; a plugin's own unit tests may need their own scripts). You can scaffold a test file with the recommended boilerplate via `composer run admin:create:test` (paste the component/service path when prompted). Services and isolated ES modules can be imported and tested directly like normal Jest tests. For components, import the component's registration file for its side effect of calling `Shopware.Component.register(...)`, then build and mount it: `shallowMount(Shopware.Component.build('sw-your-component'))` \u2014 `Shopware.Component.build()` resolves twig template inheritance/overrides and returns a real Vue component; prefer `shallowMount()` over `mount()` so child components are stubbed. Provide required `props`, and stub missing child components either via the `stubs` option (e.g. `stubs: { 'sw-select-base': Shopware.Component.build('sw-select-base') }`) or by importing them. You can assert on rendered content, e.g. `wrapper.find('.sw-alert__message').text()`, and set slot content via the `slots` option. The test setup includes many preconfigured mocks: set ACL rights per test with `global.activeAclRoles = ['product.editor']`; set feature flags with `global.activeFeatureFlags = ['FEATURE_NEXT_12345']`; the repository factory works out of the box against a generated entity schema and warns in the console with example code when a route/response needs mock data (add it via `global.repositoryFactoryMock.responses.addResponse({...})`, or disable the warning via `global.repositoryFactoryMock.showWarning = false`); directives and filters are globally registered by default and can be overridden; the global `Shopware` context (e.g. `Shopware.Store`) is prepared automatically; common globals like `$tc`, `$device`, `$store`, `$router` are auto-mocked and can be overridden via the `mocks` option in mount/shallowMount. If a directive fails to resolve (e.g. `v-clipboard`), use `createLocalVue()` and register the directive mock on it, then pass `localVue` to the mount options. If an injection is missing (e.g. `mediaService`), stub it via the `provide` option with the methods the component actually calls (e.g. `mediaService: { renameMedia: () => Promise.resolve() }`), or register a mock service globally with `Shopware.Service.register('mediaService', { ... })` in `beforeAll`.","citations":["developer/guides/development/testing/unit/jest-admin.md:1-599"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/testing/unit/jest-admin.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-65":{"query":"What can I put in the JSON body of `POST /api/search/{entity}` for filtering, associations, sorting, aggregations and getting an exact total count?","category":"dev","option":"fs-docs","answer":"The search criteria JSON body for `POST /api/search/{entity}` supports these top-level parameters: `associations` (load related/nested data, like a SQL join, and can carry nested criteria such as `limit`, `filter`, `sort` for that association), `includes` (restrict returned fields per apiAlias/entity type), `ids` (lookup by a list of IDs), `total-count-mode`, `page` and `limit` (pagination, `page` is 1-indexed), `filter` (filter results and aggregations, same filter types as the DAL), `post-filter` (filters results only, not aggregations \u2014 useful for faceted navigation), `query` (weighted search returning a per-record `_score` in `extensions.search`), `term` (free-text ranking search \u2014 don't combine with `query`), `sort` (one or more `{field, order}` entries; supports `naturalSorting: true` and `type: 'count'` to sort by association count), `aggregations` (compute metrics like avg/terms on the fly), and `grouping` (group results by one or more fields, e.g. one product per manufacturer).\n\nFor an exact total count, set `total-count-mode: 1` in the body \u2014 this determines an exact total (uses `SQL_CALC_FOUND_ROWS`, more performance-intensive), useful when you need to display exact pagination page numbers. `total-count-mode: 0` (the default) determines no total (fastest, use when pagination isn't required), and `total-count-mode: 2` just determines whether a next page exists (good performance, useful for infinite scroll).\n\nExample combining several of these:\n```json\n{\n  \"limit\": 10,\n  \"total-count-mode\": 1,\n  \"associations\": { \"manufacturer\": {}, \"cover\": {} },\n  \"filter\": [ { \"type\": \"equals\", \"field\": \"active\", \"value\": true } ],\n  \"sort\": [ { \"field\": \"name\", \"order\": \"ASC\" } ],\n  \"aggregations\": [ { \"name\": \"average-price\", \"type\": \"avg\", \"field\": \"price\" } ]\n}\n```","citations":["developer/guides/development/integrations-api/search-criteria.md:8-176","developer/guides/development/integrations-api/search-criteria.md:178-256","developer/guides/development/integrations-api/search-criteria.md:301-442"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/search-criteria.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-63":{"query":"I deployed a plugin update to a 6.7 staging shop and my new migration never ran \u2014 which `bin/console` command applies the pending migrations of that one plugin, and what do I have to pass to it?","category":"dev","option":"fs-docs","answer":"Use `bin/console database:migrate <identifier> --all`, e.g. `./bin/console database:migrate SwagBasicExample --all`. The `identifier` (optional) argument decides which migrations run \u2014 by default it runs Shopware Core migrations, so to run your plugin's migrations you must explicitly pass your plugin's bundle name as the identifier (e.g. `SwagBasicExample`). Note: normally, when you update a plugin via the Plugin Manager, all new migrations execute automatically as part of that process (they're added to a `MigrationCollection`); running `database:migrate` by hand is for manually applying newly created migrations during development, or as a fallback if that automatic run didn't happen.","citations":["developer/guides/plugins/plugins/database/database-migrations.md:162-178"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"database:migrate\" docs/shopware-knowledge-bases/developer --include=*.md | head -20"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/database/database-migrations.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-02":{"query":"Shopware 6.7 removed the RSA JWT key files and `system:generate-jwt-secret` \u2014 what signs Admin API tokens now, and what do I have to do when upgrading?","category":"gap","option":"fs-docs","answer":"The developer docs corpus has no page describing a 6.7-specific removal of RSA JWT key files or the `system:generate-jwt-secret` console command, and no explanation of what now signs Admin API tokens or what upgrade steps are required. The closest material found is `developer/products/tools/cli/project-commands/helper-commands.md`, which documents the third-party `shopware-cli project generate-jwt` command (not the core `system:generate-jwt-secret` console command) and states only that generating RSA key pairs under `config/jwt/` is 'Required only for Shopware versions before 6.5; in 6.5+, JWT secrets are generated automatically' \u2014 it says nothing about 6.7 or about removal of the files/command, and does not mention what signs tokens instead. No dedicated 6.7 upgrade/changelog page was found in this corpus (searches for '6.7' or 'upgrade' + jwt-related filenames returned nothing). I could not find sourced material answering this question.","citations":["developer/products/tools/cli/project-commands/helper-commands.md:236-250"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"generate-jwt-secret|jwt\" docs/shopware-knowledge-bases/developer --include=*.md -i"},{"tool":"Bash","args":"grep -n \"jwt\" -i docs/shopware-knowledge-bases/developer/products/tools/cli/project-commands/helper-commands.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname \"*upgrade*\" -not -path '*/.git/*' | grep -i \"6.7|6-7\"; find docs/shopware-knowledge-bases/developer -iname \"*6.7*\" -o -iname \"*6-7*\" | grep -v '.git'"},{"tool":"Read","args":"developer/products/tools/cli/project-commands/helper-commands.md (offset 225, limit 30)"},{"tool":"Bash","args":"grep -rln \"APP_SECRET\" docs/shopware-knowledge-bases/developer --include=*.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"edge-05":{"query":"How do I enable Shopware's built-in MCP server on a Shopware 6.6 shop?","category":"edge","option":"fs-docs","answer":"This is not possible on Shopware 6.6 according to the corpus: the MCP server intro page states it 'was introduced in Shopware 6.7.11.0 behind the MCP_SERVER feature flag,' and is still marked experimental until 6.8. The Getting Started guide's prerequisites likewise require 'Shopware 6.7.14.0 or later,' or, for the narrower 6.7.11.0\u20136.7.13.x window, setting `MCP_SERVER=1` in `.env`. There is no mention anywhere of MCP support on 6.6. For a supported 6.7.x shop, the steps documented are: ensure `symfony/mcp-bundle` is installed (composer), create an integration with `bin/console integration:create \"My MCP Client\" --admin` (or a scoped, non-admin integration plus an ACL role for production), then configure the AI client to call the `/api/_mcp` (Admin API) endpoint using the integration's `sw-access-key`/`sw-secret-access-key` headers, and verify with `bin/console debug:mcp`.","citations":["developer/products/tools/mcp-server/intro.md:8-18","developer/products/tools/mcp-server/getting-started.md:10-34"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"mcp\" docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/tools/mcp-server/getting-started.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/tools/mcp-server/intro.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"no"},"func-01":{"query":"How do I create a product with variants and configure its visibility per sales channel, and why might it not show up in the storefront?","category":"func","option":"fs-docs","answer":"To create a product, fill in the required fields (Name, Product number, Tax rate, gross/net Price, Stock) and save. After saving, additional tabs become available, including Variants. To build variants, open the Variants tab and use the Variant Generator: under 'Select values' pick a property (created beforehand under Catalogues > Properties) and activate the option values to use for variant generation; you can also define price surcharges per option before generating, and use 'Value exclusion' to exclude specific option combinations (e.g. exclude Color=Blue AND Size=XS/XXXL) so those variants are not created. Clicking 'Generate variants' creates the variant table; you can then set the storefront display order of properties/options, assign images per variant, and choose a product-list presentation mode (e.g. 'Single main variant' with either 'Main product' or 'Single Variant' preselection, or 'Fan out properties in product list'). Individual variants can be edited by removing inheritance (chain icon) for a section and entering variant-specific data, and multiple variants can be changed at once via 'Bulk edit' with Overwrite/Clear/Add/Remove modes.\n\nVisibility per sales channel is configured in the product's General tab under 'Visibility & structure': the 'Sales channel' field assigns the product to one or more sales channels, determining where it is available; 'Active for all selected sales channels' controls whether it is displayed in the storefront and purchasable at all. 'Categories' assigns the product to categories so it appears in the storefront category tree, and 'Configure extended visibility' lets you set, per case, whether the product is fully Visible (search + listing), 'hide in listing' (findable only via search), or 'hide in listing and search' (only reachable via direct product URL).\n\nGiven these settings, a product may fail to show up in the storefront for reasons such as: it is not assigned to the relevant sales channel; 'Active for all selected sales channels' is not enabled; extended visibility is set to hide it from listing and/or search; it has not been assigned to any category (so it won't appear via the category tree, though it may still be found by search/URL depending on visibility); or, for variants, the specific variant itself is deactivated in the 'Active' column of the variant overview/quick-edit.","citations":["merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md:16-33","merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md:177-191","merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md:353-426","merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md:440-449"],"toolCallLog":[{"tool":"Read","args":"docs/shopware-knowledge-bases/merchant/index.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/catalogues -maxdepth 1 -type d -not -path '*/.git/*'"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/catalogues/products -maxdepth 1 -type d -not -path '*/.git/*'"},{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/merchant/content/en/shopware-6/catalogues/products"},{"tool":"Read","args":"docs/shopware-knowledge-bases/merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-22":{"query":"How do I give my plugin a settings page the shop operator can fill in, and what field types are available?","category":"dev","option":"fs-docs","answer":"Create a `src/Resources/config/config.xml` file inside your plugin; no custom Administration module or templating knowledge is required. The file is organized into `<card>` elements, each with a `<title>` and one or more `<input-field>` elements (each requiring a unique `<name>` of at least 4 characters, letters/numbers, not starting with a number). Titles, labels, placeholders and help texts are translatable via the `lang` attribute (default `en-GB`). Available `<input-field type=\"...\">` values are: text (default), textarea, text-editor, url, password, int, float, bool, checkbox, datetime, date, time, colorpicker, single-select, and multi-select. Common settings across field types include label, placeholder, helpText, defaultValue, disabled, required, copyable (for text-like fields), minLength/maxLength (text/url/password), min/max (int/float), options (for single/multi-select), and cache-relevant (available from Shopware 6.7.12.0, needed for fields whose value affects cached Storefront output, since 6.8.0.0 system config writes no longer auto-invalidate caches). For more complex needs you can use `<component name=\"...\">` elements to render supported Administration components: sw-entity-single-select, sw-entity-multi-id-select, sw-media-field, sw-text-editor, and sw-snippet-field. After defining the config.xml, the operator can fill in values under Extensions -> My extensions -> Plugins -> Configure -> Configuration tab in the Administration.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md:1-478"],"toolCallLog":[{"tool":"Bash","args":"cd docs/shopware-knowledge-bases/developer && find guides -iname \"*config*\" -not -path \"*/.git/*\" | grep -i plugin"},{"tool":"Read","args":"developer/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-01":{"query":"How do I configure Shopware 6's built-in GraphQL API for the Store API?","category":"edge","option":"fs-docs","answer":"No evidence of a built-in GraphQL API was found anywhere in the corpus. A recursive case-insensitive search for 'graphql' across both the developer docs (docs/shopware-knowledge-bases/developer) and the merchant docs (docs/shopware-knowledge-bases/merchant) returned zero matches. Shopware 6's Store API (and Admin API) are documented as REST-based JSON APIs; there is no indication in this corpus that Shopware ships a built-in GraphQL API or that the Store API can be configured to expose GraphQL. The premise of the question does not appear to match a feature that exists in this documentation.","citations":[],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"grep -ril \"graphql\" docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"grep -ril \"graphql\" docs/shopware-knowledge-bases/merchant"}],"notFoundClaim":true,"memoryClaims":["Shopware 6's Store API and Admin API are REST-based, not GraphQL [from memory]"],"sourceVerdict":"no"},"dev-39":{"query":"How do I write end-to-end Cypress tests for my plugin against a Shopware 6.7 store?","category":"dev","option":"fs-docs","answer":"Important caveat first: the developer docs' Testing overview states that 'Playwright is the officially supported tool' for E2E testing today, and the Cypress guide now lives under the docs' 'legacy' testing section \u2014 so for a current Shopware 6.7 project, Shopware now points developers toward Playwright rather than Cypress for E2E tests. That said, the (legacy) Cypress guide is still documented as follows. Prerequisites: a clean running Shopware 6 installation in production mode (use `composer run init` for a clean install without demo data), with a theme assigned; E2E dependencies are installed separately via `npm install` in the relevant `test/e2e` folder. In your plugin, create the folder structure `Resources/app/<environment>/test/e2e/cypress/{fixtures,integration,plugins,support}`. Run `npm init -y` inside `Resources/app/<environment>/test/e2e`, add an `\"open\": \"node_modules/.bin/cypress open\"` script to package.json, then `npm install @shopware-ag/e2e-testsuite-platform`. Create `e2e/cypress/plugins/index.js` with `module.exports = require('@shopware-ag/e2e-testsuite-platform/cypress/plugins');` and `e2e/cypress/support/index.js` with `require('@shopware-ag/e2e-testsuite-platform/cypress/support');`. Run tests with `CYPRESS_baseUrl=<your-url> npm run open` from that e2e folder (baseUrl is your Storefront URL) to open the Cypress test runner. Write tests as `*.spec.js` files in `cypress/integration`, using Mocha-style `describe()`/`it()` blocks, Cypress commands (`cy.get(...)`, `.click()`, `.type()`, etc.) and Chai/BDD assertions (`.should(...)`); use `before`/`beforeEach`/`afterEach`/`after` hooks, preferring `beforeEach` for cleanup since `after` hooks aren't guaranteed to run if a test fails. Handle test data via the Shopware REST API rather than the UI: store baseline JSON in `cypress/fixtures` and load it with `cy.fixture()`, then create entities with `cy.createDefaultFixture('endpoint')` (backed by the testsuite's `fixture.service.js`/`api.service.js`, which use axios rather than `cy.request` so promises can be parallelized); for entities needing related IDs, write a custom fixture service under `cypress/support/service` extending `AdminFixtureService`/`FixturesService`. Avoid using database IDs as selectors since Shopware's UUIDs are not stable across installations.","citations":["developer/guides/development/testing/index.md:1-64","developer/guides/development/testing/legacy/cypress/index.md:1-549"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/development/testing/; ls docs/shopware-knowledge-bases/developer/guides/development/testing/legacy"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/testing/legacy/cypress/index.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/testing/index.md"},{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/development/testing/e2e-playwright"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"gap-01":{"query":"How do I add my own Admin API endpoint under `/api/...` from a plugin \u2014 a controller with the api route scope and its ACL?","category":"gap","option":"fs-docs","answer":"The developer docs corpus has no dedicated 'Add Admin API Route' guide analogous to the Store API one. The only route-creation walkthrough present is 'Add Store API Route' (developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md), which shows the general pattern of a route class carrying a `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]])]` attribute, registered via a DI service and discovered through a `routes.php` route import \u2014 for an Admin API controller you would use the equivalent admin route scope in place of `StoreApiRouteScope`, but the corpus does not name or document that class, nor show a full Admin API controller example. The same page notes in passing that OpenAPI schema files for Admin API endpoints belong under `<plugin root>/src/Resources/Schema/AdminApi/` (as opposed to `StoreApi/` for Store API routes). The concept page `developer/concepts/api/admin-api.md` only describes the Admin API at a high level and defers all endpoint/auth/schema details to the external Stoplight reference \u2014 it contains no plugin how-to. On the ACL side, `developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md` documents how to register admin privileges (`addPrivilegeMappingEntry`) and check them in the Administration UI (routes, menu entries, `acl.can()`), but this is JS-side UI permission gating, not a PHP attribute for protecting a custom Admin API controller/route \u2014 the guide itself notes 'ACL Rules in the Administration can be circumvented by making direct API calls to your backend', implying route-level ACL enforcement (e.g. an `#[Acl(...)]` PHP attribute) is a separate mechanism not documented in this corpus. Overall: the corpus supports building the endpoint by analogy to the Store API guide plus swapping the route scope, and separately documents Administration-side privilege registration, but does not contain a single walkthrough combining an Admin API controller with its route-level ACL as asked.","citations":["developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md:57-98","developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md:175-177","developer/concepts/api/admin-api.md:8-18","developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:1-30"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"route_scope: api|RouteScope.*api|api route scope\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname \"*admin-api*\" -not -path '*/.git/*'; grep -ril \"add.*api route|custom api|admin api route|AdminApiController|@RouteScope.*api\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration -maxdepth 2 -not -path '*/.git/*'"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework -maxdepth 1 -not -path '*/.git/*'"},{"tool":"Read","args":"developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md"},{"tool":"Read","args":"developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"},{"tool":"Read","args":"developer/concepts/api/admin-api.md"},{"tool":"Bash","args":"grep -rn \"ApiRouteScope|AdminApiSource|Acl(\\[\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/resources/guidelines/code -not -path '*/.git/*'"},{"tool":"Read","args":"developer/resources/guidelines/code/routing.md"},{"tool":"Bash","args":"grep -rln \"AdminApiRouteScope|ApiRouteScope::ID|#\\[Acl(\" docs/shopware-knowledge-bases/developer --include=*.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"edge-02":{"query":"How do I get the DI container with `Shopware()->Container()` and override the product listing Smarty template in Shopware 6?","category":"edge","option":"fs-docs","answer":"No evidence in the corpus for either mechanism as applied to Shopware 6. A case-insensitive search of the developer docs (docs/shopware-knowledge-bases/developer) for 'smarty' and for the literal 'Shopware()->Container' returned zero matches. Both `Shopware()->Container()` (the global function/legacy container accessor) and Smarty templating are Shopware 5 concepts [from memory]; Shopware 6 uses Symfony's dependency injection container (services auto-wired via service definitions) and Twig templates instead, but no page in this corpus was found that confirms or documents that migration path, so this cannot be cited from the docs. The question's premise does not match anything findable in the Shopware 6 developer documentation corpus.","citations":[],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"smarty\" docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"grep -ril \"Shopware()->Container\" docs/shopware-knowledge-bases/developer"}],"notFoundClaim":true,"memoryClaims":["Shopware()->Container() and Smarty templating are Shopware 5 concepts, replaced in Shopware 6 by Symfony DI and Twig [from memory]"],"sourceVerdict":"no"},"dev-20":{"query":"How do I add my own condition to the Rule Builder from a plugin so shop owners can select it?","category":"dev","option":"fs-docs","answer":"Two parts are needed: a PHP rule class and an Administration integration. PHP side: create a class in `<plugin root>/src/Core/Rule` that extends the abstract `Shopware\\Core\\Framework\\Rule\\Rule`, implementing `getName()` (a unique technical name, e.g. `first_monday`), `match(RuleScope $scope): bool` (the actual matching logic \u2014 never run database queries or other time-consuming operations here), and `getConstraints()` (an array describing the rule's configurable fields and their validation types, e.g. `['isFirstMondayOfTheMonth' => [new Type('bool')]]`). Fields backing the rule's configurable values must be declared `protected`, not `private`. Register this class in your plugin's `services.php`, tagged with `shopware.rule.definition`. Optionally implement `getConfig(): RuleConfig` (e.g. `(new RuleConfig())->booleanField('isFirstMondayOfTheMonth')`) to auto-render a generic `sw-condition-generic` field and skip building a custom component/template. Administration side (if not using `getConfig()`): decorate the `ruleConditionDataProviderService` (the `RuleConditionService`) from a JS file (e.g. `<plugin root>/src/Resources/app/administration/src/decorator/rule-condition-service-decoration.js`) using `Shopware.Application.addServiceProviderDecorator('ruleConditionDataProviderService', (ruleConditionService) => { ruleConditionService.addCondition('first_monday', { component: 'swag-first-monday', label: 'Is first monday of the month', scopes: ['global'] }); return ruleConditionService; })` \u2014 the condition's name must match `getName()` from the PHP class. Import this decorator from your plugin's Administration entry point `src/Resources/app/administration/src/main.js`. You can also group conditions via `ruleConditionService.upsertGroup(...)` and attach a `group` key to the condition. Then build a custom Vue component (e.g. `swag-first-monday`) that extends `sw-condition-base`, and a Twig template overriding the `sw_condition_value_content` block to render the actual input (e.g. an `sw-single-select`) bound to the condition's value. Note rules are 'context-aware': if the condition should be selectable in specific assignment contexts (e.g. promotions, advanced prices), you may also need to configure awareness restrictions via `getAwarenessConfigurationByAssignmentName`/`addAwarenessConfiguration` on the same service, otherwise the new condition may be disabled/unselectable in some places.","citations":["developer/guides/plugins/plugins/framework/rule/add-custom-rules.md:24-368"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname \"*rule*\" -path \"*framework*\" | grep -v '.git'"},{"tool":"Read","args":"developer/guides/plugins/plugins/framework/rule/add-custom-rules.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-46":{"query":"sw-button and sw-card are deprecated in Shopware 6.7 \u2014 how do I migrate my plugin's admin templates to the Meteor components, and is there a codemod that does it?","category":"dev","option":"fs-docs","answer":"Yes, Shopware provides a codemod. With Shopware 6.7, several administration components (like sw-button, sw-card) are being replaced by components from the Meteor Component Library. To migrate: 1) Ensure you have a development installation of Shopware and your plugin is located in `custom/plugins`. 2) Run `composer run admin:code-mods` (which also prints help text), e.g. `composer run admin:code-mods -- --plugin-name example-plugin --fix -v 6.7`, providing your plugin name and target Shopware version. The tool automatically replaces compatible components with Meteor Components, adds guidance comments for components requiring manual migration, and fixes other deprecated code where possible. Individual per-component upgrade guides are also provided in the technical upgrade documentation for the release. For a transitional compatibility path (supporting both 6.6 and 6.7 in one codebase), a new `deprecated` prop was added to Shopware components, defaulting to `false` (uses the new Meteor Component by default); setting `deprecated` to `true` renders the old deprecated version instead (e.g. `<sw-button deprecated />` uses `sw-button-deprecated` in both 6.6 and 6.7, while `<sw-button />` uses `mt-button` in 6.7 and `sw-button-deprecated` in 6.6). The docs still recommend migrating to Meteor Components whenever possible. Note this page is explicitly marked as a 'Future Development Roadmap' article subject to change.","citations":["developer/guides/upgrades-migrations/administration/meteor-components.md:1-85"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/administration/meteor-components.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-28":{"query":"How do I override an existing Storefront JavaScript plugin, such as the cookie permission bar, from my own plugin instead of registering a new one?","category":"dev","option":"fs-docs","answer":"Storefront JS plugins are vanilla JavaScript classes, so you extend them directly. Note each JS plugin can only be overridden once \u2014 if two Shopware plugins try to override the same plugin, only the last one actually wins. Create a directory `<plugin root>/src/Resources/app/storefront/src/my-cookie-permission` with a file `my-cookie-permission.plugin.js`, and define a class extending the original, e.g. `import CookiePermissionPlugin from 'src/plugin/cookie/cookie-permission.plugin'; export default class MyCookiePermission extends CookiePermissionPlugin {}` (if you can't import the original class directly, e.g. for a third-party plugin without an alias, fetch it via `window.PluginManager.getPlugin('CookiePermission').get('class')`). Override whichever methods you need (e.g. `init()` to force the cookie bar to always show, `_hideCookieBar()` to add a confirm dialogue), calling `super.methodName()` to invoke the original behavior when appropriate. Then, in `<plugin root>/src/Resources/app/storefront/src/main.js` (the plugin's JS entry point), register the override using `PluginManager.override('CookiePermission', MyCookiePermission, '[data-cookie-permission]')` instead of `register()` \u2014 this tells Shopware to replace the existing plugin rather than add a new one. If the original plugin is registered asynchronously, the override import must also be async/dynamic, e.g. `PluginManager.override('CookiePermission', () => import('./my-cookie-permission/my-cookie-permission.plugin'), '[data-cookie-permission]')`. Finally rebuild the Storefront (e.g. `shopware-cli project storefront-build`, or `composer run build:js:storefront` in a platform contribution setup) and reload to see the changes.","citations":["developer/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md:1-152"],"toolCallLog":[{"tool":"Bash","args":"cd docs/shopware-knowledge-bases/developer && find guides -iname \"*override*\" -not -path \"*/.git/*\" | grep -i storefront; find guides -iname \"*javascript*\" -not -path \"*/.git/*\" | grep -i plugin"},{"tool":"Read","args":"developer/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-05":{"query":"How do I set up a sales channel - storefront versus headless type, domains, languages and currencies - and where do I get its API access key?","category":"func","option":"fs-docs","answer":"To create a sales channel, click the plus symbol next to the 'Sales Channel' menu item in the Administration. In the pop-up you choose the type: a 'Sales Channel with HTML storefront' or a 'headless sales channel' that only exposes an API interface (a product comparison export type is also offered here).\n\nGeneral settings for the new channel include Name, 'Mark Sales Channel as favourite' (shows it in the admin sidebar), navigation entry points (main navigation, footer navigation, service navigation - each tied to a starting category) and number of navigation levels, the default Customer group for new/anonymous visitors, the Countries available (plus a default), the Languages available (plus a default), and standard units of measurement (unit system, length unit, weight unit).\n\nUnder 'Payment and shipping' you specify which Payment methods are available and the default one (editable under Settings > Payment methods), which Shipping methods are available and the default (editable under Settings > Shipping methods), which Currencies are available and the default (editable under Settings > Currencies), and how tax should be calculated for orders in that channel.\n\nDomains: for a self-hosted instance, under 'Domain' you can add multiple domains via 'Add Domain', each with its own virtual URL, language, currency, snippet set, and unit system - useful for running multiple language shops from one sales channel; it's recommended each domain use only one protocol (http or https) to avoid duplicate content. For a Cloud instance, a URL is auto-generated on creation, and you can add your own custom domain via 'Add domain' provided it was already registered under Settings > System > Domains; a server-side redirect always forces https. When assigning a domain you set its URL, Language (from the languages already assigned to the channel), Currency (from Settings > Localisation > Currencies), Snippet set (from Settings > Localisation > Snippets), and Hreflang localisation (ISO-based or browser-language-based).\n\nAPI access: under the 'API access' section of the sales channel configuration you can generate an API Access ID for that sales channel; this is what you use for your own API access to the channel (developer documentation is referenced for usage details).\n\nOther notable sections: 'Status' lets you disable the channel or turn on maintenance mode with an IP whitelist; the preinstalled Headless sales channel should never be deleted since extensions like the B2B Suite rely on it (it can instead be hidden from the sidebar by marking other channels as favourites); 'Products' lets you assign products/categories/dynamic product groups directly to the channel; 'Theme' lets you assign a storefront theme; and 'Hreflang' lets you enable the hreflang metatag with a default domain fallback for multi-language shops.","citations":["merchant/content/en/shopware-6/settings/saleschannel/v1-5-2-0.md:39-141","merchant/content/en/shopware-6/settings/saleschannel/v1-5-2-0.md:143-168"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/saleschannel/"},{"tool":"Read","args":"docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/saleschannel/v1-5-2-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-26":{"query":"How do I add a custom document type such as a pro-forma invoice in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Shopware 6.7 ships a reworked Document System (v2), documented as an experimental feature activated with the `DOCUMENT_GENERATION_REWORK` feature flag (its API can change until it becomes the default with Shopware 6.8). To add a custom document type: 1) Create a document type class extending `Shopware\\Core\\Checkout\\DocumentV2\\Type\\AbstractDocumentType` with a `TECHNICAL_NAME` constant, `getTechnicalName()` and `getSupportedFormats()` (e.g. ['html', 'pdf']). 2) Provide the data: a render-data DTO extending `AbstractRenderData` with public properties (these become available in the template's `config` variable), and a data provider extending `AbstractDocumentDataProvider` implementing `getKey()`, `supports(string $documentType)`, `enrichOrderCriteria(Criteria $criteria)` (to add needed associations before rendering), and `provideRenderingData(ProviderInput $input, Context $context): AbstractRenderData`. 3) Register both as services in `src/Resources/config/services.php`, tagging the type with `shopware.document_v2.type` and the provider with `shopware.document_v2.provider`. 4) Add an HTML twig template at `src/Resources/views/documents/<technical_name>.html.twig` that extends `@Framework/documents/base.html.twig` (types offering the `zugferd_xml` format additionally need an XML template under `.../documents/zugferd/<technical_name>.xml.twig`). 5) Outside the code, add a `document_type` database row whose `technical_name` matches your type (required because the `document` table has a foreign key on it) and a number range of type `document_<technical_name>` to number generated documents \u2014 the migration code for this is identical to the legacy document system and can be reused, just swapping in the new technical name.","citations":["developer/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md:1-162"],"toolCallLog":[{"tool":"Bash","args":"cd docs/shopware-knowledge-bases/developer && find guides -iname \"*document*\" -not -path \"*/.git/*\""},{"tool":"Read","args":"developer/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-50":{"query":"My `ScheduledTaskHandler` stopped running after the upgrade \u2014 how must a scheduled task and its handler be declared in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"A `ScheduledTask` and its `ScheduledTaskHandler` must both be registered in the plugin's `services.php` (placed under `<plugin root>/src/Resources/config/`). The task service must carry the `shopware.scheduled.task` tag, and the handler service must carry the `messenger.message_handler` tag, e.g.: `$services->set(ExampleTask::class)->tag('shopware.scheduled.task');` and `$services->set(ExampleTaskHandler::class)->args([service('scheduled_task.repository'), service('logger')])->tag('messenger.message_handler');`. The task class must extend `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTask` and implement `getTaskName(): string` (a vendor-prefixed technical name, e.g. `swag.example_task`) and `getDefaultInterval(): int` (interval in seconds). The handler class must extend `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTaskHandler`, be annotated with `#[AsMessageHandler(handles: ExampleTask::class)]` from `Symfony\\Component\\Messenger\\Attribute\\AsMessageHandler`, and implement `run(): void` with the task logic. If the task doesn't need to reregister via plugin reinstall, run `bin/console scheduled-task:register`; to actually execute due tasks you need both `bin/console scheduled-task:run` (dispatches messages to the bus for tasks whose interval is due) and `bin/console messenger:consume` (executes dispatched messages) \u2014 unless using the admin worker. The task's `status` must be `scheduled` in the `scheduled_task` database table, otherwise it will not run. Since Shopware 6.7.13.0, a handler can additionally implement `DynamicallyScheduledTaskHandler` and its `getNextExecutionTime(ScheduledTask $task, ScheduledTaskEntity $taskEntity): ?\\DateTimeInterface` method (called after `run()` finishes) to control the next run time dynamically instead of the default fixed `nextExecutionTime + runInterval` schedule; returning null falls back to the default schedule.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md:20-167"],"toolCallLog":[{"tool":"Bash","args":"grep -rln 'ScheduledTaskHandler' . --include=*.md | grep -v .git (cwd docs/shopware-knowledge-bases/developer)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-68":{"query":"How does the registration handshake between Shopware and my app backend work \u2014 shop id, proof, shop secret and the confirmation call?","category":"dev","option":"fs-docs","answer":"The setup/registration handshake (only needed when the app backend and Shopware must communicate \u2014 e.g. Admin Module, Payment Method, Tax providers, or Webhook features) works in these steps:\n\n1. Registration request: Shopware sends a `GET` request to the URL configured in the app's manifest, with query parameters `shop-id` (unique shop identifier), `shop-url` (URL used later to access the Shopware API), and `timestamp` (Unix timestamp). Headers include `shopware-app-signature` (HMAC-SHA256 signature of the query string, signed with the `app-secret` unique to your app \u2014 provided via the Shopware Account when uploading the app, or via a `<secret>` in the manifest for local dev/private apps), `sw-version` (Shopware version, since 6.4.1.0), and \u2014 on re-registration only \u2014 `shopware-shop-signature` (signed with the shop's current shop-secret). The app must recompute `hash_hmac('sha256', $queryString, $appSecret)` and compare it to verify the request truly came from an authenticated Shopware shop.\n\n2. Registration response: if setup succeeds, the app must return a JSON body proving it holds the `app-secret`: a `proof` (SHA-256 HMAC of `shopId . shopUrl . appName`, signed with `app-secret`), a `secret` (a newly, randomly generated 'shop-secret', unique per shop, 64-255 characters, used to sign all future requests to this shop), and a `confirmation_url` to which Shopware will send the confirmation request. Example: `{\"proof\": \"94b42d3...\", \"secret\": \"random secret string\", \"confirmation_url\": \"https://my.example.com/registration/confirm\"}`. If setup should fail (e.g. blocked domain), the app can instead respond with `{\"error\": \"The shop URL is invalid\"}`.\n\n3. Confirmation request: if the returned `proof` matches what Shopware computed, registration is completed and Shopware sends a `POST` to the app's `confirmation_url` with body containing `apiKey`, `secretKey` (used respectively as `client_id`/`client_secret` for Admin API OAuth), `timestamp`, `shopUrl`, and `shopId`. This request is signed with the `shop-secret` the app provided in step 2, via the `shopware-shop-signature` header \u2014 the app must recompute `hash_hmac('sha256', $requestBody, $shopSecret)` to verify authenticity. On re-registration, an additional `shopware-shop-signature-previous` header (signed with the previous shop-secret) lets the app validate continuity with the prior registration.\n\nThe timeout for requests against the app server during this process is 5 seconds. During secret rotation/shop-url changes, the app must validate both the new and previous shop-secret signatures and should accept the old secret in parallel for a short grace period (e.g. 1 minute) to avoid breaking in-flight requests.","citations":["developer/guides/plugins/apps/lifecycle/app-registration-setup.md:14-269"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/apps/lifecycle/app-registration-setup.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-21":{"query":"My plugin dispatches its own domain event \u2014 how do I make it show up as a trigger in the Flow Builder?","category":"dev","option":"fs-docs","answer":"Make your event class implement `FlowEventAware` (plus any relevant Aware interfaces like `CustomerAware`, `OrderAware`, `MailAware`, `UserAware`, `SalesChannelAware` depending on which flow actions should be able to use it) and provide `getName()` and `getAvailableData()`. Then register a subscriber on `BusinessEventCollectorEvent` (with a high priority, e.g. 1000, so it runs before other subscribers) that calls `$businessEventCollector->define(YourEvent::class)` and adds the resulting definition to the collection via `$collection->set($definition->getName(), $definition)`. Register that subscriber in `src/Resources/config/services.php` tagged `kernel.event_subscriber`. Once installed, the event then appears as a selectable trigger under Settings > Flow Builder > Add flow in the Administration. From Shopware 6.5.0.0 onward, event data for Flow Builder is stored via `StorableFlow` and `FlowStorer` classes matched to Aware interfaces (e.g. `CustomerAware` -> `CustomerStorer`), rather than via `getAvailableData()` alone; you can define a custom Aware interface and a matching `FlowStorer` for custom data not covered by the built-in Aware interfaces.","citations":["developer/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md:1-410"],"toolCallLog":[{"tool":"Bash","args":"cat docs/shopware-knowledge-bases/developer/index.md | head -100"},{"tool":"Bash","args":"cd docs/shopware-knowledge-bases/developer && grep -ril \"flow builder\" guides --include=*.md | grep -i trigger; find guides -iname \"*flow*\" -not -path \"*/.git/*\""},{"tool":"Read","args":"developer/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-25":{"query":"How do I add a `bin/console` command to my plugin for a maintenance task?","category":"dev","option":"fs-docs","answer":"Shopware CLI commands are based on Symfony Console, so plugin commands follow the standard Symfony approach. Create a command class (e.g. `<plugin root>/src/Command/ExampleCommand.php`) extending `Symfony\\Component\\Console\\Command\\Command`, annotated with `#[AsCommand(name: 'swag:example', description: 'Example command')]`, implementing `execute(InputInterface $input, OutputInterface $output): int` and returning `Command::SUCCESS`. Then register it as a service in the plugin's `src/Resources/config/services.php` and tag it with `console.command`, e.g. `$services->set(Swag\\BasicExample\\Command\\ExampleCommand::class)->tag('console.command');`. Commands registered this way are automatically available via `bin/console` once the plugin is installed/active.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md:1-49"],"toolCallLog":[{"tool":"Bash","args":"cd docs/shopware-knowledge-bases/developer && find guides -iname \"*command*\" -not -path \"*/.git/*\" | grep -vi apps"},{"tool":"Read","args":"developer/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-09":{"query":"Why doesn't my payment method appear in the checkout - what has to be configured in the administration?","category":"func","option":"fs-docs","answer":"Payment methods are managed under Settings > Commerce > Payment methods. For a payment method to actually show up for customers in the storefront checkout, several things must line up:\n\n1. The payment method itself must be Active (the 'Active' toggle on the payment method's edit form). By default, Shopware ships with cash on delivery, invoice, prepayment and direct debit activated.\n\n2. Being activated in the payment methods list is not enough on its own - the docs explicitly note that 'this does not automatically mean that all activated payment methods are available to your customers in the storefront. The decisive factor here is which payment methods are assigned in your sales channel.' So the payment method must also be selected in the relevant Sales Channel's 'Payment and shipping' configuration (Payment methods field), and ideally also set/considered as an available default there.\n\n3. An Availability rule can be attached to the payment method (built with the Rule Builder, or created directly from the payment method's edit screen). If an availability rule is set and its conditions are not met in the current context (e.g. specific cart value, customer group, country, etc.), the payment method will not be offered. For a payment method that should always be available without restriction, the availability rule field should be left blank (NULL).\n\nOther configuration fields on a payment method include Name, Technical name (used to clearly identify the method - changing it after the fact can break integrations/existing orders, so the docs recommend leaving it alone once set by an extension until the vendor updates it, or setting it promptly if self-created), Position (controls display order), Description, and Logo - name, description and logo are all shown to the customer in the storefront payment selection. A switch 'Allow change of payment method after order completion' also controls whether the customer can later change this payment method from their account under Orders.\n\nSo, in short: if a payment method isn't appearing at checkout, check (a) it is Active, (b) it is assigned to the sales channel being used (Settings > Sales Channel > that channel > Payment and shipping > Payment methods), and (c) any availability rule attached to it is not blocking it under the current cart/customer/order conditions.","citations":["merchant/content/en/shopware-6/settings/Paymentmethods/v1-4-0-0.md:10-57"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Paymentmethods/"},{"tool":"Read","args":"docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Paymentmethods/v1-4-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-08":{"query":"In a plugin service, what is the Shopware 6 equivalent of Doctrine's `findBy()` \u2014 how do I read products with filters, associations and sorting?","category":"dev","option":"fs-docs","answer":"Shopware 6 does not use a Doctrine ORM; it uses its own thin Data Abstraction Layer (DAL), and the equivalent of `findBy()` is calling `search(Criteria $criteria, Context $context)` on an entity's auto-generated repository (`EntityRepository`, injected by DI service name `<entity_name>.repository`, e.g. `product.repository`). Basic read: `$this->productRepository->search(new Criteria(), $context);` returns an `EntitySearchResult`. To find by IDs, pass them to the `Criteria` constructor: `new Criteria([$myId])`, then call `->first()`. To filter by any other field, build a `Criteria` and call `addFilter(new EqualsFilter('name', 'Example name'))` (from `Shopware\\Core\\Framework\\DataAbstractionLayer\\Search\\Filter\\EqualsFilter`); filters can be combined with `OrFilter`/`AndFilter`/`NandFilter`. Use `addPostFilter()` instead of `addFilter()` if the filter should not affect aggregation results. To eager-load related entities (associations), call `$criteria->addAssociation('productReviews')` (dot-chainable, e.g. `'productReviews.customer'`); to filter within an association use `$criteria->getAssociation('productReviews')->addFilter(...)` which only filters the loaded review sub-results without restricting the parent product match, whereas `addFilter(new RangeFilter('productReviews.points', [...]))` combined with `addAssociation` restricts which products match at all. Many-to-many mapping entities (e.g. `product_category`) cannot be read via `search()`, only via `searchIds()`. Aggregations use `addAggregation(new AvgAggregation('avg-rating', 'productReviews.points'))` and are read via `$products->getAggregations()->get('avg-rating')` (don't call `first()` when aggregating). Limiting/paging/sorting use `$criteria->setLimit(n)`, `$criteria->setOffset(n)`, and `$criteria->addSorting(new FieldSorting('createdAt', FieldSorting::ASCENDING))`. For very large result sets, use the `RepositoryIterator` (`new RepositoryIterator($this->productRepository, $context, $criteria)`, then loop `while (($result = $iterator->fetch()) !== null)`), making sure the Criteria's sorting is deterministic (e.g. always include a unique field like `id` in the sorting) to avoid entities being skipped or duplicated across batches.","citations":["developer/guides/plugins/plugins/framework/data-handling/reading-data.md:8-391"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/reading-data.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-32":{"query":"How do I define a custom field set for products from my plugin so merchants can edit the values in the Administration?","category":"dev","option":"fs-docs","answer":"Since the product entity already ships with a CustomFields field, you don't need to touch the entity definition \u2014 you only need to define a custom field set that is related to the product entity. The recommended (declarative, Shopware 6.7.13.0+) approach is to ship a `Resources/config/custom-fields.xml` file under your plugin's `src` directory; Shopware then automatically creates/updates/removes the defined sets during the plugin lifecycle (install/update/uninstall) with no lifecycle-hook code needed. The XML defines a `<custom-field-set>` with a unique vendor-prefixed `<name>`, a translatable `<label>`, a `<related-entities>` block naming the entities to attach it to (e.g. `<product/>`), and a `<fields>` block listing the fields (e.g. `<int name=\"swag_example_weight\"><label>Weight<\/label><position>1<\/position><\/int>` or `<text name=\"swag_example_code\">...<\/text>`), with optional `<required>` and `<help-text>`. Field/set names must be globally unique, so always prefix them with your vendor prefix (e.g. 'swag'). If you need to create the set dynamically at runtime instead, you can use the imperative approach: inject the `custom_field_set.repository` DAL repository (fetched via that DI container key) and call `create()` with an array containing `name`, `global`, `config.label` (translated), and a `customFields` array of field definitions (each with `name`, `type` from `CustomFieldTypes`, `includeInSearch`, and `config.label`/`customFieldPosition`) \u2014 typically done in plugin lifecycle hooks (install/uninstall). Setting `global` to `false` makes the set deletable/editable in the Administration. By default custom fields are not searchable; set `includeInSearch` to `true` (available since Shopware 6.7.6.0) if you want the field indexed for search, then rebuild the search index. Once the field/set is defined and related to the product entity, it becomes editable via the Administration's product custom fields tab; to further customize how it's displayed in the Administration you'd follow the separate 'Add custom fields to the Administration' guide referenced from this page.","citations":["developer/guides/plugins/plugins/framework/custom-field/add-custom-field.md:179-327","developer/snippets/config/custom-fields-standalone.xml:1-35"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"custom field\" docs/shopware-knowledge-bases/developer/guides/plugins"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/custom-field/add-custom-field.md"},{"tool":"Bash","args":"grep -n \"relatedEntities\\|product\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/custom-field/add-custom-field.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/snippets/config/custom-fields-standalone.xml"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-10":{"query":"How do I write an indexer that precomputes derived data for my custom entity on write, and how do I trigger a full reindex?","category":"dev","option":"fs-docs","answer":"Create a class (e.g. `ExampleIndexer` in `<plugin root>/src/Core/Framework/DataAbstractionLayer/Indexing/`) extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Indexing\\EntityIndexer` and implement: `getName(): string` (a unique name identifying the indexer in the `EntityIndexerRegistry`); `iterate($offset): ?EntityIndexingMessage` (called for a full index run \u2014 use an `IteratorFactory` to page through all records of the entity's repository/definition and return an `EntityIndexingMessage` with the batch of IDs and the new offset, or `null` when done \u2014 this is what runs for `bin/console dal:refresh:index` or an Administration-triggered full index refresh); `update(EntityWrittenContainerEvent $event): ?EntityIndexingMessage` (called whenever entities are written via the DAL \u2014 extract changed primary keys via `$event->getPrimaryKeys(EntityDefinition::ENTITY_NAME)` and return an `EntityIndexingMessage` with those IDs and the event's context, filtering by changed columns where possible for performance); and `handle(EntityIndexingMessage $message): void` (invoked by the message queue workers, or synchronously by default, to actually perform the precomputation/derived-data write for the given IDs \u2014 prefer using the injected `Connection` directly rather than the DAL here, since writing via the DAL would re-trigger `EntityWrittenContainerEvent` and could cause infinite indexing loops). Register the indexer as a service tagged `shopware.entity_indexer` (this tag is required). By default, messages from `update()` are handled synchronously (handle() runs right after update()); to process asynchronously via the message queue, construct the `EntityIndexingMessage` with its fourth constructor parameter `$forceQueue = true`. If you do need DAL functionality inside an indexer to write data safely, you can disable re-triggering indexing by calling `$context->addState(EntityIndexerRegistry::DISABLE_INDEXING)` on the context passed into the returned `EntityIndexingMessage`. Instead of building a fully custom indexer, for many core entities (Customer, Category, LandingPage, Product, ProductStream, Promotion, Rule, Media, MediaFolder, MediaFolderConfiguration, SalesChannel, Breadcrumb) you can instead subscribe to the existing indexer's dispatched event (e.g. `CustomerIndexerEvent`) via a normal event subscriber tagged `kernel.event_subscriber`, again writing through the `Connection` directly rather than the DAL to avoid infinite loops and for better performance.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-data-indexer.md:8-289"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/add-data-indexer.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-60":{"query":"Which transports do my Shopware message queue workers have to consume in production, and how do I turn off the admin worker?","category":"dev","option":"fs-docs","answer":"On production, the message queue should be processed via CLI workers instead of the browser-based admin worker. It's recommended to run one or more `messenger:consume` workers (kept alive via systemd, supervisor, or a cron job) rather than relying on the Administration polling. You consume the relevant transports by name, e.g. `bin/console messenger:consume async --time-limit=60 --memory-limit=128M`, and you can consume multiple transports in priority order, e.g. `bin/console messenger:consume async low_priority` (Symfony processes transports in the order listed). By default the environment variables in use out of the box are `MESSENGER_TRANSPORT_DSN` (the main/async transport, e.g. `doctrine://default`), `MESSENGER_TRANSPORT_LOW_PRIORITY_DSN` (e.g. `doctrine://default?queue_name=low_priority`), and `MESSENGER_TRANSPORT_FAILURE_DSN` (failed messages, e.g. `doctrine://default?queue_name=failed`, default Doctrine transport, retried automatically 3 times then deleted) \u2014 you must also set up a CLI worker for the failed transport or failed messages won't be reprocessed. Once you have a CLI worker configured, you should turn off the admin worker in `config/packages/shopware.yaml`:\n```yaml\nshopware:\n    admin_worker:\n        enable_admin_worker: false\n```\n(If instead you want to keep using the admin worker, it must be set to `enable_admin_worker: true` with an explicit `poll_interval` and a `transports` list naming every transport it should poll, e.g. `transports: [\"async\", \"low_priority\"]`.) The number of CLI workers to run depends on queue volume/message type and should be monitored and adjusted; routing messages to different transports (via `framework.messenger.routing` or the `shopware.messenger.routing_overwrite` config added in 6.6.4.0/6.5.12.0) can be used to isolate slow message types like indexing from fast ones.","citations":["developer/guides/hosting/infrastructure/message-queue.md:14-158"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"admin worker|message queue|messenger\" docs/shopware-knowledge-bases/developer --include=*.md | grep -i \"worker|queue\""},{"tool":"Read","args":"docs/shopware-knowledge-bases/developer/guides/hosting/infrastructure/message-queue.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-09":{"query":"Where do I configure Business Events so that a mail is sent when an order is placed in Shopware 6.7?","category":"edge","option":"fs-docs","answer":"In Shopware 6.7 you no longer configure this via the old 'Business Events' screen \u2014 that was replaced by the Flow Builder starting in major release 6.4.8.0 (Business Events is only still used for the B2B-Suite). The Flow Builder is found under Settings > Automation > Flow Builder. Create/edit a flow, and on the 'General' tab set a name, description, priority and active toggle. On the 'Flow' tab, pick the trigger 'checkout.order.placed' (described as 'Triggers when an order is placed') from the trigger list. Optionally add conditions using Rule Builder rules. Then add the action 'Send mail': select a reply-to address and a recipient (administrator, the customer, or one/more defined email addresses), choose the email template to send, and specify which documents (if any) to attach.","citations":["merchant/content/en/shopware-6/settings/Business-Events/v1-0-0.md:10-11","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:9-17","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:41-62","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:198-206"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"business event\\|Business Events\" docs/shopware-knowledge-bases/merchant --include=*.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant -iname \"*flow-builder*\" -not -path '*/.git/*'"},{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Business-Events/"},{"tool":"Read","args":"merchant/content/en/shopware-6/settings/Business-Events/v1-0-0.md"},{"tool":"Read","args":"merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-70":{"query":"How do I implement a payment method in an app with `pay-url` and `finalize-url`, and what must the app server return in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Define the payment method in your app's manifest with a `pay-url` (and optionally a `finalize-url`). Whether Shopware treats it as a synchronous or asynchronous payment depends on which URLs you provide: if no `finalize-url` is defined, Shopware defaults to a synchronous payment; if you don't provide a `pay-url` at all, the transaction simply stays open (no app communication). The payment method is identified by your app's name plus the identifier you give it, so don't change that identifier after release or new payment methods will be created.\n\nSynchronous flow: Shopware POSTs to `pay-url` with `source`, `orderTransaction`, and `order`. Your app responds with `{\"status\": \"authorize\"}` (or another valid status), optionally with a `message` for failing states.\n\nAsynchronous flow (e.g. redirect to PayPal/Stripe):\n1. Shopware POSTs to `pay-url` with `source`, `order`, `orderTransaction`, and a `returnUrl` (where the customer should return after paying).\n2. Your app server responds with `{\"redirectUrl\": \"https://payment.app/customer/gotoPaymentProvider\"}`.\n3. The browser is redirected there; after payment, the provider redirects the customer back to `returnUrl`.\n4. Shopware then POSTs to `finalize-url` with `source`, `orderTransaction`, and `requestData` (the query parameters the payment provider passed back).\n5. Your app server responds with `{\"status\": \"...\"}` (and optional `message`) \u2014 e.g. `cancel` (customer aborted), `fail` (payment failed, e.g. missing funds), `paid` (successful immediate payment), or `authorize` (delayed payment).\n\nAll possible payment states your app can return are: `open`, `paid`, `cancelled`, `refunded`, `failed`, `authorize`, `unconfirmed`, `in_progress`, `reminded`, `chargeback`.\n\nImportant for Shopware 6.7: 'Be aware, that from Shopware 6.7.0.0 onwards your app-server has to respond with a payment state in its response, if you intend to change the transaction state.' This applies to the pay, finalize, prepared-payment (validate/pay), refund, and recurring-capture calls alike.\n\nAll requests/responses are signed JSON; requests and responses use the App PHP SDK's `ShopResolver`/`ContextResolver`/`ResponseSigner` (or the Symfony Bundle's `PaymentPayAction`/`PaymentFinalizeAction` route arguments) to parse and sign. Your app server must be publicly reachable by Shopware (e.g. via ngrok for local dev).","citations":["developer/guides/plugins/apps/checkout/payment.md:8-46","developer/guides/plugins/apps/checkout/payment.md:154-272","developer/guides/plugins/apps/checkout/payment.md:773-786"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"pay-url|finalize-url\" docs/shopware-knowledge-bases/developer --include=*.md | head -20"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/apps/checkout/payment.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-06":{"query":"Which triggers and actions does the Flow Builder offer, and how do I make it send a mail when an order is placed?","category":"func","option":"fs-docs","answer":"Flow Builder is found under Settings > Automation > Flow Builder. Each flow has a General tab (Name, Description, Priority - which flow processes first if several share a trigger, Active toggle) and a Flow tab where you build trigger -> conditions -> actions.\n\nTriggers: a flow starts with exactly one trigger, chosen from a large fixed list of internal events, including (among many others) checkout.customer.register/login/logout/deleted, checkout.customer.double_opt_in_registration, checkout.order.placed (triggers when an order is placed), checkout.order.payment_method.changed, contact_form.send, customer.group.registration.accepted/declined, customer.recovery.request, mail.before.send/mail.sent, newsletter.confirm/register/unsubscribe, product_export.log, review_form.send, user.recovery.request, and a large family of state_enter.* / state_leave.* events for order, order_delivery, order_transaction and order_transaction_capture status changes (e.g. state_enter.order_transaction.state.paid, state_enter.order.state.cancelled, etc.). Since 6.5.3.0, Custom Triggers let apps/extensions register additional triggers, and flows can also be started by or send webhooks to third-party systems.\n\nConditions (optional) use Rule Builder rules (existing or newly created) to branch the flow into True/False outcomes, each of which can have its own further conditions or actions. Delayed Actions (Beyond plan) let you delay an action by a chosen amount (Hour/Day/Week/Month/custom SS.TT.WW.MM format) after the trigger fires; pending delayed actions appear under 'Scheduled Actions'.\n\nActions available (availability depends on the trigger) include: Assign account status (activate/deactivate a customer), Assign affiliate and campaign code (optionally overriding existing codes), Assign customer group, Generate a document (choose a document type), Send mail (choose reply-to address, recipient - customer, Administrator [which addresses all admin-flagged users including external API users], or custom email addresses -, an email template, and optional attached documents), Assign status (change payment/shipping/order status, respecting valid state dependencies), Stop flow (halts the entire flow and any parallel branches), Set download access (grant/revoke digital-product download access), Change custom field content (on customer or order entity), and Add Tag/Remove Tag. With the Shopware Commercial extension (Evolve plan+), a Webhook 'Call URL' action is also available, supporting GET/POST/PUT/PATCH/DELETE methods, custom parameters, headers, body and Basic Auth.\n\nTo send a mail when an order is placed: create a new flow (Add Flow), fill in General info and activate it, then in the Flow tab select the trigger 'checkout.order.placed', optionally add a condition (e.g. from the Rule Builder) to narrow when the mail should be sent, then add the action 'Send mail', configuring the reply-to address, recipient, the email template to use, and any documents to attach; save the flow.","citations":["merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:9-39","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:41-70","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:137-236","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:251-258"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder/"},{"tool":"Read","args":"docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-08":{"query":"How do I set up a Nuxt project with Shopware Composable Frontends against my shop's Store API \u2014 endpoint, access token, and why do I get HTTP 412?","category":"gap","option":"fs-docs","answer":"The corpus does not contain a getting-started/setup guide for a local Nuxt + Composable Frontends project against the Store API, and no page explains an HTTP 412 error for this scenario. What exists is deployment-focused: `developer/products/paas/shopware/composable-frontends/index.md` only covers deploying an already-built composable frontend onto Shopware PaaS Native (an `application.yaml` with `kind: cfe`, Node version, port 3000, a required `/api/healthz` health endpoint, environment variables/secrets, and Fastly/ISR caching headers) \u2014 it says nothing about Store API endpoint configuration or access tokens for local development. The general Store API concept page (`developer/concepts/api/store-api.md`) only states that 'Shopware provides Composable Frontends as a headless frontend implementation based on the Store API' and defers all endpoint/auth details to the external Stoplight reference. The Store API's authentication headers are documented generically in `developer/guides/development/integrations-api/request-headers.md`: `sw-access-token` ('Any request to the Store API requires authentication with a `sw-access-token`') for the sales-channel access key, and `sw-context-token` for recognizing an individual customer/session \u2014 but this page is not specific to Composable Frontends/Nuxt and does not mention or explain an HTTP 412 response. I could not find sourced material in this corpus that answers the Nuxt setup or the 412 cause.","citations":["developer/products/paas/shopware/composable-frontends/index.md:1-53","developer/concepts/api/store-api.md:1-17","developer/guides/development/integrations-api/request-headers.md:54-60"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"Composable Frontend|composable-frontend|Nuxt\" docs/shopware-knowledge-bases/developer --include=*.md -i"},{"tool":"Read","args":"developer/products/paas/shopware/composable-frontends/index.md"},{"tool":"Bash","args":"grep -rln \"412|sw-access-key|SW_ACCESS_TOKEN|store api.*access\" docs/shopware-knowledge-bases/developer --include=*.md -i"},{"tool":"Read","args":"developer/concepts/api/store-api.md"},{"tool":"Bash","args":"grep -n \"412|sw-access-key\" docs/shopware-knowledge-bases/developer/guides/development/integrations-api/request-headers.md"},{"tool":"Bash","args":"grep -rln \"sw-context-token|Precondition Failed\" docs/shopware-knowledge-bases/developer --include=*.md -i"},{"tool":"Read","args":"developer/guides/development/integrations-api/request-headers.md"},{"tool":"Bash","args":"grep -n \"412\" -i -B3 -A3 docs/shopware-knowledge-bases/developer/products/tools/mcp-server/store-api.md docs/shopware-knowledge-bases/developer/products/extensions/b2b-suite/guides/core/store-api.md"},{"tool":"Bash","args":"grep -n \"Composable Frontend|Nuxt|Store API|access token|412\" docs/shopware-knowledge-bases/developer/guides/plugins/apps/app-sdks/javascript/07-external-frontend.md -i"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"dev-19":{"query":"I need to move long-running work in my plugin out of the request into the message queue \u2014 what does the handler class look like and how is it registered?","category":"dev","option":"fs-docs","answer":"Shopware integrates the Symfony Messenger component. First define a message class (a plain, serializable PHP object holding the data the handler needs), implementing `Shopware\\Core\\Framework\\MessageQueue\\AsyncMessageInterface` so it is handled asynchronously instead of synchronously (implement `LowPriorityMessageInterface` instead/also if it should go through the lower-priority queue). Dispatch it from a service that injects `Symfony\\Component\\Messenger\\MessageBusInterface` and calls `$this->bus->dispatch(new YourMessage(...))` (or dispatch an `Envelope` with stamps, e.g. `DelayStamp`, for metadata like delayed processing). The handler class itself needs no interface \u2014 mark it with the PHP attribute `#[AsMessageHandler]` (from `Symfony\\Component\\Messenger\\Attribute\\AsMessageHandler`) and implement an `__invoke(YourMessage $message)` method containing the actual long-running work; you can define multiple handler classes for the same message. Registration in the DI container is done by tagging the handler service with `messenger.message_handler` in your plugin's `services.php` (per the framework's convention shown for other tagged services). Example: `#[AsMessageHandler] class SmsHandler { public function __invoke(SmsNotification $message) { /* do work */ } }`.","citations":["developer/guides/plugins/plugins/framework/message-queue/add-message-handler.md:16-45","developer/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md:16-99"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname \"*message-queue*\" -o -iname \"*messenger*\" | grep -v '.git'"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/message-queue -maxdepth 1 -name \"*.md\""},{"tool":"Read","args":"developer/guides/plugins/plugins/framework/message-queue/add-message-handler.md"},{"tool":"Read","args":"developer/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-12":{"query":"I am on Shopware 6.6 \u2014 which file do I declare my plugin's service dependencies in, and how do I pass another service into the constructor?","category":"dev","option":"fs-docs","answer":"On Shopware 6.6, plugin services are declared in `PLUGIN_ROOT/src/Resources/config/services.xml` \u2014 the ADR on migrating container configuration explains that plugins shipped `Resources/config/services.xml` by convention, and this XML format was only deprecated starting with 6.7 (with removal in 6.8); PHP `services.php`/`routes.php` configuration became available as an option on all supported 6.x versions but XML was the traditional/default format used on 6.6. To pass another service into a constructor, you declare an explicit `<service>` definition for your class in that XML file and add an `<argument type=\"service\" id=\"...\"/>` (or the equivalent short-hand tag) referencing the core service'
