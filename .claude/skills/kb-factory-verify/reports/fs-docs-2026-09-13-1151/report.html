 index. You can override this by adding a config file at `config/packages/elasticsearch.yml` (available since Shopware 6.4.12.0) with content like:\n```yaml\nelasticsearch:\n  index_settings:\n    number_of_shards: 1\n    number_of_replicas: 0\n```\nTo actually rebuild/reindex, run `bin/console es:index` for basic Elasticsearch indexing. If you want to reindex the whole shop (Elasticsearch, SEO-URLs, product index, etc.) use `bin/console dal:refresh:index --use-queue` (the `--use-queue` option is recommended since there are usually too many products to index synchronously \u2014 it requires the message queue). Some systems additionally require running `bin/console es:create:alias` after indexing completes if products still don't show in the Storefront. Before indexing, it's also recommended to clear the cache with `bin/console cache:clear` so `.env` changes are picked up.","citations":["developer/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md:140-186"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"grep -rli \"elasticsearch\" docs/shopware-knowledge-bases/developer --include=*.md | head -30"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-29":{"query":"How do I add my own data to an existing Storefront page or pagelet from a plugin without overriding the core controller?","category":"dev","option":"fs-docs","answer":"All pages/pagelets fire a `...LoadedEvent` (e.g. `FooterPageletLoadedEvent` for the footer pagelet). Instead of overriding the controller, subscribe to that Loaded event: create a class implementing `EventSubscriberInterface` that maps the event class to a handler method, and register it as a service tagged `kernel.event_subscriber` in `Resources/config/services.php`. In the handler, fetch whatever extra data you need \u2014 since you're inside a pagelet event you should not call the DAL directly; instead use or create a store-api route (if no existing route fits your exact need without over-fetching, create a new one, e.g. an `AbstractProductCountRoute`/`ProductCountRoute` pair following the store-api route guide) and call it with `$route->load(new Criteria(), $event->getSalesChannelContext())`. Then attach the result to the page/pagelet object with `$event->getPagelet()->addExtension('product_count', $result)` (pages use the analogous `$event->getPage()->addExtension(...)`). This makes the data available in Twig via `<page>.extensions.product_count`. Finally, to actually render it, override the relevant Storefront template using `{% sw_extends %}` and override the appropriate block, referencing `footer.extensions.product_count.count` (or similar) in the template, calling `{{ parent() }}` to keep existing content.","citations":["developer/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md:1-322"],"toolCallLog":[{"tool":"Bash","args":"cd docs/shopware-knowledge-bases/developer && find guides -iname \"*page*loaded*\" -not -path \"*/.git/*\"; find guides -iname \"*add-data*\" -not -path \"*/.git/*\""},{"tool":"Read","args":"developer/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-66":{"query":"Which request headers change Admin API behaviour for language, entity version, parent-child inheritance and skipping flow triggers during a bulk import?","category":"dev","option":"fs-docs","answer":"- `sw-language-id`: By default the API returns entities in the system language; set this header to a language ID to get that language's translation instead, e.g. `POST /api/search/product` with header `sw-language-id: be01bd336c204f20ab86eab45bbdbe45`. Note Shopware only populates a translatable field if an explicit translation exists \u2014 if not, the plain field is `null`, so display clients should read `product.translated.[value]` instead.\n- `sw-version-id`: Since entities (e.g. orders) can have multiple versions, the API by default returns only the most recent record. Pass `sw-version-id` (e.g. `POST /api/search/order` with header `sw-version-id: 0fa91ce3e96a4bc2be4bd9ce752c3425`) to tell the API which version to return.\n- `sw-inheritance`: For parent-child entities (e.g. products and their variants), the API by default returns only the record's own data without considering inheritance. Send `sw-inheritance: 1` (e.g. on `POST /api/search/product`) to have the API apply parent-child inheritance.\n- `sw-skip-trigger-flow`: Flows are triggered by events like customer creation; when bulk-importing (e.g. hundreds of thousands of customers via the Sync API) you may not want flows like 'send email on customer creation' to fire. Pass `sw-skip-trigger-flow: 1` (e.g. on `POST /api/_action/sync`) to skip flow triggers during the import.","citations":["developer/guides/development/integrations-api/request-headers.md:12-52"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/request-headers.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-12":{"query":"A spec asks for customer-specific pricing and for a flow that calls an external URL when an order is placed \u2014 before I build either of them, does Shopware already ship them, and what has to be licensed or installed for them to exist in the shop?","category":"func","option":"fs-docs","answer":"Both features already exist as built-in/extension functionality in Shopware and do not need to be built from scratch, but each has a licensing prerequisite. (1) Customer-specific pricing: available from the Shopware Beyond plan via the Shopware Commercial extension. It lets you offer individually calculated prices (list prices, graduated prices, currency-dependent prices) per customer. Creating, reading, updating and deleting the custom prices is only possible via a dedicated API (documented separately) \u2014 there is no store extension to install for this feature and no separate administration module; prices are transferred seamlessly via that API and shown to the customer in the storefront once logged in (reverting to the regular price on logout). Requirements: a Shopware Beyond plan plus the Shopware Commercial extension. (2) Calling an external URL when an order is placed: the Flow Builder (Settings > Automation > Flow Builder) already supports the 'checkout.order.placed' trigger, and the action needed is 'Call URL (Webhook)' under 'Webhook Actions in Flow Builder'. This webhook action lets you call a URL automatically (GET/POST/PUT/PATCH/DELETE) and pass parameters, headers and a body, with optional Basic Auth, as soon as the trigger fires. Requirement: Webhook Actions are available from the Evolve Plan onward and require the Shopware Commercial extension to be installed.","citations":["merchant/content/en/shopware-6/extensions/customer-specific-pricing/v1-0-0-1.md:10-34","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:251-297"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/merchant/content/en/shopware-6/commercial-features; find docs/shopware-knowledge-bases/merchant/content/en -not -path '*/.git/*' -iname '*customer*pric*' -o -iname '*individual*pric*'"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder -maxdepth 2 -not -path '*/.git/*'"},{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/merchant/content/en/shopware-6/features/customer-specific-pricing docs/shopware-knowledge-bases/merchant/content/en/shopware-6/extensions/customer-specific-pricing"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/features/customer-specific-pricing/v1-0-0-0.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/extensions/customer-specific-pricing/v1-0-0-1.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-13":{"query":"There is no event for what I need to change in a core Shopware service \u2014 how do I decorate or replace that service from my plugin?","category":"dev","option":"fs-docs","answer":"Use Symfony service decoration. In your plugin's `services.php`, register the original service and your decorator, then point the decorator's registration at the original service with `->decorate(ExampleService::class)` and pass the inner service via `->args([service('.inner')])`. Shopware services meant for decoration expose an abstract class (with a `getDecorated()` method returning its own type) rather than a PHP interface, so new non-abstract methods can be added later without breaking decorators. Your decorator class extends that abstract class, accepts the original (abstract-typed) service in its constructor, implements `getDecorated()` to return it, and overrides the target method, calling the decorated service first and then adding its own behavior (e.g. `return $this->decoratedService->doSomething() . ' Did something additionally.';`) so it doesn't break the rest of the decoration chain. Always type-hint the abstract class, never the concrete implementation, in constructors, since decorators nest (multiple plugins can each decorate the same service) and a decorator that doesn't call the inner service silently discards the rest of the chain. Prefer a designed extension point (`.pre`/`.post`/`.error` events) over decoration when one exists; use decoration only when there is no extension point and you need to change how an existing service behaves.","citations":["developer/guides/plugins/plugins/services/adjusting-service.md:8-224"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname \"*decorat*\" -not -path '*/.git/*'"},{"tool":"Read","args":"developer/guides/plugins/plugins/services/adjusting-service.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-07":{"query":"How do I import products from a CSV with an import/export profile - column mapping, matching identifiers and a dry run?","category":"func","option":"fs-docs","answer":"Import/Export is found under Settings > Automation > Import/Export. Before importing, the CSV must be UTF-8 encoded, use a semicolon as field separator, and quotation marks as the string separator (native CSV, e.g. produced with Open Office Calc, is recommended since some spreadsheet tools mangle separators/leading zeros). Prices must use a dot as decimal separator (e.g. 5.00), not a comma. Import can only add/overwrite data, not remove it (e.g. it cannot remove an existing sales channel assignment from a product).\n\nIn the Import tab you: (1) Upload CSV file - select the file from your PC; (2) Select profile - choose the import/export profile that determines which CSV columns map to which database tables; (3) Start import - validates all records, imports the error-free ones, and bundles erroneous records into a downloadable CSV; (4) Start dry run - lets you fully test the import without committing it, to catch problems before doing a real (partial) import; (5) Import activity shows a 30-day history of past imports, letting you re-download the source CSV, open the profile used, or download just the erroneous records via the context menu; you can also abort a running import (though already-imported data will remain).\n\nProfiles (Settings > Automation > Import/Export > Profiles tab) determine which database entries are accessed. When creating a new profile (via 'add new profile' or by duplicating/modifying an existing one), you must be on the default system language (set at installation) or import/export will not work. General profile settings: Profile name, Usage (import, export, or both - export-only is not possible for import-only profiles), Object type (e.g. Product, Customer, Categories, Orders, Media - determines which DB tables/columns are accessible), Separator character (default semicolon), Enclosure character, and Import settings ('Create new records' - leave the ID column empty to let the system generate new IDs - and 'Update existing data' to overwrite existing records).\n\nYou can optionally seed a new profile from an existing CSV file (e.g. an export from another store) so its columns are already listed and only need to be assigned to database fields, or you can build mappings from scratch. Column mapping happens in the Mappings section: 'Add new mapping' adds a row where you pick a database entry and the corresponding CSV column name; 'Database mapping' is the actual field<->column CSV-name assignment; 'Required' marks whether the field is mandatory for the import file to be valid; 'Default Value' supplies a fallback value when the CSV cell is empty; 'Position' defines the expected column position in the CSV file; entries can be deleted via context menu. Mandatory fields are auto-added when a new profile is created; for the Product object type these include at minimum id, taxId, productNumber, stock, and name (leave id empty when creating new products so Shopware generates the UUID).\n\nMatching identifiers: historically the import required the record's UUID in each CSV row to match existing entities. The 'Second Unique Identifier' feature (Settings > Import/Export > Profiles > open a profile > Advanced Settings tab) lets you choose a different identifier for matching instead of the UUID - for example, using productNumber instead of the UUID to match/update existing products. You select, per entity in the profile, which identifier field the import should use to match records; note this can misbehave if the chosen identifier is not actually unique in your data (e.g. duplicate product names).","citations":["merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md:12-55","merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md:93-170","merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md:175-202"],"toolCallLog":[{"tool":"Bash","args":"grep -rl -i 'import.*export' docs/shopware-knowledge-bases/merchant/content/en --include=*.md | grep -v '/de/' | sort -u | head -30"},{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/merchant/content/en/shopware-6/shopware-en/settings/importexport/"},{"tool":"Read","args":"docs/shopware-knowledge-bases/merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md (offset default, returned lines 1-235 of 670 total)"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-44":{"query":"After the Vue 3 upgrade my admin plugin broke \u2014 this.$parent resolves to the wrong component and a prop default that calls this.$tc throws. What do I have to change?","category":"dev","option":"fs-docs","answer":"Both issues are documented as known Vue 3 migration issues in Shopware's Vue 3 Upgrade guide (Administration uses Vue 3 from Shopware 6.6 onward). `this.$parent`: it is prone to errors because Vue 3 wraps asynchronous components in an `AsyncWrapperComponent`, which changes the virtual DOM tree compared to Vue 2 \u2014 where a `this.$parent` call worked in Vue 2, in Vue 3 you may need `this.$parent.$parent` instead. The guide recommends avoiding `this.$parent` communication entirely, since it's an anti-pattern, and using services or event communication instead. Prop default with `this.$tc`: prop default functions no longer have access to the component's `this` scope in Vue 3, so you can no longer call `this.$tc` inside a prop default function \u2014 you must use `Shopware.Snippet.tc` instead. The guide also suggests searching your code for `this.$` since it indicates use of Vue's internal API, which is very likely to break (except `this.$tc` itself, when not used in a prop default).","citations":["developer/guides/upgrades-migrations/administration/vue3.md:81-126"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/administration/vue3.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-04":{"query":"What does the Shopware Migration Assistant transfer automatically from Shopware 5, and what has to be mapped by hand before the migration starts?","category":"func","option":"fs-docs","answer":"Automatically migrated data (selectable in the migration data-selection screen) includes: Basic data (Categories, Customer groups, Currencies, Sales channels, Number ranges); Products (Products, Properties, Product options, Product properties, Translations, Cross-selling, Main variant relations); Customers & orders (Customers, Shipping methods, Orders, Order documents); Promotions (Customers, Promotions); SEO URLs (Products, Properties, Product options, Product properties, Translations, Cross-selling, Main variant relations, SEO URLs); Product reviews (Products, Properties, Product options, Product properties, Translations, Cross-selling, Main variant relations, Customers, Reviews); and Media.\n\nData that requires manual mapping during the migration wizard - and must be created in Shopware 6 beforehand - includes: Payment methods, Standard Payment Method, Salutation, Delivery time, and Standard delivery time (plus any additional fields introduced by Shopware 5 extensions you used). This mapping is mandatory; if you reset the migration you cannot re-map the fields (you would have to delete and recreate the migration to map again).\n\nSeparately, some things cannot be transferred at all and must be manually recreated/checked after migration: Shipping costs (must be recreated in Settings > Commerce > Shipping since the shipping cost architecture and Rule Builder integration changed); Payment methods configuration (check under Settings > Commerce > Payment methods and add missing options, since risk management is now Rule-Builder based); Countries (verify under Settings > Localisation > Countries); Documents/document templates (must be reconfigured under Settings > Commerce > Documents); Email templates (Shopware 6 uses Twig, so old templates can't be reused - configure under Settings > Content > Email templates); Shopping worlds/Shop pages (now Shopping Experiences, must be rebuilt under Content > Shopping Experiences, not migratable); and Templates/themes (old Shopware 5 templates cannot be reused due to the new architecture - the default Shopware 6 template can be used as a starting basis). Additionally, migrated main/sub-shops each become their own sales channel, but since two sales channels already exist by default in a fresh Shopware 6 install, you must adjust the domain settings of the new sales channels if migrated data isn't visible on the frontend. B2B Suite data cannot be transferred from Shopware 5 to Shopware 6 at all.","citations":["merchant/content/en/shopware-6/migration-en/what-is-migrated/v1-1-0-0.md:1-187"],"toolCallLog":[{"tool":"Bash","args":"grep -rl -i 'migration assistant' docs/shopware-knowledge-bases/merchant --include=*.md | grep '/en/' | head -20"},{"tool":"Read","args":"docs/shopware-knowledge-bases/merchant/content/en/shopware-6/migration-en/shopware6-Migrationsprocess/v1-1-0-0.md"},{"tool":"Bash","args":"head -20 docs/shopware-knowledge-bases/merchant/content/en/shopware-6/migration-en/Migrationprocess/v1-1-0-0.md; head -20 docs/shopware-knowledge-bases/merchant/content/en/shopware-6/migration-en/index.md; ls docs/shopware-knowledge-bases/merchant/content/en/shopware-6/migration-en/"},{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/merchant/content/en/shopware-6/migration-en/what-is-migrated/; ls docs/shopware-knowledge-bases/merchant/content/en/shopware-6/migration-en/Migrationprocess/"},{"tool":"Read","args":"docs/shopware-knowledge-bases/merchant/content/en/shopware-6/migration-en/what-is-migrated/v1-1-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-18":{"query":"My plugin's cart processor adds a surcharge line item, but it is added again on every recalculation and its price is stale after the customer changes the quantity \u2014 how do I split the work between the collector and the processor?","category":"dev","option":"fs-docs","answer":"The documented division of responsibility is: the collector's `collect()` method is only for fetching/retrieving the data the surcharge needs (from the database, an API, or elsewhere) and storing it in the shared `CartDataCollection` \u2014 it is explicitly not supposed to modify the cart or add line items, and it should skip work it already did (e.g. `if ($data->has($key)) continue;`) so it isn't re-fetched on every calculation. All actual mutation of the cart \u2014 building and adding the surcharge `LineItem`, and computing its price \u2014 belongs in the processor's `process()` method, which always operates on the `$toCalculate` cart parameter (never `$original`), because `$toCalculate` is the cart instance that is rebuilt and actually considered for the final result on every recalculation. In the discount/surcharge example, the processor filters `$toCalculate`'s line items down to the relevant products on every run, and only if matching products are found does it build a fresh `PercentagePriceDefinition`/`QuantityPriceDefinition` from the *current* line item prices/quantities (e.g. `$product->getPrice()->getQuantity()`), recalculates via the injected price calculator (`PercentagePriceCalculator`/`QuantityPriceCalculator`), and adds the freshly built/priced line item \u2014 since the definition and price are rebuilt from the current `$toCalculate` state every single call, a quantity change is automatically reflected and the price cannot go stale. Because `process()` runs on every recalculation and works against the freshly assembled `$toCalculate` cart, adding the surcharge line item there does not itself cause duplicates in the persisted cart (persistence is driven by `$original` on the next cycle); the docs explicitly warn to never query data or perform expensive work in `process()` \u2014 that belongs solely in the collector. Register the class implementing both `CartDataCollectorInterface` and `CartProcessorInterface` in `services.php` with both tags `shopware.cart.processor` and `shopware.cart.collector` (with an appropriate priority, e.g. `4500`, so it runs after the core product collector/processor).","citations":["developer/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md:17-105","developer/guides/plugins/plugins/checkout/cart/add-cart-discounts.md:18-121","developer/guides/plugins/plugins/checkout/cart/change-price-of-item.md:26-258"],"toolCallLog":[{"tool":"Read","args":"developer/guides/plugins/plugins/checkout/cart/add-cart-discounts.md"},{"tool":"Bash","args":"grep -rn \"duplicate|idempot|already exist|getLineItems()->has|remove(\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/cart/*.md"},{"tool":"Read","args":"developer/guides/plugins/plugins/checkout/cart/add-cart-items.md"}],"notFoundClaim":false,"memoryClaims":["The exact mechanics of why re-adding a line item to $toCalculate every process() call does not itself create persisted duplicates (i.e. that $toCalculate is discarded/rebuilt each calculation cycle rather than accumulated) is inferred from the collector/processor pattern shown in the docs rather than stated explicitly as a warning about duplication [from memory]."],"sourceVerdict":"partial"},"dev-48":{"query":"After upgrading, my storefront JavaScript plugin no longer loads \u2014 how do I register it asynchronously with `PluginManager` and where does the compiled file have to be shipped?","category":"dev","option":"fs-docs","answer":"Storefront JavaScript plugins are registered via `window.PluginManager` inside your plugin's `main.js` entry point, which Shopware automatically looks for at `<plugin root>/src/Resources/app/storefront/src/main.js`. For a normal (synchronous) registration you import the plugin class at the top of `main.js` and call `PluginManager.register('ExamplePlugin', ExamplePlugin, '[data-example-plugin]')` (the selector argument is optional and binds the plugin to matching DOM elements). To register it asynchronously, provide a dynamic import instead of a static import directly inside `PluginManager.register()`: `PluginManager.register('ExamplePlugin', () => import('./example-plugin/example-plugin.plugin'), '[data-example-plugin]')`. When a dynamic/async import is given, the PluginManager automatically recognizes the JS plugin as async, which means it will NOT be included in the main bundled `storefront.js`; instead it is only downloaded on demand when the plugin's selector (e.g. `[data-example-plugin]`) is found on the current page. This is useful to reduce the size of initially loaded JavaScript. Regarding shipping the compiled file: your source lives at `<plugin root>/src/Resources/app/storefront/src`, and Shopware compiles the JavaScript and saves it at `<plugin root>/src/Resources/app/storefront/dist/storefront/js/<plugin-name>/<plugin-name>.js` \u2014 these compiled files are recognized automatically by Shopware, and you must make sure to ship the compiled file together with your plugin. To rebuild after changes, run `shopware-cli project storefront-build` (template/project setup) or `composer run build:js:storefront` (platform/contribution setup).","citations":["developer/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md:65-120","developer/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md:240-267"],"toolCallLog":[{"tool":"Bash","args":"grep -rln 'PluginManager' guides/plugins/plugins/storefront/ ; find guides/plugins/plugins/storefront -iname '*javascript*' -o -iname '*plugin*' (cwd docs/shopware-knowledge-bases/developer)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-58":{"query":"My shopware.yaml still uses redis_url \u2014 how do I define the named Redis connections in Shopware 6.7 and which eviction policy does each one need?","category":"dev","option":"fs-docs","answer":"Starting with v6.6.8.0 (carried into 6.7), Shopware supports configuring multiple reusable, named Redis connections in `config/packages/shopware.yaml` under `shopware.redis.connections`, e.g.:\n```yaml\nshopware:\n    redis:\n        connections:\n            ephemeral:\n                dsn: 'redis://host1:port/dbindex'\n            persistent:\n                dsn: 'redis://host2:port/dbindex'\n```\nConnection names should reflect their purpose, be unique, and follow service-naming conventions since they become part of container service names; subsystems then reference connections by name. DSNs may use env vars (e.g. `%env(REDIS_EPHEMERAL)%/1`), and for high-load scenarios you can enable connection pooling by adding `?persistent=1` to the DSN (this affects pooling, not data persistence).\n\nBecause current Redis versions cannot use different eviction policies per database within the same instance, Shopware recommends separate Redis instances per data category, each with its own eviction policy: 1) Ephemeral data (HTTP cache & object cache) \u2014 no durable persistence needed, use eviction policy `volatile-lru` (deletes only expired/TTL'd keys). 2) Durable but 'aging' data (session data) \u2014 should be persisted to disk (RDB/AOF), use eviction policy `allkeys-lru` (discards oldest values first when memory is full). 3) Durable and critical data (cart, number range, lock store, and increment data) \u2014 should be persisted, and because it's critical it must use `volatile-lru` so non-expired data is never evicted.","citations":["developer/guides/hosting/infrastructure/redis.md:8-109"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"redis\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"docs/shopware-knowledge-bases/developer/guides/hosting/infrastructure/redis.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-41":{"query":"`composer update` to Shopware 6.7 aborts on a platform requirement and my admin build then fails too \u2014 which PHP, database and Node versions does 6.7 actually require, and how do I check the machine I am on against them before I retry?","category":"dev","option":"fs-docs","answer":"Shopware's officially supported stack table (in the Hosting guide) lists the required versions: PHP 8.2+ (8.4 recommended) with required extensions ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, openssl, pcre, pdo_mysql, phar, simplexml, xml, xmlreader, zip, zlib, plus memory_limit >= 512M and max_execution_time >= 30s, and Composer 2.2+ recommended; MariaDB >= 10.11.6 or MySQL >= 8.0.22 (Innovation releases not supported), recommended MariaDB 11.4 / MySQL 8.4; and Node.js 20.0.0+ required (Node 24 / npm 10 recommended). To check your machine against these before retrying the composer update, the docs recommend running: `php -v` (CLI PHP version), `php -m` (list PHP modules), `php -i | grep memory_limit` (check memory limit), `composer -V` (Composer version), `node -v` and `npm -v` (Node/npm versions) \u2014 noting that on systems with multiple PHP versions, CLI and FPM may have different php.ini files, so make sure you check the correct binary.","citations":["developer/guides/hosting/index.md:1-52"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"find . -iname '*upgrade*' -not -path '*/.git/*' (cwd docs/shopware-knowledge-bases/developer)"},{"tool":"Bash","args":"ls guides/upgrades-migrations (cwd docs/shopware-knowledge-bases/developer)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/index.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/upgrade-shopware.md"},{"tool":"Bash","args":"grep -rn \"PHP 8\" guides/installation/ ; grep -rln \"requirement\" guides/installation/ (cwd docs/shopware-knowledge-bases/developer)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/installation/system-requirements.md"},{"tool":"Bash","args":"ls guides/hosting; sed -n '1,120p' guides/hosting/index.md (cwd docs/shopware-knowledge-bases/developer)"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-59":{"query":"After upgrading to Shopware 6.7 my Varnish cache is never invalidated \u2014 what changed in the reverse proxy configuration?","category":"dev","option":"fs-docs","answer":"The Redis-based Varnish invalidation method (using LUA scripts to determine URLs for the BAN request) was deprecated from v6.6.x onwards and has been removed entirely in v6.7.0. That method could cause problems depending on setup/network and did not support Redis clusters. As of 6.7 you must use the Varnish `XKey` integration instead: install the Varnish `xkey` module (Varnish 6.0+) and set `use_varnish_xkey: true` together with `enabled: true` and your `hosts` under `shopware.http_cache.reverse_proxy` in `config/packages/shopware.yaml` (also remember the config key itself moved from `storefront.reverse_proxy` to `shopware.http_cache.reverse_proxy` back in Shopware 6.6). If your VCL config still relies on the old Redis/LUA BAN approach, invalidation will silently stop working after upgrading to 6.7 \u2014 switch to the XKey-based VCL (Shopware provides an updated default VCL for 6.7 in its Varnish Docker image). Separately, note that `bin/console cache:clear` also clears the HTTP cache (this was already the behavior before 6.7 per the docs) \u2014 if you only want to clear the reverse-proxy/HTTP cache, use `bin/console cache:clear:http` (available since 6.6.10), and `bin/console cache:clear:all` (since 6.6.8) clears everything including HTTP cache and other kernel cache dirs. The Reverse Proxy Cache and Object Cache share the same invalidation mechanism and tags, so when a product is invalidated both are invalidated together.","citations":["developer/guides/hosting/infrastructure/reverse-http-cache.md:36-124","developer/guides/hosting/infrastructure/reverse-http-cache.md:219-237"],"toolCallLog":[{"tool":"Read","args":"docs/shopware-knowledge-bases/developer/guides/hosting/infrastructure/reverse-http-cache.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-42":{"query":"How do I check extension compatibility before upgrading with shopware-cli, and why does it report my plugins in custom/plugins as blocking?","category":"dev","option":"fs-docs","answer":"Run `shopware-cli project upgrade` (or its non-interactive form `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run` for a read-only preflight). During phase 3 of its six phases it 'analyzes extension compatibility and runs a Composer resolution check', combining extension/repository metadata (an early compatibility signal) with an actual Composer dry run that verifies whether the target dependency set can be resolved; the extension queue then sorts extensions into ready, needs update, needs manual review, or blocks the upgrade, and results are written to a shareable Markdown report at `.shopware-cli/upgrade/report.md`. You should also run `shopware-cli project validate` beforehand to surface references to removed/renamed Shopware PHP types in your custom code. Plugins under `custom/plugins` are reported as blocking because the upgrade wizard resolves and pins extension versions through Composer, and extensions living outside `vendor/` (e.g. in custom/plugins) cannot participate in that Composer resolution \u2014 so they block the upgrade readiness check. The fix is to migrate eligible locally managed extensions into Composer first, using `shopware-cli project autofix composer-plugins`.","citations":["developer/products/tools/cli/project-commands/upgrade.md:15-71"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"extension.*compat|compat.*extension\" products/tools/cli/ ; find products/tools/cli -iname '*extension*' -not -path '*/.git/*' (cwd docs/shopware-knowledge-bases/developer)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/tools/cli/project-commands/upgrade.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-67":{"query":"What does a minimal app folder and `manifest.xml` need to contain, and which console commands install and activate the app on my local Shopware 6.7?","category":"dev","option":"fs-docs","answer":"A Shopware app lives in its own folder under `custom/apps/<AppName>` (technical name in UpperCamelCase, e.g. `MyExampleApp`), containing at minimum a `manifest.xml`:\n```text\ncustom/apps/MyExampleApp/manifest.xml\n```\nThe folder name and the `<meta><name>` value in `manifest.xml` must match. A typical minimal meta block is:\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<manifest xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:noNamespaceSchemaLocation=\"https://raw.githubusercontent.com/shopware/shopware/trunk/src/Core/Framework/App/Manifest/Schema/manifest-3.0.xsd\">\n    <meta>\n        <name>MyExampleApp<\/name>\n        <label>Label<\/label>\n        <label lang=\"de-DE\">Name<\/label>\n        <description>A description<\/description>\n        <description lang=\"de-DE\">Eine Beschreibung<\/description>\n        <author>Your Company Ltd.<\/author>\n        <copyright>(c) by Your Company Ltd.<\/copyright>\n        <version>1.0.0<\/version>\n        <icon>Resources/config/plugin.png<\/icon>\n        <license>MIT<\/license>\n    <\/meta>\n<\/manifest>\n```\n`<author>` and `<copyright>` are required \u2014 if missing or empty, `bin/console app:refresh` fails.\n\nCLI steps to install/activate (run from the project root inside the PHP container):\n1. `bin/console app:refresh` \u2014 refresh the app registry so Shopware discovers the new folder under `custom/apps`.\n2. `bin/console app:install --activate MyExampleApp` \u2014 install the app by its technical name (`<meta><name>`), and activate it in one step. Without `--activate`, it installs inactive; activate later via Administration (Extensions \u2192 My Extensions \u2192 Apps) or `bin/console app:activate MyExampleApp`.\n3. `bin/console app:list` \u2014 check the current app list if it doesn't appear as expected.\n4. `bin/console cache:clear` (and if needed `cache:clear:http` or `cache:clear:all`) \u2014 clear cache after activation for changes to take effect.\n\nApps are validated during installation; use `--no-validate` with `app:install` to skip validation while debugging, or `bin/console app:validate` to identify configuration issues.","citations":["developer/guides/plugins/apps/app-base-guide.md:8-120"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"manifest.xml\" docs/shopware-knowledge-bases/developer --include=*.md | head -20"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/apps/app-base-guide.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-11":{"query":"How do I create an integration for Admin API access in the administration and give it the right privileges?","category":"func","option":"fs-docs","answer":"Integrations let you create permissions to access the Admin API in order to connect third-party systems to Shopware. Go to Settings > System > Integrations and click 'Create integration'. Assign a name to the integration, then decide whether it should have the permissions of the administrator, or instead select another role from the dropdown (roles are defined under Settings > System > Users > Roles) to grant more restricted privileges. After saving, you receive an access ID and a security key; the security key is shown only once at creation time, so it must be saved immediately. Created integrations are listed in an overview showing their name and permissions, and can be opened by clicking the name, or edited/deleted via the context menu. When editing an integration later, the security key is no longer shown for security reasons, but both the access ID and security key can be regenerated via 'Regenerate API access key' (regenerating changes both values).","citations":["merchant/content/en/shopware-6/settings/system/integrationen/v1-1-0.md:10-35"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en -not -path '*/.git/*' -iname '*integration*'"},{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/system/integrationen"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/system/integrationen/v1-1-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-03":{"query":"Where do the `#[ORM\\Entity]` mapping attributes for my plugin's entity go in Shopware 6, and how do I get Doctrine's `EntityManager` injected into my service so I can persist it?","category":"edge","option":"fs-docs","answer":"The premise does not match Shopware 6. The developer docs explicitly state: 'In contrast to most Symfony applications, Shopware uses no ORM, but a thin abstraction layer called the data abstraction layer (DAL).' The DAL lets developers access the database via pre-defined interfaces, and while some of its concepts (like Criteria) may look familiar if you know Doctrine or other ORMs, Doctrine itself is not used. There is therefore no `#[ORM\\Entity]` attribute mapping location and no Doctrine `EntityManager` to inject in Shopware 6 plugin development \u2014 instead, entities are defined via the DAL's own entity/entity-definition classes and persisted through an `EntityRepository`, which is 'used to interact with the DAL' for CRUD operations.","citations":["developer/concepts/framework/data-abstraction-layer.md:8-30"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"EntityManager\\|ORM\\\\Entity\\|doctrine\" docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"grep -n -i \"doctrine\\|ORM\\|EntityManager\" docs/shopware-knowledge-bases/developer/concepts/framework/data-abstraction-layer.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/concepts/framework/data-abstraction-layer.md, limit=30"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"dev-05":{"query":"How does theme inheritance work in Shopware \u2014 theme.json and SCSS overrides?","category":"dev","option":"fs-docs","answer":"Theme inheritance is configured in `theme.json` (located at `<plugin root>/src/Resources/theme.json`), which has `views`, `style`, `script`, `asset`, and optionally `configInheritance` arrays. Every theme inherits the default Shopware theme `@Storefront` by default (present as an entry in these arrays). To inherit from another custom theme (e.g. a base theme `SwagBasicExampleTheme`), add its placeholder `@SwagBasicExampleTheme` into the inheritance chain of each section. In `views`, order matters: the Storefront template is rendered first as the basis, then plugin extensions, then the parent theme's (`@SwagBasicExampleTheme`) changes, and finally the current theme's own changes are applied last. `script` works the same way \u2014 Storefront JS is the basis, then the parent theme's JS extensions, then the current theme's JS. `style` (SCSS) behaves similarly, but with one difference: `overrides.scss` is placed at the very top of the style list (before `@Storefront`/parent theme entries) because it needs to affect SCSS variables such as `$border-radius` before the rest of the styles compile using them. `asset` needs the parent theme placeholder added explicitly if you want to reuse its assets. `configInheritance` defines which theme's field configuration values are inherited \u2014 the last theme in that list that differs from the current theme becomes the parent for config purposes; the Storefront theme configuration is always inherited even without an explicit `configInheritance` entry.","citations":["developer/guides/plugins/themes/inheritance/add-theme-inheritance.md:8-123"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/plugins/themes/inheritance/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/themes/inheritance/add-theme-inheritance.md"},{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/plugins/themes/styling/"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-35":{"query":"How do I load entities from the Admin API inside an Administration component using the repository factory and a Criteria?","category":"dev","option":"fs-docs","answer":"Inject the `repositoryFactory` service into your component via `inject: ['repositoryFactory']` (it is provided through the BottleJS DI container wired into Vue's inject/provide). Create a repository for a specific entity with `this.repositoryFactory.create('product')` (optionally passing a source route as the second argument for nested/associated collections, and an options object such as `{ version: 1 }` as the third argument to pin an API version). Build a search request with `const { Criteria } = Shopware.Data; const criteria = new Criteria();` and configure it with methods like `setPage()`, `setLimit()`, `setTerm()`, `setIds()`, `setTotalCountMode()`, `addFilter(Criteria.equals('product.active', true))`, `addSorting(Criteria.sort('product.name', 'DESC'))`, `addAggregation(...)`, and `getAssociation('categories').addSorting(...)` for nested associations. Then call `this.productRepository.search(criteria, Shopware.Context.api).then(result => { this.result = result; })` \u2014 every repository method requires both the API context (`Shopware.Context.api`) and, where relevant, the criteria object. To fetch a single known entity instead of a search, use `this.productRepository.get(entityId, Shopware.Context.api)` (a Criteria can optionally be passed as a third argument to also load associations, e.g. `.get(entityId, Shopware.Context.api, this.productCriteria)`). Associations are added to the Criteria with `.addAssociation('manufacturer')` etc. so that ManyToOne/ManyToMany/OneToMany relations are populated on the returned entity.","citations":["developer/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md:1-163"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/data-handling-processing/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-05":{"query":"My plugin decorates `CachedProductRoute` to add cache tags \u2014 where did the `Cached*Route` classes go in Shopware 6.7 and how do I cache a Store API route now?","category":"gap","option":"fs-docs","answer":"The corpus does not explicitly say 'CachedProductRoute was removed,' but its ADR 'Caching Strategy for Store API' (developer/resources/references/adr/2025-09-15-store-api-cache-strategy.md) documents the replacement mechanism: Store API responses were previously not cached by default at all, and Storefront's existing caching worked by marking a route with the `'_httpCache' => true` route-default attribute, which `CacheResponseSubscriber` picks up to add a `Cache-Control` header \u2014 this decorator-per-route (`Cached*Route`) pattern used cookies to differentiate context. The new decision (point 4, 'Mark cacheable routes') is to reuse the same `_httpCache` route-default attribute and extend `CacheResponseSubscriber` to add `Cache-Control` headers to Store API responses too, but using request headers (`sw-currency-id`, `sw-language-id`, `sw-context-hash`) plus a `Vary` header instead of cookies to differentiate cache buckets (point 3), with invalidation still handled via the existing cache-tags mechanism (point 5). Under 'Consequences \u2192 Extensions' it explicitly states: 'Custom Store API endpoints can opt into caching using the same route flags' \u2014 i.e. you no longer need a `Cached*Route` decorator class; you mark your route cacheable via the `_httpCache` route default (the same flag documented for Storefront controllers in `developer/guides/plugins/plugins/storefront/advanced/add-caching-to-custom-controller.md`, where setting `defaults: ['_httpCache' => true]` on the `#[Route]` attribute lets the core handle caching, and cache-tag based invalidation is inherited from the underlying Store API tags) and let the framework generate cache tags for you rather than decorating a `Cached*Route` class to add them manually.","citations":["developer/resources/references/adr/2025-09-15-store-api-cache-strategy.md:15-91","developer/guides/plugins/plugins/storefront/advanced/add-caching-to-custom-controller.md:16-58"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"CachedProductRoute|Cached.*Route|cache.*store api route\" docs/shopware-knowledge-bases/developer --include=*.md -i"},{"tool":"Read","args":"developer/resources/references/adr/2025-09-15-store-api-cache-strategy.md"},{"tool":"Read","args":"developer/guides/plugins/plugins/storefront/advanced/add-caching-to-custom-controller.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"dev-14":{"query":"I wrote a subscriber class in my plugin but it never fires \u2014 which interface and which service tag (`shopware.event_subscriber`?) register it?","category":"dev","option":"fs-docs","answer":"Your subscriber class must implement Symfony's `EventSubscriberInterface` (`Symfony\\Component\\EventDispatcher\\EventSubscriberInterface`) and define a static `getSubscribedEvents()` method mapping event names to handler methods. However, implementing the interface alone is not enough \u2014 the class must also be registered as a service in your plugin's `services.php` (at `src/Resources/config/services.php`) and tagged with `kernel.event_subscriber` (not `shopware.event_subscriber`), e.g. `$services->set(MySubscriber::class)->tag('kernel.event_subscriber');`. If the class is missing from `services.php` or missing that tag, Shopware never calls it and there is no obvious error indicating the event was not handled \u2014 which matches the symptom in the question.","citations":["developer/guides/plugins/plugins/framework/event/listening-to-events.md:41-145"],"toolCallLog":[{"tool":"Read","args":"developer/guides/plugins/plugins/framework/event/listening-to-events.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-47":{"query":"My payment plugin implements `AsynchronousPaymentHandlerInterface` and is tagged `shopware.payment.method.async` \u2014 how do I write a payment handler for Shopware 6.7 instead?","category":"dev","option":"fs-docs","answer":"From Shopware 6.7.0.0, payment handling is done with a single `AbstractPaymentHandler` class rather than the old per-interface model. The docs' migration table maps the old interfaces to the new abstract class methods: `SynchronousPaymentHandlerInterface` -> `pay` (always called during checkout); `AsynchronousPaymentHandlerInterface` -> `finalize` (only called if `pay` returns a `RedirectResponse`); `PreparedPaymentHandlerInterface` -> `validate` (always called, can validate a cart during checkout); `RecurringPaymentHandlerInterface` -> `recurring` (guarded by `supports()` returning true for `PaymentHandlerType::RECURRING`); `RefundPaymentHandlerInterface` -> `refund` (guarded by `PaymentHandlerType::REFUND`). Instead of implementing `PaymentHandlerInterface` variants, extend `Shopware\\Core\\Checkout\\Payment\\Cart\\PaymentHandler\\AbstractPaymentHandler` and implement `supports(PaymentHandlerType $type, string $paymentMethodId, Context $context): bool` plus `pay(Request $request, PaymentTransactionStruct $transaction, Context $context, ?Struct $validateStruct): ?RedirectResponse` (and `finalize` if async). For a redirect-based (asynchronous) flow, `pay` must return a `RedirectResponse` after e.g. sending a return URL to the external gateway, throwing `PaymentException::asyncProcessInterrupted(...)` on failure, and you implement `finalize` to check the payment state after the customer returns. On the service definition side, remove the old tags `shopware.payment.method.sync`, `shopware.payment.method.async`, `shopware.payment.method.prepared`, `shopware.payment.method.recurring`, `shopware.payment.method.refund` and register your handler with a single tag: `->tag('shopware.payment.method')`.","citations":["developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:1-56","developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:146-200","developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:795-839"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"AsynchronousPaymentHandlerInterface\" . --include=*.md -l | grep -v .git (cwd docs/shopware-knowledge-bases/developer)"},{"tool":"Bash","args":"grep -rln \"PaymentHandlerInterface\\b\" . --include=*.md | grep -v .git; grep -rn \"shopware.payment.method\" . --include=*.md | grep -v .git (cwd docs/shopware-knowledge-bases/developer)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md, offset=1, limit=60"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md, offset=60, limit=140"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md, offset=795, limit=45"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-24":{"query":"How do I get readable SEO URLs generated for the detail pages of my plugin's own entity?","category":"dev","option":"fs-docs","answer":"Use Shopware's dynamic SEO URLs for entities feature: 1) Create a class implementing `SeoUrlRouteInterface` (e.g. `ExamplePageSeoUrlRoute`) with `getConfig()` returning a `SeoUrlRouteConfig` (entity definition, route name constant, a default SEO template like `{{ example.name }}`, and a canonical flag), `prepareCriteria()` to narrow/extend the entities fetched (e.g. only active ones, or add associations), and `getMapping()` returning a `SeoUrlMapping` built from the entity's ID and the data needed by the SEO template. Register this class in `services.php` tagged `shopware.seo_url.route`. 2) Add an event subscriber that listens to your entity's `<entity_name>.written` (and `.deleted`) DAL events and calls `SeoUrlUpdater::update($routeName, $event->getIds())` so a SEO URL is (re)generated whenever an entity of that type is written, and marked deleted (`is_deleted` set) when the entity is removed. 3) Add a plugin migration that inserts a row into the `seo_url_template` table with `route_name` (from your route class constant), `entity_name` (your entity's technical name), and `template` (the DEFAULT_TEMPLATE constant) \u2014 this is required for the `SeoUrlUpdater` to work. After this, every write to your entity automatically generates the corresponding `seo_url` entry. For content that is not a DAL entity (e.g. external data), instead use `SeoUrlPersister::updateSeoUrls()` directly with an array of URL definitions (salesChannelId, foreignKey, routeName, pathInfo, isCanonical, seoPathInfo).","citations":["developer/guides/plugins/plugins/content/seo/add-custom-seo-url.md:150-408"],"toolCallLog":[{"tool":"Bash","args":"cd docs/shopware-knowledge-bases/developer && find guides -iname \"*seo*\" -not -path \"*/.git/*\""},{"tool":"Read","args":"developer/guides/plugins/plugins/content/seo/add-custom-seo-url.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-06":{"query":"How do I create a shipping method from my plugin's installer or migration, including the `technicalName` that 6.7 requires?","category":"gap","option":"fs-docs","answer":"The corpus contains no dedicated 'add shipping method' plugin guide, but two sources together give the answer. The ADR 'Introduction of Unique Identifiers for Checkout Methods' (developer/resources/references/adr/2023-10-17-add-unique-identifiers-for-checkout-methods.md) confirms that a new `technicalName` property was added to both `payment_method` and `shipping_method` entities as a unique identifier; it is optional pre-6.7 for backward compatibility but 'Starting from version 6.7.0.0, this `technicalName` field will also become required within the database and the API,' with a unique index enforcing uniqueness \u2014 Shopware's own default shipping methods were migrated to `shipping_standard` and `shipping_express`, and app-provided shipping methods get an auto-generated `shipping_<AppName>_<identifier>` value. The installer pattern itself is documented for payment methods in developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md (the same approach applies to shipping, only swapping `payment_method.repository` for `shipping_method.repository`): in the plugin's `install()` lifecycle method, check whether the method already exists (e.g. via a `Criteria`/`EqualsFilter` search on the repository), and if not, fetch the plugin id via `PluginIdProvider::getPluginIdByBaseClass()` and call `$repository->create([...], $context)` with a data array that must include a `technicalName` key \u2014 the guide's example uses `'technicalName' => 'swag_example-example_payment'` and explicitly warns: 'The `technicalName` is required for plugin-provided payment methods starting with Shopware 6.7 ... It must be unique and should use a plugin-specific prefix. Older versions may allow the field to be omitted ... An omitted technical name can prevent the plugin from being installed or activated, depending on where it is validated.' On `uninstall()`, the guide recommends only deactivating the method (setting `active` to `false` via `update()`), not deleting it, to avoid breaking data consistency for existing orders.","citations":["developer/resources/references/adr/2023-10-17-add-unique-identifiers-for-checkout-methods.md:15-52","developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:660-779"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"shipping.method|ShippingMethod\" docs/shopware-knowledge-bases/developer --include=*.md -i"},{"tool":"Bash","args":"grep -rln \"technicalName\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"developer/resources/references/adr/2023-10-17-add-unique-identifiers-for-checkout-methods.md"},{"tool":"Bash","args":"grep -n \"technicalName\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"},{"tool":"Read","args":"developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md (offset 660, limit 120)"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"edge-07":{"query":"How do I set up Shopware PWA as the storefront for a Shopware 6.7 shop?","category":"edge","option":"fs-docs","answer":"No documentation for 'Shopware PWA' was found in this corpus. A case-insensitive search for 'PWA' and 'shopware pwa'/'shopware-pwa' across the developer docs returned no relevant setup pages (only unrelated incidental matches in a wordlist and an Elasticsearch guide). The corpus's current headless-frontend documentation is instead built around 'Composable Frontends,' found under developer/products/paas/shopware/composable-frontends and developer/products/paas/shopware-paas/composable-frontends, which the Store API page describes as Shopware's own headless frontend implementation based on the Store API. This suggests that the community 'Shopware PWA' project (a separate, third-party Vue Storefront-based project) is not documented in this corpus, and Shopware's own recommended headless storefront path is Composable Frontends rather than Shopware PWA \u2014 but no page confirming or setting up Shopware PWA itself exists in this corpus.","citations":["developer/concepts/api/store-api.md:14-17"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"shopware pwa\\|shopware-pwa\" docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"grep -ril \"PWA\\b\" docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -not -path '*/.git/*' -iname '*frontend*'"}],"notFoundClaim":true,"memoryClaims":["Shopware PWA is a separate community project (based on Vue Storefront) distinct from Shopware's own Composable Frontends product [from memory]"],"sourceVerdict":"no"},"dev-17":{"query":"How do I overwrite the price of a product line item in the cart at runtime from a plugin?","category":"dev","option":"fs-docs","answer":"Use a cart collector plus a cart processor (a dedicated 'Change Price of Items in Cart' guide covers exactly this). The collector implements `Shopware\\Core\\Checkout\\Cart\\CartDataCollectorInterface::collect()`: it filters the `$original` cart's line items to type `LineItem::PRODUCT_LINE_ITEM_TYPE`, fetches/derives the new price for each product (your own logic \u2014 e.g. an entity extension or external API), and stores it in the shared `CartDataCollection $data` keyed by a prefixed product/line-item id, skipping ids already present so the same price isn't refetched on every recalculation. The processor implements `CartProcessorInterface::process()` (often the same class implementing both interfaces) and is injected with `Shopware\\Core\\Checkout\\Cart\\Price\\QuantityPriceCalculator`. In `process()`, it iterates the product line items of `$toCalculate` (not `$original` \u2014 `$toCalculate` is the cart instance that is actually considered for the result), looks up the new price from `$data` by key, builds a `QuantityPriceDefinition($newPrice, $product->getPrice()->getTaxRules(), $product->getPrice()->getQuantity())`, calculates it via `$this->calculator->calculate($definition, $context)`, then calls `$product->setPrice($calculated)` and `$product->setPriceDefinition($definition)`. Finally, register the class in `services.php` tagged with both `shopware.cart.processor` and `shopware.cart.collector` (e.g. with `priority => 4500` to run after the core product processor/collector). Never query the database or an API inside `process()` \u2014 that must happen in `collect()`. The docs also warn this direct price-overwrite technique should be used sparingly (e.g. for live-shopping scenarios); for discounts/surcharges, a `PercentagePriceDefinition`/discount line item via a processor is recommended instead.","citations":["developer/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md:17-105","developer/guides/plugins/plugins/checkout/cart/change-price-of-item.md:12-289"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout -maxdepth 2 -iname \"*cart*\""},{"tool":"Read","args":"developer/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md"},{"tool":"Read","args":"developer/guides/plugins/plugins/checkout/cart/change-price-of-item.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-08":{"query":"Which service do I type-hint to read products \u2014 `EntityRepositoryInterface` \u2014 and how do I inject it into my plugin service?","category":"edge","option":"fs-docs","answer":"The current docs do not use `EntityRepositoryInterface` at all \u2014 the type-hint shown is the concrete `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository` class. To read products in a plugin service: register the service in `services.php` (or XML) and pass the DAL repository as a constructor argument using the service id pattern `entity_name.repository`, i.e. `product.repository` for products (`service('product.repository')`). In the class, type-hint the constructor parameter as `EntityRepository $productRepository` (import `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository`) and store it on a property. You can then call `$this->productRepository->search(new Criteria(), $context)` to fetch products, optionally adding filters (e.g. `EqualsFilter`), associations, aggregations, sorting/paging via the `Criteria` object. For other entities, swap the repository id, e.g. `order.repository`.","citations":["developer/guides/plugins/plugins/framework/data-handling/reading-data.md:20-89"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/index.md docs/shopware-knowledge-bases/merchant/index.md"},{"tool":"Bash","args":"grep -ril \"EntityRepositoryInterface\\|EntityRepository\" docs/shopware-knowledge-bases/developer --include=*.md | grep -i \"reading\\|repository\\|data\\|dal\""},{"tool":"Read","args":"developer/guides/plugins/plugins/framework/data-handling/reading-data.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"dev-33":{"query":"How do I register a custom Administration module from my plugin, and what has to line up for it to actually show up after a build?","category":"dev","option":"fs-docs","answer":"Create a directory `<plugin root>/src/Resources/app/administration/src/module/swag-example` with an `index.js` file inside (Shopware auto-requires an index.js per module). Import that module directory from your plugin's `main.js` entry point (`import './module/swag-example';`), otherwise the module code is never executed. Inside `index.js`, call `Shopware.Module.register('swag-example', { ... })` (not the internal ModuleFactory.registerModule directly), passing a configuration object with: a `type` of `'plugin'` (as opposed to core's `'core'`, this is convention not enforced), a unique `name`, a `title`/`description` (ideally snippet keys), a `color` and `icon` used for the module's accents (note: this icon is NOT the menu-entry icon, that's configured separately), a `routes` object defining routes such as list/detail/create pointing at your Vue components, and a `navigation` array (or `settingsItem` if linking into the Settings module, with `group` one of 'shop'/'system'/'plugins', `icon`, and `to` pointing at a route name) to actually create the menu entry. Add a `snippets` object (or import snippet json files from a `snippet/de-DE.json` and `snippet/en-GB.json`) so translation keys used in title/description/labels resolve instead of printing raw keys. Finally, build the Administration bundle \u2014 with the plugin activated \u2014 via `shopware-cli project admin-build` (or, in the platform contribution setup, `composer run build:js:admin`); this minifies main.js into `<plugin root>/src/Resources/public/administration/js/<plugin-name>.js`, which must be included when publishing the plugin so it gets copied to `public/bundles/administration/<pluginname>/administration/js/...` and loaded in production. The docs stress that a successful build is only the build boundary \u2014 the module still depends on its entry-point import, `Shopware.Module.register()` call, its routes/components, and its snippets all being correctly wired at runtime for the module to actually appear and work.","citations":["developer/guides/plugins/plugins/administration/module-component-management/add-custom-module.md:1-319"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/module-component-management/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/module-component-management/add-custom-module.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-54":{"query":"How do I register a plugin cookie in the storefront cookie consent manager in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Adding a custom cookie requires listening to the `CookieGroupCollectEvent` and adding the cookie to the event's cookie group collection. First register an event listener in `services.php`, tagging it with `kernel.event_listener` for `Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent`. Then implement a listener class with an `__invoke(CookieGroupCollectEvent $event)` method: get the target cookie group from `$event->cookieGroupCollection` (e.g. via `CookieProvider::SNIPPET_NAME_COOKIE_GROUP_COMFORT_FEATURES`), get or create its `CookieEntryCollection` via `getEntries()`/`setEntries()`, then build a `new CookieEntry('my-cookie-key')` and set `name`, `value`, and `expiration` on it before adding it to the entries collection. Since Shopware 6.7.3.0 cookies use structured objects `CookieEntry` and `CookieGroup` instead of arrays (the array format via the old `CookieProviderInterface` is deprecated but still works for backward compatibility). Also note that since 6.7.3.0 cookie configurations include a change-tracking hash (stored in the `cookie-config-hash` browser cookie, keyed per language) that automatically triggers browser re-consent when a plugin's cookie configuration changes.","citations":["developer/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md:8-124"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"cookie\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-01":{"query":"How do I extend the product entity with a new association in Shopware's Data Abstraction Layer?","category":"dev","option":"fs-docs","answer":"To add a new association to the product entity, create an EntityExtension class in `<plugin root>/src/Extension/Content/Product/` (e.g. `CustomExtension`) that extends `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityExtension`, implement `getDefinitionClass()` to return `ProductDefinition::class`, and override `extendFields(FieldCollection $collection)` to add the association field, e.g. a `OneToOneAssociationField('exampleExtension', 'id', 'product_id', ExampleExtensionDefinition::class, true)` (params: propertyName, storageName, referenceField, referenceClass, autoload). If the association points to a new custom entity backed by its own table (e.g. `ExampleExtensionDefinition` with a `FkField('product_id', 'productId', ProductDefinition::class)` and the inverse `OneToOneAssociationField` back to product), you must also register the extension and the new definition in `services.php` tagged with `shopware.entity.extension` and `shopware.entity.definition`, and add a database migration creating the new table with a foreign key to `product` (including `product_version_id` if the entity is versioned). Setting `autoload=true` should only be done on the `EntityExtension` side, never simultaneously on both `EntityExtension` and `EntityDefinition`, to avoid recursion/out-of-memory errors. Once set up, you write to the association simply via the product repository, e.g. `$this->productRepository->upsert([['id' => $id, 'exampleExtension' => ['customString' => 'foo bar']]], $context)`. For fields that don't need persistence, you can instead subscribe to `ProductEvents::PRODUCT_LOADED_EVENT` and call `$productEntity->addExtension('custom_string', new ArrayEntity([...]))`. Since Shopware 6.6.10.0, a `BulkEntityExtension` can be used to extend multiple entities (including product) at once via a `collect()` generator, registered with tag `shopware.bulk.entity.extension`. General association types (OneToOne, OneToMany/ManyToOne, ManyToMany) for any entities, including the required FkField/mapping-definition patterns, are documented separately.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md:20-201","developer/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md:327-367","developer/guides/plugins/plugins/framework/data-handling/add-data-associations.md:94-288"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides -maxdepth 3 -type d -not -path '*/.git/*'"},{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/ ; ls docs/shopware-knowledge-bases/developer/guides/plugins/plugins/database/"},{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/ ; ls .../store-api/ ; ls .../extension/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/add-data-associations.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-57":{"query":"B2B Suite support ends with 6.8 \u2014 how do I run the B2B Suite Migration to B2B Components and check that it finished?","category":"dev","option":"fs-docs","answer":"B2B Suite will no longer be supported starting with Shopware 6.8, so migration should be planned promptly using the B2B Suite Migration extension, which migrates data from B2B Suite to B2B Components/Commercial. Two console commands are used, ideally run simultaneously in separate terminals: `bin/console b2b:migrate:commercial` starts the migration, transferring all components/entities per the configuration; you can restrict it to specific components by naming them (matching the configurator's technical name), e.g. `bin/console b2b:migrate:commercial quote_management shopping_list` \u2014 note `employee_management` is always migrated first regardless of order since it's a prerequisite for all other components, and migration order is otherwise governed by configurator priority in the service definition. You can also tune batch size with `--batch-size=100` to manage memory/performance. Because the command uses the message queue to process migration in the background, the command returning does not mean migration is done. To check status/completion, run `bin/console b2b:migrate:progress` (optionally with `--watch` to auto-refresh every 5 seconds) in a separate terminal; it shows a table with Total, Valid, Newly, Migrated, Pending, and Error record counts plus a Status column whose values are `Complete`, `Pending`, `In progress`, `Complete with error` (check the `b2b_components_migration_errors` table), or `Has new records`. Migration is finished once every component shows `Complete`. Note: for Budget Management specifically, the Organization Unit of each budget is empty after migration and must be manually reassigned afterward.","citations":["developer/products/extensions/b2b-suite-migration/index.md:1-23","developer/products/extensions/b2b-suite-migration/execution/running-migration.md:8-101"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"B2B Suite|b2b-suite|B2B Components\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"docs/shopware-knowledge-bases/developer/products/extensions/b2b-suite-migration/index.md"},{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/products/extensions/b2b-suite-migration/execution/"},{"tool":"Read","args":"docs/shopware-knowledge-bases/developer/products/extensions/b2b-suite-migration/execution/running-migration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-53":{"query":"My theme config labels disappeared from the Theme Manager after 6.7 \u2014 how do I define `theme.json` config fields and where do their translations go now?","category":"dev","option":"fs-docs","answer":"Theme config fields are still defined in `theme.json`'s `config.fields` object (each field's key is its technical name), and each field can take parameters like `type` (color, text, number, fontFamily, media, checkbox, switch, url), `editable`, `tab`, `block`, `section`, `custom`, `scss`, and `fullWidth`. However, as of v6.7.1.0 the inline `label` and `helpText` translation arrays on fields/blocks/sections/tabs (e.g. `\"label\": {\"en-GB\": \"...\", \"de-DE\": \"...\"}`) are deprecated for v6.8 \u2014 'Translations are now handled via Administration snippets.' Since theme.config translations are only used by the Theme Manager in the administration, translations must now be stored as snippet keys in Administration snippet files, e.g. `<plugin root>/src/Resources/app/administration/src/app/snippet/de.json` and `.../en.json` (locale-specific files like `de-DE.json`/`en-GB.json` are also supported and override the base language files). Each key follows the pattern `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.<fieldName>.label` (or `.helpText` for fields, or `.<index>.label` for field options), using `default` for any unnamed tab/block/section. After changing theme.json you must run `bin/console theme:refresh` to apply it.","citations":["developer/guides/plugins/themes/configuration/theme-configuration.md:207-322"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"theme.json|Theme Manager\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"docs/shopware-knowledge-bases/developer/guides/plugins/themes/configuration/theme-configuration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-62":{"query":"I changed a setting in `.env` on a deployed 6.7 shop but it still behaves the old way \u2014 what takes precedence between `.env`, `.env.local` and the real environment variables, and which settings does Shopware not read from `.env` at all?","category":"dev","option":"fs-docs","answer":"The corpus does not contain an explicit statement of the `.env` vs `.env.local` vs real-environment-variable precedence order for Shopware \u2014 that ordering (real environment variables override `.env.local`, which overrides `.env`) is standard Symfony Dotenv behavior [from memory], not something this fs-docs corpus documents directly. What the corpus does establish is the broader configuration model: Shopware configuration can come from database-backed system configuration (changeable in the Administration/Admin API/app code), static system configuration in `config/packages/*.yaml` under `shopware.system_config`, Symfony/bundle configuration in `config/packages/*.yaml`, or environment variables (`.env`, `.env.local`, server/container environment). Static system configuration is described as 'an overlay on top of database-loaded system configuration' \u2014 'If the same key is configured in both places, the value from `config/packages` wins and the setting can no longer be changed in the Administration.' This means settings can also be locked down so the Administration UI can't change them, and conversely, some settings that live purely in the database-backed system configuration (changed via Administration) are not sourced from `.env` at all \u2014 for example the documented Environment Variables reference notes that `MAILER_DSN` from `.env` is a fallback because 'Admin Configuration overwrites this'. So concretely: a `.env` change can appear to have no effect if (a) a `config/packages/*.yaml` static system config overlay already fixes that key (it always wins over both database and presumably env-derived values), or (b) the setting in question is actually database-backed system configuration (e.g. mailer settings) that the Administration UI has already overwritten, in which case `.env` only provides the initial/fallback value.","citations":["developer/guides/hosting/configurations/shopware/index.md:14-30","developer/guides/hosting/configurations/shopware/static-system-config.md:8-58","developer/guides/hosting/configurations/shopware/environment-variables.md:38-38"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"\\.env\\.local|env_local|environment variable\" docs/shopware-knowledge-bases/developer --include=*.md | xargs grep -l \"precedence|override|takes precedence\""},{"tool":"Bash","args":"grep -n \"\\.env\\.local|real environment variables|APP_ENV=dev|precedence\" docs/shopware-knowledge-bases/developer/guides/hosting/configurations/shopware/*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/configurations/shopware/index.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/configurations/shopware/static-system-config.md"},{"tool":"Bash","args":"grep -rn \"\\.env\\.local\" docs/shopware-knowledge-bases/developer/guides/installation/*.md docs/shopware-knowledge-bases/developer/guides/installation/legacy-setups/*.md"},{"tool":"Bash","args":"grep -rln \"\\.env\" docs/shopware-knowledge-bases/developer/guides/installation/*.md"},{"tool":"Bash","args":"grep -n \"\\.env\" docs/shopware-knowledge-bases/developer/guides/installation/project-overview.md"}],"notFoundClaim":true,"memoryClaims":["Real environment variables override `.env.local`, which overrides `.env` \u2014 this is standard Symfony Dotenv precedence behavior."],"sourceVerdict":"partial"},"dev-51":{"query":"Custom entities declared in `Resources/config/entities.xml` no longer work for my plugin in Shopware 6.7 \u2014 how do I define and register a DAL entity with PHP attributes instead?","category":"dev","option":"fs-docs","answer":"Since Shopware 6.6.3.0 (and now the required approach going into 6.7), entities are registered via PHP attributes instead of entities.xml. Define a class extending `Entity` and annotate it with `#[Entity('example_entity', collectionClas
