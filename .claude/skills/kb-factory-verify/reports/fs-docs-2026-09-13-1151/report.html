rc/Resources/config/services.php`.","citations":["developer/guides/plugins/plugins/framework/data-handling/using-database-events.md:12-264"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling -maxdepth 1 -name \"*.md\""},{"tool":"Read","args":"developer/guides/plugins/plugins/framework/data-handling/using-database-events.md"},{"tool":"Bash","args":"grep -rli \"changeset\\|changed fields\\|getPayload\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-10":{"query":"How do dynamic product groups work in the administration and where can the resulting group be used?","category":"func","option":"fs-docs","answer":"Dynamic product groups are found in the admin under Catalogues > Dynamic product groups. They are groups of products formed by dynamic rules that can be played out in different places in the shop. When creating a group you give it a name and optional description, and can choose 'Keep matching variants grouped' to control whether matching product variants stay grouped under a shared main product or are shown individually (affects categories, cross-selling, and CMS product sliders). In the Conditions area you build rules via the Rule Builder module: pick a property and a condition, link further conditions with AND/OR, and nest conditions with SUB-CONDITION; a Preview button shows which products currently match. Available operators (for properties like products, categories, manufacturers, tags, properties) include Is equal to / Is not equal to / Is equal to any of / Is not equal to any of / Is equal to all of / Is not equal to all of. Conditions can be based on products, categories, properties/property values, tags, sales status, price, stock, custom fields, and delivery time. The status column in the overview shows whether a group's rules are valid (e.g. it becomes invalid if it relies on rules from a deactivated plugin). Resulting dynamic product groups can then be used to: (1) dynamically fill the content of a category (useful for sale or manufacturer-specific categories), (2) fill the product comparison feed with content, and (3) fill product sliders in Shopping Experiences (found in the Commerce block category).","citations":["merchant/content/en/shopware-6/shopware-6-de/Catalogues/Dynamicproductgroups/v1-3-0-0.md:9-149"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/index.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en -not -path '*/.git/*' -iname '*dynamic*' -o -iname '*product-group*'"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/catalogues -maxdepth 2 -not -path '*/.git/*'"},{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/merchant/content/en/shopware-6/shopware-6-de/Catalogues/Dynamicproductgroups"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/shopware-6-de/Catalogues/Dynamicproductgroups/v1-3-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-31":{"query":"How do I expose a plugin configuration value, such as a colour picked in the Administration, as an SCSS variable in my Storefront styling?","category":"dev","option":"fs-docs","answer":"The recommended way is to declare it directly in your plugin's config.xml. First provide a fallback default in your plugin's base.scss, e.g. `$sass-plugin-header-bg-color: #ffcc00 !default;`. Then, in the input-field for the value in config.xml, add a `<css>` tag whose text is the SCSS variable name (without the leading $), e.g. for a colorpicker field named sassPluginHeaderBgColor: `<css>sass-plugin-header-bg-color<\/css>` alongside a `<defaultValue>`. This exposes the configured (or default) value as that SCSS variable automatically; note the theme must be recompiled manually after the value changes, and the Administration shows a notice that changing it affects the theme. (This `css` flag has been available since Shopware 6.4.13.0.) If you need more flexibility (e.g. different logic, or looping over all config fields), you can instead create an event subscriber on `ThemeCompilerEnrichScssVariablesEvent`, inject `SystemConfigService`, read the value via `$this->systemConfig->get('YourPlugin.config.fieldName', $event->getSalesChannelId())`, and call `$event->addVariable('sass-plugin-header-bg-color', $value)` \u2014 this also allows per-sales-channel values, unlike variables added outside this event which are global.","citations":["developer/guides/plugins/plugins/storefront/styling/add-scss-variables.md:1-56","developer/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md:1-249"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides -maxdepth 3 -type d -not -path '*/.git/*' | sort"},{"tool":"Bash","args":"grep -rl \"sw-plugin-config\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration; ls docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration; ls docs/shopware-knowledge-bases/developer/guides/plugins/themes/styling"},{"tool":"Bash","args":"grep -rli \"config.*scss\\|scss.*config\" docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/styling/add-scss-variables.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-09":{"query":"How do I make a field on my plugin's own entity translatable per language?","category":"dev","option":"fs-docs","answer":"First create a translation table via a migration named `<entity>_translation` (e.g. `swag_example_translation`), with columns `<entity>_id` (FK to the base entity, part of composite PK), `language_id` (FK to `language`, part of composite PK), the translated column(s) (e.g. `name`), and `created_at`/`updated_at`; both FKs cascade on delete/update. Then create a translation `EntityDefinition` (e.g. `ExampleTranslationDefinition` in `<plugin root>/src/Core/Content/Example/Aggregate/ExampleTranslation/`) extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityTranslationDefinition`, overriding `getParentDefinitionClass()` to return the base entity's definition class (e.g. `ExampleDefinition::class`), with `defineFields()` returning only the translated field(s) (e.g. a `StringField('name', 'name')` with `Required` flag) \u2014 base fields like `language_id` are added automatically by `EntityTranslationDefinition`. Register it in `services.php` tagged `shopware.entity.definition` after the base entity's own registration. Create an `Entity` class (e.g. `ExampleTranslationEntity`) extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\TranslationEntity` (which already provides `language_id` handling) with properties/getters/setters for `<entity>Id`, the translated field, and an association property back to the parent entity, then set it via `getEntityClass()` on the translation definition. Create an `EntityCollection` (e.g. `ExampleTranslationCollection`) the same way as for normal entities, returning the translation entity class from `getExpectedClass()`. Finally, on the main entity's `EntityDefinition` (e.g. `ExampleDefinition`), define the translatable field as a `TranslatedField('name')` (with `ApiAware`/`Required` flags) instead of a plain `StringField`, and add a `TranslationsAssociationField(ExampleTranslationDefinition::class, 'swag_example_id')` (also `ApiAware`/`Required`) to link to the translation aggregate. When reading translated data, prefer `entity.translated.field` in storefront/sales-channel contexts and the plain `entity.field` in Admin/CRUD flows where the value for the current language is needed directly.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-data-translations.md:8-299"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/add-data-translations.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"}}},"scored":{"fs-docs":{"dev-01":{"caseId":"dev-01","option":"fs-docs","scores":{"groundingRelevance":100,"accuracy":40,"completeness":70,"citation":70,"honesty":100,"actionability":100},"total":77,"verdict":"partly","findability":"fail","pageReached":"developer/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md","selfReportDelta":{"reported":7,"actual":7,"missing":[]},"fenceDenials":0,"retrieval":{"retrievalCalls":6,"callsToTarget":1,"retrievalBytes":38858,"retrievalLines":771,"deadEndCalls":0,"retrievalTurns":6,"toolLatencyMsP50":125,"toolLatencyMsP90":644,"groundTruth":true},"citationsVerified":"1/3","findings":["Answer presents getDefinitionClass() as the (sole) abstract/extension-naming method for 6.7; expected fact 1 (confirmed against 6.7.13.0 code) states getDefinitionClass() does not exist in 6.7 and the sole abstract method is getEntityName() \u2014 this is the specific documentation defect cases.md flags for dev-01, and the answer falls into it","Fact 2 (allowed extension field shapes: AssociationField/Runtime/FkField-with-companion) only loosely covered via examples, not the constraint itself","Fact 3 (shopware.entity.extension tag, BulkEntityExtension since 6.6.10.0) is covered","findability fail: 4 list/grep calls occurred before the target page was read","2 of 3 citations have rangeExists=false (cited end-line exceeds file length) though matchesTool <script>
(function () {
  'use strict';

  // ---- load + defend ----
  var dataEl = document.getElementById('report-data');
  var payload = {};
  try { payload = JSON.parse(dataEl.textContent || '{}') || {}; } catch (e) { payload = {}; }
  var scores = payload.scores || {};
  var raw = payload.raw || {};
  var scoredRaw = payload.scored || {};
  var options = scores.options || {};
  var optionKeys = Object.keys(options);
  var matrix = scores.matrix || {};
  var warnings = scores.warnings || [];

  function dash(v) { return (v === undefined || v === null || v === '') ? '—' : v; }
  function pct(v) { return (v === undefined || v === null || v === '') ? '—' : (v + '%'); }
  function num(v) { return (v === undefined || v === null) ? '—' : v; }
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k === 'html') { /* not used — kept out for safety */ }
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function text(t) { return document.createTextNode(dash(t)); }
  function td(content, cls) {
    var cell = document.createElement('td');
    if (cls) cell.className = cls;
    if (content instanceof Node) cell.appendChild(content);
    else cell.textContent = dash(content);
    return cell;
  }
  function th(content) {
    var cell = document.createElement('th');
    cell.textContent = content;
    return cell;
  }
  function verdictClass(v) {
    var s = String(v || '').toLowerCase();
    if (['pass', 'partly', 'fail', 'unavailable', 'unscored'].indexOf(s) >= 0) return 'verdict-' + s;
    return '';
  }
  function statusClass(v) {
    var s = String(v || '').toLowerCase();
    if (s.indexOf('ready') === 0) return 'status-pass';
    if (s.indexOf('usable') === 0) return 'status-partly';
    if (s.indexOf('not ready') === 0) return 'status-fail';
    return '';
  }
  function findClass(v) {
    var s = String(v || '').toLowerCase();
    if (s === 'pass') return 'find-pass';
    if (s === 'fail') return 'find-fail';
    return '';
  }
  function heatColor(v) {
    if (v === undefined || v === null || isNaN(v)) return { bg: 'transparent', fg: 'inherit' };
    var clamped = Math.max(0, Math.min(100, Number(v)));
    var hue = (clamped / 100) * 120; // 0=red .. 120=green
    var bg = 'hsl(' + hue.toFixed(0) + ', 55%, 45%)';
    return { bg: bg, fg: '#fff' };
  }
  function prettyJson(obj) {
    var pre = document.createElement('pre');
    try { pre.textContent = JSON.stringify(obj, null, 2); } catch (e) { pre.textContent = String(obj); }
    return pre;
  }
  function sortableTable(container, columns, rows, defaultKey, defaultDir) {
    var wrap = el('div', { class: 'table-wrap' });
    var table = document.createElement('table');
    var thead = document.createElement('thead');
    var trh = document.createElement('tr');
    var sortKey = defaultKey;
    var sortDir = defaultDir || -1;
    columns.forEach(function (c) {
      var cell = th(c.label);
      cell.dataset.key = c.key;
      cell.addEventListener('click', function () {
        if (sortKey === c.key) sortDir *= -1; else { sortKey = c.key; sortDir = -1; }
        draw();
      });
      trh.appendChild(cell);
    });
    thead.appendChild(trh);
    var tbody = document.createElement('tbody');
    table.appendChild(thead);
    table.appendChild(tbody);
    wrap.appendChild(table);
    container.appendChild(wrap);
    function draw() {
      var sorted = rows.slice().sort(function (a, b) {
        var av = a[sortKey], bv = b[sortKey];
        if (av === undefined || av === null) av = '';
        if (bv === undefined || bv === null) bv = '';
        if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sortDir;
        return String(av).localeCompare(String(bv)) * sortDir;
      });
      tbody.innerHTML = '';
      if (sorted.length === 0) {
        var tr = document.createElement('tr');
        var cell = document.createElement('td');
        cell.colSpan = columns.length;
        cell.className = 'empty';
        cell.textContent = 'No data.';
        tr.appendChild(cell);
        tbody.appendChild(tr);
        return;
      }
      sorted.forEach(function (r) {
        var tr = document.createElement('tr');
        columns.forEach(function (c) {
          tr.appendChild(c.render ? c.render(r) : td(r[c.key]));
        });
        tbody.appendChild(tr);
      });
    }
    draw();
    return { redraw: draw };
  }

  // ---- header ----
  document.getElementById('page-title').textContent =
    'kb-factory-verify — ' + (payload.kind === 'compare' ? 'compare report' : 'run report');
  document.getElementById('page-sub').textContent =
    payload.kind === 'compare'
      ? 'Comparison across ' + (optionKeys.length || '?') + ' option(s). Data is embedded below and this file is self-contained.'
      : 'Single run report. Data is embedded below and this file is self-contained.';

  (function renderHeaderBar() {
    var bar = document.getElementById('header-bar');
    var corpus = scores.corpus || {};
    var fp = corpus.fingerprint || {};
    var probe = corpus.probe || {};
    var fields = [
      ['Run', scores.run],
      ['Mode', scores.mode],
      ['Generated', scores.generatedAt],
      ['Label', scores.label],
      ['Model', scores.model],
      ['Corpus', corpus.name],
      ['Fingerprint', fp && Object.keys(fp).length ? Object.keys(fp).map(function (k) { return k + '=' + fp[k]; }).join(', ') : null],
      ['Probe', probe && (probe.ok !== undefined) ? (probe.ok ? 'ok' : 'failed') + (probe.detail ? ' — ' + probe.detail : '') : null],
      ['Wall clock (s)', scores.costs && scores.costs.wallClockSeconds]
    ];
    fields.forEach(function (f) {
      var field = el('div', { class: 'field' });
      var b = document.createElement('b');
      b.textContent = dash(f[1]);
      var lbl = document.createElement('span');
      lbl.textContent = f[0];
      field.appendChild(b);
      field.appendChild(lbl);
      bar.appendChild(field);
    });
  })();

  // ---- tabs ----
  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (b) { b.setAttribute('aria-selected', 'false'); });
      document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
      btn.setAttribute('aria-selected', 'true');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ================= SUMMARY =================
  (function renderSummary() {
    var panel = document.getElementById('tab-summary');

    if (warnings.length) {
      var w = el('div', { class: 'warnings' });
      w.appendChild(el('h3', { text: 'Warnings' }));
      var ul = document.createElement('ul');
      warnings.forEach(function (msg) { ul.appendChild(el('li', { text: msg })); });
      w.appendChild(ul);
      panel.appendChild(w);
    }

    var ranking = matrix.ranking || [];
    if (ranking.length) {
      panel.appendChild(el('h2', { text: 'Ranking' }));
      var list = document.createElement('ol');
      ranking.forEach(function (r) {
        var li = document.createElement('li');
        li.textContent = dash(r.option) + ' — ' + pct(r.overall) + ' ';
        var span = document.createElement('span');
        span.className = statusClass(r.status);
        span.textContent = dash(r.status);
        li.appendChild(span);
        list.appendChild(li);
      });
      panel.appendChild(list);
    }

    panel.appendChild(el('h2', { text: 'Comparison' }));
    var compareRows = optionKeys.map(function (key) {
      var o = options[key] || {};
      var counts = o.counts || {};
      var findability = o.findability || {};
      var edge = o.edge || {};
      var gap = o.gap || {};
      var averages = o.averages || {};
      var costs = o.costs || {};
      return {
        option: o.option || key,
        access: o.access, corpus: o.corpus,
        overall: averages.overall, status: o.status,
        developer: averages.developer, functional: averages.functional,
        findable: (findability.pass != null && findability.total != null) ? (findability.pass + '/' + findability.total) : null,
        edge: (edge.pass != null && edge.total != null) ? (edge.pass + '/' + edge.total) : null,
        gap: (gap.pass != null && gap.total != null) ? (gap.pass + '/' + gap.total) : null,
        pass: counts.pass, partly: counts.partly, fail: counts.fail,
        unavailable: counts.unavailable, unscored: counts.unscored,
        weakest: o.weakestDimension,
        tokens: costs.totalTokens, toolCalls: costs.totalToolCalls, agentSeconds: costs.agentTimeSecondsSummed
      };
    });
    sortableTable(panel, [
      { key: 'option', label: 'Option' },
      { key: 'access', label: 'Access' },
      { key: 'corpus', label: 'Corpus' },
      { key: 'overall', label: 'Overall %', render: function (r) { return td(pct(r.overall)); } },
      { key: 'status', label: 'Status', render: function (r) { return td(r.status, statusClass(r.status)); } },
      { key: 'developer', label: 'Dev %', render: function (r) { return td(pct(r.developer)); } },
      { key: 'functional', label: 'Func %', render: function (r) { return td(pct(r.functional)); } },
      { key: 'findable', label: 'Findable' },
      { key: 'edge', label: 'Edge' },
      { key: 'gap', label: 'Gap' },
      { key: 'pass', label: 'Pass' },
      { key: 'partly', label: 'Partly' },
      { key: 'fail', label: 'Fail' },
      { key: 'unavailable', label: 'Unavail.' },
      { key: 'unscored', label: 'Unscored' },
      { key: 'weakest', label: 'Weakest dim.' },
      { key: 'tokens', label: 'Tokens' },
      { key: 'toolCalls', label: 'Tool calls' },
      { key: 'agentSeconds', label: 'Agent (s)' }
    ], compareRows, 'overall', -1);

    var deltas = matrix.deltas || {};
    if (deltas.mcpMinusFs || deltas.wikiMinusDocs) {
      panel.appendChild(el('h2', { text: 'Deltas' }));
      var cards = el('div', { class: 'cards' });
      function deltaCard(label, obj) {
        if (!obj) return;
        Object.keys(obj).forEach(function (k) {
          var c = el('div', { class: 'card' });
          c.appendChild(el('div', { class: 'label', text: label + ' (' + k + ')' }));
          var v = obj[k];
          c.appendChild(el('div', { class: 'value', text: (v === undefined || v === null) ? '—' : (v > 0 ? '+' + v : String(v)) }));
          cards.appendChild(c);
        });
      }
      deltaCard('mcp − fs', deltas.mcpMinusFs);
      deltaCard('wiki − docs', deltas.wikiMinusDocs);
      panel.appendChild(cards);
    }
  })();

  // ================= DIMENSIONS =================
  (function renderDimensions() {
    var panel = document.getElementById('tab-dimensions');
    var byDimension = matrix.byDimension || {};
    var dims = Object.keys(byDimension);
    if (!dims.length) {
      // derive from any option's averages.byDimension if matrix lacks it
      optionKeys.forEach(function (key) {
        var bd = (options[key] && options[key].averages && options[key].averages.byDimension) || {};
        Object.keys(bd).forEach(function (d) { if (dims.indexOf(d) < 0) dims.push(d); });
      });
    }

    panel.appendChild(el('h2', { text: 'Dimension heatmap' }));
    if (!dims.length || !optionKeys.length) {
      panel.appendChild(el('p', { class: 'empty', text: 'No dimension data.' }));
    } else {
      var wrap = el('div', { class: 'table-wrap' });
      var table = document.createElement('table');
      var thead = document.createElement('tr');
      thead.appendChild(th('Dimension'));
      optionKeys.forEach(function (k) { thead.appendChild(th(k)); });
      var theadWrap = document.createElement('thead');
      theadWrap.appendChild(thead);
      table.appendChild(theadWrap);
      var tbody = document.createElement('tbody');
      dims.forEach(function (d) {
        var tr = document.createElement('tr');
        tr.appendChild(td(d));
        optionKeys.forEach(function (k) {
          var v = (byDimension[d] && byDimension[d][k] !== undefined)
            ? byDimension[d][k]
            : ((options[k] && options[k].averages && options[k].averages.byDimension) ? options[k].averages.byDimension[d] : null);
          var cell = document.createElement('td');
          cell.className = 'heat-cell';
          if (v === undefined || v === null) {
            cell.textContent = '—';
          } else {
            var col = heatColor(v);
            cell.style.background = col.bg;
            cell.style.color = col.fg;
            cell.textContent = v;
          }
          tr.appendChild(cell);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      panel.appendChild(wrap);
    }

    var anyByArea = optionKeys.some(function (k) { return options[k] && options[k].byArea; });
    if (anyByArea) {
      panel.appendChild(el('h2', { text: 'By area' }));
      var areas = [];
      optionKeys.forEach(function (k) {
        var ba = (options[k] && options[k].byArea) || {};
        Object.keys(ba).forEach(function (a) { if (areas.indexOf(a) < 0) areas.push(a); });
      });
      var wrap2 = el('div', { class: 'table-wrap' });
      var table2 = document.createElement('table');
      var thr = document.createElement('tr');
      thr.appendChild(th('Area'));
      optionKeys.forEach(function (k) { thr.appendChild(th(k)); });
      var thead2 = document.createElement('thead');
      thead2.appendChild(thr);
      table2.appendChild(thead2);
      var tbody2 = document.createElement('tbody');
      areas.forEach(function (a) {
        var tr = document.createElement('tr');
        tr.appendChild(td(a));
        optionKeys.forEach(function (k) {
          var entry = (options[k] && options[k].byArea && options[k].byArea[a]) || null;
          tr.appendChild(td(entry ? (dash(entry.average) + ' (' + dash(entry.pass) + '/' + dash(entry.cases) + ')') : null));
        });
        tbody2.appendChild(tr);
      });
      table2.appendChild(tbody2);
      wrap2.appendChild(table2);
      panel.appendChild(wrap2);
    }
  })();

  // ================= CASES =================
  (function renderCases() {
    var panel = document.getElementById('tab-cases');

    var allCases = scores.cases || [];
    if (!allCases.length) {
      var seen = {};
      optionKeys.forEach(function (k) {
        ((options[k] && options[k].cases) || []).forEach(function (c) {
          if (c.caseId && !seen[c.caseId]) { seen[c.caseId] = true; allCases.push(c.caseId); }
        });
      });
    }

    // index scorecards by option -> caseId
    var byOptCase = {};
    optionKeys.forEach(function (k) {
      byOptCase[k] = {};
      ((options[k] && options[k].cases) || []).forEach(function (c) { byOptCase[k][c.caseId] = c; });
    });

    var categories = [];
    var verdicts = [];
    allCases.forEach(function (cid) {
      optionKeys.forEach(function (k) {
        var c = byOptCase[k][cid];
        if (c) {
          if (c.category && categories.indexOf(c.category) < 0) categories.push(c.category);
          if (c.verdict && verdicts.indexOf(c.verdict) < 0) verdicts.push(c.verdict);
        }
      });
    });

    var activeCategory = null;
    var activeVerdict = null;

    var chips = el('div', { class: 'chips' });
    var catGroup = el('span', { class: 'chip-group-label', text: 'Category' });
    chips.appendChild(catGroup);
    var catChipEls = [];
    categories.forEach(function (cat) {
      var chip = el('button', { class: 'chip', type: 'button', text: cat });
      chip.setAttribute('aria-pressed', 'false');
      chip.addEventListener('click', function () {
        activeCategory = (activeCategory === cat) ? null : cat;
        catChipEls.forEach(function (c) { c.setAttribute('aria-pressed', String(c.textContent === activeCategory)); });
        drawGrid();
      });
      catChipEls.push(chip);
      chips.appendChild(chip);
    });
    var verdictGroup = el('span', { class: 'chip-group-label', text: 'Verdict' });
    chips.appendChild(verdictGroup);
    var verdictChipEls = [];
    verdicts.forEach(function (v) {
      var chip = el('button', { class: 'chip', type: 'button', text: v });
      chip.setAttribute('aria-pressed', 'false');
      chip.addEventListener('click', function () {
        activeVerdict = (activeVerdict === v) ? null : v;
        verdictChipEls.forEach(function (c) { c.setAttribute('aria-pressed', String(c.textContent === activeVerdict)); });
        drawGrid();
      });
      verdictChipEls.push(chip);
      chips.appendChild(chip);
    });
    panel.appendChild(chips);

    var gridWrap = el('div', { class: 'table-wrap' });
    panel.appendChild(gridWrap);
    var drilldown = el('div', { class: 'drilldown', id: 'case-drilldown' });
    drilldown.appendChild(el('p', { class: 'empty', text: 'Click a cell to see the case detail.' }));
    panel.appendChild(drilldown);

    function drawGrid() {
      gridWrap.innerHTML = '';
      var visibleCases = allCases.filter(function (cid) {
        if (!activeCategory && !activeVerdict) return true;
        return optionKeys.some(function (k) {
          var c = byOptCase[k][cid];
          if (!c) return false;
          if (activeCategory && c.category !== activeCategory) return false;
          if (activeVerdict && c.verdict !== activeVerdict) return false;
          return true;
        });
      });
      if (!visibleCases.length || !optionKeys.length) {
        gridWrap.appendChild(el('p', { class: 'empty', text: 'No cases match the filters.' }));
        return;
      }
      var table = document.createElement('table');
      var thead = document.createElement('thead');
      var trh = document.createElement('tr');
      trh.appendChild(th('Case'));
      optionKeys.forEach(function (k) { trh.appendChild(th(k)); });
      thead.appendChild(trh);
      table.appendChild(thead);
      var tbody = document.createElement('tbody');
      visibleCases.forEach(function (cid) {
        var tr = document.createElement('tr');
        tr.appendChild(td(cid));
        optionKeys.forEach(function (k) {
          var c = byOptCase[k][cid];
          var cell = document.createElement('td');
          if (!c) { cell.textContent = '—'; tr.appendChild(cell); return; }
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cell-btn ' + verdictClass(c.verdict);
          btn.textContent = pct(c.total) + (c.findability ? (c.findability === 'pass' ? ' ✓' : c.findability === 'fail' ? ' ✗' : '') : '');
          btn.addEventListener('click', function () { renderDrilldown(k, cid, c); });
          cell.appendChild(btn);
          tr.appendChild(cell);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      gridWrap.appendChild(table);
    }

    function highlightMemory(text) {
      var frag = document.createDocumentFragment();
      if (!text) { frag.appendChild(document.createTextNode('—')); return frag; }
      var sentences = String(text).split(/(?<=[.!?])\s+/);
      sentences.forEach(function (s, i) {
        var span = document.createElement('span');
        span.textContent = s + (i < sentences.length - 1 ? ' ' : '');
        if (/\[from memory\]/i.test(s)) span.className = 'mem-highlight';
        frag.appendChild(span);
      });
      return frag;
    }

    function renderDrilldown(optKey, caseId, scoreCard) {
      drilldown.innerHTML = '';
      drilldown.appendChild(el('h3', { text: optKey + ' — ' + caseId }));

      var rawCase = (raw[optKey] && raw[optKey][caseId]) || {};
      var scoredCase = (scoredRaw[optKey] && scoredRaw[optKey][caseId]) || {};

      var kv = el('dl', { class: 'kv' });
      function kvRow(k, v) {
        kv.appendChild(el('dt', { text: k }));
        kv.appendChild(el('dd', { text: dash(v) }));
      }
      kvRow('Query', rawCase.query);
      kvRow('Category', scoreCard.category);
      kvRow('Target', scoreCard.target);
      kvRow('Page reached', scoreCard.pageReached);
      kvRow('Verdict', scoreCard.verdict);
      kvRow('Total', pct(scoreCard.total));
      kvRow('Findability', scoreCard.findability);
      kvRow('Not-found claim', rawCase.notFoundClaim);
      drilldown.appendChild(kv);

      if (scoreCard.discrepancy) {
        var disc = el('p', { class: 'warnings' });
        disc.textContent = 'Discrepancy: recomputed total ' + pct(scoreCard.total) + ' vs scorer total ' + pct(scoreCard.scorerTotal) + ' (' + dash(scoreCard.scorerVerdict) + ')';
        drilldown.appendChild(disc);
      }

      drilldown.appendChild(el('h3', { text: 'Answer' }));
      var answerP = document.createElement('p');
      answerP.appendChild(highlightMemory(rawCase.answer));
      drilldown.appendChild(answerP);

      drilldown.appendChild(el('h3', { text: 'Citations' }));
      var citationsList = document.createElement('ul');
      var citations = rawCase.citations || [];
      if (!citations.length) citationsList.appendChild(el('li', { text: '—' }));
      citations.forEach(function (c) {
        citationsList.appendChild(el('li', { text: (typeof c === 'string') ? c : JSON.stringify(c) }));
      });
      drilldown.appendChild(citationsList);
      var verified = document.createElement('p');
      verified.textContent = 'Verified: ' + dash(scoreCard.citationsVerified);
      drilldown.appendChild(verified);

      drilldown.appendChild(el('h3', { text: 'Tool call log' }));
      var toolCalls = rawCase.toolCallLog || [];
      // Ground-truth calls (from the transcript extract) when present, keyed by case id.
      var gtCalls = ((payload.calls || {})[optKey] || {})[caseId] || [];
      if (!toolCalls.length) {
        drilldown.appendChild(el('p', { class: 'empty', text: 'No tool calls recorded.' }));
      } else {
        var tcWrap = el('div', { class: 'table-wrap' });
        var tcTable = document.createElement('table');
        var tcHead = document.createElement('tr');
        tcHead.appendChild(th('Tool'));
        tcHead.appendChild(th('Args'));
        tcHead.appendChild(th('Round trip'));
        tcHead.appendChild(th('Returned'));
        var tcTheadWrap = document.createElement('thead');
        tcTheadWrap.appendChild(tcHead);
        tcTable.appendChild(tcTheadWrap);
        var tcBody = document.createElement('tbody');
        toolCalls.forEach(function (call, i) {
          var argsStr = JSON.stringify(call.args || {});
          var gt = gtCalls[i] || null;
          var tr = document.createElement('tr');
          tr.appendChild(td(call.tool));
          tr.appendChild(td(argsStr));
          tr.appendChild(td(gt && gt.latencyMs != null ? gt.latencyMs + ' ms' : '—'));
          tr.appendChild(td(gt && gt.resultBytes != null
            ? gt.resultBytes.toLocaleString() + ' B / ' + (gt.resultLines || 0) + ' ln' + (gt.empty ? ' (no hits)' : '')
            : '—'));
          tcBody.appendChild(tr);
        });
        tcTable.appendChild(tcBody);
        tcWrap.appendChild(tcTable);
        drilldown.appendChild(tcWrap);
      }

      drilldown.appendChild(el('h3', { text: 'Findings' }));
      var findingsList = document.createElement('ul');
      var findings = scoreCard.findings || [];
      if (!findings.length) findingsList.appendChild(el('li', { text: '—' }));
      findings.forEach(function (f) { findingsList.appendChild(el('li', { text: typeof f === 'string' ? f : JSON.stringify(f) })); });
      drilldown.appendChild(findingsList);

      drilldown.appendChild(el('h3', { text: 'Official references' }));
      var refs = scoreCard.officialReferences || [];
      if (!refs.length) {
        drilldown.appendChild(el('p', { class: 'empty', text: '—' }));
      } else {
        var refList = document.createElement('ul');
        refs.forEach(function (r) {
          refList.appendChild(el('li', { text: dash(r.url) + ' — ' + dash(r.quote) }));
        });
        drilldown.appendChild(refList);
      }

      drilldown.appendChild(el('h3', { text: 'Notes' }));
      drilldown.appendChild(el('p', { text: scoreCard.notes }));

      drilldown.appendChild(el('h3', { text: 'Usage' }));
      var usage = scoreCard.usage || {};
      var usageKv = el('dl', { class: 'kv' });
      ['discover', 'scorer'].forEach(function (phase) {
        var u = usage[phase];
        usageKv.appendChild(el('dt', { text: phase }));
        usageKv.appendChild(el('dd', { text: u ? ('tokens=' + dash(u.tokens) + ', toolCalls=' + dash(u.toolCalls) + ', durationMs=' + dash(u.durationMs)) : '—' }));
      });
      drilldown.appendChild(usageKv);

      if (Object.keys(scoredCase).length) {
        var scoredDetails = document.createElement('details');
        scoredDetails.appendChild(el('summary', { text: 'Scored JSON (verbatim)' }));
        scoredDetails.appendChild(prettyJson(scoredCase));
        drilldown.appendChild(scoredDetails);
      }
    }

    drawGrid();
  })();

  // ================= RAW DATA =================
  (function renderRaw() {
    var panel = document.getElementById('tab-raw');
    if (!optionKeys.length) {
      panel.appendChild(el('p', { class: 'empty', text: 'No raw data.' }));
      return;
    }
    optionKeys.forEach(function (k) {
      panel.appendChild(el('h2', { text: k }));
      var caseIds = Object.keys(raw[k] || {});
      var scoredIds = Object.keys(scoredRaw[k] || {});
      var allIds = caseIds.concat(scoredIds.filter(function (id) { return caseIds.indexOf(id) < 0; }));
      if (!allIds.length) {
        panel.appendChild(el('p', { class: 'empty', text: 'No cases.' }));
        return;
      }
      allIds.forEach(function (cid) {
        var details = document.createElement('details');
        details.appendChild(el('summary', { text: cid }));
        var rawDetails = document.createElement('details');
        rawDetails.appendChild(el('summary', { text: 'Raw' }));
        rawDetails.appendChild(prettyJson((raw[k] && raw[k][cid]) || {}));
        details.appendChild(rawDetails);
        var scoredDetails = document.createElement('details');
        scoredDetails.appendChild(el('summary', { text: 'Scored' }));
        scoredDetails.appendChild(prettyJson((scoredRaw[k] && scoredRaw[k][cid]) || {}));
        details.appendChild(scoredDetails);
        panel.appendChild(details);
      });
    });
  })();

  // ================= RUN =================
  (function renderRun() {
    var panel = document.getElementById('tab-run');
    var corpus = scores.corpus || {};
    var fp = corpus.fingerprint || {};
    var probe = corpus.probe || {};

    panel.appendChild(el('h2', { text: 'Corpus' }));
    var corpusKv = el('dl', { class: 'kv' });
    corpusKv.appendChild(el('dt', { text: 'Name' }));
    corpusKv.appendChild(el('dd', { text: corpus.name }));
    corpusKv.appendChild(el('dt', { text: 'Probe' }));
    corpusKv.appendChild(el('dd', { text: probe && probe.ok !== undefined ? ((probe.ok ? 'ok' : 'failed') + (probe.detail ? ' — ' + probe.detail : '')) : null }));
    Object.keys(fp).forEach(function (k) {
      corpusKv.appendChild(el('dt', { text: k }));
      corpusKv.appendChild(el('dd', { text: fp[k] }));
    });
    panel.appendChild(corpusKv);

    panel.appendChild(el('h2', { text: 'Yardstick' }));
    var yardstick = scores.yardstick || {};
    var ykv = el('dl', { class: 'kv' });
    ['casesMdSha', 'rubricSha', 'briefSha'].forEach(function (k) {
      ykv.appendChild(el('dt', { text: k }));
      ykv.appendChild(el('dd', { text: yardstick[k] }));
    });
    panel.appendChild(ykv);

    if (scores.runs && Object.keys(scores.runs).length) {
      panel.appendChild(el('h2', { text: 'Runs (compare)' }));
      var rkv = el('dl', { class: 'kv' });
      Object.keys(scores.runs).forEach(function (k) {
        rkv.appendChild(el('dt', { text: k }));
        rkv.appendChild(el('dd', { text: scores.runs[k] }));
      });
      panel.appendChild(rkv);
    }

    panel.appendChild(el('h2', { text: 'Selector' }));
    panel.appendChild(el('p', { text: dash(scores.casesSelector) }));

    if (warnings.length) {
      panel.appendChild(el('h2', { text: 'Warnings' }));
      var ul = document.createElement('ul');
      warnings.forEach(function (msg) { ul.appendChild(el('li', { text: msg })); });
      panel.appendChild(ul);
    }

    panel.appendChild(el('h2', { text: 'scores.json' }));
    var details = document.createElement('details');
    details.appendChild(el('summary', { text: 'Show raw scores.json' }));
    details.appendChild(prettyJson(scores));
    panel.appendChild(details);
  })();

})();
</script>
</body>
</html>
