s ID, then type-hint the same service in your class constructor. The corpus's current guides (`add-custom-service.md`, `dependency-injection.md`) now only show the newer PHP-based equivalent (`services.php` with `$services->set(...)->args([service(...)])`), since XML examples have been superseded in the current documentation revision, but the underlying registration mechanism (explicit service + argument, or autowiring) is the same one described there.","citations":["developer/resources/references/adr/2026-07-30-migrate-container-configuration-from-xml-to-php.md:16-36","developer/guides/plugins/plugins/services/add-custom-service.md:114-118"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"services.xml\" docs/shopware-knowledge-bases/developer --include=\"*.md\" | grep -v b2b-suite"}],"notFoundClaim":false,"memoryClaims":["The exact XML tag syntax `<service>`/`<argument type=\"service\" id=\"...\"/>` for Symfony service definitions is standard Symfony XML DI syntax [from memory], not found verbatim as a code example in the current corpus, which no longer carries an XML example for plugin services."],"sourceVerdict":"partial"},"dev-07":{"query":"My plugin needs to store its own data in a new table \u2014 how do I define a custom DAL entity with its definition, entity and collection class so I get a repository for it?","category":"dev","option":"fs-docs","answer":"First create the database table via a plugin migration (a class extending `Shopware\\Core\\Framework\\Migration\\MigrationStep` with `getCreationTimestamp()` and `update(Connection $connection)` running the `CREATE TABLE` SQL, e.g. `swag_example` with `id BINARY(16)`, other columns, `created_at`/`updated_at`). Then create an `EntityDefinition` class (e.g. `ExampleDefinition` in `<plugin root>/src/Core/Content/Example/ExampleDefinition.php`) extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityDefinition`, implementing `getEntityName(): string` (returns the table name, e.g. `swag_example` \u2014 this value is also used as the repository service name `<name>.repository`) and `defineFields(): FieldCollection` (returns a `FieldCollection` of `Field` objects like `IdField`, `StringField`, `BoolField`, each taking a snake_case storage name and camelCase property name, with flags like `Required`/`PrimaryKey` via `addFlags()`; `created_at`/`updated_at` are included automatically and don't need to be defined). Register the definition in `services.php` tagged `shopware.entity.definition` with the `entity` attribute set to the entity name \u2014 this alone is enough to get a working `swag_example.repository` returning generic `ArrayEntity` instances. To get typed entities instead, create an `Entity` class (e.g. `ExampleEntity`) extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity` and using the `EntityIdTrait`, with `protected` (not `readonly`) properties matching the definition's fields (excluding id) plus getters/setters, then override `getEntityClass()` in the definition to return `ExampleEntity::class`. Also create an `EntityCollection` class (e.g. `ExampleCollection`) extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityCollection`, overriding `getExpectedClass()` to return `ExampleEntity::class`, and override `getCollectionClass()` in the definition to return `ExampleCollection::class`. After this, the entity is fully registered, accessible via the API, and usable for CRUD via its repository.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md:8-316"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/ | grep -i custom"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-06":{"query":"How do I add a custom Flow Builder action?","category":"dev","option":"fs-docs","answer":"In a plugin, create a custom Aware interface (e.g. `TagAware` in `<plugin root>/src/Core/Framework/Event/`) extending `Shopware\\Core\\Framework\\Event\\FlowEventAware` and marked with `#[IsFlowEventAware]`. Then create the action class (e.g. `CreateTagAction` in `<plugin root>/src/Core/Content/Flow/Dispatching/Action/`) extending `Shopware\\Core\\Content\\Flow\\Dispatching\\Action\\FlowAction`, implementing: `getName(): string` (a unique technical action name like `action.create.tag`), `requirements(): array` (the Aware interfaces this action needs \u2014 empty array means available for all triggers, a list of interfaces like `[OrderAware::class, CustomerAware::class]` restricts it to those, or your own custom Aware interface restricts it to new/custom events implementing it), and `handleFlow(StorableFlow $flow): void` which reads `$flow->getConfig()` for the flow-sequence config, `$flow->getStore($key)` for data from Aware interfaces, and `$flow->getData($key)` for data from the original event, then performs the business logic (e.g. via an injected `EntityRepository`). Register the action as a service in `services.php`, tagged `flow.action` with a `priority` (e.g. 600) and `key` matching the action name \u2014 this tag ensures it appears in the `/api/_info/flow-actions.json` response, with priority determining response order. If you want the action tied to a brand-new event, that event class must implement your Aware interface, and you register a `BusinessEventCollectorSubscriber` (subscribing to `BusinessEventCollectorEvent::NAME`) tagged `kernel.event_subscriber` to add it to the Flow Builder triggers list, plus an Administration snippet for the trigger label. For the Administration UI: define an action name constant (e.g. `ACTION.CREATE_TAG`) and snippets for labels in `en-GB.json`/`de-DE.json`; override the core `sw-flow-sequence-action` component (imported in `main.js`) to add the action to a `groups` list (existing groups include general, tag, customer, order \u2014 defaults to 'general' if undefined), map `modalName()` to a custom modal component name for the selected action, and provide `getActionTitle`/`getActionDescriptions` overrides. Build the configuration modal component (e.g. `sw-flow-create-tag-modal`) with its JS and Twig template, registered/imported in `main.js`, which emits a `process-finish` event with the action's `config` object when saved. Alternatively, for simple configuration that doesn't need a modal, override `openDynamicModal(value)` on `sw-flow-sequence-action` to detect your action name and call `this.onSaveActionSuccess({ config })` directly with a config object.","citations":["developer/guides/plugins/plugins/framework/flow/add-flow-builder-action.md:8-735"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/development/integrations-api/flows/"},{"tool":"Bash","args":"grep -ril \"flow action\\|FlowAction\\|flow builder action\" docs/shopware-knowledge-bases/developer/guides/plugins/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/flow/add-flow-builder-action.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-04":{"query":"After upgrading to 6.7 my plugin fatals on load because core class properties now have native PHP types \u2014 which properties must I retype in my subclasses?","category":"gap","option":"fs-docs","answer":"No page in this corpus lists which specific core class properties gained native PHP types in Shopware 6.7, nor any 6.7 migration checklist for plugin subclasses. The only related material found is `developer/resources/guidelines/code/core/6.5-new-php-language-features.md`, a core coding-guideline (dated 2023-05-16, tied to the 6.5/PHP 8.1 baseline, not 6.7) which states generally: 'It will now only be necessary to reach for @var & @param annotations when defining array shapes, generics and more specific types such as class-string, positive-int etc. Everything else should be natively typed,' and that adding native types is enforced by PHP so mismatched types throw a `TypeError`. It gives no enumeration of affected core properties and is not scoped to a 6.7 release. Searches of `backward-compatibility.md` for 'native' or '6.7' found no relevant matches either. I could not find sourced material in this corpus that answers which properties must be retyped for 6.7.","citations":["developer/resources/guidelines/code/core/6.5-new-php-language-features.md:202-221"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"native.*type|property type|typed propert\" docs/shopware-knowledge-bases/developer --include=*.md -i"},{"tool":"Read","args":"developer/resources/guidelines/code/core/6.5-new-php-language-features.md"},{"tool":"Bash","args":"grep -n \"native|typed propert|6.7\" docs/shopware-knowledge-bases/developer/resources/guidelines/code/backward-compatibility.md -i"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"dev-36":{"query":"How do I register ACL privileges for my plugin's Administration module and check them in a component or template?","category":"dev","option":"fs-docs","answer":"Admin privileges are identified by `key.role` (e.g. `product.viewer`). Normal `permissions` use the four fixed roles `viewer`/`editor`/`creator`/`deleter` and represent CRUD; `additional_permissions` are for non-CRUD actions and let you pick any role name. Register them with `Shopware.Service('privileges').addPrivilegeMappingEntry({ category, parent, key, roles: { <role>: { privileges: [...], dependencies: [...] } } })`, where `privileges` lists the required API permissions in `entity_name:operation` form (e.g. `product_review:read`) and `dependencies` lists other identifiers (e.g. `review.viewer`) that get auto-checked. Place this in `<plugin root>/src/Resources/app/administration/src/<component>/acl/index.js` and import it from your component's `index.js` (which is ultimately imported by `main.js`, so Shopware picks it up). You can extend an existing key's roles the same way (e.g. adding `plugin:read` to `product.viewer`), and can reuse privileges from another mapping via `Shopware.Service('privileges').getPrivileges('rule.viewer')` inside a roles/privileges array (note this only grants API rights, not access to that other module's UI). To protect a route, add `meta: { privilege: 'your_key.your_role' }` to the route config; to protect a menu entry, add `privilege: 'your_key.your_role'` to the `navigation` (or `settingsItem`) entry; to protect a keyboard shortcut, use an object with an `active()` method returning `this.acl.can(...)`. Provide translations for the permission labels via snippet paths `sw.privileges.${category}.${key}.label` (and `sw.privileges.${category}.${key}.${role_key}` for additional_permissions roles). To check a privilege inside a component or template, inject the `acl` service (`inject: ['acl']`, or use the global `Shopware.Service('acl')`) and call `this.acl.can('key.role')` \u2014 e.g. `return this.acl.can('sales_channel.creator');` in a method, or `v-if=\"acl.can('review.editor')\"` / `:disabled=\"!acl.can('review.editor')\"` directly in a template. Finally, to have your custom privileges automatically added to existing roles server-side, override the `enrichPrivileges()` method on your plugin's main `Plugin` class in PHP, returning an array keyed by role identifier (e.g. `'product.viewer'`) whose values are arrays of additional privilege strings; an event subscriber adds these at runtime.","citations":["developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:1-447"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/permissions-error-handling/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-27":{"query":"In Shopware 6.7, how do I extend a Storefront Twig template from my plugin with `{% extends %}` so I keep the core markup and other plugins' changes?","category":"dev","option":"fs-docs","answer":"Shopware does not use plain Twig `{% extends %}` for this \u2014 it uses its own tag `{% sw_extends %}`, which is designed to correctly chain template overrides from multiple plugins/themes (plain `extends` would not resolve the override chain the same way). Register your plugin's view path by placing templates under `<plugin root>/src/Resources/views` (Shopware looks for a `views` directory there by default). Find the original template under `<shopware root>/src/Storefront/Resources/views/...` (e.g. `storefront/layout/header/logo.html.twig`) and recreate the exact same relative path under your plugin's `views` directory. In your override file, put `{% sw_extends '@Storefront/storefront/layout/header/logo.html.twig' %}` as the very first line, then redefine only the specific `{% block %}` you want to change (e.g. `layout_header_logo_link`) with your new content; call `{{ parent() }}` inside the block if you want to keep/append the original content instead of replacing it. After changes, clear the cache with `./bin/console cache:clear`, and make sure your plugin is active and your theme is assigned to the sales channel. You can use `{{ dump() }}` in a template to inspect available variables. Since Shopware 6.7.11.0 there is also a new Storefront Components system for building reusable atomic template components, referenced separately in the Storefront Components concept docs.","citations":["developer/guides/plugins/plugins/storefront/templates/customize-templates.md:1-129"],"toolCallLog":[{"tool":"Bash","args":"cd docs/shopware-knowledge-bases/developer && find guides -iname \"*extend*template*\" -o -iname \"*templates*\" -not -path \"*/.git/*\" | grep -i storefront"},{"tool":"Read","args":"developer/guides/plugins/plugins/storefront/templates/customize-templates.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-69":{"query":"How does an app subscribe to an event like `product.written`, what does Shopware POST to the webhook URL, and how do I verify the request is genuine?","category":"dev","option":"fs-docs","answer":"Subscribe by adding a `<webhooks>` element to your app's `manifest.xml`, defining a `<webhook>` with a `name`, a `url`, and an `event`, e.g. name `product-changed`, url `https://example.com/event/product-changed`, event `product.written` \u2014 every time a product is changed, Shopware sends a `POST` to that URL.\n\nShopware POSTs a JSON body like:\n```json\n{\n  \"data\": {\n    \"payload\": [ { \"entity\": \"product\", \"operation\": \"delete\", \"primaryKey\": \"7b04ebe416db4ebc93de4d791325e1d9\", \"updatedFields\": [] } ],\n    \"event\": \"product.written\"\n  },\n  \"source\": { \"url\": \"http://localhost:8000\", \"appVersion\": \"0.0.1\", \"shopId\": \"dgrH7nLU6tlE\", \"eventId\": \"7b04ebe416db4ebc93de4d791325e1d9\" },\n  \"timestamp\": 123123123\n}\n```\n`source.url` is where your app can reach the shop's API, `source.shopId` identifies the instance, `source.eventId` is a stable id even across retries (since 6.4.11.0). For `entity.written` events the payload doesn't include the full entity (it may be stale by the time it's processed) \u2014 only the id under `primaryKey`, so the app should fetch fresh data via the API itself; other event types do include the entity data (but not necessarily all associations). `timestamp` is when the webhook was handled and can be used against replay attacks \u2014 reject the request if it's too old (available since 6.4.1.0). Headers also include `sw-version` (since 6.4.1.0), and since 6.4.5.0 `sw-context-language` and `sw-user-language`.\n\nTo verify authenticity, check the `shopware-shop-signature` header: it is a SHA-256 HMAC of the request body signed with the `shop-secret` the app itself generated and returned to the shop during registration. Verification works exactly like the confirmation-request verification: recompute `hash_hmac('sha256', $requestBody, $shopSecret)` and compare it to the header value.\n\nAdditionally, since Shopware 6.5.7.0 you can restrict a webhook to fire only for the live version of an entity (filtering out drafts, e.g. only on actual order placement, not drafts) by adding `onlyLiveVersion=\"true\"` to the `<webhook>` element, e.g. `<webhook name=\"order-created\" url=\"https://example.com/event/order-created\" event=\"order.written\" onlyLiveVersion=\"true\"/>`. This defaults to `false` and only applies to `HookableEntityWrittenEvent`-based events.","citations":["developer/guides/plugins/apps/lifecycle/webhook.md:10-146"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/apps/lifecycle/webhook.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-04":{"query":"How do I create a custom CMS element for Shopping Experiences?","category":"dev","option":"fs-docs","answer":"A CMS element is the smallest content primitive (text, image, video, product listing, etc.) placed in a slot of a CMS block. To add a custom element in the Administration, create a folder structure under `<plugin root>/src/Resources/app/administration/src/module/sw-cms/elements/<element-name>/` containing `index.js`, and `component/`, `config/`, `preview/` subfolders each with their own `index.js` and Twig/SCSS files. Import the element folder in `main.js` (`import './module/sw-cms/elements/dailymotion';`). In the element's own `index.js`, register it via `Shopware.Service('cmsService').registerCmsElement({ name, label, component, configComponent, previewComponent, defaultConfig, hidden?, removable? })`. Create the preview component (thumbnail shown in element picker), the main component (rendered in the editor, using the `cms-element` mixin and `this.initElementConfig('<name>')` in `created()`), and the config component (form fields shown in a modal for the properties in `defaultConfig`, also using the `cms-element` mixin). For inheritance support between base layout and content pages, wrap individual config fields with the `sw-cms-inherit-wrapper` component (field, element, label props, exposing `isInherited` via the default slot). For the Storefront rendering, create a Twig template at `src/Resources/views/storefront/element/cms-element-<name>.html.twig` (the `cms-element-` prefix is mandatory); the `element` variable is automatically passed into the template with its config/meta data. Clear the Storefront cache after adding new templates. Once created, the element can be placed inside a CMS block (see the related 'Add custom CMS block' guide).","citations":["developer/guides/plugins/plugins/content/cms/add-cms-element.md:7-254"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"cms element\" docs/shopware-knowledge-bases/developer/guides/plugins/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/content/cms/add-cms-element.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-06":{"query":"I'm coming from Magento \u2014 what are the Shopware equivalents of store views, extensions, attribute sets and `di.xml`?","category":"edge","option":"fs-docs","answer":"The merchant docs include a dedicated Magento-to-Shopware dictionary that answers most of this. Store view / Store / Website (Settings area) maps to 'Sales channel with different languages and domains' in Shopware. Extension (Development area, Magento term) maps to 'Plugin' in Shopware, and separately 'Community Code Pool' maps to 'Extensions / Community Store' (installed via Extensions > Store) while 'Local Code Pool' maps to 'Extensions' installed via the extension manager under Settings > My extensions. Attribute Sets (Settings area, 'Catalog > Attributes > Manage Attribute Sets') map to 'Settings > Content > Custom fields'; in the Concepts table, 'Attribute Sets' specifically maps to 'Custom field sets,' described as collecting custom fields into logical groups (note also that plain Magento 'Attributes' split across two Shopware concepts: custom fields, which extend the product with additional information, and properties, used for variants and filtering). No equivalent for Magento's `di.xml` (dependency-injection configuration) was found anywhere in this dictionary page or elsewhere in the merchant/developer corpus searched \u2014 the migration dictionary is aimed at admin/merchant concepts, not developer build-system files, so this term is not covered by the corpus.","citations":["merchant/content/en/shopware-6/migration-en/magento-keywords/v1-1-0-0.md:90-92"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"magento\" docs/shopware-knowledge-bases/developer docs/shopware-knowledge-bases/merchant"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/migration-en/magento-keywords/v1-1-0-0.md"},{"tool":"Bash","args":"grep -rli \"di\\.xml\\|services\\.xml\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins/plugin-base-guide.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -not -path '*/.git/*' -iname '*plugin-base*'"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"dev-30":{"query":"How do I add a custom filter to the Storefront product listing from my plugin, both the criteria side and the filter panel?","category":"dev","option":"fs-docs","answer":"Criteria side: create an event subscriber (e.g. `ExampleListingSubscriber`) that listens to `Shopware\\Core\\Content\\Product\\Events\\ProductListingCollectFilterEvent`. In the handler, get existing filters via `$event->getFilters()` and the request via `$event->getRequest()`, then build a `Filter` object with parameters: `name` (unique filter name), `filtered` (bool, whether it's currently active), `aggregations` (array, e.g. a `FilterAggregation` wrapping a `MaxAggregation`/`EntityAggregation` \u2014 a filter can have multiple aggregations, such as for properties), `filter` (the DAL filter to add to the criteria, e.g. `EqualsFilter`), and `values` (the values added as `currentFilter` to the result). Add it via `$filters->add($filter)`. Register the subscriber as a `kernel.event_subscriber` service.\n\nStorefront UI side: extend the core template `src/Storefront/Resources/views/storefront/component/listing/filter-panel.html.twig` from your plugin using `{% sw_extends %}`, and override the `component_filter_panel_items` block (available since Shopware 6.4.8.0) \u2014 call `{{ parent() }}` then `{% sw_include %}` one of the built-in filter components: `filter-boolean`, `filter-multi-select`, `filter-property-select`, `filter-range`, or `filter-rating-select`/`filter-rating-select-item`, passing `name` and `displayName`. Putting the include after `parent()` places your filter after existing ones (move `parent()` to the end to put it first); to position it next to a specific existing filter (e.g. right after the price filter), instead extend that filter's specific block, e.g. `component_filter_panel_item_price`.","citations":["developer/guides/plugins/plugins/storefront/howto/add-listing-filters.md:1-183"],"toolCallLog":[{"tool":"Bash","args":"cd docs/shopware-knowledge-bases/developer && find guides -iname \"*filter*\" -not -path \"*/.git/*\" | grep -i listing"},{"tool":"Read","args":"developer/guides/plugins/plugins/storefront/howto/add-listing-filters.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-03":{"query":"How do promotions and discount codes work, including individually generated codes?","category":"func","option":"fs-docs","answer":"Promotions are managed under Marketing > Promotions. Creating a new promotion ('Create action') opens a General tab; after the first save, the Conditions and Discounts tabs become available.\n\nGeneral settings include Name, Priority (higher priority applied first), Valid from/Valid until, Max. total uses, Max. uses per customer, and an Active switch. A 'Promotion codes' section lets you choose: 'No promotional code required' (applies automatically when conditions are met); 'Fixed promotion code' (one shared code for all customers, e.g. EASTER21, or generated randomly); or 'Individual promotion codes' (a unique code per order). Individual codes can each be redeemed only once and, once used, are rejected on reuse; the code list shows whether/by whom a code was redeemed. To generate individual codes you click 'generate codes' and configure: code length (number of random characters), optional prefix/suffix, or a 'custom pattern' using %s for a random letter and %d for a random number (e.g. SW-%s%d%s%d%s-TEST); a preview shows an example code, and you set the 'number of promotion codes' to generate. Note only one individual code from a single promotion can be applied per order, and regenerating codes invalidates the previously generated ones.\n\nThe Conditions tab restricts when a promotion applies: general conditions specify eligible sales channels and whether the promotion can combine with others ('Prevent combination with other promotions', 'Do not combine with'). Rule-based conditions let you attach Rule Builder rules for Customer rules (who is eligible), Shopping cart rules (e.g. cart value/quantity thresholds), Order rules (e.g. specific payment/shipping methods), and 'Promote sets of products' (set groups defined by Mode - Number/Value gross/net, Value, Sorting, and Product rules) for complex multi-product conditions like 'buy 3 get the cheapest free'. If multiple rules of the same type are selected, only one needs to be true (OR logic); to require all conditions together you must create separate promotions.\n\nThe Discounts tab defines what is discounted: 'Apply to' (entire cart, shipping costs, full product set, or specific set group), optionally restricted via 'Apply to specific range of products only' with its own Product rules/Apply to (e.g. every 2nd/3rd product)/Sort by settings, a discount Type (absolute, percentage, fixed price, or fixed unit price), a Value, and an optional Maximum discount value cap for percentage discounts. Discount settings can't be changed once the promotion has been used in an order, and multiple discounts can run within one promotion via 'Add Discount'.\n\nIn the storefront, customers apply a code by entering it in the 'Enter voucher code' field in the OffCanvas or full shopping cart view and confirming; once accepted the discount appears in the cart line items. Already-redeemed codes can be traced: for individual codes, the promotion's own view (Marketing > Promotions) shows which codes were redeemed and lets you find the matching order via the order overview's 'promotion code' filter; for a fixed code, the same order-overview filter can surface multiple orders that used it.","citations":["merchant/content/en/shopware-6/marketing/promotions/v1-7-0-0.md:20-82","merchant/content/en/shopware-6/marketing/promotions/v1-7-0-0.md:84-141","merchant/content/en/shopware-6/marketing/promotions/v1-7-0-0.md:143-167","merchant/content/en/shopware-6/marketing/promotions/v1-7-0-0.md:256-304"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/marketing -maxdepth 2 -not -path '*/.git/*'"},{"tool":"Read","args":"docs/shopware-knowledge-bases/merchant/content/en/shopware-6/marketing/promotions/v1-7-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-40":{"query":"How do I upgrade a Composer-based Shopware project from 6.6 to 6.7 \u2014 which composer.json constraint do I change, and which console commands do I run afterwards?","category":"dev","option":"fs-docs","answer":"Shopware's recommended path is the Shopware CLI upgrade wizard (`shopware-cli project upgrade`, run from a clean Git working tree), which handles readiness checks, extension compatibility, Composer resolution and the local upgrade for you (use `--no-interaction --target latest-patch --dry-run` for CI/preflight). If you do it manually with Composer instead: (1) if updating a live environment, enable maintenance mode with `bin/console sales-channel:maintenance:enable --all`; (2) edit `composer.json` and change the required Shopware version constraint to the target version (6.7) \u2014 if you use the Commercial plugin, also bump the `shopware/commercial` requirement to a compatible version; failing to change these constraints means `composer update` will just resolve back to the currently installed version and no upgrade happens; (3) run `composer update --no-scripts` to update all Composer packages (the `--no-scripts` flag avoids running scripts that reference Shopware CLI commands, which only work after updated recipes are installed); (4) optionally force-update Symfony Flex-managed config files with `composer recipes:update` and review the changes; (5) finalize with `bin/console system:update:finish`, which runs all required update routines for the newly installed version, including database migrations and recompiling themes; (6) after the update completes, disable maintenance mode with `bin/console sales-channel:maintenance:disable --all`. Best practices: start from a clean Git tree with a database backup, test on staging with production-like data first, review release notes/changelogs/UPGRADE files, check extension compatibility, use Rector/Administration codemods to handle deprecations, avoid skipping major versions untested, and commit `composer.json`/`composer.lock` plus reviewed recipe changes. Afterward, clear caches, rebuild Administration/Storefront assets if needed, and test checkout/login/API flows plus installed extensions and custom code.","citations":["developer/guides/upgrades-migrations/upgrade-shopware.md:1-108"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"6.7\\|upgrade\" docs/shopware-knowledge-bases/developer/guides/hosting/installation-updates; find docs/shopware-knowledge-bases/developer/guides -iname \"*upgrad*\" -not -path \"*/.git/*\""},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/upgrade-shopware.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-23":{"query":"How do I ship a mail template with my plugin so it is installed automatically, including a custom mail template type?","category":"dev","option":"fs-docs","answer":"Ship the mail template via a plugin database migration (extending `MigrationStep`) rather than the Administration. In the migration's `update()` method: 1) obtain a `mail_template_type_id` \u2014 either fetch an existing type's ID from `mail_template_type` by `technical_name` (e.g. 'contact_form'), or create a custom type yourself by inserting into `mail_template_type` (columns: id, technical_name, available_entities, created_at, where `available_entities` is a JSON map like `['product' => 'product']` defining which entities are available in the template) plus a `mail_template_type_translation` row per language; 2) insert a row into `mail_template` (id, mail_template_type_id, system_default = 0, created_at) using that type ID; 3) insert a `mail_template_translation` row for each language you want to support (mail_template_id, language_id, sender_name, subject, description, content_html, content_plain, created_at), looking up language IDs by locale via a join on `language`/`locale`. Use `INSERT IGNORE INTO` so re-running the migration on reinstall does not throw. Do not delete mail templates when the plugin is uninstalled, since other entities may reference them, which could cause data inconsistency. Once the plugin is installed, the migration runs and the mail template becomes available in Shopware.","citations":["developer/guides/plugins/plugins/content/mail/add-mail-template.md:1-310"],"toolCallLog":[{"tool":"Bash","args":"cd docs/shopware-knowledge-bases/developer && find guides -iname \"*mail-template*\" -not -path \"*/.git/*\""},{"tool":"Read","args":"developer/guides/plugins/plugins/content/mail/add-mail-template.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-02":{"query":"How do Rule Builder conditions work for shipping and payment methods?","category":"func","option":"fs-docs","answer":"Rule Builder (Settings > Automation > Rule Builder) lets you build rules used to restrict/enable availability of shipping and payment methods, among many other things (shipping cost calculation, promotions, discounts, advanced prices, flows, product/category visibility, etc.). A rule consists of General information (Name, Description, Priority - higher priority is applied sooner, Type, Tags) and Conditions. Each condition has a Condition (the parameter queried, e.g. 'Grand total'), an Operator (e.g. 'Greater than', 'Is equal to', 'Is one of', etc. - full operator list includes At least one, All, Is equal to, Is not equal to, Is one of, Is not one of, Is greater than, Is greater than/equal to, Is less than, Is lower than/equal to), and an Input value. Multiple conditions can be linked with AND (all must be true) or OR (only one must be true) connections, and switching between AND/OR automatically creates subconditions for nested logic.\n\nSpecifically for shipping and payment, the 'Shopping cart' condition group includes 'Applied shipping method' (compares a specific shipping method, e.g. Express, with the one used in the evaluation context) and 'Applied payment method' (compares a specific payment method, e.g. Invoice, with the one used). The Orders condition group also has 'Applicable in Administration', which can be used as an availability rule to allow access to payment or shipping methods only in the Administration. To actually restrict which payment/shipping methods are offered, you build a rule with the desired conditions (e.g. cart total, customer group, country) and then assign that rule as the 'Availability rule' on the payment method or shipping method itself; the Rule Builder's own 'Assignments' tab on a rule shows where it is currently used, including 'Availability of payment methods' and 'Availability of shipping methods', but assignment itself happens from the payment/shipping method configuration, not from the rule. Preview mode (available on Rise and higher plans) lets you test a rule's conditions in real time against a selected existing order, including simulating a specific point in time. Rules cannot be deleted while they are still assigned somewhere.","citations":["merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md:10-21","merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md:33-96","merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md:112-135","merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md:187-189","merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md:207-209","merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md:249-251"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/rules; find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings -maxdepth 1 -type d -not -path '*/.git/*'"},{"tool":"Read","args":"docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-03":{"query":"How do I add a custom Store API route for a headless storefront?","category":"dev","option":"fs-docs","answer":"In a plugin, create an abstract route class (e.g. `AbstractExampleRoute` in `<plugin root>/src/Core/Content/Example/SalesChannel/`) with an abstract `getDecorated(): AbstractExampleRoute` and an abstract `load(Criteria $criteria, SalesChannelContext $context): ExampleRouteResponse` method (this abstract-class pattern makes routes decoratable). Fields you want exposed via the API must carry the `ApiAware` flag in their entity definition. Then create the concrete `ExampleRoute` class extending the abstract class, annotated with `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]])]` at class level, and a method-level `#[Route(path: '/store-api/example', name: 'store-api.example.search', methods: ['GET','POST'], defaults: ['_entity' => 'swag_example'])]` on `load()`, which injects the entity's `EntityRepository` and returns a `search()` result wrapped in a response object. `getDecorated()` must throw `DecorationPatternException` if undecorated. Create the `ExampleRouteResponse` class extending `Shopware\\Core\\System\\SalesChannel\\StoreApiResponse`, which wraps an `EntitySearchResult` and exposes a getter (e.g. `getExamples()`) for the entity collection. Register the route class as a service in `services.php` with the repository injected as an argument. Finally, register a `routes.php` file at `<plugin root>/src/Resources/config/` with `$routes->import('../../Core/**/*Route.php', 'attribute');` \u2014 route classes are only discovered as endpoints once imported this way. Verify registration with `./bin/console debug:router store-api.example.search` (this only confirms discovery, not that a request will succeed). Optionally add an OpenAPI JSON schema file under `<plugin root>/src/Resources/Schema/StoreApi/` so the route shows up in the Stoplight documentation at `/store-api/_info/stoplightio.html`. To also expose the route to the (non-headless) Storefront, wrap it in a Storefront controller with `StorefrontRouteScope::ID` and import `'../../Storefront/**/*Controller.php'` in `routes.php` as well; this is optional for a purely headless use case where the Store API route itself is already sufficient.","citations":["developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md:8-421"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-64":{"query":"How do I get an Admin API OAuth token \u2014 with client_credentials for an integration, or the password grant for local testing \u2014 and how long is each token valid?","category":"dev","option":"fs-docs","answer":"For an integration (the recommended/default approach), create an integration in the Administration under Settings \u2192 System \u2192 Integrations with the 'Administrator' toggle enabled, copy the Access key ID (maps to OAuth `client_id`) and Secret access key (maps to `client_secret`), then request a token:\n```bash\ncurl -s \"http://127.0.0.1:8000/api/oauth/token\" -H \"Content-Type: application/json\" -d '{\"grant_type\": \"client_credentials\", \"client_id\": \"YOUR_ACCESS_KEY_ID\", \"client_secret\": \"YOUR_SECRET_ACCESS_KEY\"}'\n```\nA successful response looks like `{\"token_type\": \"Bearer\", \"expires_in\": 3600, \"access_token\": \"...\"}` \u2014 so a client_credentials token is valid for 3600 seconds (1 hour).\n\nFor local development only, you can instead use the password grant with the default Administration credentials:\n```bash\ncurl -X POST \"http://localhost:8000/api/oauth/token\" -H \"Content-Type: application/json\" -d '{\"grant_type\": \"password\", \"client_id\": \"administration\", \"scopes\": \"write\", \"username\": \"admin\", \"password\": \"shopware\"}'\n```\nThe response is `{\"token_type\": \"Bearer\", \"expires_in\": 600, \"access_token\": \"...\", \"refresh_token\": \"...\"}` \u2014 so a password-grant token is valid for only 600 seconds (10 minutes), but it also returns a `refresh_token`. The docs explicitly say the password grant should be used only as a local shortcut, and that `client_credentials` remains the default/preferred approach for integrations and reproducible setups.","citations":["developer/guides/development/integrations-api/index.md:76-111","developer/guides/development/integrations-api/auth-api-requests.md:11-40"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"client_credentials\" docs/shopware-knowledge-bases/developer --include=*.md | head -20"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/auth-api-requests.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/index.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-08":{"query":"How do custom field sets work - entity assignment, field types and technical name - and can a custom field be written through the Store API?","category":"func","option":"fs-docs","answer":"Custom fields ('additional fields') are managed under Settings > System > Custom fields, and let you add your own data fields to various program areas (e.g. products, categories) for info not covered by the standard system - usable in the Rule Builder or displayed in the storefront via template adjustment. Custom fields should be edited in the store's default language so the value is inherited by all languages (translated per-language values override only that language and are not guaranteed to exist everywhere, which can break rule evaluation in other languages, e.g. an unsuitable shipping method becoming purchasable).\n\nCustom fields are organized into Sets: a set groups several thematically related custom fields together and is then assigned to one or more program areas (e.g. products, categories). Creating a set ('New set' button) requires a unique, permanent technical name (cannot be changed later), and lets you set a Position (higher numeric value = displayed further back), an optional Label (translatable per administration language), and which program area(s) the set applies to - if no area is selected the set exists but isn't usable anywhere.\n\nWithin a set you create individual custom fields ('New custom field' button). Every field type requires a unique Technical name (mandatory, cannot be changed afterward, and must avoid Twig special characters like '-' or '#' to prevent product-export errors); fields are auto-registered as snippets in all snippet sets automatically. Available field types include: Select (single or multi-select from defined options, each option itself needs a technical name and label, plus placeholder/help text); Object selection (a direct reference to another data entity - dynamic product group, experience world, manufacturer, category, customer, country, delivery method, product, sales channel, or payment method - with the Object type fixed once created, and optional multiple selection); Text field; Media; Number (with Number type integer/float, Steps, Min, Maximum); Date/Time; Checkbox; Active/Inactive switch (boolean 0/1); Text Editor (styled/rich text); and Color picker (palette or HEX code).\n\nCommon settings across most field types include Position, Label, Placeholder, Help text, 'Available in shopping carts' (exposes the field to cart data so it can be used in the Rule Builder or custom templates), and 'Modifiable via Store API'. Regarding the Store API question: yes - when 'Modifiable via Store API' is activated for a custom field, the Store API is explicitly allowed to write/modify that field's value, e.g. to capture custom data for new storefront fields such as extra registration-form inputs. The docs caution that this setting makes the field publicly writable, so critical data (like customer-sensitive information) should not be exposed this way.\n\nCustom fields can also be linked to Text or Text & Images blocks in Shopping Experiences via 'Data Mapping', pulling in dynamic per-product custom-field content instead of static text. Displaying a custom field's value in the storefront (outside of Shopping Experiences) requires a template adjustment as described in the 'changing a template' article.","citations":["merchant/content/en/shopware-6/settings/custom-fields/v1-3-2-0.md:10-47","merchant/content/en/shopware-6/settings/custom-fields/v1-3-2-0.md:49-90","merchant/content/en/shopware-6/settings/custom-fields/v1-3-2-0.md:95-240","merchant/content/en/shopware-6/settings/custom-fields/v1-3-2-0.md:242-265"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/custom-fields/"},{"tool":"Read","args":"docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/custom-fields/v1-3-2-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-55":{"query":"How do the breaking storefront accessibility changes reach my theme in Shopware 6.7, and what must an extension that overrides the affected Twig blocks do?","category":"dev","option":"fs-docs","answer":"Breaking accessibility changes (which may alter HTML/Twig structure or CSS) are not enabled by default before 6.7 \u2014 they are gated behind the `ACCESSIBILITY_TWEAKS=1` feature flag (set in `.env`), the same mechanism used for major feature flags like `V6_7_0_0`. Enabling the flag activates all available accessibility improvements so extension/theme authors can check compatibility ahead of time. With the major version v6.7.0, all these accessibility improvements become the default (the flag effectively becomes 'always on'). In practice, when a change alters markup (e.g. converting `<div class=\"list-item\">` markup inside a `component_list_items` block to a semantic `<ul>/<li>` structure inside a new block like `component_list_items_inner`), the core Twig template wraps the old and new markup in an `{% if feature('ACCESSIBILITY_TWEAKS') %}...{% else %}...{% endif %}` branch, and marks the old block/markup with a Twig `{# @deprecated tag:v6.7.0 ... #}` comment. An extension/theme that overrides the affected block must extend both variants during the transition: override the new block (e.g. `component_list_items_inner`) to already assume the accessible markup (e.g. add `<li>` items), while also keeping (and later removing after v6.7.0) an override of the old block (e.g. `component_list_items`) for compatibility with installations where the flag is still off. After 6.7.0 ships with the flag defaulted on, the old block override can be deleted. Enabling the flag also requires a theme recompile (`bin/console theme:compile`) to apply styling changes such as adjusted font sizes.","citations":["developer/guides/development/accessibility/storefront-accessibility.md:19-100","developer/guides/development/accessibility/storefront-accessibility.md:158-218"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"accessibility\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"docs/shopware-knowledge-bases/developer/guides/development/accessibility/storefront-accessibility.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-07":{"query":"How do I create a media entity from a file on disk in PHP from my plugin (e.g. during an import) and generate its thumbnails?","category":"gap","option":"fs-docs","answer":"The corpus's Media guide section (developer/guides/plugins/plugins/content/media/index.md) only lists three narrow guides \u2014 preventing deletion of referenced media files, adding a custom media file extension, and remote thumbnail generation \u2014 none of which is a 'create a media entity from a local file in PHP' how-to. No page documents the `FileSaver`/`MediaService` APIs for persisting a file from disk with example code, and no code sample calling a thumbnail-generation service was found. The only concrete references to these classes are incidental: `developer/guides/plugins/plugins/content/media/remote-thumbnail-generation.md` mentions in passing (describing what changes when remote thumbnails are enabled) that 'FileSaver \u2014 uploads no longer dispatch a `GenerateThumbnailsMessage`' and that `ThumbnailService`'s `generate()`, `updateThumbnails()`, and `deleteThumbnails()` methods exist and can throw `MediaException::thumbnailGenerationDisabled()` \u2014 but it assumes the reader already knows how to call these APIs and gives no constructor/DI wiring or usage example. A Migration Assistant extension doc (developer/products/extensions/migration-assistant/concept/media-processing.md) shows an unrelated, product-specific `MediaFileService::saveMediaFile()` call queuing a file by URI for later async processing, which is part of that extension's own queued-import architecture, not a general-purpose 'create media from disk' plugin pattern. I could not find a sourced, generic PHP code example for creating a media entity from a local file and generating thumbnails in this corpus.","citations":["developer/guides/plugins/plugins/content/media/index.md:8-17","developer/guides/plugins/plugins/content/media/remote-thumbnail-generation.md:68-77","developer/products/extensions/migration-assistant/concept/media-processing.md:14-59"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"media.*upload|MediaService|FileSaver|generate.*thumbnail\" docs/shopware-knowledge-bases/developer --include=*.md -i"},{"tool":"Read","args":"developer/guides/plugins/plugins/content/media/index.md"},{"tool":"Bash","args":"grep -rln \"saveMediaFile|FileSaver|persistFileToMedia|MediaService\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"developer/products/extensions/migration-assistant/concept/media-processing.md"},{"tool":"Read","args":"developer/guides/plugins/plugins/content/media/remote-thumbnail-generation.md"},{"tool":"Bash","args":"grep -rln \"saveFile(|MediaService::|fileSaver|generateThumbnails|ThumbnailService\" docs/shopware-knowledge-bases/developer --include=*.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"dev-15":{"query":"How do I work out which event Shopware actually dispatches for a given action, for example after a product is loaded or a page is rendered?","category":"dev","option":"fs-docs","answer":"There are several complementary ways to find the exact event: 1) For DAL entities, events follow the fixed pattern `entity_name.event` (e.g. `product.written`, `product.deleted`); many default entities also expose an 'event class' with constants, e.g. `ProductEvents` (search for `@Event` to find these classes). 2) For general PHP events, read the core code for `$this->eventDispatcher->dispatch($someEvent, $someEvent->getName())` calls, or search the codebase for `extends NestedEvent`, `extends Event`, `implements ShopwareEvent`, or `->dispatch` to find where events are fired. 3) Check a service's service definition or constructor for an injected `event_dispatcher`/`EventDispatcherInterface` argument \u2014 if present, that service likely dispatches at least one event. 4) For page loads specifically, look at `GenericPageLoader`, which dispatches a `GenericPageLoadedEvent` every time a page loads \u2014 search for the term `PageLoadedEvent` to find these. 5) For DAL `Criteria`-based loading, search for `CriteriaEvent` (e.g. `ProductListingCriteriaEvent`), fired before entities are loaded via a Criteria object so you can modify it. 6) Symfony provides route-scoped events named `{route}.request`, `{route}.response`, `{route}.render` (storefront, before Twig rendering), `{route}.encode` (Store API, before JSON encoding, since 6.6.11.0) and `{route}.controller` (since 6.6.11.0) \u2014 substitute the actual route name. 7) Business/ecommerce events (e.g. customer registered, order placed) can be found by searching for `implements BusinessEventInterface` or `implements MailActionInterface`. 8) Easiest at runtime: use the Symfony profiler's 'Events' tab to see every event actually fired during the current request, including its exact name.","citations":["developer/guides/plugins/plugins/framework/event/finding-events.md:16-259"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/event -maxdepth 1 -name \"*.md\""},{"tool":"Read","args":"developer/guides/plugins/plugins/framework/event/finding-events.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-52":{"query":"What must a plugin database migration class implement in Shopware 6.7, and where does the database cleanup on uninstall belong?","category":"dev","option":"fs-docs","answer":"A plugin migration class must extend `Shopware\\Core\\Framework\\Migration\\MigrationStep` and live in the plugin's `src/Migration` directory (or a custom namespace set via `getMigrationNamespace()`), named `Migration<timestamp><Description>.php`. It must implement `getCreationTimestamp(): int` (returning the timestamp embedded in the filename, generated automatically by `database:create-migration`) and `update(Connection $connection): void`, where all schema and data changes for the plugin are implemented \u2014 this is run automatically on plugin install/update. There is no migration rollback: `MigrationStep` also defines an optional `updateDestructive()` method used by Shopware core for delayed, major-version destructive changes, but plugin install/update never runs it and merchants/platforms typically do not run `database:migrate-destructive` for plugins either \u2014 so every change a plugin needs must go into `update()`. Cleaning up the database when a plugin is uninstalled does NOT belong in the migration class; it belongs in the plugin's lifecycle `uninstall()` method (see the Plugin Lifecycle guide).","citations":["developer/guides/plugins/plugins/database/database-migrations.md:63-105"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"MigrationStep|database migration\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"docs/shopware-knowledge-bases/developer/guides/plugins/plugins/database/index.md"},{"tool":"Read","args":"docs/shopware-knowledge-bases/developer/guides/plugins/plugins/database/database-migrations.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-02":{"query":"What's the plugin lifecycle in Shopware \u2014 install, activate, uninstall \u2014 and how does `keepUserData` work?","category":"dev","option":"fs-docs","answer":"A Shopware plugin extends `Shopware\\Core\\Framework\\Plugin` (which extends `Shopware\\Core\\Framework\\Bundle`, itself extending Symfony's `Bundle`) and goes through the lifecycle stages Install, Activate, Deactivate, Update, and Uninstall, implemented as methods on the base plugin class (`<plugin root>/src/SwagBasicExample.php`): `install()` (executed on install \u2014 register entities such as payment methods, create initial data, prepare system requirements; avoid creating fully active business data here, keep it inactive until activate), `activate()` (executed before activation \u2014 activate entities created in install, or create new ones), `deactivate()` (executed before deactivation \u2014 deactivate or remove entities), `update()` (executed on update \u2014 non-database adjustments; DB changes should go through plugin migrations instead), `postInstall()`/`postUpdate()` (executed after a successful install/update), and `uninstall()` (executed on uninstall \u2014 remove or clean up plugin data). The `uninstall()` method receives an `UninstallContext`, which provides the same info as `InstallContext` plus a `keepUserData()` flag: if `$uninstallContext->keepUserData()` returns true, the plugin must NOT delete persistent data it created \u2014 this must be respected to avoid unintended data loss. Example: check `if ($uninstallContext->keepUserData()) { return; }` before deleting data. It's also warned not to blindly delete entities (e.g. a payment method used in real orders) since that can leave production data (like orders) in a broken state \u2014 deactivating is often safer than deleting.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md:8-189"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"keepUserData\" docs/shopware-knowledge-bases/developer/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-71":{"query":"How does an app define its own custom entities in Shopware 6.7 and read them back through the API?","category":"dev","option":"fs-docs","answer":"An app defines new custom data structures by registering them in its `Resources/entities.xml` file (validated against the `entity-1.0.xsd` schema). Each `<entity>` element (named e.g. `custom_entity_bundle`) lists `<fields>` such as `string`, `price`, and `many-to-many` (with `store-api-aware`, `translatable`, `required` attributes as needed). Every registered entity automatically gets a repository, accessible from App Scripts via `services.repository.search('custom_entity_bundle', criteria)`, and also through the Admin API by POSTing to `/api/search/custom-entity-bundle` (dashes replace underscores in the route). Since Shopware 6.4.15.0 you can use the `ce_` shorthand prefix for entity names to avoid DB name-length issues, in which case the same prefixed name must be used consistently in the repository and API calls (e.g. `POST /api/search/ce_blog`). Apps automatically have full permission to their own custom entities, but need explicit `<read>`/etc. permissions in the manifest for associations pointing to core entities like `product`. Since 6.5.1.0, a custom entity can also be made available as an 'Entity Select' custom field type by adding `custom-fields-aware=\"true\"` and a `label-property` attribute to the entity definition. Custom entity names cannot be renamed later without losing all existing data.","citations":["developer/guides/plugins/apps/custom-data/custom-entities.md:1-128"],"toolCallLog":[{"tool":"Bash","args":"mkdir -p .../raw/fs-docs/ ; ls docs/shopware-knowledge-bases/"},{"tool":"Read","args":"docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"grep -rl 'custom entit' docs/shopware-knowledge-bases/developer --include=*.md -i | head -20"},{"tool":"Read","args":"docs/shopware-knowledge-bases/developer/guides/plugins/apps/custom-data/custom-entities.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-04":{"query":"How do I fetch products with `GET /sales-channel-api/v3/product` on Shopware 6.7?","category":"edge","option":"fs-docs","answer":"No current documentation supports this route for Shopware 6.7. Searching the developer docs for 'sales-channel-api' only surfaces two historical Architecture Decision Records from 2020 (2020-07-02-implement-sales-channel-context-token-requirement.md and 2020-11-20-add-login-required-annotation.md) that mention a 'sales-channel-api' alongside 'store-api' as two separate legacy API surfaces from that era, with no version-3 product endpoint documented. The current, maintained customer-facing API described in the corpus is the Store API (developer/concepts/api/store-api.md), described as 'the customer-facing surface of Shopware... designed for storefront/frontend-related interactions such as product browsing, cart handling, checkout, and customer account management,' which points to an external Stoplight reference for endpoint details rather than documenting routes like `/sales-channel-api/v3/product` in this corpus. There is no page in this corpus describing a `/sales-channel-api/v3/product` endpoint or confirming it exists in Shopware 6.7.","citations":["developer/concepts/api/store-api.md:8-17","developer/resources/references/adr/2020-07-02-implement-sales-channel-context-token-requirement.md:8-28"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"sales-channel-api\" docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"grep -n -i \"sales-channel-api\" docs/shopware-knowledge-bases/developer/resources/references/adr/2020-11-20-add-login-required-annotation.md"},{"tool":"Bash","args":"grep -ril \"store-api\\b\" docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/concepts/api/store-api.md"},{"tool":"Bash","args":"grep -rn \"sales-channel-api\" docs/shopware-knowledge-bases/developer"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"dev-37":{"query":"How do I set up and run PHPUnit integration tests for my Shopware plugin, including tests that boot the kernel?","category":"dev","option":"fs-docs","answer":"Create a `phpunit.xml` at the plugin root (it can be auto-generated by `bin/console plugin:create`) pointing `bootstrap` at `tests/TestBootstrap.php`, setting `<server name=\"KERNEL_CLASS\" value=\"Shopware\\Core\\Kernel\"/>` plus `<env name=\"APP_ENV\" value=\"test\"/>`, `APP_DEBUG=1`, `SYMFONY_DEPRECATIONS_HELPER=weak`, a `<coverage><include><directory>./src/<\/directory><\/include><\/coverage>` block, and `<testsuites>` pointing at directories like `Migration/Test` and `Test` under `src`. Also generate `<plugin root>/tests/TestBootstrap.php`, which uses `Shopware\\Core\\TestBootstrapper` \u2014 `(new TestBootstrapper())->addCallingPlugin()->addActivePlugins('BasicExample')->setForceInstallPlugins(true)->bootstrap()->getClassLoader()` \u2014 and registers a PSR-4 mapping for your test namespace; `setForceInstallPlugins(true)` ensures the plugin is installed/active even if the test DB already existed. For an integration test that needs the booted kernel/container, extend PHPUnit's `TestCase` and use the `Shopware\\Core\\Framework\\Test\\TestCaseBase\\IntegrationTestBehaviour` trait (gives automatic DB transaction setup and cache clearing per test) \u2014 e.g. a test that instantiates every plugin class. For tests needing just a DB connection from the container (e.g. testing a migration), use the `KernelTestBehaviour` trait instead and fetch services via `$this->getContainer()->get(Connection::class)`. To make services behave differently under test (e.g. avoid real API calls), add `<plugin root>/Resources/config/services_test.php`, which overrides `services.php` only in the test environment. Run tests with the PHPUnit binary from `vendor/bin`: `./vendor/bin/phpunit --configuration=\"custom/plugins/SwagBasicExample\" --testsuite \"migration\"` for one testsuite, omit `--testsuite` to run everything, or use `--filter testMethodName` / `--filter TestClassName` to run a specific test. If you're on the Symfony Flex template setup, install the `dev-tools` package first via `composer require --dev dev-tools` to be able to run PHPUnit tests.","citations":["developer/guides/development/testing/unit/php-unit.md:1-214"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/development/testing/; ls docs/shopware-knowledge-bases/developer/guides/development/testing/legacy"},{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/development/testing/unit; grep -rli \"phpunit\" docs/shopware-knowledge-bases/developer/guides"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/testing/unit/php-unit.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-49":{"query":"My storefront controller still uses the `@Route` and `@RouteScope` annotations from 6.4 \u2014 what is the attribute form in Shopware 6.7 and how are the routes wired?","category":"dev","option":"fs-docs","answer":"Prior to Shopware 6.4.11.0, `_routeScope` was configured with a dedicated `@RouteScope` annotation; this way of defining the route scope is deprecated as of the 6.5 major version. In current Shopware, routes and route scope are defined with PHP 8 attributes instead of docblock annotations, using Symfony's `Route` attribute (`Symfony\\Component\\Routing\\Attribute\\Route`) with a `defaults` array containing `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]`. At the class level you put this on the controller: `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]])] class ExampleController extends StorefrontController {}`. On individual methods, you add `#[Route(path: '/example', name: 'frontend.example.example', methods: ['GET'])]`, and the route scope can also optionally be set per-route by adding the same `defaults` array to the method-level attribute. Route names must use one of the prefixes `frontend`, `widgets`, `payment`, `api` or `store-api` to be recognized correctly (or you can allow custom route names without a prefix via a `storefront.router.allowed_routes` config entry, available since Shopware 6.7.2.0). Wiring: the controller is registered as a public service in `services.php` with `->public()->call('setContainer', [service('service_container')])`, and Shopware discovers the routes by importing the controller files via a `routes.php` file: `$routes->import('../../Storefront/Controller/*Controller.php', 'attribute');` \u2014 note the `'attribute'` type, confirming that attribute-based route loading (not annotations) is the current mechanism.","citations":["developer/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:23-190","developer/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:248-320"],"toolCallLog":[{"tool":"Bash","args":"grep -rln 'RouteScope' . --include=*.md | grep -v .git (cwd docs/shopware-knowledge-bases/developer)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/controllers/add-custom-controller.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-11":{"query":"On Shopware 6.7, which file do I declare my plugin's services in, and how do I get a core service passed into my service's constructor?","category":"dev","option":"fs-docs","answer":"On Shopware 6.7 you declare plugin services in a PHP config file at `PLUGIN_ROOT/src/Resources/config/services.php` (XML `services.xml` is deprecated as of 6.7). The file returns a closure taking a `ContainerConfigurator` and uses `$configurator->services()`. You can either turn on `autowire()`/`autoconfigure()` in `->defaults()` and `$services->load(...)` your namespace so constructor type-hints (e.g. injecting `SystemConfigService`) are resolved automatically, or declare the service explicitly with `$services->set(ExampleService::class)->args([service(SystemConfigService::class)])` to pass the core service into the constructor. In the service class itself the core service is simply a typed constructor parameter, e.g. `public function __construct(private SystemConfigService $systemConfigService) {}`.","citations":["developer/guides/plugins/plugins/services/add-custom-service.md:16-63","developer/guides/plugins/plugins/services/dependency-injection.md:20-78"],"toolCallLog":[{"tool":"Bash","args":"cat docs/shopware-knowledge-bases/developer/index.md | head -100"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname \"*dependency*\" -o -iname \"*services.xml*\" -not -path '*/.git/*'"},{"tool":"Read","args":"developer/guides/plugins/plugins/services/dependency-injection.md"},{"tool":"Bash","args":"grep -rl \"services.xml\" docs/shopware-knowledge-bases/developer --include=\"*.md\" | grep -v b2b-suite"},{"tool":"Read","args":"developer/resources/references/adr/2026-07-30-migrate-container-configuration-from-xml-to-php.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/services -maxdepth 1 -name \"*.md\""},{"tool":"Read","args":"developer/guides/plugins/plugins/services/add-custom-service.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-34":{"query":"How do I extend an existing Administration component and its Twig blocks from my plugin, for example to change the dashboard headline?","category":"dev","option":"fs-docs","answer":"Use `Shopware.Component.override('component-name', { template })` to overwrite an existing component's behavior in place, or `Shopware.Component.extend('new-name', 'existing-name', { template })` to create a brand-new component based on an existing one. To change a template, find the Twig `block` you need in the component's original `.html.twig` file and redeclare it in your own twig file with the same block name \u2014 this replaces the block; include `{% parent %}` inside the block if you want to keep the original markup and just add to it. You can also extend/override `methods` and `computed` properties the same way, using `this.$super('methodName')` inside the new implementation to call the original logic. Worked example for the dashboard headline: the dashboard's `sw-dashboard-index.html.twig` contains a block named `sw_dashboard_index_content_intro_content_headline`; create `<plugin root>/src/Resources/app/administration/src/sw-dashboard-index-override/sw-dashboard-index.html.twig` that redeclares only that block with your new markup (e.g. `<h1>Welcome to a customized component<\/h1>`), then in `<plugin root>/src/Resources/app/administration/src/sw-dashboard-index-override/index.js` import that template and call `Shopware.Component.override('sw-dashboard-index', { template })`. Finally import that index.js from your plugin's `main.js` (placed at `<plugin root>/src/Resources/app/administration/src/main.js`) so Shopware picks it up automatically. Note: this is the stable Options API extension system; Shopware also has an experimental Composition API extension system (`Shopware.Component.createExtendableSetup` / `Shopware.Component.overrideComponentSetup`) intended for components written with the Composition API, but plugin developers are told to keep using the Options API system (Component.extend/override) for components still on the Options API.","citations":["developer/guides/plugins/plugins/administration/module-component-management/customizing-components.md:1-227"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/module-component-management/customizing-components.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-03":{"query":"My ERP integration stopped logging in after the 6.7 upgrade \u2014 what changed in the Admin API OAuth flow (`/api/oauth/authorize`, the `scope` format)?","category":"gap","option":"fs-docs","answer":"No page in this corpus documents a 6.7-specific change to `/api/oauth/authorize` or to the OAuth `scope` format, and no `/api/oauth/authorize` endpoint is mentioned at all \u2014 only `/api/oauth/token`. The current documented flow (developer/guides/development/integrations-api/index.md) is: create an integration under Settings \u2192 System \u2192 Integrations, use its Access key ID / Secret access key as `client_id`/`client_secret`, and POST to `/api/oauth/token` with `grant_type: client_credentials` to receive a Bearer `access_token`. A separate local-only shortcut (developer/guides/development/integrations-api/auth-api-requests.md) uses `grant_type: password` with `client_id: administration`, `username`/`password`, and a `scopes` field passed as the string `\"write\"` (not shown as an array). Neither page discusses a prior/legacy scope format, an authorization-code (`/api/oauth/authorize`) grant, or any 6.7 migration note for ERP/integration clients. I could not find sourced material in this corpus explaining what changed in 6.7 for this flow.","citations":["developer/guides/development/integrations-api/index.md:76-107","developer/guides/development/integrations-api/auth-api-requests.md:11-40"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"oauth/authorize|oauth\" docs/shopware-knowledge-bases/developer --include=*.md -i"},{"tool":"Read","args":"developer/guides/development/integrations-api/auth-api-requests.md"},{"tool":"Read","args":"developer/guides/development/integrations-api/index.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"dev-43":{"query":"My admin plugin still ships a webpack.config.js \u2014 how do I move the administration build to Vite for Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Shopware switched the Administration build from Webpack to Vite in 6.7. For apps there is no impact (build already decoupled). For plugins, you only need to act if you currently extend the webpack config via a custom `webpack.config.js`. To migrate: 1) Create a new `vite.config.mts` file in your plugin at `YourApp/src/Resources/app/administration/src` (previously the webpack config lived in `YourApp/src/Resources/app/administration/build/webpack.config.js`); 2) Remove the old `webpack.config.js` file; 3) Remove all webpack-related dependencies from `package.json`; 4) Add the Vite dependencies to `package.json`. A basic config that used `module.exports = () => ({ resolve: { alias: {...} } })` becomes `import { defineConfig } from 'vite'; export default defineConfig({ resolve: { alias: {...} } });`. The migration complexity depends on how much your old webpack config did \u2014 consult the Vite docs (vite.dev/config) for advanced options. The build commands stay the same: `composer build:js:admin` still builds the Administration with all extensions, and `composer watch:admin` still runs the dev/HMR server; a script at `<shopwareRoot>/src/Administration/Resources/app/administration/build/plugins.vite.ts` uses Vite's JS API to build all extensions listed in `var/plugins.json` (generated by `php bin/console bundle:dump`). The feature can currently be tested via the `ADMIN_VITE` feature flag. Note: this document is explicitly marked as subject to change (a 'Future Development Roadmap' article).","citations":["developer/guides/upgrades-migrations/administration/vite.md:1-158"],"toolCallLog":[{"tool":"Bash","args":"ls guides/upgrades-migrations/administration; grep -rln 'vite|Vite' guides/upgrades-migrations/ -i (cwd docs/shopware-knowledge-bases/developer)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/administration/vite.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-45":{"query":"Shopware.State is deprecated in 6.7 \u2014 how do I convert my administration Vuex module into a Pinia store?","category":"dev","option":"fs-docs","answer":"With Shopware 6.7, Vuex is replaced by Pinia as the administration's state management library. To migrate a Vuex module: instead of exporting a plain object with `namespaced: true`, `state` (object), `mutations`, `getters`, `actions`, register the store with `Shopware.Store.register('<storeName>', { state: () => ({...}), getters: {...}, actions: {...} })` (state must now be a function returning the initial state, not a static object), and export the returned store. You can alternatively register with an `id` property inside the definition object. Mutations are no longer needed \u2014 modify state directly inside actions (e.g. `this.productName = newName`). Getters cannot share a name with a state property since both are exposed at the same level. Instead of `Shopware.State.registerModule('product', productsStore)`, you register a store simply by importing its file (e.g. `import './state/products.state';`), and you can unregister with `Shopware.Store.unregister('<storeName>')`. To access the store, replace `Shopware.State.get('<storeName>')` with `Shopware.Store.get('<storeName>')`. Pinia also supports composable-style stores (a setup function returning refs/computed/functions) and TypeScript typing via `ReturnType<typeof store>` extending `PiniaRootState`. For testing, import the store file to register it and call `store.$reset()` before each test; for component tests, create a Pinia instance with `createPinia()`, call `setActivePinia(pinia)`, and pass it as a plugin when mounting.","citations":["developer/guides/upgrades-migrations/administration/pinia.md:1-236"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/administration/pinia.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-56":{"query":"Header and footer are loaded through ESI sub-requests in Shopware 6.7, so page data is gone in my header template \u2014 how do I pass my own data into the header/footer now?","category":"dev","option":"fs-docs","answer":"Since ESI loading was introduced for header and footer, they are loaded via sub-requests and are no longer dependent on the current page data, so it's no longer possible to customize them based on current-page data by default. If you need general custom data in the header/footer (not tied to current page), you can still add it via the 'Add data to storefront page' mechanism. If you specifically need current-page-dependent data, you must extend the ESI request itself: override the `base_esi_header` / `base_esi_footer` blocks in `Storefront/Resources/views/storefront/base.html.twig` (extend it from your plugin's `PLUGIN_ROOT/src/Resources/views/storefront/base.html.twig`) and merge extra scalar values into the `headerParameters` variable (e.g. `{% set headerParameters = headerParameters|merge({'vendorPrefixPluginName': {'activeRoute': activeRoute}}) %}` before calling `{{ parent() }}`). Those parameters are passed to the header route as query parameters and become available in the header template (`layout/header.html.twig`) as `headerParameters.vendorPrefixPluginName.activeRoute`. Important: `headerParameters` and `footerParameters` can only contain scalar values, since they are literally query parameters of the ESI routes. Alternatively, in plugins you can listen to the `StorefrontRenderEvent`, check that `$event->getRequest()->attributes->get('_route')` is `frontend.header` (or `frontend.footer`), and use `$event->getParameter('headerParameters')` / `$event->setParameter('headerParameters', ...)` to inject data that way. It is also possible to load fully custom header/footer templates (as core does on the checkout confirm page), but that overwrites customizations from every other extension, and you must ensure `header`/`footer` data is still supplied by the controller if your custom template extends the original.","citations":["developer/guides/plugins/plugins/storefront/templates/customize-header-footer.md:8-103"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"ESI|sub-request|esi\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Bash","args":"grep -rl \"header.*footer|Header.*Footer\" docs/shopware-knowledge-bases/developer --include=*.md -i | xargs grep -l \"ESI\" -i"},{"tool":"Read","args":"docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/templates/customize-header-footer.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-16":{"query":"How do I run plugin logic whenever an order is written, and find out exactly which fields changed?","category":"dev","option":"fs-docs","answer":"Every entity in Shopware (including `order`) dispatches DAL events following the pattern `entity_name.event`, so for orders you can subscribe to `order.written` (backed by `Shopware\\Core\\Framework\\DataAbstractionLayer\\Event\\EntityWrittenEvent`, which provides the reference class of the written definition, the data that was written, the write context, the affected primary keys, and any errors). To act BEFORE the write and inspect exactly which data is about to be written, subscribe instead to the generic `Shopware\\Core\\Framework\\DataAbstractionLayer\\Event\\EntityWriteEvent`, tagging your subscriber class with `kernel.event_subscriber` in `services.php`. In the handler you can call `$event->getIds('order')` to get affected IDs for the order entity, and `$event->getCommandsForEntity('order')` (or `$event->getCommands()`) to get the individual `WriteCommand`s, then call `$command->getPayload()` on each to get the actual field/value data that is about to be written \u2014 this is how you find out exactly which fields changed. You can also register `addSuccess()`/`addError()` callbacks on the event to run code after the write succeeds or fails. Register the subscriber the same way as any other: implement `EventSubscriberInterface`, map the event to a handler in `getSubscribedEvents()`, and tag the service with `kernel.event_subscriber` in `s
