er the nothing-softened rule.","gap-06: accuracy-pass provisionalAccuracy claim (70) does not match the scorer's actual band (100); accuracy pass appears to have re-derived its own judgment rather than settled the tracked provisional with no documented justification for the shift (100 -> 70). Keeping the scorer's original accuracy band per the nothing-softened rule.","rescore dev-11: groundingRelevance 100 -> 70","rescore dev-11: completeness 40 -> 40","rescore dev-63: accuracy 40 -> 40","rescore dev-63: citation 40 -> 40","rescore dev-65: honesty 70 -> 0","rescore dev-65: actionability 100 -> 70","rescore dev-68: completeness 70 -> 70","rescore func-08: groundingRelevance 100 -> 70","rescore func-08: accuracy 70 -> 40","rescore func-08: completeness 100 -> 40","rescore func-11: groundingRelevance 100 -> 70","rescore func-11: completeness 100 -> 70","rescore func-11: actionability 100 -> 70"]},"raw":{"vanilla":{"dev-01":{"query":"How do I extend the product entity with a new association in Shopware's Data Abstraction Layer?","category":"dev","option":"vanilla","answer":"To add a new association to an existing entity like Product, you should not modify the core entity definition; instead create an EntityExtension class and override defineFields() to return a FieldCollection with the new association field (for example an FkField plus a ManyToOneAssociationField for a many-to-one relation, or a mapping definition extending MappingEntityDefinition plus ManyToManyAssociationField on both sides for many-to-many). You must set autoload to true only on the EntityExtension side, not on the EntityDefinition, otherwise you get a recursion/out-of-memory error.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-data-associations.html","quote":"Setting autoload to `true` on the `EntityExtension` and `EntityDefinition` will lead to a recursion / out of memory error. If you want to get the association on every load, set autoload to `true` only in the `EntityExtension`."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware developer docs extend product entity add association Data Abstraction Layer"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-data-associations.html, prompt=Explain how to extend an existing entity (like Product) with a new association in Shopware's Data Abstraction Layer. Include the exact class to extend and key method names, and any short code example."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:18:43Z","endedAt":"2026-09-15T14:20:30Z"},"dev-02":{"query":"What's the plugin lifecycle in Shopware — install, activate, uninstall — and how does `keepUserData` work?","category":"dev","option":"vanilla","answer":"A Shopware plugin's main lifecycle bootstrap file (extending Plugin) implements install(), activate(), deactivate(), update() and uninstall() methods, each receiving a corresponding *Context object. Install is meant for registering things like payment methods or creating foundational data, and you should avoid creating new business data for your plugin in the install() method since the plugin isn't active yet. Activate typically activates entities created in install() or creates new ones now that the plugin is running, while deactivate reverses that (deactivating entities created by install). Update should be used for non-database adjustments, feature toggles, configuration changes rather than schema changes (those belong in migrations). On uninstall, the UninstallContext's keepUserData() flag reflects the user's choice in the admin UI when uninstalling the plugin; if it returns true, you must not delete persistent data created by your plugin, so uninstall logic typically checks this flag and returns early (or skips deletion) when it is true, and otherwise removes the plugin's data and configuration.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.html","quote":"avoid creating new business data for your plugin in the `install()` method"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.html","quote":"you must not delete persistent data created by your plugin"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 plugin lifecycle install activate uninstall keepUserData"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.html, prompt=Explain the plugin lifecycle in Shopware 6 (install, activate, deactivate, uninstall, update) and how keepUserData works on uninstall. Quote relevant sentences."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:19:12Z","endedAt":"2026-09-15T14:21:00Z"},"dev-03":{"query":"How do I add a custom Store API route for a headless storefront?","category":"dev","option":"vanilla","answer":"In a plugin, first create an abstract route class defining the contract, with a getDecorated() method and a load() method accepting Criteria and SalesChannelContext parameters; the docs note 'we use abstract classes to make our routes more decoratable.' Then implement a concrete route class extending that abstract class, using the #[Route] PHP attribute to declare the path (e.g. /store-api/example) and HTTP method, injecting the repository you need; its getDecorated() must throw a DecorationPatternException because it has no decoration yet. Build a response class extending Shopware\\Core\\System\\SalesChannel\\StoreApiResponse to wrap the entity search result. Register the route class as a service (typically in src/Resources/config/services.php) and import it via a routes.php file in src/Resources/config/ using Symfony's routing configurator so it is auto-discovered. Optionally add a JSON schema file under src/Resources/Schema/StoreApi/ so the internal OpenApi3Generator documents the endpoint for the Store API docs.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/store-api/add-store-api-route.html","quote":"we use abstract classes to make our routes more decoratable."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/store-api/add-store-api-route.html","quote":"the method `getDecorated()` must throw a `DecorationPatternException` because it has no decoration yet."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware developer docs add custom Store API route headless"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/framework/store-api/add-store-api-route.html, prompt=Explain step by step how to add a custom Store API route in a Shopware plugin: abstract class, route annotation/attribute, controller class, registration, response. Quote a few key sentences."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:21:00Z","endedAt":"2026-09-15T14:22:15Z"},"dev-04":{"query":"How do I create a custom CMS element for Shopping Experiences?","category":"dev","option":"vanilla","answer":"Creating a custom CMS element spans administration registration, configuration, and storefront rendering. In the plugin's administration bundle you import your element module in main.js and register it with the CMS element registry service, supplying properties like name, label, component references and a defaultConfig object describing the configuration structure. You build a preview component shown as a thumbnail when selecting or swapping elements in block slots, a main component shown in the editor that represents the final output (using fallback content so the element isn't invisible in the editor when source data is missing), and a config component for the settings panel, ideally using Shopware's Meteor components for a consistent UI. For storefront rendering you add a Twig template following the naming convention cms-element-{name}.html.twig, which receives the element's configuration values as template variables. For better UX with inherited fields (e.g. in variant/child CMS pages) you wrap configuration fields with the sw-cms-inherit-wrapper component to properly display inheritance states.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/content/cms/add-cms-element.html","quote":"The preview is shown as a thumbnail when selecting or swapping elements in block slots."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/content/cms/add-cms-element.html","quote":"Use fallback content to avoid invisible elements in the editor"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware developer docs add CMS element Shopping Experiences custom element"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/content/cms/add-cms-element.html, prompt=Explain step by step how to create a custom CMS element for Shopware Shopping Experiences, including administration registration, config, and storefront Twig template rendering. Quote key sentences."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:22:15Z","endedAt":"2026-09-15T14:23:30Z"},"dev-05":{"query":"How does theme inheritance work in Shopware — theme.json and SCSS overrides?","category":"dev","option":"vanilla","answer":"Every Shopware storefront theme inherits from the default @Storefront theme, and a theme's own theme.json declares its inheritance chain via four sections: views, style, script and asset (plus configInheritance for configuration fields). When a view is rendered, the Storefront template is first used as the basis, and then parent theme changes are applied before the child theme's own modifications, so views/style/script/asset entries are effectively layered with earlier entries in the array acting as the base and later ones overriding. For JavaScript, the javascript of the Storefront serves as the basis, and on top of this come the extensions of the theme, following the same layering pattern. For SCSS, a child theme can add its own override.scss/override.css entry positioned before @Storefront in the style array; this matters because the override.css can affect SCSS variables e.g. $border-radius, so it needs to run before the base variables are consumed. configInheritance lets a theme use the field configuration from the given themes, so a custom theme's configuration inherits from and can override the values of the themes it lists there.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/themes/add-theme-inheritance.html","quote":"when a view gets rendered, the Storefront template is first used as the basis"},{"url":"https://developer.shopware.com/docs/guides/plugins/themes/add-theme-inheritance.html","quote":"the `override.css` can affect SCSS variables e.g. `$border-radius`"},{"url":"https://developer.shopware.com/docs/guides/plugins/themes/add-theme-inheritance.html","quote":"the javascript of the Storefront serves as the basis. On top of this come the extensions of the theme."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware theme inheritance theme.json SCSS override developer documentation"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/themes/add-theme-inheritance.html, prompt=Explain how theme inheritance works in Shopware storefront themes: how theme.json declares inheritance (views, style, script, asset) and how child themes override SCSS. Quote key sentences."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:23:30Z","endedAt":"2026-09-15T14:24:45Z"},"dev-06":{"query":"How do I add a custom Flow Builder action?","category":"dev","option":"vanilla","answer":"In a plugin, first define a custom 'aware' interface extending FlowEventAware (annotated with #[IsFlowEventAware]) in src/Core/Framework/Event/, representing the data your action needs (e.g. a TAG/TAG_ID constant and a getTag() accessor). Then create the action class in src/Core/Content/Flow/Dispatching/Action/ extending FlowAction, implementing getName() (a unique technical id like 'action.create.tag'), requirements() (which aware interfaces the action needs), and handleFlow(StorableFlow $flow) for the business logic; use $flow->getStore($key) to get data from aware interfaces and $flow->getData($key) to get data from the original event. Register the action as a service in services.php tagged with 'flow.action' and a priority/key, e.g. ->tag('flow.action', ['priority' => 600, 'key' => 'action.create.tag']); this tag ensures that your action is included in the response of the /api/_info/flow-actions.json API. Finally add Administration UI pieces under src/Resources/app/administration/src/: a constants file for action names/groups, an override component extending sw-flow-sequence-action to register the action's modal, and a modal component handling the user's configuration, plus translation snippets for labels/descriptions.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/flow/add-flow-builder-action.html","quote":"Use `$flow->getStore($key)` if you want to get the data from aware interfaces... Use `$flow->getData($key)` if you want to get the data from original events"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/flow/add-flow-builder-action.html","quote":"ensures that your action is included in the response of the _`/api/_info/flow-actions.json`_ API."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware developer docs add custom Flow Builder action plugin"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/framework/flow/add-flow-builder-action.html, prompt=Explain step by step how to add a custom Flow Builder action in a Shopware plugin: PHP action class, interface, registration in DI, and Administration UI registration. Quote key sentences."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:24:45Z","endedAt":"2026-09-15T14:26:00Z"},"dev-07":{"query":"My plugin needs to store its own data in a new table — how do I define a custom DAL entity with its definition, entity and collection class so I get a repository for it?","category":"dev","option":"vanilla","answer":"First create a plugin migration that creates the database table (id, your columns, timestamps). Then create an EntityDefinition subclass implementing getEntityName() (returning the table name, e.g. swag_example) and defineFields() (returning a FieldCollection of IdField/StringField/etc., using snake_case storage names and lowerCamelCase property names, with flags like Required/PrimaryKey as needed); the entity name returned by getEntityName is used both as the database table name and as the repository name in the DI container (<the-name>.repository). Create an Entity subclass using the EntityIdTrait with protected properties and getters/setters matching your fields (properties must be at least protected for the DAL to work), and reference it from your definition via getEntityClass(). Create an EntityCollection subclass overriding getExpectedClass() to return your entity class, referenced from the definition via getCollectionClass(). Finally register the definition as a service in services.php tagged with 'shopware.entity.definition' with an entity attribute matching your entity name — this is what makes Shopware auto-generate and inject the <entity-name>.repository service for you.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.html","quote":"the return of your `getEntityName` method will be used for two cases: The database table name"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.html","quote":"The properties of your entity class have to be at least `protected`"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware create custom entity definition entity collection repository plugin add-custom-complex-data"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.html, prompt=Explain step by step how to create a new custom DAL entity in a Shopware plugin: EntityDefinition class, Entity class, EntityCollection class, service registration tag, and how you get a repository for it. Quote key sentences including the DI tag name."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:26:00Z","endedAt":"2026-09-15T14:27:15Z"},"dev-08":{"query":"In a plugin service, what is the Shopware 6 equivalent of Doctrine's `findBy()` — how do I read products with filters, associations and sorting?","category":"dev","option":"vanilla","answer":"There is no direct findBy() equivalent; instead you inject the entity's EntityRepository (e.g. product.repository, type-hinted as Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository) into your service constructor and call search() with a Criteria object and the Context. You build the Criteria by adding filters such as $criteria->addFilter(new EqualsFilter('name', 'Example name')) — searching for any field other than an ID requires such a filter object rather than a plain array — adding associations with $criteria->addAssociation('productReviews') (associations can be chained, e.g. 'productReviews.customer', to load nested relationships), and adding sorting with $criteria->addSorting(new FieldSorting('createdAt', FieldSorting::ASCENDING)). The repository's search() method then returns an EntitySearchResult you can iterate or call first() on.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/reading-data.html","quote":"Searching for any other field"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/reading-data.html","quote":"you can chain the association key"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware developer docs reading data Criteria repository search filter association sorting"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/reading-data.html, prompt=Explain how to read entities such as products using the DAL repository with a Criteria object, including how to add filters, associations and sorting. Give a short code example and quote key sentences."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:27:15Z","endedAt":"2026-09-15T14:28:30Z"},"dev-09":{"query":"How do I make a field on my plugin's own entity translatable per language?","category":"dev","option":"vanilla","answer":"Create a translation table named after your entity plus '_translation' (e.g. entity swag_example -> table swag_example_translation). Then create a translation definition class extending EntityTranslationDefinition, placed as an aggregate of your entity (e.g. <plugin root>/src/Core/Content/Example/Aggregate), overriding getParentDefinitionClass() to return the definition class of the entity you want to translate; you should also create a matching translation Entity and EntityCollection class the same way you would for a normal entity. On the main entity's definition, declare the translatable field with a TranslatedField (e.g. for a 'name' field) plus a TranslationsAssociationField referencing your ExampleTranslationDefinition, so the DAL knows the field's value lives in the translation table per language. Finally register both the main definition and the translation definition as services tagged 'shopware.entity.definition' in services.php, and register the translation after the entity it translates.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-data-translations.html","quote":"we have to override a method called `getParentDefinitionClass` which returns the definition class of our entity we want to translate."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-data-translations.html","quote":"a `TranslatedField` for the 'name' field"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-data-translations.html","quote":"we have to register the translation after the entity we want to translate."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware translatable field custom entity TranslatedField TranslationDefinition plugin"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-data-translations.html, prompt=Explain how to make a field on a custom DAL entity translatable per language in Shopware: the translation definition class, the TranslatedField, table naming conventions, and registration. Quote key sentences."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:28:30Z","endedAt":"2026-09-15T14:29:45Z"},"dev-10":{"query":"How do I write an indexer that precomputes derived data for my custom entity on write, and how do I trigger a full reindex?","category":"dev","option":"vanilla","answer":"Create a class extending EntityIndexer, which the documentation describes as intended to 'optimize the performance of recurring complex tasks'. Implement getName() returning a unique identifier for the indexer (e.g. 'swag.basic.example.indexer'); iterate(), which is called during full reindexing and should generate a list of messages for all records which are indexed by this indexer, accepting an offset parameter to batch-process data and returning an EntityIndexingMessage or null when done; update(), which is triggered when entities are modified via the DAL and should react to the provided entity written events and generate a list of messages which has to be processed by the handle function; and handle(), which processes those messages, typically using the connection directly and not the DAL, to avoid triggering infinite indexing loops. Register the indexer as a service tagged with 'shopware.entity_indexer' (e.g. ->tag('shopware.entity_indexer') in services.php). To trigger a full reindex across all registered indexers, run bin/console dal:refresh:index.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-data-indexer.html","quote":"should generate a list of messages for all records which are indexed by this indexer."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-data-indexer.html","quote":"should react to the provided entity written events and generate a list of messages which has to be processed by the handle function."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-data-indexer.html","quote":"using the connection directly and not to use the DAL"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware custom indexer EntityIndexer plugin full reindex dal:refresh:index"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-data-indexer.html, prompt=Explain how to write a custom EntityIndexer in Shopware for a custom entity: the interface, required methods (getName, iterate, update, handle), how it's registered as a service, and how to trigger a full reindex. Quote key sentences."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:29:45Z","endedAt":"2026-09-15T14:31:00Z"},"dev-11":{"query":"On Shopware 6.7, which file do I declare my plugin's services in, and how do I get a core service passed into my service's constructor?","category":"dev","option":"vanilla","answer":"You declare your plugin's services in `PLUGIN_ROOT/src/Resources/config/services.php` (the PHP-based service configuration format shown in the current Shopware documentation). To get a core service passed into your service's constructor, you declare the core service as a typed constructor parameter (constructor injection) and explicitly map it as an argument in services.php, e.g. `$services->set(ExampleService::class)->args([service(SystemConfigService::class)]);` with a constructor like `public function __construct(private SystemConfigService $systemConfigService) {}`.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/dependency-injection.html","quote":"PLUGIN_ROOT/src/Resources/config/services.php"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/dependency-injection.html","quote":"Add it as a constructor parameter"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6.7 plugin services.xml dependency injection constructor core service"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/dependency-injection.html"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/dependency-injection.html (verbatim quote request)"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:15:00Z","endedAt":"2026-09-15T14:18:00Z"},"dev-12":{"query":"I am on Shopware 6.6 — which file do I declare my plugin's service dependencies in, and how do I pass another service into the constructor?","category":"dev","option":"vanilla","answer":"On Shopware 6.6, the mechanism is the same as later versions: you declare services and their dependencies in your plugin's `src/Resources/config/services.php` (or the equivalent `services.xml`, which Shopware's DI container also supports) [from memory]. You pass another service into the constructor by adding it as a typed constructor parameter and mapping it explicitly as an argument for that service definition, e.g. `$services->set(ExampleService::class)->args([service(SystemConfigService::class)]);` with the dependency declared in the constructor.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/dependency-injection.html","quote":"PLUGIN_ROOT/src/Resources/config/services.php"}],"toolCallLog":[],"notFoundClaim":false,"memoryClaims":["On Shopware 6.6, the mechanism is the same as later versions: you declare services and their dependencies in your plugin's `src/Resources/config/services.php` (or the equivalent `services.xml`, which Shopware's DI container also supports)."],"sourceVerdict":"partial","startedAt":"2026-09-15T14:18:00Z","endedAt":"2026-09-15T14:19:00Z"},"dev-13":{"query":"There is no event for what I need to change in a core Shopware service — how do I decorate or replace that service from my plugin?","category":"dev","option":"vanilla","answer":"Use Shopware's service decoration pattern. Register both the original service and your decorator in your plugin's services.php and use the `decorate()` method to point to the service being decorated, passing `service('.inner')` so the original instance is still reachable inside your decorator. Services designed for decoration expose an abstract class with a `getDecorated()` method returning its own type; your decorator class extends that abstract class, accepts the inner (decorated) instance via constructor injection, returns it from `getDecorated()`, and should delegate to the inner service before or after adding its own behavior so other plugins' decorations in the chain are not discarded.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/services/adjusting-service.html","quote":"Register both the original service and the decorator in `services.php`. Use the `decorate` method to point to the service being decorated."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/services/adjusting-service.html","quote":"The abstract class must include a `getDecorated()` method returning its own type."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware plugin decorate a service developer.shopware.com decoration pattern"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/services/adjusting-service.html"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/services/adjusting-service.html (verbatim quote request)"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:19:00Z","endedAt":"2026-09-15T14:20:30Z"},"dev-14":{"query":"I wrote a subscriber class in my plugin but it never fires — which interface and which service tag (`shopware.event_subscriber`?) register it?","category":"dev","option":"vanilla","answer":"Your subscriber class must implement Symfony's `EventSubscriberInterface`, and it must be registered with the `kernel.event_subscriber` tag (not `shopware.event_subscriber` — that tag name does not exist for this purpose) for it to be recognized as a subscriber. If your subscriber's service definition is missing that tag (or if autoconfiguration for this tag is disabled in your services config), it will never fire even though the class itself is correct.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/listening-to-events.html","quote":"To start creating a subscriber, we need to create a class first implementing EventSubscriberInterface."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/listening-to-events.html","quote":"The only difference to a normal service is that you need to add the `kernel.event_subscriber` tag to your subscriber for it to be recognized as such."}],"toolCallLog":[{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/listening-to-events.html"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:20:30Z","endedAt":"2026-09-15T14:21:30Z"},"dev-15":{"query":"How do I work out which event Shopware actually dispatches for a given action, for example after a product is loaded or a page is rendered?","category":"dev","option":"vanilla","answer":"Use the Symfony web debug profiler: open it for the request in question and click the \"Events\" tab, which lists all events fired during that request together with their exact event names. If you'd rather inspect code directly, search the Shopware source for `->dispatch` calls (that's how PHP events are fired) or `EventDispatcherInterface` constructor parameters to find services that dispatch events, and for JavaScript events search for `$emitter.publish` in the Storefront or `$emit` in the Administration. Data Abstraction Layer events follow the consistent naming pattern `entity_name.event`, e.g. `product.written` or `product.deleted`.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/event/finding-events.html","quote":"Use the profiler to easily find all fired events in the current request. Open the profiler and clicking on the 'Events' tab on the left."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/event/finding-events.html","quote":"For Data Abstraction Layer events, follow the consistent naming pattern: `entity_name.event` (such as `product.written` or `product.deleted`)."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 debug:event-dispatcher find which event is dispatched"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/event/finding-events.html"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:21:30Z","endedAt":"2026-09-15T14:22:30Z"},"dev-16":{"query":"How do I run plugin logic whenever an order is written, and find out exactly which fields changed?","category":"dev","option":"vanilla","answer":"Subscribe to `OrderEvents::ORDER_WRITTEN_EVENT` — \"the event `ORDER_WRITTEN_EVENT` is the one to choose\" when reacting to general changes to the order itself — by creating a subscriber (implementing `EventSubscriberInterface`, tagged `kernel.event_subscriber`) whose listener method receives an `EntityWrittenEvent`. To find out exactly which fields changed, iterate the write results and pull the change set: `foreach ($event->getWriteResults() as $result) { $changeSet = $result->getChangeSet(); ... }`. Note that change sets are not generated by default for performance reasons; you must first listen to `PreWriteValidationEvent` and call `$command->requestChangeSet()` on the relevant write commands before the write completes, otherwise `getChangeSet()` returns null.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/order/listen-to-order-changes.html","quote":"the event `ORDER_WRITTEN_EVENT` is the one to choose"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/order/listen-to-order-changes.html","quote":"foreach ($event->getWriteResults() as $result) { $changeSet = $result->getChangeSet();"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware plugin subscribe EntityWrittenEvent order.written changed fields updatedFields"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/order/listen-to-order-changes.html"},{"tool":"Bash","args":"find <home>/projects/host-project/vendor/shopware/core/Framework/DataAbstractionLayer/Event -iname \"EntityWrittenEvent.php\""}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:22:30Z","endedAt":"2026-09-15T14:24:00Z"},"dev-17":{"query":"How do I overwrite the price of a product line item in the cart at runtime from a plugin?","category":"dev","option":"vanilla","answer":"Use a cart collector/processor pair rather than mutating the cart directly. The collector implements `CartDataCollectorInterface` and its `collect()` method fetches or computes the new price data for the relevant line items — \"the collector is used to collect all new prices necessary for your line items and therefore provide this data.\" The processor implements `CartProcessorInterface`; its `process()` method reads the data the collector gathered and applies it — \"the processor will then take the new prices, calculate them appropriately and apply them to the line items\" — typically by building a `QuantityPriceDefinition` for the new price and calling the `QuantityPriceCalculator` (`$this->calculator->calculate($definition, $context)`) to get a tax-adjusted `CalculatedPrice`, then setting that price and price definition on the line item. Both classes are registered as services tagged `shopware.cart.collector` and `shopware.cart.processor` respectively.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/cart/change-price-of-item.html","quote":"The collector is used to collect all new prices necessary for your line items and therefore provide this data."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/cart/change-price-of-item.html","quote":"The processor will then take the new prices, calculate them appropriately and apply them to the line items."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware plugin overwrite price line item cart processor setPrice"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/cart/change-price-of-item.html"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:24:00Z","endedAt":"2026-09-15T14:25:30Z"},"dev-18":{"query":"My plugin's cart processor adds a surcharge line item, but it is added again on every recalculation and its price is stale after the customer changes the quantity — how do I split the work between the collector and the processor?","category":"dev","option":"vanilla","answer":"You have the split backwards: the surcharge line item's creation/idempotency check and any expensive data lookup belong in the collector, while price recalculation belongs in the processor, and it must run every time. \"A collector can and should be used to retrieve additional data for the cart, e.g. by querying the database\" — this is also where you should check whether your surcharge line item already exists in the cart and only add it once, keyed by a stable line-item id, so it is not duplicated on every recalculation. \"A processor is the class that will actually process the cart and is supposed to apply changes to the cart\" — the processor runs on every cart recalculation (including quantity changes), so put the price (re)calculation logic there using the current cart data, not in the collector, otherwise the price will go stale when quantities change. The documentation explicitly warns: \"Do not query data in the process method, since it may be executed a lot of times. Always use the collect method of a collector for this case!\" — so keep data fetching in `collect()` and price math in `process()`.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.html","quote":"A collector can and should be used to retrieve additional data for the cart, e.g. by querying the database, hence the name 'collector'."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.html","quote":"A processor is the class that will actually process the cart and is supposed to apply changes to the cart."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.html","quote":"Do not query data in the process method, since it may be executed a lot of times. Always use the collect method of a collector for this case!"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware cart collector processor add surcharge line item guide"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.html"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.html (retry after rate-limit failure)"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:25:30Z","endedAt":"2026-09-15T14:27:30Z"},"dev-19":{"query":"I need to move long-running work in my plugin out of the request into the message queue — what does the handler class look like and how is it registered?","category":"dev","option":"vanilla","answer":"Create a plain PHP class marked with the `#[AsMessageHandler]` attribute that implements `__invoke()` typed to your message class — \"to mark the class as message handler, we use the php attribute `#[AsMessageHandler]` and implement the method `__invoke`.\" The attribute triggers autoconfiguration so the class is automatically registered as a handler without further service-file wiring; the equivalent explicit registration, if you're not relying on autoconfiguration, is to tag the service with `messenger.message_handler` in your services config. You dispatch work to it by dispatching your message object onto the message bus, and it is picked up asynchronously by a worker running `bin/console messenger:consume`.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/message-queue/add-message-handler.html","quote":"To mark the class as message handler, we use the php attribute `#[AsMessageHandler]` and implement the method `__invoke`."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware plugin message queue handler MessageHandlerInterface AsMessageHandler register"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/message-queue/add-message-handler.html"}],"notFoundClaim":false,"memoryClaims":["You dispatch work to it by dispatching your message object onto the message bus, and it is picked up asynchronously by a worker running `bin/console messenger:consume`."],"sourceVerdict":"yes","startedAt":"2026-09-15T14:27:30Z","endedAt":"2026-09-15T14:28:30Z"},"dev-20":{"query":"How do I add my own condition to the Rule Builder from a plugin so shop owners can select it?","category":"dev","option":"vanilla","answer":"Create a new rule class that extends `Shopware\\Core\\Framework\\Rule\\Rule` — \"our new class has to extend from the abstract class `Shopware\\Core\\Framework\\Rule\\Rule`\" — implementing a constructor (default expected value), `getName()` (a unique technical name for the rule) and `match()` (the actual condition check against the current `RuleScope`). Any properties used by the rule must be declared `protected`, not `private`, \"otherwise they won't work properly.\" Register the class as a service in your plugin's `services.php` tagged `shopware.rule.definition` — \"after we've created our rule class, we have to register it in our `services.php` and tag it as `shopware.rule.definition`\" — which is what makes it discoverable and selectable in the Rule Builder's administration UI. A matching Administration module (Vue component registering the condition's label/fields) is additionally needed for the condition to render properly in the rule builder's UI, though the backend rule alone is enough to make it selectable.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/rule/add-custom-rules.html","quote":"Our new class has to extend from the abstract class `Shopware\\Core\\Framework\\Rule\\Rule`."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/rule/add-custom-rules.html","quote":"After we've created our rule class, we have to register it in our `services.php` and tag it as `shopware.rule.definition`."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/rule/add-custom-rules.html","quote":"The variables to be used in the rule have to be 'protected' and not 'private', otherwise they won't work properly."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware plugin add custom rule condition Rule Builder developer.shopware.com"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/rule/add-custom-rules.html"}],"notFoundClaim":false,"memoryClaims":["A matching Administration module (Vue component registering the condition's label/fields) is additionally needed for the condition to render properly in the rule builder's UI, though the backend rule alone is enough to make it selectable."],"sourceVerdict":"yes","startedAt":"2026-09-15T14:28:30Z","endedAt":"2026-09-15T14:30:00Z"},"dev-21":{"query":"My plugin dispatches its own domain event — how do I make it show up as a trigger in the Flow Builder?","category":"dev","option":"vanilla","answer":"Your event class must implement the base FlowEventAware interface plus one or more of the \"Aware\" interfaces (such as CustomerAware, OrderAware, MailAware, UserAware, SalesChannelAware) depending on what data the trigger should expose. Any event that implements one of these interfaces will be available in the trigger list of the Flow Builder module in Administration. You also need to register your event definition through a subscriber that listens to BusinessEventCollectorEvent, registered in your plugin's src/Resources/config/services.php, so the event is added to the collection of available triggers.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.html","quote":"Any event that implements one of these interfaces will be available in the trigger list of the Flow Builder module in Administration."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.html","quote":"register your subscriber to the container at <plugin root>/src/Resources/config/services.php"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 plugin custom event Flow Builder trigger developer.shopware.com"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.html"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:18:49Z","endedAt":"2026-09-15T14:20:30Z"},"dev-22":{"query":"How do I give my plugin a settings page the shop operator can fill in, and what field types are available?","category":"dev","option":"vanilla","answer":"You create a config.xml file at src/Resources/config/config.xml inside your plugin, and Shopware automatically renders it in the Administration without needing a custom Administration module or templating knowledge. Every config.xml must contain at least one card element with a title and at least one input-field. The available input field types are: text, textarea, text-editor, url, password, int, float, bool (switch), checkbox, datetime, date, time, colorpicker, single-select, and multi-select. All fields support common properties label, placeholder, helpText, defaultValue, disabled, and required, and fields can be marked cache-relevant=\"true\" when a configuration value changes cached Storefront output. For more complex needs there are also advanced components such as sw-entity-single-select, sw-media-field, sw-text-editor and sw-snippet-field.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.html","quote":"every `config.xml` must contain at least one `<card>` element with a `<title>` and at least one `<input-field>`."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.html","quote":"when a configuration value changes cached Storefront output."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 plugin add plugin configuration settings page field types developer.shopware.com"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.html"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:19:18Z","endedAt":"2026-09-15T14:21:00Z"},"dev-23":{"query":"How do I ship a mail template with my plugin so it is installed automatically, including a custom mail template type?","category":"dev","option":"vanilla","answer":"Adding a mail template is done by using a plugin database migration. In the migration you either reuse an existing mail_template_type ID or create a custom one by inserting into mail_template_type with a technical_name and available_entities (JSON listing which entities can use the template), plus corresponding rows in mail_template_type_translation for each language. You then insert a row into mail_template using that template type ID, making sure to set system_default to 0, and add one row per supported language into mail_template_translation. Do not remove e-mail templates in your plugin, e.g. when it is uninstalled, since this may lead to data inconsistency, and you should use INSERT IGNORE INTO statements so no exception is thrown upon uninstallation and reinstallation.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/content/mail/add-mail-template.html","quote":"adding a mail template is done by using a plugin database migration."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/content/mail/add-mail-template.html","quote":"Do not remove e-mail templates in your plugin, e.g. when it is uninstalled. This may lead to data inconsistency."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 plugin add mail template custom mail template type migration developer.shopware.com"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/content/mail/add-mail-template.html"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:19:48Z","endedAt":"2026-09-15T14:21:30Z"},"dev-24":{"query":"How do I get readable SEO URLs generated for the detail pages of my plugin's own entity?","category":"dev","option":"vanilla","answer":"You create a custom SeoUrlRoute class that implements SeoUrlRouteInterface, which comes with three necessary methods: getConfig() returning a SeoUrlRouteConfig with the entity definition, route name, and default SEO path template; prepareCriteria() to adjust which entities are fetched (e.g. only active ones); and getMapping() returning a SeoUrlMapping with the data available to the template. You register this class in the service container with the tag shopware.seo_url.route. You also add a migration inserting a row into the seo_url_template table with route_name, entity_name and a default template pattern. Finally, you create a subscriber that reacts to your entity's written and deleted events and calls the update method of Shopware\\Core\\Content\\Seo\\SeoUrlUpdater every time your entity is written, so SEO URLs are (re)generated; deleted entities have their SEO URL entries marked as deleted rather than removed, to preserve URL history.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/content/seo/add-custom-seo-url.html","quote":"Your custom 'SeoUrlRoute' class has to implement the `SeoUrlRouteInterface`, which comes with three necessary methods."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/content/seo/add-custom-seo-url.html","quote":"Everytime your entity is written, you then have to execute the `update` method of the `Shopware\\Core\\Content\\Seo\\SeoUrlUpdater`."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 custom entity SEO url generation seo_url_template developer.shopware.com"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/content/seo/add-custom-seo-url.html"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:20:20Z","endedAt":"2026-09-15T14:22:00Z"},"dev-25":{"query":"How do I add a `bin/console` command to my plugin for a maintenance task?","category":"dev","option":"vanilla","answer":"Create a command class that extends Symfony's Command class, and use the AsCommand attribute to give it a name and description, e.g. #[AsCommand(name: 'swag:example', description: 'Example command')]. Implement the logic in an execute(InputInterface $input, OutputInterface $output): int method. Register the command as a service tagged with console.command in your plugin's src/Resources/config/services.php (e.g. $services->set(...ExampleCommand::class)->tag('console.command');). Commands registered as services in a Shopware plugin are automatically available via bin/console, following the standard Symfony approach for creating custom commands.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.html","quote":"Commands registered as services in a Shopware plugin are automatically available via `bin/console`."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 plugin add console command developer.shopware.com"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.html"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:20:59Z","endedAt":"2026-09-15T14:22:20Z"},"dev-26":{"query":"How do I add a custom document type such as a pro-forma invoice in Shopware 6.7?","category":"dev","option":"vanilla","answer":"In the current (v2) Document system, you first create a document type class extending AbstractDocumentType; a document type declares its technical name and the formats it can be rendered in. You then build a data provider extending AbstractDocumentDataProvider that implements supports() to match your document type, uses enrichOrderCriteria() to load the associations it needs, and returns an AbstractRenderData DTO whose public properties end up on the template's config variable. Both the type and the provider classes must be tagged in your service configuration (tags such as shopware.document_v2.type and shopware.document_v2.provider) so the registries in Document v2 pick them up. You add a Twig template at src/Resources/views/documents/{technical_name}.html.twig that renders using the config object. Finally, two database rows are still required outside of the code above: a document_type row matching your technical name, and a number range entry for document numbering, added via a migration. This whole v2 flow requires the DOCUMENT_GENERATION_REWORK feature flag to be enabled.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.html","quote":"A document type declares its technical name and the formats it can be rendered in."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.html","quote":"Public properties on the render data DTO end up on the template's `config` variable."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.html","quote":"Tag the type and the provider so the registries in Document v2 pick them up."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.html","quote":"Two database rows are still required outside of the code above"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 add custom document type pro-forma invoice developer.shopware.com"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/document/add-custom-document-type.html"},{"tool":"WebSearch","args":"\"add-custom-document-type\" Shopware developer.shopware.com document type migration DocumentTypeEntity"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/document/add-custom-document-type.html (retry)"},{"tool":"WebFetch","args":"https://github.com/shopware/docs/blob/main/guides/plugins/plugins/checkout/document/add-custom-document-type.md"},{"tool":"WebFetch","args":"https://github.com/shopware/docs/tree/main/guides/plugins/plugins/checkout/document"},{"tool":"Bash","args":"gh api repos/shopware/docs/contents/guides/plugins/plugins/checkout/document --jq '.[].name'"},{"tool":"Bash","args":"curl -s https://api.github.com/repos/shopware/docs/contents/guides/plugins/plugins/checkout/document | grep '\"name\"'"},{"tool":"Bash","args":"curl -sv https://api.github.com"},{"tool":"WebSearch","args":"developer.shopware.com add-custom-document-type document_type technical_name migration"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/document/add-custom-document-type.html (retry 2)"},{"tool":"WebFetch","args":"https://web.archive.org/web/2024/https://developer.shopware.com/docs/guides/plugins/plugins/checkout/document/add-custom-document-type.html"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/document/add-custom-document-type (no .html)"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/document/add-custom-document.html"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/document.html"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.html (connectivity check)"},{"tool":"WebSearch","args":"site:developer.shopware.com document type invoice delivery note credit note storno"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/document/"},{"tool":"WebFetch","args":"https://developer.shopware.com/sitemap.xml (search document-type/custom-document)"},{"tool":"WebFetch","args":"https://developer.shopware.com/sitemap.xml (search 'document')"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.html"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:20:20Z","endedAt":"2026-09-15T14:30:00Z"},"dev-27":{"query":"In Shopware 6.7, how do I extend a Storefront Twig template from my plugin with `{% extends %}` so I keep the core markup and other plugins' changes?","category":"dev","option":"vanilla","answer":"You should not use the plain Twig {% extends %} tag; Shopware uses its own {% sw_extends %} tag instead, for example {% sw_extends '@Storefront/storefront/layout/header/logo.html.twig' %}. By using sw_extends instead of extends, Shopware's template resolution system can recognize and respect modifications from both the core framework and other plugins, so your customization layers on top rather than overriding or being overridden unpredictably. Your override file must live at the same relative path under your plugin's Resources/views directory as the original template. Inside the extended template you override only the specific blocks you need with {% block block_name %}...{% endblock %}, and you can call {{ parent() }} inside a block to keep the original block's output and append to it rather than replacing it entirely.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/templates/customize-templates.html","quote":"To preserve core markup and other plugins' changes, you should use the `{% sw_extends %}` tag rather than the standard `{% extends %}` tag."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/templates/customize-templates.html","quote":"You can also preserve the original block's output by calling `{{ parent() }}` within your override, allowing you to append rather than replace content entirely."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 Storefront extend twig template plugin developer.shopware.com override template"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/templates/customize-templates.html"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:25:19Z","endedAt":"2026-09-15T14:27:00Z"},"dev-28":{"query":"How do I override an existing Storefront JavaScript plugin, such as the cookie permission bar, from my own plugin instead of registering a new one?","category":"dev","option":"vanilla","answer":"Create a new JS class in your plugin that extends the original plugin class, e.g. import CookiePermissionPlugin from 'src/plugin/cookie/cookie-permission.plugin' and export default class MyCookiePermission extends CookiePermissionPlugin. Then, in your plugin's main.js entry point, instead of calling PluginManager.register() you call PluginManager.override(), for example PluginManager.override('CookiePermission', MyCookiePermission, '[data-cookie-permission]') (or with a dynamic import for async plugins). Each JavaScript plugin can only be overridden once — if two Shopware plugins try to override the same plugin, only the last one of them will actually work.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/override-existing-javascript.html","quote":"Each JavaScript plugin can only be overridden once. If two Shopware plugins try to override the same plugin, only the last one of them will actually work."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 override existing storefront plugin javascript cookie permission plugin.override developer.shopware.com"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/override-existing-javascript.html"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:25:52Z","endedAt":"2026-09-15T14:27:30Z"},"dev-29":{"query":"How do I add my own data to an existing Storefront page or pagelet from a plugin without overriding the core controller?","category":"dev","option":"vanilla","answer":"Pages or pagelets are the objects that get handed to the templates and provide all necessary information for the template to render, and every page or pagelet fires a Loaded event you can subscribe to. To add data, register an event subscriber (tagged kernel.event_subscriber) for the relevant Loaded event, e.g. FooterPageletLoadedEvent to extend the footer. Since you are in a Pagelet-event, the DAL should not be called directly to fetch data; instead you should check whether a suitable store-api route exists and use that (or create a dedicated one) to fetch your data. You then attach the fetched data with $event->getPagelet()->addExtension('product_count', $productCountResult), which makes it available in Twig as, for example, {% if footer.extensions.product_count %} — all without touching or overriding the core controller.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/add-data-to-storefront-page.html","quote":"Pages or pagelets are the objects that get handed to the templates and provide all necessary information for the template to render."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/add-data-to-storefront-page.html","quote":"Since we are in a `Pagelet`-event, the DAL should not be called directly to fetch data. Instead, we should check whether a suitable `store-api` route exists."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/add-data-to-storefront-page.html","quote":"$event->getPagelet()->addExtension('product_count', $productCountResult);"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 add data to storefront page plugin PageLoadedEvent subscriber developer.shopware.com"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/add-data-to-storefront-page.html"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:26:19Z","endedAt":"2026-09-15T14:28:00Z"},"dev-30":{"query":"How do I add a custom filter to the Storefront product listing from my plugin, both the criteria side and the filter panel?","category":"dev","option":"vanilla","answer":"On the criteria/DAL side, you register a subscriber listening to the \\Shopware\\Core\\Content\\Product\\Events\\ProductListingCollectFilterEvent — new listing filters for the product listing can be registered via this event. Inside the subscriber you add a Filter object with a unique name, a filtered flag (whether it's currently active), the DAL aggregations that power the filter, the actual DAL filter to apply to the criteria, and the current filter values to show the user. On the storefront/template side, you extend the core filter panel template at src/Storefront/Resources/views/storefront/component/listing/filter-panel.html.twig and override the component_filter_panel_items block (using sw_include with an appropriate filter component) to render your filter; for example, for a boolean value you'd choose the filter-boolean component. Other available filter components include filter-multi-select, filter-property-select, filter-range, and filter-rating-select. You can control where your filter appears by extending specific positional blocks such as component_filter_panel_item_price.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/howto/add-listing-filters.html","quote":"New listing filters, e.g. for your product listing, can be registered via the event `\\Shopware\\Core\\Content\\Product\\Events\\ProductListingCollectFilterEvent`"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/howto/add-listing-filters.html","quote":"As we want to filter a boolean value, we choose the `filter-boolean` component here."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 add custom filter product listing criteria ProductListingCriteriaEvent filter panel developer.shopware.com"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/howto/add-listing-filters.html"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:26:53Z","endedAt":"2026-09-15T14:28:30Z"},"dev-31":{"query":"How do I expose a plugin configuration value, such as a colour picked in the Administration, as an SCSS variable in my Storefront styling?","category":"dev","option":"vanilla","answer":"In your plugin's config.xml, add a <css> tag inside the <input-field> element whose text content is the SCSS variable name you want to expose; the field's Administration value (or its <defaultValue> if unset) is then made available as that SCSS variable during theme compilation, so you can reference it (e.g. with a !default fallback) in your base.scss.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/add-scss-variables.html","quote":"To expose a plugin config field as an SCSS variable, use the `<css>` tag in your `config.xml` file with the SCSS variable name as its value."}],"toolCallLog":[{"tool":"Bash","args":"date -u +%Y-%m-%dT%H:%M:%SZ"},{"tool":"WebSearch","args":"Shopware plugin configuration SCSS variable storefront theme.json config"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/storefront/add-scss-variables.html, prompt=How do I expose a plugin config.xml field as an SCSS variable using the css tag? Give exact syntax and example."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:18:54Z","endedAt":"2026-09-15T14:20:00Z"},"dev-32":{"query":"How do I define a custom field set for products from my plugin so merchants can edit the values in the Administration?","category":"dev","option":"vanilla","answer":"Create a Resources/config/custom-fields.xml file in your plugin, defining a <custom-field-set> with a name, label(s), a <related-entities> block containing <product/> to attach it to products, and a <fields> block listing the field types (e.g. <int>, <text>) with labels and positions; Shopware then automatically creates, updates and removes this custom field set during the plugin lifecycle, and because it is defined this way it becomes visible and editable in the Administration's product custom fields tab.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/custom-field/add-custom-field.html","quote":"To enable merchants to edit custom field values in the Administration, create a `Resources/config/custom-fields.xml` file in your plugin's `src` directory."}],"toolCallLog":[{"tool":"Bash","args":"date -u +%Y-%m-%dT%H:%M:%SZ"},{"tool":"WebSearch","args":"Shopware plugin custom field set products Administration developer.shopware.com"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/framework/custom-field/add-custom-field.html, prompt=How do I define a custom field set for products from a plugin, using custom-fields.xml, so merchants can edit the values in the Administration?"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:19:24Z","endedAt":"2026-09-15T14:21:00Z"},"dev-33":{"query":"How do I register a custom Administration module from my plugin, and what has to line up for it to actually show up after a build?","category":"dev","option":"vanilla","answer":"Create your module folder at <plugin root>/src/Resources/app/administration/src/module/swag-example/index.js and call Shopware.Module.register('swag-example', { type: 'plugin', name: 'Example', title: ..., color: ..., icon: ..., routes: ..., navigation: ... }) inside it, then import that module folder from your plugin's main.js entry point so the build picks it up. Your plugin must be active, and the Administration build/bundle step needs to run afterwards so the compiled JS is emitted to the public directory before the module appears in the Admin UI.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/administration/module-component-management/add-custom-module.html","quote":"Your plugin has to be activated for this to work."}],"toolCallLog":[{"tool":"Bash","args":"date -u +%Y-%m-%dT%H:%M:%SZ"},{"tool":"WebSearch","args":"Shopware register custom Administration module plugin main.js build"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/administration/module-component-management/add-custom-module.html, prompt=How do I register a custom Administration module from a plugin? What files (main.js, index.js) are needed, and what build command has to be run for it to show up?"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:19:51Z","endedAt":"2026-09-15T14:22:00Z"},"dev-34":{"query":"How do I extend an existing Administration component and its Twig blocks from my plugin, for example to change the dashboard headline?","category":"dev","option":"vanilla","answer":"Find the Twig block name of the part you want to change in the target component's template (for the dashboard headline this is sw_dashboard_index_content_intro_content_headline), then create a .html.twig file that redeclares that block with your own markup (optionally calling {% parent %} to keep the original content). Import that template and call Shopware.Component.override('sw-dashboard-index', { template }) in a JS file, then import that override file from your plugin's Administration main.js entry point so it is picked up on build.","citations":[{"url":"https://developer.shopware.com/docs/v6.5/guides/plugins/plugins/administration/customizing-components.html","quote":"Use `Shopware.Component.override()` in a JavaScript file to register your customization"}],"toolCallLog":[{"tool":"Bash","args":"date -u +%Y-%m-%dT%H:%M:%SZ"},{"tool":"WebSearch","args":"Shopware Administration override component extend Twig block dashboard headline plugin"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/administration/customizing-modules.html, prompt=How do I extend an existing Administration component (e.g. dashboard) and override a Twig block from a plugin, using Component.override? Give an example changing the dashboard headline."},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/v6.5/guides/plugins/plugins/administration/customizing-components.html, prompt=How do I extend/override an existing Administration component and its Twig block from a plugin, using Component.override, e.g. to change the dashboard headline block?"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:20:25Z","endedAt":"2026-09-15T14:23:30Z"},"dev-35":{"query":"How do I load entities from the Admin API inside an Administration component using the repository factory and a Criteria?","category":"dev","option":"vanilla","answer":"Inject repositoryFactory into your component (inject: ['repositoryFactory']), create a repository for your entity with this.repositoryFactory.create('entity_name'), build a Shopware.Data.Criteria instance to set paging, sorting, filters (e.g. Criteria.equals(...)) and associations, then call repository.search(criteria, Shopware.Context.api), which returns a promise resolving to an EntityCollection of the matching entities.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.html","quote":"First, inject the repository factory into your component:\n\n```javascript\ninject: ['repositoryFactory']\n```"}],"toolCallLog":[{"tool":"Bash","args":"date -u +%Y-%m-%dT%H:%M:%SZ"},{"tool":"WebSearch","args":"Shopware Administration repositoryFactory Criteria load entities component"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.html, prompt=How do I load entities from the Admin API inside an Administration component using inject: repositoryFactory and a Criteria object? Give an example."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:21:08Z","endedAt":"2026-09-15T14:24:00Z"},"dev-36":{"query":"How do I register ACL privileges for my plugin's Administration module and check them in a component or template?","category":"dev","option":"vanilla","answer":"In an acl/index.js file loaded from your plugin's Administration entry point, call Shopware.Service('privileges').addPrivilegeMappingEntry({ category: 'permissions', parent: null, key: 'your_key', roles: { viewer: { privileges: [...], dependencies: [] }, editor: {...}, creator: {...}, deleter: {...} } }), where each role's privileges array lists API permissions in entity:operation form and dependencies references other role identifiers. To check a privilege, inject the acl service into a component and call this.acl.can('your_key.editor'), or use acl.can(...) directly inside a template, e.g. in a v-if or :disabled binding.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.html","quote":"Inject the `acl` service and use `acl.can(identifier)` to verify user permissions"}],"toolCallLog":[{"tool":"Bash","args":"date -u +%Y-%m-%dT%H:%M:%SZ"},{"tool":"WebSearch","args":"Shopware Administration ACL privileges plugin module acl.role privilege check component"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/administration/module-component-management/add-acl-rules.html, prompt=How do I register ACL privileges for my plugin's Administration module (in the module's index.js privileges block), and how do I check acl.can in a component or template?"},{"tool":"WebSearch","args":"\"add-acl-rules\" developer.shopware.com module privileges viewer editor creator deleter"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.html, prompt=How do I register ACL privileges for my plugin's Administration module using addPrivilegeMappingEntry, and how do I check the privileges (acl.can) in a component or template like v-if?"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:21:56Z","endedAt":"2026-09-15T14:25:30Z"},"dev-37":{"query":"How do I set up and run PHPUnit integration tests for my Shopware plugin, including tests that boot the kernel?","category":"dev","option":"vanilla","answer":"Create a phpunit.xml in the plugin root with bootstrap=\"tests/TestBootstrap.php\" and a php server entry KERNEL_CLASS=Shopware\\Core\\Kernel, plus testsuites pointing at your Test directories. In tests/TestBootstrap.php, use Shopware\\Core\\TestBootstrapper, chaining ->addCallingPlugin()->addActivePlugins('YourPluginName')->setForceInstallPlugins(true)->bootstrap()->getClassLoader() so the plugin is installed for the test run. For tests that need the container/kernel, extend PHPUnit's TestCase and use the Shopware\\Core\\Framework\\Test\\TestCaseBase\\KernelTestBehaviour trait (or IntegrationTestBehaviour for automatic transaction/cache handling), then run the suite with ./vendor/bin/phpunit --configuration=\"custom/plugins/YourPlugin\".","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/testing/php-unit.html","quote":"$loader = (new TestBootstrapper())\n    ->addCallingPlugin()\n    ->addActivePlugins('YourPluginName')\n    ->setForceInstallPlugins(true)\n    ->bootstrap()\n    ->getClassLoader();"}],"toolCallLog":[{"tool":"Bash","args":"date -u +%Y-%m-%dT%H:%M:%SZ"},{"tool":"WebSearch","args":"Shopware 6 plugin PHPUnit integration tests boot kernel TestBootstrapper phpunit.xml.dist"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/testing/php-unit.html, prompt=How do I set up and run PHPUnit integration tests for a Shopware plugin, including tests that boot the kernel? Give the phpunit.xml.dist and TestBootstrap.php setup and how KernelTestBehaviour / integration test base classes are used."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:23:00Z","endedAt":"2026-09-15T14:26:30Z"},"dev-38":{"query":"How do I write Jest unit tests for my Administration components in Shopware 6.7?","category":"dev","option":"vanilla","answer":"Place the test file next to the component with a .spec.js/.spec.ts suffix (e.g. sw-alert/sw-alert.spec.js for src/app/component/base/sw-alert/index.js). Import the component module (without using its export, just for the registration side effect), then build it with Shopware.Component.build('component-name') and mount it with @vue/test-utils' shallowMount (preferred over mount to isolate the component), stubbing child components as needed; run composer run init:js once to install Admin dependencies, and use composer run admin:unit (or admin:unit:watch) to execute the suite.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/testing/jest-admin.html","quote":"Test files should be placed in the same directory as the component being tested, using the suffix `.spec.js` or `.spec.ts`."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/testing/jest-admin.html","quote":"wrapper = shallowMount(Shopware.Component.build('sw-alert'), {\n        stubs: {\n            'sw-icon': '<div><\/div>'\n        }\n    });"}],"toolCallLog":[{"tool":"Bash","args":"date -u +%Y-%m-%dT%H:%M:%SZ"},{"tool":"WebSearch","args":"Shopware 6.7 Jest unit tests Administration components plugin developer.shopware.com"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/testing/jest-admin.html, prompt=How do I write Jest unit tests for my plugin's Administration components? Give setup steps, file naming convention, and an example test using Shopware.Component.build."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:23:33Z","endedAt":"2026-09-15T14:27:00Z"},"dev-39":{"query":"How do I write end-to-end Cypress tests for my plugin against a Shopware 6.7 store?","category":"dev","option":"vanilla","answer":"As of Shopware's current documentation, the Cypress-based end-to-end test suite is listed under a Legacy section and is no longer the recommended approach; Shopware has moved to a Playwright-based Shopware Acceptance Test Suite (ATS) for end-to-end testing, which provides fixtures, page objects for Storefront and Administration, API clients and test-data creation helpers. If you still need Cypress specifically for an older setup, the historical guide lived at developer.shopware.com's testing/cypress page and used a Resources/app/<environment>/test/e2e folder with fixtures/integration/plugins/support subfolders and PSH e2e commands, but this could not be independently re-verified in this run because that page returned a 404 when fetched directly. [from memory: the historical Cypress e2e folder layout and PSH command names, since the primary source page for that content returned a 404 in this run.]","citations":[{"url":"https://developer.shopware.com/docs/guides/development/testing/e2e-playwright/","quote":"It provides several useful Playwright fixtures to start testing with Shopware right away, including page contexts and page objects for Storefront and Administration, API clients, test data creation, and reusable test logic."}],"toolCallLog":[{"tool":"Bash","args":"date -u +%Y-%m-%dT%H:%M:%SZ"},{"tool":"WebSearch","args":"Shopware 6 plugin Cypress end-to-end tests setup developer.shopware.com"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/testing/end-to-end-testing.html, prompt=How do I write and run e
