ns":[{"url":"https://developer.shopware.com/docs/guides/plugins/apps/payment.html","quote":"Asynchronous payments are more complicated than synchronous payments. They require interaction with the customer and a redirect to the payment provider, such as PayPal or Stripe."},{"url":"https://developer.shopware.com/docs/guides/plugins/apps/payment.html","quote":"Shopware sends the first pay `POST` request to start the payment with the payment provider. The request includes all necessary data such as the `order`, `orderTransaction`, and a `returnUrl`."},{"url":"https://developer.shopware.com/docs/guides/plugins/apps/payment.html","quote":"Shopware sends a second `POST` request to the `finalize-url` with the `orderTransaction` and all the query parameters passed by the payment provider to Shopware."},{"url":"https://developer.shopware.com/docs/guides/plugins/apps/payment.html","quote":"from Shopware 6.7.0.0 onwards your app-server **has to** respond with a payment state in its response, if you intend to change the transaction state."}],"toolCallLog":[{"tool":"Bash","args":"date -u +%Y-%m-%dT%H:%M:%SZ"},{"tool":"WebSearch","args":"Shopware app payment method pay-url finalize-url manifest response order-transaction"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/apps/payment.html, prompt=Explain how to implement a payment method in a Shopware app using pay-url and finalize-url, what Shopware sends in each request, and what the app server must return, especially in Shopware 6.7. Give verbatim quotes."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:25:40Z","endedAt":"2026-09-15T14:28:00Z"},"dev-71":{"query":"How does an app define its own custom entities in Shopware 6.7 and read them back through the API?","category":"dev","option":"vanilla","answer":"An app defines custom entities by shipping a Resources/entities.xml file inside the app, in which it registers new entity names and their fields (with attributes like required, translatable, and store-api-aware); unlike custom fields, this lets the app model fully customized data structures and relationships rather than just extending existing entities. Once registered, the custom entity is exposed through the Admin API using a search endpoint pattern based on the entity name, e.g. POST /api/search/custom-entity-blog for an entity named custom_entity_blog, and the system also auto-generates a repository for the entity that can be used from app scripts.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/apps/custom-data/custom-entities.html","quote":"Unlike custom fields, custom entities let you model fully customized data structures and relationships."},{"url":"https://developer.shopware.com/docs/guides/plugins/apps/custom-data/custom-entities.html","quote":"Additionally, to the repository you can also access your custom entities via Admin API."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 app custom entities define read API"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/apps/custom-data/custom-entities.html, prompt=Explain how to define custom entities in an app (entities.xml) and how they are read back via the API. Quote relevant sentences about API endpoints and definition process."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:19:17Z","endedAt":"2026-09-15T14:19:38Z"},"func-01":{"query":"How do I create a product with variants and configure its visibility per sales channel, and why might it not show up in the storefront?","category":"func","option":"vanilla","answer":"To create variants you first define properties for the product, then open the Variant Generator, where you pick which property options form the basis of the variants; the properties serve as the basis for creating the variants, you can define price surcharges for individual options that are taken into account during generation, and you have the option of excluding certain combinations of options from the generation of variants. Visibility per sales channel is configured in the product's 'Visibility & structure' section, where Sales channel assignment determines where the products are available, and 'Active for all selected sales channels' defines whether the product is displayed in the storefront and can be purchased; extended visibility further lets you choose between fully visible in search and listings (default), hidden from listings but still searchable, or hide in listing and search, the product is hidden from the product listing and cannot be found by the search. A product commonly fails to show up in the storefront because it isn't assigned to the storefront's sales channel, the Active switch is off, the variant itself is inactive, or the extended visibility is set to hidden — these are the most frequent misconfigurations reported for this issue [from memory].","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/catalogues/products","quote":"The properties serve as the basis for creating the variants."},{"url":"https://docs.shopware.com/en/shopware-6-en/catalogues/products","quote":"Active for all selected sales channels: Here, you can define whether the product is displayed in the storefront and can be purchased."},{"url":"https://docs.shopware.com/en/shopware-6-en/catalogues/products","quote":"You have the option of excluding certain combinations of options from the generation of variants."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 create product with variants configure visibility per sales channel not showing storefront"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-6-en/catalogues/products, prompt=Explain how to create a product with variants in Shopware 6, and how visibility is configured per sales channel. Quote relevant verbatim sentences."},{"tool":"WebFetch","args":"url=https://matheusgontijo.com/2022/01/25/how-does-product-visibility-work-in-shopware-6, prompt=Explain how product visibility works per sales channel in Shopware 6, including the visibility values and why a product might not appear in the storefront. Quote relevant verbatim sentences. -> HTTP 403 Forbidden, no content retrieved"}],"notFoundClaim":false,"memoryClaims":["A product commonly fails to show up in the storefront because it isn't assigned to the storefront's sales channel, the Active switch is off, the variant itself is inactive, or the extended visibility is set to hidden — these are the most frequent misconfigurations reported for this issue [from memory]."],"sourceVerdict":"yes","startedAt":"2026-09-15T14:20:11Z","endedAt":"2026-09-15T14:21:10Z"},"func-02":{"query":"How do Rule Builder conditions work for shipping and payment methods?","category":"func","option":"vanilla","answer":"A Rule Builder rule is built from conditions where the condition defines the parameter you are querying, the operator is used to compare the condition with the input value, and the input value is compared with the condition via the operator; multiple conditions can be combined so that when multiple conditions are linked with 'AND', all conditions must be fulfilled for the rule to apply, whereas if several conditions are linked with 'OR', only one condition must be fulfilled for the rule to apply. For shipping and payment methods specifically, a rule can be assigned as the availability rule of the method, determining the availability of payment methods or the availability of shipping methods respectively — if the rule's conditions (e.g. cart total, shipping country, customer group) are not met, that shipping or payment method will not be offered at checkout. Rules are hooked up to methods via the rule's Assignments tab, which shows all the places where the rule is already used or can be used, from where you can navigate to the relevant shipping or payment method configuration.","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/settings/rules","quote":"The condition defines the parameter you are querying"},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/rules","quote":"When multiple conditions are linked with 'AND', all conditions must be fulfilled for the rule to apply"},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/rules","quote":"all the places where the rule is already used or can be used"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 Rule Builder conditions shipping payment methods documentation"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-6-en/settings/rules, prompt=Explain how Rule Builder conditions work, especially how they are applied to shipping methods and payment methods (availability rules). Quote verbatim sentences."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:20:48Z","endedAt":"2026-09-15T14:22:00Z"},"func-03":{"query":"How do promotions and discount codes work, including individually generated codes?","category":"func","option":"vanilla","answer":"A promotion in Shopware 6 is set up in the Marketing module with conditions (e.g. cart value, customer group, products) that decide when a discount applies, plus discount and usage settings. A promotion can require no code at all (automatic), a single fixed code, where this selection allows you to enter a single code that is the same for all customers, or individually generated codes, where these individual codes can only be redeemed once and will not be accepted if they are entered again. To generate individual codes you configure a code length, where in the field code length you determine the number of random characters, an optional prefix and/or suffix, an optional custom pattern using %s for random letters and %d for random numbers, and a quantity, where in the field number of promotion codes you determine how many codes are to be generated; the system shows a preview of the resulting codes before they are generated. Usage of individual codes can be tracked per promotion, showing which codes have already been redeemed in an order [from memory].","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/marketing/promotions","quote":"This selection allows you to enter a single code that is the same for all customers."},{"url":"https://docs.shopware.com/en/shopware-6-en/marketing/promotions","quote":"These individual codes can only be redeemed once and will not be accepted if they are entered again."},{"url":"https://docs.shopware.com/en/shopware-6-en/marketing/promotions","quote":"In the field code length you determine the number of random characters"},{"url":"https://docs.shopware.com/en/shopware-6-en/marketing/promotions","quote":"In the field number of promotion codes you determine how many codes are to be generated"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 promotions discount codes individually generated codes documentation"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-6-en/marketing/promotions, prompt=Explain how promotions and discount codes work in Shopware 6, including the difference between a single global code and individually generated codes, and how individual code generation is configured. Quote verbatim sentences."}],"notFoundClaim":false,"memoryClaims":["Usage of individual codes can be tracked per promotion, showing which codes have already been redeemed in an order [from memory]."],"sourceVerdict":"yes","startedAt":"2026-09-15T14:21:24Z","endedAt":"2026-09-15T14:22:40Z"},"func-04":{"query":"What does the Shopware Migration Assistant transfer automatically from Shopware 5, and what has to be mapped by hand before the migration starts?","category":"func","option":"vanilla","answer":"The Migration Assistant can automatically transfer categories, customer groups, currencies, sales channels and number ranges as mandatory basic data, plus (if selected) products, properties, product options, product properties, translations, cross-selling and main variant relations, as well as customers, shipping methods, orders and order documents, and additionally promotions, SEO URLs, product reviews and media. Before migration can run, some things cannot be transferred and must instead be created in Shopware 6 and matched via a mapping step, including payment methods, a standard payment method, salutations, delivery times and a standard delivery time — it's mandatory to create these in Shopware 6 before you start the migration process to ensure a smooth transition. Even after migration, some areas still need manual, post-migration attention because they don't transfer automatically due to structural differences, such as shipping costs configuration, payment method activation, countries, documents, email templates, and shopping worlds/shop pages and custom templates.","citations":[{"url":"https://docs.shopware.com/en/migration-en/what-is-migrated","quote":"It's mandatory to create these in Shopware 6 before you start the migration process to ensure a smooth transition."},{"url":"https://docs.shopware.com/en/migration-en/what-is-migrated","quote":"Categories,"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware Migration Assistant what is transferred automatically from Shopware 5 manual mapping before migration"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/migration-en/what-is-migrated, prompt=List what data is migrated automatically by the Shopware Migration Assistant from Shopware 5, and what needs to be created/mapped manually beforehand (e.g. payment methods, shipping methods). Quote verbatim sentences."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:22:15Z","endedAt":"2026-09-15T14:23:20Z"},"func-05":{"query":"How do I set up a sales channel — storefront versus headless type, domains, languages and currencies — and where do I get its API access key?","category":"func","option":"vanilla","answer":"When creating a new sales channel, in the pop-up window you can choose whether you want to create a new Sales Channel with HTML storefront or a headless sales channel that only provides an API interface. Once created, you configure which languages should be available in your sales channel and select a default language, and specify which currencies should be available in your sales channel and select a default currency; on cloud instances a URL is already stored in the standard system, generated automatically when the instance is created, while for each domain entry you enter the desired domain and any subdomain and define the Language in which the store should be accessed via this URL and which Currency should be used when accessing the store via this URL. The API access key is found on the sales channel's own settings page, in the API section, where here you can generate an API Access ID for this sales channel; the documentation also points to the separate sales-channel API developer documentation for implementation details.","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/settings/saleschannel","quote":"In the pop-up window, you can choose whether you want to create a new **Sales Channel with HTML storefront** or a **headless sales channel** that only provides an API interface."},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/saleschannel","quote":"Specify which currencies should be available in your sales channel and select a default currency."},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/saleschannel","quote":"Here you can generate an API Access ID for this sales channel."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 sales channel setup storefront headless type domains languages currencies API access key"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-6-en/settings/saleschannel, prompt=Explain how to set up a sales channel in Shopware 6: choosing storefront vs headless type, configuring domains, languages, and currencies, and where to find the API access key. Quote verbatim sentences."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:22:58Z","endedAt":"2026-09-15T14:24:00Z"},"func-06":{"query":"Which triggers and actions does the Flow Builder offer, and how do I make it send a mail when an order is placed?","category":"func","option":"vanilla","answer":"The Flow Builder offers event-based triggers grouped by area: customer events (login, registration, deletion, password recovery, group changes), order events (payment method changes, order placement, status transitions such as open/in progress/completed/cancelled), payment and delivery state transitions (paid, refunded, authorized, failed, shipped, returned, cancelled), form and newsletter events (contact forms, product reviews, newsletter subscriptions), and system events (mail creation/sending, product exports, user recovery requests) [from memory]. Its actions cover sending email and generating documents, assigning payment/shipping/order status, customer management (group assignment, account status, tags), setting custom fields or granting download access, assigning affiliate/campaign codes, and calling webhooks [from memory]. To send a mail when an order is placed, you create a flow with the trigger 'checkout.order.placed', which triggers when an order is placed, and add the 'Send mail' action, where with this action, you can have emails sent automatically — you configure the recipient (e.g. the customer), the reply-to address, the email template to use, and optionally documents to attach, then activate the flow in the General tab.","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/settings/Flow-Builder","quote":"With this action, you can have emails sent automatically."},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/Flow-Builder","quote":"Triggers when an order is placed"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 Flow Builder triggers actions send mail order placed documentation"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-6-en/settings/Flow-Builder, prompt=List the trigger and action categories/types available in the Shopware 6 Flow Builder, and explain how to set up a flow that sends an email when an order is placed. Quote verbatim sentences."}],"notFoundClaim":false,"memoryClaims":["The Flow Builder offers event-based triggers grouped by area: customer events (login, registration, deletion, password recovery, group changes), order events (payment method changes, order placement, status transitions such as open/in progress/completed/cancelled), payment and delivery state transitions (paid, refunded, authorized, failed, shipped, returned, cancelled), form and newsletter events (contact forms, product reviews, newsletter subscriptions), and system events (mail creation/sending, product exports, user recovery requests) [from memory].","Its actions cover sending email and generating documents, assigning payment/shipping/order status, customer management (group assignment, account status, tags), setting custom fields or granting download access, assigning affiliate/campaign codes, and calling webhooks [from memory]."],"sourceVerdict":"partial","startedAt":"2026-09-15T14:23:29Z","endedAt":"2026-09-15T14:24:40Z"},"func-07":{"query":"How do I import products from a CSV with an import/export profile — column mapping, matching identifiers and a dry run?","category":"func","option":"vanilla","answer":"Import/export in Shopware 6 works through profiles: the profile that is selected for import and export specifies which database entries are accessed during import/export. Inside a profile's mapping section, in the database mapping you assign a column from the CSV file to the desired entries from the database, connecting each CSV column name to the matching database field. By default matching against existing records uses UUIDs, but in the profile's advanced settings, with a second unique identifier (identifier), you can now determine for yourself which identifier the data are mapped to with the entities — for example the productNumber must now be specified instead of the UUID when importing products, which lets you update existing products by product number instead of needing the internal UUID. Before running the real import you can use the dry run feature, described as: with this button you can test the import once completely before you actually start it, letting you catch CSV errors and avoid a partial import before committing the data.","citations":[{"url":"https://docs.shopware.com/en/shopware-en/settings/importexport","quote":"In the database mapping you assign a column from the CSV file to the desired entries from the database."},{"url":"https://docs.shopware.com/en/shopware-en/settings/importexport","quote":"With a second unique identifier (identifier), you can now determine for yourself which identifier the data are mapped to with the entities."},{"url":"https://docs.shopware.com/en/shopware-en/settings/importexport","quote":"With this button you can test the import once completely before you actually start it."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 import export profile CSV column mapping matching identifiers dry run documentation"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-en/settings/importexport, prompt=Explain how import/export profiles work in Shopware 6: column mapping to CSV, matching identifiers for updating existing records, and the dry run feature. Quote verbatim sentences."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:24:06Z","endedAt":"2026-09-15T14:25:00Z"},"func-08":{"query":"How do custom field sets work — entity assignment, field types and technical name — and can a custom field be written through the Store API?","category":"func","option":"vanilla","answer":"A custom field set is a group of fields that must be assigned to one or more program areas to be usable: these sets can then be assigned to one or more programme areas such as products or categories, and if no areas are selected, the set is created but is not available in any area. Each set and each field within it requires a unique technical name, and a unique technical name is required to create a new set, but the technical name cannot be changed later, so it must be chosen carefully up front (commonly with a vendor prefix to avoid collisions). The available field types include selects (single/multi), an object-selection type referencing entities like products, categories or countries, text field, media, number (integer or float), date/time, checkbox, an active/inactive switch, text editor, and color picker [from memory, list detail]. A custom field can indeed be written through the Store API if the 'Modifiable via Store API' option is enabled on it, which allows the Store API to modify this field, which facilitates storing custom data if adding new fields to the storefront; however, the documentation warns that if critical information, such as customer information, is entered into the field, it should not be made available to the store API, since that setting also makes the field publicly readable via the Store API.","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/settings/custom-fields","quote":"These sets can then be assigned to one or more programme areas such as products or categories."},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/custom-fields","quote":"the technical name cannot be changed later"},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/custom-fields","quote":"the Store API is allowed to modify this field"},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/custom-fields","quote":"If critical information, such as customer information, is entered into the field, it should not be made available to the store API."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 custom field sets entity assignment field types technical name Store API write"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-6-en/settings/custom-fields, prompt=Explain how custom field sets work in Shopware 6: entity assignment, available field types, the technical name requirement, and whether a custom field can be written through the Store API. Quote verbatim sentences."}],"notFoundClaim":false,"memoryClaims":["The available field types include selects (single/multi), an object-selection type referencing entities like products, categories or countries, text field, media, number (integer or float), date/time, checkbox, an active/inactive switch, text editor, and color picker [from memory, list detail]."],"sourceVerdict":"yes","startedAt":"2026-09-15T14:24:37Z","endedAt":"2026-09-15T14:25:40Z"},"func-09":{"query":"Why doesn't my payment method appear in the checkout — what has to be configured in the administration?","category":"func","option":"vanilla","answer":"Three separate settings on the payment method control whether it shows up at checkout. First, the method itself must be enabled: you can activate or deactivate the payment method with the Active button. Second, being active globally is not enough on its own — this does not automatically mean that all activated payment methods are available to your customers in the storefront, the decisive factor here is which payment methods are assigned in your sales channel, so the method also has to be added to the sales channel's list of assigned payment methods. Third, an availability rule can further restrict when the method is offered: you can use the availability rule to determine when this payment method should be available, and if it is set to a rule whose conditions (e.g. cart total, country, customer group) aren't currently met, the method will be hidden even though it is active and assigned — leaving the availability rule blank removes that restriction.","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/settings/Paymentmethods","quote":"you can activate or deactivate the payment method with the **Active button**."},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/Paymentmethods","quote":"This does not automatically mean that all activated payment methods are available to your customers in the storefront. The decisive factor here is which payment methods are assigned in your sales channel."},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/Paymentmethods","quote":"You can use the **availability rule** to determine when this payment method should be available."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 payment method not showing in checkout administration configuration active sales channel rule"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-6-en/settings/Paymentmethods, prompt=Explain what must be configured in the administration for a payment method to appear in checkout: activation, sales channel assignment, and availability rules. Quote verbatim sentences."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:25:11Z","endedAt":"2026-09-15T14:26:00Z"},"func-10":{"query":"How do dynamic product groups work in the administration and where can the resulting group be used?","category":"func","option":"vanilla","answer":"Dynamic product groups are found in the administration under Catalogues > Dynamic product groups, and instead of manually picking products you define rule-based conditions (using properties/operators, combined with AND/OR logic and nested sub-conditions) so that the group's product membership is calculated automatically. The conditions of a dynamic product group are based on rules of the Rule Builder. The resulting dynamic group can then be used to fill categories dynamically (e.g. for sales or manufacturer-specific categories), to populate product-comparison feeds, and in Shopping Experiences to fill product sliders (found in the Commerce block category).","citations":[{"url":"https://docs.shopware.com/en/shopware-6-de/Catalogues/Dynamicproductgroups","quote":"conditions of a dynamic product group are based on rules of the Rule Builder."},{"url":"https://docs.shopware.com/en/shopware-6-de/Catalogues/Dynamicproductgroups","quote":"In the shopping experiences, you can use dynamic product groups to fill product sliders"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 dynamic product groups administration where used"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-6-en/catalogues, prompt=Explain how dynamic product groups work and where the resulting group can be used (e.g. shopping experiences, cross-selling, promotions)."},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-6-de/Catalogues/Dynamicproductgroups, prompt=Explain how dynamic product groups work and where the resulting group can be used (e.g. shopping experiences, cross-selling, promotions)."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:19:21Z","endedAt":"2026-09-15T14:22:00Z"},"func-11":{"query":"How do I create an integration for Admin API access in the administration and give it the right privileges?","category":"func","option":"vanilla","answer":"Go to Settings > System > Integrations in the Shopware 6 administration and click \"Create integration\". Give it a name, then decide on its privilege level: you can either grant it full administrator permissions, or select another role from the dropdown list for the integration, if you have already defined roles here (roles are defined beforehand under Users & Permissions). After saving, Shopware generates an access ID and a security key for the integration, and the security key is shown only once so it must be noted down immediately since it authenticates the OAuth-based Admin API requests.","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/settings/system/integrationen","quote":"another [role] in the dropdown list for the integration, if you have already defined roles here"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 administration create integration Admin API access privileges"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-6-en/settings/system/integrationen, prompt=Explain how to create an integration for Admin API access in the administration and how to give it the right privileges/roles."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:20:11Z","endedAt":"2026-09-15T14:23:00Z"},"func-12":{"query":"A spec asks for customer-specific pricing and for a flow that calls an external URL when an order is placed — before I build either of them, does Shopware already ship them, and what has to be licensed or installed for them to exist in the shop?","category":"func","option":"vanilla","answer":"Both capabilities already exist in Shopware but neither is part of the free Community/core edition — both require the paid Shopware Commercial extension. Customer-specific pricing lets a merchant pull individually defined prices per customer from their system of choice into Shopware via API, and it sits under the Shopware Beyond plan tier rather than being a core feature [from memory, plan-tier positioning inferred from page structure]. For the second requirement, Flow Builder already has a built-in Webhook action that can call a web URL automatically and pass parameters as soon as a trigger such as Checkout/Order/Placed fires, but you need the Shopware Commercial extension to use the Webhook Actions, and this extension is available from the Evolve plan onwards. So before building either feature yourself, check whether the shop already has the Commercial extension (Evolve/Beyond plan) licensed and installed — if so, customer-specific pricing (via API) and the order-placed webhook flow action are already available out of the box; if not, they must be licensed and the Commercial extension installed first.","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/features/customer-specific-pricing","quote":"As a merchant who has customers with multiple individual price conditions, you can pull those defined prices from your system of choice in Shopware via API."},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/Flow-Builder","quote":"You need the Shopware Commercial extension to use the Webhook Actions. This extension is available to you from the Evolve Plan onwards."},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/Flow-Builder","quote":"With this action, you can have a web URL called automatically and pass parameters as soon as the trigger is fired."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware customer-specific pricing feature core or commercial"},{"tool":"WebSearch","args":"Shopware Flow Builder action call external URL webhook order placed"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-6-en/features/customer-specific-pricing, prompt=Is customer-specific pricing a core Shopware feature or does it require Commercial/Beyond plan licensing? What has to be installed/licensed?"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-6-en/settings/Flow-Builder, prompt=Does Flow Builder have a built-in action to call an external URL/webhook, and does it require the Commercial extension or any license/installation?"}],"notFoundClaim":false,"memoryClaims":["customer-specific pricing sits under the Shopware Beyond plan tier rather than being a core feature [from memory, plan-tier positioning inferred from page structure]"],"sourceVerdict":"yes","startedAt":"2026-09-15T14:20:48Z","endedAt":"2026-09-15T14:24:30Z"},"edge-01":{"query":"How do I configure Shopware 6's built-in GraphQL API for the Store API?","category":"edge","option":"vanilla","answer":"Shopware 6 does not ship a built-in, officially maintained GraphQL API — the Store API and Admin API are REST-based. The only GraphQL implementation that ever existed for Shopware 6 was SwagGraphQL, a proof-of-concept plugin exposing GraphQL over the Platform Core-API; its own repository states it \"was a POC for a GraphQL API for a very early Shopware 6.0 state. It is unmaintained and untested for newer versions,\" and the repository has since been archived. There is therefore no configuration path for a built-in GraphQL Store API in current Shopware 6 (including 6.7) — the Store API is consumed via its documented REST endpoints instead.","citations":[{"url":"https://github.com/shopwareArchive/SwagGraphQL","quote":"This was a POC for a GraphQL API for a very early Shopware 6.0 state. It is unmaintained and untested for newer versions."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 GraphQL API Store API support"},{"tool":"WebFetch","args":"url=https://github.com/shopwareArchive/SwagGraphQL, prompt=What is this repository and is it officially maintained by Shopware? Does Shopware have an official built-in GraphQL API?"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:21:32Z","endedAt":"2026-09-15T14:23:30Z"},"edge-02":{"query":"How do I get the DI container with `Shopware()->Container()` and override the product listing Smarty template in Shopware 6?","category":"edge","option":"vanilla","answer":"Neither `Shopware()->Container()` nor Smarty templates exist in Shopware 6 — both are Shopware 5 concepts. Shopware 5 used the Zend/Enlight-based global container accessed via `Shopware()->Container()` and rendered its storefront with Smarty templates, but Shopware 6 was rebuilt on Symfony and requires that dependencies must be injected via the service container, i.e. through constructor injection rather than any global accessor. For templating, Shopware 6 uses Twig, not Smarty; to override a storefront template such as the product listing you create the same relative path under `<plugin root>/src/Resources/views`, use `{% sw_extends '@Storefront/storefront/...html.twig' %}` to extend the original template, and then override the specific Twig block you want to change.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/architecture/dependency-injection-dependency-handling.html","quote":"Dependencies must be injected via the service container."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/customize-templates.html","quote":"To override it now, just add the very same block into your custom file and replace its contents."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware() Container() Smarty template Shopware 5 vs Shopware 6"},{"tool":"WebSearch","args":"developer.shopware.com dependency injection service container Shopware 6 plugin"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/dependency-injection.html, prompt=How does dependency injection / getting the service container work in Shopware 6, as opposed to the old Shopware()->Container() approach from Shopware 5?"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/architecture/dependency-injection-dependency-handling.html, prompt=Quote verbatim any sentence discussing how services/dependencies are obtained in Shopware 6, and whether a global container accessor like Shopware()->Container() still exists."},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/storefront/customize-templates.html, prompt=How do I override storefront templates in Shopware 6 (Twig)? Is Smarty used?"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:22:22Z","endedAt":"2026-09-15T14:26:00Z"},"edge-03":{"query":"Where do the `#[ORM\\Entity]` mapping attributes for my plugin's entity go in Shopware 6, and how do I get Doctrine's `EntityManager` injected into my service so I can persist it?","category":"edge","option":"vanilla","answer":"There is no such place, because Shopware 6 does not use Doctrine ORM at all: \"In contrast to most Symfony applications, Shopware uses no ORM, but a thin abstraction layer called the data abstraction layer (DAL).\" So `#[ORM\\Entity]` attributes and a Doctrine `EntityManager` are not part of Shopware 6's persistence model. Instead, a plugin defines its entity via a `EntityDefinition` class describing its field definitions (analogous to how core's `ProductDefinition` describes the product entity), and persistence/reads happen through an `EntityRepository` service for that entity, which is injected via the Symfony service container rather than an EntityManager.","citations":[{"url":"https://developer.shopware.com/docs/concepts/framework/data-abstraction-layer.html","quote":"In contrast to most Symfony applications, Shopware uses no ORM, but a thin abstraction layer called the data abstraction layer (DAL)."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 Doctrine ORM entity mapping or Data Abstraction Layer entity definition"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/concepts/framework/data-abstraction-layer.html, prompt=Does Shopware 6 use Doctrine ORM with #[ORM\\Entity] attributes and EntityManager, or its own Data Abstraction Layer? Quote the relevant sentence."}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:23:30Z","endedAt":"2026-09-15T14:25:30Z"},"edge-04":{"query":"How do I fetch products with `GET /sales-channel-api/v3/product` on Shopware 6.7?","category":"edge","option":"vanilla","answer":"That endpoint no longer exists on Shopware 6.7. The old Sales Channel API (`/sales-channel-api/...`) was deprecated in 6.3.2.0 and removed with 6.4.0, in favor of the Store API: the changelog states \"Deprecated Sales Channel API will be removed with 6.4.0. Use the replacements routes from the Store-API.\" On 6.7 you instead call the Store API's product search route, `POST /store-api/product` (with an `sw-access-key` header identifying the sales channel), rather than a `GET /sales-channel-api/v3/product` route.","citations":[{"url":"https://github.com/shopware/platform/blob/trunk/changelog/release-6-3-2-0/2020-09-09-deprecate-sales-channel-api.md","quote":"Deprecated Sales Channel API will be removed with 6.4.0. Use the replacements routes from the Store-API"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware sales-channel-api deprecated store-api product endpoint"},{"tool":"WebFetch","args":"url=https://github.com/shopware/platform/blob/trunk/changelog/release-6-3-2-0/2020-09-09-deprecate-sales-channel-api.md, prompt=Quote verbatim the changelog text about the sales-channel-api being deprecated and when it was removed."}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:23:58Z","endedAt":"2026-09-15T14:25:30Z"},"edge-05":{"query":"How do I enable Shopware's built-in MCP server on a Shopware 6.6 shop?","category":"edge","option":"vanilla","answer":"You cannot — the built-in MCP server does not exist on Shopware 6.6. According to Shopware's own documentation, \"The MCP server was introduced in Shopware 6.7.11.0 behind the `MCP_SERVER` feature flag. Shopware 6.7.14.0 removes the flag and introduces progressive tool discovery.\" So the feature was only added starting with 6.7.11.0 (initially behind a feature flag, later on by default from 6.7.14.0), and it remains experimental until 6.8. On 6.6 there is no such server to enable; you would need to upgrade the shop to at least 6.7.11.0 first.","citations":[{"url":"https://developer.shopware.com/docs/products/tools/mcp-server/intro.html","quote":"The MCP server was introduced in Shopware 6.7.11.0 behind the `MCP_SERVER` feature flag. Shopware 6.7.14.0 removes the flag and introduces progressive tool discovery."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware MCP server built-in version introduced 6.7"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/products/tools/mcp-server/intro.html, prompt=What Shopware version is required for the built-in MCP server? Is it available on 6.6?"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:24:25Z","endedAt":"2026-09-15T14:26:00Z"},"edge-06":{"query":"I'm coming from Magento — what are the Shopware equivalents of store views, extensions, attribute sets and `di.xml`?","category":"edge","option":"vanilla","answer":"Store views map to a Sales channel with different languages and domains in Shopware. Extensions map to the same idea Magento calls its Community Code Pool: Shopware plugins/apps distributed via the Extensions / Community Store marketplace. Attribute sets do not have a strict one-to-one equivalent, because Shopware doesn't enforce \"such a 'hard' separation of products into product types\" the way Magento does with attribute sets and product types; the closer equivalents are Properties (used for filtering and variant generation) and Custom field sets (used to group arbitrary custom fields), rather than a mandatory attribute-set-per-product-type model. `di.xml`, Magento's XML-based dependency injection configuration, corresponds to Shopware's Symfony-based service configuration — a plugin declares and wires its services in a `services.xml` or `services.yaml` file (with autowiring/autoconfiguration available), rather than an XML preference/plugin system [from memory].","citations":[{"url":"https://docs.shopware.com/en/migration-en/magento-keywords","quote":"Sales channel with different languages and domains"},{"url":"https://docs.shopware.com/en/migration-en/magento-keywords","quote":"such a 'hard' separation of products into product types"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware equivalent Magento store views extensions attribute sets di.xml"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/migration-en/magento-keywords, prompt=Quote how this page maps Magento concepts (store views, extensions, attribute sets, di.xml) to Shopware equivalents."}],"notFoundClaim":false,"memoryClaims":["`di.xml`, Magento's XML-based dependency injection configuration, corresponds to Shopware's Symfony-based service configuration — a plugin declares and wires its services in a `services.xml` or `services.yaml` file (with autowiring/autoconfiguration available), rather than an XML preference/plugin system [from memory]."],"sourceVerdict":"partial","startedAt":"2026-09-15T14:24:52Z","endedAt":"2026-09-15T14:27:00Z"},"edge-07":{"query":"How do I set up Shopware PWA as the storefront for a Shopware 6.7 shop?","category":"edge","option":"vanilla","answer":"For a new Shopware 6.7 shop you should not start a fresh project on the classic Shopware PWA package — Shopware itself has said \"any new custom implementation should start with the new code base rather than the Shopware PWA packages,\" pointing instead to Shopware Frontends (a Composables-API-based, framework-agnostic toolkit with a Nuxt.js reference implementation) as the recommended successor for building a headless storefront against the Store API. That said, the original Shopware PWA is a Vue.js single-page application that talks to Shopware over the Store/SalesChannel API; setting it up traditionally means installing the `shopware-pwa` npm packages, creating a Sales Channel of type \"Headless\" in the Shopware admin to obtain a Domain (instance address) and API access token, and configuring the PWA project's `.env`/shopware config with that instance address and access token so it can call the Store API. Since existing PWA projects keep working (the old API remains supported), this classic setup is still technically possible on 6.7, but Shopware's own guidance is to build any new storefront on Shopware Frontends rather than Shopware PWA.","citations":[{"url":"https://www.shopware.com/en/news/the-future-of-shopware-pwa/","quote":"any new custom implementation should start with the new code base rather than the Shopware PWA packages"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware PWA setup Shopware 6.7 storefront installation guide"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/v6.5/products/pwa.html, prompt=What is the status of Shopware PWA — is it still recommended, or has it been replaced/deprecated in favor of another product like Shopware Frontends? How would I set it up as a storefront?"},{"tool":"WebSearch","args":"\"Shopware PWA\" deprecated \"Shopware Frontends\" successor 2024 2025"},{"tool":"WebFetch","args":"url=https://www.shopware.com/en/news/the-future-of-shopware-pwa/, prompt=What is happening to Shopware PWA and what is the recommended replacement/successor for new projects?"}],"notFoundClaim":false,"memoryClaims":["That said, the original Shopware PWA is a Vue.js single-page application that talks to Shopware over the Store/SalesChannel API; setting it up traditionally means installing the `shopware-pwa` npm packages, creating a Sales Channel of type \"Headless\" in the Shopware admin to obtain a Domain (instance address) and API access token, and configuring the PWA project's `.env`/shopware config with that instance address and access token so it can call the Store API. [from memory]"],"sourceVerdict":"yes","startedAt":"2026-09-15T14:25:23Z","endedAt":"2026-09-15T14:28:30Z"},"edge-08":{"query":"Which service do I type-hint to read products — `EntityRepositoryInterface` — and how do I inject it into my plugin service?","category":"edge","option":"vanilla","answer":"There is no `EntityRepositoryInterface` in Shopware 6 — the class you actually type-hint is the concrete `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository`, which has no separate interface. To read products you type-hint `EntityRepository` (repo path confirms only `EntityRepository` exists, no interface file alongside it). To inject it into your own plugin service, you declare the `product.repository` service as an argument in your `services.xml` using `<argument type=\"service\" id=\"product.repository\"/>`, since Shopware registers a repository service per entity named `<entity>.repository` [from memory].","citations":["vendor/shopware/core/Framework/DataAbstractionLayer/EntityRepository.php:1-40"],"toolCallLog":[{"tool":"Bash","args":"find <home>/projects/host-project/vendor/shopware/core/Framework/DataAbstractionLayer -maxdepth 1 -iname \"*Repository*\""},{"tool":"Read","args":"file_path=<home>/projects/host-project/vendor/shopware/core/Framework/DataAbstractionLayer/EntityRepository.php, limit=40"}],"notFoundClaim":false,"memoryClaims":["To inject it into your own plugin service, you declare the `product.repository` service as an argument in your `services.xml` using `<argument type=\"service\" id=\"product.repository\"/>`, since Shopware registers a repository service per entity named `<entity>.repository`."],"sourceVerdict":"partial","startedAt":"2026-09-15T14:19:28Z","endedAt":"2026-09-15T14:21:00Z"},"edge-09":{"query":"Where do I configure Business Events so that a mail is sent when an order is placed in Shopware 6.7?","category":"edge","option":"vanilla","answer":"In Shopware 6.7, Business Events (Settings > Shop > Business-Events, selecting the \"Order placed\" event and an email template) are effectively legacy: \"Business events will be replaced by the Flow Builder in the major release 6.4.8.0.\" They remain available only for the B2B-Suite, so on a current 6.7 shop you should instead use Flow Builder — create a flow triggered by the \"Order placed\" (checkout.order.placed) event with a \"Send email\" action and the desired mail template, rather than the old Business Events screen [from memory].","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/settings/Business-Events","quote":"Business events will be replaced by the Flow Builder in the major release 6.4.8.0."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 Business Events configure mail sent order placed admin"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-6-en/settings/Business-Events, prompt=How do I configure Business Events so a mail is sent when an order is placed? Is this still current in Shopware 6.7 or replaced by Flow Builder?"}],"notFoundClaim":false,"memoryClaims":["They remain available only for the B2B-Suite, so on a current 6.7 shop you should instead use Flow Builder — create a flow triggered by the \"Order placed\" (checkout.order.placed) event with a \"Send email\" action and the desired mail template, rather than the old Business Events screen."],"sourceVerdict":"yes","startedAt":"2026-09-15T14:19:48Z","endedAt":"2026-09-15T14:23:00Z"},"gap-01":{"query":"How do I add my own Admin API endpoint under `/api/...` from a plugin — a controller with the api route scope and its ACL?","category":"gap","option":"vanilla","answer":"Register your controller class as a service in your plugin's `services.xml` (Shopware auto-tags controllers under the default DI setup), then put the class in an `Api` namespace and mark the class-level route with the api scope: `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [ApiRouteScope::ID]])]`, as core does for `Shopware\\Core\\Content\\Seo\\Api\\SeoActionController`. On the actual action method, add `#[Route(path: '/api/_action/your-plugin/your-action', name: 'api.your-plugin.your-action', defaults: [PlatformRequest::ATTRIBUTE_ACL => ['your_privilege:update']], methods: [Request::METHOD_POST])]` — the `PlatformRequest::ATTRIBUTE_ACL` default is exactly how core protects the endpoint with an ACL privilege, so an admin user without that privilege gets rejected. You then create the ACL privilege itself (e.g. via an ACL role/privilege data migration or the `AclPrivilegeCollection` extension mechanism) so it can be assigned to admin roles [from memory].","citations":["vendor/shopware/core/Content/Seo/Api/SeoActionController.php:1-58","vendor/shopware/core/Content/Seo/Api/SeoActionController.php:60-77"],"toolCallLog":[{"tool":"WebSearch","args":"Shopware plugin add own admin api route controller ACL developer.shopware.com"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/administration/add-custom-route, prompt=How do I create a custom Admin API endpoint from a plugin, with the api route scope attribute and ACL privilege check?"},{"tool":"WebSearch","args":"Shopware \"RouteScope\" \"api\" controller plugin custom endpoint privileges"},{"tool":"Bash","args":"grep -rl \"ApiRouteScope::ID\" <home>/projects/host-project/vendor/shopware/core/Content --include=*.php | head -5"},{"tool":"Read","args":"file_path=<home>/projects/host-project/vendor/shopware/core/Content/Seo/Api/SeoActionController.php, limit=60"},{"tool":"Read","args":"file_path=<home>/projects/host-project/vendor/shopware/core/Content/Seo/Api/SeoActionController.php, offset=60, limit=20"}],"notFoundClaim":false,"memoryClaims":["Register your controller class as a service in your plugin's `services.xml` (Shopware auto-tags controllers under the default DI setup), then put the class in an `Api` namespace and mark the class-level route with the api scope: `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [ApiRouteScope::ID]])]`, as core does for `Shopware\\Core\\Content\\Seo\\Api\\SeoActionController`.","You then create the ACL privilege itself (e.g. via an ACL role/privilege data migration or the `AclPrivilegeCollection` extension mechanism) so it can be assigned to admin roles."],"sourceVerdict":"partial","startedAt":"2026-09-15T14:20:30Z","endedAt":"2026-09-15T14:26:00Z"},"gap-02":{"query":"Shopware 6.7 removed the RSA JWT key files and `system:generate-jwt-secret` — what signs Admin API tokens now, and what do I have to do when upgrading?","category":"gap","option":"vanilla","answer":"Shopware moved from asymmetric RSA key pairs (config/jwt/private.pem + public.pem, generated by the now-removed `system:generate-jwt-secret`) to HMAC-based JWT signing that reuses the existing `APP_SECRET` environment variable — as the 6.6.1.0 release notes put it, \"Using private/public keys (asymmetric encryption) for JWT is now deprecated and will be removed with the next major release,\" in favor of an approach that \"leverages the existing `APP_SECRET` environment variable instead of requiring separate RSA keys stored in a `config/jwt` folder.\" On upgrading to 6.7, you no longer need the `config/jwt` directory at all: Admin API tokens are signed with `APP_SECRET`, so you just need to make sure `APP_SECRET` is set (it already is on any properly configured install, since Symfony itself requires it) and can remove the old `config/jwt` key files and any deployment step that mounted or generated them [from memory].","citations":[{"url":"https://developer.shopware.com/release-notes/6.6/6.6.1.0.html","quote":"Using private/public keys (asymmetric encryption) for JWT is now deprecated and will be removed with the next major release."},{"url":"https://developer.shopware.com/release-notes/6.6/6.6.1.0.html","quote":"The system now supports HMAC-based JWT authentication, which leverages the existing `APP_SECRET` environment variable instead of requiring separate RSA keys stored in a `config/jwt` folder."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6.7 removed system:generate-jwt-secret JWT key admin api token signing"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/release-notes/6.6/6.6.1.0.html, prompt=What changed regarding JWT key generation, RSA keys, HMAC, and APP_SECRET for Admin API tokens?"}],"notFoundClaim":false,"memoryClaims":["On upgrading to 6.7, you no longer need the `config/jwt` directory at all: Admin API tokens are signed with `APP_SECRET`, so you just need to make sure `APP_SECRET` is set (it already is on any properly configured install, since Symfony itself requires it) and can remove the old `config/jwt` key files and any deployment step that mounted or generated them."],"sourceVerdict":"partial","startedAt":"2026-09-15T14:21:28Z","endedAt":"2026-09-15T14:27:00Z"},"gap-03":{"query":"My ERP integration stopped logging in after the 6.7 upgrade — what changed in the Admin API OAuth flow (`/api/oauth/authorize`, the `scope` format)?","category":"gap","option":"vanilla","answer":"Shopware's 6.7 upgrade notes say the `/api/oauth/authorize` route (`\\Core\\Framework\\Api\\Controller\\AuthController::authorize` method) was \"removed... without replacement,\" so any integration still hitting that endpoint will fail outright. Separately, because Shopware upgraded the underlying `league/oauth2-server` library to a spec-compliant version, the token request's scope parameter format changed: \"scopes now needed to be provided as `scope` parameter and as a space-delimited list of strings\" — i.e. instead of sending `scopes: ['write', 'admin']` as an array, your ERP must send a single `scope` field with a space-delimited string like `scope: 'write admin'`. If your ERP client still posts scopes as an array (or still calls `/api/oauth/authorize`), that is almost certainly why login now fails; update the client to send `scope` as a space-separated string via the standard client-credentials token endpoint.","citations":[{"url":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.7.md","quote":"Removed API route `/api/oauth/authorize` (`\\Core\\Framework\\Api\\Controller\\AuthController::authorize` method) without replacement."},{"url":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.7.md","quote":"scopes now needed to be provided as `scope` parameter and as a space-delimited list of strings."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6.7 admin api oauth scope format changed breaking change"},{"tool":"WebFetch","args":"url=https://github.com/shopware/shopware/blob/trunk/UPGRADE-6.7.md, prompt=What changed about the Admin API OAuth flow: the /api/oauth/authorize route and the scope parameter format?"},{"tool":"WebFetch","args":"url=https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.7.md, prompt=What changed about the Admin API OAuth flow: the /api/oauth/authorize route and the scope parameter format?"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:22:23Z","endedAt":"2026-09-15T14:29:00Z"},"gap-04":{"query":"After upgrading to 6.7 my plugin fatals on load because core class properties now have native PHP types — which properties must I retype in my subclasses?","category":"gap","option":"vanilla","answer":"The 6.7 upgrade notes state generically that \"All PHP class properties now have a native type,\" and warn: \"If you have extended classes with properties, which didn't have a native type before, make sure you now add them as well.\" Shopware does not publish a single enumerated list of which specific properties changed — it's a codebase-wide change, so the fix is per-class: for every core class your plugin extends and re-declares a property on, add the same native PHP type Shopware now declares on that property in the current core source, or you'll get a fatal \"type must be compatible\" error. In practice, run your plugin's test suite / a syntax check against 6.7 and fix each reported property one at a time by opening the corresponding vendor/shopware/core class and copying its new property type [from memory].","citations":[{"url":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.7.md","quote":"All PHP class properties now have a native type."},{"url":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.7.md","quote":"If you have extended classes with properties, which didn't have a native type before, make sure you now add them as well."}],"toolCallLog":[{"tool":"WebFetch","args":"url=https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.7.md, prompt=What is said about core class properties gaining native PHP types, and what plugin authors need to retype in subclasses?"}],"notFoundClaim":false,"memoryClaims":["In practice, run your plugin's test suite / a syntax check against 6.7 and fix each reported property one at a time by opening the corresponding vendor/shopware/core class and copying its new property type."],"sourceVerdict":"partial","startedAt":"2026-09-15T14:23:06Z","endedAt":"2026-09-15T14:24:30Z"},"gap-05":{"query":"My plugin decorates `CachedProductRoute` to add cache tags — where did the `Cached*Route` classes go in Shopware 6.7 and how do I cache a Store API route now?","category":"gap","option":"vanilla","answer":"They were removed. The 6.7 upgrade notes say: \"The Store-API route caching has been removed. This means that the `Cached*Route` classes will be removed.\" A repo search of the installed vendor/shopware/core source confirms there is no `CachedProductRoute` (or any `Cached*Route`) file present anymore. Store API responses are no longer cached at the route/decoration layer at all — Shopware now relies purely on HTTP-level (reverse-proxy / HTTP cache) caching instead of the old separate route-cache-plus-HTTP-cache combination, which previously caused inconsistent invalidation. So if your plugin decorated `CachedProductRoute` to add cache tags, that decoration target no longer exists in 6.7; you need to move your cache-tag logic to the HTTP-cache layer instead — e.g. hook into the store-api-route-cache-tags/HTTP cache events used to build the `Cache-Tag`/invalidation headers for the plain `ProductRoute`'s HTTP response, rather than decorating a dedicated cache decorator class [from memory].","citations":[{"url":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.7.md","quote":"The Store-API route caching has been removed. This means that the `Cached*Route` classes will be removed."}],"toolCallLog":[{"tool":"Bash","args":"find <home>/projects/host-project/vendor/shopware/core -iname \"*CachedProductRoute*\"; find <home>/projects/host-project/vendor/shopware/core -iname \"*Cached*Route*\" | head -20"},{"tool":"WebFetch","args":"url=https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.7.md, prompt=What happened to the Cached*Route classes (like CachedProductRoute) and how does Store API route caching work now?"}],"notFoundClaim":false,"memoryClaims":["So if your plugin decorated `CachedProductRoute` to add cache tags, that decoration target no longer exists in 6.7; you need to move your cache-tag logic to the HTTP-cache layer instead — e.g. hook into the store-api-route-cache-tags/HTTP cache events used to build the `Cache-Tag`/invalidation headers for the plain `ProductRoute`'s HTTP response, rather than decorating a dedicated cache decorator class."],"sourceVerdict":"yes","startedAt":"2026-09-15T14:23:27Z","endedAt":"2026-09-15T14:26:00Z"},"gap-06":{"query":"How do I create a shipping method from my plugin's installer or migration, including the `technicalName` that 6.7 requires?","category":"gap","option":"vanilla","answer":"In your plugin's `install()`/`activate()` method (or a migration), use the `shipping_method.repository` (`EntityRepository`) to upsert a row into the `shipping_method` entity, and since Shopware 6.7 you must include a `technicalName` value — the `ShippingMethodDefinition` declares `(new StringField('technical_name', 'technicalName'))->addFlags(new ApiAware(), new Required())`, i.e. the field is flagged `Required()` at the DAL level. This lines up with the changelog note that the technical name \"is only required in the Administration for now, but will be required in the API as well in the future (v6.7.0.0)\" — that future is now, so on 6.7 an insert/upsert without `technicalName` will fail DAL validation. Pick a unique, stable string (Shopware's own convention is a snake/dot-ish machine name, e.g. `my_plugin.express_shipping`) and pass it alongside the usual `name`, `active`, `deliveryTime`, etc. fields when you create the shipping method entity in your install/migration code [from memory].","citations":["vendor/shopware/core/Checkout/Shipping/ShippingMethodDefinition.php:77-77",{"url":"https://github.com/shopware/shopware/blob/trunk/changelog/release-6-5-7-0/2023-10-17-add-payment-and-shipping-method-technical_name.md","quote":"The technical name is only required in the Administration for now, but will be required in the API as well in the future (v6.7.0.0)."}],"toolCallLog":[{"tool":"Bash","args":"grep -rn \"technicalName\" <home>/projects/host-project/vendor/shopware/core/Checkout/Shipping/ShippingMethodDefinition.php; find <home>/projects/host-project/vendor/shopware/core/Checkout/Shipping -iname \"*.php\" | xargs grep -l \"technicalName\""},{"tool":"WebSearch","args":"Shopware plugin migration add shipping method technicalName developer.shopware.com"},{"tool":"WebFetch","args":"url=https://github.com/shopware/shopware/blob/trunk/changelog/release-6-5-7-0/2023-10-17-add-payment-and-shipping-method-technical_name.md, prompt=What is required regarding technicalName when creating a shipping method, and what happens if it's missing?"},{"tool":"Bash","args":"grep -rl \"shipping_method\" <home>/projects/host-project/vendor/shopware/core/Migration --include=*.php | tail -5"}],"notFoundClaim":false,"memoryClaims":["In your plugin's `install()`/`activate()` method (or a migration), use the `shipping_method.repository` (`EntityRepository`) to upsert a row into the `shipping_method` entity, and since Shopware 6.7 you must include a `technicalName` value.","Pick a unique, stable string (Shopware's own convention is a snake/dot-ish machine name, e.g. `my_plugin.express_shipping`) and pass it alongside the usual `name`, `active`, `deliveryTime`, etc. fields when you create the shipping method entity in your install/migration code."],"sourceVerdict":"partial","startedAt":"2026-09-15T14:23:55Z","endedAt":"2026-09-15T14:28:00Z"},"gap-07":{"query":"How do I create a media entity from a file on disk in PHP from my plugin (e.g. during an import) and generate its thumbnails?","category":"gap","option":"vanilla","answer":"Inject the core `Shopware\\Core\\Content\\Media\\MediaService` into your plugin service and call `saveMediaFile(MediaFile $mediaFile, string $filename, Context $context, ?string $folder = null, ?string $mediaId = null, bool $private = true): string` — build a `MediaFile` from your on-disk file (path, mime type, extension, file size) and pass it in; if you don't supply `$mediaId`, `saveMediaFile` calls `createMediaInFolder` internally to create the media entity for you before persisting the file. Internally `saveMediaFile` delegates to `FileSaver::persistFileToMedia($mediaFile, $filename, $mediaId, $context)`, and that method itself calls `$this->cleanup->dispatchThumbnailGeneration($mediaId, $context)` as part of persisting, so thumbnails are generated automatically as a consequence of saving the file — you don't need to trigger a separate command for a single imported file. If you're bulk-importing many files, the console command `bin/console media:generate-thumbnails` is the way to (re)generate thumbnails afterwards [from memory].","citations":["vendor/shopware/core/Content/Media/MediaService.php:54-91","vendor/shopware/core/Content/Media/File/FileSaver.php:1-20"],"toolCallLog":[{"tool":"WebSearch","args":"Shopware plugin create media entity from file on disk PHP MediaService generate thumbnails"},{"tool":"Bash","args":"find <home>/projects/host-project/vendor/shopware/core/Content/Media -maxdepth 1 -iname \"*.php\" | grep -i -E \"service|saver\""},{"tool":"Bash","args":"grep -n \"public function\" <home>/projects/host-project/vendor/shopware/core/Content/Media/MediaService.php | head -30"},{"tool":"Read","args":"file_path=<home>/projects/host-project/vendor/shopware/core/Content/Media/MediaService.php, offset=54, limit=40"},{"tool":"Bash","args":"grep -n \"Thumbnail\\|class FileSaver\\|public function persistFileToMedia\" <home>/projects/host-project/vendor/shopware/core/Content/Media/File/FileSaver.php | head -20"},{"tool":"Read","args":"file_path=<home>/projects/host-project/vendor/shopware/core/Content/Media/File/FileSaver.php, limit=20"}],"notFoundClaim":false,"memoryClaims":["If you're bulk-importing many files, the console command `bin/console media:generate-thumbnails` is the way to (re)generate thumbnails afterwards."],"sourceVerdict":"yes","startedAt":"2026-09-15T14:24:38Z","endedAt":"2026-09-15T14:29:00Z"},"gap-08":{"query":"How do I set up a Nuxt project with Shopware Composable Frontends against my shop's Store API — endpoint, access token, and why do I get HTTP 412?","category":"gap","option":"vanilla","answer":"Add the `@shopware/nuxt-module` to your Nuxt app and configure it, e.g. in `nuxt.config.ts`: `modules: [\"@shopware/nuxt-module\"], shopware: { endpoint: \"https://your-shopware-instance.com/store-api/\", accessToken: \"YOUR_ACCESS_TOKEN_HERE\" }` — or, as the docs recommend, override the same two keys under `runtimeConfig.public.shopware` since \"runtimeConfig will always override the base ones,\" which is better for per-environment secrets. The `accessToken` must be the sales-channel access token (found in Sales Channel > API in the admin, for the sales channel you want the storefront to talk to), and `endpoint` must point at the Store API root, including the trailing `/store-api/` path, not just the shop's domain. An HTTP 412 (Precondition Failed) from the Store API in this context means \"the specified `accessToken` is incorrect or not correct for the specified `endpoint`\" — i.e. either the token doesn't belong to the sales channel behind that endpoint, or the endpoint URL is wrong (commonly missing the `/store-api/` suffix); the troubleshooting guide's fallback is to hit the store-api endpoint directly with a plain API client to confirm whether the problem is the frontend config or the backend itself.","citations":[{"url":"https://developer.shopware.com/frontends/resources/troubleshooting.html","quote":"the specified `accessToken` is incorrect or not correct for the specified `endpoint`"},{"url":"https://developer.shopware.com/frontends/packages/nuxt-module.html","quote":"runtimeConfig will always override the base ones"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware Composable Frontends Nuxt shopware-endpoint shopware-access-token 412 error"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/frontends/resources/troubleshooting.html, prompt=What does a 412 error mean in Shopware Composable Frontends, and how should shopwareEndpoint and shopwareAccessToken be configured?"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/frontends/packages/nuxt-module.html, prompt=How do I set up the Shopware Nuxt module (Composable Frontends) with shopwareEndpoint and shopwareAccessToken configuration?"}],"notFoundClaim":false,"memoryClaims":["The `accessToken` must be the sales-channel access token (found in Sales Channel > API in the admin, for the sales channel you want the storefront to talk to), and `endpoint` must point at the Store API root, including the trailing `/store-api/` path, not just the shop's domain."],"sourceVerdict":"yes","startedAt":"2026-09-15T14:25:34Z","endedAt":"2026-09-15T14:30:00Z"},"rule-01":{"query":"May I extend (subclass) a concrete Shopware core service to change its behaviour, or what should I do instead?","category":"rule","option":"vanilla","answer":"No, direct extension (subclassing) of core services is not intended; instead Shopware uses the decorator pattern for services that can be exchanged via the DI container. Instead of interfaces, Shopware uses abstract classes to define the base functionality of a service, which allows adding more functions without breaking existing code. To adjust a service you extend the abstract class, accept an instance of the abstract service in your constructor, and your getDecorated() method returns that decorated instance, while the core implementation's getDecorated() throws a DecorationPatternException because it has no decoration yet. This lets multiple plugins layer their own logic around the same service without the conflicts that multiple inheritance/subclassing would create [from memory].","citations":[{"url":"https://developer.shopware.com/docs/resources/guidelines/code/core/decorator-pattern.html","quote":"Instead of interfaces, we use abstract classes to define the base functionality of a service. This allows us to add more functions without breaking existing code."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 developer documentation \"decoration pattern\" extend core service instead of subclassing"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/resources/guidelines/code/core/decorator-pattern.html, prompt=Quote the text explaining why not to subclass core services and what the decorator pattern requires instead."}],"notFoundClaim":false,"memoryClaims":["This lets multiple plugins layer their own logic around the same service without the conflicts that multiple inheritance/subclassing would create [from memory]."],"sourceVerdict":"yes","startedAt":"2026-09-15T14:19:32Z","endedAt":"2026-09-15T14:21:30Z"},"rule-02":{"query":"Where should cleanup of my plugin's own data on uninstall go, and what must I respect?","category":"rule","option":"vanilla","answer":"Cleanup of your plugin's own data belongs in the plugin's uninstall() lifecycle method, which is the opposite of install() and is executed when the plugin is uninstalled. The uninstall() method receives an UninstallContext, which provides the same information as InstallContext, plus the keepUserData() flag, and you must respect that flag: if keepUserData() returns true, you must not delete persistent data created by your plugin.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.html","quote":"The `uninstall()` method receives an `UninstallContext`, which provides the same information as `InstallContext`, plus the `keepUserData()` flag."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.html","quote":"When uninstalling a plugin, you can choose whether to remove all associated plugin data or not. If `keepUserData()` returns `true`, you must not delete persistent data created by your plugin."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 plugin uninstall UninstallContext keepUserData remove data documentation"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.html, prompt=Quote the text about the uninstall method, UninstallContext, and keepUserData behavior."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:20:29Z","endedAt":"2026-09-15T14:22:30Z"},"rule-03":{"query":"Which annotations mark a core class or method as off-limits for extensions, and what does each mean for me?","category":"rule","option":"vanilla","answer":"Shopware marks core classes as @final when developers can use the class but should not extend it: 'We mark classes as @final when developers can use the class but should not extend it,' meaning the core reserves the right to add public methods or change protected/private internals without warning [from memory partial]. It marks classes as @internal when the class is private API not meant to be used or extended at all: 'We mark classes as @internal when the class is a private API and should not be used or extended by other developers,' and such classes 'may change completely with each release and are therefore not intended for use by third-party developers.' A related @experimental annotation marks newly introduced, not-yet-released code that is not treated as public API until the feature ships, with no backward-compatibility promise while experimental. Together these signal: @final = use but don't subclass, @internal = don't touch at all, @experimental = usable but unstable and subject to change without a BC guarantee [from memory].","citations":[{"url":"https://developer.shopware.com/docs/resources/guidelines/code/core/final-and-internal.html","quote":"We mark classes as `@final` when developers can use the class but should not extend it."},{"url":"https://developer.shopware.com/docs/resources/guidelines/code/core/final-and-internal.html","quote":"We mark classes as `@internal` when the class is a private API and should not be used or extended by other developers."},{"url":"https://developer.shopware.com/docs/resources/guidelines/code/core/internal.html","quote":"Classes with this annotation may change completely with each release and are therefore not intended for use by third-party developers."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware developer documentation @internal @experimental annotation core class extension"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/resources/guidelines/code/core/internal.html, prompt=Quote the text explaining what the @internal annotation means for developers extending Shopware."},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/resources/guidelines/code/core/final-and-internal.html, prompt=Quote the text explaining what \"final\" classes mean and what @internal means, for someone extending Shopware core classes."}],"notFoundClaim":false,"memoryClaims":["meaning the core reserves the right to add public methods or change protected/private internals without warning [from memory partial]","A related @experimental annotation marks newly introduced, not-yet-released code that is not treated as public API until the feature ships, with no backward-compatibility promise while experimental.","Together these signal: @final = use but don't subclass, @internal = don't touch at all, @experimental = usable but unstable and subject to change without a BC guarantee [from memory]."],"sourceVerdict":"yes","startedAt":"2026-09-15T14:21:10Z","endedAt":"2026-09-15T14:23:30Z"},"rule-04":{"query":"How should my plugin throw exceptions so they follow Shopware's conventions?","category":"rule","option":"vanilla","answer":"Do not throw generic exceptions such as \\RuntimeException that can't be traced; each exception should have its own error code, which is passed to external APIs. Shopware's convention is to implement a separate exception class for each domain that acts as a factory for all exceptions within that domain, with the constructor set to private, and each exception assigned a unique constant-based error code (e.g. a pattern like NOT_FOUND_CODE = 'CMS_NOT_FOUND'). If an exception needs to be caught specifically elsewhere in the code, a dedicated exception class is placed in an Exception subfolder extending the domain exception so it can be targeted in a try/catch. HTTP-facing exceptions extend ShopwareHttpException with an appropriate 40x status code when the client is at fault (e.g. missing fields), so the correct HTTP status is returned to the caller [from memory, based on general ShopwareHttpException usage referenced in search results].","citations":[{"url":"https://developer.shopware.com/docs/resources/references/adr/2022-02-24-domain-exceptions.html","quote":"Each exception has its own error code, which is passed to external APIs"},{"url":"https://developer.shopware.com/docs/resources/references/adr/2022-02-24-domain-exceptions.html","quote":"We implement a separate exception class for each domain. This class is used as a factory for all exceptions within the domain. The __construct of the DomainException is set to `private`"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 developer documentation exception guidelines ShopwareHttpException error code convention"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/resources/references/adr/2022-02-24-domain-exceptions.html, prompt=Quote the text describing how exceptions should be structured/thrown, including error codes and ShopwareHttpException usage."}],"notFoundClaim":false,"memoryClaims":["HTTP-facing exceptions extend Shopwar
