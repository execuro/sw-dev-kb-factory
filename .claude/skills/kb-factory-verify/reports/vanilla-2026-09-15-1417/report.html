eHttpException with an appropriate 40x status code when the client is at fault (e.g. missing fields), so the correct HTTP status is returned to the caller [from memory, based on general ShopwareHttpException usage referenced in search results]."],"sourceVerdict":"yes","startedAt":"2026-09-15T14:22:07Z","endedAt":"2026-09-15T14:24:00Z"},"rule-05":{"query":"Which test level should I pick for a change to a DAL entity definition, and how do I keep the test deterministic?","category":"rule","option":"vanilla","answer":"Pick an integration test: Shopware's guideline is to isolate SQL/DBAL work in database adapters and cover those adapters with integration tests, rather than behavior-mocking Doctrine DBAL Connection by asserting SQL calls or parameters. For the surrounding business logic (not the DAL access itself) you unit-test against a narrow repository, gateway, service abstraction, or simple stub that returns the result object the class under test needs, keeping pure unit tests fast and independent of the database. To make the integration test deterministic, use the IntegrationTestBehaviour trait, which provides handy features such as automatically setting up a database transaction or clearing the cache before each test, so state from one test does not leak into another.","citations":[{"url":"https://developer.shopware.com/docs/resources/guidelines/code/core/unit-tests.html","quote":"Do not behavior-mock Doctrine DBAL `Connection` by asserting SQL calls or parameters; isolate SQL/DBAL work in database adapters and cover those adapters with integration tests."},{"url":"https://developer.shopware.com/docs/resources/guidelines/code/core/unit-tests.html","quote":"Unit-test the surrounding business logic against a narrow repository, gateway, service abstraction, or simple stub that returns the result object the class under test needs."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/testing/php-unit.html","quote":"automatically setting up a database transaction or clearing the cache before each test"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware developer documentation testing guidelines DAL entity definition integration test unit test"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/development/testing/, prompt=Quote the text describing when to use unit tests vs integration tests, especially anything about testing DAL / entity definitions and database determinism (e.g. transactions, fixed IDs, avoiding random data)."},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/testing/php-unit.html, prompt=Quote the text about testing DAL entities/repositories, IntegrationTestBehaviour, database transactions, and any advice for keeping tests deterministic (fixed UUIDs vs random data, avoiding time-based flakiness)."},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/resources/guidelines/code/core/unit-tests.html, prompt=Quote any guidance about testing DAL/database code, when integration tests vs unit tests are used, and how to keep tests deterministic (avoiding flakiness, random data, DB transactions)."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-15T14:22:53Z","endedAt":"2026-09-15T14:25:30Z"},"rule-06":{"query":"Can a storefront controller contain business logic, or where should that logic live?","category":"rule","option":"vanilla","answer":"No: Shopware's guideline states 'A Storefront controller should never contain business logic.' A storefront controller should never use a repository directly either; instead it calls the corresponding Store API route for write operations and uses page loaders or routes to fetch data for read operations, delegating the actual business logic to the Store API layer. Page loaders themselves are not allowed to work directly with repositories and may only load data via the Store API, which keeps storefront functionality reachable through the Store API as wel     function drawGrid() {
      gridWrap.innerHTML = '';

        if (!activeCategory && !activeVerdict) return true;
        return optionKeys.some(function (k) {
          var c = byOptCase[k][cid];
          if (!c) return false;
          if (activeCategory && c.category !== activeCategory) return false;
          if (activeVerdict && c.verdict !== activeVerdict) return false;
          return true;
        });
      });
      if (!visibleCases.length || !optionKeys.length) {
        gridWrap.appendChild(el('p', { class: 'empty', text: 'No cases match the filters.' }));

      }
      var table = document.createElement('table');
      var thead = document.createElement('thead');

    panel.appendChild(corpusKv);

    panel.appendChild(el('h2', { text: 'Yardstick' }));
    var yardstick = scores.yardstick || {};
    var ykv = el('dl', { class: 'kv' });
    ['casesMdSha', 'rubricSha', 'briefSha'].forEach(function (k) {
      ykv.appendChild(el('dt', { text: k }));
      ykv.appendChild(el('dd', { text: yardstick[k] }));
    });
    panel.appendChild(ykv);

    if (scores.runs && Object.keys(scores.runs).length) {
      panel.appendChild(el('h2', { text: 'Runs (compare)' }));
      var rkv = el('dl', { class: 'kv' });
      Object.keys(scores.runs).forEach(function (k) {
        rkv.appendChild(el('dt', { text: k }));
        rkv.appendChild(el('dd', { text: scores.runs[k] }));
      });
      panel.appendChild(rkv);
    }

    panel.appendChild(el('h2', { text: 'Selector' }));
    panel.appendChild(el('p', { text: dash(scores.casesSelector) }));

    if (warnings.length) {
      panel.appendChild(el('h2', { text: 'Warnings' }));
      var ul = document.createElement('ul');
      warnings.forEach(function (msg) { ul.appendChild(el('li', { text: msg })); });
      panel.appendChild(ul);
    }

    panel.appendChild(el('h2', { text: 'scores.json' }));
    var details = document.createElement('details');
    details.appendChild(el('summary', { text: 'Show raw scores.json' }));
    details.appendChild(prettyJson(scores));
    panel.appendChild(details);
  })();

})();
</script>
</body>
</html>
