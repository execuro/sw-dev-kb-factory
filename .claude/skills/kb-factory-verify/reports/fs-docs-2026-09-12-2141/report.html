ed, but the specific per-property list for 6.7 is a gap in this source.","citations":["developer/resources/guidelines/code/backward-compatibility.md:376-419","developer/guides/upgrades-migrations/index.md:52-56"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"native.*type|native PHP type|property type|typed propert\" docs/shopware-knowledge-bases/developer --include=*.md -i"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/resources/guidelines/code/backward-compatibility.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"gap-05":{"query":"My plugin decorates `CachedProductRoute` to add cache tags — where did the `Cached*Route` classes go in Shopware 6.7 and how do I cache a Store API route now?","category":"gap","option":"fs-docs","answer":"The corpus does not literally mention a class named `CachedProductRoute` or explain its removal, but two ADRs describe a replacement caching mechanism that supersedes the old decorator-based `Cached*Route` pattern. Store API responses are no longer cached by wrapping/decorating a route with a `Cached*Route` decorator; instead, routes are marked cacheable via the `'_httpCache'` route default attribute, the same mechanism the Storefront already used (developer/resources/references/adr/2025-09-15-store-api-cache-strategy.md:30-32, :65-70). Context differentiation for Store API caching is done via response/request headers rather than cookies: `sw-currency-id` and `sw-language-id` differentiate currency/language, and `sw-context-hash` differentiates other context aspects (logged-in customer, active rules, etc.), with all three included in the `Vary` header (same file, lines 56-64). Invalidation still reuses the existing cache-tags implementation (same file, line 72), and the ADR explicitly states 'Custom Store API endpoints can opt into caching using the same route flags' (same file, line 87) — i.e. a plugin route should set the `_httpCache` route default rather than decorating a `Cached*Route` class. A companion ADR broadens this: the whole HTTP-cache layer is being reworked so the store-api and storefront share the same caching policies and a single `sw-cache-hash` header/cookie replaces the old cookie-based state; store-api routes are adjusted to support `GET` requests to make them cacheable, and this is gated behind a `CACHE_REWORK` feature flag (developer/resources/references/adr/2025-11-03-improved-http-cache-layer.md:38-57, :79-81). No dedicated how-to guide with concrete plugin code for adding cache tags to a Store API route under this new model was found in the corpus, so the precise migration steps for an existing `CachedProductRoute` decorator are a partial gap — the architectural direction is documented, but a step-by-step guide is not.","citations":["developer/resources/references/adr/2025-09-15-store-api-cache-strategy.md:1-119","developer/resources/references/adr/2025-11-03-improved-http-cache-layer.md:1-82"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"CachedProductRoute|Cached.*Route|HttpCache|cache.*store api route\" docs/shopware-knowledge-bases/developer --include=*.md -i"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/resources/references/adr/2025-09-15-store-api-cache-strategy.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/resources/references/adr/2025-11-03-improved-http-cache-layer.md"},{"tool":"Bash","args":"grep -n \"Cached|decorat\" docs/shopware-knowledge-bases/developer/concepts/framework/http_cache.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"gap-06":{"query":"How do I create a shipping method from my plugin's installer or migration, including the `technicalName` that 6.7 requires?","category":"gap","option":"fs-docs","answer":"The corpus does not contain a dedicated 'add shipping method' plugin guide, but it documents the identical pattern for payment methods, which uses the same mechanism and the same `technicalName` requirement (payment_method and shipping_method are treated together in the underlying ADR). In your plugin's base class, override `install(InstallContext $context)` to create the method if it does not already exist, `uninstall()`/`deactivate()` to set it inactive rather than delete it (to avoid breaking existing orders), and `activate()` to reactivate it. Use the DI container to fetch the repository (`payment_method.repository` in the documented example; the equivalent for shipping is `shipping_method.repository`), build a Criteria with `EqualsFilter` to check for an existing record, and call `$repository->create([...], $context)` with the entity data (developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:659-757). As of Shopware 6.7.0.0, the `technicalName` field is mandatory in the database and API for both `payment_method` and `shipping_method` entities (it was optional before). It acts as a unique, stable identifier (an alternative to the DB id) and should use a plugin-specific prefix to avoid collisions, e.g. `'technicalName' => 'swag_example-example_payment'` (developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:723-724, :763-769; developer/resources/references/adr/2023-10-17-add-unique-identifiers-for-checkout-methods.md:19-26, :47-50). Shopware's own default shipping methods were auto-migrated to technical names like `shipping_standard` and `shipping_express`, and app-provided shipping methods get an auto-generated technical name based on the app name and manifest identifier (same ADR, lines 30-45) — but a plugin (as opposed to an app) must supply its own `technicalName` explicitly when creating the entity, following the payment-method pattern above.","citations":["developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:659-769","developer/resources/references/adr/2023-10-17-add-unique-identifiers-for-checkout-methods.md:1-53"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"shipping_method|ShippingMethod|technicalName\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/resources/references/adr/2023-10-17-add-unique-identifiers-for-checkout-methods.md"},{"tool":"Bash","args":"grep -n \"technicalName|upsert|Installer|install(\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md, offset=650, limit=120"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"gap-07":{"query":"How do I create a media entity from a file on disk in PHP from my plugin (e.g. during an import) and generate its thumbnails?","category":"gap","option":"fs-docs","answer":"The developer corpus has no dedicated how-to guide for creating a Shopware media entity from a local file in PHP (e.g. no page documenting `MediaService`, `FileSaver::persistFileToMedia()`, or `createMediaInFolder()`). Grepping developer/** for `MediaService(`, `createMediaInFolder`, and `persistFileToMedia` returned no hits. What the corpus does contain, in the (out-of-scope-for-general-use) Migration Assistant product docs, is a description of a two-phase, migration-tool-specific media import pipeline: during conversion, `MediaFileService::saveMediaFile()` queues a record (`runId`, `entity`, `uri`/local path, `fileName`, `fileSize`, `mediaId`) in `swag_migration_media_file`; a later processing step (`LocalMediaProcessor` for local files, `HttpMediaDownloadService` for remote URLs) actually copies/downloads the file into Shopware's media storage (developer/products/extensions/migration-assistant/concept/media-processing.md:14-59, :156-186). This is internal to that specific extension's architecture, not a general-purpose plugin API guide. Separately, the corpus documents `ThumbnailService` only in the context of the 'remote thumbnail generation' feature, noting its `generate()`, `updateThumbnails()`, and `deleteThumbnails()` methods, and that normal uploads via `FileSaver` dispatch a `GenerateThumbnailsMessage` to trigger thumbnail creation (developer/guides/plugins/plugins/content/media/remote-thumbnail-generation.md:72-76) — but there is no worked example of calling these APIs directly from custom plugin code. Overall this is a gap in the fs-docs source: the pipeline and class names for the built-in migration tool are documented, but a general 'create a MediaEntity from disk in your own plugin and generate its thumbnails' guide was not found.","citations":["developer/products/extensions/migration-assistant/concept/media-processing.md:1-196","developer/guides/plugins/plugins/content/media/remote-thumbnail-generation.md:68-76"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"MediaService|saveMediaFile|generateThumbnails|MediaDefinition\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/extensions/migration-assistant/concept/media-processing.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/content -maxdepth 1; grep -rln \"FileSaver|MediaService\\b\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Bash","args":"grep -n \"saveMediaFile|FileSaver|persistFileToMedia|from disk|generateThumbnails|ThumbnailService\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins/content/media/remote-thumbnail-generation.md docs/shopware-knowledge-bases/developer/guides/plugins/plugins/content/media/add-custom-file-extension.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/content/media/remote-thumbnail-generation.md"},{"tool":"Bash","args":"grep -rln \"createMediaInFolder|persistFileToMedia|MediaService(\" docs/shopware-knowledge-bases/developer --include=*.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"corpus-missing"},"gap-08":{"query":"How do I set up a Nuxt project with Shopware Composable Frontends against my shop's Store API — endpoint, access token, and why do I get HTTP 412?","category":"gap","option":"fs-docs","answer":"The developer corpus contains only PaaS deployment documentation for 'Composable Frontends' (products/paas/shopware/composable-frontends/index.md and products/paas/shopware-paas/composable-frontends/*), covering how to deploy an already-built Node/Nuxt frontend to Shopware PaaS Native: the `application.yaml` `kind: cfe` config, required Node version, the mandatory `/api/healthz` endpoint on port 3000, environment variables and Vault secrets, Fastly/ISR caching headers, and deploy commands via `sw-paas` (developer/products/paas/shopware/composable-frontends/index.md:1-198). It does not cover how to scaffold or configure the actual Nuxt/Composable Frontends SDK project itself against a shop's Store API — there is no documented Store API base-URL/endpoint configuration or access-token/`sw-access-key` setup specific to the Composable Frontends SDK in this corpus. Grepping the whole developer layer for `412` (the HTTP status code in the question) returned zero hits anywhere in the corpus, so no explanation of an HTTP 412 error in this context exists in the fs-docs source. The only related, but generic, Store API access-key material found is in the general APIs quick-start guide, which documents obtaining a sales channel's 'API access key' from Sales Channels → (channel) → API access and sending it as the `sw-access-key` header when calling `/store-api/*` endpoints (developer/guides/development/integrations-api/index.md:132-147) — this is the general Store API auth mechanism, not Composable-Frontends-specific setup, and it does not address the 412 error. This is a gap in the fs-docs source for both the Nuxt/SDK setup steps and the HTTP 412 cause.","citations":["developer/products/paas/shopware/composable-frontends/index.md:1-198","developer/guides     var table = document.createElement('table');
    var thead = document.createElement('thead');
    var trh = document.createElement('tr');
    var sortKey = defaultKey;
    var sortDir = defaultDir || -1;
    columns.forEach(function (c) {
      var cell = th(c.label);
      cell.dataset.key = c.key;
      cell.addEventListener('click', function () {
        if (sortKey === c.key) sortDir *= -1; else { sortKey = c.key; sortDir = -1; }
        draw();
      });
      trh.appendChild(cell);
    });
    thead.appendChild(trh);
    var tbody = document.createElement('tbody');
    table.appendChild(thead);
    table.appendChild(tbody);
    wrap.appendChild(table);
    container.appendChild(wrap);
    function draw() {
      var sorted = rows.slice().sort(function (a, b) {
        var av = a[sortKey], bv = b[sortKey];
        if (av === undefined || av === null) av = '';
        if (bv === undefined || bv === null) bv = '';
        if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sortDir;
        return String(av).localeCompare(String(bv)) * sortDir;
      });
      tbody.innerHTML = '';
      if (sorted.length === 0) {
        var tr = document.createElement('tr');
        var cell = document.createElement('td');
        cell.colSpan = columns.length;
        cell.className = 'empty';
        cell.textContent = 'No data.';
        tr.appendChild(cell);
        tbody.appendChild(tr);
        return;
      }
      sorted.forEach(function (r) {
        var tr = document.createElement('tr');
        columns.forEach(function (c) {
          tr.appendChild(c.render ? c.render(r) : td(r[c.key]));
        });
        tbody.appendChild(tr);
      });
    }
    draw();
    return { redraw: draw };
  }

    ], compareRows, 'overall', -1);

    var deltas = matrix.deltas || {};

  // ================= CASES =================
  (function renderCases() {
    var panel = document.getElementById('tab-cases');

    var allCases = scores.cases || [];
    if (!allCases.length) {
      var seen = {};
      optionKeys.forEach(function (k) {
        ((options[k] && options[k].cases) || []).forEach(function (c) {
          if (c.caseId && !seen[c.caseId]) { seen[c.caseId] = true; allCases.push(c.caseId); }
        });
      });
    }

    // index scorecards by option -> caseId
    var byOptCase = {};
    optionKeys.forEach(function (k) {
      byOptCase[k] = {};
      ((options[k] && options[k].cases) || []).forEach(function (c) { byOptCase[k][c.caseId] = c; });
    });

    var categories = [];
    var verdicts = [];
    allCases.forEach(function (cid) {
      optionKeys.forEach(function (k) {
        var c = byOptCase[k][cid];
        if (c) {
          if (c.category && categories.indexOf(c.category) < 0) categories.push(c.category);
          if (c.verdict && verdicts.indexOf(c.verdict) < 0) verdicts.push(c.verdict);
        }
      });
    });

    var activeCategory = null;
    var activeVerdict = null;

    var chips = el('div', { class: 'chips' });
    var catGroup = el('span', { class: 'chip-group-label', text: 'Category' });
    chips.appendChild(catGroup);
    var catChipEls = [];
    categories.forEach(function (cat) {
      var chip = el('button', { class: 'chip', type: 'button', text: cat });
      chip.setAttribute('aria-pressed', 'false');
      chip.addEventListener('click', function () {
        activeCategory = (activeCategory === cat) ? null : cat;
        catChipEls.forEach(function (c) { c.setAttribute('aria-pressed', String(c.textContent === activeCategory)); });
        drawGrid();
      });
      catChipEls.push(chip);
      chips.appendChild(chip);
    });
    var verdictGroup = el('span', { class: 'chip-group-label', text: 'Verdict' });
    chips.appendChild(verdictGroup);
    var verdictChipEls = [];
    verdicts.forEach(function (v) {
      var chip = el('button', { class: 'chip', type: 'button', text: v });
      chip.setAttribute('aria-pressed', 'false');
      chip.addEventListener('click', function () {
        activeVerdict = (activeVerdict === v) ? null : v;
        verdictChipEls.forEach(function (c) { c.setAttribute('aria-pressed', String(c.textContent === activeVerdict)); });
        drawGrid();
      });
      verdictChipEls.push(chip);
      chips.appendChild(chip);
    });
    panel.appendChild(chips);

    var gridWrap = el('div', { class: 'table-wrap' });
    panel.appendChild(gridWrap);
    var drilldown = el('div', { class: 'drilldown', id: 'case-drilldown' });
    drilldown.appendChild(el('p', { class: 'empty', text: 'Click a cell to see the case detail.' }));
    panel.appendChild(drilldown);

    function drawGrid() {
      gridWrap.innerHTML = '';
      var visibleCases = allCases.filter(function (cid) {
        if (!activeCategory && !activeVerdict) return true;
        return optionKeys.some(function (k) {
          var c = byOptCase[k][cid];
          if (!c) return false;
          if (activeCategory && c.category !== activeCategory) return false;
          if (activeVerdict && c.verdict !== activeVerdict) return false;
          return true;
        });
      });
      if (!visibleCases.length || !optionKeys.length) {
        gridWrap.appendChild(el('p', { class: 'empty', text: 'No cases match the filters.' }));
        return;
      }
      var table = document.createElement('table');
      var thead = document.createElement('thead');
      var trh = document.createElement('tr');
      trh.appendChild(th('Case'));
      optionKeys.forEach(function (k) { trh.appendChild(th(k)); });
      thead.appendChild(trh);
      table.appendChild(thead);
      var tbody = document.createElement('tbody');
      visibleCases.forEach(function (cid) {
        var tr = document.createElement('tr');
        tr.appendChild(td(cid));
        optionKeys.forEach(function (k) {
          var c = byOptCase[k][cid];
          var cell = document.createElement('td');
          if (!c) { cell.textContent = '—'; tr.appendChild(cell); return; }
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cell-btn ' + verdictClass(c.verdict);
          btn.textContent = pct(c.total) + (c.findability ? (c.findability === 'pass' ? ' ✓' : c.findability === 'fail' ? ' ✗' : '') : '');
          btn.addEventListener('click', function () { renderDrilldown(k, cid, c); });
          cell.appendChild(btn);
          tr.appendChild(cell);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      gridWrap.appendChild(table);
    }

    function highlightMemory(text) {
      var frag = document.createDocumentFragment();
      if (!text) { frag.appendChild(document.createTextNode('—')); return frag; }
      var sentences = String(text).split(/(?<=[.!?])\s+/);
      sentences.forEach(function (s, i) {
        var span = document.createElement('span');
        span.textContent = s + (i < sentences.length - 1 ? ' ' : '');
        if (/\[from memory\]/i.test(s)) span.className = 'mem-highlight';
        frag.appendChild(span);
      });
      return frag;
    }

    function renderDrilldown(optKey, caseId, scoreCard) {
      drilldown.innerHTML = '';
      drilldown.appendChild(el('h3', { text: optKey + ' — ' + caseId }));

      var rawCase = (raw[optKey] && raw[optKey][caseId]) || {};

      var kv = el('dl', { class: 'kv' });

      kvRow('Query', rawCase.query);
      kvRow('Category', scoreCard.category);
      kvRow('Target', scoreCard.target);
      kvRow('Page reached', scoreCard.pageReached);
      kvRow('Verdict', scoreCard.verdict);
      kvRow('Total', pct(scoreCard.total));
      kvRow('Findability', scoreCard.findability);
      kvRow('Not-found claim', rawCase.notFoundClaim);
      drilldown.appendChild(kv);

      if (scoreCard.discrepancy) {
        var disc = el('p', { class: 'warnings' });
        disc.textContent = 'Discrepancy: recomputed total ' + pct(scoreCard.total) + ' vs scorer total ' + pct(scoreCard.scorerTotal) + ' (' + dash(scoreCard.scorerVerdict) + ')';
        drilldown.appendChild(disc);
      }

      drilldown.appendChild(el('h3', { text: 'Answer' }));
      var answerP = document.createElement('p');
      answerP.appendChild(highlightMemory(rawCase.answer));
      drilldown.appendChild(answerP);

      drilldown.appendChild(el('h3', { text: 'Citations' }));
      var citationsList = document.createElement('ul');
      var citations = rawCase.citations || [];
      if (!citations.length) citationsList.appendChild(el('li', { text: '—' }));
      citations.forEach(function (c) {
        citationsList.appendChild(el('li', { text: (typeof c === 'string') ? c : JSON.stringify(c) }));
      });
      drilldown.appendChild(citationsList);
      var verified = document.createElement('p');
      verified.textContent = 'Verified: ' + dash(scoreCard.citationsVerified);
      drilldown.appendChild(verified);

      drilldown.appendChild(el('h3', { text: 'Tool call log' }));
      var toolCalls = rawCase.toolCallLog || [];
      // Ground-truth calls (from the transcript extract) when present, keyed by case id.
      var gtCalls = ((payload.calls || {})[optKey] || {})[caseId] || [];
      if (!toolCalls.length) {
        drilldown.appendChild(el('p', { class: 'empty', text: 'No tool calls recorded.' }));
      } else {
        var tcWrap = el('div', { class: 'table-wrap' });
        var tcTable = document.createElement('table');
        var tcHead = document.createElement('tr');
        tcHead.appendChild(th('Tool'));
        tcHead.appendChild(th('Args'));
        tcHead.appendChild(th('Round trip'));
        tcHead.appendChild(th('Returned'));
        var tcTheadWrap = document.createElement('thead');

        tcTable.appendChild(tcTheadWrap);
        var tcBody = document.createElement('tbody');
        toolCalls.forEach(function (call, i) {
          var argsStr = JSON.stringify(call.args || {});
          var gt = gtCalls[i] || null;
          var tr = document.createElement('tr');
          tr.appendChild(td(call.tool));
          tr.appendChild(td(argsStr));
          tr.appendChild(td(gt && gt.latencyMs != null ? gt.latencyMs + ' ms' : '—'));
          tr.appendChild(td(gt && gt.resultBytes != null
            ? gt.resultBytes.toLocaleString() + ' B / ' + (gt.resultLines || 0) + ' ln' + (gt.empty ? ' (no hits)' : '')
            : '—'));
          tcBody.appendChild(tr);
        });
        tcTable.appendChild(tcBody);
        tcWrap.appendChild(tcTable);
        drilldown.appendChild(tcWrap);
      }

      drilldown.appendChild(el('h3', { text: 'Findings' }));
      var findingsList = document.createElement('ul');
      var findings = scoreCard.findings || [];
      if (!findings.length) findingsList.appendChild(el('li', { text: '—' }));
      findings.forEach(function (f) { findingsList.appendChild(el('li', { text: typeof f === 'string' ? f : JSON.stringify(f) })); });
      drilldown.appendChild(findingsList);

      drilldown.appendChild(el('h3', { text: 'Official references' }));

      drilldown.appendChild(el('p', { text: scoreCard.notes }));

    var yardstick = scores.yardstick || {};
    var ykv = el('dl', { class: 'kv' });
    ['casesMdSha', 'rubricSha', 'briefSha'].forEach(function (k) {
      ykv.appendChild(el('dt', { text: k }));
      ykv.appendChild(el('dd', { text: yardstick[k] }));
    });
    panel.appendChild(ykv);

    if (scores.runs && Object.keys(scores.runs).length) {
      panel.appendChild(el('h2', { text: 'Runs (compare)' }));
      var rkv = el('dl', { class: 'kv' });
      Object.keys(scores.runs).forEach(function (k) {
        rkv.appendChild(el('dt', { text: k }));
        rkv.appendChild(el('dd', { text: scores.runs[k] }));
      });
      panel.appendChild(rkv);
    }

    panel.appendChild(el('h2', { text: 'Selector' }));
    panel.appendChild(el('p', { text: dash(scores.casesSelector) }));

    if (warnings.length) {
      panel.appendChild(el('h2', { text: 'Warnings' }));
      var ul = document.createElement('ul');
      warnings.forEach(function (msg) { ul.appendChild(el('li', { text: msg })); });
      panel.appendChild(ul);
    }

    panel.appendChild(el('h2', { text: 'scores.json' }));
    var details = document.createElement('details');
    details.appendChild(el('summary', { text: 'Show raw scores.json' }));
    details.appendChild(prettyJson(scores));
    panel.appendChild(details);
  })();

})();
</script>
</body>
</html>
