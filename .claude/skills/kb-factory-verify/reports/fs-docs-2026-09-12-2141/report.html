es\") — fixed mechanically by the orchestrating skill before aggregation; no score content was altered.","gap-03: raw discover report failed JSON.parse (unescaped control character in query string) — case is unscored, not scored as fail.","Ground-truth call-log extractor exhibits a systematic caseId-attribution artifact: when a discover agent writes several case reports back-to-back, intervening research calls sometimes get stamped onto whichever case's report is written first. Auditor flagged and annotated affected cases (dev-01 (recipient), dev-02..dev-10, dev-12, dev-16, dev-21, dev-24, dev-25, dev-26, dev-45, dev-54, edge-05, gap-02); scorers were instructed not to penalize Honesty for the resulting selfReportDelta on flagged cases.","rescore dev-12: groundingRelevance 100 -> 40","rescore dev-12: citation 100 -> 0","rescore dev-12: honesty 100 -> 0","rescore dev-45: citation 100 -> 70","rescore dev-55: groundingRelevance 100 -> 70","rescore dev-55: actionability 100 -> 40"]},"raw":{"fs-docs":{"dev-01":{"query":"How do I extend the product entity with a new association in Shopware's Data Abstraction Layer?","category":"dev","option":"fs-docs","answer":"Create an entity extension class in `<plugin root>/src/Extension/Content/Product/` extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityExtension`, implementing `getDefinitionClass()` to return `ProductDefinition::class` and overriding `extendFields(FieldCollection $collection)` to add the new field(s). To add a new association backed by its own database table, add e.g. a `OneToOneAssociationField('exampleExtension', 'id', 'product_id', ExampleExtensionDefinition::class, true)` (optionally with the `CascadeDelete` flag) inside `extendFields`. Then create the referenced entity definition (e.g. `ExampleExtensionDefinition`) with an `IdField`, an `FkField('product_id', 'productId', ProductDefinition::class)`, a `ReferenceVersionField` if the parent is versioned, the new field(s), and the inverse `OneToOneAssociationField('product', 'product_id', 'id', ProductDefinition::class, false)`. Register both the extension and the new definition in `services.php`, tagging the extension with `shopware.entity.extension` and the definition with `shopware.entity.definition`. Add a database migration creating the new table with a foreign key to `product` (including `product_version_id` if versioned). Setting `autoload` to `true` on the `EntityExtension` side (but `false` on the plain `EntityDefinition` side) makes the association load automatically whenever a product is loaded; setting autoload true on both sides can cause recursion/out-of-memory errors. Once set up, write the associated data through the product repository, e.g. `$this->productRepository->upsert([['id' => ..., 'exampleExtension' => ['customString' => 'foo bar']]], $context)`. For associations that don't need their own DB table, use a `ProductEvents::PRODUCT_LOADED_EVENT` subscriber and `$productEntity->addExtension(...)` instead. Since Shopware 6.6.10.0, a `BulkEntityExtension` can extend multiple entities (including product) at once via a `collect()` generator, tagged `shopware.bulk.entity.extension`.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md:20-202","developer/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md:204-263","developer/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md:327-366"],"toolCallLog":[{"tool":"Bash","args":"mkdir -p <output dir> && ls docs/shopware-knowledge-bases/ (failed, relative path wrong)"},{"tool":"Bash","args":"find / -maxdepth 6 -iname 'shopware-knowledge-bases' -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=<home>/projects/host-project/docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"find .../developer/guides -maxdepth 3 -type d -not -path '*/.git/*' | sort"},{"tool":"Bash","args":"find .../developer/guides/plugins/plugins/framework -type f | sort"},{"tool":"Read","args":"file_path=.../developer/guides/plugins/plugins/framework/data-handling/add-data-associations.md"},{"tool":"Read","args":"file_path=.../developer/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-02":{"query":"What's the plugin lifecycle in Shopware — install, activate, uninstall — and how does `keepUserData` work?","category":"dev","option":"fs-docs","answer":"A Shopware plugin extends `Shopware\\Core\\Framework\\Plugin` (which extends `Shopware\\Core\\Framework\\Bundle`, which extends the Symfony `Bundle`) and goes through lifecycle stages: Install, Activate, Deactivate, Update, Uninstall, plus PostInstall/PostUpdate. `install()` runs on plugin install and is used to register entities (e.g. payment methods), create initial data, or prepare system requirements — but new business/fully-active data should not be created here since the plugin isn't active yet; create the entity but keep it inactive until `activate()`. `activate()` runs once the plugin is activated and is used to activate entities created in `install()` or create data that couldn't be created earlier. `deactivate()` is the opposite — deactivate or remove entities that would interfere with the system while the plugin is inactive. `update()` runs on plugin update for non-database adjustments (database changes should go through plugin migrations instead). `postInstall()`/`postUpdate()` run after a successful install/update, for actions that should only run once installation/update has fully completed. `uninstall()` runs when the plugin is uninstalled and receives an `UninstallContext`, which extends `InstallContext`'s info with a `keepUserData()` flag: if `$uninstallContext->keepUserData()` returns `true`, the plugin must NOT delete persistent data it created, to respect the shop owner's choice and avoid unintended data loss; typical code checks this flag and returns early instead of deleting. It's also warned not to blindly delete entities that may already be referenced by real business data (e.g. a payment method used in past orders) — deactivating rather than deleting is preferred in that case.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md:8-189"],"toolCallLog":[{"tool":"Bash","args":"find .../developer/guides/plugins/plugins/plugin-fundamentals -type f | sort"},{"tool":"Read","args":"file_path=.../developer/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-03":{"query":"How do I add a custom Store API route for a headless storefront?","category":"dev","option":"fs-docs","answer":"Build the route on top of a plugin (Plugin Base Guide). Note: every field that should be available via the API needs the `ApiAware` flag on its entity definition. Steps: (1) Create an abstract class, e.g. `AbstractExampleRoute`, with an abstract `getDecorated(): AbstractExampleRoute` and an abstract `load(Criteria $criteria, SalesChannelContext $context): ExampleRouteResponse` — this makes the route decoratable. (2) Create the concrete `ExampleRoute` class extending the abstract class, annotated with `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]])]`. Inject the relevant `EntityRepository` (e.g. `swag_example.repository`) via the constructor. `getDecorated()` must throw `DecorationPatternException` since it has no decoration yet. The `load` method carries its own `#[Route(path: '/store-api/example', name: 'store-api.example.search', methods: ['GET','POST'], defaults: ['_entity' => 'swag_example'])]` attribute and returns `new ExampleRouteResponse($this->exampleRepository->search($criteria, $context->getContext()))`. (3) Register the route class as a service in `services.php`, passing the repository via `service('swag_example.repository')`. (4) Create `ExampleRouteResponse extends Shopware\\Core\\System\\SalesChannel\\StoreApiResponse`, exposing a typed getter (e.g. `getExamples()`) that returns `$this->object->getEntities()`. (5) Register a `routes.php` at `<plugin root>/src/Resources/config/` that imports `'../../Core/**/*Route.php'` with the `attribute` loader — routing discovery only happens once a route file is imported here, even if the service is already correctly registered. (6) Verify with `./bin/console debug:router store-api.example.search` (this only proves route discovery, not that the service constructs correctly or a request will succeed). Optionally, add an OpenAPI JSON schema file under `<plugin root>/src/Resources/Schema/StoreApi/` so the route shows up in the Stoplight docs (`/store-api/_info/stoplightio.html`). To also expose the same functionality to the (non-headless) Storefront, wrap the route in a Storefront controller with the `StorefrontRouteScope` and import `'../../Storefront/**/*Controller.php'` in `routes.php` too — this is optional and not required for a purely headless Store API consumer.","citations":["developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md:8-421"],"toolCallLog":[{"tool":"Read","args":"file_path=.../developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-04":{"query":"How do I create a custom CMS element for Shopping Experiences?","category":"dev","option":"fs-docs","answer":"A CMS element is the smallest content primitive in the Shopping Experience (CMS) hierarchy: Page > Section > Block > Slots > Elements. Elements are rendered inside slots of blocks. Recommended plugin structure: `<plugin root>/src/Resources/app/administration/src/module/sw-cms/elements/<element-name>/` with `index.js`, and `component/`, `config/`, `preview/` subfolders each containing their own `index.js` and Twig/SCSS. Steps: (1) Import the element folder in `main.js`. (2) In the element's `index.js`, import `./component`, `./config`, `./preview` and call `Shopware.Service('cmsService').registerCmsElement({ name, label, component, configComponent, previewComponent, defaultConfig, hidden?, removable? })` — `name` is the technical name, `component` renders the element in the editor, `configComponent` is the settings panel, `previewComponent` is the thumbnail shown when picking an element, and `defaultConfig` defines the default config values (each with `source`/`value`). (3) Create the preview component via `Shopware.Component.register('cms-el-preview-<name>', {...})`, shown as a thumbnail in the element picker. (4) Create the main component via `Shopware.Component.register('cms-el-<name>', {...})`, using the `cms-element` mixin (which provides common props/data-mapping for config) and calling `this.initElementConfig('<name>')` in `created()`. (5) Create the config component similarly, using `mt-*` Meteor components for the settings form fields, again with the `cms-element` mixin and `initElementConfig`. (6) Optionally add inheritance support using the `sw-cms-inherit-wrapper` component around individual config fields so content managers can inherit/override values between base layout and content pages. (7) For the Storefront rendering, create a Twig template at `src/Resources/views/storefront/element/cms-element-<name>.html.twig` (the `cms-element-` prefix plus the technical `name` is a required naming convention) — the `element` variable with its config is passed in automatically, and you must clear the Storefront cache after adding new templates. Related standard element code lives in Administration under `src/Administration/Resources/app/administration/src/module/sw-cms/elements/`, Storefront templates under `src/Storefront/Resources/views/storefront/element/`, and page loading logic in `Shopware\\Core\\Content\\Cms\\SalesChannel\\SalesChannelCmsPageLoader::load`.","citations":["developer/guides/plugins/plugins/content/cms/add-cms-element.md:7-254"],"toolCallLog":[{"tool":"Bash","args":"find .../developer/guides/plugins/plugins/content -type f | sort"},{"tool":"Read","args":"file_path=.../developer/guides/plugins/plugins/content/cms/add-cms-element.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-05":{"query":"How does theme inheritance work in Shopware — theme.json and SCSS overrides?","category":"dev","option":"fs-docs","answer":"Theme inheritance is configured via `theme.json`, located in `<plugin root>/src/Resources`. Every theme already inherits Shopware's default theme via the `@Storefront` placeholder present in each of the `views`, `style`, `script` and `asset` arrays. To make one custom theme (e.g. `SwagBasicExampleThemeExtend`) inherit from another custom theme (e.g. `SwagBasicExampleTheme`), add the `@SwagBasicExampleTheme` placeholder into the inheritance chain of each relevant section. For `views`: order matters — the Storefront template is rendered first as the base, then plugin extensions are applied, then the parent theme's (`@SwagBasicExampleTheme`) view changes, and finally the current theme's own view changes are applied last. `script` behaves the same way: Storefront JS is the base, then the parent theme's JS, then the current theme's own JS. `style` (SCSS) behaves similarly, except the current theme's `overrides.scss` is placed FIRST in the list (before `@SwagBasicExampleTheme` and the base `base.scss`), because overrides can affect SCSS variables (e.g. `$border-radius`) that must be defined before other SCSS uses them. The `asset` section requires you to explicitly add `@SwagBasicExampleTheme` if you want to use its assets. A separate `configInheritance` array defines which themes' field/config values (visible in the theme configuration UI) are inherited; it uses the *last* theme in the list that differs from the current one as the parent theme for configuration purposes, and the base `@Storefront` theme configuration is always inherited even without an explicit `configInheritance` entry.","citations":["developer/guides/plugins/themes/inheritance/add-theme-inheritance.md:8-123"],"toolCallLog":[{"tool":"Bash","args":"find .../developer/guides/plugins/themes -type f | sort"},{"tool":"Read","args":"file_path=.../developer/guides/plugins/themes/inheritance/add-theme-inheritance.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-06":{"query":"How do I add a custom Flow Builder action?","category":"dev","option":"fs-docs","answer":"Building a custom flow action needs both backend (PHP) logic and an Administration UI. PHP side: (1) Define an 'aware' interface for your action's data, e.g. `TagAware extends Shopware\\Core\\Framework\\Event\\FlowEventAware`, annotated with `#[IsFlowEventAware]`, declaring constants like `TAG`/`TAG_ID` and a getter. (2) Create the action class, e.g. `CreateTagAction extends Shopware\\Core\\Content\\Flow\\Dispatching\\Action\\FlowAction`, implementing: `getName(): string` returning a unique technical action name (e.g. `action.create.tag`); `requirements(): array` returning the aware interfaces the action is compatible with — an empty array makes it available for all triggers, a list of interfaces (e.g. `[OrderAware::class, CustomerAware::class]`) restricts it to matching triggers, or your own new aware interface (e.g. `TagAware::class`) restricts it to a new custom event; and `handleFlow(StorableFlow $flow): void` which reads `$flow->getConfig()` for the action's configured data, `$flow->getStore($key)` for aware-interface data (e.g. `TagAware::TAG_ID`), and `$flow->getData($key)` for original event/additional data, then performs the actual business logic (e.g. writing tags via a repository). (3) Register the action in `services.php`, tagged `flow.action` with a `priority` (e.g. 600) — this tag makes it appear in the `/api/_info/flow-actions.json` API, and priority controls its ordering. If you want the action tied to a brand-new event, that event class must implement your aware interface and be registered via a `BusinessEventCollectorSubscriber` listening to `BusinessEventCollectorEvent::NAME`, so it appears in the Flow Builder trigger list; also add a snippet entry for its label. Administration side: (1) Define a JS constant for the action's technical name and a snippet file with labels/placeholders/descriptions (also translate to `de-DE.json`). (2) Override the `sw-flow-sequence-action` component (`Component.override`) to (a) push a group name into `groups()` (existing groups include `general`, `tag`, `customer`, `order` — unlisted actions default to `general`), (b) return your custom modal name (e.g. `sw-flow-create-tag-modal`) from `modalName()` when your action is selected, and (c) supply `getActionDescriptions`/`getActionTitle` overrides for display text/icon; import this extension in `main.js`. (3) Create the configuration modal component (JS + Twig) registered as `sw-flow-create-tag-modal`, which emits `process-finish` with a `config` object when the user saves — the modal's `.js` uses `repositoryFactory` to search/select entities (e.g. tags) as needed. Alternatively, for actions that don't need a modal, override `openDynamicModal` in `sw-flow-sequence-action` to detect the action name and call `this.onSaveActionSuccess({ config })` directly with a hard-coded or API-derived config.","citations":["developer/guides/plugins/plugins/framework/flow/add-flow-builder-action.md:8-735"],"toolCallLog":[{"tool":"Read","args":"file_path=.../developer/guides/plugins/plugins/framework/flow/add-flow-builder-action.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-07":{"query":"My plugin needs to store its own data in a new table — how do I define a custom DAL entity with its definition, entity and collection class so I get a repository for it?","category":"dev","option":"fs-docs","answer":"First create the database table via a plugin migration (e.g. `<plugin root>/src/Migration/Migration...Example.php`, extending `MigrationStep`, implementing `getCreationTimestamp()` and `update(Connection $connection)` with a `CREATE TABLE IF NOT EXISTS` statement) — prefix the table name (e.g. `swag_example`); `created_at`/`updated_at` columns are expected but don't need to be declared in the entity definition since they're included by default. Then create three classes in `<plugin root>/src/Core/Content/Example/`: (1) `ExampleDefinition extends Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityDefinition`, implementing `getEntityName()` returning the table name constant `ENTITY_NAME` (also used as the DI repository service name `<entity>.repository`), and `defineFields(): FieldCollection` returning the field objects (e.g. `IdField` flagged `Required`+`PrimaryKey`, `StringField`s, `BoolField`) — storage names are snake_case, property names are lowerCamelCase. (2) `ExampleEntity extends Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity`, using the `EntityIdTrait` and declaring `protected` (never `readonly`) properties with getters/setters matching the definition's fields (excluding id). (3) `ExampleCollection extends Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityCollection`, overriding `getExpectedClass()` to return the `ExampleEntity::class`. Wire the custom Entity/Collection classes into the definition by overriding `getEntityClass()` (returns `ExampleEntity::class`) and `getCollectionClass()` (returns `ExampleCollection::class`) on `ExampleDefinition` — otherwise generic `ArrayEntity`/`EntityCollection` instances are used instead. Finally register the definition in `services.php`, tagged `shopware.entity.definition` with `['entity' => 'swag_example']`; Shopware auto-generates a repository service `swag_example.repository` from this, which is then injectable and usable for CRUD (read/write) via the DAL like any core entity's repository.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md:8-316"],"toolCallLog":[{"tool":"Read","args":"file_path=.../developer/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-08":{"query":"In a plugin service, what is the Shopware 6 equivalent of Doctrine's `findBy()` — how do I read products with filters, associations and sorting?","category":"dev","option":"fs-docs","answer":"Shopware 6 has no ORM; instead it uses the Data Abstraction Layer (DAL) with generated repositories. Inject the repository for the entity you want (service id `entity_name.repository`, e.g. `product.repository`) into your service's constructor as `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository`, registered via `services.php` using `service('product.repository')` as a constructor arg. To read data, build a `Shopware\\Core\\Framework\\DataAbstractionLayer\\Search\\Criteria` object and call `$this->productRepository->search($criteria, $context)`, which returns an `EntitySearchResult` (an `EntityCollection`). To search by IDs: `new Criteria([$myId])` then `->first()`. To filter by any field: `$criteria->addFilter(new EqualsFilter('name', 'Example name'))` (equivalent of `WHERE field = value`; many other filter types like `RangeFilter` exist and are listed in the DAL filters reference). Combine filters with `OrFilter`/`AndFilter`/`NandFilter`, e.g. `new OrFilter([new EqualsFilter(...), new EqualsFilter(...)])`. Use `addPostFilter` instead of `addFilter` when you want a filter applied to the result set but not to aggregations. Load associations with `$criteria->addAssociation('productReviews')` (dot-chainable, e.g. `'productReviews.customer'`), and filter an association specifically via `$criteria->getAssociation('productReviews')->addFilter(new RangeFilter('points', [RangeFilter::GTE => 4]))` (this returns the base entity regardless, only filtering nested rows) versus `addFilter(new RangeFilter('productReviews.points', ...))` on the main criteria (this filters which base entities are returned at all). ManyToMany mapping entities (e.g. `ProductCategoryDefinition`) cannot be read with `search()`; use `searchIds()` instead. Aggregate with `$criteria->addAggregation(new AvgAggregation('avg-rating', 'productReviews.points'))` and read via `$products->getAggregations()->get('avg-rating')` (drop `first()` here since you need the full result). For paging/limiting/sorting: `$criteria->setLimit(1)`, `$criteria->setOffset(1)`, and `$criteria->addSorting(new FieldSorting('createdAt', FieldSorting::ASCENDING))` (`Shopware\\Core\\Framework\\DataAbstractionLayer\\Search\\Sorting\\FieldSorting`). For large datasets, use `Shopware\\Core\\Framework\\DataAbstractionLayer\\Dbal\\Common\\RepositoryIterator`, which fetches configurable-size batches (`$iterator->fetch()` in a loop) to avoid memory exhaustion — ensure the criteria's sorting is deterministic (e.g. include a unique field like `id`) so no entities are skipped or duplicated across batches.","citations":["developer/guides/plugins/plugins/framework/data-handling/reading-data.md:8-391"],"toolCallLog":[{"tool":"Read","args":"file_path=.../developer/guides/plugins/plugins/framework/data-handling/reading-data.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-09":{"query":"How do I make a field on my plugin's own entity translatable per language?","category":"dev","option":"fs-docs","answer":"Prefer `entity.translated.field` when reading translated data in storefront/sales-channel contexts, and the plain `entity.field` in Admin/CRUD flows where you need the value stored for the current language. To implement translations for a custom entity (e.g. `swag_example`): (1) Create a migration for a `<entity>_translation` table (e.g. `swag_example_translation`) with columns `<entity>_id` (FK to the main entity), `language_id` (FK to `language`), the translated column(s) (e.g. `name`), `created_at`, `updated_at`, and a composite primary key on `(<entity>_id, language_id)`. (2) Create a translation definition, e.g. `ExampleTranslationDefinition extends Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityTranslationDefinition`, placed under `<plugin root>/src/Core/Content/Example/Aggregate/ExampleTranslation/`, implementing `getEntityName()` and overriding `getParentDefinitionClass()` to return the entity being translated (`ExampleDefinition::class`); `defineFields()` only needs to declare the actual translated fields (e.g. a `StringField('name','name')` flagged `Required`) since `language_id` and other base fields are added automatically by `EntityTranslationDefinition`. (3) Register both `ExampleDefinition` and `ExampleTranslationDefinition` in `services.php` with the `shopware.entity.definition` tag — register the translation definition after the main entity's definition. (4) Create `ExampleTranslationEntity extends Shopware\\Core\\Framework\\DataAbstractionLayer\\TranslationEntity` with properties/getters/setters for the foreign key (e.g. `exampleId`), the translated field(s) (e.g. `name`), and an association property to the parent entity (e.g. `example`); wire it via `getEntityClass()` on the translation definition. (5) Create an `ExampleTranslationCollection extends EntityCollection` overriding `getExpectedClass()` to return `ExampleTranslationEntity::class`. (6) On the main entity's definition (`ExampleDefinition`), define the field as a `TranslatedField('name')` (instead of a plain `StringField`) plus a `TranslationsAssociationField(ExampleTranslationDefinition::class, '<entity>_id')`, both typically flagged `ApiAware`/`Required` as needed — this connects the main entity to its translation table so per-language values are automatically resolved.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-data-translations.md:8-298"],"toolCallLog":[{"tool":"Read","args":"file_path=.../developer/guides/plugins/plugins/framework/data-handling/add-data-translations.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-10":{"query":"How do I write an indexer that precomputes derived data for my custom entity on write, and how do I trigger a full reindex?","category":"dev","option":"fs-docs","answer":"Data indexers precompute complex derived data (e.g. the `cheapest_price` column) so it doesn't need to be recalculated on every read; they can also offload work asynchronously to the Message Queue. To add your own indexer: create a class extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Indexing\\EntityIndexer` (e.g. `<plugin root>/src/Core/Framework/DataAbstractionLayer/Indexing/ExampleIndexer.php`), implementing: `getName(): string` — a unique indexer name used by the `EntityIndexerRegistry` to route messages; `iterate($offset): ?EntityIndexingMessage` — called for a full index rebuild (triggered by `bin/console dal:refresh:index` or an Administration 'update indexes' request); use `Shopware\\Core\\Framework\\DataAbstractionLayer\\Dbal\\Common\\IteratorFactory::createIterator($definition, $offset)` to fetch batches of IDs and return an `EntityIndexingMessage` (or `null` when exhausted); `update(EntityWrittenContainerEvent $event): ?EntityIndexingMessage` — called whenever entities are written via the DAL; extract changed primary keys via `$event->getPrimaryKeys(SomeDefinition::ENTITY_NAME)` and return an `EntityIndexingMessage` (you can inspect the event to filter by which columns changed, to save performance); `handle(EntityIndexingMessage $message): void` — invoked by the message queue workers (or synchronously) with the messages from `iterate`/`update`, and does the actual precomputation/write — it's recommended to use the injected `Connection` directly here rather than the DAL, to avoid triggering the indexer again in an infinite loop (writes via the DAL fire `EntityWrittenContainerEvent`, which would re-trigger `update()`). Register the indexer service tagged `shopware.entity_indexer` in `services.php`. By default messages from `update()` are handled synchronously (handle() runs right after update()); pass `true` as the fourth constructor parameter (`$forceQueue`) of `EntityIndexingMessage` to process them asynchronously via the message queue instead. If you must use the DAL inside the indexer for writes, you can disable re-indexing by adding `EntityIndexerRegistry::DISABLE_INDEXING` to the context's state via `$context->addState(...)`. As an alternative to writing a full custom indexer for existing core entities, you can subscribe to events already dispatched by core indexers in their `handle()` methods (e.g. `CustomerIndexerEvent` from `CustomerIndexer`, plus `CategoryIndexer`, `LandingPageIndexer`, `ProductIndexer`, `ProductStreamIndexer`, `PromotionIndexer`, `RuleIndexer`, `MediaIndexer`, `MediaFolderIndexer`, `MediaFolderConfigurationIndexer`, `SalesChannelIndexer`, `BreadcrumpIndexer`) via a normal event subscriber tagged `kernel.event_subscriber`, again preferring the raw `Connection` over the DAL for the same infinite-loop/performance reasons. A full reindex (covering `iterate()` for all registered indexers) is triggered with the console command `bin/console dal:refresh:index`, or via the equivalent action in the Administration settings.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-data-indexer.md:8-289"],"toolCallLog":[{"tool":"Read","args":"file_path=.../developer/guides/plugins/plugins/framework/data-handling/add-data-indexer.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-11":{"query":"On Shopware 6.7, which file do I declare my plugin's services in, and how do I get a core service passed into my service's constructor?","category":"dev","option":"fs-docs","answer":"In Shopware 6.7 you declare your plugin's services in a PHP file at `PLUGIN_ROOT/src/Resources/config/services.php`, which returns a closure receiving a Symfony `ContainerConfigurator`. You can either set `autowire()`/`autoconfigure()` as defaults and `load()` your plugin namespace so classes are auto-registered (then a core service like `SystemConfigService` is simply added as a typed constructor parameter and Symfony injects it automatically), or declare the service explicitly with `$services->set(ExampleService::class)->args([service(SystemConfigService::class)])` to pass the core service into the constructor. XML service configuration (`services.xml`) is deprecated starting 6.7 and removed in 6.8, so `services.php` is the current file for 6.7.","citations":["developer/guides/plugins/plugins/services/add-custom-service.md:16-124","developer/guides/plugins/plugins/services/dependency-injection.md:20-79","developer/resources/references/adr/2026-07-30-migrate-container-configuration-from-xml-to-php.md:16-37"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"grep -rl \"services.xml\" docs/shopware-knowledge-bases/developer/guides/plugins --include=*.md | head -20"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname \"*dependency*\" / *services.md* / plugin-fundamentals paths, not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/services/dependency-injection.md"},{"tool":"Bash","args":"find .../services -maxdepth 1 -name '*.md'; grep -rn services.xml .../services/*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/services/add-custom-service.md"},{"tool":"Bash","args":"grep -rln \"services.xml\" docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/resources/references/adr/2026-07-30-migrate-container-configuration-from-xml-to-php.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-12":{"query":"I am on Shopware 6.6 — which file do I declare my plugin's service dependencies in, and how do I pass another service into the constructor?","category":"dev","option":"fs-docs","answer":"On Shopware 6.6, plugins declared their services in `PLUGIN_ROOT/src/Resources/config/services.xml` by convention — the ADR on migrating container configuration confirms plugins ship `Resources/config/services.xml` by convention, and that this XML format was still fully supported at that time (deprecation only started in 6.7, removal in 6.8). The current docs corpus only documents the newer `services.php` format (introduced as the replacement) in detail: there you register a service with `$services->set(ExampleService::class)` and inject another service into its constructor either automatically (autowire/autoconfigure) or explicitly via `->args([service(SystemConfigService::class)])` [from memory: the 6.6-era XML equivalent used a `<service>` tag with a nested `<argument type=\"service\" id=\"...\"/>` element inside `services.xml`, e.g. `<argument type=\"service\" id=\"Shopware\\Core\\System\\SystemConfig\\SystemConfigService\"/>`]. This exact XML syntax is not present verbatim in the fs-docs corpus, which now documents only the PHP-based configuration.","citations":["developer/resources/references/adr/2026-07-30-migrate-container-configuration-from-xml-to-php.md:16-37","developer/guides/plugins/plugins/services/add-custom-service.md:16-124","developer/guides/plugins/plugins/services/dependency-injection.md:20-79"],"toolCallLog":[{"tool":"Bash","args":"grep -n \"services.xml\" -A5 -B5 docs/shopware-knowledge-bases/developer/guides/installation/legacy-setups/migrate-zip-to-composer-project.md"}],"notFoundClaim":false,"memoryClaims":["The 6.6-era XML equivalent used a <service> tag with a nested <argument type=\"service\" id=\"...\"/> element inside services.xml, e.g. <argument type=\"service\" id=\"Shopware\\Core\\System\\SystemConfig\\SystemConfigService\"/>"],"sourceVerdict":"partial"},"dev-13":{"query":"There is no event for what I need to change in a core Shopware service — how do I decorate or replace that service from my plugin?","category":"dev","option":"fs-docs","answer":"Use service decoration. In your plugin's `services.php`, register your decorator class and call `->decorate(OriginalService::class)` on it, passing `service('.inner')` as an argument so the original (or the next decorator in the chain) is injected into your decorator's constructor. Shopware services meant to be decorated expose an abstract class (not an interface) as their contract, with an abstract `getDecorated(): AbstractX` method; your decorator class extends that abstract class, stores the injected inner service, returns it from `getDecorated()`, and in its overridden methods should generally delegate to the inner service first and then add its own behavior — a decorator that skips calling the inner service silently breaks any other plugin's decorator further down the chain. Because decoration is unrestricted (it changes the service for every caller and multiple plugins' decorators nest), it is the most fragile extension mechanism, so prefer a designed extension point/event when one exists and reserve decoration for cases where you truly need to change existing behavior and no event covers it. Always type-hint the abstract class (never the concrete class) in constructors so your service stays part of the decoration chain.","citations":["developer/guides/plugins/plugins/services/adjusting-service.md:8-225"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname \"*decorat*\" -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/services/adjusting-service.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-14":{"query":"I wrote a subscriber class in my plugin but it never fires — which interface and which service tag (`shopware.event_subscriber`?) register it?","category":"dev","option":"fs-docs","answer":"Your subscriber class must implement Symfony's `EventSubscriberInterface` (from `Symfony\\Component\\EventDispatcher\\EventSubscriberInterface`) and define a static `getSubscribedEvents()` method mapping event names to handler methods. That alone is not enough: the class must also be registered as a service in your plugin's `src/Resources/config/services.php` and tagged with `kernel.event_subscriber` (not `shopware.event_subscriber`) — e.g. `$services->set(MySubscriber::class)->tag('kernel.event_subscriber');`. If the class is missing from `services.php` or missing that tag, Shopware will never call it and there is no obvious error indicating the event was not handled.","citations":["developer/guides/plugins/plugins/framework/event/listening-to-events.md:31-145"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/event/listening-to-events.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-15":{"query":"How do I work out which event Shopware actually dispatches for a given action, for example after a product is loaded or a page is rendered?","category":"dev","option":"fs-docs","answer":"Shopware's 'Finding Events' guide lays out several complementary strategies: (1) For DAL entities, events always follow the `entity_name.event` pattern (e.g. `product.written`, `product.deleted`), and many core entities also expose an 'Event class' with constants for all possible DAL events (e.g. `ProductEvents`), found by searching for `@Event` in the codebase. (2) For general PHP events, read the core code you're extending and look for `$this->eventDispatcher->dispatch($someEvent, $someEvent->getName())` calls — if the name argument is omitted the class name is the event name; or search the source for `extends NestedEvent`, `extends Event`, `implements ShopwareEvent`, or `->dispatch` occurrences to find events and firing sites; or check a service's constructor/service definition for an injected `event_dispatcher`/`EventDispatcherInterface` to see if it fires events at all. (3) 'Page loaded' events are dispatched by page loaders such as `GenericPageLoader`, which fires a `GenericPageLoadedEvent` — search for the term `PageLoadedEvent`. (4) `Criteria`-based entity loading often dispatches a `*CriteriaEvent` (e.g. `ProductListingCriteriaEvent`) — search for `CriteriaEvent`, though these aren't guaranteed for every entity. (5) Symfony/Shopware also expose fine-grained per-route events (`{route}.request`, `{route}.response`, `{route}.render`, `{route}.encode`, `{route}.controller`) named after the actual Symfony route. (6) Business events (e.g. customer login, order placed) implement `BusinessEventInterface` or `MailActionInterface` — searchable by those interface names. (7) The most direct, code-free approach: open the Symfony web profiler and click the 'Events' tab, which lists every event actually fired during the current request along with its exact name.","citations":["developer/guides/plugins/plugins/framework/event/finding-events.md:8-259"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"debug:event\" docs/shopware-knowledge-bases/developer; find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/event -maxdepth 1"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/event/finding-events.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-16":{"query":"How do I run plugin logic whenever an order is written, and find out exactly which fields changed?","category":"dev","option":"fs-docs","answer":"Create an event subscriber that listens to `OrderEvents::ORDER_WRITTEN_EVENT` (an `EntityWrittenEvent`), and inside the handler check `$event->getContext()->getVersionId() !== Defaults::LIVE_VERSION` to skip draft/version writes (e.g. order edits in admin create a draft version merged later). By default, for performance reasons, the write event does not include a changeset of what actually changed. To get one, also subscribe to `PreWriteValidationEvent` (fired before the write result set is generated); in that handler iterate `$event->getCommands()`, skip any command that is not `ChangeSetAware`, filter to `OrderDefinition::ENTITY_NAME`, and call `$command->requestChangeSet()` on the matching command(s) (again checking the live-version context to limit the performance impact). Then, in the `onOrderWritten` handler for `ORDER_WRITTEN_EVENT`, iterate `$event->getWriteResults()` and call `$result->getChangeSet()` on each write result to read exactly which fields changed. Note an 'insert' command can't produce a changeset since nothing pre-existed to compare against.","citations":["developer/guides/plugins/plugins/checkout/order/listen-to-order-changes.md:8-138"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"getWriteResults|ChangeSet|changeset\" docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/order/listen-to-order-changes.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-17":{"query":"How do I overwrite the price of a product line item in the cart at runtime from a plugin?","category":"dev","option":"fs-docs","answer":"Use a cart collector plus a cart processor (the docs warn this technique is rarely appropriate — prefer a discount/surcharge line item unless you truly need to overwrite an existing item's price, e.g. a live-shopping plugin). Implement `Shopware\\Core\\Checkout\\Cart\\CartDataCollectorInterface::collect()` to fetch the new price for each relevant product line item (filtering `$original->getLineItems()` by `LineItem::PRODUCT_LINE_ITEM_TYPE`) and store it in the shared `CartDataCollection $data` under a plugin-prefixed key, skipping ids already present to avoid duplicate DB lookups on repeated calculation passes. Then implement `Shopware\\Core\\Checkout\\Cart\\CartProcessorInterface::process()` in the same (or a separate) class: iterate the product line items on the `$toCalculate` cart (not `$original` — that's the one actually used), read back the price from `CartDataCollection`, build a `QuantityPriceDefinition` with the new price plus the item's existing tax rules and quantity, run it through an injected `QuantityPriceCalculator::calculate()`, and call `$product->setPrice($calculated)` and `$product->setPriceDefinition($definition)` on the line item. Never query the database inside `process()` — only inside `collect()`. Finally register the class in `services.php` tagged with both `shopware.cart.collector` and `shopware.cart.processor` (with a `priority` argument to control execution order relative to the core product collector/processor, e.g. `priority => 4500` to run after it).","citations":["developer/guides/plugins/plugins/checkout/cart/change-price-of-item.md:8-290"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout -maxdepth 2 -iname \"*cart*\"; find .../checkout/cart -maxdepth 1"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/cart/change-price-of-item.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-18":{"query":"My plugin's cart processor adds a surcharge line item, but it is added again on every recalculation and its price is stale after the customer changes the quantity — how do I split the work between the collector and the processor?","category":"dev","option":"fs-docs","answer":"This is the expected/correct split, not a bug to work around by suppressing re-addition: the cart is rebuilt from scratch on every recalculation. `process(CartDataCollection $data, Cart $original, Cart $toCalculate, SalesChannelContext $context, CartBehavior $behavior)` receives a fresh `$toCalculate` cart each time and must add/re-add your surcharge line item to it on every call — that is how the discount example in the docs works (`$toCalculate->add($discountLineItem)` runs in every `process()` call, unconditionally). The bug to fix is the 'stale price' symptom: a collector should only cache *expensive-to-fetch, quantity-independent* data (e.g. an API result or DB lookup), guarding against duplicate fetches with `if ($data->has($key)) { continue; }` in `collect()`, and it must never do the actual price math there. The processor must always freshly compute the final price from current cart state (via a price calculator such as `PercentagePriceCalculator` or `QuantityPriceCalculator`) using the up-to-date line item quantities/prices found on `$toCalculate` at the time `process()` runs, and attach a `PriceDefinition` (e.g. `PercentagePriceDefinition`) so the price can be recalculated later even if the plugin is uninstalled. In other words: collector = fetch/cache raw inputs once per request; processor = always rebuild the line item and recompute its price from current data, every recalculation, using `$toCalculate` (never `$original`, and never query the database inside `process()`).","citations":["developer/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md:17-105","developer/guides/plugins/plugins/checkout/cart/add-cart-discounts.md:18-121","developer/guides/plugins/plugins/checkout/cart/add-cart-items.md:169-198"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/cart/add-cart-discounts.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/cart/add-cart-items.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-19":{"query":"I need to move long-running work in my plugin out of the request into the message queue — what does the handler class look like and how is it registered?","category":"dev","option":"fs-docs","answer":"First create a message class (a plain, serializable PHP object holding the data your handler needs), implementing `Shopware\\Core\\Framework\\MessageQueue\\AsyncMessageInterface` so it is handled asynchronously instead of synchronously (implement `LowPriorityMessageInterface` instead/also if it should go on the lower-priority queue, available since 6.5.7.0). Dispatch it from a service by injecting `Symfony\\Component\\Messenger\\MessageBusInterface` and calling `$this->bus->dispatch(new YourMessage(...))` (or dispatch an `Envelope` with stamps, e.g. `DelayStamp`, for metadata like delayed processing). Then create the handler class: mark it with the PHP attribute `#[AsMessageHandler]` and implement `__invoke(YourMessage $message): void` containing the actual long-running work — e.g. `class SmsHandler { #[AsMessageHandler] public function __invoke(SmsNotification $message) { ... } }`. The `#[AsMessageHandler]` attribute is how it is registered/tagged for Symfony Messenger — the docs equivalently describe it as needing the `messenger.message_handler` tag, and you can define multiple handlers for the same message.","citations":["developer/guides/plugins/plugins/framework/message-queue/add-message-handler.md:8-51","developer/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md:16-143"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname \"*message-queue*\" -not -path '*/.git/*'"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/message-queue -maxdepth 1"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/message-queue/add-message-handler.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-20":{"query":"How do I add my own condition to the Rule Builder from a plugin so shop owners can select it?","category":"dev","option":"fs-docs","answer":"Two parts are needed: PHP backend logic and an Administration UI registration. (1) PHP: create a class extending the abstract `Shopware\\Core\\Framework\\Rule\\Rule`, implement `getName(): string` (a unique technical name), `match(RuleScope $scope): bool` (the actual condition check — never run DB queries or other slow operations here), and `getConstraints(): array` (declares the config fields and their validation types, using protected — not private — properties so they work correctly). Optionally implement `getConfig(): RuleConfig` (e.g. `(new RuleConfig())->booleanField('isFirstMondayOfTheMonth')`) to auto-render a generic `sw-condition-generic` admin field and skip building a custom component. Register the rule class in `services.php` tagged with `shopware.rule.definition`. (2) Administration: decorate the `ruleConditionDataProviderService` (the RuleConditionService) via `Shopware.Application.addServiceProviderDecorator('ruleConditionDataProviderService', (ruleConditionService) => { ruleConditionService.addCondition('your_rule_name', { component: 'your-component', label: 'Your label', scopes: ['global'] }); return ruleConditionService; })` in a decorator file imported from the plugin's `main.js`; the condition name must match `getName()` from the PHP rule. Optionally group rules with `ruleConditionService.upsertGroup(...)` and a `group` property on the condition. Unless you used `getConfig()`, also build a custom Vue component (extending `sw-condition-base`) with a Twig template overriding the `sw_condition_value_content` block to render the actual input (e.g. an `sw-single-select`). Since 6.5.0.0, rules are 'context-aware' — you can restrict where a rule/condition may be assigned (e.g. disallow it for advanced prices) via `ruleConditionService.addAwarenessConfiguration('assignmentName', { notEquals: [...], equalsAny: [...], snippet: '...' })`, and any custom rule-assignment UI should use the `sw-select-rule-create` component with a matching `rule-aware-group-key` so restricted rules are shown disabled.","citations":["developer/guides/plugins/plugins/framework/rule/add-custom-rules.md:8-369"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname \"*rule*\" -path \"*framework*\" -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/rule/add-custom-rules.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-21":{"query":"My plugin dispatches its own domain event — how do I make it show up as a trigger in the Flow Builder?","category":"dev","option":"fs-docs","answer":"Make your event class implement Shopware\\Core\\Framework\\Event\\FlowEventAware (plus any relevant Aware interface such as CustomerAware, OrderAware, MailAware, UserAware or SalesChannelAware depending on what data/actions you want to expose), and implement getName() and the static getAvailableData() (pre-6.5) methods. Then register a subscriber for the BusinessEventCollectorEvent that calls $businessEventCollector->define(YourEvent::class) and adds the resulting definition to the event collection, e.g. a BusinessEventCollectorSubscriber with getSubscribedEvents() returning [BusinessEventCollectorEvent::NAME => ['onAddExampleEvent', 1000]] (priority should be high so it runs before other subscribers). Register that subscriber in services.php tagged 'kernel.event_subscriber'. From Shopware 6.5 onward, Flow Builder uses StorableFlow instead of the raw event; data is transported via Aware interfaces paired with FlowStorer classes (store()/restore()) — existing pairs include CustomerAware/CustomerStorer, MailAware/MailStorer, OrderAware/OrderStorer, ProductAware/ProductStorer, UserAware/UserStorer, etc. If none of the existing Aware interfaces fit your data, you can define your own custom Aware interface (marked with #[IsFlowEventAware]) plus a matching custom FlowStorer, and flow actions can then read the data via $flow->getStore()/$flow->getData(). Once done, the new event appears as a trigger under Administration > Settings > Flow Builder > Add flow.","citations":["developer/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md:8-407"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"find developer/guides -maxdepth 3 -type d; grep -rl 'Flow Builder' developer/guides/plugins --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-22":{"query":"How do I give my plugin a settings page the shop operator can fill in, and what field types are available?","category":"dev","option":"fs-docs","answer":"Create a `src/Resources/config/config.xml` file in your plugin. No custom Administration module is required — Shopware dynamically renders this XML as a configuration page. The file must have at least one `<card>` with a `<title>` and at least one `<input-field>` with a `<name>` (name must be >=4 chars, letters/numbers, not starting with a number). Card titles, labels, placeholders and helpText are translatable via the `lang` attribute (default en-GB). Available `<input-field type=\"...\">` values: text (default), textarea, text-editor, url, password, int, float, bool, checkbox, datetime, date, time, colorpicker, single-select, multi-select. Common per-field settings: label/placeholder/helpText, defaultValue, disabled, required, copyable (text-like fields), minLength/maxLength (text/url/password), min/max (int/float), and options (for single-/multi-select, each with id + translatable name). Since 6.7.12.0 you can add cache-relevant=\"true\" to a field if it affects cached Storefront output. For more complex UI you can use `<component name=\"...\">` elements instead of input-field — supported components are sw-entity-single-select, sw-entity-multi-id-select, sw-media-field, sw-text-editor, and sw-snippet-field (the last edits snippet translations rather than storing a system-config value). After defining config.xml, the shop operator fills in values via Administration > Extensions > My extensions > Plugins > Configure.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md:8-478"],"toolCallLog":[{"tool":"Bash","args":"grep -rl 'system config|configuration.xml|plugin configuration' docs/shopware-knowledge-bases/developer/guides/plugins/plugins --include=*.md | grep -i config"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-23":{"query":"How do I ship a mail template with my plugin so it is installed automatically, including a custom mail template type?","category":"dev","option":"fs-docs","answer":"Ship the mail template via a plugin database migration (not the Administration). Create a migration class (e.g. src/Migration/Migration<timestamp>AddMailTemplate.php extending MigrationStep) whose update() method: 1) fetches or creates the mail_template_type ID, 2) inserts an entry into `mail_template` referencing that type ID with system_default = 0, and 3) inserts an entry into `mail_template_translation` for each language you want to support (e.g. en-GB, de-DE), providing sender_name, subject, description, content_html and content_plain. Use INSERT IGNORE so re-running the migration on update/reinstall doesn't throw and never delete mail templates on uninstall since other entities may reference them. To use an existing type (e.g. 'contact_form'), look up its ID from mail_template_type by technical_name. To ship a custom mail template type instead, add a createMailTemplateType() method that inserts a new row into `mail_template_type` (with a unique technical_name and an available_entities JSON column, e.g. {\"product\":\"product\"} to make the ProductEntity available in the template) plus corresponding `mail_template_type_translation` rows per language, then use the returned type ID when creating the mail_template entry. Once the plugin is installed, the mail template (and template type) is created automatically.","citations":["developer/guides/plugins/plugins/content/mail/add-mail-template.md:8-309"],"toolCallLog":[{"tool":"Bash","args":"grep -rli 'mail template' docs/shopware-knowledge-bases/developer/guides/plugins/plugins --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/content/mail/add-mail-template.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-24":{"query":"How do I get readable SEO URLs generated for the detail pages of my plugin's own entity?","category":"dev","option":"fs-docs","answer":"For a DAL entity with a storefront detail route ('dynamic SEO URLs for entities'): (1) create a class implementing Shopware\\Core\\Content\\Seo\\SeoUrlRoute\\SeoUrlRouteInterface (e.g. ExamplePageSeoUrlRoute) with getConfig() returning a SeoUrlRouteConfig(entityDefinition, routeName, defaultTemplate, true), prepareCriteria() to filter/extend which entities get URLs, and getMapping(Entity $entity, ?SalesChannelEntity $salesChannel) returning a SeoUrlMapping with the route parameters and the template data; register this class in services.php tagged 'shopware.seo_url.route'. (2) Add an event subscriber on your entity's DAL 'written' (and 'deleted') events that calls Shopware\\Core\\Content\\Seo\\SeoUrlUpdater::update(RouteName, $event->getIds()) so a SEO URL is (re)generated whenever the entity changes, and marks it is_deleted on deletion. (3) Add a plugin migration that inserts a row into the `seo_url_template` table with route_name, entity_name (your entity's technical name) and template (the same DEFAULT_TEMPLATE constant) — this row is required for SeoUrlUpdater to work. Once installed, every write of the entity automatically creates/updates its `seo_url` entry via SeoUrlUpdater. (For non-entity dynamic content, use SeoUrlPersister::updateSeoUrls directly instead of SeoUrlUpdater.)","citations":["developer/guides/plugins/plugins/content/seo/add-custom-seo-url.md:150-404"],"toolCallLog":[{"tool":"Bash","args":"grep -rli 'seo url|SeoUrl' docs/shopware-knowledge-bases/developer/guides/plugins/plugins --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/content/seo/add-custom-seo-url.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-25":{"query":"How do I add a `bin/console` command to my plugin for a maintenance task?","category":"dev","option":"fs-docs","answer":"Shopware CLI commands are based on Symfony Console, so a plugin command follows the standard Symfony approach. Create a command class (e.g. <plugin root>/src/Command/ExampleCommand.php) extending Symfony\\Component\\Console\\Command\\Command, decorated with #[AsCommand(name: 'swag:example', description: 'Example command')], and implement execute(InputInterface $input, OutputInterface $output): int, returning Command::SUCCESS. Then register the class as a service in <plugin root>/src/Resources/config/services.php and tag it with 'console.command': $services->set(Swag\\BasicExample\\Command\\ExampleCommand::class)->tag('console.command'); Commands registered this way are automatically available via bin/console once the plugin is installed/active.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md:8-48"],"toolCallLog":[{"tool":"Bash","args":"grep -rli 'console command|bin/console' docs/shopware-knowledge-bases/developer/guides/plugins/plugins --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-26":{"query":"How do I add a custom document type such as a pro-forma invoice in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"As of Shopware 6.7 there are two document systems in the corpus: the legacy system (default, deprecated for removal in 6.9) and the new Document System v2, which is available as an experimental feature behind the DOCUMENT_GENERATION_REWORK feature flag (its API can change until it becomes default in 6.8).\n\nLegacy system (default in 6.7): 1) Add a plugin database migration inserting a row into `document_type` (with a unique technical_name, e.g. 'example') plus `document_type_translation` rows per language (using ImportTranslationsTrait), and a `document_base_config`/`document_base_config_sales_channel` row holding default display/config options (displayPrices, pageOrientation, companyName, etc.). 2) Create a renderer class implementing Shopware\\Core\\Checkout\\Document\\Renderer\\AbstractDocumentRenderer with supports() returning your technical name, render(array $operations, Context $context, DocumentRendererConfig $rendererConfig): RendererResult that loads the relevant orders, builds a RenderedDocument via DocumentFileRendererRegistry, and getDecorated() (throw DecorationPatternException since it's not decorating anything); register it in services.php tagged 'document.renderer'. 3) Add a Twig template at src/Resources/views/documents/<name>.html.twig that does `{% sw_extends '@Framework/documents/base.html.twig' %}` and overrides blocks. 4) Add a number range for the document type via migration: insert rows into number_range_type (technical_name e.g. 'document_example'), number_range (pattern, start), number_range_sales_channel, and their translation tables.\n\nDocument System v2 (experimental, flag DOCUMENT_GENERATION_REWORK): 1) Create a document type class extending Shopware\\Core\\Checkout\\DocumentV2\\Type\\AbstractDocumentType, implementing getTechnicalName() and getSupportedFormats() (e.g. ['html','pdf']). 2) Create a render-data DTO extending AbstractRenderData with public properties that become available as `config.*` in the template, and a data provider extending AbstractDocumentDataProvider (getKey(), supports($documentType), enrichOrderCriteria(Criteria $criteria) to add needed associations, and provideRenderingData(ProviderInput $input, Context $context): AbstractRenderData). 3) Register the type tagged 'shopware.document_v2.type' and the provider tagged 'shopware.document_v2.provider' in services.php. 4) Add a Twig template at src/Resources/views/documents/<technical_name>.html.twig extending '@Framework/documents/base.html.twig' (plus a zugferd/<technical_name>.xml.twig if you support the zugferd_xml format). 5) You still need the same document_type database row and a number range (of type document_<technical_name>) as in the legacy system — the migration code is identical, just reuse it with your new technical name.","citations":["developer/guides/plugins/plugins/checkout/documents/legacy/add-custom-document-type.md:8-573","developer/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md:7-162","developer/guides/plugins/plugins/checkout/documents/v2/index.md:7-34"],"toolCallLog":[{"tool":"Bash","args":"grep -rli 'document type|pro.forma|proforma|DocumentTypeEntity|custom document' docs/shopware-knowledge-bases/developer/guides/plugins/plugins --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/documents/v2/index.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/documents/legacy/add-custom-document-type.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-27":{"query":"In Shopware 6.7, how do I extend a Storefront Twig template from my plugin with `{% extends %}` so I keep the core markup and other plugins' changes?","category":"dev","option":"fs-docs","answer":"Register your plugin's view path (Shopware looks for <plugin root>/src/Resources/views by default). Find the original template's path inside the core (e.g. Storefront/Resources/views/storefront/layout/header/logo.html.twig) and recreate the exact same relative directory structure under your plugin's views directory (<plugin root>/src/Resources/views/storefront/layout/header/logo.html.twig) — identical relative path from the 'views' root is what makes your override load automatically. In your new file, use Shopware's special tag `{% sw_extends '@Storefront/storefront/layout/header/logo.html.twig' %}` (not plain Twig `{% extends %}`) at the very top — this correctly chains through the core template and any other plugins/themes that also extend it, rather than skipping them the way a normal `{% extends %}` would. Then redefine only the specific `{% block %}` you want to change (e.g. `layout_header_logo_link`) and put your custom markup inside it; call `{{ parent() }}` inside the block if you want to keep/append to the original content instead of fully replacing it. After changing templates, run `./bin/console cache:clear`, and make sure your plugin/theme is active and assigned to the sales channel. To find available Twig variables in a template, use `{{ dump() }}`. Since Shopware 6.7.11.0 there is also a Storefront Components system for building reusable atomic components, described in the linked concept page.","citations":["developer/guides/plugins/plugins/storefront/templates/customize-templates.md:8-118"],"toolCallLog":[{"tool":"Bash","args":"grep -rli 'sw_extends|extends storefront template' docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/templates --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/templates/customize-templates.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-28":{"query":"How do I override an existing Storefront JavaScript plugin, such as the cookie permission bar, from my own plugin instead of registering a new one?","category":"dev","option":"fs-docs","answer":"Storefront JS plugins are vanilla JavaScript classes, so you extend them directly. Note each JS plugin can only be overridden once — if two Shopware plugins override the same plugin, only the last one wins. Create a directory <plugin root>/src/Resources/app/storefront/src/my-cookie-permission with a file my-cookie-permission.plugin.js, and write a class that extends the original, e.g. `import CookiePermissionPlugin from 'src/plugin/cookie/cookie-permission.plugin'; export default class MyCookiePermission extends CookiePermissionPlugin { ... }` (if you can't import the original class, e.g. for a third-party plugin without an alias, retrieve it via `window.PluginManager.getPlugin('CookiePermission').get('class')`). Override whichever methods you need (e.g. init() to always show the cookie bar, calling super.init() afterwards; _hideCookieBar() to add a confirm() dialogue before calling super._hideCookieBar()). Then register the override: create <plugin root>/src/Resources/app/storefront/src/main.js (the plugin's JS entry point) and call `PluginManager.override('CookiePermission', MyCookiePermission, '[data-cookie-permission]')` instead of PluginManager.register(). If the original plugin was registered asynchronously, the override import must also be async/dynamic, e.g. `PluginManager.override('CookiePermission', () => import('./my-cookie-permission/my-cookie-permission.plugin'), '[data-cookie-permission]')`. Finally rebuild the Storefront (`shopware-cli project storefront-build`, or `composer run build:js:storefront` in a platform contribution setup) and reload to see the changes.","citations":["developer/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md:8-151"],"toolCallLog":[{"tool":"Bash","args":"grep -rli 'plugin override|PluginManager|js plugin' docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-29":{"query":"How do I add my own data to an existing Storefront page or pagelet from a plugin without overriding the core controller?","category":"dev","option":"fs-docs","answer":"Every Storefront page or pagelet fires a corresponding 'Loaded' event (e.g. FooterPageletLoadedEvent for the FooterPagelet) after the controller builds it — subscribe to that event instead of touching the controller. Steps: 1) Identify the page/pagelet and its Loaded event. 2) Create an event subscriber implementing EventSubscriberInterface with getSubscribedEvents() mapping e.g. FooterPageletLoadedEvent::class to a handler method, and register it in services.php tagged 'kernel.event_subscriber'. 3) Since you should not call the DAL directly from a pagelet event, fetch your extra data via a store-api route (create an Abstract*Route/concrete Route class following the store-api route guide, e.g. an aggregate-based ProductCountRoute using EntityRepository::aggregate() with a CountAggregation, wrapped in a StoreApiResponse subclass). 4) In the subscriber's handler, call your route (injecting it as a service) and attach the result to the page/pagelet object with `$event->getPagelet()->addExtension('product_count', $result)` (works the same way for pages via $event->getPage()). 5) To display the data, override the relevant Storefront template with `{% sw_extends '@Storefront/...' %}`, override the appropriate block, call `{{ parent() }}` to keep existing content, and access your data via `<page or pagelet>.extensions.product_count...` in Twig.","citations":["developer/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md:8-322"],"toolCallLog":[{"tool":"Bash","args":"grep -rli 'add.*data.*page|PageLoadedEvent|pagelet|decorate.*pageloader|subscribe.*page.*loaded' docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-30":{"query":"How do I add a custom filter to the Storefront product listing from my plugin, both the criteria side and the filter panel?","category":"dev","option":"fs-docs","answer":"Criteria side: create a subscriber (e.g. <plugin root>/src/Subscriber/ExampleListingSubscriber.php) that listens to \\Shopware\\Core\\Content\\Product\\Events\\ProductListingCollectFilterEvent (getSubscribedEvents() maps it to a method like addFilter). In the handler, read $event->getRequest() to see if your filter parameter is present, build a Shopware\\Core\\Framework\\DataAbstractionLayer\\Search\\Filter\\... instance with the constructor: name (unique filter name), filtered (bool, whether this filter is currently active), aggregations (array, e.g. a FilterAggregation/EntityAggregation used to compute filter option counts), filter (the actual DAL filter, e.g. EqualsFilter, added to the criteria when active), and values (the value(s) exposed as currentFilter in the result). Then call $event->getFilters()->add($filter) to merge it into the existing filter set.\n\nFilter panel (UI) side: extend Storefront's src/Storefront/Resources/views/storefront/component/listing/filter-panel.html.twig with `{% sw_extends '@Storefront/storefront/component/listing/filter-panel.html.twig' %}`, and override the `component_filter_panel_items` block (available since Shopware 6.4.8.0) — call `{{ parent() }}` to keep existing filters, then use `{% sw_include %}` to render your filter with one of the built-in filter component templates: filter-boolean (boolean values), filter-multi-select (multiple values), filter-property-select (properties), filter-range (numeric range), or filter-rating-select/filter-rating-select-item (ratings), passing at least `name` and `displayName`. To position your filter next to a specific existing filter (e.g. right after the price filter) instead of appending it at the end, extend that specific block instead (e.g. component_filter_panel_item_price) rather than component_filter_panel_items.","citations":["developer/guides/plugins/plugins/storefront/howto/add-listing-filters.md:8-183"],"toolCallLog":[{"tool":"Bash","args":"grep -rli 'listing.*filter|filter panel|ProductListingCriteriaEvent|product listing' docs/shopware-knowledge-bases/developer/guides/plugins/plugins --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/howto/add-listing-filters.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-31":{"query":"How do I expose a plugin configuration value, such as a colour picked in the Administration, as an SCSS variable in my Storefront styling?","category":"dev","option":"fs-docs","answer":"First define a fallback for your custom SCSS variable in your plugin's base.scss (e.g. `$sass-plugin-header-bg-color: #ffcc00 !default;`). Then add a `colorpicker` input field to your plugin's `config.xml` (e.g. name `sassPluginHeaderBgColor`, optionally with a `defaultValue`), which will render as the `sw-colorpicker` component in the Administration plugin config. Create a subscriber (e.g. `ThemeVariableSubscriber`) that listens to `Shopware\\Storefront\\Event\\ThemeCompilerEnrichScssVariablesEvent` and register it with the `kernel.event_subscriber` tag in services.php. Inject `SystemConfigService` into the subscriber, and in the event handler read the config value via `$this->systemConfig->get('SwagBasicExample.config.sassPluginHeaderBgColor', $event->getSalesChannelId())` and pass it to `$event->addVariable('sass-plugin-header-bg-color', $configPluginHeaderBgColor)`. This makes the variable sales-channel specific since it is read per sales channel id. You can also loop over all config fields returned by `$this->systemConfig->get('SwagBasicExample.config', $salesChannelId)` and call `addVariable()` for each, converting camelCase keys to kebab-case (e.g. with `CamelCaseToSnakeCaseNameConverter`) to match SCSS variable naming conventions.","citations":["developer/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md:26-249"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"grep -rl \"SCSS variable\" docs/shopware-knowledge-bases/developer; grep -rli scss docs/shopware-knowledge-bases/developer --include=*.md -l | grep -i config"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-32":{"query":"How do I define a custom field set for products from my plugin so merchants can edit the values in the Administration?","category":"dev","option":"fs-docs","answer":"You define a custom field set using the `custom_field_set.repository` (retrieved via dependency injection, e.g. injected into a service used during plugin install/lifecycle) and call its `create()` method with an array describing the set: a `name` (globally unique, vendor-prefixed, e.g. 'swag_example_set'), `global` flag, translated `config.label`, and a `customFields` array where each field has a `name`, a `type` (from `CustomFieldTypes`, e.g. INT), `includeInSearch` (to make it searchable, available since 6.7.6.0), and its own translated `config.label` plus optional `customFieldPosition` for ordering. As of Shopware 6.7.13.0 you can instead declare the set/fields declaratively in `<plugin root>/src/Resources/config/custom-fields.xml`, which Shopware automatically creates/updates/removes during install, update, and uninstall without needing lifecycle hooks or the repository. To associate the set specifically with products so it appears in the Administration for products, the Administration side reads custom field sets restricted to the product entity using a Criteria filter `Criteria.equals('relations.entityName', 'product')` when searching the `custom_field_set` repository from a component (as shown in the Administration guide). To actually make the field editable, you then use the `sw-custom-field-set-renderer` component in your module's Twig template, bound to `:entity` and `:sets`, after loading the sets via `this.repositoryFactory.create('custom_field_set')` and searching with that criteria. On uninstall, you should remove the custom field set (and clean the entities' customFields data) using the repository's `delete` method.","citations":["developer/guides/plugins/plugins/framework/custom-field/add-custom-field.md:237-327","developer/guides/plugins/plugins/administration/data-handling-processing/using-custom-fields.md:24-93"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"custom field set\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/custom-field/add-custom-field.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/data-handling-processing/using-custom-fields.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-33":{"query":"How do I register a custom Administration module from my plugin, and what has to line up for it to actually show up after a build?","category":"dev","option":"fs-docs","answer":"Create a directory `<plugin root>/src/Resources/app/administration/src/module/swag-example` with an `index.js` file (Shopware requires an index.js per module). Import that module from your plugin's Administration entry point: add `import './module/swag-example';` to `<plugin root>/src/Resources/app/administration/src/main.js`. In the module's `index.js`, call `Shopware.Module.register('swag-example', { ... })` (a wrapper around ModuleFactory.registerModule) with a configuration object containing: `type: 'plugin'` (third-party modules should use 'plugin', not 'core'), a unique `name`, `title`, `description`, a primary `color` (used for icon accents, global search tag, smart bar accent), and an `icon` (from the Meteor Icon Kit; note this is not the menu icon, which is configured separately). Define `routes` (e.g. list/detail/create, each mapping to a `component` and `path`), a `navigation` array for the menu entry (label, color, path, icon, position), and optionally `settingsItem` if the module belongs in Settings (with `group` of 'shop', 'system', or 'plugins', an `icon`, and `to` pointing at a route name). Add `snippets` with per-locale translation objects (e.g. `de-DE`/`en-GB`) since labels like the title are Vue-i18n keys, otherwise the raw key is shown. For it to appear after a build: the plugin must be active, and you run `shopware-cli project admin-build` (or `composer run build:js:admin` in a platform/contribution setup); this minifies main.js into a file under `<plugin root>/src/Resources/public/administration/js/<plugin-name>.js`, which then gets copied to `public/bundles/administration/<pluginname>/administration/js/...`. The build only compiles the assets already wired up — the module still depends on main.js correctly importing the module, `Shopware.Module.register()` being called, and routes/components/snippets all lining up at runtime for the module to actually show up.","citations":["developer/guides/plugins/plugins/administration/module-component-management/add-custom-module.md:22-319"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"register.*module\\|module.register\\|add-custom-module\" docs/shopware-knowledge-bases/devel
