oper/guides/plugins/plugins/administration --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/module-component-management/add-custom-module.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-34":{"query":"How do I extend an existing Administration component and its Twig blocks from my plugin, for example to change the dashboard headline?","category":"dev","option":"fs-docs","answer":"Use `Shopware.Component.override('component-name', { ... })` to overwrite an existing component's behavior in place, or `Shopware.Component.extend('new-name', 'existing-name', { ... })` to create a new component based on an existing one. To change a component's template, pass a new `template` built from a `.html.twig` file. Templates use TwigJS blocks: find the specific named block you want to change (nesting is fine, e.g. `card`, `card_header`, `card_content`), redeclare that same block name in your override file to replace its markup, and use `{% parent %}` inside the block if you want to keep the original markup and add to it rather than fully replace it. To change a method or computed property's logic, pass a `methods`/`computed` object in the override/extend config; call `this.$super('methodName')` inside your replacement to invoke the original implementation instead of fully replacing it. \n\nWorked dashboard example: to change the Shopware 6 dashboard headline from 'Welcome to Shopware 6', first find the relevant twig block in the core `sw-dashboard-index.html.twig` template — in this case `sw_dashboard_index_content_intro_content_headline`. Create `<plugin root>/src/Resources/app/administration/src/sw-dashboard-index-override/sw-dashboard-index.html.twig` and redeclare that block with new markup, e.g. `{% block sw_dashboard_index_content_intro_content_headline %}<h1>Welcome to a customized component<\/h1>{% endblock %}`. Then create `<plugin root>/src/Resources/app/administration/src/sw-dashboard-index-override/index.js` containing `import template from './sw-dashboard-index.html.twig'; Shopware.Component.override('sw-dashboard-index', { template });`. Finally, import that index.js from your plugin's Administration entry point `main.js` (placed at `<plugin root>/src/Resources/app/administration/src`) with `import './sw-dashboard-index-override/';` so it is picked up automatically. There is also an experimental Composition-API-based extension system (`Shopware.Component.createExtendableSetup` / `Shopware.Component.overrideComponentSetup`) for components written with the Composition API, but the Options API `Component.extend`/`Component.override` system remains the standard supported approach.","citations":["developer/guides/plugins/plugins/administration/module-component-management/customizing-components.md:19-226"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/module-component-management/customizing-components.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-35":{"query":"How do I load entities from the Admin API inside an Administration component using the repository factory and a Criteria?","category":"dev","option":"fs-docs","answer":"Inject the `repositoryFactory` service into your component via `inject: ['repositoryFactory']`. Then create a repository for an entity with `this.repositoryFactory.create('product')` (typically exposed as a `computed` property), optionally passing a source route and a third `options` argument (e.g. `{ version: 1 }`) to select an API version. To search a list, build a `Criteria` (`const { Criteria } = Shopware.Data; const criteria = new Criteria();`), configure it with `setPage()`, `setLimit()`, `setTerm()`, `setIds()`, `setTotalCountMode()`, `addFilter(Criteria.equals(...))`, `addSorting(Criteria.sort(...))`, `addAggregation(Criteria.avg(...))`, and `getAssociation('categories').addSorting(...)`, then call `this.productRepository.search(criteria, Shopware.Context.api).then(result => { this.result = result; })`. To fetch a single entity by id (e.g. for edit/detail views), call `this.productRepository.get(entityId, Shopware.Context.api)` (optionally passing a Criteria as a third argument to load associations, via `criteria.addAssociation('manufacturer')` etc.), which returns a promise resolving to the entity. Associations can then be accessed as normal properties (ManyToOne returns an entity, ManyToMany/OneToMany return an EntityCollection with a `source` API route for lazy loading, e.g. via `this.repositoryFactory.create(this.product.prices.entity, this.product.prices.source)`).","citations":["developer/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md:24-163"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-36":{"query":"How do I register ACL privileges for my plugin's Administration module and check them in a component or template?","category":"dev","option":"fs-docs","answer":"Register privileges using `Shopware.Service('privileges').addPrivilegeMappingEntry({...})`. The object has: `category` ('permissions' for normal CRUD-style privileges shown in the permissions grid, or 'additional_permissions' for non-CRUD actions shown in their own card), `parent` (a parent key for nesting, or `null`), `key` (groups privileges together — for normal permissions this is usually the module name), and `roles`. For `permissions`, roles must be the four predefined `viewer`/`editor`/`creator`/`deleter`; for `additional_permissions` you can use any custom role key. Each role has a `privileges` array of API permissions in `entity_name:operation` form (e.g. `product_review:read`) and an optional `dependencies` array of other privilege identifiers (`key.role`, e.g. `review.viewer`) that get auto-checked. The recommended file layout is `<plugin root>/src/Resources/app/administration/src/<your-component>/acl/index.js` containing the registration, imported from that component's `index.js`, which itself must ultimately be reachable from the plugin's `main.js` (placed in `.../administration/src`) to be picked up automatically. You can extend an existing key's permissions (e.g. `key: 'product'`) rather than defining a new one, and reuse other modules' privileges via `Shopware.Service('privileges').getPrivileges('rule.viewer')`. To protect routes, add `meta: { privilege: 'your_key.your_role' }` to a route definition in `Module.register(...)`; to protect menu entries, add a `privilege` property to the `navigation` or `settingsItem` entries. Add translation snippets under `sw.privileges.${category}.${key}.label` (and `...${role_key}` for additional_permissions). To check privileges in code, inject the `acl` service (`inject: ['acl']`) and call `this.acl.can('key.role')` (e.g. `this.acl.can('sales_channel.creator')`), which works in methods, and in templates via `v-if=\"acl.can('review.editor')\"` or bound to `:disabled`. Shortcuts can be conditionally enabled the same way via an `active()` function referencing `this.acl.can(...)`. Finally, from PHP you can add custom privileges to existing roles by overriding `enrichPrivileges()` in your plugin's base class, returning an array keyed by role identifier (e.g. `'product.viewer'`) mapping to an array of additional privilege strings; an event subscriber adds these at runtime.","citations":["developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:31-447"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-37":{"query":"How do I set up and run PHPUnit integration tests for my Shopware plugin, including tests that boot the kernel?","category":"dev","option":"fs-docs","answer":"Create a `phpunit.xml` in your plugin root (this can be autogenerated by `bin/console plugin:create`), with `bootstrap=\"tests/TestBootstrap.php\"`, a `<php>` block setting `server name=\"KERNEL_CLASS\" value=\"Shopware\\Core\\Kernel\"`, `env APP_ENV=test`, `APP_DEBUG=1`, `SYMFONY_DEPRECATIONS_HELPER=weak`, and `<testsuites>` pointing at your test directories (e.g. `Migration/Test` and `Test`). The generated `<plugin root>/tests/TestBootstrap.php` uses `Shopware\\Core\\TestBootstrapper`: `(new TestBootstrapper())->addCallingPlugin()->addActivePlugins('BasicExample')->setForceInstallPlugins(true)->bootstrap()->getClassLoader()`, then registers a PSR-4 autoload namespace for your tests; `setForceInstallPlugins(true)` ensures your plugin is installed/active even against a pre-built test database.\n\nFor an integration test, extend PHPUnit's `TestCase` and use the `Shopware\\Core\\Framework\\Test\\TestCaseBase\\IntegrationTestBehaviour` trait, which provides conveniences like automatically wrapping each test in a database transaction and clearing the cache before each test (example: `UsedClassesAvailableTest` in `<plugin root>/src/Test/`). For tests that need to boot the kernel and access the DI container (e.g. a database connection), use the `Shopware\\Core\\Framework\\Test\\TestCaseBase\\KernelTestBehaviour` trait and call `$this->getContainer()->get(Connection::class)` — shown in a migration test example under `<plugin root>/src/Migration/Test/`.\n\nTo override services for tests (e.g. avoid real file deletion or API calls), create `<plugin root>/Resources/config/services_test.php`, which overrides `services.php` only in the test environment, letting you change arguments/aliases/parameters injected during test runs.\n\nRun tests with the PHPUnit binary from `vendor/bin`, pointing `--configuration` at your plugin directory: `./vendor/bin/phpunit --configuration=\"custom/plugins/SwagBasicExample\" --testsuite \"migration\"`; omit `--testsuite` to run all suites, or use `--filter <ClassName-or-method>` to run a single class or method. To be able to run PHPUnit tests at all in a project, install the Flex `dev-tools` package via `composer require --dev dev-tools`.","citations":["developer/guides/development/testing/unit/php-unit.md:8-214"],"toolCallLog":[{"tool":"Bash","args":"grep -rli phpunit docs/shopware-knowledge-bases/developer/guides/development/testing --include=*.md; find docs/shopware-knowledge-bases/developer/guides/development/testing -type d -not -path '*/.git/*'"},{"tool":"Bash","args":"grep -rli \"integration test\\|IntegrationTestBehaviour\\|KernelTestBehaviour\\|boot the kernel\\|TestBootstrapper\" docs/shopware-knowledge-bases/developer/guides --include=*.md"},{"tool":"Bash","args":"grep -rli \"plugin.*test\\|test.*plugin\" docs/shopware-knowledge-bases/developer/guides/plugins --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/testing/unit/php-unit.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-38":{"query":"How do I write Jest unit tests for my Administration components in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Shopware uses Jest plus Vue Test Utils for Administration component tests. Test files sit next to the file under test, suffixed `.spec.js` or `.spec.ts`. Components are registered globally via `Shopware.Component.register()`; to get a mountable native Vue component with template inheritance/extension already resolved, use `Shopware.Component.build('component-name')`, then mount it with Vue Test Utils' `shallowMount()` (preferred, stubs child components) or `mount()`. You can scaffold a test with `composer run admin:create:test` (paste the component/service path when prompted) to get the recommended boilerplate. Before running tests, install Administration dependencies with `composer run init:js`; run all Administration unit tests with `composer run admin:unit`, or `composer run admin:unit:watch` to re-run only changed files during development (these PSH commands apply to the Shopware-provided Administration itself — a plugin's own Jest tests may need custom scripts).\n\nA typical example test imports the component file for its registration side effect, then does `wrapper = shallowMount(Shopware.Component.build('sw-multi-select'), { props: {...}, stubs: { 'sw-select-base': Shopware.Component.build('sw-select-base'), ... } })` in `beforeEach`, destroys the wrapper in `afterEach`, and asserts e.g. `expect(wrapper.vm).toBeTruthy()`. You can assert rendered slot content via `wrapper.find('.some-class').text()`.\n\nShopware's test setup provides many preconfigured mocks to simplify tests: set `global.activeAclRoles = ['product.editor']` to grant ACL rights for a test (default is none); set `global.activeFeatureFlags = ['FEATURE_NEXT_12345']` to enable a feature flag; the repository factory is auto-generated from the entity schema and logs guidance (with an example `global.repositoryFactoryMock.responses.addResponse({...})` snippet) whenever an unmocked API route is hit, and this warning can be disabled via `global.repositoryFactoryMock.showWarning = false`; directives and filters are globally registered by default and can be overridden; the `Shopware` context is prepared automatically and can be overridden via `Shopware.Store`; common globals like `$tc`, `$device`, `$store`, `$router` are auto-mocked and can be overridden via the `mocks` option in `mount`/`shallowMount`. To stub a missing directive (e.g. `v-clipboard`), use `createLocalVue()` and `localVue.directive('clipboard', {})`, then pass `localVue` to the mount options. To stub a missing injection (e.g. `Injection \"mediaService\" not found`), pass a `provide: { mediaService: { renameMedia: () => Promise.resolve() } }` object, or register the mocked service globally with `Shopware.Service.register('mediaService', {...})` in `beforeAll`.","citations":["developer/guides/development/testing/unit/jest-admin.md:8-599"],"toolCallLog":[{"tool":"Bash","args":"grep -rli jest docs/shopware-knowledge-bases/developer/guides/development/testing --include=*.md; find docs/shopware-knowledge-bases/developer/guides/development/testing/unit -type f -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/testing/unit/jest-admin.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-39":{"query":"How do I write end-to-end Cypress tests for my plugin against a Shopware 6.7 store?","category":"dev","option":"fs-docs","answer":"Note: in the current corpus, Cypress is filed under 'legacy' testing docs; the Testing overview page states 'Playwright is the officially supported tool' for E2E testing going forward, so for a Shopware 6.7 store Cypress should be treated as the older/legacy approach rather than the current recommendation (source: developer/guides/development/testing/index.md).\n\nThat said, the corpus's Cypress guide describes the plugin approach as follows. Prerequisites: a clean Shopware 6 installation (use `composer run init` for a clean, demo-data-free install), tests running against production mode for reliability, and a theme assigned to the shop. For a plugin, create the folder structure `Resources/app/<environment>/test/e2e/cypress/{fixtures,integration,plugins,support}`. Inside `Resources/app/<environment>/test/e2e`, run `npm init -y`, add an `open` script (`\"open\": \"node_modules/.bin/cypress open\"`), then `npm install @shopware-ag/e2e-testsuite-platform` (the official E2E platform testsuite with custom commands and fixture/test-data helpers, built on Cypress plus plugins like cypress-select-tests, cypress-log-to-output, cypress-file-upload). Create `e2e/cypress/plugins/index.js` with `module.exports = require('@shopware-ag/e2e-testsuite-platform/cypress/plugins');` and `e2e/cypress/support/index.js` with `require('@shopware-ag/e2e-testsuite-platform/cypress/support');`. Run tests for the plugin from that e2e folder with `CYPRESS_baseUrl=<your-url> npm run open`, pointing at your Storefront URL, which opens the Cypress test runner.\n\nTests are written in the Mocha-style `describe()`/`it()` syntax, use `cy.get(...)` commands chained with actions like `.click()`/`.type()`, and Chai-based BDD assertions like `.should('be.visible')`. Use lifecycle hooks (`before`, `beforeEach`, `afterEach`, `after`) to set up/tear down state — Shopware's own tests prefer `beforeEach` cleanup over `after`/`afterEach` since a failed test may skip those. Test data should be created via the REST API rather than the UI: static JSON fixtures live in `e2e/cypress/fixtures` and are loaded with `cy.fixture()`; the built-in command `cy.createDefaultFixture('endpoint')` merges the JSON fixture with any overrides and posts it to the API. For entities needing IDs of already-existing data, write a custom fixture service extending `AdminFixtureService` (example given for a `ShippingFixtureService` that looks up rule/delivery-time IDs before creating the shipping method).","citations":["developer/guides/development/testing/index.md:8-23","developer/guides/development/testing/legacy/cypress/index.md:8-535"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/testing/legacy/cypress/index.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/testing/index.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/testing/e2e-playwright/index.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"dev-40":{"query":"How do I upgrade a Composer-based Shopware project from 6.6 to 6.7 — which composer.json constraint do I change, and which console commands do I run afterwards?","category":"dev","option":"fs-docs","answer":"The recommended path is the Shopware CLI upgrade wizard (`shopware-cli project upgrade`, run from a clean git working tree), which checks readiness, extension compatibility and Composer resolution, and applies the upgrade after you review the plan (non-interactive/dry-run mode is available via `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run`).\n\nIf doing it manually with Composer: 1) On a running environment, enable maintenance mode first: `bin/console sales-channel:maintenance:enable --all`. 2) In `composer.json`, adjust the required Shopware version constraint to the target version (6.7) — failing to change this constraint means `composer update` will just resolve to the currently installed version and no real upgrade happens; if you use the Commercial plugin, also update the `shopware/commercial` requirement to a compatible version. Then run `composer update --no-scripts` (the `--no-scripts` flag avoids running scripts that reference Shopware CLI commands, which only work once updated recipes are installed). 3) Optionally force-update Symfony Flex-managed config files with `composer recipes:update`, reviewing the changes before committing. 4) Finalize the update with `bin/console system:update:finish`, which runs the required update routines for the new version, including database migrations and recompiling themes. Afterward, disable maintenance mode with `bin/console sales-channel:maintenance:disable --all`.\n\nBest practices include starting from a clean git tree and a recoverable DB backup, testing on staging with production-like data first, reviewing release notes/changelogs/UPGRADE files, checking extension compatibility, avoiding skipping major versions without testing the full path, and committing `composer.json`/`composer.lock` with reviewed recipe changes. After updating: clear caches, rebuild Administration/Storefront assets if needed, and test checkout/login/API flows plus installed extensions.","citations":["developer/guides/upgrades-migrations/upgrade-shopware.md:7-108"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"6.7\\|upgrade\" docs/shopware-knowledge-bases/developer/guides/installation --include=*.md; find docs/shopware-knowledge-bases/developer/guides/installation -type f -not -path '*/.git/*'"},{"tool":"Bash","args":"grep -rli upgrade docs/shopware-knowledge-bases/developer --include=*.md | grep -v changelog"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/upgrade-shopware.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-41":{"query":"`composer update` to Shopware 6.7 aborts on a platform requirement and my admin build then fails too — which PHP, database and Node versions does 6.7 actually require, and how do I check the machine I am on against them before I retry?","category":"dev","option":"fs-docs","answer":"The developer docs 'Hosting' page lists the officially supported stack: PHP 8.2+ required (8.4 recommended), with memory_limit >= 512M, max_execution_time >= 30s, and required extensions ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, openssl, pcre, pdo_mysql, phar, simplexml, xml, xmlreader, zip, zlib (Composer 2.2+ recommended). Database: MariaDB >= 10.11.6 or MySQL >= 8.0.22 required (Innovation releases not supported), recommended MariaDB 11.4 / MySQL 8.4, with max_allowed_packet >= 32M. Node.js/npm: Node 20.0.0+ required, Node 24 / npm 10 recommended. To check your machine before retrying the composer update / admin build, the docs recommend running: `php -v` (CLI PHP version), `php -m` (list PHP modules), `php -i | grep memory_limit` (check memory limit), `composer -V` (Composer version), `node -v` and `npm -v` (Node/npm versions). Note that the docs warn multiple PHP versions/php.ini files (CLI vs FPM) may exist on a system, so verify you are checking the binary actually used to run Composer and the admin build.","citations":["developer/guides/hosting/index.md:1-47"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"grep -ril \"6.7\" docs/shopware-knowledge-bases/developer | head -50"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname \"*upgrade*\" -not -path \"*/.git/*\"; find docs/shopware-knowledge-bases/developer -iname \"*requirement*\" -not -path \"*/.git/*\"; find docs/shopware-knowledge-bases/developer -iname \"*migration*\" -not -path \"*/.git/*\" | head -30"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/upgrades-migrations -type f | sort"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/installation/system-requirements.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/upgrade-shopware.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/hosting -maxdepth 2 -type f | sort"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/index.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-42":{"query":"How do I check extension compatibility before upgrading with shopware-cli, and why does it report my plugins in custom/plugins as blocking?","category":"dev","option":"fs-docs","answer":"Run `shopware-cli project upgrade` (interactively) or in preflight/CI mode with `--no-interaction --target latest-patch --dry-run`. During phase 3 of the wizard it 'analyzes extension compatibility and runs a Composer resolution check': it combines extension/repository metadata (an early compatibility signal) with an actual Composer dry run that verifies whether the target dependency set can be resolved; Composer resolution is the final gate, and the extension queue is grouped into ready, needs update, needs manual review, or blocking. Before running the wizard you can also run `shopware-cli project validate` to detect references to removed/renamed Shopware PHP types in custom code. Plugins in custom/plugins are reported as blocking because the wizard 'resolves and pins extension versions with Composer,' and 'Extensions living outside vendor/, for example in custom/plugins, cannot participate in that resolution and therefore block the upgrade readiness check.' The fix is to migrate eligible locally-managed extensions to Composer first with `shopware-cli project autofix composer-plugins` (see 'Migrate custom/plugins extensions to Composer' in the autofix docs).","citations":["developer/products/tools/cli/project-commands/upgrade.md:1-160"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/tools/cli/project-commands/upgrade.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-43":{"query":"My admin plugin still ships a webpack.config.js — how do I move the administration build to Vite for Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Shopware switched the Administration build from Webpack to Vite in 6.7. For apps there is nothing to do since their build is already decoupled; for plugins you only need to act if you currently extend the webpack config via a custom `webpack.config.js`. To migrate: 1) create a new `vite.config.mts` file inside `YourApp/src/Resources/app/administration/src` (the old `webpack.config.js` lived in `YourApp/src/Resources/app/administration/build/`); 2) remove the old `webpack.config.js`; 3) remove webpack-related dependencies from `package.json`; 4) add the Vite dependencies to `package.json`. The doc shows an example: an old webpack `resolve.alias` config becomes `export default defineConfig({ resolve: { alias: { '@example': 'src/example' } } })` using `defineConfig` from `vite`. Migration complexity varies depending on how complex your webpack config was — consult the official Vite config docs for anything beyond basic aliasing. The build commands stay the same (`composer build:js:admin`, `composer watch:admin` for dev/HMR); bundle/plugin discovery still comes from `var/plugins.json` (generated via `php bin/console bundle:dump`), and the actual extension-building script lives at `<shopwareRoot>/src/Administration/Resources/app/administration/build/plugins.vite.ts`, which uses Vite's JS API to build each plugin's own `vite.config` located next to its entry file. Currently this is gated behind the `ADMIN_VITE` feature flag mentioned in the doc.","citations":["developer/guides/upgrades-migrations/administration/vite.md:1-159"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/administration/vite.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-44":{"query":"After the Vue 3 upgrade my admin plugin broke — this.$parent resolves to the wrong component and a prop default that calls this.$tc throws. What do I have to change?","category":"dev","option":"fs-docs","answer":"Both symptoms are documented known issues of the Vue 2 -> Vue 3 upgrade (administration uses Vue 3 from Shopware 6.6 onward). For `this.$parent`: 'this.$parent is prone to errors because Vue 3 wraps asynchronous components in an AsyncWrapperComponent. This leads to the virtual DOM tree differing between Vue 2 and Vue 3. Where in Vue 2, a this.$parent call was successful, in Vue 3, a this.$parent.$parent may be necessary.' The doc recommends avoiding this.$parent communication altogether and using services or event communication instead, since it's considered an anti-pattern. For the prop default issue: 'Prop default functions no longer have access to the component's this scope. You can no longer call this.$tc in default functions. Use Shopware.Snippet.tc instead.' More generally, the doc suggests searching your code for `this.<!doctype html>

 usages since these indicate use of Vue's internal API and are very likely to break, except for `this.$tc` (used outside of prop defaults).","citations":["developer/guides/upgrades-migrations/administration/vue3.md:1-139"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/upgrades-migrations -type f | sort"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/administration/vue3.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-45":{"query":"Shopware.State is deprecated in 6.7 — how do I convert my administration Vuex module into a Pinia store?","category":"dev","option":"fs-docs","answer":"With Shopware 6.7, Vuex is replaced by Pinia as the state management library for the administration. To migrate a Vuex module: register the store with `Shopware.Store.register('<storeName>', { state, getters, actions })` instead of exporting a namespaced Vuex options object. Key changes: `state` must become a function returning the initial state (e.g. `state: () => ({ ... })`) rather than a static object; Vuex `mutations` are removed entirely — modify state directly inside `actions` instead (e.g. `actions: { updateProductName(newName) { this.productName = newName; } }`); getters cannot share a name with a state property since both are exposed at the same level. You can also register with an `id` property in the definition object, and unregister a store with `Shopware.Store.unregister('<storeName>')`; re-registering an existing store id overwrites it. Registration from a component/index file changes from `Shopware.State.registerModule('product', productsStore)` (importing the module object) to simply `import './state/products.state';` since the store self-registers on import. Access changes from `Shopware.State.get('<storeName>')` to `Shopware.Store.get('<storeName>')`. Stores can also be typed in TypeScript by exporting `ReturnType<typeof store>` and extending the global `PiniaRootState` interface, or defined as composables (a function returning refs/computed/functions) registered via `Shopware.Store.register('<storeName>', function() {...})`. For testing, import the store file to register it and call `store.$reset()` in `beforeEach`; when testing components, create a Pinia instance with `createPinia()`, call `setActivePinia(pinia)` in `beforeEach`, and pass `plugins: [pinia]` to the component's global mount options.","citations":["developer/guides/upgrades-migrations/administration/pinia.md:1-263"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/administration/pinia.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-46":{"query":"sw-button and sw-card are deprecated in Shopware 6.7 — how do I migrate my plugin's admin templates to the Meteor components, and is there a codemod that does it?","category":"dev","option":"fs-docs","answer":"Yes, there is an official codemod. Shopware 6.7 replaces several administration components with components from the Meteor Component Library (Shopware's official shared component library built on the Shopware Design System). To migrate: 1) ensure you have a development installation of Shopware and that your plugin lives in the `custom/plugins` folder; 2) run `composer run admin:code-mods` (it prints help text) with arguments, e.g. `composer run admin:code-mods -- --plugin-name example-plugin --fix -v 6.7`, providing your plugin name and target Shopware version. The tool automatically replaces compatible components with Meteor Components, adds guidance comments for components that require manual migration, and fixes some other deprecated code where possible. For compatibility across both 6.6 and 6.7 without migrating immediately, Shopware components gained a new `deprecated` prop (default `false`, meaning the new Meteor Component renders by default); setting `deprecated` to `true` (e.g. `<sw-button deprecated />`) renders the old deprecated version in both 6.6 and 6.7, letting you keep one codebase for both versions. The docs still recommend migrating to Meteor Components whenever possible to align with future Shopware development, and point to per-component upgrade guides in the technical upgrade documentation for the release.","citations":["developer/guides/upgrades-migrations/administration/meteor-components.md:1-86"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/administration/meteor-components.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-47":{"query":"My payment plugin implements `AsynchronousPaymentHandlerInterface` and is tagged `shopware.payment.method.async` — how do I write a payment handler for Shopware 6.7 instead?","category":"dev","option":"fs-docs","answer":"From Shopware 6.7.0.0, payment handling is unified into a single `Shopware\\Core\\Checkout\\Payment\\Cart\\PaymentHandler\\AbstractPaymentHandler` class instead of the separate `PaymentHandlerInterface` variants. Per the migration table in the docs: the old `SynchronousPaymentHandlerInterface` maps to the `pay` method (always called during checkout); `AsynchronousPaymentHandlerInterface` maps to the `finalize` method (only called if `pay` returns a `RedirectResponse`); `PreparedPaymentHandlerInterface` maps to `validate` (always called, used to validate a cart during checkout); `RecurringPaymentHandlerInterface` maps to `recurring` (checked via `supports` returning true for `PaymentHandlerType::RECURRING`); `RefundPaymentHandlerInterface` maps to `refund` (checked via `supports` returning true for `PaymentHandlerType::REFUND`). Concretely: change your class to `extend AbstractPaymentHandler`, implement `supports(PaymentHandlerType $type, string $paymentMethodId, Context $context): bool`, implement `pay(Request $request, PaymentTransactionStruct $transaction, Context $context, ?Struct $validateStruct): ?RedirectResponse` (return a `RedirectResponse` for the async/redirect flow, or `null` for synchronous), and implement `finalize(Request $request, PaymentTransactionStruct $transaction, Context $context): void` to handle the customer's return from the external gateway (check for cancellation via the request, then set the transaction state, e.g. via `OrderTransactionStateHandler::paid()`). On the service definition, replace the old `shopware.payment.method.async` tag (and any of `shopware.payment.method.sync`, `.prepared`, `.recurring`, `.refund`) with the single new tag `shopware.payment.method`. Also note that starting with 6.7 a `technicalName` is required when registering the payment method (in the plugin's `install()`/`addPaymentMethod()`), using a unique, plugin-specific prefix; omitting it can prevent the plugin from installing or activating.","citations":["developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:1-847"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"AsynchronousPaymentHandlerInterface\\|shopware.payment.method.async\\|PaymentHandler\" docs/shopware-knowledge-bases/developer/guides | head -30"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"},{"tool":"Bash","args":"wc -l docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-48":{"query":"After upgrading, my storefront JavaScript plugin no longer loads — how do I register it asynchronously with `PluginManager` and where does the compiled file have to be shipped?","category":"dev","option":"fs-docs","answer":"Storefront JS plugins are registered in `<plugin root>/src/Resources/app/storefront/src/main.js`, which Shopware automatically looks for and loads as the storefront entry point. Standard synchronous registration is `PluginManager.register('ExamplePlugin', ExamplePlugin, '[data-example-plugin]')` after importing the plugin class at the top of `main.js`. To register it asynchronously instead, provide a dynamic import directly inside `PluginManager.register()` rather than a static top-of-file import: `PluginManager.register('ExamplePlugin', () => import('./example-plugin/example-plugin.plugin'), '[data-example-plugin]');` — 'If an async/dynamic import is provided, then the JS-plugin will be recognized as async by the PluginManager automatically. This means that, the registered JS-plugin will not be included in the main bundled JavaScript (storefront.js) by default. The JS-plugin will only be downloaded on-demand if the plugin selector ... is found on the current page.' The DOM must therefore still contain an element matching that selector (e.g. `<template data-example-plugin><\/template>`) for the plugin to load on a given page. On the compiled-asset side: Shopware compiles the JavaScript from the `main.js` entry point and saves the compiled version at `<plugin root>/src/Resources/app/storefront/dist/storefront/js/<plugin-name>/<plugin-name>.js`; these files are recognized automatically by Shopware, but you must 'make sure to ship the compiled file with your plugin as well.' To rebuild after changes, run `shopware-cli project storefront-build` (template projects) or `composer run build:js:storefront` (platform/contribution setup).","citations":["developer/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md:1-274"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"PluginManager\" docs/shopware-knowledge-bases/developer/guides/plugins | head -20"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-49":{"query":"My storefront controller still uses the `@Route` and `@RouteScope` annotations from 6.4 — what is the attribute form in Shopware 6.7 and how are the routes wired?","category":"dev","option":"fs-docs","answer":"Routes must be defined with PHP attributes rather than annotations. The dedicated `@RouteScope` annotation is explicitly called out as deprecated: 'Prior to Shopware 6.4.11.0 the _routeScope was configured by a dedicated annotation: @RouteScope. This way of defining the route scope is deprecated for the 6.5 major version.' Class-level route scope is now set with the `Symfony\\Component\\Routing\\Attribute\\Route` attribute using the `_routeScope` key in `defaults`, e.g. `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]])] class ExampleController extends StorefrontController { ... }` — this scope 'needs to be set for every route' and identifies which domain (storefront/api/etc.) the route belongs to. Individual methods get their own `#[Route(path: '/example', name: 'frontend.example.example', methods: ['GET'])]` attribute (the `_routeScope` default can also be repeated per-method if you need to override it there). Route names should use the `frontend`, `widgets`, `payment`, `api` or `store-api` prefixes to be recognized as Storefront routes (unless you explicitly allow custom names via `storefront.router.allowed_routes` config, a feature available since Shopware 6.7.2.0). Wiring: the controller class is registered as a public service in `<plugin root>/src/Resources/config/services.php` with `->public()->call('setContainer', [service('service_container')])`, and Shopware discovers the routes via a `<plugin root>/src/Resources/config/routes.php` file that imports the controller directory using the `attribute` type loader: `$routes->import('../../Storefront/Controller/*Controller.php', 'attribute');`.","citations":["developer/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:1-325"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"RouteScope\\|#\\[Route\" docs/shopware-knowledge-bases/developer/guides | head -20"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/controllers/add-custom-controller.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-50":{"query":"My `ScheduledTaskHandler` stopped running after the upgrade — how must a scheduled task and its handler be declared in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"A `ScheduledTask` and its `ScheduledTaskHandler` are both registered in the plugin's `services.php` (placed under `<plugin root>/src/Resources/config/`). The task class must be tagged `shopware.scheduled.task`, and the handler class must be tagged `messenger.message_handler` — both tags are required: 'Note the tags required for both the task and its respective handler, shopware.scheduled.task and messenger.message_handler.' Example: `$services->set(ExampleTask::class)->tag('shopware.scheduled.task'); $services->set(ExampleTaskHandler::class)->args([service('scheduled_task.repository'), service('logger')])->tag('messenger.message_handler');`. The task class must extend `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTask` and implement `getTaskName()` (a unique, vendor-prefixed technical name) and `getDefaultInterval()` (interval in seconds). The handler must extend `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTaskHandler`, be annotated with the Symfony attribute `#[AsMessageHandler(handles: ExampleTask::class)]` (from `Symfony\\Component\\Messenger\\Attribute\\AsMessageHandler`), and implement `run(): void` with the task's logic. If the handler doesn't run after an upgrade, verify: the task was (re-)registered — reinstalling the plugin registers it, or you can force it with `bin/console scheduled-task:register`; the `status` column for the task in the `scheduled_task` database table is `scheduled` (otherwise it won't execute); the `ScheduledTaskRunner` is dispatching due tasks via `bin/console scheduled-task:run`; and `bin/console messenger:consume` (or the admin worker) is actually processing the dispatched messenger messages. Since Shopware 6.7.13.0, a handler can also implement `DynamicallyScheduledTaskHandler` and its `getNextExecutionTime(ScheduledTask $task, ScheduledTaskEntity $taskEntity): ?\\DateTimeInterface` method to control the next run time based on custom domain data instead of the fixed `runInterval`.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md:1-174"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"ScheduledTaskHandler\" docs/shopware-knowledge-bases/developer/guides | head -20"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-51":{"query":"Custom entities declared in `Resources/config/entities.xml` no longer work for my plugin in Shopware 6.7 — how do I define and register a DAL entity with PHP attributes instead?","category":"dev","option":"fs-docs","answer":"Since Shopware v6.6.3.0, entities can be registered via PHP attributes instead of XML. Define your entity by creating a class extending `Entity` and adding the `#[Entity('entity_name', collectionClass: ...)]` attribute (collectionClass supported since 6.6.9.0). Mark the primary key property with `#[PrimaryKey]` and typically `#[Field(type: FieldType::UUID)]`. Add further properties using the `#[Field(type: FieldType::...)]` attribute (or a fully-qualified field class name since 6.6.9.0), and special attributes like `#[AutoIncrement]` or `#[ForeignKey(entity: '...')]` for special field types. To register the entity, add the class to the DI container in `services.php` and tag it with `shopware.entity`, e.g. `$services->set(Examples\\ExampleEntity::class)->tag('shopware.entity');`. Shopware then automatically registers an `EntityDefinition` and `EntityRepository` for you, available in the container as `<entity_name>.definition` and `<entity_name>.repository`. Other supported attributes include `#[Translations]`/`translated: true` on `Field` for translated fields (properties must be nullable), `#[Required]` to force validation, `#[CustomFields]` or the `EntityCustomFieldsTrait` for custom fields, `#[Serialized(serializer: ...)]` for JSON fields with custom serialization, and `#[OneToOne]`, `#[OneToMany]`, `#[ManyToOne]`, `#[ManyToMany]` for associations. Fields are not exposed via the API by default; set `api: true` (or a list of API source classes) on the `Field` attribute to expose them. With this attribute-based pattern you no longer need to hand-write getter/setter methods, an `EntityTranslationDefinition`, or (in most cases) an `EntityCollection` class.","citations":["developer/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md:1-621"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"grep -ril \"entities.xml\\|DAL entity\\|EntityDefinition\" docs/shopware-knowledge-bases/developer --include=*.md | head -30"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-52":{"query":"What must a plugin database migration class implement in Shopware 6.7, and where does the database cleanup on uninstall belong?","category":"dev","option":"fs-docs","answer":"A plugin migration class lives in the `Migration` directory relative to the plugin's base class (e.g. `src/Migration/Migration<timestamp><Description>.php`) and must extend `Shopware\\Core\\Framework\\Migration\\MigrationStep`, implementing `getCreationTimestamp(): int` (returning the timestamp embedded in the file name) and `update(Connection $connection): void`, where all schema and data changes for the plugin must be implemented — this is what Shopware runs automatically on plugin install/update. `MigrationStep` also defines an optional `updateDestructive()` method used by Shopware core for delayed, major-version destructive changes, but plugin install/update never runs `updateDestructive()`, and merchants/platforms generally don't run `database:migrate-destructive` for plugins either — so all plugin changes belong in `update()`. There is no migration rollback; instructions to reverse migrations are not added to the migration class. Cleaning up the database when the plugin is removed belongs in the plugin lifecycle method `uninstall`, as documented in the Plugin Lifecycle guide.","citations":["developer/guides/plugins/plugins/database/database-migrations.md:63-104"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"MigrationStep\\|database migration\" docs/shopware-knowledge-bases/developer/guides --include=*.md | grep -i migrat"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/database/database-migrations.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-53":{"query":"My theme config labels disappeared from the Theme Manager after 6.7 — how do I define `theme.json` config fields and where do their translations go now?","category":"dev","option":"fs-docs","answer":"Theme config is defined in `<plugin root>/src/Resources/theme.json` under the `config` property, which contains `fields` (and, before v6.8.0.0, also `blocks`, `sections`, `tabs`). Each field item's key is its technical name, and supported parameters are `label`, `helpText`, `type` (color, text, number, fontFamily, media, checkbox, switch, url), `editable`, `tab`, `block`, `section`, `custom`, `scss`, and `fullWidth`. `label` and `helpText` are now marked '*(Deprecated for v6.8: Translations are now handled via Administration snippets)*', and as of v6.7.1.0 the field/tab/block/section examples in the docs no longer carry inline `label` objects at all. Instead, translations live as Administration snippet keys, e.g. in `<plugin root>/src/Resources/app/administration/src/app/snippet/en.json` (locale-specific files like `en-GB.json` are also supported and override the base language file). Each key starts with `sw-theme`, followed by the theme's technical name (or its parent theme's name, since snippets inherit from the parent theme), then the names of the relevant tab/block/section/field (using `default` where an element is unnamed), and ends in `.label` (or `.helpText` for fields), e.g. `sw-theme.justAnotherTheme.default.exampleBlock.exampleSection.my-single-select-field.label`. After editing `theme.json`, run `bin/console theme:refresh` to put the changes into effect.","citations":["developer/guides/plugins/themes/configuration/theme-configuration.md:207-322","developer/guides/plugins/themes/configuration/theme-configuration.md:325-372"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"theme.json\\|Theme Manager\" docs/shopware-knowledge-bases/developer/guides --include=*.md | grep -i theme"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/themes/configuration/theme-configuration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-54":{"query":"How do I register a plugin cookie in the storefront cookie consent manager in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Adding custom cookies to the storefront cookie consent manager requires listening to `Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent` and adding your custom cookies to the collection carried by the event. Register an event listener in `<plugin root>/src/Resources/config/services.php` tagging it with `kernel.event_listener` for the event `Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent`. In the listener's `__invoke(CookieGroupCollectEvent $event)` method, get the desired `CookieGroup` from `$event->cookieGroupCollection` (e.g. via `CookieProvider::SNIPPET_NAME_COOKIE_GROUP_COMFORT_FEATURES`), fetch or create its `CookieEntryCollection` via `getEntries()`/`setEntries()`, then create a `CookieEntry('my-cookie-key')` with `name`, `value`, and `expiration` properties set, and add it to the entries collection. Since Shopware 6.7.3.0, cookies use structured objects (`CookieEntry` and `CookieGroup`) instead of arrays, and the old array format is deprecated. The previously used `CookieProviderInterface` is now deprecated in favor of `CookieGroupCollectEvent`, though it still works for backward compatibility with the old array syntax. Cookie groups should not carry `cookie`, `value`, `expiration`, or `isRequired` — those only apply to individual `CookieEntry` objects. Since 6.7.3.0, cookie configurations also include a hash tracking changes; when a plugin modifies its cookie config, the hash changes and users are re-prompted for consent (hash stored per language ID in the browser's `cookie-config-hash` cookie, and exposed via the Store API endpoint `/store-api/cookie/groups`). After registering, the new cookie shows up in the cookie consent manager on the storefront; see the follow-up guide 'Reacting to cookie consent changes' for implementing behavior once the cookie is accepted/declined.","citations":["developer/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md:1-155"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"cookie consent\\|CookieConfiguration\\|cookie manager\" docs/shopware-knowledge-bases/developer/guides --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-55":{"query":"How do the breaking storefront accessibility changes reach my theme in Shopware 6.7, and what must an extension that overrides the affected Twig blocks do?","category":"dev","option":"fs-docs","answer":"Breaking accessibility changes to the storefront HTML/Twig structure or CSS are not enabled by default because they can break extensions that modify the affected areas. Instead, they are shipped behind the feature flag `ACCESSIBILITY_TWEAKS=1` (set in `.env`), the same mechanism used for major version feature flags like `V6_7_0_0`. When the flag is enabled, all available accessibility improvements activate, letting you check whether your project/extension is affected and adapt in advance. With the major version v6.7.0, all these accessibility improvements become the default (the flag is effectively 'always on' from 6.7.0 onward). In practice, a Twig template that gets a breaking accessibility fix keeps both variants side by side: the old markup/block stays available under `{% else %}` while `{% if feature('ACCESSIBILITY_TWEAKS') %}` wraps the new, accessible markup, e.g. a list changed from `<div class=\"list-item\">` blocks under `component_list_items` to `<ul>/<li>` markup under a new block `component_list_items_inner`, with `@deprecated tag:v6.7.0` comments marking the old block for removal. An extension that overrides the affected Twig block (e.g. via `sw_extends`) must therefore extend/override *both* blocks during the transition — the new block (`component_list_items_inner`) to already support the accessible structure, and the old block (`component_list_items`) for compatibility with the flag disabled — and can drop the old-block override once v6.7.0 makes the new structure the default. After enabling the flag locally, run `bin/console theme:compile` to recompile styling changes (e.g. adjusted font sizes) so they take effect.","citations":["developer/guides/development/accessibility/storefront-accessibility.md:19-99","developer/guides/development/accessibility/storefront-accessibility.md:160-178"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"accessibility\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/accessibility/storefront-accessibility.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-56":{"query":"Header and footer are loaded through ESI sub-requests in Shopware 6.7, so page data is gone in my header template — how do I pass my own data into the header/footer now?","category":"dev","option":"fs-docs","answer":"Since header and footer are now loaded via ESI sub-requests (introduced so these rarely-changing parts of the page can stay cached longer), they are no longer dependent on the current page data, and customizing them based on page data requires adjusting the ESI loading with additional parameters. This happens in `Storefront/Resources/views/storefront/base.html.twig`, in the blocks `base_esi_header` and `base_esi_footer`. Extend `base.html.twig` in your plugin/app and override e.g. the header block to merge your own data into `headerParameters` before calling `{{ parent() }}`, for example: `{% block base_esi_header %}{% set headerParameters = headerParameters|merge({ 'vendorPrefixPluginName': { 'activeRoute': activeRoute } }) %}{{ parent() }}{% endblock %}` in `PLUGIN_ROOT/src/Resources/views/storefront/base.html.twig`. The `headerParameters`/`footerParameters` are passed to the header/footer route as query parameters and then through to the header/footer template, where they can be read (e.g. `headerParameters.vendorPrefixPluginName.activeRoute`) by extending `storefront/layout/header.html.twig`. This approach works in both plugins and apps. In plugins specifically, you can alternatively use the `StorefrontRenderEvent`: check `$event->getRequest()->attributes->get('_route') === 'frontend.header'`, then read/merge `$event->getParameter('headerParameters')` and call `$event->setParameter('headerParameters', $headerParameters)`. Important: `headerParameters` and `footerParameters` can only contain scalar values, since they double as query parameters for the ESI routes. It is also possible to load entirely custom header/footer templates (as the core does for the checkout confirm page), but this overwrites customizations from every other extension, and you must ensure `header`/`footer` data is still available if your custom template extends the original. For customizing header/footer without needing page data, see the separate 'Add data to storefront page' guide.","citations":["developer/guides/plugins/plugins/storefront/templates/customize-header-footer.md:1-104"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"ESI\\|sub-request\\|subrequest\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/templates/customize-header-footer.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-57":{"query":"B2B Suite support ends with 6.8 — how do I run the B2B Suite Migration to B2B Components and check that it finished?","category":"dev","option":"fs-docs","answer":"B2B Suite will no longer be supported starting Shopware 6.8, so the B2B Suite Migration extension is used to move data from B2B Suite to B2B Components. To start the migration run `bin/console b2b:migrate:commercial`, which transfers all components/entities as defined in the configuration. You can target specific components (technical names from the configurator) with `bin/console b2b:migrate:commercial component_name_1 component_name_2` (e.g. `bin/console b2b:migrate:commercial quote_management shopping_list`); note `employee_management` is always migrated first regardless of order, since it is a prerequisite for all other B2B components, and the migration order overall is governed by configurator priority defined in the service definition file, not command argument order. You can control batch size with `--batch-size=100` to manage memory/performance. The migrate command uses the message queue to process in the background, so the migration can still be running after the command returns. To check that it finished, run `bin/console b2b:migrate:progress` in a separate terminal (recommended to run simultaneously with the migrate command); it shows a table with Total/Valid/Newly/Migrated/Pending/Error record counts per component and a Status column (`Complete`, `Pending`, `In progress`, `Complete with error` — check `b2b_components_migration_errors` table — or `Has new records`). Add `--watch` to `b2b:migrate:progress` to auto-refresh output every 5 seconds. One component-specific note: for Budget Management, the Organization Unit of each budget will be empty after migration and must be manually reassigned in B2B Commercial afterward (Budget Management is available from Commercial 7.6.0+).","citations":["developer/products/extensions/b2b-suite-migration/index.md:1-23","developer/products/extensions/b2b-suite-migration/execution/running-migration.md:1-102"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"ESI\\|sub-request\\|subrequest\" docs/shopware-knowledge-bases/developer --include=*.md (also surfaced b2b-suite-migration paths)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/extensions/b2b-suite-migration/index.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/products/extensions/b2b-suite-migration -not -path '*/.git/*' -type f"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/extensions/b2b-suite-migration/execution/running-migration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-58":{"query":"My shopware.yaml still uses redis_url — how do I define the named Redis connections in Shopware 6.7 and which eviction policy does each one need?","category":"dev","option":"fs-docs","answer":"Starting with v6.6.8.0, Shopware supports configuring multiple named, reusable Redis connections in `config/packages/shopware.yaml` under `shopware.redis.connections`, each with its own `dsn`, e.g.:\n```yaml\nshopware:\n    redis:\n        connections:\n            ephemeral:\n                dsn: 'redis://host1:port/dbindex'\n            persistent:\n                dsn: 'redis://host2:port/dbindex'\n```\nConnection names should reflect their purpose/type, be unique, and follow service naming conventions since they're used as part of container service names; after defining them you reference them by name in the configuration of different subsystems. Environment variables can be used in the DSN (e.g. `%env(REDIS_EPHEMERAL)%/1`), and for high-load scenarios you can enable connection pooling by appending `?persistent=1` to the DSN (this affects connection reuse, not data persistence).\n\nBecause current Redis versions can't apply different eviction policies to different databases within one instance, Shopware recommends separate Redis instances/connections per data category, each needing a specific eviction policy:\n1. Ephemeral data (HTTP cache & object cache) — use `volatile-lru`, since the app explicitly sets a TTL on each cache item, so only expired data should be auto-evicted. In-memory only, no persistence needed.\n2. Durable but 'aging' data (sessions) — use `allkeys-lru` and configure Redis persistence (RDB snapshots and/or AOF), since more recent data is more important and the oldest values should be discarded when memory is full.\n3. Durable and critical data (cart, number ranges, lock store, increment data) — use `volatile-lru` and persist to disk, since this data is critical and must not be deleted before it expires.","citations":["developer/guides/hosting/infrastructure/redis.md:1-109"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"redis_url\\|redis:\" docs/shopware-knowledge-bases/developer/guides --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/infrastructure/redis.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-59":{"query":"After upgrading to Shopware 6.7 my Varnish cache is never invalidated — what changed in the reverse proxy configuration?","category":"dev","option":"fs-docs","answer":"Two things changed around 6.6/6.7 that commonly break Varnish invalidation after upgrading: (1) The old Varnish-with-Redis BAN integration (using LUA scripts to determine URLs for the BAN request) has been deprecated from v6.6.x onward and is removed in v6.7.0. If your `config/packages/storefront.yaml`/`shopware.yaml` still configures the reverse proxy for the Redis/BAN-based approach, it will no longer work — you must switch to the Varnish `XKey` integration instead, setting `use_varnish_xkey: true` under `shopware.http_cache.reverse_proxy` (also note the config key itself moved from `storefront.reverse_proxy` to `shopware.http_cache.reverse_proxy` starting with Shopware 6.6). XKey requires the Varnish `xkey` module (Varnish 6.0+) and the Shopware default VCL configured for xkeys (see the Shopware Varnish Docker image). (2) The cache-clearing commands changed: `bin/console cache:clear` clears and warms the application cache, and in versions *before* 6.7 it also cleared the HTTP cache — meaning as of 6.7 `cache:clear` no longer clears the HTTP/reverse-proxy cache. To explicitly clear the reverse proxy cache (or the `http` cache pool if the reverse proxy isn't enabled) use `bin/console cache:clear:http` (available since 6.6.10), or `bin/console cache:clear:all` to clear everything including HTTP cache and cache pools (since 6.6.8). The Reverse Proxy Cache shares the same invalidation mechanism and tags as the Object Cache, so when a product is invalidated both the object cache and HTTP cache are normally invalidated together — but if you're still relying on the removed Redis/BAN mechanism, or on the pre-6.7 behavior of `cache:clear` also flushing HTTP cache, invalidation will silently stop happening after the 6.7 upgrade.","citations":["developer/guides/hosting/infrastructure/reverse-http-cache.md:36-69","developer/guides/hosting/infrastructure/reverse-http-cache.md:219-237"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"varnish\\|reverse proxy\" docs/shopware-knowledge-bases/developer/guides --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/infrastructure/reverse-http-cache.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-60":{"query":"Which transports do my Shopware message queue workers have to consume in production, and how do I turn off the admin worker?","category":"dev","option":"fs-docs","answer":"On production, the message queue should be processed via CLI workers instead of the browser-based admin worker. Run one or more `messenger:consume` workers, e.g. `bin/console messenger:consume async --time-limit=60 --memory-limit=128M`, and pass multiple transport names to consume/prioritize several transports at once, e.g. `bin/console messenger:consume async low_priority` (Symfony consumes them in the given priority order). By default Shopware's environment variables define these transports: `MESSENGER_TRANSPORT_DSN` (default async transport, e.g. `doctrine://default`), `MESSENGER_TRANSPORT_LOW_PRIORITY_DSN` (low priority, e.g. `doctrine://default?queue_name=low_priority`), and `MESSENGER_TRANSPORT_FAILURE_DSN` (failed messages, e.g. `doctrine://default?queue_name=failed`) — you must also set up a CLI worker for the failed transport, otherwise failed messages never get processed/retried (they're retried automatically 3 times before being deleted). Use a process control system such as systemd or supervisor (or a cron job, which lacks max-worker-count control) to keep the CLI workers running.\n\nOnce the CLI worker is set up, turn off the admin worker in `config/packages/shopware.yaml`:\n```yaml\nshopware:\n    admin_worker:\n        enable_admin_worker: false\n```\nConversely, if you do want to use the admin worker, you must explicitly list every transport it should poll and a poll interval, e.g. `enable_admin_worker: true`, `poll_interval: 30`, `transports: [\"async\", \"low_priority\"]` — the poll interval is how long (in seconds) the admin worker polls the queue before the request terminates and the Administration issues a new request.","citations":["developer/guides/hosting/infrastructure/message-queue.md:14-153"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"admin worker\\|messenger:consume\\|message queue\" docs/shopware-knowledge-bases/developer/guides --include=*.md | head -20"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/infrastructure/message-queue.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-61":{"query":"After the upgrade my Elasticsearch index has to be rebuilt — where do I set the shard and replica counts and which reindex command do I run?","category":"dev","option":"fs-docs","answer":"Shopware defaults to three shards and three replicas for the created index. To override this, create/edit `config/packages/elasticsearch.yml` with an `elasticsearch.index_settings` block, e.g. `number_of_shards: 1` and `number_of_replicas: 0` (this configuration option is available since Shopware 6.4.12.0). Before indexing, clear the cache with `bin/console cache:clear`. For a basic Elasticsearch index run `bin/console es:index`. To reindex the whole shop (Elasticsearch, SEO URLs, product index, etc.) use `bin/console dal:refresh:index --use-queue` (use `--use-queue` since there are usually too many products to index synchronously — this requires the message queue workers to be running). If the index was created without errors but products still don't show in the Storefront, some systems additionally require `bin/console es:create:alias` to be run manually.","citations":["developer/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md:140-175"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"grep -ril \"elasticsearch\" docs/shopware-knowledge-bases/developer --include=*.md | head -30"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-62":{"query":"I changed a setting in `.env` on a deployed 6.7 shop but it still behaves the old way — what takes precedence between `.env`, `.env.local` and the real environment variables, and which settings does Shopware not read from `.env` at all?","category":"dev","option":"fs-docs","answer":"The corpus does not give an explicit precedence order between `.env`, `.env.local` and real process environment variables (that ordering is inherited from Symfony's dotenv component and isn't spelled out in the Shopware docs found). What it does document: environment variables are meant for secrets, infrastructure values, and deployment-specific values, and can live in `.env`, `.env.local`, the server/container environment, or the deployment platform (developer/guides/hosting/configurations/shopware/index.md:23). In production, Symfony/Shopware recommends compiling everything into a `.env.local.php` file instead of parsing `.env` on every request — since 6.4.15.0 this is done with `bin/console system:setup --dump-env` or `bin/console dotenv:dump {APP_ENV}`; if such a compiled file exists, editing `.env` afterwards has no effect until you regenerate it, which is a likely cause of 'still behaves the old way' (developer/guides/hosting/performance/performance-tweaks.md:222-227). As for settings Shopware does NOT read from `.env` at all: shop settings that merchants can change via the Administration, the Admin API, or app/plugin code are database-backed system configuration, stored in the database, not read from `.env` (developer/guides/hosting/configurations/shopware/index.md:20). Additionally, 'static system configuration' set under `shopware.system_config` in `config/packages/*.yaml` is an overlay that overrides the database-loaded configuration; if the same key is set there, the Administration value (and any attempt to set it via env var indirection) can no longer be changed by the user (developer/guides/hosting/configurations/shopware/static-system-config.md:14-18).","citations":["developer/guides/hosting/configurations/shopware/index.md:1-31","developer/guides/hosting/performance/performance-tweaks.md:215-229","developer/guides/hosting/configurations/shopware/static-system-config.md:1-58"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/configurations/shopware/environment-variables.md"},{"tool":"Bash","args":"grep -rl \"env.local\\|APP_ENV\\b.*precedence\\|real environment variables\\|System Config\" docs/shopware-knowledge-bases/developer --include=*.md -i | xargs grep -l \"\\.env\" | head -20"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/configurations/shopware/static-system-config.md"},{"tool":"Bash","args":"grep -n \"\\.env\\.local\\|precedence\\|override\" docs/shopware-knowledge-bases/developer/guides/installation/legacy-setups/symfony-cli-setup.md docs/shopware-knowledge-bases/developer/guides/hosting/configurations/shopware/index.md docs/shopware-knowledge-bases/developer/guides/development/start-developing.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/configurations/shopware/index.md"},{"tool":"Bash","args":"grep -rn \"\\.env\\.local\\.php\\|env vars take precedence\\|takes precedence\\|real environment variable\" docs/shopware-knowledge-bases/developer -i --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/performance/performance-tweaks.md, offset=215, limit=15"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"dev-63":{"query":"I deployed a plugin update to a 6.7 staging shop and my new migration never ran — which `bin/console` command applies the pending migrations of that one plugin, and what do I have to pass to it?","category":"dev","option":"fs-docs","answer":"Use `bin/console database:migrate <identifier> --all`, where `<identifier>` is your plugin's bundle name (e.g. `SwagBasicExample`). By default the identifier is set to run Shopware Core migrations, so to run a specific plugin's pending migrations you must explicitly pass that plugin's bundle name as the identifier argument, e.g. `./bin/console database:migrate SwagBasicExample --all`. Note: when installing a plugin or updating it via the Plugin Manager, all new migrations normally run automatically as part of that process (the migration directory is registered in a MigrationCollection) — `database:migrate` is documented as the manual way to run newly created migrations by hand during development, e.g. if migrations were added after the plugin was already installed.","citations":["developer/guides/plugins/plugins/database/database-migrations.md:162-178"],"toolCallLog":[{"tool":"Bash","args":"grep -rn \"migration:migrate\" docs/shopware-knowledge-bases/developer --include=*.md | head -20"},{"tool":"Bash","args":"grep -rln \"migration\" docs/shopware-knowledge-bases/developer --include=*.md -i | grep -i plugin"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/database/database-migrations.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-64":{"query":"How do I get an Admin API OAuth token — with client_credentials for an integration, or the password grant for local testing — and how long is each token valid?","category":"dev","option":"fs-docs","answer":"For an integration (the recommended/default approach), create an integration in the Administration under Settings → System → Integrations, with the 'Administrator' toggle enabled, then use its Access key ID as `client_id` and Secret access key as `client_secret`: `curl -s \"http://127.0.0.1:8000/api/oauth/token\" -H \"Content-Type: application/json\" -d '{\"grant_type\": \"client_credentials\", \"client_id\": \"YOUR_ACCESS_KEY_ID\", \"client_secret\": \"YOUR_SECRET_ACCESS_KEY\"}'`. The response is `{\"token_type\": \"Bearer\", \"expires_in\": 3600, \"access_token\": \"...\"}` — i.e. the client_credentials token is valid for 3600 seconds (1 hour). For local development only, there is a password-grant shortcut using the default Administration credentials: `curl -X POST \"http://localhost:8000/api/oauth/token\" -H \"Content-Type: application/json\" -d '{\"grant_type\": \"password\", \"client_id\": \"administration\", \"scopes\": \"write\", \"username\": \"admin\", \"password\": \"shopware\"}'`, which returns `{\"token_type\": \"Bearer\", \"expires_in\": 600, \"access_token\": \"...\", \"refresh_token\": \"...\"}` — i.e. valid for 600 seconds (10 minutes), but it also comes with a refresh_token (the client_credentials response shown does not). The docs state client_credentials should remain the default approach and the password grant is only a local shortcut.","citations":["developer/guides/development/integrations-api/index.md:76-111","developer/guides/development/integrations-api/auth-api-requests.md:11-40"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"client_credentials\\|grant_type\" docs/shopware-knowledge-bases/developer --include=*.md | head -20"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/auth-api-requests.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/index.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-65":{"query":"What can I put in the JSON body of `POST /api/search/{entity}` for filtering, associations, sorting, aggregations and getting an exact total count?","category":"dev","option":"fs-docs","answer":"The search criteria JSON body supports these top-level parameters: `associations` (load related data, similar to a SQL join, and can nest its own criteria such as limit/filter/sort), `includes` (restrict returned fields per entity/apiAlias), `ids` (lookup by a list of IDs), `total-count-mode`, `page`/`limit` (1-indexed pagination), `filter` (filters results and aggregations, using the same filter types as the DAL), `post-filter` (filters results but not aggregations), `query` (weighted ranking search producing a `_score`), `term` (simple text search across weighted fields, not to be combined with `query`), `sort` (array of `{field, order, naturalSorting, type}`; `type: count` sorts by association count), `aggregations` (metrics/facets, e.g. `avg`), and `grouping` (group results by one or more fields, e.g. one product per manufacturer). For an exact total count, set `total-count-mode: 1` — this determines the exact total (used for exact pagination) but is performance-intensive since it requires `SQL_CALC_FOUND_ROWS`. `total-count-mode: 0` (default) computes no total for best performance, and `2` only determines whether there is a next page (good for infinite scrolling).","citations":["developer/guides/development/integrations-api/search-criteria.md:8-176","developer/guides/development/integrations-api/search-criteria.md:317-442"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/search-criteria.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-66":{"query":"Which request headers change Admin API behaviour for language, entity version, parent-child inheritance and skipping flow triggers during a bulk import?","category":"dev","option":"fs-docs","answer":"`sw-language-id` — returns entities translated into the given language ID instead of the default system language (e.g. `POST /api/search/product` with header `sw-language-id: be01bd336c204f20ab86eab45bbdbe45`). If no explicit translation exists for that language, the plain field will be null; use `product.translated.[value]` for a resolved fallback. `sw-version-id` — tells the API which version of a versioned entity (e.g. orders) to return, since by default only the most recent record is returned (e.g. `POST /api/search/order` with header `sw-version-id: 0fa91ce3e96a4bc2be4bd9ce752c3425`). `sw-inheritance` — tells the API to apply parent-child inheritance (e.g. product variants inheriting from their parent product); without it, only the record's own fields are returned (e.g. `POST /api/search/product` with header `sw-inheritance: 1`). `sw-skip-trigger-flow` — skips flow triggers (e.g. 'send email on customer creation') during operations like a bulk Sync API import of large data sets, so flows aren't fired hundreds of thousands of times (e.g. `POST /api/_action/sync` with header `sw-skip-trigger-flow: 1`).","citations":["developer/guides/development/integrations-api/request-headers.md:12-52"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/request-headers.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-67":{"query":"What does a minimal app folder and `manifest.xml` need to contain, and which console commands install and activate the app on my local Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Apps live under `custom/apps/<AppName>` in the Shopware project, with each app in its own folder containing a `manifest.xml` (e.g. `custom/apps/MyExampleApp/manifest.xml`). The folder name must match the `<meta><name>` value in the manifest. A minimal manifest needs a `<meta>` block with `<name>`, `<label>` (optionally per-language), `<description>` (optionally per-language), `<author>` (required — `app:refresh` fails if missing/empty), `<copyright>` (required, same reason), `<version>`, `<icon>`, and `<license>`. Commands: run `bin/console app:refresh` first to refresh the app registry and pick up any manually created app; then install with `bin/console app:install --activate MyExampleApp` (use the technical name from `<meta><name>`, not a filesystem path). Omitting `--activate` installs the app inactive — activate it afterward in th
