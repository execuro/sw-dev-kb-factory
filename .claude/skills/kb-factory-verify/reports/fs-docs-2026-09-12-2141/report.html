e Administration under Extensions → My Extensions → Apps, or via `bin/console app:activate MyExampleApp`. Use `bin/console app:list` to check the current app list, `bin/console app:validate` to find configuration issues, and `--no-validate` on `app:install` to skip validation while debugging. After activating, clear caches with `bin/console cache:clear` (and optionally `cache:clear:http` or `cache:clear:all`).","citations":["developer/guides/plugins/apps/app-base-guide.md:38-120"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/apps -maxdepth 2 -not -path '*/.git/*' | sort"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/apps/app-base-guide.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-68":{"query":"How does the registration handshake between Shopware and my app backend work — shop id, proof, shop secret and the confirmation call?","category":"dev","option":"fs-docs","answer":"Registration happens during app installation, only when the app backend and Shopware need to communicate (e.g. Admin Module, Payment Method, Tax providers, Webhooks). 1) Registration request: Shopware sends a GET request to the URL in the app's manifest, with query parameters `shop-id`, `shop-url`, and `timestamp`, plus headers `shopware-app-signature` (HMAC-SHA256 of the query string signed with the app's `app-secret`), `sw-version`, and (on re-registration) `shopware-shop-signature` signed with the shop's current shop-secret. The app must recalculate `hash_hmac('sha256', $queryString, $appSecret)` and compare to verify the request is from an authenticated Shopware shop. Timeout for requests against the app server is 5 seconds. 2) Registration response: on success the app must return JSON with a `proof` (SHA-256 HMAC of the concatenation of `shopId`, `shopUrl`, and the app's name, signed with `app-secret`), a randomly generated `secret` (the 'shop-secret', unique per shop, min 64 / max 255 characters, used to sign all future requests from this shop), and a `confirmation_url`. Example: `{\"proof\": \"94b42d...\", \"secret\": \"random secret string\", \"confirmation_url\": \"https://my.example.com/registration/confirm\"}`. 3) Confirmation request: if the proof matches, Shopware completes registration and sends a POST to the app's `confirmation_url` with body containing `apiKey`, `secretKey` (used as OAuth `client_id`/`client_secret` for the Admin API), `timestamp`, `shopUrl`, and `shopId`. This request is signed with the shop-secret the app provided, in the `shopware-shop-signature` header; the app must recalculate `hash_hmac('sha256', $requestBody, $shopSecret)` to verify it. During re-registration, an additional `shopware-shop-signature-previous` header (signed with the previous shop-secret) lets the app verify continuity, and the app must generate a new shop-secret while optionally accepting the old one in parallel briefly (e.g. 1 minute) to avoid breaking in-flight requests.","citations":["developer/guides/plugins/apps/lifecycle/app-registration-setup.md:14-268"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/apps/lifecycle/app-registration-setup.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-69":{"query":"How does an app subscribe to an event like `product.written`, what does Shopware POST to the webhook URL, and how do I verify the request is genuine?","category":"dev","option":"fs-docs","answer":"To subscribe to an event, add a `<webhooks>` element with a `<webhook>` entry in the app's manifest.xml, giving it a `name`, a `url` (the endpoint to be called), and the `event` to hook into, e.g. `<webhook name=\"product-changed\" url=\"https://example.com/event/product-changed\" event=\"product.written\"/>` — every time a matching event fires, Shopware sends a POST request with a JSON body to that URL. The body has: `data.event` (the event name), `data.payload` (an array of change entries — for `entity.written` events like `product.written`, each entry contains `entity`, `operation`, `primaryKey` (the entity's id, since payloads don't include full/possibly-stale entity data — the app should fetch fresh data via the Shop API), and `updatedFields`); `source.url` (URL to reach the Shopware instance/API), `source.appVersion`, `source.shopId`, `source.eventId` (a stable id even across retries, since 6.4.11.0); and top-level `timestamp` (time the webhook was handled, usable to reject stale/replayed requests, since 6.4.1.0). Headers sent include `sw-version` (since 6.4.1.0), and since 6.4.5.0 `sw-context-language` and `sw-user-language`. To verify authenticity, check the `shopware-shop-signature` header: it is a SHA-256 HMAC of the request body, signed with the shop-secret the app assigned to that shop during registration — the same verification mechanism as for the app registration confirmation request. Optionally, adding `onlyLiveVersion=\"true\"` to a `<webhook>` element (since 6.5.7.0) restricts the webhook to firing only for the live version of an entity (filtering out drafts), applicable only to `HookableEntityWrittenEvent`-based events; default is `false`.","citations":["developer/guides/plugins/apps/lifecycle/webhook.md:8-146"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/apps/lifecycle/webhook.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-70":{"query":"How do I implement a payment method in an app with `pay-url` and `finalize-url`, and what must the app server return in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Define the payment method(s) in the manifest, identified by app name + your chosen identifier (don't change the identifier after release or new payment methods get created). Whether a `finalize-url` is defined determines synchronous vs asynchronous payment: no `finalize-url` means the internal Shopware payment handler defaults to synchronous; if you also omit `pay-url`, the transaction just stays open with no app communication. Asynchronous flow: (1) Shopware sends a POST to `pay-url` with `source`, `orderTransaction`, `order`, and `returnUrl`; the app responds with `redirectUrl` pointing to the payment provider. (2) The customer's browser is redirected there, completes payment, and the provider redirects back to `returnUrl`. (3) Shopware then sends a second POST to `finalize-url` containing `orderTransaction` and `requestData` (all query params the provider passed back). The app responds with a `status` (and optionally a `message` for failing states). Synchronous flow: Shopware POSTs to `pay-url` with `source`, `orderTransaction`, `order`; app responds with just a `status` (e.g. `{\"status\": \"authorize\"}`), optionally with a `message`. Valid `status` values include `open`, `paid`, `cancelled`, `refunded`, `failed`, `authorize`, `unconfirmed`, `in_progress`, `reminded`, `chargeback` (and for finalize, commonly `cancel`, `fail`, `paid`, `authorize`). Important 6.7 requirement: starting with Shopware 6.7.0.0, the app server MUST respond with a payment state (`status`) in its response for pay, finalize, prepared-payment validate/pay, refund, and recurring-capture calls if it intends to change the transaction state — this is explicitly called out for each flow. All requests/responses are signed JSON, using the same signing/verification mechanism as app registration/webhooks.","citations":["developer/guides/plugins/apps/checkout/payment.md:8-368","developer/guides/plugins/apps/checkout/payment.md:773-787"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/apps/checkout/payment.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-71":{"query":"How does an app define its own custom entities in Shopware 6.7 and read them back through the API?","category":"dev","option":"fs-docs","answer":"An app defines custom entities by registering them in the app's Resources/entities.xml file, declaring an <entity> element (e.g. name=\"custom_entity_bundle\") with a <fields> block containing field types such as string, price and many-to-many, each of which can be marked store-api-aware=\"true\" to expose them via the Store API. A full XML reference for the entities file structure is linked from this page (resources/references/app-reference/entities-reference.md). Once registered, every custom entity automatically gets a repository, which is available in App Scripts (e.g. `services.repository.search('custom_entity_blog', criteria)` in Twig), and can also be read back through the Admin API by POSTing to a search endpoint named after the entity, e.g. `POST /api/search/custom-entity-blog`. Apps have full access rights to their own custom entities by default (no permission entry needed), though associations to core tables still require the normal permission entries in the manifest. Custom entities can also be linked to custom fields (since 6.5.1.0) by adding custom-fields-aware=\"true\" and a label-property attribute on the entity so it appears in the 'Entity Select' custom field type. Since 6.4.15.0, entity names can use a shorthand `ce_` prefix (e.g. ce_bundle) to avoid DB name length restrictions; if used, the same prefixed name must be used consistently in the repository and API calls (e.g. POST /api/search/ce_blog), and renaming an existing custom entity is not supported since it deletes existing data.","citations":["developer/guides/plugins/apps/custom-data/custom-entities.md:1-128"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/index.md"},{"tool":"Bash","args":"grep -ril \"custom entity\" <home>/projects/host-project/docs/shopware-knowledge-bases/developer | head -30"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/apps/custom-data/custom-entities.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-01":{"query":"How do I configure Shopware 6's built-in GraphQL API for the Store API?","category":"edge","category_note":"false premise","option":"fs-docs","answer":"This premise does not match the corpus: Shopware 6 does not ship a built-in GraphQL API. A repo-wide grep for 'graphql' inside the developer docs layer returned no matches at all, and the API concept page explicitly describes only two HTTP/JSON-based APIs — the Store API (customer-facing, publicly accessible, contextual headers, authentication only needed for customer-specific endpoints) and the Admin API (administrative/system-level, OAuth 2.0) — both built on 'HTTP-based APIs' exchanging JSON payloads with search-criteria abstraction, not GraphQL. There is therefore no 'GraphQL API' configuration to document for the Store API in this corpus.","citations":["developer/concepts/api/index.md:8-27"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"graphql\" docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"grep -rli \"store api\" docs/shopware-knowledge-bases/developer --include=*.md | grep -i \"concept|index|reference\""},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/concepts/api/index.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"edge-02":{"query":"How do I get the DI container with `Shopware()->Container()` and override the product listing Smarty template in Shopware 6?","category":"edge","option":"fs-docs","answer":"Both parts of this question describe Shopware 5 APIs that do not exist in Shopware 6 — a grep for 'Shopware()->Container()' and for 'smarty' across the entire developer docs layer returned zero matches. Shopware 6 uses Symfony's service container and dependency injection instead: services are registered/autowired via services.php/services.xml and injected as constructor parameters (for example, injecting `SystemConfigService` into a custom service's constructor), following standard Symfony DI rather than a global `Shopware()->Container()` helper. Templating in Shopware 6's Storefront is done with Twig, not Smarty: to override a template such as the product listing, a plugin registers its own `<plugin root>/src/Resources/views` directory, mirrors the exact core path of the target `.html.twig` file under that directory (found by searching the Storefront core, e.g. `Storefront/Resources/views/storefront/...`), and creates a file at the same relative path that extends the original and overrides its Twig blocks.","citations":["developer/guides/plugins/plugins/services/dependency-injection.md:20-53","developer/guides/plugins/plugins/storefront/templates/customize-templates.md:24-52"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"smarty\" docs/shopware-knowledge-bases/developer; grep -rli \"Shopware()->Container()|Shopware()->\" docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"grep -rli \"dependency injection|di container\" docs/shopware-knowledge-bases/developer/concepts"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname \"*template*\" -not -path \"*/.git/*\""},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/templates/customize-templates.md, limit=60"},{"tool":"Bash","args":"grep -rli \"service container|dependency injection\" docs/shopware-knowledge-bases/developer/guides/plugins"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/plugin-fundamentals -iname \"*service*\""},{"tool":"Bash","args":"grep -n \"services.xml|autowire|dependency injection|DI container|Symfony\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins/plugin-fundamentals/index.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/services/index.md, limit=80"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/services/dependency-injection.md, limit=60"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"edge-03":{"query":"Where do the `#[ORM\\Entity]` mapping attributes for my plugin's entity go in Shopware 6, and how do I get Doctrine's `EntityManager` injected into my service so I can persist it?","category":"edge","option":"fs-docs","answer":"This premise doesn't apply to Shopware 6: the docs state explicitly, 'In contrast to most Symfony applications, Shopware uses no ORM, but a thin abstraction layer called the data abstraction layer (DAL).' There is no Doctrine `EntityManager` or `#[ORM\\Entity]` attribute mapping in Shopware 6 plugin development. Instead, plugin entities are defined via DAL EntityDefinition classes, and persistence goes through an `EntityRepository` rather than an EntityManager. To use it, you get the repository injected into your service via the Symfony Dependency Injection Container using constructor injection — e.g. `public function __construct(EntityRepository $productRepository)` — which is auto-wired if the type/argument names match, or can be configured explicitly by referencing the `<entity>.repository` service (e.g. `product.repository`).","citations":["developer/concepts/framework/data-abstraction-layer.md:10-48"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"doctrine|EntityManager|ORM\\\\Entity\" docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/concepts/framework/data-abstraction-layer.md, limit=50"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"edge-04":{"query":"How do I fetch products with `GET /sales-channel-api/v3/product` on Shopware 6.7?","category":"edge","option":"fs-docs","answer":"This endpoint path does not match the current Shopware 6.7 API. Searching the developer docs layer for 'sales-channel-api' only turns up two old (2020) architecture decision records that mention it alongside the store-api as a legacy naming, not any current guide or reference. The current, documented customer-facing API guide states Shopware provides two HTTP APIs — the Admin API (base path `/api/*`) and the Store API for storefront-facing interactions such as products/listings, carts, and checkout (base path `/store-api/*`, with local reference at `/store-api/_info/stoplightio.html`). So on 6.7 you would fetch products via the Store API (e.g. under `/store-api/...`, requiring a Sales Channel access key for headless use), not via a `/sales-channel-api/v3/product` route — the corpus gives no evidence such a versioned `sales-channel-api` endpoint currently exists.","citations":["developer/guides/development/integrations-api/index.md:12-52"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"sales-channel-api\" docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"grep -n \"sales-channel-api\" docs/shopware-knowledge-bases/developer/resources/references/adr/2020-07-02-implement-sales-channel-context-token-requirement.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/index.md, limit=60"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"edge-05":{"query":"How do I enable Shopware's built-in MCP server on a Shopware 6.6.x shop?","category":"edge","option":"fs-docs","answer":"This isn't possible on Shopware 6.6 according to the corpus: the MCP server's version requirements explicitly start at Shopware 6.7.11.0. The Getting Started guide's prerequisites list 'Shopware 6.7.14.0 or later. On 6.7.11.0 to 6.7.13.x, set MCP_SERVER=1 in your .env file first...' and the Configuration page states the same range, noting that on 6.7.11.0-6.7.13.x the server is gated behind the MCP_SERVER feature flag (set MCP_SERVER=1 in .env), and that starting with 6.7.14.0 the flag is removed and the MCP server is always enabled (MCP classes remain marked experimental until 6.8.0). There is no mention anywhere in the docs of MCP server support on 6.6.x, so a 6.6 shop would need to be upgraded to at least 6.7.11.0 (with the MCP_SERVER=1 flag) or preferably 6.7.14.0+ before the built-in MCP server can be enabled. Once on a supported version, enabling it requires the symfony/mcp-bundle package to be installed (verify with `composer show symfony/mcp-bundle`), then creating a Shopware integration via `bin/console integration:create \"My MCP Client\" --admin` to obtain credentials, and configuring an AI client to connect to the `/api/_mcp` (Admin API) or `/store-api/_mcp` (Store API) endpoint using the sw-access-key / sw-secret-access-key headers.","citations":["developer/products/tools/mcp-server/getting-started.md:12-15","developer/products/tools/mcp-server/configuration.md:10-16"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"mcp server|model context protocol\" docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/tools/mcp-server/getting-started.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/tools/mcp-server/configuration.md, limit=40"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"edge-06":{"query":"I'm coming from Magento — what are the Shopware equivalents of store views, extensions, attribute sets and `di.xml`?","category":"edge","option":"fs-docs","answer":"The merchant docs include a dedicated Magento<->Shopware dictionary (migration-en/magento-keywords) that answers three of the four terms directly: 'Store view / Store / Website' maps to a 'Sales channel with different languages and domains'; Magento's 'Extension' (Development row) maps to Shopware's 'Plugin' (installed via the extension manager under Settings > My extensions, with community ones distributed via Extensions > Store); and Magento's 'Attribute Sets' maps to Shopware's 'Custom field sets' (which collect custom fields into logical groups) — separately, plain Magento 'Attributes' split in Shopware into 'Properties' (for variants/filtering) and 'Custom fields' (free-text extension of product/other data).\n\nFor `di.xml` specifically, the corpus has no equivalent mapping — a search of both the merchant Magento dictionary and the entire developer docs layer found no mention of Magento or `di.xml` at all. Based on how Shopware 6's own dependency injection works (found in the developer docs, unrelated to any Magento comparison): Shopware 6 plugins register and wire services via Symfony's service container (a `services.xml`/`services.php` file with autowiring/autoconfigure, or explicit service definitions), and services are injected via constructor injection rather than a `di.xml`-style preference/plugin file. This DI mechanism is the closest conceptual counterpart, but the corpus itself does not draw that comparison, so it is noted here only as inferred from the Shopware-side DI documentation, not as a directly documented Magento-equivalence [from memory: general knowledge that di.xml is Magento 2's DI configuration file].","citations":["merchant/content/en/shopware-6/migration-en/magento-keywords/v1-1-0-0.md:90-92","developer/guides/plugins/plugins/services/dependency-injection.md:20-53"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"magento\" docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"grep -rli \"magento\" docs/shopware-knowledge-bases/merchant; find docs/shopware-knowledge-bases/developer -iname \"*migration*\" -not -path \"*/.git/*\""},{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/merchant/content/en/shopware-6/migration-en/magento-keywords/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/migration-en/magento-keywords/v1-1-0-0.md"}],"notFoundClaim":false,"memoryClaims":["di.xml is Magento 2's dependency-injection configuration file, used for constructor argument overrides, plugins/interceptors, and preference bindings"],"sourceVerdict":"partial"},"edge-07":{"query":"How do I set up Shopware PWA as the storefront for a Shopware 6.7 shop?","category":"edge","option":"fs-docs","answer":"The developer docs layer contains no setup guide for 'Shopware PWA' — a grep for 'shopware pwa' / 'pwa' across the whole developer corpus only turns up the word 'pwa' in the documentation-style wordlist file (an accepted-terms list, not content) and one unrelated ADR that just mentions headless mode without the storefront bundle. There is no dedicated Shopware PWA installation/configuration page in this corpus.\n\nWhat the corpus does document as the current headless/decoupled storefront path is 'Composable Frontends' (found under products/paas/shopware/composable-frontends), which is deployed as an application kind `cfe` with an `application.yaml` (specifying a supported Node.js version — 22, 24, or 26) on Shopware PaaS Native, using the same project/application lifecycle and Store API/Admin API integration described in the API guide (Store API base path `/store-api/*`, requiring a Sales Channel access key for headless use). If the intent is to run a headless frontend against Shopware 6.7, the docs point to Composable Frontends rather than the older 'Shopware PWA' project, for which no setup instructions exist here.","citations":["developer/products/paas/shopware/composable-frontends/index.md:1-49","developer/guides/development/integrations-api/index.md:41-52"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"shopware pwa|\\bpwa\\b\" docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"grep -rli \"composable frontend|shopware frontends|headless storefront\" docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/paas/shopware/composable-frontends/index.md, limit=50"},{"tool":"Bash","args":"grep -n \"pwa|Vue Storefront\" docs/shopware-knowledge-bases/developer/.wordlist.txt"},{"tool":"Bash","args":"grep -n \"pwa\" docs/shopware-knowledge-bases/developer/resources/references/adr/2021-09-06-make-core-mail-templates-independent-from-storefront-urls.md"},{"tool":"Bash","args":"grep -rli \"frosh|storefront alternative\" docs/shopware-knowledge-bases/developer/products/paas"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"edge-08":{"query":"Which service do I type-hint to read products — `EntityRepositoryInterface` — and how do I inject it into my plugin service?","category":"edge","option":"fs-docs","answer":"The premise in the query is slightly off: current Shopware docs do not use an `EntityRepositoryInterface` type-hint. Instead you type-hint the concrete class `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository`. To read products, inject the `product.repository` service (pattern: `<entity_name>.repository`) into your plugin service via the DI container. In `src/Resources/config/services.php`, register your service and pass `service('product.repository')` as a constructor argument; in the service class, declare a constructor parameter typed `EntityRepository $productRepository` and store it as a property. You can then call `$this->productRepository->search(new Criteria(), $context)` to fetch products.","citations":["developer/guides/plugins/plugins/framework/data-handling/reading-data.md:22-64"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"grep -rl \"EntityRepositoryInterface\\|EntityRepository \" docs/shopware-knowledge-bases/developer --include=*.md -l | head -20"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/reading-data.md"},{"tool":"Bash","args":"grep -rn \"EntityRepositoryInterface\" docs/shopware-knowledge-bases/developer --include=*.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"edge-09":{"query":"Where do I configure Business Events so that a mail is sent when an order is placed in Shopware 6.7?","category":"edge","option":"fs-docs","answer":"In Shopware 6.7, this is not configured under the old 'Business Events' feature — that was replaced by the Flow Builder back in 6.4.8.0 (Business Events continues to be used only for the B2B-Suite). Instead, go to Settings > Automation > Flow Builder and create a new flow. Choose the trigger 'checkout.order.placed' ('Triggers when an order is placed'), then add the action 'Send mail', selecting a reply-to address, a recipient (administrator, customer, or a custom email address), and the email template to send, plus any documents to attach.","citations":["merchant/content/en/shopware-6/settings/Business-Events/v1-0-0.md:10-17","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:41-62","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:198-206"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"Business Event\\|business-events\\|Flow Builder\\|order placed\" docs/shopware-knowledge-bases/developer --include=*.md | grep -i flow|business|event; grep -rln \"Business Event\\|order placed\\|Mail sent\" docs/shopware-knowledge-bases/merchant --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Business-Events/v1-0-0.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en -iname \"*flow-builder*\" -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-01":{"query":"How do I create a product with variants and configure its visibility per sales channel, and why might it not show up in the storefront?","category":"func","option":"fs-docs","answer":"To create a product, fill in the required fields (Name, Product number, Tax rate, Price gross/net, Stock) and save it. Once saved, additional tabs open, including Variants. Variants are generated from product Properties: open the Variants tab, use the Variant Generator, select which property (e.g. colour, size) and which of its options to use for variant generation, optionally define price surcharges per option, optionally exclude specific option combinations via 'Value exclusion' (e.g. exclude Blue + size XS/XXXL), then click 'Generate variants'. After generation you can configure how variants are shown in the storefront: the order of properties/options, assign images per variant, and choose a display mode under 'Product list' — either 'Main product' (listing shows the parent product without a preselected variant) or 'Single Variant' (a specific variant configuration is preselected and shown via a drop-down in the listing, and can be added to cart directly from the listing). The 'Fan out properties in product list' option can display each variant matching selected property values as its own separate listing entry. Individual variants can have inheritance from the main product removed (via the chain icon) to set variant-specific name, description, price, stock, product number, or image, and variants can also be bulk-edited.\n\nVisibility and sales channel assignment are configured under General > Visibility & structure: 'Sales channel' assigns the product to one or more sales channels, determining where it is available at all; 'Active for all selected sales channels' determines whether the product is actually displayed in the storefront and purchasable there; 'Categories' assigns the product to categories so it can be found via the category tree; and 'Configure extended visibility' controls whether the product appears in search and/or listing — options are 'visible' (default, shown in both search and listing), 'hide in listing' (still findable via search), or 'hide in listing and search' (only reachable via the direct product URL).\n\nA product might therefore fail to show up in the storefront for several reasons drawn from this configuration: it isn't assigned to the sales channel being viewed, 'Active for all selected sales channels' is not enabled, it isn't assigned to any category shown in the storefront navigation (if relying on category browsing), or 'Configure extended visibility' has been set to hide it from listing and/or search (in which case it is only reachable via its exact URL). For variants specifically, an individual variant can also be deactivated via the 'Active' column/quick-change, independent of the parent product's status, which would hide just that variant.","citations":["merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md:177-190","merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md:353-425","merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md:427-448"],"toolCallLog":[{"tool":"Bash","args":"find .../merchant/content/en/shopware-6/catalogues -iname \"*variant*\" and list catalogues subdirs"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-02":{"query":"How do Rule Builder conditions work for shipping and payment methods?","category":"func","option":"fs-docs","answer":"The Rule Builder (Settings > Automation > Rule Builder) lets you build rules made of general information (name, description, priority, type, tags) plus one or more conditions. Each condition has a Condition (the parameter queried, e.g. 'Grand total'), an Operator (how it's compared, e.g. 'Greater than'), and an Input value (e.g. 20), and conditions can be linked with AND (all must be true) or OR (only one must be true); switching between AND/OR automatically creates subconditions. Rules can be assigned in the 'Assignments' tab, which lists every place a rule is used or usable, including 'Availability of payment methods', 'Availability of shipping methods', and 'Calculation of shipping costs' — this tab is only a navigation/overview aid and does not itself perform the assignment; you assign the rule from within the shipping method or payment method configuration itself. Relevant condition groups for shipping/payment include the 'Shopping cart' group, which has direct conditions 'Applied shipping method' (compares a specific shipping method, e.g. Express, against the one used) and 'Applied payment method' (compares a specific payment method, e.g. Invoice, against the one used), plus general cart conditions like 'Cart total (incl. shipping)', 'Shipping costs', weight/volume/quantity totals, etc. Other conditions such as customer group, customer country/address, or order status can equally be combined to restrict when a shipping or payment method is offered (e.g. 'The customer group is Standard customer group AND the payment method is Invoice'). Some conditions support an optional filter (recognizable by a filter icon) to narrow the condition to items matching extra criteria, e.g. limiting a 'Total quantity of all products' condition (used to make a shipping method like 'logistics' available once 10+ items are in the cart) to only items tagged 'logistics'. A rule is only usable once saved and marked valid, and rules cannot be deleted while still assigned somewhere. Preview mode (Rise plan and higher) lets you check a rule's conditions in real time against a selected order to see TRUE/FALSE per condition. Rules can also be shared: since 6.7.1.0 (Rise plan) a rule can be downloaded as a JSON file (including its conditions/operators, though references to customers, customer groups or sales channels can be stripped) and later uploaded/reassigned in another system.","citations":["merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md:33-58","merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md:112-136","merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md:209-247"],"toolCallLog":[{"tool":"Bash","args":"find .../merchant/content/en/shopware-6/settings/rules -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-03":{"query":"How do promotions and discount codes work, including individually generated codes?","category":"func","option":"fs-docs","answer":"Promotions are created under Marketing > Promotions by clicking 'Create action'. A promotion has General settings (name, priority, valid from/until, max total uses, max uses per customer, active toggle), then, once saved for the first time, Conditions and Discounts tabs become available.\n\nPromotion codes: under General you choose one of three code modes: 'No promotional code required' (applies automatically once conditions are met), 'Fixed promotion code' (one code shared by all customers, either typed manually, e.g. EASTER21, or generated randomly), or 'Individual promotion codes' (a separate one-time-use code per order/customer; each code can only be redeemed once and is rejected if reused). For individual codes you click 'generate codes' to open a configuration window: you set the code length (number of random characters), an optional prefix and suffix (not counted in the length), or use 'use custom pattern' to define a template mixing fixed characters with placeholders (%s for a random letter A-Z, %d for a random digit 0-9, e.g. pattern SW-%s%d%s%d%s-TEST), a live 'promotion code preview', and the number of codes to generate. You can later use 'add codes' to generate more codes following the same pattern (useful when many codes have already been used before the campaign ends). Note only one individual code from a single promotion can be applied at a time, and regenerating/adjusting the code pattern invalidates all previously generated codes.\n\nConditions tab: lets you restrict which sales channels the promotion applies to, optionally prevent combination with other promotions ('Prevent combination with other promotions' and 'Do not combine with' a specific list). Rule-based conditions let you attach Rule Builder rules for Customer rules (who is eligible), Shopping cart rules (e.g. cart total >= 100), Order rules (e.g. specific payment/shipping method used or excluded), and 'Promote sets of products' (set groups defined by mode Number/Value-Gross/Value-Net, a target value, sort order, and product rules) for complex multi-product conditions such as '3 for 2' deals. If multiple rules of the same type are selected, only one needs to trigger.\n\nDiscounts tab: lets you define one or more discounts, each with 'Apply to' (entire cart, shipping costs, entire product set, or a specific set group), optionally 'Apply to specific range of products only' (with its own product rules, an 'apply to' Nth-product setting, and sort order), a Type (absolute, percentage, or fixed price/unit price), a Value, and for percentage discounts an optional Maximum discount value cap; advanced pricing per currency is also available. Discount settings can no longer be changed once the promotion has been used in an order.\n\nApplying in the storefront: if a code is required, the customer enters it in the 'Enter voucher code' field in the OffCanvas cart or the full shopping cart view and confirms; the discount then appears listed among the cart items.\n\nTracking redeemed codes: for individual codes, opening the promotion under Marketing > Promotions shows a 'Redeemed' column indicating which codes have been used and can be cross-referenced with the order overview by filtering orders on 'promotion code'. For a fixed code, the same order-overview filter can be used, but it will typically return multiple orders since the same code is shared.","citations":["merchant/content/en/shopware-6/marketing/promotions/v1-7-0-0.md:20-82","merchant/content/en/shopware-6/marketing/promotions/v1-7-0-0.md:84-166","merchant/content/en/shopware-6/marketing/promotions/v1-7-0-0.md:256-303"],"toolCallLog":[{"tool":"Bash","args":"find .../merchant/content/en/shopware-6/marketing -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/marketing/promotions/v1-7-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-04":{"query":"What does the Shopware Migration Assistant transfer automatically from Shopware 5, and what has to be mapped by hand before the migration starts?","category":"func","option":"fs-docs","answer":"Automatically migrated data (selectable in the migration data-selection screen), grouped by category: Basic data (mandatory) — Categories, Customer groups, Currencies, Sales channels, Number ranges. Products — Products, Properties, Product options, Product properties, Translations, Cross-selling, Main variant relations. Customers & orders — Customers, Shipping methods, Orders, Order documents. Promotions — Customers, Promotions. SEO URLs — Products, Properties, Product options, Product properties, Translations, Cross-selling, Main variant relations, SEO URLs. Product reviews — Products, Properties, Product options, Product properties, Translations, Cross-selling, Main variant relations, Customers, Reviews, and Media.\n\nManual mapping required before migration starts: Payment methods, Standard Payment Method, Salutation, Delivery time, and Standard delivery time must all be created in Shopware 6 beforehand, since during the migration you are asked to map these fields from the Shopware 5 data to the Shopware 6 equivalents; if extensions were used in Shopware 5 there may be additional fields to map. This mapping is mandatory — fields must be mapped to something — and once the migration has started (even if reset) the fields cannot be re-mapped; to redo the mapping the migration itself must be deleted and recreated.\n\nSeparately, several things cannot be transferred at all and must be manually checked or rebuilt after migration: additional sales channels/subshops are recreated as their own sales channel but the storefront may still show the default pre-installed sales channel until domain settings are adjusted; Shipping costs must be recreated from scratch in Settings > Commerce > Shipping because of underlying technical/Rule-Builder changes; Payment methods must be reviewed/re-added under Settings > Commerce > Payment methods since risk management is now handled via the Rule Builder; Countries should be checked under Settings > Localisation > Countries; Document templates need to be reconfigured under Settings > Commerce > Documents; Email templates cannot be reused (Shopware 6 uses Twig) and must be rebuilt under Settings > Content > Email templates; Shopping worlds/shop pages (now Shopping Experiences) cannot be transferred and must be recreated under Content > Shopping Experiences; and the storefront Template/theme cannot be reused since the architecture changed completely — Shopware 6 ships its own default template as a starting point. Additionally, B2B Suite data cannot be transferred from Shopware 5 to Shopware 6 at all.","citations":["merchant/content/en/shopware-6/migration-en/what-is-migrated/v1-1-0-0.md:1-186"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"migration assistant\" .../merchant"},{"tool":"Bash","args":"find .../merchant/content/en/shopware-6/migration-en -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/migration-en/index.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/migration-en/what-is-migrated/v1-1-0-0.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/migration-en/Migrationprocess/v1-1-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-05":{"query":"How do I set up a sales channel — storefront versus headless type, domains, languages and currencies — and where do I get its API access key?","category":"func","option":"fs-docs","answer":"To create a sales channel, go to the Sales Channel menu item in the administration and click the plus symbol next to it. In the pop-up you choose the type: a 'Sales Channel with HTML storefront' or a 'headless sales channel' that only exposes an API interface (a product comparison export for marketplaces/comparison portals can also be created here).\n\nGeneral settings for the new channel include Name, 'Mark Sales Channel as favourite' (shows it in the admin sidebar), navigation entry points (main navigation, footer navigation, service navigation) and navigation levels, the default Customer group for new/anonymous visitors, the available Countries (with a default), the available Languages (with a default), and standard units of measurement.\n\nUnder 'Payment and shipping' you specify which Payment methods are available and pick a default (editable under Settings > Payment methods), which Shipping methods are available and a default (Settings > Shipping methods), which Currencies are available and a default (Settings > Localisation > Currencies), and how tax is calculated for the channel.\n\nDomains: in a self-hosted instance you can add multiple domains under the Domain section, each with its own virtual URL, language, currency, snippet set, and unit system — needed to run multiple language shops off one sales channel; it's recommended each domain use only one protocol (http or https) to avoid duplicate content. In a cloud instance a URL is already stored by default (auto-generated at instance creation); to use your own domain, it must first be added under Settings > System > Domains, then attached via 'Add domain' in the sales channel, where you set the URL/subdomain and protocol, the Language, the Currency, the Snippet set, and Hreflang localisation (ISO standard vs. browser language). A separate 'Hreflang' section lets you enable the hreflang metatag and pick a default fallback domain across your configured domains, to prevent Google treating multiple language versions as duplicate content.\n\nAPI access: under the 'API access' section of the sales channel you can generate an API Access ID for that sales channel; further details on using this API access are pointed to the developer documentation from this same page.\n\nOther sales-channel settings covered on this page include Status (temporarily disable the channel, enable maintenance mode with an IP whitelist — noting a trusted-proxy TRUSTED_PROXIES setting is needed if using a proxy for whitelisting to work), deleting a sales channel (the preinstalled Headless channel should never be deleted since extensions like the B2B Suite rely on it, though it can be hidden from the sidebar by favoriting other channels), assigning Products directly to the channel (via search/removal, or Add products by individual product, category, or dynamic product group), Managing/favoriting multiple sales channels, assigning a Theme, and configuring Google Analytics 4 tracking and Agentic files (llms.txt, agents.md, ai-catalog.json) for the channel.","citations":["merchant/content/en/shopware-6/settings/saleschannel/v1-5-2-0.md:39-141","merchant/content/en/shopware-6/settings/saleschannel/v1-5-2-0.md:143-197"],"toolCallLog":[{"tool":"Bash","args":"find .../merchant/content/en/shopware-6/settings/saleschannel -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/saleschannel/v1-5-2-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-06":{"query":"Which triggers and actions does the Flow Builder offer, and how do I make it send a mail when an order is placed?","category":"func","option":"fs-docs","answer":"Flow Builder lives under Settings > Automation > Flow Builder. Each flow has a General tab (Name, Description, Priority — which flow runs first if several share a trigger — and an Active toggle) and a Flow tab where you pick a Trigger, then optionally add Conditions and Actions via the plus symbol.\n\nAvailable triggers include a large set of events such as: checkout.customer.before.login, checkout.customer.login/logout, checkout.customer.register, checkout.customer.guest_register, checkout.customer.deleted, checkout.customer.double_opt_in_registration / double_opt_in_guest_order, checkout.order.payment_method.changed, checkout.order.placed (order placed), contact_form.send, customer.group.registration.accepted/declined, customer.recovery.request, mail.after.create.message, mail.before.send, mail.sent, newsletter.confirm/register/unsubscribe, product_export.log, review_form.send, user.recovery.request, plus many state_enter.* and state_leave.* triggers for order status, order delivery status, order transaction (payment) status, and order transaction capture/capture-refund status changes (e.g. state_enter.order.state.completed, state_enter.order_transaction.state.paid). Since 6.5.3.0, Custom Triggers also let flows start from events raised by installed apps/extensions, or trigger webhooks in third-party systems from a Shopware event.\n\nConditions use Rule Builder rules (existing or newly created) to decide True/False branches, each of which can have its own further conditions or actions; Delayed Actions (Beyond plan) let you push an action back by an Hour/Day/Week/Month or a custom SS.TT.WW.MM offset, useful e.g. for a review-request email a week after an order — delayed actions appear under 'Scheduled Actions' with order number, customer, delay condition, time remaining, and scheduled time.\n\nAvailable actions (availability depends on the chosen trigger) include: Assign account status (active/inactive), Assign affiliate and campaign code (with an override option), Assign customer group, Generate a document (choose the document type), Send mail, Assign status (payment/shipping/order status, with some interdependent status rules, e.g. Refunded requires prior Paid), Stop flow (halts the rest of the flow), Set download access (grant/revoke a digital product's download link), Change custom field content (on customer or order), and Add Tag / Remove Tag. With the Shopware Commercial extension (Evolve plan) a further 'Call URL (Webhook)' action is available, supporting GET/POST/PUT/PATCH/DELETE, custom parameters, headers, body, and Basic Auth.\n\nTo send a mail when an order is placed: create a new flow (Add Flow), fill in General (name, description, activate it), go to the Flow tab and select the trigger 'checkout.order.placed', then add the action 'Send mail' — in its configuration choose a reply-to address and a recipient (Administrator, Customer, or one/more custom email addresses; note selecting 'Administrator' sends to all users with the admin flag, including external/API users with that flag), pick the email template to send, and optionally attach documents. No condition is required if the mail should always be sent when an order is placed, though a Rule Builder condition can be added first to restrict when the mail fires. Flows can also be shared: downloaded as a file (with conditions/actions, though references to categories/products/properties can be stripped and must be reassigned on upload) and uploaded to another store, and a template library of Shopware-provided standard/example flows is available to start from.","citations":["merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:9-135","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:137-250","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:299-327"],"toolCallLog":[{"tool":"Bash","args":"find .../merchant/content/en/shopware-6/settings/Flow-Builder -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-07":{"query":"How do I import products from a CSV with an import/export profile — column mapping, matching identifiers and a dry run?","category":"func","option":"fs-docs","answer":"The Import/Export module is under Settings > Automation > Import/Export. The CSV file must use UTF-8 character encoding, semicolon as the field separator, and quotation marks as the string separator (most spreadsheet programs, e.g. LibreOffice, need this set explicitly); import can only add/update data, not remove it (e.g. it cannot remove an existing sales channel assignment from a product); and decimal prices must use a point, not a comma (e.g. 5.00), or the price import will fail.\n\nOn the Import tab you: (1) 'Upload CSV file' — pick the native CSV (a tool that produces native CSVs, e.g. OpenOffice Calc, is recommended since some spreadsheet tools mangle separators/leading zeros); (2) 'Select profile' — choose the import/export profile that determines which CSV columns map to which database fields; (3) 'Start import' to run it (valid rows are imported, invalid rows are collected into a downloadable error CSV) or (4) 'Start dry run' to fully validate the file without actually importing, so you can catch problems (e.g. partial imports) before committing. 'Import activity' keeps a 30-day history of past imports, letting you re-download the source CSV, reopen the profile used, or download just the erroneous rows, and you can abort an in-progress import via its context menu (though already-imported rows will remain).\n\nThe Export tab works analogously: pick which data to export via 'Select profile', then 'Start export'; 'Export activity' keeps a 30-day history with the same download options. An AI Copilot-driven Export assistant (Shopware Rise plan + Commercial extension) can also generate exports for customer, product, order, category, newsletter, promotion code/discount, properties, cross-selling and product price data.\n\nProfiles (Profiles tab) define column mapping. Creating a custom profile requires being in the default system language (top-right language selector) even for profiles meant for another language. A new profile lets you set: Profile name; Usage (import, export, or both — an import-only profile cannot be used for export); Object type (e.g. Product, Customer, Categories, Orders, Media — determines which database tables/columns are accessible); Separator character (default semicolon) and Enclosure character; and Import settings, where 'Create new records' allows the import to add new rows (leave the ID column empty to create new entries) and 'Update existing data' allows overwriting existing records. You can optionally seed a profile from an existing CSV upload, which pre-populates the CSV column names for mapping, or start from scratch. Under Mappings, 'Add new mapping' creates a row where you pick a database field and enter the corresponding CSV column name (Database mapping), mark the field as Required if the import must fail without it, set a Default Value used when the CSV cell is empty, and set Position to define expected column order in the CSV; mandatory fields for the chosen object type are pre-created automatically (e.g. for Product: id, taxId, productNumber, stock, name, with id left empty when creating new products since the system generates it).\n\nMatching identifiers: historically the import required each row to carry the entity's UUID to match existing records. The 'Second Unique Identifier' feature (Profiles > open a profile > Advanced Settings tab) lets you instead choose another field as the matching key — e.g. mapping products by productNumber instead of the UUID — by selecting the entity on the left and assigning a new identifier from a dropdown of available fields on the right. Note that choosing a non-unique field as the identifier (e.g. a product name that isn't unique) means only the first matching record can be identified/imported correctly.","citations":["merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md:12-56","merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md:57-92","merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md:93-202"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"import\" .../merchant/content/en/shopware-6/settings"},{"tool":"Bash","args":"find .../merchant/content/en -iname \"*import*\" / \"*export*\" -not -path '*/.git/*'"},{"tool":"Bash","args":"find .../merchant/content/en/shopware-6/shopware-en/settings/importexport -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md (lines 1-235 returned, file truncated at 670 total)"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-08":{"query":"How do custom field sets work — entity assignment, field types and technical name — and can a custom field be written through the Store API?","category":"func","option":"fs-docs","answer":"Custom fields ('additional fields') are managed under Settings > System > Custom fields and let you add your own fields to program areas (e.g. products, categories) not covered by the standard system; they can then be used in the Rule Builder or shown in the storefront. Custom fields should always be edited in the store's default language so inheritance of the value applies to all languages (a per-language override can still be entered by switching the admin language first) — otherwise a value may be missing in other languages, which can break rules relying on it.\n\nSets and entity assignment: additional fields are organized into 'sets' — a set groups several related custom fields together and is assigned to one or more program areas (entities), e.g. products or categories; you then fill in the set's fields within those areas. Creating a set (New set button) requires a unique technical name (which cannot be changed later), a Position (controls display order in the admin — higher numeric value = further back), an optional Label (can be localized per admin language), and you must select which program areas the set applies to; if no area is selected the set is created but unavailable anywhere.\n\nField types and technical name: within a set, individual custom fields are created via 'New custom field'. Every field type requires a unique Technical name (mandatory, cannot be changed later, must be unique system-wide) and avoiding Twig special characters like '-' or '#' (these can break product exports). Available field types include: Select (single or multi-select with technical-name+label options), Object selection (reference to another entity such as dynamic product group, experience world, manufacturer, category, customer, country, delivery method, product, sales channel, or payment method — the object type itself can't be changed once created), Text field, Media, Number (integer or float, with steps/min/max), Date/Time, Checkbox, Active/Inactive switch (boolean 0/1), Text Editor (styled/rich text), and Color picker. Most types share the options Position, 'Available in shopping carts' (exposes the field to cart data so it can be used in Rule Builder/templates), 'Modifiable via Store API', Label, and (for several types) Placeholder and Help text.\n\nStore API writability: yes — a custom field can be exposed to the Store API by enabling the 'Modifiable via Store API' option in its configuration. When active, the Store API is allowed to write/modify that field, which is useful for storing custom data submitted from the storefront, e.g. new fields added to a registration form. The documentation specifically warns that this setting effectively makes the field 'public', so critical or sensitive information (e.g. customer data) should not be exposed this way.\n\nAdditionally, a custom field's value can be linked into a Shopping Experience text block via 'Data Mapping' so it renders dynamic content (e.g. safety instructions) instead of static text, and displaying a custom field's value in the storefront in other contexts requires a template adjustment.","citations":["merchant/content/en/shopware-6/settings/custom-fields/v1-3-2-0.md:10-47","merchant/content/en/shopware-6/settings/custom-fields/v1-3-2-0.md:49-241"],"toolCallLog":[{"tool":"Bash","args":"find .../merchant/content/en/shopware-6/settings/custom-fields -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/custom-fields/v1-3-2-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-09":{"query":"Why doesn't my payment method appear in the checkout — what has to be configured in the administration?","category":"func","option":"fs-docs","answer":"Payment methods are managed under Settings > Commerce > Payment methods. By default only cash on delivery, invoice, prepayment and direct debit are activated, but the documentation explicitly notes that having a payment method activated here does not automatically make it available to customers in the storefront — the decisive factor is which payment methods are assigned in the relevant Sales Channel (Sales Channel > Payment and shipping section), where you must select which payment methods are available for that channel and choose a default one.\n\nSo, for a payment method to show up in checkout, the following must all be configured: (1) the payment method itself must be created and its 'Active' toggle enabled in Settings > Commerce > Payment methods; (2) it must be explicitly assigned to the sales channel being used, under that sales channel's payment-and-shipping settings; and (3) if an Availability rule (built with the Rule Builder) is attached to the payment method, the current cart/customer/order context must satisfy that rule for the method to be offered — if the payment method should be available without restriction, its availability rule should be left blank (NULL), since a rule that isn't satisfied will hide the method from checkout even though it's active and assigned to the channel.\n\nOther configuration fields on the payment method (name, technical name, position/display order, description, logo, and 'Allow change of payment method after order completion') don't affect whether it appears in checkout, but the technical name should not be changed carelessly since doing so can make an already-configured payment method (e.g. one tied to an extension) inoperable.","citations":["merchant/content/en/shopware-6/settings/Paymentmethods/v1-4-0-0.md:10-57"],"toolCallLog":[{"tool":"Bash","args":"find .../merchant/content/en/shopware-6/settings/Paymentmethods -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Paymentmethods/v1-4-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-10":{"query":"How do dynamic product groups work in the administration and where can the resulting group be used?","category":"func","option":"fs-docs","answer":"Dynamic product groups are found in the admin under Catalogues > Dynamic product groups. They are groups of products formed by dynamic rules (built with the Rule Builder-style condition editor) that are automatically updated when products meet the selected criteria, and can be played out at different locations in the shop. When creating one you give it a Name and optional Description, and can toggle 'Keep matching variants grouped' to control whether matching variants show under a shared main product or individually (affecting display in categories, cross-selling, and CMS product sliders). In the Conditions area you pick a property and condition, link further conditions with AND/OR, and can nest conditions with SUB-CONDITION; a Preview button shows which products currently match. Operators available depend on the property type (Is equal to / not equal to / equal to any of / not equal to any of / equal to all of / not equal to all of), and conditions can be based on products, categories, manufacturers, tags, properties, property values, price, stock, custom fields, and delivery time. Once created, the resulting dynamic product group can be used to: (1) dynamically fill the content of a Category (useful for sales or manufacturer-specific categories), (2) supply the feed for Product comparison, and (3) fill product sliders in Shopping Experiences (the product slider element lives in the Commerce block category).","citations":["merchant/content/en/shopware-6/shopware-6-de/Catalogues/Dynamicproductgroups/v1-3-0-0.md:9-149"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/index.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"grep -rli \"dynamic product group\" docs/shopware-knowledge-bases/merchant --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/shopware-6-de/Catalogues/Dynamicproductgroups/v1-3-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-11":{"query":"How do I create an integration for Admin API access in the administration and give it the right privileges?","category":"func","option":"fs-docs","answer":"Go to Settings > System > Integrations. Click 'Create integration', give it a name, and decide whether it should have administrator permissions, or instead pick another previously defined role from the role dropdown for scoped access. Saving generates an access ID and a security key (the security key is shown only once, so save it immediately); afterwards the integration appears in the overview with its name and permissions and can be edited or deleted via the context menu — editing no longer shows the security key but you can 'Regenerate API access key' to get a new ID/key pair. To give it the 'right privileges' with fine-grained control rather than full admin, first create a Role under Settings > System > Users & Permissions > Roles: name/describe the role, then in the Authorisations tab assign per admin area (and per sub-area) the rights View, Edit, Create, Delete or All — rights build on each other left to right (Edit implies View, Create implies Edit+View; Delete only implies View). There are also 'Additional permissions' (e.g. Basic configurations, Run Updates, Maintain/Upload extensions, Logging, Clear cache, Import/Export, Shopware Store, Update own profile, Create discounts, Apps) that are simple on/off rights not tied to view/edit/create/delete, and a 'Detailed permissions' tab for technical-name-level read/write/create/delete rights (useful when an extension's ACL is incomplete). Assign that role to the integration instead of granting full admin rights.","citations":["merchant/content/en/shopware-6/settings/system/integrationen/v1-1-0.md:10-35","merchant/content/en/shopware-6/settings/system/user/v1-3-0.md:61-138"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"integration\" docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/system/integrationen/v1-1-0.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/system/user/v1-3-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-12":{"query":"A spec asks for customer-specific pricing and for a flow that calls an external URL when an order is placed — before I build either of them, does Shopware already ship them, and what has to be licensed or installed for them to exist in the shop?","category":"func","option":"fs-docs","answer":"Both exist as built-in/extension features, but both require paid Shopware plans/extensions rather than being available on a base install.\n\nCustomer-specific pricing: this is available from the Shopware Beyond plan via the Shopware Commercial extension. It lets you offer individually calculated prices (list prices, graduated prices, currency-dependent prices) per customer, synced in via an API (e.g. from an ERP). Creating/reading/updating/deleting custom prices is only possible via the API — there is no store extension to install separately and no dedicated admin module; the feature is 'installed' simply by having the Shopware Beyond plan and Shopware Commercial extension active, then pushing prices through the API. In the storefront, the individual price shows once the customer is logged in, and the regular price shows when logged out.\n\nCalling an external URL when an order is placed: this is the Flow Builder's 'Call URL (Webhook)' action (Settings > Automation > Flow Builder), which can react to an order-placed trigger and call a URL with GET/POST/PUT/PATCH/DELETE, custom parameters, headers, a body, and optional Basic Auth. However, Webhook Actions in Flow Builder are an extension available from the Evolve Plan onward and specifically require the Shopware Commercial extension to be installed/licensed — they are not part of the Flow Builder's free/base actions.\n\nSo before building either from scratch: check whether the shop already has a Shopware Beyond (or higher, e.g. Evolve) plan and the Shopware Commercial extension installed — if so, customer-specific pricing (via API) and Call URL/Webhook flow actions are already available out of the box and just need configuring, not custom development.","citations":["merchant/content/en/shopware-6/extensions/customer-specific-pricing/v1-0-0-1.md:10-26","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:251-297"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"customer-specific pric|individual pric|advanced pricing\" docs/shopware-knowledge-bases/merchant --include=*.md"},{"tool":"Bash","args":"grep -rli \"webhook|call an external|external url\" docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/extensions/customer-specific-pricing/v1-0-0-1.md"},{"tool":"Bash","args":"grep -n \"webhook|Webhook|external|URL\" docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md, offset=240, limit=60"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-01":{"query":"How do I add my own Admin API endpoint under `/api/...` from a plugin — a controller with the api route scope and its ACL?","category":"gap","option":"fs-docs","answer":"The fs-docs corpus has no dedicated guide for adding a custom Admin API (`/api/...`) controller from a plugin, only for Store API routes. The closest actually-documented pattern is the Store API route guide, which shows a controller class carrying a `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]])]` attribute, extending an `Abstract...Route`, injecting an `EntityRepository`, implementing `getDecorated()` (throwing `DecorationPatternException`), and defining the endpoint itself with a second `#[Route(path: ..., name: ..., methods: [...])]` attribute on the method (developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md:60-98). For the `api` scope specifically there is no equivalent worked example, code sample, or `#[Acl(...)]` attribute reference anywhere in the developer corpus (confirmed via grep for `ApiRouteScope`, `Acl(`, and `admin-api` across developer/**; there is no `add-admin-api-route.md` counterpart to the store-api guide). Separately, the corpus does document plugin ACL/permissions, but only for the Administration UI (Vue) side: registering privileges with `Shopware.Service('privileges').addPrivilegeMappingEntry(...)`, protecting Vue routes/menu entries with a `privilege` meta key, and checking `acl.can('key.role')` in components (developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:74-184, :262-278). That guide explicitly notes these Administration ACL rules only hide/disable UI elements, are not API permissions, and can be bypassed by calling the backend directly (same file, lines 12-25 and 56). So the corpus can show the route-scope-attribute mechanics via the Store API analogy and the UI-side privilege registration, but it does not contain material specifically covering an `api`-scoped custom controller or its PHP-level ACL/permission check — that part is a gap in this source.","citations":["developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md:60-98","developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:1-100","developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:260-278","developer/resources/guidelines/code/routing.md:1-12"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"route_scope: [api]|route_scope: {api}|api-route-scope|admin-api\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins -iname \"*controller*\" -not -path '*/.git/*'"},{"tool":"Bash","args":"grep -rln \"acl|_routeScope|RouteScope\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins/plugin-fundamentals; find docs/shopware-knowledge-bases/developer/guides/plugins/plugins -iname \"*acl*\"; find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration -iname \"*permission*\""},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"},{"tool":"Bash","args":"grep -rln \"_routeScope|RouteScope\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Bash","args":"grep -n \"_routeScope|acl:|Acl(\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md"},{"tool":"Bash","args":"grep -rln \"['api']|\\\"api\\\"]|route_scope.*api|#[Acl\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Bash","args":"grep -rln \"api-route-scope|ApiController|admin api endpoint|Admin API endpoint|custom admin api|api.acl|Acl::class\" docs/shopware-knowledge-bases/developer --include=*.md -i"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/concepts/api/admin-api.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname \"*admin-api*\" -not -path '*/.git/*'; find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework -maxdepth 1"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md, offset=60, limit=40"},{"tool":"Bash","args":"grep -rn \"ApiRouteScope|permissions:\\s*\\[\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/resources/guidelines/code/; grep -rn \"Acl(\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/resources/guidelines/code/routing.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"gap-02":{"query":"Shopware 6.7 removed the RSA JWT key files and `system:generate-jwt-secret` — what signs Admin API tokens now, and what do I have to do when upgrading?","category":"gap","option":"fs-docs","answer":"The developer corpus does not document this change. The only JWT-related material found is a `shopware-cli` (third-party CLI tool) helper command, `shopware-cli project generate-jwt`, which generates RSA private/public JWT key pairs into `config/jwt/` and notes this is 'required only for Shopware versions before 6.5; in 6.5+, JWT secrets are generated automatically' (developer/products/tools/cli/project-commands/helper-commands.md:236-250) — this describes 6.5 behavior, not a 6.7 removal of RSA keys or of a `system:generate-jwt-secret` command, and it is not a statement about what now signs Admin API tokens. The general upgrade-guidance page points to external, out-of-corpus resources (the GitHub `RELEASE_INFO-6.7.md` and `UPGRADE-6.7.md` files) for per-release breaking changes, but contains no specifics itself (developer/guides/upgrades-migrations/index.md:52-56). Grepping the whole developer layer for `jwt_key`, `private.pem`, `public.pem`, and `symmetric` returned no hits, and no upgrade/changelog page in the corpus mentions JWT signing changes for 6.7. This is a gap in the fs-docs source — I could not find corpus material answering what signs Admin API tokens now or the required upgrade steps.","citations":["developer/products/tools/cli/project-commands/helper-commands.md:236-250","developer/guides/upgrades-migrations/index.md:52-56"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"generate-jwt-secret|jwt.*key|JWT\" docs/shopware-knowledge-bases/developer --include=*.md -i"},{"tool":"Bash","args":"grep -rn \"generate-jwt-secret|jwt\" docs/shopware-knowledge-bases/developer/products/tools/cli/project-commands/helper-commands.md -i"},{"tool":"Bash","args":"grep -rln \"6.7.0.0|UPGRADE|upgrade guide\" docs/shopware-knowledge-bases/developer --include=*.md -i | grep -i \"upgrade|migration|changelog\""},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/index.md"},{"tool":"Bash","args":"grep -rln \"jwt_key|private.pem|public.pem|APP_SECRET.*sign|symmetric\" docs/shopware-knowledge-bases/developer --include=*.md -i"},{"tool":"Bash","args":"grep -rn \"generate-jwt|JWT\" docs/shopware-knowledge-bases/developer/products/tools/mcp-server/configuration.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"corpus-missing"},"gap-03":{"unparsed":"{\n  \"query\": \"My ERP integration stopped logging in after the 6.7 upgrade — what changed in the Admin API OAuth flow (`/api/oauth/authorize`, the `scope` format)?\n\",\n  \"category\": \"gap\",\n  \"option\": \"fs-docs\",\n  \"answer\": \"The developer corpus does not document any 6.7-specific change to the Admin API OAuth flow. What is documented is the general, version-agnostic client_credentials flow: create an integration under Settings → System → Integrations, use its 'Access key ID' as `client_id` and 'Secret access key' as `client_secret`, and POST to `/api/oauth/token` with `grant_type: client_credentials` to receive a Bearer `access_token` (developer/guides/development/integrations-api/index.md:76-107). A local-development password-grant variant against the same `/api/oauth/token` endpoint is also documented, using `grant_type: password` with a `scopes` field set to a plain string like `\\\"write\\\"` (developer/guides/development/integrations-api/auth-api-requests.md:11-27) — but this is presented as a local shortcut, not as documentation of a 6.7 change, and no `scope` format change or migration note is mentioned anywhere. The `/api/oauth/authorize` endpoint (used for the authorization_code grant) is not mentioned at all in the developer corpus — grepping developer/concepts/api/index.md and the broader corpus for `oauth/authorize` and `scope` returned no relevant hits. This is a gap: I could not find corpus material describing what changed in the OAuth flow for 6.7 or why an existing ERP integration would stop authenticating after the upgrade.\",\n  \"citations\": [\n    \"developer/guides/development/integrations-api/index.md:76-107\",\n    \"developer/guides/development/integrations-api/auth-api-requests.md:11-27\"\n  ],\n  \"toolCallLog\": [\n    {\"tool\": \"Bash\", \"args\": \"grep -rln \\\"oauth|/api/oauth\\\" docs/shopware-knowledge-bases/developer --include=*.md -i\"},\n    {\"tool\": \"Read\", \"args\": \"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/auth-api-requests.md\"},\n    {\"tool\": \"Read\", \"args\": \"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/index.md\"},\n    {\"tool\": \"Bash\", \"args\": \"grep -rn \\\"oauth/authorize|scope\\\" docs/shopware-knowledge-bases/developer/concepts/api/index.md; find docs/shopware-knowledge-bases/developer/concepts/api -maxdepth 1\"}\n  ],\n  \"notFoundClaim\": true,\n  \"memoryClaims\": [],\n  \"sourceVerdict\": \"corpus-missing\"\n}\n"},"gap-04":{"query":"After upgrading to 6.7 my plugin fatals on load because core class properties now have native PHP types — which properties must I retype in my subclasses?","category":"gap","option":"fs-docs","answer":"The developer corpus does not contain a concrete, itemized list of which 6.7 core class properties gained native PHP types. What it does document is the general mechanism Shopware uses to announce such changes: property type changes are marked with the `#[PropertyTypeNarrowing]` or `#[PropertyTypeWidening]` PHP attributes from `Shopware\\Core\\Framework\\Deprecation\\BCChange` in the version they will take effect, e.g. `#[PropertyTypeNarrowing(version: 'v6.8.0', newType: 'string')] public string|int $externalId;` (developer/resources/guidelines/code/backward-compatibility.md:376-390). Both attributes affect call sites and extenders, and because PHP property types are invariant, the documented remediation is the same in both cases: 'Stop redeclaring the property... Move the extension state to a differently named property or a separate object' (same file, lines 390 and 406) — i.e. you generally cannot keep redeclaring a typed core property in your subclass with a different type; you must move your plugin's state into a separate, differently-named property instead. To find the specific properties affected by the 6.7 release, the corpus points to external, out-of-corpus resources — the project's `RELEASE_INFO-6.7.md` and `UPGRADE-6.7.md` files on GitHub — rather than listing them itself (developer/guides/upgrades-migrations/index.md:52-56). So the general remediation pattern is document
