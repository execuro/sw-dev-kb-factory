nce 100 → 70","rescore dev-57: completeness 100 → 70","rescore dev-59: groundingRelevance 100 → 70","rescore dev-59: completeness 100 → 70","rescore dev-59: actionability 100 → 70","rescore dev-67: groundingRelevance 100 → 70","rescore dev-67: accuracy 70 → 40","rescore dev-68: groundingRelevance 100 → 70","rescore dev-68: accuracy 70 → 40","rescore dev-68: completeness 100 → 70","rescore dev-68: actionability 100 → 70","rescore func-05: actionability 100 → 70","rescore func-07: actionability 100 → 70","rescore func-08: actionability 100 → 70","rescore func-10: actionability 100 → 70","rescore edge-03: accuracy 100 → 70","rescore edge-03: completeness 70 → 40","rescore gap-02: actionability 100 → 70","rescore gap-06: accuracy 100 → 70"]},"raw":{"vanilla":{"dev-01":{"query":"How do I extend the product entity with a new association in Shopware's Data Abstraction Layer?","category":"dev","option":"vanilla","answer":"To add a new association to the product entity, you create an EntityExtension class in your plugin (typically under src/Extension/Content/Product/) that extends Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityExtension, implements getDefinitionClass() to point to ProductDefinition, and defines the new association field (OneToOneAssociationField, ManyToOneAssociationField, OneToManyAssociationField or ManyToManyAssociationField) inside its extendFields() method. For a one-to-many/many-to-one relationship you must add a foreign key column on the 'many' side table, as the docs state: \"In 'One To Many' / 'Many To One' associations, you need to define a foreign key column for the 'Many to One' side. E.g. your bar entity comes with multiple foo's. Therefore, you have to add a bar_id column in your foo table.\" The extension is then registered as a service tagged shopware.entity.extension so the DAL picks it up automatically.[from memory]","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-data-associations.html","quote":"In 'One To Many' / 'Many To One' associations, you need to define a foreign key column for the 'Many to One' side. E.g. your bar entity comes with multiple foo's. Therefore, you have to add a bar_id column in your foo table."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 add custom association to product entity DAL developer.shopware.com"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-data-associations.html"}],"notFoundClaim":false,"memoryClaims":["The extension is then registered as a service tagged shopware.entity.extension so the DAL picks it up automatically.[from memory]"],"sourceVerdict":"yes","startedAt":"2026-09-13T06:09:18Z","endedAt":"2026-09-13T06:10:40Z"},"dev-02":{"query":"What's the plugin lifecycle in Shopware — install, activate, uninstall — and how does `keepUserData` work?","category":"dev","option":"vanilla","answer":"A Shopware plugin extends Shopware\\Core\\Framework\\Plugin and implements lifecycle hooks: install() creates initial data (e.g. entities such as payment methods), ideally in an inactive state; activate() enables entities/config once the plugin is turned on; deactivate() reverses that when the plugin is disabled; and uninstall() cleans up the plugin's data when it is removed. The uninstall() method receives an UninstallContext whose keepUserData() method tells you whether the user opted to keep the plugin's data: \"When uninstalling a plugin, you can choose whether to remove all associated plugin data or not. If keepUserData() returns true, you must not delete persistent data created by your plugin.\" In practice this means the uninstall method should check `if ($uninstallContext->keepUserData()) { return; }` before deleting tables/config, so choosing 'keep data' during uninstall in the admin preserves plugin data for a later reinstall.[from memory]","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.html","quote":"When uninstalling a plugin, you can choose whether to remove all associated plugin data or not. If keepUserData() returns true, you must not delete persistent data created by your plugin."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 plugin lifecycle install activate uninstall keepUserData developer.shopware.com"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.html"}],"notFoundClaim":false,"memoryClaims":["In practice this means the uninstall method should check `if ($uninstallContext->keepUserData()) { return; }` before deleting tables/config, so choosing 'keep data' during uninstall in the admin preserves plugin data for a later reinstall.[from memory]"],"sourceVerdict":"yes","startedAt":"2026-09-13T06:09:51Z","endedAt":"2026-09-13T06:11:30Z"},"dev-03":{"query":"How do I add a custom Store API route for a headless storefront?","category":"dev","option":"vanilla","answer":"In a plugin you create an abstract route class (e.g. AbstractExampleRoute) declaring a getDecorated() method and a load() method that takes a Criteria and a SalesChannelContext and returns a custom response object; then you write a concrete implementation extending that abstract class which injects the repositories it needs and performs the actual logic.[from memory] The concrete route class carries a Symfony #[Route] attribute with a `_routeScope` of `store-api` so Shopware exposes it under /store-api/... — as the docs state, \"our class has the attribute Route and the defined _routeScope store-api.\" You also create a response class extending StoreApiResponse to wrap the returned entity/collection, register the route class as a service (with its dependencies), and let Shopware's route auto-discovery pick it up.[from memory] Any entity fields you want exposed through this route must carry the ApiAware flag in their DAL field definition: \"All fields that should be available through the API require the flag ApiAware in the definition.\" For a headless storefront you call this endpoint directly against /store-api/<route>; if you also need it usable from the classic Storefront, you additionally wrap it in a Storefront controller.[from memory]","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/store-api/add-store-api-route.html","quote":"our class has the attribute `Route` and the defined \\_routeScope `store-api`."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/store-api/add-store-api-route.html","quote":"All fields that should be available through the API require the flag `ApiAware` in the definition."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 add custom store api route developer.shopware.com headless"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/store-api/add-store-api-route.html (steps overview)"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/store-api/add-store-api-route.html (exact quote for ApiAware / #[Route])"}],"notFoundClaim":false,"memoryClaims":["In a plugin you create an abstract route class (e.g. AbstractExampleRoute) declaring a getDecorated() method and a load() method that takes a Criteria and a SalesChannelContext and returns a custom response object; then you write a concrete implementation extending that abstract class which injects the repositories it needs and performs the actual logic.[from memory]","You also create a response class extending StoreApiResponse to wrap the returned entity/collection, register the route class as a service (with its dependencies), and let Shopware's route auto-discovery pick it up.[from memory]","For a headless storefront you call this endpoint directly against /store-api/<route>; if you also need it usable from the classic Storefront, you additionally wrap it in a Storefront controller.[from memory]"],"sourceVerdict":"yes","startedAt":"2026-09-13T06:10:29Z","endedAt":"2026-09-13T06:12:40Z"},"dev-04":{"query":"How do I create a custom CMS element for Shopping Experiences?","category":"dev","option":"vanilla","answer":"CMS elements are the smallest content units of the Shopping Experiences (CMS) system, placed inside a block's slots — as the docs put it, \"Elements provide the actual content, while blocks define the structure and layout.\" In a plugin you register a new element in the administration under src/Resources/app/administration/src/module/sw-cms/elements/<element-name>/, with an index.js that calls the CMS service to register it (\"Shopware.Service('cmsService').registerCmsElement()\"), plus a component/ (editor view using the cms-element mixin), config/ (options form) and preview/ (thumbnail) sub-folder.[from memory] On the storefront side you add a Twig template named cms-element-<element-name>.html.twig, which automatically receives an `element` object holding the element's metadata and configuration so it can render the stored data.[from memory]","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/content/cms/add-cms-element.html","quote":"Elements provide the actual content, while blocks define the structure and layout."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/content/cms/add-cms-element.html","quote":"Shopware.Service('cmsService').registerCmsElement()"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 create custom CMS element developer.shopware.com"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/content/cms/add-cms-element.html"}],"notFoundClaim":false,"memoryClaims":["In a plugin you register a new element in the administration under src/Resources/app/administration/src/module/sw-cms/elements/<element-name>/, with an index.js that calls the CMS service to register it (\"Shopware.Service('cmsService').registerCmsElement()\"), plus a component/ (editor view using the cms-element mixin), config/ (options form) and preview/ (thumbnail) sub-folder.[from memory]","On the storefront side you add a Twig template named cms-element-<element-name>.html.twig, which automatically receives an `element` object holding the element's metadata and configuration so it can render the stored data.[from memory]"],"sourceVerdict":"yes","startedAt":"2026-09-13T06:11:16Z","endedAt":"2026-09-13T06:13:20Z"},"dev-05":{"query":"How does theme inheritance work in Shopware — theme.json and SCSS overrides?","category":"dev","option":"vanilla","answer":"A theme's inheritance is declared in its theme.json (in <plugin root>/src/Resources), which has views, style, script and asset sections; each lists the themes/files to pull in, in order, and every custom theme inherits Shopware's default theme through a placeholder, since \"Every theme inherits the default theme of Shopware called @Storefront.\" To inherit from another custom theme (e.g. SwagBasicExampleTheme) you add its name into these arrays alongside @Storefront.[from memory] For SCSS, you place an overrides.scss file at the top of the style array so that SCSS variables (like $border-radius) and Bootstrap/Shopware-defined variables or functions can be redefined before the rest of the stylesheets compile: \"The only difference here is the override.css can affect SCSS variables e.g. $border-radius.\" Because SCSS variable overrides must happen before the variables are consumed, this file has to load first in the style section's inheritance chain.[from memory]","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/themes/add-theme-inheritance.html","quote":"Every theme inherits the default theme of Shopware called `@Storefront`."},{"url":"https://developer.shopware.com/docs/guides/plugins/themes/add-theme-inheritance.html","quote":"The only difference here is the `override.css` can affect SCSS variables e.g. `$border-radius`."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 theme inheritance theme.json SCSS override developer.shopware.com"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/themes/add-theme-inheritance.html"}],"notFoundClaim":false,"memoryClaims":["To inherit from another custom theme (e.g. SwagBasicExampleTheme) you add its name into these arrays alongside @Storefront.[from memory]","Because SCSS variable overrides must happen before the variables are consumed, this file has to load first in the style section's inheritance chain.[from memory]"],"sourceVerdict":"yes","startedAt":"2026-09-13T06:11:49Z","endedAt":"2026-09-13T06:14:20Z"},"dev-06":{"query":"How do I add a custom Flow Builder action?","category":"dev","option":"vanilla","answer":"You create a PHP action class extending Shopware's FlowAction base and implement a requirements() method returning the 'aware' interfaces the action needs (an empty array makes it available to every trigger), plus a handle method that runs your logic, pulling data via $flow->getStore($key) for data coming from aware interfaces or $flow->getData($key) for data from the original event, as the docs put it: \"Use $flow->getStore($key) if you want to get the data from aware interfaces\" and \"Use $flow->getData($key) if you want to get the data from original events.\"[from memory] You register the action class as a service tagged flow.action (with a priority), and \"This tag will ensure that your action is included in the response of the /api/_info/flow-actions.json API.\" Finally, in the Administration you add the action's constant/name and snippet label, extend sw-flow-sequence-action to map the action name to a configuration modal, and build that modal (JS + Twig) so merchants can configure the action's options in the Flow Builder UI.[from memory]","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/flow/add-flow-builder-action.html","quote":"Use `$flow->getStore($key)` if you want to get the data from aware interfaces"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/flow/add-flow-builder-action.html","quote":"This tag will ensure that your action is included in the response of the `/api/_info/flow-actions.json` API."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 add custom flow builder action developer.shopware.com"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/flow/add-flow-builder-action.html"}],"notFoundClaim":false,"memoryClaims":["You create a PHP action class extending Shopware's FlowAction base and implement a requirements() method returning the 'aware' interfaces the action needs (an empty array makes it available to every trigger), plus a handle method that runs your logic, pulling data via $flow->getStore($key) for data coming from aware interfaces or $flow->getData($key) for data from the original event, as the docs put it: \"Use $flow->getStore($key) if you want to get the data from aware interfaces\" and \"Use $flow->getData($key) if you want to get the data from original events.\"[from memory]","Finally, in the Administration you add the action's constant/name and snippet label, extend sw-flow-sequence-action to map the action name to a configuration modal, and build that modal (JS + Twig) so merchants can configure the action's options in the Flow Builder UI.[from memory]"],"sourceVerdict":"yes","startedAt":"2026-09-13T06:12:21Z","endedAt":"2026-09-13T06:15:00Z"},"dev-07":{"query":"My plugin needs to store its own data in a new table — how do I define a custom DAL entity with its definition, entity and collection class so I get a repository for it?","category":"dev","option":"vanilla","answer":"First you write a plugin migration that creates the actual database table (id as primary key, your columns, plus created_at/updated_at).[from memory] Then you create an EntityDefinition subclass implementing getEntityName() (returning the table name) and defineFields() (listing fields such as IdField, StringField, BoolField, etc.), and optionally overriding getEntityClass()/getCollectionClass() to point at your own Entity and EntityCollection classes.[from memory] You add an Entity class extending Shopware's Entity base with the EntityIdTrait plus protected properties and getters/setters matching your fields, and an EntityCollection class extending EntityCollection that overrides getExpectedClass() to return your entity's FQCN.[from memory] Finally you register the definition class in services.xml/php tagged shopware.entity.definition; the docs explain that getEntityName's return value is used for two things: \"The database table name [and] The repository name in the DI container,\" which is why registering the definition with that tag automatically gives you a working `<entity-name>.repository` service for CRUD operations.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.html","quote":"The method `getEntityName` returns a string equal to your table name... Keep in mind, that the return of your `getEntityName` method will be used for two cases: The database table name [and] The repository name in the DI container."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 create custom entity definition entity collection plugin developer.shopware.com"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.html"}],"notFoundClaim":false,"memoryClaims":["First you write a plugin migration that creates the actual database table (id as primary key, your columns, plus created_at/updated_at).[from memory]","Then you create an EntityDefinition subclass implementing getEntityName() (returning the table name) and defineFields() (listing fields such as IdField, StringField, BoolField, etc.), and optionally overriding getEntityClass()/getCollectionClass() to point at your own Entity and EntityCollection classes.[from memory]","You add an Entity class extending Shopware's Entity base with the EntityIdTrait plus protected properties and getters/setters matching your fields, and an EntityCollection class extending EntityCollection that overrides getExpectedClass() to return your entity's FQCN.[from memory]"],"sourceVerdict":"yes","startedAt":"2026-09-13T06:12:58Z","endedAt":"2026-09-13T06:15:50Z"},"dev-08":{"query":"In a plugin service, what is the Shopware 6 equivalent of Doctrine's `findBy()` — how do I read products with filters, associations and sorting?","category":"dev","option":"vanilla","answer":"There is no findBy() in Shopware's Data Abstraction Layer; instead you inject the entity's repository service (e.g. `product.repository`, an instance of EntityRepository) and call search() with a Criteria object and a Context: `public function search(Criteria $criteria, Context $context): EntitySearchResult`. You build the Criteria by chaining addFilter(...$queries) with Filter objects (e.g. EqualsFilter, RangeFilter, MultiFilter) to filter results, addSorting(...$sorting) with FieldSorting objects to order them, and addAssociation('path') (or addAssociations([...])) to eager-load related data — for example addAssociation('categories.media.thumbnails') loads each part of that association path. Calling repository->search($criteria, $context) then returns an EntitySearchResult (an iterable collection) matching the filters, sorting and associations you configured, which is the DAL's equivalent of Doctrine's findBy().","citations":["vendor/shopware/core/Framework/DataAbstractionLayer/EntityRepository.php:59-69","vendor/shopware/core/Framework/DataAbstractionLayer/Search/Criteria.php:255-324"],"toolCallLog":[{"tool":"Bash","args":"find <home>/projects/host-project/vendor/shopware/core/Framework/DataAbstractionLayer -maxdepth 1 -iname 'EntityRepository.php'"},{"tool":"Bash","args":"grep -n \"public function search\\|public function __construct\\|class EntityRepository\" .../EntityRepository.php"},{"tool":"Read","args":"vendor/shopware/core/Framework/DataAbstractionLayer/EntityRepository.php offset=55 limit=40"},{"tool":"Bash","args":"grep -n \"public function addFilter\\|public function addAssociation\\|public function addSorting\\|class Criteria\" .../Criteria.php"},{"tool":"Read","args":"vendor/shopware/core/Framework/DataAbstractionLayer/Search/Criteria.php offset=255 limit=70"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:13:31Z","endedAt":"2026-09-13T06:16:20Z"},"dev-09":{"query":"How do I make a field on my plugin's own entity translatable per language?","category":"dev","option":"vanilla","answer":"First you add a migration for an `{entity}_translation` table holding the entity's foreign key, the language_id foreign key, the translatable columns, and created_at/updated_at.[from memory] Then you create a translation definition class extending EntityTranslationDefinition, overriding getParentDefinitionClass() to point back to your main entity's definition; the docs note this class \"is an aggregation to the ExampleEntity. Therefore, you should place it into the <plugin root>/src/Core/Content/Example/Aggregate directory.\" In your main entity's EntityDefinition you then declare the translatable field with a TranslatedField and add a TranslationsAssociationField that references the translation definition, since \"Our main entity class...must define...a TranslatedField for the translatable field and a TranslationsAssociationField, with a reference to the ExampleTranslationDefinition.\" Finally, you register the translation definition in services.xml/php with the shopware.entity.definition tag, registering it after the parent entity's definition so the DAL can wire the association.[from memory]","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-data-translations.html","quote":"The translation is an aggregation to the `ExampleEntity`. Therefore, you should place it into the `<plugin root>/src/Core/Content/Example/Aggregate` directory."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-data-translations.html","quote":"Our main entity class...must define...a `TranslatedField` for the translatable field and a `TranslationsAssociationField`, with a reference to the ExampleTranslationDefinition."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 translatable field custom entity TranslatedField developer.shopware.com"},{"tool":"WebSearch","args":"Shopware 6 custom entity translation table entity definition TranslationsAssociationField add-custom-complex-data"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-data-translations.html"}],"notFoundClaim":false,"memoryClaims":["First you add a migration for an `{entity}_translation` table holding the entity's foreign key, the language_id foreign key, the translatable columns, and created_at/updated_at.[from memory]","Finally, you register the translation definition in services.xml/php with the shopware.entity.definition tag, registering it after the parent entity's definition so the DAL can wire the association.[from memory]"],"sourceVerdict":"yes","startedAt":"2026-09-13T06:14:02Z","endedAt":"2026-09-13T06:17:10Z"},"dev-10":{"query":"How do I write an indexer that precomputes derived data for my custom entity on write, and how do I trigger a full reindex?","category":"dev","option":"vanilla","answer":"You implement Shopware's EntityIndexer interface with four key methods: getName() returns a unique id for your indexer (e.g. 'swag.basic.example.indexer'); iterate() is used for a full reindex and generates indexing messages for all records — \"This function is called when a full entity indexing was requested\"; update() reacts to an EntityWrittenContainerEvent to build indexing messages just for the records that changed on write; and handle() consumes the messages produced by either iterate() or update() and performs the actual precomputation/write of derived data.[from memory] The docs recommend writing that derived data with a direct database connection rather than through the DAL/repository, because writing through the DAL would itself fire EntityWrittenContainerEvent listeners and could create infinite indexing loops.[from memory] You register the indexer class as a service tagged shopware.entity_indexer so Shopware's indexing registry picks it up.[from memory] To trigger a full reindex (running iterate() across all registered indexers, including yours) you run `bin/console dal:refresh:index` from the console, or trigger the equivalent request from the Administration's system settings.[from memory]","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-data-indexer.html","quote":"This function is called when a full entity indexing was requested."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 custom entity indexer EntityIndexer full reindex dal:refresh:index developer.shopware.com"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-data-indexer.html"}],"notFoundClaim":false,"memoryClaims":["You implement Shopware's EntityIndexer interface with four key methods: getName() returns a unique id for your indexer (e.g. 'swag.basic.example.indexer'); iterate() is used for a full reindex and generates indexing messages for all records — \"This function is called when a full entity indexing was requested\"; update() reacts to an EntityWrittenContainerEvent to build indexing messages just for the records that changed on write; and handle() consumes the messages produced by either iterate() or update() and performs the actual precomputation/write of derived data.[from memory]","The docs recommend writing that derived data with a direct database connection rather than through the DAL/repository, because writing through the DAL would itself fire EntityWrittenContainerEvent listeners and could create infinite indexing loops.[from memory]","You register the indexer class as a service tagged shopware.entity_indexer so Shopware's indexing registry picks it up.[from memory]","To trigger a full reindex (running iterate() across all registered indexers, including yours) you run `bin/console dal:refresh:index` from the console, or trigger the equivalent request from the Administration's system settings.[from memory]"],"sourceVerdict":"yes","startedAt":"2026-09-13T06:14:45Z","endedAt":"2026-09-13T06:18:00Z"},"dev-11":{"query":"On Shopware 6.7, which file do I declare my plugin's services in, and how do I get a core service passed into my service's constructor?","category":"dev","option":"vanilla","answer":"Plugin services are declared in `<PluginRoot>/src/Resources/config/services.php`, a Symfony `ContainerConfigurator` file. To inject a core service (e.g. `SystemConfigService`) into your service's constructor, either enable autowire/autoconfigure so Symfony resolves it automatically, or declare it explicitly with `$services->set(ExampleService::class)->args([service(SystemConfigService::class)]);` and add the corresponding typed constructor parameter to your service class.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/dependency-injection.html","quote":"PLUGIN_ROOT/src/Resources/config/services.php"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/dependency-injection.html","quote":"If you declared the service explicitly, you need to add the `SystemConfigService` as argument to the service."}],"toolCallLog":[{"tool":"Bash","args":"find <home>/projects/host-project/vendor/shopware -iname \"services.xml\" -path \"*Resources*\" | head -5"},{"tool":"Bash","args":"find <home>/projects/host-project/vendor/shopware/core -iname \"services.xml\" | head -10"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/dependency-injection.html, prompt=How does a Shopware plugin declare its services..."},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/dependency-injection.html, prompt=Quote the exact sentences describing where services are registered..."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:09:26Z","endedAt":"2026-09-13T06:12:00Z"},"dev-12":{"query":"I am on Shopware 6.6 — which file do I declare my plugin's service dependencies in, and how do I pass another service into the constructor?","category":"dev","option":"vanilla","answer":"On Shopware 6.6 a plugin declares its services in `<PluginRoot>/src/Resources/config/services.xml`, a Symfony service-container XML file that Shopware automatically loads when it exists. [from memory] To pass another service into a constructor argument you either set `autowire=\"true\"` and `autoconfigure=\"true\"` on the `<services>` node so Symfony resolves typed constructor parameters automatically, or you declare the argument explicitly with `<argument type=\"service\" id=\"Fully\\\\Qualified\\\\ServiceClass\"/>` inside the `<service>` definition, matching the constructor parameter order. [from memory] The current developer.shopware.com documentation has since moved to a PHP `services.php` ContainerConfigurator format (`$services->set(ExampleService::class)->args([service(SystemConfigService::class)]);`), but that format is not part of 6.6's documented plugin approach.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/dependency-injection.html","quote":"$services->set(ExampleService::class)->args([service(SystemConfigService::class)]);"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6.6 plugin services.xml dependency injection Resources/config"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-custom-service.html, prompt=Quote the exact sentences describing the file name and path where a plugin registers its services.xml..."},{"tool":"WebFetch","args":"url=https://web.archive.org/web/2024/https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/dependency-injection.html, prompt=Quote the exact sentences describing the file name and path (services.xml)..."},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/services/dependency-injection.html, prompt=Quote the exact sentences describing the file name and path where a plugin registers its services (services.xml)..."}],"notFoundClaim":false,"memoryClaims":["On Shopware 6.6 a plugin declares its services in `<PluginRoot>/src/Resources/config/services.xml`, a Symfony service-container XML file that Shopware automatically loads when it exists.","To pass another service into a constructor argument you either set `autowire=\"true\"` and `autoconfigure=\"true\"` on the `<services>` node so Symfony resolves typed constructor parameters automatically, or you declare the argument explicitly with `<argument type=\"service\" id=\"Fully\\\\Qualified\\\\ServiceClass\"/>` inside the `<service>` definition, matching the constructor parameter order."],"sourceVerdict":"partial","startedAt":"2026-09-13T06:10:46Z","endedAt":"2026-09-13T06:13:30Z"},"dev-13":{"query":"There is no event for what I need to change in a core Shopware service — how do I decorate or replace that service from my plugin?","category":"dev","option":"vanilla","answer":"Shopware core services that are meant to be extended expose an abstract class (not an interface) as their public contract, and you decorate them from your plugin's `services.php` by registering your own class with `->decorate(ExampleService::class)->args([service('.inner')])`. Your decorator class must extend the same abstract class, accept the decorated instance (injected via `.inner`) in its constructor, and implement `getDecorated()` returning that inner instance, while the original core service's `getDecorated()` throws `DecorationPatternException` because it has no decorator of its own. Because the decorator replaces the service for every caller in the container, you can run code before/after the core logic, change arguments, modify the return value, or skip the core implementation entirely, and multiple plugins can chain decorators (each wrapping the previous one).","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/services/adjusting-service.html","quote":"Register both the original service and the decorator in `services.php`. Use the `decorate` method to point to the service being decorated."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/services/adjusting-service.html","quote":"Define an abstract class for the service contract. Unlike interfaces, abstract classes allow adding new methods without breaking existing decorators."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/services/adjusting-service.html","quote":"Its `getDecorated()` throws `DecorationPatternException` because it has no decorator yet"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware developer.shopware.com decorate a service plugin decoration pattern"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/services/adjusting-service.html, prompt=Quote the exact sentences and code that describe how to decorate a core Shopware service from a plugin..."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:13:35Z","endedAt":"2026-09-13T06:15:00Z"},"dev-14":{"query":"I wrote a subscriber class in my plugin but it never fires — which interface and which service tag (`shopware.event_subscriber`?) register it?","category":"dev","option":"vanilla","answer":"Your subscriber class must implement Symfony's `EventSubscriberInterface`, and the correct service tag is `kernel.event_subscriber` — not `shopware.event_subscriber` (that tag does not exist). Implementing the interface alone is not enough: the class must also be registered as a service in your plugin's `services.php` (or `services.xml`) and tagged with `kernel.event_subscriber`; if autoconfigure is enabled the tag can be applied automatically, but if the class is missing from the service configuration entirely, Shopware never calls it and there is no obvious error indicating the event was not handled.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/listening-to-events.html","quote":"You're simply registering your (subscriber) service by mentioning it in the `services.php`. The only difference to a normal service is that you need to add the `kernel.event_subscriber` tag to your subscriber for it to be recognized as such."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/listening-to-events.html","quote":"Creating the subscriber class alone is not enough. It must be registered in the dependency injection container and tagged with `kernel.event_subscriber`. If the class is missing from `services.php`, Shopware will not call it and there may be no obvious error indicating that the event was not handled."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware developer.shopware.com listening to events subscriber kernel.event_subscriber"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/listening-to-events.html, prompt=Quote the exact sentences describing which PHP interface a subscriber class must implement..."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:15:05Z","endedAt":"2026-09-13T06:16:20Z"},"dev-15":{"query":"How do I work out which event Shopware actually dispatches for a given action, for example after a product is loaded or a page is rendered?","category":"dev","option":"vanilla","answer":"Shopware's own guidance is to search the core codebase for the terms `extends NestedEvent`, `extends Event`, `implements ShopwareEvent`, and `->dispatch`, or to look at the service you want to extend and check its constructor parameters/service definition for an injected `event_dispatcher`, following the code to the `$this->eventDispatcher->dispatch(...)` call. For page-related events specifically it recommends searching for `PageLoadedEvent`, and for data/criteria events searching for `CriteriaEvent`, or `implements BusinessEventInterface`/`implements MailActionInterface` for business events. At runtime, the easiest way is to use the Symfony web profiler's \"Events\" tab, which lists every event actually fired during the current request; for Storefront JavaScript events search for `$emitter.publish`, and for Administration events search for `$emit`.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/event/finding-events.html","quote":"Use one of the following search terms: `extends NestedEvent`, `extends Event`, `implements ShopwareEvent`, `->dispatch`"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/event/finding-events.html","quote":"Use the profiler to easily find all fired events in the current request. Open the profiler and clicking on the 'Events' tab on the left."}],"toolCallLog":[{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/framework/event/finding-events.html, prompt=Quote the exact sentences that describe practical ways to find out which event Shopware dispatches..."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:16:25Z","endedAt":"2026-09-13T06:17:20Z"},"dev-16":{"query":"How do I run plugin logic whenever an order is written, and find out exactly which fields changed?","category":"dev","option":"vanilla","answer":"Register an event subscriber (tagged `kernel.event_subscriber`) that listens on the entity-written event name, which for orders is `order.written` — Shopware dispatches `Shopware\\Core\\Framework\\DataAbstractionLayer\\Event\\EntityWrittenEvent`, whose name is built as `$entityName . '.written'`. [from memory] From the event you can call `getWriteResults()` to get a `list<EntityWriteResult>` for every written order, and `getPayloads()`/`getIds()` for the raw payloads and primary keys. To find out exactly which fields changed, call `getChangeSet()` on the `EntityWriteResult` — it returns a nullable `ChangeSet` object exposing `getBefore($property)`, `getAfter($property)`, and `hasChanged($property)` (backed by internal `$state`/`$after` arrays computed by intersecting the write payload with the prior entity state); the `ChangeSet` is only populated for a given write command when change-set tracking has been requested for it (e.g. via `ChangeSetAware`/`requestChangeSet()`), otherwise `getChangeSet()` returns null.","citations":["vendor/shopware/core/Framework/DataAbstractionLayer/Event/EntityWrittenEvent.php:1-166","vendor/shopware/core/Framework/DataAbstractionLayer/EntityWriteResult.php:1-85","vendor/shopware/core/Framework/DataAbstractionLayer/Write/Command/ChangeSet.php:1-86"],"toolCallLog":[{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/using-database-events.html, prompt=Quote the exact sentences describing how to react to an entity (e.g. order) being written using EntityWrittenEvent..."},{"tool":"Bash","args":"find <home>/projects/host-project/vendor/shopware/core/Framework/DataAbstractionLayer -iname \"WriteCommand*.php\" -o -iname \"EntityWrittenEvent.php\" | grep -v Test"},{"tool":"Read","args":"<home>/projects/host-project/vendor/shopware/core/Framework/DataAbstractionLayer/Write/Command/WriteCommand.php"},{"tool":"Read","args":"<home>/projects/host-project/vendor/shopware/core/Framework/DataAbstractionLayer/Event/EntityWrittenEvent.php"},{"tool":"Bash","args":"grep -n \"function get\\|ChangeSet\\|class EntityWriteResult\" <home>/projects/host-project/vendor/shopware/core/Framework/DataAbstractionLayer/EntityWriteResult.php"},{"tool":"Bash","args":"grep -rn \"requireChangeSet\\|ChangeSetAware\" <home>/projects/host-project/vendor/shopware/core/Framework/DataAbstractionLayer/*.php <home>/projects/host-project/vendor/shopware/core/Framework/DataAbstractionLayer/Write/*.php"},{"tool":"Bash","args":"grep -n \"requireChangeSet\\|function .*ChangeSet\" <home>/projects/host-project/vendor/shopware/core/Framework/DataAbstractionLayer/Write/Command/ChangeSetAware.php; grep -rln \"requireChangeSet\" <home>/projects/host-project/vendor/shopware/core/"},{"tool":"Bash","args":"grep -n \"function \\|class ChangeSet\" <home>/projects/host-project/vendor/shopware/core/Framework/DataAbstractionLayer/Write/Command/ChangeSet.php"},{"tool":"Read","args":"<home>/projects/host-project/vendor/shopware/core/Framework/DataAbstractionLayer/EntityWriteResult.php"},{"tool":"Read","args":"<home>/projects/host-project/vendor/shopware/core/Framework/DataAbstractionLayer/Write/Command/ChangeSet.php"}],"notFoundClaim":false,"memoryClaims":["Register an event subscriber (tagged `kernel.event_subscriber`) that listens on the entity-written event name, which for orders is `order.written` — Shopware dispatches `Shopware\\Core\\Framework\\DataAbstractionLayer\\Event\\EntityWrittenEvent`, whose name is built as `$entityName . '.written'`."],"sourceVerdict":"yes","startedAt":"2026-09-13T06:17:25Z","endedAt":"2026-09-13T06:22:30Z"},"dev-17":{"query":"How do I overwrite the price of a product line item in the cart at runtime from a plugin?","category":"dev","option":"vanilla","answer":"Implement `Shopware\\Core\\Checkout\\Cart\\CartProcessorInterface` (typically alongside `CartDataCollectorInterface`) and inject `Shopware\\Core\\Checkout\\Cart\\Price\\QuantityPriceCalculator` to recalculate the price. [from memory] In the processor's `process` method you build a `QuantityPriceDefinition` and calculate it, then apply the result to the line item: `$definition = new QuantityPriceDefinition($newPrice, $product->getPrice()->getTaxRules(), $product->getPrice()->getQuantity()); $calculated = $this->calculator->calculate($definition, $context); $product->setPrice($calculated); $product->setPriceDefinition($definition);`. The service is registered by tagging it, e.g. with `->tag('shopware.cart.processor', ['priority' => 4500])` and `->tag('shopware.cart.collector', ['priority' => 4500])`. Shopware's own guide cautions that overwriting a price this way should rarely be done and recommends discounts/surcharges for most use cases instead.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/cart/change-price-of-item.html","quote":"Changing the price like it's done in the following example should rarely be done"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/cart/change-price-of-item.html","quote":"$definition = new QuantityPriceDefinition(\n    $newPrice,\n    $product->getPrice()->getTaxRules(),\n    $product->getPrice()->getQuantity()\n);\n\n$calculated = $this->calculator->calculate($definition, $context);\n\n$product->setPrice($calculated);\n$product->setPriceDefinition($definition);"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware developer.shopware.com cart line item price definition setPrice CalculatedPrice plugin"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/checkout/cart/change-price-of-item.html, prompt=Quote the exact sentences and code describing how to overwrite the price of a product line item in the cart from a plugin..."}],"notFoundClaim":false,"memoryClaims":["Implement `Shopware\\Core\\Checkout\\Cart\\CartProcessorInterface` (typically alongside `CartDataCollectorInterface`) and inject `Shopware\\Core\\Checkout\\Cart\\Price\\QuantityPriceCalculator` to recalculate the price."],"sourceVerdict":"yes","startedAt":"2026-09-13T06:22:35Z","endedAt":"2026-09-13T06:24:00Z"},"dev-18":{"query":"My plugin's cart processor adds a surcharge line item, but it is added again on every recalculation and its price is stale after the customer changes the quantity — how do I split the work between the collector and the processor?","category":"dev","option":"vanilla","answer":"The rule Shopware documents is: the collector (`CartDataCollectorInterface::collect`) is the only place allowed to run queries or expensive lookups, and the processor (`CartProcessorInterface::process`) must not query data because it can run several times per calculation — \"Do not query data in the process method, since it may be executed a lot of times. Always use the collect method of a collector for this case!\". So your surcharge amount/eligibility data (anything that needs a DB call or depends on cart contents) should be computed once in `collect()` and stashed in the `CartDataCollection`, while the processor should be the only place that actually adds or updates the line item in the cart each pass — checking whether the line item already exists (e.g. via the cart's line-item collection) and either updating its price/quantity-derived value in place or adding it once, rather than blindly appending a new line item every run. [from memory] Recalculating the price from current cart quantity inside the processor (using the pre-collected data) on every pass is what keeps the surcharge's price in sync after the customer changes quantity, since the processor is guaranteed to re-run on every cart recalculation. [from memory]","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.html","quote":"Do not query data in the process method, since it may be executed a lot of times. Always use the collect method of a collector for this case!"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.html","quote":"A collector can and should be used to retrieve additional data for the cart, e.g. by querying the database."}],"toolCallLog":[{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/checkout/cart/add-cart-discounts.html, prompt=Quote the exact sentences and code that explain how to split work between a CartDataCollectorInterface collector and a CartProcessorInterface processor..."},{"tool":"WebSearch","args":"Shopware CartDataCollectorInterface vs CartProcessorInterface avoid duplicate line item recalculation"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.html, prompt=Quote the exact sentences and code explaining the split between the collector and the processor..."}],"notFoundClaim":false,"memoryClaims":["checking whether the line item already exists (e.g. via the cart's line-item collection) and either updating its price/quantity-derived value in place or adding it once, rather than blindly appending a new line item every run.","Recalculating the price from current cart quantity inside the processor (using the pre-collected data) on every pass is what keeps the surcharge's price in sync after the customer changes quantity, since the processor is guaranteed to re-run on every cart recalculation."],"sourceVerdict":"partial","startedAt":"2026-09-13T06:24:05Z","endedAt":"2026-09-13T06:26:30Z"},"dev-19":{"query":"I need to move long-running work in my plugin out of the request into the message queue — what does the handler class look like and how is it registered?","category":"dev","option":"vanilla","answer":"First create a message class implementing `AsyncMessageInterface` that carries the data your handler needs (all messages implementing this interface are routed to the async transport by default). [from memory] The handler itself is a plain class marked with the `#[AsMessageHandler]` PHP attribute and an `__invoke()` method type-hinted with your message class, for example: `#[AsMessageHandler] class SmsHandler { public function __invoke(SmsNotification $message) { // ... do some work - like sending an SMS message! } }`. Shopware discovers handlers via that attribute automatically; the documentation also notes the underlying/manual mechanism is to tag the handler service with `messenger.message_handler` — \"To register a handler, we have to tag it with the `messenger.message_handler` tag.\"","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/message-queue/add-message-handler.html","quote":"To mark the class as message handler, we use the php attribute `#[AsMessageHandler]` and implement the method `__invoke`."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/message-queue/add-message-handler.html","quote":"To register a handler, we have to tag it with the `messenger.message_handler` tag."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware developer.shopware.com message queue add message handler AsyncMessageInterface"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/framework/message-queue/add-message-handler.html, prompt=Quote the exact sentences and code showing what a message handler class looks like..."}],"notFoundClaim":false,"memoryClaims":["First create a message class implementing `AsyncMessageInterface` that carries the data your handler needs (all messages implementing this interface are routed to the async transport by default)."],"sourceVerdict":"yes","startedAt":"2026-09-13T06:26:35Z","endedAt":"2026-09-13T06:28:00Z"},"dev-20":{"query":"How do I add my own condition to the Rule Builder from a plugin so shop owners can select it?","category":"dev","option":"vanilla","answer":"Create a PHP class extending the abstract `Rule` class (e.g. `class FirstMondayOfTheMonthRule extends Rule`) implementing `match(RuleScope $scope): bool` for the actual condition logic, `getName()` for a unique technical identifier, and `getConstraints()` for the field types. Implementing `getConfig(): RuleConfig` (e.g. `return (new RuleConfig())->booleanField('isFirstMondayOfTheMonth');`) lets you describe the fields the condition needs so the Administration's generic condition component can render them without a custom Vue component. Register the rule class as a service in `services.php` tagged `shopware.rule.definition` so the rule system picks it up. To make it appear as a selectable condition in the Rule Builder UI, decorate the rule condition data provider service in the Administration (in a `rule-condition-service-decoration.js`) and call something like `ruleConditionService.addCondition('first_monday', { component: 'swag-first-monday', label: 'Is first monday of the month', scopes: ['global'] });`, registering the condition's technical name, UI component, label, and applicable scopes.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/rule/add-custom-rules.html","quote":"public function getConfig(): RuleConfig { return (new RuleConfig())->booleanField('isFirstMondayOfTheMonth'); }"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/rule/add-custom-rules.html","quote":"ruleConditionService.addCondition('first_monday', { component: 'swag-first-monday', label: 'Is first monday of the month', scopes: ['global'] });"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware developer.shopware.com add custom rule condition plugin Rule class RuleConfig administration"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/framework/rule/add-custom-rules.html, prompt=Quote the exact sentences and code showing: how to define a custom Rule class..."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:28:05Z","endedAt":"2026-09-13T06:29:30Z"},"dev-21":{"query":"My plugin dispatches its own domain event — how do I make it show up as a trigger in the Flow Builder?","category":"dev","option":"vanilla","answer":"Your event class must implement the FlowEventAware interface, which is the base interface every Flow Builder trigger needs, and typically also at least one additional \"Aware\" interface (e.g. CustomerAware, OrderAware, MailAware) so the data needed by flow actions is available. Any event implementing one of these interfaces will be available in the trigger list of the Flow Builder module in the Administration. You then implement getName() to return a unique event name, getContext(), the getter(s) required by the Aware interface you chose (e.g. getCustomerId() for CustomerAware), and getAvailableData() to return an EventDataCollection describing the data exposed to flow actions. To register the event definition you add a BusinessEventCollectorSubscriber listening to BusinessEventCollectorEvent that calls BusinessEventCollector::define() for your event class, registered in services.xml/services.php with a suitably high priority so it is picked up before other subscribers run.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.html","quote":"Any event that implements one of these interfaces will be available in the trigger list of the Flow Builder module."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 plugin custom event Flow Builder trigger FlowEventAware"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.html, prompt=Explain how to make a custom domain event show up as a trigger in Flow Builder. What interfaces need to be implemented, what methods, and how is it registered?"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:09:26Z","endedAt":"2026-09-13T06:10:40Z"},"dev-22":{"query":"How do I give my plugin a settings page the shop operator can fill in, and what field types are available?","category":"dev","option":"vanilla","answer":"You create a config.xml file at src/Resources/config/config.xml inside your plugin; Shopware renders it automatically as a settings page in the Administration without needing a custom module. The file must contain at least one card, each card needs a title and at least one input-field [from memory]. Available input-field types include text, textarea, text-editor, url, password, int, float, bool, checkbox, datetime, date, time, colorpicker, single-select and multi-select, and more advanced components such as sw-entity-single-select and sw-media-field can be used for entity selection or media uploads [from memory].","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.html","quote":"Create `src/Resources/config/config.xml` inside your plugin."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 plugin configuration system config.xml field types shop operator settings"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.html, prompt=Explain how to create a plugin settings page via config.xml, and list the available input-field types."},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.html, prompt=Quote verbatim the sentence(s) describing where to put the config.xml file and how many input-field types exist (list them as written in the source, verbatim)."}],"notFoundClaim":false,"memoryClaims":["The file must contain at least one card, each card needs a title and at least one input-field.","Available input-field types include text, textarea, text-editor, url, password, int, float, bool, checkbox, datetime, date, time, colorpicker, single-select and multi-select, and more advanced components such as sw-entity-single-select and sw-media-field can be used for entity selection or media uploads."],"sourceVerdict":"yes","startedAt":"2026-09-13T06:09:59Z","endedAt":"2026-09-13T06:12:30Z"},"dev-23":{"query":"How do I ship a mail template with my plugin so it is installed automatically, including a custom mail template type?","category":"dev","option":"vanilla","answer":"The documented, standard way of shipping a mail template with a plugin is via a database migration: adding a mail template is done by using a plugin database migration. In that migration you first obtain or create a mail_template_type entry (insert a technical name and, if it's a custom type, an available_entities JSON field listing which entities the template can access, e.g. {'product': 'product'}), then insert a row into mail_template referencing that type id, and finally insert one mail_template_translation row per supported language (e.g. en-GB, de-DE) plus a mail_template_type_translation row with the localized type name. The migration should use INSERT IGNORE so re-running it on update/reinstall does not throw, and the docs explicitly warn not to remove e-mail templates in your plugin's migrations since this may lead to data inconsistency.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/content/mail/add-mail-template.html","quote":"adding a mail template is done by using a plugin database migration."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/content/mail/add-mail-template.html","quote":"Do not remove e-mail templates in your plugin...This may lead to data inconsistency"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 plugin ship mail template automatically MailTemplateType installer"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/content/mail/add-mail-template.html, prompt=Explain, quoting verbatim key sentences, how to ship a mail template with a plugin so it's installed automatically, and how to add a custom mail template type."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:10:42Z","endedAt":"2026-09-13T06:13:20Z"},"dev-24":{"query":"How do I get readable SEO URLs generated for the detail pages of my plugin's own entity?","category":"dev","option":"vanilla","answer":"Create a class implementing SeoUrlRouteInterface for your entity/route. Its getConfig method must return an instance of SeoUrlRouteConfig, containing your entity's definition, the technical name of the route to be used, and the desired SEO path, its prepareCriteria method lets you adjust which entities are eligible, and its getMapping method must return an instance of SeoUrlMapping which has to contain the actually available data for the SEO URL template. Register this class with the container tag shopware.seo_url.route [from memory]. Then add a subscriber that reacts to your entity's .written (and .deleted) DAL events and calls SeoUrlUpdater::update with the route name and the affected entity IDs so SEO URLs are (re)generated whenever entities change. Finally ship a migration that inserts a row into the seo_url_template table specifying route_name, entity_name and the template string, which is what tells Shopware the default URL pattern to use for that route/entity combination.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/content/seo/add-custom-seo-url.html","quote":"return an instance of `SeoUrlRouteConfig`, containing your entity's definition, the technical name of the route to be used, and the desired SEO path"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/content/seo/add-custom-seo-url.html","quote":"return an instance of `SeoUrlMapping`. It has to contain the actually available data for the SEO URL template"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 custom entity SEO URL generation seo url template plugin entity"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/content/seo/add-custom-seo-url.html, prompt=Quote verbatim the steps needed to get readable SEO URLs generated for a custom entity's detail page, including seo_url_template setup and SeoUrlRoute interface."}],"notFoundClaim":false,"memoryClaims":["Register this class with the container tag shopware.seo_url.route."],"sourceVerdict":"yes","startedAt":"2026-09-13T06:11:14Z","endedAt":"2026-09-13T06:14:10Z"},"dev-25":{"query":"How do I add a `bin/console` command to my plugin for a maintenance task?","category":"dev","option":"vanilla","answer":"Create a command class (e.g. src/Command/ExampleCommand.php) that extends Symfony\\Component\\Console\\Command\\Command and uses the #[AsCommand(name: 'swag:example', description: '...')] attribute, implementing execute(InputInterface $input, OutputInterface $output): int and returning Command::SUCCESS. Then register it as a service in your plugin's src/Resources/config/services.php and tag it with console.command, e.g. $services->set(Swag\\BasicExample\\Command\\ExampleCommand::class)->tag('console.command'); once the plugin is installed/active the command becomes available under bin/console.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.html","quote":"Register it as a service in your plugin's `src/Resources/config/services.php` and tag it with `console.command`"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 plugin add console command bin/console"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.html, prompt=Quote verbatim the instructions on how to add a custom console command to a plugin, including the service tag needed and command class structure."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:11:47Z","endedAt":"2026-09-13T06:15:00Z"},"dev-26":{"query":"How do I add a custom document type such as a pro-forma invoice in Shopware 6.7?","category":"dev","option":"vanilla","answer":"In Shopware 6.7 the core mechanism for document types is Shopware\\Core\\Checkout\\Document\\Renderer\\AbstractDocumentRenderer, an abstract class that declares three abstract methods: supports(): string, render(array $operations, Context $context, DocumentRendererConfig $rendererConfig): RendererResult, and getDecorated(): AbstractDocumentRenderer. Core renderers such as InvoiceRenderer, DeliveryNoteRenderer, StornoRenderer and CreditNoteRenderer all implement this class and are registered in the DI container with the service tag document.renderer (the DocumentRendererRegistry collects all services tagged document.renderer via a tagged_iterator, and dispatches to whichever renderer's supports() matches the requested document type). To add a custom document type such as a pro-forma invoice you would therefore: add a document_type (and document_type_translation) database entry for your new technical name via a migration [from memory]; implement your own class extending/implementing AbstractDocumentRenderer whose supports() returns your technical name and whose render() builds a RendererResult (typically using a Twig template, e.g. extending the core document base template) [from memory]; and register that service with the document.renderer tag so the registry picks it up [confirmed from source]. You would also normally add a number range migration (number_range_type/number_range/number_range_sales_channel entries) so documents of the new type get sequential numbers, mirroring how core document types are set up [from memory].","citations":["vendor/shopware/core/Checkout/Document/Renderer/AbstractDocumentRenderer.php:19-28","vendor/shopware/core/Checkout/Document/Renderer/DocumentRendererRegistry.php:1-37"],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 add custom document type pro-forma invoice plugin DocumentTypeEntity"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/checkout/document/add-custom-document-type.html, prompt=Quote verbatim the steps to add a custom document type such as a pro-forma invoice, including the DocumentTypeEntity migration and the AbstractDocumentRenderer methods and registration tag."},{"tool":"WebFetch","args":"url=https://raw.githubusercontent.com/shopware/docs/main/guides/plugins/plugins/checkout/document/add-custom-document-type.md, prompt=Quote verbatim the steps to add a custom document type such as a pro-forma invoice, including the document_type migration and the AbstractDocumentRenderer methods and registration tag."},{"tool":"WebFetch","args":"url=https://github.com/benjroesner/shopware-docs/blob/master/guides/plugins/plugins/checkout/document/add-custom-document-type.md, prompt=Quote verbatim the steps to add a custom document type such as a pro-forma invoice, including the document_type migration and the AbstractDocumentRenderer methods and registration tag."},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/checkout/document/add-custom-document-type.html, prompt=Quote verbatim the steps and methods (AbstractDocumentRenderer, supports, render, document.renderer tag) needed to add a custom document type like a pro-forma invoice."},{"tool":"WebFetch","args":"url=https://github.com/fossaag/shopware_docs/blob/master/guides/plugins/plugins/checkout/document/add-custom-document-type.md, prompt=Quote verbatim the full content of this page: steps, class names, method names, tags used to add a custom document type."},{"tool":"Bash","args":"find <home>/projects/host-project/vendor/shopware/core/Checkout/Document -iname \"*Renderer*\"; find ... -iname \"*Generator*\""},{"tool":"Read","args":"file_path=<home>/projects/host-project/vendor/shopware/core/Checkout/Document/Renderer/AbstractDocumentRenderer.php"},{"tool":"Bash","args":"grep -rn \"document.renderer|document_renderer\" vendor/shopware/core/Checkout/Document/ --include=*.xml"},{"tool":"Bash","args":"grep -rln \"AbstractDocumentRenderer\" vendor/shopware/core/Checkout/Document/Resources/config/ ; find vendor/shopware/core/Checkout/Document -iname *.xml | xargs grep -l Renderer"},{"tool":"Bash","args":"find <home>/projects/host-project/vendor/shopware/core/Checkout/Document -iname \"*.xml\""},{"tool":"Read","args":"file_path=<home>/projects/host-project/vendor/shopware/core/Checkout/Document/Renderer/DocumentRendererRegistry.php"},{"tool":"Bash","args":"grep -rn \"documentRenderers|document.renderer\" vendor/shopware/core/DependencyInjection/Configuration*; grep -rln \"DocumentRendererRegistry\" vendor/shopware/core --include=*.php --include=*.xml"},{"tool":"Bash","args":"grep -n \"tag|Renderer\" vendor/shopware/core/Checkout/DependencyInjection/document.xml"}],"notFoundClaim":false,"memoryClaims":["add a document_type (and document_type_translation) database entry for your new technical name via a migration","implement your own class extending/implementing AbstractDocumentRenderer whose supports() returns your technical name and whose render() builds a RendererResult (typically using a Twig template, e.g. extending the core document base template)","You would also normally add a number range migration (number_range_type/number_range/number_range_sales_channel entries) so documents of the new type get sequential numbers, mirroring how core document types are set up"],"sourceVerdict":"partial","startedAt":"2026-09-13T06:12:17Z","endedAt":"2026-09-13T06:18:00Z"},"dev-27":{"query":"In Shopware 6.7, how do I extend a Storefront Twig template from my plugin with `{% extends %}` so I keep the core markup and other plugins' changes?","category":"dev","option":"vanilla","answer":"You should not use plain Twig `{% extends %}` for this in Shopware; instead Shopware provides its own `{% sw_extends %}` tag, which inherits from another file with support for multi inheritance, the API is the same like in Twig's default extends, but unlike plain extends it allows multiple plugins/themes to each extend the same template in a chain without one plugin's extension overwriting another's, which is exactly what is needed to keep both the core markup and other plugins' changes intact. Plain `extends` only supports a single linear inheritance chain, so if two plugins both tried to `extends` the same core template only one of them would end up in effect; `sw_extends` is Shopware's drop-in replacement designed to resolve this by chaining all registered extensions of a template together. The related `{% sw_use %}` tag (for importing blocks rather than full inheritance) carries a similar warning: templates imported this way cannot contain additional Twig statements outside blocks, and changes in core templates imported via sw_use might break your app or plugin.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/templates/twig-function-reference.html","quote":"Inherits from another file with support for multi inheritance. The API is the same like in Twig's default `extends`"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/templates/twig-function-reference.html","quote":"changes in core templates which are imported via {% sw_use %} might break your app or plugin."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 storefront twig sw_extends vs extends template inheritance plugin"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/storefront/templates/twig-function-reference.html, prompt=Quote verbatim what the page says about sw_extends versus extends for template inheritance, and why plugins should use sw_extends to keep core markup and other plugins' changes."}],"notFoundClaim":false,"memoryClaims":["Plain `extends` only supports a single linear inheritance chain, so if two plugins both tried to `extends` the same core template only one of them would end up in effect; `sw_extends` is Shopware's drop-in replacement designed to resolve this by chaining all registered extensions of a template together."],"sourceVerdict":"yes","startedAt":"2026-09-13T06:14:06Z","endedAt":"2026-09-13T06:19:30Z"},"dev-28":{"query":"How do I override an existing Storefront JavaScript plugin, such as the cookie permission bar, from my own plugin instead of registering a new one?","category":"dev","option":"vanilla","answer":"Create your own plugin class (e.g. <plugin root>/src/Resources/app/storefront/src/my-plugin-name/my-plugin-name.plugin.js) that extends the original, e.g. `import CookiePermissionPlugin from 'src/plugin/cookie/cookie-permission.plugin'; export default class MyCookiePermission extends CookiePermissionPlugin { /* override methods */ }` (if the class isn't directly importable you can instead get it via `PluginManager.getPlugin('CookiePermission').get('class')`). Then in your storefront entry point (<plugin root>/src/Resources/app/storefront/src/main.js) register it with `PluginManager.override('CookiePermission', MyCookiePermission, '[data-cookie-permission]')` instead of PluginManager.register, which replaces the original plugin's implementation on the same DOM selector; for asynchronously loaded plugins you can pass a dynamic import function instead of the class directly, e.g. PluginManager.override('CookiePermission', () => import('./my-plugin-name/my-plugin-name.plugin'), '[data-cookie-permission]'). One important limitation to be aware of: each JavaScript plugin can only be overridden once — if multiple Shopware plugins attempt to override the same plugin, only the final one will function.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/override-existing-javascript.html","quote":"Each JavaScript plugin can only be overridden once."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 storefront override existing JavaScript plugin PluginManager.override cookie permission"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/storefront/override-existing-javascript.html, prompt=Quote verbatim the steps and code for overriding an existing storefront JS plugin such as CookiePermission using PluginManager.override, and any limitations noted."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:14:40Z","endedAt":"2026-09-13T06:20:20Z"},"dev-29":{"query":"How do I add my own data to an existing Storefront page or pagelet from a plugin without overriding the core controller?","category":"dev","option":"vanilla","answer":"You subscribe to the relevant *PageLoadedEvent or *PageletLoadedEvent (e.g. FooterPageletLoadedEvent) via a class implementing EventSubscriberInterface, and register that subscriber in your plugin's services.php/services.xml tagged as kernel.event_subscriber. Inside the event handler you fetch whatever additional data you need — the documented best practice is to create a dedicated store-api route for that rather than calling the DAL directly from the subscriber — and attach the result to the page/pagelet object using its addExtension() method, e.g. $event->getPagelet()->addExtension('data_key', $data). Finally, in a Storefront template override (using sw_extends, not the core controller) you read that data back out via the extensions collection, e.g. {{ pagelet.extensions.data_key }}. This way you never touch or override the core controller — all the extra data flows through the event and the extension bag.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/add-data-to-storefront-page.html","quote":"$event->getPagelet()->addExtension('data_key', $data)"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 add data to storefront page pagelet PageLoadedEvent add extension plugin"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/storefront/add-data-to-storefront-page.html, prompt=Quote verbatim the steps to add custom data to an existing storefront page/pagelet from a plugin, including the addExtension/getExtension pattern and event subscriber registration."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:15:12Z","endedAt":"2026-09-13T06:21:00Z"},"dev-30":{"query":"How do I add a custom filter to the Storefront product listing from my plugin, both the criteria side and the filter panel?","category":"dev","option":"vanilla","answer":"On the criteria/backend side, create a subscriber implementing EventSubscriberInterface that listens to \\Shopware\\Core\\Content\\Product\\Events\\ProductListingCollectFilterEvent, this event was introduced to enable every developer to specify the metadata for a filter. In your listener you build a Filter instance (with a unique name, a filtered flag, its aggregations, the actual DAL filter to apply, and the values that should populate the current filter state) and add it to the collection via $event->getFilters()->add($filter). On the Storefront/template side you extend storefront/component/listing/filter-panel.html.twig (with sw_extends) and override the block that renders the filter items; the existing filters are contained in the block component_filter_panel_items, so you extend that block and use sw_include to render one of the existing filter components (e.g. filter-boolean.html.twig, filter-multi-select.html.twig, filter-range.html.twig) for your new filter, passing it the name and displayName parameters.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/howto/add-listing-filters.html","quote":"This event was introduced to enable every developer to specify the metadata for a filter."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/howto/add-listing-filters.html","quote":"The existing filters are contained in the block `component_filter_panel_items`."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 add custom filter product listing storefront plugin criteria filter panel"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/storefront/howto/add-listing-filters.html, prompt=Quote verbatim the steps for adding a custom filter to the product listing, covering both the criteria/subscriber side (ProductListingCollectFilterEvent) and the Storefront filter panel template side."},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/storefront/howto/add-listing-filters.html, prompt=Quote a couple of sentences verbatim, exactly as written on the page, describing the ProductListingCollectFilterEvent and the filter-panel.html.twig template block."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:15:44Z","endedAt":"2026-09-13T06:22:30Z"},"dev-31":{"query":"How do I expose a plugin configuration value, such as a colour picked in the Administration, as an SCSS variable in my Storefront styling?","category":"dev","option":"vanilla","answer":"Add the configuration field (e.g. a colorpicker) to your plugin's config.xml so merchants can set it in the Administration. Then create an event subscriber that listens to the ThemeCompilerEnrichScssVariablesEvent, reads the value via SystemConfigService using the dot-notation key '<PluginName>.config.<fieldName>' and the sales channel id from the event, and calls $event->addVariable('your-variable-name', $value) to expose it as an SCSS variable that can then be used in your plugin's SCSS files.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.html","quote":"Listen to the `ThemeCompilerEnrichScssVariablesEvent` event. Inject `SystemConfigService` and read the configuration value:"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware plugin configuration value as SCSS variable Storefront"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.html, prompt=Explain how to expose a plugin configuration value (e.g. a color picked in administration) as an SCSS variable in storefront styling. Include the event name and code steps."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:08:00Z","endedAt":"2026-09-13T06:09:56Z"},"dev-32":{"query":"How do I define a custom field set for products from my plugin so merchants can edit the values in the Administration?","category":"dev","option":"vanilla","answer":"The simplest way is the declarative approach: ship a file at <plugin root>/src/Resources/config/custom-fields.xml describing a <custom-field-set> with a name, label(s), a <related-entities> block containing <product/>, and a <fields> block listing the field types (e.g. int, text) with labels and positions; Shopware then creates, updates and removes this set automatically during the plugin lifecycle, and the fields become editable on the product detail page in the Administration. Alternatively, for dynamic runtime creation, you can inject the custom_field_set.repository service and call create() with an array describing the set's name, global flag, config/label, and a customFields array (each with a name, type such as CustomFieldTypes::INT, and config/label/position) during plugin installation. Field names should be prefixed with a vendor/plugin prefix to avoid collisions.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/custom-field/add-custom-field.html","quote":"Shopware automatically handles creation, updates, and removal during plugin lifecycle events."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware plugin custom field set product Administration developer.shopware.com"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/framework/custom-field/add-custom-field.html, prompt=Explain how to d
