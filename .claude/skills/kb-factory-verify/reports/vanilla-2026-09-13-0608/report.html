egations total-count-mode"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/development/integrations-api/search-criteria.html, prompt=Describe what can be put in the JSON body of POST /api/search/{entity}: filters, associations, sort, aggregations, and total-count-mode for exact total count."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:12:36Z","endedAt":"2026-09-13T06:13:00Z"},"dev-66":{"query":"Which request headers change Admin API behaviour for language, entity version, parent-child inheritance and skipping flow triggers during a bulk import?","category":"dev","option":"vanilla","answer":"sw-language-id lets you request data 'in a specific language using the language ID' instead of the system language (translatable fields only populate if a translation exists for that language). sw-version-id tells the API 'which version to return' for entities that support multiple versions (e.g. orders), instead of defaulting to the latest record. sw-inheritance, set to 1, means 'the inheritance should be considered', so variant entities pick up parent-product values instead of only returning their own data. sw-skip-trigger-flow, set to 1, prevents flows from firing on the request, which the docs call out as useful when 'migrating from another ecommerce platform' and bulk-importing data so you don't trigger unwanted emails or other automated flows.","citations":[{"url":"https://developer.shopware.com/docs/guides/development/integrations-api/request-headers.html","quote":"in a specific language using the language ID"},{"url":"https://developer.shopware.com/docs/guides/development/integrations-api/request-headers.html","quote":"which version to return"},{"url":"https://developer.shopware.com/docs/guides/development/integrations-api/request-headers.html","quote":"the inheritance should be considered"},{"url":"https://developer.shopware.com/docs/guides/development/integrations-api/request-headers.html","quote":"migrating from another ecommerce platform"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware Admin API header sw-language-id sw-version-id sw-inheritance sw-skip-trigger-flow"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/development/integrations-api/request-headers.html, prompt=List and describe the request headers that change Admin API behaviour for language, entity versioning, parent-child inheritance, and skipping flow triggers during bulk import."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:13:13Z","endedAt":"2026-09-13T06:13:34Z"},"dev-67":{"query":"What does a minimal app folder and `manifest.xml` need to contain, and which console commands install and activate the app on my local Shopware 6.7?","category":"dev","option":"vanilla","answer":"An app just needs its own folder under custom/apps named after the app's technical name (UpperCamelCase, matching the manifest's <name>), containing a manifest.xml at its root. The manifest, described as 'the contract between Shopware and your app', needs a <meta> block with <name> (matching the folder), <label>, <description>, <author> and <copyright> (both explicitly 'required' and cannot be empty), <version> and <license>. To pick it up locally you run bin/console app:refresh to refresh the app registry, then bin/console app:install --activate MyExampleApp to install and activate it in one step (or install without --activate and activate later via the Administration or bin/console app:activate MyExampleApp).","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/apps/app-base-guide.html","quote":"the contract between Shopware and your app"},{"url":"https://developer.shopware.com/docs/guides/plugins/apps/app-base-guide.html","quote":"\"required\" and cannot be empty"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware app manifest.xml minimal example bin/console app:install app:activate"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/apps/app-base-guide.html, prompt=Describe what a minimal app folder structure and manifest.xml need to contain, and which bin/console commands install and activate the app locally."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:13:56Z","endedAt":"2026-09-13T06:14:17Z"},"dev-68":{"query":"How does the registration handshake between Shopware and my app backend work — shop id, proof, shop secret and the confirmation call?","category":"dev","option":"vanilla","answer":"Shopware sends a GET request to the app's registration URL carrying shop-id ('The unique identifier of the shop where the app was installed'), shop-url and a timestamp, signed with a shopware-app-signature header holding a cryptographic signature of the query string made with the app secret. The proof value your backend must return is calculated as 'the SHA-256 HMAC of the concatenation of shopId, shopUrl, and your app's name', which proves you hold the app secret. Your backend's response must include that proof, a freshly generated shop-secret (a random string of at least 64 characters, unique per shop, distinct from the single app-wide app-secret used to sign every shop's registration request), and a confirmation_url. If the proof matches what Shopware computed, Shopware then POSTs to that confirmation_url with apiKey and secretKey (Admin API OAuth credentials) plus shopId/shopUrl/timestamp, and this confirmation request is itself signed with the shop-secret you issued, sent in the shopware-shop-signature header, which your app must validate before trusting the credentials.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/apps/lifecycle/app-registration-setup.html","quote":"The unique identifier of the shop where the app was installed"},{"url":"https://developer.shopware.com/docs/guides/plugins/apps/lifecycle/app-registration-setup.html","quote":"the SHA-256 HMAC of the concatenation of `shopId`, `shopUrl`, and your app's name"},{"url":"https://developer.shopware.com/docs/guides/plugins/apps/lifecycle/app-registration-setup.html","quote":"The request is signed with the `shop-secret` your app provided"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware app registration process shop-id shop-url proof shop secret confirmation endpoint"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/apps/lifecycle/app-registration-setup.html, prompt=Explain the full registration handshake between Shopware and an app backend: what is sent in the initial registration request, what shop-id and proof mean, what the app must respond with including a shop secret, and how the confirmation call works."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:14:29Z","endedAt":"2026-09-13T06:14:51Z"},"dev-69":{"query":"How does an app subscribe to an event like `product.written`, what does Shopware POST to the webhook URL, and how do I verify the request is genuine?","category":"dev","option":"vanilla","answer":"The app declares a <webhook> entry in its manifest.xml, e.g. <webhook name=\"product-changed\" url=\"https://example.com/event/product-changed\" event=\"product.written\"/>, which makes Shopware POST to that URL whenever the product.written event fires. The JSON body contains a 'source' object (shop URL, app version, shop ID, a unique event ID), a 'data' object with the event name and payload — for entity-written events the payload carries only the entity's primaryKey rather than the full entity, so the app is expected to fetch fresh data via the API — and a 'timestamp' useful for replay-attack prevention. To verify the request is genuine you check the shopware-shop-signature header, which the docs describe as 'a SHA256 HMAC of the request body that is signed with the secret your app assigned the shop during the registration', i.e. the per-shop shop-secret issued during app registration, and recompute/compare that HMAC yourself.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/apps/lifecycle/webhook.html","quote":"a SHA256 HMAC of the request body that is signed with the secret your app assigned the shop during the registration"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware app webhooks manifest product.written POST payload shopware-shop-signature verify"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/apps/lifecycle/webhook.html, prompt=Explain how an app subscribes to an event like product.written in the manifest, what Shopware sends (POST body) to the webhook URL, and how the app verifies the request is genuine (signature header)."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:15:05Z","endedAt":"2026-09-13T06:15:28Z"},"dev-70":{"query":"How do I implement a payment method in an app with `pay-url` and `finalize-url`, and what must the app server return in Shopware 6.7?","category":"dev","option":"vanilla","answer":"You declare an asynchronous payment method in the manifest with both a pay-url and a finalize-url (a synchronous method only defines pay-url, no finalize-url). When the customer starts checkout, Shopware POSTs the order, the orderTransaction and a returnUrl to pay-url, and your app server must respond with a redirectUrl pointing to the payment provider's page, to which the customer's browser is sent. After the payment provider redirects the customer back to Shopware's returnUrl, Shopware makes a second POST to finalize-url containing the orderTransaction plus requestData with all the query parameters the payment provider passed back. Your app server must respond at finalize-url with a status field, which can be paid (successful immediate payment), authorize (delayed payment), cancel (customer aborted) or fail (payment unsuccessful), and may include an optional message field with more context.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/apps/payment.html","quote":"requestData` with all query parameters passed by the payment provider"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware app payment method pay-url finalize-url manifest documentation response status"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/apps/payment.html, prompt=Explain how to implement a payment method in an app using pay-url and finalize-url: what Shopware sends to pay-url, what the app must return, what happens at finalize-url, and what the app server must return there."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:15:42Z","endedAt":"2026-09-13T06:16:02Z"},"dev-71":{"query":"How does an app define its own custom entities in Shopware 6.7 and read them back through the API?","category":"dev","option":"vanilla","answer":"An app defines custom entities by registering them in a Resources/entities.xml file inside the app, using an XML schema to declare the entity name and its fields and their properties. To make a field or the entity accessible through the Store API (e.g. for storefront access), it must be marked with the store-api-aware flag; entities/fields not marked that way are stripped from Store API responses. Once registered, Shopware automatically creates a real MySQL table for the entity and keeps the schema in sync when the app is installed or updated [from memory, corroborating detail on table creation not directly quoted]. The entity can then be read back through the Admin API using the standard search endpoints, for example a POST request to /api/search/custom-entity-blog, and from app scripts via the repository service, e.g. services.repository.search('custom_entity_blog', criteria). Since Shopware 6.4.15.0 a shorthand ce_ prefix can be used for entity/table names to avoid MySQL identifier length limits. Apps automatically get full read/write access to their own custom entities, but if a custom entity references core tables via associations, the app manifest must declare explicit permissions for those core entities.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/apps/custom-data/custom-entities.html","quote":"Apps define custom entities by registering them in `Resources/entities.xml`."},{"url":"https://developer.shopware.com/docs/guides/plugins/apps/custom-data/custom-entities.html","quote":"Fields marked with `\"store-api-aware=\"true\"` become accessible through the Store API, enabling storefront access to custom entity data."},{"url":"https://developer.shopware.com/docs/guides/plugins/apps/custom-data/custom-entities.html","quote":"Admin API**: Entities are accessible through POST requests like `/api/search/custom-entity-blog`"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware app custom entities Store API developer.shopware.com"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/apps/custom-data/custom-entities.html | Explain how an app defines custom entities in Shopware (entities.xml, flags, store_api_aware) and how they are read back through the API."}],"notFoundClaim":false,"memoryClaims":["Once registered, Shopware automatically creates a real MySQL table for the entity and keeps the schema in sync when the app is installed or updated [from memory, corroborating detail on table creation not directly quoted]."],"sourceVerdict":"yes","startedAt":"2026-09-13T06:09:56Z","endedAt":"2026-09-13T06:10:17Z"},"edge-01":{"query":"How do I configure Shopware 6's built-in GraphQL API for the Store API?","category":"edge","option":"vanilla","answer":"Shopware 6 does not have a built-in GraphQL API for the Store API — there is nothing to configure because it does not exist. The Store API is a REST/JSON API (documented at developer.shopware.com/docs/concepts/api/store-api.html) used for storefront-facing interactions like product browsing, cart and checkout. The only GraphQL-related project in the Shopware ecosystem is SwagGraphQL, an unofficial community proof of concept; its own README states 'This was a POC for a GraphQL API for a very early Shopware 6.0 state. It is unmaintained and untested for newer versions since then,' and the repository is archived (read-only) as of August 2024, so it is not a viable or supported way to get GraphQL access to the Store API on a current Shopware 6.7 shop.","citations":[{"url":"https://github.com/shopwareArchive/SwagGraphQL","quote":"This was a POC for a GraphQL API for a very early Shopware 6.0 state. It is unmaintained and untested for newer versions since then."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 GraphQL API Store API support"},{"tool":"WebFetch","args":"url=https://github.com/shopwareArchive/SwagGraphQL, prompt=What is this repository, is it an official/maintained GraphQL API for Shopware Store API, or a proof of concept/archived project?"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:12:13Z","endedAt":"2026-09-13T06:12:32Z"},"edge-02":{"query":"How do I get the DI container with `Shopware()->Container()` and override the product listing Smarty template in Shopware 6?","category":"edge","option":"vanilla","answer":"Both parts of this question describe Shopware 5 mechanisms that no longer exist in Shopware 6. `Shopware()->Container()` was the Shopware 5 legacy way to reach the global Pimple-based DI container; in Shopware 6 you instead get dependencies through Symfony's dependency injection container — services are autowired/injected via constructor injection into your plugin's services, or fetched from the container in a controller via standard Symfony service access, not via a global `Shopware()` function. [from memory] Likewise, Shopware 6 does not use Smarty templates at all: Shopware has changed from the template engine Smarty to Twig with the version 6 update, so there is no Smarty product-listing template to override — instead you override the relevant Twig block (e.g. in the listing template) using Shopware's extended `sw_extends`/block-override mechanism in a theme or plugin.","citations":[{"url":"https://www.econsor.de/news/shopware/mini-guide-zum-templating-mit-twig-bei-shopware-6/","quote":"Shopware has changed from the template engine _Smarty_ to _Twig_"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware() Container() Smarty template Shopware 5 vs Shopware 6 Twig"},{"tool":"WebFetch","args":"url=https://www.econsor.de/news/shopware/mini-guide-zum-templating-mit-twig-bei-shopware-6/, prompt=Does Shopware 6 use Smarty templates or Twig? Also, is there a Shopware()->Container() global function still available in Shopware 6, or is dependency injection handled differently (Symfony DI)?"}],"notFoundClaim":true,"memoryClaims":["`Shopware()->Container()` was the Shopware 5 legacy way to reach the global Pimple-based DI container; in Shopware 6 you instead get dependencies through Symfony's dependency injection container — services are autowired/injected via constructor injection into your plugin's services, or fetched from the container in a controller via standard Symfony service access, not via a global `Shopware()` function."],"sourceVerdict":"partial","startedAt":"2026-09-13T06:12:45Z","endedAt":"2026-09-13T06:13:04Z"},"edge-03":{"query":"Where do the `#[ORM\\Entity]` mapping attributes for my plugin's entity go in Shopware 6, and how do I get Doctrine's `EntityManager` injected into my service so I can persist it?","category":"edge","option":"vanilla","answer":"This premise does not apply to Shopware 6: Shopware does not use Doctrine ORM at all, so there is no `#[ORM\\Entity]` attribute and no `EntityManager` to inject. As the official documentation states, \"In contrast to most Symfony applications, Shopware uses no ORM, but a thin abstraction layer called the data abstraction layer (DAL).\" Instead of Doctrine entities, you define a plugin entity for the DAL with an `EntityDefinition` class (declaring fields such as `IdField`, `StringField`, associations, etc.), an `Entity`/`EntityCollection` pair, and register the corresponding database table via a migration; persistence then happens through an `EntityRepository`, which the documentation calls \"the recommended way for developers to interface with the DAL or the database in general,\" and which you obtain via dependency injection (by referencing the repository service, e.g. `<entity>.repository`, as a constructor argument) rather than by injecting an `EntityManager`.","citations":[{"url":"https://developer.shopware.com/docs/concepts/framework/data-abstraction-layer.html","quote":"In contrast to most Symfony applications, Shopware uses no ORM, but a thin abstraction layer called the data abstraction layer (DAL)."},{"url":"https://developer.shopware.com/docs/concepts/framework/data-abstraction-layer.html","quote":"recommended way for developers to interface with the DAL or the database in general"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 does not use Doctrine ORM EntityManager Data Abstraction Layer custom entity"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/concepts/framework/data-abstraction-layer.html, prompt=Does Shopware 6 use Doctrine ORM entities/EntityManager? What does it use instead for persisting plugin entities, and how do you define an entity for the DAL?"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:13:18Z","endedAt":"2026-09-13T06:13:35Z"},"edge-04":{"query":"How do I fetch products with `GET /sales-channel-api/v3/product` on Shopware 6.7?","category":"edge","option":"vanilla","answer":"You can't — the Sales Channel API (`/sales-channel-api/...`) was deprecated in Shopware 6.3.2.0 and removed with 6.4.0, so it does not exist anymore on a 6.7 shop. Per the official deprecation changelog, the Sales Channel API \"will be removed with 6.4.0\" and projects using it should \"migrate on api route base\" to the Store API. On Shopware 6.7 you fetch products through the Store API instead, e.g. `POST /store-api/product` (product listing/search) or `GET /store-api/product/{productId}` for a single product, sending the `sw-access-key` header for the sales channel; there is no `/sales-channel-api/v3/...` route to call.","citations":[{"url":"https://github.com/shopware/platform/blob/trunk/changelog/release-6-3-2-0/2020-09-09-deprecate-sales-channel-api.md","quote":"will be removed with 6.4.0"}],"toolCallLog":[{"tool":"WebSearch","args":"\"sales-channel-api\" deprecated Shopware 6 store-api replacement"},{"tool":"WebFetch","args":"url=https://github.com/shopware/platform/blob/trunk/changelog/release-6-3-2-0/2020-09-09-deprecate-sales-channel-api.md, prompt=What does this changelog say about deprecating the sales-channel-api and when it will be removed / what replaces it?"}],"notFoundClaim":true,"memoryClaims":["On Shopware 6.7 you fetch products through the Store API instead, e.g. `POST /store-api/product` (product listing/search) or `GET /store-api/product/{productId}` for a single product, sending the `sw-access-key` header for the sales channel; there is no `/sales-channel-api/v3/...` route to call."],"sourceVerdict":"yes","startedAt":"2026-09-13T06:13:50Z","endedAt":"2026-09-13T06:14:05Z"},"edge-05":{"query":"How do I enable Shopware's built-in MCP server on a Shopware 6.6 shop?","category":"edge","option":"vanilla","answer":"You can't — the built-in MCP server does not exist on Shopware 6.6. Per the official documentation, \"The MCP server was introduced in Shopware 6.7.11.0 behind the `MCP_SERVER` feature flag. Shopware 6.7.14.0 removes the flag and introduces progressive tool discovery,\" so it is a 6.7.x-line feature only, not something that can be enabled on a 6.6 installation. To use it you would need to upgrade to at least Shopware 6.7.11.0 (where it must be enabled via the `MCP_SERVER` feature flag) or 6.7.14.0+ (where it is on by default without the flag); it is still considered experimental until 6.8. On 6.6 the only route to similar functionality would be a third-party/community MCP integration (e.g. an external MCP server talking to the Admin API), not a built-in feature.","citations":[{"url":"https://developer.shopware.com/docs/products/tools/mcp-server/intro.html","quote":"The MCP server was introduced in Shopware 6.7.11.0 behind the `MCP_SERVER` feature flag. Shopware 6.7.14.0 removes the flag and introduces progressive tool discovery."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware MCP server version 6.7 6.6 built-in Model Context Protocol"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/products/tools/mcp-server/intro.html, prompt=Which Shopware version introduced the built-in MCP server? Is it available in Shopware 6.6?"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:14:20Z","endedAt":"2026-09-13T06:14:37Z"},"edge-06":{"query":"I'm coming from Magento — what are the Shopware equivalents of store views, extensions, attribute sets and `di.xml`?","category":"edge","option":"vanilla","answer":"Store views map to Shopware's Sales Channels: per Shopware's own Magento-to-Shopware keyword mapping, the equivalent is a \"Sales channel with different languages and domains.\" Extensions/modules map to Shopware Plugins (or Apps for the no-PHP integration model): \"Extension\" in Shopware maps to \"Plugin\" in development contexts, and third-party extensions are installed via Extensions > Store in the administration. Attribute sets map to Shopware's custom field sets, which \"collects custom fields into logical groups\"; Shopware actually splits what Magento calls attributes into two separate concepts — custom fields for arbitrary additional product data, and properties specifically for variant generation and storefront filtering. For `di.xml`, Shopware does not have a Magento-style DI configuration file; because Shopware 6 is a Symfony application, dependency injection is configured per plugin/bundle in a `src/Resources/config/services.xml` (or `services.yaml`) file, where you register your services/tags for Symfony's DI container, and plugins can override core services the way `di.xml` preferences do in Magento by overriding a service definition for the same service id. [from memory]","citations":[{"url":"https://docs.shopware.com/en/migration-en/magento-keywords","quote":"Sales channel with different languages and domains"},{"url":"https://docs.shopware.com/en/migration-en/magento-keywords","quote":"Collects custom fields into logical groups"}],"toolCallLog":[{"tool":"WebSearch","args":"Magento to Shopware terminology comparison store views extensions attribute sets di.xml"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/migration-en/magento-keywords, prompt=What are the Shopware equivalents of Magento's store views, extensions/modules, and attribute sets? Quote the relevant mappings."}],"notFoundClaim":false,"memoryClaims":["For `di.xml`, Shopware does not have a Magento-style DI configuration file; because Shopware 6 is a Symfony application, dependency injection is configured per plugin/bundle in a `src/Resources/config/services.xml` (or `services.yaml`) file, where you register your services/tags for Symfony's DI container, and plugins can override core services the way `di.xml` preferences do in Magento by overriding a service definition for the same service id."],"sourceVerdict":"partial","startedAt":"2026-09-13T06:14:51Z","endedAt":"2026-09-13T06:15:11Z"},"edge-07":{"query":"How do I set up Shopware PWA as the storefront for a Shopware 6.7 shop?","category":"edge","option":"vanilla","answer":"You shouldn't set up the original \"Shopware PWA\" project for a current shop — it is no longer maintained. Its own README states \"Shopware PWA is not maintained anymore\" and the repository was archived (read-only) on October 31, 2024, with the project directing users to Shopware Composable Frontends (now called Shopware Frontends) as the replacement, documented at frontends.shopware.com and developed in the github.com/shopware/frontends repository; the old `@shopware-pwa/` npm packages are likewise deprecated in favor of `@shopware/` equivalents. For a Shopware 6.7 shop today you would instead set up Shopware Frontends: install the `@shopware/nuxt-module` (or the underlying `@shopware/api-client`/`@shopware/composables` packages) in a Nuxt/Vue project, point it at your shop's Store API using a sales-channel access key, and use the provided composables/CMS components to build the storefront against the Store API. [from memory]","citations":[{"url":"https://github.com/vuestorefront/shopware-pwa","quote":"Shopware PWA is not maintained anymore."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware PWA deprecated Shopware Frontends composable frontends 2026"},{"tool":"WebFetch","args":"url=https://github.com/vuestorefront/shopware-pwa, prompt=Is this repository still maintained? What does the README say about its status and any recommended replacement?"}],"notFoundClaim":true,"memoryClaims":["For a Shopware 6.7 shop today you would instead set up Shopware Frontends: install the `@shopware/nuxt-module` (or the underlying `@shopware/api-client`/`@shopware/composables` packages) in a Nuxt/Vue project, point it at your shop's Store API using a sales-channel access key, and use the provided composables/CMS components to build the storefront against the Store API."],"sourceVerdict":"yes","startedAt":"2026-09-13T06:15:27Z","endedAt":"2026-09-13T06:15:44Z"},"edge-08":{"query":"Which service do I type-hint to read products — `EntityRepositoryInterface` — and how do I inject it into my plugin service?","category":"edge","option":"vanilla","answer":"There is no `EntityRepositoryInterface` in Shopware 6 — the class you type-hint is the concrete `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository` (marked `@final`), not an interface. [from memory] I confirmed this by reading the installed source: the file only defines `class EntityRepository` with no corresponding interface in that namespace. To read products from your own plugin service, you inject the `product.repository` service (defined by the product entity definition, following the `<entity>.repository` naming convention) by type-hinting the constructor argument as `EntityRepository` and wiring it in your plugin's `services.xml` with `<argument type=\"service\" id=\"product.repository\"/>`, then call `$this->productRepository->search($criteria, $context)` to read products. [from memory]","citations":["vendor/shopware/core/Framework/DataAbstractionLayer/EntityRepository.php:1-40"],"toolCallLog":[{"tool":"Bash","args":"grep -rn 'EntityRepositoryInterface' <home>/projects/host-project/vendor/shopware/core/Framework/DataAbstractionLayer/ 2>/dev/null | head -20"},{"tool":"Bash","args":"find <home>/projects/host-project/vendor/shopware/core/Framework/DataAbstractionLayer -maxdepth 1 -name 'EntityRepository*'"},{"tool":"Read","args":"<home>/projects/host-project/vendor/shopware/core/Framework/DataAbstractionLayer/EntityRepository.php (limit 40)"},{"tool":"Bash","args":"grep -rn 'product.repository' <home>/projects/host-project/vendor/shopware/core/Content/Product/DependencyInjection/*.xml 2>/dev/null | head -5"},{"tool":"Bash","args":"grep -rln 'product.repository' <home>/projects/host-project/vendor/shopware/core/Content/Product/ 2>/dev/null | head -5"},{"tool":"Bash","args":"grep -rln 'product.repository' <home>/projects/host-project/vendor/shopware/core/ 2>/dev/null | head -10"}],"notFoundClaim":false,"memoryClaims":["There is no `EntityRepositoryInterface` in Shopware 6 — the class you type-hint is the concrete `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository` (marked `@final`), not an interface.","To read products from your own plugin service, you inject the `product.repository` service (defined by the product entity definition, following the `<entity>.repository` naming convention) by type-hinting the constructor argument as `EntityRepository` and wiring it in your plugin's `services.xml` with `<argument type=\"service\" id=\"product.repository\"/>`, then call `$this->productRepository->search($criteria, $context)` to read products."],"sourceVerdict":"partial","findability":"n/a","startedAt":"2026-09-13T06:10:12Z","endedAt":"2026-09-13T06:14:00Z"},"edge-09":{"query":"Where do I configure Business Events so that a mail is sent when an order is placed in Shopware 6.7?","category":"edge","option":"vanilla","answer":"In Shopware 6.7 you no longer configure this via \"Business Events\" — that legacy settings screen was replaced by the Flow Builder as of major release 6.4.8.0, per the docs: \"Business events will be replaced by the Flow Builder in the major release 6.4.8.0,\" and it now continues to exist only for the B2B-Suite extension. To send a mail when an order is placed in 6.7, go to Settings > Shop > Flow Builder, create a new flow, and use the trigger \"checkout.order.placed - Triggers when an order is placed,\" then add a 'Send email' action where you choose the recipient (administrator, customer, or a defined address) and an email template.","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/settings/Business-Events","quote":"Business events will be replaced by the Flow Builder in the major release 6.4.8.0"},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/Flow-Builder","quote":"checkout.order.placed - Triggers when an order is placed"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 Business Events settings send mail order placed admin configuration"},{"tool":"WebFetch","args":"https://docs.shopware.com/en/shopware-6-en/settings/Business-Events"},{"tool":"WebFetch","args":"https://docs.shopware.com/en/shopware-6-en/settings/Flow-Builder"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","findability":"n/a","startedAt":"2026-09-13T06:10:43Z","endedAt":"2026-09-13T06:16:00Z"},"func-01":{"query":"How do I create a product with variants and configure its visibility per sales channel, and why might it not show up in the storefront?","category":"func","option":"vanilla","answer":"Variants are generated using product properties: you open the Variants tab, select which properties define the variants, activate specific option values via checkboxes, optionally set price surcharges per option, optionally exclude specific value combinations, and then click Generate variants. Afterward you can adjust storefront display via property order, per-variant images, and display modes like 'Single main variant' or 'Fan out properties'. Visibility per sales channel is configured under 'Visibility & Structure': you must assign the product to the desired sales channels and check 'Active for all selected sales channels', and you can further configure extended visibility to be visible in search and listing (default), hidden in listing only, or hidden entirely. If the product does not show up in the storefront, the usual causes are: the product not activated for the selected sales channel, no sales channel assigned at all, extended visibility set to hidden from search/listing, required fields (name, product number, tax rate, prices, stock) left incomplete, or missing category assignment needed for discovery in navigation/listings.","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/catalogues/products","quote":"Variants are generated using product properties as the foundation."},{"url":"https://docs.shopware.com/en/shopware-6-en/catalogues/products","quote":"Activate the product** - Check \"Active for all selected sales channels\" for storefront display and purchasing"},{"url":"https://docs.shopware.com/en/shopware-6-en/catalogues/products","quote":"Product not activated** for selected sales channels"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 product variants visibility sales channel storefront not showing"},{"tool":"WebFetch","args":"https://docs.shopware.com/en/shopware-6-en/catalogues/products | Explain how to create product variants, configure sales channel visibility, and common reasons a product does not appear in the storefront."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:10:34Z","endedAt":"2026-09-13T06:10:57Z"},"func-02":{"query":"How do Rule Builder conditions work for shipping and payment methods?","category":"func","option":"vanilla","answer":"The Rule Builder, found under Settings > Automation > Rule Builder, lets merchants build conditional logic ('rules') made of general information (name, description, priority, type, tags) plus one or more conditions grouped in AND/OR trees, and each rule is evaluated at a specific moment described by its evaluation context, for example when a customer builds a cart in the storefront. For shipping and payment methods specifically, each method has an 'Availability rule' field: you either pick an existing rule or create a new one, and the method is only offered to the customer during checkout if that rule's conditions evaluate to true against the current cart/customer/context data. Rules also have an Assignments tab that shows everywhere the rule is currently used (including which shipping or payment methods reference it), so you can navigate from the rule back to its usages. Condition scopes available to build these rules include General (sales channel, currency, language, date range, day of week, time range), Customer (customer group, login status, order count, addresses), Cart (cart total, item count, weight, applied shipping/payment method, discounts), and Line Item (product, category, tag, property of items in the cart), each combined with operators such as equals, greater than, or contains.","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/settings/rules","quote":"The evaluation context describes the moment when a rule is evaluated"},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/rules","quote":"Rules connect to these features through the **Assignments** tab, which shows where each rule is actively used."},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/rules","quote":"Rules can restrict which shipping and payment methods are available to customers."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 Rule Builder conditions shipping payment method availability"},{"tool":"WebFetch","args":"https://docs.shopware.com/en/shopware-6-en/settings/rules | Explain how the Rule Builder works, how availability rules are attached to shipping methods and payment methods, and what condition scopes exist."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:11:10Z","endedAt":"2026-09-13T06:11:31Z"},"func-03":{"query":"How do promotions and discount codes work, including individually generated codes?","category":"func","option":"vanilla","answer":"A Shopware promotion is configured in three areas: general settings, conditions, and discounts. Conditions can be defined using the Rule Builder for the target group, the shopping cart, or the entire order, so a promotion can be restricted to specific customer groups, cart contents, or order requirements, and it also has 'valid from' / 'valid until' date fields. More complex scenarios can use product sets, such as a '3 for 2' promotion that groups matching items and applies a discount to the set. The Discounts tab defines the actual reduction: it can be a percentage or a fixed amount, applied to the whole cart, to shipping costs, or to a specific range of products, and a single promotion can contain several discounts at once. For codes, a promotion can either use one fixed code for everyone or individually generated codes: enabling 'Use individual promotion codes' and opening 'Manage individual promotion codes' lets you define a code pattern (using placeholders like %s for letters and %d for digits, plus optional fixed prefixes/suffixes) and then generate a batch of unique codes. These individual codes can only be redeemed once and will not be accepted if entered again, and the promotion's detail view shows a 'Redeemed' list of which codes have already been used and in which orders.","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/marketing/promotions","quote":"Conditions can be defined here using the Rule Builder for your **target group**, the **shopping cart** or also the **entire order**."},{"url":"https://docs.shopware.com/en/shopware-6-en/marketing/promotions","quote":"These individual codes can only be redeemed once and will not be accepted if they are entered again."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 promotions individually generated codes discount setup"},{"tool":"WebFetch","args":"https://docs.shopware.com/en/shopware-6-en/marketing/promotions | Explain how promotions and discount codes work in Shopware, including conditions/eligibility, discounts, and individually generated codes."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:11:46Z","endedAt":"2026-09-13T06:12:08Z"},"func-04":{"query":"What does the Shopware Migration Assistant transfer automatically from Shopware 5, and what has to be mapped by hand before the migration starts?","category":"func","option":"vanilla","answer":"The Migration Assistant automatically transfers basic/mandatory data such as categories, customer groups, currencies, sales channels (created from Shopware 5 shops/subshops) and number ranges, plus products with their properties, options, translations, cross-selling and main-variant relations, customers, orders and order documents, promotions with their associated customer data, SEO URLs, and product reviews including media files. Before the migration can actually run, several things must be created and manually mapped in the target Shopware 6 shop: payment methods (including the standard/default payment method), salutations, and delivery times (including the standard delivery time) — the documentation notes it's mandatory that this mapping is done, since not doing so will lead to problems. Some things are not migrated at all and must be rebuilt manually afterward: Shopping Worlds/shop pages (their data cannot be transferred due to the technical restructuring in Shopware 6), old templates (cannot be reused or migrated), email templates (must be converted to the new Twig-based template engine), shipping costs (must be recreated using the new Rule Builder), and the B2B Suite, for which a transfer is not possible. After migration, sales channel domain settings, country configurations, document templates, and payment/shipping settings should be manually checked.","citations":[{"url":"https://docs.shopware.com/en/migration-en/what-is-migrated","quote":"It's mandatory that this is done; not doing so will lead to problems."},{"url":"https://docs.shopware.com/en/migration-en/what-is-migrated","quote":"Not possible to transfer the data"},{"url":"https://docs.shopware.com/en/migration-en/what-is-migrated","quote":"A transfer...is not possible"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware Migration Assistant Shopware 5 to 6 what is transferred manual mapping"},{"tool":"WebFetch","args":"https://docs.shopware.com/en/migration-en/what-is-migrated | List exactly what data is migrated automatically from Shopware 5 to 6, and what must be mapped manually or is not migrated at all."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:12:21Z","endedAt":"2026-09-13T06:12:43Z"},"func-05":{"query":"How do I set up a sales channel — storefront versus headless type, domains, languages and currencies — and where do I get its API access key?","category":"func","option":"vanilla","answer":"You create a sales channel from the plus icon next to 'Sales Channel' in the admin menu, and pick one of two types: a 'Sales Channel with HTML storefront', which gives a full shop front-end, or a headless sales channel, which only exposes an API interface for external integrations such as apps or custom frontends. For domains, self-hosted instances let you attach multiple domains with distinct URLs to the channel, while cloud instances start with an auto-generated URL and let you add custom domains after first registering them under Settings > System > Domains; each domain is then assigned its own language, currency and snippet set. Languages and their default are set in the channel's General settings, and the accepted currencies plus a default currency are set under the payment/shipping-related settings. Other key settings include the entry-point categories for main/footer/service navigation, the assigned customer group, supported countries, and the tax calculation method. To get the API access key, open the sales channel's 'API access' section, where you can generate an API Access ID (and matching secret) for that sales channel, which is what the Store API uses to authenticate requests against it.","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/settings/saleschannel","quote":"A \"Sales Channel with HTML storefront\" provides a complete shop experience"},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/saleschannel","quote":"Here you can \"generate an API Access ID for this sales channel.\""},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/saleschannel","quote":"Cloud instances come with an auto-generated URL, but you can add custom domains by first registering them under Settings > System > Domains."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 sales channel setup storefront headless domains languages currencies API access key"},{"tool":"WebFetch","args":"https://docs.shopware.com/en/shopware-6-en/settings/saleschannel | Explain how to set up a sales channel: storefront vs headless type, domains, languages, currencies, and where to find its API access key."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:12:57Z","endedAt":"2026-09-13T06:13:19Z"},"func-06":{"query":"Which triggers and actions does the Flow Builder offer, and how do I make it send a mail when an order is placed?","category":"func","option":"vanilla","answer":"The Flow Builder offers triggers grouped by area: customer events (login, logout, registration, deletion, password recovery, guest registration), order events (order placement and status transitions such as Open, In Progress, Completed, Cancelled, plus payment-method changes), payment status events (Authorized, Paid, Refunded, Failed, Chargeback), delivery/shipping status events (Shipped, Returned, Cancelled), and other events such as newsletter subscription, contact-form submission, product review, and document creation. Available actions include sending automated emails (with optional attachments), changing order/payment/shipping status, assigning a customer group or account status, creating documents, adding or removing tags, granting download access for digital products, calling a webhook/URL, setting a custom field value, and assigning affiliate or campaign codes. To send a mail on order placement: create a new flow, choose the trigger 'checkout.order.placed' (the 'Order placed' event, fired as soon as an order is placed), add the 'Send mail' action, configure the recipient (e.g. the customer or an administrator), pick the email template to use, optionally attach a document, then save and activate the flow so it runs automatically on every new order.","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/settings/Flow-Builder","quote":"Select trigger: Choose \"checkout.order.placed\""},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/Flow-Builder","quote":"Add action: Select \"Send mail\""},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/Flow-Builder","quote":"Order Events: Order placement, payment method changes, and status transitions (Open, In Progress, Completed, Cancelled)"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 Flow Builder triggers actions order placed send mail"},{"tool":"WebFetch","args":"https://docs.shopware.com/en/shopware-6-en/settings/Flow-Builder | List the available Flow Builder trigger events and action types, and describe how to configure a flow that sends a mail when an order is placed."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:13:32Z","endedAt":"2026-09-13T06:13:54Z"},"func-07":{"query":"How do I import products from a CSV with an import/export profile — column mapping, matching identifiers and a dry run?","category":"func","option":"vanilla","answer":"Under Settings > Import/Export you create or pick a profile, and in its Mappings tab you assign each column from your CSV file to the desired database field/entry — in the database mapping you assign a column from the CSV file to the desired entries from the database. For each mapped field you can mark it as required, give it a default value for missing data, and set the expected column position in the file. To match CSV rows to existing entities, Shopware traditionally required a UUID per row, but a 'Second unique identifier' setting lets you determine for yourself which identifier the data is mapped to with the entities, e.g. using the product number instead of the UUID for products; the documentation warns that if you use a non-unique value such as the name as this identifier, the system can only identify and import the first matching data record when duplicates exist. Before running a real import, use the 'Start dry run' option, which lets you test the import completely without it actually being executed, so you can catch and fix CSV errors before committing the real import.","citations":[{"url":"https://docs.shopware.com/en/shopware-en/settings/importexport","quote":"In the database mapping you assign a column from the CSV file to the desired entries from the database."},{"url":"https://docs.shopware.com/en/shopware-en/settings/importexport","quote":"determine for yourself which identifier the data are mapped to with the entities"},{"url":"https://docs.shopware.com/en/shopware-en/settings/importexport","quote":"allow[s] you to test the import once completely before you actually start it."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 import export profile products column mapping identifier dry run"},{"tool":"WebFetch","args":"https://docs.shopware.com/en/shopware-en/settings/importexport | Explain how import/export profiles work in Shopware: column mapping, using an identifier field instead of UUID, and how a dry run works."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:14:08Z","endedAt":"2026-09-13T06:14:32Z"},"func-08":{"query":"How do custom field sets work — entity assignment, field types and technical name — and can a custom field be written through the Store API?","category":"func","option":"vanilla","answer":"Custom fields in Shopware are organized into sets, and each set must be assigned to one or more program areas (entities such as products or categories) for it to actually appear there — it is also necessary to specify for which program areas the set is to be available, and a set with no areas selected exists but is inaccessible anywhere. Within a set you add individual fields, each of which has a field type; Shopware offers types such as select (single/multi-select dropdown), object selection (reference to existing data like products or categories), plain text field, media (file upload), number, date/time, checkbox, an active/inactive switch, a rich text editor, and a color picker. Every custom field also needs a unique technical name that can only be used once in the system and cannot be changed later, so vendor/module prefixes are recommended to avoid collisions. On writability, each field has a 'Modifiable via Store API' toggle; when enabled, the field becomes publicly writable through the Store API (for example to let a storefront form store additional data), so yes — a custom field can be written through the Store API if that option is turned on for it, though sensitive fields should be left off to avoid unauthorized modification.","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/settings/custom-fields","quote":"It is also necessary to specify for which program areas the set is to be available."},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/custom-fields","quote":"a unique technical name"},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/custom-fields","quote":"When enabled, the field becomes publicly writable through the Store API, useful for storefront forms."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 custom field sets entity assignment field types technical name Store API"},{"tool":"WebFetch","args":"https://docs.shopware.com/en/shopware-6-en/settings/custom-fields | Explain how custom field sets work: entity assignment, available field types, technical name requirement, and whether a custom field can be written through the Store API."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:14:44Z","endedAt":"2026-09-13T06:15:05Z"},"func-09":{"query":"Why doesn't my payment method appear in the checkout — what has to be configured in the administration?","category":"func","option":"vanilla","answer":"First, the payment method itself must be activated (the Active toggle in the payment method's settings). But activating it is not enough by itself: this does not automatically mean that all activated payment methods are available to your customers in the storefront — the decisive factor here is which payment methods are assigned in your sales channel, so you must go into the sales channel's Payment and Shipping section and explicitly add the payment method to that channel's list of assigned payment methods. On top of that, a payment method can have an Availability rule built with the Rule Builder, which restricts when it is offered (e.g. by cart total, customer group, shipping country); for payment methods that are available without restriction, leave the availability rule blank (NULL) — if a rule is set and its conditions are not met by the current cart/customer, the method will not appear even though it is active and assigned. So the checklist for a missing payment method is: is it Active, is it assigned to the sales channel being used, and does any configured availability rule actually evaluate to true for the current context. Separately, an 'Allow change of payment method after order completion' setting only affects the ability to change payment after checkout, not whether it shows up during initial checkout.","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/settings/Paymentmethods","quote":"this does not automatically mean that all activated payment methods are available to your customers in the storefront. The decisive factor here is which payment methods are assigned in your sales channel."},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/Paymentmethods","quote":"For payment methods that are available without restriction, leave the availability rule blank (NULL)."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 payment method not showing in checkout administration configuration sales channel"},{"tool":"WebFetch","args":"https://docs.shopware.com/en/shopware-6-en/settings/Paymentmethods | Explain what has to be configured for a payment method to appear in the storefront checkout: activation, sales channel assignment, availability rule, and any other requirements."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:15:19Z","endedAt":"2026-09-13T06:15:40Z"},"func-10":{"query":"How do dynamic product groups work in the administration and where can the resulting group be used?","category":"func","option":"vanilla","answer":"Dynamic product groups are found under Catalogues > Dynamic product groups in the Shopware administration, and let a merchant build a collection of products automatically based on rule-based conditions rather than manual assignment. In the Conditions area you build rules (e.g. by category, tag, price, stock, custom fields) and can combine them with AND/OR logic, and you can nest conditions using the SUB-CONDITION button to build more complex rule trees; a preview shows the products currently matching the rules. There is also a \"Keep matching variants grouped\" option controlling whether matching variants are shown grouped under the parent product or individually. The resulting dynamic product group can then be used in category pages/listings, in Shopping Experiences (e.g. product sliders in commerce blocks), in cross-selling, and as the basis for promotions or product-comparison feeds.","citations":[{"url":"https://docs.shopware.com/en/shopware-6-de/Catalogues/Dynamicproductgroups","quote":"nest the conditions by using the SUB-CONDITION button"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 dynamic product groups administration"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-6-de/Catalogues/Dynamicproductgroups, prompt=Explain how dynamic product groups work in the Shopware administration, how conditions are set, and where the resulting groups can be used (e.g. listings, cross-selling, promotions)."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:10:00Z","endedAt":"2026-09-13T06:10:27Z"},"func-11":{"query":"How do I create an integration for Admin API access in the administration and give it the right privileges?","category":"func","option":"vanilla","answer":"In the administration, go to Settings > System > Integrations and click \"Create integration\". Give it a descriptive name and decide whether it should have administrator-level permissions, or instead select another role in the dropdown list for the integration, if you have already defined roles here — those roles are defined separately under Settings > System > Users & Permissions, where you can create a role and pick specific ACL privileges (per module: view/edit/create/delete) before assigning that role to the integration. After saving, Shopware generates an access ID and a security key for the integration; the security key is only displayed here, so you should save it in a safe place, because it will not be shown again when you later edit the integration. Those credentials are then used to authenticate against the Admin API via OAuth to obtain an access token for API requests. [from memory]","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/settings/system/integrationen","quote":"select another role in the dropdown list for the integration, if you have already defined roles here"},{"url":"https://docs.shopware.com/en/shopware-6-en/settings/system/integrationen","quote":"the security key is only displayed here, you should save it in a safe place"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 administration create integration Admin API access key permissions"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-6-en/settings/system/integrationen, prompt=Explain step by step how to create an integration for Admin API access in the administration and how to assign it the right privileges/roles."}],"notFoundClaim":false,"memoryClaims":["those roles are defined separately under Settings > System > Users & Permissions, where you can create a role and pick specific ACL privileges (per module: view/edit/create/delete) before assigning that role to the integration."],"sourceVerdict":"yes","startedAt":"2026-09-13T06:10:39Z","endedAt":"2026-09-13T06:10:57Z"},"func-12":{"query":"A spec asks for customer-specific pricing and for a flow that calls an external URL when an order is placed — before I build either of them, does Shopware already ship them, and what has to be licensed or installed for them to exist in the shop?","category":"func","option":"vanilla","answer":"Neither feature is free/built into the Community Edition out of the box — both are Shopware Commercial (paid) features. Customer-specific pricing is part of the Commercial plugin and requires an existing Shopware 6 installation and the activated Shopware 6 Commercial plugin, with prices then pulled from your system of choice via an API (the /api/_action/custom-price endpoint) and shown to logged-in customers; it is only available from the Shopware Beyond plan. For calling an external URL when an order is placed, Flow Builder itself ships with the Community Edition, but the specific \"Call URL (Webhook)\" action is a premium capability — the webhook actions in Flow Builder feature is listed under the Shopware Evolve plan, meaning you need the Shopware Commercial extension activated at the Evolve (or higher) plan for that action to appear as an option in a flow's action list. In short: install/activate the Shopware Commercial extension and be on a plan (Evolve for webhook actions, Beyond for customer-specific pricing) that includes these features; plain community-edition Shopware does not have either.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/integrations/commercial/customer-specific-pricing.html","quote":"Customer-specific pricing is part of the Commercial plugin and requires an existing Shopware 6 installation and the activated Shopware 6 Commercial plugin."},{"url":"https://docs.shopware.com/en/shopware-6-en/features/webhook-actions-in-flow-builder","quote":"Flow Builder | webhook actions"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 customer-specific pricing Advanced Pricing Commercial plugin"},{"tool":"WebSearch","args":"Shopware 6 Flow Builder action call webhook external URL order placed"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-6-en/features/customer-specific-pricing, prompt=Does Shopware ship customer-specific pricing out of the box, or does it require a license/plugin? What is required for it to exist in a shop?"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-6-en/features/webhook-actions-in-flow-builder, prompt=Does Shopware Flow Builder ship a \"call external URL / webhook\" action out of the box, or does it require a license/extension? What is required for it to be available?"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/integrations/commercial/customer-specific-pricing.html, prompt=What is required (which Shopware plugin/license/plan) to have customer-specific pricing in a shop?"},{"tool":"WebSearch","args":"\"Call URL\" flow builder action Shopware Commercial webhook plan"},{"tool":"WebFetch","args":"url=https://www.shopware.com/en/products/flow-builder/, prompt=Does calling an external URL / webhook via Flow Builder require a specific Shopware plan or the Commercial extension? Quote the relevant text."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:11:12Z","endedAt":"2026-09-13T06:11:54Z"},"gap-01":{"query":"How do I add my own Admin API endpoint under `/api/...` from a plugin — a controller with the api route scope and its ACL?","category":"gap","option":"vanilla","answer":"Create a Symfony controller extending `AbstractController`, register it as a service in your plugin's `services.xml`, and mark it with the `#[Route]` attribute setting `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE` to `[ApiRouteScope::ID]` (the 'api' scope) at the class level so the route is routed and secured as an Admin API route rather than storefront or store-api. [from memory] The core codebase shows this exact pattern: `Shopware\\Core\\Framework\\Api\\Controller\\CacheController` is annotated `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [ApiRouteScope::ID]])]` at the class level, and each individual action route additionally sets `PlatformRequest::ATTRIBUTE_ACL => ['system:cache:info']` in its own `#[Route(...)]` defaults to require that ACL privilege for the endpoint. For your own plugin endpoint you follow the same shape: put the class-level route-scope attribute on your controller, then on each action's `#[Route(path: '/api/_action/my-plugin/...', name: '...', defaults: [PlatformRequest::ATTRIBUTE_ACL => ['my_plugin.my_privilege']], methods: [...])]`, and register the privilege identifier (e.g. via `enrichPrivileges()` on your plugin's ACL role/privilege mapping) so it can be granted to integrations or users through an ACL role. [from memory]","citations":["vendor/shopware/core/Framework/Api/Controller/CacheController.php:1-50"],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 plugin add custom admin api endpoint controller RouteScope api acl"},{"tool":"WebSearch","args":"developer.shopware.com \"Add Custom Controller\" admin api scope acl privileges plugin"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.html"},{"tool":"Bash","args":"grep -rln 'Acl([' vendor/shopware/core/**/Api/Controller/*.php; find vendor/shopware/core -path '*Api/Controller*' -name '*.php'"},{"tool":"Read","args":"<home>/projects/host-project/vendor/shopware/core/Framework/Api/Controller/CacheController.php (limit 50)"}],"notFoundClaim":false,"memoryClaims":["Create a Symfony controller extending `AbstractController`, register it as a service in your plugin's `services.xml`, and mark it with the `#[Route]` attribute setting `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE` to `[ApiRouteScope::ID]` (the 'api' scope) at the class level so the route is routed and secured as an Admin API route rather than storefront or store-api.","For your own plugin endpoint you follow the same shape: put the class-level route-scope attribute on your controller, then on each action's `#[Route(path: '/api/_action/my-plugin/...', name: '...', defaults: [PlatformRequest::ATTRIBUTE_ACL => ['my_plugin.my_privilege']], methods: [...])]`, and register the privilege identifier (e.g. via `enrichPrivileges()` on your plugin's ACL role/privilege mapping) so it can be granted to integrations or users through an ACL role."],"sourceVerdict":"partial","findability":"n/a","startedAt":"2026-09-13T06:11:24Z","endedAt":"2026-09-13T06:20:00Z"},"gap-02":{"query":"Shopware 6.7 removed the RSA JWT key files and `system:generate-jwt-secret` — what signs Admin API tokens now, and what do I have to do when upgrading?","category":"gap","option":"vanilla","answer":"As of 6.7.0.0, Admin API tokens are signed using HMAC based on your `APP_SECRET` environment variable instead of the old RSA key pair in `config/jwt`; the upgrade guide states: \"Usage of normal RSA JWT keys is deprecated. And will be removed with Shopware 6.7.0.0,\" and directs you to \"use the new HMAC JWT keys instead using configuration,\" by setting `use_app_secret: true` in the API configuration. Before upgrading, make sure `APP_SECRET` is at least 32 characters long — the guide notes: \"Also make sure that the `APP_SECRET` environment variable is at least 32 characters long\" — and generate one with `bin/console system:generate-app-secret` if needed, since \"You can use the `bin/console system:generate-app-secret` command to generate an valid secret.\" Be aware this switch \"will invalidate all existing tokens and require a re-login for all users and all integrations,\" so plan the cutover accordingly; the old `system:generate-jwt-secret` command and the RSA key files under `config/jwt` are gone with this change.","citations":[{"url":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.6.md","quote":"Usage of normal RSA JWT keys is deprecated. And will be removed with Shopware 6.7.0.0."},{"url":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.6.md","quote":"Please use the new HMAC JWT keys instead using configuration"},{"url":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.6.md","quote":"Also make sure that the `APP_SECRET` environment variable is at least 32 characters long."},{"url":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.6.md","quote":"You can use the `bin/console system:generate-app-secret` command to generate an valid secret."},{"url":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.6.md","quote":"Changing this will invalidate all existing tokens and require a re-login for all users and all integrations."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6.7 removed jwt keys system:generate-jwt-secret admin api token signing"},{"tool":"WebFetch","args":"https://github.com/shopware/shopware/blob/trunk/UPGRADE-6.6.md"},{"tool":"WebFetch","args":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.6.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","findability":"n/a","startedAt":"2026-09-13T06:12:19Z","endedAt":"2026-09-13T06:22:00Z"},"gap-03":{"query":"My ERP integration stopped logging in after the 6.7 upgrade — what changed in the Admin API OAuth flow (`/api/oauth/authorize`, the `scope` format)?","category":"gap","option":"vanilla","answer":"Two things broke integrations in 6.7: Shopware upgraded the underlying `league/oauth2-server` library, and \"some requests that are not spec-compliant with the OAuth spec are not supported anymore\" as a result. Concretely, the official upgrade notes say scopes now need to be sent differently: \"Especially scopes now needed to be provided as `scope` parameter and as a space-delimited list of strings\" — so if your ERP was sending scopes as an array, it must instead send a single `scope` string with space-separated values (e.g. `write read`). Second, the `/api/oauth/authorize` route itself is gone: the notes state Shopware \"Removed API route `/api/oauth/authorize` (`\\Core\\Framework\\Api\\Controller\\AuthController::authorize` method) without replacement,\" so any integration calling that endpoint directly for the authorization-code flow must switch to the client-credentials token endpoint (`/api/oauth/token`) or otherwise be updated, since there is no drop-in replacement for the removed `authorize` action.","citations":[{"url":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.7.md","quote":"Especially scopes now needed to be provided as `scope` parameter and as a space-delimited list of strings."},{"url":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.7.md","quote":"Removed API route `/api/oauth/authorize` (`\\Core\\Framework\\Api\\Controller\\AuthController::authorize` method) without replacement."},{"url":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.7.md","quote":"some requests that are not spec-compliant with the OAuth spec are not supported anymore"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6.7 Admin API OAuth scope changed /api/oauth/authorize breaking change"},{"tool":"WebFetch","args":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.7.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","findability":"n/a","startedAt":"2026-09-13T06:12:59Z","endedAt":"2026-09-13T06:24:00Z"},"gap-04":{"query":"After upgrading to 6.7 my plugin fatals on load because core class properties now have native PHP types — which properties must I retype in my subclasses?","category":"gap","option":"vanilla","answer":"The official 6.7 upgrade notes describe this as a blanket, codebase-wide change rather than a fixed list of named properties: \"All PHP class properties now have a native type. If you have extended classes with properties, which didn't have a native type before, make sure you now add them as well.\" That means there is no single enumerated list to retype — you need to look at every core class your plugin extends (entities, extensions, services, etc.), find each property you redeclare/override in your subclass, check the native type that property now has in the Shopware 6.7 core source, and add the matching type declaration to your override, otherwise PHP will fatal on the incompatible/untyped redeclaration. The practical fix is to diff your extended classes against the current core source (or run the upgrade and read the fatal error, which names the exact class and property) rather than relying on a fixed list, since the change applies broadly across the framework. [from memory]","citations":[{"url":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.7.md","quote":"All PHP class properties now have a native type. If you have extended classes with properties, which didn't have a native type before, make sure you now add them as well."}],"toolCallLog":[{"tool":"WebFetch","args":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.7.md"}],"notFoundClaim":false,"memoryClaims":["The practical fix is to diff your extended classes against the current core source (or run the upgrade and read the fatal error, which names the exact class and property) rather than relying on a fixed list, since the change applies broadly across the framework."],"sourceVerdict":"partial","findability":"n/a","startedAt":"2026-09-13T06:13:33Z","endedAt":"2026-09-13T06:26:00Z"},"gap-05":{"query":"My plugin decorates `CachedProductRoute` to add cache tags — where did the `Cached*Route` classes go in Shopware 6.7 and how do I cache a Store API route now?","category":"gap","option":"vanilla","answer":"They were removed entirely in 6.7: the upgrade notes state \"The Store-API route caching has been removed. This means that the `Cached*Route` classes will be removed.\" I confirmed on disk that `CachedProductRoute` no longer exists anywhere under `vendor/shopware/core` in this installation (a recursive filename search for `CachedProductRoute*` returned nothing). The rationale given is that route-level caching caused inconsistent state versus the HTTP cache and had a low hit rate anyway: \"This solves some weird states when the HTTP-Cache was invalidated separately from the route cache. Additionally, the cache hit rate for the Store-API was low, so the performance impact should be minimal.\" Since there is no more `Cached*Route` decoration point, you can no longer add cache tags by decorating a `CachedProductRoute` service — Store API responses are instead expected to rely on the reverse-proxy/HTTP cache layer rather than an application-level route cache, so any plugin logic that added custom cache tags via a `Cached*Route` decorator needs to be dropped/reworked against the HTTP cache instead. [from memory]","citations":[{"url":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.7.md","quote":"The Store-API route caching has been removed. This means that the `Cached*Route` classes will be removed."},{"url":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.7.md","quote":"This solves some weird states when the HTTP-Cache was invalidated separately from the route cache. Additionally, the cache hit rate for the Store-API was low, so the performance impact should be minimal, but the amount of cache items and cache invalidations will be reduced."}],"toolCallLog":[{"tool":"Bash","args":"find <home>/projects/host-project/vendor/shopware/core -iname 'CachedProductRoute*'"},{"tool":"WebFetch","args":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.7.md"},{"tool":"WebFetch","args":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.7.md"}],"notFoundClaim":false,"memoryClaims":["Since there is no more `Cached*Route` decoration point, you can no longer add cache tags by decorating a `CachedProductRoute` service — Store API responses are instead expected to rely on the reverse-proxy/HTTP cache layer rather than an application-level route cache, so any plugin logic that added custom cache tags via a `Cached*Route` decorator needs to be dropped/reworked against the HTTP cache instead."],"sourceVerdict":"yes","findability":"n/a","startedAt":"2026-09-13T06:13:52Z","endedAt":"2026-09-13T06:28:00Z"},"gap-06":{"query":"How do I create a shipping method from my plugin's installer or migration, including the `technicalName` that 6.7 requires?","category":"gap","option":"vanilla","answer":"Since 6.7.0.0, `technical_name` on `shipping_method` is a required field — the core definition marks it `(new StringField('technical_name', 'technicalName'))->addFlags(new ApiAware(), new Required())`. Shopware's own ADR confirms the requirement: \"Plugin developers will be required to supply a `technicalName` for their payment and shipping methods, at least beginning with version 6.7.0.0,\" and recommends a naming convention such as \"payment_[AppName]_[identifier]\" or \"shipping_[AppName]_[identifier]\" for plugin/app-provided methods (core defaults look like \"shipping_standard\"). In practice, from a plugin migration (a `Migration\\MigrationXXXXXX` class under `src/Migration`) or the plugin's `install()`/`activate()` lifecycle method, you insert a row into `shipping_method` (with `id`, `technical_name`, `active`, `delivery_time_id` etc.) plus a `shipping_method_translation` row for the display name, or equivalently build the entity via the `shipping_method.repository` `EntityRepository::create()` call, always supplying a unique `technicalName` value up front so the write doesn't fail against the `Required()` flag. [from memory]","citations":["vendor/shopware/core/Checkout/Shipping/ShippingMethodDefinition.php:70-84",{"url":"https://developer.shopware.com/docs/resources/references/adr/2023-10-17-add-unique-identifiers-for-checkout-methods.html","quote":"Plugin developers will be required to supply a `technicalName` for their payment and shipping methods, at least beginning with version 6.7.0.0."}],"toolCallLog":[{"tool":"Bash","args":"grep -n 'technicalName' -r <home>/projects/host-project/vendor/shopware/core/Checkout/Shipping/ 2>/dev/null | head -20"},{"tool":"WebSearch","args":"Shopware 6 pl ce` and call `generate(MediaCollection $collection, Context $context): int` with a collection containing your newly created media entity (loaded via the media repository) to generate its configured thumbnail sizes, or `updateThumbnails(MediaEntity $media, Context $context, bool $strict): int` to (re)generate for a single entity.","citations":["vendor/shopware/core/Content/Media/MediaService.php:54-91","vendor/shopware/core/Content/Media/Thumbnail/ThumbnailService.php:47-66"],"toolCallLog":[{"tool":"Bash","args":"find vendor/shopware/core/Content/Media -iname '*FileSaver*' -o -iname 'MediaService.php'"},{"tool":"Read","args":"<home>/projects/host-project/vendor/shopware/core/Content/Media/File/FileSaver.php (limit 80)"},{"tool":"Bash","args":"find vendor/shopware/core/Content/Media -iname '*ThumbnailService*'"},{"tool":"Bash","args":"grep -n 'public function' vendor/shopware/core/Content/Media/Thumbnail/ThumbnailService.php | head -20"},{"tool":"Bash","args":"grep -n 'public function' vendor/shopware/core/Content/Media/MediaService.php | head -20"},{"tool":"Read","args":"<home>/projects/host-project/vendor/shopware/core/Content/Media/MediaService.php (offset 54, limit 40)"},{"tool":"Read","args":"<home>/projects/host-project/vendor/shopware/core/Content/Media/Thumbnail/ThumbnailService.php (offset 47, limit 20)"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","findability":"n/a","startedAt":"2026-09-13T06:15:22Z","endedAt":"2026-09-13T06:39:00Z"},"gap-08":{"query":"How do I set up a Nuxt project with Shopware Composable Frontends against my shop's Store API — endpoint, access token, and why do I get HTTP 412?","category":"gap","option":"vanilla","answer":"You configure the Shopware Nuxt module in `nuxt.config.ts` with a `shopware` block containing your sales-channel access token and the Store API endpoint URL, per the official troubleshooting page's example: `shopware: { accessToken: \"SWSCBHFSNTVMAWNZDNFKSHLAYW\", // access token for corresponding sales channel; endpoint: \"https://demo-frontends.shopware.store/store-api/\", // endpoint where store-api is available; devStorefrontUrl: \"https://demo-frontends.shopware.store\" }`. The access token is the one shown for the Storefront (or headless) sales channel in the Shopware admin's Sales Channel API section, and the endpoint must point at your shop's `/store-api/` path (with trailing slash), e.g. `https://your-shop/store-api/`. If you get an HTTP 412, the docs explain the cause directly: \"The HTTP status code 412 (Precondition Failed) usually means in the Shopware `store API` context that the specified `accessToken` is incorrect or not correct for the specified `endpoint`,\" so the fix is to re-check that the `accessToken` and `endpoint` in `nuxt.config.ts` are correct and actually match each other's sales channel, and to try hitting the store API endpoint directly with an API client to confirm the credentials work outside Nuxt.","citations":[{"url":"https://developer.shopware.com/frontends/resources/troubleshooting.html","quote":"The HTTP status code 412 (Precondition Failed) usually means in the Shopware `store API`\ncontext that the specified `accessToken` is incorrect or not correct for the specified `endpoint`."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware Composable Frontends Nuxt setup Store API endpoint access token 412 error"},{"tool":"WebFetch","args":"https://developer.shopware.com/frontends/resources/troubleshooting.html"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","findability":"n/a","startedAt":"2026-09-13T06:16:08Z","endedAt":"2026-09-13T06:42:00Z"}}},"scored":{"vanilla":{"dev-01":{"caseId":"dev-01","category":"dev","status":"confirmed","area":"DAL","version":"6.6 + 6.7","scores":{"groundingRelevance":70,"accuracy":40,"completeness":40,"citation":40,"honesty":0,"actionability":70},"points":{"groundingRelevance":17.5,"accuracy":10,"completeness":6,"citation":4,"honesty":0,"actionability":7},"total":44,"verdict":"fail"
