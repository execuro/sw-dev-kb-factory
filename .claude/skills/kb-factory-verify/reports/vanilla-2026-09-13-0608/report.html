efine a custom field set for products from a plugin so merchants can edit the values in the Administration. Include file locations and XML/PHP structure."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:10:13Z","endedAt":"2026-09-13T06:11:40Z"},"dev-33":{"query":"How do I register a custom Administration module from my plugin, and what has to line up for it to actually show up after a build?","category":"dev","option":"vanilla","answer":"Create your module at <plugin root>/src/Resources/app/administration/src/module/<your-module-name>/ with an index.js file, since Shopware automatically requires an index.js for each module. Import that module directory from your plugin's main.js (e.g. import './module/swag-example';) so it is picked up during the build. Inside index.js, call Shopware.Module.register('<module-name>', {...}) with a configuration object that includes type: 'plugin', a unique name, title/description snippet keys, color, icon, a routes object (list/detail/create views each pointing at a component), a snippets object for de-DE/en-GB, and a navigation entry. The routes' component names must match components you actually register, and the navigation entry must reference the correct route path, otherwise the module either fails to register or does not appear in the menu. Finally you must run the administration build (with the plugin active) so the module's JS is compiled into public/bundles/administration/ for it to appear in a production build.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/administration/module-component-management/add-custom-module.html","quote":"Shopware 6 is automatically requiring an `index.js` file for each module."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/administration/module-component-management/add-custom-module.html","quote":"All pieces—entry point, registration, routes, components, and snippets—must connect correctly at runtime for the module to appear after the build completes."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware add custom Administration module plugin main.js module.ts register not showing up after build"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/administration/module-component-management/add-custom-module.html, prompt=Explain how to register a custom Administration module from a plugin, including file structure, main.js, Module.register, routing, and what needs to line up for it to show up after an administration build."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:11:40Z","endedAt":"2026-09-13T06:13:10Z"},"dev-34":{"query":"How do I extend an existing Administration component and its Twig blocks from my plugin, for example to change the dashboard headline?","category":"dev","option":"vanilla","answer":"First find the Twig block you want to change in the target component's template - for the dashboard headline this is the sw_dashboard_index_content_intro_content_headline block inside the sw-dashboard-index component. Create a new .html.twig file in your plugin that redeclares that block (optionally calling {% parent %} to keep the original content) with your replacement markup. Then create a JS file that imports this template and calls Shopware.Component.override('sw-dashboard-index', { template }) - the first argument is the component name being overridden and the second is an object with the overridden properties. Finally import that override file from your plugin's main.js, located at <plugin-root>/src/Resources/app/administration/src/main.js, since Shopware automatically discovers and loads files referenced from there.","citations":[{"url":"https://developer.shopware.com/docs/v6.5/guides/plugins/plugins/administration/customizing-components.html","quote":"For example, the dashboard headline is found in the `sw-dashboard-index` component within a block named `sw_dashboard_index_content_intro_content_headline`."},{"url":"https://developer.shopware.com/docs/v6.5/guides/plugins/plugins/administration/customizing-components.html","quote":"Shopware.Component.override('sw-dashboard-index', {\n    template\n});"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware extend Administration component override Twig block dashboard headline plugin"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/v6.5/guides/plugins/plugins/administration/customizing-components.html, prompt=Explain step by step how to extend an existing Administration component and override its Twig block from a plugin, using the dashboard headline as the example. Include the Component.override / Component.extend API and template syntax."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:13:10Z","endedAt":"2026-09-13T06:14:30Z"},"dev-35":{"query":"How do I load entities from the Admin API inside an Administration component using the repository factory and a Criteria?","category":"dev","option":"vanilla","answer":"In your component, add inject: ['repositoryFactory'] to gain access to the repositoryFactory service via Vue's dependency injection. Create a repository for the entity you need, e.g. const productRepository = this.repositoryFactory.create('product') (an options object can be passed as a third argument, e.g. { version: 1 }, to pin an API version). Then build a Criteria (import { Criteria } from Shopware.Data or use new Criteria()), set paging/filters/sorting on it (e.g. criteria.setPage(1), criteria.setLimit(10), criteria.addFilter(Criteria.equals('product.active', true)), criteria.addSorting(...)), and call this.productRepository.search(criteria, Shopware.Context.api).then(result => ...) to fetch data from the server; the search method requires the Criteria object and the API context as its two parameters.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.html","quote":"As the documentation notes, \"To fetch data from the server, the repository has a `search` function.\""},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.html","quote":"const productRepository = this.repositoryFactory.create('product')"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware Administration repositoryFactory create Criteria load entities component"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.html, prompt=Explain how to load entities from the Admin API inside an Administration component using the repository factory and a Criteria object. Include code examples for injecting repositoryFactory, creating a repository, and searching with Criteria."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:14:30Z","endedAt":"2026-09-13T06:15:50Z"},"dev-36":{"query":"How do I register ACL privileges for my plugin's Administration module and check them in a component or template?","category":"dev","option":"vanilla","answer":"Create an acl/index.js file next to your module (e.g. <plugin root>/src/Resources/app/administration/src/<module>/acl/index.js) and import it from your module's index.js. In it, call Shopware.Service('privileges').addPrivilegeMappingEntry({ category: 'permissions', parent: null, key: 'your_key', roles: { viewer: {...}, editor: {...}, creator: {...}, deleter: {...} } }), defining the standard CRUD roles viewer/editor/creator/deleter with their privileges and dependencies (for non-CRUD actions you can define custom role names under additional_permissions instead). To check a privilege in a component, inject the acl service (inject: ['acl']) and call this.acl.can('your_key.editor') (or the relevant role) inside methods or computed properties; in a Twig/Vue template you can use it directly, e.g. v-if=\"acl.can('review.editor')\" or bind :disabled=\"!acl.can('review.editor')\" combined with a tooltip. Note that ACL checks in the Administration only guard the UI, so the same checks must also be enforced on the backend/API side for real security.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.html","quote":"Shopware.Service('privileges').addPrivilegeMappingEntry({\n    category: 'permissions',\n    parent: null,\n    key: 'your_key',\n    roles: {\n        viewer: { privileges: [], dependencies: [] },\n        editor: { privileges: [], dependencies: [] },\n        creator: { privileges: [], dependencies: [] },\n        deleter: { privileges: [], dependencies: [] }\n    }\n});"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.html","quote":"return this.acl.can('review.editor');"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware plugin Administration ACL privileges module acl key permissions check component"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.html, prompt=Explain how to register ACL privileges for a plugin's Administration module (privilege mapping entry, roles like viewer/editor/creator/deleter) and how to check those privileges in a component or Twig template (e.g. v-acl-tooltip or acl.can)."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:15:50Z","endedAt":"2026-09-13T06:17:20Z"},"dev-37":{"query":"How do I set up and run PHPUnit integration tests for my Shopware plugin, including tests that boot the kernel?","category":"dev","option":"vanilla","answer":"Create a phpunit.xml in your plugin root pointing bootstrap at tests/TestBootstrap.php and declaring your testsuite(s)/directories. In tests/TestBootstrap.php, use Shopware\\Core\\TestBootstrapper: (new TestBootstrapper())->addCallingPlugin()->addActivePlugins('YourPlugin')->setForceInstallPlugins(true)->bootstrap()->getClassLoader(), then register your test namespace with $loader->addPsr4(...); setForceInstallPlugins ensures your plugin is installed/active even if the test database already existed. For standard tests that need the booted kernel/container and DB, extend PHPUnit's TestCase and use the Shopware\\Core\\Framework\\Test\\TestCaseBase\\IntegrationTestBehaviour trait, which handles transactions and cache clearing automatically; for lower-level access such as in migration tests, use the KernelTestBehaviour trait and pull services (e.g. Doctrine\\DBAL\\Connection) via $this->getContainer()->get(...). Run the tests from the project root with vendor/bin/phpunit --configuration=\"custom/plugins/YourPlugin\", optionally adding --testsuite <name> or --filter <testMethodName> to narrow the run.","citations":[{"url":"https://developer.shopware.com/docs/guides/development/testing/unit/php-unit.html","quote":"The \"setForceInstallPlugins method ensures that your plugin is installed and active even if the test database was already built beforehand.\""},{"url":"https://developer.shopware.com/docs/guides/development/testing/unit/php-unit.html","quote":"./vendor/bin/phpunit --configuration=\"custom/plugins/SwagBasicExample\""}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware plugin PHPUnit integration test kernel TestBootstrapper phpunit.xml.dist"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/development/testing/unit/php-unit.html, prompt=Explain how to set up and run PHPUnit integration tests for a Shopware plugin, including phpunit.xml configuration, TestBootstrap.php using TestBootstrapper, and tests that boot the kernel (KernelTestBehaviour / IntegrationTestBehaviour). Include how to run tests via bin/phpunit or vendor/bin/phpunit."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:17:20Z","endedAt":"2026-09-13T06:18:50Z"},"dev-38":{"query":"How do I write Jest unit tests for my Administration components in Shopware 6.7?","category":"dev","option":"vanilla","answer":"Place the spec file next to the component being tested, named componentName.spec.js (or .spec.ts); you can scaffold one with the composer run admin:create:test command, pasting the component path when prompted. Because Administration components are registered on the global Shopware object rather than imported as plain Vue components, you first import the component file to register it, then resolve/mount it via Vue Test Utils using shallowMount(Shopware.Component.build('component-name'), { props, stubs, ... }) rather than mounting the raw component export. A typical test suite mounts the component in beforeEach, destroys the wrapper in afterEach, and asserts on wrapper.vm or DOM output; dependencies are isolated by passing props via the props option, stubbing child components via stubs, mocking services with Shopware.Service.register(), adding directives via localVue.directive(), and supplying injections via provide - the admin test setup also ships preconfigured mocks for things like ACL roles, feature flags, and the repository factory. Run the tests with composer run admin:unit (full run with coverage) or composer run admin:unit:watch (watch mode) from the Shopware root.","citations":[{"url":"https://developer.shopware.com/docs/guides/development/testing/unit/jest-admin.html","quote":"shallowMount(Shopware.Component.build('sw-alert'), {\n  props: { /* required props */ },\n  stubs: { /* child components */ }\n});"},{"url":"https://developer.shopware.com/docs/guides/development/testing/unit/jest-admin.html","quote":"**Full test suite with coverage:** `composer run admin:unit`"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6.7 Jest unit test Administration component developer.shopware.com"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/development/testing/unit/jest-admin.html, prompt=Explain how to write Jest unit tests for Administration components in a Shopware plugin, including how to create the test boilerplate, mount the component, and run the tests via composer commands."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:18:50Z","endedAt":"2026-09-13T06:20:10Z"},"dev-39":{"query":"How do I write end-to-end Cypress tests for my plugin against a Shopware 6.7 store?","category":"dev","option":"vanilla","answer":"For Shopware 6.7, Cypress is not the current recommended tool: the old Cypress-based e2e-testsuite-platform is deprecated/no longer maintained, and Shopware's official developer documentation page for it returns 404, replaced by the Playwright-based Shopware Acceptance Test Suite (ATS). Playwright has replaced Cypress as the recommended end-to-end testing tool for Shopware. To test a plugin against a 6.7 store today you would instead scaffold a Playwright project (npm init playwright@latest), install the ATS package (npm install @shopware-ag/acceptance-test-suite), run npm install && npx playwright install, configure APP_URL and either integration credentials (SHOPWARE_ACCESS_KEY_ID/SHOPWARE_SECRET_ACCESS_KEY) or admin user credentials in .env and playwright.config.ts, and then write tests that extend the ATS's base test object (import { test as base } from '@shopware-ag/acceptance-test-suite') to get access to Shopware-specific fixtures such as AdminApiContext and DefaultSalesChannel. If a Cypress-specific plugin test setup is still required (e.g. for an older, unmigrated project), that guide is no longer present at its previous developer.shopware.com location, so it should be treated as deprecated/removed content rather than the current recommended path.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/testing/playwright/install-configure.html","quote":"Based on the documentation, **Playwright has replaced Cypress** as the recommended end-to-end testing tool for Shopware."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/testing/playwright/install-configure.html","quote":"\"The test suite uses the extension system of Playwright and can be used as a complete drop-in for Playwright,\""}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6.7 Cypress end-to-end test plugin store developer.shopware.com"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/testing/cypress/, prompt=Explain how to write and run Cypress end-to-end tests for a Shopware plugin against a 6.7 store: setup, folder structure, npm/composer commands to run tests, and note any deprecation status of Cypress in favor of Playwright."},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/testing/end-to-end-testing, prompt=Explain how to write and run Cypress end-to-end tests for a Shopware plugin against a 6.7 store: setup, folder structure, npm/composer commands to run tests, and note any deprecation status of Cypress in favor of Playwright."},{"tool":"WebSearch","args":"\"developer.shopware.com\" Cypress deprecated Playwright testing extensions 2025"},{"tool":"WebSearch","args":"Shopware Acceptance Test Suite Playwright developer.shopware.com guides"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/testing/playwright/install-configure.html, prompt=Explain how to set up and write end-to-end Playwright tests for a Shopware plugin against a 6.7 store, and whether Cypress is still the recommended e2e tool or has been replaced."}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial","startedAt":"2026-09-13T06:20:10Z","endedAt":"2026-09-13T06:23:00Z"},"dev-40":{"query":"How do I upgrade a Composer-based Shopware project from 6.6 to 6.7 — which composer.json constraint do I change, and which console commands do I run afterwards?","category":"dev","option":"vanilla","answer":"Run bin/console system:update:prepare before touching anything, then in composer.json bump the version constraint for shopware/core to the desired 6.7 version, and adjust the other Shopware packages (shopware/administration, shopware/storefront, shopware/elasticsearch, etc.) to matching 6.7 constraints so they stay in sync with shopware/core. Run composer update to pull in the new versions, then run bin/console system:update:finish to complete the update, and run composer recipes:update to force-update Symfony Flex recipe-managed configuration files. The official update guide's documented steps stop at that point and do not explicitly list further commands such as assets:install, theme:compile or cache:clear for this path, though running those (plus clearing caches) is common general post-upgrade practice for Shopware [from memory]. Separately, when upgrading a plugin's own compatibility, note that plugin builds for the Administration are not backward compatible between 6.6 and 6.7, so a plugin usually needs a 6.7-specific build/version rather than one shared with 6.6 [from memory].","citations":[{"url":"https://docs.shopware.com/en/shopware-6-en/update-guides/updating-shopware","quote":"Run the preparation command in your Shopware root directory:\n```\nbin/console system:update:prepare\n```"},{"url":"https://docs.shopware.com/en/shopware-6-en/update-guides/updating-shopware","quote":"Execute the finish command:\n```\nbin/console system:update:finish\n```"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware upgrade 6.6 to 6.7 composer.json constraint upgrade guide console commands"},{"tool":"WebFetch","args":"url=https://docs.shopware.com/en/shopware-6-en/update-guides/updating-shopware, prompt=Explain exactly how to upgrade a Composer-based Shopware project from 6.6 to 6.7: which composer.json constraint(s) to change, the composer commands to run, and the console commands to run afterwards (assets:install, bundle:dump, theme:compile, cache:clear, migrations, etc)."}],"notFoundClaim":false,"memoryClaims":["The official update guide's documented steps stop at that point and do not explicitly list further commands such as assets:install, theme:compile or cache:clear for this path, though running those (plus clearing caches) is common general post-upgrade practice for Shopware [from memory].","Separately, when upgrading a plugin's own compatibility, note that plugin builds for the Administration are not backward compatible between 6.6 and 6.7, so a plugin usually needs a 6.7-specific build/version rather than one shared with 6.6 [from memory]."],"sourceVerdict":"partial","startedAt":"2026-09-13T06:23:00Z","endedAt":"2026-09-13T06:24:30Z"},"dev-41":{"query":"`composer update` to Shopware 6.7 aborts on a platform requirement and my admin build then fails too — which PHP, database and Node versions does 6.7 actually require, and how do I check the machine I am on against them before I retry?","category":"dev","option":"vanilla","answer":"Shopware 6.7's core composer package requires PHP `~8.2.0 || ~8.3.0 || ~8.4.0 || ~8.5.0`, i.e. PHP 8.2 as the floor with 8.3/8.4/8.5 also supported, as declared in the installed shopware/core composer.json. For the database, Shopware's hosting guide states the minimum is 'MariaDB ≥ 10.11.6 or MySQL ≥ 8.0.22 (Innovation releases are not supported)', with 'MariaDB 11.4 / MySQL 8.4' as the recommended version. For the administration build, the installed administration package.json declares an engines requirement of Node `^20.0.0 || ^21.0.0 || ^22.0.0 || ^23.0.0 || ^24.0.0 || ^25.0.0` (npm >=10.0.0), and the hosting guide separately recommends 'Node 20.0.0+' at minimum with 'Node 24 / npm 10' as the recommended configuration. To check your machine before retrying, run `php -v`, `mysql --version` or `mariadb --version`, and `node -v` and compare them against these ranges — Composer's platform-requirement failure message itself names the exact PHP constraint it could not satisfy, so re-reading that message against the shopware/core composer.json requirement above tells you exactly which version to install or switch to (e.g. via phpenv/nvm). [from memory]","citations":["vendor/shopware/core/composer.json:31-32","vendor/shopware/administration/Resources/app/administration/package.json (engines block, read via grep+cat)",{"url":"https://developer.shopware.com/docs/guides/hosting/","quote":"MariaDB ≥ 10.11.6 or MySQL ≥ 8.0.22 (Innovation releases are not supported)"},{"url":"https://developer.shopware.com/docs/guides/hosting/","quote":"Node 20.0.0+"}],"toolCallLog":[{"tool":"Bash","args":"date -u +%Y-%m-%dT%H:%M:%SZ"},{"tool":"WebSearch","args":"Shopware 6.7 system requirements PHP version database version node version"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/installation/system-requirements.html — PHP/DB/Node versions"},{"tool":"WebSearch","args":"developer.shopware.com hosting guide recommended technology stack PHP 8.3 MySQL Node"},{"tool":"Bash","args":"cat <home>/projects/host-project/vendor/shopware/core/composer.json | head -40; grep -i php composer.json; find vendor/shopware -maxdepth 3 -name package.json"},{"tool":"Bash","args":"grep -A5 '\"require\"' vendor/shopware/core/composer.json | head -20"},{"tool":"Bash","args":"find vendor/shopware -iname package.json -path '*administration*'; find vendor/shopware -maxdepth 4 -iname package.json"},{"tool":"Bash","args":"grep -A5 '\"engines\"' vendor/shopware/administration/Resources/app/administration/package.json"},{"tool":"Bash","args":"grep -rn '8.0.17|MySQL 8|mariadb.*10.11|MARIADB_MINIMUM_VERSION|MYSQL_MINIMUM_VERSION' vendor/shopware/core/Kernel.php vendor/shopware/core/Framework/DataAbstractionLayer/"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/installation/system-requirements.html — quote MySQL/MariaDB/PHP/Node sentences"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/hosting/ — quote PHP/DB/Node version requirements"},{"tool":"WebSearch","args":"shopware-cli check system requirements command"}],"notFoundClaim":false,"memoryClaims":["To check your machine before retrying, run `php -v`, `mysql --version` or `mariadb --version`, and `node -v` and compare them against these ranges — Composer's platform-requirement failure message itself names the exact PHP constraint it could not satisfy, so re-reading that message against the shopware/core composer.json requirement above tells you exactly which version to install or switch to (e.g. via phpenv/nvm)."],"sourceVerdict":"yes","startedAt":"2026-09-13T06:09:37Z","endedAt":"2026-09-13T06:10:52Z"},"dev-42":{"query":"How do I check extension compatibility before upgrading with shopware-cli, and why does it report my plugins in custom/plugins as blocking?","category":"dev","option":"vanilla","answer":"Use the shopware-cli project upgrade wizard, which combines readiness checks, extension compatibility analysis, Composer resolution, the local upgrade, and a shareable report. It checks compatibility in two stages: first, 'Extension and repository metadata provide an early compatibility signal,' and then 'A Composer dry run verifies whether the target dependency set can actually be resolved for this project,' with Composer resolution being decisive since 'Composer resolution is the final gate for the dependency set.' Plugins that live directly in custom/plugins (rather than being required via Composer) get reported as blocking because 'Extensions living outside vendor/, for example in custom/plugins, cannot participate in that resolution and therefore block the upgrade readiness check' — the wizard needs every extension to be Composer-managed so it can be included in the same dependency resolution as the rest of the upgrade, and the docs point to an autofix command to migrate such extensions into Composer management first.","citations":[{"url":"https://developer.shopware.com/docs/guides/upgrades-migrations/upgrade-shopware.html","quote":"The wizard checks project readiness, lets you choose the target Shopware version, checks Composer-managed extensions, and verifies the target dependency set with Composer before changing project files."},{"url":"https://developer.shopware.com/docs/products/tools/cli/project-commands/upgrade.html","quote":"Extension and repository metadata provide an early compatibility signal."},{"url":"https://developer.shopware.com/docs/products/tools/cli/project-commands/upgrade.html","quote":"A Composer dry run verifies whether the target dependency set can actually be resolved for this project."},{"url":"https://developer.shopware.com/docs/products/tools/cli/project-commands/upgrade.html","quote":"Composer resolution is the final gate for the dependency set."},{"url":"https://developer.shopware.com/docs/products/tools/cli/project-commands/upgrade.html","quote":"Extensions living outside `vendor/`, for example in `custom/plugins`, cannot participate in that resolution and therefore block the upgrade readiness check."}],"toolCallLog":[{"tool":"Bash","args":"date -u +%Y-%m-%dT%H:%M:%SZ"},{"tool":"WebSearch","args":"shopware-cli extension compatibility check upgrade command"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/upgrades-migrations/upgrade-shopware.html — extension compatibility checking with shopware-cli"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/products/tools/cli/project-commands/upgrade.html — how compatibility checked, why custom/plugins block"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:11:13Z","endedAt":"2026-09-13T06:12:40Z"},"dev-43":{"query":"My admin plugin still ships a webpack.config.js — how do I move the administration build to Vite for Shopware 6.7?","category":"dev","option":"vanilla","answer":"Shopware 6.7 switches the administration build from Webpack to Vite, and the switch is not backward compatible: a custom webpack.config.js is simply no longer read. Previously your config lived at 'YourApp/src/Resources/app/administration/build/' as webpack.config.js; for Vite you instead 'Create a new config file vite.config.mts in your plugin in the YourApp/src/Resources/app/administration/src directory,' alongside your entry file such as main.js. After adding the Vite config you should 'Remove the old webpack.config.js file' and update package.json to drop webpack-related packages in favor of Vite dependencies. With Vite you also no longer need a custom config just to consume npm packages, since Vite resolves them from your plugin's node_modules using standard Node.js module resolution [from memory]. Because the migration mechanics (e.g. converting webpack's resolve.alias to Vite's equivalent) can vary a lot depending on your existing config, the docs note that 'Depending on your webpack config, the migration can vary greatly' and point to Vite's own documentation for more complex setups.","citations":[{"url":"https://developer.shopware.com/docs/guides/upgrades-migrations/administration/vite.html","quote":"you had a `webpack.config.js` in the following directory: `YourApp/src/Resources/app/administration/build/`"},{"url":"https://developer.shopware.com/docs/guides/upgrades-migrations/administration/vite.html","quote":"Create a new config file `vite.config.mts` in your plugin in the `YourApp/src/Resources/app/administration/src` directory."},{"url":"https://developer.shopware.com/docs/guides/upgrades-migrations/administration/vite.html","quote":"Remove the old `webpack.config.js` file"},{"url":"https://developer.shopware.com/docs/guides/upgrades-migrations/administration/vite.html","quote":"Depending on your webpack config, the migration can vary greatly"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6.7 administration Vite migration webpack.config.js"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/upgrades-migrations/administration/vite.html — migration steps webpack to Vite"}],"notFoundClaim":false,"memoryClaims":["With Vite you also no longer need a custom config just to consume npm packages, since Vite resolves them from your plugin's node_modules using standard Node.js module resolution [from memory]."],"sourceVerdict":"yes","startedAt":"2026-09-13T06:12:40Z","endedAt":"2026-09-13T06:13:40Z"},"dev-44":{"query":"After the Vue 3 upgrade my admin plugin broke — this.$parent resolves to the wrong component and a prop default that calls this.$tc throws. What do I have to change?","category":"dev","option":"vanilla","answer":"Both symptoms are documented Vue 2-to-3 breaking changes in Shopware's administration. For this.$parent: 'Vue 3 wraps asynchronous components in an AsyncWrapperComponent. This leads to the virtual DOM tree differing between Vue 2 and Vue 3,' so 'Where in Vue 2, a this.$parent call was successful, in Vue 3, a this.$parent.$parent may be necessary.' The recommended fix is not to just add another .$parent hop but to stop relying on parent traversal at all: 'Try to avoid this.$parent communication whenever possible, as this is an anti-pattern. Use services or event communication instead.' For the prop-default crash: in Vue 3, 'Prop default functions no longer have access to the component's this scope. You can no longer call this.$tc in default functions,' and the documented replacement is to 'Use Shopware.Snippet.tc instead' inside the prop default function.","citations":[{"url":"https://developer.shopware.com/docs/guides/upgrades-migrations/administration/vue3.html","quote":"Vue 3 wraps asynchronous components in an `AsyncWrapperComponent`. This leads to the virtual DOM tree differing between Vue 2 and Vue 3."},{"url":"https://developer.shopware.com/docs/guides/upgrades-migrations/administration/vue3.html","quote":"Where in Vue 2, a `this.$parent` call was successful, in Vue 3, a `this.$parent.$parent` may be necessary."},{"url":"https://developer.shopware.com/docs/guides/upgrades-migrations/administration/vue3.html","quote":"Try to avoid `this.$parent` communication whenever possible, as this is an anti-pattern. Use services or event communication instead."},{"url":"https://developer.shopware.com/docs/guides/upgrades-migrations/administration/vue3.html","quote":"Prop default functions no longer have access to the component's `this` scope. You can no longer call `this.$tc` in default functions."},{"url":"https://developer.shopware.com/docs/guides/upgrades-migrations/administration/vue3.html","quote":"Use `Shopware.Snippet.tc` instead."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware administration Vue 3 migration this.$parent $tc deprecated breaking change"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/upgrades-migrations/administration/vue3.html — this.$parent and prop default $tc breaking changes"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:13:40Z","endedAt":"2026-09-13T06:14:30Z"},"dev-45":{"query":"Shopware.State is deprecated in 6.7 — how do I convert my administration Vuex module into a Pinia store?","category":"dev","option":"vanilla","answer":"Register the store with Shopware.Store.register instead of Shopware.State.registerModule, e.g. `const store = Shopware.Store.register('<storeName>', { state: () => ({...}), getters: {...}, actions: {...} });`. The state shape changes because 'In Pinia, state must be a function that returns the initial state rather than a static object,' and the mutations layer goes away entirely since 'Vuex mutations are no longer needed in Pinia, since you can modify the state directly in actions.' Getters keep computing derived values but should not be named identically to state properties. Wherever components previously read the store via Shopware.State.get('<storeName>'), switch to Shopware.Store.get('<storeName>') instead.","citations":[{"url":"https://developer.shopware.com/docs/guides/upgrades-migrations/administration/pinia.html","quote":"In Pinia, `state` must be a function that returns the initial state rather than a static object."},{"url":"https://developer.shopware.com/docs/guides/upgrades-migrations/administration/pinia.html","quote":"Vuex `mutations` are no longer needed in Pinia, since you can modify the state directly in actions."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware.State deprecated Pinia store administration 6.7 migrate Vuex"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/upgrades-migrations/administration/pinia.html — convert Vuex module to Pinia store API"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:14:30Z","endedAt":"2026-09-13T06:15:20Z"},"dev-46":{"query":"sw-button and sw-card are deprecated in Shopware 6.7 — how do I migrate my plugin's admin templates to the Meteor components, and is there a codemod that does it?","category":"dev","option":"vanilla","answer":"Yes, Shopware ships a codemod for this: 'To simplify the plugin migration process, we provide codemods that automatically replace old components with new Meteor Components.' You run it with `composer run admin:code-mods -- --plugin-name example-plugin --fix -v 6.7`, passing your plugin name and the target Shopware version. The tool will 'automatically replace compatible components with Meteor Components' (e.g. sw-button to mt-button, sw-card to mt-card) and 'add guidance comments for components that require manual migration' where it cannot safely auto-convert. In 6.7 the sw-* components still work as thin wrappers around mt-* and only emit console warnings — they are not removed until 6.8 or later, so you can run the codemod and address any manual-migration comments at your own pace before then. [from memory]","citations":[{"url":"https://developer.shopware.com/docs/guides/upgrades-migrations/administration/meteor-components.html","quote":"To simplify the plugin migration process, we provide codemods that automatically replace old components with new Meteor Components."},{"url":"https://developer.shopware.com/docs/guides/upgrades-migrations/administration/meteor-components.html","quote":"automatically replace compatible components with Meteor Components"},{"url":"https://developer.shopware.com/docs/guides/upgrades-migrations/administration/meteor-components.html","quote":"add guidance comments for components that require manual migration"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware sw-button sw-card deprecated Meteor components codemod migration"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/upgrades-migrations/administration/meteor-components.html — codemod for Meteor component migration"}],"notFoundClaim":false,"memoryClaims":["In 6.7 the sw-* components still work as thin wrappers around mt-* and only emit console warnings — they are not removed until 6.8 or later, so you can run the codemod and address any manual-migration comments at your own pace before then. [from memory]"],"sourceVerdict":"yes","startedAt":"2026-09-13T06:15:20Z","endedAt":"2026-09-13T06:16:10Z"},"dev-47":{"query":"My payment plugin implements `AsynchronousPaymentHandlerInterface` and is tagged `shopware.payment.method.async` — how do I write a payment handler for Shopware 6.7 instead?","category":"dev","option":"vanilla","answer":"In Shopware 6.7 the separate sync/async payment interfaces are consolidated: instead of implementing AsynchronousPaymentHandlerInterface, you 'extend the Shopware\\Core\\Checkout\\Payment\\Cart\\PaymentHandler\\AbstractPaymentHandler class.' The service tag also changes to a single tag, shopware.payment.method, and the old `shopware.payment.method.async` tag should be removed. Whether your handler behaves synchronously or asynchronously is now determined by which methods you implement rather than which interface you chose — for an async-style flow you implement `pay` (returning a RedirectResponse) and `finalize`, where the docs note 'finalize: only called, if pay returns a RedirectResponse.' Payment handlers built this way also only receive the orderTransactionId, request data, and a Context, so any additional order data your handler needs must now be loaded by the handler itself rather than being passed in. [from memory]","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/payment/add-payment-plugin.html","quote":"extend the `Shopware\\Core\\Checkout\\Payment\\Cart\\PaymentHandler\\AbstractPaymentHandler` class"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/payment/add-payment-plugin.html","quote":"finalize: only called, if `pay` returns a `RedirectResponse`"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6.7 payment handler AbstractPaymentHandler AsynchronousPaymentHandlerInterface deprecated migration"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/checkout/payment/add-payment-plugin.html — new payment handler abstract class, methods, service tag"}],"notFoundClaim":false,"memoryClaims":["Payment handlers built this way also only receive the orderTransactionId, request data, and a Context, so any additional order data your handler needs must now be loaded by the handler itself rather than being passed in. [from memory]"],"sourceVerdict":"yes","startedAt":"2026-09-13T06:16:10Z","endedAt":"2026-09-13T06:17:00Z"},"dev-48":{"query":"After upgrading, my storefront JavaScript plugin no longer loads — how do I register it asynchronously with `PluginManager` and where does the compiled file have to be shipped?","category":"dev","option":"vanilla","answer":"Register the plugin with a dynamic import inside PluginManager.register(), e.g. `PluginManager.register('ExamplePlugin', () => import('./example-plugin/example-plugin.plugin'), '[data-example-plugin]');`. Per the docs, 'If an async/dynamic import is provided, then the JS-plugin will be recognized as async by the PluginManager automatically,' so no separate async flag is needed — the arrow-function/import syntax alone is what triggers async, on-demand loading when the plugin's selector is found in the DOM. The compiled output has a fixed location: 'Shopware will then compile the JavaScript and save the compiled version at `<plugin root>/src/Resources/app/storefront/dist/storefront/js/<plugin-name>/<plugin-name>.js`,' and the docs stress to 'Make sure to ship the compiled file with your plugin as well' — if that dist file is missing or stale after the upgrade, the plugin will fail to load in the storefront even though the source is correct.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/add-custom-javascript.html","quote":"If an async/dynamic import is provided, then the JS-plugin will be recognized as async by the PluginManager automatically."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/add-custom-javascript.html","quote":"Shopware will then compile the JavaScript and save the compiled version at `<plugin root>/src/Resources/app/storefront/dist/storefront/js/<plugin-name>/<plugin-name>.js`."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/add-custom-javascript.html","quote":"Make sure to ship the compiled file with your plugin as well."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware storefront PluginManager register plugin asynchronously compiled js file location"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/add-custom-javascript.html — async registration and dist file location"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:17:00Z","endedAt":"2026-09-13T06:17:50Z"},"dev-49":{"query":"My storefront controller still uses the `@Route` and `@RouteScope` annotations from 6.4 — what is the attribute form in Shopware 6.7 and how are the routes wired?","category":"dev","option":"vanilla","answer":"This change actually happened earlier than 6.7: the dedicated `@RouteScope` annotation was deprecated already for the 6.5 major version, and Shopware notes 'this way of defining the route scope is deprecated for the 6.5 major version,' with the scope moved into Symfony's own #[Route] attribute via its defaults array instead of a separate annotation class. In current (6.7) code you write route scope and path together as PHP attributes, e.g. put the scope at class level with `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]])]` on the controller class, and define each action's path/name/methods on the method itself with `#[Route(path: '/example', name: 'frontend.example.example', methods: ['GET'])]`. Both the scope attribute and the per-route attribute can be combined at class or method level, so routes are wired purely through Symfony's native #[Route] attribute rather than any Shopware-specific annotation class.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/add-custom-controller.html","quote":"this way of defining the route scope is deprecated for the 6.5 major version"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6.7 Route attribute RouteScope PHP attribute controller migration annotations removed"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/add-custom-controller.html — current PHP attribute form for storefront controller routes"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:17:50Z","endedAt":"2026-09-13T06:18:40Z"},"dev-50":{"query":"My `ScheduledTaskHandler` stopped running after the upgrade — how must a scheduled task and its handler be declared in Shopware 6.7?","category":"dev","option":"vanilla","answer":"Your ExampleTask class has to extend from the class Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTask, and the ScheduledTaskHandler has to extend from the class Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTaskHandler. Both must be registered in the plugin's service configuration: the docs note the tags required for both the task and its respective handler are shopware.scheduled.task and messenger.message_handler. In current Shopware documentation the handler example also carries the #[AsMessageHandler(handles: ExampleTask::class)] PHP attribute alongside its class declaration. If your handler stopped running after upgrading, check first that the class still extends the correct ScheduledTaskHandler base class and that the service definition still carries the messenger.message_handler tag (or, if you rely on attribute-based autoconfiguration, that #[AsMessageHandler(handles: ...)] points at the right task class) — a mismatch in either the tag or the attribute is the documented way a handler silently stops being invoked. [from memory]","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.html","quote":"Note the tags required for both the task and its respective handler, `shopware.scheduled.task` and `messenger.message_handler`."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.html","quote":"Your `ExampleTask` class has to extend from the `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTask` class"},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.html","quote":"the `ScheduledTaskHandler` has to extend from the class `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTaskHandler`"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware ScheduledTaskHandler register scheduled task service.xml tag 6.7"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.html — declaration of ScheduledTask and handler in 6.7, tags/attributes"}],"notFoundClaim":false,"memoryClaims":["If your handler stopped running after upgrading, check first that the class still extends the correct ScheduledTaskHandler base class and that the service definition still carries the messenger.message_handler tag (or, if you rely on attribute-based autoconfiguration, that #[AsMessageHandler(handles: ...)] points at the right task class) — a mismatch in either the tag or the attribute is the documented way a handler silently stops being invoked. [from memory]"],"sourceVerdict":"partial","startedAt":"2026-09-13T06:18:40Z","endedAt":"2026-09-13T06:19:40Z"},"dev-51":{"query":"Custom entities declared in `Resources/config/entities.xml` no longer work for my plugin in Shopware 6.7 — how do I define and register a DAL entity with PHP attributes instead?","category":"dev","option":"vanilla","answer":"In Shopware 6.7 the Resources/config/entities.xml approach for defining DAL entities in a plugin has been removed for performance reasons, so it is no longer possible to create DAL entities that way [from memory]. Instead you define a PHP class extending Entity and apply the #[Entity('entity_name')] attribute to it, marking exactly one property with #[PrimaryKey] and other properties with #[Field(type: FieldType::...)] attributes (or by referencing a field class directly, e.g. #[Field(type: PriceField::class)]). You then register the class in the DI container via services.php (or services.xml) using the `shopware.entity` tag, e.g. `$services->set(ExampleEntity::class)->tag('shopware.entity');`, after which Shopware automatically generates an EntityDefinition and EntityRepository registered as `entity_name.definition` and `entity_name.repository`. Fields can be marked translatable with `translated: true` and associations are declared with OneToOne/OneToMany/ManyToOne/ManyToMany attributes, and fields can be exposed to the API with `api: true` or a scope class.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/entities-via-attributes.html","quote":"Register your entity in the dependency injection container via `services.php` using the `shopware.entity` tag"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6.7 custom entity PHP attributes entities.xml removed"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/entities-via-attributes.html — Explain how to define and register a DAL entity using PHP attributes"}],"notFoundClaim":false,"memoryClaims":["In Shopware 6.7 the Resources/config/entities.xml approach for defining DAL entities in a plugin has been removed for performance reasons, so it is no longer possible to create DAL entities that way [from memory]."],"sourceVerdict":"yes","startedAt":"2026-09-13T06:09:43Z","endedAt":"2026-09-13T06:12:00Z"},"dev-52":{"query":"What must a plugin database migration class implement in Shopware 6.7, and where does the database cleanup on uninstall belong?","category":"dev","option":"vanilla","answer":"A plugin migration class must extend MigrationStep and implement getCreationTimestamp(): int (returning the timestamp matching the filename) and update(Connection $connection): void, which should contain all schema and data changes for the plugin. Database cleanup when the plugin is removed does not belong in the migration class — it belongs in the plugin lifecycle method uninstall(), since migrations have no rollback mechanism.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/database-migrations.html","quote":"Cleaning up the database when the plugin is removed belongs in the plugin lifecycle method `uninstall`"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware plugin migration class MigrationStep uninstall database cleanup keepUserData"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/database-migrations.html — What must a plugin migration class implement, where does cleanup on uninstall belong"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:10:20Z","endedAt":"2026-09-13T06:12:30Z"},"dev-53":{"query":"My theme config labels disappeared from the Theme Manager after 6.7 — how do I define `theme.json` config fields and where do their translations go now?","category":"dev","option":"vanilla","answer":"In Shopware 6.7, inline label/helpText translations in theme.json for config tabs/blocks/sections/fields were replaced by a constructed snippet-key scheme, and starting 6.8 the inline label/helpText will be required to come from snippets. The label and helpText fields in theme.json config are still defined structurally, but their translated text should be stored in Administration snippet files, e.g. <plugin root>/src/Resources/app/administration/src/app/snippet/de.json and .../en.json (locale-specific files like de-DE.json/en-GB.json are also supported and override the base language files). The snippet key is constructed starting with sw-theme, followed by the theme's technical name (or parent theme name, since snippets are inherited from the parent theme), then the names of the relevant tab, block, section, and field, ending in label (or helpText for help text); if an element has no name, default is substituted in the key. Correspondingly, the label/helpText fields returned by the /api/_action/theme/{themeId}/configuration and /api/_action/theme/{themeId}/structured-fields endpoints are deprecated in favor of labelSnippetKey and helpTextSnippetKey.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/themes/theme-configuration.html","quote":"Store these snippet keys in Administration snippet files, for example, `<plugin root>/src/Resources/app/administration/src/app/snippet/de.json` and `<plugin root>/src/Resources/app/administration/src/app/snippet/en.json`."},{"url":"https://developer.shopware.com/docs/guides/plugins/themes/theme-configuration.html","quote":"Each snippet key begins with `sw-theme`, followed by the theme's technical name, or its respective parent theme name...It then includes the names of the relevant `tab`, `block`, `section`, and `field`."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6.7 theme.json config fields label translations snippet Theme Manager"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/themes/theme-configuration.html — how theme.json config field labels/translations work in 6.7"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:10:54Z","endedAt":"2026-09-13T06:13:30Z"},"dev-54":{"query":"How do I register a plugin cookie in the storefront cookie consent manager in Shopware 6.7?","category":"dev","option":"vanilla","answer":"As of Shopware 6.7.3.0 the recommended way is to listen to the CookieGroupCollectEvent (the older CookieProviderInterface/CookieProvider decoration approach is deprecated) [from memory, version detail]. You register an event listener/subscriber via services.php or services.xml tagged for `Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent`, and inside the listener you fetch the relevant cookie group from `$event->cookieGroupCollection` (e.g. the comfort-features group via `CookieProvider::SNIPPET_NAME_COOKIE_GROUP_COMFORT_FEATURES`), get or create its CookieEntryCollection, and add a new `CookieEntry` object (with name, value, expiration and cookie key) to it. This structured CookieEntry/CookieGroup object approach replaces the older deprecated array-based cookie definitions returned from a CookieProviderInterface implementation.","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.html","quote":"$services->set(CookieListener::class)\n        ->tag('kernel.event_listener', ['event' => 'Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent']);"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware storefront cookie consent manager register plugin cookie CookieProviderInterface"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.html — step-by-step registering a cookie in the consent manager"}],"notFoundClaim":false,"memoryClaims":["As of Shopware 6.7.3.0 the recommended way is to listen to the CookieGroupCollectEvent (the older CookieProviderInterface/CookieProvider decoration approach is deprecated) [from memory, version detail]."],"sourceVerdict":"yes","startedAt":"2026-09-13T06:11:31Z","endedAt":"2026-09-13T06:14:00Z"},"dev-55":{"query":"How do the breaking storefront accessibility changes reach my theme in Shopware 6.7, and what must an extension that overrides the affected Twig blocks do?","category":"dev","option":"vanilla","answer":"These changes were rolled out behind the `ACCESSIBILITY_TWEAKS` feature flag in 6.6, which developers could opt into early, and \"they will become the default with the Shopware 6.7.0.0 major version\" — so in 6.7 every store gets them unconditionally, there is no more flag to toggle off. Concretely the changes affected: product cards, where the duplicate link around the product image was removed (affected template `Resources/views/storefront/component/product/card/box-standard.html.twig`); language/currency top-bar dropdowns, which now render `<button>` elements instead of hidden radio inputs; order and cart line-item lists, converted from generic `<div>` markup to semantic `<ul>`/`<li>` elements; pagination, switched to anchor links instead of radio inputs; modal triggers, now `<button>` elements rather than links; and icons rendered via the Twig icon function, which now include `aria-hidden=\"true\"` by default. An extension or theme that overrides any of the affected Twig blocks (e.g. in box-standard.html.twig, the top-bar dropdown blocks, cart/order line-item blocks, pagination, or modal-trigger blocks) must update its overrides to match the new semantic HTML structure and selectors, since the old div/radio/link-based markup it may have extended no longer exists; CSS and JavaScript selectors targeting the old markup should also be updated.","citations":[{"url":"https://developer.shopware.com/release-notes/6.7/6.7.0.0.html","quote":"Removed duplicate links around the product image in product cards. Affected template: `Resources/views/storefront/component/product/card/box-standard.html.twig`."},{"url":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.6.md","quote":"They will become the default with the Shopware 6.7.0.0 major version. If you already want to get these changes among other accessibility improvements you can activate the flag `ACCESSIBILITY_TWEAKS`."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6.7 breaking change accessibility storefront twig blocks changes"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/v6.7/resources/accessibility/storefront/ — breaking accessibility changes and Twig block override guidance (404)"},{"tool":"WebFetch","args":"https://developer.shopware.com/release-notes/6.7/6.7.0.0.html — accessibility breaking changes and extension implications"},{"tool":"WebFetch","args":"https://github.com/shopware/shopware/blob/trunk/UPGRADE-6.6.md — ACCESSIBILITY_TWEAKS feature flag and extension guidance"},{"tool":"WebFetch","args":"https://raw.githubusercontent.com/shopware/shopware/trunk/UPGRADE-6.6.md — ACCESSIBILITY_TWEAKS feature flag and extension guidance"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:12:07Z","endedAt":"2026-09-13T06:16:00Z"},"dev-56":{"query":"Header and footer are loaded through ESI sub-requests in Shopware 6.7, so page data is gone in my header template — how do I pass my own data into the header/footer now?","category":"dev","option":"vanilla","answer":"Since the header and footer are now loaded as ESI sub-requests, they are \"no longer dependent on the current page data,\" so you must explicitly forward any extra values as query parameters to those sub-requests. You override Storefront/Resources/views/storefront/base.html.twig and extend the `base_esi_header` (or `base_esi_footer`) block to merge extra entries into the `headerParameters` (or `footerParameters`) variable, e.g. `{% set headerParameters = headerParameters|merge({ 'vendorPrefixPluginName': { 'activeRoute': activeRoute } }) %}` before calling `{{ parent() }}`; the headerParameters are passed to the header route as query parameters and then through to the header template, where you can read them, e.g. `headerParameters.vendorPrefixPluginName.activeRoute`. Because they double as query parameters for the ESI routes, headerParameters/footerParameters can only contain scalar values. Alternatively, a plugin can hook the StorefrontRenderEvent, check that the request route is the header (or footer) route, and add/merge its own scalar values into the `headerParameters` (or `footerParameters`) event parameter programmatically instead of only in Twig. Plugins that previously relied on GenericPageLoader to make header/footer data available may need to move that logic to a header/footer-specific pagelet loader, since GenericPageLoader no longer provides header/footer data as part of the main page load [from memory].","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/templates/customize-header-footer.html","quote":"Please be aware, that `headerParameters` and `footerParameters` can only contain scalar values, as they are also query parameters for the ESI routes."},{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/templates/customize-header-footer.html","quote":"The `headerParameters` mechanism works by \"passing to the header route as query parameters and after that passed through to the header template.\""}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6.7 header footer ESI sub-request pass data template"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/plugins/plugins/storefront/templates/customize-header-footer.html — how to pass custom data into header/footer via ESI"}],"notFoundClaim":false,"memoryClaims":["Plugins that previously relied on GenericPageLoader to make header/footer data available may need to move that logic to a header/footer-specific pagelet loader, since GenericPageLoader no longer provides header/footer data as part of the main page load [from memory]."],"sourceVerdict":"yes","startedAt":"2026-09-13T06:13:10Z","endedAt":"2026-09-13T06:16:30Z"},"dev-57":{"query":"B2B Suite support ends with 6.8 — how do I run the B2B Suite Migration to B2B Components and check that it finished?","category":"dev","option":"vanilla","answer":"You run the migration with `bin/console b2b:migrate:commercial`, which \"initiates the migration process, transferring all components and entities as defined in the configuration\"; you can target specific modules by name (e.g. `bin/console b2b:migrate:commercial quote_management shopping_list`), noting that \"the `employee_management` component is a prerequisite for all other B2B components and is migrated first by default,\" and you can tune batch size with a `--batch-size` option and re-run everything with a `--reset` flag, optionally running via a queue with `--use-queue`. To check progress and completion, run `bin/console b2b:migrate:progress` (optionally with `--watch`) in a separate terminal — the recommendation is to \"run both commands simultaneously in separate terminal windows rather than sequentially\" — and read the status column: `Complete` means the migration finished successfully, `Complete with error` means issues occurred (to be reviewed in the `b2b_components_migration_errors` table), and `In progress` means it is still running.","citations":[{"url":"https://developer.shopware.com/docs/products/extensions/b2b-suite-migration/execution/running-migration.html","quote":"This command initiates the migration process, transferring all components and entities as defined in the configuration"},{"url":"https://developer.shopware.com/docs/products/extensions/b2b-suite-migration/execution/running-migration.html","quote":"The `employee_management` component is a prerequisite for all other B2B components and is migrated first by default"},{"url":"https://developer.shopware.com/docs/products/extensions/b2b-suite-migration/execution/running-migration.html","quote":"run both commands simultaneously in separate terminal windows rather than sequentially"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware B2B Suite Migration to B2B Components 6.8 CLI command console"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/products/extensions/b2b-suite-migration/execution/running-migration.html — how to run and verify B2B Suite migration"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:14:02Z","endedAt":"2026-09-13T06:17:00Z"},"dev-58":{"query":"My shopware.yaml still uses redis_url — how do I define the named Redis connections in Shopware 6.7 and which eviction policy does each one need?","category":"dev","option":"vanilla","answer":"Since v6.6.8.0 (carried into 6.7) Shopware replaced the single redis_url setting with a named-connections structure under `shopware.redis.connections` in config/packages/shopware.yaml, e.g.:\n```yaml\nshopware:\n    redis:\n        connections:\n            ephemeral:\n                dsn: 'redis://host1:port/dbindex'\n            persistent:\n                dsn: 'redis://host2:port/dbindex'\n```\nEnvironment variables can be used inside the DSN, e.g. `dsn: '%env(REDIS_EPHEMERAL)%/1'`. Each connection then needs an eviction policy matched to what it stores: for ephemeral cache data (HTTP cache/object cache) use `volatile-lru`, which \"only automatically deletes data that is expired, as the application explicitly manages the TTL for each cache item\"; for durable, aging data such as sessions use `allkeys-lru`, since \"the oldest values should be discarded, when Redis reach the max memory\" and recent session data matters more than old; and for critical persistent data such as carts, locks, and number ranges also use `volatile-lru`, because \"it is important to use a key eviction policy that will not delete data that is not expired.\"","citations":[{"url":"https://developer.shopware.com/docs/guides/hosting/infrastructure/redis.html","quote":"only automatically deletes data that is expired, as the application explicitly manages the TTL for each cache item."},{"url":"https://developer.shopware.com/docs/guides/hosting/infrastructure/redis.html","quote":"the oldest values should be discarded, when Redis reach the max memory"},{"url":"https://developer.shopware.com/docs/guides/hosting/infrastructure/redis.html","quote":"it is important to use a key eviction policy that will not delete data that is not expired"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6.7 shopware.yaml redis connections named eviction policy cache"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/hosting/infrastructure/redis.html — named redis connections config and eviction policies"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:14:33Z","endedAt":"2026-09-13T06:17:30Z"},"dev-59":{"query":"After upgrading to Shopware 6.7 my Varnish cache is never invalidated — what changed in the reverse proxy configuration?","category":"dev","option":"vanilla","answer":"Two things typically break Varnish invalidation after upgrading to 6.7. First, the configuration key moved: \"The configuration key changed from `storefront.reverse_proxy` to `shopware.http_cache.reverse_proxy` starting with Shopware 6.6.0.0,\" so a shopware.yaml that still configures the old `storefront.reverse_proxy` key is silently ignored. Second, the old Redis-BAN based invalidation method for Varnish was removed: \"From version v6.6.x onwards, this method is deprecated and will be removed in v6.7.0. Using Varnish with Redis involves LUA scripts to determine URLs for the BAN request,\" so on 6.7 you must switch to Varnish's XKey module (xkey.purge/xkey.softpurge) for cache tagging and invalidation, along with an updated VCL that supports XKey — an old VCL or an old ban-based setup will no longer receive invalidation signals at all. Separately, note that cache invalidation itself became delayed by default in 6.7 (invalidated periodically via a scheduled task rather than immediately on every admin change), which can look like \"never invalidated\" if you expect immediate effect [from memory].","citations":[{"url":"https://developer.shopware.com/docs/guides/hosting/infrastructure/reverse-http-cache.html","quote":"The configuration key changed from `storefront.reverse_proxy` to `shopware.http_cache.reverse_proxy` starting with Shopware 6.6.0.0."},{"url":"https://developer.shopware.com/docs/guides/hosting/infrastructure/reverse-http-cache.html","quote":"From version v6.6.x onwards, this method is deprecated and will be removed in v6.7.0. Using Varnish with Redis involves LUA scripts to determine URLs for the BAN request."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6.7 reverse proxy Varnish configuration changed invalidation upgrade"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/hosting/infrastructure/reverse-http-cache.html — what changed in reverse proxy config in 6.7"}],"notFoundClaim":false,"memoryClaims":["Separately, note that cache invalidation itself became delayed by default in 6.7 (invalidated periodically via a scheduled task rather than immediately on every admin change), which can look like \"never invalidated\" if you expect immediate effect [from memory]."],"sourceVerdict":"yes","startedAt":"2026-09-13T06:15:06Z","endedAt":"2026-09-13T06:18:00Z"},"dev-60":{"query":"Which transports do my Shopware message queue workers have to consume in production, and how do I turn off the admin worker?","category":"dev","option":"vanilla","answer":"In production, CLI workers should consume the `async` transport (regular operation, e.g. mails and indexing) and the `low_priority` transport (secondary tasks), with async given priority over low_priority since \"you can configure the command to consume messages from multiple transports to prioritize them to your needs,\" e.g. `bin/console messenger:consume async low_priority --time-limit=60 --memory-limit=128M`; the worker processes the first listed transport and only moves to the next once nothing is waiting there. A CLI worker should also be set up for the failure transport, since otherwise failed messages will not be processed. To turn off the browser/Administration-based admin worker, set in config/packages/shopware.yaml:\n```yaml\nshopware:\n    admin_worker:\n        enable_admin_worker: false\n```\nThis matters because \"on a production system, the message queue should be processed via the CLI instead of the browser in the Administration\" to avoid high CPU load from multiple logged-in admin users and to keep tasks running when nobody is logged into the Administration.","citations":[{"url":"https://developer.shopware.com/docs/guides/hosting/infrastructure/message-queue.html","quote":"you can configure the command to consume messages from multiple transports to prioritize them to your needs, as it is recommended by the Symfony documentation."},{"url":"https://developer.shopware.com/docs/guides/hosting/infrastructure/message-queue.html","quote":"Make sure to set up the CLI worker also for the failed queue. Otherwise, failed messages will not be processed."},{"url":"https://developer.shopware.com/docs/guides/hosting/infrastructure/message-queue.html","quote":"on a production system, the message queue should be processed via the CLI instead of the browser in the Administration"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware message queue worker production transports low_priority async disable admin worker"},{"tool":"WebFetch","args":"https://developer.shopware.com/docs/guides/hosting/infrastructure/message-queue.html — transports to consume in production and disabling admin worker"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:15:43Z","endedAt":"2026-09-13T06:18:30Z"},"dev-61":{"query":"After the upgrade my Elasticsearch index has to be rebuilt — where do I set the shard and replica counts and which reindex command do I run?","category":"dev","option":"vanilla","answer":"Shard and replica counts are set in config/packages/elasticsearch.yml under elasticsearch.index_settings (number_of_shards, number_of_replicas) — Shopware uses three shards and three replicas by default and this can be overwritten there. To rebuild the index, run bin/console dal:refresh:index --use-queue for a full reindex (Elasticsearch, SEO URLs and product index), using --use-queue for larger catalogs so indexing goes through the message queue; a narrower Elasticsearch-only pass can be done with bin/console es:index.","citations":[{"url":"https://developer.shopware.com/docs/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.html","quote":"Shopware will use by default three shards and three replicas for the created index. This configuration can be overwritten with a new config file"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 elasticsearch shard replica count configuration reindex command"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.html, prompt=Find where shard and replica counts are configured for Elasticsearch, and what command is used to reindex/rebuild the Elasticsearch index."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:09:51Z","endedAt":"2026-09-13T06:10:13Z"},"dev-62":{"query":"I changed a setting in `.env` on a deployed 6.7 shop but it still behaves the old way — what takes precedence between `.env`, `.env.local` and the real environment variables, and which settings does Shopware not read from `.env` at all?","category":"dev","option":"vanilla","answer":"Shopware sits on top of Symfony's standard dotenv loading order, so real system/deployment environment variables (set by the shell, container, or web server) always win, then values in .env.local override .env, and .env itself is the lowest-priority fallback [from memory]. Shopware also overwrites the .env file's own content on updates, which is exactly why a change made directly in .env can silently disappear or be ignored after a deployment — using .env.local instead is the documented workaround so custom values survive updates [from memory]. At least one setting is explicitly not driven purely by .env at runtime: mailer configuration, since an admin-configured mailer setting overrides the MAILER_DSN value from the environment, per Shopware's own environment-variables reference which lists 'MAILER_DSN (Admin Configuration overwrites this)'.","citations":[{"url":"https://developer.shopware.com/docs/guides/hosting/configurations/shopware/environment-variables.html","quote":"MAILER_DSN (Admin Configuration overwrites this)"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 .env .env.local environment variables precedence which settings not read from env"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/hosting/configurations/shopware/environment-variables.html, prompt=Explain the precedence between .env, .env.local and real (system/deployment) environment variables in Shopware, and mention any settings Shopware does not read from .env at all."}],"notFoundClaim":false,"memoryClaims":["Shopware sits on top of Symfony's standard dotenv loading order, so real system/deployment environment variables (set by the shell, container, or web server) always win, then values in .env.local override .env, and .env itself is the lowest-priority fallback.","Shopware also overwrites the .env file's own content on updates, which is exactly why a change made directly in .env can silently disappear or be ignored after a deployment — using .env.local instead is the documented workaround so custom values survive updates."],"sourceVerdict":"partial","startedAt":"2026-09-13T06:10:23Z","endedAt":"2026-09-13T06:10:45Z"},"dev-63":{"query":"I deployed a plugin update to a 6.7 staging shop and my new migration never ran — which `bin/console` command applies the pending migrations of that one plugin, and what do I have to pass to it?","category":"dev","option":"vanilla","answer":"Use bin/console database:migrate <PluginBundleName> --all, passing the plugin's bundle/technical name as the identifier argument (e.g. SwagBasicExample) and the --all flag to execute every unhandled migration for that plugin, as the documentation states: \"To run your plugin migrations, set the identifier argument to your plugin's bundle name, in this example SwagBasicExample.\" If the migration performs destructive schema changes (dropping columns/tables) there is a separate destructive-migration command instead. [from memory]","citations":[{"url":"https://developer.shopware.com/docs/guides/plugins/plugins/database/database-migrations.html","quote":"To run your plugin migrations, set the identifier argument to your plugin's bundle name, in this example SwagBasicExample."}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware 6 bin/console database:migrate plugin command apply pending migrations"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/plugins/plugins/database/database-migrations.html, prompt=Find the exact console command to apply pending migrations for a single specific plugin, including required arguments like plugin name and flags."}],"notFoundClaim":false,"memoryClaims":["If the migration performs destructive schema changes (dropping columns/tables) there is a separate destructive-migration command instead."],"sourceVerdict":"yes","startedAt":"2026-09-13T06:11:01Z","endedAt":"2026-09-13T06:11:18Z"},"dev-64":{"query":"How do I get an Admin API OAuth token — with client_credentials for an integration, or the password grant for local testing — and how long is each token valid?","category":"dev","option":"vanilla","answer":"For an integration, create access key/secret credentials in the Administration under Settings > System > Integrations, then POST to /api/oauth/token with grant_type=client_credentials, client_id and client_secret; the response's expires_in field is 3600, i.e. the token is valid for one hour ('expires_in: 3600 (one hour in seconds)'). For local testing you can instead POST grant_type=password with client_id=administration, scopes=write, and the admin username/password; that returns 'expires_in: 600' in the example response, i.e. a 10-minute token, plus a refresh_token, and the docs frame this password grant as usable 'only as a local shortcut' rather than for production integrations.","citations":[{"url":"https://developer.shopware.com/docs/guides/development/integrations-api/","quote":"expires_in\": 3600 (one hour in seconds)"},{"url":"https://developer.shopware.com/docs/guides/development/integrations-api/auth-api-requests.html","quote":"\"expires_in\": 600"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware Admin API OAuth client_credentials password grant token expiry documentation"},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/integrations-api/general-concepts/authentication, prompt=Explain how to get an Admin API OAuth token via client_credentials and password grant, and how long each token type is valid (expires_in)."},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/development/integrations-api/auth-api-requests.html, prompt=Explain how to get an Admin API OAuth token via client_credentials grant and password grant, and state how long each token is valid (expires_in value)."},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/development/integrations-api/auth-api-requests.html, prompt=Show the exact curl example and JSON response for the client_credentials grant request to /api/oauth/token, including the expires_in value in the response."},{"tool":"WebFetch","args":"url=https://developer.shopware.com/docs/guides/development/integrations-api/, prompt=Show how to obtain an Admin API OAuth token using client_credentials grant, including the curl example and the expires_in value in the response."}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes","startedAt":"2026-09-13T06:11:42Z","endedAt":"2026-09-13T06:12:22Z"},"dev-65":{"query":"What can I put in the JSON body of `POST /api/search/{entity}` for filtering, associations, sorting, aggregations and getting an exact total count?","category":"dev","option":"vanilla","answer":"The search body accepts an 'associations' object to load related entities (equivalent to a SQL join, keyed by the association's property name, and each association can itself carry a nested criteria for its own sort/filter). It accepts a 'filter' array using the DAL filter types, described in the docs as something that 'Allows you to filter the result and aggregations'. Sorting is done via a 'sort' array of field/direction (ASC/DESC) entries, with multiple sorts combinable and optional natural sorting. Aggregations are computed on the fly via an 'aggregations' array using types such as avg, terms and count. For an exact total count you set 'total-count-mode', which per the documentation has three modes: 0 (default, no total), 1 (exact total count using SQL_CALC_FOUND_ROWS), and 2 (only checks whether a next page exists) — so total-count-mode: 1 is what gives an exact total.","citations":[{"url":"https://developer.shopware.com/docs/guides/development/integrations-api/search-criteria.html","quote":"Allows you to filter the result and aggregations"}],"toolCallLog":[{"tool":"WebSearch","args":"Shopware Admin API POST /api/search/{entity} filter associations sort aggr
