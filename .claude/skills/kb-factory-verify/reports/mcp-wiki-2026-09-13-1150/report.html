 the file under test, named with the suffix .spec.js or .spec.ts. Plain services/isolated ES modules can be imported and tested directly, e.g. `import Sanitizer from 'src/core/helper/sanitizer.helper';` inside a describe/it block, without mocking. Administration components are registered globally via Shopware.Component.register('name', {...}) and turned into a real Vue component with Shopware.Component.build('name'), which resolves template inheritance/overrides — you can generate a test boilerplate for a component/service with `composer run admin:create:test` (paste the path when prompted), after installing JS dependencies with `composer run init:js`. Mount the built component with mount() or the preferred shallowMount() (which stubs child components) from @vue/test-utils, passing props, stubs, mocks and attachTo: document.body as needed. Useful preconfigured mocks/globals: global.activeAclRoles = ['product.editor'] for ACL, global.activeFeatureFlags = ['FEATURE_NEXT_12345'] for feature flags, and global.repositoryFactoryMock.responses.addResponse({ method, url, status, response }) to mock repository calls (set global.repositoryFactoryMock.showWarning = false to silence missing-mock warnings). Override global mocks like $tc, $device, $store, $router via mount's mocks option; supply missing directives via createLocalVue() and localVue.directive(...); provide missing injections either via mount's provide option or by registering a service globally with Shopware.Service.register('mediaService', {...}) in beforeAll. Run all tests with coverage using `composer run admin:unit`, or only changed-file tests in watch mode with `composer run admin:unit:watch`.", "citations": ["platform/dev/6.7/guides/development/testing/unit/jest-admin.md:1-57"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "jest", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/testing/unit/jest-admin.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-65": {"query": "What can I put in the JSON body of `POST /api/search/{entity}` for filtering, associations, sorting, aggregations and getting an exact total count?", "category": "dev", "option": "mcp-wiki", "answer": "The body is a DAL-style search criteria object. Key fields: `associations` — loads related data like a SQL join, accepts nested criteria (sort/filter/limit) per association. `includes` — restricts returned fields per type, keyed by each response type's `apiAlias` (e.g. `product`, `product_manufacturer`). `ids` — direct ID lookup. `filter` — filters results and aggregations (same filter types as the DAL); filtering a nested/association field (e.g. `transactions.stateMachineState.technicalName`) requires that association to already be present in `associations`. `post-filter` — like `filter` but does not affect aggregations. `query` — weighted search where each sub-query has a `score`, summed into `extensions.search._score`; do not combine with `term`. `term` — text search across fields flagged `SearchRanking` in the entity definition. `sort` — one or more `{field, order}` entries, with `naturalSorting: true` and a `type: \"count\"` sort (since 6.4.12.0) supported. `aggregations` — metrics (e.g. avg) or facet-style breakdowns, same aggregation types as the DAL. `grouping` — groups results by one or more fields (e.g. one product per manufacturer). `page` (1-indexed) and `limit` — pagination. For an exact total count, set `total-count-mode: 1`, which runs `SQL_CALC_FOUND_ROWS` for exact pagination (performance-intensive, so only use when needed); the default `0` returns no total for best performance, and `2` only tells you whether a next page exists (good for infinite scroll).", "citations": ["platform/dev/6.7/guides/development/integrations-api/search-criteria.md:1-65"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/integrations-api/search-criteria.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-63": {"query": "I deployed a plugin update to a 6.7 staging shop and my new migration never ran — which `bin/console` command applies the pending migrations of that one plugin, and what do I have to pass to it?", "category": "dev", "option": "mcp-wiki", "answer": "Run `./bin/console database:migrate <PluginName> --all` — pass the plugin's technical name (e.g. `SwagBasicExample`) and the `--all` flag to apply all of that plugin's pending migrations. Note that migrations normally run automatically as part of plugin install/update; if they didn't, check whether the plugin's update code called `$updateContext->setAutoMigrate(false)`, since that disables the automatic run and requires driving the `MigrationCollection` manually (e.g. via `$migrationCollection->migrateInPlace(<timestamp>)`) instead of relying on the default auto-migrate behavior. Also remember migrations never re-run once executed, and there is no rollback command.", "citations": ["platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md:1-77"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "plugin:update", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "database:migrate", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-02": {"query": "Shopware 6.7 removed the RSA JWT key files and `system:generate-jwt-secret` — what signs Admin API tokens now, and what do I have to do when upgrading?", "category": "gap", "option": "mcp-wiki", "answer": "Nothing relevant found. The corpus's JWT-related pages are all about unrelated features (`In-App Purchases`' JWKS-verified JWTs, `clientside-to-app-backend.md`'s HMAC-signed app-backend tokens, Digital Sales Rooms' Mercure hub JWT secrets, and `shopware-cli project generate-jwt`, which the wiki explicitly says is 'only required for Shopware versions before 6.5 — 6.5+ generates JWT secrets automatically'). None of the pages found mention a `system:generate-jwt-secret` console command, RSA key file removal, or a change to how Admin API OAuth tokens are signed in 6.7, and the generic `Upgrade Shopware` guide (composer/CLI upgrade steps) says nothing about JWT/OAuth signing changes either. I could not find material in this corpus that answers this question.", "citations": ["platform/dev/6.7/products/tools/cli/project-commands/helper-commands.md", "platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md:1-55"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "jwt", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "generate-jwt-secret", "path": "platform/dev/6.7", "mode": "content"}}, {"tool": "grep_docs", "args": {"pattern": "jwt", "path": "platform/dev/6.7", "mode": "content", "glob": "**/helper-commands.md"}}, {"tool": "grep_docs", "args": {"pattern": "upgrade|migration|breaking change", "path": "platform/dev/6.7", "mode": "files", "glob": "**/upgrade*/**"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7", "glob": "**/*upgrade*"}}, {"tool": "grep_docs", "args": {"pattern": "jwt", "path": "platform/dev/6.7/index.md", "mode": "content"}}, {"tool": "grep_docs", "args": {"pattern": "6.7.*breaking|upgrade guide|UPGRADE.md", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "edge-05": {"query": "How do I enable Shopware's built-in MCP server on a Shopware 6.6 shop?", "category": "edge", "option": "mcp-wiki", "answer": "You can't — the built-in MCP server does not exist on Shopware 6.6. The MCP Server intro page states it 'was introduced in 6.7.11.0 behind the MCP_SERVER feature flag, and 6.7.14.0 removes the flag and introduces progressive tool discovery,' and is 'experimental until Shopware 6.8.' A corpus-wide grep for MCP-server pages found the entire `mcp-server` documentation set only under `platform/dev/6.7/products/tools/mcp-server/` — there is no such directory or page under `platform/dev/6.6`. On a supported 6.7 shop (6.7.14.0+, or 6.7.11.0–6.7.13.x with `MCP_SERVER=1` set in `.env`), enabling it requires the `symfony/mcp-bundle` package, creating an integration via `bin/console integration:create \"My MCP Client\" --admin` (or a scoped ACL role in production) to get `SHOPWARE_ACCESS_KEY_ID`/`SHOPWARE_SECRET_ACCESS_KEY`, then pointing an MCP client at the shop's `/api/_mcp` (Admin API) or `/store-api/_mcp` (Store API) endpoint with the `sw-access-key`/`sw-secret-access-key` headers, and verifying with `bin/console debug:mcp`. None of this is available on 6.6.", "citations": ["platform/dev/6.7/products/tools/mcp-server/intro.md:1-46", "platform/dev/6.7/products/tools/mcp-server/getting-started.md:1-47"], "toolCallLog": [{"tool": "grep_docs", "args": "{ pattern: 'MCP', path: 'platform/dev/6.6', mode: 'files' }"}, {"tool": "grep_docs", "args": "{ pattern: 'MCP server', path: 'platform', mode: 'files' }"}, {"tool": "read_doc", "args": "{ path: 'platform/dev/6.7/products/tools/mcp-server/getting-started.md' }"}, {"tool": "read_doc", "args": "{ path: 'platform/dev/6.7/products/tools/mcp-server/intro.md' }"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "partial"}, "func-01": {"query": "How do I create a product with variants and configure its visibility per sales channel, and why might it not show up in the storefront?", "category": "func", "option": "mcp-wiki", "answer": "To create a product, fill the required fields before first save (Title, Product number, Tax rate, Price gross/net, Stock); after saving, additional tabs appear including Variants. To generate variants, use the Variant Generator to pick properties/options, define price surcharges, optionally exclude specific combinations under Value exclusion, then click Generate variants; the product list display mode can be set to 'Single main variant' or 'Fan out properties in product list' (source: platform/func/catalogues/products.md). Per sales channel default visibility for newly created products is configured in the First Run Wizard's 'Default values' step (reachable later via Settings > System > First Run Wizard), where each sales channel can be set to Visible (default), Hide in listings, or Hide in listings and search (source: platform/func/first-steps/first-run-wizard.md). If the Dynamic Access extension (Shopware Evolve plan) is installed, products and their variants can additionally be hidden via Rule Builder rules under Catalogues > Products > General tab > Visibility & structure section, and per-variant in the variant's own Visibility & structure section (a purple chain icon shows the setting is inherited from the main product until cancelled) — a product with no rule assigned is always visible, but selecting mutually exclusive rules can make a product never appear, and a whole product is only hidden once all its variants become unavailable due to rules (source: platform/func/extensions/dynamiccontent.md). A product may therefore fail to show up in the storefront because: it is not assigned/visible for that sales channel (default visibility set to Hide in listings/Hide in listings and search), a Dynamic Access rule (or a mutually-exclusive combination of rules) hides it or all its variants for the current customer group, or basic required data/pricing was never completed after the first save.", "citations": ["platform/func/catalogues/products.md:1-60", "platform/func/first-steps/first-run-wizard.md:1-56", "platform/func/extensions/dynamiccontent.md:1-37"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "variant", "path": "platform/func", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "visibility", "path": "platform/func", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/catalogues/products.md"}}, {"tool": "grep_docs", "args": {"pattern": "assign.*sales channel|sales channel.*visib|Visibility", "path": "platform/func", "regex": true, "mode": "content"}}, {"tool": "read_doc", "args": {"path": "platform/func/extensions/dynamiccontent.md"}}, {"tool": "read_doc", "args": {"path": "platform/func/first-steps/first-run-wizard.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-22": {"query": "How do I give my plugin a settings page the shop operator can fill in, and what field types are available?", "category": "dev", "option": "mcp-wiki", "answer": "Create `src/Resources/config/config.xml` in your plugin — it is rendered dynamically as an Administration configuration page under Extensions → My extensions → Plugins → Configure, without needing a custom Administration module. The file needs at least one `<card>` with a `<title>` and one or more `<input-field>` elements, each with a unique `<name>` (min 4 characters, matching `[a-zA-Z][a-zA-Z0-9]*`). Field `type` defaults to `text`; supported types are `text`, `textarea`, `text-editor`, `url`, `password`, `int`, `float`, `bool`, `checkbox`, `datetime`, `date`, `time`, `colorpicker`, `single-select`, and `multi-select`. Fields support common settings such as `label`/`placeholder`/`helpText`, `defaultValue`, `disabled`, `required`, `copyable` (text-like fields), `minLength`/`maxLength` (text/url/password), `min`/`max` (int/float), and `<options>` for single/multi-select. Card titles, labels, placeholders, and help text are translatable via the `lang` attribute. For more advanced UI you can instead use `<component name=\"componentName\">` with one of the supported component names: `sw-entity-single-select`, `sw-entity-multi-id-select`, `sw-media-field`, `sw-text-editor`, or `sw-snippet-field` (the latter edits snippet translations rather than storing a config value, available since 6.3.4.0). Mark a field `cache-relevant=\"true\"` if changing it should invalidate cached Storefront output — available since Shopware 6.7.12.0, and required from 6.8.0.0 onward since system config writes no longer invalidate caches by default. Source: https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md:1-80"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "plugin config", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "system config field types", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-01": {"query": "How do I configure Shopware 6's built-in GraphQL API for the Store API?", "category": "edge", "option": "mcp-wiki", "answer": "Nothing relevant was found, and the premise appears false: the wiki has no mention of GraphQL anywhere (a corpus-wide grep for 'GraphQL' across the whole platform layer, the synonyms directory, and the hubs directory returns zero hits). The Store API hub explicitly describes the Store API as Shopware's 'customer-facing HTTP/JSON interface' — a normalized JSON HTTP layer consumed by the Storefront, Composable Frontends, Shopware PWA and B2B/headless clients, authenticated via `sw-access-key`/`sw-context-token` headers, with a Swagger/Stoplight/OpenAPI-generated reference under `/store-api/_info/...` — there is no GraphQL endpoint or configuration described for it. Shopware 6's Store API and Admin API are both REST/JSON HTTP APIs, not GraphQL; there is no built-in GraphQL API to configure.", "citations": ["platform/hubs/store-api.md:1-83"], "toolCallLog": [{"tool": "grep_docs", "args": "{ pattern: 'GraphQL', path: 'platform', mode: 'files' }"}, {"tool": "grep_docs", "args": "{ pattern: 'GraphQL', path: 'platform/synonyms.md' }"}, {"tool": "list_docs", "args": "{ path: 'platform' }"}, {"tool": "grep_docs", "args": "{ pattern: 'GraphQL', path: 'platform/synonyms' }"}, {"tool": "grep_docs", "args": "{ pattern: 'Store API', path: 'platform/hubs', mode: 'files' }"}, {"tool": "read_doc", "args": "{ path: 'platform/hubs/store-api.md' }"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "dev-39": {"query": "How do I write end-to-end Cypress tests for my plugin against a Shopware 6.7 store?", "category": "dev", "option": "mcp-wiki", "answer": "Note first: in Shopware 6.7 this Cypress-based approach is documented as legacy — new projects are recommended to use Playwright instead; Cypress guidance is only relevant for maintaining an existing Cypress-based suite. If you still need it: prerequisites are a clean Shopware installation (no categories, products, or settings), initialized with `composer run init`, run in production mode with a theme assigned; install E2E dependencies with `npm install` in the plugin's E2E folder (e.g. src/Administration/Resources/app/administration/test/e2e). The test suite is built on the `@shopware-ag/e2e-testsuite-platform` package (plus cypress-select-tests, cypress-log-to-output, cypress-file-upload), which provides commands, helpers and test-data management. For a plugin, create the folder structure Resources/app/<environment>/test/e2e/cypress/{fixtures,integration,plugins,support}, run `npm init -y`, install @shopware-ag/e2e-testsuite-platform, then create e2e/cypress/plugins/index.js requiring @shopware-ag/e2e-testsuite-platform/cypress/plugins and e2e/cypress/support/index.js requiring @shopware-ag/e2e-testsuite-platform/cypress/support. On a platform/Docker setup, run `composer run e2e:setup` (outside the container, first-time prep), `composer run e2e:prepare` (inside the container if already clean), then `composer run e2e:open` (opens the interactive runner) or run headless via `composer e2e:cypress -- run --spec=\"cypress/e2e/administration/**/*.cy.js\"`. Write tests as *.spec.js files under integration/ using describe()/it() (Shopware convention favors it() over specify()), preferring beforeEach() cleanup over after()/afterEach() since a failed test can skip the latter. Create fixture test data through the REST API rather than the UI, using cy.createDefaultFixture(endpoint, data, jsonPath) or a custom service extending AdminFixtureService/FixturesService under cypress/support/service/. Avoid relying on UUID-based IDs as selectors since they change between installations, and place test files only in the recognized integration subfolders (catalogue, content, customer, general, media-marketing, order, rule-product-stream, settings) or CI will not pick them up.", "citations": ["platform/dev/6.7/guides/development/testing/legacy/cypress/_index.md:1-46"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "cypress", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/testing/legacy/cypress/_index.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-01": {"query": "How do I add my own Admin API endpoint under `/api/...` from a plugin — a controller with the api route scope and its ACL?", "category": "gap", "option": "mcp-wiki", "answer": "The wiki has no dedicated page for adding a custom `/api/...` (Admin API) controller from a plugin with an `api` route scope and backend ACL check. What it does cover is adjacent but different: (1) Store API routes (`platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md`), which use `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]` and live at `/store-api/...`, not `/api/...` — this page only mentions in passing that OpenAPI schema files for Admin API endpoints should go in an `AdminApi` folder, without documenting the Admin API controller itself; and (2) Storefront controllers (`platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md`), scoped with `StorefrontRouteScope::ID`, not the `api` scope. Separately, `platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md` documents Administration ACL (`addPrivilegeMappingEntry`, `acl.can()`, `Plugin::enrichPrivileges()`), but that page explicitly warns this only gates the Admin UI, not the API itself — it does not describe the `_acl` route-default mechanism used to protect a Symfony route registered under the `api` scope. Grepping the whole 6.7 developer tree for `ApiRouteScope`, `AdministrationRouteScope`, and `_acl` route defaults turned up nothing describing a plugin-authored `/api/...` controller. I could not find a page in this corpus that answers the specific question as asked.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md:35-49", "platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:25-39", "platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:1-72"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "route scope.*api|_routeScope|api-controller", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "add own controller|custom endpoint|admin api.*controller", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "acl", "path": "platform/dev/6.7/guides/plugins/plugins/framework", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/hubs/admin-api.md"}}, {"tool": "grep_docs", "args": {"pattern": "RouteScope", "path": "platform/dev/6.7", "mode": "content"}}, {"tool": "grep_docs", "args": {"pattern": "acl", "path": "platform/dev/6.7", "glob": "**/administration/**", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}}, {"tool": "grep_docs", "args": {"pattern": "_acl", "path": "platform/dev/6.7", "mode": "content"}}, {"tool": "grep_docs", "args": {"pattern": "'api'\\]|ApiRouteScope|AdministrationRouteScope|scope.*administration", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md", "offset": 25, "limit": 15}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md", "offset": 35, "limit": 15}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "partial"}, "edge-02": {"query": "How do I get the DI container with `Shopware()->Container()` and override the product listing Smarty template in Shopware 6?", "category": "edge", "option": "mcp-wiki", "answer": "This mixes up Shopware 5 with Shopware 6 — a corpus-wide grep for 'Smarty' and for the literal `Shopware()->Container()` call across the whole platform layer returns zero hits, and the Dependency Injection hub confirms why: in Shopware 6, PHP-side code (Core, Storefront, plugin backends, B2B Suite) gets services via Symfony's service container — configured in `services.xml` (6.6) or `services.xml`/`services.php` (6.7) with autowiring — obtained through constructor injection, not a global `Shopware()` helper function; the Administration frontend instead uses a BottleJS-based `Shopware.Service()` container. Templating in Shopware 6 is Twig, not Smarty — the Storefront uses Twig templates that plugins override/extend via Symfony's template inheritance and block system, not Smarty template overrides. `Shopware()->Container()` and Smarty template overrides were Shopware 5 (Shopware AG's LTS legacy platform) mechanisms; neither exists in Shopware 6, so there is no documented equivalent flow to give.", "citations": ["platform/hubs/dependency-injection.md:1-65"], "toolCallLog": [{"tool": "grep_docs", "args": "{ pattern: 'Smarty', path: 'platform', mode: 'files' }"}, {"tool": "grep_docs", "args": "{ pattern: 'Shopware\\\\(\\\\)->Container\\\\(\\\\)', path: 'platform', regex: true, mode: 'files' }"}, {"tool": "read_doc", "args": "{ path: 'platform/hubs/dependency-injection.md' }"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "dev-20": {"query": "How do I add my own condition to the Rule Builder from a plugin so shop owners can select it?", "category": "dev", "option": "mcp-wiki", "answer": "Create a rule class under `<plugin root>/src/Core/Rule` extending `Shopware\\Core\\Framework\\Rule\\Rule`, implementing `getName()` (a unique technical name), `match(RuleScope $scope): bool`, and `getConstraints(): array` (field => constraints); rule variables must be declared `protected`, not `private`, or they won't work. Register the class in `services.php` tagged `shopware.rule.definition`. If you want to skip building a custom Administration component, add `getConfig(): RuleConfig` returning e.g. `(new RuleConfig())->booleanField('isFirstMondayOfTheMonth')` and Shopware renders the generic `sw-condition-generic` component for it automatically. To make the rule appear as a selectable option in the Administration's Rule Builder, decorate the `ruleConditionDataProviderService` (`RuleConditionService`) and call `addCondition()`, naming the condition to match your rule's `getName()`, pointing it at an Administration component (e.g. `swag-first-monday`) with a `label`, `scopes`, and optionally a `group` (created via `upsertGroup()`); load this decorator from a `main.js` entry point under `<plugin root>/src/Resources/app/administration/src/`. If you built a custom component, extend `sw-condition-base` and override the `sw_condition_value_content` Twig block with your input control (e.g. `sw-single-select`). Since Shopware 6.5.0.0, you can also restrict where the rule may be assigned ('context awareness') via `ruleConditionService.getAwarenessConfigurationByAssignmentName()` and `addAwarenessConfiguration()` — otherwise a new condition may not be selectable everywhere (e.g. inside the promotion module). Never run database queries or other slow operations inside `match()`, since it directly affects storefront performance.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/rule/add-custom-rules.md:1-65"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/hubs/rule-builder.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/rule/add-custom-rules.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-46": {"query": "sw-button and sw-card are deprecated in Shopware 6.7 — how do I migrate my plugin's admin templates to the Meteor components, and is there a codemod that does it?", "category": "dev", "option": "mcp-wiki", "answer": "Yes, there is a codemod. With Shopware 6.7, several Administration components (like `sw-button`, `sw-card`) are being replaced with components from the Meteor Component Library, Shopware's official reusable component collection built on the Shopware Design System. Run the codemod tool to automatically replace old components with Meteor Components in a plugin under `custom/plugins`: `composer run admin:code-mods`, e.g. `composer run admin:code-mods -- --plugin-name example-plugin --fix -v 6.7`. The tool replaces compatible components automatically, adds guidance comments where manual migration is required, and fixes some other deprecated code. For cross-version compatibility, Shopware components gained a `deprecated` prop (default `false`, meaning the new Meteor Component is used by default); setting `deprecated: true` renders the old component instead, letting a plugin support both Shopware 6.6 and 6.7 from a single codebase without migrating immediately. Gotcha: the old components remain usable via the `deprecated` prop, but Shopware recommends migrating to Meteor Components as soon as possible to stay aligned with future development, and the wiki notes that timelines and specific implementation details for this migration are subject to change.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/meteor-components.md:1-43"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/administration/meteor-components.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-28": {"query": "How do I override an existing Storefront JavaScript plugin, such as the cookie permission bar, from my own plugin instead of registering a new one?", "category": "dev", "option": "mcp-wiki", "answer": "Extend the original plugin's class directly if it is importable, e.g. `import CookiePermissionPlugin from 'src/plugin/cookie/cookie-permission.plugin'; export default class MyCookiePermission extends CookiePermissionPlugin {}`. If the class cannot be imported (for example a third-party plugin without an alias), retrieve it at runtime via `PluginManager`: `const Plugin = window.PluginManager.getPlugin('CookiePermission'); const PluginClass = Plugin.get('class')`. Override the methods you need — for the cookie bar example, override `init()` to clear the cookie via `CookieStorage.setItem(this.options.cookieName, '')` before calling `super.init()`, and override `_hideCookieBar()` to add a `confirm()` dialog before calling `super._hideCookieBar()`. Register the override in `main.js` using `PluginManager.override()` instead of `register()`: `PluginManager.override('CookiePermission', MyCookiePermission, '[data-cookie-permission]')`. If the original plugin was registered asynchronously, the override's import must also be a dynamic import: `PluginManager.override('CookiePermission', () => import('./my-cookie-permission/my-cookie-permission.plugin'), '[data-cookie-permission]')`. Note that each JavaScript plugin can only be overridden once — if two Shopware plugins override the same plugin, only the last override actually takes effect. Source: https://developer.shopware.com/docs/guides/plugins/plugins/storefront/javascript/override-existing-javascript.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md:1-83"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "override.*plugin", "path": "platform/dev/6.7/guides/plugins/plugins/storefront", "mode": "files", "regex": true}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront", "depth": 2}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-05": {"query": "How do I set up a sales channel — storefront versus headless type, domains, languages and currencies — and where do I get its API access key?", "category": "func", "option": "mcp-wiki", "answer": "Create a sales channel via the plus icon next to 'Sales Channel' in the administration main menu, choosing between 'Sales Channel with HTML storefront', a headless sales channel (API only), or a product comparison export. In General settings you configure Name, favourite marking, entry point navigation (main, footer, service), navigation levels, default Customer group, Countries, Languages, and standard units of measurement. Payment and shipping are configured with Payment methods + default, Shipping methods + default, Currencies + default, and the Tax calculation method. For multi-language self-hosted shops, Domains lets you give each domain its own URL, Language, Currency, Snippet set, and unit system (cloud instances instead get an auto-generated URL and forward all traffic encrypted); Hreflang, once activated, lets you pick a default domain used as fallback for all languages to avoid duplicate-content classification across language versions. The API Access ID/key for the channel is generated under the sales channel's API access setting ('API access: generate an API Access ID for the channel'). Additional settings include Status (temporarily disable, enable maintenance mode, IP-whitelist — behind a proxy this requires setting TRUSTED_PROXIES in .env), a Products tab to assign/remove products/categories/dynamic product groups to the channel, a Theme tab, Analytics (Google Analytics 4 via Tracking ID), and an Agentic files tab (llms.txt, agents.md, ai-catalog.json). Gotchas: the preinstalled headless sales channel should never be deleted since extensions like the B2B Suite depend on it (hide it from the sidebar via favourites instead), deleting a sales channel is irrevocable, and enabling 'Bind customers to Sales Channel' can split the same email into separate customer accounts across channels even after the option is later disabled.", "citations": ["platform/func/settings/saleschannel.md:1-68"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "sales channel", "path": "platform/func", "glob": "**/*saleschannel*", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "access key|API access", "path": "platform/func", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/saleschannel.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-26": {"query": "How do I add a custom document type such as a pro-forma invoice in Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "In Shopware 6.7 the reworked Document System (v2) is available experimentally, behind the `DOCUMENT_GENERATION_REWORK` feature flag (it is expected to become the default with 6.8). To add a new document type such as a pro-forma invoice: 1) extend `Shopware\\Core\\Checkout\\DocumentV2\\Type\\AbstractDocumentType`, implementing `getTechnicalName(): string` and `getSupportedFormats(): array` (e.g. `['html', 'pdf']`); 2) create a render-data DTO extending `Shopware\\Core\\Checkout\\DocumentV2\\Struct\\AbstractRenderData` with public properties, which are flattened onto the template's `config` variable; 3) create a data provider extending `Shopware\\Core\\Checkout\\DocumentV2\\Provider\\AbstractDocumentDataProvider`, implementing `getKey()`, `supports(string $documentType): bool`, `enrichOrderCriteria(Criteria $criteria): void`, and `provideRenderingData(ProviderInput $input, Context $context): AbstractRenderData`; 4) register both services with the tags `shopware.document_v2.type` and `shopware.document_v2.provider`; 5) add a Twig template at `@Framework/documents/<technical_name>.html.twig` extending `@Framework/documents/base.html.twig` (plus an XML template under `.../zugferd/<technical_name>.xml.twig` if the `zugferd_xml` format is supported). Outside the code, a plugin migration must still create a `document_type` database row whose `technical_name` matches the type (the `document` table has a foreign key on it) and a number range of type `document_<technical_name>`, reusing the legacy migration pattern with the new technical name. Since this API is experimental it can still change before becoming the default in 6.8. Source: https://developer.shopware.com/docs/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/_index.md:1-32", "platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md:1-52"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "document type", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "pro-forma invoice", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/_index.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-50": {"query": "My `ScheduledTaskHandler` stopped running after the upgrade — how must a scheduled task and its handler be declared in Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "Both the task and its handler must be explicitly registered in the plugin's `services.php` — a common cause of a handler silently no longer running is a missing or wrong tag on one of them: `$services->set(ExampleTask::class)->tag('shopware.scheduled.task'); $services->set(ExampleTaskHandler::class)->args([service('scheduled_task.repository'), service('logger')])->tag('messenger.message_handler');`. The task class must extend `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTask` and implement `getTaskName()` (a vendor-prefixed technical name, e.g. `swag.example_task`) and `getDefaultInterval()` (in seconds). The handler must extend `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTaskHandler`, be annotated `#[AsMessageHandler(handles: ExampleTask::class)]`, and implement `run()`. The task and handler are separate runtime roles — the task describes when work is due (registered via the `shopware.scheduled.task` tag), while the handler is the Messenger consumer that executes `run()` (registered via `messenger.message_handler`); both must be wired even when generated together, so if only one tag survived an upgrade/refactor the task will stop running. Since Shopware 6.7.13.0, a handler can additionally implement `DynamicallyScheduledTaskHandler` with `getNextExecutionTime(ScheduledTask $task, ScheduledTaskEntity $taskEntity): ?\\DateTimeInterface`, called after `run()` finishes, to control the next run time from domain data instead of a fixed interval (returning `null` falls back to `nextExecutionTime + runInterval`, capped to now if in the past). To register and test without reinstalling the plugin: `bin/console scheduled-task:register`, `bin/console scheduled-task:run`, `bin/console messenger:consume`. Gotcha: the task's `status` must be `scheduled` in the `scheduled_task` table for `scheduled-task:run` to pick it up (unless using the admin worker) — worth checking directly if the task simply stopped firing after upgrade.", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md:1-70"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "ScheduledTaskHandler", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-68": {"query": "How does the registration handshake between Shopware and my app backend work — shop id, proof, shop secret and the confirmation call?", "category": "dev", "option": "mcp-wiki", "answer": "Registration is a GET request from Shopware to the URL declared in the manifest, carrying query parameters `shop-id`, `shop-url`, `timestamp`, and headers `shopware-app-signature` (HMAC-SHA256 of the query string, signed with the app's `app-secret`), `sw-version` (since 6.4.1.0), and — on re-registration — `shopware-shop-signature` (signed with the shop's current `shop-secret`): `$signature = hash_hmac('sha256', $queryString, $appSecret);`. On success the app backend responds with a `proof` (a SHA-256 HMAC of `shopId . shopUrl . appName`, using the `app-secret`), a freshly generated `shop-secret` (64–255 characters), and a `confirmation_url`, e.g. `{ \"proof\": \"...\", \"secret\": \"random secret string\", \"confirmation_url\": \"https://my.example.com/registration/confirm\" }`. On a failed setup precondition, respond `{\"error\": \"...\"}` instead. If the proof matches, Shopware then sends a POST to the `confirmation_url` with `apiKey`, `secretKey`, `timestamp`, `shopUrl`, `shopId` in the body, signed via the `shopware-shop-signature` header (HMAC-SHA256 of the body using `shop-secret`); the app backend uses the returned `apiKey`/`secretKey` as OAuth `client_id`/`client_secret` for further Admin API calls. On re-registration, a `shopware-shop-signature-previous` header (signed with the previous `shop-secret`) is also sent so the backend can detect secret rotation and should accept the old secret in parallel for a short grace period (e.g. 1 minute). Registration and confirmation requests time out after 5 seconds, and the `app-secret` must never be published — it stays with the Shopware Account.", "citations": ["platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md:1-96"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-21": {"query": "My plugin dispatches its own domain event — how do I make it show up as a trigger in the Flow Builder?", "category": "dev", "option": "mcp-wiki", "answer": "Implement one of the Flow \"Aware\" interfaces on your event, e.g. `Shopware\\Core\\Framework\\Event\\CustomerAware` together with `FlowEventAware` (the event class must also define an `EVENT_NAME` constant). Since Shopware 6.5.0.0 event data for Flow Builder is stored via a `StorableFlow` instead of `getAvailableData()`: each Aware interface has a matching `FlowStorer` in `Shopware\\Core\\Content\\Flow\\Dispatching\\Storer\\*` (e.g. `CustomerStorer`, `MailStorer`, `OrderStorer`, `UserStorer`) that copies the relevant data into the store. If your data has no existing Aware interface, define a new Aware interface plus a custom `FlowStorer` subclass implementing `store()` and `restore()`. Flow actions then read the data back via `$flow->getStore($key)` (Aware-sourced data) or `$flow->getData($key)` (original event/additional data). Finally, register the event as a Flow Builder trigger with a subscriber listening on `BusinessEventCollectorEvent::NAME` that calls `$businessEventCollector->define(ExampleEvent::class)` and adds it to the collection — give the subscriber a high priority (e.g. 1000) so it registers before other trigger subscribers. This custom-trigger functionality is available starting with Shopware 6.4.6.0, and the StorableFlow/FlowStorer model replaces getAvailableData() from 6.5.0.0 onward. Source: https://developer.shopware.com/docs/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md:1-68"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "flow builder trigger", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "custom flow event", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-25": {"query": "How do I add a `bin/console` command to my plugin for a maintenance task?", "category": "dev", "option": "mcp-wiki", "answer": "Add a custom Symfony Console command class in your plugin, e.g. `src/Command/ExampleCommand.php`, using the standard `#[AsCommand(name: 'swag:example', description: 'Example command')]` attribute and extending `Symfony\\Component\\Console\\Command\\Command`, implementing `execute(InputInterface $input, OutputInterface $output): int`. Then register it as a service in `src/Resources/config/services.php` tagged `console.command`, e.g. `$services->set(Swag\\BasicExample\\Command\\ExampleCommand::class)->tag('console.command');`. Commands registered this way are automatically available via `bin/console` — no further wiring is needed. Source: https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md:1-54"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "console command", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-09": {"query": "Why doesn't my payment method appear in the checkout — what has to be configured in the administration?", "category": "func", "option": "mcp-wiki", "answer": "Payment methods are managed under Settings > Commerce > Payment methods. Even a standard active method (cash on delivery, invoice, prepayment, direct debit) must also be assigned in the relevant sales channel to actually appear to customers there — payment methods are assigned per sales channel under that sales channel's General > Basic settings tab, where the available methods and the default method for new customers are selected. On the payment method itself, check: the Active toggle is on; the method has a valid Technical name (changing an existing method's technical name can make it inoperable); and the 'Availability rule' field — a Rule Builder rule controlling when the method is offered — is either left blank (unrestricted) or its conditions actually match the current cart/customer/context (e.g. sales channel, customer group, cart value). If the payment method is meant to be selectable as a later change after order completion, the 'Allow change of payment method after order completion' option must also be enabled. Separately, when creating an order in the administration, a payment method that doesn't appear in the options list should be checked for 'Allow as subsequent payment method' being enabled and for being assigned to the sales channel.", "citations": ["platform/func/settings/Paymentmethods.md:1-32", "platform/func/saas/payment.md:1-36"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "payment method", "path": "platform/func", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/Paymentmethods.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-08": {"query": "In a plugin service, what is the Shopware 6 equivalent of Doctrine's `findBy()` — how do I read products with filters, associations and sorting?", "category": "dev", "option": "mcp-wiki", "answer": "Shopware 6 has no ORM, only a thin Data Abstraction Layer (DAL); the equivalent of Doctrine's `findBy()` is building a `Shopware\\Core\\Framework\\DataAbstractionLayer\\Search\\Criteria` object and passing it to a repository's `search()` method. Inject the entity repository, named `entity_name.repository` (e.g. `product.repository`), via `services.php` using `service('product.repository')`. A basic unfiltered read is `$this->productRepository->search(new Criteria(), $context)`, which returns an `EntitySearchResult` (always a collection, even for a single-ID search — call `first()` to get the entity). Search by ID(s) with `new Criteria([$myId])`. To filter by field use `$criteria->addFilter(new EqualsFilter('name', 'Example name'))` (`Shopware\\Core\\Framework\\DataAbstractionLayer\\Search\\Filter\\EqualsFilter`); combine filters with `OrFilter`, `AndFilter`, `NandFilter`, etc. `addPostFilter()` instead of `addFilter()` applies a filter to the result but not to aggregations. For associations, use `$criteria->addAssociation('productReviews')`, chainable as `'productReviews.customer'`; you can filter an association via `$criteria->getAssociation('productReviews')->addFilter(...)` (does not restrict the parent entity) versus adding the association plus a filter directly on `'productReviews.points'` on the main criteria (does restrict the parent entity). Mapping entities (e.g. `ProductCategoryDefinition`, which only have primary keys) cannot be read with `search()` — use `searchIds()` instead. For aggregations, `$criteria->addAggregation(new AvgAggregation('avg-rating', 'productReviews.points'))`, then read the result via `$products->getAggregations()->get('avg-rating')`. For paging/sorting use `setLimit()`, `setOffset()`, and `addSorting(new FieldSorting('createdAt', FieldSorting::ASCENDING))`. For large datasets, use `RepositoryIterator($this->productRepository, $context, $criteria)` and call `->fetch()` in a loop until it returns `null` — this requires a deterministic sort (e.g. always including `id` as a secondary sort) to avoid entities being skipped or duplicated across batches, since it issues a new database request per iteration.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md:1-55"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-32": {"query": "How do I define a custom field set for products from my plugin so merchants can edit the values in the Administration?", "category": "dev", "option": "mcp-wiki", "answer": "Two ways exist to define the custom field set itself: declaratively, ship Resources/config/custom-fields.xml in the plugin (available since Shopware 6.7.13.0) — Shopware syncs the defined sets on install/update and removes them (without keeping user data) on uninstall, no CustomFieldsInstaller service needed; the XML format matches the one apps use in their manifest. Or imperatively, use the custom_field_set.repository service to create the set at runtime, e.g. $this->customFieldSetRepository->create([['name' => 'swag_example_set', 'global' => true, 'config' => ['label' => [...]], 'customFields' => [['name' => 'swag_example_size', 'type' => CustomFieldTypes::INT, 'includeInSearch' => true, 'config' => ['label' => [...], 'customFieldPosition' => 1]]]]], $context) — set 'global' to false to make the set deletable/editable in the Administration, and relate it to the product entity via the set's 'relations' (entityName 'product'). To actually let merchants edit the values in the Administration inside your own module, render the sw-custom-field-set-renderer component in your Twig template, passing :entity and :sets; in the component's index.js, add a customFieldSets data property, create the repository via this.repositoryFactory.create('custom_field_set'), build a Criteria filtered with Criteria.equals('relations.entityName', 'product') and sorted by config.customFieldPosition, then load the sets with this.customFieldSetRepository.search(criteria, Shopware.Context.api). Custom field names/set names should carry a vendor prefix (e.g. swag_) since they are global; by default custom fields are not searchable, so set includeInSearch to true if needed (search index rebuild required for existing fields).", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/custom-field/add-custom-field.md:1-90", "platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-custom-fields.md:1-48"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "custom field set", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/custom-field/add-custom-field.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-custom-fields.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-10": {"query": "How do I write an indexer that precomputes derived data for my custom entity on write, and how do I trigger a full reindex?", "category": "dev", "option": "mcp-wiki", "answer": "Data indexers optimize recurring, complex calculations (e.g. a product's `cheapest_price`) by computing them once whenever the entity is written via the DAL, instead of on every read. Before writing a new one, prefer subscribing to an existing indexer's dispatched event if the target entity already has one (`CustomerIndexer`, `CategoryIndexer`, `LandingPageIndexer`, `ProductIndexer`, `ProductStreamIndexer`, `PromotionIndexer`, `RuleIndexer`, `MediaIndexer`, `MediaFolderIndexer`, `MediaFolderConfigurationIndexer`, `SalesChannelIndexer`, `BreadcrumpIndexer`). To build a custom one, create a class extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Indexing\\EntityIndexer` and register it tagged `shopware.entity_indexer`, implementing: `getName(): string` (a unique indexer name — `EntityIndexerRegistry` uses it to route messages, so it must be unique), `iterate($offset): ?EntityIndexingMessage` (drives a full reindex), `update(EntityWrittenContainerEvent $event): ?EntityIndexingMessage` (reacts to DAL writes), and `handle(EntityIndexingMessage $message): void` (does the actual work). `iterate()` uses `IteratorFactory::createIterator($definition, $offset)` to page through IDs for a full index, and is triggered by `bin/console dal:refresh:index` or an Administration index rebuild — that command is how you trigger a full reindex. `update()` extracts changed primary keys via `$event->getPrimaryKeys(SomeDefinition::ENTITY_NAME)`. By default messages from `update()` are handled synchronously; pass `$forceQueue = true` to `EntityIndexingMessage`'s fourth constructor argument to process them asynchronously over the message queue instead. To manipulate data with the DAL from inside `handle()` without re-triggering the indexer, disable indexing on the context first: `$context->addState(EntityIndexerRegistry::DISABLE_INDEXING);`. To hook an existing indexer's dispatched event (e.g. `CustomerIndexerEvent`) instead of writing a new indexer, subscribe with `kernel.event_subscriber` and iterate `$event->getIds()`. Gotchas: writing data through the DAL inside `handle()` re-triggers `EntityWrittenContainerEvent`, which can cause the same indexer to run in an infinite loop — use the injected `Connection` directly instead, or disable indexing via `EntityIndexerRegistry::DISABLE_INDEXING` if the DAL must be used; and filter the entities/columns as much as possible in `update()` (e.g. only react to a changed firstname) to save performance.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-indexer.md:1-66"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-indexer.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-60": {"query": "Which transports do my Shopware message queue workers have to consume in production, and how do I turn off the admin worker?", "category": "dev", "option": "mcp-wiki", "answer": "By default Shopware stores messages in the database and works them off via the browser-driven 'admin worker' while a user is logged into the Administration — this is not recommended for production since it only runs while someone is logged in and can cause high CPU load with multiple concurrent admin users. Instead, run one or more CLI workers consuming the relevant transports, e.g.: `bin/console messenger:consume async --time-limit=60 --memory-limit=128M` and `bin/console messenger:consume async low_priority` (i.e. the `async` and `low_priority` transports). You must also set up a CLI worker for the failed-message queue, otherwise failed messages are never reprocessed — failed messages are retried automatically 3 times, then deleted, via the Doctrine-backed failed transport (`MESSENGER_TRANSPORT_FAILURE_DSN`). Once CLI workers are running, disable the admin worker in `config/packages/shopware.yaml`: \n```yaml\nshopware:\n    admin_worker:\n        enable_admin_worker: false\n```\nIf you still need the admin worker temporarily, it can be tuned instead with `enable_admin_worker: true`, `poll_interval: 30`, and `transports: [\"async\", \"low_priority\"]`. Note that cron jobs won't cap the maximum number of workers the way supervisor/systemd can, so overlapping long-running messages risk starting an unwanted number of workers — use a process manager for CLI workers in production. Source: https://developer.shopware.com/docs/guides/hosting/infrastructure/message-queue.html", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/message-queue.md:1-94"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "admin worker", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/infrastructure/message-queue.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-09": {"query": "Where do I configure Business Events so that a mail is sent when an order is placed in Shopware 6.7?", "category": "edge", "option": "mcp-wiki", "answer": "In Shopware 6.7, the legacy 'Business Events' screen under Settings > Shop still exists (mapping the technical event `checkout.order.placed` — labelled 'Order placed' — to an email template, optionally scoped by sales channel and Rule Builder rules), but it was superseded by the Flow Builder as of major release 6.4.8.0 and is now only actively used for the B2B-Suite. For a normal 6.7 shop the correct place to configure 'send a mail when an order is placed' is Settings > Automation > Flow Builder: create a flow with trigger `checkout.order.placed`, optionally add Rule Builder conditions, and add the 'Send mail' action (choosing Administrator, Customer, or custom recipients and the mail template).", "citations": ["platform/func/settings/Business-Events.md:1-42", "platform/func/settings/Flow-Builder.md:1-52"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "business event", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "mail template", "path": "platform/func", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/Business-Events.md"}}, {"tool": "grep_docs", "args": {"pattern": "checkout.order.placed", "path": "platform/func", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/hubs", "glob": "*flow*"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/Flow-Builder.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-70": {"query": "How do I implement a payment method in an app with `pay-url` and `finalize-url`, and what must the app server return in Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "Since 6.4.1.0, apps add payment methods via the manifest, exposing signed JSON endpoints for the payment stages (pay, finalize, validate, refund, recurring capture). The presence of `finalize-url` distinguishes an asynchronous payment method from a synchronous one; omitting `pay-url` leaves the transaction open with no app communication at all. The app server must be reachable from Shopware (e.g. via a tunneling service in development).\n\nSynchronous flow (only `pay-url` set): Shopware calls `pay-url` and expects a JSON response with a `status` (and optional `message` on failure), e.g. `{\"status\": \"authorize\", \"message\": \"optional failure reason\"}`.\n\nAsynchronous flow (both `pay-url` and `finalize-url` set): Shopware POSTs to the pay endpoint with `order`, `orderTransaction`, and a `returnUrl`; the app responds with a `redirectUrl` to send the customer to the payment provider. After the provider redirects the customer back, Shopware POSTs to `finalize-url` with `orderTransaction` and the provider's query parameters, and the app again responds with `status`/`message`.\n\nOptionally, prepared payments (6.4.9.0+) add a `validate` call (receiving `cart`, `requestData`, `salesChannelContext`) before the order is placed, and refunds (6.4.12.0+) add a `refund` call receiving `order` and `refund` (amount, capture, optional reason/positions), responding with a `status`.\n\nOn the App PHP SDK, resolve the shop, assemble the stage-specific context, and sign the response, e.g.:\n```php\n$shop = $shopResolver->resolveShop($serverRequest);\n$payment = $contextResolver->assemblePaymentPay($serverRequest, $shop);\nreturn $signer->signResponse(PaymentResponse::paid(), $shop);\n```\nThe Symfony Bundle instead type-hints action classes like `PaymentPayAction`/`PaymentFinalizeAction` as controller arguments and returns `PaymentResponse`/`RefundResponse` directly.\n\nGotcha: never change a payment method's manifest identifier after release (Shopware would create a new payment method instead of reusing it), and from 6.7.0.0 onward, the app server must respond with a payment state whenever it intends to change the transaction state.", "citations": ["platform/dev/6.7/guides/plugins/apps/checkout/payment.md:1-66"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "pay-url", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/checkout/payment.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-06": {"query": "Which triggers and actions does the Flow Builder offer, and how do I make it send a mail when an order is placed?", "category": "func", "option": "mcp-wiki", "answer": "The Flow Builder (Settings > Automation > Flow Builder) automates business processes by combining an event trigger, optional Rule Builder conditions, and one or more actions. Example trigger names include `checkout.order.placed`, `checkout.customer.register`, `state_enter.order.state.completed`, `state_leave.order_transaction.state.paid`, `newsletter.register`, and `mail.before.send`; `checkout.order.payment_method.changed` already sets order status to 'Open' automatically, so a flow must not also try to set it to 'Open'. Available actions (depending on the trigger) include: Assign account status, Assign affiliate and campaign code, Assign customer group, Generate a document, Send mail (recipients: Administrator, Customer, or custom addresses), Assign status (payment/shipping/order, with interdependent rules e.g. Refunded requires a prior Paid status), Stop flow (halts the whole flow including parallel branches), Set download access, Change custom field content, and Add Tag/Remove Tag. Delayed Actions (Shopware Beyond plan) let you delay an action by Hour/Day/Week/Month/custom format before it fires. Webhook Actions (Evolve plan + Shopware Commercial) add a Call URL action supporting GET/POST/PUT/PATCH/DELETE with parameters, headers, body and Basic Auth. Custom Trigger support (since 6.5.3.0) lets app-defined triggers participate in flows. Flows can be shared via Download/Upload (Rise plan, 6.4.19.0+), and a Flow templates library offers standard flows. To send a mail when an order is placed: create a new flow (Add Flow), fill General tab (Name, Description, Priority, Active), then in the Flow tab choose the trigger `checkout.order.placed`, optionally add Rule Builder conditions, and add the action 'Send mail' choosing the recipient (e.g. Customer, or Administrator to notify all admin-flagged users).", "citations": ["platform/func/settings/Flow-Builder.md:1-52"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/func/settings/Flow-Builder.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-08": {"query": "How do I set up a Nuxt project with Shopware Composable Frontends against my shop's Store API — endpoint, access token, and why do I get HTTP 412?", "category": "gap", "option": "mcp-wiki", "answer": "The corpus does not contain a getting-started guide for scaffolding a Nuxt/Composable Frontends project or an explanation of an HTTP 412 error against the Store API. What it does confirm: Composable Frontends is Shopware's reference headless frontend built on the Store API (`platform/dev/6.7/concepts/api/store-api.md`), and the Store API is reached at `/store-api/*` authenticated with the sales-channel `sw-access-key` header rather than OAuth (`platform/hubs/store-api.md`) — so the 'endpoint' is your shop's base URL plus `/store-api/`, and the 'access token' is a sales channel's access key (generated per sales channel in the Administration), not an Admin API OAuth token. Separately, `platform/dev/6.7/products/paas/shopware/composable-frontends/_index.md` documents deploying an already-built Composable Frontends/Nuxt app on Shopware PaaS Native (`kind: cfe` in `application.yaml`, Node 22/24/26, must listen on port 3000, health check at `/api/healthz`), but this is a deployment guide, not a local project-setup guide, and does not mention `npx`/`pnpm create` scaffolding steps. No page in this corpus mentions HTTP 412 at all — a common real-world cause (an invalid/missing `sw-access-key` or a sales-channel/domain mismatch causing Shopware to reject the request) is not documented here. [from memory: HTTP 412 Precondition Failed from the Store API is typically returned when the `sw-access-key` header is missing, invalid, or does not match an active sales channel domain for the request]", "citations": ["platform/dev/6.7/concepts/api/store-api.md:1-29", "platform/hubs/store-api.md:1-83", "platform/dev/6.7/products/paas/shopware/composable-frontends/_index.md:1-68"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "composable frontends|Shopware Frontends|Nuxt", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "412", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/products/paas/shopware/composable-frontends/_index.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/concepts/api/store-api.md"}}, {"tool": "grep_docs", "args": {"pattern": "sw-access-key|access.*key|Precondition", "path": "platform/hubs/store-api.md", "regex": true, "mode": "content"}}, {"tool": "grep_docs", "args": {"pattern": "nuxt|composable frontends", "path": "platform/func", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/hubs/store-api.md"}}], "notFoundClaim": false, "memoryClaims": ["HTTP 412 Precondition Failed from the Store API is typically returned when the `sw-access-key` header is missing, invalid, or does not match an active sales channel domain for the request"], "sourceVerdict": "partial"}, "dev-19": {"query": "I need to move long-running work in my plugin out of the request into the message queue — what does the handler class look like and how is it registered?", "category": "dev", "option": "mcp-wiki", "answer": "First define a message class implementing `Shopware\\Core\\Framework\\MessageQueue\\AsyncMessageInterface` (or `LowPriorityMessageInterface` for lower priority), e.g. `class SmsNotification implements AsyncMessageInterface { public function __construct(private string $content) {} ... }`, and dispatch it via an injected `Symfony\\Component\\Messenger\\MessageBusInterface` (bus id `messenger.default_bus`): `$this->bus->dispatch(new SmsNotification($message));`. Optional metadata (e.g. a delay) is added by dispatching a `Symfony\\Component\\Messenger\\Envelope` with a stamp such as `DelayStamp`. Then the handler class — e.g. placed at `<plugin root>/src/MessageQueue/Handler/SmsHandler.php` — is marked with the PHP attribute `#[AsMessageHandler]` and implements `__invoke(SmsNotification $message)` to do the actual processing; multiple handlers can exist for the same message. Handlers marked with `#[AsMessageHandler]` are automatically registered and tagged with the service tag `messenger.message_handler` — no manual services.php/xml registration is needed for the tag itself (though normal DI applies for any dependencies the handler's constructor needs). The `handle_messages` middleware is what dispatches an incoming message to its handler(s). A message can also be routed to a specific transport/queue (e.g. `low_priority`, available since Shopware 6.5.7.0) via `shopware.messenger.routing_overwrite` in `config/packages/shopware.yaml`, instead of implementing an interface.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md:1-84", "platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-handler.md:1-46"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/hubs/message-queue.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-handler.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-12": {"query": "I am on Shopware 6.6 — which file do I declare my plugin's service dependencies in, and how do I pass another service into the constructor?", "category": "dev", "option": "mcp-wiki", "answer": "On Shopware 6.6, plugin services and their dependencies are declared in `<plugin root>/src/Resources/config/services.xml`, which references the Symfony schema `http://symfony.com/schema/dic/services/services-1.0.xsd`. To pass another service into a service's constructor, add a `<service>` entry for your class with an `<argument type=\"service\" id=\"...\">` pointing at the fully-qualified id of the service to inject, for example: `<service id=\"Swag\\BasicExample\\Service\\ExampleService\"><argument type=\"service\" id=\"Shopware\\Core\\System\\SystemConfig\\SystemConfigService\"/><\/service>`. The target class then receives it as a typed constructor parameter and stores it on a property, e.g. `public function __construct(SystemConfigService $systemConfigService) { $this->systemConfigService = $systemConfigService; }`.", "citations": ["platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/dependency-injection.md:1-55"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/dependency-injection.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-07": {"query": "My plugin needs to store its own data in a new table — how do I define a custom DAL entity with its definition, entity and collection class so I get a repository for it?", "category": "dev", "option": "mcp-wiki", "answer": "First create the table via a plugin migration, prefixing the table name (e.g. `swag_example`). Then add an `EntityDefinition` implementing `getEntityName()` (returns the table name, which also doubles as the `<name>.repository` service id in the DI container) and `defineFields()`: e.g. `class ExampleDefinition extends EntityDefinition { public const ENTITY_NAME = 'swag_example'; public function getEntityName(): string { return self::ENTITY_NAME; } protected function defineFields(): FieldCollection { return new FieldCollection([ (new IdField('id', 'id'))->addFlags(new Required(), new PrimaryKey()), new StringField('name', 'name'), new StringField('description', 'description'), new BoolField('active', 'active') ]); } }` — `created_at`/`updated_at` columns don't need explicit fields. Register the definition with the `shopware.entity.definition` tag and an `entity` attribute matching the entity name: `$services->set(ExampleDefinition::class)->tag('shopware.entity.definition', ['entity' => 'swag_example']);`. Add a custom `Entity` class (extends `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity`, uses `EntityIdTrait`, with one protected property plus getter/setter per field) and wire it via the definition's `getEntityClass()` method. Add a custom `EntityCollection` (extends `EntityCollection`, overriding `getExpectedClass()`) and wire it via `getCollectionClass()`. Without these last two, generic `ArrayEntity`/`EntityCollection` instances are used instead of your typed classes. Once registered this way, the DAL automatically exposes a `<entity-name>.repository` service (e.g. `swag_example.repository`) that behaves like any core repository (supports `search`, `upsert`, `create`, `delete` with `Criteria`). Gotchas: entity class properties must be at least `protected` (never `readonly`) or the DAL cannot set values (this applies to any class extending the generic `Struct` class); a field's `storageName` is snake_case while its `propertyName` is lowerCamelCase; and `getEntityName()`'s return value must exactly match both the database table name and the repository service id.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md:1-71"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "custom.*entity.*definition|add-custom-complex-data", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-06": {"query": "How do I add a custom Flow Builder action?", "category": "dev", "option": "mcp-wiki", "answer": "Steps to add a custom Flow Builder action (illustrated with an example `action.create.tag`): (1) Define an `Aware` interface for the data your action needs, extending `Shopware\\Core\\Framework\\Event\\FlowEventAware` and marked `#[IsFlowEventAware]`, e.g. `#[IsFlowEventAware] interface TagAware extends FlowEventAware { public const TAG = 'tag'; public const TAG_ID = 'tagId'; public function getTag(); }`. (2) Implement the action by extending `Shopware\\Core\\Content\\Flow\\Dispatching\\Action\\FlowAction`, with a `getName()` returning a unique action key (e.g. `'action.create.tag'`), a `requirements()` method returning the Aware interfaces the action needs (e.g. `[TagAware::class]`), and a `handleFlow(StorableFlow $flow)` method that reads `$flow->getConfig()` for the admin-configured settings, `$flow->getStore($key)` for data provided by Aware interfaces, and `$flow->getData($key)` for data from the original event or additional data, then performs the business logic (e.g. creating a tag via a repository). (3) Register the action as a service tagged `flow.action` with `priority` and `key`, e.g. `$services->set(CreateTagAction::class)->args([service('tag.repository')])->tag('flow.action', ['priority' => 600, 'key' => 'action.create.tag']);` — this tag makes the action appear in the `/api/_info/flow-actions.json` response, and `priority` determines its order. (4) `requirements()` controls the action's scope: an empty array makes it available for every trigger, a list of Aware interfaces (e.g. `[OrderAware::class, CustomerAware::class]`) restricts it to matching events, or you can define a brand-new event implementing your own custom Aware interface and register it via a `BusinessEventCollectorSubscriber` listening on `BusinessEventCollectorEvent::NAME`. (5) In the Administration, define an action constant and a `GROUP` (e.g. `export const ACTION = Object.freeze({ CREATE_TAG: 'action.create.tag' }); export const GROUP = 'customer';`), add snippet labels, and override the `sw-flow-sequence-action` component to map the action name to a config modal (or directly to `onSaveActionSuccess` if no modal is needed); import the override and any new component into `main.js`. Gotchas: the action's group defaults to `general` if `GROUP` is not defined (existing groups include `general`, `tag`, `customer`, `order`); and a subscriber that adds a new trigger event to the trigger list must run with sufficiently high priority to register before other `BusinessEventCollectorEvent` subscribers, or awareness/actions may be missing.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-action.md:1-93"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "flow action", "path": "platform/hubs/flow-builder.md"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/flow"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-action.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-04": {"query": "After upgrading to 6.7 my plugin fatals on load because core class properties now have native PHP types — which properties must I retype in my subclasses?", "category": "gap", "option": "mcp-wiki", "answer": "Nothing relevant found. The upgrades-and-migrations index (`platform/dev/6.7/guides/upgrades-migrations/_index.md`) covers the general upgrade workflow and points to `RELEASE_INFO-6.7.md`/`UPGRADE-6.7.md` and per-layer breaking changes, but does not itself list which core class properties gained native PHP types in 6.7, nor which subclass properties a plugin author must retype. Grepping the 6.7 developer tree for 'native type', 'property types', and 'typed properties' returned only an unrelated DAL attributes page. I could not find a page in this corpus naming the specific typed-property breaking change described in the question.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/_index.md:1-53"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "native type|property types|typed propert", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "deprecat", "path": "platform/dev/6.7", "glob": "**/upgrades-migrations/**", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/_index.md"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "dev-36": {"query": "How do I register ACL privileges for my plugin's Administration module and check them in a component or template?", "category": "dev", "option": "mcp-wiki", "answer": "Admin privileges are identifiers made of a key and a role, joined by a dot (e.g. product.viewer). Register a privilege with the privilege service's addPrivilegeMappingEntry, conventionally from a <component>/acl/index.js imported by <component>/index.js so it runs before the roles detail page is visited: Shopware.Service('privileges').addPrivilegeMappingEntry({ category: 'permissions' /* or 'additional_permissions' */, parent: null, key: 'your_key', roles: { viewer: { privileges: ['entity_name:operation'], dependencies: [] }, editor: {...}, creator: {...}, deleter: {...} } }). Use 'permissions' with the standard CRUD roles viewer/editor/creator/deleter, or 'additional_permissions' with a custom role key for non-CRUD rights; you can reuse another mapping's privileges via Shopware.Service('privileges').getPrivileges('rule.viewer'). Add snippet translations at sw.privileges.${category}.${key}.label (and .${role_key} for additional_permissions). Protect a route, menu entry or settings item by adding privilege to its meta/config, e.g. meta: { privilege: 'your_key.your_role' }; protect a shortcut by giving it an object with an active() method instead of a plain key binding. To check a privilege in a component or template, inject the acl service and call acl.can('key.role'), e.g. this.acl.can('sales_channel.creator') in JS or v-if=\"acl.can('review.editor')\" in a template. To ship additional privileges onto existing roles from PHP, override Plugin::enrichPrivileges(), returning e.g. ['product.viewer' => ['my_custom_privilege:read']]. Note: ACL rules only gate visibility/behavior in the Administration UI, not the API itself (they can be bypassed by direct API calls), and granting a role's viewer privilege does not by itself grant access to the related module — module access must be granted separately.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:1-72"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "acl privilege", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-27": {"query": "In Shopware 6.7, how do I extend a St
