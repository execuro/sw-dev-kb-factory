sh:index --use-queue` to reindex the whole shop (Elasticsearch, SEO URLs, product index etc.) — always with `--use-queue`. Some systems additionally need `bin/console es:create:alias` afterward. Indexing is processed via the message queue, so make sure workers are running with `bin/console messenger:consume` (add `-vv` for output); failed messages land in `dead_messages` and retry later.", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md:1-74"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "shard", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "es:index", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-29": {"query": "How do I add my own data to an existing Storefront page or pagelet from a plugin without overriding the core controller?", "category": "dev", "option": "mcp-wiki", "answer": "Identify the page or pagelet to extend (e.g. `FooterPagelet`) and subscribe to its `...LoadedEvent` (e.g. `FooterPageletLoadedEvent`) via an event subscriber tagged `kernel.event_subscriber`. If an existing Store API route would return more data than needed, add a new, narrower Store API route for just the missing data (the guide's example uses `EntityRepository::aggregate()` with a `CountAggregation` and an `EqualsFilter('product.active', true)` rather than `search()`, since only a count is needed) — do not call the DAL directly from the subscriber. In the subscriber, call the route and attach the result to the page/pagelet with `$event->getPagelet()->addExtension('product_count', $response->getProductCount())` (or the equivalent for a full page). The data then becomes available in the Twig template under `extensions`, e.g. `{% if footer.extensions.product_count %}{{ footer.extensions.product_count.count }}{% endif %}`. Example subscriber: `class AddDataToPage implements EventSubscriberInterface { public static function getSubscribedEvents(): array { return [FooterPageletLoadedEvent::class => 'addActiveProductCount']; } ... }`. Source: https://developer.shopware.com/docs/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md:1-70"], "toolCallLog": [{"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront", "depth": 2}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-66": {"query": "Which request headers change Admin API behaviour for language, entity version, parent-child inheritance and skipping flow triggers during a bulk import?", "category": "dev", "option": "mcp-wiki", "answer": "`sw-language-id`: returns entities in the given language ID instead of the system language (e.g. `sw-language-id: be01bd336c204f20ab86eab45bbdbe45`). `sw-version-id`: tells the API which entity version to return (e.g. `sw-version-id: 0fa91ce3e96a4bc2be4bd9ce752c3425`). `sw-inheritance`: makes the API consider parent-child inheritance, e.g. for product variants (`sw-inheritance: 1`). `sw-skip-trigger-flow`: skips flow triggers (e.g. 'send email on customer creation') during bulk imports via the sync API (`sw-skip-trigger-flow: 1`).", "citations": ["platform/dev/6.7/guides/development/integrations-api/request-headers.md:1-37"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/integrations-api/request-headers.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-12": {"query": "A spec asks for customer-specific pricing and for a flow that calls an external URL when an order is placed — before I build either of them, does Shopware already ship them, and what has to be licensed or installed for them to exist in the shop?", "category": "func", "option": "mcp-wiki", "answer": "Both already exist in Shopware, but with different prerequisites. Customer Specific Pricing lets a shop offer individually calculated prices (list prices, graduated prices, or currency-dependent prices) per customer, typically synced in from an external system such as an ERP via a speed-optimised API, and the individual price is only shown in the storefront while that customer is logged in. It requires a Shopware Beyond plan and the Shopware Commercial extension; creating, reading, changing and deleting custom prices is only possible via the Admin API ('bulk edit custom prices' endpoint) — there is no dedicated Administration module and no storefront configuration entry, and variant inheritance does not apply (each variant needs its own priced entry). The order-triggered external call does not need to be custom-built either: Flow Builder already ships a webhook action that lets merchants forward data to third-party APIs whenever a specific trigger fires (e.g. a new order placed) — you create a flow in Flow Builder using the webhook action, and it notifies the receiving server that the event occurred or requests it to act on the data; the wiki page for this does not mention any extra license or plan requirement beyond having Flow Builder itself. (Sources: platform/func/extensions/customer-specific-pricing.md, https://docs.shopware.com/en/shopware-6-en/extensions/customer-specific-pricing; platform/func/features/webhook-actions-in-flow-builder.md, https://docs.shopware.com/en/shopware-6-en/features/webhook-actions-in-flow-builder)", "citations": ["platform/func/extensions/customer-specific-pricing.md:1-43", "platform/func/features/webhook-actions-in-flow-builder.md:1-36"], "toolCallLog": [{"tool": "grep_docs", "args": "{ pattern: 'integration', path: 'platform/func', mode: 'files' }"}, {"tool": "read_doc", "args": "{ path: 'platform/func/features/customer-specific-pricing.md' }"}, {"tool": "read_doc", "args": "{ path: 'platform/func/features/webhook-actions-in-flow-builder.md' }"}, {"tool": "read_doc", "args": "{ path: 'platform/func/extensions/customer-specific-pricing.md' }"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-13": {"query": "There is no event for what I need to change in a core Shopware service — how do I decorate or replace that service from my plugin?", "category": "dev", "option": "mcp-wiki", "answer": "Use service decoration, the second of the two main extension mechanisms alongside events (prefer decoration when the existing service's behavior itself must change, not just react to it). Decoratable Shopware services expose an abstract class as their contract (e.g. `AbstractExampleService` with an abstract `getDecorated(): AbstractExampleService` method) rather than a plain interface, so new methods can be added later without breaking decorators. In your plugin's `services.php`, register the decorator against the original service id using `decorate()` and pass the original instance through the special `.inner` reference: `$services->set(ExampleServiceDecorator::class)->decorate(ExampleService::class)->args([service('.inner')]);`. Your decorator class should implement `getDecorated()` returning the wrapped instance and typically delegate to it from overridden methods, e.g. `return $this->decoratedService->doSomething() . ' Did something additionally.';`. Important gotchas: decorators nest (plugin A decorates core, plugin B decorates A, forming a chain), so a decorator that doesn't call the inner service silently breaks the rest of the chain, with no runtime warning — inspect the chain with `bin/console debug:container --show-arguments <service-id>`. Always type-hint the abstract class (never the concrete class) in constructors, since type-hinting the concrete class removes the service from the decoration chain. If a purpose-built extension point already exists (subscribed to via `.pre`/`.post`/`.error` events), prefer that over decoration since it allows multiple extensions to coexist without forming a chain.", "citations": ["platform/dev/6.7/guides/plugins/plugins/services/adjusting-service.md:1-74"], "toolCallLog": [{"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/services"}}, {"tool": "grep_docs", "args": {"pattern": "decorat", "path": "platform/dev/6.7/guides/plugins/plugins/services", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/services/adjusting-service.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-07": {"query": "How do I import products from a CSV with an import/export profile — column mapping, matching identifiers and a dry run?", "category": "func", "option": "mcp-wiki", "answer": "Use the Import/Export module under Settings > Automation > Import/Export. File requirements: UTF-8 character set, semicolon field separator, quotation-mark string separator, and prices must use a dot as decimal separator (e.g. `5.00`, not `5,00`). On the Import tab: Upload CSV file, Select profile, Start import, or Start dry run to validate without writing any data; Import activity shows the last 30 days with a per-row context menu to re-download source/erroneous CSVs. Import can only add data, never remove it (e.g. it will not clear an existing sales channel assignment). Under the Profiles tab you manage standard or user-created profiles; when creating a new profile you must select the default system language or import/export is not possible, then set Profile name, Usage (import/export/both), Object type (e.g. Product, Customer), Separator/Enclosure characters, and Import settings (Create new records / Update existing data). Column mapping happens under Mappings: Add new mapping, then map each CSV column name to a database entry, with Required flag, Default Value, Position, and Delete. For product import, select the 'Default product' profile and leave 'Import product variants' unchecked for plain products; mandatory product fields are `id`, `taxId`, `productNumber`, `stock`, `name` (example CSV columns also include `parent_id`, `active`, `price_net`, `price_gross`, `tax_rate`, `cover_media_id`, `manufacturer_id`, `categories`, `sales_channels`). To match import rows to existing entities via an alternate identifier instead of the UUID (e.g. `productNumber`), configure a 'Second Unique Identifier' on the profile's Advanced Settings tab — note a non-unique identifier value means only the first matching record gets resolved. For variant import specifically, a 4-step process is used: 1) import products with `id`/`parent_id` empty via the default product profile, 2) import properties with `group_id` empty via the default properties profile, 3) link products and properties via `option_id`/`product_id` using the default variant configuration settings profile, 4) import variants via the Default product profile with 'import product variants' enabled (mandatory: `parent_id`, `product_number`, `active`, `stock`, pipe-separated `optionIds`) or generate them from the product's own 'generate variants' tab.", "citations": ["platform/func/shopware-en/settings/importexport.md:1-79"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/func/shopware-en/settings/importexport.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-44": {"query": "After the Vue 3 upgrade my admin plugin broke — this.$parent resolves to the wrong component and a prop default that calls this.$tc throws. What do I have to change?", "category": "dev", "option": "mcp-wiki", "answer": "Both symptoms are documented, known Vue 2→3 migration pitfalls in the Administration (Vue 3 has been used since Shopware 6.6). For `this.$parent`: it is unreliable in Vue 3 because Vue wraps async components, so the resolved parent is sometimes not the component you expect — you sometimes need `this.$parent.$parent`, but the recommended fix is to stop relying on `$parent` at all and use services or event communication instead. For the prop default calling `this.$tc`: prop default functions in Vue 3 no longer have access to `this`, so `this.$tc` inside a prop default throws; replace it with `Shopware.Snippet.tc(...)`, which does not depend on component instance context. More generally, the guide recommends searching your plugin code for any `this.$` usage (an indicator of Vue's internal API) since most such calls break under Vue 3, with `this.$tc` being a specific case to swap for `Shopware.Snippet.tc`. Other related pitfalls called out on the same page: `@hook:mounted` and similar lifecycle hooks can fire multiple times for async components (once for the `AsyncComponentWrapper`, once for the underlying component); checking `this.$slots` for a slot name is no longer sufficient — you must verify it contains an actual v-node; Vuex stores lose reactivity if a getter mutates state; form fields no longer keep the previous DOM id used by tests (add a unique `name` attribute); and mutating props now throws hard errors instead of being silently allowed. Practical workflow: align plugin npm dependencies with the Administration's `package.json`, replace `sw-field` usages with their dedicated replacements, check `v-model`/event-listener/slot-syntax/`router-view`-transition/`key`-attribute/filter usage against the official Vue 3 migration guide, test with `composer run watch:admin`, and optionally enable the Vue 3 ESLint rule set. Note a single plugin version cannot support both Shopware 6.5 and 6.6+ — a new Store version is required (e.g. `1.x` for 6.5.x, `2.0` for 6.6+).", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/vue3.md:1-48"], "toolCallLog": [{"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/administration"}}, {"tool": "grep_docs", "args": {"pattern": "\\$parent", "path": "platform/dev/6.7", "mode": "files"}, "note": "call errored (rate-limited), no result used"}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/administration/vue3.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-04": {"query": "What does the Shopware Migration Assistant transfer automatically from Shopware 5, and what has to be mapped by hand before the migration starts?", "category": "func", "option": "mcp-wiki", "answer": "The Migration Assistant automatically transfers selectable data groups, of which 'Basic data' is mandatory: Basic data (categories, customer groups, currencies, sales channels, number ranges); Products (products, properties, product options, product properties, translations, cross-selling, main variant relations); Customers & orders (customers, shipping methods, orders, order documents); Promotions (customers, promotions); SEO URLs (products, properties, product options, product properties, translations, cross-selling, main variant relations, SEO URLs); and Product reviews (products, properties, product options, product properties, translations, cross-selling, main variant relations, customers, reviews, media). Before the migration starts, the following must be manually mapped by creating the equivalent entities in Shopware 6 first: payment methods, the standard payment method, salutation, delivery time, and the standard delivery time — these fields cannot be re-mapped after the migration has been executed, even after a reset; remapping requires deleting and recreating the migration entirely. Note that although 'shipping methods' appears in the automatically migrated Customers & orders group, shipping and payment methods still are not functionally transferred because both now rely on the Rule Builder (shipping cost rules and payment risk management) in Shopware 6, so they need to be recreated under Settings > Commerce > Shipping / Settings > Commerce > Payment methods after migration. Other areas needing manual post-migration rework include countries (check under Settings > Localisation > Countries), document templates (redesigned, reconfigure under Settings > Commerce > Documents), email templates (now Twig-based, cannot reuse Shopware 5 templates, manage under Settings > Content > Email templates), Shopping Worlds/shop pages (become Shopping Experiences and must be recreated under Content > Shopping Experiences), storefront templates (cannot be reused due to the redesigned architecture), and the B2B Suite (cannot be transferred at all).", "citations": ["platform/func/migration-en/what-is-migrated.md:1-64"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/func/migration-en/what-is-migrated.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-18": {"query": "My plugin's cart processor adds a surcharge line item, but it is added again on every recalculation and its price is stale after the customer changes the quantity — how do I split the work between the collector and the processor?", "category": "dev", "option": "mcp-wiki", "answer": "Shopware separates cart extension into two building blocks that should not both live in the same undifferentiated place: a collector, which fetches additional data (e.g. querying the database or an API), and a processor, which applies changes to the cart using that data. A collector implements `Shopware\\Core\\Checkout\\Cart\\CartDataCollectorInterface::collect(CartDataCollection $data, Cart $original, SalesChannelContext $context, CartBehavior $behavior)` and stores fetched values via `$data->set('uniqueKey', $newData)` — this is where any DB/API lookups belong. A processor implements `Shopware\\Core\\Checkout\\Cart\\CartProcessorInterface::process(CartDataCollection $data, Cart $original, Cart $toCalculate, SalesChannelContext $context, CartBehavior $behavior)`; all mutations must be applied to `$toCalculate` (the cart actually used), never `$original`. Register the collector under tag `shopware.cart.collector` and the processor under `shopware.cart.processor`. The documentation's core gotcha is explicit: do not query data inside `process`, since it may run many times (once per recalculation, e.g. on every quantity change) — always fetch/compute in `collect` instead, so the processor only reads already-fetched data and rebuilds/reapplies the surcharge line item and its price definition consistently from that data on each run, rather than appending a new line item or using a stale value. For a discount/surcharge line item specifically, the related cart-discounts guide adds a `PercentagePriceDefinition` (or equivalent price definition) to the line item so the cart can always recalculate its price, and marks it `setStackable(false)`/`setRemovable(false)` so it is not duplicated. [from memory: applying the general pattern — check for an existing surcharge line item by id/key inside `process` and update it in place rather than adding a new one each run — is the standard fix for the duplication symptom, though the read pages describe the collector/processor split and price-definition mechanics but do not spell out that specific duplicate-avoidance check.]", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md:1-44", "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-discounts.md:1-54"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-discounts.md"}}, {"tool": "grep_docs", "args": {"pattern": "CartDataCollectorInterface", "path": "platform/dev/6.7/guides/plugins/plugins/checkout/cart", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/cart"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md"}}], "notFoundClaim": false, "memoryClaims": ["applying the general pattern — check for an existing surcharge line item by id/key inside `process` and update it in place rather than adding a new one each run — is the standard fix for the duplication symptom, though the read pages describe the collector/processor split and price-definition mechanics but do not spell out that specific duplicate-avoidance check."], "notFoundClaimNote": "partial: general mechanism found, exact duplicate-avoidance code not found", "sourceVerdict": "partial"}, "dev-48": {"query": "After upgrading, my storefront JavaScript plugin no longer loads — how do I register it asynchronously with `PluginManager` and where does the compiled file have to be shipped?", "category": "dev", "option": "mcp-wiki", "answer": "A Storefront JavaScript plugin is a vanilla ES6 class extending `PluginBaseClass`, placed at `<plugin root>/src/Resources/app/storefront/src/<plugin-dir>/example-plugin.plugin.js` with an `init()` method that runs on `DOMContentLoaded`. Register it in `main.js` (auto-loaded from `<plugin root>/src/Resources/app/storefront/src`). Normal (synchronous) registration: `import ExamplePlugin from './example-plugin/example-plugin.plugin'; const PluginManager = window.PluginManager; PluginManager.register('ExamplePlugin', ExamplePlugin);` — optionally bound to a DOM selector as a third argument, e.g. `PluginManager.register('ExamplePlugin', ExamplePlugin, '[data-example-plugin]');`, so only matching elements trigger it (accessible as `this.el`). To register asynchronously, use a dynamic import instead of a top-level import: `PluginManager.register('ExamplePlugin', () => import('./example-plugin/example-plugin.plugin'), '[data-example-plugin]');`. An async-registered plugin is excluded from the main `storefront.js` bundle and is downloaded on demand only when its selector is present on the page — synchronously imported plugins are always bundled into `storefront.js` on every page, which is the likely reason yours 'no longer loads' if it was moved to async registration but the selector element is missing, or vice versa if it's still expected to load unconditionally. After changes, rebuild the Storefront with `shopware-cli project storefront-build` (template setups) or `composer run build:js:storefront` (platform contribution setups). The compiled output must be written to and shipped with the plugin at `<plugin root>/src/Resources/app/storefront/dist/storefront/js/<plugin-name>/<plugin-name>.js`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md:1-80"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "PluginManager.register", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-58": {"query": "My shopware.yaml still uses redis_url — how do I define the named Redis connections in Shopware 6.7 and which eviction policy does each one need?", "category": "dev", "option": "mcp-wiki", "answer": "Since Shopware 6.6.8.0, named Redis connections are configured under `shopware.redis.connections` in `shopware.yaml` instead of a single `redis_url`: \n```yaml\nshopware:\n    redis:\n        connections:\n            ephemeral:\n                dsn: 'redis://host1:port/dbindex'\n            persistent:\n                dsn: 'redis://host2:port/dbindex'\n```\nEnv vars can be used in the DSN, e.g. `dsn: '%env(REDIS_EPHEMERAL)%/1'`, and connection pooling can be enabled by appending the `persistent=1` DSN flag, e.g. `dsn: 'redis://host:port/dbindex?persistent=1'`. Shopware recommends a separate Redis instance/connection per data category, because current Redis versions cannot apply different eviction policies to different databases within the same instance. The three categories and their recommended eviction policy are: 1) Ephemeral data (HTTP cache, object cache) — `volatile-lru`, no persistence needed; 2) Durable but aging data (sessions) — `allkeys-lru`, persisted via RDB/AOF; 3) Durable and critical data (cart, number range, lock store, increment) — `volatile-lru`. One gotcha: a cache Redis hitting its memory limit is normal for `volatile-lru`, but it can only evict keys that have a TTL — Symfony's tag-aware cache adapter stores tag-index sets without a TTL, which can accumulate as orphaned entries and starve eviction if never pruned. Source: https://developer.shopware.com/docs/guides/hosting/infrastructure/redis.html", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/redis.md:1-71"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "redis_url", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/hubs", "glob": "*redis*"}}, {"tool": "read_doc", "args": {"path": "platform/hubs/redis.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/infrastructure/redis.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-41": {"query": "`composer update` to Shopware 6.7 aborts on a platform requirement and my admin build then fails too — which PHP, database and Node versions does 6.7 actually require, and how do I check the machine I am on against them before I retry?", "category": "dev", "option": "mcp-wiki", "answer": "Shopware 6.7's recommended production/dev stack (minimum → recommended) is: PHP `8.2+` → `8.4`, with `memory_limit >= 512M`, `max_execution_time >= 30s`, and required extensions `ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, openssl, pcre, pdo_mysql, phar, simplexml, xml, xmlreader, zip, zlib` (optional: `amqp`); Composer `2.2+` is recommended. Database: MariaDB `>= 10.11.6` or MySQL `>= 8.0.22` (Innovation releases unsupported) → MariaDB `11.4` / MySQL `8.4`, with `max_allowed_packet >= 32M`. Node.js/npm: `Node 20.0.0+` → `Node 24 / npm 10` — this is what the admin/storefront build (webpack/vite) needs, so a Node version below 20 is a likely cause of the admin build failure. To check your machine against these before retrying, the docs recommend running: `php -v`, `php -m` (to check loaded extensions, e.g. `php -m | grep intl` if using Homebrew PHP on macOS, which needs `intl` installed separately via `brew install php-intl`), `php -i | grep memory_limit`, `composer -V`, `node -v`, and `npm -v`. A gotcha noted: multiple PHP versions may be installed on one system, and CLI vs FPM often read different `php.ini` files, so make sure the binary/ini actually used matches what you checked. Separately, base workstation requirements (not stack-specific) are: quad-core CPU or higher recommended, 8 GB RAM minimum (16 GB recommended especially for Docker), ~10 GB free disk space, and a Unix-based OS (macOS 13+, 64-bit Linux, or Windows 10/11 Pro via WSL2/Docker Desktop).", "citations": ["platform/dev/6.7/guides/hosting/_index.md:1-40", "platform/dev/6.7/guides/installation/system-requirements.md:1-48"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "requirement", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7", "glob": "**/*upgrad*"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/installation/system-requirements.md"}}, {"tool": "grep_docs", "args": {"pattern": "PHP 8", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "shopware-cli project validate", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "node", "path": "platform/dev/6.7/guides/hosting", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/hosting/infrastructure"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/infrastructure/_index.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/infrastructure/database.md"}}, {"tool": "grep_docs", "args": {"pattern": "MySQL 8", "path": "platform/dev/6.7", "mode": "content"}}, {"tool": "grep_docs", "args": {"pattern": "Node.js", "path": "platform/dev/6.7", "mode": "content"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/_index.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-59": {"query": "After upgrading to Shopware 6.7 my Varnish cache is never invalidated — what changed in the reverse proxy configuration?", "category": "dev", "option": "mcp-wiki", "answer": "Two things likely broke your invalidation. First, the config key changed: it moved from `storefront.reverse_proxy` (used up to 6.5.x) to `shopware.http_cache.reverse_proxy` starting 6.6.0.0 — if you're still on the old key, the reverse proxy config is silently ignored. Second, the Varnish-with-Redis/LUA-based BAN approach for invalidation is deprecated from v6.6.x and was removed entirely in v6.7.0 in favor of `XKey`-based purging; Redis clusters were never supported by that older BAN approach either. To fix it, configure the reverse proxy under the new key with XKey enabled: \n```yaml\nshopware:\n    http_cache:\n        reverse_proxy:\n            enabled: true\n            ban_method: \"BAN\"\n            hosts: [ \"http://varnish\" ]\n            max_parallel_invalidations: 3\n            use_varnish_xkey: true\n```\nand set `SHOPWARE_HTTP_CACHE_ENABLED=1` in `.env`. Also make sure `SYMFONY_TRUSTED_PROXIES` is set (since 6.6, plain `TRUSTED_PROXIES` is no longer read automatically) so Symfony sees the real client IP and the cache differentiates requests correctly. For soft-purge behavior (serve stale while refreshing) instead of hard purge, change the Varnish VCL from `xkey.purge(req.http.xkey)` to `xkey.softpurge(req.http.xkey)`. Useful cache-clear commands: `cache:clear` (also clears HTTP cache, delete `var/cache` manually if unwanted), `cache:clear:all` (since 6.6.8, clears everything including HTTP cache), and `cache:clear:http` (since 6.6.10, clears only the reverse proxy cache). Source: https://developer.shopware.com/docs/guides/hosting/infrastructure/reverse-http-cache.html", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/reverse-http-cache.md:1-88"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "Varnish", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/infrastructure/reverse-http-cache.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-42": {"query": "How do I check extension compatibility before upgrading with shopware-cli, and why does it report my plugins in custom/plugins as blocking?", "category": "dev", "option": "mcp-wiki", "answer": "Two shopware-cli commands are relevant. First, `shopware-cli project validate --only phpstan` can be run before a Shopware upgrade specifically to detect breaking changes in custom code; more generally `shopware-cli extension validate [--full]` runs metadata/packaging/PHP-lint checks (basic mode, no local PHP/Node needed) or, with `--full`, adds `phpstan`, `eslint`, `stylelint`, `admin-twig`, `storefront-twig` checks (needs PHP 8.2+, Node.js 20+, Composer, npm on the host); `--check-against lowest|highest` checks against the lowest/highest allowed dependency versions. Second, and more directly relevant to your question, `shopware-cli project upgrade` runs a six-phase wizard (readiness, version choice, extension/Composer analysis, plan review, apply, report) and its prerequisite checks require that `composer.lock` contains an installed `shopware/core` version, the Git working tree is clean, and — the key point — that all extensions are Composer-managed. Plugins sitting in `custom/plugins` that are not registered/installed via Composer are not Composer-managed, so the wizard reports them as blocking the upgrade. The documented fix is to migrate locally managed extensions to Composer management first: `shopware-cli project autofix composer-plugins`, then re-run `shopware-cli project upgrade` (optionally as a non-interactive dry run first: `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run`). Note the wizard does not rewrite incompatible custom extension code itself — it only surfaces compatibility and Composer-resolution problems before files change.", "citations": ["platform/dev/6.7/products/tools/cli/validation.md:1-77", "platform/dev/6.7/products/tools/cli/project-commands/upgrade.md:1-69"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/products/tools/cli/validation.md"}}, {"tool": "grep_docs", "args": {"pattern": "extension compat", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/products/tools/cli/project-commands/upgrade.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-67": {"query": "What does a minimal app folder and `manifest.xml` need to contain, and which console commands install and activate the app on my local Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "Choose a technical name in UpperCamelCase (e.g. `MyExampleApp`) and create the app folder `custom/apps/MyExampleApp/manifest.xml`. The `manifest.xml` needs a `<meta>` block with `name`, `label`, `description`, `author`, `copyright`, `version`, `icon`, `license`; the folder name must match `<meta><name>`, and `<author>`/`<copyright>` are required or `bin/console app:refresh` fails. Then: run `bin/console app:refresh` to register the app; run `bin/console app:install --activate MyExampleApp` to install and activate it in one step (use `bin/console app:activate MyExampleApp` afterward if you installed without `--activate`); use `bin/console app:list` to inspect installed apps; clear caches afterward with `bin/console cache:clear` (or `cache:clear:http`/`cache:clear:all`). Apps are validated on install — pass `--no-validate` to `app:install` to skip validation while debugging, and `bin/console app:validate` to check for configuration issues. Commands must be run from inside the PHP container at the project root, and installation uses the app's technical name, not a filesystem path.", "citations": ["platform/dev/6.7/guides/plugins/apps/app-base-guide.md:1-42"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "manifest.xml", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "app:install", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/app-base-guide.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-11": {"query": "How do I create an integration for Admin API access in the administration and give it the right privileges?", "category": "func", "option": "mcp-wiki", "answer": "Go to Settings > System > Integrations, where integrations let you create dedicated API access (an access ID and security key) for external applications connecting to Shopware. Click 'Create integration', assign it a name, and then decide its privileges: either grant it full 'administrator permissions', or select an existing role instead to scope its access. After creation Shopware issues an access ID and a security key; the security key is shown only at creation time, so it must be saved immediately since it is never displayed again afterwards. The overview lists all integrations with their name and permissions, and the context menu (or clicking the name) lets you edit or delete an integration; from the edit view you can use 'Regenerate API access key' to rotate credentials, which regenerates both the security key and the access ID and invalidates the previous ones. (Source: platform/func/settings/system/integrationen.md, https://docs.shopware.com/en/shopware-6-en/settings/system/integrationen)", "citations": ["platform/func/settings/system/integrationen.md:1-44"], "toolCallLog": [{"tool": "grep_docs", "args": "{ pattern: 'integration', path: 'platform/func', mode: 'files' }"}, {"tool": "read_doc", "args": "{ path: 'platform/func/settings/system/integrationen.md' }"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-03": {"query": "Where do the `#[ORM\\Entity]` mapping attributes for my plugin's entity go in Shopware 6, and how do I get Doctrine's `EntityManager` injected into my service so I can persist it?", "category": "edge", "option": "mcp-wiki", "answer": "This premise doesn't apply to Shopware 6: a corpus-wide grep for `ORM\\Entity` and for `EntityManager` across the whole platform layer returns no hits. The Data Abstraction Layer hub states explicitly that 'Shopware 6 has no traditional ORM: the Data Abstraction Layer (DAL) is a thin, Doctrine-like layer accessed through an `EntityRepository` (PHP) or `repositoryFactory` (Administration), queried with a `Criteria` object.' Instead of Doctrine ORM mapping attributes, a plugin entity is declared as an `EntityDefinition` class using `defineFields()` (with Field/Flag classes such as `PrimaryKey`, `Required`), and persisted by injecting the generated `<entity>.repository` service (an `EntityRepository`) via the Symfony DI container and calling `create()`/`update()`/`upsert()`/`delete()` on it — not by injecting a Doctrine `EntityManager`. There is no Doctrine ORM entity-mapping or `EntityManager` injection mechanism documented for Shopware 6 plugins.", "citations": ["platform/hubs/data-abstraction-layer.md:1-73"], "toolCallLog": [{"tool": "grep_docs", "args": "{ pattern: 'ORM\\\\Entity', path: 'platform', mode: 'files' }"}, {"tool": "grep_docs", "args": "{ pattern: 'EntityManager', path: 'platform', mode: 'files' }"}, {"tool": "read_doc", "args": "{ path: 'platform/hubs/data-abstraction-layer.md' }"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "dev-05": {"query": "How does theme inheritance work in Shopware — theme.json and SCSS overrides?", "category": "dev", "option": "mcp-wiki", "answer": "Theme inheritance means extending an existing, installed theme with a new theme that reuses its templates, styles, scripts, assets, and config while adding its own changes — useful for a variant of an already-used theme (dark version, per-sales-channel differences, customized store-bought theme) without duplicating or modifying the original theme's code. To set it up, edit `theme.json` in `<plugin root>/src/Resources` of the extending theme and insert the base theme's technical name into each relevant section, before the extending theme's own alias, e.g.: `views: [\"@Storefront\", \"@Plugins\", \"@SwagBasicExampleTheme\", \"@SwagBasicExampleThemeExtend\"]`, `style: [\"app/storefront/src/scss/overrides.scss\", \"@SwagBasicExampleTheme\", \"app/storefront/src/scss/base.scss\"]`, `script: [\"@Storefront\", \"@SwagBasicExampleTheme\", \"app/storefront/dist/.../file.js\"]`, `asset: [\"@Storefront\", \"@SwagBasicExampleTheme\", \"app/storefront/src/assets\"]`, `configInheritance: [\"@Storefront\", \"@SwagBasicExampleTheme\"]`. `views` rendering order is: Storefront base then plugin extensions then the base theme (`@SwagBasicExampleTheme`) then the current theme. `script` follows the same layered order. For `style`, `overrides.scss` stays first because it can affect SCSS variables like `$border-radius`. For `asset`, the base theme must be listed explicitly to reuse its assets. For `configInheritance`, the last listed theme that differs from the current one becomes the parent theme for config values, and the `Storefront` theme's config is always inherited even without an explicit `configInheritance` entry. Separately, for SCSS overrides in general (not only inheritance): SCSS is compiled by a PHP SASS compiler, with the entry point declared in `theme.json`'s `style` section, defaulting to `<plugin root>/src/Resources/app/storefront/src/scss/base.scss`; edit that file, then run `bin/console theme:compile` to apply changes. JavaScript, by contrast, cannot be compiled by PHP — webpack is used, with `main.js` as the entry point (`<plugin root>/src/Resources/app/storefront/src/main.js`); run `shopware-cli project storefront-build` to build it, or `shopware-cli project storefront-watch` for live reload during development.", "citations": ["platform/dev/6.7/guides/plugins/themes/inheritance/add-theme-inheritance.md:1-53", "platform/dev/6.7/guides/plugins/themes/styling/add-css-js-to-theme.md:1-41"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "theme.json", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/themes/inheritance/add-theme-inheritance.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/themes/theme-base-guide.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/themes/styling/add-css-js-to-theme.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-35": {"query": "How do I load entities from the Admin API inside an Administration component using the repository factory and a Criteria?", "category": "dev", "option": "mcp-wiki", "answer": "Inject the repositoryFactory service in your component (inject: ['repositoryFactory']) and create a repository for the entity you need, e.g. this.repositoryFactory.create('product') (a third parameter accepts { version: 1 }). Build a Criteria instance to describe the query: criteria.setPage(1); criteria.setLimit(10); criteria.setTerm('foo'); criteria.setTotalCountMode(2); criteria.addFilter(Criteria.equals('product.active', true)); criteria.addSorting(Criteria.sort('product.name', 'DESC')); criteria.addAggregation(Criteria.avg('average_price', 'product.price')); — setTotalCountMode accepts 0 (no total count, fastest), 1 (exact count) or 2 (limit*5+1, a fast 'next page exists' approximation). Load associated data by calling criteria.addAssociation('manufacturer') before searching. Then fetch data with productRepository.search(criteria, Shopware.Context.api) for a list/SearchResult, or productRepository.get(entityId, Shopware.Context.api) for a single entity. To write back, call productRepository.save(entity, Shopware.Context.api) (only changed properties are sent, and saves are not automatic — you must call save explicitly), and productRepository.delete(id, Shopware.Context.api) or bulk-delete via syncDeleted with an array of ids. Note that entities are stateless: after save(), you must re-fetch related data from the server if you need it, and for a brand-new unsaved entity, associations are stored locally on the parent and sent together only when the parent itself is saved (they can't be sent to the server independently before the parent is persisted).", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md:1-59"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "repositoryFactory", "path": "platform/dev/6.7/guides/plugins/plugins/administration", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-05": {"query": "My plugin decorates `CachedProductRoute` to add cache tags — where did the `Cached*Route` classes go in Shopware 6.7 and how do I cache a Store API route now?", "category": "gap", "option": "mcp-wiki", "answer": "The wiki does not document a removal of `Cached*Route` classes specifically, and in fact the 6.7 Extendability page still lists `CachedCategoryRoute` decorating `CategoryRoute`/`AbstractCategoryRoute` as the canonical example of the decoration pattern used for Store API route caching — the corpus gives no evidence they were removed. What the corpus does show for 6.7 caching mechanics: caching a route is done by adding cache tags at write time and invalidating them, not just by decorating a `Cached*` wrapper — inject `CacheTagCollector` and call `$this->cacheTagCollector->addTag('my-custom-entity-' . $id)`, then later invalidate with `$this->cacheInvalidator->invalidate(['my-custom-entity-' . $id])` (optionally forcing immediate invalidation with a second `true` argument or the `sw-force-cache-invalidate` header, since invalidation is batched every 5 minutes by default). For a Storefront controller route (as opposed to a Store API route), 6.7 offers a simpler alternative: set the route default `_httpCache: true` on the `#[Route(...)]` attribute; the controller then needs no invalidation logic of its own as long as it loads data exclusively through Store API routes, since its HTTP cache entry inherits the sum of those routes' cache tags. I found no page describing removal/renaming of the `Cached*Route` class hierarchy itself in 6.7 — if that specific architectural change happened, this corpus does not document it.", "citations": ["platform/dev/6.7/guides/development/extensions/architecture/extendability.md:1-52", "platform/dev/6.7/guides/plugins/plugins/framework/caching/_index.md:1-79", "platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-caching-to-custom-controller.md:1-47"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "CachedProductRoute|Cached.*Route", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "cache tag|http cache|reverse proxy", "path": "platform/dev/6.7/guides/plugins/plugins/framework/store-api", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/caching/_index.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/extensions/architecture/extendability.md", "section": "decoration"}}, {"tool": "grep_docs", "args": {"pattern": "removed|merged|no longer|deprecated", "path": "platform/dev/6.7/concepts/framework/http_cache.md", "mode": "content"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-caching-to-custom-controller.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "partial"}, "dev-14": {"query": "I wrote a subscriber class in my plugin but it never fires — which interface and which service tag (`shopware.event_subscriber`?) register it?", "category": "dev", "option": "mcp-wiki", "answer": "Your subscriber class must implement Symfony's `EventSubscriberInterface` (`Symfony\\Component\\EventDispatcher\\EventSubscriberInterface`) with a static `getSubscribedEvents()` method mapping event names to handler methods, e.g. `ProductEvents::PRODUCT_LOADED_EVENT => 'onProductsLoaded'`. The correct service tag is `kernel.event_subscriber`, not `shopware.event_subscriber` — it must be registered in the plugin's `src/Resources/config/services.php` and tagged accordingly: `$services->set(MySubscriber::class)->tag('kernel.event_subscriber');`. Creating the class alone is not enough: if it is missing from `services.php`/not tagged, Shopware will not call it and there is no obvious error indicating the event went unhandled — this is the most common reason such a subscriber 'never fires'.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/event/listening-to-events.md:1-63"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "EventSubscriberInterface", "path": "platform/dev/6.7/guides/plugins", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/event/listening-to-events.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-47": {"query": "My payment plugin implements `AsynchronousPaymentHandlerInterface` and is tagged `shopware.payment.method.async` — how do I write a payment handler for Shopware 6.7 instead?", "category": "dev", "option": "mcp-wiki", "answer": "From Shopware 6.7.0.0 onward, all payment handling goes through a single class, `Shopware\\Core\\Checkout\\Payment\\Cart\\PaymentHandler\\AbstractPaymentHandler`, instead of the multiple pre-6.7 interfaces (`SynchronousPaymentHandlerInterface`, `AsynchronousPaymentHandlerInterface`, `PreparedPaymentHandlerInterface`, `RecurringPaymentHandlerInterface`, `RefundPaymentHandlerInterface`), each of which used to be registered with its own tag (`shopware.payment.method.sync`, `.async`, `.prepared`, `.recurring`, `.refund`). To migrate: 1) create a class extending `AbstractPaymentHandler` and implement `supports(PaymentHandlerType $type, string $paymentMethodId, Context $context): bool` plus the relevant method(s) — `pay(Request, PaymentTransactionStruct, Context, ?Struct): ?RedirectResponse` (always called during checkout; return `null` for synchronous flows or a `RedirectResponse` to trigger `finalize` afterward), `finalize(Request, PaymentTransactionStruct, Context): void` (called after redirect back from the external provider — this replaces your old `AsynchronousPaymentHandlerInterface::finalize`), plus optionally `validate`, `refund`, `recurring` if needed. 2) Register the handler with the single tag `shopware.payment.method` (replacing `shopware.payment.method.async`): `$services->set(MyCustomPaymentHandler::class)->tag('shopware.payment.method');`. 3) Use `Shopware\\Core\\Checkout\\Order\\Aggregate\\OrderTransaction\\OrderTransactionStateHandler` to update transaction state (`->process(...)`, `->paid(...)`), and throw `PaymentException` (e.g. `PaymentException::asyncProcessInterrupted`, `::customerCanceled`) to fail the transaction. 4) Register the payment method itself in the plugin lifecycle (install/activate/deactivate) via `payment_method.repository`, providing `handlerIdentifier`, `name`, `description`, `pluginId`, `afterOrderEnabled`, and `technicalName` (required from 6.7 onward, must be unique with a plugin-specific prefix — omitting it can prevent installation/activation). Never remove the payment method on uninstall, only set it inactive, since orders may still reference it.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:1-72"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "AsynchronousPaymentHandlerInterface", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-24": {"query": "How do I get readable SEO URLs generated for the detail pages of my plugin's own entity?", "category": "dev", "option": "mcp-wiki", "answer": "For a custom DAL entity's detail pages you want dynamic SEO URLs (generated automatically when entities are written or deleted), not static ones. Implement `Shopware\\Core\\Content\\Seo\\SeoUrlRoute\\SeoUrlRouteInterface` with three methods: `getConfig()` returning a `SeoUrlRouteConfig` (entity definition, route name, and template), `prepareCriteria()` to narrow/extend the fetch criteria, and `getMapping()` returning a `SeoUrlMapping` with the template variables (verify the entity type received, since this method can be invoked for other entities too). Register the route class with the container tag `shopware.seo_url.route`. Add a `seo_url_template` table entry via a plugin migration, setting `route_name`, `entity_name`, and `template`. Then subscribe to the entity's `written` DAL event and call `Shopware\\Core\\Content\\Seo\\SeoUrlUpdater::update($routeName, $ids)`, and do the same on the `.deleted` event. Note that a German (or other locale) SEO URL is only reachable if a matching domain is configured on the respective sales channel, and marking a `seo_url` entry deleted only sets `is_deleted = 1` — the route stays reachable, so the controller must still check whether the underlying content exists. Source: https://developer.shopware.com/docs/guides/plugins/plugins/content/seo/add-custom-seo-url.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/seo/add-custom-seo-url.md:1-72"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "seo url", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/content/seo/add-custom-seo-url.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-06": {"query": "How do I create a shipping method from my plugin's installer or migration, including the `technicalName` that 6.7 requires?", "category": "gap", "option": "mcp-wiki", "answer": "The corpus has no dedicated guide for creating a shipping method from a plugin's PHP installer/migration via `shipping_method.repository` — grepping the whole 6.7 developer tree for `shipping_method.repository`/`ShippingMethodEntity` found nothing on that mechanism. What it does document for shipping methods is the app-based, no-plugin route: since 6.5.7.0, an app's `manifest.xml` can declare a `<shipping-methods><shipping-method>` block with a required, permanent `<identifier>` (analogous in role to a technical name — it must never change across updates or Shopware deactivates/deletes the method), a `<name>`, and a required `<delivery-time>` (with a one-time-generated `<id>`), plus optional `<description>`, `<icon>`, `<active>`, `<tracking-url>`, and `<position>`. Separately, the corpus's payment-method plugin guide confirms the general 6.7 pattern this question is asking about for a sibling entity: register the method during `install`/`activate`/`deactivate` via its repository, and 6.7 requires a `technicalName` field with a unique, plugin-specific prefix — omitting it can prevent the plugin from installing or activating. By analogy, a plugin-registered shipping method would need the same `technicalName` field on its `shipping_method.repository` payload, but I could not confirm this from a shipping-method-specific page in this corpus. [from memory: shipping methods created via a plugin's PHP installer follow the same DAL pattern as payment methods — write to `shipping_method.repository` in `install()`/`activate()` with a `technicalName` field, e.g. `'technicalName' => 'swag_example-example_shipping'`]", "citations": ["platform/dev/6.7/guides/plugins/apps/checkout/shipping-methods.md:1-51", "platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:1-72"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "shipping method", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "technicalName", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "shipping", "path": "platform/dev/6.7/guides/plugins/plugins/checkout", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout", "depth": 2}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/checkout/shipping-methods.md"}}, {"tool": "grep_docs", "args": {"pattern": "shipping_method.repository|ShippingMethodEntity|shipping_method\\b", "path": "platform/dev/6.7", "regex": true, "mode": "content"}}], "notFoundClaim": false, "memoryClaims": ["shipping methods created via a plugin's PHP installer follow the same DAL pattern as payment methods — write to `shipping_method.repository` in `install()`/`activate()` with a `technicalName` field, e.g. `'technicalName' => 'swag_example-example_shipping'`"], "sourceVerdict": "partial"}, "edge-07": {"query": "How do I set up Shopware PWA as the storefront for a Shopware 6.7 shop?", "category": "edge", "option": "mcp-wiki", "answer": "The wiki has no setup guide for Shopware PWA on 6.7, and for a documented reason: Shopware PWA only has a page under the 6.6 developer docs (`platform/dev/6.6/products/pwa.md`) — a grep for 'Shopware PWA' under `platform/dev/6.7` returns no hits — and that 6.6 page states Shopware PWA (a Vue.js Single Page Application built on the Store API for a decoupled storefront) 'is currently in maintenance mode; Composable Frontends is recommended as the future direction for headless commerce with Shopware.' No installation/configuration steps are given even on the 6.6 page — it only covers what Shopware PWA is and when to consider it. For a 6.7 shop, the wiki instead points to Composable Frontends as the current headless/decoupled-storefront product (documented under `platform/dev/6.7/products/paas/shopware/composable-frontends/`), rather than Shopware PWA.", "citations": ["platform/dev/6.6/products/pwa.md:1-25"], "toolCallLog": [{"tool": "grep_docs", "args": "{ pattern: 'Shopware PWA', path: 'platform/dev/6.7', mode: 'files' }"}, {"tool": "read_doc", "args": "{ path: 'platform/dev/6.7/products/pwa.md' }"}, {"tool": "read_doc", "args": "{ path: 'platform/dev/6.6/products/pwa.md' }"}, {"tool": "grep_docs", "args": "{ pattern: 'Composable Frontends', path: 'platform/dev/6.7', mode: 'files' }"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "partial"}, "dev-17": {"query": "How do I overwrite the price of a product line item in the cart at runtime from a plugin?", "category": "dev", "option": "mcp-wiki", "answer": "Use one class that acts as both a cart collector and a cart processor (this is only for changing an existing line item's price itself — not for discounts/surcharges, which should be modeled as separate line items via the cart-discounts approach). First implement `Shopware\\Core\\Checkout\\Cart\\CartDataCollectorInterface::collect` to fetch the product IDs from the cart (`$original->getLineItems()->filterType(LineItem::PRODUCT_LINE_ITEM_TYPE)->getReferenceIds()`), skip already-fetched IDs, and store each new price in the `CartDataCollection` under a prefixed key (e.g. `'price-overwrite-'.$id`) to avoid duplicate lookups/key collisions. Then implement `Shopware\\Core\\Checkout\\Cart\\CartProcessorInterface::process` on the same class: for each product line item in `$toCalculate`, read the stored price from `CartDataCollection`, build a `Shopware\\Core\\Checkout\\Cart\\Price\\Struct\\QuantityPriceDefinition` from the new price plus the item's existing tax rules and quantity, calculate it via an injected `Shopware\\Core\\Checkout\\Cart\\Price\\QuantityPriceCalculator`, then call `$product->setPrice($calculated)` and `$product->setPriceDefinition($definition)`. Register the combined class under both tags with a priority so it runs after the core product processor: `$services->set(OverwritePriceCollector::class)->args([service(QuantityPriceCalculator::class)])->tag('shopware.cart.processor', ['priority' => 4500])->tag('shopware.cart.collector', ['priority' => 4500]);`. Always compute the price in the collector, not the processor (querying data inside `process` is discouraged since it may run repeatedly), and always mutate `$toCalculate`, not `$original`, in `process`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md:1-48"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "change price of item", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-08": {"query": "Which service do I type-hint to read products — `EntityRepositoryInterface` — and how do I inject it into my plugin service?", "category": "edge", "option": "mcp-wiki", "answer": "There is no `EntityRepositoryInterface` in Shopware 6.7 — the wiki's DAL writing-data guide type-hints the concrete class `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository`, not an interface. To read/write products you inject the repository service (e.g. `product.repository`) via your plugin's `services.php`/`services.xml`, and type-hint the constructor argument as `EntityRepository`. For example: `public function __construct(private readonly EntityRepository $productRepository) {}`, with the DI container wiring `product.repository` to that argument by service id. [from memory: the exact DI wiring syntax/example beyond what the page states]", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/writing-data.md:1-65"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "EntityRepositoryInterface", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "EntityRepository", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/writing-data.md"}}], "notFoundClaim": false, "memoryClaims": ["the exact DI wiring syntax/example beyond what the page states"], "sourceVerdict": "partial"}, "dev-33": {"query": "How do I register a custom Administration module from my plugin, and what has to line up for it to actually show up after a build?", "category": "dev", "option": "mcp-wiki", "answer": "Create <plugin root>/src/Resources/app/administration/src/module/<module-name>/index.js and import it from main.js (e.g. import './module/swag-example';). In index.js call Shopware.Module.register('swag-example', { type: 'plugin', name: 'Example', title: 'swag-example.general.mainMenuItemGeneral', description: '...', color: '#ff3d58', icon: 'regular-shopping-bag', ... }) — set a unique name, color, icon, title and description; type is 'plugin' for third-party modules by convention (not enforced). Add routes and a menu entry (see the Add Custom Route and Add Menu Entry guides), and add translation snippets per locale (e.g. snippet/de-DE.json, snippet/en-GB.json) keyed under the module name, matching the title/description snippet keys used above. Optionally add the module to Settings via the settingsItem array (group: shop/system/plugins, icon, to: route name). For it to actually show up after a build: an index.js file is required for every module since Shopware 6 automatically requires it; the plugin must be activated for the build to take effect; you must rebuild the Administration JS with `shopware-cli project admin-build` (or `composer run build:js:admin` in the platform contribution setup); and the built asset file must ship with the plugin. The build only compiles the assets — the module still depends on the entry-point import, registration, routes/components and snippets being wired up correctly at runtime.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/add-custom-module.md:1-77"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "add custom module", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/add-custom-module.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-54": {"query": "How do I register a plugin cookie in the storefront cookie consent manager in Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "Register a listener for `Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent`, tagged as a `kernel.event_listener`: `$services->set(CookieListener::class)->tag('kernel.event_listener', ['event' => 'Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent']);`. In the listener's `__invoke(CookieGroupCollectEvent $event)`, fetch a group from `$event->cookieGroupCollection` (e.g. via `CookieProvider::SNIPPET_NAME_COOKIE_GROUP_COMFORT_FEATURES`), get or create its `CookieEntryCollection`, and add a `CookieEntry`, e.g.: `$cookieEntry = new CookieEntry('my-cookie-key'); $cookieEntry->name = 'cookie.myCookieName'; $cookieEntry->value = '1'; $cookieEntry->expiration = 30; $entries->add($cookieEntry);`. Cookie groups themselves must not carry `cookie`, `value`, `expiration`, or `isRequired` — those belong only on individual `CookieEntry` objects. Since Shopware 6.7.3.0, cookies use the structured `CookieEntry`/`CookieGroup` objects instead of arrays (the array format is deprecated); the older `CookieProviderInterface` still works for backward compatibility but is deprecated in favor of `CookieGroupCollectEvent`. Since 6.7.3.0 cookie configurations also carry a hash stored client-side in the `cookie-config-hash` cookie (keyed per language), and any configuration change triggers a re-consent prompt for the affected language. Source: https://developer.shopware.com/docs/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md:1-62"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "cookie", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-01": {"query": "How do I extend the product entity with a new association in Shopware's Data Abstraction Layer?", "category": "dev", "option": "mcp-wiki", "answer": "To add a new association to an entity you don't own (e.g. `product`), create a class extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityExtension` and implement `extendFields(FieldCollection $collection)` — inside it, add e.g. a `OneToOneAssociationField('exampleExtension', 'id', 'product_id', ExampleExtensionDefinition::class, true)` — plus `getDefinitionClass()` returning `ProductDefinition::class`. Register the extension class with the `shopware.entity.extension` service tag, and register the new associated entity's definition (e.g. `ExampleExtensionDefinition`) with `shopware.entity.definition`. You can then write to the new association through the extended entity's repository, e.g. `$this->productRepository->upsert([['id' => '<product id>', 'exampleExtension' => ['customString' => 'foo bar']]], $context);`. If the extension field has no backing database table, instead subscribe to the entity's loaded event (e.g. `ProductEvents::PRODUCT_LOADED_EVENT`) and call `$productEntity->addExtension('custom_string', new ArrayEntity([...]))` — the value must be a `Struct`, not a scalar. Since Shopware 6.6.10.0, a `BulkEntityExtension` (tagged `shopware.bulk.entity.extension`) can extend many entities at once via its `collect()` generator. More generally, for declaring the association types between two entity definitions: a One-to-One association needs an `FkField` (e.g. `foo_id`) plus a `OneToOneAssociationField` on the owning side and an inverse `OneToOneAssociationField` (no FkField) on the other side; a One-to-Many/Many-to-One pair uses an `FkField` and `ManyToOneAssociationField` on the 'many' side and a `OneToManyAssociationField` on the 'one' side; a Many-to-Many association requires a third `MappingEntityDefinition` with two `FkField`s (flagged `PrimaryKey`, `Required`) and two `ManyToOneAssociationField`s, plus a `ManyToManyAssociationField` declared on each of the two main definitions. Gotcha: setting `autoload` to `true` on both the `EntityExtension` and `EntityDefinition` side of the same association can cause recursion/out-of-memory errors, and `ManyToOneAssociationField`/`ManyToManyAssociationField` default `autoload` to `false` for performance reasons.", "citations": ["platform/dev/6.6/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md:1-77", "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-associations.md:1-57"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "association", "path": "platform/dev/6.7", "glob": "**/*entity-extension*", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7", "glob": "**/*entity*"}}, {"tool": "grep_docs", "args": {"pattern": "OneToManyAssociationField", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "extend.*entity|add.*association", "path": "platform/hubs", "regex": true}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.6/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-associations.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-57": {"query": "B2B Suite support ends with 6.8 — how do I run the B2B Suite Migration to B2B Components and check that it finished?", "category": "dev", "option": "mcp-wiki", "answer": "Run the migration with the console command `bin/console b2b:migrate:commercial` to migrate everything. To restrict it to specific components (name must match the configurator's technical name), pass them as arguments, e.g. `bin/console b2b:migrate:commercial quote_management shopping_list`; note that `employee_management` is always migrated first regardless of argument order because it is a prerequisite for all other components, and overall order otherwise follows configurator priority. Batch size can be tuned with `bin/console b2b:migrate:commercial --batch-size=100`. `b2b:migrate:commercial` queues work and returns before the migration actually finishes, so to check completion watch progress in a separate terminal with `bin/console b2b:migrate:progress --watch`; its output shows columns Total, Valid, Newly, Migrated, Pending, Error, and status values `Complete`, `Pending`, `In progress`, `Complete with error`, `Has new records`. One gotcha: Budget Management leaves the Organization Unit empty on migrated budgets (requires B2B Commercial 7.6.0+). Source: https://developer.shopware.com/docs/products/extensions/b2b-suite-migration/execution/running-migration.html", "citations": ["platform/dev/6.7/products/extensions/b2b-suite-migration/execution/running-migration.md:1-53"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "Migration to B2B Components", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/products/extensions/b2b-suite-migration", "depth": 3}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/products/extensions/b2b-suite-migration/execution/running-migration.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-53": {"query": "My theme config labels disappeared from the Theme Manager after 6.7 — how do I define `theme.json` config fields and where do their translations go now?", "category": "dev", "option": "mcp-wiki", "answer": "`theme.json` (at `<plugin root>/src/Resources/theme.json`) still defines config fields under `config.fields.<field-key>` with parameters `type` (`color`, `text`, `number`, `fontFamily`, `media`, `checkbox`, `switch`, `url`), `editable`, `tab`, `block`, `section`, `custom` (raw data exposed via API only), `scss` (set `false` to skip SCSS variable injection) and `fullWidth`. However, since v6.7.1.0, `label`/`helpText` are omitted from `theme.json` field objects — this is why labels disappeared. Before v6.8.0.0, fields (and tabs/blocks/sections) carried inline `label`/`helpText` translation objects directly in `theme.json`; that approach is deprecated for v6.8. Translations now live in Administration snippet files instead, e.g. `<plugin root>/src/Resources/app/administration/src/app/snippet/de.json` (locale-specific `de-DE.json`/`en-GB.json` also supported), using this key structure: Tab: `sw-theme.<technicalName>.<tabName>.label`; Block: `sw-theme.<technicalName>.<tabName>.<blockName>.label`; Section: `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.label`; Field: `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.<fieldName>.label` / `.helpText`; Option: `...<fieldName>.<index>.label`. Unnamed tab/block/section segments use `default` in the key. After editing `theme.json` or the snippet files, run `bin/console theme:refresh` to apply the changes. Source: https://developer.shopware.com/docs/guides/plugins/themes/configuration/theme-configuration.html", "citations": ["platform/dev/6.7/guides/plugins/themes/configuration/theme-configuration.md:1-77"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "theme.json", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "config field", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/themes/configuration/theme-configuration.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-62": {"query": "I changed a setting in `.env` on a deployed 6.7 shop but it still behaves the old way — what takes precedence between `.env`, `.env.local` and the real environment variables, and which settings does Shopware not read from `.env` at all?", "category": "dev", "option": "mcp-wiki", "answer": "Shopware's `.env` handling follows standard Symfony Dotenv behaviour: real environment variables set at the OS/container/webserver level always take precedence over anything in the `.env` files, and `.env.local` (which is meant for local, non-committed overrides) takes precedence over the committed `.env`. [from memory] The wiki's environment-variables reference for 6.7 lists the variables Shopware actually reads this way (APP_ENV, APP_URL, APP_SECRET, DATABASE_URL, MESSENGER_TRANSPORT_DSN, REDIS_URL, the Elasticsearch/OpenSearch variables, etc.), confirming these are read from the environment/.env chain (platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md:1-41). Separately, most merchant-facing/shop settings (e.g. `core.listing.allowBuyInListing` and similar `system_config` keys normally edited in the Administration) are stored in the database, not `.env` — they are only overridable via `config/packages/<name>.yaml` under the `shopware.system_config` key (optionally per sales channel), and once overwritten that way they can no longer be changed in the Administration UI; that YAML file can itself reference an env var via Symfony's `%env(...)%` processor, but the setting itself is never read directly from `.env` (platform/dev/6.7/guides/hosting/configurations/shopware/static-system-config.md:1-66). So if you changed a `.env` value for something that is actually a database-stored `system_config` setting, that's why nothing changed — it needs either an Administration change or a `config/packages` static override, not a `.env` edit.", "citations": ["platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md:1-41", "platform/dev/6.7/guides/hosting/configurations/shopware/static-system-config.md:1-66"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": ".env.local", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/configurations/shopware/static-system-config.md"}}, {"tool": "grep_docs", "args": {"pattern": "real environment variable", "path": "platform/dev/6.7", "mode": "content"}}, {"tool": "grep_docs", "args": {"pattern": "system_config", "path": "platform/dev/6.7", "mode": "files"}}], "notFoundClaim": false, "memoryClaims": ["Shopware's `.env` handling follows standard Symfony Dotenv behaviour: real environment variables set at the OS/container/webserver level always take precedence over anything in the `.env` files, and `.env.local` (which is meant for local, non-committed overrides) takes precedence over the committed `.env`."], "sourceVerdict": "partial"}, "dev-51": {"query": "Custom entities declared in `Resources/config/entities.xml` no longer work for my plugin in Shopware 6.7 — how do I define and register a DAL entity with PHP attributes instead?", "category": "dev", "option": "mcp-wiki", "answer": "In Shopware 6.7 you register a DAL entity with PHP attributes instead of an EntityDefinition/EntityEntity/EntityCollection triplet (attribute-based entity registration has been available since 6.6.3.0). Steps: 1) Extend `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity` and add `#[Entity('entity_name', collectionClass: ...)]` (the attribute class is `Shopware\\Core\\Framework\\DataAbstractionLayer\\Attribute\\Entity`); `name` is required and must be unique, `collectionClass` defaults to `EntityCollection` (custom collection classes need 6.6.9.0+). 2) Add a primary key with `#[PrimaryKey]` on a property, typically a `string` UUID. 3) Register the class in `services.php` with the `shopware.entity` tag: `$services->set(Examples\\ExampleEntity::class)->tag('shopware.entity');` — Shopware then auto-registers an EntityDefinition and repository named `<entity_name>.definition` / `<entity_name>.repository`. 4) Define fields with `#[Field(type: FieldType::...)]` (the type accepts a `FieldType` constant or, since 6.6.9.0, directly a FQCN extending `Field`). 5) Use `#[AutoIncrement]`, `#[ForeignKey(entity: '...')]` for special fields, `#[Serialized(serializer: ...)]` for JSON fields with custom (de)serialization. 6) For custom fields, use `EntityCustomFieldsTrait` or a `#[CustomFields]` attribute on a nullable `?array` property. 7) Fields are hidden from the API by default — add `api: true` or `api: [AdminApiSource::class]` / `api: [SalesChannelApiSource::class]` on `#[Field]` to expose them. 8) For translations, set `translated: true` on `#[Field]` (property must be nullable) to get an auto-created TranslatedField/EntityTranslationDefinition, and add `#[Translations]` on a nullable array property for the `translations` association. 9) Non-nullable typed properties are required by default; add `#[Required]` explicitly where needed (mandatory for translated fields since those must be nullable). 10) Associations use `OneToOne`, `OneToMany`, `ManyToOne`, `ManyToMany` attributes on the appropriate property, paired with `#[ForeignKey(entity: '...')]`. With this approach there's no need to write getters/setters, an EntityTranslationDefinition, or an EntityCollection class by hand. Gotcha: translated properties must be nullable; custom collection classes and direct Field-subclass references as `type` both require 6.6.9.0+. Source: https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/entities-via-attributes.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md:1-61"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "entities.xml", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "custom entity", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md"}}, {"tool": "grep_docs", "args": {"pattern": "#\\[Entity", "path": "platform/dev/6.7", "regex": true}}, {"tool": "grep_docs", "args": {"pattern": "entities.xml", "path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling", "context": 2}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-38": {"query": "How do I write Jest unit tests for my Administration components in Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "Place the test file next to
