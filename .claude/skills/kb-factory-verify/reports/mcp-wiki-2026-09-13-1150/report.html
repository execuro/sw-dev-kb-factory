orefront Twig template from my plugin with `{% extends %}` so I keep the core markup and other plugins' changes?", "category": "dev", "option": "mcp-wiki", "answer": "Use Shopware's `sw_extends` Twig tag instead of the plain `{% extends %}` tag — `sw_extends` is a custom tag that supports multi-inheritance, so multiple plugins can each extend the same core template and stack their changes, which plain `{% extends %}` does not allow. Shopware looks for plugin templates in `<plugin root>/src/Resources/views` by default. Find the core template to override, e.g. `storefront/layout/header/logo.html.twig`, and recreate the identical path under the plugin's views directory: `<plugin root>/src/Resources/views/storefront/layout/header/logo.html.twig`. In that file, extend the original and override the desired block, for example: `{% sw_extends '@Storefront/storefront/layout/header/logo.html.twig' %}` followed by `{% block layout_header_logo_link %} ... {% endblock %}`. Use `{{ parent() }}` inside the override to append to, rather than replace, the original block content, which preserves the core markup and any changes made by other plugins ahead of yours in the chain. After making changes, clear the cache with `./bin/console cache:clear`, and make sure the plugin is active and (if it has a theme) assigned to the sales channel. To discover available Twig variables on a page, call `{{ dump() }}` inside the template. Since Shopware 6.7.11.0 a separate Storefront Components system is also available for building reusable, atomic template components. Source: https://developer.shopware.com/docs/guides/plugins/plugins/storefront/templates/customize-templates.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-templates.md:1-55"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "extend storefront template", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "sw_extends", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-templates.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-69": {"query": "How does an app subscribe to an event like `product.written`, what does Shopware POST to the webhook URL, and how do I verify the request is genuine?", "category": "dev", "option": "mcp-wiki", "answer": "An app subscribes by declaring a webhook in the manifest's `<webhooks>` section, naming the webhook and the `event` it listens to (e.g. `product.written`). Shopware then POSTs a payload shaped like:\n```json\n{\n  \"data\": {\n    \"payload\": [ { \"entity\": \"...\", \"operation\": \"...\", \"primaryKey\": \"...\", \"updatedFields\": [] } ],\n    \"event\": \"...\"\n  },\n  \"source\": { \"url\": \"...\", \"appVersion\": \"...\", \"shopId\": \"...\", \"eventId\": \"...\" },\n  \"timestamp\": 0\n}\n```\n`source.url`/`appVersion`/`shopId`/`eventId` identify the sending shop instance (`eventId` stays stable across retries, since 6.4.11.0); `timestamp` (since 6.4.1.0) marks when the webhook was handled and can be used to reject stale/replayed requests. The request also carries headers `sw-version` (since 6.4.1.0) and `sw-context-language`/`sw-user-language` (since 6.4.5.0). `entity.written` payloads (like `product.written`) reference the changed record only by `primaryKey`, not the full entity — the app must fetch associations itself via the shop API. To verify authenticity, check the `shopware-shop-signature` header: a SHA-256 HMAC of the request body, signed with the `shop-secret` assigned during app registration — the same mechanism used for the registration confirmation request. A webhook can also be restricted to the live version only via `onlyLiveVersion` in the manifest (since 6.5.7.0, default `false`, only checked for `HookableEntityWrittenEvent`).", "citations": ["platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md:1-66"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-04": {"query": "How do I create a custom CMS element for Shopping Experiences?", "category": "dev", "option": "mcp-wiki", "answer": "A CMS element is the smallest content primitive (text, image, video, product listing, etc.) placed inside a block's slot in Shopware's Shopping Experience (CMS) system; elements have no knowledge of their context and are always rendered inside a parent block's slot. The recommended Administration directory layout is `src/Resources/app/administration/src/module/sw-cms/elements/<name>/` with `index.js`, a `component/` (index.js + html.twig + scss), a `config/` (index.js + html.twig) and a `preview/` (index.js + html.twig + scss) subfolder. Steps: (1) import the element folder in `main.js`; (2) register it via `Shopware.Service('cmsService').registerCmsElement({...})` with keys `name`, `label`, `component`, `configComponent`, `previewComponent`, `defaultConfig` (a map of config key to `{ source, value }`), and optionally `hidden`/`removable`; (3) create the preview component (the thumbnail shown in the element picker); (4) create the main component, mixing in `cms-element` and calling `this.initElementConfig('<name>')` in `created()`, providing fallback content so the element isn't invisible in the editor when unconfigured; (5) create the config component (also mixing in `cms-element` and calling `initElementConfig`), providing form fields for each `defaultConfig` key, preferring Shopware Meteor components; (6) for inheritance-aware fields (content inherited from the base layout vs. overridden per page) wrap them with `sw-cms-inherit-wrapper`, passing `field` and `element`; (7) for the Storefront, add a Twig template at `src/Resources/views/storefront/element/cms-element-<name>.html.twig` — the `cms-element-` prefix is required exactly as part of the filename. Gotchas: the Storefront cache must be cleared after adding new element templates, and by default element configuration is inherited from the base layout unless explicitly overridden (the UI may not make this obvious without the inherit-wrapper component). Relevant core classes: `\\Shopware\\Core\\Content\\Cms\\SalesChannel\\SalesChannelCmsPageLoader::load` and `CmsSlotDefinition.php`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/cms/add-cms-element.md:1-58"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "custom cms element", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/content/cms/add-cms-element.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-06": {"query": "I'm coming from Magento — what are the Shopware equivalents of store views, extensions, attribute sets and `di.xml`?", "category": "edge", "option": "mcp-wiki", "answer": "The wiki's Magento-to-Shopware keyword dictionary gives direct mappings for three of the four terms. Store View/Store/Website maps to a Sales channel with different languages and domains in Shopware 6. Extension (Magento's term for a third-party module) maps to Plugin in Shopware, with the Community Code Pool mapping to Extensions/Community Store (Extensions > Store) and the Local Code Pool mapping to Extensions under Settings > My extensions. Attribute Sets map to Custom field sets (groups of custom fields) — the page also notes plain Attributes map to Properties/Custom fields more generally, and Catalog > Attributes (Manage Attributes/Attribute Sets) maps to Settings > Content > Custom fields in the admin. The dictionary page does not mention `di.xml` at all — a targeted grep for it across the whole corpus returned nothing. Based on the separately documented Dependency Injection hub, the closest Shopware 6 equivalent of Magento's `di.xml` (declarative DI/plugin-interception config) is the Symfony service container configuration a plugin ships — `services.xml` (6.6) or `services.xml`/`services.php` (6.7) — which registers services, arguments and tags for autowiring, though this is a general Symfony-DI concept rather than a documented direct 'di.xml equivalent' in the migration material [from memory: the Symfony-DI-as-di.xml-equivalent framing itself is inference rather than a stated migration mapping].", "citations": ["platform/func/migration-en/magento-keywords.md:1-60", "platform/hubs/dependency-injection.md:1-65"], "toolCallLog": [{"tool": "grep_docs", "args": "{ pattern: 'store view', path: 'platform/func/migration-en', mode: 'files' }"}, {"tool": "grep_docs", "args": "{ pattern: 'di.xml', path: 'platform', mode: 'files' }"}, {"tool": "read_doc", "args": "{ path: 'platform/func/migration-en/magento-keywords.md' }"}], "notFoundClaim": false, "memoryClaims": ["[from memory: the Symfony-DI-as-di.xml-equivalent framing itself is inference rather than a stated migration mapping]"], "sourceVerdict": "partial"}, "dev-30": {"query": "How do I add a custom filter to the Storefront product listing from my plugin, both the criteria side and the filter panel?", "category": "dev", "option": "mcp-wiki", "answer": "On the criteria side, subscribe to `\\Shopware\\Core\\Content\\Product\\Events\\ProductListingCollectFilterEvent` and add a `Filter` instance built from: `name` (unique filter name), `filtered` (whether it is currently active, typically read from the request), `aggregations` (the aggregations behind the filter, e.g. a `FilterAggregation` wrapping a `MaxAggregation`), `filter` (the DAL filter added to the criteria, e.g. an `EqualsFilter`), and `values` (added as `currentFilter` to the result). Example: `$filter = new Filter('isCloseout', (bool) $event->getRequest()->get('isCloseout'), [new FilterAggregation('active-filter', new MaxAggregation('active', 'product.isCloseout'), [new EqualsFilter('product.isCloseout', true)])], new EqualsFilter('product.isCloseout', true), $filtered); $event->getFilters()->add($filter);`. On the UI side, extend `src/Storefront/Resources/views/storefront/component/listing/filter-panel.html.twig` and override the `component_filter_panel_items` block (available since Shopware 6.4.8.0), calling `{{ parent() }}` first and then including one of the ready-made filter components via `sw_include`, e.g. `{% sw_include '@Storefront/storefront/component/listing/filter/filter-boolean.html.twig' with { name: 'isCloseout', displayName: 'Closeout' } %}`. Available filter components include `filter-boolean`, `filter-multi-select`, `filter-property-select`, `filter-range`, and `filter-rating-select`. To position the new filter relative to a specific existing one instead of appending it at the end, extend that filter's own block (e.g. `component_filter_panel_item_price`). Source: https://developer.shopware.com/docs/guides/plugins/plugins/storefront/howto/add-listing-filters.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/howto/add-listing-filters.md:1-73"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/howto/add-listing-filters.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-03": {"query": "How do promotions and discount codes work, including individually generated codes?", "category": "func", "option": "mcp-wiki", "answer": "Promotions are configured under Marketing > Promotions. The General tab sets Name, Priority (higher number applied first), Valid from/until, Max. total uses, Max. uses per customer, and an Active toggle. For codes there are three options: none required, a single Fixed promotion code shared by all customers (optionally auto-generated), or Individual promotion codes generated per order, where each individual code can only be redeemed once. Individual code patterns can be configured via code length, an optional prefix/suffix, or a custom pattern using `%s` for a random letter (A-Z) and `%d` for a random digit (0-9), e.g. `SW-%s%d%s%d%s-TEST`; regenerating codes invalidates the previous ones. The Conditions tab lets you restrict which sales channels the promotion applies to, prevent combination with other promotions (or specific ones), and add Rule-Builder-based Customer rules, Shopping cart rules, Order rules, and 'Promote sets of products' (set groups with Mode: Number/Value Gross/Value Net, a Value, Sorting, and Product rules); if multiple rules of the same type are selected only one needs to match (OR logic) — to require all conditions together you must create separate promotions. The Discounts tab defines what the discount applies to (entire cart, shipping costs, entire product set, or a specific set group), optionally restricted to a range of products, the discount Type (Absolute, Percentage, Fixed price, or Fixed unit price — a fixed price cannot exceed the normal price), the Value, an optional Maximum discount value (percentage only), and per-currency overrides; discount settings become read-only once the promotion has been used in an order. In the storefront, customers enter a code via 'Enter voucher code' in the shopping cart/OffCanvas and confirm with the tick button. To track redeemed individual codes, open the promotion in Marketing > Promotions and check 'Redeemed', or filter the order overview by promotion code (works for fixed codes too). A gotcha: only one individual promotion code can be redeemed per promotion at a time, and putting an 'exclude these products' rule in the shopping-cart conditions (rather than in the discount's own product rules) blocks the whole promotion whenever an excluded product is in the cart.", "citations": ["platform/func/marketing/promotions.md:1-51"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "promotion", "path": "platform/func", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/marketing/promotions.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-40": {"query": "How do I upgrade a Composer-based Shopware project from 6.6 to 6.7 — which composer.json constraint do I change, and which console commands do I run afterwards?", "category": "dev", "option": "mcp-wiki", "answer": "The recommended path is the Shopware CLI upgrade wizard, run from a clean Git working tree: `shopware-cli project upgrade` (it checks readiness, target version selection, Composer-managed extension compatibility and resolves the target dependency set before applying locally; for CI/read-only checks use `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run`). If the wizard cannot be used, the manual Composer process is: (1) enable maintenance mode on a running environment with `bin/console sales-channel:maintenance:enable --all`; (2) adjust the Shopware (and shopware/commercial, if used) version constraints in composer.json to target 6.7, then run `composer update --no-scripts` (the --no-scripts flag avoids running scripts that depend on not-yet-updated recipes); (3) optionally force-update Symfony Flex-managed config files with `composer recipes:update`; (4) finalize with `bin/console system:update:finish`, which runs the database migrations and recompiles themes; (5) disable maintenance mode with `bin/console sales-channel:maintenance:disable --all`. A key gotcha: failing to update the composer.json version constraints before `composer update` means the command just resolves to the currently installed Shopware version, so no actual upgrade happens; also avoid skipping major versions unless the full upgrade path has been explicitly tested.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md:1-55"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "upgrade", "path": "platform/dev/6.7/guides/installation", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "upgrade", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "composer update.*shopware/core|shopware/core.*6.7", "path": "platform/dev/6.7", "mode": "files", "regex": true}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-23": {"query": "How do I ship a mail template with my plugin so it is installed automatically, including a custom mail template type?", "category": "dev", "option": "mcp-wiki", "answer": "Ship the mail template via a database migration (a `Shopware\\Core\\Framework\\Migration\\MigrationStep` subclass), not by creating it through the Administration, so it installs automatically with the plugin. To reuse an existing mail template type, look up its id with `SELECT id FROM mail_template_type WHERE technical_name = \"contact_form\"`, then insert into `mail_template` (`id`, `mail_template_type_id`, `system_default` — must be `0`, `created_at`) and into `mail_template_translation` per supported language (`mail_template_id`, `language_id`, `sender_name`, `subject`, `description`, `content_html`, `content_plain`, `created_at`), resolving each `language_id` via the `language`/`locale` tables. Use `INSERT IGNORE INTO` so re-running the migration on reinstall does not throw. To define a brand-new mail template type instead, first insert into `mail_template_type` (`id`, `technical_name`, `available_entities` as a JSON map like `{\"product\": \"product\"}`, `created_at`) and `mail_template_type_translation` (`mail_template_type_id`, `language_id`, `name`, `created_at`), then create the template entry as above. Do not delete mail templates on plugin uninstall since other entities may still reference them, which would cause data inconsistency. Source: https://developer.shopware.com/docs/guides/plugins/plugins/content/mail/add-mail-template.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/mail/add-mail-template.md:1-46"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "mail template type", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "add data to mail template", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/content/mail/add-mail-template.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-02": {"query": "How do Rule Builder conditions work for shipping and payment methods?", "category": "func", "option": "mcp-wiki", "answer": "The Rule Builder (Settings > Automation > Rule Builder) lets merchants define reusable rules made of conditions and operators, used to control the availability of payment/shipping methods, promotions, prices, flows, and visibility. A rule consists of General information (Name, Description, Priority, Type, Tags) plus Conditions, which are combined with AND (all must match) or OR (any must match) — switching between AND/OR automatically creates subconditions. Operators available include: At least one, All, Is equal to, Is not equal to, Is one of, Is not one of, Is greater than, Is greater than/equal to, Is less than, and Is lower than/equal to. The condition catalog spans General (e.g. Sales Channel, Currency, Date range, Day of the week, Time range), Orders, Flow Builder, Customers, Marketing & Promotions, Items in shopping cart, and Shopping cart groups; some conditions accept an optional narrowing filter. A rule with higher Priority runs sooner, and only rules with valid status are usable. The rule's Assignments tab is a read-only view showing every place the rule is currently used, e.g. payment/shipping method availability, shipping cost calculation, promotion availability, etc. A rule currently in use cannot be deleted. For payment methods, each fallback method's configuration includes an 'Availability rule' field built from the Rule Builder, and payment methods (with a default) are assigned per sales channel under the sales channel's General > Basic settings tab. For shipping methods (Settings > Shop > Shipping), an 'Availability rule' (also a Rule Builder rule) decides when the method may be offered, and the Price matrix itself can be based either on predefined properties (number of items, cart value, weight, volume) or on Rule Builder rules, optionally scoped by a restriction rule; a shipping method must then be assigned to a sales channel under that sales channel's basic settings before customers can select it.", "citations": ["platform/func/settings/rules.md:1-68", "platform/func/saas/payment.md:1-36", "platform/func/shopware-6-de/saas/Shipping.md:1-69"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/func/settings/rules.md"}}, {"tool": "read_doc", "args": {"path": "platform/func/saas/payment.md"}}, {"tool": "read_doc", "args": {"path": "platform/func/shopware-6-de/saas/Shipping.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-03": {"query": "How do I add a custom Store API route for a headless storefront?", "category": "dev", "option": "mcp-wiki", "answer": "Follow Shopware's decoratable-route pattern: (1) define an abstract route with a `getDecorated()` method and a `load(Criteria $criteria, SalesChannelContext $context): ExampleRouteResponse` method, e.g. `abstract class AbstractExampleRoute { abstract public function getDecorated(): AbstractExampleRoute; abstract public function load(Criteria $criteria, SalesChannelContext $context): ExampleRouteResponse; }`. (2) Implement the concrete route class tagged with the `#[Route(...)]` attribute using `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]`, and place a route attribute such as `#[Route(path: '/store-api/example', name: 'store-api.example.search', methods: ['GET','POST'], defaults: ['_entity' => 'swag_example'])]` on `load()`; `getDecorated()` throws `DecorationPatternException` when nothing decorates it yet, and every field you want returned via the API needs the `ApiAware` flag in its entity definition. (3) Register the route class as a service, constructor-injecting the needed repository (e.g. `swag_example.repository`). (4) Create an `ExampleRouteResponse extends StoreApiResponse` exposing the search result via a getter. (5) Import the route via `<plugin root>/src/Resources/config/routes.php` with `$routes->import('../../Core/**/*Route.php', 'attribute');` and verify discovery with `bin/console debug:router store-api.example.search` (this only confirms discovery, not that the service can be constructed or a request will succeed). (6) Optionally document the route by adding a JSON OpenAPI file under `<plugin root>/src/Resources/Schema/StoreApi/` (use `AdminApi` for Admin API endpoints instead) so Shopware's internal `OpenApi3Generator` picks it up; check the result at `/store-api/_info/stoplightio.html`. (7) To also expose it to the (non-headless) Storefront, add a controller extending `StorefrontController` scoped with `StorefrontRouteScope::ID` that calls the route, and import it via `$routes->import('../../Storefront/**/*Controller.php', 'attribute');` — for a purely headless storefront this step is unnecessary since the Store API route itself is already consumable directly, e.g. via `fetch` or an HTTP client against `/store-api/example`. Gotcha: the service definition wires the route into the container, but the `routes.php` import is a separate discovery step — a route class registered as a service is not reachable as an endpoint until its attributes are imported.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md:1-57"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "store-api route", "path": "platform/hubs/store-api.md"}}, {"tool": "grep_docs", "args": {"pattern": "add.*store.*api.*route", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-64": {"query": "How do I get an Admin API OAuth token — with client_credentials for an integration, or the password grant for local testing — and how long is each token valid?", "category": "dev", "option": "mcp-wiki", "answer": "For an integration, create an Integration in Administration under Settings → System → Integrations with the \"Administrator\" toggle enabled; the access key ID maps to OAuth `client_id` and the secret access key maps to `client_secret`. Then request a token: `POST /api/oauth/token` with body `{\"grant_type\": \"client_credentials\", \"client_id\": \"...\", \"client_secret\": \"...\"}`. The response contains `token_type`, `expires_in`, and `access_token` (plus a `refresh_token` for the password grant). For local testing only, the wiki documents a password-grant shortcut (not meant to replace client_credentials for integrations): `POST /api/oauth/token` with `grant_type: password`, `client_id: administration`, `scopes: write`, and the default Administration `username`/`password`. Both flows return an `expires_in` field indicating the token's validity in seconds, but the exact default duration value is not stated on these wiki pages — read the `expires_in` value returned in your own token response to know how long that specific token lasts. Admin API access tokens commonly default to a lifetime around 600 seconds (10 minutes) in Shopware, refreshed via the `refresh_token`, but this exact number is from general knowledge, not confirmed in the retrieved pages. [from memory]", "citations": ["platform/dev/6.7/guides/development/integrations-api/_index.md:1-47", "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md:1-44"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "client_credentials", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/integrations-api/_index.md"}}], "notFoundClaim": false, "memoryClaims": ["Admin API access tokens commonly default to a lifetime around 600 seconds (10 minutes) in Shopware, refreshed via the `refresh_token`, but this exact number is from general knowledge, not confirmed in the retrieved pages."], "sourceVerdict": "partial"}, "func-08": {"query": "How do custom field sets work — entity assignment, field types and technical name — and can a custom field be written through the Store API?", "category": "func", "option": "mcp-wiki", "answer": "Custom fields are configured under Settings > System > Custom fields and let merchants add their own data fields to entities like products or categories, for use in the Rule Builder, storefront templates, or Shopping Experiences. Custom fields are grouped into 'sets'; a set is assigned to one or more program areas (e.g. products, categories) via 'New set', which requires a unique, unchangeable technical name, a Position, a translatable Label, and the program areas it applies to — a set with no assigned area is created but unavailable anywhere. Within a set, individual fields are created via 'New custom field'; each field also requires a technical name that cannot be changed later. Available field types are: Select, Object selection (references products, categories, countries, shipping/payment methods, etc. — the object type cannot be changed after creation), Text field, Media, Number (integer/float, Steps, Min, Max), Date/Time, Checkbox, Active/Inactive switch (boolean 0/1), Text Editor, and Color picker. Common per-field options include Technical name, Position, 'Available in shopping carts' (required to use the field in the Rule Builder or custom templates), 'Modifiable via Store API' (marks the field publicly writable/readable — must not be enabled for sensitive data), Label, Placeholder, and Help text. So yes: a custom field can be written through the Store API, but only if its 'Modifiable via Store API' flag has been explicitly enabled on that field; this makes the field public, so it should never be enabled for sensitive data. Custom fields are automatically created as snippets across all snippet sets with no database changes needed. Gotchas: technical names for both sets and fields cannot be changed after creation and must avoid Twig special characters like `-` or `#` (or product exports can error); custom fields must be edited in the store's default language, since other-language edits override only that language and un-maintained languages can cause a rule relying on the field to silently fail.", "citations": ["platform/func/settings/custom-fields.md:1-65"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "custom field", "path": "platform/func", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/custom-fields.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-55": {"query": "How do the breaking storefront accessibility changes reach my theme in Shopware 6.7, and what must an extension that overrides the affected Twig blocks do?", "category": "dev", "option": "mcp-wiki", "answer": "Shopware rolls out storefront accessibility improvements (targeting WCAG 2.1 AA and BITV 2.0) gradually rather than in one big release, gating breaking changes behind the `ACCESSIBILITY_TWEAKS` feature flag. Breaking accessibility changes ship inside regular minor releases but stay inactive by default until the flag is set — with major version v6.7.0 they become the default (enabled by default from 6.7.0 onward). Such a change is typically implemented with both the old and new markup guarded by `feature('ACCESSIBILITY_TWEAKS')` in Twig, e.g.: `{% if feature('ACCESSIBILITY_TWEAKS') %}<ul class=\"sidebar-list\">{% block component_list_items_inner %}{% endblock %}<\/ul>{% else %}<div class=\"sidebar-list\">{% block component_list_items %}{% endblock %}<\/div>{% endif %}`. An extension or theme that overrides the old block (e.g. `component_list_items`) must also implement the new block (`component_list_items_inner`) via `{% sw_extends %}`, so the override keeps working once the flag/version default flips to the new markup. If a breaking accessibility change ships without being handled this way, an extension still assuming the old markup can render incorrect HTML once the core switches structure. To preview upcoming breaking accessibility changes before adopting them, the flag can be enabled in `.env` with `ACCESSIBILITY_TWEAKS=1`, the same way as major-version flags like `V6_7_0_0`. Source: https://developer.shopware.com/docs/guides/development/accessibility/storefront-accessibility.html", "citations": ["platform/dev/6.7/guides/development/accessibility/storefront-accessibility.md:1-80"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "accessibility", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/accessibility/storefront-accessibility.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-07": {"query": "How do I create a media entity from a file on disk in PHP from my plugin (e.g. during an import) and generate its thumbnails?", "category": "gap", "option": "mcp-wiki", "answer": "Nothing directly relevant found. The wiki's Media guide category (`platform/dev/6.7/guides/plugins/plugins/content/media/_index.md`) only links three narrow guides — preventing deletion of plugin-referenced media, adding a custom media file extension, and offloading thumbnail generation to a remote/external service — none of which cover creating a media entity from a file already on disk (e.g. Core's `MediaService::saveFile()`/`FileSaver` pattern used during imports) or triggering local thumbnail generation programmatically. Grepping the whole 6.7 developer tree for `saveFile`, `FileSaver`, and `MediaService` returned only an unrelated Administration JS testing mock (`mediaService.renameMedia` stub in Jest tests), not a PHP guide. I could not find material in this corpus that answers this question.", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/media/_index.md:1-30"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "thumbnail|MediaService|upload media", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/content/media/_index.md"}}, {"tool": "grep_docs", "args": {"pattern": "saveFile|FileSaver|MediaService", "path": "platform/dev/6.7", "regex": true, "mode": "content"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "dev-15": {"query": "How do I work out which event Shopware actually dispatches for a given action, for example after a product is loaded or a page is rendered?", "category": "dev", "option": "mcp-wiki", "answer": "Several complementary techniques, depending on the kind of event: DAL events follow the pattern `entity_name.event`, e.g. `product.written`/`product.deleted`; some entities also have an event-constants class such as `ProductEvents` (find it by searching for `@Event`), e.g. `ProductEvents::PRODUCT_LOADED_EVENT` fires after a product loads. For general PHP events, read core code for `$this->eventDispatcher->dispatch($someEvent, $someEvent->getName())` (the event name is the dispatch's second argument, or the class name if omitted), or search for `extends NestedEvent`, `extends Event`, `implements ShopwareEvent`, `->dispatch`, or check a service's constructor for `EventDispatcherInterface`. Page-load events: `GenericPageLoader` dispatches `GenericPageLoadedEvent`; search for `PageLoadedEvent`. Criteria-driven entity loads may fire a hand-written `CriteriaEvent` (e.g. `ProductListingCriteriaEvent`) — not guaranteed for every entity. Route-level events are fine-grained aliases of Symfony kernel events named `{route}.request`, `{route}.response`, `{route}.render` (Storefront, before Twig rendering), and since 6.6.11.0 `{route}.encode` (Store API, before JSON encoding) and `{route}.controller` — substitute the Symfony route name, e.g. `store-api.product.listing.request`. Business/ecommerce actions (registration, order placement, etc.) are found by searching for `implements BusinessEventInterface` or `implements MailActionInterface`. Practically, the fastest way to see everything fired during one request is the Symfony profiler's 'Events' tab, which lists every event name fired for that request. Storefront JS custom events use `this.$emitter.publish(...)` (search for `$emitter.publish`), and Administration Vue events use `this.$emit(...)` (search for `$emit`).", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/event/finding-events.md:1-66"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "debug:event", "path": "platform/dev/6.7", "mode": "content"}}, {"tool": "grep_docs", "args": {"pattern": "finding events", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/event/finding-events.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-52": {"query": "What must a plugin database migration class implement in Shopware 6.7, and where does the database cleanup on uninstall belong?", "category": "dev", "option": "mcp-wiki", "answer": "Every plugin migration class must extend `Shopware\\Core\\Framework\\Migration\\MigrationStep` and implement `getCreationTimestamp(): int` (returning the timestamp embedded in the class name, e.g. `Migration1611740369ExampleDescription`) and `update(Connection $connection): void`, where all schema/data changes go. Migration files live by default in `<plugin root>/src/Migration`, named `Migration<timestamp><Description>.php`; a skeleton can be generated with `./bin/console database:create-migration -p SwagBasicExample --name ExampleDescription`, or a full migration including SQL can be generated from an entity definition with `./bin/console dal:migration:create --bundle=SwagBasicExample --entities=your_entity,your_other_entity`. Migrations run automatically on plugin install/update via `./bin/console database:migrate`; for finer control the plugin's update method can call `$updateContext->setAutoMigrate(false)` and drive the `MigrationCollection` (obtained via `InstallContext`/`UpdateContext`/`ActivateContext`) directly, e.g. `$migrationCollection->migrateInPlace(1576143014)`. There is no migration rollback; database cleanup belongs in the plugin's `uninstall` lifecycle method, not in the migration. Also note `MigrationStep::updateDestructive()` is only for Shopware core's delayed, major-version destructive changes and is never run for plugin install/update. Source: https://developer.shopware.com/docs/guides/plugins/plugins/database/database-migrations.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md:1-77"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-02": {"query": "What's the plugin lifecycle in Shopware — install, activate, uninstall — and how does `keepUserData` work?", "category": "dev", "option": "mcp-wiki", "answer": "A Shopware plugin's base class (`Shopware\\Core\\Framework\\Plugin`, extending `Shopware\\Core\\Framework\\Bundle` and Symfony's `Bundle`, implemented in `<plugin root>/src/SwagBasicExample.php`) exposes lifecycle methods with access to `$this->container`: `install(InstallContext $installContext)` registers entities (e.g. payment methods), creates initial data and prepares requirements — `InstallContext` exposes plugin/Shopware versions, system `Context`, plugin migrations, and auto-migration control (`isAutoMigrate`/`setAutoMigrate`). `activate(ActivateContext $context)` activates entities created in `install()` or creates data that requires the plugin to be active. `deactivate(DeactivateContext $context)` deactivates entities from `install()` or removes entities that cannot be safely left active. `update(UpdateContext $context)` handles non-database adjustments, feature toggles, or logic depending on old/new plugin versions (database changes belong in plugin migrations instead); `UpdateContext` adds `getUpdatePluginVersion()`/`getCurrentPluginVersion()`. `postInstall(InstallContext $context)`/`postUpdate(UpdateContext $context)` run after a successful install/update. `uninstall(UninstallContext $context)` removes or cleans up plugin data; `UninstallContext` adds `keepUserData()`. `keepUserData()` works as a guard clause: if the merchant chose to keep data when uninstalling, `uninstall()` should check `if ($uninstallContext->keepUserData()) { return; }` before removing anything, i.e. when it returns `true`, persistent plugin data must not be deleted. Gotchas from the guide: avoid creating fully active business data in `install()` since the plugin isn't yet enabled — create data that can be independently activated/deactivated (e.g. a payment method) and only activate it in `activate()`; and don't blindly delete entities in `uninstall()` (e.g. a payment method used on real orders should be deactivated, not removed, to avoid leaving orders in a broken state).", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md:1-61"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "keepUserData", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-71": {"query": "How does an app define its own custom entities in Shopware 6.7 and read them back through the API?", "category": "dev", "option": "mcp-wiki", "answer": "An app defines custom entities by registering them in the app's `Resources/entities.xml` (validated against the `entity-1.0.xsd` schema). Each `<entity>` element (e.g. `custom_entity_bundle`) declares its `fields` (string, price, many-to-many, etc.), and fields can be marked `store-api-aware=\"true\"` to expose them via the Store API. Registered entities automatically get a repository, reachable from App Scripts via `services.repository.search('custom_entity_bundle', criteria)`, and via the Admin API at `POST /api/search/custom-entity-bundle`. To let a custom field reference a custom entity (an 'Entity Select'), add `custom-fields-aware=\"true\"` and `label-property=\"name\"` to the `<entity>` element (the label-property field must exist and be of type string); without a snippet the entity shows as `custom_entity_bundle.label`, so a translation snippet under `Resources/app/administration/snippet/en-GB.json` should be added. Since Shopware 6.4.15.0, entities may use the `ce_` shorthand prefix (e.g. `ce_bundle`) to avoid database name-length restrictions, and this prefix must be used consistently in repository and API calls (e.g. `POST /api/search/ce_blog`). Custom entities with custom-fields support requires Shopware 6.5.1.0+, custom entities cannot be renamed once created (renaming deletes all existing data), and associations referencing core tables still require the corresponding manifest permissions. Source: https://developer.shopware.com/docs/guides/plugins/apps/custom-data/custom-entities.html", "citations": ["platform/dev/6.7/guides/plugins/apps/custom-data/custom-entities.md:1-54"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "custom entities", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/custom-data/custom-entities.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-04": {"query": "How do I fetch products with `GET /sales-channel-api/v3/product` on Shopware 6.7?", "category": "edge", "option": "mcp-wiki", "answer": "That endpoint should not be used on Shopware 6.7: the wiki's Store API guide states plainly that 'the Sales Channel API is deprecated as of Shopware 6.4 — new routes must not implement it,' and instructs plugins/integrations to 'not implement the Sales Channel API' at all. A corpus-wide grep for the literal path segment `sales-channel-api` under `platform/dev/6.7` returns no page defining or documenting that route (only the deprecation notices reference the API by name). The supported way to fetch products on a sales channel in 6.7 is the Store API instead, e.g. via the `/store-api/product` / `/store-api/search` routes (authenticated with the `sw-access-key` header), which is what the Storefront, Composable Frontends, PWA and headless/B2B clients all consume in place of the old Sales Channel API.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/store-api/_index.md:1-53"], "toolCallLog": [{"tool": "grep_docs", "args": "{ pattern: 'sales-channel-api', path: 'platform/dev/6.7', mode: 'files' }"}, {"tool": "grep_docs", "args": "{ pattern: 'Sales Channel API', path: 'platform/dev/6.7', mode: 'content' }"}, {"tool": "read_doc", "args": "{ path: 'platform/dev/6.7/guides/plugins/plugins/framework/store-api/_index.md' }"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "partial"}, "dev-37": {"query": "How do I set up and run PHPUnit integration tests for my Shopware plugin, including tests that boot the kernel?", "category": "dev", "option": "mcp-wiki", "answer": "Create a phpunit.xml in the plugin root (it can be autogenerated via bin/console plugin:create) pointing bootstrap to tests/TestBootstrap.php, with executionOrder=\"random\", a coverage include of ./src/, a KERNEL_CLASS server var of Shopware\\Core\\Kernel and APP_ENV=test, plus testsuites for e.g. Migration/Test and Test directories. plugin:create also generates tests/TestBootstrap.php, which uses Shopware\\Core\\TestBootstrapper with ->addCallingPlugin(), ->addActivePlugins(...) and ->setForceInstallPlugins(true) — the last of which is what ensures your plugin is installed/activated even if the test database already existed. For an integration test that boots the kernel, extend PHPUnit\\Framework\\TestCase and use the Shopware\\Core\\Framework\\Test\\TestCaseBase\\IntegrationTestBehaviour trait, which gives automatic database transactions and cache clearing per test; for a migration test use the KernelTestBehaviour trait for container/database access instead, naming the test class <MigrationClassName>Test. To vary service wiring only for tests, add <plugin root>/Resources/config/services_test.php, which overrides Resources/config/services.php in the test environment. Before running tests, install the flex template's dev-tools package with `composer require --dev dev-tools`. Run tests with `./vendor/bin/phpunit --configuration=\"custom/plugins/SwagBasicExample\" --testsuite \"migration\"` (omit --testsuite to run everything) and use `--filter <ClassOrMethod>` to run a single class or method.", "citations": ["platform/dev/6.7/guides/development/testing/unit/php-unit.md:1-62"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "phpunit", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/testing/unit/php-unit.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-49": {"query": "My storefront controller still uses the `@Route` and `@RouteScope` annotations from 6.4 — what is the attribute form in Shopware 6.7 and how are the routes wired?", "category": "dev", "option": "mcp-wiki", "answer": "The `@RouteScope` annotation was replaced by the `_routeScope` route default as of Shopware 6.4.11.0, and the annotation form is deprecated as of the 6.5 major version in favor of the PHP `#[Route(defaults: ...)]` attribute. Convert your controller like this: `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]])] class ExampleController extends StorefrontController { #[Route(path: '/example', name: 'frontend.example.example', methods: ['GET'])] public function showExample(): Response { return $this->renderStorefront('@SwagBasicExample/storefront/page/example.html.twig', ['example' => 'Hello world']); } }`. The route scope attribute can be set class-wide (as above) or per-route instead. Route names should use one of the `frontend`, `widgets`, `payment`, `api`, or `store-api` prefixes so the router recognizes the route as belonging to that scope; since Shopware 6.7.2.0, a plugin can instead allow custom route names without a standard prefix by adding a `storefront.router.allowed_routes` config entry (e.g. `storefront: router: allowed_routes: [swag.test.foo-bar]`) loaded from the plugin's `build()` method. Wiring: register the controller as a public service in `services.php`, calling `setContainer`: `$services->set(ExampleController::class)->public()->call('setContainer', [service('service_container')]);`. Then import the controller's routes in `routes.php` using the attribute loader: `$routes->import('../../Storefront/Controller/*Controller.php', 'attribute');`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:1-83"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "RouteScope", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-11": {"query": "On Shopware 6.7, which file do I declare my plugin's services in, and how do I get a core service passed into my service's constructor?", "category": "dev", "option": "mcp-wiki", "answer": "On Shopware 6.7, plugin services are declared in `services.php` (Symfony DI configurator syntax; this replaces the 6.6 `services.xml` for defining/injecting services), located under the plugin's `src/Resources/config/` directory. If `autowire` and `autoconfigure` are already set in `services.php`, a typed constructor parameter (e.g. `private SystemConfigService $systemConfigService` in the constructor) is injected automatically with no further declaration needed. If the service is declared explicitly instead, add the core service as an argument using the `service()` configurator helper from `Symfony\\Component\\DependencyInjection\\Loader\\Configurator`, e.g. `$services->set(ExampleService::class)->args([service(SystemConfigService::class)]);`. The example given is `SystemConfigService` injected into an `ExampleService` class, used later via `$this->systemConfigService->getString('core.basicInformation.shopName', $context->getSalesChannel()->getId())`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md:1-57"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7", "glob": "**/*dependency-injection*"}}, {"tool": "grep_docs", "args": {"pattern": "services.xml", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "add service", "path": "platform/dev/6.7/guides/plugins", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals"}}, {"tool": "grep_docs", "args": {"pattern": "services.xml", "path": "platform/dev/6.7/guides/plugins", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/services-utilities/add-custom-service.md"}}, {"tool": "read_doc", "args": {"path": "platform/hubs/dependency-injection.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-34": {"query": "How do I extend an existing Administration component and its Twig blocks from my plugin, for example to change the dashboard headline?", "category": "dev", "option": "mcp-wiki", "answer": "Two Options API factory functions handle this: Shopware.Component.override(name, config) replaces an existing component's behavior in place (e.g. `Shopware.Component.override('sw-text-field', { template });` with a template imported from your own .html.twig file), while Shopware.Component.extend(newName, baseName, config) creates a brand-new component based on an existing one (e.g. `Shopware.Component.extend('sw-custom-field', 'sw-text-field', { template });`). Register the override/extension file from main.js so it loads. Inside the imported Twig template, target the component's named Twig blocks with `{% block block_name %}...{% endblock %}` to replace the block's content entirely, or call `{% parent %}` inside the block to keep the original inherited markup and append/prepend your own (e.g. for sw-dashboard-index you would override its headline block similarly, replacing or extending the block that renders the dashboard headline). To extend a method or computed property while keeping the original logic, call this.$super('methodName') from the override's config. For components already migrated to the Composition API, an experimental (no committed release timeline) extension system exists instead, using Shopware.Component.createExtendableSetup and Shopware.Component.overrideComponentSetup()('componentName', callback) — this only supports overriding, not extending, and exposes private state via previousState._private with no TypeScript support, so it is not recommended for production use yet. Multiple plugins overriding the same component are applied in registration order.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-components.md:1-73"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "extend component", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "override.*block|twig block", "path": "platform/dev/6.7/guides/plugins/plugins/administration", "mode": "files", "regex": true}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-components.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-03": {"query": "My ERP integration stopped logging in after the 6.7 upgrade — what changed in the Admin API OAuth flow (`/api/oauth/authorize`, the `scope` format)?", "category": "gap", "option": "mcp-wiki", "answer": "Nothing relevant found. The wiki's Admin API concept page (`platform/dev/6.7/concepts/api/admin-api.md`) only states that the Admin API gives CRUD access to entities and points to the external Stoplight reference for 'authentication methods' without detailing them. The auth guide (`platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md`) documents `/api/oauth/token` with `grant_type=password` (local-only, `scopes: write`) versus `client_credentials` for real integrations, but says nothing about `/api/oauth/authorize`, any 6.7 scope-format change, or a login regression tied to the 6.7 upgrade. No page in the 6.7 developer tree mentions a change to the OAuth authorize endpoint or scope format between versions. I could not find material in this corpus that answers this question.", "citations": ["platform/dev/6.7/concepts/api/admin-api.md:1-28", "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md:1-44"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "oauth/authorize|scope format|OAuth2", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "scope", "path": "platform/dev/6.7/concepts/api", "mode": "content"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/concepts/api/admin-api.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md"}}, {"tool": "grep_docs", "args": {"pattern": "ERP integration", "path": "platform/dev/6.7", "mode": "count"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "dev-43": {"query": "My admin plugin still ships a webpack.config.js — how do I move the administration build to Vite for Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "Shopware 6.7 replaces the Webpack-based Administration build with Vite (Webpack had become slow and its maintainers/loaders no longer receive significant updates); the wiki notes this is a future-development-roadmap article so details may still change. Migration steps for a plugin: 1) create `vite.config.mts` in `YourApp/src/Resources/app/administration/src` (replacing the old `webpack.config.js` that lived under `YourApp/src/Resources/app/administration/build/`); 2) remove the old `webpack.config.js`; 3) remove Webpack-related dependencies from `package.json`; 4) add the Vite dependencies to `package.json`. A minimal config example given: `import { defineConfig } from 'vite'; export default defineConfig({ resolve: { alias: { '@example': 'src/example' } } });`. Apps are unaffected since their build is already decoupled from Shopware. You can test the new system via the `ADMIN_VITE` feature flag. Bundle/plugin info is written to `<shopwareRoot>/var/plugins.json` by `Shopware\\Core\\Framework\\Plugin\\Command\\BundleDumpCommand` (`bin/console bundle:dump`, or as part of `composer build:js:admin`/`watch:admin`). Extensions are built via `<shopwareRoot>/src/Administration/Resources/app/administration/build/plugins.vite.ts`, still invoked through `composer build:js:admin`; the core's own Vite config only covers the core, not extensions. In production, asset info is fetched via `/api/_info/config` and loaded through the Symfony `pentatrion_vite` bundle plus a generated `entrypoints.json` (from `vite-plugin-symfony`); in dev/HMR mode, `shopware-vite-plugin-serve-multiple-static` serves an `sw-plugin-dev.json` requested by `application.ts`. Gotcha: Vite can only hot-reload `.vue` files, so HMR stays limited until templates fully move to Single File Components; the `vue-globals` plugin rewrites Vue imports to destructure from `Shopware.Vue` to avoid multiple Vue instances, and `override-component` auto-registers `*.override.vue` files via `Shopware.Component.registerOverrideComponent`.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/vite.md:1-58"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "vite", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/administration/vite.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-45": {"query": "Shopware.State is deprecated in 6.7 — how do I convert my administration Vuex module into a Pinia store?", "category": "dev", "option": "mcp-wiki", "answer": "With Shopware 6.7, Vuex is replaced by Pinia as the Administration's state management library. Register a store with `Shopware.Store.register('<storeName>', { state, getters, actions })`, where `state` must be a function returning the initial state (not a static object), e.g.: `const store = Shopware.Store.register('<storeName>', { state: () => ({ /* initial state */ }), getters: { /* ... */ }, actions: { /* ... */ } }); export default store;`. A store can be registered with an `id` property instead of a name argument; re-registering an existing store id overwrites it, and `Shopware.Store.unregister('<storeName>')` removes one. To register a store, simply import its file — `import './state/products.state'` replaces the old `Shopware.State.registerModule('product', productsStore)`. Key differences from Vuex: mutations are removed entirely — update state directly inside actions (e.g. `this.productName = newName`); getters cannot share a name with a state property since both are exposed at the same level; for TypeScript, define `StoreType` via `ReturnType<typeof store>` and extend the global `PiniaRootState` interface with it for typed access; stores can also be defined as composables returning reactive refs/computed/functions (Pinia devtools only track returned variables and functions); access changes from `Shopware.State.get('<storeName>')` to `Shopware.Store.get('<storeName>')`. For tests, import the store file to register it and call `store.$reset()` in `beforeEach`; component tests using Pinia stores should call `setActivePinia(pinia)` with a `createPinia()` instance and pass `plugins: [pinia]` to the mount config. Gotchas: a Pinia `getters` entry with the same name as a `state` property is not allowed, and Vuex `mutations` have no Pinia equivalent.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/pinia.md:1-55"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/administration/pinia.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-56": {"query": "Header and footer are loaded through ESI sub-requests in Shopware 6.7, so page data is gone in my header template — how do I pass my own data into the header/footer now?", "category": "dev", "option": "mcp-wiki", "answer": "Since the Storefront header and footer are now loaded via ESI sub-requests, they no longer depend on the current page's data by default. To pass current-page data into the ESI request, extend `base.html.twig` and override the `base_esi_header` (or `base_esi_footer`) block to merge extra parameters, e.g.: `{% sw_extends '@Storefront/storefront/base.html.twig' %} {% block base_esi_header %} {% set headerParameters = headerParameters|merge({ 'vendorPrefixPluginName': { 'activeRoute': activeRoute } }) %} {{ parent() }} {% endblock %}`. `headerParameters` (and `footerParameters`) are passed as query parameters to the header/footer ESI route, so they must contain scalar values only. Read the value back in the header template by extending `layout/header.html.twig`: `{% sw_extends '@Storefront/storefront/layout/header.html.twig' %} {% block header %} {{ dump(headerParameters.vendorPrefixPluginName.activeRoute) }} {{ parent() }} {% endblock %}`. In plugins, `StorefrontRenderEvent` can also inject data — guard it by checking the current route is `frontend.header`, then set `$event->setParameter('headerParameters', $headerParameters)`. It's also possible to load an entirely custom header/footer template (as core does for the checkout confirm page), but this overwrites customizations from every other extension, and the custom template must still receive the `header`/`footer` data it extends. For data unrelated to the current page, the separate 'Add data to storefront page' guide applies instead. Source: https://developer.shopware.com/docs/guides/plugins/plugins/storefront/templates/customize-header-footer.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-header-footer.md:1-74"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "ESI", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-header-footer.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-16": {"query": "How do I run plugin logic whenever an order is written, and find out exactly which fields changed?", "category": "dev", "option": "mcp-wiki", "answer": "Implement `Symfony\\Component\\EventDispatcher\\EventSubscriberInterface` and subscribe to `Shopware\\Core\\Checkout\\Order\\OrderEvents::ORDER_WRITTEN_EVENT`; inside the handler check `$event->getContext()->getVersionId() !== Defaults::LIVE_VERSION` to react only to the live version (editing an order in the admin creates a new draft version merged later into the live version, which is usually not the state you want to react to). A changeset of exactly what changed is not generated by default for performance reasons — to force one, additionally subscribe to `PreWriteValidationEvent::class`, and inside that listener, for each of `$event->getCommands()` that is `instanceof ChangeSetAware` and whose `getEntityName() === OrderDefinition::ENTITY_NAME`, call `$command->requestChangeSet()`. Then, in the `ORDER_WRITTEN_EVENT` handler, read `$result->getChangeSet()` from each item of `$event->getWriteResults()`. Note an 'insert' command cannot produce a changeset since nothing changed yet, and changeset generation should be narrowed to only the entity/version needed since it costs performance.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/order/listen-to-order-changes.md:1-52"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/order/listen-to-order-changes.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-10": {"query": "How do dynamic product groups work in the administration and where can the resulting group be used?", "category": "func", "option": "mcp-wiki", "answer": "Dynamic product groups are configured under Catalogues > Dynamic product groups. You give the group a Name (required) and optional Description, and choose whether to 'Keep matching variants grouped' (grouped under the shared main product when enabled; shown individually when disabled). You then build the group's membership from Conditions: pick a property and a condition, chain further conditions with AND or OR, and nest indefinitely with SUB-CONDITION (an item must satisfy the main condition and the sub-condition); a context menu on a condition lets you insert a new condition before/after it, and Preview shows the currently matching products. For multi-value properties (products, categories, manufacturers, tags, properties) the available operators are Is equal to / Is not equal to / Is equal to any of / Is not equal to any of / Is equal to all of / Is not equal to all of. Custom fields can be used as a condition property alongside standard ones, and delivery-time conditions use the merchant's defined delivery times (deleting a delivery time used in a condition breaks that condition). The overview list shows each group's name, description, last-change date and status, and marks a group invalid if it depends on rules from a currently deactivated plugin. The resulting dynamic product group can then be used to fill category content dynamically (e.g. sale or manufacturer categories), to feed product comparison content, and to power the product slider CMS element in Shopping Experiences. (Source: platform/func/shopware-6-de/Catalogues/Dynamicproductgroups.md, https://docs.shopware.com/en/shopware-6-de/Catalogues/Dynamicproductgroups)", "citations": ["platform/func/shopware-6-de/Catalogues/Dynamicproductgroups.md:1-70"], "toolCallLog": [{"tool": "kb_status", "args": "{}"}, {"tool": "read_doc", "args": "{ path: 'platform/index.md' }"}, {"tool": "grep_docs", "args": "{ pattern: 'dynamic product group', path: 'platform/func', mode: 'files' }"}, {"tool": "read_doc", "args": "{ path: 'platform/func/shopware-6-de/Catalogues/Dynamicproductgroups.md' }"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-31": {"query": "How do I expose a plugin configuration value, such as a colour picked in the Administration, as an SCSS variable in my Storefront styling?", "category": "dev", "option": "mcp-wiki", "answer": "Instead of declaring the variable statically in config.xml, subscribe to the ThemeCompilerEnrichScssVariablesEvent event (register the subscriber as a kernel.event_subscriber tagged service). In the subscriber's handler you inject SystemConfigService and read the plugin's config value, e.g. $this->systemConfig->get('SwagBasicExample.config.sassPluginHeaderBgColor', $event->getSalesChannelId()) — this makes the value sales-channel-aware since plugins are not sales-channel-specific by default. Then call $event->addVariable('sass-plugin-header-bg-color', $value) to expose it as $sass-plugin-header-bg-color in SCSS (the leading $ is added automatically); addVariable also accepts an optional $sanitize flag to strip special characters and quote the value. You should also declare a fallback default in the plugin's base.scss, e.g. `$sass-plugin-header-bg-color: #ffcc00 !default;`, so the theme still compiles if the subscriber hasn't run yet. To expose every config field at once, loop over $this->systemConfig->get('SwagBasicExample.config', $salesChannelId) and convert each key with CamelCaseToSnakeCaseNameConverter before calling addVariable() for each one.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md:1-63"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "scss variable", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-09": {"query": "How do I make a field on my plugin's own entity translatable per language?", "category": "dev", "option": "mcp-wiki", "answer": "Add a translation table, an `EntityTranslationDefinition`, a `TranslationEntity`, and wire the main entity's `TranslatedField` to it. Steps: (1) create a migration for a `<entity>_translation` table, named by appending `_translation` to the entity's table name (e.g. `swag_example_translation`); required columns are `<entity>_id` (FK to the entity), `language_id` (FK to `language`), the translated column(s) (e.g. `name`), `created_at`, `updated_at`, with the primary key being `(<entity>_id, language_id)`. (2) Create `ExampleTranslationDefinition extends Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityTranslationDefinition`, override `getParentDefinitionClass()` to return the parent entity's definition class, and define the translated column(s) with `StringField`. (3) Register both definitions in `services.php` with the `shopware.entity.definition` tag, registering the translation definition after the parent entity's definition. (4) Create `ExampleTranslationEntity extends Shopware\\Core\\Framework\\DataAbstractionLayer\\TranslationEntity` with getters/setters for the translated field(s) and the association back to the parent entity, then override `getEntityClass()` on the definition to return it. (5) Create an `ExampleTranslationCollection extends EntityCollection` the same way as for a normal entity. (6) On the main entity's definition, add a `TranslatedField('name')` and a `TranslationsAssociationField(ExampleTranslationDefinition::class, 'swag_example_id')`. Reading translated data prefers `entity.translated.field` in storefront/sales-channel contexts, and `entity.field` in Admin/CRUD flows. Gotchas: the translation definition must be registered in `services.php` after the entity it translates, and the translation table's foreign keys (`<entity>_id`, `language_id`) both cascade on delete and update.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-translations.md:1-53"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "custom.*entity.*definition|add-custom-complex-data", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-translations.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}}}, "scored": {"mcp-wiki": {"dev-01": {"caseId": "dev-01", "option": "mcp-wiki", "category":     panel.appendChild(el('h2', { text: 'Corpus' }));
    var corpusKv = el('dl', { class: 'kv' });
    corpusKv.appendChild(el('dt', { text: 'Name' }));
    corpusKv.appendChild(el('dd', { text: corpus.name }));
    corpusKv.appendChild(el('dt', { text: 'Probe' }));
    corpusKv.appendChild(el('dd', { text: probe && probe.ok !== undefined ? ((probe.ok ? 'ok' : 'failed') + (probe.detail ? ' — ' + probe.detail : '')) : null }));
    Object.keys(fp).forEach(function (k) {
      corpusKv.appendChild(el('dt', { text: k }));
      corpusKv.appendChild(el('dd', { text: fp[k] }));
    });
    panel.appendChild(corpusKv);

    panel.appendChild(el('h2', { text: 'Yardstick' }));
    var yardstick = scores.yardstick || {};
    var ykv = el('dl', { class: 'kv' });
    ['casesMdSha', 'rubricSha', 'briefSha'].forEach(function (k) {
      ykv.appendChild(el('dt', { text: k }));
      ykv.appendChild(el('dd', { text: yardstick[k] }));
    });
    panel.appendChild(ykv);

    if (scores.runs && Object.keys(scores.runs).length) {
      panel.appendChild(el('h2', { text: 'Runs (compare)' }));
      var rkv = el('dl', { class: 'kv' });
      Object.keys(scores.runs).forEach(function (k) {
        rkv.appendChild(el('dt', { text: k }));
        rkv.appendChild(el('dd', { text: scores.runs[k] }));
      });
      panel.appendChild(rkv);
    }

    panel.appendChild(el('h2', { text: 'Selector' }));
    panel.appendChild(el('p', { text: dash(scores.casesSelector) }));

    if (warnings.length) {
      panel.appendChild(el('h2', { text: 'Warnings' }));
      var ul = document.createElement('ul');
      warnings.forEach(function (msg) { ul.appendChild(el('li', { text: msg })); });
      panel.appendChild(ul);
    }

    panel.appendChild(el('h2', { text: 'scores.json' }));
    var details = document.createElement('details');
    details.appendChild(el('summary', { text: 'Show raw scores.json' }));
    details.appendChild(prettyJson(scores));
    panel.appendChild(details);
  })();

})();
</script>
</body>
</html>
