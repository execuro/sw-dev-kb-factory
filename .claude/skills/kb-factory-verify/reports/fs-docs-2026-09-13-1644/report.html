your_role'` to `navigation` or `settingsItem` entries, and protect keyboard shortcuts by making the shortcut config an object with an `active()` method returning `this.acl.can(...)`. Add snippet translations at paths `sw.privileges.${category}.${key}.label` (and `sw.privileges.${category}.${key}.${role_key}` for additional_permissions). To check a privilege in a component or template, inject the `acl` service (`inject: ['acl']`) and call `this.acl.can('key.role')` (e.g. `this.acl.can('sales_channel.creator')`), or use `acl.can('review.editor')` directly in a template with `v-if` or `:disabled`. Finally, if you need to add custom privileges to existing built-in roles (rather than defining a whole new key), override the `enrichPrivileges()` method in your Plugin base class (extending `Shopware\\Core\\Framework\\Plugin`) and return an array keyed by role identifier (e.g. 'product.viewer') mapping to arrays of privilege strings; an event subscriber applies these at runtime.","citations":["developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:1-447"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-37":{"query":"How do I set up and run PHPUnit integration tests for my Shopware plugin, including tests that boot the kernel?","category":"dev","option":"fs-docs","answer":"Create a `phpunit.xml` in the plugin root (it can be auto-generated with `bin/console plugin:create`). It should set `bootstrap=\"tests/TestBootstrap.php\"`, define `server` var `KERNEL_CLASS` = `Shopware\\Core\\Kernel`, set `APP_ENV=test`, `APP_DEBUG=1`, `SYMFONY_DEPRECATIONS_HELPER=weak`, and declare testsuites pointing at your test directories (e.g. `Test` and `Migration/Test`). The generated `tests/TestBootstrap.php` uses `Shopware\\Core\\TestBootstrapper` — `(new TestBootstrapper())->addCallingPlugin()->addActivePlugins('YourPlugin')->setForceInstallPlugins(true)->bootstrap()->getClassLoader()` — and `setForceInstallPlugins(true)` ensures your plugin is installed/active even if the test database already existed. For an integration test that needs the kernel/container/database, extend PHPUnit's `TestCase` and use the `Shopware\\Core\\Framework\\Test\\TestCaseBase\\IntegrationTestBehaviour` trait, which automatically wraps each test in a database transaction and clears the cache before each test (example: `UsedClassesAvailableTest` in `<plugin root>/src/Test/`). For tests that specifically need a database connection from the container (e.g. migration tests), use the `KernelTestBehaviour` trait instead and fetch services via `$this->getContainer()->get(Connection::class)`. To override services for the test environment only (e.g. mock a service that deletes files or calls an external API), add a `<plugin root>/Resources/config/services_test.php` file, which overrides `services.php` only when running tests. To execute the tests, run the PHPUnit binary from `vendor/bin`, e.g. `./vendor/bin/phpunit --configuration=\"custom/plugins/SwagBasicExample\"` to run all testsuites, add `--testsuite \"migration\"` to run only one testsuite, or `--filter testName`/`--filter TestClassName` to run a single method or class. If PHPUnit isn't available yet in your project setup, install the `dev-tools` package via `composer require --dev dev-tools`.","citations":["developer/guides/development/testing/unit/php-unit.md:1-215"],"toolCallLog":[{"tool":"Bash","args":"find development/testing -type f (cwd docs/shopware-knowledge-bases/developer/guides)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/testing/unit/php-unit.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-38":{"query":"How do I write Jest unit tests for my Administration components in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Shopware's Administration testing guide uses Jest with Vue Test Utils. Test files sit next to the file under test with the suffix `.spec.js`/`.spec.ts`. Because Administration components support template inheritance/extension, you build the actual component via the global `Shopware.Component.build('component-name')` (after importing/registering the component file, e.g. `import 'src/app/component/base/sw-alert';`) rather than importing a plain Vue component, then mount it with `shallowMount` (preferred over `mount`) from `@vue/test-utils`. You can scaffold a spec file automatically with `composer run admin:create:test` (paste the component/service path when prompted); before running tests install JS dependencies with `composer run init:js`. Run all Administration unit tests with `composer run admin:unit` (full coverage) or `composer run admin:unit:watch` (watches changed files) — these PSH commands apply to the Shopware-provided Administration itself; plugins using their own unit tests may need their own scripts. A typical test structure: `beforeEach` creates the wrapper via `shallowMount(Shopware.Component.build('sw-your-component'), { props, stubs, mocks, attachTo: document.body })`, `afterEach` destroys the wrapper and flushes promises, and tests assert on `wrapper.vm` or DOM content (e.g. `wrapper.find('.sw-alert__message').text()`). Missing child components need to be either imported/registered before mounting or provided via `stubs`. Shopware's test setup provides many preconfigured mocks/helpers: set ACL privileges per test via `global.activeAclRoles = ['product.editor']`; enable feature flags via `global.activeFeatureFlags = [...]`; the repository factory works automatically from the generated entity schema and logs example mock responses (`global.repositoryFactoryMock.responses.addResponse({...})`) whenever an unmocked API route is hit; global directives, filters, and the `Shopware` context/`Shopware.Store` are set up by default and can be overridden; common globals like `$tc`, `$device`, `$store`, `$router` are auto-mocked but can be overridden via the `mocks` option. For missing custom directives (e.g. `v-clipboard`) use `createLocalVue()` and `localVue.directive('clipboard', {})`, passing `localVue` to the mount call. For missing injections (e.g. `mediaService`), stub them via the `provide` option (e.g. `provide: { mediaService: { renameMedia: () => Promise.resolve() } }`) or register a mocked service upfront with `Shopware.Service.register('mediaService', {...})` in `beforeAll`.","citations":["developer/guides/development/testing/unit/jest-admin.md:1-599"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/testing/unit/jest-admin.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-39":{"query":"How do I write end-to-end Cypress tests for my plugin against a Shopware 6.7 store?","category":"dev","option":"fs-docs","answer":"According to the corpus, Cypress-based E2E testing is now documented under a 'Legacy' section, with an explicit notice: 'Cypress has been deprecated and is no longer maintained. We recommend using Playwright for new projects.' So for a Shopware 6.7 store, the currently recommended approach for new E2E tests is Playwright (documented separately under development/testing/e2e-playwright/), not Cypress. That said, the corpus still documents the legacy Cypress workflow if needed: you need a clean Shopware installation (e.g. `composer run init`), and E2E dependencies installed via `npm install` in the plugin's e2e test folder (e.g. `Resources/app/<environment>/test/e2e`). For a plugin, create the folder structure `Resources/app/<environment>/test/e2e/cypress/{fixtures,integration,plugins,support}`, run `npm init -y`, add an `open` script (`node_modules/.bin/cypress open`), install `@shopware-ag/e2e-testsuite-platform`, and wire up `cypress/plugins/index.js` and `cypress/support/index.js` to require that package's plugins/support. Run the tests with `CYPRESS_baseUrl=<your-url> npm run open` from the plugin's e2e folder (pointing at your Storefront URL) to open the Cypress test runner. Tests are plain JavaScript using Mocha-style `describe()`/`it()` blocks, Cypress commands (`cy.get(...).click()`, `.type()`, etc.) to perform actions, and Chai/BDD-style assertions (`.should(...)`). Use `beforeEach`/`afterEach` hooks to clean up state before each test rather than relying on `after`. Test data should be created via the REST API using fixtures stored as JSON under `cypress/fixtures` (loaded with `cy.fixture()`) and helper commands like `cy.createDefaultFixture('tax')`, rather than through the UI, to keep tests isolated and fast; custom fixture services can extend `AdminFixtureService` for entities that need related IDs resolved first.","citations":["developer/guides/development/testing/legacy/index.md:1-12","developer/guides/development/testing/legacy/cypress/index.md:1-473"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/testing/legacy/index.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/testing/legacy/cypress/index.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"dev-40":{"query":"How do I upgrade a Composer-based Shopware project from 6.6 to 6.7 — which composer.json constraint do I change, and which console commands do I run afterwards?","category":"dev","option":"fs-docs","answer":"The recommended path is the Shopware CLI upgrade wizard (`shopware-cli project upgrade`, or `--no-interaction --target latest-patch --dry-run` for CI/preflight), which handles readiness checks, extension compatibility, Composer resolution, and the local upgrade with a report. If you cannot use the CLI wizard, the manual Composer path is: (1) optionally enable maintenance mode on a running environment with `bin/console sales-channel:maintenance:enable --all`; (2) before updating, adjust the required Shopware version constraint in `composer.json` to the target version (e.g. to 6.7) — and if you use the Commercial plugin, also update the `shopware/commercial` requirement to a compatible version; skipping this step means `composer update` will just re-resolve to the currently installed version and no real upgrade happens; (3) run `composer update --no-scripts` to update all Composer packages without executing scripts (which would otherwise reference Shopware CLI commands that only work after updated recipes are installed); (4) optionally run `composer recipes:update` to force-update Symfony Flex-managed configuration files, reviewing the changes before committing; (5) finalize with `bin/console system:update:finish`, which runs the required update routines for the newly installed version, including database migrations and recompiling themes; (6) afterwards, disable maintenance mode with `bin/console sales-channel:maintenance:disable --all`. Best practices around this: start from a clean git tree with a database backup, review release notes/UPGRADE files, check extension compatibility, avoid skipping major versions without testing the full path, commit composer.json/composer.lock and review recipe changes, then clear caches, rebuild Administration/Storefront assets if needed, and smoke-test checkout/login/API and installed extensions afterward.","citations":["developer/guides/upgrades-migrations/upgrade-shopware.md:1-108"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/upgrade-shopware.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-41":{"query":"`composer update` to Shopware 6.7 aborts on a platform requirement and my admin build then fails too — which PHP, database and Node versions does 6.7 actually require, and how do I check the machine I am on against them before I retry?","category":"dev","option":"fs-docs","answer":"Shopware 6's officially supported stack (as documented in the Hosting guide, which covers recommended application stack and supported versions) requires: PHP 8.2+ (recommended 8.4) with memory_limit >= 512M, max_execution_time >= 30s, and the extensions ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, openssl, pcre, pdo_mysql, phar, simplexml, xml, xmlreader, zip, zlib (optional: amqp), plus Composer 2.2+ recommended. Database: MariaDB >= 10.11.6 or MySQL >= 8.0.22 (Innovation releases not supported); recommended MariaDB 11.4 / MySQL 8.4, with max_allowed_packet >= 32M. Node.js/npm: Node 20.0.0+ required, recommended Node 24 / npm 10 (needed for the admin/storefront build). To check your machine against these before retrying the composer update/admin build, the docs recommend running: `php -v` (CLI PHP version), `php -m` (list PHP modules), `php -i | grep memory_limit` (PHP memory limit), `composer -V` (Composer version), `node -v` (Node version), and `npm -v` (npm version). Note that CLI and FPM PHP binaries can differ, so make sure you're checking the binary actually used by Composer/build tooling.","citations":["developer/guides/hosting/index.md:15-47"],"toolCallLog":[{"tool":"Read","args":"file_path=<home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"find <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer -iname \"*upgrade*\" -not -path '*/.git/*'"},{"tool":"Bash","args":"ls <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/"},{"tool":"Read","args":"file_path=<home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/index.md"},{"tool":"Read","args":"file_path=<home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/upgrade-shopware.md"},{"tool":"Bash","args":"grep -rli \"system requirements|requirements\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/installation/ ; find ... -iname \"*requirement*\""},{"tool":"Read","args":"file_path=<home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/installation/system-requirements.md"},{"tool":"Bash","args":"grep -rl \"PHP 8|MySQL|MariaDB|Node\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/hosting/"},{"tool":"Read","args":"file_path=<home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/hosting/index.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-42":{"query":"How do I check extension compatibility before upgrading with shopware-cli, and why does it report my plugins in custom/plugins as blocking?","category":"dev","option":"fs-docs","answer":"Use `shopware-cli project upgrade` (interactively) or `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run` for a non-interactive preflight/CI check. After choosing a target version, the wizard analyzes extension compatibility using two sources: extension/repository (Store) metadata for an early compatibility signal, and an actual Composer dry-run resolution against the target dependency set — Composer resolution is the final gate, and if it can resolve a previously-uncertain extension, that overrides a stale metadata blocker. The extension queue buckets each extension as ready, needs an update, needs manual review, or blocked. You can also run `shopware-cli project validate` beforehand to catch references to removed/renamed Shopware PHP types in custom code (see the breaking-changes validation doc). The reason plugins under custom/plugins are reported as blocking is that the wizard resolves and pins extension versions through Composer, and extensions living outside `vendor/` (e.g. in custom/plugins) cannot participate in that Composer resolution, so they fail the upgrade readiness check. The fix is to migrate eligible locally managed extensions into Composer first with `shopware-cli project autofix composer-plugins` (see 'Migrate custom/plugins extensions to Composer' in the autofix docs) before re-running the upgrade wizard.","citations":["developer/products/tools/cli/project-commands/upgrade.md:15-41","developer/products/tools/cli/project-commands/upgrade.md:62-121"],"toolCallLog":[{"tool":"Read","args":"file_path=<home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/products/tools/cli/project-commands/upgrade.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-43":{"query":"My admin plugin still ships a webpack.config.js — how do I move the administration build to Vite for Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Shopware switched the Administration build from Webpack to Vite in Shopware 6.7 because Webpack (and its loaders) had become slow, outdated, and effectively unmaintained. Apps are unaffected since their build is already decoupled; for plugins, you only need to act if you currently extend the webpack config via your own `webpack.config.js`. Migration steps: 1) Create a new `vite.config.mts` file in your plugin at `YourApp/src/Resources/app/administration/src` (the old webpack.config.js lived in `YourApp/src/Resources/app/administration/build/`). 2) Remove the old `webpack.config.js` file. 3) Remove all webpack-related dependencies from your `package.json`. 4) Add the Vite dependencies to `package.json`. A basic old-webpack alias config `module.exports = () => ({ resolve: { alias: { '@example': 'src/example' } } })` becomes, in Vite, `import { defineConfig } from 'vite'; export default defineConfig({ resolve: { alias: { '@example': 'src/example' } } });`. Depending on how complex your webpack config is, migration effort can vary; consult the Vite config docs for advanced options. The build/dev commands stay the same from the developer's perspective: `composer build:js:admin` builds the administration with all extensions (extensions are built via `src/Administration/Resources/app/administration/build/plugins.vite.ts` using Vite's JS API, driven by the bundle list in `var/plugins.json` generated by `php bin/console bundle:dump`), and `composer watch:admin` still runs the dev/HMR server. You can test the new build system today via the `ADMIN_VITE` feature flag.","citations":["developer/guides/upgrades-migrations/administration/vite.md:14-92"],"toolCallLog":[{"tool":"Bash","args":"ls <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/administration/"},{"tool":"Read","args":"file_path=<home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/administration/vite.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-44":{"query":"After the Vue 3 upgrade my admin plugin broke — this.$parent resolves to the wrong component and a prop default that calls this.$tc throws. What do I have to change?","category":"dev","option":"fs-docs","answer":"Both issues are documented as known Vue 3 migration issues for the Shopware administration (Vue 3 since Shopware 6.6). `this.$parent`: Vue 3 wraps asynchronous components in an `AsyncWrapperComponent`, so the virtual DOM tree differs from Vue 2 — where `this.$parent` worked in Vue 2, in Vue 3 you may need `this.$parent.$parent` instead. The docs recommend avoiding `this.$parent` communication altogether as an anti-pattern, and using services or event communication instead. Prop default: in Vue 3, prop default functions no longer have access to the component's `this` scope, so you can no longer call `this.$tc` inside a prop default function — use `Shopware.Snippet.tc` instead. More generally, the migration guide suggests searching your code for `this.<!doctype html>

peof store>` and extend the global `PiniaRootState` interface). Stores can also be defined as composables (functions returning refs/computed/functions) rather than the state/getters/actions object shape. For testing, import the store file to register it and call `store.$reset()` in `beforeEach`; for component tests, create a Pinia instance with `createPinia()`, `setActivePinia(pinia)`, and pass it via `global: { plugins: [pinia] }` when mounting.","citations":["developer/guides/upgrades-migrations/administration/pinia.md:7-263"],"toolCallLog":[{"tool":"Read","args":"file_path=<home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/administration/pinia.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-46":{"query":"sw-button and sw-card are deprecated in Shopware 6.7 — how do I migrate my plugin's admin templates to the Meteor components, and is there a codemod that does it?","category":"dev","option":"fs-docs","answer":"Yes, there is an official codemod tool. With Shopware 6.7, several administration components (such as sw-button, sw-card) are being replaced by components from the Meteor Component Library, Shopware's official shared component collection built on the Shopware Design System (chosen for consistent design/behavior, reusability, and centralized maintenance). To migrate, ensure a development installation of Shopware is set up and your plugin is located in the `custom/plugins` folder, then run: `composer run admin:code-mods` (running it alone prints help text), or with arguments: `composer run admin:code-mods -- --plugin-name example-plugin --fix -v 6.7`, providing your plugin name and target Shopware version. The tool automatically replaces compatible components with their Meteor equivalents, adds guidance comments where manual migration is required, and fixes some other deprecated code where possible. For dual-compatibility with both 6.6 and 6.7 without migrating immediately, Shopware components now accept a `deprecated` prop (default `false`, so the new Meteor component is used by default): `<sw-button />` renders `mt-button` in 6.7 and `sw-button-deprecated` in 6.6, while `<sw-button deprecated />` renders `sw-button-deprecated` in both 6.6 and 6.7. The docs still recommend migrating to Meteor Components whenever possible rather than relying on the `deprecated` prop long-term.","citations":["developer/guides/upgrades-migrations/administration/meteor-components.md:14-85"],"toolCallLog":[{"tool":"Read","args":"file_path=<home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/administration/meteor-components.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-47":{"query":"My payment plugin implements `AsynchronousPaymentHandlerInterface` and is tagged `shopware.payment.method.async` — how do I write a payment handler for Shopware 6.7 instead?","category":"dev","option":"fs-docs","answer":"From Shopware 6.7.0.0, all payment handling is unified into a single `Shopware\\Core\\Checkout\\Payment\\Cart\\PaymentHandler\\AbstractPaymentHandler` abstract class, replacing the old `PaymentHandlerInterface` family. Migration mapping: `SynchronousPaymentHandlerInterface` -> implement `pay()` (always called during checkout); `AsynchronousPaymentHandlerInterface` -> `pay()` returns a `RedirectResponse` and `finalize()` is called only when `pay` returned a redirect; `PreparedPaymentHandlerInterface` -> implement `validate()` (always called, used to validate the cart during checkout) — note that its old `capture` method is gone and its logic now goes into the streamlined `pay()` method; `RecurringPaymentHandlerInterface` -> implement `recurring()`, and `supports()` must return true for `PaymentHandlerType::RECURRING`; `RefundPaymentHandlerInterface` -> implement `refund()`, with `supports()` returning true for `PaymentHandlerType::REFUND`. Concretely, extend `AbstractPaymentHandler`, implement `supports(PaymentHandlerType $type, string $paymentMethodId, Context $context): bool` to declare which handler types you support, and implement `pay(Request $request, PaymentTransactionStruct $transaction, Context $context, ?Struct $validateStruct): ?RedirectResponse` — for the async case, call your external gateway, return a `RedirectResponse`, throwing `PaymentException::asyncProcessInterrupted(...)` on failure; then implement `finalize(Request $request, PaymentTransactionStruct $transaction, Context $context): void` to check the payment result after the customer is redirected back, throwing `PaymentException::customerCanceled(...)` if canceled, and otherwise calling `$this->transactionStateHandler->paid(...)`. On the DI side, your handler must now carry a single tag, `shopware.payment.method`, on its service definition — remove the old tags `shopware.payment.method.sync`, `shopware.payment.method.async`, `shopware.payment.method.prepared`, `shopware.payment.method.recurring`, and `shopware.payment.method.refund`. Additionally, Shopware 6.7 requires a unique `technicalName` (plugin-specific prefixed) when registering the payment method entity (via `payment_method.repository`) — omitting it can prevent the plugin from installing/activating.","citations":["developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:146-273","developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:791-847"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"AsynchronousPaymentHandlerInterface|payment.method.async|PaymentHandler\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/"},{"tool":"Bash","args":"grep -rli \"payment\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/"},{"tool":"Read","args":"file_path=<home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-48":{"query":"After upgrading, my storefront JavaScript plugin no longer loads — how do I register it asynchronously with `PluginManager` and where does the compiled file have to be shipped?","category":"dev","option":"fs-docs","answer":"Storefront JS plugins are registered through the global `PluginManager` inside your plugin's `main.js` entry point, which Shopware automatically looks for at `<plugin root>/src/Resources/app/storefront/src/main.js`. A normal (synchronous) registration imports the plugin class at the top of `main.js` and calls `PluginManager.register('ExamplePlugin', ExamplePlugin, '[data-example-plugin]')`, which always bundles the plugin into the main `storefront.js`. To register it asynchronously instead, replace the static import with a dynamic import passed directly into `register()`: `PluginManager.register('ExamplePlugin', () => import('./example-plugin/example-plugin.plugin'), '[data-example-plugin]');`. Providing a dynamic/async import causes the PluginManager to automatically recognize the JS plugin as async, meaning it is not included in the main bundled `storefront.js`; it is only downloaded on demand when the given DOM selector (e.g. `[data-example-plugin]`) is found on the current page. This is useful to reduce initial JS payload for plugins that aren't needed on every page. Regarding shipped files: your source lives under `<plugin root>/src/Resources/app/storefront/src` (with `main.js` as the entry point), and Shopware compiles it to `<plugin root>/src/Resources/app/storefront/dist/storefront/js/<plugin-name>/<plugin-name>.js`, which is recognized automatically by Shopware — you must ship this compiled dist file with your plugin. To rebuild after changes, run `shopware-cli project storefront-build` (template/project setups) or `composer run build:js:storefront` (platform/contribution setups).","citations":["developer/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md:65-120","developer/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md:240-267"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"PluginManager\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/"},{"tool":"Read","args":"file_path=<home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-49":{"query":"My storefront controller still uses the `@Route` and `@RouteScope` annotations from 6.4 — what is the attribute form in Shopware 6.7 and how are the routes wired?","category":"dev","option":"fs-docs","answer":"The `@RouteScope` annotation was deprecated starting with the 6.5 major version (it was configured via a dedicated annotation prior to Shopware 6.4.11.0); routing is now expressed with PHP attributes instead of doc-block annotations. Define the route scope on the controller class using a `Route` attribute with a `defaults` array containing `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]`, e.g. `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]])] class ExampleController extends StorefrontController { ... }`. The `_routeScope` can also be set per method/route instead of at the class level. Individual endpoints are declared with the `Route` attribute on the controller method, e.g. `#[Route(path: '/example', name: 'frontend.example.example', methods: ['GET'])] public function showExample(): Response { ... }` — the route name should be prefixed with `frontend`, `widgets`, `payment`, `api` or `store-api` depending on its purpose (the first three identify it as a Storefront route); non-prefixed names require an `allowed_routes` config entry under `storefront.router` in `Resources/config/packages/storefront.yaml` (available since Shopware 6.7.2.0). Wiring: the controller must be registered as a public service in `services.php` (with `->public()->call('setContainer', [service('service_container')])`), and Shopware must be told to scan for its routes via a `routes.php` file that imports the controller with the `attribute` type loader: `$routes->import('../../Storefront/Controller/*Controller.php', 'attribute');`. The controller class then renders templates via `renderStorefront(...)`.","citations":["developer/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:23-190","developer/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:248-320"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"RouteScope|#[Route\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/"},{"tool":"Read","args":"file_path=<home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/controllers/add-custom-controller.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-50":{"query":"My `ScheduledTaskHandler` stopped running after the upgrade — how must a scheduled task and its handler be declared in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"A ScheduledTask and its ScheduledTaskHandler must both be registered in the plugin's `services.php` (located at `<plugin root>/src/Resources/config/services.php`, relative to the plugin's base class so Shopware finds it automatically). The task class is registered with the tag `shopware.scheduled.task`, and the handler is registered with the tag `messenger.message_handler` (plus any constructor args it needs, e.g. `scheduled_task.repository` and `logger` services). Both tags are required — if either is missing your task will not run. The task class itself must extend `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTask` and implement `getTaskName(): string` (vendor-prefixed technical name, e.g. `swag.example_task`) and `getDefaultInterval(): int` (interval in seconds). The handler class must extend `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTaskHandler`, be annotated with the PHP attribute `#[AsMessageHandler(handles: ExampleTask::class)]` from `Symfony\\Component\\Messenger\\Attribute\\AsMessageHandler`, and implement `run(): void` with the task's logic. If your task appears connected in the filesystem but doesn't run, check that both tags exist in services.php and that the `#[AsMessageHandler]` attribute correctly references your task class. If you don't want to reinstall the plugin to (re-)register the task, run `bin/console scheduled-task:register`; to test execution, run `bin/console scheduled-task:run` (starts the ScheduledTaskRunner, dispatches messages when due) and then `bin/console messenger:consume` to actually process dispatched messages — also verify the task's `status` is `scheduled` in the `scheduled_task` table (not needed if using the admin worker). Since Shopware 6.7.13.0, a handler can additionally implement `DynamicallyScheduledTaskHandler` with a `getNextExecutionTime()` method to control the next run time based on domain data instead of the fixed `runInterval`.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md:20-117","developer/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md:119-167"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"ScheduledTaskHandler|scheduled.task\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/plugins/"},{"tool":"Read","args":"file_path=<home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-51":{"query":"Custom entities declared in `Resources/config/entities.xml` no longer work for my plugin in Shopware 6.7 — how do I define and register a DAL entity with PHP attributes instead?","category":"dev","option":"fs-docs","answer":"Since Shopware v6.6.3.0 entities can be registered via PHP attributes instead of entities.xml. Define the entity by creating a class extending `Entity` and adding the `#[Entity('entity_name', collectionClass: ...)]` attribute (the `name` parameter is required and must be unique; `collectionClass` is optional, available since 6.6.9.0). Add a primary key property with `#[PrimaryKey]` plus `#[Field(type: FieldType::UUID)]`. Additional properties use the `#[Field(type: FieldType::...)]` attribute (types come from the `FieldType` enum, or you can pass a fully-qualified Field class name directly, available since 6.6.9.0). Special behaviors have their own attributes, e.g. `#[AutoIncrement]` and `#[ForeignKey(entity: '...')]`. JSON data with custom serialization uses `#[Serialized(serializer: ...)]`. Custom fields use the `EntityCustomFieldsTrait` or the `#[CustomFields]` attribute. To expose a field in the API set `api: true` (or a list of API source scopes) on the `Field` attribute — by default fields are not exposed. Translated fields use `translated: true` on `Field` (translated properties must be nullable) and a `#[Translations]` attribute can load all translations. Fields not type-hinted nullable are required by default, or can be forced with `#[Required]`. Associations use `#[OneToOne]`, `#[OneToMany]`, `#[ManyToOne]`, or `#[ManyToMany]` attributes. Once the entity class is defined, register it in the DI container's `services.php` by tagging the service with `shopware.entity`; Shopware then automatically creates the `EntityDefinition` and `EntityRepository`, registered as `<entity_name>.definition` and `<entity_name>.repository`. Getter/setter methods, EntityTranslationDefinition and EntityCollection classes are no longer needed with this pattern (though a custom collection class can still be specified).","citations":["developer/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md:1-621"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"grep -rl \"entities.xml\" $DEV; grep -rli \"MappedSuperclass|#[Entity|attribute.*entity\" $DEV | head -20 (path=docs/shopware-knowledge-bases/developer)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-52":{"query":"What must a plugin database migration class implement in Shopware 6.7, and where does the database cleanup on uninstall belong?","category":"dev","option":"fs-docs","answer":"A plugin migration class must extend `Shopware\\Core\\Framework\\Migration\\MigrationStep` and implement two methods: `getCreationTimestamp()`, which returns the timestamp embedded in the migration's file name (no need to change the generated value), and `update(Connection $connection): void`, in which you implement all schema and data changes for the plugin — this is what Shopware runs automatically when the plugin is installed or updated. `MigrationStep` also defines an optional `updateDestructive()` method used only by Shopware core for delayed, major-version destructive changes; plugin install/update never run `updateDestructive()`, so plugins should put all their needed changes into `update()`. There is no migration rollback mechanism — you do not reverse migrations inside the migration class. Cleaning up the database when the plugin is removed belongs in the plugin lifecycle's `uninstall()` method, not in a migration.","citations":["developer/guides/plugins/plugins/database/database-migrations.md:65-104"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"MigrationStep|database.*migration\" $DEV/guides (path=docs/shopware-knowledge-bases/developer/guides)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/database/database-migrations.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-53":{"query":"My theme config labels disappeared from the Theme Manager after 6.7 — how do I define `theme.json` config fields and where do their translations go now?","category":"dev","option":"fs-docs","answer":"The theme configuration lives in `<plugin root>/src/Resources/theme.json` under a `config.fields` object; each field key is the technical name used in the theme/SCSS. Supported field parameters include `type` (color, text, number, fontFamily, media, checkbox, switch, url), `editable`, `tab`, `block`, `section`, `custom`, `scss`, and `fullWidth`. The `label` and `helpText` parameters (inline translation objects keyed by locale code) are deprecated as of v6.8: translations for the Theme Manager (tabs, blocks, sections and fields) are now handled via Administration snippets instead of inline JSON translations. Store these under Administration snippet files, e.g. `<plugin root>/src/Resources/app/administration/src/app/snippet/de.json` and `en.json` (locale-specific `de-DE.json`/`en-GB.json` also supported and override the base files). Each snippet key starts with `sw-theme`, then the theme's technical name (or parent theme's, since snippets inherit), then the names of the relevant tab/block/section/field, ending in `.label` (or `.helpText` for fields); unnamed elements use `default`. Example key structure: `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.<fieldName>.label`. Field option translations get a numeric index appended, e.g. `...<fieldName>.<index>.label`. After changing `theme.json` you must run `bin/console theme:refresh` to apply the changes.","citations":["developer/guides/plugins/themes/configuration/theme-configuration.md:207-321","developer/guides/plugins/themes/configuration/theme-configuration.md:60-65"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"theme.json\" $DEV (path=docs/shopware-knowledge-bases/developer)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/themes/configuration/theme-configuration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-54":{"query":"How do I register a plugin cookie in the storefront cookie consent manager in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Adding a custom cookie requires listening to the `CookieGroupCollectEvent` and adding the cookie to the collection it carries (an event listener is recommended if you only listen to this single event; use a subscriber for multiple events). Register the listener in `<plugin root>/src/Resources/config/services.php` by tagging the service with `kernel.event_listener` for the event `Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent`. In the listener's `__invoke(CookieGroupCollectEvent $event)` method, get the desired cookie group from `$event->cookieGroupCollection` (e.g. via `CookieProvider::SNIPPET_NAME_COOKIE_GROUP_COMFORT_FEATURES`), obtain or create its `CookieEntryCollection` via `getEntries()`/`setEntries()`, and add a new `CookieEntry('my-cookie-key')` with properties like `name`, `value`, and `expiration`, then call `$entries->add($cookieEntry)`. Since Shopware 6.7.3.0, cookies use structured objects `CookieEntry` and `CookieGroup` instead of arrays (the array format via the now-deprecated `CookieProviderInterface` is still supported for backward compatibility on 6.7.2 and earlier plugins, but the event-based approach is recommended). Also since 6.7.3.0, cookie configurations include an automatically calculated hash; changing your plugin's cookies changes this hash and triggers a re-consent flow for users (hash stored per language ID in the browser's `cookie-config-hash` cookie, and exposed via the Store API endpoint `/store-api/cookie/groups`). After loading the storefront, the new cookie appears in the cookie consent manager.","citations":["developer/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md:1-155"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"cookie\" $DEV/guides (path=docs/shopware-knowledge-bases/developer/guides)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-55":{"query":"How do the breaking storefront accessibility changes reach my theme in Shopware 6.7, and what must an extension that overrides the affected Twig blocks do?","category":"dev","option":"fs-docs","answer":"Ensuring an accessible shop page can require changes to the HTML/Twig structure or CSS, which can break extensions that modify an area being changed. Because of this, breaking accessibility changes are not enabled by default before v6.7.0 — all accessibility changes with breaking impact were implemented behind a feature flag `ACCESSIBILITY_TWEAKS` (set `ACCESSIBILITY_TWEAKS=1` in `.env`, comparable to major flags like `V6_7_0_0`), so developers could check whether their extension is affected and prepare an adaptation. With the major version v6.7.0, all accessibility improvements become the default (the flag mechanism is how the changes were rolled out gradually before that). A typical rollout pattern is: the old markup/Twig block (e.g. `component_list_items` on a `<div>` list) is kept as the default branch, while an `{% if feature('ACCESSIBILITY_TWEAKS') %}` branch introduces the new accessible markup and block (e.g. `component_list_items_inner` producing `<ul>`/`<li>`), with a `@deprecated tag:v6.7.0` comment pointing at the new block. An extension overriding the affected block (via `sw_extends`) must add an override for the new block name (here `component_list_items_inner`) that assumes the new structure, so it works once the change becomes default in 6.7.0, while it can keep (and later remove after v6.7.0) its old override of the deprecated block for compatibility during the transition. After enabling the flag locally, a theme recompile (`bin/console theme:compile`) is needed to apply styling changes such as adjusted font sizes.","citations":["developer/guides/development/accessibility/storefront-accessibility.md:24-99","developer/guides/development/accessibility/storefront-accessibility.md:160-178"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"accessibility\" $DEV (path=docs/shopware-knowledge-bases/developer)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/accessibility/storefront-accessibility.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-56":{"query":"Header and footer are loaded through ESI sub-requests in Shopware 6.7, so page data is gone in my header template — how do I pass my own data into the header/footer now?","category":"dev","option":"fs-docs","answer":"With ESI loading, header and footer are now rendered via sub-requests and are no longer dependent on the current page data, so it is no longer possible to customize them based on current page data by default. To pass your own data into the header/footer you have two approaches: (1) In `Storefront/Resources/views/storefront/base.html.twig` there are two blocks, `base_esi_header` and `base_esi_footer`, that control the ESI include parameters. Extend `base.html.twig` in your plugin/app and override e.g. `base_esi_header`, merging into the `headerParameters` variable (e.g. `{% set headerParameters = headerParameters|merge({'vendorPrefixPluginName': {'activeRoute': activeRoute}}) %}`). These `headerParameters`/`footerParameters` are passed to the header/footer route as query parameters and forwarded to the header/footer template, where you can access them, e.g. `headerParameters.vendorPrefixPluginName.activeRoute`, in `storefront/layout/header.html.twig`. This works both in plugins and apps. (2) In plugins specifically, you can also listen to the `StorefrontRenderEvent` (e.g. in `StorefrontSubscriber`) — check the current route is `frontend.header` (or footer route), then read/merge into `$event->getParameter('headerParameters')` and set it back via `$event->setParameter('headerParameters', $headerParameters)`. Important: `headerParameters` and `footerParameters` can only contain scalar values, since they are also used as query parameters for the ESI routes. It's also still possible to add custom data directly to the header/footer per the 'Add data to storefront page' guide, or to load entirely custom header/footer templates (as done for the checkout confirm page in core), but that overwrites customizations from every other extension and requires ensuring `header`/`footer` data is still available if your custom template extends the original.","citations":["developer/guides/plugins/plugins/storefront/templates/customize-header-footer.md:1-104"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"\\besi\\b\" $DEV (path=docs/shopware-knowledge-bases/developer)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/templates/customize-header-footer.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-57":{"query":"B2B Suite support ends with 6.8 — how do I run the B2B Suite Migration to B2B Components and check that it finished?","category":"dev","option":"fs-docs","answer":"Two console commands drive the process: `b2b:migrate:commercial` starts the migration, and `b2b:migrate:progress` checks its status; it's recommended to run both simultaneously in separate terminal windows. Running `bin/console b2b:migrate:commercial` transfers all components and entities as defined in the configuration. You can restrict it to specific components by passing their technical names, e.g. `bin/console b2b:migrate:commercial quote_management shopping_list` — note the `employee_management` component is a prerequisite for all others and is always migrated first regardless of the order given; overall component order is governed by configurator priority defined in the service definition file. You can also control batch size with `--batch-size=100` to manage memory/performance. The migration command uses the message queue system to process in the background, so the migration may still be running after the command returns — use `bin/console b2b:migrate:progress` (optionally with `--watch` to auto-refresh every 5 seconds) in a separate terminal to monitor it in real time. The progress command shows a table with Total, Valid, Newly, Migrated, Pending, and Error record counts, plus a Status column with values `Complete` (finished successfully), `Pending`, `In progress`, `Complete with error` (check the `b2b_components_migration_errors` table), or `Has new records`. One component-specific caveat: for Budget Management (Commercial 7.6.0+), the Organization Unit of each budget will be empty after migration and must be manually reassigned afterward.","citations":["developer/products/extensions/b2b-suite-migration/execution/running-migration.md:1-102"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"b2b.*migration|migration.*b2b\" $DEV (path=docs/shopware-knowledge-bases/developer)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/extensions/b2b-suite-migration/execution/running-migration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-58":{"query":"My shopware.yaml still uses redis_url — how do I define the named Redis connections in Shopware 6.7 and which eviction policy does each one need?","category":"dev","option":"fs-docs","answer":"Starting with v6.6.8.0, Shopware supports configuring multiple, reusable, named Redis connections in `config/packages/shopware.yaml` under `shopware.redis.connections`, each with its own `dsn`, e.g.:\n```yaml\nshopware:\n    redis:\n        connections:\n            ephemeral:\n                dsn: 'redis://host1:port/dbindex'\n            persistent:\n                dsn: 'redis://host2:port/dbindex'\n```\nConnection names should reflect their purpose/type, be unique, and follow service naming conventions (they become part of container service names); subsystems then reference connections by name. DSNs can use environment variables, e.g. `dsn: '%env(REDIS_EPHEMERAL)%/1'`. For high load, add `?persistent=1` to the DSN to enable connection pooling (this affects pooling only, not data persistence).\n\nBecause current Redis versions cannot use different eviction policies per database within the same instance, Shopware recommends separate Redis instances per data category, each with a specific eviction policy: (1) Ephemeral data (HTTP cache and object cache) — no durable persistence needed, use eviction policy `volatile-lru`, which only evicts keys that have a TTL set (the app manages the TTL). (2) Durable, but 'aging' data (sessions) — persist to disk (RDB/AOF), use eviction policy `allkeys-lru`, discarding the oldest values first since recent data matters most. (3) Durable and critical data (cart, number ranges, lock store, increment data) — persist to disk and use `volatile-lru` so that only expired/TTL'd data can be evicted, protecting critical non-expiring data from being deleted under memory pressure.","citations":["developer/guides/hosting/infrastructure/redis.md:14-110"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"redis_url|eviction\" $DEV (path=docs/shopware-knowledge-bases/developer)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/infrastructure/redis.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-59":{"query":"After upgrading to Shopware 6.7 my Varnish cache is never invalidated — what changed in the reverse proxy configuration?","category":"dev","option":"fs-docs","answer":"Two relevant changes for 6.7: First, the older 'Varnish with Redis' integration method (using LUA scripts to determine URLs for the BAN request, which caused problems depending on setup/network and did not support Redis clusters) was deprecated from v6.6.x onwards and removed in v6.7.0. You must use the 'Varnish with XKey' integration instead — enable it in `config/packages/shopware.yaml`/`shopware.yml` under `shopware.http_cache.reverse_proxy` with `enabled: true`, `use_varnish_xkey: true`, and `hosts` pointing to your Varnish host(s) (this also requires `SHOPWARE_HTTP_CACHE_ENABLED=1` in `.env`). Note the config key itself already changed from `storefront.reverse_proxy` to `shopware.http_cache.reverse_proxy` starting with Shopware 6.6.0.0, so upgrading configs from older versions need adjusting. Second, cache-clearing command behavior changed: `bin/console cache:clear` cleared the HTTP cache too in versions before 6.7, but as of 6.7 it no longer does so automatically — to explicitly clear the reverse proxy/HTTP cache you should use `bin/console cache:clear:http` (available since 6.6.10), or `bin/console cache:clear:all` (since 6.6.8) to clear everything including HTTP cache. The Reverse Proxy Cache shares the same invalidation mechanism and tags as the Object Cache, so invalidating a product also invalidates both. If Varnish is never being invalidated after upgrading, check that you migrated off the deprecated Redis-based BAN method to XKey, and that you are calling the correct 6.7 cache-clear command (`cache:clear:http` or `cache:clear:all`) rather than relying on plain `cache:clear`.","citations":["developer/guides/hosting/infrastructure/reverse-http-cache.md:36-70","developer/guides/hosting/infrastructure/reverse-http-cache.md:219-237"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/infrastructure/reverse-http-cache.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-60":{"query":"Which transports do my Shopware message queue workers have to consume in production, and how do I turn off the admin worker?","category":"dev","option":"fs-docs","answer":"On production, run one or more CLI `messenger:consume` workers instead of relying on the admin worker (which processes tasks via the browser while logged into the Administration and is only recommended for development). The recommended command is e.g. `bin/console messenger:consume async --time-limit=60 --memory-limit=128M`, and you can consume multiple transports with priority by listing them in order, e.g. `bin/console messenger:consume async low_priority`. Out of the box the default transports/DSNs used are configured via environment variables: `MESSENGER_TRANSPORT_DSN` (default async transport, e.g. `doctrine://default`), `MESSENGER_TRANSPORT_LOW_PRIORITY_DSN` (low priority queue, e.g. `doctrine://default?queue_name=low_priority`), and `MESSENGER_TRANSPORT_FAILURE_DSN` (failed messages, e.g. `doctrine://default?queue_name=failed`) — a CLI worker must also be set up for the failed transport, otherwise failed messages are never processed. Use a process control system such as systemd or supervisor (or a cron job, with caveats about uncontrolled worker counts) to keep the consumer(s) running.\n\nOnce the CLI worker is set up, you should turn off the admin worker in `config/packages/shopware.yaml`:\n```yaml\nshopware:\n    admin_worker:\n        enable_admin_worker: false\n```\nIf instead you choose to keep using the admin worker, you must explicitly list every transport it should poll along with a poll interval, e.g.:\n```yaml\nshopware:\n    admin_worker:\n        enable_admin_worker: true\n        poll_interval: 30\n        transports: [\"async\", \"low_priority\"]\n```","citations":["developer/guides/hosting/infrastructure/message-queue.md:14-67","developer/guides/hosting/infrastructure/message-queue.md:115-153"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"admin worker|messenger:consume|message queue\" $DEV/guides (path=docs/shopware-knowledge-bases/developer/guides)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/infrastructure/message-queue.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-61":{"query":"After the upgrade my Elasticsearch index has to be rebuilt — where do I set the shard and replica counts and which reindex command do I run?","category":"dev","option":"fs-docs","answer":"By default Shopware uses three shards and three replicas for the created Elasticsearch index. You override this in a config file at `config/packages/elasticsearch.yml` (available since Shopware 6.4.12.0):\n\n```yaml\nelasticsearch:\n  index_settings:\n    number_of_shards: 1\n    number_of_replicas: 0\n```\n\nTo rebuild the index, clear the cache first (`bin/console cache:clear`) so `.env` changes are picked up, then run `bin/console es:index` for basic Elasticsearch indexing. If you want to reindex the whole shop (Elasticsearch, SEO-URLs, product index, etc.), use `bin/console dal:refresh:index --use-queue` (the `--use-queue` option is needed because of the large volume of products, and requires the message queue). Some systems also require running `bin/console es:create:alias` manually after indexing completes if products still don't show up in the storefront.","citations":["developer/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md:140-176"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"command=grep -rl \"SHOPWARE_ES_INDEXING_ENABLED\\|es:index\\|elasticsearch\" docs/shopware-knowledge-bases/developer --include=*.md -il | head -20"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-62":{"query":"I changed a setting in `.env` on a deployed 6.7 shop but it still behaves the old way — what takes precedence between `.env`, `.env.local` and the real environment variables, and which settings does Shopware not read from `.env` at all?","category":"dev","option":"fs-docs","answer":"Environment variables are one of several configuration mechanisms Shopware supports: 'Environment variables — Secrets, infrastructure values, and deployment-specific values — live in `.env`, `.env.local`, server/container environment, or deployment platform' (developer/guides/hosting/configurations/shopware/index.md). `.env.local` is meant for machine/deployment-specific overrides and is git-ignored, so changes there don't affect the shared, versioned `.env`.\n\nOn a deployed/production shop, the most likely reason an `.env` change has no effect is that Symfony/Shopware is configured to use a `.env.local.php` file instead of parsing `.env` on every request — this is Symfony's recommended production setup, and Shopware supports dumping the current `.env` contents into it via `bin/console system:setup --dump-env` or `bin/console dotenv:dump {APP_ENV}` (available since Shopware 6.4.15.0). If such a dump exists, editing `.env` afterwards has no effect until you regenerate the dump; in a containerized environment, all these variables can instead be set directly as real container/server environment variables, which also take priority over anything in the `.env` files.\n\nAs for settings Shopware does not read from `.env` at all: shop settings that merchants are meant to change belong to the database-backed system configuration, which is 'read through Shopware's system configuration' and changed via the Administration, Admin API, or app/plugin code — not via `.env`. One concrete example given in the environment-variable reference is `MAILER_DSN`, whose default can be set via `.env`, but the docs explicitly note '(Admin Configuration overwrites this)', meaning the database-backed Mailer configuration set in the Administration takes precedence over the `.env` value in practice.","citations":["developer/guides/hosting/configurations/shopware/index.md:14-28","developer/guides/hosting/performance/performance-tweaks.md:222-227","developer/guides/hosting/configurations/shopware/environment-variables.md:12-38","developer/guides/installation/legacy-setups/symfony-cli-setup.md:54-62"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/configurations/shopware/environment-variables.md"},{"tool":"Bash","args":"command=grep -rl \"\\.env\\.local|env.local\" docs/shopware-knowledge-bases/developer --include=*.md -il"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/configurations/shopware/index.md"},{"tool":"Bash","args":"command=grep -n \"precedence|takes priority|overrides|real environment variable\" -i docs/shopware-knowledge-bases/developer -r --include=*.md | grep -i env | head -30"},{"tool":"Bash","args":"command=grep -n \"\\.env\" -A3 -B3 docs/shopware-knowledge-bases/developer/guides/development/start-developing.md | head -80"},{"tool":"Bash","args":"command=grep -n \"\\.env\" -B2 -A6 docs/shopware-knowledge-bases/developer/guides/hosting/configurations/shopware/static-system-config.md | head -60"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/configurations/shopware/static-system-config.md"},{"tool":"Bash","args":"command=grep -n \"\\.env\" -B3 -A8 docs/shopware-knowledge-bases/developer/guides/installation/legacy-setups/symfony-cli-setup.md | head -100"},{"tool":"Bash","args":"command=grep -n \"\\.env\" -B2 -A6 docs/shopware-knowledge-bases/developer/guides/hosting/installation-updates/deployments/deployment-with-deployer.md | head -100"},{"tool":"Bash","args":"command=grep -n \"\\.env\" -B2 -A6 docs/shopware-knowledge-bases/developer/guides/hosting/performance/performance-tweaks.md | head -60"},{"tool":"Bash","args":"command=grep -n \"real environment|process environment|takes precedence over|already set in the environment|.env file is ignored|ignored if\" docs/shopware-knowledge-bases/developer -r --include=*.md | head -30"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/performance/performance-tweaks.md, offset=195, limit=35"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"dev-63":{"query":"I deployed a plugin update to a 6.7 staging shop and my new migration never ran — which `bin/console` command applies the pending migrations of that one plugin, and what do I have to pass to it?","category":"dev","option":"fs-docs","answer":"Use `bin/console database:migrate <identifier> --all`, e.g. `./bin/console database:migrate SwagBasicExample --all`. The `identifier` argument is optional and determines which set of migrations is run — by default it runs the Shopware Core migrations, so to run your plugin's own pending migrations you must pass your plugin's bundle name as the identifier (in the example, `SwagBasicExample`). The `--all` flag runs all unhandled migrations for that identifier. Normally installing/updating a plugin via the Plugin Manager already runs all new migrations' `update()` methods automatically, but if that didn't happen (e.g. you created the migration after installing, or need to trigger it manually as part of your dev/deploy process), this command lets you run it by hand.","citations":["developer/guides/plugins/plugins/database/database-migrations.md:162-178"],"toolCallLog":[{"tool":"Bash","args":"command=grep -n \"migration\" docs/shopware-knowledge-bases/developer/resources/references/core-reference/commands-reference.md | head -30"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/resources/references/core-reference/commands-reference.md, offset=95, limit=35"},{"tool":"Bash","args":"command=grep -rn \"database:migrate\" docs/shopware-knowledge-bases/developer --include=*.md | head -20"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/database/database-migrations.md, offset=140, limit=50"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-64":{"query":"How do I get an Admin API OAuth token — with client_credentials for an integration, or the password grant for local testing — and how long is each token valid?","category":"dev","option":"fs-docs","answer":"For an integration, create one in the Administration under Settings → System → Integrations (with the toggle set to 'Administrator' to enable integration permissions), then map its Access key ID to `client_id` and Secret access key to `client_secret`. Request a token with:\n\n```bash\ncurl -s \"http://127.0.0.1:8000/api/oauth/token\" \\\n -H \"Content-Type: application/json\" \\\n -d '{\n \"grant_type\": \"client_credentials\",\n \"client_id\": \"YOUR_ACCESS_KEY_ID\",\n \"client_secret\": \"YOUR_SECRET_ACCESS_KEY\"\n }'\n```\n\nThe response includes `\"expires_in\": 3600`, i.e. the client_credentials token is valid for 3600 seconds (1 hour).\n\nFor local development only, there is a password-grant shortcut using the default Administration credentials (this should not be used for integrations/reproducible setups — client_credentials remains the default approach):\n\n```bash\ncurl -X POST \"http://localhost:8000/api/oauth/token\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"grant_type\": \"password\",\n    \"client_id\": \"administration\",\n    \"scopes\": \"write\",\n    \"username\": \"admin\",\n    \"password\": \"shopware\"\n  }'\n```\n\nIts response includes `\"expires_in\": 600` and also a `refresh_token`, i.e. the password-grant token is valid for only 600 seconds (10 minutes).","citations":["developer/guides/development/integrations-api/index.md:76-107","developer/guides/development/integrations-api/auth-api-requests.md:11-40"],"toolCallLog":[{"tool":"Bash","args":"command=grep -rl \"client_credentials|password grant|grant_type\" docs/shopware-knowledge-bases/developer --include=*.md -il"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/auth-api-requests.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/index.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-65":{"query":"What can I put in the JSON body of `POST /api/search/{entity}` for filtering, associations, sorting, aggregations and getting an exact total count?","category":"dev","option":"fs-docs","answer":"The search criteria JSON body for `POST /api/search/{entity}` supports these top-level parameters: `associations` (load additional related data, like a SQL join, with nested criteria e.g. limit/filter/sort inside it), `includes` (restrict returned fields per entity/apiAlias), `ids` (limit search to a list of IDs), `total-count-mode`, `page` / `limit` (pagination, `page` is 1-indexed), `filter` (filters results and aggregations, same filter types as the DAL), `post-filter` (filters results but not aggregations), `query` (weighted search returning a `_score` per matching query with a defined `score`), `term` (text search using the entity's SearchRanking-flagged fields — don't combine with `query`), `sort` (one or more `{field, order}` entries, plus `naturalSorting` and a `count` sort type since 6.4.12.0), `aggregations` (DAL-equivalent aggregation types, e.g. `avg`), and `grouping` (group results by one or more fields).\n\nFor an exact total count, set `\"total-count-mode\": 1` — this determines the exact total number of hits (used for exact-page pagination) at the cost of performance, since it requires `SQL_CALC_FOUND_ROWS`. Mode `0` (default) determines no total (best performance, use when pagination isn't needed) and mode `2` only determines whether there is a next page (good performance, useful for infinite scrolling).","citations":["developer/guides/development/integrations-api/search-criteria.md:56-176","developer/guides/development/integrations-api/search-criteria.md:178-442"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/search-criteria.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-66":{"query":"Which request headers change Admin API behaviour for language, entity version, parent-child inheritance and skipping flow triggers during a bulk import?","category":"dev","option":"fs-docs","answer":"- Language: `sw-language-id`. By default the API returns entities in the system language; setting this header changes which language's translation is returned, e.g. `POST /api/search/product` with header `sw-language-id: be01bd336c204f20ab86eab45bbdbe45`.\n- Entity version: `sw-version-id`. Since Shopware allows multiple versions of an entity (used e.g. for orders), the API by default returns only the most recent record; add this header (e.g. on `POST /api/search/order`) to tell the API which specific version to return.\n- Parent-child inheritance: `sw-inheritance`. Shopware supports parent-child inheritance between entities of the same type (e.g. products and variants); by default the API only returns the record's own data without considering inheritance — send `sw-inheritance: 1` to have inherited parent data considered.\n- Skipping flow triggers during a bulk import: `sw-skip-trigger-flow`. Useful e.g. when importing hundreds of thousands of customers via the Sync API and you don't want to trigger flows like 'send email on customer creation' — pass `sw-skip-trigger-flow: 1` on the request (e.g. `POST /api/_action/sync`).","citations":["developer/guides/development/integrations-api/request-headers.md:12-52"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/request-headers.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-67":{"query":"What does a minimal app folder and `manifest.xml` need to contain, and which console commands install and activate the app on my local Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Apps live under `custom/apps` in your Shopware project, each in its own folder containing at minimum a `manifest.xml`, e.g.:\n\n```text\ncustom/apps/MyExampleApp/manifest.xml\n```\n\nThe folder name and the `<meta><name>` value in `manifest.xml` must match. A minimal manifest needs a `<meta>` block with `<name>`, `<label>`, `<description>`, `<author>`, `<copyright>`, `<version>`, `<icon>`, and `<license>`. `<author>` and `<copyright>` are required — if missing or empty, `bin/console app:refresh` fails.\n\nFor CLI installation, from inside the PHP container in the project root:\n1. `bin/console app:refresh` — refreshes the app registry so Shopware picks up the manually created app.\n2. `bin/console app:install --activate MyExampleApp` — installs the app using its technical name (the `<meta><name>` value, not the filesystem path) and activates it in one step.\n3. If you omit `--activate`, the app is installed inactive; activate it later via Administration (Extensions → My Extensions → Apps) or `bin/console app:activate MyExampleApp`.\n4. Use `bin/console app:list` to check the current app list if it doesn't appear as expected, and `bin/console cache:clear` (or `cache:clear:http` / `cache:clear:all`) after activating so changes take effect.\n\nApps are validated during installation; use `--no-validate` with `app:install` to skip validation while debugging, and `bin/console app:validate` to identify configuration issues.","citations":["developer/guides/plugins/apps/app-base-guide.md:38-120"],"toolCallLog":[{"tool":"Bash","args":"command=find docs/shopware-knowledge-bases/developer -iname \"*manifest*\" -not -path '*/.git/*'"},{"tool":"Bash","args":"command=find docs/shopware-knowledge-bases/developer/guides -ipath \"*apps*\" -name \"*.md\" -not -path '*/.git/*' | head -30"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/apps/app-base-guide.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-68":{"query":"How does the registration handshake between Shopware and my app backend work — shop id, proof, shop secret and the confirmation call?","category":"dev","option":"fs-docs","answer":"Registration ('setup') happens during app installation and is only needed when your app backend and Shopware must communicate (Admin Module, Payment Method, Tax provider, or Webhook features).\n\n1. Registration request: Shopware sends a `GET` request to the URL declared in your manifest, with query parameters `shop-id`, `shop-url`, `timestamp`, and headers `shopware-app-signature` (HMAC-SHA256 of the query string, signed with your app's `app-secret`), `sw-version` (since 6.4.1.0), and — on re-registration only — `shopware-shop-signature` (signed with the shop's current `shop-secret`). You recompute the signature over the query string with your `app-secret` and compare it to `shopware-app-signature` to verify the request really came from an authenticated Shopware installation.\n\n2. Registration response: if registration is accepted, your app must return proof that it holds the `app-secret`: `proof` = SHA-256 HMAC of the concatenation of `shopId`, `shopUrl`, and the app's name, keyed with the `app-secret`. Your app also generates and returns a new `secret` (called the `shop-secret`, distinct from `app-secret`, minimum 64 / maximum 255 characters) that will be used to sign all further requests from this shop, plus a `confirmation_url` to which Shopware will send the confirmation call. Example response: `{\"proof\": \"...\", \"secret\": \"random secret string\", \"confirmation_url\": \"https://my.example.com/registration/confirm\"}`.\n\n3. Confirmation request: if the proof matches what Shopware computed, Shopware issues a `POST` to your `confirmation_url` with body containing `apiKey`, `secretKey`, `timestamp`, `shopUrl`, and `shopId`. `apiKey`/`secretKey` are used as `client_id`/`client_secret` for the Admin API OAuth `client_credentials` grant for that shop. This request is signed with the `shop-secret` you provided in the registration response, via the `shopware-shop-signature` header (HMAC-SHA256 of the request body, keyed with `shop-secret`) — you must recompute and verify this signature. On re-registration, an additional `shopware-shop-signature-previous` header (signed with the shop's previous `shop-secret`) lets you confirm continuity with the previously registered installation.\n\nFor secret rotation / shop-url changes, the shop can re-initiate registration with an already-registered shop ID; the request will then carry both the `app-secret` signature and the previous `shop-secret` signature, and your app must validate both, generate a new secret, and (for safety) accept the old secret in parallel for a short grace period (e.g. 1 minute) to avoid breaking in-flight requests.","citations":["developer/guides/plugins/apps/lifecycle/app-registration-setup.md:14-269"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/apps/lifecycle/app-registration-setup.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-69":{"query":"How does an app subscribe to an event like `product.written`, what does Shopware POST to the webhook URL, and how do I verify the request is genuine?","category":"dev","option":"fs-docs","answer":"To subscribe, add a `<webhooks>` element to your app's manifest.xml declaring a webhook name, its URL and the event, e.g. one named `product-changed` at `https://example.com/event/product-changed` triggered on the `product.written` event. Whenever that event fires, Shopware sends a `POST` request with a JSON body to that URL, e.g.:\n\n```json\n{\n  \"data\": {\n    \"payload\": [ { \"entity\": \"product\", \"operation\": \"delete\", \"primaryKey\": \"7b04ebe416db4ebc93de4d791325e1d9\", \"updatedFields\": [] } ],\n    \"event\": \"product.written\"\n  },\n  \"source\": { \"url\": \"http://localhost:8000\", \"appVersion\": \"0.0.1\", \"shopId\": \"dgrH7nLU6tlE\", \"eventId\": \"7b04ebe416db4ebc93de4d791325e1d9\" },\n  \"timestamp\": 123123123\n}\n```\n\n`source.url`/`appVersion`/`shopId` identify the sending shop and app, `source.eventId` (since 6.4.11.0) is a stable identifier that stays the same across retries, and `timestamp` (since 6.4.1.0) is when the webhook was handled — check it isn't too old to prevent replay attacks. For `entity.written` events, `payload` doesn't include full entity data (it could be outdated by the time it's delivered) — only the entity's id under `primaryKey`, so the app must fetch fresh data via the Shop API itself; other events do include the entity data that defines them, though not necessarily all associations. Headers also include `sw-version` (since 6.4.1.0), and since 6.4.5.0 `sw-context-language` / `sw-user-language`.\n\nTo verify authenticity, check the `shopware-shop-signature` header — it is a SHA-256 HMAC of the request body, signed with the `shop-secret` your app generated for that shop during registration. This is the exact same verification mechanism used for the app registration confirmation request: recompute the HMAC over the raw body using the stored `shop-secret` and compare it to the header value.\n\nOptionally, adding `onlyLiveVersion=\"true\"` to a `<webhook>` element (since 6.5.7.0) restricts delivery to writes with the live version ID (filters out draft/order versions), applicable only to `HookableEntityWrittenEvent`-based events; default is `false`.","citations":["developer/guides/plugins/apps/lifecycle/webhook.md:20-145"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/apps/lifecycle/webhook.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-70":{"query":"How do I implement a payment method in an app with `pay-url` and `finalize-url`, and what must the app server return in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Define the payment method in your manifest with a `pay-url` and, for asynchronous payments, also a `finalize-url`. Whether a method is treated as synchronous or asynchronous depends on whether `finalize-url` is defined: if it isn't, Shopware's internal payment handler defaults to synchronous. If you don't need any app communication at all, you can omit `pay-url` too and the transaction simply stays open.\n\nAsynchronous flow: (1) Shopware sends a `POST` to `pay-url` with `source`, `orderTransaction`, `order`, and a `returnUrl` (where the customer should return after paying at the provider). Your app responds with `{\"redirectUrl\": \"https://payment.app/...\"}`. (2) The customer is redirected there, pays, and is sent back to `returnUrl`. (3) Shopware then sends a second `POST` to `finalize-url` with `orderTransaction` and `requestData` (all query params the payment provider passed back). Your app responds with a `status` (and optionally a `message` for failing states).\n\nPossible `status` values returned from `pay`/`finalize` (and other payment calls) include: `open`, `paid`, `cancelled`, `refunded`, `failed`, `authorize`, `unconfirmed`, `in_progress`, `reminded`, `chargeback` (the finalize-specific outcomes commonly used are `cancel`, `fail`, `paid`, `authorize`).\n\nImportant for 6.7: 'Be aware, that from Shopware 6.7.0.0 onwards your app-server has to respond with a payment state in its response, if you intend to change the transaction state' — this warning applies to the pay call, the finalize call, prepared-payment validate/pay calls, refund calls, and recurring captures alike. Without a `status` in the response, Shopware will not update the transaction state.\n\nAll requests/responses to your `pay-url`/`finalize-url` are signed, so your app server must verify signatures the same way as for other app backend communication (see the app registration/signing docs).","citations":["developer/guides/plugins/apps/checkout/payment.md:26-97","developer/guides/plugins/apps/checkout/payment.md:154-272","developer/guides/plugins/apps/checkout/payment.md:773-786"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge
