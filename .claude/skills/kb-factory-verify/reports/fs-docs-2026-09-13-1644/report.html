-bases/developer/guides/plugins/apps/checkout/payment.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-71":{"query":"How does an app define its own custom entities in Shopware 6.7 and read them back through the API?","category":"dev","option":"fs-docs","answer":"An app defines custom entities by registering them in the app's Resources/entities.xml file, e.g. defining an <entity name=\"custom_entity_bundle\"> with a <fields> block (string, price, many-to-many, etc. field types), validated against the entity-1.0.xsd schema. All registered entities automatically get a repository, which is accessible in App Scripts via `services.repository.search('custom_entity_blog', criteria)`. They can also be read back through the Admin API by calling `POST /api/search/custom-entity-blog` (dash-separated entity name). Since v6.4.15.0, entities can use a `ce_` shorthand prefix (e.g. `ce_bundle`) to avoid DB name length restrictions; if used, the same prefixed name must be used in both the repository service and the API call (e.g. `POST /api/search/ce_blog`). Apps have full access rights to their own custom entities by default; only associations referencing core tables require explicit <permissions> in the manifest. Custom entities can optionally be made usable in the custom-fields 'Entity Select' type by adding `custom-fields-aware=\"true\"` and a `label-property` attribute to the entity definition (available since Shopware 6.5.1.0). Renaming an existing custom entity is not supported since it would delete existing data.","citations":["developer/guides/plugins/apps/custom-data/custom-entities.md:8-128"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/ ; ls docs/shopware-knowledge-bases/developer ; ls docs/shopware-knowledge-bases/merchant"},{"tool":"Bash","args":"grep -rl \"custom entit\" docs/shopware-knowledge-bases/developer --include=*.md -i"},{"tool":"Read","args":"developer/guides/plugins/apps/custom-data/custom-entities.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-01":{"query":"How do I configure Shopware 6's built-in GraphQL API for the Store API?","category":"edge","option":"fs-docs","answer":"The corpus does not describe any built-in GraphQL API, and the Store API concept page explicitly describes the Store API as a JSON-over-HTTP interface, not GraphQL: 'It enables headless frontends ... to consume Shopware functionality via JSON over HTTP.' A recursive, case-insensitive search for 'graphql' anywhere under docs/shopware-knowledge-bases/developer returned zero matches. Based on what the corpus documents, Shopware 6 does not ship a built-in GraphQL API for the Store API — there is nothing to configure. If GraphQL access is desired, it would have to come from a third-party/custom extension, which is outside what this documentation covers.","citations":["developer/concepts/api/store-api.md:1-18"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"graphql\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer 2>/dev/null"},{"tool":"Bash","args":"find <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer -iname \"*store-api*\" -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/concepts/api/store-api.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"edge-02":{"query":"How do I get the DI container with `Shopware()->Container()` and override the product listing Smarty template in Shopware 6?","category":"edge","option":"fs-docs","answer":"Both `Shopware()->Container()` and Smarty templates are Shopware 5 concepts and do not apply to Shopware 6. A case-insensitive recursive search of the developer docs for 'smarty' and for 'Shopware()->Container' returned zero matches anywhere under docs/shopware-knowledge-bases/developer. Separately, searching for 'twig' under developer/guides/plugins returns many hits (e.g. developer/guides/plugins/apps/app-scripts/index.md and others), confirming Shopware 6's templating engine is Twig, not Smarty. Shopware 6 also uses the Symfony service container and dependency injection (services are normally obtained by constructor injection, not a global `Shopware()` helper function) rather than the legacy Shopware 5 global accessor. The corpus does not contain a page describing `Shopware()->Container()` or Smarty template overrides, so this question cannot be answered from Shopware 6 documentation as asked — those mechanisms belong to Shopware 5.","citations":[],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"smarty|Shopware()->Container\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer 2>/dev/null | head -10"},{"tool":"Bash","args":"grep -rli \"twig\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/plugins 2>/dev/null | head -5"}],"notFoundClaim":true,"memoryClaims":["Shopware 6 uses the Symfony service container with constructor/dependency injection rather than the Shopware 5 global `Shopware()->Container()` accessor. [from memory]","Smarty templates and `Shopware()->Container()` are Shopware 5 legacy concepts, replaced in Shopware 6 by Twig templates and Symfony DI. [from memory]"],"sourceVerdict":"no"},"edge-03":{"query":"Where do the `#[ORM\\Entity]` mapping attributes for my plugin's entity go in Shopware 6, and how do I get Doctrine's `EntityManager` injected into my service so I can persist it?","category":"edge","option":"fs-docs","answer":"There is no Doctrine ORM `EntityManager` or `#[ORM\\Entity]` attribute mapping in Shopware 6 to inject or configure. The developer docs state explicitly: 'In contrast to most Symfony applications, Shopware uses no ORM, but a thin abstraction layer called the data abstraction layer (DAL)... Some concepts used by the DAL, like Criteria, may sound familiar to you if you know Doctrine or other ORMs' (developer/concepts/framework/data-abstraction-layer.md:14-16). Persistence instead works through an `EntityRepository`, obtained via the Dependency Injection Container using constructor injection — e.g. a service constructor typing a parameter as `EntityRepository $productRepository` and Symfony autowiring (or an explicit `services.php` registration referencing e.g. `product.repository`) supplies it (data-abstraction-layer.md:28-54). Entity/field definitions for a custom DAL entity are declared via a Definition/EntityDefinition class registered as a service, not via Doctrine mapping attributes on the entity class itself — the corpus's DAL page does not describe attribute-based mapping because that is not how Shopware 6 persistence works.","citations":["developer/concepts/framework/data-abstraction-layer.md:1-60"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"doctrine|EntityManager|ORM\\\\\\\\Entity\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer 2>/dev/null | head -10"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/concepts/framework/data-abstraction-layer.md, limit=60"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"edge-04":{"query":"How do I fetch products with `GET /sales-channel-api/v3/product` on Shopware 6.7?","category":"edge","option":"fs-docs","answer":"The developer docs do not document a `/sales-channel-api/v3/...` endpoint as a current API. A search for 'sales-channel-api' across the developer corpus only turns up two 2020 architecture decision records (developer/resources/references/adr/2020-11-20-add-login-required-annotation.md and .../2020-07-02-implement-sales-channel-context-token-requirement.md), which mention `sales-channel-api` only as the historical/legacy sibling of the modern `store-api` for sales-channel-context-bound routes; neither documents a `/v3/product` route or confirms it exists on 6.7. The corpus's current concept pages only describe two customer/integration-facing APIs: the Store API (developer/concepts/api/store-api.md:1-18), described as the customer-facing, JSON-over-HTTP interface for product browsing/cart/checkout, and the Admin API (developer/concepts/api/admin-api.md) plus an Integrations API guide (developer/guides/development/integrations-api) for backend/third-party integration access. Neither concept page uses the `sales-channel-api` route prefix. Given this, the corpus does not confirm that `GET /sales-channel-api/v3/product` is a valid, current Shopware 6.7 endpoint — the documented, current way to fetch products from a sales channel is the Store API's product listing/search endpoints (documented externally via the Store API Stoplight reference linked from store-api.md), not a `sales-channel-api/v3` path.","citations":["developer/resources/references/adr/2020-11-20-add-login-required-annotation.md:1-47","developer/concepts/api/store-api.md:1-18"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"sales-channel-api\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer 2>/dev/null | head -10"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/resources/references/adr/2020-11-20-add-login-required-annotation.md"},{"tool":"Bash","args":"grep -rli \"legacy api|api removed|sales channel api|v3\\\\b\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/resources 2>/dev/null | head -20"},{"tool":"Bash","args":"find <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer -iname \"*integrations-api*\" -o -iname \"*admin-api*\""}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"edge-05":{"query":"How do I enable Shopware's built-in MCP server on a Shopware 6.6 shop?","category":"edge","option":"fs-docs","answer":"You cannot — the built-in MCP server does not exist on Shopware 6.6. Per the docs: 'The MCP server was introduced in Shopware 6.7.11.0 behind the MCP_SERVER feature flag. Shopware 6.7.14.0 removes the flag and introduces progressive tool discovery' (developer/products/tools/mcp-server/intro.md:17). It is also described as 'considered experimental until Shopware 6.8' (intro.md:14-15). The Getting Started guide's prerequisites confirm the version floor: 'Shopware 6.7.14.0 or later. On 6.7.11.0 to 6.7.13.x, set MCP_SERVER=1 in your .env file first...' (developer/products/tools/mcp-server/getting-started.md:12-14), and the Configuration page repeats the same gating: 'On Shopware 6.7.11.0 to 6.7.13.x, the MCP server is gated behind the MCP_SERVER feature flag... Starting with 6.7.14.0, the flag is removed' (developer/products/tools/mcp-server/configuration.md:10-16). There is no documented way to enable it on 6.6.x since the feature and its feature flag do not exist before 6.7.11.0. To use it, the shop must first be upgraded to at least Shopware 6.7.11.0 (with MCP_SERVER=1 set through 6.7.13.x, no flag needed from 6.7.14.0 onward), and have symfony/mcp-bundle installed.","citations":["developer/products/tools/mcp-server/getting-started.md:1-197","developer/products/tools/mcp-server/configuration.md:1-20","developer/products/tools/mcp-server/intro.md:1-25"],"toolCallLog":[{"tool":"Bash","args":"find <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer -ipath \"*mcp-server*\" -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/tools/mcp-server/getting-started.md"},{"tool":"Bash","args":"grep -n \"6.6|6.7|requirement|prerequisite\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/products/tools/mcp-server/intro.md <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/products/tools/mcp-server/configuration.md 2>/dev/null | head -30"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/tools/mcp-server/configuration.md, limit=20"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/tools/mcp-server/intro.md, limit=25"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-06":{"query":"I'm coming from Magento — what are the Shopware equivalents of store views, extensions, attribute sets and `di.xml`?","category":"edge","option":"fs-docs","answer":"The merchant docs' Magento dictionary (migration-en/magento-keywords) maps these directly:\n- Store view / Store / Website -> 'Sales channel with different languages and domains' — Shopware configures separate storefronts, languages and domains as Sales Channels rather than Magento's store view/store/website hierarchy.\n- Extension (Magento) -> Plugin, and more broadly Magento's 'Community Code Pool' maps to Shopware 'Extensions / Community Store' (installed via Extensions > Store) while the 'Local Code Pool' maps to Shopware 'Extensions' installed via the extension manager under Settings > My extensions; project-related changes should be made via extensions/plugins.\n- Attribute Sets -> Custom field sets, which collect Custom fields (the equivalent of Magento's product Attributes) into logical groups; note Magento's single 'Attributes' concept is split in Shopware 6 into Custom fields (free-text extra product information) and Properties (used for filtering and variant generation).\n- `di.xml` was not found in the dictionary page, since it's a development-level concern not covered by the merchant migration guide. However, the developer docs' custom-service guide shows the analogous Shopware 6 mechanism: plugins register and configure services (including dependency injection wiring) in a `src/Resources/config/services.php` file (Symfony's DI configuration), the direct counterpart to Magento's `di.xml` for declaring/configuring services and their dependencies.","citations":["merchant/content/en/shopware-6/migration-en/magento-keywords/v1-1-0-0.md:90-92","developer/guides/plugins/plugins/services/add-custom-service.md:18-72"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"magento\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer 2>/dev/null; grep -rli \"magento\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/merchant 2>/dev/null"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/migration-en/magento-keywords/v1-1-0-0.md"},{"tool":"Bash","args":"find <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer -iname \"dependency-injection.md\" -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/services/dependency-injection.md, limit=40"},{"tool":"Bash","args":"grep -n \"services.xml|services.php|services.yaml\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/guides/plugins/plugins/services/add-custom-service.md"}],"notFoundClaim":false,"memoryClaims":["Magento's di.xml declares/configures service dependency injection wiring; the closest Shopware 6 counterpart is the Symfony-based services.php DI configuration file in a plugin. [from memory]"],"sourceVerdict":"partial"},"edge-07":{"query":"How do I set up Shopware PWA as the storefront for a Shopware 6.7 shop?","category":"edge","option":"fs-docs","answer":"The developer corpus does not document a product called 'Shopware PWA' — a recursive case-insensitive search for 'shopware pwa'/'shopware-pwa' and for the standalone term 'pwa' across docs/shopware-knowledge-bases/developer returned no relevant hits (only unrelated false-positive substring matches in a wordlist file and an ADR). What the docs do document as the current headless/decoupled storefront approach is 'Composable Frontends': the Store API concept page states 'Shopware provides Composable Frontends as a headless frontend implementation based on the Store API' (developer/concepts/api/store-api.md:17), and there is a dedicated deployment guide for running composable frontends on Shopware PaaS Native (developer/products/paas/shopware/composable-frontends/index.md), which explains the `application.yaml` config (`kind: cfe`, Node.js version), runtime requirements (listen on port 3000, expose `/api/healthz`), environment variables, deployment via `sw-paas application update`/`deploy create`, and CDN/ISR caching setup. Based on this corpus, 'Shopware PWA' as named is not a documented product for Shopware 6.7; the documented headless storefront path is Composable Frontends built on the Store API.","citations":["developer/concepts/api/store-api.md:1-18","developer/products/paas/shopware/composable-frontends/index.md:1-198"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"shopware pwa|shopware-pwa\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer 2>/dev/null | head -10"},{"tool":"Bash","args":"grep -rli \"\\bpwa\\b\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer 2>/dev/null | head -10; find <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer -iname \"*frontend*\" -not -path '*/.git/*' | head -10"},{"tool":"Bash","args":"find <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/developer/products/paas/shopware/composable-frontends -maxdepth 1"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/paas/shopware/composable-frontends/index.md"}],"notFoundClaim":true,"memoryClaims":["Shopware PWA (the legacy Vue Storefront-based headless product) is a separate, largely superseded/deprecated project not part of core Shopware 6 documentation; Shopware's current officially documented headless approach is Composable Frontends / Frontends SDKs built on the Store API. [from memory]"],"sourceVerdict":"partial"},"edge-08":{"query":"Which service do I type-hint to read products — `EntityRepositoryInterface` — and how do I inject it into my plugin service?","category":"edge","option":"fs-docs","answer":"There is no `EntityRepositoryInterface` in Shopware 6 — the class to type-hint is `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository`. To read products, you inject the auto-generated repository service for the entity, which follows the naming pattern `entity_name.repository` — for products that's `product.repository`. In your plugin's `services.php` (or services.xml), register your own service and pass `service('product.repository')` as a constructor argument, then type-hint the constructor parameter as `EntityRepository $productRepository`. Once injected, you can call `$this->productRepository->search(new Criteria(), $context)` to fetch products.","citations":["developer/guides/plugins/plugins/framework/data-handling/reading-data.md:20-67"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"grep -rl \"EntityRepositoryInterface\" docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"grep -rl \"repository\\.xml\\|\\.repository\\b\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/reading-data.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-09":{"query":"Where do I configure Business Events so that a mail is sent when an order is placed in Shopware 6.7?","category":"edge","option":"fs-docs","answer":"You configure this in the Flow Builder, found under Settings > Automation > Flow Builder. Create a new flow (Add Flow), select the trigger `checkout.order.placed` (\"Triggers when an order is placed\") in the Flow tab's trigger step, then add the action \"Send mail\": select a reply-to address and a recipient (administrator, customer, or custom email addresses), choose the email template to send, and specify any documents to attach.","citations":["merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:9-13","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:41-62","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:198-208"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"Business Event\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/index.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder -maxdepth 2 -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-01":{"query":"How do I create a product with variants and configure its visibility per sales channel, and why might it not show up in the storefront?","category":"func","option":"fs-docs","answer":"To create a product, go to Catalogues > Products > Create Product and fill in the required fields (Name, Product number, Tax rate, Price gross/net, Stock) and save. After saving, additional tabs become available, including Variants. Variants are generated from Properties: open the Variants tab, use the Variant Generator, under 'Select values' pick the property/properties to base variants on, activate the desired options via checkboxes, optionally define price surcharges per option, and optionally exclude specific combinations under 'Value exclusion' (e.g. exclude Color=Blue combined with Size=XS or XXXL). Click 'Generate variants' to create them; they then appear in a sortable table. You can adjust the storefront display of variants (order of properties/options, assigned images per variant), choose a product-list display mode ('Single main variant' with a Main product or a preselected Single variant), and enable 'Fan out properties in product list' to show individual variants separately in listings. Individual variants can have inheritance from the main product removed (via the chain icon) to set variant-specific name, description, price, stock, images, etc., and can be bulk-edited.\n\nVisibility per sales channel is configured under General > Visibility & structure: 'Sales channel' assigns the product to one or more sales channels (determining where it's available), and 'Active for all selected sales channels' determines whether the product is displayed in the storefront and purchasable. 'Categories' assigns the product to categories so it can be found via the category tree, and 'Configure extended visibility' lets you set the product to be fully visible (search + listing, default), 'hide in listing' (findable only via search), or 'hide in listing and search' (only reachable via direct product URL).\n\nCommon reasons a product might not show up in the storefront include: the product (or the relevant sales channel) was not marked active/'Active for all selected sales channels'; the product was not assigned to the sales channel at all; it wasn't assigned to any category shown in the storefront navigation, so it can't be found via the category tree; extended visibility was set to 'hide in listing' or 'hide in listing and search', hiding it from listings and/or search; or a release date was set in the future so the product cannot yet be purchased (though it may still be visible with a note).","citations":["merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md:177-397"],"toolCallLog":[{"tool":"Read","args":"developer/index.md and merchant/index.md orientation (merchant/index.md)"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en -iname '*variant*'/'*visibility*'/'*sales-channel*' -not -path '*/.git/*'"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/catalogues -maxdepth 2 -not -path '*/.git/*'"},{"tool":"Read","args":"merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-02":{"query":"How do Rule Builder conditions work for shipping and payment methods?","category":"func","option":"fs-docs","answer":"The Rule Builder is found under Settings > Automation > Rule Builder. A rule consists of general information (name, description, priority, type, tags) and conditions. Each condition has a Condition (the parameter queried, e.g. 'Applied shipping method' or 'Applied payment method'), an Operator (e.g. 'Is one of', 'Is equal to', 'Is greater than', etc.), and an Input value; multiple conditions can be linked with AND/OR, and switching between AND/OR automatically creates subconditions. Rules can be assigned in the 'Assignments' tab to determine, among other things, the 'Availability of payment methods', 'Availability of shipping methods', and 'Calculation of shipping costs' (this tab is only a navigation/overview aid, not the place where the assignment itself happens - actual assignment happens in the shipping method / payment method configuration screens). Relevant conditions for shipping/payment include, under 'Shopping cart': 'Applied shipping method' (compares a specific shipping method against the one used in the evaluation context, e.g. Express) and 'Applied payment method' (compares against the payment method used, e.g. Invoice, multi-selection). Under 'Customers': 'Customer with default payment method' compares a specific payment method against the customer's stored default. Under 'Orders': 'Applicable in Administration' can be used as an availability rule to restrict payment or shipping methods to only be available in the Administration. Some conditions (e.g. subtotal/quantity-based ones) support an optional filter (recognizable by a filter icon) to narrow the condition to specific categories, tags, etc. - useful for building rules such as 'make the shipping method Logistics available only if the cart has at least 10 products tagged logistics'. A Preview mode (Rise plan and higher) lets you test a rule's conditions live against a chosen order and simulated date/time before saving. Rules also support priority ordering (higher priority runs first) when multiple applicable rules exist.","citations":["merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md:10-274"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/rules -not -path '*/.git/*'"},{"tool":"Read","args":"merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-03":{"query":"How do promotions and discount codes work, including individually generated codes?","category":"func","option":"fs-docs","answer":"Promotions are created under Marketing > Promotions by clicking 'Create action'. The General tab configures Name, Priority, Valid from/until, Max. total uses, Max. uses per customer, and Active. Under 'Promotion codes' you choose one of three modes: 'No promotional code required' (applied automatically once conditions are met), 'Fixed promotion code' (one shared code for all customers, either a memorable custom string like EASTER21 or system-generated via 'generate random code'), or 'Individual promotion codes' (a unique, single-use code per order/customer). For individual codes, click 'generate codes' to open a configuration window: set 'code length' (number of random characters), optional 'prefix' and 'suffix' (not counted in the length), or use a 'custom pattern' with %s for a random letter and %d for a random digit (e.g. SW-%s%d%s%d%s-TEST); a 'promotion code preview' shows a sample, and 'number of promotion codes' sets how many to generate. Additional codes can later be added via 'add codes' following the same pattern. Individual codes can only be redeemed once; regenerating/adjusting the code pattern invalidates all previously generated codes. Only one individual code from a promotion can be applied at a time.\n\nThe Conditions tab restricts when a promotion applies: general preconditions (which sales channels it applies to, whether to prevent combination with other promotions, or explicitly exclude combinability with specific other promotions) plus Rule-Builder-based conditions for Customer rules, Shopping cart rules, Order rules (e.g. restrict/exclude by payment or shipping method), and 'Promote sets of products' (set groups defined by quantity/value mode, sorting, and product rules) for complex multi-product conditions. If multiple rules of the same type are selected, only one needs to be true (OR logic); to require all together, the promotion must be duplicated per condition.\n\nThe Discounts tab defines what's discounted: 'Apply to' the entire cart, shipping costs, an entire product set, or a specific set group; 'Apply to specific range of products only' with its own Product rules/Apply-to-nth-item/Sort-by settings; discount 'Type' (absolute, percentage, or fixed price/unit price) and 'Value', with an optional 'Maximum discount value' for percentage discounts, and per-currency advanced pricing. Multiple discounts can run within one promotion via 'Add Discount'; discount settings become locked once the promotion has been used in an order.\n\nIn the storefront, unless set to 'No promotional code required', customers enter the code in the 'Enter voucher code' field in the OffCanvas cart or full shopping cart view and confirm; the discount then appears in the cart line items. Already-redeemed individual codes can be checked per promotion (Marketing > Promotions > open promotion) under 'Redeemed', showing which code was used on which order, and orders can be filtered by 'promotion code' in the order overview for both individual and fixed codes.","citations":["merchant/content/en/shopware-6/marketing/promotions/v1-7-0-0.md:10-304"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/marketing -not -path '*/.git/*'"},{"tool":"Read","args":"merchant/content/en/shopware-6/marketing/promotions/v1-7-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-04":{"query":"What does the Shopware Migration Assistant transfer automatically from Shopware 5, and what has to be mapped by hand before the migration starts?","category":"func","option":"fs-docs","answer":"Automatically migrated data (selectable per category in the migration extension's data selection screen): 'Basic data' (mandatory) - Categories, Customer groups, Currencies, Sales channels, Number ranges. 'Products' - Products, Properties, Product options, Product properties, Translations, Cross-selling, Main variant relations. 'Customers & orders' - Customers, Shipping methods, Orders, Order documents. 'Promotions' - Customers, Promotions. 'SEO URLs' - Products, Properties, Product options, Product properties, Translations, Cross-selling, Main variant relations, SEO URLs. 'Product reviews' - Products, Properties, Product options, Product properties, Translations, Cross-selling, Main variant relations, Customers, Reviews, and Media.\n\nData that must be mapped manually before/during migration (these target entries must already be created in Shopware 6 beforehand): Payment methods, Standard Payment Method, Salutation, Delivery time, Standard delivery time. If extensions were used in Shopware 5, additional fields may need mapping. This mapping is mandatory - it cannot be skipped, and once done it cannot be redone by simply resetting the migration; you would need to delete and recreate the migration to remap.\n\nSeparately, several areas require manual checks/adjustments after migration because they cannot be transferred automatically at all: Sales channel domain settings (migrated shops/subshops become their own sales channels but the default sales channel installed with Shopware 6 is opened via the standard domain, so domain settings must be adjusted to see migrated data in the frontend); Shipping costs (must be recreated from scratch in Settings > Commerce > Shipping due to the new Rule-Builder-based architecture); Payment methods (existing config must be checked/recreated under Settings > Commerce > Payment methods, since risk management is now Rule-Builder based); Countries (check Settings > Localisation > Countries for presence/activation); Documents (redesigned document templates must be reconfigured under Settings > Commerce > Documents); Email templates (Shopware 6 uses Twig, so old templates cannot be reused - must be rebuilt under Settings > Content > Email templates); Shopping worlds/Shop pages (must be recreated as Shopping Experiences under Content > Shopping Experiences, since the underlying technical structure changed); and Templates/themes (old Shopware 5 templates cannot be migrated or reused; Shopware 6 ships its own default template as a starting point for custom themes). Additionally, B2B Suite data from Shopware 5 cannot be transferred to Shopware 6 at all.","citations":["merchant/content/en/shopware-6/migration-en/what-is-migrated/v1-1-0-0.md:10-187"],"toolCallLog":[{"tool":"Bash","args":"grep -rli 'migration assistant' docs/shopware-knowledge-bases/merchant --include=*.md"},{"tool":"Read","args":"merchant/content/en/shopware-6/migration-en/index.md"},{"tool":"Read","args":"merchant/content/en/shopware-6/migration-en/shopware6-Migrationsprocess/v1-1-0-0.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/migration-en -maxdepth 1 -not -path '*/.git/*'"},{"tool":"Bash","args":"find .../what-is-migrated, .../Migrationprocess, .../shopware5 -not -path '*/.git/*'"},{"tool":"Read","args":"merchant/content/en/shopware-6/migration-en/what-is-migrated/v1-1-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-05":{"query":"How do I set up a sales channel — storefront versus headless type, domains, languages and currencies — and where do I get its API access key?","category":"func","option":"fs-docs","answer":"In the Shopware Administration, go to Sales Channel and click the plus symbol to create a new sales channel. In the pop-up you choose whether to create a new 'Sales Channel with HTML storefront' or a 'headless sales channel' that only provides an API interface (you can also create a product comparison export here, for portals/marketplaces).\n\nGeneral settings for the sales channel include: Name (internal label), 'Mark Sales Channel as favourite' (shows it in the admin sidebar), Entry point main/footer/service navigation (start categories for the respective navigation areas), Customer group (default group for new/anonymous visitors), Countries (available countries + a default), Languages (available languages + a default), and Standard units of measurement.\n\nUnder 'Payment and shipping' you specify which payment methods are available (plus a default, editable under Settings > Payment methods), which shipping methods are available (plus a default, editable under Settings > Shipping methods), and which Currencies are available (plus a default, editable under Settings > Localisation > Currencies), and how taxes are calculated for orders in this channel.\n\nDomains: for a self-hosted instance, under the 'Domain' section you can add multiple domains via 'Add Domain', each with its own virtual URL, language, currency, snippet set and unit system - useful for running multiple language shops from one sales channel; it's recommended each domain use only one protocol (http or https) to avoid duplicate content. For a Cloud instance, a URL is already generated automatically; to use a custom domain you first add it under Settings > System > Domains, then attach it via 'Add domain' (a server-side redirect always forces https). When assigning a domain you set its URL, Language (from those already assigned to the sales channel), Currency (from Settings > Localisation > Currencies), Snippet set (from Settings > Localisation > Snippets), and Hreflang localisation (ISO-based or browser-language-based).\n\nAPI access: under the 'API access' section of the sales channel you can generate an API Access ID for that sales channel (used for the Sales Channel/Store API); the article points to the developer documentation for details on using this API access.\n\nOther sales-channel settings include Hreflang default domain fallback, Status (temporarily disable the channel or enable maintenance mode with an IP whitelist - noting that when behind a proxy, the proxy's IP must be added as TRUSTED_PROXIES in .env for whitelisting to work), a Products tab to assign products/categories/product groups directly to the channel, Theme assignment, Google Analytics 4 configuration, and Agentic files (llms.txt, agents.md, ai-catalog.json) for AI/agent discoverability. The preinstalled Headless sales channel should never be deleted since many extensions (e.g. B2B Suite) rely on it; it can instead be hidden from the sidebar by marking other channels as favourites.","citations":["merchant/content/en/shopware-6/settings/saleschannel/v1-5-2-0.md:9-297"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings -iname '*saleschannel*' -not -path '*/.git/*'"},{"tool":"Read","args":"merchant/content/en/shopware-6/settings/saleschannel/v1-5-2-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-06":{"query":"Which triggers and actions does the Flow Builder offer, and how do I make it send a mail when an order is placed?","category":"func","option":"fs-docs","answer":"The Flow Builder is found under Settings > Automation > Flow Builder. Each flow has a General tab (Name, Description, Priority - to order flows sharing the same trigger, Active toggle) and a Flow tab where you build the actual logic: pick a Trigger, then optionally add Conditions (built from Rule Builder rules, each with a True/False branch) and Actions.\n\nAvailable triggers include a large set of events, e.g.: checkout.customer.login/logout/register/deleted, checkout.customer.guest_register, checkout.customer.double_opt_in_registration/guest_order, checkout.order.payment_method.changed, checkout.order.placed (fires when an order is placed), contact_form.send, customer.group.registration.accepted/declined, customer.recovery.request, mail.after.create.message, mail.before.send, mail.sent, newsletter.confirm/register/unsubscribe, product_export.log, review_form.send, user.recovery.request, and a large family of state_enter.* / state_leave.* triggers for order, order_delivery, order_transaction and order_transaction_capture(/refund) status changes (e.g. state_enter.order.state.open, state_enter.order_transaction.state.paid, etc.). Since Shopware 6.5.3.0, custom triggers from apps/extensions can also be integrated (e.g. from order management, shipping, social media or newsletter tools), and flows can also start in Shopware and trigger a webhook in a third-party system, or vice versa.\n\nAvailable actions (availability depends on the chosen trigger) include: Assign account status (activate/deactivate a customer), Assign affiliate and campaign code (with an 'override' option), Assign customer group, Generate a document (choose the document type), Send mail (choose reply-to address, recipient - Administrator, Customer, or custom email addresses; note selecting 'Administrator' emails ALL users with the admin flag, including external API users - plus an email template and optional attached documents), Assign status (change payment/shipping/order status, respecting valid status transitions), Stop flow (halts the whole flow, including parallel branches), Set download access (grant/revoke a digital product's download link), Change custom field content (on customer or order entity), and Add Tag / Remove Tag. Delayed Actions (Shopware Beyond plan) let you insert a time delay (Hour/Day/Week/Month/custom) before an action fires, useful e.g. for a review-request email a week after an order; delayed items appear under 'Scheduled Actions'. With the Shopware Commercial extension (Evolve plan+), a Webhook 'Call URL' action is also available (GET/POST/PUT/PATCH/DELETE, with parameters, headers, body, and Basic Auth).\n\nTo send a mail when an order is placed: create a new flow (Add Flow), fill in General info, activate it, go to the Flow tab and select the trigger 'checkout.order.placed', then add the action 'Send mail', configuring the reply-to address, recipient (e.g. Customer), the email template to send, and optionally which documents to attach. Save the flow.","citations":["merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:9-328"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder -not -path '*/.git/*'"},{"tool":"Read","args":"merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-07":{"query":"How do I import products from a CSV with an import/export profile — column mapping, matching identifiers and a dry run?","category":"func","option":"fs-docs","answer":"The Import/Export module is found under Settings > Automation > Import/Export. Preparation: the CSV must be UTF-8 encoded, fields separated by semicolons, and strings enclosed in quotation marks; decimal places in price fields must use a point (e.g. 5.00), not a comma. Note that import can only add/overwrite data, not remove it (e.g. an existing sales-channel assignment on a product cannot be removed via import).\n\nOn the Import tab: 'Upload CSV file' selects the native CSV (a tool like OpenOffice Calc that produces native CSVs is recommended, since some spreadsheet tools can corrupt separators/leading zeros); 'Select profile' picks the profile that determines which CSV columns map to which database tables; 'Start import' validates and imports all error-free records, bundling any faulty records into a downloadable error CSV; 'Start dry run' lets you test the complete import beforehand without actually writing data, to catch problems before a partial import occurs; 'Import activity' shows a 30-day history of past imports (with the ability to redownload the source CSV, open the profile used, download error-only CSV, or abort an in-progress import via the context menu).\n\nProfiles (Settings > Automation > Import/Export > Profiles tab) determine which database entries are accessed. You can duplicate/modify an existing (including standard) profile via its context menu, or create a new one from scratch via 'add new profile'. When creating a profile you must have the default system language selected in the language selector, otherwise import/export won't work. A new profile's General section defines: Profile name, Usage (import, export, or both - import-only profiles cannot be used for export), Object type (e.g. Product, Customer, Categories, Orders, Media - determines accessible DB tables/columns), Separator character (default semicolon), Enclosure character, and Import settings (whether the import may create new records - leave the ID column empty for new records - and/or update existing data by overwriting it).\n\nColumn mapping: you can optionally base the profile on an existing CSV upload so its column headers are available for assignment, or start from scratch. In the Mappings section, 'Add new mapping' creates a row; for each row you pick a database entry and enter the corresponding CSV column name (the CSV name given here must exactly match the column header used in files imported/exported with this profile). Each mapping row can be marked 'Required' (import fails if the file doesn't provide the value), given a 'Default Value' (used if the CSV cell is empty), and a 'Position' (expected column position in the CSV file); rows can be removed via their context menu. Mandatory fields for a profile are auto-added when creating it (e.g. for Product: id, taxId, productNumber, stock, name — the id column should be left empty for new records since it's system-generated).\n\nMatching identifiers ('Second Unique Identifier', Advanced Settings tab of a profile): traditionally the import required the entity's UUID in every row to match records. With a second unique identifier you can instead choose another field to match on - e.g. for products you can use productNumber instead of the UUID - by opening the profile's Advanced Settings tab, selecting the entity on the left and choosing a new identifier from the dropdown on the right. Care is needed: if the chosen identifier is not unique in the system (e.g. using a product name field when duplicate names exist), only the first matching record will be identified/imported.","citations":["merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md:10-202"],"toolCallLog":[{"tool":"Bash","args":"grep -rli 'import.*export' docs/shopware-knowledge-bases/merchant/content/en --include=*.md"},{"tool":"Read","args":"merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md (lines 1-235)"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-08":{"query":"How do custom field sets work — entity assignment, field types and technical name — and can a custom field be written through the Store API?","category":"func","option":"fs-docs","answer":"Custom fields (Settings > System > Custom fields) let you add your own fields to Shopware's entities (products, categories, etc.) to store information not present in the standard system; these can also be used in the Rule Builder or shown in the storefront. Custom fields should always be edited in the store's default language, since inheritance to other languages only applies from the default-language value - editing a translated language overrides the value only for that language.\n\nCustom fields are organized into 'sets' - a set can bundle several thematically related fields. To create a set, click 'New set': you must give it a unique technical name (this cannot be changed later), a 'position' controlling display order in the admin (higher value = further back), an optional label (can be translated into all admin languages), and crucially you choose which program areas (entities) the set applies to (e.g. products, categories, customers, etc.) - if no area is selected the set is created but not usable anywhere. Technical names may not contain Twig special characters like '-' or '#', or product exports can break.\n\nOnce a set exists, individual custom fields are added via 'New custom field'. Every field type requires a unique 'Technical name' (mandatory, cannot be changed later) plus a 'Position' within the set. The available field types are: Select (single or multi-select with defined options, each option also needing its own technical name and label), Object selection (references another entity such as product, category, country, customer, manufacturer, sales channel, payment/delivery method, dynamic product group, or experience world - the referenced object type cannot be changed after creation), Text field, Media (attach a media/image file), Number (integer or float, with steps/min/max), Date/Time, Checkbox, Active/Inactive switch (boolean 0/1), Text Editor (rich/styled text), and Color picker (palette or HEX code). Most types share common options: Available in shopping carts (needed to use the field in Rule Builder/templates), Modifiable via Store API, Label, Placeholder, and Help text (varies slightly per type).\n\nRegarding the Store API: yes - a custom field can be written through the Store API if the 'Modifiable via Store API' option is enabled when creating/editing the field. When active, this option (also described elsewhere as making the field 'public') allows the Store API to both read and modify the field's stored value - useful for capturing custom data from the storefront, e.g. new fields added to a registration form. Because enabling this exposes the field to anyone via the Store API, sensitive/critical information (e.g. customer data) should not be placed in a field with this option enabled.","citations":["merchant/content/en/shopware-6/settings/custom-fields/v1-3-2-0.md:10-266"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/custom-fields -not -path '*/.git/*'"},{"tool":"Read","args":"merchant/content/en/shopware-6/settings/custom-fields/v1-3-2-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-09":{"query":"Why doesn't my payment method appear in the checkout — what has to be configured in the administration?","category":"func","option":"fs-docs","answer":"Payment methods are managed under Settings > Commerce > Payment methods. By default, Shopware activates four payment methods (cash on delivery, invoice, prepayment, direct debit), but having a payment method 'Active' in this list does NOT automatically make it available to customers in the storefront. The decisive factor is which payment methods are assigned to the relevant sales channel: under the sales channel's 'Payment and shipping' settings, you must explicitly select which payment methods are available for that sales channel (and choose a default). So a common reason a payment method doesn't appear in checkout is that it exists and is Active globally, but has not been added to the sales channel's list of available payment methods.\n\nOther configuration points to check in the administration: the payment method's own 'Active' toggle must be on (found when editing the payment method - Payment types section: Name, Technical name, Position/order, Description, Logo, Active toggle, and 'Allow change of payment method after order completion'). Also check the payment method's 'Availability rule': if a Rule-Builder rule is assigned as the availability rule, the payment method will only be offered when that rule's conditions are met (e.g. minimum order value, customer group, shipping country, etc.) - if the conditions aren't satisfied for the current cart/customer, the method won't show up in checkout. For a payment method that should always be available without restriction, the availability rule should be left blank (NULL); an overly restrictive or misconfigured rule is a frequent cause of a payment method unexpectedly not appearing.","citations":["merchant/content/en/shopware-6/settings/Paymentmethods/v1-4-0-0.md:10-58"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Paymentmethods -not -path '*/.git/*'"},{"tool":"Read","args":"merchant/content/en/shopware-6/settings/Paymentmethods/v1-4-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-10":{"query":"How do dynamic product groups work in the administration and where can the resulting group be used?","category":"func","option":"fs-docs","answer":"Dynamic product groups are found in the admin under Catalogues > Dynamic product groups. They are groups of products formed by dynamic rules (built via the Rule Builder-style conditions module) that automatically update as products change to meet the selected conditions. When creating a group you give it a Name and optional Description, and can toggle 'Keep matching variants grouped' to control whether matching variants display grouped under a shared main product or individually (affecting categories, cross-selling, and CMS product sliders). In the Conditions area you pick a property and a condition/operator (Is equal to, Is not equal to, Is equal to any of/all of, Is not equal to any of/all of, etc.), and can combine conditions with AND/OR and nest them via sub-conditions; a Preview button shows which products currently match. Conditions can be based on products, categories, manufacturers, tags, properties/property values, price, stock, delivery time, or custom fields. The overview lists all groups with name, description, last-change date, and a status showing whether the group's rules are still valid (e.g. it becomes invalid if it relies on rules from a now-deactivated plugin); groups can be edited, duplicated, or deleted from a context menu. The resulting dynamic product group can then be used to: (1) dynamically fill the content of a category, (2) feed the product comparison feature, and (3) fill product sliders in Shopping Experiences (the product slider element lives in the Commerce block category).","citations":["merchant/content/en/shopware-6/shopware-6-de/Catalogues/Dynamicproductgroups/v1-3-0-0.md:1-149"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/index.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"grep -ril \"dynamic product group\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/merchant 2>/dev/null"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/shopware-6-de/Catalogues/Dynamicproductgroups/v1-3-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-11":{"query":"How do I create an integration for Admin API access in the administration and give it the right privileges?","category":"func","option":"fs-docs","answer":"Go to Settings > System > Integrations in the Shopware admin. Click 'Create integration', give it a name, and decide whether it should have the permissions of the administrator, or instead assign it a specific role from the dropdown (roles are defined under Settings > System > Users & Permissions > Roles). Saving generates an Access ID and a Security key for the integration - the security key is shown only once, so save it immediately; if you later edit the integration you can regenerate both via 'Regenerate API access key'. Integrations can also be edited/deleted from the overview via the context menu. To control exactly which privileges an integration/role gets: create a role under Users & Permissions, then in the Authorisations tab set, per admin area (and sub-areas), the rights View, Edit, Create, and Delete (each on the left implicitly grants the ones after it, e.g. Edit implies View, Create implies Edit+View; Delete only implies View). There are also separate 'Additional permissions' (e.g. Basic configurations, Run Updates, Maintain/Upload extensions, Logging, Clear cache, Import/Export, Shopware Store, Update own profile, Create discounts, Apps) and a 'Detailed permissions' tab for fine-grained technical read/write/create/delete rights, useful when an extension's error message indicates a missing specific privilege. Assign that role to the integration to give it exactly those privileges.","citations":["merchant/content/en/shopware-6/settings/system/integrationen/v1-1-0.md:1-35","merchant/content/en/shopware-6/settings/system/user/v1-3-0.md:61-145"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"integration\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings 2>/dev/null"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/system/integrationen/v1-1-0.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/system/user/v1-3-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-12":{"query":"A spec asks for customer-specific pricing and for a flow that calls an external URL when an order is placed — before I build either of them, does Shopware already ship them, and what has to be licensed or installed for them to exist in the shop?","category":"func","option":"fs-docs","answer":"Both already exist as built-in Shopware capabilities, but each needs a commercial add-on. Customer-specific pricing: available from the Shopware Beyond plan via the Shopware Commercial extension. It lets you offer individually calculated list, graduated, or currency-dependent prices per customer, synced in via an API (e.g. from an ERP) — creating/reading/updating/deleting custom prices is API-only, there is no admin UI module and no separate store extension to install (the feature ships as part of Shopware Commercial once the Beyond plan is active); prices show automatically in the storefront once the matching customer is logged in. Requirements per the docs: a Shopware Beyond plan plus the Shopware Commercial extension. Call-URL flow on order placement: the Flow Builder (Settings > Automation) already has an 'Action: Call URL (Webhook)' action that fires automatically when a chosen trigger (e.g. a new order) occurs, letting you pick a Method (GET/POST/PUT/PATCH/DELETE), target URL, description, parameters (mapped from store data), and optional header/body parameters. However the docs state explicitly: 'You need the Shopware Commercial extension to use the Webhook Actions.' So the spec's flow itself is a core Flow Builder feature, but the specific Call URL/Webhook action requires the Shopware Commercial extension to be licensed/installed; without it the rest of Flow Builder (e.g. email sending, order status changes) is available but the webhook call action is not.","citations":["merchant/content/en/shopware-6/extensions/customer-specific-pricing/v1-0-0-1.md:1-34","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:255-283"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"customer.specific pric...|advanced pricing\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/merchant; grep -ril \"webhook|call.*URL|http.*action\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/extensions/customer-specific-pricing/v1-0-0-1.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/features/customer-specific-pricing/v1-0-0-0.md"},{"tool":"Bash","args":"grep -n \"webhook|URL|call\" <home>/projects/host-project-kb-verify/docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md, offset=255, limit=30"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-01":{"query":"How do I add my own Admin API endpoint under `/api/...` from a plugin — a controller with the api route scope and its ACL?","category":"gap","option":"fs-docs","answer":"The corpus does not contain a dedicated step-by-step guide for adding a custom Admin API (`/api/...`) endpoint from a plugin (the only fully worked routing example is the Store API guide, which targets `/store-api/...`). From what is documented, the mechanism is analogous: a route/controller class is registered as a service and given a `#[Route]` attribute whose `defaults` set the route scope — for Store API this is `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]` (developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md:63-71); for an Admin API controller the scope default would need to be set to the Admin API's route scope class analogously, but the corpus does not name or document that class. For ACL protection, the architecture decision record on controller configuration says the legacy `@Acl` annotation was replaced by an `_acl` key placed in the same `Route` attribute's `defaults` array, e.g. `@Route(..., defaults={\"_loginRequired\"=true})` shows the pattern of putting `_acl`, `_loginRequired`, `_routeScope`, etc. as `defaults` entries (developer/resources/references/adr/2022-02-09-controller-configuration-route-defaults.md:20-58). No admin-API-specific plugin tutorial with a concrete `_acl` privilege example for a custom controller was found in this layer.","citations":["developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md:57-98","developer/resources/references/adr/2022-02-09-controller-configuration-route-defaults.md:15-60"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"api.*route.*scope\\|_routeScope\\|routeScope\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework -iname \"*acl*\" -o -iname \"*admin-api*\" -o -iname \"*api-controller*\""},{"tool":"Bash","args":"grep -rl \"acl:\" docs/shopware-knowledge-bases/developer --include=*.md; grep -rli \"custom.*acl|acl privileges|add.*acl\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Bash","args":"grep -rli \"custom controller|own controller|create.*controller\" docs/shopware-knowledge-bases/developer/guides --include=*.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework -iname \"*.md\" | xargs grep -l \"AdminApi|admin-api|api/\""},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md"},{"tool":"Bash","args":"grep -rl \"AdminApiRouteScope\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"},{"tool":"Bash","args":"grep -rl \"ApiRouteScope|_acl\\b|'_acl'|\\\"_acl\\\"\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/resources/references/adr/2022-02-09-controller-configuration-route-defaults.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/store-api/index.md"},{"tool":"Bash","args":"grep -n \"_acl|ApiRouteScope|AdminApiRouteScope\" docs/shopware-knowledge-bases/developer/resources/guidelines/code/store-api.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides -type d -iname \"*api*\" -not -path '*/.git/*'"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/development/integrations-api -maxdepth 2 -not -path '*/.git/*'"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"gap-02":{"query":"Shopware 6.7 removed the RSA JWT key files and `system:generate-jwt-secret` — what signs Admin API tokens now, and what do I have to do when upgrading?","category":"gap","option":"fs-docs","answer":"Not found in this corpus. Searching the developer layer for `jwt`, `JWT`, `generate-jwt-secret`, `APP_SECRET`, and related terms surfaces only unrelated material: a third-party `shopware-cli` command `shopware-cli project generate-jwt` (a separate tool, not the core `system:generate-jwt-secret` console command, and explicly described as needed 'only for Shopware versions before 6.5; in 6.5+, JWT secrets are generated automatically') in developer/products/tools/cli/project-commands/helper-commands.md:236-250, and the generic `APP_SECRET` environment variable entry in developer/guides/hosting/configurations/shopware/environment-variables.md:19 with no mention of JWT signing. No upgrade guide, changelog, or ADR page in the developer layer documents the 6.7 removal of RSA JWT key files or the `system:generate-jwt-secret` console command, nor what mechanism replaced RSA signing for Admin API tokens. This appears to be a genuine gap in the corpus for this specific 6.7 change.","citations":[],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"generate-jwt-secret|jwt\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Bash","args":"grep -rli \"jwt\" docs/shopware-knowledge-bases/developer --include=*.md -A2 -B2 | grep -i \"6.7|remov\""},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname \"*upgrade*\" -o -iname \"*changelog*\" -o -iname \"*6.7*\" -o -iname \"*breaking*\""},{"tool":"Bash","args":"grep -n \"jwt|JWT\" docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/upgrade-shopware.md"},{"tool":"Bash","args":"grep -n -i \"jwt\" docs/shopware-knowledge-bases/developer/products/tools/cli/project-commands/helper-commands.md"},{"tool":"Bash","args":"grep -rli \"app secret|APP_SECRET|token signing|sign.*token|symmetric\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Bash","args":"grep -n -i \"jwt|APP_SECRET\" docs/shopware-knowledge-bases/developer/guides/hosting/configurations/shopware/environment-variables.md"},{"tool":"Bash","args":"grep -rn \"generate-jwt-secret\" docs/shopware-knowledge-bases/developer --include=*.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"corpus-missing"},"gap-03":{"query":"My ERP integration stopped logging in after the 6.7 upgrade — what changed in the Admin API OAuth flow (`/api/oauth/authorize`, the `scope` format)?","category":"gap","option":"fs-docs","answer":"Not found in this corpus. The developer layer documents the current Admin API OAuth flow only in generic form: obtain an integration's `client_id`/`client_secret` under Settings > System > Integrations, then POST to `/api/oauth/token` with `grant_type: client_credentials` (or, for local development only, `grant_type: password` with a `scopes: \"write\"` field) to receive a Bearer `access_token` (developer/guides/development/integrations-api/index.md:76-107, developer/guides/development/integrations-api/auth-api-requests.md:11-38). Neither page mentions an `/api/oauth/authorize` endpoint, a version-specific `scope` format change, or any 6.7 breaking change to the OAuth flow. No upgrade guide, changelog, or ADR in the developer layer was found describing what changed in Admin API OAuth between 6.6 and 6.7. This appears to be a genuine gap in the corpus for this specific 6.7 change.","citations":[],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"oauth/authorize|oauth.*scope|api/oauth\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/auth-api-requests.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/index.md"},{"tool":"Bash","args":"grep -rn \"scope\" docs/shopware-knowledge-bases/developer/guides/development/integrations-api/*.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"corpus-missing"},"gap-04":{"query":"After upgrading to 6.7 my plugin fatals on load because core class properties now have native PHP types — which properties must I retype in my subclasses?","category":"gap","option":"fs-docs","answer":"No page in this corpus lists which specific core class properties gained native PHP types in 6.7, so no concrete list of properties to retype was found. The closest relevant material is the general backward-compatibility mechanism: planned property-type changes are announced with `#[PropertyTypeNarrowing]` / `#[PropertyTypeWidening]` attributes from the `Shopware\\Core\\Framework\\Deprecation\\BCChange` namespace (rather than `@deprecated`), each stating the version and the announced type, e.g. `#[PropertyTypeNarrowing(version: 'v6.8.0', newType: 'string')] public string|int $externalId;` (developer/resources/guidelines/code/backward-compatibility.md:376-390). For such changes the guide states: because PHP property types are invariant, an extending class cannot redeclare the property with both the current and the announced type, so you must stop redeclaring the property in subclasses and move any extension state to a differently named property or a separate object; for `PropertyTypeWidening` the guidance is to handle the announced (wider) type when reading and likewise stop redeclaring the property. To find the concrete set of properties affected for the 6.7 release, you would need to search the core codebase for these BC-change attributes on the specific classes your plugin extends — that inventory is not present in this docs layer.","citations":["developer/resources/guidelines/code/backward-compatibility.md:112-113","developer/resources/guidelines/code/backward-compatibility.md:376-390"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"native.*type|native php type|property type\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Bash","args":"grep -n -i \"native.*type|typed propert\" docs/shopware-knowledge-bases/developer/resources/guidelines/code/backward-compatibility.md"},{"tool":"Bash","args":"grep -n -i \"property type|type\" docs/shopware-knowledge-bases/developer/resources/guidelines/code/backward-compatibility.md"},{"tool":"Bash","args":"grep -rli \"typed propert|scalar type.*propert|entity.*propert.*type|struct.*propert\" docs/shopware-knowledge-bases/developer --include=*.md; find docs/shopware-knowledge-bases/developer/resources/references/adr -iname \"*type*\" -o -iname \"*6.7*\""},{"tool":"Bash","args":"grep -n -A15 \"PropertyTypeNarrowing\" docs/shopware-knowledge-bases/developer/resources/guidelines/code/backward-compatibility.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"gap-05":{"query":"My plugin decorates `CachedProductRoute` to add cache tags — where did the `Cached*Route` classes go in Shopware 6.7 and how do I cache a Store API route now?","category":"gap","option":"fs-docs","answer":"Caching is no longer implemented by decorating separate `Cached*Route` wrapper classes; it is handled through the unified HTTP-cache and cache-tag services instead. A route becomes cacheable by marking it with the `_httpCache` route default set to `true` (only `GET` requests are considered cacheable) — the mechanism is described generically for controllers (`#[Route(..., defaults: ['_httpCache' => true])]`) in developer/concepts/framework/http_cache.md:41-49. Cache invalidation of a route is driven by cache tags: instead of decorating a `Cached*Route` to add tags, you inject the `CacheTagCollector` service and call `$this->cacheTagCollector->addTag('my-custom-entity-' . $id)` while loading your data (developer/guides/plugins/plugins/framework/caching/index.md:234-248). To invalidate the cache when the underlying data changes, subscribe to `EntityWrittenContainerEvent`, check the changed primary keys for your entity, and call the `CacheInvalidator` service's `invalidate()` method with the same tags (developer/guides/plugins/plugins/framework/caching/index.md:251-289). The Storefront controller's HTTP cache is invalidated indirectly through the Store API route's cache tags, since all data loaded by a Storefront controller ultimately comes from Store API routes carrying those tags (developer/concepts/framework/http_cache.md:91-95). Also note that per developer/concepts/framework/http_cache.md:112-121, since 6.7.6.0 (with the `CACHE_REWORK` feature flag) / 6.8.0.0 by default, the `CacheResponseSubscriber` determines cacheability and applies the caching policy based on the `_httpCache` attribute and a computed `sw-context-hash`, replacing the older per-route caching classes.","citations":["developer/concepts/framework/http_cache.md:41-49","developer/concepts/framework/http_cache.md:89-121","developer/guides/plugins/plugins/framework/caching/index.md:227-290"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"CachedProductRoute|Cached.*Route\\b\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Bash","args":"grep -n -B5 -A20 \"CachedProductRoute|Cached.*Route\" docs/shopware-knowledge-bases/developer/concepts/framework/http_cache.md"},{"tool":"Bash","args":"grep -n \"Cached\" docs/shopware-knowledge-bases/developer/concepts/framework/http_cache.md"},{"tool":"Bash","args":"grep -ni \"cached\" docs/shopware-knowledge-bases/developer/concepts/framework/http_cache.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/concepts/framework/http_cache.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/caching/index.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-06":{"query":"How do I create a shipping method from my plugin's installer or migration, including the `technicalName` that 6.7 requires?","category":"gap","option":"fs-docs","answer":"This corpus has no dedicated guide for creating a shipping method from a plugin — only the analogous payment-method guide, which uses the identical repository-based pattern and explicitly documents the same `technicalName` requirement for 6.7. Following that pattern for `shipping_method.repository` instead of `payment_method.repository`: in your plugin's `install()` lifecycle method, resolve the plugin ID via `PluginIdProvider::getPluginIdByBaseClass()`, then build the entity's data array (for payment methods this includes `handlerIdentifier`, `name`, `description`, `pluginId`, `afterOrderEnabled`, and `technicalName`) and call `$repository->create([...], $context)` — only if the entity doesn't already exist (check by searching e.g. by handler/technical name first). In `uninstall()` do not delete the record (to avoid breaking existing orders); only deactivate it via `activate()`/`deactivate()` lifecycle methods that set `active` to true/false through an `update()` call. The `technicalName` field is called out explicitly: 'The `technicalName` is required for plugin-provided payment methods starting with Shopware 6.7... It must be unique and should use a plugin-specific prefix... An omitted technical name can prevent the plugin from being installed or activated' — and the guide links to the Shopware 6.7 release notes section titled 'New technicalName property for payment and shipping methods', confirming the same requirement applies to shipping methods (developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:702-729, 763-770).","citations":["developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:659-729","developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:763-770"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"shipping.method|create.*shipping method|technicalName\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/index.md"},{"tool":"Bash","args":"grep -n \"technicalName\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md, offset=650, limit=140"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"gap-07":{"query":"How do I create a media entity from a file on disk in PHP from my plugin (e.g. during an import) and generate its thumbnails?","category":"gap","option":"fs-docs","answer":"No dedicated step-by-step guide for creating a media entity from a local file in PHP (with a code example calling `FileSaver`/`MediaService`) was found in this developer-docs layer. The only concrete PHP references to the relevant classes are incidental: developer/guides/plugins/plugins/content/media/remote-thumbnail-generation.md:72-76 mentions that `FileSaver` normally 'dispatch[es] a `GenerateThumbnailsMessage`' on upload (and that this stops happening when remote thumbnails are enabled), and that `ThumbnailService` exposes `generate()`, `updateThumbnails()`, and `deleteThumbnails()` methods (which throw `MediaException::thumbnailGenerationDisabled()` if remote thumbnails are turned on). Beyond naming these classes/methods in the context of the remote-thumbnails feature, the corpus gives no worked example of instantiating them, no signature for `FileSaver`'s upload method, and no walkthrough of building the media entity plus persisting the file for a plugin import scenario. The closest full worked example is the Migration Assistant's internal `LocalMediaProcessor`, which copies local files into Shopware's media storage during a migration run (developer/products/extensions/migration-assistant/concept/media-processing.md:156-186), but that is product-specific migration-tool code, not a general plugin-authoring guide, and it does not show the thumbnail-generation call either. This is a gap in the corpus for a general 'create media + thumbnails from PHP' recipe.","citations":["developer/guides/plugins/plugins/content/media/remote-thumbnail-generation.md:68-78","developer/products/extensions/migration-assistant/concept/media-processing.md:156-186"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"thumbnail|media.*upload|MediaService\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/content/media/index.md"},{"tool":"Bash","args":"grep -rli \"FileSaver|saveMediaFile|Shopware\\\\Core\\\\Content\\\\Media\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/extensions/migration-assistant/concept/media-processing.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/howto/use-media-thumbnails.md"},{"tool":"Bash","args":"grep -rn \"generateThumbnails|ThumbnailService|FileSaver::|saveMediaFile|UploadedFile\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/content/media/remote-thumbnail-generation.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"gap-08":{"query":"How do I set up a Nuxt project with Shopware Composable Frontends against my shop's Store API — endpoint, access token, and why do I get HTTP 412?","category":"gap","option":"fs-docs","answer":"No getting-started guide for scaffolding a Nuxt project with Shopware Composable Frontends was found in this developer-docs layer, and no page anywhere in the layer mentions an HTTP 412 error. What exists is deployment-only documentation: developer/products/paas/shopware/composable-frontends/index.md describes how an already-built composable frontend (kind: `cfe` in `application.yaml`, Node 22/24/26, listening on port 3000, health endpoint `/api/healthz`) is deployed on Shopware PaaS Native — it does not cover local project setup, the Store API base URL, or how to obtain/configure a Store API access token (lines 1-53). Separately, the general Store API concept page confirms that 'Shopware provides Composable Frontends as a headless frontend implementation based on the Store API' (developer/concepts/api/store-api.md:17) and that Store API endpoints/authentication should be looked up in the external Stoplight reference rather than this corpus (developer/concepts/api/store-api.md:14-15). The only documented Store API authentication mechanism in this layer is the `sw-access-key` header, obtained from the Sales Channel's 'API access' section in the Administration, used as `curl -H \"sw-access-key: YOUR_ACCESS_KEY\" .../store-api/product` (developer/guides/development/integrations-api/index.md:132-147) — but this is generic Store API usage, not a Composable-Frontends/Nuxt-specific setup guide. A search for `412` across the developer layer returned no matches, so no explanation of that specific HTTP status in a Store API/Composable Frontends context exists in this corpus.","citations":["developer/products/paas/shopware/composable-frontends/index.md:1-53","developer/concepts/api/store-api.md:1-17","developer/guides/development/integrations-api/index.md:132-147"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"composable frontend|nuxt|@shopware-pwa|frontends\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/paas/shopware/composable-frontends/index.md"},{"tool":"Bash","args":"grep -rn \"412\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Bash","args":"grep -rli \"sw-access-key|access token|SHOPWARE_ACCESS\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Bash","args":"grep -n -i \"412|precondition\" docs/shopware-knowledge-bases/developer/products/tools/mcp-server
