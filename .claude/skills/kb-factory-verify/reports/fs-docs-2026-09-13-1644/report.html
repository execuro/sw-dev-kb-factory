.entity.extension` and the definition with `shopware.entity.definition`. If the field needs to be persisted, add a database migration creating the new table with a foreign key to `product` (including `product_version_id` if extending a versioned entity). The association is then automatically loaded whenever the product entity is loaded (because autoload was set to true on the extension's association field), and can be written via the product repository, e.g. `$this->productRepository->upsert([['id' => ..., 'exampleExtension' => ['customString' => 'foo bar']]], $context)`. For non-persisted, computed data instead of a DB association, you can add the extension data via a subscriber on `ProductEvents::PRODUCT_LOADED_EVENT` calling `$productEntity->addExtension(...)`. Since Shopware 6.6.10.0, a `BulkEntityExtension` can also be used to extend multiple entities (including product) at once by yielding entity name => fields in a `collect()` generator, tagged with `shopware.bulk.entity.extension`.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md:1-367"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides -maxdepth 2 -not -path '*/.git/*'"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins -maxdepth 2 -not -path '*/.git/*'"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/add-data-associations.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-02":{"query":"What's the plugin lifecycle in Shopware — install, activate, uninstall — and how does `keepUserData` work?","category":"dev","option":"fs-docs","answer":"A Shopware plugin extends `Shopware\\Core\\Framework\\Plugin` (which extends `Bundle`) and goes through lifecycle stages implemented as methods in the base plugin class (`<plugin root>/src/SwagBasicExample.php`): `install()` (executed on install — register entities like payment methods, create initial data, prepare requirements, but avoid creating active business data before activation), `activate()` (executed once the plugin is activated — activate entities created in install or create new ones), `deactivate()` (opposite of activate — deactivate or remove entities that shouldn't stay active), `update()` (runs on version update; DB changes should go through plugin migrations, not update() itself), `postInstall()`/`postUpdate()` (run after a successful install/update completes), and `uninstall()` (executed on uninstallation, used to remove or clean up plugin data). Each of these receives a context object (`InstallContext`, `ActivateContext`, `DeactivateContext`, `UpdateContext`, `UninstallContext`) providing plugin/Shopware version info, the system `Context`, and migration/auto-migration control. The `uninstall()` method's `UninstallContext` additionally exposes a `keepUserData()` flag: if it returns `true`, the plugin must NOT delete the persistent data it created (the user chose to keep their data on uninstall); typical code checks `if ($uninstallContext->keepUserData()) { return; }` before removing data, and otherwise proceeds to remove or deactivate the plugin's data. The docs also warn not to blindly delete entities that may be referenced by production data (e.g., a payment method used in real orders) — deactivating is often safer than deleting.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md:1-189"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-03":{"query":"How do I add a custom Store API route for a headless storefront?","category":"dev","option":"fs-docs","answer":"1) Create an abstract route class (e.g. `AbstractExampleRoute`) in `<plugin root>/src/Core/Content/Example/SalesChannel/` with an abstract `getDecorated(): AbstractExampleRoute` method and an abstract `load(Criteria $criteria, SalesChannelContext $context): ExampleRouteResponse` method — this abstraction is what makes the route decoratable. 2) Create the concrete route class (`ExampleRoute`) extending the abstract class, annotate it with `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]])]`, inject the entity's `EntityRepository` via constructor, implement `getDecorated()` to throw `DecorationPatternException` (since there is no decoration yet), and implement `load()` with `#[Route(path: '/store-api/example', name: 'store-api.example.search', methods: ['GET','POST'], defaults: ['_entity' => 'swag_example'])]` returning `new ExampleRouteResponse($this->exampleRepository->search($criteria, $context->getContext()))`. Note: all fields you want exposed via the API need the `ApiAware` flag in the entity definition. 3) Create the response class `ExampleRouteResponse extends StoreApiResponse`, exposing a getter (e.g. `getExamples()`) that returns `$this->object->getEntities()`. 4) Register the route class as a service in `services.php`, injecting the repository (`service('swag_example.repository')`). 5) Register the route for discovery in `<plugin root>/src/Resources/config/routes.php` via `$routes->import('../../Core/**/*Route.php', 'attribute')` — a route can be a correctly-defined service without being reachable until this import happens. 6) Verify with `./bin/console debug:router store-api.example.search` (this only confirms routing discovery, not that the service constructs or the request succeeds). 7) Optionally document it for the OpenAPI/Stoplight schema by adding a JSON file under `<plugin root>/src/Resources/Schema/StoreApi/`. To also expose the same functionality to the (non-headless) Storefront, wrap the route in a Storefront controller with the `StorefrontRouteScope`, register it in the same `routes.php` (importing `../../Storefront/**/*Controller.php`), and call it via a custom Storefront JS plugin using `fetch`.","citations":["developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md:1-421"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/store-api -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-04":{"query":"How do I create a custom CMS element for Shopping Experiences?","category":"dev","option":"fs-docs","answer":"A CMS element is the smallest content primitive placed in a slot of a CMS block. To create one: In the Administration, follow the recommended structure `<plugin root>/src/Resources/app/administration/src/module/sw-cms/elements/<elementName>/` with `index.js`, `component/` (index.js + twig + scss), `config/` (index.js + twig), and `preview/` (index.js + twig + scss). 1) Import the element folder in `main.js` (`import './module/sw-cms/elements/<name>';`). 2) In the element's `index.js`, call `Shopware.Service('cmsService').registerCmsElement({ name, label, component, configComponent, previewComponent, defaultConfig, ... })` — `name` is the technical name, `component` is the Vue component that renders the element in the editor, `configComponent` renders the settings panel, `previewComponent` renders the thumbnail in the element picker, and `defaultConfig` defines default config values (each with `source`/`value`). Optional flags `hidden` and `removable` control UI visibility/removability. 3) Create the preview component with `Shopware.Component.register('cms-el-preview-<name>', {...})`. 4) Create the main component similarly, using the `cms-element` mixin (provides common props/data mapping) and calling `this.initElementConfig('<name>')` in `created()`; include fallback content so the element isn't invisible in the editor. 5) Create the config component the same way, with form fields (e.g. Shopware Meteor components) bound to `element.config.<field>.value`, also using the `cms-element` mixin and `initElementConfig`. 6) Optionally support field inheritance between base layout and content pages by wrapping fields with the `sw-cms-inherit-wrapper` component, passing `field`, `element`, and `label`, and using the `isInherited` slot prop to disable the input. For the Storefront rendering, add a Twig template at `src/Resources/views/storefront/element/cms-element-<name>.html.twig` (the `cms-element-` prefix plus the element's technical name is mandatory) — the `element` variable is passed automatically with its config. Clear the Storefront cache after adding new templates. Related core reference: `\\Shopware\\Core\\Content\\Cms\\SalesChannel\\SalesChannelCmsPageLoader::load`. Once created, the element can be placed into a CMS block (see the 'Add custom CMS block' guide).","citations":["developer/guides/plugins/plugins/content/cms/add-cms-element.md:1-254"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/content/cms -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/content/cms/add-cms-element.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-05":{"query":"How does theme inheritance work in Shopware — theme.json and SCSS overrides?","category":"dev","option":"fs-docs","answer":"Theme inheritance is configured in the theme's `theme.json` file, located at `<plugin root>/src/Resources/theme.json`. It has `views`, `style`, `script`, `asset` (and optionally `configInheritance`) arrays, each of which can list theme placeholders like `@Storefront`, `@Plugins`, and the technical names of other themes (e.g. `@SwagBasicExampleTheme`) alongside your own theme's files. Every theme already inherits Shopware's default theme `@Storefront`. To make a theme (e.g. `SwagBasicExampleThemeExtend`) inherit from another custom theme (`SwagBasicExampleTheme`), you add `@SwagBasicExampleTheme` into the inheritance chain of each relevant section, positioned between `@Storefront` and your own theme's entry. Order matters: in `views`, the Storefront template is rendered first as the base, then plugin extensions, then the parent theme (`@SwagBasicExampleTheme`) changes, and finally your own theme's changes are applied on top. The `script` section resolves the same way — Storefront JS first, then the parent theme's JS, then your own. The `style` (SCSS) section works similarly, but your own `overrides.scss` is placed at the very top of the list (before the inherited theme) because it can affect SCSS variables (e.g. `$border-radius`) that need to be set before the rest of the SCSS is compiled — variable overrides must come first for Sass to pick them up. The `asset` section requires you to explicitly list `@SwagBasicExampleTheme` if you want to reuse its assets. The `configInheritance` section defines which theme's field configuration values (theme manager settings) are inherited — the last theme in that list different from the current theme becomes the parent for configuration purposes; the base Storefront theme configuration is always inherited even without a `configInheritance` entry.","citations":["developer/guides/plugins/themes/inheritance/add-theme-inheritance.md:1-123"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/themes -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/themes/inheritance/add-theme-inheritance.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-06":{"query":"How do I add a custom Flow Builder action?","category":"dev","option":"fs-docs","answer":"Backend (PHP) part: 1) Create an 'Aware' interface for your action's data needs (e.g. `TagAware` extending `Shopware\\Core\\Framework\\Event\\FlowEventAware`, marked with `#[IsFlowEventAware]`), placed in `<plugin root>/src/Core/Framework/Event/`, exposing constants for store keys (e.g. `TAG`, `TAG_ID`) and getters. 2) Create the action class in `<plugin root>/src/Core/Content/Flow/Dispatching/Action/`, extending `Shopware\\Core\\Content\\Flow\\Dispatching\\Action\\FlowAction`: implement `static getName(): string` returning a unique technical name (e.g. `action.create.tag`); implement `requirements(): array` returning the Aware interfaces the action needs — an empty array makes it available for all triggers, a list of specific Aware interfaces (e.g. `OrderAware`, `CustomerAware`) restricts it to those, or your own new Aware interface restricts it to a new custom event; implement `handleFlow(StorableFlow $flow): void` doing the actual work, reading `$flow->getConfig()` for the configured data, `$flow->getStore($key)` for Aware-interface-provided data, and `$flow->getData($key)` for event/original data, then using an injected `EntityRepository` to perform the change. 3) Register the action as a service in `services.php` tagged `flow.action` with a `priority` (e.g. 600) and `key` matching the action name — this tag makes it appear in `/api/_info/flow-actions.json`. 4) If the action should be available for a brand-new event (not an existing one), create the event class implementing your Aware interface, and register it via a `BusinessEventCollectorSubscriber` listening to `BusinessEventCollectorEvent::NAME`, calling `$businessEventCollector->define(YourEvent::class)` and adding it to the collection, plus registering that subscriber with tag `kernel.event_subscriber`, and adding a snippet for the trigger label. Administration (UI) part: 5) Define a JS constant for the action name and a `GROUP` (e.g. `customer`, `order`, `tag`, or default `general`) in a constants file, and add snippet translations (en-GB.json/de-DE.json) for title/labels. 6) Override the core `sw-flow-sequence-action` component (via `Component.override`) to: push your group into `groups()`, return your custom modal name (e.g. `sw-flow-create-tag-modal`) from `modalName()` when your action is selected, and provide `getActionDescriptions`/`getActionTitle` overrides for your action. Import this extension file in `main.js`. 7) Create your configuration modal component (JS + Twig) under `src/Resources/app/administration/src/component/<modal-name>/`, using `repositoryFactory` to load related data (e.g. tags), emitting `process-finish` with a `config` object when the user saves, and import it in `main.js` as well. Alternatively, for simple actions you can skip the modal entirely by overriding `openDynamicModal(value)` in `sw-flow-sequence-action` to detect your action and call `this.onSaveActionSuccess({ config })` directly with a hardcoded or API-derived config.","citations":["developer/guides/plugins/plugins/framework/flow/add-flow-builder-action.md:1-735"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/flow -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/flow/add-flow-builder-action.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-07":{"query":"My plugin needs to store its own data in a new table — how do I define a custom DAL entity with its definition, entity and collection class so I get a repository for it?","category":"dev","option":"fs-docs","answer":"1) Create the database table via a plugin migration (e.g. `<plugin root>/src/Migration/Migration<timestamp>Example.php` extending `MigrationStep`, implementing `getCreationTimestamp()` and `update(Connection $connection)` with the `CREATE TABLE` SQL — prefix the table name with your plugin/manufacturer prefix, e.g. `swag_example`). 2) Create an `EntityDefinition` class, e.g. `<plugin root>/src/Core/Content/Example/ExampleDefinition.php`, extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityDefinition`. Implement `getEntityName(): string` returning the table name constant (`ENTITY_NAME`, e.g. `swag_example` — this name is used both as the DB table name and as the repository service id `<name>.repository`), and `defineFields(): FieldCollection` returning a `FieldCollection` of `Field` objects (e.g. `IdField` with `Required`+`PrimaryKey` flags, `StringField`, `BoolField`) matching your table's columns (created_at/updated_at are implicit and don't need to be defined). Register the definition in `services.php` tagged `shopware.entity.definition` with `['entity' => 'swag_example']`. At this point the repository already works with generic `ArrayEntity` results. 3) (Recommended) Create a custom `Entity` class, e.g. `ExampleEntity extends Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity` using the `EntityIdTrait`, with `protected` (not readonly) properties matching each field plus getters/setters. Wire it into the definition by overriding `getEntityClass(): string` to return `ExampleEntity::class`. 4) (Recommended) Create a custom `EntityCollection` class, e.g. `ExampleCollection extends Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityCollection`, overriding `getExpectedClass(): string` to return `ExampleEntity::class` (optionally add helper filter methods). Wire it into the definition via `getCollectionClass(): string` returning `ExampleCollection::class`. Once registered this way, the entity is fully usable via the Data Abstraction Layer, exposed via the API, and CRUD-able through its auto-generated repository (`swag_example.repository`).","citations":["developer/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md:1-316"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-08":{"query":"In a plugin service, what is the Shopware 6 equivalent of Doctrine's `findBy()` — how do I read products with filters, associations and sorting?","category":"dev","option":"fs-docs","answer":"Shopware 6 has no ORM/Doctrine — it uses the Data Abstraction Layer (DAL), and reading is done via the auto-generated repository for the entity (service id `<entity_name>.repository`, e.g. `product.repository`), injected into your service via `services.php`/constructor, combined with a `Criteria` object (`Shopware\\Core\\Framework\\DataAbstractionLayer\\Search\\Criteria`) passed to `$repository->search($criteria, $context)`, which returns an `EntitySearchResult` (an iterable `EntityCollection`). Basic read: `$this->productRepository->search(new Criteria(), $context)`. Search by IDs: `new Criteria([$myId])` then `->first()`. Filter by any field: build a `Criteria`, call `$criteria->addFilter(new EqualsFilter('name', 'Example name'))` (`EqualsFilter` is the SQL equivalent of `WHERE field = value`; many other filter classes exist, e.g. `RangeFilter`). Combine filters with `OrFilter`/`AndFilter`/`NandFilter` wrapping multiple filter instances. Use `addPostFilter` instead of `addFilter` when you want the filter applied to the result but not to aggregations. Add associations with `$criteria->addAssociation('productReviews')` (dot-chainable, e.g. `'productReviews.customer'`), and filter an association's own criteria via `$criteria->getAssociation('productReviews')->addFilter(...)` (note: filtering via `getAssociation` still returns the parent entity even if the association has no matches, whereas adding the filter directly on the parent's `addFilter('productReviews.points', ...)` restricts the parent results too). Many-to-many mapping entities (e.g. `product_category`) cannot be fetched with `search()` — use `searchIds()` instead since they only consist of two primary keys. Aggregate data with `$criteria->addAggregation(new AvgAggregation('avg-rating', 'productReviews.points'))` and read via `$result->getAggregations()->get('avg-rating')` (don't call `first()` when you need aggregations). Limit/page/sort with `$criteria->setLimit()`, `$criteria->setOffset()`, and `$criteria->addSorting(new FieldSorting('createdAt', FieldSorting::ASCENDING))`. For iterating very large result sets without exhausting memory, use `RepositoryIterator` (`new RepositoryIterator($repository, $context, $criteria)`, then loop `while (($result = $iterator->fetch()) !== null)`), making sure the Criteria's sorting is deterministic (e.g. always include a unique field like `id` in the sort) to avoid duplicate/skipped entities across batches.","citations":["developer/guides/plugins/plugins/framework/data-handling/reading-data.md:1-391"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/reading-data.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-09":{"query":"How do I make a field on my plugin's own entity translatable per language?","category":"dev","option":"fs-docs","answer":"1) Create a translation database table named `<entity_name>_translation` (e.g. `swag_example_translation` for the `swag_example` entity) via a plugin migration, with columns `<entity>_id` (FK to your entity, e.g. `swag_example_id`), `language_id` (FK to `language`), the translatable column(s) (e.g. `name`), `created_at`, `updated_at`, and a composite primary key on (`<entity>_id`, `language_id`) with cascading foreign keys. 2) Create an `ExampleTranslationDefinition` (placed in `<plugin root>/src/Core/Content/Example/Aggregate/ExampleTranslation/`) extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityTranslationDefinition` instead of the plain `EntityDefinition`. Override `getParentDefinitionClass()` to return your main entity's definition class (`ExampleDefinition::class`), and in `defineFields()` only declare the translatable field(s) (e.g. `(new StringField('name', 'name'))->addFlags(new Required())`) — base fields like `language_id` are added automatically by `EntityTranslationDefinition`. Register it in `services.php` with the `shopware.entity.definition` tag, registered after the main entity's definition. 3) Create `ExampleTranslationEntity extends Shopware\\Core\\Framework\\DataAbstractionLayer\\TranslationEntity` (which already provides getters/setters for `language_id`), adding properties+getters/setters for the foreign key id (e.g. `exampleId`), the translated field (`name`), and an association property back to the parent entity (`example`). Wire it via `getEntityClass()` on the translation definition. 4) Create an `ExampleTranslationCollection extends EntityCollection` overriding `getExpectedClass()` to return `ExampleTranslationEntity::class`, and wire it via `getCollectionClass()` if desired. 5) On the main entity's `EntityDefinition` (`ExampleDefinition`), add a `TranslatedField('name')` (with flags like `ApiAware`, `Required`) instead of a plain field, plus a `TranslationsAssociationField(ExampleTranslationDefinition::class, 'swag_example_id')` to associate the translations. When reading translated data later, the docs recommend using `entity.translated.field` in storefront/sales-channel contexts, and the plain `entity.field` in Admin/CRUD flows where you need the value for the current working language (see the linked 'Plain vs translated entity fields' concept doc).","citations":["developer/guides/plugins/plugins/framework/data-handling/add-data-translations.md:1-299"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/add-data-translations.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-10":{"query":"How do I write an indexer that precomputes derived data for my custom entity on write, and how do I trigger a full reindex?","category":"dev","option":"fs-docs","answer":"Create a class extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Indexing\\EntityIndexer` (e.g. `<plugin root>/src/Core/Framework/DataAbstractionLayer/Indexing/ExampleIndexer.php`) and implement: `getName(): string` — a unique indexer name used by the `EntityIndexerRegistry` to route messages; `iterate($offset): ?EntityIndexingMessage` — called for a full reindex (triggered by `bin/console dal:refresh:index` or the Administration's 'update all indexes' action); use `IteratorFactory::createIterator($repository->getDefinition(), $offset)` to fetch a batch of IDs and return `new EntityIndexingMessage(array_values($ids), $iterator->getOffset())`, or `null` when there are no more records; `update(EntityWrittenContainerEvent $event): ?EntityIndexingMessage` — called whenever entities are written via the DAL; extract the changed primary keys with `$event->getPrimaryKeys(<Definition>::ENTITY_NAME)` and return a new `EntityIndexingMessage` for them (or `null` if nothing changed) — you can filter further on which columns changed to save performance; and `handle(EntityIndexingMessage $message): void` — processes the messages generated by `iterate()`/`update()` (executed synchronously by default right after `update()`, or asynchronously via the Message Queue by passing `$forceQueue = true` as `EntityIndexingMessage`'s 4th constructor parameter) to actually write the precomputed/derived data, preferably using the DBAL `Connection` directly rather than the DAL/repository, because writes made via the DAL would themselves fire `EntityWrittenContainerEvent` and re-trigger the same indexer, causing an infinite loop (if you must use the DAL inside the indexer, disable indexing by calling `$context->addState(EntityIndexerRegistry::DISABLE_INDEXING)` before writing). Register the indexer as a service tagged `shopware.entity_indexer`, injecting `IteratorFactory`, the relevant `EntityRepository`, and `Connection`. Alternatively, instead of writing a new indexer for an *existing* core entity, you can subscribe to events already dispatched by existing indexers in their `handle()` method (e.g. `CustomerIndexer`, `CategoryIndexer`, `ProductIndexer`, `ProductStreamIndexer`, `PromotionIndexer`, `RuleIndexer`, `MediaIndexer`, `MediaFolderIndexer`, `MediaFolderConfigurationIndexer`, `SalesChannelIndexer`, `LandingPageIndexer`, `BreadcrumpIndexer`) — e.g. subscribing to `CustomerIndexerEvent` and again preferring the `Connection` directly (e.g. via `MultiInsertQueryQueue`) over the DAL to avoid re-triggering indexing. To trigger a full reindex of all registered entity indexers, run the console command `bin/console dal:refresh:index` (this is what calls `iterate()` on every registered indexer), or trigger it from the Administration settings UI.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-data-indexer.md:1-289"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/add-data-indexer.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-11":{"query":"On Shopware 6.7, which file do I declare my plugin's services in, and how do I get a core service passed into my service's constructor?","category":"dev","option":"fs-docs","answer":"In Shopware 6.7 plugin services are declared in PLUGIN_ROOT/src/Resources/config/services.php (a PHP file using Symfony's ContainerConfigurator), not services.xml — XML plugin configuration is deprecated in 6.7 and removed in 6.8. To get a core service passed into your service's constructor, either rely on autowire/autoconfigure (declared for your services.php) so Symfony injects it automatically based on the constructor's type-hint, or declare it explicitly by adding it as an argument via $services->set(ExampleService::class)->args([service(SystemConfigService::class)]) in services.php, matching a typed constructor parameter such as private SystemConfigService $systemConfigService.","citations":["developer/guides/plugins/plugins/services/dependency-injection.md:1-79","developer/resources/references/adr/2026-07-30-migrate-container-configuration-from-xml-to-php.md:1-37"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"grep -rl \"services.xml\" docs/shopware-knowledge-bases/developer --include=*.md -l | head -20"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -not -path '*/.git/*' -ipath '*dependency-injection*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/services/dependency-injection.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/resources/references/adr/2026-07-30-migrate-container-configuration-from-xml-to-php.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-12":{"query":"I am on Shopware 6.6 — which file do I declare my plugin's service dependencies in, and how do I pass another service into the constructor?","category":"dev","option":"fs-docs","answer":"On 6.6 the plugin service dependencies are declared in PLUGIN_ROOT/src/Resources/config/services.xml — the ADR on migrating container configuration from XML to PHP states plugins shipped services.xml \"by convention\" before the change, and that XML plugin configuration is only deprecated starting in 6.7 (removed in 6.8), meaning on 6.6 services.xml is still the standard, non-deprecated file. The current developer guide (which documents the newer services.php format) shows the same mechanics that apply to the XML file conceptually: to pass another service (e.g. SystemConfigService) into your service's constructor, either rely on autowire/autoconfigure so Symfony injects it automatically based on the constructor's type-hinted parameter, or declare the dependency explicitly by adding it as an <argument> reference for the service so it matches the constructor parameter. Note the corpus's currently maintained dependency-injection guide only shows the services.php syntax explicitly (services.xml examples are not present verbatim in this corpus).","citations":["developer/resources/references/adr/2026-07-30-migrate-container-configuration-from-xml-to-php.md:16-30","developer/guides/plugins/plugins/services/dependency-injection.md:20-53"],"toolCallLog":[{"tool":"Bash","args":"grep -n \"6.6|services.xml|services.php\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins/services/add-custom-service.md | head -30"},{"tool":"Bash","args":"grep -rn \"6.6\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins/services/*.md; find docs/shopware-knowledge-bases/developer -not -path '*/.git/*' -iname \"*upgrade*\""}],"notFoundClaim":false,"memoryClaims":["services.xml traditionally used Symfony <argument> tags with class references to wire constructor dependencies in Shopware 6.6 plugins [from memory]"],"sourceVerdict":"partial"},"dev-13":{"query":"There is no event for what I need to change in a core Shopware service — how do I decorate or replace that service from my plugin?","category":"dev","option":"fs-docs","answer":"Use service decoration: Shopware services designed for decoration expose an abstract class as their contract (with a getDecorated() method) rather than a PHP interface, so new methods can be added without immediately breaking existing decorators. In your plugin's services.php, register your decorator class and call ->decorate(OriginalService::class)->args([service('.inner')]) on it; the '.inner' reference injects the original (or previously decorated) service into your decorator's constructor. Your decorator class must extend the same abstract class, implement getDecorated() to return the inner service, and delegate to it in overridden methods (e.g. return $this->decoratedService->doSomething() . ' ...') so other decorators/core logic in the chain still run — a decorator that doesn't call the inner service silently breaks the rest of the chain. Always type-hint the abstract class (never the concrete class) in constructors so your service stays part of the decoration chain. Decoration should be used specifically when there is no designed extension point/event for the change; prefer extension points/events when they exist, since they let multiple extensions participate without forming a fragile chain.","citations":["developer/guides/plugins/plugins/services/adjusting-service.md:8-166"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -not -path '*/.git/*' -iname \"*decorat*\""},{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/plugins/plugins/services/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/services/adjusting-service.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-14":{"query":"I wrote a subscriber class in my plugin but it never fires — which interface and which service tag (`shopware.event_subscriber`?) register it?","category":"dev","option":"fs-docs","answer":"Your subscriber class must implement Symfony's EventSubscriberInterface (implementing getSubscribedEvents(), returning an array of <event> => <method> pairs). Implementing the interface alone is not enough: the class must also be registered as a service in your plugin's services.php and tagged with kernel.event_subscriber (not shopware.event_subscriber) — e.g. $services->set(MySubscriber::class)->tag('kernel.event_subscriber'). If the class is missing from services.php or the tag is missing, Shopware will not call it and there may be no obvious error indicating the event was not handled.","citations":["developer/guides/plugins/plugins/framework/event/listening-to-events.md:31-145"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -not -path '*/.git/*' -iname \"*listening-to-events*\""},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/event/listening-to-events.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-15":{"query":"How do I work out which event Shopware actually dispatches for a given action, for example after a product is loaded or a page is rendered?","category":"dev","option":"fs-docs","answer":"For DAL entity actions the pattern is always `entity_name.event` (e.g. product.loaded, product.written); some entities also expose an 'event class' with constants for all possible events (e.g. ProductEvents), found by searching for the term @Event in the codebase. For general PHP events: (1) read the core code you want to extend and look for `$this->eventDispatcher->dispatch($event, $event->getName())` calls; (2) search the shopware src/vendor directory for `extends NestedEvent`, `extends Event`, `implements ShopwareEvent` (finds the event classes themselves) or `->dispatch` (finds where events are fired); (3) check a service's constructor/service definition for an injected `event_dispatcher` — if present, that service likely dispatches at least one event. Specific known families: 'page is being loaded' events are fired by page loaders such as GenericPageLoader, which dispatches a GenericPageLoadedEvent — search for the term \"PageLoadedEvent\"; Criteria-loading events are found by searching for \"CriteriaEvent\"; route-specific events like `{route}.request`, `{route}.response`, `{route}.render` (storefront, before Twig rendering), `{route}.encode` (Store-API, since 6.6.11.0) and `{route}.controller` (since 6.6.11.0) are available for every Symfony route by substituting the actual route name; business events (e.g. CustomerLoginEvent) can be found via `implements BusinessEventInterface` or `implements MailActionInterface`. Finally, the easiest way to see everything actually fired in a live request is the Symfony profiler's 'Events' tab, which lists every event fired during that request along with the name to subscribe to.","citations":["developer/guides/plugins/plugins/framework/event/finding-events.md:8-259"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -not -path '*/.git/*' -ipath \"*event*\" -iname \"*.md\" | grep -iv \"b2b|migration-assistant\" | head -30"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/event/finding-events.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-16":{"query":"How do I run plugin logic whenever an order is written, and find out exactly which fields changed?","category":"dev","option":"fs-docs","answer":"Create an event subscriber implementing EventSubscriberInterface and subscribe to OrderEvents::ORDER_WRITTEN_EVENT with a handler that takes an EntityWrittenEvent, checking $event->getContext()->getVersionId() !== Defaults::LIVE_VERSION and returning early so you only react to the live version (edits in the admin create a draft version merged into live on save). By default a changeset of what actually changed is NOT generated on the write event for performance reasons. To get it, additionally subscribe to PreWriteValidationEvent (fired before the write result set is generated) and, in that handler, loop over $event->getCommands(), skip commands that don't implement ChangeSetAware, skip commands whose getEntityName() isn't OrderDefinition::ENTITY_NAME, and call $command->requestChangeSet() on the matching ones. Then in the ORDER_WRITTEN_EVENT handler, iterate $event->getWriteResults() and call $result->getChangeSet() on each to read the actual field-level changes. Note an insert command cannot produce a changeset since nothing changed yet (a brand-new entity was created).","citations":["developer/guides/plugins/plugins/checkout/order/listen-to-order-changes.md:8-139"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"ChangeSet|getChangeSet|writeResult\" docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/order/listen-to-order-changes.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-17":{"query":"How do I overwrite the price of a product line item in the cart at runtime from a plugin?","category":"dev","option":"fs-docs","answer":"Use a combined cart collector + processor (this technique should rarely be used — for adding a discount/surcharge, use a dedicated discount instead; overwriting price is meant for cases like live-shopping). The collector implements Shopware\\Core\\Checkout\\Cart\\CartDataCollectorInterface::collect(CartDataCollection $data, Cart $original, SalesChannelContext $context, CartBehavior $behavior): it filters the cart's product line items, fetches the new price for each (your own logic, e.g. from an entity extension or external API), and stores it in the CartDataCollection keyed by a prefixed line item/product id (skipping ids already fetched to avoid duplicate work across repeated collect() calls). The processor implements CartProcessorInterface::process(CartDataCollection $data, Cart $original, Cart $toCalculate, SalesChannelContext $context, CartBehavior $behavior): it iterates the product line items of $toCalculate (the cart instance that will actually be used — not $original), reads the stored new price for each from $data, builds a QuantityPriceDefinition($newPrice, $product->getPrice()->getTaxRules(), $product->getPrice()->getQuantity()), calculates it via the injected Shopware\\Core\\Checkout\\Cart\\Price\\QuantityPriceCalculator, and applies it with $product->setPrice($calculated) and $product->setPriceDefinition($definition). Never query the database inside process() — only inside collect(). Register the class (which can implement both interfaces) in services.php tagged with both shopware.cart.processor and shopware.cart.collector, e.g. with priority 4500 so it runs after the product collector/processor.","citations":["developer/guides/plugins/plugins/checkout/cart/change-price-of-item.md:8-289"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -not -path '*/.git/*' -ipath \"*cart*\" -iname \"*.md\" | grep -iv \"b2b\""},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/cart/change-price-of-item.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-18":{"query":"My plugin's cart processor adds a surcharge line item, but it is added again on every recalculation and its price is stale after the customer changes the quantity — how do I split the work between the collector and the processor?","category":"dev","option":"fs-docs","answer":"The cart is recalculated multiple times per request, and CartProcessorInterface::process() runs multiple times per request too — it must not run database/API queries and must stay deterministic. The collector's job is only to load external data once: CartDataCollectorInterface::collect() must check whether the data was already loaded (e.g. via CartDataCollection::has($key)) and only fetch/append it if missing, storing it in the CartDataCollection so it is not re-queried on every pass. The surcharge line item itself, and its price, must be (re)built inside process() on every call, computed from the current state of the $toCalculate cart (not $original) — e.g. by filtering $toCalculate->getLineItems() for the relevant products and using a PriceCalculator such as PercentagePriceCalculator or QuantityPriceCalculator against the products' current prices/quantities in $toCalculate, then $toCalculate->add(...)-ing the freshly calculated line item. Because $toCalculate reflects the up-to-date quantities for that calculation pass, rebuilding the surcharge in process() each time (rather than caching a stale computed price from collect()) keeps the price in sync when the customer changes quantity. Do not add the surcharge or compute its final price inside collect() — collect() is for gathering/caching external data only; all price calculations must go through the Shopware\\Core\\Checkout\\Cart\\Price calculator classes inside process().","citations":["developer/guides/plugins/plugins/architecture/cart-process.md:8-32","developer/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md:17-105","developer/guides/plugins/plugins/checkout/cart/add-cart-discounts.md:18-121"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/cart/add-cart-discounts.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/architecture/cart-process.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/cart/index.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-19":{"query":"I need to move long-running work in my plugin out of the request into the message queue — what does the handler class look like and how is it registered?","category":"dev","option":"fs-docs","answer":"Create a handler class (e.g. SmsHandler) marked with the PHP attribute #[AsMessageHandler] on the class, implementing an __invoke(SmsNotification $message) method that does the actual long-running work; the message parameter is type-hinted to your custom message class. The handler is invoked once the message is dispatched by the handle_messages middleware, and you can define multiple handlers for the same message. Registration is done by tagging the handler service with the messenger.message_handler tag (the #[AsMessageHandler] attribute is what marks/registers it as such).","citations":["developer/guides/plugins/plugins/framework/message-queue/add-message-handler.md:8-46"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -not -path '*/.git/*' -ipath \"*message-queue*\" -iname \"*.md\" | grep -iv b2b"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/message-queue/add-message-handler.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-20":{"query":"How do I add my own condition to the Rule Builder from a plugin so shop owners can select it?","category":"dev","option":"fs-docs","answer":"Backend (PHP): create a rule class (e.g. FirstMondayOfTheMonthRule) in <plugin root>/src/Core/Rule extending the abstract Shopware\\Core\\Framework\\Rule\\Rule. Implement getName() (a unique technical name, e.g. 'first_monday'), match(RuleScope $scope): bool (the actual condition logic — never run DB queries or slow operations here), and getConstraints() (array of field names to Symfony Validator constraints, e.g. ['isFirstMondayOfTheMonth' => [new Type('bool')]]). Rule fields must be declared 'protected', not 'private'. Register the class in services.php tagged as shopware.rule.definition. Optionally implement getConfig() returning a RuleConfig (e.g. (new RuleConfig())->booleanField('isFirstMondayOfTheMonth')) to auto-render the generic sw-condition-generic UI and skip building a custom Administration component/template. Administration (JS): decorate the ruleConditionDataProviderService (RuleConditionService) — e.g. in <plugin root>/src/Resources/app/administration/src/decorator/rule-condition-service-decoration.js — via Shopware.Application.addServiceProviderDecorator('ruleConditionDataProviderService', (ruleConditionService) => { ruleConditionService.addCondition('first_monday', { component: 'swag-first-monday', label: '...', scopes: ['global'] }); return ruleConditionService; }); the condition name must match getName() from the PHP rule. Import this decorator from a main.js entry point. If not using getConfig(), also create the custom component (extending sw-condition-base) and its Twig template overriding the sw_condition_value_content block to render the input. Optionally use ruleConditionService.upsertGroup(...) plus a 'group' property on the condition to place it in its own group in the Administration list. Note rules are 'context-aware': a rule may not be selectable everywhere (e.g. promotions) unless you configure awareness via getAwarenessConfigurationByAssignmentName/addAwarenessConfiguration and use the sw-select-rule-create component with a matching rule-aware-group-key.","citations":["developer/guides/plugins/plugins/framework/rule/add-custom-rules.md:8-369"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -not -path '*/.git/*' -ipath \"*rule*\" -iname \"*.md\" | grep -iv b2b"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/rule/add-custom-rules.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-21":{"query":"My plugin dispatches its own domain event — how do I make it show up as a trigger in the Flow Builder?","category":"dev","option":"fs-docs","answer":"Make your event class implement FlowEventAware (plus a relevant Aware interface such as CustomerAware/OrderAware/MailAware/UserAware/SalesChannelAware, or a custom Aware interface with a matching FlowStorer if you need custom data not covered by an existing Aware). Any event implementing FlowEventAware becomes eligible for the trigger list. Then register the event with the flow trigger list by creating an EventSubscriberInterface subscriber that listens to BusinessEventCollectorEvent, calls $businessEventCollector->define(YourEvent::class), and adds the resulting definition to the collection via $collection->set(...) — give this subscriber a high priority (e.g. 1000) so it registers before other BusinessEventCollectorEvent subscribers. Register the subscriber as a service tagged 'kernel.event_subscriber' in src/Resources/config/services.php. After installing, the event appears in Administration under Settings > Flow Builder > Add flow, searchable by its event name, with actions available based on which Aware interfaces it implements.","citations":["developer/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md:28-42","developer/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md:337-407"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"find developer/guides/plugins -maxdepth 3 -type d"},{"tool":"Bash","args":"find plugin subdirectories for flow/administration/mail/seo/etc, grep -ril pagelet"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-22":{"query":"How do I give my plugin a settings page the shop operator can fill in, and what field types are available?","category":"dev","option":"fs-docs","answer":"Create a src/Resources/config/config.xml file in your plugin; no custom Administration module or templating is required, and Shopware renders it dynamically in the Administration. Structure the content in one or more <card> elements, each needing a <title> and at least one <input-field> (each input-field needs at least a <name>, which must be at least 4 characters, start with a letter, and be unique). The type attribute selects the field type; available <input-field> types are: text, textarea, text-editor, url, password, int, float, bool, checkbox, datetime, date, time, colorpicker, single-select, and multi-select. Additional common settings include label/placeholder/helpText, defaultValue, disabled, required, copyable (text-like fields), min/maxLength (text/url/password), min/max (int/float), and options (for single/multi-select). For more complex needs you can use a <component name=\"...\"> element to render Administration components such as sw-entity-single-select, sw-entity-multi-id-select, sw-media-field, sw-text-editor, and sw-snippet-field. cache-relevant=\"true\" can be set on input-field/component elements whose value affects cached Storefront output (available from 6.7.12.0). After defining the config, the shop operator fills it in via Extensions > My extensions > Plugins > Configure in the Administration.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md:100-123","developer/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md:301-394","developer/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md:471-477"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-23":{"query":"How do I ship a mail template with my plugin so it is installed automatically, including a custom mail template type?","category":"dev","option":"fs-docs","answer":"Ship the mail template via a plugin database migration (not the Administration UI). In the migration's update() method: 1) get an existing mail_template_type ID (e.g. by selecting from mail_template_type WHERE technical_name = 'contact_form'), or create your own custom type by inserting into mail_template_type with a unique technical_name and an available_entities JSON column listing which entities the template can use (e.g. {'product':'product'}), plus a mail_template_type_translation row per language; 2) insert a row into mail_template referencing that mail_template_type_id, with system_default set to 0; 3) insert one mail_template_translation row per language (e.g. en-GB, de-DE) with sender_name, subject, description, content_html and content_plain, looking up each language_id via the language/locale tables and skipping languages that don't exist. Always use INSERT IGNORE so reinstalling/updating the plugin does not throw, and never delete mail templates on uninstall since they may be referenced elsewhere. Once the plugin with this migration is installed, the mail template (and its custom type, if created) is available automatically without touching the Administration.","citations":["developer/guides/plugins/plugins/content/mail/add-mail-template.md:22-30","developer/guides/plugins/plugins/content/mail/add-mail-template.md:206-303"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/content/mail/add-mail-template.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-24":{"query":"How do I get readable SEO URLs generated for the detail pages of my plugin's own entity?","category":"dev","option":"fs-docs","answer":"For a custom entity with its own Storefront detail route, implement Shopware's SeoUrlRouteInterface so Shopware auto-generates seo_url entries: create a class (e.g. ExamplePageSeoUrlRoute) implementing getConfig() (returns a SeoUrlRouteConfig with your entity definition, the route's technical name, and a default SEO path template like '{{ example.name }}'), prepareCriteria() (optionally narrow/extend the criteria used to fetch entities, e.g. filter by active or add associations), and getMapping() (returns a SeoUrlMapping with the entity, its route parameters, and the data available to the SEO template). Register this class in services.php tagged 'shopware.seo_url.route'. Then add an event subscriber listening to your entity's '<entity_name>.written' (and '.deleted') DAL events that calls Shopware\\Core\\Content\\Seo\\SeoUrlUpdater::update($routeName, $event->getIds()) so a SEO URL is (re)generated whenever an entity is written, and marked is_deleted on deletion. Finally, add a plugin migration inserting a row into the seo_url_template table with route_name, entity_name (your entity's technical name), and template (matching the DEFAULT_TEMPLATE constant) so the SeoUrlUpdater knows the template to use. After this, every write of your entity automatically produces a readable SEO URL for its detail page.","citations":["developer/guides/plugins/plugins/content/seo/add-custom-seo-url.md:156-282","developer/guides/plugins/plugins/content/seo/add-custom-seo-url.md:285-402"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/content/seo/add-custom-seo-url.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-25":{"query":"How do I add a `bin/console` command to my plugin for a maintenance task?","category":"dev","option":"fs-docs","answer":"Shopware CLI commands are standard Symfony Console commands. Create a command class (e.g. src/Command/ExampleCommand.php) that extends Symfony\\Component\\Console\\Command\\Command, annotated with #[AsCommand(name: 'swag:example', description: 'Example command')], implementing execute(InputInterface $input, OutputInterface $output): int. Then register it as a service in the plugin's src/Resources/config/services.php and tag it with 'console.command' (e.g. $services->set(Swag\\BasicExample\\Command\\ExampleCommand::class)->tag('console.command');). Commands registered this way are automatically available via bin/console once the plugin is installed/active.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md:8-44"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-26":{"query":"How do I add a custom document type such as a pro-forma invoice in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"In the reworked Document System (v2, experimental behind the DOCUMENT_GENERATION_REWORK feature flag, its API can still change until it becomes default in 6.8), building a custom document type requires: 1) A document type class extending Shopware\\Core\\Checkout\\DocumentV2\\Type\\AbstractDocumentType, implementing getTechnicalName() (e.g. 'example_document') and getSupportedFormats() (e.g. ['html','pdf']). 2) A render data DTO extending AbstractRenderData whose public properties become available in the template's config variable, plus a data provider extending AbstractDocumentDataProvider implementing getKey(), supports(string $documentType) (matching your type's TECHNICAL_NAME), enrichOrderCriteria(Criteria $criteria) (add associations needed, e.g. lineItems), and provideRenderingData(ProviderInput $input, Context $context): AbstractRenderData. 3) Register both classes as services tagged 'shopware.document_v2.type' and 'shopware.document_v2.provider' respectively in services.php. 4) Add a Twig template at src/Resources/views/documents/<technical_name>.html.twig, extending '@Framework/documents/base.html.twig' (the HTML renderer resolves this path automatically); if you support the zugferd_xml format you also need an XML template under documents/zugferd/<technical_name>.xml.twig. 5) Outside the code, add a plugin migration inserting a document_type row with a technical_name matching your type (the document table has a foreign key on it) and a number range of type document_<technical_name> to number generated documents — the migration code for this is identical to the legacy document system, so it can be reused from the legacy add-a-custom-document-type guide with the technical name swapped in.","citations":["developer/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md:1-162"],"toolCallLog":[{"tool":"Bash","args":"find checkout/documents dirs, grep -ril pagelet under storefront/index.md area"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-27":{"query":"In Shopware 6.7, how do I extend a Storefront Twig template from my plugin with `{% extends %}` so I keep the core markup and other plugins' changes?","category":"dev","option":"fs-docs","answer":"You do not use plain Twig `{% extends %}` — Shopware provides its own `{% sw_extends %}` tag for this purpose, which supports the multi-inheritance needed so several plugins can each extend the same template without conflicting. First register/use your plugin's view path (Shopware looks for src/Resources/views by default). Find the original core template (e.g. under Storefront/Resources/views/...) and recreate the exact same directory path starting from views/ inside your plugin (e.g. src/Resources/views/storefront/layout/header/logo.html.twig) — matching the path exactly is what makes your override load automatically. In your override file, put `{% sw_extends '@Storefront/storefront/layout/header/logo.html.twig' %}` at the very top, then redeclare only the specific block(s) you want to change (e.g. `{% block layout_header_logo_link %} ... {% endblock %}`), keeping the rest of the core markup and any other plugins' overrides intact. Use `{{ parent() }}` inside your block if you want to append to rather than replace the original block content. After editing, clear the cache (bin/console cache:clear) and make sure your plugin/theme is active and assigned to the sales channel. Since Shopware 6.7.11.0 there is also a new Storefront Components system for building reusable, composable template components.","citations":["developer/guides/plugins/plugins/storefront/templates/customize-templates.md:24-94","developer/guides/plugins/plugins/storefront/templates/customize-templates.md:114-118"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/templates/customize-templates.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-28":{"query":"How do I override an existing Storefront JavaScript plugin, such as the cookie permission bar, from my own plugin instead of registering a new one?","category":"dev","option":"fs-docs","answer":"Storefront JS plugins are vanilla JavaScript classes, so you create a new class that extends the original one: e.g. in <plugin root>/src/Resources/app/storefront/src/my-cookie-permission/my-cookie-permission.plugin.js, `import CookiePermissionPlugin from 'src/plugin/cookie/cookie-permission.plugin'; export default class MyCookiePermission extends CookiePermissionPlugin {}`. If you cannot import the original class (e.g. third-party plugin with no alias), fetch it via `window.PluginManager.getPlugin('CookiePermission').get('class')` and extend that. Override whichever methods you need (e.g. init() to always show the bar, calling super.init() afterward; _hideCookieBar() to add a confirm dialogue before calling super._hideCookieBar()). Then, in your plugin's main.js entry point, register the override — not a new plugin — using `PluginManager.override('CookiePermission', MyCookiePermission, '[data-cookie-permission]')` (use the async/dynamic-import form if the original plugin was registered async). Note that each JS plugin can only be overridden once; if two plugins override the same one, only the last override wins. Rebuild the Storefront (shopware-cli project storefront-build, or composer run build:js:storefront in a contribution setup) and reload to see the change.","citations":["developer/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md:18-124"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-29":{"query":"How do I add my own data to an existing Storefront page or pagelet from a plugin without overriding the core controller?","category":"dev","option":"fs-docs","answer":"Every Storefront page/pagelet fires a *Loaded event (e.g. FooterPageletLoadedEvent for the FooterPagelet) which is the right place to add data without touching the core controller. Steps: 1) Identify the page/pagelet you want to extend and its Loaded event. 2) Create an EventSubscriberInterface subscriber listening to that event and register it in services.php tagged 'kernel.event_subscriber'. 3) Since you are inside a Pagelet event you should not call the DAL directly — instead use an existing store-api route or, if none fits, create a new dedicated store-api route (an AbstractXRoute + concrete Route class using aggregate()/search() on a repository, a RouteResponse extending StoreApiResponse, registered in services.php and routes.php). 4) In the subscriber's event handler, call your store-api route and attach the result to the page/pagelet object with $event->getPagelet()->addExtension('your_key', $data) (or $event->getPage()->addExtension(...) for a Page event). This makes the data available in the template under <object>.extensions.your_key. 5) To display it, extend the relevant Storefront template with {% sw_extends %} and override the appropriate block, referencing e.g. {{ footer.extensions.product_count.count }}, calling {{ parent() }} first if you want to keep the original block content.","citations":["developer/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md:29-77","developer/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md:234-273","developer/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md:299-321"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-30":{"query":"How do I add a custom filter to the Storefront product listing from my plugin, both the criteria side and the filter panel?","category":"dev","option":"fs-docs","answer":"Criteria side: create an EventSubscriberInterface subscriber (e.g. ExampleListingSubscriber) listening to \\Shopware\\Core\\Content\\Product\\Events\\ProductListingCollectFilterEvent. In the handler, fetch $event->getFilters() and $event->getRequest(), then build a Filter object with: name (unique filter name), filtered (bool, whether it's currently active, typically derived from the request parameter), aggregations (array, e.g. a FilterAggregation wrapping a MaxAggregation plus an EqualsFilter, used to compute counts/availability), filter (the actual DAL filter such as EqualsFilter added to the criteria when active), and values (the value(s) added as currentFilter to the result). Add it with $filters->add($filter). Filter panel UI side: extend src/Storefront/Resources/views/storefront/component/listing/filter-panel.html.twig with {% sw_extends '@Storefront/storefront/component/listing/filter-panel.html.twig' %} and override the block component_filter_panel_items (available since Shopware 6.4.8.0), calling {{ parent() }} plus {% sw_include %} of an appropriate filter component template such as filter-boolean.html.twig, filter-multi-select.html.twig, filter-property-select.html.twig, filter-range.html.twig, or filter-rating-select(-item).html.twig, passing name and displayName. To position your filter next to a specific existing filter (e.g. right after price) instead of at the end, override that filter's specific block (e.g. component_filter_panel_item_price) instead of component_filter_panel_items.","citations":["developer/guides/plugins/plugins/storefront/howto/add-listing-filters.md:20-120","developer/guides/plugins/plugins/storefront/howto/add-listing-filters.md:122-178"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/howto/add-listing-filters.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-31":{"query":"How do I expose a plugin configuration value, such as a colour picked in the Administration, as an SCSS variable in my Storefront styling?","category":"dev","option":"fs-docs","answer":"The recommended way is to declare it directly in your plugin's config.xml using the <css> tag: add an <input-field> (e.g. type colorpicker) with a <name>, and a <css> element whose value is the SCSS variable name (e.g. sass-plugin-header-bg-color), plus an optional <defaultValue>. This value is then exposed as an SCSS variable using the value set in the Administration, or the default if unset. Note that when this config value changes you still have to recompile the theme manually for the change to take effect, and the Administration will show a notice about this. Also give the variable a fallback with `!default` in your plugin's base.scss (e.g. `$sass-plugin-header-bg-color: #ffcc00 !default;`). If you need more flexibility (e.g. per sales-channel logic beyond a straight mapping), you can instead use a subscriber: create an event subscriber listening to `ThemeCompilerEnrichScssVariablesEvent`, inject `SystemConfigService`, read the config value with `$this->systemConfig->get('YourPlugin.config.fieldName', $event->getSalesChannelId())`, and call `$event->addVariable('sass-plugin-header-bg-color', $value)` inside the `onAddVariables` handler; register the subscriber with the `kernel.event_subscriber` tag in services.xml/php. You can also loop over all config fields with `$this->systemConfig->get('YourPlugin.config')` and convert camelCase keys to kebab-case (e.g. via CamelCaseToSnakeCaseNameConverter) before calling addVariable() for each.","citations":["developer/guides/plugins/plugins/storefront/styling/add-scss-variables.md:1-57","developer/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md:1-250"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"find plugins/plugins/storefront plugins/themes/styling -type f (cwd docs/shopware-knowledge-bases/developer/guides)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/styling/add-scss-variables.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-32":{"query":"How do I define a custom field set for products from my plugin so merchants can edit the values in the Administration?","category":"dev","option":"fs-docs","answer":"Since the `product` entity already supports custom fields, you don't need to add the CustomFields DAL field/trait yourself — you just need to define a custom field set so it shows up and is editable in the Administration. As of Shopware 6.7.13.0 the recommended way is the declarative approach: ship a `Resources/config/custom-fields.xml` file under your plugin's `src` directory; Shopware then automatically creates/updates/removes the custom field sets during the plugin lifecycle (install, update, uninstall) — no CustomFieldsInstaller service or lifecycle hooks required. The XML format is the same one used by apps' manifest custom-data definitions. Field names and set names should be prefixed with a vendor tag (e.g. 'swag') since they are global. The older, imperative alternative (only needed if you must create sets dynamically at runtime) is to inject the `custom_field_set.repository` service and call its `create()` method — typically from a plugin lifecycle hook (install/activate) — passing an array with `name`, `global` (true/false; set to false if you want it deletable/editable in the Administration), `config.label` translations, and a `customFields` array where each field has `name`, `type` (from `CustomFieldTypes`, e.g. INT), `includeInSearch` (set true to make it searchable in the Administration/search, available since 6.7.6.0), and `config.label`/`config.customFieldPosition`. On uninstall you should delete the custom_field_set via the repository's `delete()` method and clean up the stored values from entities' customFields JSON column. After the custom field set is defined, you still need to add the field to your custom entity's Administration module edit view — see the 'Add a custom field to the Administration' data-handling-processing guide referenced from this page — to make it actually appear as an editable field in the product Administration module.","citations":["developer/guides/plugins/plugins/framework/custom-field/add-custom-field.md:179-373"],"toolCallLog":[{"tool":"Bash","args":"grep -ril 'custom field' plugins/plugins --include=*.md (cwd docs/shopware-knowledge-bases/developer/guides)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/custom-field/add-custom-field.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-33":{"query":"How do I register a custom Administration module from my plugin, and what has to line up for it to actually show up after a build?","category":"dev","option":"fs-docs","answer":"Create a new directory `<plugin root>/src/Resources/app/administration/src/module/swag-example` with an `index.js` file inside (Shopware auto-requires an index.js per module). Import that module directory from your plugin's `main.js` entry point (`import './module/swag-example';`) so it actually gets executed. Inside index.js call `Shopware.Module.register('swag-example', { ... })` with a configuration object containing at least: `type: 'plugin'` (third-party modules must use 'plugin', not 'core'), a unique `name`, `title`/`description` (as translation keys), `color` and `icon` for the module accents, a `routes` object defining routes such as list/detail/create tied to components, and optionally a `navigation` entry (or use the separate 'Add a menu entry' guide) and a `snippets` object (or separate snippet json files under a `snippet` directory) providing translations for the keys you referenced (e.g. `swag-example.general.mainMenuItemGeneral`) — otherwise the Administration just prints the raw snippet key. If the module belongs under Settings, add a `settingsItem` array entry with `group` ('shop'|'system'|'plugins'), `icon`, and `to` (pointing at a route name defined in your routes). For it to show up after a build: the plugin must be activated, and you must run the Administration build (`shopware-cli project admin-build`, or `composer run build:js:admin` in a platform/contribution setup) which minifies main.js into `<plugin root>/src/Resources/public/administration/js/<plugin-name-kebab-case>.js` and copies it to `public/bundles/administration/<pluginnamelowercase>/administration/js/...`. The build only guarantees the compiled assets exist — the module will still only actually appear if the main.js import, the Shopware.Module.register() call, its routes/components, and its snippets are all correctly wired at runtime; a successful build does not by itself validate that the module registration, routing, and snippets line up.","citations":["developer/guides/plugins/plugins/administration/module-component-management/add-custom-module.md:22-319"],"toolCallLog":[{"tool":"Bash","args":"find plugins/plugins/administration -type f (cwd docs/shopware-knowledge-bases/developer/guides)"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/module-component-management/add-custom-module.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-34":{"query":"How do I extend an existing Administration component and its Twig blocks from my plugin, for example to change the dashboard headline?","category":"dev","option":"fs-docs","answer":"You can either override an existing component (Shopware.Component.override, which overwrites its previous behavior) or extend it into a brand-new component (Shopware.Component.extend, which creates a new component with a new name based on an existing one). To change a template, use Twig's block feature: find the block name in the component's original .html.twig template, redeclare that same block name in your own twig file to replace its markup, or use {% parent %} inside the block to keep the original markup and add to it. Methods/computed properties can similarly be replaced or extended (using this.$super('methodName') to call the original implementation) when extending a component. Worked dashboard example: to change the dashboard headline from 'Welcome to Shopware 6' to something custom, first find the relevant Twig block in the sw-dashboard-index component's template — it is named `sw_dashboard_index_content_intro_content_headline`. Create a twig file, e.g. `<plugin root>/src/Resources/app/administration/src/sw-dashboard-index-override/sw-dashboard-index.html.twig`, declaring `{% block sw_dashboard_index_content_intro_content_headline %} <h1>Welcome to a customized component<\/h1> {% endblock %}`. Then register the override in an index.js (e.g. `<plugin root>/src/Resources/app/administration/src/sw-dashboard-index-override/index.js`): `import template from './sw-dashboard-index.html.twig'; Shopware.Component.override('sw-dashboard-index', { template });`. Finally import that file from your plugin's `main.js` (`import './sw-dashboard-index-override/';`) so Shopware 6 automatically picks it up, since main.js is the main entry point for Administration customizations and must sit in `<plugin root>/src/Resources/app/administration/src`. There is also an experimental Composition API extension system (`Shopware.Component.createExtendableSetup` / `Shopware.Component.overrideComponentSetup`) intended for components written with the Composition API, but the Options API extension system (Component.extend/override) remains fully supported and is what should be used for Options API components.","citations":["developer/guides/plugins/plugins/administration/module-component-management/customizing-components.md:1-227"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/module-component-management/customizing-components.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-35":{"query":"How do I load entities from the Admin API inside an Administration component using the repository factory and a Criteria?","category":"dev","option":"fs-docs","answer":"Inject the `repositoryFactory` service into your component config via `inject: ['repositoryFactory']` — this is provided through the BottleJS DI container wired into Vue's inject/provide. Use `this.repositoryFactory.create('<entity-name>')` (e.g. `this.repositoryFactory.create('product')`) to get a Repository for a given entity; a third parameter lets you set options like a specific API `version`. To search a list, build a `Criteria` instance (`const { Criteria } = Shopware.Data; const criteria = new Criteria();`), configure it with `setPage()`, `setLimit()`, `setTerm()`, `setIds()`, `setTotalCountMode()`, `addFilter(Criteria.equals(...))`, `addSorting(Criteria.sort(...))`, `addAggregation(...)`, and `getAssociation('x').addSorting(...)` as needed, then call `this.<entityName>Repository.search(criteria, Shopware.Context.api).then(result => ...)`. Each repository call requires the API `context` (typically `Shopware.Context.api`) and, for search/get, the `criteria` object. To fetch a single entity by id, call `repository.get(entityId, Shopware.Context.api)` (optionally passing a Criteria as third argument, e.g. to load associations via `criteria.addAssociation('manufacturer')`), which returns a Promise resolving to the entity. Saving is manual — mutate the entity then call `repository.save(entity, Shopware.Context.api)`; creating a new entity uses `repository.create(Shopware.Context.api)`; deleting uses `repository.delete(id, Shopware.Context.api)` (or `syncDeleted` for multiple ids).","citations":["developer/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md:20-236"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-36":{"query":"How do I register ACL privileges for my plugin's Administration module and check them in a component or template?","category":"dev","option":"fs-docs","answer":"Register privileges via the `privileges` service's `addPrivilegeMappingEntry` method, recommended in a file at `<plugin root>/src/Resources/app/administration/src/<your-component>/acl/index.js`, imported from your module's index.js (which is itself imported from main.js). Normal 'permissions' (category: 'permissions') use a `key` (usually the module name, e.g. 'product') plus the four predefined roles `viewer`, `editor`, `creator`, `deleter`, each with a `privileges` array of API permissions in the form `entity_name:operation` (e.g. 'product_review:read') and an optional `dependencies` array of other privilege identifiers (`key.role`) that get auto-enabled. For non-CRUD actions, use `category: 'additional_permissions'` instead, where you can choose any custom role key (e.g. `system.clear_cache`). Example: `Shopware.Service('privileges').addPrivilegeMappingEntry({ category: 'permissions', parent: null, key: 'your_key', roles: { viewer: { privileges: [], dependencies: [] }, editor: {...}, creator: {...}, deleter: {...} } });`. You can extend an existing key's privileges the same way, and pull in privileges from another mapping via `Shopware.Service('privileges').getPrivileges('rule.viewer')`. Protect routes with `meta: { privilege: 'your_key.your_role' }` in the module's `routes`, protect menu entries by adding `privilege: 'your_key.
