d", "args": "platform/func/settings/rules.md"}, {"tool": "Read", "args": "platform/func/tutorials-and-faq/rule-builder-example-rules.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-03": {"query": "How do promotions and discount codes work, including individually generated codes?", "category": "func", "option": "fs-wiki", "answer": "Promotions are configured under Marketing > Promotions. The General tab sets Name, Priority (higher priority applies before lower), Valid from/until, Max. total uses, Max. uses per customer, and Active. For codes, a promotion can have none (automatic discount), a single Fixed promotion code shared by all customers (optionally auto-generated), or Individual promotion codes generated per order \u2014 each individual code can only be redeemed once, and only one individual code can be redeemed per promotion at a time. Individual codes are generated from a pattern: you choose the code length, an optional prefix/suffix, or a custom pattern using `%s` for a random letter (A-Z) and `%d` for a random digit (0-9), e.g. `SW-%s%d%s%d%s-TEST`; regenerating the codes invalidates all previously issued ones. The Conditions tab restricts which sales channels the promotion applies to, whether it can combine with other promotions ('Prevent combination with other promotions' / 'Do not combine with'), and Rule Builder-based Customer, Shopping cart, and Order rules, plus 'Promote sets of products' (set groups defined by Mode \u2014 Number/Value Gross/Value Net \u2014, Value, Sorting, and Product rules); if multiple rules of the same type are selected only one needs to match (OR logic), so separate promotions are needed if all conditions must hold together. The Discounts tab defines what the discount applies to (entire cart, shipping costs, entire product set, or a specific set group), optionally narrowed to a specific range of products, and its Type (Absolute, Percentage, Fixed price, Fixed unit price \u2014 a fixed price can't exceed the normal price), Value, an optional Maximum discount value for percentage types, and per-currency overrides; these discount settings become read-only once the promotion has been used in an order. In the storefront, customers enter the code via 'Enter voucher code' in the cart/OffCanvas. To track redemption, individual codes show a 'Redeemed' status on the promotion itself, and both individual and fixed codes can be looked up by filtering the order overview by promotion code. One gotcha: placing product exclusions in the shopping-cart conditions blocks the whole promotion if an excluded product is present, whereas placing exclusions in the discount's own product rules still discounts the rest of the cart.", "citations": ["platform/func/marketing/promotions.md:19-51"], "toolCallLog": [{"tool": "Read", "args": "platform/func/marketing/promotions.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-04": {"query": "What does the Shopware Migration Assistant transfer automatically from Shopware 5, and what has to be mapped by hand before the migration starts?", "category": "func", "option": "fs-wiki", "answer": "The Migration Assistant transfers several selectable data groups automatically, of which Basic data is mandatory: Basic data (categories, customer groups, currencies, sales channels, number ranges); Products (products, properties, product options, product properties, translations, cross-selling, main variant relations); Customers & orders (customers, shipping methods, orders, order documents); Promotions (customers, promotions); SEO URLs (products, properties, product options, product properties, translations, cross-selling, main variant relations, SEO URLs); and Product reviews (products, properties, product options, product properties, translations, cross-selling, main variant relations, customers, reviews, media). Before the migration starts, certain items must be manually mapped/created in Shopware 6 first: payment methods, the standard payment method, salutation, delivery time, and the standard delivery time \u2014 and these mappings cannot be changed after the migration has executed (not even after a reset); remapping requires deleting and recreating the migration entirely. Note that despite 'shipping methods' being listed under the automatic Customers & orders group, shipping and payment methods themselves are not actually transferred automatically because Shopware 6 uses the Rule Builder for shipping cost and payment risk rules, so both must be recreated manually under Settings > Commerce > Shipping / Settings > Commerce > Payment methods. Several other areas also need manual rework after migration: migrated shops become additional sales channels requiring domain adjustments, countries must be checked under Settings > Localisation > Countries, document templates must be reconfigured under Settings > Commerce > Documents, email templates (now Twig-based) must be rebuilt under Settings > Content > Email templates, Shopping Worlds become Shopping Experiences and must be recreated under Content > Shopping Experiences, templates/themes cannot be reused, and the B2B Suite cannot be transferred at all.", "citations": ["platform/func/migration-en/what-is-migrated.md:35-64"], "toolCallLog": [{"tool": "Read", "args": "platform/func/migration-en/what-is-migrated.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-05": {"query": "How do I set up a sales channel \u2014 storefront versus headless type, domains, languages and currencies \u2014 and where do I get its API access key?", "category": "func", "option": "fs-wiki", "answer": "A new sales channel is created via the plus icon next to 'Sales Channel' in the admin main menu, where you choose between a Sales Channel with HTML storefront, a headless sales channel (API only), or a product-comparison export channel. Under General settings you set the Name, whether to mark it as a favourite, the navigation entry points (main navigation, navigation levels, footer navigation, service navigation), the default Customer group for new/anonymous customers, and the channel's Countries, Languages, and Standard units of measurement. Under Payment and shipping you configure the available Payment methods and default, Shipping methods and default, Currencies and default, and the Tax calculation method. For multi-language storefronts, self-hosted shops configure Domains, where each domain gets its own URL, Language, Currency, Snippet set, and unit system (a consistent protocol across domains avoids duplicate-content issues), while Cloud instances instead get an auto-generated URL that forwards all traffic over an encrypted connection; Hreflang can also be activated with a chosen default fallback domain to prevent duplicate-content classification across language versions. The API access key/ID for the channel is generated under the channel's 'API access' setting (generate an API Access ID for the channel). Other channel-level settings include Status (temporarily disable, maintenance mode, IP whitelisting \u2014 which behind a proxy requires setting `TRUSTED_PROXIES=IP_of_the_proxy`), a Products tab to assign/remove products, categories or dynamic product groups, a Theme tab, Analytics (Google Analytics 4 tracking ID), and an Agentic files tab for `llms.txt`, `agents.md`, and `ai-catalog.json`. Note that the preinstalled headless sales channel should never be deleted, since several extensions (including the B2B Suite) depend on it \u2014 hide it via favourites instead if it isn't wanted in the sidebar.", "citations": ["platform/func/settings/saleschannel.md:33-68"], "toolCallLog": [{"tool": "Read", "args": "platform/func/settings/saleschannel.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-06": {"query": "Which triggers and actions does the Flow Builder offer, and how do I make it send a mail when an order is placed?", "category": "func", "option": "fs-wiki", "answer": "Flow Builder (Settings > Automation > Flow Builder) automates business processes by combining an event trigger, optional Rule Builder conditions, and one or more actions. Each flow has a General tab (Name, Description, Priority \u2014 the processing order when several flows share a trigger, Active) and a Flow tab where you pick the trigger and add conditions/actions via the plus symbol. Example trigger names include `checkout.order.placed`, `checkout.customer.register`, `state_enter.order.state.completed`, `state_leave.order_transaction.state.paid`, `newsletter.register`, and `mail.before.send`; custom app-defined triggers are also supported since 6.5.3.0. Conditions use Rule Builder rules and branch True/False, with further conditions/actions chainable on either branch. Available actions (depending on trigger) include: Assign account status, Assign affiliate/campaign code, Assign customer group, Generate a document, Send mail (to Administrator, Customer, or custom addresses), Assign payment/shipping/order status, Stop flow, Set download access, Change custom field content, Add/Remove Tag, plus Delayed Actions (Beyond plan) and Webhook 'Call URL' actions (Evolve plan + Shopware Commercial). To send a mail when an order is placed: create a new flow, set its trigger to `checkout.order.placed`, optionally add Rule Builder conditions to narrow when it fires, then add the 'Send mail' action and choose the recipient (Administrator reaches every admin-flagged user including external API users, Customer sends to the ordering customer, or specify custom addresses), and activate the flow. Flows can be exported/imported via Share Flows (Rise plan, 6.4.19.0+), and a Flow templates library offers ready-made flows including standard ones for order-placed emails.", "citations": ["platform/func/settings/Flow-Builder.md:19-48"], "toolCallLog": [{"tool": "Read", "args": "platform/func/settings/Flow-Builder.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-07": {"query": "How do I import products from a CSV with an import/export profile \u2014 column mapping, matching identifiers and a dry run?", "category": "func", "option": "fs-wiki", "answer": "Import/Export is configured at Settings > Automation > Import/Export. The CSV file itself must be UTF-8, use a semicolon field separator and quotation marks as the string separator, and prices must use a dot as the decimal separator (e.g. `5.00`, not `5,00`). A Profile defines how the CSV maps to Shopware data: on the Profiles tab you create a profile with a Profile name, Usage (import/export/both), Object type (e.g. `Product`), Separator and Enclosure characters, and Import settings ('Create new records', 'Update existing data'); you must select the default system language when creating a profile or import/export won't work. Column mapping is done under Mappings: 'Add new mapping' lets you map each CSV column name to a database entry (field), and mark it Required, give it a Default Value, and set its Position. For matching existing records instead of relying on the internal UUID, a profile's Advanced Settings tab offers a 'Second Unique Identifier' \u2014 e.g. using `productNumber` instead of the product's UUID to resolve which record a row updates; if that identifier isn't actually unique (e.g. duplicate values), only the first matching record is resolved. To run the import: on the Import tab, Upload CSV file, Select profile, then either 'Start dry run' (validates the file without writing any data) or 'Start import'; Import activity keeps the last 30 days of runs with a context menu to re-download the source or erroneous CSVs, and 'Abort process' is available while it runs. For plain products, use the 'Default product' profile with 'Import product variants' left unchecked; mandatory product fields are `id`, `taxId`, `productNumber`, `stock`, `name` (example columns also include `parent_id`, `active`, `price_net`, `price_gross`, `tax_rate`, `cover_media_id`, `manufacturer_id`, `categories`, `sales_channels`). Note that import can only add data, not remove it \u2014 e.g. it will not clear an existing sales-channel assignment that isn't in the file.", "citations": ["platform/func/shopware-en/settings/importexport.md:34-62"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"import.*export|import profile|csv\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md"}, {"tool": "Read", "args": "platform/func/shopware-en/settings/importexport.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-08": {"query": "How do custom field sets work \u2014 entity assignment, field types and technical name \u2014 and can a custom field be written through the Store API?", "category": "func", "option": "fs-wiki", "answer": "Custom fields (Settings > System > Custom fields) let merchants add their own data fields to entities like products or categories, for use in the Rule Builder, storefront templates, or Shopping Experiences. Fields are grouped into sets: a set is created via 'New set' and given a unique, unchangeable technical name, a Position, a translatable Label, and the program areas (entities) it applies to \u2014 a set created with no assigned area exists but is unavailable anywhere. Within a set, individual fields are added via 'New custom field'; each field also requires a technical name that can never be changed afterward. Available field types are: Select, Object selection (references products, categories, countries, shipping/payment methods, etc. \u2014 the object type cannot be changed after creation), Text field, Media, Number (integer/float, with Steps/Min/Max), Date/Time, Checkbox, Active/Inactive switch (boolean 0/1), Text Editor, and Color picker. Per-field options include Technical name, Position, Label, Placeholder, Help text, 'Available in shopping carts' (required to use the field in the Rule Builder or custom templates), and 'Modifiable via Store API'. Yes, a custom field can be written through the Store API \u2014 enabling 'Modifiable via Store API' marks the field public/writable via that API, but the documentation explicitly warns never to enable this for sensitive data since it exposes the field publicly. Custom fields are automatically added as snippets in all snippet sets (no database changes needed), and displaying one in the storefront requires a template adjustment; they can also be linked into a Shopping Experiences Text/Text & images block via the block's Data Mapping option. Gotchas: custom fields should be edited in the store's default language since other-language edits only override that language and rules can silently fail for unmaintained languages; technical names must avoid Twig special characters such as `-` or `#` or product exports can error; and both set and field technical names are permanent once created.", "citations": ["platform/func/settings/custom-fields.md:35-65"], "toolCallLog": [{"tool": "Read", "args": "platform/func/settings/custom-fields.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-09": {"query": "Why doesn't my payment method appear in the checkout \u2014 what has to be configured in the administration?", "category": "func", "option": "fs-wiki", "answer": "Payment methods are managed under Settings > Commerce > Payment methods. A payment method commonly fails to show at checkout for a few configuration reasons documented there. First, the method must have its Active toggle switched on \u2014 the overview lists each method's active status, and the four standard active methods are cash on delivery, invoice, prepayment, and direct debit. Second, being active is not enough: 'a method also needs to be assigned in the relevant sales channel to actually appear to customers there' \u2014 so check the sales channel's payment method assignment. Third, each method has an Availability rule field built from Rule Builder conditions; if that rule's conditions aren't met for the current cart/customer/context, the method is hidden from checkout (leaving the field blank/NULL makes it unrestricted, i.e. always available). When adding or editing a method you also configure its name, a unique Technical name, Position (storefront display order), description, logo, and 'Allow change of payment method after order completion'. One gotcha to watch for: changing an existing payment method's Technical name can make it stop working entirely \u2014 if the method came from an installed extension, wait for the manufacturer to update it rather than changing the technical name yourself, and if self-created, fix the technical name as early as possible rather than later.", "citations": ["platform/func/settings/Paymentmethods.md:20-32"], "toolCallLog": [{"tool": "Read", "args": "platform/func/settings/Paymentmethods.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-10": {"query": "How do dynamic product groups work in the administration and where can the resulting group be used?", "category": "func", "option": "fs-wiki", "answer": "Dynamic product groups are configured under Catalogues > Dynamic product groups: you give the group a Name and optional Description, choose whether to 'Keep matching variants grouped', and build Conditions by selecting a property and a condition, chaining further conditions with AND/OR and nesting indefinitely with SUB-CONDITION; a Preview shows matching products live. Multi-value properties (products, categories, manufacturers, tags, properties) support operators such as 'Is equal to', 'Is not equal to', 'Is equal to any of', 'Is not equal to any of', 'Is equal to all of' and 'Is not equal to all of'; custom fields and delivery-time conditions can also be used, though deleting a used delivery time breaks that condition, and a group becomes 'invalid' if it depends on rules from a deactivated plugin. The resulting dynamic product group can then be used to fill category content dynamically (e.g. sale or manufacturer categories), feed the Product Comparison export, or power the product slider CMS element in Shopping Experiences.", "citations": ["platform/func/shopware-6-de/Catalogues/Dynamicproductgroups.md:33-71"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "grep -rni \"dynamic product group\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/shopware-6-de/Catalogues/Dynamicproductgroups.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-11": {"query": "How do I create an integration for Admin API access in the administration and give it the right privileges?", "category": "func", "option": "fs-wiki", "answer": "Under Settings > System > Integrations, click Create integration and give it a name, then decide whether it gets full Administrator permissions or should instead use an existing Role; Shopware then issues an access ID and a security key, with the security key shown only once at creation time so it must be saved immediately (the overview lets you edit or delete integrations later, and 'Regenerate API access key' rotates both the access ID and security key, invalidating the old ones). To scope privileges precisely rather than granting Administrator, create a Role first under Settings > System > Users & Permissions (New role): give it a name/description, then assign Authorisations per area (e.g. Catalogues) using View, Edit, Create, Delete or All \u2014 Edit implies View, Create implies Edit+View, but Delete only implies View by itself \u2014 plus 'Additional permissions' for cross-cutting rights like Import/Export or Apps, and 'Detailed permissions' for extension-added technical permissions with read/write/create/delete rights; that role can then be selected on the integration instead of the Administrator flag.", "citations": ["platform/func/settings/system/integrationen.md:21-45", "platform/func/settings/system/user.md:44-76"], "toolCallLog": [{"tool": "Bash", "args": "grep -rni \"integration\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/system/integrationen.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/system/user.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-12": {"query": "A spec asks for customer-specific pricing and for a flow that calls an external URL when an order is placed \u2014 before I build either of them, does Shopware already ship them, and what has to be licensed or installed for them to exist in the shop?", "category": "func", "option": "fs-wiki", "answer": "Both already exist out of the box, with different prerequisites. Customer-specific pricing is a Shopware Commercial extension feature available only on the Shopware Beyond plan: it lets an external system (e.g. an ERP) push list, graduated, or currency-dependent prices per customer via a dedicated Admin API 'bulk edit custom prices' endpoint \u2014 there is no Administration UI for it at all, prices can only be created/read/changed/deleted through the API, and variant price inheritance does not apply (each variant needs its own priced entry); the individual price only shows in the storefront while that customer is logged in. Calling an external URL when an order is placed does not need a custom plugin either \u2014 Flow Builder already ships a webhook action: you create a flow triggered on the relevant event (e.g. order placed) and add the webhook action, which forwards data to an API-based third-party provider, either as a notification or as a request for that server to act on the data; this uses the standard Flow Builder that ships with Shopware, not a separately licensed extension.", "citations": ["platform/func/extensions/customer-specific-pricing.md:21-44", "platform/func/features/webhook-actions-in-flow-builder.md:21-37"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/extensions/customer-specific-pricing.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/features/webhook-actions-in-flow-builder.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-01": {"query": "How do I configure Shopware 6's built-in GraphQL API for the Store API?", "category": "edge", "option": "fs-wiki", "answer": "Shopware 6 does not ship a built-in GraphQL API. The corpus's Store API hub and the API concept pages describe the Store API as a normalized JSON HTTP interface (not GraphQL), authenticated via a `sw-access-key`/`sw-context-token` header, that models product browsing, cart, checkout, and account for the Storefront, Composable Frontends, Shopware PWA and headless/B2B clients. Grepping the whole platform corpus (dev and func directories) and the synonyms files for 'graphql' returned no hits at all, so there is no GraphQL configuration to document \u2014 the equivalent customer-facing surface is the REST-style Store API described at `platform/hubs/store-api.md` and `platform/dev/6.7/concepts/api/store-api.md`.", "citations": ["platform/hubs/store-api.md:40-64"], "toolCallLog": [{"tool": "Bash", "args": "grep -rni \"graphql\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Bash", "args": "grep -rli \"graphql\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/"}, {"tool": "Bash", "args": "ls .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/; find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms* -maxdepth 1"}, {"tool": "Bash", "args": "grep -ni \"graphql\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/part-1.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/index.md"}, {"tool": "Bash", "args": "grep -ni \"store api\\|api\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/hubs/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/hubs/store-api.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "edge-02": {"query": "How do I get the DI container with `Shopware()->Container()` and override the product listing Smarty template in Shopware 6?", "category": "edge", "option": "fs-wiki", "answer": "Neither of these exists in Shopware 6 \u2014 both `Shopware()->Container()` and Smarty templates are Shopware 5 concepts. Grepping the entire wiki corpus (and the synonyms files) for 'smarty' and 'Shopware()' returned no hits anywhere in `platform/dev` or `platform/func`. In Shopware 6 the dependency-injection container is Symfony's, obtained through constructor injection / service definitions (services.xml or autowiring), not a global `Shopware()` helper function, and templates are Twig, not Smarty; the corpus's `platform/hubs/sw-extends.md` hub documents overriding Storefront/CMS/document templates with the Twig `sw_extends` tag and related `sw_*` multi-inheritance tags, which is the Shopware 6 equivalent of what Smarty template overrides did in Shopware 5. [from memory: Shopware 5 used the legacy `Shopware()` facade and Smarty; Shopware 6 replaced these with Symfony DI and Twig as part of the full framework rewrite.]", "citations": ["platform/hubs/index.md:36-36"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"smarty\\|Shopware()->Container\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/"}, {"tool": "Bash", "args": "grep -ni \"smarty\\|shopware()\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/part-1.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/index.md"}, {"tool": "Bash", "args": "grep -rni \"product listing template\\|listing.html.twig\\|Twig template\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/hubs/index.md"}], "notFoundClaim": true, "memoryClaims": ["Shopware 5 used the legacy `Shopware()` facade and Smarty; Shopware 6 replaced these with Symfony DI and Twig as part of the full framework rewrite."], "sourceVerdict": "partial"}, "edge-03": {"query": "Where do the `#[ORM\\Entity]` mapping attributes for my plugin's entity go in Shopware 6, and how do I get Doctrine's `EntityManager` injected into my service so I can persist it?", "category": "edge", "option": "fs-wiki", "answer": "There is nowhere to put them \u2014 Shopware 6 does not use Doctrine ORM at all for entity persistence, so there is no `EntityManager` to inject either. The corpus's Data Abstraction Layer (DAL) page states explicitly that the DAL is 'Shopware's thin, non-ORM interface for database access, used instead of an ORM like Doctrine.' Instead, a plugin entity is persisted through `EntityRepository`, injected via constructor autowiring (e.g. `public function __construct(EntityRepository $productRepository)`) or explicitly via a service definition such as `$services->set(...)->args([service('product.repository')])`; entity definitions describe fields/associations in PHP (not attribute-based ORM mapping), and writes go through `EntityRepository::upsert()`/`create()`/`update()` rather than an `EntityManager::persist()`/`flush()` cycle. Framework-level concepts like translation levels, versioning (`id`/`version_id` compound keys), the per-request `Context`, entity inheritance between variants, and the Entity Indexer pattern for pre-computed aggregations are all part of this DAL rather than Doctrine.", "citations": ["platform/dev/6.7/concepts/framework/data-abstraction-layer.md:18-63"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"doctrine\\|entitymanager\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/concepts/framework/data-abstraction-layer.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-04": {"query": "How do I fetch products with `GET /sales-channel-api/v3/product` on Shopware 6.7?", "category": "edge", "option": "fs-wiki", "answer": "You can't \u2014 the Sales Channel API (the `/sales-channel-api/...` prefix) has been deprecated since Shopware 6.4, and the corpus's Store API guide states plainly: 'Do not implement the Sales Channel API \u2014 deprecated as of 6.4,' with new/existing plugin routes required to use the Store API instead. On Shopware 6.7 the equivalent customer-facing product listing/search endpoint is the Store API's product search route (e.g. `POST /store-api/product` or `/store-api/search`, authenticated with the `sw-access-key` sales-channel header rather than the old sales-channel-api scheme), and any plugin route must be defined with the `StoreApiRouteScope` attribute and return a `StoreApiResponse`, not implement the legacy Sales Channel API. [from memory: the exact Store API product endpoints are `POST /store-api/product/{productId}` for a single product and `POST /store-api/product-listing/{categoryId}` or `/store-api/search` for listing/search.]", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/store-api/_index.md:18-53"], "toolCallLog": [{"tool": "Bash", "args": "grep -rni \"sales-channel-api\\|sales channel api\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/hubs/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/store-api/_index.md"}, {"tool": "Bash", "args": "grep -rni \"sales-channel-api\\|sales channel api\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/ -l"}], "notFoundClaim": false, "memoryClaims": ["the exact Store API product endpoints are `POST /store-api/product/{productId}` for a single product and `POST /store-api/product-listing/{categoryId}` or `/store-api/search` for listing/search."], "sourceVerdict": "yes"}, "edge-05": {"query": "How do I enable Shopware's built-in MCP server on a Shopware 6.6 shop?", "category": "edge", "option": "fs-wiki", "answer": "You can't \u2014 the built-in MCP server is a Shopware 6.7 feature and every MCP-server page in the corpus lives only under `platform/dev/6.7/products/tools/mcp-server/`, with none present for 6.6. Its own getting-started prerequisites state 'Shopware 6.7.14.0+ (on 6.7.11.0-6.7.13.x, set `MCP_SERVER=1` in `.env` first and skip discovery)' and that `symfony/mcp-bundle` must be installed (verified with `composer show symfony/mcp-bundle`) \u2014 the minimum supported version is 6.7.11.0, so a 6.6 shop cannot enable it at all. On a supported (6.7.11.0+) shop the flow is: create an integration with `bin/console integration:create \"My MCP Client\" --admin` (omit `--admin` and assign a scoped ACL role in production) to get `SHOPWARE_ACCESS_KEY_ID`/`SHOPWARE_SECRET_ACCESS_KEY`, point an MCP client at the shop's `/api/_mcp` endpoint using those as `sw-access-key`/`sw-secret-access-key` headers, and verify with `bin/console debug:mcp`.", "citations": ["platform/dev/6.7/products/tools/mcp-server/getting-started.md:20-47"], "toolCallLog": [{"tool": "Bash", "args": "grep -rni \"mcp server\\|mcp_server\\|model context protocol\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.6/index.md"}, {"tool": "Bash", "args": "grep -rli \"mcp\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/tools/mcp-server/getting-started.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-06": {"query": "I'm coming from Magento \u2014 what are the Shopware equivalents of store views, extensions, attribute sets and `di.xml`?", "category": "edge", "option": "fs-wiki", "answer": "The corpus's Magento-to-Shopware term dictionary maps: Store View/Store/Website -> Sales channel (with different languages and domains); Extension -> Plugin (with Community Code Pool mapping to Extensions/Community Store under Extensions > Store, and Local Code Pool to Extensions under Settings > My extensions); and Attribute Sets -> Custom field sets (groups of custom fields, managed under Settings > Content > Custom fields), noting more broadly that Magento Attributes map to Shopware Properties/Custom fields (custom fields extend a product with information, properties drive variants and filtering). The corpus has no equivalent mapping for Magento's `di.xml` dependency-injection configuration file. Shopware 6 plugins instead wire services through Symfony's DI container using `services.xml`/PHP service configuration and autowiring/autoconfiguration inside the plugin's own Symfony bundle. [from memory: Shopware plugins declare and configure services via a `Resources/config/services.xml` file (or PHP config) processed by the Symfony DependencyInjection component, which is the closest structural analogue to Magento's `di.xml`, though the two systems differ significantly \u2014 Magento's `di.xml` also handles plugin/interceptor and preference wiring that Shopware handles through Symfony's decorator pattern and event subscribers instead.]", "citations": ["platform/func/migration-en/magento-keywords.md:20-60"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"magento\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/migration-en/magento-keywords.md"}, {"tool": "Bash", "args": "grep -ni \"di.xml\\|dependency injection\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/migration-en/magento-firststeps.md"}], "notFoundClaim": false, "memoryClaims": ["Shopware plugins declare and configure services via a `Resources/config/services.xml` file (or PHP config) processed by the Symfony DependencyInjection component, which is the closest structural analogue to Magento's `di.xml`, though the two systems differ significantly \u2014 Magento's `di.xml` also handles plugin/interceptor and preference wiring that Shopware handles through Symfony's decorator pattern and event subscribers instead."], "sourceVerdict": "partial"}, "edge-07": {"query": "How do I set up Shopware PWA as the storefront for a Shopware 6.7 shop?", "category": "edge", "option": "fs-wiki", "answer": "Shopware PWA is in maintenance mode and there is no setup guide for it under the 6.7 developer docs in this corpus at all \u2014 the PWA page only exists under `platform/dev/6.6/products/pwa.md`, and it describes Shopware PWA as 'a Single Page Application built with JavaScript and Vue.js that provides a decoupled storefront, integrating Shopware functionality into an extensible frontend application,' based on the Store API, explicitly noting it 'is currently in maintenance mode; Composable Frontends is recommended as the future direction for headless commerce with Shopware.' So for a 6.7 shop the documented/recommended path is Composable Frontends rather than Shopware PWA, which is no longer being actively developed. [from memory: Composable Frontends (Shopware's Vue Storefront-based headless frontend product) is what Shopware now directs new decoupled-storefront projects toward, and Shopware PWA has not received major feature updates since being placed in maintenance mode.]", "citations": ["platform/dev/6.6/products/pwa.md:15-25"], "toolCallLog": [{"tool": "Bash", "args": "grep -rni \"shopware pwa\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev -iname \"*pwa*\""}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.6/products/pwa.md"}], "notFoundClaim": true, "memoryClaims": ["Composable Frontends (Shopware's Vue Storefront-based headless frontend product) is what Shopware now directs new decoupled-storefront projects toward, and Shopware PWA has not received major feature updates since being placed in maintenance mode."], "sourceVerdict": "partial"}, "edge-08": {"query": "Which service do I type-hint to read products \u2014 `EntityRepositoryInterface` \u2014 and how do I inject it into my plugin service?", "category": "edge", "option": "fs-wiki", "answer": "The corpus does not use the name `EntityRepositoryInterface` \u2014 that interface was removed years ago; the current class to type-hint is `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository` [from memory]. Per the wiki's 'Reading Data' guide, you inject the entity repository named `entity_name.repository` (e.g. `product.repository`) via `services.php` using `service('product.repository')`, and once injected it returns an `EntitySearchResult` from `$this->productRepository->search(new Criteria(), $context)`. The general dependency-injection guide adds that if `autowire`/`autoconfigure` are set in `services.php` a constructor-typed dependency is wired automatically; otherwise you declare it explicitly with `$services->set(ExampleService::class)->args([service('product.repository')])` using the Symfony `service()` configurator function.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md:28-40", "platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md:22-48"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"EntityRepositoryInterface\\|EntityRepository\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Bash", "args": "grep -n \"reading\" -ri .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md"}, {"tool": "Bash", "args": "grep -n \"services/dependency-injection.md\\|plugin-base-guide\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md"}], "notFoundClaim": false, "memoryClaims": ["The corpus does not use the name `EntityRepositoryInterface` \u2014 that interface was removed years ago; the current class to type-hint is `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository` [from memory]."], "sourceVerdict": "partial"}, "edge-09": {"query": "Where do I configure Business Events so that a mail is sent when an order is placed in Shopware 6.7?", "category": "edge", "option": "fs-wiki", "answer": "In Shopware 6.7, 'Business Events' (Settings > Shop) is legacy \u2014 it was superseded by the Flow Builder as of major release 6.4.8.0, and is documented as remaining in use only for the B2B-Suite. On the legacy Business Events screen you would click 'Add Business-Event', set Title, Active, pick the triggering Event (selecting 'Order placed' maps to the technical event `checkout.order.placed`), choose the Email template to send, and optionally scope it by Sales Channel and Rule Builder rules; note that if internal 'Email recipients' are configured on the event, the customer stops receiving the mail automatically and a second identical event is needed to still notify the customer. For everything outside the B2B-Suite, the current, non-legacy way to do this in 6.7 is the Flow Builder (Settings > Automation > Flow Builder): create a flow with trigger `checkout.order.placed`, optionally add Rule Builder conditions, and add the 'Send mail' action (choosing Administrator, Customer, or custom recipients).", "citations": ["platform/func/settings/Business-Events.md:21-42", "platform/func/settings/Flow-Builder.md:19-37"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"business event\\|Business Events\" .claude/extras/S ation/permissions-error-handling/add-acl-rules.md:22-68", "platform/hubs/admin-api.md:41-97"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"api route scope|RouteScope|admin-api|acl|route-scope\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Bash", "args": "grep -n \"add-custom-endpoint|admin api route|custom api route|api-route|Api Aware|ApiRouteScope|admin.api|api scope\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}, {"tool": "Bash", "args": "grep -rn \"route_scope.*api|AdministrationRouteScope|ApiRouteScope|admin-api-route|Route(path: \\\"/api\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Bash", "args": "ls .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/ | grep -i synonym"}, {"tool": "Bash", "args": "cat .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/index.md"}, {"tool": "Bash", "args": "grep -n \"admin api|api endpoint|controller\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/part-1.md"}, {"tool": "Bash", "args": "grep -rln \"/api/\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins"}, {"tool": "Bash", "args": "grep -n \"admin api|controller|route\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/hubs/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/hubs/admin-api.md"}], "notFoundClaim": true, "memoryClaims": ["In real Shopware the equivalent mechanism is an `AdminApiRouteScope`-tagged controller plus an `#[Acl(['my_privilege'])]` attribute on the action [from memory], but that guide is not present in this corpus, so I cannot cite it \u2014 this looks like a genuine documentation gap rather than a feature that doesn't exist."], "sourceVerdict": "no"}, "gap-02": {"que <script>
(function () {
  'use strict';

  // ---- load + defend ----
  var dataEl = document.getElementById('report-data');
  var payload = {};
  try { payload = JSON.parse(dataEl.textContent || '{}') || {}; } catch (e) { payload = {}; }
  var scores = payload.scores || {};
  var raw = payload.raw || {};
  var scoredRaw = payload.scored || {};
  var options = scores.options || {};
  var optionKeys = Object.keys(options);
  var matrix = scores.matrix || {};
  var warnings = scores.warnings || [];

  function dash(v) { return (v === undefined || v === null || v === '') ? '—' : v; }
  function pct(v) { return (v === undefined || v === null || v === '') ? '—' : (v + '%'); }
  function num(v) { return (v === undefined || v === null) ? '—' : v; }
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k === 'html') { /* not used — kept out for safety */ }
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function text(t) { return document.createTextNode(dash(t)); }
  function td(content, cls) {
    var cell = document.createElement('td');
    if (cls) cell.className = cls;
    if (content instanceof Node) cell.appendChild(content);
    else cell.textContent = dash(content);
    return cell;
  }
  function th(content) {
    var cell = document.createElement('th');
    cell.textContent = content;
    return cell;
  }
  function verdictClass(v) {
    var s = String(v || '').toLowerCase();
    if (['pass', 'partly', 'fail', 'unavailable', 'unscored'].indexOf(s) >= 0) return 'verdict-' + s;
    return '';
  }
  function statusClass(v) {
    var s = String(v || '').toLowerCase();
    if (s.indexOf('ready') === 0) return 'status-pass';
    if (s.indexOf('usable') === 0) return 'status-partly';
    if (s.indexOf('not ready') === 0) return 'status-fail';
    return '';
  }
  function findClass(v) {
    var s = String(v || '').toLowerCase();
    if (s === 'pass') return 'find-pass';
    if (s === 'fail') return 'find-fail';
    return '';
  }
  function heatColor(v) {
    if (v === undefined || v === null || isNaN(v)) return { bg: 'transparent', fg: 'inherit' };
    var clamped = Math.max(0, Math.min(100, Number(v)));
    var hue = (clamped / 100) * 120; // 0=red .. 120=green
    var bg = 'hsl(' + hue.toFixed(0) + ', 55%, 45%)';
    return { bg: bg, fg: '#fff' };
  }
  function prettyJson(obj) {
    var pre = document.createElement('pre');
    try { pre.textContent = JSON.stringify(obj, null, 2); } catch (e) { pre.textContent = String(obj); }
    return pre;
  }
  function sortableTable(container, columns, rows, defaultKey, defaultDir) {
    var wrap = el('div', { class: 'table-wrap' });
    var table = document.createElement('table');
    var thead = document.createElement('thead');
    var trh = document.createElement('tr');
    var sortKey = defaultKey;
    var sortDir = defaultDir || -1;
    columns.forEach(function (c) {
      var cell = th(c.label);
      cell.dataset.key = c.key;
      cell.addEventListener('click', function () {
        if (sortKey === c.key) sortDir *= -1; else { sortKey = c.key; sortDir = -1; }
        draw();
      });
      trh.appendChild(cell);
    });
    thead.appendChild(trh);
    var tbody = document.createElement('tbody');
    table.appendChild(thead);
    table.appendChild(tbody);
    wrap.appendChild(table);
    container.appendChild(wrap);
    function draw() {
      var sorted = rows.slice().sort(function (a, b) {
        var av = a[sortKey], bv = b[sortKey];
        if (av === undefined || av === null) av = '';
        if (bv === undefined || bv === null) bv = '';
        if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sortDir;
        return String(av).localeCompare(String(bv)) * sortDir;
      });
      tbody.innerHTML = '';
      if (sorted.length === 0) {
        var tr = document.createElement('tr');
        var cell = document.createElement('td');
        cell.colSpan = columns.length;
        cell.className = 'empty';
        cell.textContent = 'No data.';
        tr.appendChild(cell);
        tbody.appendChild(tr);
        return;
      }
      sorted.forEach(function (r) {
        var tr = document.createElement('tr');
        columns.forEach(function (c) {
          tr.appendChild(c.render ? c.render(r) : td(r[c.key]));
        });
        tbody.appendChild(tr);
      });
    }
    draw();
    return { redraw: draw };
  }

      ['Run', scores.run],
      ['Mode', scores.mode],
      ['Generated', scores.generatedAt],
      ['Label', scores.label],
      ['Model', scores.model],
      ['Corpus', corpus.name],
      ['Fingerprint', fp && Object.keys(fp).length ? Object.keys(fp).map(function (k) { return k + '=' + fp[k]; }).join(', ') : null],
      ['Probe', probe && (probe.ok !== undefined) ? (probe.ok ? 'ok' : 'failed') + (probe.detail ? ' — ' + probe.detail : '') : null],
      ['Wall clock (s)', scores.costs && scores.costs.wallClockSeconds]
    ];
    fields.forEach(function (f) {
      var field = el('div', { class: 'field' });
      var b = document.createElement('b');
      b.textContent = dash(f[1]);
      var lbl = document.createElement('span');
      lbl.textContent = f[0];
      field.appendChild(b);
      field.appendChild(lbl);
      bar.appendChild(field);
    });
  })();

  // ---- tabs ----
  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (b) { b.setAttribute('aria-selected', 'false'); });
      document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
      btn.setAttribute('aria-selected', 'true');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ================= SUMMARY =================
  (function renderSummary() {
    var panel = document.getElementById('tab-summary');

    if (warnings.length) {
      var w = el('div', { class: 'warnings' });
      w.appendChild(el('h3', { text: 'Warnings' }));
      var ul = document.createElement('ul');
      warnings.forEach(function (msg) { ul.appendChild(el('li', { text: msg })); });
      w.appendChild(ul);
      panel.appendChild(w);
    }

    var ranking = matrix.ranking || [];
    if (ranking.length) {
      panel.appendChild(el('h2', { text: 'Ranking' }));
      var list = document.createElement('ol');
      ranking.forEach(function (r) {
        var li = document.createElement('li');
        li.textContent = dash(r.option) + ' — ' + pct(r.overall) + ' ';
        var span = document.createElement('span');
        span.className = statusClass(r.status);
        span.textContent = dash(r.status);
        li.appendChild(span);
        list.appendChild(li);
      });
      panel.appendChild(list);
    }

    panel.appendChild(el('h2', { text: 'Comparison' }));
    var compareRows = optionKeys.map(function (key) {
      var o = options[key] || {};
      var counts = o.counts || {};
      var findability = o.findability || {};
      var edge = o.edge || {};
      var gap = o.gap || {};
      var averages = o.averages || {};
      var costs = o.costs || {};
      return {
        option: o.option || key,
        access: o.access, corpus: o.corpus,
        overall: averages.overall, status: o.status,
        developer: averages.developer, functional: averages.functional,
        findable: (findability.pass != null && findability.total != null) ? (findability.pass + '/' + findability.total) : null,
        edge: (edge.pass != null && edge.total != null) ? (edge.pass + '/' + edge.total) : null,
        gap: (gap.pass != null && gap.total != null) ? (gap.pass + '/' + gap.total) : null,
        pass: counts.pass, partly: counts.partly, fail: counts.fail,
        unavailable: counts.unavailable, unscored: counts.unscored,
        weakest: o.weakestDimension,
        tokens: costs.totalTokens, toolCalls: costs.totalToolCalls, agentSeconds: costs.agentTimeSecondsSummed
      };
    });
    sortableTable(panel, [
      { key: 'option', label: 'Option' },
      { key: 'access', label: 'Access' },
      { key: 'corpus', label: 'Corpus' },
      { key: 'overall', label: 'Overall %', render: function (r) { return td(pct(r.overall)); } },
      { key: 'status', label: 'Status', render: function (r) { return td(r.status, statusClass(r.status)); } },
      { key: 'developer', label: 'Dev %', render: function (r) { return td(pct(r.developer)); } },
      { key: 'functional', label: 'Func %', render: function (r) { return td(pct(r.functional)); } },
      { key: 'findable', label: 'Findable' },
      { key: 'edge', label: 'Edge' },
      { key: 'gap', label: 'Gap' },
      { key: 'pass', label: 'Pass' },
      { key: 'partly', label: 'Partly' },
      { key: 'fail', label: 'Fail' },
      { key: 'unavailable', label: 'Unavail.' },
      { key: 'unscored', label: 'Unscored' },
      { key: 'weakest', label: 'Weakest dim.' },
      { key: 'tokens', label: 'Tokens' },
      { key: 'toolCalls', label: 'Tool calls' },
      { key: 'agentSeconds', label: 'Agent (s)' }
    ], compareRows, 'overall', -1);

    var deltas = matrix.deltas || {};
    if (deltas.mcpMinusFs || deltas.wikiMinusDocs) {
      panel.appendChild(el('h2', { text: 'Deltas' }));
      var cards = el('div', { class: 'cards' });
      function deltaCard(label, obj) {
        if (!obj) return;
        Object.keys(obj).forEach(function (k) {
          var c = el('div', { class: 'card' });
          c.appendChild(el('div', { class: 'label', text: label + ' (' + k + ')' }));
          var v = obj[k];
          c.appendChild(el('div', { class: 'value', text: (v === undefined || v === null) ? '—' : (v > 0 ? '+' + v : String(v)) }));
          cards.appendChild(c);
        });
      }
      deltaCard('mcp − fs', deltas.mcpMinusFs);
      deltaCard('wiki − docs', deltas.wikiMinusDocs);
      panel.appendChild(cards);
    }
  })();

  // ================= DIMENSIONS =================
  (function renderDimensions() {
    var panel = document.getElementById('tab-dimensions');
    var byDimension = matrix.byDimension || {};
    var dims = Object.keys(byDimension);
    if (!dims.length) {
      // derive from any option's averages.byDimension if matrix lacks it
      optionKeys.forEach(function (key) {
        var bd = (options[key] && options[key].averages && options[key].averages.byDimension) || {};
        Object.keys(bd).forEach(function (d) { if (dims.indexOf(d) < 0) dims.push(d); });
      });
    }

    panel.appendChild(el('h2', { text: 'Dimension heatmap' }));
    if (!dims.length || !optionKeys.length) {
      panel.appendChild(el('p', { class: 'empty', text: 'No dimension data.' }));
    } else {
      var wrap = el('div', { class: 'table-wrap' });
      var table = document.createElement('table');
      var thead = document.createElement('tr');
      thead.appendChild(th('Dimension'));
      optionKeys.forEach(function (k) { thead.appendChild(th(k)); });
      var theadWrap = document.createElement('thead');
      theadWrap.appendChild(thead);
      table.appendChild(theadWrap);
      var tbody = document.createElement('tbody');
      dims.forEach(function (d) {
        var tr = document.createElement('tr');
        tr.appendChild(td(d));
        optionKeys.forEach(function (k) {
          var v = (byDimension[d] && byDimension[d][k] !== undefined)
            ? byDimension[d][k]
            : ((options[k] && options[k].averages && options[k].averages.byDimension) ? options[k].averages.byDimension[d] : null);
          var cell = document.createElement('td');
          cell.className = 'heat-cell';
          if (v === undefined || v === null) {
            cell.textContent = '—';
          } else {
            var col = heatColor(v);
            cell.style.background = col.bg;
            cell.style.color = col.fg;
            cell.textContent = v;
          }
          tr.appendChild(cell);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      panel.appendChild(wrap);
    }

    var anyByArea = optionKeys.some(function (k) { return options[k] && options[k].byArea; });
    if (anyByArea) {
      panel.appendChild(el('h2', { text: 'By area' }));
      var areas = [];
      optionKeys.forEach(function (k) {
        var ba = (options[k] && options[k].byArea) || {};
        Object.keys(ba).forEach(function (a) { if (areas.indexOf(a) < 0) areas.push(a); });
      });
      var wrap2 = el('div', { class: 'table-wrap' });
      var table2 = document.createElement('table');
      var thr = document.createElement('tr');
      thr.appendChild(th('Area'));
      optionKeys.forEach(function (k) { thr.appendChild(th(k)); });
      var thead2 = document.createElement('thead');
      thead2.appendChild(thr);
      table2.appendChild(thead2);
      var tbody2 = document.createElement('tbody');
      areas.forEach(function (a) {
        var tr = document.createElement('tr');
        tr.appendChild(td(a));
        optionKeys.forEach(function (k) {
          var entry = (options[k] && options[k].byArea && options[k].byArea[a]) || null;
          tr.appendChild(td(entry ? (dash(entry.average) + ' (' + dash(entry.pass) + '/' + dash(entry.cases) + ')') : null));
        });
        tbody2.appendChild(tr);
      });
      table2.appendChild(tbody2);
      wrap2.appendChild(table2);
      panel.appendChild(wrap2);
    }
  })();

  // ================= CASES =================
  (function renderCases() {
    var panel = document.getElementById('tab-cases');

    var allCases = scores.cases || [];
    if (!allCases.length) {
      var seen = {};
      optionKeys.forEach(function (k) {
        ((options[k] && options[k].cases) || []).forEach(function (c) {
          if (c.caseId && !seen[c.caseId]) { seen[c.caseId] = true; allCases.push(c.caseId); }
        });
      });
    }

    // index scorecards by option -> caseId
    var byOptCase = {};
    optionKeys.forEach(function (k) {
      byOptCase[k] = {};
      ((options[k] && options[k].cases) || []).forEach(function (c) { byOptCase[k][c.caseId] = c; });
    });

    var categories = [];
    var verdicts = [];
    allCases.forEach(function (cid) {
      optionKeys.forEach(function (k) {
        var c = byOptCase[k][cid];
        if (c) {
          if (c.category && categories.indexOf(c.category) < 0) categories.push(c.category);
          if (c.verdict && verdicts.indexOf(c.verdict) < 0) verdicts.push(c.verdict);
        }
      });
    });

    var activeCategory = null;
    var activeVerdict = null;

    var chips = el('div', { class: 'chips' });
    var catGroup = el('span', { class: 'chip-group-label', text: 'Category' });
    chips.appendChild(catGroup);
    var catChipEls = [];
    categories.forEach(function (cat) {
      var chip = el('button', { class: 'chip', type: 'button', text: cat });
      chip.setAttribute('aria-pressed', 'false');
      chip.addEventListener('click', function () {
        activeCategory = (activeCategory === cat) ? null : cat;
        catChipEls.forEach(function (c) { c.setAttribute('aria-pressed', String(c.textContent === activeCategory)); });
        drawGrid();
      });
      catChipEls.push(chip);
      chips.appendChild(chip);
    });
    var verdictGroup = el('span', { class: 'chip-group-label', text: 'Verdict' });
    chips.appendChild(verdictGroup);
    var verdictChipEls = [];
    verdicts.forEach(function (v) {
      var chip = el('button', { class: 'chip', type: 'button', text: v });
      chip.setAttribute('aria-pressed', 'false');
      chip.addEventListener('click', function () {
        activeVerdict = (activeVerdict === v) ? null : v;
        verdictChipEls.forEach(function (c) { c.setAttribute('aria-pressed', String(c.textContent === activeVerdict)); });
        drawGrid();
      });
      verdictChipEls.push(chip);
      chips.appendChild(chip);
    });
    panel.appendChild(chips);

    var gridWrap = el('div', { class: 'table-wrap' });
    panel.appendChild(gridWrap);
    var drilldown = el('div', { class: 'drilldown', id: 'case-drilldown' });
    drilldown.appendChild(el('p', { class: 'empty', text: 'Click a cell to see the case detail.' }));
    panel.appendChild(drilldown);

    function drawGrid() {
      gridWrap.innerHTML = '';
      var visibleCases = allCases.filter(function (cid) {
        if (!activeCategory && !activeVerdict) return true;
        return optionKeys.some(function (k) {
          var c = byOptCase[k][cid];
          if (!c) return false;
          if (activeCategory && c.category !== activeCategory) return false;
          if (activeVerdict && c.verdict !== activeVerdict) return false;
          return true;
        });
      });
      if (!visibleCases.length || !optionKeys.length) {
        gridWrap.appendChild(el('p', { class: 'empty', text: 'No cases match the filters.' }));
        return;
      }
      var table = document.createElement('table');
      var thead = document.createElement('thead');
      var trh = document.createElement('tr');
      trh.appendChild(th('Case'));
      optionKeys.forEach(function (k) { trh.appendChild(th(k)); });
      thead.appendChild(trh);
      table.appendChild(thead);
      var tbody = document.createElement('tbody');
      visibleCases.forEach(function (cid) {
        var tr = document.createElement('tr');
        tr.appendChild(td(cid));
        optionKeys.forEach(function (k) {
          var c = byOptCase[k][cid];
          var cell = document.createElement('td');
          if (!c) { cell.textContent = '—'; tr.appendChild(cell); return; }
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cell-btn ' + verdictClass(c.verdict);
          btn.textContent = pct(c.total) + (c.findability ? (c.findability === 'pass' ? ' ✓' : c.findability === 'fail' ? ' ✗' : '') : '');
          btn.addEventListener('click', function () { renderDrilldown(k, cid, c); });
          cell.appendChild(btn);
          tr.appendChild(cell);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      gridWrap.appendChild(table);
    }

    function highlightMemory(text) {
      var frag = document.createDocumentFragment();
      if (!text) { frag.appendChild(document.createTextNode('—')); return frag; }
      var sentences = String(text).split(/(?<=[.!?])\s+/);
      sentences.forEach(function (s, i) {
        var span = document.createElement('span');
        span.textContent = s + (i < sentences.length - 1 ? ' ' : '');
        if (/\[from memory\]/i.test(s)) span.className = 'mem-highlight';
        frag.appendChild(span);
      });
      return frag;
    }

    function renderDrilldown(optKey, caseId, scoreCard) {
      drilldown.innerHTML = '';
      drilldown.appendChild(el('h3', { text: optKey + ' — ' + caseId }));

      var rawCase = (raw[optKey] && raw[optKey][caseId]) || {};
      var scoredCase = (scoredRaw[optKey] && scoredRaw[optKey][caseId]) || {};

      var kv = el('dl', { class: 'kv' });
      function kvRow(k, v) {
        kv.appendChild(el('dt', { text: k }));
        kv.appendChild(el('dd', { text: dash(v) }));
      }
      kvRow('Query', rawCase.query);
      kvRow('Category', scoreCard.category);
      kvRow('Target', scoreCard.target);
      kvRow('Page reached', scoreCard.pageReached);
      kvRow('Verdict', scoreCard.verdict);
      kvRow('Total', pct(scoreCard.total));
      kvRow('Findability', scoreCard.findability);
      kvRow('Not-found claim', rawCase.notFoundClaim);
      drilldown.appendChild(kv);

      if (scoreCard.discrepancy) {
        var disc = el('p', { class: 'warnings' });
        disc.textContent = 'Discrepancy: recomputed total ' + pct(scoreCard.total) + ' vs scorer total ' + pct(scoreCard.scorerTotal) + ' (' + dash(scoreCard.scorerVerdict) + ')';
        drilldown.appendChild(disc);
      }

      drilldown.appendChild(el('h3', { text: 'Answer' }));
      var answerP = document.createElement('p');
      answerP.appendChild(highlightMemory(rawCase.answer));
      drilldown.appendChild(answerP);

      drilldown.appendChild(el('h3', { text: 'Citations' }));
      var citationsList = document.createElement('ul');
      var citations = rawCase.citations || [];
      if (!citations.length) citationsList.appendChild(el('li', { text: '—' }));
      citations.forEach(function (c) {
        citationsList.appendChild(el('li', { text: (typeof c === 'string') ? c : JSON.stringify(c) }));
      });
      drilldown.appendChild(citationsList);
      var verified = document.createElement('p');
      verified.textContent = 'Verified: ' + dash(scoreCard.citationsVerified);
      drilldown.appendChild(verified);

      drilldown.appendChild(el('h3', { text: 'Tool call log' }));
      var toolCalls = rawCase.toolCallLog || [];
      // Ground-truth calls (from the transcript extract) when present, keyed by case id.
      var gtCalls = ((payload.calls || {})[optKey] || {})[caseId] || [];
      if (!toolCalls.length) {
        drilldown.appendChild(el('p', { class: 'empty', text: 'No tool calls recorded.' }));
      } else {
        var tcWrap = el('div', { class: 'table-wrap' });
        var tcTable = document.createElement('table');
        var tcHead = document.createElement('tr');
        tcHead.appendChild(th('Tool'));
        tcHead.appendChild(th('Args'));
        tcHead.appendChild(th('Round trip'));
        tcHead.appendChild(th('Returned'));
        var tcTheadWrap = document.createElement('thead');
        tcTheadWrap.appendChild(tcHead);
        tcTable.appendChild(tcTheadWrap);
        var tcBody = document.createElement('tbody');
        toolCalls.forEach(function (call, i) {
          var argsStr = JSON.stringify(call.args || {});
          var gt = gtCalls[i] || null;
          var tr = document.createElement('tr');
          tr.appendChild(td(call.tool));
          tr.appendChild(td(argsStr));
          tr.appendChild(td(gt && gt.latencyMs != null ? gt.latencyMs + ' ms' : '—'));
          tr.appendChild(td(gt && gt.resultBytes != null
            ? gt.resultBytes.toLocaleString() + ' B / ' + (gt.resultLines || 0) + ' ln' + (gt.empty ? ' (no hits)' : '')
            : '—'));
          tcBody.appendChild(tr);
        });
        tcTable.appendChild(tcBody);
        tcWrap.appendChild(tcTable);
        drilldown.appendChild(tcWrap);
      }

      drilldown.appendChild(el('h3', { text: 'Findings' }));
      var findingsList = document.createElement('ul');
      var findings = scoreCard.findings || [];
      if (!findings.length) findingsList.appendChild(el('li', { text: '—' }));
      findings.forEach(function (f) { findingsList.appendChild(el('li', { text: typeof f === 'string' ? f : JSON.stringify(f) })); });
      drilldown.appendChild(findingsList);

      drilldown.appendChild(el('h3', { text: 'Official references' }));
      var refs = scoreCard.officialReferences || [];
      if (!refs.length) {
        drilldown.appendChild(el('p', { class: 'empty', text: '—' }));
      } else {
        var refList = document.createElement('ul');
        refs.forEach(function (r) {
          refList.appendChild(el('li', { text: dash(r.url) + ' — ' + dash(r.quote) }));
        });
        drilldown.appendChild(refList);
      }

      drilldown.appendChild(el('h3', { text: 'Notes' }));
      drilldown.appendChild(el('p', { text: scoreCard.notes }));

      drilldown.appendChild(el('h3', { text: 'Usage' }));
      var usage = scoreCard.usage || {};
      var usageKv = el('dl', { class: 'kv' });
      ['discover', 'scorer'].forEach(function (phase) {
        var u = usage[phase];
        usageKv.appendChild(el('dt', { text: phase }));
        usageKv.appendChild(el('dd', { text: u ? ('tokens=' + dash(u.tokens) + ', toolCalls=' + dash(u.toolCalls) + ', durationMs=' + dash(u.durationMs)) : '—' }));
      });
      drilldown.appendChild(usageKv);

      if (Object.keys(scoredCase).length) {
        var scoredDetails = document.createElement('details');
        scoredDetails.appendChild(el('summary', { text: 'Scored JSON (verbatim)' }));
        scoredDetails.appendChild(prettyJson(scoredCase));
        drilldown.appendChild(scoredDetails);
      }
    }

    drawGrid();
  })();

  // ================= RAW DATA =================
  (function renderRaw() {
    var panel = document.getElementById('tab-raw');
    if (!optionKeys.length) {
      panel.appendChild(el('p', { class: 'empty', text: 'No raw data.' }));
      return;
    }
    optionKeys.forEach(function (k) {
      panel.appendChild(el('h2', { text: k }));
      var caseIds = Object.keys(raw[k] || {});
      var scoredIds = Object.keys(scoredRaw[k] || {});
      var allIds = caseIds.concat(scoredIds.filter(function (id) { return caseIds.indexOf(id) < 0; }));
      if (!allIds.length) {
        panel.appendChild(el('p', { class: 'empty', text: 'No cases.' }));
        return;
      }
      allIds.forEach(function (cid) {
        var details = document.createElement('details');
        details.appendChild(el('summary', { text: cid }));
        var rawDetails = document.createElement('details');
        rawDetails.appendChild(el('summary', { text: 'Raw' }));
        rawDetails.appendChild(prettyJson((raw[k] && raw[k][cid]) || {}));
        details.appendChild(rawDetails);
        var scoredDetails = document.createElement('details');
        scoredDetails.appendChild(el('summary', { text: 'Scored' }));
        scoredDetails.appendChild(prettyJson((scoredRaw[k] && scoredRaw[k][cid]) || {}));
        details.appendChild(scoredDetails);
        panel.appendChild(details);
      });
    });
  })();

  // ================= RUN =================
  (function renderRun() {
    var panel = document.getElementById('tab-run');
    var corpus = scores.corpus || {};
    var fp = corpus.fingerprint || {};
    var probe = corpus.probe || {};

    panel.appendChild(el('h2', { text: 'Corpus' }));
    var corpusKv = el('dl', { class: 'kv' });
    corpusKv.appendChild(el('dt', { text: 'Name' }));
    corpusKv.appendChild(el('dd', { text: corpus.name }));
    corpusKv.appendChild(el('dt', { text: 'Probe' }));
    corpusKv.appendChild(el('dd', { text: probe && probe.ok !== undefined ? ((probe.ok ? 'ok' : 'failed') + (probe.detail ? ' — ' + probe.detail : '')) : null }));
    Object.keys(fp).forEach(function (k) {
      corpusKv.appendChild(el('dt', { text: k }));
      corpusKv.appendChild(el('dd', { text: fp[k] }));
    });
    panel.appendChild(corpusKv);

    panel.appendChild(el('h2', { text: 'Yardstick' }));
    var yardstick = scores.yardstick || {};
    var ykv = el('dl', { class: 'kv' });
    ['casesMdSha', 'rubricSha', 'briefSha'].forEach(function (k) {
      ykv.appendChild(el('dt', { text: k }));
      ykv.appendChild(el('dd', { text: yardstick[k] }));
    });
    panel.appendChild(ykv);

    if (scores.runs && Object.keys(scores.runs).length) {
      panel.appendChild(el('h2', { text: 'Runs (compare)' }));
      var rkv = el('dl', { class: 'kv' });
      Object.keys(scores.runs).forEach(function (k) {
        rkv.appendChild(el('dt', { text: k }));
        rkv.appendChild(el('dd', { text: scores.runs[k] }));
      });
      panel.appendChild(rkv);
    }

    panel.appendChild(el('h2', { text: 'Selector' }));
    panel.appendChild(el('p', { text: dash(scores.casesSelector) }));

    if (warnings.length) {
      panel.appendChild(el('h2', { text: 'Warnings' }));
      var ul = document.createElement('ul');
      warnings.forEach(function (msg) { ul.appendChild(el('li', { text: msg })); });
      panel.appendChild(ul);
    }

    panel.appendChild(el('h2', { text: 'scores.json' }));
    var details = document.createElement('details');
    details.appendChild(el('summary', { text: 'Show raw scores.json' }));
    details.appendChild(prettyJson(scores));
    panel.appendChild(details);
  })();

})();
</script>
</body>
</html>
