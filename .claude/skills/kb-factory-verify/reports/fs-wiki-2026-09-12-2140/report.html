tor']`; feature flags via `global.activeFeatureFlags = ['FEATURE_NEXT_12345']`; repository factory responses via `global.repositoryFactoryMock.responses.addResponse({ method, url, status, response })` (disable the missing-mock warning with `global.repositoryFactoryMock.showWarning = false`); and global mocks like `$tc`, `$device`, `$store`, `$router`, overridable in `mount`'s `mocks` option. Missing directives (e.g. `clipboard`) need `createLocalVue()` plus `localVue.directive('clipboard', {})`; missing injections (e.g. `mediaService`) need a stub via `provide: { mediaService: { renameMedia: () => Promise.resolve() } }` or global registration with `Shopware.Service.register('mediaService', {...})` in `beforeAll`. Unresolved child components, directives, injections, or services will surface as `[Vue warn]` messages during test runs and must be stubbed or mocked explicitly.", "citations": ["platform/dev/6.7/guides/development/testing/unit/jest-admin.md:14-57"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/development/testing/unit/jest-admin.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-39": {"query": "How do I write end-to-end Cypress tests for my plugin against a Shopware 6.7 store?", "category": "dev", "option": "fs-wiki", "answer": "For Shopware 6.7, the corpus flags Cypress-based E2E testing as legacy: \"Cypress has been deprecated and is no longer maintained; use Playwright for new projects instead\" \u2014 new plugins/projects should use the Playwright-based Shopware Acceptance Test Suite instead. That said, the corpus still documents the legacy Cypress approach for existing suites: start from a clean Shopware installation (no categories/products/settings) initialized with `composer run init`, and install E2E dependencies with `npm install` in the relevant E2E folder. For a plugin, create the folder structure `Resources/app/<environment>/test/e2e/cypress/{fixtures,integration,plugins,support}`, run `npm init -y`, install `@shopware-ag/e2e-testsuite-platform` (which bundles Cypress plus the `cypress-select-tests`, `cypress-log-to-output`, and `cypress-file-upload` plugins), then create `e2e/cypress/plugins/index.js` requiring `@shopware-ag/e2e-testsuite-platform/cypress/plugins` and `e2e/cypress/support/index.js` requiring `@shopware-ag/e2e-testsuite-platform/cypress/support`. Test files (`*.spec.js`) go under `integration`, and must sit in one of the recognized subfolders (`catalogue`, `content`, `customer`, `general`, `media-marketing`, `order`, `rule-product-stream`, `settings`) or CI won't pick them up; `fixtures` holds static JSON test data loaded via `cy.fixture`, and `support` holds custom commands/global overrides. Use `describe()`/`context()` to group tests and `it()` (Shopware's preferred convention) for individual tests, preferring `beforeEach` cleanup over `after`/`afterEach` since a failed test can skip the latter. Create test data through the REST API rather than the UI, via the `ApiService` wrapper and helpers like `cy.createDefaultFixture(endpoint, data, jsonPath)`, or custom services extending `AdminFixtureService`/`FixturesService`. Run the suite for a Docker-based platform project with `composer run e2e:setup` (first-time prep, outside the container), then `composer run e2e:prepare`/`composer run e2e:open`, or headless via `composer e2e:cypress -- run --spec=\"cypress/e2e/administration/**/*.cy.js\"`. Avoid relying on UUID-based IDs as selectors since they can change between installations.", "citations": ["platform/dev/6.7/guides/development/testing/legacy/_index.md:16-22", "platform/dev/6.7/guides/development/testing/legacy/cypress/_index.md:19-46"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"cypress\\|e2e\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/development/testing/legacy/_index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/development/testing/legacy/cypress/_index.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-40": {"query": "How do I upgrade a Composer-based Shopware project from 6.6 to 6.7 \u2014 which composer.json constraint do I change, and which console commands do I run afterwards?", "category": "dev", "option": "fs-wiki", "answer": "The recommended path is the Shopware CLI upgrade wizard, run from a clean Git working tree: `shopware-cli project upgrade` (or, for CI/a read-only check, `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run`). It checks readiness, lets you pick the target version, checks Composer-managed extension compatibility, and resolves the target dependency set before applying the upgrade locally. If the wizard can't be used, do it manually: 1) enable maintenance mode with `bin/console sales-channel:maintenance:enable --all`; 2) adjust the Shopware version constraint (and `shopware/commercial`'s, if used) in `composer.json` to the 6.7 constraint, then run `composer update --no-scripts` (the flag avoids running scripts that depend on not-yet-updated recipes) \u2014 failing to change the constraint first means `composer update` just resolves to the currently installed version, so no upgrade actually happens; 3) optionally force-update Symfony Flex-managed config files with `composer recipes:update`; 4) finalize with `bin/console system:update:finish`, which runs the database migrations and recompiles themes; 5) disable maintenance mode with `bin/console sales-channel:maintenance:disable --all`. Avoid skipping major versions unless the full upgrade path has been explicitly tested.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md:19-55"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"upgrade\\|composer.json.*require\\|system:update\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | head -40"}, {"tool": "Read", "args": "platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-41": {"query": "`composer update` to Shopware 6.7 aborts on a platform requirement and my admin build then fails too \u2014 which PHP, database and Node versions does 6.7 actually require, and how do I check the machine I am on against them before I retry?", "category": "dev", "option": "fs-wiki", "answer": "Shopware 6.7's recommended stack (minimum \u2192 recommended) is: PHP 8.2+ (recommended 8.4) with memory_limit >= 512M, max_execution_time >= 30s, and required extensions ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, openssl, pcre, pdo_mysql, phar, simplexml, xml, xmlreader, zip, zlib (amqp optional), plus Composer 2.2+ recommended. Database: MariaDB >= 10.11.6 or MySQL >= 8.0.22 (Innovation releases unsupported), recommended MariaDB 11.4 / MySQL 8.4, with max_allowed_packet >= 32M. Node.js/npm: Node 20.0.0+ minimum, recommended Node 24 / npm 10 \u2014 this is what the admin build depends on, so a Node version below 20 will break the administration build. To check your machine against these before retrying `composer update`, verify locally with: `php -v`, `php -m`, `php -i | grep memory_limit`, `composer -V`, `node -v`, `npm -v`. Note that multiple PHP versions may be installed on one system, and the CLI and FPM SAPIs often load different php.ini files, so confirm you're checking the binary/ini that will actually run the update.", "citations": ["platform/dev/6.7/guides/hosting/_index.md:16-41"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "grep -rn \"requirement\" -i .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | head -30"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/_index.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-42": {"query": "How do I check extension compatibility before upgrading with shopware-cli, and why does it report my plugins in custom/plugins as blocking?", "category": "dev", "option": "fs-wiki", "answer": "Use `shopware-cli project upgrade`, which runs a local-first, six-phase upgrade wizard (readiness, version choice, extension/Composer analysis, plan review, apply, report) that checks readiness, analyzes Composer-managed extensions, and verifies the target dependency set with Composer before any files change \u2014 run it on a Git branch or disposable copy since it does not deploy to production. For a non-interactive preflight/dry run use `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run` (the `--target` flag accepts an exact version, `recommended`, or `latest-patch`; drop `--dry-run` to actually execute). One of the prerequisites the wizard checks is that 'all extensions are Composer-managed' \u2014 plugins sitting under custom/plugins that were installed manually (not required via Composer) are not Composer-managed, so the wizard reports them as blocking. The fix is to migrate them first with `shopware-cli project autofix composer-plugins` before re-running the upgrade. Note the wizard does not rewrite incompatible custom extension code, create missing vendor releases, remove hosting constraints, replace application testing, or deploy to production, so plugin code itself may still need manual fixes even after the Composer-management issue is resolved.", "citations": ["platform/dev/6.7/products/tools/cli/project-commands/upgrade.md:19-69"], "toolCallLog": [{"tool": "Bash", "args": "grep -rn \"upgrade.md|project upgrade|compatibility\" -i .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | grep -i \"cli|upgrade\" | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/_index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/tools/cli/project-commands/upgrade.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-43": {"query": "My admin plugin still ships a webpack.config.js \u2014 how do I move the administration build to Vite for Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Shopware 6.7 replaces the Webpack-based build for the Administration's Vue.js app with Vite (Webpack had become slow with unmaintained loaders); this is called out as a future-development-roadmap article, so details may still change. It only matters if your plugin extends the Administration build via a custom `webpack.config.js` \u2014 apps are unaffected since their build is already decoupled. To migrate: (1) create `vite.config.mts` in `YourApp/src/Resources/app/administration/src`, replacing the previous `webpack.config.js` that lived under `YourApp/src/Resources/app/administration/build/`; (2) remove the old `webpack.config.js`; (3) remove Webpack-related dependencies from `package.json`; (4) add the Vite dependencies to `package.json`. A minimal `vite.config.mts` looks like `import { defineConfig } from 'vite'; export default defineConfig({ resolve: { alias: { '@example': 'src/example' } } });`. You can test the new system behind the `ADMIN_VITE` feature flag. Bundle/plugin info is written to `<shopwareRoot>/var/plugins.json` by `Shopware\\Core\\Framework\\Plugin\\Command\\BundleDumpCommand` (run standalone via `bin/console bundle:dump`, or as part of `composer build:js:admin`/`watch:admin`). Extensions are built by `<shopwareRoot>/src/Administration/Resources/app/administration/build/plugins.vite.ts`, still invoked through `composer build:js:admin`. In production, asset info comes from `/api/_info/config` and is loaded via the Symfony `pentatrion_vite` bundle plus its `entrypoints.json` (generated by `vite-plugin-symfony`); in dev/HMR mode the `shopware-vite-plugin-serve-multiple-static` plugin serves `sw-plugin-dev.json`. Note that Vite can only hot-reload `.vue` files, so HMR stays limited until templates fully move to Single File Components; the `vue-globals` plugin rewrites Vue imports to destructure from `Shopware.Vue` to avoid multiple Vue instances, and `override-component` auto-registers `*.override.vue` files via `Shopware.Component.registerOverrideComponent`.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/vite.md:15-58"], "toolCallLog": [{"tool": "Bash", "args": "grep -rn \"vite|webpack\" -i .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/administration/vite.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-44": {"query": "After the Vue 3 upgrade my admin plugin broke \u2014 this.$parent resolves to the wrong component and a prop default that calls this.$tc throws. What do I have to change?", "category": "dev", "option": "fs-wiki", "answer": "Both symptoms are known Vue 3 migration pitfalls documented for the Shopware Administration's Vue 2-to-3 upgrade (mandatory from Shopware 6.6 onward). `this.$parent` is unreliable in Vue 3 because Vue wraps async components, so it sometimes requires `this.$parent.$parent` instead of `this.$parent` \u2014 prefer using services or event communication rather than relying on `$parent` traversal at all. The prop-default issue happens because Vue 3 prop default functions no longer have access to `this`, so `this.$tc` inside a prop default is undefined/throws; use `Shopware.Snippet.tc` instead of `this.$tc` in that context. More generally: search your code for any `this.$` usage (an indicator of Vue's internal API) since most such calls break under Vue 3, with `this.$tc` being an exception in regular component code (but not in prop defaults, per the above). Also check `v-model` usage, event listeners, deprecated slot syntax, `router-view` transition combinations, `key` attributes and filter usages against the Vue 3 migration guide, replace all `sw-field` usages with their dedicated component replacements, align plugin npm dependencies with the Administration's `package.json`, and test with `composer run watch:admin`. Related gotchas: `@hook:mounted`-style lifecycle hooks can fire twice for async components (once for the `AsyncComponentWrapper`, once for the underlying component), checking `this.$slots` for a slot name is no longer sufficient (verify an actual v-node), Vuex stores lose reactivity if a getter mutates state, form fields no longer keep the old DOM id (add a unique `name` attribute for tests), and mutating props now throws hard errors instead of being silently allowed as in Vue 2.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/vue3.md:15-48"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/administration/vue3.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-45": {"query": "Shopware.State is deprecated in 6.7 \u2014 how do I convert my administration Vuex module into a Pinia store?", "category": "dev", "option": "fs-wiki", "answer": "With Shopware 6.7, Vuex is replaced by Pinia as the Administration's state management library. Register a store with `Shopware.Store.register('<storeName>', { state, getters, actions })`, where `state` must be a function returning the initial state, not a static object \u2014 e.g. `const store = Shopware.Store.register('<storeName>', { state: () => ({ /* initial state */ }), getters: { /* ... */ }, actions: { /* ... */ } }); export default store;`. A store can also be registered with an `id` property instead of a name argument; re-registering an existing store id overwrites it, and `Shopware.Store.unregister('<storeName>')` removes one. To register a store you simply import its file (`import './state/products.state'` replaces the old `Shopware.State.registerModule('product', productsStore)`). Key differences from Vuex: Mutations are removed \u2014 update state directly inside actions (e.g. `this.productName = newName`); getters cannot share a name with a state property since both are exposed at the same level; for TypeScript, define `StoreType` via `ReturnType<typeof store>` and extend the global `PiniaRootState` interface with it; stores can also be defined as composables returning reactive refs/computed/functions, though Pinia devtools only track returned variables and functions. Access changes from `Shopware.State.get('<storeName>')` to `Shopware.Store.get('<storeName>')`. For tests, import the store file to register it and call `store.$reset()` in `beforeEach`; component tests using Pinia stores should call `setActivePinia(pinia)` with a `createPinia()` instance and pass `plugins: [pinia]` to the mount config.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/pinia.md:15-55"], "toolCallLog": [{"tool": "Bash", "args": "grep -rn \"pinia\" -i .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/administration/pinia.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-46": {"query": "sw-button and sw-card are deprecated in Shopware 6.7 \u2014 how do I migrate my plugin's admin templates to the Meteor components, and is there a codemod that does it?", "category": "dev", "option": "fs-wiki", "answer": "Yes, there is a codemod. With Shopware 6.7, several Administration components (such as sw-button, sw-card, etc.) are being replaced with components from the Meteor Component Library, Shopware's official reusable component collection built on the Shopware Design System. Run the codemod tool against a plugin located under `custom/plugins`: `composer run admin:code-mods`, e.g. `composer run admin:code-mods -- --plugin-name example-plugin --fix -v 6.7`. The tool replaces compatible components automatically, adds guidance comments where manual migration is required, and fixes some other deprecated code. To support cross-version compatibility, Shopware components also gained a `deprecated` prop (default `false`, meaning the new Meteor Component renders by default); setting `deprecated: true` renders the old component instead, letting a plugin support both Shopware 6.6 and 6.7 from a single codebase without migrating immediately. The old components remain usable via the `deprecated` prop, but Shopware recommends migrating to Meteor Components as soon as possible, and notes that timelines/specifics of this migration are subject to change.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/meteor-components.md:15-43"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/administration/meteor-components.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-47": {"query": "My payment plugin implements `AsynchronousPaymentHandlerInterface` and is tagged `shopware.payment.method.async` \u2014 how do I write a payment handler for Shopware 6.7 instead?", "category": "dev", "option": "fs-wiki", "answer": "From Shopware 6.7.0.0 onward, all payment handling goes through a single `Shopware\\Core\\Checkout\\Payment\\Cart\\PaymentHandler\\AbstractPaymentHandler` class instead of the multiple pre-6.7 interfaces. Before 6.7 you had separate interfaces \u2014 `SynchronousPaymentHandlerInterface` (`pay`), `AsynchronousPaymentHandlerInterface` (`finalize`), `PreparedPaymentHandlerInterface` (`validate`, and previously `capture`), `RecurringPaymentHandlerInterface` (`recurring`), `RefundPaymentHandlerInterface` (`refund`) \u2014 each registered with its own tag (`shopware.payment.method.sync`, `.async`, `.prepared`, `.recurring`, `.refund`). To migrate: create a class extending `AbstractPaymentHandler` and implement `supports(PaymentHandlerType $type, string $paymentMethodId, Context $context): bool` plus the relevant methods: `pay(Request, PaymentTransactionStruct, Context, ?Struct): ?RedirectResponse` (always called during checkout; return `null` for synchronous flows or a `RedirectResponse` to trigger `finalize` afterward), `finalize(Request, PaymentTransactionStruct, Context): void` (called after redirect back from an external provider \u2014 this replaces your old `finalize` from `AsynchronousPaymentHandlerInterface`), `validate(Cart, RequestDataBag, SalesChannelContext): ?Struct` for prepared payments (its return is passed to `pay` as `$validateStruct`), `refund(...)` only invoked when `supports()` returns true for `PaymentHandlerType::REFUND`, and `recurring(...)` only invoked when `supports()` returns true for `PaymentHandlerType::RECURRING`. Register the handler with the single tag `shopware.payment.method` (replacing `shopware.payment.method.async`): `$services->set(MyCustomPaymentHandler::class)->tag('shopware.payment.method');`. Use `Shopware\\Core\\Checkout\\Order\\Aggregate\\OrderTransaction\\OrderTransactionStateHandler` to update transaction state (`->process(...)`, `->paid(...)`), and throw `PaymentException` (e.g. `PaymentException::asyncProcessInterrupted`, `::customerCanceled`) to fail the transaction. Register the payment method itself in the plugin lifecycle (install/activate/deactivate) via `payment_method.repository` with fields including `handlerIdentifier`, `name`, `description`, `pluginId`, `afterOrderEnabled`, and `technicalName` \u2014 never remove the payment method on uninstall, only set it inactive since orders may still reference it. Note: `technicalName` is required for plugin-provided payment methods from 6.7 onward and must be unique with a plugin-specific prefix; omitting it can prevent the plugin from being installed or activated (older versions allowed omitting it).", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:17-72"], "toolCallLog": [{"tool": "Bash", "args": "grep -rn \"payment\" -i .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | head -40"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-48": {"query": "After upgrading, my storefront JavaScript plugin no longer loads \u2014 how do I register it asynchronously with `PluginManager` and where does the compiled file have to be shipped?", "category": "dev", "option": "fs-wiki", "answer": "Write the plugin as a vanilla ES6 class extending `PluginBaseClass`, placed at `<plugin root>/src/Resources/app/storefront/src/<plugin-dir>/example-plugin.plugin.js`, e.g.: `const { PluginBaseClass } = window; export default class ExamplePlugin extends PluginBaseClass { init() { window.addEventListener('scroll', this.onScroll.bind(this)); } }` \u2014 `init()` runs on `DOMContentLoaded`. For a normal (synchronous) registration in `main.js` (auto-loaded from `<plugin root>/src/Resources/app/storefront/src`): `import ExamplePlugin from './example-plugin/example-plugin.plugin'; const PluginManager = window.PluginManager; PluginManager.register('ExamplePlugin', ExamplePlugin);` \u2014 optionally bound to a DOM selector as a third argument, e.g. `PluginManager.register('ExamplePlugin', ExamplePlugin, '[data-example-plugin]')`, with matching elements accessible as `this.el`. To register asynchronously instead, use a dynamic import rather than a top-level import: `PluginManager.register('ExamplePlugin', () => import('./example-plugin/example-plugin.plugin'), '[data-example-plugin]');`. An async-registered plugin is excluded from the main `storefront.js` bundle and is downloaded on demand only when its selector is present on the page \u2014 synchronously imported plugins are always bundled into `storefront.js` on every page. After changing the registration, rebuild the Storefront with `shopware-cli project storefront-build` (template setups) or `composer run build:js:storefront` (platform contribution setups). The compiled output must be written to and shipped at `<plugin root>/src/Resources/app/storefront/dist/storefront/js/<plugin-name>/<plugin-name>.js` \u2014 if this compiled file is missing or stale after the upgrade, the plugin will not load even if the source and registration code are correct.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md:18-80"], "toolCallLog": [{"tool": "Bash", "args": "grep -rn \"PluginManager|storefront plugin|storefront.*javascript|js plugin\" -i .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-49": {"query": "My storefront controller still uses the `@Route` and `@RouteScope` annotations from 6.4 \u2014 what is the attribute form in Shopware 6.7 and how are the routes wired?", "category": "dev", "option": "fs-wiki", "answer": "In Shopware 6.7 (as of 6.5, following the 6.4.11.0 replacement) both the `@Route` and `@RouteScope` doc-block annotations are replaced by PHP 8 attributes. Extend `StorefrontController` and declare the storefront route scope via `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]])]` on the class (or per-route instead of class-wide), and declare each action route with `#[Route(path: '/example', name: 'frontend.example.example', methods: ['GET'])]`, e.g.: `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]])] class ExampleController extends StorefrontController { #[Route(path: '/example', name: 'frontend.example.example', methods: ['GET'])] public function showExample(): Response { return $this->renderStorefront('@SwagBasicExample/storefront/page/example.html.twig', ['example' => 'Hello world']); } }`. Route names should use the `frontend`, `widgets`, `payment`, `api` or `store-api` prefix so the router recognizes it as a Storefront route. Wiring: register the controller as a public service in `services.php`, calling `setContainer`: `$services->set(ExampleController::class)->public()->call('setContainer', [service('service_container')]);`, and import the controller's routes in `routes.php`: `$routes->import('../../Storefront/Controller/*Controller.php', 'attribute');`. Since Shopware 6.7.2.0, a plugin can allow custom route names without one of the standard prefixes by adding a `storefront.router.allowed_routes` config entry (e.g. `storefront: router: allowed_routes: [swag.test.foo-bar]`) loaded from the plugin's `build()` method. Prior to 6.4.11.0 the route scope was set via the `@RouteScope` annotation; this was replaced by the `_routeScope` route default / `#[Route(defaults: ...)]` attribute and the annotation form is deprecated as of the 6.5 major version.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:18-83"], "toolCallLog": [{"tool": "Bash", "args": "grep -rn \"RouteScope|@Route|#[Route\" -i .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-50": {"query": "My `ScheduledTaskHandler` stopped running after the upgrade \u2014 how must a scheduled task and its handler be declared in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Both the task and its handler must be registered as separate services in the plugin's `services.php`: `$services->set(ExampleTask::class)->tag('shopware.scheduled.task'); $services->set(ExampleTaskHandler::class)->args([service('scheduled_task.repository'), service('logger')])->tag('messenger.message_handler');`. The task class must extend `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTask` and implement `getTaskName()` (a vendor-prefixed technical name, e.g. `swag.example_task`) and `getDefaultInterval()` (in seconds). The handler must extend `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTaskHandler`, be annotated `#[AsMessageHandler(handles: ExampleTask::class)]`, and implement `run()`. The task and handler are separate runtime roles \u2014 the task describes when work is due (tagged `shopware.scheduled.task`), the handler is the Messenger consumer that executes `run()` \u2014 and both must be wired even when generated together, so a missing/incorrect tag or missing `services.php` registration on either side after an upgrade would stop the handler from running. Since Shopware 6.7.13.0, a handler can additionally implement `DynamicallyScheduledTaskHandler` with `getNextExecutionTime(ScheduledTask $task, ScheduledTaskEntity $taskEntity): ?\\DateTimeInterface`, called after `run()` finishes, to control the next run time dynamically (returning `null` falls back to `nextExecutionTime + runInterval`, capped to now if in the past). To register and test without reinstalling the plugin: `bin/console scheduled-task:register`, `bin/console scheduled-task:run`, `bin/console messenger:consume`. Note the task's `status` must be `scheduled` in the `scheduled_task` table for `scheduled-task:run` to pick it up, unless using the admin worker \u2014 this is worth checking directly if the handler class itself looks correctly declared.", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md:20-70"], "toolCallLog": [{"tool": "Bash", "args": "grep -rn \"ScheduledTask|scheduled task\" -i .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-51": {"query": "Custom entities declared in `Resources/config/entities.xml` no longer work for my plugin in Shopware 6.7 \u2014 how do I define and register a DAL entity with PHP attributes instead?", "category": "dev", "option": "fs-wiki", "answer": "Since Shopware v6.6.3.0, entities can be registered via PHP attributes on a class extending `Entity`, instead of writing separate `EntityDefinition`, `EntityEntity`, and `EntityCollection` classes (the XML-based approach). Steps: 1) Define the entity by extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity` and adding `#[Entity('entity_name', collectionClass: ...)]`; `name` is required and unique, `collectionClass` defaults to `EntityCollection`. 2) Add a primary key with `#[PrimaryKey]` on a property (typically a `string` UUID). 3) Register the class in `services.php` with the `shopware.entity` tag, e.g. `$services->set(Examples\\ExampleEntity::class)->tag('shopware.entity');` \u2014 Shopware then auto-registers an `EntityDefinition` and `EntityRepository` named `example_entity.definition`/`example_entity.repository`. 4) Define fields with `#[Field(type: FieldType::...)]` (or a FQCN Field subclass since 6.6.9.0). 5) Use special attributes `AutoIncrement`, `ForeignKey(entity: '...')` where needed. 6) For JSON fields with custom (de)serialization use `#[Serialized(serializer: ...)]`. 7) For custom fields use `EntityCustomFieldsTrait` or the `#[CustomFields]` attribute on a nullable `?array` property. 8) Fields are hidden from the API by default; add `api: true` (or scope with `api: [AdminApiSource::class]`/`api: [SalesChannelApiSource::class]`) to expose them. 9) For translations, set `translated: true` on `#[Field]` (property must be nullable) to get an auto-created `TranslatedField`/`EntityTranslationDefinition`, and add `#[Translations]` on a nullable array property to load all translations. 10) Non-nullable properties are required by default; add `#[Required]` explicitly where needed (required for translated fields). 11) Associations use `OneToOne`, `OneToMany`, `ManyToOne`, `ManyToMany` attributes paired with `#[ForeignKey(entity: '...')]`. Gotchas: translated properties must be nullable; custom collection classes and direct Field-class references require 6.6.9.0+; no getters/setters or manual EntityTranslationDefinition/EntityCollection classes are needed with this approach.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md:15-61"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"entities.xml|DAL entity|Attribute|custom entity\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -30"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*entit*\""}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-52": {"query": "What must a plugin database migration class implement in Shopware 6.7, and where does the database cleanup on uninstall belong?", "category": "dev", "option": "fs-wiki", "answer": "Every migration extends `MigrationStep` and must implement `getCreationTimestamp(): int` (returns the timestamp embedded in the class name, e.g. `Migration1611740369ExampleDescription`) and `update(Connection $connection): void`, where all schema/data changes go. Migration files live by default in `<plugin root>/src/Migration`, named `Migration<timestamp><Description>.php`; a skeleton can be generated with `./bin/console database:create-migration -p SwagBasicExample --name ExampleDescription`, or a full migration from an entity definition with `./bin/console dal:migration:create --bundle=SwagBasicExample --entities=your_entity`. Migrations run automatically on plugin install/update, and can also be run manually with `./bin/console database:migrate SwagBasicExample --all`. There is no migration rollback; cleanup on removal (dropping tables etc.) belongs in the plugin's `uninstall` lifecycle method, not in the migration itself. `MigrationStep::updateDestructive()` exists but is only used by Shopware core for delayed, major-version destructive changes \u2014 plugin install/update never runs it.", "citations": ["platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md:18-77"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-53": {"query": "My theme config labels disappeared from the Theme Manager after 6.7 \u2014 how do I define `theme.json` config fields and where do their translations go now?", "category": "dev", "option": "fs-wiki", "answer": "`theme.json` lives at `<plugin root>/src/Resources/theme.json`; after changes run `bin/console theme:refresh` to apply them (it also updates `configInheritance` relationships). Config fields are defined under `config.fields.<field-key>` with parameters `type` (`color`, `text`, `number`, `fontFamily`, `media`, `checkbox`, `switch`, `url`), `editable`, `tab`, `block`, `section`, `custom` (raw data exposed via API only), `scss` (set `false` to skip SCSS variable injection), and `fullWidth`; these entries appear in the Administration theme manager and are merged with (inherit from) the Storefront config. As of Shopware 6.7.1.0, `label`/`helpText` are omitted from `theme.json` field objects entirely \u2014 field definitions differ before/after v6.7.1.0, and this is why labels disappeared. Translations now live in Administration snippet files, e.g. `<plugin root>/src/Resources/app/administration/src/app/snippet/de.json` (locale-specific `de-DE.json`/`en-GB.json` also supported), using the key structure `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.<fieldName>.label` (and `.helpText`), with tab/block/section-level label keys following the same nesting pattern, and unnamed tab/block/section segments using `default` in the key. This snippet-based approach for field translations was fully in effect since v6.8.0.0, with the `theme.json` `label`/`helpText` fields marked deprecated in favor of it.", "citations": ["platform/dev/6.7/guides/plugins/themes/configuration/theme-configuration.md:20-77"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"theme.json|Theme Manager|theme config\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/themes/configuration/theme-configuration.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-54": {"query": "How do I register a plugin cookie in the storefront cookie consent manager in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Register a listener for `Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent`, e.g. in services.php: `$services->set(CookieListener::class)->tag('kernel.event_listener', ['event' => 'Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent']);`. In the listener's `__invoke(CookieGroupCollectEvent $event)`, fetch a group from `$event->cookieGroupCollection` (e.g. via `CookieProvider::SNIPPET_NAME_COOKIE_GROUP_COMFORT_FEATURES`), get or create its `CookieEntryCollection`, and add a `CookieEntry`: `$cookieEntry = new CookieEntry('my-cookie-key'); $cookieEntry->name = 'cookie.myCookieName'; $cookieEntry->value = '1'; $cookieEntry->expiration = 30; $entries->add($cookieEntry);`. Cookie groups must not carry the `cookie`, `value`, `expiration`, or `isRequired` parameters \u2014 those belong only on individual `CookieEntry` objects. Since Shopware 6.7.3.0, cookies use the structured `CookieEntry`/`CookieGroup` objects instead of arrays; the older `CookieProviderInterface` with array-based definitions is deprecated but still works for backward compatibility. Since 6.7.3.0, cookie configurations carry a hash stored client-side in the `cookie-config-hash` cookie (keyed per language ID); any configuration change triggers a re-consent prompt.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md:19-62"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"cookie\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-55": {"query": "How do the breaking storefront accessibility changes reach my theme in Shopware 6.7, and what must an extension that overrides the affected Twig blocks do?", "category": "dev", "option": "fs-wiki", "answer": "Shopware rolls out storefront accessibility improvements (targeting WCAG 2.1 AA and BITV 2.0) gradually rather than in one big \"accessibility release\": breaking accessibility changes ship inside regular minor releases but stay inactive by default until the `ACCESSIBILITY_TWEAKS` feature flag is set in `.env` (`ACCESSIBILITY_TWEAKS=1`), the same mechanism used for major version flags like `V6_7_0_0`. With major version v6.7.0, these previously flag-gated breaking changes become the default. A change is typically implemented with both old and new markup guarded by `feature('ACCESSIBILITY_TWEAKS')` in Twig, e.g. old markup wraps `{% block component_list_items %}` inside a `<div>` while the new markup wraps `{% block component_list_items_inner %}` inside a `<ul>`. An extension overriding the old block should also implement the new inner block (e.g. `component_list_items_inner`) via `{% sw_extends %}` so it keeps working once the flag/version default flips \u2014 otherwise, if a breaking accessibility change ships without the extension adapting, the extension's markup assumption can render incorrect HTML once the core switches structure. Testing tooling referenced includes Google Lighthouse, AXE DevTools, WAVE, and manual keyboard/screen-reader checks (NVDA, VoiceOver). Accessibility improvements started with Shopware 6.6+, with further enhancements in 6.7+; Shopware 5 has no accessibility support.", "citations": ["platform/dev/6.7/guides/development/accessibility/storefront-accessibility.md:17-80"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"accessibility\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/accessibility/storefront-accessibility.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-56": {"query": "Header and footer are loaded through ESI sub-requests in Shopware 6.7, so page data is gone in my header template \u2014 how do I pass my own data into the header/footer now?", "category": "dev", "option": "fs-wiki", "answer": "The Storefront header and footer are loaded via ESI sub-requests and are no longer dependent on the current page's data by default. To pass current-page data into the ESI request, extend `base.html.twig` and override the `base_esi_header` (or `base_esi_footer`) block to merge extra parameters, e.g.: `{% sw_extends '@Storefront/storefront/base.html.twig' %} {% block base_esi_header %} {% set headerParameters = headerParameters|merge({ 'vendorPrefixPluginName': { 'activeRoute': activeRoute } }) %} {{ parent() }} {% endblock %}`. `headerParameters` (and `footerParameters`) are passed as query parameters to the header/footer ESI route, so they must be scalar values only. Read the value back in the header template by extending `layout/header.html.twig` and reading `headerParameters.vendorPrefixPluginName.activeRoute`. In plugins, `StorefrontRenderEvent` can also add data, guarded by checking the current route is `frontend.header` (the ESI sub-request route name), and setting `$event->setParameter('headerParameters', $headerParameters)`. It is also possible to load an entirely custom header/footer template (as core does for the checkout confirm page), but this overwrites customizations from every other extension, and any custom template must still receive the `header`/`footer` data it extends. For data unrelated to the current page, the guide points to the separate 'Add data to storefront page' guide instead.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-header-footer.md:17-75"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"ESI|sub-request|subrequest\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-header-footer.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-57": {"query": "B2B Suite support ends with 6.8 \u2014 how do I run the B2B Suite Migration to B2B Components and check that it finished?", "category": "dev", "option": "fs-wiki", "answer": "Run the migration with `bin/console b2b:migrate:commercial` to migrate everything, or restrict to specific components by naming their configurator technical name, e.g. `bin/console b2b:migrate:commercial quote_management shopping_list` (`employee_management` is always migrated first regardless of argument order since it's a prerequisite for all other components; overall order otherwise follows configurator priority). Batch size can be tuned with `bin/console b2b:migrate:commercial --batch-size=100`. `b2b:migrate:commercial` queues work and returns before the migration finishes, so check completion with `bin/console b2b:migrate:progress --watch` in a separate terminal, which shows columns Total, Valid, Newly, Migrated, Pending, Error, and status values `Complete`, `Pending`, `In progress`, `Complete with error`, `Has new records`. One gotcha: Budget Management leaves the Organization Unit empty on migrated budgets (requires B2B Commercial 7.6.0+).", "citations": ["platform/dev/6.7/products/extensions/b2b-suite-migration/execution/running-migration.md:16-53"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"B2B Components Migration|migration to b2b components|B2BMigration|b2b:migrate\" -i .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/extensions/b2b-suite -iname \"*migrat*\""}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/extensions/b2b-suite-migration/execution/running-migration.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-58": {"query": "My shopware.yaml still uses redis_url \u2014 how do I define the named Redis connections in Shopware 6.7 and which eviction policy does each one need?", "category": "dev", "option": "fs-wiki", "answer": "Since v6.6.8.0, Redis connections are configured as named connections under `shopware.redis.connections` in shopware.yaml, e.g.:\n```yaml\nshopware:\n    redis:\n        connections:\n            ephemeral:\n                dsn: 'redis://host1:port/dbindex'\n            persistent:\n                dsn: 'redis://host2:port/dbindex'\n```\nEnvironment variables can be used in the DSN (e.g. `dsn: '%env(REDIS_EPHEMERAL)%/1'`), and connection pooling can be enabled with the `persistent=1` DSN flag (e.g. `dsn: 'redis://host:port/dbindex?persistent=1'`). Shopware categorizes Redis-stored data into three categories, each needing a separate Redis instance/connection because a single Redis instance cannot apply different eviction policies to different databases: 1) Ephemeral data (HTTP cache, object cache) should use `volatile-lru`, with no persistence needed; 2) Durable but aging data (sessions) should use `allkeys-lru`, persisted via RDB/AOF; 3) Durable and critical data (cart, number range, lock store, increment) should also use `volatile-lru`. A cache Redis hitting its memory limit is normal for `volatile-lru`, but note it can only evict keys that have a TTL \u2014 Symfony's tag-aware cache adapter stores tag-index sets without a TTL, which can accumulate and starve eviction if never pruned.", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/redis.md:15-71"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"redis\" -i .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/infrastructure/redis.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-59": {"query": "After upgrading to Shopware 6.7 my Varnish cache is never invalidated \u2014 what changed in the reverse proxy configuration?", "category": "dev", "option": "fs-wiki", "answer": "Two config changes are likely at play. First, the config key moved: `storefront.reverse_proxy` (used up to 6.5.x) was renamed to `shopware.http_cache.reverse_proxy` starting with 6.6.0.0 \u2014 an old `storefront.reverse_proxy` block silently stops applying after upgrade and needs to be updated to the new key, e.g.:\n```yaml\nshopware:\n    http_cache:\n        reverse_proxy:\n            enabled: true\n            ban_method: \"BAN\"\n            hosts: [ \"http://varnish\" ]\n            max_parallel_invalidations: 3\n            use_varnish_xkey: true\n```\nSecond, the Varnish-with-Redis/LUA-based BAN invalidation approach is deprecated from v6.6.x and was fully removed in v6.7.0, in favor of `XKey`-based invalidation (`use_varnish_xkey: true`); a Varnish VCL still wired for the old Redis/LUA BAN method will no longer be invalidated correctly and must be updated to XKey (Redis clusters were never supported by the old approach anyway). Also note that `SYMFONY_TRUSTED_PROXIES` must be set so Symfony reads the real client IP (since 6.6, `TRUSTED_PROXIES` is no longer read automatically). Useful cache-clear commands: `bin/console cache:clear:http` (since 6.6.10) clears only the reverse proxy cache, and `bin/console cache:clear:all` (since 6.6.8) clears everything including the HTTP cache.", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/reverse-http-cache.md:18-88"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/infrastructure/reverse-http-cache.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-60": {"query": "Which transports do my Shopware message queue workers have to consume in production, and how do I turn off the admin worker?", "category": "dev", "option": "fs-wiki", "answer": "By default Shopware messages are stored in the database and worked off via the browser (the admin worker) while a user is logged into the Administration; this is not recommended for production since it only runs while someone is logged in and can cause high CPU load with multiple concurrent admin users. In production, run one or more CLI workers instead, e.g.: `bin/console messenger:consume async --time-limit=60 --memory-limit=128M` and `bin/console messenger:consume async low_priority` \u2014 consuming at least the `async` and `low_priority` transports. Also set up a CLI worker for the failed-message transport, otherwise failed messages are never processed; failed messages are otherwise retried automatically 3 times, then deleted, via the Doctrine-backed failed transport (`MESSENGER_TRANSPORT_FAILURE_DSN`). To disable the admin worker once CLI workers are running, set in `config/packages/shopware.yaml`:\n```yaml\nshopware:\n    admin_worker:\n        enable_admin_worker: false\n```\nIf the admin worker is still used, it can be configured with `poll_interval` and a `transports` list, e.g. `transports: [\"async\", \"low_priority\"]`. Note that cron jobs won't cap the maximum number of workers the way supervisor/systemd can, so overlapping long-running messages risk starting an unwanted number of workers.", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/message-queue.md:15-94"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"messenger.*transport|admin worker|message queue\" -i .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/infrastructure/message-queue.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-61": {"query": "After the upgrade my Elasticsearch index has to be rebuilt \u2014 where do I set the shard and replica counts and which reindex command do I run?", "category": "dev", "option": "fs-wiki", "answer": "Set shard/replica counts by overriding the default (3/3 since 6.4.12.0) in `config/packages/elasticsearch.yml`, e.g. `elasticsearch.index_settings.number_of_shards: 1` and `number_of_replicas: 0`. To rebuild the index: first clear cache with `bin/console cache:clear`, then run `bin/console es:index` for basic indexing, or better `bin/console dal:refresh:index --use-queue` to reindex the whole shop (ES, SEO URLs, product index, etc.) \u2014 always with `--use-queue`. Some setups also need `bin/console es:create:alias` afterward. Indexing writes to the message queue (`enqueue` table; failures go to `dead_messages`), so run `bin/console messenger:consume` (up to ~3 workers is typical) to process it.", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md:26-58"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "grep -rn -i \"elasticsearch\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-62": {"query": "I changed a setting in `.env` on a deployed 6.7 shop but it still behaves the old way \u2014 what takes precedence between `.env`, `.env.local` and the real environment variables, and which settings does Shopware not read from `.env` at all?", "category": "dev", "option": "fs-wiki", "answer": "Standard Symfony/Shopware precedence for dotenv files is: real server/container environment variables win over `.env.local`, which wins over `.env` \u2014 so if a real env var is set in the deployment platform it overrides anything in the `.env` files [from memory]. As for what is not read from `.env` at all: the wiki's configuration overview lists five separate configuration mechanisms in Shopware, and 'database-backed system configuration' (shop settings changeable in the Administration, Admin API, or by app/plugin code) is stored in and read from the database, not from `.env` \u2014 environment variables are reserved for 'secrets, infrastructure values, deployment-specific values' living in `.env`, `.env.local`, or the server/container environment. On top of that, 'static system configuration' set under `shopware.system_config` in `config/packages/*.yaml` is an overlay that always wins over the database-loaded value for the same key, and once overwritten this way the setting can no longer be changed in the Administration \u2014 so if such a static override exists, changing `.env` (or even the database) won't change the effective behavior since the `config/packages` value takes precedence.", "citations": ["platform/dev/6.7/guides/hosting/configurations/shopware/_index.md:20-34", "platform/dev/6.7/guides/hosting/configurations/shopware/static-system-config.md:23-26"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"env.local|precedence|system config|System Config\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/configurations/shopware/static-system-config.md"}, {"tool": "Bash", "args": "grep -n -i \"env.local|precedence|real environment|shell environment\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/installation/advanced-options.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/configurations/shopware/_index.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/resources/references/config-reference/_index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/configurations/shopware/_index.md"}, {"tool": "Bash", "args": "grep -n -i \"env.local|.env \" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/installation/legacy-setups/symfony-cli-setup.md"}], "notFoundClaim": false, "memoryClaims": ["Standard Symfony/Shopware precedence for dotenv files is: real server/container environment variables win over `.env.local`, which wins over `.env` \u2014 so if a real env var is set in the deployment platform it overrides anything in the `.env` files [from memory]."], "sourceVerdict": "partial"}, "dev-63": {"query": "I deployed a plugin update to a 6.7 staging shop and my new migration never ran \u2014 which `bin/console` command applies the pending migrations of that one plugin, and what do I have to pass to it?", "category": "dev", "option": "fs-wiki", "answer": "Run `./bin/console database:migrate <PluginName> --all`, e.g. `./bin/console database:migrate SwagBasicExample --all` \u2014 pass the plugin's technical name and `--all` to apply every pending migration for that one plugin. Normally migrations run automatically via each migration's `update()` method on plugin install/update, so a manual run is only needed if that didn't happen or the plugin overrode `$updateContext->setAutoMigrate(false)`, in which case the plugin itself must drive the `MigrationCollection` (from `InstallContext`/`UpdateContext`/`ActivateContext`), e.g. via `$migrationCollection->migrateInPlace(<timestamp>)`. Migration files live in `<plugin root>/src/Migration`, named `Migration<timestamp><Description>.php`, and each extends `MigrationStep` with `getCreationTimestamp()` and `update(Connection $connection)`; there is no rollback, and a migration that already ran must never be modified.", "citations": ["platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md:26-77"], "toolCallLog": [{"tool": "Bash", "args": "grep -rn -i \"plugin.*migration|migration.*plugin\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-64": {"query": "How do I get an Admin API OAuth token \u2014 with client_credentials for an integration, or the password grant for local testing \u2014 and how long is each token valid?", "category": "dev", "option": "fs-wiki", "answer": "For an integration, create one in Administration under Settings \u2192 System \u2192 Integrations (enable the 'Administrator' toggle), which gives you an access key ID (OAuth `client_id`) and secret access key (`client_secret`). Then `POST /api/oauth/token` with `{\"grant_type\": \"client_credentials\", \"client_id\": \"...\", \"client_secret\": \"...\"}`; the response contains `token_type`, `expires_in`, and `access_token`. For local-only testing there is a password-grant shortcut: `POST /api/oauth/token` with `grant_type: password`, `client_id: administration`, `scopes: write`, and the default Administration `username`/`password`; the response additionally contains a `refresh_token`. The wiki notes `client_credentials` remains the default approach for real integrations and the password grant should not replace it. On validity: OAuth bearer tokens obtained from the Admin API OAuth token endpoint expire by default after 10 minutes (this is stated in the context of MCP server auth but refers to the same Admin API OAuth token endpoint); the exact figure for a given token is always returned in the `expires_in` field of the token response.", "citations": ["platform/dev/6.7/guides/development/integrations-api/_index.md:25-47", "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md:27-45", "platform/dev/6.7/products/tools/mcp-server/getting-started.md:39-39"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"oauth|client_credentials|password grant|access token\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/integrations-api/_index.md"}, {"tool": "Bash", "args": "grep -rn -i \"expires_in|token.*valid|10 minutes|600 seconds|access_token expir\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/tools/mcp-server/getting-started.md, offset=30, limit=15"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-65": {"query": "What can I put in the JSON body of `POST /api/search/{entity}` for filtering, associations, sorting, aggregations and getting an exact total count?", "category": "dev", "option": "fs-wiki", "answer": "The search-criteria JSON body accepted by `POST /api/search/{entity}` takes the same arguments as a DAL criteria: `associations` to load related data like a SQL join (nested criteria \u2014 sort/filter/limit \u2014 can be applied per association); `includes` to restrict returned fields per type, keyed by each response's `apiAlias`; `ids` to fetch a list of records directly by ID; `filter` to filter results and aggregations (same filter types as the DAL, and nested-field filters such as `transactions.stateMachineState.technicalName` require the association to be requested first); `post-filter`, which filters like `filter` but does not affect aggregations; `query` for a weighted search (each sub-query has a `score`, summed into `extensions.search._score` on each result) and `term` for a text search across `SearchRanking`-flagged fields \u2014 the two should not be combined; `sort` as one or more `{field, order}` entries, supporting `naturalSorting: true` and a `type: \"count\"` sort (since 6.4.12.0); `aggregations` for metrics or facet-like breakdowns (same aggregation types as the DAL); `grouping` to group results by one or more fields; and `page`/`limit` for pagination. For an exact total record count, set `total-count-mode: 1`, which runs `SQL_CALC_FOUND_ROWS` for exact pagination \u2014 this is performance-intensive so the default `total-count-mode: 0` (no total, best performance) should be used unless exact pagination is required; `total-count-mode: 2` only signals whether a next page exists (useful for infinite scroll).", "citations": ["platform/dev/6.7/guides/development/integrations-api/search-criteria.md:26-65"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"search-criteria|total.count|aggregation\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/integrations-api/search-criteria.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-66": {"query": "Which request headers change Admin API behaviour for language, entity version, parent-child inheritance and skipping flow triggers during a bulk import?", "category": "dev", "option": "fs-wiki", "answer": "`sw-language-id` returns entities in the given language ID instead of the system language (e.g. `sw-language-id: be01bd336c204f20ab86eab45bbdbe45`). `sw-version-id` tells the API which entity version to return (e.g. `sw-version-id: 0fa91ce3e96a4bc2be4bd9ce752c3425`). `sw-inheritance` makes the API consider parent-child inheritance, such as product variants (e.g. `sw-inheritance: 1`). `sw-skip-trigger-flow` skips flow triggers (e.g. 'send email on customer creation') during bulk imports via the sync API (e.g. `sw-skip-trigger-flow: 1`).", "citations": ["platform/dev/6.7/guides/development/integrations-api/request-headers.md:16-34"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/integrations-api/request-headers.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-67": {"query": "What does a minimal app folder and `manifest.xml` need to contain, and which console commands install and activate the app on my local Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Create the app under `custom/apps/<TechnicalName>/manifest.xml`, with the technical name in UpperCamelCase (e.g. `MyExampleApp`) \u2014 the folder name must match `<meta><name>` in the manifest. The `manifest.xml`'s `<meta>` block needs `name`, `label`, `description`, `author`, `copyright`, `version`, `icon`, and `license`; `<author>` and `<copyright>` are required or `bin/console app:refresh` will fail. To install and activate: run `bin/console app:refresh` to register the app, then `bin/console app:install --activate MyExampleApp` (omit `--activate` to activate later via Extensions \u2192 My Extensions \u2192 Apps or `bin/console app:activate MyExampleApp`). Use `bin/console app:list` to inspect installed apps, clear caches afterward with `bin/console cache:clear` (or `cache:clear:http`/`cache:clear:all`), and use `--no-validate` with `app:install` to skip validation while debugging, or `bin/console app:validate` to find configuration issues. These commands must be run from inside the PHP container at the project root, and installation uses the app's technical name, not a filesystem path.", "citations": ["platform/dev/6.7/guides/plugins/apps/app-base-guide.md:19-42"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"manifest.xml|app-base-guide|app:install|app:activate\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/apps/app-base-guide.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-68": {"query": "How does the registration handshake between Shopware and my app backend work \u2014 shop id, proof, shop secret and the confirmation call?", "category": "dev", "option": "fs-wiki", "answer": "Registration is a `GET` request to the URL declared in the manifest, carrying query parameters `shop-id`, `shop-url`, `timestamp`, and headers `shopware-app-signature` (HMAC-SHA256 of the query string, signed with the app's `app-secret`), `sw-version` (since 6.4.1.0), and, on re-registration, `shopware-shop-signature` (signed with the shop's current `shop-secret`). On success the app backend responds with a `proof` (SHA-256 HMAC of `shopId . shopUrl . appName`, using `app-secret`), a generated `shop-secret` (64-255 characters), and a `confirmation_url`, e.g. `{ \"proof\": \"...\", \"secret\": \"random secret string\", \"confirmation_url\": \"https://my.example.com/registration/confirm\" }`. If a setup precondition fails, the app responds with `{\"error\": \"...\"}` instead. If Shopware finds the proof matches, it sends a `POST` to `confirmation_url` with `apiKey`, `secretKey`, `timestamp`, `shopUrl`, `shopId` in the body, signed via the `shopware-shop-signature` header (HMAC-SHA256 of the body using `shop-secret`); the app then uses `apiKey`/`secretKey` as the Admin API OAuth `client_id`/`client_secret`. On re-registration, Shopware also sends a `shopware-shop-signature-previous` header signed with the previous `shop-secret`, so the app can validate both and accept the old secret in parallel for a short grace period (e.g. 1 minute) to handle secret rotation. Note: `app-secret` must never be published (it stays with the Shopware Account), and registration/confirmation requests time out after 5 seconds.", "citations": ["platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md:27-41", "platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md:90-92"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-69": {"query": "How does an app subscribe to an event like `product.written`, what does Shopware POST to the webhook URL, and how do I verify the request is genuine?", "category": "dev", "option": "fs-wiki", "answer": "Declare the webhook in the manifest's `<webhooks>` section, naming the webhook and giving the `event` it listens to, e.g. `product.written`. Shopware then POSTs a payload shaped like: `{ \"data\": { \"payload\": [ { \"entity\": \"...\", \"operation\": \"...\", \"primaryKey\": \"...\", \"updatedFields\": [] } ], \"event\": \"...\" }, \"source\": { \"url\": \"...\", \"appVersion\": \"...\", \"shopId\": \"...\", \"eventId\": \"...\" }, \"timestamp\": 0 }`. `source.url`/`appVersion`/`shopId`/`eventId` identify the sending shop instance (`eventId` stays stable across retries, since 6.4.11.0), and `timestamp` (since 6.4.1.0) marks when the webhook was handled, useful for rejecting stale/replayed requests. The request also carries `sw-version` (since 6.4.1.0) and `sw-context-language`/`sw-user-language` (since 6.4.5.0) headers. To verify authenticity, check the `shopware-shop-signature` header: a SHA256 HMAC of the request body, signed with the secret established during app registration \u2014 the same mechanism used for the registration confirmation request. Note that `entity.written` payloads (like `product.written`) only carry the changed record's `primaryKey`, not the full entity, so the app must fetch the entity/associations itself via the shop API; a webhook can also be restricted to the live version with `onlyLiveVersion` in the manifest (since 6.5.7.0), though this is only checked for `HookableEntityWrittenEvent` instances.", "citations": ["platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md:18-47"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-70": {"query": "How do I implement a payment method in an app with `pay-url` and `finalize-url`, and what must the app server return in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Define the payment method in the app's manifest with `pay-url` and, for an asynchronous flow, `finalize-url` \u2014 the presence of `finalize-url` is what distinguishes an asynchronous method from a synchronous one, and omitting `pay-url` leaves the transaction open with no app communication. Synchronous: if only `pay-url` is set, Shopware calls it and expects a JSON response with a `status` (and optional `message` on failure), e.g. `{ \"status\": \"authorize\", \"message\": \"optional failure reason\" }`. Asynchronous: Shopware `POST`s to `pay-url` with `order`, `orderTransaction`, and a `returnUrl`; the app responds with a `redirectUrl` so the customer can be sent to the payment provider; after the provider redirects the customer back, Shopware `POST`s to `finalize-url` with `orderTransaction` plus the provider's query parameters, and the app again responds with `status`/`message`. Valid payment `status` values include `open`, `paid`, `cancelled`, `refunded`, `failed`, `authorize`, `unconfirmed`, `in_progress`, `reminded`, `chargeback`. Since 6.4.9.0 apps can also add a `validate` prepared-payment call (receiving `cart`, `requestData`, `salesChannelContext`, optionally returning a `preOrderPayment` object forwarded to the following `pay` call), and since 6.4.12.0 a `refund` call (receiving `order` and `refund` with `amount`/`capture`/optional `reason`/`positions`, responding with a `status` from `open`, `in_progress`, `cancelled`, `failed`, `completed`). All requests/responses are signed \u2014 the App PHP SDK resolves the shop, assembles the stage-specific context (`assemblePaymentPay`, `assemblePaymentFinalize`, etc.) and signs the response via `PaymentResponse`/`RefundResponse` (e.g. `$signer->signResponse(PaymentResponse::paid(), $shop)`); the Symfony App Bundle instead type-hints action classes like `PaymentPayAction`/`PaymentFinalizeAction` directly. Since 6.7.0.0, the app server must respond with a payment state whenever it intends to change the transaction state, and the manifest payment-method identifier must never change after release or Shopware will create a new payment method instead of reusing it.", "citations": ["platform/dev/6.7/guides/plugins/apps/checkout/payment.md:17-66"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"pay-url|finalize-url|payment method|app payment\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/apps/checkout/payment.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-71": {"query": "How does an app define its own custom entities in Shopware 6.7 and read them back through the API?", "category": "dev", "option": "fs-wiki", "answer": "An app defines custom entities by registering them in the app's `Resources/entities.xml` file, validated against the `entity-1.0.xsd` schema. Each `<entity>` element (e.g. `custom_entity_bundle`) declares `<fields>` such as `string`, `price`, and relation fields like `many-to-many`, each of which can be marked `store-api-aware=\"true\"` to expose them via the Store API. Registered entities automatically get a repository service, reachable in App Scripts via `services.repository.search('custom_entity_bundle', criteria)`, and via the Admin API at `POST /api/search/custom-entity-bundle` (the entity name with underscores becomes hyphens in the API route). To let a custom field reference a custom entity ('Entity Select'), add `custom-fields-aware=\"true\"` and `label-property=\"name\"` to the `<entity>` element (the label-property field must be a string field); without a snippet the entity shows as `custom_entity_bundle.label`, so a snippet should be added under `Resources/app/administration/snippet/en-GB.json`. Since Shopware 6.4.15.0, entities may use the `ce_` shorthand prefix (e.g. `ce_bundle`) to avoid database name-length restrictions, and this prefix must then be used consistently in the repository and API calls (e.g. `POST /api/search/ce_blog`). Custom entities with custom-fields support require Shopware 6.5.1.0+, custom entities cannot be renamed once created (renaming deletes existing data), and associations referencing core tables still require the corresponding manifest permissions.", "citations": ["platform/dev/6.7/guides/plugins/apps/custom-data/custom-entities.md:19-54"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rn -i \"custom entit\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -30"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/apps/custom-data/custom-entities.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-01": {"query": "How do I create a product with variants and configure its visibility per sales channel, and why might it not show up in the storefront?", "category": "func", "option": "fs-wiki", "answer": "Products are created and edited in the Administration under Catalogues > Products; before the first save you must fill in Title, Product number, Tax rate, Price (gross and net), and Stock, after which additional tabs (Specifications, Extended Prices, Variants, Layout, SEO, Cross-Selling) become available. To create variants, open the Variants tab and use the Variant Generator: pick the properties/options that should generate variants, optionally define price surcharges per option, exclude specific combinations under Value exclusion, then click 'Generate variants'; the product list display mode can be set to show a single main variant or to fan out properties in the listing. New products get a default sales-channel assignment and default visibility configured under Settings > Commerce > Products ('Default Sales Channel': choose which sales channels new products are automatically assigned to, and set their default Visibility for those channels); this default can then be overridden per product. A product commonly fails to appear in the storefront for one of several reasons: it was not assigned/made visible for the sales channel being viewed, it is inactive, its stock reached zero and 'Hide products after clearance' is enabled for that sales channel, or (if the Dynamic Access extension is installed) a Rule Builder rule assigned to the product under Catalogues > Products > General tab > Visibility & structure hides it from certain customer groups \u2014 and if mutually exclusive rules are selected the product can end up never visible to anyone; note that hiding a category does not hide the products inside it from search unless the same rule is also applied to the products themselves, and individual variants are only fully hidden once all their variant combinations become unavailable due to rules.", "citations": ["platform/func/catalogues/products.md:20-41", "platform/func/settings/productlist.md:32-44", "platform/func/extensions/dynamiccontent.md:16-37"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"variant|sales channel|visibility\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md | head -40"}, {"tool": "Read", "args": "platform/func/catalogues/products.md"}, {"tool": "Bash", "args": "grep -n -i \"visib\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md"}, {"tool": "Bash", "args": "grep -rn -i \"visibilit\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/ | grep -v index.md"}, {"tool": "Read", "args": "platform/func/extensions/dynamiccontent.md"}, {"tool": "Bash", "args": "grep -n -i \"sales channel\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/productlist.md"}, {"tool": "Read", "args": "platform/func/settings/productlist.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-02": {"query": "How do Rule Builder conditions work for shipping and payment methods?", "category": "func", "option": "fs-wiki", "answer": "The Rule Builder (Settings > Automation > Rule Builder) lets merchants define reusable rules \u2014 combinations of conditions and operators \u2014 that control the availability of payment/shipping methods (plus promotions, prices, flows, and visibility). A rule consists of General information (Name, Description, Priority, Type, Tags) plus Conditions, which are combined with AND (all must match) or OR (any must match); switching between AND/OR automatically creates subconditions. Priority matters: a higher priority runs sooner, which is important when multiple shipping/payment rules could otherwise conflict. The condition catalog includes General conditions (Sales Channel, Currency, Date range, Day of the week, Time range, Language, etc.), Orders, Customers, Items in shopping cart, and more, each paired with an operator such as Is equal to, Is one of, Is not one of, Is greater than, etc. Once created, a rule is attached to a shipping or payment method's 'Availability rule' field so the method only shows in checkout when the rule's conditions are met, and the rule's read-only Assignments tab lists everywhere it's used (shipping/payment availability, shipping cost calculation, promotions, flows, etc.). Worked examples include: routing tagged products to a specific carrier via `Position with tag | All | Is one of | <tag>` as the shipping method's availability rule (with a blocking `Is none of` rule on other methods); enabling cash-on-delivery shipping only when `Applied payment method | Is one of | <payment method name>`; restricting shipping by `Shipping address: Zip code | Alphanumeric | Is one of | <postcode>`; and gating a payment method by `Customer group | Is one of | <group>`, optionally AND-linked with a minimum basket goods price. Priorities matter here too \u2014 e.g. a 'special shipping' rule must outrank a 'disable default shipping' rule or the wrong method gets selected \u2014 and the cache should be cleared after changes before testing in the storefront.", "citations": ["platform/func/settings/rules.md:32-50", "platform/func/tutorials-and-faq/rule-builder-example-rules.md:21-41"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"rule builder|rules.md|shipping|payment\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md | grep -i rule"}, {"tool": "Rea
