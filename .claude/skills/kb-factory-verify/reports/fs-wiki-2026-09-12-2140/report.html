n::class, true) flagged with CascadeDelete(), define the linked ExampleExtensionDefinition (with an FkField, a ReferenceVersionField for versioned entities, and the inverse OneToOneAssociationField), register that definition with shopware.entity.definition, and add the new table via a migration; you can then write via $this->productRepository->upsert([['id' => '<product id>', 'exampleExtension' => ['customString' => 'foo bar']]], $context). If no database column is needed, subscribe to the entity's loaded event (e.g. ProductEvents::PRODUCT_LOADED_EVENT) and call $productEntity->addExtension('custom_string', new ArrayEntity([...])) \u2014 the extension value must be a struct, not a scalar. Since Shopware 6.6.10.0, a BulkEntityExtension subclass (tagged shopware.bulk.entity.extension) can extend multiple entities at once via a collect() generator. A key gotcha: setting autoload to true on both the EntityExtension and the EntityDefinition side causes recursion/out-of-memory errors \u2014 only set it true on the EntityExtension side.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md:19-72"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -n -i \"association\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-02": {"query": "What's the plugin lifecycle in Shopware \u2014 install, activate, uninstall \u2014 and how does `keepUserData` work?", "category": "dev", "option": "fs-wiki", "answer": "A Shopware plugin's base class (Shopware\\Core\\Framework\\Plugin, which extends Shopware\\Core\\Framework\\Bundle and Symfony's Bundle) implements lifecycle methods, all in <plugin root>/src/SwagBasicExample.php with access to $this->container: install(InstallContext $installContext) registers entities (e.g. payment methods), creates initial data, and prepares requirements \u2014 InstallContext exposes plugin/Shopware versions, system Context, plugin migrations, and auto-migration control (isAutoMigrate/setAutoMigrate). activate(ActivateContext $context) activates entities created in install() or creates data that requires the plugin to be active. deactivate(DeactivateContext $context) deactivates entities from install() or removes entities that cannot be safely left active. update(UpdateContext $context) handles non-database adjustments, feature toggles, or logic depending on old/new plugin versions (database changes belong in plugin migrations instead); UpdateContext adds getUpdatePluginVersion() and getCurrentPluginVersion(). postInstall(InstallContext $context) and postUpdate(UpdateContext $context) run after a successful install/update completes. uninstall(UninstallContext $context) removes or cleans up plugin data; UninstallContext adds keepUserData(). The recommended pattern is: if ($uninstallContext->keepUserData()) { return; } \u2014 otherwise remove or deactivate the data created by the plugin. If keepUserData() returns true, persistent plugin data must not be deleted. A gotcha noted in the docs: do not blindly delete entities in uninstall() \u2014 e.g. a payment method used on real orders should be deactivated, not removed, to avoid leaving orders in a broken state \u2014 and avoid creating fully active business data in install() since the plugin is not yet enabled.", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md:20-61"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"lifecycle|keepUserData\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*lifecycle*\" | grep -v app"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-03": {"query": "How do I add a custom Store API route for a headless storefront?", "category": "dev", "option": "fs-wiki", "answer": "Follow Shopware's decoratable-route pattern. First, define an abstract route class with a getDecorated() method and a load(Criteria, SalesChannelContext): ExampleRouteResponse method. Second, implement the concrete route class, tagged with the #[Route(...)] attribute using PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID], and a route such as #[Route(path: '/store-api/example', name: 'store-api.example.search', methods: ['GET','POST'], defaults: ['_entity' => 'swag_example'])] on load(); getDecorated() throws DecorationPatternException when nothing decorates it yet, and all fields returned via the API need the ApiAware flag in their definition. Third, register the route class as a service (constructor-injecting the repository, e.g. swag_example.repository). Fourth, create an ExampleRouteResponse extends StoreApiResponse class exposing the search result via a getter. Fifth, import the route via <plugin root>/src/Resources/config/routes.php using $routes->import('../../Core/**/*Route.php', 'attribute'); verify discovery with bin/console debug:router store-api.example.search (this only confirms discovery, not that the service can be constructed or a request succeeds). Optionally document the route by adding a JSON OpenAPI file under <plugin root>/src/Resources/Schema/StoreApi/ so the internal OpenApi3Generator picks it up (check it at /store-api/_info/stoplightio.html), and to expose the route to the Storefront (for a headless/decoupled frontend you'd instead call it directly), add a controller extending StorefrontController scoped with StorefrontRouteScope::ID that calls the route, importing it via $routes->import('../../Storefront/**/*Controller.php', 'attribute'); request it client-side with the existing http-client service or fetch. A gotcha: the service definition connects the route class to the DI container, but the routes.php import is a separate discovery step \u2014 a route class can be a registered service without being a reachable endpoint until its attributes are imported.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md:19-57"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"store api route|custom store api|store-api\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-04": {"query": "How do I create a custom CMS element for Shopping Experiences?", "category": "dev", "option": "fs-wiki", "answer": "A CMS element is the smallest content primitive (text, image, video, product listing, etc.) placed inside a block's slot; elements have no knowledge of their context and are always rendered inside a parent block's slot. Use the recommended Administration directory layout: src/Resources/app/administration/src/module/sw-cms/elements/<name>/ containing index.js, component/index.js+.html.twig+.scss, config/index.js+.html.twig, and preview/index.js+.html.twig+.scss. Steps: (1) import the element folder in main.js; (2) register it via Shopware.Service('cmsService').registerCmsElement({...}) with keys name, label, component, configComponent, previewComponent, defaultConfig (a map of config key to { source, value }), and optionally hidden/removable; (3) create the preview component (the thumbnail shown in the element picker); (4) create the main component, mixing in cms-element and calling this.initElementConfig('<name>') in created(), providing fallback content so the element isn't invisible in the editor when unconfigured; (5) create the config component (also mixing in cms-element and calling initElementConfig), providing form fields for each defaultConfig key, preferably using Shopware Meteor components; (6) for inheritance-aware fields (content inherited from the base layout vs. overridden per page), wrap them with sw-cms-inherit-wrapper, passing field and element; (7) for the Storefront, add a Twig template at src/Resources/views/storefront/element/cms-element-<name>.html.twig \u2014 the 'cms-element-' filename prefix is required. A gotcha: the Storefront template file name must include the cms-element- prefix exactly, and the Storefront cache should be cleared after adding new element templates.", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/cms/add-cms-element.md:18-58"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"cms element|cms block|shopping experiences\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/content/cms/add-cms-element.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-05": {"query": "How does theme inheritance work in Shopware \u2014 theme.json and SCSS overrides?", "category": "dev", "option": "fs-wiki", "answer": "Theme inheritance lets a new theme extend an existing, installed theme, reusing its templates, styles, scripts, assets, and config while adding its own changes \u2014 useful for a variant of an already-used theme (e.g. a dark version, per-sales-channel differences, or a customized store-bought theme) without duplicating or modifying the original theme's code. You configure it by editing theme.json in <plugin root>/src/Resources of the extending theme and inserting the base theme's technical name into each relevant section, before the extending theme's own alias, for example: views: [\"@Storefront\", \"@Plugins\", \"@SwagBasicExampleTheme\", \"@SwagBasicExampleThemeExtend\"], style: [\"app/storefront/src/scss/overrides.scss\", \"@SwagBasicExampleTheme\", \"app/storefront/src/scss/base.scss\"], script: [\"@Storefront\", \"@SwagBasicExampleTheme\", \"app/storefront/dist/storefront/js/.../file.js\"], asset: [\"@Storefront\", \"@SwagBasicExampleTheme\", \"app/storefront/src/assets\"], configInheritance: [\"@Storefront\", \"@SwagBasicExampleTheme\"]. For views, rendering order is Storefront base, then plugin extensions, then the base theme, then the current theme. For script, the same layered order applies: Storefront JS, then the base theme's JS, then the current theme's JS. For style, overrides.scss stays first because it can affect SCSS variables like $border-radius. For asset, you must add the base theme explicitly (e.g. @SwagBasicExampleTheme) to reuse its assets. For configInheritance, the last listed theme that differs from the current one becomes the parent theme for config values, and the Storefront theme config is always inherited even without an explicit configInheritance entry.", "citations": ["platform/dev/6.7/guides/plugins/themes/inheritance/add-theme-inheritance.md:20-47"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"theme inheritance|theme.json|theme override\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/themes/inheritance/add-theme-inheritance.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-06": {"query": "How do I add a custom Flow Builder action?", "category": "dev", "option": "fs-wiki", "answer": "Build a custom PHP FlowAction and expose it in the Administration. Steps: (1) define an Aware interface for the data your action needs, extending Shopware\\Core\\Framework\\Event\\FlowEventAware and marked #[IsFlowEventAware], e.g. interface TagAware extends FlowEventAware with constants TAG/TAG_ID and a getTag() method; (2) implement the action by extending Shopware\\Core\\Content\\Flow\\Dispatching\\Action\\FlowAction, implementing static getName() (e.g. 'action.create.tag'), requirements() (returning the Aware interfaces this action needs, e.g. [TagAware::class]), and handleFlow(StorableFlow $flow) which reads config via $flow->getConfig(), reads Aware-stored data via $flow->getStore($key), and reads event/additional data via $flow->getData($key), then performs the action (e.g. via a repository); (3) register the action as a service tagged flow.action with a priority and key, e.g. ->tag('flow.action', ['priority' => 600, 'key' => 'action.create.tag']) \u2014 this tag makes the action appear in the /api/_info/flow-actions.json response, and priority determines its order; (4) requirements() controls the action's scope: an empty array makes it available for every trigger, a list of Aware interfaces (e.g. [OrderAware::class, CustomerAware::class]) restricts it to matching events, or you can define a brand-new event implementing your custom Aware and register it via a BusinessEventCollectorSubscriber listening on BusinessEventCollectorEvent::NAME; (5) in the Administration, define an action constant and a GROUP, add snippet labels, and override sw-flow-sequence-action to map the action name to a modal name (or to onSaveActionSuccess directly if no modal is needed), then import the override and any new component into main.js. Gotchas: the action's group defaults to 'general' if GROUP is not defined (existing groups include general, tag, customer, order); and a subscriber adding a new trigger event must run with sufficiently high priority to register before other BusinessEventCollectorEvent subscribers, or awareness/actions may be missing.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-action.md:20-93"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"flow builder action|flow action|custom flow\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-action.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-07": {"query": "My plugin needs to store its own data in a new table \u2014 how do I define a custom DAL entity with its definition, entity and collection class so I get a repository for it?", "category": "dev", "option": "fs-wiki", "answer": "Create the table via a plugin migration (prefixing table names, e.g. swag_example). Add an EntityDefinition class implementing getEntityName() (returns the table name, which also becomes the '<name>.repository' service id in the DI container) and defineFields(), e.g.: class ExampleDefinition extends EntityDefinition { public const ENTITY_NAME = 'swag_example'; public function getEntityName(): string { return self::ENTITY_NAME; } protected function defineFields(): FieldCollection { return new FieldCollection([ (new IdField('id','id'))->addFlags(new Required(), new PrimaryKey()), new StringField('name','name'), new StringField('description','description'), new BoolField('active','active') ]); } } \u2014 created_at/updated_at columns don't need explicit fields. Register the definition with the shopware.entity.definition tag and an entity attribute matching the entity name: $services->set(ExampleDefinition::class)->tag('shopware.entity.definition', ['entity' => 'swag_example']);. Add a custom Entity class (extends Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity, uses EntityIdTrait, one protected property plus getter/setter per field) and wire it via getEntityClass(). Add a custom EntityCollection (extends EntityCollection, overrides getExpectedClass()) and wire it via getCollectionClass(); without these, generic ArrayEntity/EntityCollection instances are used instead. Gotchas: entity class properties must be at least protected (never readonly) or the DAL cannot set values (applies to any class extending the generic Struct class); the storageName in field classes is snake_case while propertyName is lowerCamelCase; and getEntityName()'s return value doubles as both the database table name and the repository service id, so they must match exactly.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md:20-71"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"custom entity|entity definition|adding own|create custom entity|add custom complex data\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-08": {"query": "In a plugin service, what is the Shopware 6 equivalent of Doctrine's `findBy()` \u2014 how do I read products with filters, associations and sorting?", "category": "dev", "option": "fs-wiki", "answer": "Shopware 6 uses no ORM, only a thin Data Abstraction Layer (DAL), so the equivalent of Doctrine's findBy() is calling search() on an injected entity repository with a Criteria object. Inject the repository, named entity_name.repository (e.g. product.repository), via services.php using service('product.repository'). A basic unfiltered read is $this->productRepository->search(new Criteria(), $context), which returns an EntitySearchResult; search by ID(s) with new Criteria([$myId]) then ->first(). Filter by field with $criteria->addFilter(new EqualsFilter('name', 'Example name')) (Shopware\\Core\\Framework\\DataAbstractionLayer\\Search\\Filter\\EqualsFilter), and combine filters with OrFilter, AndFilter, NandFilter, etc. addPostFilter() instead of addFilter() applies a filter to the result but not to aggregations. For associations, use $criteria->addAssociation('productReviews'), chainable as 'productReviews.customer'; filtering an association via $criteria->getAssociation('productReviews')->addFilter(...) does not restrict the parent entity, whereas addAssociation() plus a filter on 'productReviews.points' on the main criteria does restrict the parent entity. Mapping entities (e.g. ProductCategoryDefinition) cannot be read with search() \u2014 use searchIds() instead. Aggregations use $criteria->addAggregation(new AvgAggregation('avg-rating', 'productReviews.points')), read via $products->getAggregations()->get('avg-rating'). Paging/sorting uses setLimit(), setOffset(), and addSorting(new FieldSorting('createdAt', FieldSorting::ASCENDING)). For large datasets, use RepositoryIterator($this->productRepository, $context, $criteria), calling ->fetch() in a loop until null \u2014 this requires a deterministic sort (e.g. always include id as a secondary sort) to avoid entities being skipped or duplicated across batches. Note: EntitySearchResult is always a collection, even for a single-ID search, so call first() to get the entity; and RepositoryIterator issues a new database request per iteration, so it should be avoided for small datasets.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md:20-55"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-09": {"query": "How do I make a field on my plugin's own entity translatable per language?", "category": "dev", "option": "fs-wiki", "answer": "Add a translation table, an EntityTranslationDefinition, a TranslationEntity, and wire the main entity's TranslatedField to it. Steps: (1) create a migration for a <entity>_translation table, named by appending _translation to the entity's table name (e.g. swag_example_translation), with required columns <entity>_id (FK to the entity), language_id (FK to language), the translated column(s) (e.g. name), created_at, updated_at, and a primary key of (<entity>_id, language_id); (2) create ExampleTranslationDefinition extends Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityTranslationDefinition, override getParentDefinitionClass() to return the parent entity's definition class, and define the translated column(s) with StringField; (3) register both definitions in services.php with the shopware.entity.definition tag, registering the translation definition after the parent entity's definition; (4) create ExampleTranslationEntity extends Shopware\\Core\\Framework\\DataAbstractionLayer\\TranslationEntity with getters/setters for the translated field(s) and the association back to the parent entity, then override getEntityClass() on the definition to return it; (5) create an ExampleTranslationCollection extends EntityCollection the same way as for a normal entity; (6) on the main entity's definition, add a TranslatedField('name') and a TranslationsAssociationField(ExampleTranslationDefinition::class, 'swag_example_id'). Reading translated data prefers entity.translated.field in storefront/sales-channel contexts, and entity.field in Admin/CRUD flows. Gotchas: the translation definition must be registered in services.php after the entity it translates, and the translation table's foreign keys (<entity>_id, language_id) both cascade on delete and update.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-translations.md:17-53"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-translations.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-10": {"query": "How do I write an indexer that precomputes derived data for my custom entity on write, and how do I trigger a full reindex?", "category": "dev", "option": "fs-wiki", "answer": "Data indexers optimize recurring, complex calculations (e.g. a product's cheapest_price) by computing them once whenever the entity is written via the DAL, instead of on every read. Create a class extending Shopware\\Core\\Framework\\DataAbstractionLayer\\Indexing\\EntityIndexer and register it tagged shopware.entity_indexer, implementing: getName(): string (a unique indexer name used by EntityIndexerRegistry to route messages), iterate($offset): ?EntityIndexingMessage (full reindex support), update(EntityWrittenContainerEvent $event): ?EntityIndexingMessage (reacts to DAL writes), and handle(EntityIndexingMessage $message): void (does the actual work). iterate() uses IteratorFactory::createIterator($definition, $offset) to page through IDs for a full index, which is triggered by bin/console dal:refresh:index or an Administration index rebuild. update() extracts changed primary keys via $event->getPrimaryKeys(SomeDefinition::ENTITY_NAME); by default messages from update() are handled synchronously, but passing $forceQueue = true to EntityIndexingMessage's fourth constructor argument processes them asynchronously over the message queue instead. To manipulate data with the DAL from inside handle() without re-triggering the indexer, disable indexing on the context via $context->addState(EntityIndexerRegistry::DISABLE_INDEXING). If the target entity already has an existing indexer (CustomerIndexer, CategoryIndexer, LandingPageIndexer, ProductIndexer, ProductStreamIndexer, PromotionIndexer, RuleIndexer, MediaIndexer, MediaFolderIndexer, MediaFolderConfigurationIndexer, SalesChannelIndexer, BreadcrumpIndexer), prefer subscribing to its dispatched event (e.g. CustomerIndexerEvent) via kernel.event_subscriber and iterating $event->getIds(), rather than writing a new indexer. Gotchas: writing data through the DAL inside handle() re-triggers EntityWrittenContainerEvent, which can cause the same indexer to run in an infinite loop \u2014 use the injected Connection directly instead, or disable indexing via EntityIndexerRegistry::DISABLE_INDEXING if the DAL must be used; filter entities/columns as much as possible in update() to save performance; and the indexer's getName() must be unique.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-indexer.md:20-66"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-indexer.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-11": {"query": "On Shopware 6.7, which file do I declare my plugin's services in, and how do I get a core service passed into my service's constructor?", "category": "dev", "option": "fs-wiki", "answer": "On Shopware 6.7, plugin services are declared in `services.php` (the PHP-based DI configuration, using Symfony's `ContainerConfigurator`), not `services.xml`. To get a core service passed into your service's constructor, add it as a typed constructor parameter (e.g. `private SystemConfigService $systemConfigService`); if `autowire` and `autoconfigure` are enabled in `services.php` it is injected automatically with no further config. If the service is declared explicitly instead, add the dependency as an argument: `$services->set(ExampleService::class)->args([service(SystemConfigService::class)]);`, using the `service()` function from `Symfony\\Component\\DependencyInjection\\Loader\\Configurator`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md:17-57"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "grep -n -i \"service\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | head -50"}, {"tool": "Bash", "args": "grep -n -i \"services.xml|services.php|add-plugin-dependencies|dependency-injection\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md"}, {"tool": "Bash", "args": "grep -n -i \"services.xml|services.php\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | head -20"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-12": {"query": "I am on Shopware 6.6 \u2014 which file do I declare my plugin's service dependencies in, and how do I pass another service into the constructor?", "category": "dev", "option": "fs-wiki", "answer": "On Shopware 6.6, plugin services and their dependencies are declared in `<plugin root>/src/Resources/config/services.xml` (schema `http://symfony.com/schema/dic/services/services-1.0.xsd`). To inject another service (e.g. the core `SystemConfigService`) into your service's constructor, declare it as an `<argument type=\"service\" id=\"...\"/>` on the `<service>` entry, for example: `<service id=\"Swag\\BasicExample\\Service\\ExampleService\"><argument type=\"service\" id=\"Shopware\\Core\\System\\SystemConfig\\SystemConfigService\"/><\/service>`. Then add the matching typed constructor parameter in the PHP class, e.g. `public function __construct(SystemConfigService $systemConfigService)`, and store it on a property for later use.", "citations": ["platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/dependency-injection.md:14-56"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"services.xml|services.php|dependency-injection|add-custom-service\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.6/index.md | head -30"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/dependency-injection.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-13": {"query": "There is no event for what I need to change in a core Shopware service \u2014 how do I decorate or replace that service from my plugin?", "category": "dev", "option": "fs-wiki", "answer": "Decoratable Shopware services expose an abstract class as their contract (e.g. `AbstractExampleService`) with an abstract `getDecorated()` method returning its own type, instead of a plain PHP interface, so new methods can be added without breaking existing decorators. In your plugin's service config, register your decorator class pointing at the original with `decorate()` and pass the original instance in via `.inner`: `$services->set(ExampleServiceDecorator::class)->decorate(ExampleService::class)->args([service('.inner')]);`. Your decorator implements the abstract class, and its `getDecorated()` returns the wrapped instance; your overridden methods should call `$this->decoratedService->doSomething()` and add to or alter the result rather than discard it, since decorators nest (plugin B's decorator wraps plugin A's, which wraps the core service) and a non-delegating decorator silently breaks the rest of the chain with no runtime warning. Always type-hint the abstract class (never the concrete class) in constructors that consume the service, since type-hinting the concrete class removes it from the decoration chain. Use `bin/console debug:container --show-arguments <service-id>` to inspect the current chain, and prefer a purpose-built extension point over decoration where one exists, since extension points let multiple plugins participate without forming a chain.", "citations": ["platform/dev/6.7/guides/plugins/plugins/services/adjusting-service.md:20-75"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"decorat\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | head -30"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/services/adjusting-service.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-14": {"query": "I wrote a subscriber class in my plugin but it never fires \u2014 which interface and which service tag (`shopware.event_subscriber`?) register it?", "category": "dev", "option": "fs-wiki", "answer": "Your subscriber class must implement Symfony's `EventSubscriberInterface` (`Symfony\\Component\\EventDispatcher\\EventSubscriberInterface`), with a static `getSubscribedEvents()` method mapping event names to handler methods (e.g. `ProductEvents::PRODUCT_LOADED_EVENT => 'onProductsLoaded'`). The tag is not `shopware.event_subscriber` but the Symfony-standard `kernel.event_subscriber`, registered in the plugin's `src/Resources/config/services.php`: `$services->set(MySubscriber::class)->tag('kernel.event_subscriber');`. Creating the class alone is not enough \u2014 if it is missing from `services.php` (or missing the tag), Shopware never calls it and there is no obvious error indicating the event went unhandled.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/event/listening-to-events.md:17-64"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/event/listening-to-events.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-15": {"query": "How do I work out which event Shopware actually dispatches for a given action, for example after a product is loaded or a page is rendered?", "category": "dev", "option": "fs-wiki", "answer": "Shopware's wiki gives several techniques for discovering an event: for DAL events, the name follows the pattern `entity_name.event` (e.g. `product.written`, `product.deleted`), and some entities also expose an 'Event class' of constants (e.g. `ProductEvents`) that you find by searching for `@Event`. For product loading specifically, `GenericPageLoader` dispatches a `GenericPageLoadedEvent` on page load \u2014 search for `PageLoadedEvent`. For general PHP events, read core code for `$this->eventDispatcher->dispatch($someEvent, $someEvent->getName())` calls, or search for `extends NestedEvent`, `extends Event`, `implements ShopwareEvent`, or `->dispatch`, or check a service's constructor for an injected `EventDispatcherInterface`. For events tied to a `Criteria` (e.g. `ProductListingCriteriaEvent`), search for `CriteriaEvent` \u2014 these are hand-written, not guaranteed for every entity. For route-level events fired around a specific route (before Twig rendering, before JSON encoding, etc.), use the aliases `{route}.request`, `{route}.response`, `{route}.render`, `{route}.encode` (Store-API, since 6.6.11.0), and `{route}.controller` (since 6.6.11.0), substituting the Symfony route name. For business/ecommerce actions, search for `implements BusinessEventInterface` or `implements MailActionInterface`. Practically, opening the Symfony profiler's 'Events' tab shows every event actually fired during the current request, with names \u2014 a fast way to confirm what fires for a given action without reading source.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/event/finding-events.md:20-67"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"debug:event|which events|event reference|find events|list of events|business event\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | head -30"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/event/finding-events.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-16": {"query": "How do I run plugin logic whenever an order is written, and find out exactly which fields changed?", "category": "dev", "option": "fs-wiki", "answer": "Implement Symfony's EventSubscriberInterface and subscribe to Shopware\\Core\\Checkout\\Order\\OrderEvents::ORDER_WRITTEN_EVENT, checking that $event->getContext()->getVersionId() !== Defaults::LIVE_VERSION to react only to the live version. A changeset is not generated by default for performance reasons; to get one, also subscribe to PreWriteValidationEvent::class, and inside that listener call $command->requestChangeSet() for each command in $event->getCommands() that is instanceof ChangeSetAware and whose getEntityName() === OrderDefinition::ENTITY_NAME. The changeset can then be read via $result->getChangeSet() on each item of $event->getWriteResults() inside the ORDER_WRITTEN_EVENT handler. Note: an 'insert' command cannot generate a changeset since nothing changed yet, and editing an order in the admin creates a new draft version merged later into the live version, which usually isn't the state you want to react to.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/order/listen-to-order-changes.md:16-52"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"written event\\|EntityWrittenEvent\\|order.written\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/order/listen-to-order-changes.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-17": {"query": "How do I overwrite the price of a product line item in the cart at runtime from a plugin?", "category": "dev", "option": "fs-wiki", "answer": "Use one class that acts as both a cart collector and a cart processor. In CartDataCollectorInterface::collect, fetch the product IDs from the cart ($original->getLineItems()->filterType(LineItem::PRODUCT_LINE_ITEM_TYPE)->getReferenceIds()), skip already-fetched IDs, and store each new price in the CartDataCollection under a prefixed key (e.g. 'price-overwrite-'.$id) to avoid duplicate lookups. In CartProcessorInterface::process, for each product line item in $toCalculate read the stored price, build a QuantityPriceDefinition from the new price plus the item's existing tax rules and quantity, calculate it via an injected QuantityPriceCalculator, then call $product->setPrice($calculated) and $product->setPriceDefinition($definition). Register the combined class under both service tags shopware.cart.processor and shopware.cart.collector, with a priority (e.g. 4500) ordered after the product collector/processor. This approach is only for changing a line item's actual price (e.g. a live-shopping plugin) \u2014 for discounts or surcharges, separate line items should be used instead. Always compute prices in the collector, not the processor (querying the database inside process is discouraged since it may run repeatedly), and always mutate $toCalculate in process, not $original.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md:17-48"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"line item price\\|CartProcessor\\|price collector\\|overwrite.*price\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/checkout"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-18": {"query": "My plugin's cart processor adds a surcharge line item, but it is added again on every recalculation and its price is stale after the customer changes the quantity \u2014 how do I split the work between the collector and the processor?", "category": "dev", "option": "fs-wiki", "answer": "Split the work: a collector (implementing CartDataCollectorInterface::collect, tagged shopware.cart.collector) is where you fetch/compute the data the surcharge needs (e.g. querying the database or an API) and store it via $data->set('uniqueKey', $newData) on the CartDataCollection \u2014 the corpus explicitly warns not to query data inside process, since it may run many times. A processor (implementing CartProcessorInterface::process, tagged shopware.cart.processor) is where you actually build/update the surcharge line item and add it to $toCalculate (never $original, since $toCalculate is the cart that is actually used) using the data the collector already fetched. For a discount/surcharge specifically, the dedicated guide shows building a PercentagePriceDefinition, computing the price with an injected calculator against the current line items and context, calling $toCalculate->add($discountLineItem) on every process() pass, and attaching the price definition to the line item so it keeps recalculating correctly; it also marks such line items setStackable(false)/setRemovable(false). Because process() runs on every cart recalculation, always rebuild the price from current cart state in process() (so it reacts to quantity changes) rather than computing it once and caching a fixed value. The corpus pages found do not spell out an explicit 'check for existing line item by id before adding' snippet for avoiding duplicate additions in this exact surcharge scenario, so that specific implementation detail is not directly cited.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md:16-44", "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-discounts.md:15-54"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-discounts.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md"}, {"tool": "Bash", "args": "grep -rln \"already exist\\|duplicate line item\\|has(\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/checkout/cart"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "partial"}, "dev-19": {"query": "I need to move long-running work in my plugin out of the request into the message queue \u2014 what does the handler class look like and how is it registered?", "category": "dev", "option": "fs-wiki", "answer": "Create a new class (e.g. SmsHandler) under <plugin root>/src/MessageQueue/Handler/SmsHandler.php, mark it with the PHP attribute #[AsMessageHandler], and implement __invoke(YourMessage $message) with the processing logic \u2014 this is the code that runs once a matching message is dispatched and picked up by the handle_messages middleware. No manual service-tag wiring is needed: handlers marked this way are automatically registered/tagged with messenger.message_handler. Multiple handlers can be defined for the same message. This assumes the message class itself already exists (see the 'Adding a message to queue' guide) and builds on the plugin base guide; DI container registration for any dependencies the handler needs is covered by the dependency-injection guide. One gotcha: parts of the corpus's example reference a low_priority queue, which only exists in Shopware 6.5.7.0 and above \u2014 configuring the messenger to consume it fails on older versions.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-handler.md:15-42"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"message queue\\|MessageHandler\\|AsMessageHandler\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-handler.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-20": {"query": "How do I add my own condition to the Rule Builder from a plugin so shop owners can select it?", "category": "dev", "option": "fs-wiki", "answer": "Create a rule class in <plugin root>/src/Core/Rule that extends Shopware\\Core\\Framework\\Rule\\Rule, implementing getName() (a unique technical name), match(RuleScope $scope): bool (the actual condition logic), and getConstraints() (field => constraints); rule variables must be declared protected, not private. Register the class in services.php tagged shopware.rule.definition. Optionally implement getConfig(): RuleConfig returning e.g. (new RuleConfig())->booleanField('isFirstMondayOfTheMonth') to have Shopware render the generic sw-condition-generic component instead of building a custom one. To make it selectable in the Administration, decorate the ruleConditionDataProviderService (RuleConditionService) and call addCondition(), naming the condition to match getName(), pointing it at an Administration component (e.g. swag-first-monday) with a label, scopes, and optional group (create groups via upsertGroup()); load this decorator from a main.js entry point under <plugin root>/src/Resources/app/administration/src/. Build the component by extending sw-condition-base and overriding the sw_condition_value_content Twig block with the desired input control (e.g. sw-single-select). Since Shopware 6.5.0.0, you can restrict where the condition can be assigned (context awareness) by reading possible relations from Shopware\\Core\\Content\\Rule\\RuleDefinition, then calling ruleConditionService.getAwarenessConfigurationByAssignmentName() and addAwarenessConfiguration() with notEquals/equalsAny/snippet, using sw-select-rule-create with a matching rule-aware-group-key prop wherever rules are selected. Gotchas: never run database queries or other time-consuming operations inside match(), since it directly impacts storefront performance; and a newly added condition may not be selectable everywhere (e.g. inside the promotion module) unless awareness configuration is set up explicitly.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/rule/add-custom-rules.md:20-65"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"custom rule\\|RuleInterface\\|Rule Builder\\|add.*rule\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/rule"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -ipath \"*rule*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/rule/add-custom-rules.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-21": {"query": "My plugin dispatches its own domain event \u2014 how do I make it show up as a trigger in the Flow Builder?", "category": "dev", "option": "fs-wiki", "answer": "Implement one of the Flow \"Aware\" interfaces on the event (e.g. `Shopware\\Core\\Framework\\Event\\CustomerAware` plus `FlowEventAware`), which exposes the required getters such as `getCustomerId()`. Since Shopware 6.5.0.0, event data for flows is carried in a `StorableFlow` rather than read via the deprecated `getAvailableData()`; each Aware interface has a matching `FlowStorer` that copies data into the store (e.g. `CustomerAware` \u2192 `CustomerStorer`, `MailAware` \u2192 `MailStorer`, `OrderAware` \u2192 `OrderStorer`, `UserAware` \u2192 `UserStorer` under `Shopware\\Core\\Content\\Flow\\Dispatching\\Storer\\`). If the data has no existing Aware interface, define a new Aware interface plus a custom `FlowStorer` subclass implementing `store()` and `restore()`. Flow actions later read the data via `$flow->getStore($key)` (Aware-sourced) and `$flow->getData($key)` (original event/additional data). Finally, register the event as a trigger by subscribing to `BusinessEventCollectorEvent::NAME` and calling `$businessEventCollector->define(ExampleEvent::class)`, giving the subscriber a high priority (e.g. 1000) so it registers before other trigger subscribers. This custom-trigger functionality is available starting with Shopware 6.4.6.0, and the StorableFlow/FlowStorer model replaces getAvailableData() from 6.5.0.0 onward.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md:20-68"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -n \"flow\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md -i"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-22": {"query": "How do I give my plugin a settings page the shop operator can fill in, and what field types are available?", "category": "dev", "option": "fs-wiki", "answer": "Create `src/Resources/config/config.xml` in the plugin (no custom Administration module needed); it is rendered dynamically as an Administration configuration page. The file needs at least one `<card>` with a `<title>` and at least one `<input-field>`, each `<input-field>` requiring a `<name>` that is unique, at least 4 characters, and matches `[a-zA-Z][a-zA-Z0-9]*`. Field `type` defaults to `text`; supported types are `text`, `textarea`, `text-editor`, `url`, `password`, `int`, `float`, `bool`, `checkbox`, `datetime`, `date`, `time`, `colorpicker`, `single-select`, and `multi-select`, with common settings like `label`, `placeholder`, `helpText`, `defaultValue`, `disabled`, `required`, `copyable`, `minLength`/`maxLength`, `min`/`max`, and `<options>` for select fields. For more advanced UI, `<component name=\"componentName\">` embeds an Administration component directly \u2014 supported names are `sw-entity-single-select`, `sw-entity-multi-id-select`, `sw-media-field`, `sw-text-editor`, and `sw-snippet-field` (the last edits snippet translations instead of a system config value, available since 6.3.4.0). Mark a field `cache-relevant=\"true\"` (available since 6.7.12.0) if its value affects cached Storefront output \u2014 from 6.8.0.0 onward, system config writes no longer invalidate caches by default unless the field is marked this way. After adding fields, the operator configures values under Extensions -> My extensions -> Plugins -> Configure in the Administration.", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md:18-80"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"config\\|settings\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | grep -i \"plugin\\|system\""}, {"tool": "Bash", "args": "grep -n -i \"plugin config\\|config.xml\\|system config\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-23": {"query": "How do I ship a mail template with my plugin so it is installed automatically, including a custom mail template type?", "category": "dev", "option": "fs-wiki", "answer": "Ship the mail template via a database migration (`Shopware\\Core\\Framework\\Migration\\MigrationStep` subclass) rather than creating it in the Administration, so it installs automatically with the plugin. To reuse an existing mail template type (e.g. \"contact form\"), look up its id with `SELECT id FROM mail_template_type WHERE technical_name = \"contact_form\"`, then insert a row into `mail_template` (columns `id`, `mail_template_type_id`, `system_default` \u2014 must be `0`, `created_at`) and one row per supported language into `mail_template_translation` (columns `mail_template_id`, `language_id`, `sender_name`, `subject`, `description`, `content_html`, `content_plain`, `created_at`), resolving each `language_id` via the `language`/`locale` tables. Use `INSERT IGNORE INTO` so the migration doesn't throw on reinstall. To define a completely new mail template type instead, first insert into `mail_template_type` (columns `id`, `technical_name`, `available_entities` \u2014 a JSON map like `{\"product\": \"product\"}`, `created_at`) and `mail_template_type_translation` (columns `mail_template_type_id`, `language_id`, `name`, `created_at`) before creating the template entry as above. Do not remove mail templates on plugin uninstall, since other entities may still reference them.", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/mail/add-mail-template.md:17-46"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"mail template\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/content/mail/add-mail-template.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-24": {"query": "How do I get readable SEO URLs generated for the detail pages of my plugin's own entity?", "category": "dev", "option": "fs-wiki", "answer": "For a custom DAL entity, generate dynamic SEO URLs by implementing `Shopware\\Core\\Content\\Seo\\SeoUrlRoute\\SeoUrlRouteInterface` with three methods: `getConfig()` (returns a `SeoUrlRouteConfig` with the entity definition, route name, and template), `prepareCriteria()` (narrows/extends the fetch criteria), and `getMapping()` (returns a `SeoUrlMapping` with the template variables \u2014 it must verify the entity type it receives since the method can be invoked for other entities too). Register the route class with the container tag `shopware.seo_url.route`, and add a `seo_url_template` table entry via a plugin migration setting `route_name`, `entity_name`, and `template`. Then subscribe to the entity's `written` DAL event and call `Shopware\\Core\\Content\\Seo\\SeoUrlUpdater::update($routeName, $ids)` (and the same on the `.deleted` event) so URLs regenerate whenever the entity is written or deleted. Note that a German SEO URL is only reachable if a German domain is configured on the sales channel, and marking a `seo_url` entry deleted only sets `is_deleted = 1` \u2014 the route stays reachable, so the controller still needs to check whether the underlying content exists. (For non-DAL/external content instead, use `Shopware\\Core\\Content\\Seo\\SeoUrlPersister::updateSeoUrls()`, and for a fixed rarely-changing route, seed a static `seo_url` row via migration using `ImportTranslationsTrait::importTranslation()`.)", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/seo/add-custom-seo-url.md:19-72"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"seo url\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/content/seo/add-custom-seo-url.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-25": {"query": "How do I add a `bin/console` command to my plugin for a maintenance task?", "category": "dev", "option": "fs-wiki", "answer": "Add a custom Symfony Console command by registering it as a service in `src/Resources/config/services.php` tagged `console.command`, e.g. `$services->set(Swag\\BasicExample\\Command\\ExampleCommand::class)->tag('console.command');`. Commands registered this way are automatically available via `bin/console`. The command class itself follows the standard Symfony approach: extend `Symfony\\Component\\Console\\Command\\Command`, add the `#[AsCommand(name: 'swag:example', description: 'Example command')]` attribute from `Symfony\\Component\\Console\\Attribute\\AsCommand`, and implement `execute(InputInterface $input, OutputInterface $output): int`, returning `Command::SUCCESS` (or a failure code).", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md:17-54"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"console command\\|cli command\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-26": {"query": "How do I add a custom document type such as a pro-forma invoice in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "In Shopware 6.7, adding a wholly new document type is done via the experimental Document System (v2), gated behind the `DOCUMENT_GENERATION_REWORK` feature flag (it becomes the default only with Shopware 6.8). Steps: 1) Extend `Shopware\\Core\\Checkout\\DocumentV2\\Type\\AbstractDocumentType`, implementing `getTechnicalName(): string` and `getSupportedFormats(): array` (e.g. `['html', 'pdf']`). 2) Create a render-data DTO extending `Shopware\\Core\\Checkout\\DocumentV2\\Struct\\AbstractRenderData` with public properties, which get flattened onto the template's `config` variable. 3) Create a data provider extending `Shopware\\Core\\Checkout\\DocumentV2\\Provider\\AbstractDocumentDataProvider`, implementing `getKey()`, `supports(string $documentType): bool`, `enrichOrderCriteria(Criteria $criteria): void`, and `provideRenderingData(ProviderInput $input, Context $context): AbstractRenderData`. 4) Register both services with the tags `shopware.document_v2.type` and `shopware.document_v2.provider`. 5) Add a Twig template at `@Framework/documents/<technical_name>.html.twig` extending `@Framework/documents/base.html.twig` (plus a `.../zugferd/<technical_name>.xml.twig` if the `zugferd_xml` format is supported). 6) Outside the code, add a `document_type` database row whose `technical_name` matches the type, and a number range of type `document_<technical_name>` \u2014 both via a plugin migration reusing the legacy migration pattern with the new technical name (the `document` table has a foreign key on `document_type`). Note that the legacy document system (a similar but distinct `add-custom-document-type` process via `AbstractDocumentRenderer`, `document_type`/`document_base_config` tables, and `sw_extends`) still exists in 6.7 but is deprecated and slated for removal in Shopware 6.9.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md:14-52"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"document type\\|document\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | grep -i \"custom\\|add\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-27": {"query": "In Shopware 6.7, how do I extend a Storefront Twig template from my plugin with `{% extends %}` so I keep the core markup and other plugins' changes?", "category": "dev", "option": "fs-wiki", "answer": "Shopware does not use the standard Twig `{% extends %}` tag for this; it provides a custom `sw_extends` tag with multi-inheritance support so both the core markup and other plugins' overrides are preserved. Shopware looks for plugin templates in `<plugin root>/src/Resources/views` by default. Find the core template to override, e.g. `storefront/layout/header/logo.html.twig`, and recreate the identical path under the plugin's views directory (`<plugin root>/src/Resources/views/storefront/layout/header/logo.html.twig`). In the new file, use `{% sw_extends '@Storefront/storefront/layout/header/logo.html.twig' %}` and then override just the block you need, e.g. `{% block layout_header_logo_link %} ... {% endblock %}`. Use `{{ parent() }}` inside the override to append to, rather than replace, the original block content. Clear the cache afterward with `./bin/console cache:clear`, and make sure the plugin is active (and its theme, if any, is assigned to the sales channel). Use `{{ dump() }}` inside a template to discover the available Twig variables on a page. Since Shopware 6.7.11.0, a Storefront Components system is also available for building reusable, atomic template components as an alternative approach.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-templates.md:19-55"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"template\\|twig\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | grep -i \"storefront\\|customiz\\|extend\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-templates.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-28": {"query": "How do I override an existing Storefront JavaScript plugin, such as the cookie permission bar, from my own plugin instead of registering a new one?", "category": "dev", "option": "fs-wiki", "answer": "Extend the original plugin's class directly if it's importable, e.g. `import CookiePermissionPlugin from 'src/plugin/cookie/cookie-permission.plugin'; export default class MyCookiePermission extends CookiePermissionPlugin {}`. If it can't be imported (e.g. a third-party plugin with no module alias), retrieve the class at runtime via `PluginManager`: `const PluginClass = window.PluginManager.getPlugin('CookiePermission').get('class')`. Override the methods you need \u2014 e.g. `init()` (calling `super.init()` afterward) and `_hideCookieBar()` (calling `super._hideCookieBar()` when appropriate) \u2014 and use helpers like `CookieStorage` from `src/helper/storage/cookie-storage.helper` as needed. Then, in `main.js`, register the override with `PluginManager.override('CookiePermission', MyCookiePermission, '[data-cookie-permission]')` instead of `register()`. If the original plugin is registered asynchronously, the override import must also be dynamic: `PluginManager.override('CookiePermission', () => import('./my-cookie-permission/my-cookie-permission.plugin'), '[data-cookie-permission]')`. Note that each JavaScript plugin can only be overridden once \u2014 if two Shopware plugins override the same plugin, only the last override actually takes effect.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md:17-83"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"javascript\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | grep -i \"override\\|extend\\|storefront\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-29": {"query": "How do I add my own data to an existing Storefront page or pagelet from a plugin without overriding the core controller?", "category": "dev", "option": "fs-wiki", "answer": "Use the standard workflow of subscribing to the page/pagelet's `...LoadedEvent` rather than overriding the controller. Identify the page/pagelet to extend (e.g. `FooterPagelet`), then register an event subscriber tagged `kernel.event_subscriber` on its Loaded event (e.g. `FooterPageletLoadedEvent`). If an existing Store API route would return more data than needed, add a new, narrowly-scoped Store API route for just the missing data (the reference example uses `EntityRepository::aggregate()` with `CountAggregation` and an `EqualsFilter` rather than `search()`, since only an aggregate count is needed). In the subscriber, call that route and attach the result to the page/pagelet via `$event->getPagelet()->addExtension('product_count', $response->getProductCount())`. In the Twig template, the added data is then available under `extensions`, e.g. `{{ footer.extensions.product_count.count }}`. Do not call the DAL directly from a page/pagelet subscriber \u2014 always go through a Store API route tailored to the needed data rather than reusing a broader route that returns unnecessary information.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md:19-70"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"template\\|twig\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | grep -i \"storefront\\|customiz\\|extend\" (reused index result from dev-27 search, line 447 hit noted)"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-30": {"query": "How do I add a custom filter to the Storefront product listing from my plugin, both the criteria side and the filter panel?", "category": "dev", "option": "fs-wiki", "answer": "On the criteria side, subscribe to `Shopware\\Core\\Content\\Product\\Events\\ProductListingCollectFilterEvent` and add a `Filter` instance built from: `name` (unique filter name), `filtered` (whether it's currently active), `aggregations` (aggregations behind the filter), `filter` (the DAL filter added to the criteria), `values` (values added as `currentFilter` to the result), and `exclude` (exclusion configuration). Example: `$filter = new Filter('isCloseout', (bool) $event->getRequest()->get('isCloseout'), [new FilterAggregation('active-filter', new MaxAggregation('active', 'product.isCloseout'), [new EqualsFilter('product.isCloseout', true)])], new EqualsFilter('product.isCloseout', true), $filtered);` then `$event->getFilters()->add($filter);`. On the panel side, extend `src/Storefront/Resources/views/storefront/component/listing/filter-panel.html.twig` and override the `component_filter_panel_items` block (available since Shopware 6.4.8.0), calling `{{ parent() }}` and including one of the built-in filter components (`filter-boolean`, `filter-multi-select`, `filter-property-select`, `filter-range`, `filter-rating-select`) via `sw_include`, e.g. `{% sw_include '@Storefront/storefront/component/listing/filter/filter-boolean.html.twig' with { name: 'isCloseout', displayName: 'Closeout' } %}`. To position the new filter relative to a specific existing one instead of appending it, extend that filter's own block (e.g. `component_filter_panel_item_price`) rather than `component_filter_panel_items`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/howto/add-listing-filters.md:16-73"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"javascript\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | grep -i \"override\\|extend\\|storefront\" (reused index result from dev-28 search, line 452 hit noted)"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/howto/add-listing-filters.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-31": {"query": "How do I expose a plugin configuration value, such as a colour picked in the Administration, as an SCSS variable in my Storefront styling?", "category": "dev", "option": "fs-wiki", "answer": "Declare a fallback value in your theme's base.scss, e.g. `$sass-plugin-header-bg-color: #ffcc00 !default;`. Then in your plugin's config.xml, add a `<css>` tag inside the `<input-field>` naming the SCSS variable it maps to, e.g. `<css>sass-plugin-header-bg-color<\/css>`, alongside a `<defaultValue>`. The configured value (set via the Administration colour picker) or the defaultValue if unset is then exposed as that SCSS variable during theme compilation. This `css` tag has been available since Shopware 6.4.13.0. Note that changing the configured value still requires manually recompiling the theme for the change to take effect; the Administration shows a notice about this on such fields. For more flexibility than the config.xml `<css>` tag allows, a subscriber on ThemeCompilerEnrichScssVariablesEvent can be used instead.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables.md:16-57"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rn \"scss\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*theme*\" -o -iname \"*config*\" | grep -i storefront"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-32": {"query": "How do I define a custom field set for products from my plugin so merchants can edit the values in the Administration?", "category": "dev", "option": "fs-wiki", "answer": "Since Shopware 6.7.13.0, the recommended way is the declarative approach: ship a `Resources/config/custom-fields.xml` file in your plugin (the same XML format apps use in their manifest); Shopware then syncs the defined custom field sets automatically on install/update and removes them (without keeping user data) on uninstall, with no `CustomFieldsInstaller` service needed. Alternatively, imperatively create the set at runtime via the `custom_field_set.repository` service, e.g. `$this->customFieldSetRepository->create([['name' => 'swag_example_set', 'global' => true, 'config' => ['label' => [...]], 'customFields' => [['name' => 'swag_example_size', 'type' => CustomFieldTypes::INT, 'includeInSearch' => true, 'config' => ['label' => [...], 'customFieldPosition' => 1]]]]], $context);`. Set `global` to `false` to make the custom field set deletable/editable directly in the Administration. Custom field (and set) names are global, so prefix them with your vendor prefix (e.g. `swag`) to avoid collisions. By default custom fields aren't searchable \u2014 set `includeInSearch` to true (available since 6.7.6.0) and rebuild the search index if enabling it on an existing field. Product already carries a `custom_fields` JSON column via the `EntityCustomFieldsTrait`, so no entity/database change is required to attach custom fields to products; you only need to define the field set so merchants see it as an editable form in the Administration.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/custom-field/add-custom-field.md:19-90"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"custom field\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md -i"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/custom-field/add-custom-field.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-33": {"query": "How do I register a custom Administration module from my plugin, and what has to line up for it to actually show up after a build?", "category": "dev", "option": "fs-wiki", "answer": "Create `<plugin root>/src/Resources/app/administration/src/module/<module-name>/index.js` and import it from your plugin's `main.js` (e.g. `import './module/swag-example';`). In that `index.js`, call `Shopware.Module.register(name, config)`, configuring `color`, `icon`, `title`, `description`, a unique `name`, and `type` (`plugin` for third-party modules; `core` is reserved for core code, though `type` is only a convention, not enforced). Add `routes` and a menu entry (`navigation`) so the module is reachable, and add per-locale translation `snippets` (typically `snippet/de-DE.json` and `snippet/en-GB.json`, keyed under the module name) for the labels referenced by `title`/`description`. Then build the Administration JS with `shopware-cli project admin-build` (or `composer run build:js:admin` for the platform contribution setup). For the module to actually show up after the build: the plugin must be activated, the built JS file must ship with the plugin, an `index.js` is required (Shopware 6 auto-requires it for every module), and the module's entry-point import, registration, routes/components, and snippets all need to be wired up correctly at runtime \u2014 the Administration build step only compiles the assets, it does not validate that wiring.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/add-custom-module.md:19-77"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"module\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | grep -i \"add\\|module-component\\|add-custom-module\\|create\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/add-custom-module.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-34": {"query": "How do I extend an existing Administration component and its Twig blocks from my plugin, for example to change the dashboard headline?", "category": "dev", "option": "fs-wiki", "answer": "Use `Shopware.Component.override('sw-dashboard-index', { template })` (imported from your own `.html.twig` file) to replace behavior/markup of the existing component in place, or `Shopware.Component.extend('new-name', 'sw-dashboard-index', { template })` to create a new component based on it. Register the override/extension file from your plugin's `main.js`. In your override's Twig template, target the component's existing `{% block %}` names (e.g. a header/card block) and either replace the content entirely or keep the original markup with `{% parent %}` and add to it, for example:\n```twig\n{% block card_header %}\n    <h1 class=\"custom-header\">{{ header }}<\/h1>\n{% endblock %}\n```\nTo extend a method or computed property while keeping the original logic, call `this.$super('methodName')` inside the override. Note: multiple plugins overriding the same component are applied in registration order, so ordering matters if several plugins touch the same block. There is also an experimental Composition API extension system (`Shopware.Component.createExtendableSetup` / `Shopware.Component.overrideComponentSetup()`), but it only supports overriding (not extending) components already written with the Composition API and has no committed release timeline \u2014 Options API components should keep using `Component.override`/`Component.extend`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-components.md:18-73"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-components.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-35": {"query": "How do I load entities from the Admin API inside an Administration component using the repository factory and a Criteria?", "category": "dev", "option": "fs-wiki", "answer": "Inject the `repositoryFactory` service into your component (`inject: ['repositoryFactory']`), then create a repository for the entity you need, e.g. `this.repositoryFactory.create('product')` (a third parameter accepts `{ version: 1 }`). Build a `Criteria` instance to filter/sort/paginate, then call `productRepository.search(criteria, Shopware.Context.api)` to fetch a collection, or `productRepository.get(entityId, Shopware.Context.api)` to fetch a single record. A typical Criteria looks like:\n```javascript\ncriteria.setPage(1);\ncriteria.setLimit(10);\ncriteria.setTerm('foo');\ncriteria.setTotalCountMode(2);\ncriteria.addFilter(Criteria.equals('product.active', true));\ncriteria.addSorting(Criteria.sort('product.name', 'DESC'));\ncriteria.addAggregation(Criteria.avg('average_price', 'product.price'));\n```\n`setTotalCountMode` controls total-count computation: `0` = no total count (fastest), `1` = exact total count, `2` = `limit * 5 + 1` (fast, 'next page exists' check). To load an association, add it with `criteria.addAssociation('manufacturer')`. The relevant classes are `Repository` (CRUD requests), `Entity`, `EntityCollection`, `SearchResult`, `RepositoryFactory`, `Context`, and `Criteria`, and the global API context is `Shopware.Context.api`. Note that entities are stateless: after any write (`save()`), related data must be re-fetched from the server if you need it again.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md:14-59"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"repositoryFactory\\|repository factory\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-36": {"query": "How do I register ACL privileges for my plugin's Administration module and check them in a component or template?", "category": "dev", "option": "fs-wiki", "answer": "Register a privilege with the privileges service's `addPrivilegeMappingEntry`, conventionally from a `<component>/acl/index.js` imported by `<component>/index.js`, called before the roles detail page is visited:\n```javascript\nShopware.Service('privileges').addPrivilegeMappingEntry({\n    category: 'permissions', // or 'additional_permissions'\n    parent: null,\n    key: 'your_key',\n    roles: {\n        viewer: { privileges: ['entity_name:operation'], dependencies: [] },\n        editor: { privileges: [], dependencies: [] },\n        creator: { privileges: [], dependencies: [] },\n        deleter: { privileges: [], dependencies: [] }\n    }\n});\n```\nAdmin privileges are identifiers built from a `key` and a `role` joined by a dot (e.g. `product.viewer`); use `permissions` for the standard CRUD roles (viewer/editor/creator/deleter) or `additional_permissions` for a non-CRUD role key. You can reuse another mapping's privileges via `Shopware.Service('privileges').getPrivileges('rule.viewer')`. Protect a route, menu entry, or settings item by adding `meta: { privilege: 'your_key.your_role' }`; protect a shortcut by giving it an object with an `active()` method instead of a plain key binding. Add snippet translations at `sw.privileges.${category}.${key}.label` (and `.${role_key}` for additional_permissions). To check a privilege in a component or template, inject the `acl` service and call `acl.can('key.role')`, e.g. `this.acl.can('sales_channel.creator')` in JS or `v-if=\"acl.can('review.editor')\"` in a template. To ship additional privileges onto existing roles from PHP, override `Plugin::enrichPrivileges()`, returning an array like `['product.viewer' => ['my_custom_privilege:read']]`. Note: ACL rules in the Administration UI only gate UI visibility/behavior \u2014 they can be bypassed via direct API calls, so they are not a substitute for backend authorization \u2014 and granting a role's `viewer` privilege does not automatically grant access to a related Administration module; module access must be granted separately.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:14-72"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"acl\\|privilege\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-37": {"query": "How do I set up and run PHPUnit integration tests for my Shopware plugin, including tests that boot the kernel?", "category": "dev", "option": "fs-wiki", "answer": "Create a `phpunit.xml` in the plugin root (it can be autogenerated via `bin/console plugin:create`), with `bootstrap=\"tests/TestBootstrap.php\"`, `KERNEL_CLASS` set to `Shopware\\Core\\Kernel`, and `APP_ENV=test`, e.g.:\n```xml\n<phpunit bootstrap=\"tests/TestBootstrap.php\" executionOrder=\"random\">\n  <coverage><include><directory>./src/<\/directory><\/include><\/coverage>\n  <php>\n    <server name=\"KERNEL_CLASS\" value=\"Shopware\\Core\\Kernel\"/>\n    <env name=\"APP_ENV\" value=\"test\"/>\n  <\/php>\n  <testsuites>\n    <testsuite name=\"migration\"><directory>Migration/Test<\/directory><\/testsuite>\n    <testsuite name=\"Example Testsuite\"><directory>Test<\/directory><\/testsuite>\n  <\/testsuites>\n<\/phpunit>\n```\n`plugin:create` also generates `tests/TestBootstrap.php`, which uses `Shopware\\Core\\TestBootstrapper` with `->addCallingPlugin()`, `->addActivePlugins(...)`, and `->setForceInstallPlugins(true)` \u2014 the last of which ensures the plugin gets installed/activated even if the test database already exists. For an integration test that boots the kernel, extend `PHPUnit\\Framework\\TestCase` and use the `Shopware\\Core\\Framework\\Test\\TestCaseBase\\IntegrationTestBehaviour` trait, which gives automatic database transaction wrapping and cache clearing per test. A migration test instead uses the `Shopware\\Core\\Framework\\Test\\TestCaseBase\\KernelTestBehaviour` trait for container/database access, and should be named `<MigrationClassName>Test`. To vary service wiring only during tests, add `<plugin root>/Resources/config/services_test.php`, which overrides `Resources/config/services.php` in the test environment. Run tests with `./vendor/bin/phpunit --configuration=\"custom/plugins/SwagBasicExample\" --testsuite \"migration\"` (omit `--testsuite` to run everything, use `--filter <ClassOrMethod>` for a single class/method). To use PHPUnit at all you need the flex template's `dev-tools` package: `composer require --dev dev-tools`.", "citations": ["platform/dev/6.7/guides/development/testing/unit/php-unit.md:18-62"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"phpunit\\|integration test\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/development/testing/unit/php-unit.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-38": {"query": "How do I write Jest unit tests for my Administration components in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Place test files next to the file under test, named with the suffix `.spec.js` or `.spec.ts`. Services and isolated ES modules can be imported and tested directly without mocking. Components must be registered globally via `Shopware.Component.register('name', {...})` and then built into a real Vue component via `Shopware.Component.build('name')`, which resolves template inheritance/overrides \u2014 this is why Administration component tests are more involved than plain Vue tests. You can generate a test boilerplate with `composer run admin:create:test` (pasting the component/service path when prompted); install JS dependencies first with `composer run init:js`. Run all tests with coverage via `composer run admin:unit`, or only changed-file tests in watch mode via `composer run admin:unit:watch`. Mount the built component with `mount()` or `shallowMount()` (preferred, since it stubs child components) from `@vue/test-utils`, passing `props`, `stubs`, `mocks`, and `attachTo: document.body` as needed. Several mocks/globals are preconfigured for tests: ACL via `global.activeAclRoles = ['product.edi
