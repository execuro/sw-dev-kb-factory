localVue.directive('clipboard', {})`; missing injections (e.g. `mediaService`) can be stubbed via `provide: { mediaService: { renameMedia: () => Promise.resolve() } }` or registered globally with `Shopware.Service.register('mediaService', {...})` in `beforeAll`. Administration component tests are more involved than plain Vue tests because of template inheritance and third-party extendability \u2014 unresolved child components, directives, injections, or services show up as `[Vue warn]` messages during test runs and must be stubbed or mocked explicitly.", "citations": ["platform/dev/6.7/guides/development/testing/unit/jest-admin.md:14-57"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/development/testing/unit/jest-admin.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-65": {"query": "What can I put in the JSON body of `POST /api/search/{entity}` for filtering, associations, sorting, aggregations and getting an exact total count?", "category": "dev", "option": "fs-wiki", "answer": "The search-criteria JSON body accepted by `POST /api/search/{entity}` supports: `associations` to load related data like a SQL join (nested criteria such as sort/filter/limit can be applied per association); `includes` to restrict returned fields per type, keyed by each response's `apiAlias`; `ids` to look up records directly by ID; `filter` to filter results and aggregations (same filter types as the DAL; filtering a nested/association field requires that association to be requested first); `post-filter`, which filters results like `filter` but does not affect aggregations; `query` for a weighted search where each sub-query has a `score` that sums into `extensions.search._score` on each result (do not combine with `term`); `term` for a text search across fields flagged `SearchRanking` in the entity definition; `sort`, one or more `{field, order}` entries, supporting `naturalSorting: true` and a `type: \"count\"` sort (`ORDER BY COUNT({field}) {order}`, since 6.4.12.0); `aggregations` to compute metrics (e.g. `avg` on `price`) or facet-like breakdowns, same aggregation types as the DAL; `grouping` to group results by one or more fields; and `page`/`limit` for pagination. For an exact total count, set `total-count-mode: 1`, which runs `SQL_CALC_FOUND_ROWS` for an exact total (used for exact pagination) \u2014 note this is performance-intensive, so the default `0` (no total, best performance) should be used unless an exact count is actually needed; `total-count-mode: 2` only indicates whether a next page exists, useful for infinite scroll.", "citations": ["platform/dev/6.7/guides/development/integrations-api/search-criteria.md:26-65"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/development/integrations-api/search-criteria.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-63": {"query": "I deployed a plugin update to a 6.7 staging shop and my new migration never ran \u2014 which `bin/console` command applies the pending migrations of that one plugin, and what do I have to pass to it?", "category": "dev", "option": "fs-wiki", "answer": "Run `./bin/console database:migrate <PluginName> --all`, e.g. `./bin/console database:migrate SwagBasicExample --all` \u2014 pass the plugin's technical name and the `--all` flag to apply all of that plugin's pending migrations. Normally migrations run automatically via each migration's `update()` method during plugin install/update, but if that was disabled (via `$updateContext->setAutoMigrate(false)`) or skipped, this command applies them manually. Also note: never modify a migration that has already run \u2014 each migration executes only once, and there is no rollback.", "citations": ["platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md:26-77"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*migration*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-02": {"query": "Shopware 6.7 removed the RSA JWT key files and `system:generate-jwt-secret` \u2014 what signs Admin API tokens now, and what do I have to do when upgrading?", "category": "gap", "option": "fs-wiki", "answer": "I could not find this change documented in the corpus. What the wiki does cover about JWT is dated/pre-6.7 behavior: the shopware-cli helper-commands page notes `shopware-cli project generate-jwt <path> [--env]` (writing `JWT_PRIVATE_KEY`/`JWT_PUBLIC_KEY`) is 'only required for Shopware versions before 6.5 \u2014 6.5+ generates JWT secrets automatically', and the 6.7 hosting environment-variables reference lists `APP_SECRET` (generated with `openssl rand -hex 32`) among the app/runtime variables but does not connect it to Admin API token signing or describe any 6.7 removal of RSA key files or the `system:generate-jwt-secret` console command. No 6.7 upgrade/breaking-changes page, changelog, or JWT-specific article exists in this corpus that documents the switch away from RSA keys. This appears to be a genuine gap in the corpus rather than something present under a different term \u2014 I checked the dev/6.7 index, grepped for jwt/JWT/APP_SECRET/firebase-jwt/HS256 across platform/dev/6.7, and checked the synonyms file and hubs index without finding coverage of this specific 6.7 change.", "citations": ["platform/dev/6.7/products/tools/cli/project-commands/helper-commands.md:53-70", "platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md:22-37"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"generate-jwt-secret\\|jwt\\|JWT\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Bash", "args": "grep -in \"jwt\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/installation-updates/deployments/deployment-with-deployer.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/tools/cli/project-commands/helper-commands.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/tools/cli/project-commands/helper-commands.md, offset=40, limit=30"}, {"tool": "Bash", "args": "grep -rln \"APP_SECRET\\|firebase/php-jwt\\|HS256\\|symmetric\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Bash", "args": "grep -n \"APP_SECRET\" -A3 -B3 .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md"}, {"tool": "Bash", "args": "grep -in \"jwt\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/*.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/hubs/index.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "edge-05": {"query": "How do I enable Shopware's built-in MCP server on a Shopware 6.6 shop?", "category": "edge", "option": "fs-wiki", "answer": "You cannot: the built-in MCP server does not exist on Shopware 6.6. Every MCP-server page in the corpus (products/tools/mcp-server/*, guides/plugins/plugins/mcp-server.md, guides/plugins/apps/mcp-server.md) lives only under `platform/dev/6.7/`, with no 6.6 or 6.5 equivalent. The getting-started guide states the prerequisite explicitly: 'Shopware 6.7.14.0+ (on 6.7.11.0\u201313.x, set `MCP_SERVER=1` in `.env` first and skip discovery)' plus the `symfony/mcp-bundle` package. So the earliest it becomes available at all is Shopware 6.7.11.0 (with a manual env flag), fully supported from 6.7.14.0 \u2014 there is no path to enabling it on a 6.6 shop per this corpus. If a 6.6 shop needs this, the only options are upgrading to 6.7 or checking whether a community/backport bundle exists outside this corpus. [from memory]", "citations": ["platform/dev/6.7/products/tools/mcp-server/getting-started.md:20-48"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"mcp server|\\bmcp\\b\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.6/ .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/"}, {"tool": "Read", "args": "platform/dev/6.7/products/tools/mcp-server/getting-started.md"}], "notFoundClaim": true, "memoryClaims": ["If a 6.6 shop needs this, the only options are upgrading to 6.7 or checking whether a community/backport bundle exists outside this corpus."], "sourceVerdict": "partial"}, "func-01": {"query": "How do I create a product with variants and configure its visibility per sales channel, and why might it not show up in the storefront?", "category": "func", "option": "fs-wiki", "answer": "In Catalogues > Products, a new product first needs Title, Product number, Tax rate, Price (gross and net), and Stock filled in before it can be saved; only after that first save do the other tabs (Specifications, Extended Prices, Variants, Layout, SEO, Cross-Selling, Bundles) appear. To add variants, go to the Variants tab and use the Variant Generator: pick the properties/options that should generate variants, define price surcharges, optionally exclude specific combinations under Value exclusion, then click Generate variants. The product list's display mode can then be set to either 'Single main variant' (Main product or Single Variant preselection) or 'Fan out properties in product list'. Sales-channel assignment is handled from the Sales Channel side rather than the product itself: each Sales Channel has a Products tab where individual products, whole categories, or dynamic product groups can be assigned to (or removed from) that channel without editing each product individually. If a product does not show up in the storefront, first check the product-overview list's Active column, since a product that is not active will not display; then check whether the product (or its category) is actually assigned to that sales channel via the Sales Channel's Products tab, since a product not assigned to a channel's catalog will not appear there. [from memory] Other common causes are the product not being priced in the sales channel's currency, the product being outside the sales channel's category/navigation tree, or search-index/cache not yet having refreshed after a recent change. [from memory]", "citations": ["platform/func/catalogues/products.md:20-61", "platform/func/catalogues/product-overview.md:32-34", "platform/func/settings/saleschannel.md:41-54"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"variant\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func -iname \"*variant*\"; grep -rln \"visibilit\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func"}, {"tool": "Bash", "args": "grep -n -i \"variant|properties|catalog\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/catalogues/products.md"}, {"tool": "Bash", "args": "grep -rln \"sales channel\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/catalogues .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/tutorials-and-faq"}, {"tool": "Bash", "args": "grep -n -i \"visibilit|not show|not appear|storefront\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/tutorials-and-faq/basic-setup.md"}, {"tool": "Bash", "args": "grep -rn -i \"product not|not showing|not visible|why is my product|product is not appearing\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func"}, {"tool": "Bash", "args": "grep -n -i \"active|assign.*sales channel|sales channel.*assign|visibility\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/catalogues/product-overview.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/saleschannel.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/saleschannel.md"}], "notFoundClaim": false, "memoryClaims": ["Other common causes are the product not being priced in the sales channel's currency, the product being outside the sales channel's category/navigation tree, or search-index/cache not yet having refreshed after a recent change. [from memory]"], "sourceVerdict": "partial"}, "dev-22": {"query": "How do I give my plugin a settings page the shop operator can fill in, and what field types are available?", "category": "dev", "option": "fs-wiki", "answer": "Create src/Resources/config/config.xml in the plugin; it is rendered dynamically in the Administration under Extensions -> My extensions -> Plugins -> Configure, without needing a custom Administration module. The file needs at least one <card> with a <title> and at least one <input-field>, e.g. a card containing an <input-field><name>example<\/name><\/input-field>. Card <title>, <label>, <placeholder>, and <helpText> are translatable via the lang attribute (default en-GB). Every <input-field> needs a unique <name> of at least 4 characters matching [a-zA-Z][a-zA-Z0-9]*. Field type defaults to text; supported types are text, textarea, text-editor, url, password, int, float, bool, checkbox, datetime, date, time, colorpicker, single-select, and multi-select, with common settings like label/placeholder/helpText, defaultValue, disabled, required, copyable, minLength/maxLength, min/max, and <options> for select types. For advanced UI you can instead use <component name=\"componentName\"> to embed one of the supported Administration components directly: sw-entity-single-select, sw-entity-multi-id-select, sw-media-field, sw-text-editor, sw-snippet-field. A field can be marked cache-relevant=\"true\" (available since Shopware 6.7.12.0) when its value affects cached Storefront output, which is required from 6.8.0.0 onward since system config writes no longer invalidate caches by default.", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md:18-81"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"plugin config\\|system config\\|Plugin Configuration\\|config.xml\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-01": {"query": "How do I configure Shopware 6's built-in GraphQL API for the Store API?", "category": "edge", "option": "fs-wiki", "answer": "Nothing in the corpus supports this premise. A full-text search for 'graphql' across the entire platform wiki (dev, func, hubs, synonyms) returns zero matches. Shopware 6 does not ship a built-in GraphQL API; its Store API (and Admin API) are REST/JSON-based HTTP APIs, as reflected throughout the dev/6.7 corpus's Store API and sales-channel documentation. There is no GraphQL configuration to perform because the feature does not exist in Shopware 6. [from memory]", "citations": [], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"graphql\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/"}, {"tool": "Bash", "args": "ls .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms*; grep -rin \"graphql\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms*"}, {"tool": "Bash", "args": "grep -rln -i \"store api\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/"}], "notFoundClaim": true, "memoryClaims": ["Shopware 6 does not ship a built-in GraphQL API; its Store API (and Admin API) are REST/JSON-based HTTP APIs, as reflected throughout the dev/6.7 corpus's Store API and sales-channel documentation. There is no GraphQL configuration to perform because the feature does not exist in Shopware 6."], "sourceVerdict": "no"}, "dev-39": {"query": "How do I write end-to-end Cypress tests for my plugin against a Shopware 6.7 store?", "category": "dev", "option": "fs-wiki", "answer": "In Shopware 6.7, the wiki flags Cypress as the legacy E2E approach \u2014 new projects should use Playwright instead \u2014 but Cypress is still documented for existing suites. Prerequisites: a clean Shopware installation (no categories, products, or settings) initialized with `composer run init`, tests run against production mode with a theme assigned, and E2E dependencies installed via `npm install` in the relevant E2E folder (e.g. `src/Administration/Resources/app/administration/test/e2e`). The test suite package `@shopware-ag/e2e-testsuite-platform` provides commands, helpers, and test data management on top of Cypress plus the plugins `cypress-select-tests`, `cypress-log-to-output`, and `cypress-file-upload`. For a plugin, create the folder structure `Resources/app/<environment>/test/e2e/cypress/{fixtures,integration,plugins,support}`, run `npm init -y`, install `@shopware-ag/e2e-testsuite-platform`, then create `e2e/cypress/plugins/index.js` requiring `@shopware-ag/e2e-testsuite-platform/cypress/plugins` and `e2e/cypress/support/index.js` requiring `@shopware-ag/e2e-testsuite-platform/cypress/support`. Structure: `fixtures` (static JSON test data loaded via `cy.fixture`), `integration` (`*.spec.js` test files, which must be placed in one of the recognized subfolders \u2014 `catalogue`, `content`, `customer`, `general`, `media-marketing`, `order`, `rule-product-stream`, `settings` \u2014 or CI will not consider them), `plugins`, `support` (custom commands, global overrides), plus `cypress.json`/`cypress.env.json` config. Use `describe()`/`context()` to group tests and `it()`/`specify()` for individual tests (Shopware convention favors `it()`); prefer `beforeEach()` cleanup over `after()`/`afterEach()`, since a failed test can skip the latter hooks. Create test data through Shopware's REST API rather than the UI, e.g. `cy.createDefaultFixture(endpoint, data, jsonPath)`, backed by the `ApiService` helper (`e2e/cypress/support/service/api.service.js`); custom fixture services extend `AdminFixtureService`/`FixturesService` under `cypress/support/service/`. On the Docker-based platform project setup, run `composer run e2e:setup` (outside the container, first-time prep), `composer run e2e:prepare` (inside the container if already clean), then `composer run e2e:open` (outside, opens the runner), or from the CLI: `composer e2e:cypress -- run --spec=\"cypress/e2e/administration/**/*.cy.js\"`. Note that UUID-based IDs in Shopware can change between installations, so avoid relying on them as test selectors, and on Mac the `DISPLAY` env var for XQuartz must be set before the containers are created.", "citations": ["platform/dev/6.7/guides/development/testing/legacy/cypress/_index.md:19-46"], "toolCallLog": [{"tool": "Bash", "args": "ls .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/testing/legacy/cypress/"}, {"tool": "Read", "args": "platform/dev/6.7/guides/development/testing/legacy/cypress/_index.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-01": {"query": "How do I add my own Admin API endpoint under `/api/...` from a plugin \u2014 a controller with the api route scope and its ACL?", "category": "gap", "option": "fs-wiki", "answer": "The corpus has no dedicated 'add an Admin API route from a plugin' guide, but the documented Store API pattern is the same mechanism Shopware uses for the Admin API, just with a different route scope. Per the Store API guide: define an abstract route with `getDecorated()` and a `load()` method, implement a concrete route class tagged with the `#[Route(...)]` attribute setting `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE` \u2014 for the Store API this is `StoreApiRouteScope::ID`; for an Admin API endpoint the analogous scope constant (e.g. `ApiRouteScope::ID`) would be used instead so the route is only reachable under `/api/...` \u2014 register the route class as a service, and import it in `<plugin root>/src/Resources/config/routes.php` via `$routes->import(...)`; verify discovery with `bin/console debug:router <route-name>` (which only proves discovery, not that the service constructs or a request succeeds). The guide also notes that OpenAPI documentation for Admin API endpoints goes under `src/Resources/Schema/AdminApi/` (as opposed to `Schema/StoreApi/` for Store API routes), confirming the two APIs share this same route-attribute/registration pattern. On ACL: the corpus's Administration ACL guide explicitly warns that Administration-UI ACL rules (`acl.can()`, `meta.privilege`, `Shopware.Service('privileges')`) only gate the Vue admin UI, not the API itself \u2014 they do not protect a backend endpoint by themselves. Server-side, Shopware checks privileges of the form `entity_name:operation` against the authenticated Admin API user's role; a plugin can add such privileges to existing roles via `Plugin::enrichPrivileges()` returning e.g. `['product.viewer' => ['my_custom_privilege:read']]`. The corpus does not document a PHP `#[Acl(...)]` controller attribute for gating a raw (non-DAL) custom Admin API controller action \u2014 that mechanism is not covered in this wiki and I could not verify it from the corpus.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md:19-57", "platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:14-72"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"api route scope\\|routeScope.*api\\|ACL\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework"}, {"tool": "Bash", "args": "grep -rln \"RouteScope\\|api-route-scope\\|add-custom-controller\\|AdminApi\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}, {"tool": "Bash", "args": "grep -in \"admin api\\|adminapi\\|api\\]\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Bash", "args": "grep -rln \"Acl(\\|#[Acl]\\|Framework\\\\Routing\\\\Annotation\\\\Acl\\|privileges required\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/concepts/api/admin-api.md"}, {"tool": "Bash", "args": "ls .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms*; grep -in \"admin api.*controller\\|custom admin.*endpoint\\|ApiRouteScope\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/*.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "partial"}, "edge-02": {"query": "How do I get the DI container with `Shopware()->Container()` and override the product listing Smarty template in Shopware 6?", "category": "edge", "option": "fs-wiki", "answer": "Nothing in the corpus supports this. A full-text search for 'smarty' and for the legacy 'Shopware()->Container' global-function syntax across the entire platform wiki returns zero matches. Both belong to Shopware 5's plugin architecture (global `Shopware()` helper function and the Smarty templating engine); Shopware 6 replaced them with Symfony's dependency injection container (services are constructor-injected or fetched via `$container->get()`/autowiring) and the Twig templating engine for the Storefront, so there is no `Shopware()->Container()` call or Smarty template to override in Shopware 6. [from memory]", "citations": [], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"smarty|Shopware()->Container\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/"}], "notFoundClaim": true, "memoryClaims": ["Both belong to Shopware 5's plugin architecture (global `Shopware()` helper function and the Smarty templating engine); Shopware 6 replaced them with Symfony's dependency injection container (services are constructor-injected or fetched via `$container->get()`/autowiring) and the Twig templating engine for the Storefront, so there is no `Shopware()->Container()` call or Smarty template to override in Shopware 6."], "sourceVerdict": "no"}, "dev-20": {"query": "How do I add my own condition to the Rule Builder from a plugin so shop owners can select it?", "category": "dev", "option": "fs-wiki", "answer": "Combine a PHP rule class with an Administration component. Create a rule class in `<plugin root>/src/Core/Rule` extending `Shopware\\Core\\Framework\\Rule\\Rule`, implementing `getName(): string` (a unique technical name), `match(RuleScope $scope): bool`, and `getConstraints(): array`; rule variables must be declared `protected`, not `private` (private variables will not work correctly). Register the class in `services.php` tagged `shopware.rule.definition`. You can optionally add `getConfig(): RuleConfig` returning e.g. `(new RuleConfig())->booleanField('isFirstMondayOfTheMonth')` to skip building a custom Administration component, in which case Shopware renders the generic `sw-condition-generic` component for it. To surface the rule in the Administration UI, decorate `ruleConditionDataProviderService` (the `RuleConditionService`) and call `addCondition()`, naming the condition to match `getName()`, and pointing it at an Administration component (e.g. `swag-first-monday`) with a `label`, `scopes`, and an optional `group` (create groups via `upsertGroup()`); load this decorator from a `main.js` entry point under `<plugin root>/src/Resources/app/administration/src/`. Build the component itself extending `sw-condition-base`, with a Twig template overriding the `sw_condition_value_content` block with the desired input control (e.g. `sw-single-select`). Since Shopware 6.5.0.0, you can restrict where the condition can be assigned (context awareness) by reading relations from `Shopware\\Core\\Content\\Rule\\RuleDefinition`, then calling `ruleConditionService.getAwarenessConfigurationByAssignmentName()` and `addAwarenessConfiguration()` with `notEquals`/`equalsAny`/`snippet`, using the `sw-select-rule-create` component with a matching `rule-aware-group-key` prop wherever rules are selected \u2014 without this, a newly added condition may not be selectable everywhere (e.g. inside the promotion module) because rules are context-aware. Never run database queries or other time-consuming operations inside `match()`, since it directly impacts store performance.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/rule/add-custom-rules.md:20-66"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"rule builder|custom rule|add.*rule|Rule condition|RuleScope\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/rule/add-custom-rules.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-46": {"query": "sw-button and sw-card are deprecated in Shopware 6.7 \u2014 how do I migrate my plugin's admin templates to the Meteor components, and is there a codemod that does it?", "category": "dev", "option": "fs-wiki", "answer": "Yes, there is a codemod. With Shopware 6.7, several Administration components (including ones like sw-button and sw-card) are being replaced with components from the Meteor Component Library, Shopware's official reusable component collection built on the Shopware Design System. Run the codemod tool to automatically replace old components with Meteor Components in a plugin located under `custom/plugins`: `composer run admin:code-mods`, e.g. `composer run admin:code-mods -- --plugin-name example-plugin --fix -v 6.7`. The tool replaces compatible components automatically, adds guidance comments where manual migration is required, and fixes some other deprecated code. For cross-version compatibility, Shopware components gained a `deprecated` prop (default `false`, meaning the new Meteor Component is used by default); setting `deprecated: true` renders the old component instead, which lets a plugin support both Shopware 6.6 and 6.7 from a single codebase without migrating immediately. The wiki notes that while old components remain usable via the `deprecated` prop, Shopware recommends migrating to Meteor Components as soon as possible, and that timelines/implementation details for this migration are still subject to change.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/meteor-components.md:15-43"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/administration/meteor-components.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-28": {"query": "How do I override an existing Storefront JavaScript plugin, such as the cookie permission bar, from my own plugin instead of registering a new one?", "category": "dev", "option": "fs-wiki", "answer": "Extend the original plugin's vanilla JS class if it can be imported, e.g. `import CookiePermissionPlugin from 'src/plugin/cookie/cookie-permission.plugin'; export default class MyCookiePermission extends CookiePermissionPlugin {}`. If the class cannot be imported (e.g. it belongs to a third-party plugin with no alias), retrieve it at runtime via PluginManager: `const PluginClass = window.PluginManager.getPlugin('CookiePermission').get('class')`. Override the methods you need (e.g. init() to always clear the cookie via the CookieStorage helper, calling super.init() afterward, and _hideCookieBar() to add a confirm dialog before calling super._hideCookieBar()). Then, instead of PluginManager.register(), register the override in main.js with PluginManager.override(), e.g. `PluginManager.override('CookiePermission', MyCookiePermission, '[data-cookie-permission]')`. If the original plugin was registered asynchronously, the override's second argument must also be a dynamic import: `PluginManager.override('CookiePermission', () => import('./my-cookie-permission/my-cookie-permission.plugin'), '[data-cookie-permission]')`. Each JavaScript plugin can only be overridden once -- if two Shopware plugins override the same plugin, only the last override actually takes effect.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md:17-84"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"override.*plugin\\|PluginManager.override\\|override.*JavaScript\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-05": {"query": "How do I set up a sales channel \u2014 storefront versus headless type, domains, languages and currencies \u2014 and where do I get its API access key?", "category": "func", "option": "fs-wiki", "answer": "Sales Channels connect a Shopware shop to different storefronts or endpoints - the classic HTML storefront, a headless API-only channel, or export channels for comparison portals/social shopping. A new one is created via the plus icon next to Sales Channel in the admin main menu, choosing either 'Sales Channel with HTML storefront', a 'headless sales channel' (API only), or a product comparison export. General settings then cover Name, marking the channel as a favourite, entry points for main/footer/service navigation, navigation levels, the default Customer group for new/anonymous customers, Countries, Languages, and Standard units of measurement. Payment and shipping settings let you pick the Payment methods (plus a default), Shipping methods (plus a default), Currencies (plus a default), and the Tax calculation method. Domains are configured per self-hosted instance: each domain has its own URL, Language, Currency, Snippet set, and unit system, which is needed for multi-language shops running on separate URLs (using one consistent protocol avoids duplicate-content issues); cloud instances instead get an auto-generated URL with all traffic forwarded over an encrypted connection. Hreflang settings, once activated, let you pick a default domain used as a fallback for all languages to prevent duplicate-content classification across language versions. The API access key is obtained from the channel's Status/API access area: it is generated as an API Access ID for that channel. Other configuration includes a Products tab to assign/remove individual products, categories, or dynamic product groups to the channel, a Theme tab to assign the channel's theme, Status settings to temporarily disable the channel, enable maintenance mode, or IP-whitelist access (whitelisting behind a proxy requires TRUSTED_PROXIES=IP_of_the_proxy in .env), and an Analytics tab to connect Google Analytics 4. A gotcha: the preinstalled headless sales channel should never be deleted, since several extensions (including the B2B Suite) depend on it - hide it from the sidebar via favourites instead, and deleting a sales channel via 'Delete Sales Channel' is irrevocable.", "citations": ["platform/func/settings/saleschannel.md:33-68"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"api access|access id|access key\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/saleschannel.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-26": {"query": "How do I add a custom document type such as a pro-forma invoice in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "In Shopware 6.7 there are two document systems. The stable, still-default one is the legacy document system: add a plugin migration inserting a row into document_type (with a technical_name), translations into document_type_translation via Shopware\\Core\\Migration\\Traits\\ImportTranslationsTrait and Translations, and a default config into document_base_config plus document_base_config_sales_channel. Create a renderer implementing Shopware\\Core\\Checkout\\Document\\Renderer\\AbstractDocumentRenderer, with getDecorated(), supports(): string (returning the type's technical name), and render(array $operations, Context $context, DocumentRendererConfig $rendererConfig): RendererResult, registered with the service tag document.renderer, using DocumentFileRendererRegistry to render the actual PDF/HTML. Add a Twig template at <plugin root>/src/Resources/views/documents/<name>.html.twig that does {% sw_extends '@Framework/documents/base.html.twig' %}. Finally add a number range via migration (rows in number_range_type, number_range, number_range_sales_channel plus their translation tables) -- without it no document number can be generated, and without the renderer the type shows up in the Administration but doesn't work. This legacy system is deprecated and will be removed in Shopware 6.9. The experimental successor, Document System (v2, available since 6.7 behind the DOCUMENT_GENERATION_REWORK feature flag), instead has you extend Shopware\\Core\\Checkout\\DocumentV2\\Type\\AbstractDocumentType (getTechnicalName(), getSupportedFormats()), create a render-data DTO extending AbstractRenderData, and a data provider extending AbstractDocumentDataProvider (getKey(), supports(), enrichOrderCriteria(), provideRenderingData()), register both services with tags shopware.document_v2.type and shopware.document_v2.provider, add a Twig template at @Framework/documents/<technical_name>.html.twig, and still create the document_type database row and number range via a migration reusing the legacy pattern with the new technical name.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/documents/legacy/add-custom-document-type.md:18-55", "platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md:14-52"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"document type\\|DocumentTypeEntity\\|custom document\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/checkout/documents/legacy/add-custom-document-type.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-50": {"query": "My `ScheduledTaskHandler` stopped running after the upgrade \u2014 how must a scheduled task and its handler be declared in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "In Shopware 6.7, the scheduled task and its handler are separate runtime roles and both must be wired, even when generated together: the task describes when work is due (registered via the `shopware.scheduled.task` tag) and the handler is the Messenger consumer that executes `run()`. Register both in the plugin's `services.php`:\n\n```php\n$services->set(ExampleTask::class)\n    ->tag('shopware.scheduled.task');\n\n$services->set(ExampleTaskHandler::class)\n    ->args([service('scheduled_task.repository'), service('logger')])\n    ->tag('messenger.message_handler');\n```\n\nThe task class extends `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTask` and implements `getTaskName()` (a vendor-prefixed technical name, e.g. `swag.example_task`) and `getDefaultInterval()` (in seconds). The handler class extends `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTaskHandler`, is annotated `#[AsMessageHandler(handles: ExampleTask::class)]`, and implements `run()`. Since Shopware 6.7.13.0, a handler can additionally implement `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\DynamicallyScheduledTaskHandler` and its `getNextExecutionTime(ScheduledTask $task, ScheduledTaskEntity $taskEntity): ?\\DateTimeInterface` method (called after `run()` finishes) to control the next run time from domain data instead of a fixed interval \u2014 returning `null` falls back to `nextExecutionTime + runInterval` (capped to now if in the past). To register/test without reinstalling: `bin/console scheduled-task:register`, `bin/console scheduled-task:run`, `bin/console messenger:consume`. A common reason a task stops running: its `status` must be `scheduled` in the `scheduled_task` table for `scheduled-task:run` to pick it up, unless the admin worker is used.", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md:20-70"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"ScheduledTask\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-68": {"query": "How does the registration handshake between Shopware and my app backend work \u2014 shop id, proof, shop secret and the confirmation call?", "category": "dev", "option": "fs-wiki", "answer": "Registration is a `GET` request Shopware sends to the URL declared in the manifest, with query parameters `shop-id`, `shop-url`, `timestamp`, and headers `shopware-app-signature` (an HMAC-SHA256 of the query string, signed with the app's `app-secret`), `sw-version` (since 6.4.1.0), and \u2014 on re-registration \u2014 `shopware-shop-signature` (signed with the shop's current `shop-secret`). The signature is computed as `hash_hmac('sha256', $queryString, $appSecret)`. On success, the app backend responds with a `proof` (a SHA-256 HMAC of `shopId . shopUrl . appName`, computed with the `app-secret`), a generated `shop-secret` (64\u2013255 characters), and a `confirmation_url`, e.g. `{\"proof\": \"...\", \"secret\": \"random secret string\", \"confirmation_url\": \"https://my.example.com/registration/confirm\"}`. On a failed setup precondition, the app responds with `{\"error\": \"...\"}` instead. If the proof matches, Shopware then sends a `POST` to the `confirmation_url` with `apiKey`, `secretKey`, `timestamp`, `shopUrl`, `shopId` in the body, signed via the `shopware-shop-signature` header (an HMAC-SHA256 of the body using the `shop-secret`); the app uses `apiKey`/`secretKey` as the OAuth `client_id`/`client_secret` against the Admin API. On re-registration, Shopware also sends a `shopware-shop-signature-previous` header signed with the previous `shop-secret`, so the app should validate both to detect secret rotation and accept the old secret in parallel for a short grace period (e.g. 1 minute). Registration and confirmation requests time out after 5 seconds, and the `app-secret` must never be published \u2014 it stays with the Shopware Account.", "citations": ["platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md:27-92"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-21": {"query": "My plugin dispatches its own domain event \u2014 how do I make it show up as a trigger in the Flow Builder?", "category": "dev", "option": "fs-wiki", "answer": "Implement a Flow Builder 'Aware' interface on the event (e.g. Shopware\\Core\\Framework\\Event\\CustomerAware together with FlowEventAware), so the event exposes the relevant data via a getter like getCustomerId(). Since Shopware 6.5.0.0 event data for Flow Builder is stored in a StorableFlow rather than read via getAvailableData(); each Aware interface has a matching FlowStorer that copies the data into the store (CustomerAware -> Shopware\\Core\\Content\\Flow\\Dispatching\\Storer\\CustomerStorer, MailAware -> MailStorer, OrderAware -> OrderStorer, UserAware -> UserStorer). If your data has no existing Aware interface, define a new one plus a FlowStorer subclass implementing store() and restore(). Flow actions then read stored data via $flow->getStore($key) or $flow->getData($key). Finally, register the event as a trigger with a subscriber on BusinessEventCollectorEvent::NAME that calls $businessEventCollector->define(ExampleEvent::class) and adds it to the collection, giving the subscriber a high priority (e.g. 1000) so it registers before other trigger subscribers. This custom flow trigger functionality is available starting with Shopware 6.4.6.0; the StorableFlow/FlowStorer model replaces getAvailableData() from 6.5.0.0 onward.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md:20-68"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"Flow Builder\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -30"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-25": {"query": "How do I add a `bin/console` command to my plugin for a maintenance task?", "category": "dev", "option": "fs-wiki", "answer": "Add a custom Symfony Console command class using the standard Symfony approach, e.g. a class annotated with #[AsCommand(name: 'swag:example', description: 'Example command')] extending Symfony\\Component\\Console\\Command\\Command and implementing execute(InputInterface $input, OutputInterface $output): int. Then register that class as a service in src/Resources/config/services.php tagged console.command, for example: $services->set(Swag\\BasicExample\\Command\\ExampleCommand::class)->tag('console.command'). Commands registered this way are automatically available via bin/console.", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md:17-55"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"console command\\|Symfony\\\\Component\\\\Console\\|Command::class\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-09": {"query": "Why doesn't my payment method appear in the checkout \u2014 what has to be configured in the administration?", "category": "func", "option": "fs-wiki", "answer": "Payment methods are managed under Settings > Commerce > Payment methods. Several administration settings determine whether a method shows up at checkout: first, the method's Active toggle on the 'Add Payment method' form must be enabled - the overview lists each method's active status, and the four standard active methods are cash on delivery, invoice, prepayment, and direct debit. Second, and critically, a payment method also needs to be assigned in the relevant sales channel to actually appear to customers there - being active alone is not enough. Third, the method's Availability rule field uses Rule Builder conditions to control when the method is offered at all; if a rule is assigned (e.g. restricting by customer group, cart value, or billing country) and the current cart/customer/order context does not satisfy it, the method will be hidden even though it is active and assigned to the channel - leaving this field blank (NULL) means unrestricted availability. Other 'Add Payment method' fields include Name, Technical name (a unique identifier - changing it on an existing method can make it inoperable, so it should be set as early as possible or left to the extension's manufacturer to update), Position (storefront display order), Description, Logo, and 'Allow change of payment method after order completion'. In short: check that the method is Active, that it is assigned to the sales channel used to test checkout, and that its Availability rule (if any) actually matches the test scenario.", "citations": ["platform/func/settings/Paymentmethods.md:20-33"], "toolCallLog": [], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-08": {"query": "In a plugin service, what is the Shopware 6 equivalent of Doctrine's `findBy()` \u2014 how do I read products with filters, associations and sorting?", "category": "dev", "option": "fs-wiki", "answer": "Shopware 6 uses no ORM, only a thin Data Abstraction Layer (DAL) \u2014 the equivalent of Doctrine's `findBy()` is injecting the entity repository (named `entity_name.repository`, e.g. `product.repository`, via `services.php` using `service('product.repository')`) and calling `search(Criteria $criteria, Context $context)`, which returns an `EntitySearchResult` (an `EntitySearchResult` is always a collection, even for a single-ID search \u2014 call `first()` to get the entity). A basic unfiltered read is `$this->productRepository->search(new Criteria(), $context)`; searching by ID(s) is `new Criteria([$myId])` then `->first()`. Filter by field with `$criteria->addFilter(new EqualsFilter('name', 'Example name'))` (`Shopware\\Core\\Framework\\DataAbstractionLayer\\Search\\Filter\\EqualsFilter`), and combine multiple filters with `OrFilter`, `AndFilter`, `NandFilter`, etc. `addPostFilter()` applies a filter to the result but not to aggregations, unlike `addFilter()`. To pull in related data, add associations via `$criteria->addAssociation('productReviews')`, chainable as `'productReviews.customer'`; you can filter an association itself via `$criteria->getAssociation('productReviews')->addFilter(...)` (this does not restrict the parent entity), versus adding a filter on `'productReviews.points'` directly on the main criteria (this does restrict the parent entity). Sort and page with `setLimit()`, `setOffset()`, and `addSorting(new FieldSorting('createdAt', FieldSorting::ASCENDING))` (`Shopware\\Core\\Framework\\DataAbstractionLayer\\Search\\Sorting\\FieldSorting`). Aggregations use `$criteria->addAggregation(new AvgAggregation('avg-rating', 'productReviews.points'))`, read back via `$products->getAggregations()->get('avg-rating')`. Mapping entities (ManyToMany join tables, e.g. `ProductCategoryDefinition`) only have primary keys and cannot be read with `search()` \u2014 use `searchIds()` instead. For large datasets, use `RepositoryIterator($this->productRepository, $context, $criteria)`, calling `->fetch()` in a loop until it returns `null`; this issues a new database request per iteration (avoid it for small datasets) and requires a deterministic sort (e.g. always include `id` as a secondary sort) to avoid entities being skipped or duplicated across batches.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md:1-56"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-32": {"query": "How do I define a custom field set for products from my plugin so merchants can edit the values in the Administration?", "category": "dev", "option": "fs-wiki", "answer": "Since the `product` entity already has a `custom_fields` JSON column, you don't need an entity extension \u2014 you register a custom field set that groups your custom fields and makes them editable in the Administration. Declaratively (available since Shopware 6.7.13.0), ship a `Resources/config/custom-fields.xml` file in your plugin; Shopware syncs the defined field sets on plugin `install`/`update` and removes them (without deleting stored user data) on `uninstall`, with no extra service needed \u2014 the XML format matches the one apps use in their manifest. Alternatively, imperatively use the `custom_field_set.repository` service to create the set at runtime, e.g. `$this->customFieldSetRepository->create([['name' => 'swag_example_set', 'global' => true, 'config' => ['label' => [...]], 'customFields' => [['name' => 'swag_example_size', 'type' => CustomFieldTypes::INT, 'includeInSearch' => true, 'config' => ['label' => [...], 'customFieldPosition' => 1]]]]], $context)`. Custom field and set names are global and should carry a vendor prefix (e.g. `swag`) to stay unique. Setting `global` to `false` makes the set editable/deletable directly in the Administration UI; by default custom fields are not searchable, so set `includeInSearch` to `true` if products should be searchable/filterable by that field (rebuilding the search index or updating products afterward). When deleting a set/field later, also clean up the stored values in the entities' `customFields` JSON column.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/custom-field/add-custom-field.md:19-90"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"custom field set\\|CustomFieldSet\\|add-custom-field\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/custom-field/add-custom-field.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-10": {"query": "How do I write an indexer that precomputes derived data for my custom entity on write, and how do I trigger a full reindex?", "category": "dev", "option": "fs-wiki", "answer": "Data indexers optimize recurring, complex calculations (e.g. a product's `cheapest_price`) by computing them once whenever the entity is written via the DAL, instead of on every read \u2014 use one when reading data (e.g. for a listing) would otherwise require an expensive calculation per record. If the target entity already has an indexer (`CustomerIndexer`, `CategoryIndexer`, `LandingPageIndexer`, `ProductIndexer`, `ProductStreamIndexer`, `PromotionIndexer`, `RuleIndexer`, `MediaIndexer`, `MediaFolderIndexer`, `MediaFolderConfigurationIndexer`, `SalesChannelIndexer`, `BreadcrumpIndexer`), prefer subscribing to its dispatched event instead of writing a new one. To write a custom indexer, create a class extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Indexing\\EntityIndexer` and register it tagged `shopware.entity_indexer`, implementing: `getName(): string` (a unique indexer name that `EntityIndexerRegistry` uses to route messages, so it must be unique); `iterate($offset): ?EntityIndexingMessage` for a full reindex; `update(EntityWrittenContainerEvent $event): ?EntityIndexingMessage` which reacts to DAL writes; and `handle(EntityIndexingMessage $message): void` which does the actual work. `iterate()` uses `IteratorFactory::createIterator($definition, $offset)` to page through IDs for a full index, triggered by `bin/console dal:refresh:index` or an Administration index rebuild. `update()` extracts changed primary keys via `$event->getPrimaryKeys(SomeDefinition::ENTITY_NAME)`; filter the entities/columns as much as possible there (e.g. only react to a changed firstname) to save performance. By default, messages from `update()` are handled synchronously; pass `$forceQueue = true` as `EntityIndexingMessage`'s fourth constructor argument to process them asynchronously over the message queue instead. To manipulate data with the DAL from inside `handle()` without re-triggering the indexer, disable indexing on the context via `$context->addState(EntityIndexerRegistry::DISABLE_INDEXING);` \u2014 otherwise, writing data through the DAL inside `handle()` re-triggers `EntityWrittenContainerEvent`, which can cause the same indexer to run in an infinite loop; alternatively use the injected `Connection` directly instead of the DAL. To hook into an existing indexer's dispatched event (e.g. `CustomerIndexerEvent`) instead of writing a new indexer, subscribe with `kernel.event_subscriber` and iterate `$event->getIds()`. To trigger a full reindex, run `bin/console dal:refresh:index`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-indexer.md:1-67"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-indexer.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-60": {"query": "Which transports do my Shopware message queue workers have to consume in production, and how do I turn off the admin worker?", "category": "dev", "option": "fs-wiki", "answer": "In production, run one or more CLI workers instead of relying on the browser-based admin worker (the admin worker only runs while someone is logged into the Administration and can cause high CPU load with multiple concurrent admin users, so it is not recommended for production). Consume the default and low-priority transports, e.g.: `bin/console messenger:consume async --time-limit=60 --memory-limit=128M` and `bin/console messenger:consume async low_priority`. You must also set up a CLI worker for the failed transport, otherwise failed messages are never processed \u2014 failed messages are retried automatically 3 times, then deleted, via the Doctrine-backed failed transport configured through `MESSENGER_TRANSPORT_FAILURE_DSN`. Once CLI workers are running, disable the admin worker in `config/packages/shopware.yaml`: `shopware: admin_worker: enable_admin_worker: false`. (If the admin worker is still used temporarily, it can instead be configured with `enable_admin_worker: true`, `poll_interval: 30`, and `transports: [\"async\", \"low_priority\"]`.) Note that cron jobs won't cap the maximum number of workers the way supervisor/systemd can, so overlapping long-running messages risk starting an unwanted number of workers when using cron to drive `messenger:consume`.", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/message-queue.md:1-94"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"message queue|messenger|worker|transports\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 (grep -i worker|queue filter)"}, {"tool": "Read", "args": "platform/dev/6.7/guides/hosting/infrastructure/message-queue.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-09": {"query": "Where do I configure Business Events so that a mail is sent when an order is placed in Shopware 6.7?", "category": "edge", "option": "fs-wiki", "answer": "In Shopware 6.7, do not use the legacy Business Events screen for this \u2014 as of major release 6.4.8.0, Business Events was superseded by the Flow Builder for everything except the B2B-Suite; Business Events (Settings > Shop) is documented only as remaining relevant for B2B-Suite shops. Use Flow Builder instead: go to Settings > Automation > Flow Builder, click Add Flow, on the Flow tab choose the trigger `checkout.order.placed`, then add a 'Send mail' action (choosing Administrator, Customer, or custom addresses as recipients) and optionally Rule Builder conditions to scope it further. If you still need the legacy path (B2B-Suite only), open Settings > Shop > Business Events, click 'Add Business-Event', set Title, Active, the triggering Event = 'Order placed' (technical name `checkout.order.placed`), the Email template to send, and optionally a Sales Channel and Rule Builder rules \u2014 note that if you also fill in internal Email recipients on that event, the customer will not automatically receive the mail unless a second identical event without recipients is added.", "citations": ["platform/func/settings/Business-Events.md:21-43", "platform/func/settings/Flow-Builder.md:19-48"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"Business Event\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/Business-Events.md"}, {"tool": "Bash", "args": "grep -rln \"Flow Builder\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/Flow-Builder.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-70": {"query": "How do I implement a payment method in an app with `pay-url` and `finalize-url`, and what must the app server return in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Payment methods are defined in the app manifest with `pay-url` and, for asynchronous flows, `finalize-url` attributes; the presence of `finalize-url` is what marks a method as asynchronous rather than synchronous, and omitting `pay-url` leaves the transaction open with no app communication. The app server must be reachable from Shopware (e.g. via a tunneling service during local development). For a synchronous method, if `pay-url` is set, Shopware calls it and expects a JSON response with a `status` (and an optional `message` on failure). For an asynchronous method, Shopware `POST`s to the pay endpoint with `order`, `orderTransaction`, and a `returnUrl`; the app responds with a `redirectUrl` to send the customer to the payment provider; after the provider redirects the customer back, Shopware `POST`s to `finalize-url` with `orderTransaction` and the provider's query parameters, and the app again responds with `status`/`message`. The general response envelope for pay/finalize/validate is `{\"status\": \"authorize\", \"message\": \"optional failure reason\"}` (fields vary per stage; payment states include `open`, `paid`, `cancelled`, `refunded`, `failed`, `authorize`, `unconfirmed`, `in_progress`, `reminded`, `chargeback`). On the App PHP SDK, the flow is to resolve the shop, assemble the stage-specific context, and sign the response, e.g. `$shop = $shopResolver->resolveShop($serverRequest); $payment = $contextResolver->assemblePaymentPay($serverRequest, $shop); return $signer->signResponse(PaymentResponse::paid(), $shop);` \u2014 the Symfony Bundle instead type-hints action classes like `PaymentPayAction`/`PaymentFinalizeAction` as controller arguments and returns the `PaymentResponse` directly. Since Shopware 6.7.0.0, the app server must respond with a payment state whenever it intends to change the transaction state. The manifest payment identifier must not be changed after release, or Shopware creates a new payment method instead of reusing the existing one.", "citations": ["platform/dev/6.7/guides/plugins/apps/checkout/payment.md:17-66"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/apps/checkout/payment.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-06": {"query": "Which triggers and actions does the Flow Builder offer, and how do I make it send a mail when an order is placed?", "category": "func", "option": "fs-wiki", "answer": "The Flow Builder (Settings > Automation > Flow Builder) automates business processes by combining an event trigger, optional Rule Builder conditions, and one or more actions. A flow is created via Add Flow, with a General tab (Name, Description, Priority - the order of processing when multiple flows share a trigger, Active) and a Flow tab where the trigger, conditions, and actions are configured. Example trigger names include `checkout.order.placed`, `checkout.customer.register`, `state_enter.order.state.completed`, `state_leave.order_transaction.state.paid`, `newsletter.register`, and `mail.before.send`; the trigger `checkout.order.payment_method.changed` already sets order status to 'Open' automatically, so a flow must not also try to set it to 'Open'. Conditions use Rule Builder rules and branch True/False, with further conditions or actions chainable on either branch. Available actions (availability depends on the chosen trigger) include: Assign account status, Assign affiliate and campaign code (with an override option), Assign customer group, Generate a document, Send mail (recipients: Administrator - which reaches all admin-flagged users including external API users -, Customer, or custom addresses), Assign status (payment/shipping/order status, with interdependent status rules, e.g. Refunded/Partially Refunded/Chargeback require a prior Paid/Partially Paid status), Stop flow (halts the whole flow including parallel branches), Set download access (grant/revoke digital product downloads), Change custom field content (customer or order), and Add Tag / Remove Tag. Delayed Actions (Shopware Beyond plan) can delay an action by an Hour/Day/Week/Month/user-defined interval (format `SS.TT.WW.MM`). Custom Trigger (since 6.5.3.0) lets app-defined triggers from third-party systems participate in flows. Webhook Actions (Evolve plan+, requires Shopware Commercial) add a 'Call URL (Webhook)' action supporting GET/POST/PUT/PATCH/DELETE with URL, Parameters, Header-Parameters, Body, and Basic Auth. Share Flows (6.4.19.0+, Rise plan) lets flows be downloaded/uploaded between systems, with a Flow templates library of standard flows. To send a mail when an order is placed: create a new flow, set its trigger to `checkout.order.placed`, optionally add a Rule Builder condition to narrow when it fires, then add the 'Send mail' action and choose the recipient (Administrator, Customer, or a custom address) and the mail template to send.", "citations": ["platform/func/settings/Flow-Builder.md:19-52"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"flow builder|flow\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md | grep -i \"flow\""}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/Flow-Builder.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-08": {"query": "How do I set up a Nuxt project with Shopware Composable Frontends against my shop's Store API \u2014 endpoint, access token, and why do I get HTTP 412?", "category": "gap", "option": "fs-wiki", "answer": "The corpus does not have a Nuxt/Composable-Frontends local setup guide, nor any mention of an HTTP 412 error \u2014 I grepped the full `platform/dev/6.7` tree for '412' and found no genuine match (only coincidental hash substrings). The only Composable Frontends page in the corpus covers deploying an already-built Node.js frontend to Shopware PaaS Native (`kind: cfe` in `application.yaml`, Node versions 22/24/26, listening on port 3000, health endpoint `/api/healthz`, read-only filesystem except `/app/tmp`, and CDN/ISR cache headers `Surrogate-Control`/`Cache-Control`) \u2014 it says nothing about scaffolding a Nuxt project, the Store API endpoint URL, or an access token. What the corpus does document about the Store API endpoint/access token generally (not Nuxt-specific): the Store API concept page describes it as the customer-facing surface that Composable Frontends is built on, referencing the Stoplight API reference; and the integrations-api quick-start guide explains that a sales channel's Store API access key is copied from Sales Channels > [channel] > API access and sent in the `sw-access-key` header on requests like `GET /store-api/product`, and that regenerating the key invalidates the old one immediately (which would make any client still using the old key start failing). Neither page explains a 412 status specifically, so I cannot confirm what causes it from this corpus \u2014 this is a genuine gap.", "citations": ["platform/dev/6.7/products/paas/shopware/composable-frontends/_index.md:15-68", "platform/dev/6.7/concepts/api/store-api.md:14-29", "platform/dev/6.7/guides/development/integrations-api/_index.md:19-47"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"Composable Frontends\\|Nuxt\\|frontends-sdk\\|412\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/paas/shopware/composable-frontends/_index.md"}, {"tool": "Bash", "args": "grep -n \"412\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/concepts/api/store-api.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/apps/app-sdks/javascript/07-external-frontend.md"}, {"tool": "Bash", "args": "grep -rn \"412\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/concepts/api/store-api.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "partial"}, "dev-19": {"query": "I need to move long-running work in my plugin out of the request into the message queue \u2014 what does the handler class look like and how is it registered?", "category": "dev", "option": "fs-wiki", "answer": "First define a message class implementing `Shopware\\Core\\Framework\\MessageQueue\\AsyncMessageInterface` (for async handling) or `LowPriorityMessageInterface` (for lower-priority async handling), e.g. `class SmsNotification implements AsyncMessageInterface { public function __construct(private string $content) {} ... }`, and dispatch it via an injected `Symfony\\Component\\Messenger\\MessageBusInterface` (bus id `messenger.default_bus`), e.g. `$this->bus->dispatch(new SmsNotification($message));` \u2014 you can add metadata such as a delay by dispatching a `Symfony\\Component\\Messenger\\Envelope` wrapped with a stamp like `DelayStamp`. The handler class \u2014 the code that actually runs once that message is dispatched \u2014 is placed for example at `<plugin root>/src/MessageQueue/Handler/SmsHandler.php`, marked with the PHP attribute `#[AsMessageHandler]`, and implements `__invoke(SmsNotification $message)` to process it; multiple handlers can be defined for the same message. Handlers marked this way are automatically tagged with the `messenger.message_handler` service tag \u2014 no manual `services.php` tagging is required. Routing specific messages to a dedicated `low_priority` queue instead of the default `async` transport can be done via `shopware.yaml`'s `shopware.messenger.routing_overwrite` config key, but this queue is only available from Shopware 6.5.7.0 onward.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-handler.md:15-42", "platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md:20-84"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"message.queue\\|MessageHandler\\|messenger.message_handler\\|AsMessageHandler\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-handler.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-12": {"query": "I am on Shopware 6.6 \u2014 which file do I declare my plugin's service dependencies in, and how do I pass another service into the constructor?", "category": "dev", "option": "fs-wiki", "answer": "On Shopware 6.6 plugin service dependencies are declared in `<plugin root>/src/Resources/config/services.xml`, which references the Symfony schema `http://symfony.com/schema/dic/services/services-1.0.xsd`. To pass a service (e.g. the core `SystemConfigService`) into another service's constructor, add an `<argument type=\"service\" id=\"...\"/>` element inside the `<service>` definition, for example: `<service id=\"Swag\\BasicExample\\Service\\ExampleService\"><argument type=\"service\" id=\"Shopware\\Core\\System\\SystemConfig\\SystemConfigService\"/><\/service>`. The target class then declares a matching typed constructor parameter (e.g. `public function __construct(SystemConfigService $systemConfigService)`), stores it on a property, and can use it, e.g. `$this->systemConfigService->getString('core.basicInformation.shopName', ...)`.", "citations": ["platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/dependency-injection.md:14-55"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"services.xml\\|dependency-injection\\|dependency injection\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.6/index.md"}, {"tool": "Read", "args": "platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/dependency-injection.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-07": {"query": "My plugin needs to store its own data in a new table \u2014 how do I define a custom DAL entity with its definition, entity and collection class so I get a repository for it?", "category": "dev", "option": "fs-wiki", "answer": "First create the table via a plugin database migration, prefixing the table name (e.g. `swag_example`). Then add an `EntityDefinition` implementing `getEntityName()` (returns the table name, which also becomes the `<name>.repository` DI service id) and `defineFields()`:\n```php\nclass ExampleDefinition extends EntityDefinition\n{\n    public const ENTITY_NAME = 'swag_example';\n    public function getEntityName(): string { return self::ENTITY_NAME; }\n    protected function defineFields(): FieldCollection\n    {\n        return new FieldCollection([\n            (new IdField('id', 'id'))->addFlags(new Required(), new PrimaryKey()),\n            (new StringField('name', 'name')),\n            (new StringField('description', 'description')),\n            (new BoolField('active', 'active')),\n        ]);\n    }\n}\n```\n`created_at`/`updated_at` columns don't need explicit fields. Register the definition with the `shopware.entity.definition` tag and an `entity` attribute matching the entity name: `$services->set(ExampleDefinition::class)->tag('shopware.entity.definition', ['entity' => 'swag_example']);`. Add a custom `Entity` class (extends `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity`, uses `EntityIdTrait`, with one protected property plus getter/setter per field) and wire it into the definition via `getEntityClass()`. Add a custom `EntityCollection` (extends `EntityCollection`, overrides `getExpectedClass()`) and wire it via `getCollectionClass()`; without these two overrides, generic `ArrayEntity`/`EntityCollection` instances are used instead. Once registered, the repository is available under the `<entity-name>.repository` DI service id, just like a core entity's repository. Gotchas: entity class properties must be at least `protected` (never `readonly`) or the DAL cannot set values \u2014 this applies to any class extending the generic `Struct` class; the `storageName` in field classes is snake_case while the `propertyName` is lowerCamelCase; and `getEntityName()`'s return value doubles as both the database table name and the repository service id, so they must match exactly.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md:1-72"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -ipath \"*data-handling*\" -iname \"*.md\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-06": {"query": "How do I add a custom Flow Builder action?", "category": "dev", "option": "fs-wiki", "answer": "First, define an `Aware` interface for the data your action needs, extending `Shopware\\Core\\Framework\\Event\\FlowEventAware` and marked `#[IsFlowEventAware]`, e.g.:\n```php\n#[IsFlowEventAware]\ninterface TagAware extends FlowEventAware\n{\n    public const TAG = 'tag';\n    public const TAG_ID = 'tagId';\n    public function getTag();\n}\n```\nThen implement the action itself, extending `Shopware\\Core\\Content\\Flow\\Dispatching\\Action\\FlowAction`, defining a static `getName()`, a `requirements()` array, and a `handleFlow(StorableFlow $flow)` method. Use `$flow->getStore($key)` to read data provided by Aware interfaces and `$flow->getData($key)` for data from the original event or additional data. Example:\n```php\nclass CreateTagAction extends FlowAction\n{\n    public static function getName(): string { return 'action.create.tag'; }\n    public function requirements(): array { return [TagAware::class]; }\n    public function handleFlow(StorableFlow $flow): void\n    {\n        $config = $flow->getConfig();\n        if (!\\array_key_exists('tags', $config)) return;\n        $tagId = $flow->getStore(TagAware::TAG_ID);\n        $tag = $flow->getData(TagAware::TAG);\n        // build tag data, then $this->tagRepository->create($tagData, $flow->getContext());\n    }\n}\n```\nRegister the action with the `flow.action` service tag, including `priority` and `key`, e.g. `$services->set(CreateTagAction::class)->args([service('tag.repository')])->tag('flow.action', ['priority' => 600, 'key' => 'action.create.tag']);` \u2014 this tag makes the action appear in the `/api/_info/flow-actions.json` response, and `priority` determines its order. `requirements()` controls the action's scope: an empty array makes it available for every trigger; a list of Aware interfaces (e.g. `[OrderAware::class, CustomerAware::class]`) restricts it to matching events; or you can define a brand-new event implementing your custom Aware interface and register it via a `BusinessEventCollectorSubscriber` listening on `BusinessEventCollectorEvent::NAME`. Finally, in the Administration, define an action constant and a `GROUP`, add snippet labels, and override the `sw-flow-sequence-action` component to map the action name to a modal name (or to `onSaveActionSuccess` directly if no modal is needed), then import the override and any new component into `main.js`. Gotchas: the action's group defaults to `general` if `GROUP` is not defined (existing groups include `general`, `tag`, `customer`, `order`); and a subscriber that adds a new event to the trigger list must run with sufficiently high priority so it registers before other `BusinessEventCollectorEvent` subscribers, or awareness/actions may be missing.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-action.md:1-94"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -ipath \"*flow*\" -iname \"*.md\" | grep -iE \"action\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-action.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-04": {"query": "After upgrading to 6.7 my plugin fatals on load because core class properties now have native PHP types \u2014 which properties must I retype in my subclasses?", "category": "gap", "option": "fs-wiki", "answer": "The corpus's Upgrades and Migrations section for 6.7 (the index page plus its Administration sub-pages: Meteor Components, Pinia, Vite, Vue Migration Build removal, Vue 3, extension-translation, language-pack-migration, upgrade-shopware.md) does not document a change to core PHP class properties gaining native types, nor a list of specific properties that plugin subclasses must retype. The 6.7 upgrade guidance found is generic: review `RELEASE_INFO-6.7.md` and `UPGRADE-6.7.md`, run the `shopware-cli project upgrade` preflight, check breaking changes per layer (Core/Admin/Storefront/API), and keep migrations idempotent \u2014 it points you at the per-release UPGRADE files rather than enumerating this specific change itself. I found no dedicated page on native PHP property typing in core classes; this looks like a genuine gap in the corpus rather than content filed elsewhere (I grepped for 'native type', 'typed propert', 'strict_types', 'readonly propert' across the 6.7 tree and the upgrades-migrations directory specifically, with no hits).", "citations": ["platform/dev/6.7/guides/upgrades-migrations/_index.md:20-53"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"native.*type\\|property type\\|typed propert\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Bash", "args": "grep -in \"upgrade\\|breaking change\\|migration guide\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Bash", "args": "grep -rln \"typed propert\\|native type\\|strict_types\\|property promotion\\|readonly propert\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/_index.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "dev-36": {"query": "How do I register ACL privileges for my plugin's Administration module and check them in a component or template?", "category": "dev", "option": "fs-wiki", "answer": "Admin privileges are identifiers made of a `key` and a `role` joined by a dot (e.g. `product.viewer`). Register a privilege with the privilege service's `addPrivilegeMappingEntry`, conventionally from a `<component>/acl/index.js` file imported by `<component>/index.js`, called before the roles detail page is visited: `Shopware.Service('privileges').addPrivilegeMappingEntry({ category: 'permissions', parent: null, key: 'your_key', roles: { viewer: { privileges: ['entity_name:operation'], dependencies: [] }, editor: { privileges: [], dependencies: [] }, creator: { privileges: [], dependencies: [] }, deleter: { privileges: [], dependencies: [] } } })`. Use `category: 'permissions'` for normal CRUD-style roles (`viewer`/`editor`/`creator`/`deleter`) or `'additional_permissions'` for a non-CRUD custom role key. You can reuse another mapping's privileges with `Shopware.Service('privileges').getPrivileges('rule.viewer')`. Protect a route, menu
