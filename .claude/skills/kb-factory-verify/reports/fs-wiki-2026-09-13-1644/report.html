 entry, or settings item by adding `meta: { privilege: 'your_key.your_role' }` to its config; protect a shortcut by giving it an object with an `active()` method instead of a plain key binding. Add translation snippets at `sw.privileges.${category}.${key}.label` (plus `sw.privileges.${category}.${key}.${role_key}` for `additional_permissions`). To check a privilege anywhere, inject the `acl` service and call `acl.can('key.role')`, e.g. `this.acl.can('sales_channel.creator')` in a component, or `v-if=\"acl.can('review.editor')\"` in a template. To grant additional privileges to existing roles from PHP, override `Plugin::enrichPrivileges()`, returning e.g. `['product.viewer' => ['my_custom_privilege:read']]`. Note that ACL rules in the Administration UI only gate visibility/behavior in the UI \u2014 they can be bypassed via direct API calls, which are not protected by them \u2014 and granting a role's `viewer` privilege does not by itself grant access to the related Administration module; module access must be granted separately.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:14-72"], "toolCallLog": [{"tool": "Bash", "args": "grep -rli \"acl\\|privilege\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-27": {"query": "In Shopware 6.7, how do I extend a Storefront Twig template from my plugin with `{% extends %}` so I keep the core markup and other plugins' changes?", "category": "dev", "option": "fs-wiki", "answer": "Use Shopware's own `sw_extends` Twig tag rather than plain `{% extends %}` -- it supports multi-inheritance so other plugins' template changes are kept alongside yours, unlike a plain extends. Shopware looks for plugin templates in <plugin root>/src/Resources/views by default. Find the core template to override, e.g. storefront/layout/header/logo.html.twig, and recreate the identical path under the plugin's views directory: <plugin root>/src/Resources/views/storefront/layout/header/logo.html.twig. In that new file, extend the original with {% sw_extends '@Storefront/storefront/layout/header/logo.html.twig' %} and then override the desired block, e.g. {% block layout_header_logo_link %}...{% endblock %}. Use {{ parent() }} inside the override to append to (instead of replace) the original block content. After changing templates, clear the cache with ./bin/console cache:clear, and make sure the plugin is active and its theme (if any) is assigned to the sales channel. To discover available Twig variables on a page, call {{ dump() }} inside the template. Since Shopware 6.7.11.0 a Storefront Components system is also available for building reusable, atomic template components.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-templates.md:19-56"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"sw_extends\\|extending storefront template\\|extend.*Twig template\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-templates.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-69": {"query": "How does an app subscribe to an event like `product.written`, what does Shopware POST to the webhook URL, and how do I verify the request is genuine?", "category": "dev", "option": "fs-wiki", "answer": "An app subscribes by declaring a webhook in the manifest's `<webhooks>` section, naming the webhook and the `event` it listens to (e.g. `product.written`). When the event fires, Shopware POSTs a JSON payload of the shape: `{\"data\": {\"payload\": [{\"entity\": \"...\", \"operation\": \"...\", \"primaryKey\": \"...\", \"updatedFields\": []}], \"event\": \"...\"}, \"source\": {\"url\": \"...\", \"appVersion\": \"...\", \"shopId\": \"...\", \"eventId\": \"...\"}, \"timestamp\": 0}`. `source.url`, `appVersion`, `shopId`, and `eventId` identify the sending instance (`eventId` stays stable across webhook retries, since 6.4.11.0); `timestamp` (since 6.4.1.0) records when the webhook was handled and should be used to reject stale/replayed requests. Shopware also sends `sw-version` (since 6.4.1.0) and `sw-context-language`/`sw-user-language` (since 6.4.5.0) headers with the request. For `entity.written` payloads, only the `primaryKey` of the changed record is included, not the full entity \u2014 the app must fetch associations itself via the Shop API, and that fetched data may already be outdated by the time it arrives. To verify authenticity, check the `shopware-shop-signature` header: a SHA256 HMAC of the request body, signed with the secret assigned during registration \u2014 the same mechanism used for the registration confirmation request. A webhook can be restricted to only the live version by adding `onlyLiveVersion` to its manifest definition (since 6.5.7.0, default `false`), but this is only checked for `HookableEntityWrittenEvent` instances; other event types ignore it.", "citations": ["platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md:18-59"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-04": {"query": "How do I create a custom CMS element for Shopping Experiences?", "category": "dev", "option": "fs-wiki", "answer": "A CMS element is the smallest content primitive (text, image, video, product listing, etc.) placed inside a block's slot in Shopware's Shopping Experience (CMS) system; elements have no knowledge of their context and are always rendered inside a parent block's slot. The recommended Administration directory layout is:\n```text\nsrc/Resources/app/administration/src/\n\u2514\u2500\u2500 module/sw-cms/elements/<name>/\n    \u251c\u2500\u2500 index.js\n    \u251c\u2500\u2500 component/index.js + .html.twig + .scss\n    \u251c\u2500\u2500 config/index.js + .html.twig\n    \u2514\u2500\u2500 preview/index.js + .html.twig + .scss\n```\nSteps: 1) Import the element folder in `main.js`. 2) Register it via `Shopware.Service('cmsService').registerCmsElement({...})` with keys `name`, `label`, `component`, `configComponent`, `previewComponent`, `defaultConfig` (a map of config key to `{ source, value }`), and optionally `hidden` / `removable`. 3) Create the preview component (the thumbnail shown in the element picker). 4) Create the main component, mixing in `cms-element` and calling `this.initElementConfig('<name>')` in `created()`; provide fallback content so the element isn't invisible in the editor when unconfigured. 5) Create the config component (also mixing in `cms-element`, also calling `initElementConfig`), providing form fields for each `defaultConfig` key \u2014 prefer Shopware Meteor components. 6) For inheritance-aware fields (content inherited from the base layout vs. overridden per page), wrap them with the `sw-cms-inherit-wrapper` component, passing `field` and `element`. 7) For the Storefront, add a Twig template at `src/Resources/views/storefront/element/cms-element-<name>.html.twig` \u2014 the `cms-element-` prefix is required exactly as part of the filename. Gotchas: the Storefront template file name must include the `cms-element-` prefix exactly (e.g. `cms-element-dailymotion.html.twig`); clear the Storefront cache after adding new element templates; and by default, element configuration is inherited from the base layout unless explicitly overridden, though the UI may not make this obvious without the inherit-wrapper component.", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/cms/add-cms-element.md:1-59"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -ipath \"*cms*\" -iname \"*element*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/content/cms/add-cms-element.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-06": {"query": "I'm coming from Magento \u2014 what are the Shopware equivalents of store views, extensions, attribute sets and `di.xml`?", "category": "edge", "option": "fs-wiki", "answer": "The corpus has a dedicated Magento-to-Shopware term dictionary that answers three of the four terms directly. Store View/Store/Website maps to a 'Sales channel with different languages and domains' (Admin stays Admin). Extension maps to 'Plugin', with the Magento code-pool concepts split further: Community Code Pool -> Extensions/Community Store (Extensions > Store), Local Code Pool -> Extensions (Settings > My extensions), and Library -> `vendor/shopware/platform` plus custom plugins. Attribute Sets map to 'Custom field sets' (groups of custom fields), managed under Settings > Content > Custom fields; note that plain Magento Attributes split into two different Shopware concepts \u2014 Properties (which drive variants/filtering) and Custom fields (which extend a product with extra information) \u2014 depending on what the attribute was used for. The dictionary page does not cover `di.xml` at all (no dependency-injection mapping is listed among its development or settings mappings). Shopware 6 uses the Symfony service container instead of Magento's `di.xml`: services and their dependencies are declared in a plugin's `services.xml` (or PHP config) and injected via constructor autowiring, rather than Magento's XML-based dependency injection/preference system. [from memory]", "citations": ["platform/func/migration-en/magento-keywords.md:20-61"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"magento\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/"}, {"tool": "Read", "args": "platform/func/migration-en/magento-keywords.md"}], "notFoundClaim": false, "memoryClaims": ["Shopware 6 uses the Symfony service container instead of Magento's `di.xml`: services and their dependencies are declared in a plugin's `services.xml` (or PHP config) and injected via constructor autowiring, rather than Magento's XML-based dependency injection/preference system."], "sourceVerdict": "partial"}, "dev-30": {"query": "How do I add a custom filter to the Storefront product listing from my plugin, both the criteria side and the filter panel?", "category": "dev", "option": "fs-wiki", "answer": "For the criteria side, subscribe to \\Shopware\\Core\\Content\\Product\\Events\\ProductListingCollectFilterEvent and add a Filter instance built from name (unique filter name), filtered (true if currently active), aggregations (aggregations behind the filter), filter (the DAL filter added to the criteria), values (values added as currentFilter to the result), and exclude (configure exclusions). Example: build a Filter('isCloseout', (bool) $event->getRequest()->get('isCloseout'), [new FilterAggregation('active-filter', new MaxAggregation('active', 'product.isCloseout'), [new EqualsFilter('product.isCloseout', true)])], new EqualsFilter('product.isCloseout', true), $filtered) and add it via $event->getFilters()->add($filter). For the filter panel UI, extend src/Storefront/Resources/views/storefront/component/listing/filter-panel.html.twig and its component_filter_panel_items block (available since Shopware 6.4.8.0), calling {{ parent() }} and including one of the filter components (filter-boolean, filter-multi-select, filter-property-select, filter-range, filter-rating-select) via {% sw_include '@Storefront/storefront/component/listing/filter/filter-boolean.html.twig' with { name: 'isCloseout', displayName: 'Closeout' } %}. To position the filter relative to a specific existing one, extend that filter's own block instead, e.g. component_filter_panel_item_price.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/howto/add-listing-filters.md:16-74"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"custom filter\\|listing filter\\|ProductListingCriteriaEvent\\|ProductListingResultEvent\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/howto/add-listing-filters.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-03": {"query": "How do promotions and discount codes work, including individually generated codes?", "category": "func", "option": "fs-wiki", "answer": "Promotions are configured under Marketing > Promotions. The General tab sets Name, Priority (higher-priority-number promotions apply before lower ones), Valid from/until, Max. total uses, Max. uses per customer, and an Active toggle. For codes, a promotion can have none required, a single Fixed promotion code shared by all customers (optionally auto-generated), or Individual promotion codes generated per order, where each individual code can only be redeemed once. Individual code generation is controlled by code length, an optional prefix/suffix, or a custom pattern using `%s` for a random letter (A-Z) and `%d` for a random digit (0-9), e.g. `SW-%s%d%s%d%s-TEST`; regenerating codes invalidates the previous ones. The Conditions tab restricts which Sales channels the promotion applies to, whether it can be combined with other promotions ('Prevent combination with other promotions' / 'Do not combine with'), and adds Rule Builder conditions - Customer rules, Shopping cart rules, Order rules, and 'Promote sets of products' (set groups, which have Mode [Number/Value Gross/Value Net], Value, Sorting, and Product rules). If multiple rules of the same type are selected, only one needs to match (OR logic); requiring all conditions together needs separate promotions. The Discounts tab sets what the discount applies to (entire cart, shipping costs, entire product set, or a specific set group), optionally restricted to a range of products via Product rules/Apply to Nth item/Sort by, the discount Type (Absolute, Percentage, Fixed price, or Fixed unit price - a fixed price cannot exceed the normal price), the Value, a Maximum discount value (percentage type only), and per-currency value overrides; once a promotion has been used in an order its discount settings become read-only. In the storefront, customers enter a code via 'Enter voucher code' in the OffCanvas or normal shopping cart and confirm with the tick button, and the applied discount appears in the article overview. To track redeemed individual codes, open the promotion under Marketing > Promotions and check 'Redeemed', or filter the order overview by promotion code (fixed codes are looked up the same way). A gotcha: putting an 'exclude these products' rule in the shopping-cart conditions (instead of the discount's product rules) blocks the entire promotion whenever an excluded product is in the cart - exclusions should go in the discount's product rules instead so the rest of the cart still gets discounted, and only one individual promotion code can be redeemed per promotion at a time.", "citations": ["platform/func/marketing/promotions.md:19-52"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"promotion\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/marketing/promotions.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-40": {"query": "How do I upgrade a Composer-based Shopware project from 6.6 to 6.7 \u2014 which composer.json constraint do I change, and which console commands do I run afterwards?", "category": "dev", "option": "fs-wiki", "answer": "The recommended path is the Shopware CLI upgrade wizard, run from a clean Git working tree: `shopware-cli project upgrade`. It checks readiness, lets you pick the target version, checks Composer-managed extension compatibility, and resolves the target dependency set before applying the upgrade locally; for CI or a read-only check use `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run`. If the wizard can't be used, do a manual Composer update: 1) enable maintenance mode on a running environment with `bin/console sales-channel:maintenance:enable --all`; 2) adjust the Shopware version constraint in `composer.json` (and the `shopware/commercial` constraint too, if used) from the 6.6 range to the 6.7 range, then run `composer update --no-scripts` (the `--no-scripts` flag avoids running scripts that depend on not-yet-updated recipes); 3) optionally force-update Symfony Flex-managed config files with `composer recipes:update`; 4) finalize with `bin/console system:update:finish`, which runs the database migrations and recompiles themes; 5) disable maintenance mode with `bin/console sales-channel:maintenance:disable --all`. Failing to update the version constraint in `composer.json` before running `composer update` means the command just resolves to the currently installed version, so no actual upgrade happens \u2014 and skipping major versions in the upgrade path should be avoided unless that specific path has been explicitly tested.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md:19-55"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"6.6 to 6.7\\|upgrade.*composer\\|composer.json.*6.7\\|shopware/core.*version\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i"}, {"tool": "Read", "args": "platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-23": {"query": "How do I ship a mail template with my plugin so it is installed automatically, including a custom mail template type?", "category": "dev", "option": "fs-wiki", "answer": "Ship the mail template via a database migration (a Shopware\\Core\\Framework\\Migration\\MigrationStep subclass) instead of creating it through the Administration, so it installs automatically with the plugin. To reuse an existing mail template type, look up its ID (e.g. SELECT id FROM mail_template_type WHERE technical_name = \"contact_form\"), then insert into mail_template (columns id, mail_template_type_id, system_default -- must be 0, created_at) and into mail_template_translation per supported language (columns mail_template_id, language_id, sender_name, subject, description, content_html, content_plain, created_at), looking up each language_id by locale code via the language/locale tables. Use INSERT IGNORE INTO so re-running the migration on reinstall does not throw. To define a brand-new mail template type instead, first insert into mail_template_type (columns id, technical_name, available_entities -- a JSON map like {\"product\": \"product\"}, created_at) and mail_template_type_translation (columns mail_template_type_id, language_id, name, created_at) before creating the template entry itself. Do not remove mail templates on plugin uninstall, since other entities may still reference them.", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/mail/add-mail-template.md:17-47"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"mail template\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/content/mail/add-mail-template.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-02": {"query": "How do Rule Builder conditions work for shipping and payment methods?", "category": "func", "option": "fs-wiki", "answer": "The Rule Builder (Settings > Automation > Rule Builder) lets merchants define reusable rules - combinations of conditions and operators - used to control the availability of payment/shipping methods, promotions, prices, flows, and visibility. A rule consists of General information (Name, Description, Priority, Type, Tags) plus one or more Conditions, which are combined with AND (all must match) or OR (any must match); switching between AND/OR automatically creates subconditions. The condition catalog spans General (Sales Channel, Currency, Date range, Day of the week, Time range, etc.), Orders, Flow Builder, Customers, Marketing & Promotions, Items in shopping cart, and Shopping cart groups, and operators include Is equal to, Is not equal to, Is one of, Is not one of, Is greater/less than (or equal to), At least one, and All. On a shipping method (Settings > Commerce > Shipping) and a payment method (Settings > Commerce > Payment methods), an 'Availability rule' field uses these Rule Builder rules to decide when the method can be selected at checkout; a new rule can be created directly from that field, and leaving it blank (NULL) means unrestricted availability. A shipping method also has an optional Price matrix that can itself be restricted by a rule and can build price tiers from Rule Builder rules or from properties like item count, cart value, weight, or volume. To actually reach the customer, both payment and shipping methods still need to be assigned to the relevant Sales Channel (payment methods via the sales channel's settings, shipping methods via that sales channel's general settings, shipping methods section) - an availability rule alone is not enough. Worked examples include: freight forwarding by tagging target products and using `Position with tag | All | Is one of | <tag>` as the shipping method's availability rule (plus an AND-linked `Is none of` condition on competing methods); enabling cash-on-delivery shipping via `Applied payment method | Is one of | <payment method name>`; restricting shipping by `Shipping address: Zip code | Is one of | <postcode>`; and gating a payment method by `Customer group | Is one of | <group>`, optionally AND-linked with a minimum basket price. The Rule Builder's Assignments tab (read-only) shows every place a rule is currently used, including payment/shipping method availability and shipping cost calculation, and a rule in use cannot be deleted.", "citations": ["platform/func/settings/rules.md:32-68", "platform/func/settings/Paymentmethods.md:20-33", "platform/func/settings/shipping.md:19-48", "platform/func/tutorials-and-faq/rule-builder-example-rules.md:21-44"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"shipping|payment\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/rules.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/rules.md"}, {"tool": "Bash", "args": "grep -n -i \"availability rule|rule builder\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md | grep -i \"shipping|payment\""}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/Paymentmethods.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/shipping.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/tutorials-and-faq/rule-builder-example-rules.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-03": {"query": "How do I add a custom Store API route for a headless storefront?", "category": "dev", "option": "fs-wiki", "answer": "Follow the decoratable-route pattern Shopware uses internally for its Store API. First define an abstract route class with a `getDecorated()` method and a `load(Criteria, SalesChannelContext): ExampleRouteResponse` method, e.g. `abstract class AbstractExampleRoute { abstract public function getDecorated(): AbstractExampleRoute; abstract public function load(Criteria $criteria, SalesChannelContext $context): ExampleRouteResponse; }`. Then implement the concrete route class, tagged with the `#[Route(...)]` attribute using `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]`, and a route such as `#[Route(path: '/store-api/example', name: 'store-api.example.search', methods: ['GET','POST'], defaults: ['_entity' => 'swag_example'])]` on `load()`; `getDecorated()` throws `DecorationPatternException` when nothing decorates it yet, and any entity fields you want returned via the API need the `ApiAware` flag in their definition. Register the route class as a service, constructor-injecting the repository (e.g. `swag_example.repository`). Create a response class `ExampleRouteResponse extends StoreApiResponse` exposing the search result via a getter. Import the route via `<plugin root>/src/Resources/config/routes.php` using `$routes->import('../../Core/**/*Route.php', 'attribute');`, and verify it was discovered with `bin/console debug:router store-api.example.search` (this only confirms discovery, not that the service can be constructed or a request succeeds). To document the route for OpenAPI, add a JSON schema file under `<plugin root>/src/Resources/Schema/StoreApi/` (use the `AdminApi` subfolder for Admin API endpoints instead) so the internal `OpenApi3Generator` picks it up; check it at `/store-api/_info/stoplightio.html`. To also expose the route to the Storefront (rather than only headless clients), add a controller extending `StorefrontController`, scoped with `StorefrontRouteScope::ID`, that calls the route, and import it via `$routes->import('../../Storefront/**/*Controller.php', 'attribute');`; request it client-side with the existing `http-client` service or `fetch`. Note that the service definition connecting the route class to the DI container is a separate step from the `routes.php` import \u2014 a route class can be registered as a service without being a reachable endpoint until its attributes are imported.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md:1-58"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -ipath \"*store-api*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-64": {"query": "How do I get an Admin API OAuth token \u2014 with client_credentials for an integration, or the password grant for local testing \u2014 and how long is each token valid?", "category": "dev", "option": "fs-wiki", "answer": "For a real integration, use the `client_credentials` grant (the default, recommended approach): create an integration in Administration under Settings \u2192 System \u2192 Integrations with the 'Administrator' toggle enabled, note its access key ID (= OAuth `client_id`) and secret access key (= `client_secret`), then `POST /api/oauth/token` with `{\"grant_type\": \"client_credentials\", \"client_id\": \"...\", \"client_secret\": \"...\"}`. The response contains `token_type`, `expires_in`, and `access_token`. For local development only, there is a password-grant shortcut: `POST /api/oauth/token` with `grant_type: password`, `client_id: administration`, `scopes: write`, and the default Administration `username`/`password`; the response additionally contains a `refresh_token`. The wiki explicitly warns the password grant should not replace `client_credentials` for integrations or reproducible setups. The corpus does not state the exact numeric validity duration for either token type \u2014 both responses expose an `expires_in` field, and callers should read that value rather than assume a fixed lifetime.", "citations": ["platform/dev/6.7/guides/development/integrations-api/_index.md:25-47", "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md:27-45"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"client_credentials\\|password grant\\|oauth\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | head -20"}, {"tool": "Read", "args": "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/development/integrations-api/_index.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "partial"}, "func-08": {"query": "How do custom field sets work \u2014 entity assignment, field types and technical name \u2014 and can a custom field be written through the Store API?", "category": "func", "option": "fs-wiki", "answer": "Custom fields (Settings > System > Custom fields) let merchants add their own data fields to entities like products or categories, for use in the Rule Builder, storefront templates, or Shopping Experiences. Custom fields are grouped into sets; a set is assigned to one or more program areas (entities such as products, categories) via New set, which also requires a unique, unchangeable technical name, a Position, and a translatable Label - a set created with no assigned area exists but is unavailable anywhere. Within a set, fields are created via New custom field; each field always requires a technical name that, like the set's, cannot be changed after creation. Field types include Select, Object selection (references products, categories, countries, shipping/payment methods, etc. - its object type cannot change after creation), Text field, Media, Number (integer/float, with Steps, Min, Max), Date/Time, Checkbox, Active/Inactive switch (boolean '0'/'1'), Text Editor, and Color picker. Common per-field options are Technical name, Position, 'Available in shopping carts' (required to use the field in the Rule Builder or custom templates), 'Modifiable via Store API' (marks the field public), Label, Placeholder, and Help text. Yes, a custom field can be written through the Store API - enabling the 'Modifiable via Store API' flag on the field makes it publicly writable, but the documentation explicitly warns not to enable this for sensitive data such as customer information, since it exposes the field publicly. Custom fields are automatically created as snippets in all snippet sets, so no database changes are needed. A gotcha: technical names must avoid Twig special characters such as `-` or `#`, or product exports can error; and custom fields must be edited in the store's default language, since other-language edits override only that language and a rule relying on the field can silently fail to apply for un-maintained languages.", "citations": ["platform/func/settings/custom-fields.md:35-65"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"custom field\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/custom-fields.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-55": {"query": "How do the breaking storefront accessibility changes reach my theme in Shopware 6.7, and what must an extension that overrides the affected Twig blocks do?", "category": "dev", "option": "fs-wiki", "answer": "Shopware rolls out storefront accessibility improvements \u2014 including breaking ones \u2014 behind the `ACCESSIBILITY_TWEAKS` feature flag rather than in one big \"accessibility release\". Breaking accessibility changes ship inside regular minor releases but stay inactive by default until the flag is set (`ACCESSIBILITY_TWEAKS=1` in `.env`, the same mechanism as major version flags like `V6_7_0_0`); with major version v6.7.0 these changes become the default. A change is typically implemented with both the old and new markup guarded by `feature('ACCESSIBILITY_TWEAKS')` in Twig, e.g. wrapping old markup/block in the `else` branch and new markup/block in the `if` branch (example: old block `component_list_items` inside a `<div>` vs. new block `component_list_items_inner` inside a `<ul>`). An extension overriding the old block must also implement the new block (e.g. `component_list_items_inner`) via `{% sw_extends %}` so it keeps working once the flag/version default flips \u2014 otherwise, if a breaking accessibility change ships without the extension adapting, the extension's assumption of old markup can render incorrect HTML once the core switches structure. Breaking accessibility changes are not enabled by default before v6.7.0; Shopware targets WCAG 2.1 AA and BITV 2.0, using accessible Bootstrap components and automated E2E testing with Playwright plus an axe reporter (also Google Lighthouse, AXE DevTools, WAVE, and manual keyboard/screen-reader checks).", "citations": ["platform/dev/6.7/guides/development/accessibility/storefront-accessibility.md:1-81"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"accessibility\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/development/accessibility/storefront-accessibility.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-07": {"query": "How do I create a media entity from a file on disk in PHP from my plugin (e.g. during an import) and generate its thumbnails?", "category": "gap", "option": "fs-wiki", "answer": "I could not find this documented in the corpus. The Media guide category (`platform/dev/6.7/guides/plugins/plugins/content/media/_index.md`) only lists three plugin guides \u2014 preventing deletion of plugin-referenced media files, adding a custom media file extension, and remote/CDN thumbnail generation \u2014 none of which covers programmatically creating a media entity from a server-side file path (e.g. via a `MediaService`/`FileSaver`-style API) or triggering thumbnail generation for it in PHP. A broad grep across the entire `platform/dev/6.7` tree for `FileSaver`, `saveFile`, `MediaService`, `UploadedFile`, and `generateThumbnails` returned no matches. The only media-creation/upload material in the corpus is either merchant-facing (uploading through the Administration UI, `platform/func/content/media.md`) or app-side (the JavaScript App SDK's `HttpClient` helpers `uploadMediaFile`/`createMediaFolder`, which talk to the Admin API over HTTP rather than writing a media entity directly in PHP). This looks like a genuine gap in the corpus rather than a term/synonym mismatch \u2014 I also checked the synonyms file for 'media' entries and found nothing pointing at server-side PHP media creation from disk.", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/media/_index.md:19-31"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"MediaService\\|thumbnail\\|uploadMediaFile\\|createMediaFolder\\|media entity\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/content/media"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/content/media/_index.md"}, {"tool": "Bash", "args": "grep -rln \"FileSaver\\|saveFile\\|MediaService\\|UploadedFile\\|generateThumbnails\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Bash", "args": "grep -in \"media\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/part-1.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "dev-15": {"query": "How do I work out which event Shopware actually dispatches for a given action, for example after a product is loaded or a page is rendered?", "category": "dev", "option": "fs-wiki", "answer": "The wiki lists several techniques depending on the event category. DAL events are named `entity_name.event`, e.g. `product.written`, `product.deleted`, `product.loaded`; many entities also expose an 'Event class' of constants (e.g. `ProductEvents`) findable by searching for the term `@Event`, and you subscribe with either the constant or the raw string. General PHP events can be found by reading core code for `$this->eventDispatcher->dispatch($someEvent, $someEvent->getName())` (the event name is the dispatch()'s second argument, or the class name if omitted), by searching for `extends NestedEvent`, `extends Event`, `implements ShopwareEvent`, or `->dispatch`, or by checking a service's constructor for `EventDispatcherInterface`. Page-loaded events: `GenericPageLoader` dispatches a `GenericPageLoadedEvent` on page load \u2014 search for `PageLoadedEvent`. Criteria events (e.g. `ProductListingCriteriaEvent`) fire when specific default entities load via a `Criteria` but are hand-written, not auto-generated for every entity \u2014 search for `CriteriaEvent`. Route events are fine-grained per-route aliases of Symfony kernel events named `{route}.request`, `{route}.response`, `{route}.render` (Storefront, before Twig rendering), `{route}.encode` (Store-API, before JSON encoding, since 6.6.11.0) and `{route}.controller` (since 6.6.11.0), using the Symfony route name in place of `{route}` (e.g. `store-api.product.listing.request`). Business events (e.g. customer registration, order placement) are found by searching for `implements BusinessEventInterface` or `implements MailActionInterface`. The simplest general technique is opening the Symfony profiler's 'Events' tab to see every event fired during the current request with its name. For Storefront JS, custom events are published via `this.$emitter.publish('someEvent', ...)` (search `$emitter.publish`); Administration Vue events fire via `this.$emit('some-event', ...)` (search `$emit`).", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/event/finding-events.md:20-67"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"debug:event\\|list of events\\|finding events\\|which event\\|event reference\\|discover events\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/event/finding-events.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-52": {"query": "What must a plugin database migration class implement in Shopware 6.7, and where does the database cleanup on uninstall belong?", "category": "dev", "option": "fs-wiki", "answer": "Every migration must extend `Shopware\\Core\\Framework\\Migration\\MigrationStep` and implement `getCreationTimestamp(): int` (returning the timestamp embedded in the class name) and `update(Connection $connection): void`, where all schema/data changes go. Migration files live by default in `<plugin root>/src/Migration`, named `Migration<timestamp><Description>.php`, and can be scaffolded via `./bin/console database:create-migration -p <Plugin> --name <Description>` or generated with SQL from an entity via `./bin/console dal:migration:create --bundle=<Plugin> --entities=...`; they are run with `./bin/console database:migrate <Plugin> --all` (or automatically on plugin install/update). There is no migration rollback, so database cleanup on plugin removal belongs in the plugin's `uninstall` lifecycle method, not in the migration itself. Note also that `MigrationStep::updateDestructive()` is only used by Shopware core for delayed, major-version destructive changes and is not invoked by plugin install/update.", "citations": ["platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md:1-78"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"MigrationStep\\|database migration\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-02": {"query": "What's the plugin lifecycle in Shopware \u2014 install, activate, uninstall \u2014 and how does `keepUserData` work?", "category": "dev", "option": "fs-wiki", "answer": "A Shopware plugin's base class (`Shopware\\Core\\Framework\\Plugin`, extending `Shopware\\Core\\Framework\\Bundle` and Symfony's `Bundle`), typically `<plugin root>/src/SwagBasicExample.php`, exposes lifecycle methods for each stage. `install(InstallContext $installContext)` registers entities (e.g. payment methods), creates initial data and prepares requirements \u2014 `InstallContext` exposes plugin/Shopware versions, the system `Context`, plugin migrations, and auto-migration control (`isAutoMigrate`/`setAutoMigrate`). `activate(ActivateContext $context)` activates entities created in `install()` or creates data that requires the plugin to be active. `deactivate(DeactivateContext $context)` deactivates entities from `install()`, or removes entities that cannot be safely left active. `update(UpdateContext $context)` handles non-database adjustments, feature toggles, or logic depending on old/new plugin versions \u2014 database changes belong in plugin migrations instead; `UpdateContext` adds `getUpdatePluginVersion()` and `getCurrentPluginVersion()`. `postInstall(InstallContext $context)` and `postUpdate(UpdateContext $context)` run after a successful install/update completes. `uninstall(UninstallContext $context)` removes or cleans up plugin data; `UninstallContext` adds `keepUserData()`. `keepUserData()` must be respected: if it returns `true` (the merchant chose to keep data when uninstalling), persistent plugin data must not be deleted, e.g.:\n```php\npublic function uninstall(UninstallContext $context): void\n{\n    if ($uninstallContext->keepUserData()) {\n        return;\n    }\n    // Remove or deactivate the data created by the plugin\n}\n```\nOther gotchas: avoid creating fully active business data in `install()` since the plugin is not yet enabled \u2014 create data that can be safely activated/deactivated (e.g. a payment method) and only activate it in `activate()`; and do not blindly delete entities in `uninstall()` \u2014 e.g. a payment method used on real orders should be deactivated, not removed, to avoid leaving orders in a broken state.", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md:1-62"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*lifecycle*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-71": {"query": "How does an app define its own custom entities in Shopware 6.7 and read them back through the API?", "category": "dev", "option": "fs-wiki", "answer": "An app defines custom entities by registering them in the app's `Resources/entities.xml`, validated against the `entity-1.0.xsd` schema. Each `<entity>` element (e.g. `custom_entity_bundle`) declares `<fields>` such as `string`, `price`, and `many-to-many` fields, with attributes like `required`, `translatable`, and `store-api-aware` controlling exposure. Registered entities automatically get a repository, which can be queried from App Scripts via `services.repository.search('custom_entity_bundle', criteria)`, and via the Admin API at `POST /api/search/custom-entity-bundle`. To let a custom field reference a custom entity as an 'Entity Select', add `custom-fields-aware=\"true\"` and `label-property=\"name\"` to the `<entity>` element (the label-property field must be a string field that exists in `fields`); without a snippet the entity shows as `custom_entity_bundle.label`, so a translation should be added under `Resources/app/administration/snippet/en-GB.json`. Since Shopware 6.4.15.0, entity names may use the `ce_` shorthand prefix (e.g. `ce_bundle`) to avoid database name-length restrictions, and that prefix must then be used consistently in repository and API calls (e.g. `POST /api/search/ce_blog`). Custom entities with custom-fields support require Shopware 6.5.1.0+, custom entities cannot be renamed once created (renaming deletes all existing data), and associations referencing core tables still require the corresponding manifest permissions.", "citations": ["platform/dev/6.7/guides/plugins/apps/custom-data/custom-entities.md:1-55"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"custom entit\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/apps/custom-data/custom-entities.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-04": {"query": "How do I fetch products with `GET /sales-channel-api/v3/product` on Shopware 6.7?", "category": "edge", "option": "fs-wiki", "answer": "That exact route does not exist on Shopware 6.7. The corpus's Store API page describes today's customer-facing HTTP surface as simply the 'Store API' \u2014 'the customer-facing surface of Shopware, designed for storefront/frontend interactions such as product browsing, cart handling, checkout, and customer account management' \u2014 and links to its Stoplight reference; it never mentions a `/sales-channel-api/v3/...` prefix or a `v3` version segment. The only other hit for the string 'sales-channel-api' in the whole corpus is a security-measures FAQ page that just notes `/store-api` and `/sales-channel-api` visibility is controlled per field via flags, without giving a route. `sales-channel-api` was Shopware's early (6.0-era) name for this API before it was renamed to the Store API (mounted at `/store-api/...`, e.g. `POST /store-api/product` for listing/searching products); there was never a `v3` version of it. So to fetch products in 6.7 you would call the current Store API product endpoints (documented via the Stoplight reference), not the legacy `sales-channel-api/v3` path named in the question. [from memory]", "citations": ["platform/dev/6.7/concepts/api/store-api.md:14-30", "platform/func/tutorials-and-faq/security-measures.md:49-60"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"sales-channel-api\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/"}, {"tool": "Bash", "args": "grep -n -i \"sales-channel-api\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/tutorials-and-faq/security-measures.md"}, {"tool": "Bash", "args": "grep -rln -i \"store-api/product|/store-api\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/"}, {"tool": "Read", "args": "platform/dev/6.7/concepts/api/store-api.md"}], "notFoundClaim": true, "memoryClaims": ["`sales-channel-api` was Shopware's early (6.0-era) name for this API before it was renamed to the Store API (mounted at `/store-api/...`, e.g. `POST /store-api/product` for listing/searching products); there was never a `v3` version of it."], "sourceVerdict": "partial"}, "dev-37": {"query": "How do I set up and run PHPUnit integration tests for my Shopware plugin, including tests that boot the kernel?", "category": "dev", "option": "fs-wiki", "answer": "First install the flex template `dev-tools` package (`composer require --dev dev-tools`) to be able to use PHPUnit tests. Create a `phpunit.xml` in the plugin root (it can be autogenerated via `bin/console plugin:create`) with a bootstrap of `tests/TestBootstrap.php`, e.g.: `<phpunit bootstrap=\"tests/TestBootstrap.php\" executionOrder=\"random\"><coverage><include><directory>./src/<\/directory><\/include><\/coverage><php><server name=\"KERNEL_CLASS\" value=\"Shopware\\Core\\Kernel\"/><env name=\"APP_ENV\" value=\"test\"/><\/php><testsuites><testsuite name=\"migration\"><directory>Migration/Test<\/directory><\/testsuite><testsuite name=\"Example Testsuite\"><directory>Test<\/directory><\/testsuite><\/testsuites><\/phpunit>`. `plugin:create` also generates `tests/TestBootstrap.php`, which uses `Shopware\\Core\\TestBootstrapper` with `->addCallingPlugin()`, `->addActivePlugins(...)`, and `->setForceInstallPlugins(true)` \u2014 the latter is what ensures your plugin gets installed and activated even when the test database already exists. For integration tests that boot the kernel, extend `PHPUnit\\Framework\\TestCase` and use the `Shopware\\Core\\Framework\\Test\\TestCaseBase\\IntegrationTestBehaviour` trait, which gives automatic database transactions and cache clearing per test. For migration tests, use the `Shopware\\Core\\Framework\\Test\\TestCaseBase\\KernelTestBehaviour` trait for container/database access, naming the test class `<MigrationClassName>Test`. To vary service behavior only during tests, add `<plugin root>/Resources/config/services_test.php`, which overrides `Resources/config/services.php` for the test environment (arguments, aliases, or parameters). Run the tests with `./vendor/bin/phpunit --configuration=\"custom/plugins/SwagBasicExample\" --testsuite \"migration\"` (omit `--testsuite` to run all testsuites), and use `--filter <ClassOrMethod>` to run a single class or method.", "citations": ["platform/dev/6.7/guides/development/testing/unit/php-unit.md:18-62"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"phpunit\\|integration test\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins -i"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -ipath \"*test*\" | grep -v store"}, {"tool": "Bash", "args": "grep -rln \"KernelTestBehaviour\\|phpunit.xml\\|write-unit-tests-for-plugins\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i"}, {"tool": "Read", "args": "platform/dev/6.7/guides/development/testing/unit/php-unit.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-49": {"query": "My storefront controller still uses the `@Route` and `@RouteScope` annotations from 6.4 \u2014 what is the attribute form in Shopware 6.7 and how are the routes wired?", "category": "dev", "option": "fs-wiki", "answer": "Prior to Shopware 6.4.11.0 the route scope was set via the `@RouteScope` annotation; this was deprecated as of the 6.5 major version in favor of PHP 8 attributes. In 6.7, extend `StorefrontController` and declare the storefront route scope as a class-level `#[Route]` attribute default, then use per-method `#[Route]` attributes for the actual paths:\n\n```php\n#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]])]\nclass ExampleController extends StorefrontController\n{\n    #[Route(path: '/example', name: 'frontend.example.example', methods: ['GET'])]\n    public function showExample(): Response\n    {\n        return $this->renderStorefront('@SwagBasicExample/storefront/page/example.html.twig', [\n            'example' => 'Hello world'\n        ]);\n    }\n}\n```\n\nRoute names should use the `frontend`, `widgets`, `payment`, `api` or `store-api` prefix so the router recognizes the route as a Storefront route; the route scope can also be set per-route instead of class-wide. Wiring: register the controller as a public service in `services.php`, calling `setContainer`: `$services->set(ExampleController::class)->public()->call('setContainer', [service('service_container')]);`. Then import the controller's routes in `routes.php` using the `attribute` type: `$routes->import('../../Storefront/Controller/*Controller.php', 'attribute');`. Since Shopware 6.7.2.0, a plugin can allow custom route names without one of the standard prefixes by adding a `storefront.router.allowed_routes` config entry (e.g. `storefront: router: allowed_routes: [swag.test.foo-bar]`) and loading it from the plugin's `build()` method.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:18-83"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"RouteScope|storefront controller|@Route|route attribute\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-11": {"query": "On Shopware 6.7, which file do I declare my plugin's services in, and how do I get a core service passed into my service's constructor?", "category": "dev", "option": "fs-wiki", "answer": "In Shopware 6.7, plugin services are declared in `src/Resources/config/services.php`, using the Symfony `ContainerConfigurator`. You can either set `autowire()` and `autoconfigure()` to true and `load()` the plugin namespace so every class under `src` is registered automatically (excluding non-service directories like Resources/Migration), or declare each service explicitly with `$services->set(ExampleService::class)`. To get a core service such as `SystemConfigService` passed into your service's constructor, simply add it as a typed constructor parameter (e.g. `private SystemConfigService $systemConfigService`) \u2014 if autowire/autoconfigure are enabled it is injected automatically; if the service was declared explicitly, add it as an argument: `$services->set(ExampleService::class)->args([service(SystemConfigService::class)]);` using the `service()` function from `Symfony\\Component\\DependencyInjection\\Loader\\Configurator`. Note that XML service configuration is deprecated starting with Symfony 7.4 and unsupported in Symfony 8.0, and by default all Shopware 6 services are private.", "citations": ["platform/dev/6.7/guides/plugins/plugins/services/add-custom-service.md:14-49", "platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md:17-57"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "cat .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md | head -100"}, {"tool": "Bash", "args": "grep -n \"services.xml\\|dependency injection\\|service container\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md"}, {"tool": "Bash", "args": "grep -n \"add-custom-service\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/services/add-custom-service.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-34": {"query": "How do I extend an existing Administration component and its Twig blocks from my plugin, for example to change the dashboard headline?", "category": "dev", "option": "fs-wiki", "answer": "Use `Shopware.Component.override('component-name', { template })` to replace an existing component's behavior in place (e.g. overriding `sw-dashboard-index` to change its headline), or `Shopware.Component.extend('new-name', 'base-name', { template })` to create a new component based on an existing one. Provide a Twig override template that uses `{% block %}` to redefine a block and `{% parent %}` to keep and extend the inherited markup instead of fully replacing it, for example: `{% block card_header %}<h1 class=\"custom-header\">{{ header }}<\/h1>{% endblock %}` or `{% block card_content %}{% parent %}<div class=\"card-custom-content\">...<\/div>{% endblock %}`. To extend a method or computed property while keeping the original logic, call `this.$super('methodName')` inside the overriding component. The override/extension file must be registered/imported from the plugin's Administration `main.js`. There is also an experimental Composition-API-based extension system (`Shopware.Component.createExtendableSetup` / `Shopware.Component.overrideComponentSetup()`), but it currently only supports overriding (not extending) components already written with the Composition API, has no committed release timeline, and Options API components should keep using the `Component.override`/`Component.extend` factory approach. When multiple plugins override the same component, they are applied in registration order.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-components.md:18-73"], "toolCallLog": [{"tool": "Bash", "args": "ls .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-components.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-03": {"query": "My ERP integration stopped logging in after the 6.7 upgrade \u2014 what changed in the Admin API OAuth flow (`/api/oauth/authorize`, the `scope` format)?", "category": "gap", "option": "fs-wiki", "answer": "The corpus documents the Admin API's `client_credentials` and password-grant OAuth flows via `/api/oauth/token` (with `client_id`/`client_secret`, or `grant_type: password` with `scopes: write` for the local shortcut), but it does not mention an `/api/oauth/authorize` endpoint at all, nor any 6.7-specific change to the `scope` parameter's format. The two developer pages covering Admin API auth in 6.7 (the integrations-api quick start and the follow-up Authentication and API Requests page) describe the same token-endpoint flow without noting any breaking change between versions. I found no page describing a 6.7 OAuth breaking change for ERP/system-to-system integrations \u2014 this looks like a genuine gap in the corpus rather than content filed under another term (I also grepped for 'oauth' and 'scope=' across platform/dev/6.7 without turning up anything closer).", "citations": ["platform/dev/6.7/guides/development/integrations-api/_index.md:19-47", "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md:19-45"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"oauth/authorize\\|scope=\\|OAuth\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/integrations-api/_index.md"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "dev-43": {"query": "My admin plugin still ships a webpack.config.js \u2014 how do I move the administration build to Vite for Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Shopware 6.7 replaces the Webpack-based build for the Administration's Vue.js application with Vite (Webpack had become slow and its maintainers/loaders no longer receive significant updates); this is described as a future-development-roadmap article so timelines/details may still change. This matters specifically for a plugin that extends the Administration build via a custom `webpack.config.js` \u2014 apps are unaffected since their build is already decoupled from Shopware. To migrate: 1) create `vite.config.mts` in `YourApp/src/Resources/app/administration/src` (replacing the old `webpack.config.js` that lived under `YourApp/src/Resources/app/administration/build/`); 2) remove the old `webpack.config.js`; 3) remove Webpack-related dependencies from `package.json`; 4) add the Vite dependencies to `package.json`. A minimal `vite.config.mts` uses `defineConfig` from `vite`, e.g. setting `resolve.alias` entries. The new system can be tested behind the `ADMIN_VITE` feature flag. Bundle/plugin info is written to `<shopwareRoot>/var/plugins.json` by `Shopware\\Core\\Framework\\Plugin\\Command\\BundleDumpCommand` (run via `bin/console bundle:dump`, or as part of `composer build:js:admin`/`watch:admin`). The core Vite config lives at `<shopwareRoot>/src/Administration/Resources/app/administration/vite.config.mts` (core only); extensions are built via `<shopwareRoot>/src/Administration/Resources/app/administration/build/plugins.vite.ts`, still invoked through `composer build:js:admin`. In production, asset info comes from the `/api/_info/config` API call and is loaded via the Symfony bundle `pentatrion_vite` plus `entrypoints.json` (generated by `vite-plugin-symfony`); in dev/HMR mode, the `shopware-vite-plugin-serve-multiple-static` plugin serves an `sw-plugin-dev.json` file requested by `application.ts`. A gotcha: Vite can only hot-reload `.vue` files, so HMR stays limited until templates fully move to Single File Components; the `vue-globals` plugin rewrites Vue imports to destructure from `Shopware.Vue` to avoid multiple Vue instances, and `override-component` auto-registers `*.override.vue` files via `Shopware.Component.registerOverrideComponent`.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/vite.md:15-58"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"vite\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/administration/vite.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-45": {"query": "Shopware.State is deprecated in 6.7 \u2014 how do I convert my administration Vuex module into a Pinia store?", "category": "dev", "option": "fs-wiki", "answer": "With Shopware 6.7, Vuex is replaced by Pinia as the Administration's state management library. Register a store with `Shopware.Store.register('<storeName>', { state, getters, actions })`, where `state` must be a function returning the initial state (not a static object), e.g.:\n\n```javascript\nconst store = Shopware.Store.register('<storeName>', {\n    state: () => ({ /* initial state */ }),\n    getters: { /* ... */ },\n    actions: { /* ... */ },\n});\nexport default store;\n```\n\nA store can also be registered with an `id` property instead of a name argument; re-registering an existing store id overwrites it, and `Shopware.Store.unregister('<storeName>')` removes one. To register a store you simply import its file (`import './state/products.state'`), which replaces the old `Shopware.State.registerModule('product', productsStore)` pattern. Key differences from Vuex: mutations are removed \u2014 update state directly inside actions (`this.productName = newName`); getters cannot share a name with a state property since both are exposed at the same level; for TypeScript, define `StoreType` via `ReturnType<typeof store>` and extend the global `PiniaRootState` interface with it; stores can also be defined as composables returning reactive refs/computed/functions (Pinia devtools only track returned variables and functions); and read access changes from `Shopware.State.get('<storeName>')` to `Shopware.Store.get('<storeName>')`. For tests, import the store file to register it and call `store.$reset()` in `beforeEach`; component tests using Pinia stores should call `setActivePinia(pinia)` with a `createPinia()` instance and pass `plugins: [pinia]` to the mount config.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/pinia.md:15-55"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/administration/pinia.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-56": {"query": "Header and footer are loaded through ESI sub-requests in Shopware 6.7, so page data is gone in my header template \u2014 how do I pass my own data into the header/footer now?", "category": "dev", "option": "fs-wiki", "answer": "To pass current-page data into the ESI request, extend `base.html.twig` and override the `base_esi_header` (or `base_esi_footer`) block to merge extra parameters into `headerParameters` (or `footerParameters`): `{% sw_extends '@Storefront/storefront/base.html.twig' %} {% block base_esi_header %} {% set headerParameters = headerParameters|merge({ 'vendorPrefixPluginName': { 'activeRoute': activeRoute } }) %} {{ parent() }} {% endblock %}`. Because `headerParameters`/`footerParameters` are passed as query parameters to the header/footer ESI route, they must contain scalar values only. Read the value back in the header template by extending `layout/header.html.twig` and accessing `headerParameters.vendorPrefixPluginName.activeRoute`. In a plugin, `StorefrontRenderEvent` can also add data \u2014 guard it by checking the current route is `frontend.header` (the header ESI sub-request route name), then set `headerParameters` via `$event->setParameter('headerParameters', $headerParameters)`. It is also possible to load an entirely custom header/footer template (as core does for the checkout confirm page), but this overwrites customizations from every other extension, and any custom template must still receive the `header`/`footer` data it extends. For data unrelated to the current page, the separate 'Add data to storefront page' guide applies instead.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-header-footer.md:1-75"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"ESI\\|sub-request\\|subrequest\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-header-footer.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-16": {"query": "How do I run plugin logic whenever an order is written, and find out exactly which fields changed?", "category": "dev", "option": "fs-wiki", "answer": "Implement `Symfony\\Component\\EventDispatcher\\EventSubscriberInterface` and subscribe to `Shopware\\Core\\Checkout\\Order\\OrderEvents::ORDER_WRITTEN_EVENT`, checking `$event->getContext()->getVersionId() !== Defaults::LIVE_VERSION` so you only react to the live version (editing an order in admin creates a new draft version merged later into live, which is usually not the state to react to). A changeset of exactly what changed is not generated by default for performance reasons \u2014 to force one, additionally subscribe to `PreWriteValidationEvent::class`, and inside that listener, for each item in `$event->getCommands()` that is `instanceof ChangeSetAware` and whose `getEntityName() === OrderDefinition::ENTITY_NAME`, call `$command->requestChangeSet()`. Then, in the `ORDER_WRITTEN_EVENT` handler, read the changeset via `$result->getChangeSet()` on each item of `$event->getWriteResults()`. Note an 'insert' command cannot generate a changeset since nothing changed yet, and changeset generation should always be narrowed to the entity and live version needed since it affects performance.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/order/listen-to-order-changes.md:16-53"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"event.subscriber\\|EventSubscriberInterface\\|listening-to-events\\|event_subscriber\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md (result from dev-14 search included listen-to-order-changes.md)"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/order/listen-to-order-changes.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-10": {"query": "How do dynamic product groups work in the administration and where can the resulting group be used?", "category": "func", "option": "fs-wiki", "answer": "Dynamic product groups are found under Catalogues > Dynamic product groups in the administration; they are groups of products formed by dynamic rules. You give a group a Name and optional Description, and choose 'Keep matching variants grouped' to control whether variants are shown grouped under the main product or individually (this affects categories, cross-selling and CMS product sliders). In the Conditions section you pick a property and a condition, chain further conditions with AND/OR, and nest conditions indefinitely with SUB-CONDITION; for multi-value properties (products, categories, manufacturers, tags, properties) operators include Is equal to / Is not equal to / Is equal to any of / Is not equal to any of / Is equal to all of / Is not equal to all of. Custom fields can be used as condition properties, and delivery-time conditions use the merchant's defined delivery times (deleting a delivery time used in a condition breaks it). A Preview shows the currently matching products, and the overview lists each group's status, which becomes 'invalid' if it depends on rules from a deactivated plugin. The resulting dynamic product group can be used to fill category content dynamically (e.g. sale or manufacturer categories), feed product comparison exports, or power the product slider CMS element in Shopping Experiences.", "citations": ["platform/func/shopware-6-de/Catalogues/Dynamicproductgroups.md:33-71"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"dynamic product group\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func"}, {"tool": "Bash", "args": "grep -n \"Dynamic Product Group|dynamic product group|Dynamicproductgroups\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md"}, {"tool": "Read", "args": "platform/func/shopware-6-de/Catalogues/Dynamicproductgroups.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-31": {"query": "How do I expose a plugin configuration value, such as a colour picked in the Administration, as an SCSS variable in my Storefront styling?", "category": "dev", "option": "fs-wiki", "answer": "The recommended way is to declare the plugin `config.xml` field with a `<css>` tag naming the SCSS variable it should map to. First set a fallback value in your plugin's `base.scss`, e.g. `$sass-plugin-header-bg-color: #ffcc00 !default;`. Then in `config.xml`, add an `<input-field>` (e.g. a colorpicker) with a `<css>` tag such as `<css>sass-plugin-header-bg-color<\/css>` and a `<defaultValue>`; the value set in the Administration (or the default if unset) is then exposed as that SCSS variable. This `css` tag is available from Shopware 6.4.13.0 onward, and changing the configured value still requires manually recompiling the theme (the Administration shows a notice about this). If you need more flexibility, e.g. computing the value per sales channel or exposing config fields dynamically, you can instead create an event subscriber on `ThemeCompilerEnrichScssVariablesEvent`, inject `SystemConfigService`, and call `$event->addVariable('sass-plugin-header-bg-color', $value)` inside `onAddVariables()`, registering the subscriber as a `kernel.event_subscriber` tagged service.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables.md:16-57", "platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md:18-63"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"scss\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | grep -i config"}, {"tool": "Bash", "args": "grep -rln \"add-config-css-variable\\|plugin config.*scss\\|scss variable\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-09": {"query": "How do I make a field on my plugin's own entity translatable per language?", "category": "dev", "option": "fs-wiki", "answer": "Add translation support with a translation table, an `EntityTranslationDefinition`, a `TranslationEntity`, and wire the main entity's field as a `TranslatedField` linked to it. Steps: 1) Create a migration for a `<entity>_translation` table, named by appending `_translation` to the entity's table name (e.g. `swag_example_translation`). Required columns are `<entity>_id` (FK to the entity), `language_id` (FK to `language`), the translated column(s) (e.g. `name`), `created_at`, `updated_at`; the primary key is `(<entity>_id, language_id)`. 2) Create `ExampleTranslationDefinition extends Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityTranslationDefinition`, override `getParentDefinitionClass()` to return the parent entity's definition class, and define the translated column(s) with `StringField`. 3) Register both definitions in `services.php` with the `shopware.entity.definition` tag, registering the translation definition after the parent entity's definition. 4) Create `ExampleTranslationEntity extends Shopware\\Core\\Framework\\DataAbstractionLayer\\TranslationEntity` with getters/setters for the translated field(s) and the association back to the parent entity, then override `getEntityClass()` on the translation definition to return it. 5) Create an `ExampleTranslationCollection extends EntityCollection` the same way as for a normal entity. 6) On the main entity's definition, add a `TranslatedField('name')` and a `TranslationsAssociationField(ExampleTranslationDefinition::class, 'swag_example_id')`. Reading translated data should prefer `entity.translated.field` in storefront/sales-channel contexts, and `entity.field` in Admin/CRUD flows. Gotchas: the translation definition must be registered in `services.php` after the entity it translates, and the translation table's foreign keys (`<entity>_id`, `language_id`) both cascade on delete and update.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-translations.md:1-54"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-translations.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}}}, "scored": {"fs-wiki": {"dev-01": {"caseId": "dev-01", "category": "dev", "area": "DAL", "scores": {"groundingRelevance": 100, "accuracy": 0, "co
