-use-queue` to reindex the whole shop (Elasticsearch, SEO URLs, product index, etc.) \u2014 always with `--use-queue`. Some systems additionally need `bin/console es:create:alias` afterward. Indexing writes to the message queue, so run `bin/console messenger:consume` (optionally with `-vv`) to process the queue, with up to ~3 workers typical (more requires RabbitMQ).", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md:26-74"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"elasticsearch\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | head -20"}, {"tool": "Read", "args": "platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-29": {"query": "How do I add my own data to an existing Storefront page or pagelet from a plugin without overriding the core controller?", "category": "dev", "option": "fs-wiki", "answer": "Subscribe to the page's or pagelet's ...LoadedEvent instead of overriding the controller -- e.g. FooterPageletLoadedEvent for the footer pagelet. In the subscriber, fetch the extra data (ideally via a Store API route tailored to what you need, rather than calling the DAL directly or reusing a broader route that returns unnecessary information; the guide's example uses EntityRepository::aggregate() with CountAggregation and an EqualsFilter for an active-product count), then attach the result to the page/pagelet with $event->getPagelet()->addExtension('product_count', $response->getProductCount()) (or $event->getPage()->addExtension(...) for a page). Register the subscriber with the service tag kernel.event_subscriber, mapping the event class to your handler method in getSubscribedEvents(). In the Twig template, the added data is then available under the extensions property, e.g. {% if footer.extensions.product_count %}{{ footer.extensions.product_count.count }}{% endif %}.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md:19-71"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"override.*plugin\\|PluginManager.override\\|override.*JavaScript\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront | head -20"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-66": {"query": "Which request headers change Admin API behaviour for language, entity version, parent-child inheritance and skipping flow triggers during a bulk import?", "category": "dev", "option": "fs-wiki", "answer": "`sw-language-id` returns entities in the given language ID instead of the system language (e.g. `sw-language-id: be01bd336c204f20ab86eab45bbdbe45`). `sw-version-id` tells the API which entity version to return (e.g. `sw-version-id: 0fa91ce3e96a4bc2be4bd9ce752c3425`). `sw-inheritance` makes the API consider parent-child inheritance, such as for product variants (e.g. `sw-inheritance: 1`). `sw-skip-trigger-flow` skips flow triggers (e.g. 'send email on customer creation') during bulk imports via the Sync API (e.g. `sw-skip-trigger-flow: 1`).", "citations": ["platform/dev/6.7/guides/development/integrations-api/request-headers.md:16-30"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/development/integrations-api/request-headers.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-12": {"query": "A spec asks for customer-specific pricing and for a flow that calls an external URL when an order is placed \u2014 before I build either of them, does Shopware already ship them, and what has to be licensed or installed for them to exist in the shop?", "category": "func", "option": "fs-wiki", "answer": "Both exist already and do not need to be custom-built. Customer-specific pricing is a Shopware Commercial feature available from the Shopware Beyond plan: it lets a shop offer individually calculated prices (list prices, graduated prices, or currency-dependent prices) per customer, synced in from an external system such as an ERP via a speed-optimised Admin API ('bulk edit custom prices'). It requires a Shopware Beyond plan and the Shopware Commercial extension, has no Administration UI or storefront entry point of its own \u2014 all create/read/update/delete happens via the API \u2014 and it ignores variant price inheritance (each variant needs its own priced entry); the individual price shows in the storefront only while the matching customer is logged in. Calling an external URL when an order is placed is a Flow Builder webhook action: a flow is created with the trigger Checkout / Order / Placed and an action that calls the third-party API (documented generically as 'webhook actions' that forward data to API-based third-party providers when a trigger such as a new order fires). The concrete 'Call URL (Webhook)' action used for this, per the worked Slack example, requires the Flow Builder Professional extension to be installed \u2014 it is not part of the base Flow Builder action set.", "citations": ["platform/func/extensions/customer-specific-pricing.md:21-43", "platform/func/features/webhook-actions-in-flow-builder.md:21-37", "platform/func/tutorials-and-faq/flow-builder-example-flows.md:47-62"], "toolCallLog": [{"tool": "Read", "args": "platform/func/extensions/customer-specific-pricing.md"}, {"tool": "Read", "args": "platform/func/features/webhook-actions-in-flow-builder.md"}, {"tool": "Bash", "args": "grep -n -i \"flow builder professional|flow builder pro\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md"}, {"tool": "Bash", "args": "grep -n -i \"professional|webhook\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/tutorials-and-faq/flow-builder-example-flows.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-13": {"query": "There is no event for what I need to change in a core Shopware service \u2014 how do I decorate or replace that service from my plugin?", "category": "dev", "option": "fs-wiki", "answer": "Use service decoration, one of the two main ways (alongside events) to extend Shopware behavior from a plugin \u2014 use decoration when an existing service's behavior itself must change rather than reacting to something Shopware already does. Decoratable Shopware services typically expose an abstract class as their contract (with a `getDecorated()` chain) instead of a plain PHP interface. Register both the original and a decorator service, pointing the decorator at the original with `decorate()` and passing the original through `.inner`, e.g.: `$services->set(ExampleServiceDecorator::class)->decorate(ExampleService::class)->args([service('.inner')]);`. The abstract contract declares `abstract public function getDecorated(): AbstractExampleService;` \u2014 the base implementation's `getDecorated()` throws `Shopware\\Core\\Framework\\Plugin\\Exception\\DecorationPatternException`, while the decorator's `getDecorated()` returns the wrapped instance, and the decorator's overridden methods should normally delegate to it (e.g. `$this->decoratedService->doSomething() . ' ...'`). Gotchas: decorators nest (plugin B wraps plugin A wraps core), a decorator that doesn't delegate silently breaks the rest of the chain (inspect with `bin/console debug:container --show-arguments <service-id>` or PHPStorm's Navigate -> Implementations), always type-hint the abstract class (never the concrete class) in constructors or the service is removed from the decoration chain, and where a designed extension point already exists (subscribed as `.pre`/`.post`/`.error` events) prefer that over decoration since it lets multiple extensions participate without forming a chain.", "citations": ["platform/dev/6.7/guides/plugins/plugins/services/adjusting-service.md:20-75"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"decorat\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/services/adjusting-service.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-07": {"query": "How do I import products from a CSV with an import/export profile \u2014 column mapping, matching identifiers and a dry run?", "category": "func", "option": "fs-wiki", "answer": "Import/Export lives under Settings > Automation > Import/Export and moves data in/out of Shopware 6 as CSV files using configurable profiles. The CSV file itself must be UTF-8, use a semicolon field separator and quotation marks as the string separator, and prices must use a dot as the decimal separator (e.g. `5.00`, not `5,00`). On the Import tab you Upload CSV file, Select profile, then either Start import or Start dry run (which validates without writing any data); Import activity shows the last 30 days with a per-row context menu to re-download source/erroneous CSVs, and there is an Abort process option. Import can only add data, not remove it - e.g. an existing sales channel assignment is not cleared by an import. Profiles are managed on the Profiles tab: a profile has a Profile name, Usage (import/export/both), Object type (e.g. Product, Customer), Separator character (default semicolon), Enclosure character, and Import settings (Create new records, Update existing data); when creating a profile you must also select the default system language, or import/export will not work. Column mapping happens under Mappings: 'Add new mapping' creates a Database mapping that maps a CSV column name to a database entry, with Required, Default Value, and Position settings, and mappings can be deleted. For matching existing records by something other than the UUID, a profile's Advanced Settings tab offers a 'Second Unique Identifier' (e.g. `productNumber` instead of the product's UUID) - if that identifier value is not actually unique (e.g. duplicate names), only the first matching record is resolved. For a plain product import, select the Default product profile and leave 'Import product variants' unchecked; mandatory product fields are `id`, `taxId`, `productNumber`, `stock`, `name`, and example columns in the default product CSV include `id`, `parent_id`, `product_number`, `active`, `stock`, `name`, `description`, `price_net`, `price_gross`, `tax_id`, `tax_rate`, `tax_name`, `cover_media_id`, `cover_media_url`, `manufacturer_id`, `manufacturer_name`, `categories`, and `sales_channels`. Importing variants is a 4-step process: 1) import products with `id`/`parent_id` left empty via the default product profile, 2) import properties with `group_id` left empty (auto-creates the group) via the default properties profile, 3) link products and properties via `option_id`/`product_id` using the default variant configuration settings profile, and 4) either import the variants themselves via the Default product profile with 'import product variants' enabled (mandatory: `parent_id`, `product_number`, `active`, `stock`, pipe-separated `optionIds`) or generate them from the product's Generate variants tab.", "citations": ["platform/func/shopware-en/settings/importexport.md:34-79"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/shopware-en/settings/importexport.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-44": {"query": "After the Vue 3 upgrade my admin plugin broke \u2014 this.$parent resolves to the wrong component and a prop default that calls this.$tc throws. What do I have to change?", "category": "dev", "option": "fs-wiki", "answer": "The Shopware Administration moved from Vue 2 (EOL December 31st 2023) to Vue 3 starting with Shopware 6.6, and this is documented as a mandatory, breaking migration for plugins shipping custom Administration code (app-based extensions are unaffected). Both symptoms you describe are named, known pitfalls. `this.$parent` is unreliable in Vue 3 because Vue wraps async components, so the parent you expect is sometimes actually a wrapper \u2014 you may need `this.$parent.$parent`, but the wiki recommends preferring services or event communication instead of relying on `$parent` at all. For the prop default calling `this.$tc`: prop default functions no longer have access to `this` in Vue 3, so `this.$tc` inside a prop default throws \u2014 replace it with `Shopware.Snippet.tc` instead. More broadly, you should search your code for `this.$` (an indicator of Vue's internal API) since most such calls break in Vue 3, with `this.$tc` itself being one of the few exceptions that still works in normal (non-prop-default) contexts. Other related gotchas to check: `@hook:mounted` and similar lifecycle hooks can now fire multiple times for asynchronously loaded components (once for the `AsyncComponentWrapper`, once for the underlying component); checking `this.$slots` for a slot name is no longer sufficient (verify it contains an actual v-node); Vuex stores lose reactivity if a getter mutates state; form fields no longer keep the previous DOM id used by tests (add a unique `name` attribute); and mutating props now throws hard errors instead of being silently allowed. Also align your plugin's npm dependencies with the Administration's `package.json`, replace all `sw-field` usages with their dedicated component replacements, and test with a local watcher via `composer run watch:admin` (optionally enabling the Vue 3 ESLint rule set).", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/vue3.md:15-48"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/administration/_index.md"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/administration -maxdepth 1"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/administration/vue3.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-04": {"query": "What does the Shopware Migration Assistant transfer automatically from Shopware 5, and what has to be mapped by hand before the migration starts?", "category": "func", "option": "fs-wiki", "answer": "The Shopware 5 to Shopware 6 migration transfers several selectable data groups automatically, with 'Basic data' being mandatory: Basic data (categories, customer groups, currencies, sales channels, number ranges), Products (products, properties, product options, product properties, translations, cross-selling, main variant relations), Customers & orders (customers, shipping methods, orders, order documents), Promotions (customers, promotions), SEO URLs (products, properties, product options, product properties, translations, cross-selling, main variant relations, SEO URLs), and Product reviews (products, properties, product options, product properties, translations, cross-selling, main variant relations, customers, reviews, media). Before the migration starts, certain things must be manually mapped by creating them in Shopware 6 first: payment methods, the standard payment method, salutation, delivery time, and the standard delivery time - and these mappings cannot be changed after the migration has been executed (even a reset does not allow remapping; the migration would have to be deleted and recreated). Note that although 'shipping methods' is listed under 'Customers & orders' as automatically migrated, the corpus also states shipping and payment methods are not actually transferred automatically because both now rely on the Rule Builder (shipping cost rules and payment risk management), so they need to be recreated under Settings > Commerce > Shipping / Settings > Commerce > Payment methods. Other manual-rework items after migration include: Shopware 6 already has two default sales channels on install, so migrated shops/subshops appear as additional sales channels and domain settings must be adjusted to see migrated data in the frontend; countries must be checked under Settings > Localisation > Countries; document templates were redesigned and must be reconfigured under Settings > Commerce > Documents; email templates use Twig and cannot reuse Shopware 5 templates (managed under Settings > Content > Email templates); Shopping Worlds/shop pages become Shopping Experiences and cannot be transferred, so they must be recreated under Content > Shopping Experiences; templates cannot be reused due to the redesigned architecture, though the bundled template can serve as a basis for a custom theme; and the B2B Suite cannot be transferred at all.", "citations": ["platform/func/migration-en/what-is-migrated.md:35-65"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"promotion\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md (reused earlier grep output listing migration pages)"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/migration-en/what-is-migrated.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-18": {"query": "My plugin's cart processor adds a surcharge line item, but it is added again on every recalculation and its price is stale after the customer changes the quantity \u2014 how do I split the work between the collector and the processor?", "category": "dev", "option": "fs-wiki", "answer": "Per the wiki's cart extension architecture, the cart is recalculated multiple times per request, and the split is: use `CartDataCollector` to load external data once, and use `CartProcessor` only to modify/compute calculated items \u2014 never perform database queries inside `process()`, and always use `PriceCalculator` classes for price adjustments so the price is derived fresh from current cart state (quantity, tax rules, etc.) on every recalculation rather than cached/stale. Concretely, `CartDataCollectorInterface::collect()` must check whether data was already loaded before appending it to `CartDataCollection`, to avoid unnecessary repeated database queries \u2014 this is also the mechanism that avoids re-adding the same external lookup work on every pass. For the surcharge/discount line item itself, the wiki's cart-discounts pattern builds the definition and calculates the price inside `process()` using an injected `PriceCalculator` (e.g. `PercentagePriceCalculator`/`QuantityPriceCalculator`) against the current line items in `$toCalculate`, then adds it via `$toCalculate->add($discountLineItem)` \u2014 critically, mutations must always happen on `$toCalculate`, never on `$original`, since `$toCalculate` is the instance actually used for the current recalculation pass; mutating `$original` (or otherwise not treating `process()` as re-deriving the line item from scratch against the current `$toCalculate` state) is what causes a surcharge to keep piling up across recalculations and its price to go stale after a quantity change, since the price should be recalculated from the live quantity/line items every time `process()` runs rather than being computed once in the collector and reused unchanged.", "citations": ["platform/dev/6.7/guides/plugins/plugins/architecture/cart-process.md:14-40", "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-discounts.md:15-54", "platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md:46-48"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/architecture/cart-process.md"}, {"tool": "Bash", "args": "grep -n \"add-cart-discounts\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-discounts.md"}, {"tool": "Bash", "args": "grep -n \"surcharge|already exist|LineItemCollection|remove.*line item|has(\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/checkout/cart/*.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "partial"}, "dev-48": {"query": "After upgrading, my storefront JavaScript plugin no longer loads \u2014 how do I register it asynchronously with `PluginManager` and where does the compiled file have to be shipped?", "category": "dev", "option": "fs-wiki", "answer": "Write the plugin file at `<plugin root>/src/Resources/app/storefront/src/<plugin-dir>/example-plugin.plugin.js` as a vanilla ES6 class extending the base `PluginBaseClass` (obtained via `const { PluginBaseClass } = window;`), with an `init()` method that runs on `DOMContentLoaded`. Normal (synchronous) registration in `main.js` (auto-loaded from `<plugin root>/src/Resources/app/storefront/src`) looks like:\n\n```javascript\nimport ExamplePlugin from './example-plugin/example-plugin.plugin';\nconst PluginManager = window.PluginManager;\nPluginManager.register('ExamplePlugin', ExamplePlugin);\n```\n\nYou can bind it to matching DOM elements with a selector as a third argument, e.g. `PluginManager.register('ExamplePlugin', ExamplePlugin, '[data-example-plugin]')`, accessible inside the plugin as `this.el`. To register it asynchronously, pass a dynamic import instead of a top-level import as the second argument: `PluginManager.register('ExamplePlugin', () => import('./example-plugin/example-plugin.plugin'), '[data-example-plugin]');`. An async plugin registered this way is excluded from the main `storefront.js` bundle and is downloaded on demand only when its selector is present on the page \u2014 synchronously imported plugins are always bundled into `storefront.js` on every page instead. After registering, rebuild the Storefront with `shopware-cli project storefront-build` (template project setups) or `composer run build:js:storefront` (platform contribution setups). The compiled output must be written to, and shipped with the plugin at, `<plugin root>/src/Resources/app/storefront/dist/storefront/js/<plugin-name>/<plugin-name>.js` \u2014 if that compiled file is missing or stale after an upgrade, the plugin will not load even if `main.js` registers it correctly.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md:18-80"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"PluginManager|storefront.*javascript|js plugin\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-58": {"query": "My shopware.yaml still uses redis_url \u2014 how do I define the named Redis connections in Shopware 6.7 and which eviction policy does each one need?", "category": "dev", "option": "fs-wiki", "answer": "Since v6.6.8.0, Redis is configured via named connections under `shopware.redis.connections` in `shopware.yaml`, replacing the single `redis_url` style. Example: `shopware: redis: connections: ephemeral: {dsn: 'redis://host1:port/dbindex'}, persistent: {dsn: 'redis://host2:port/dbindex'}`. Env vars can be used in the DSN (e.g. `dsn: '%env(REDIS_EPHEMERAL)%/1'`), and connection pooling can be enabled by appending `?persistent=1` to the DSN. Shopware recommends separate Redis instances/connections per data category, each with its own eviction policy, because a single Redis instance cannot apply different eviction policies to different databases: 1) Ephemeral data (HTTP cache, object cache) \u2014 use `volatile-lru`, no persistence needed. 2) Durable but aging data (sessions) \u2014 use `allkeys-lru`, persisted via RDB/AOF. 3) Durable and critical data (cart, number range, lock store, increment) \u2014 use `volatile-lru`. Note that a cache Redis hitting its memory limit is normal for `volatile-lru`, but it can only evict keys that have a TTL \u2014 Symfony's tag-aware cache adapter stores tag-index sets without a TTL, which can accumulate as orphaned entries and starve eviction if never pruned.", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/redis.md:1-71"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"redis_url\\|redis:\\|Redis connection\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/hosting/infrastructure/redis.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-41": {"query": "`composer update` to Shopware 6.7 aborts on a platform requirement and my admin build then fails too \u2014 which PHP, database and Node versions does 6.7 actually require, and how do I check the machine I am on against them before I retry?", "category": "dev", "option": "fs-wiki", "answer": "Shopware 6.7's recommended stack is: PHP 8.2+ (recommended 8.4) with memory_limit >= 512M and max_execution_time >= 30s, and required extensions ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, openssl, pcre, pdo_mysql, phar, simplexml, xml, xmlreader, zip, zlib (amqp optional); Composer 2.2+ recommended. Database: MariaDB >= 10.11.6 or MySQL >= 8.0.22 (Innovation releases unsupported), recommended MariaDB 11.4 or MySQL 8.4, with max_allowed_packet >= 32M. Node.js/npm: Node 20.0.0+ minimum, recommended Node 24 / npm 10 (this Node requirement is what the admin build depends on). To verify your machine before retrying, the wiki recommends running: `php -v`, `php -m`, `php -i | grep memory_limit`, `composer -V`, `node -v`, `npm -v`. Note that multiple PHP versions may be installed on a system and CLI vs FPM often use different php.ini files, so make sure you're checking the correct binary/ini. Separately, before even getting to the application stack, the workstation itself should meet the hardware/OS baseline: quad-core+ CPU, 8 GB RAM minimum (16 GB recommended, especially for Docker), ~10 GB free disk space, and a Unix-based OS (macOS 13+, 64-bit Linux, or Windows 10/11 Pro via WSL2/Docker Desktop), with the user added to the docker group on Linux via `sudo usermod -aG docker $USER`.", "citations": ["platform/dev/6.7/guides/hosting/_index.md:16-41", "platform/dev/6.7/guides/installation/system-requirements.md:14-49"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "grep -n -i \"requirement|system requirement|php version|node version\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/_index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/installation/system-requirements.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-59": {"query": "After upgrading to Shopware 6.7 my Varnish cache is never invalidated \u2014 what changed in the reverse proxy configuration?", "category": "dev", "option": "fs-wiki", "answer": "Two changes are the likely cause. First, the config key changed from `storefront.reverse_proxy` (used up to 6.5.x) to `shopware.http_cache.reverse_proxy` (from 6.6.0.0) \u2014 if `shopware.yaml` still uses the old key it is silently ignored, so invalidation requests never reach Varnish. Second, the older Varnish-with-Redis/LUA-based BAN approach is deprecated from v6.6.x and was removed entirely in v6.7.0, in favor of `XKey`-based invalidation; that old approach also did not support Redis clusters. The correct 6.7 config in `config/packages/storefront.yaml` (with `SHOPWARE_HTTP_CACHE_ENABLED=1` in `.env`) looks like: `shopware: http_cache: reverse_proxy: { enabled: true, ban_method: \"BAN\", hosts: [\"http://varnish\"], max_parallel_invalidations: 3, use_varnish_xkey: true }`. Also make sure the reverse proxy is trusted so Symfony reads the real client IP \u2014 since Shopware 6.6, `TRUSTED_PROXIES` is no longer read automatically; use `SYMFONY_TRUSTED_PROXIES=127.0.0.1,10.0.0.0/8` (or `REMOTE_ADDR` to trust only the directly connecting address) instead. For soft purge (serve stale while refreshing) instead of the default hard purge, change the Varnish VCL from `xkey.purge(req.http.xkey)` to `xkey.softpurge(req.http.xkey)`. Relevant cache-clear commands: `bin/console cache:clear` (before 6.7 this also cleared the HTTP cache), `bin/console cache:clear:all` (clears everything including HTTP cache, since 6.6.8), `bin/console cache:clear:http` (clears just the reverse proxy cache, since 6.6.10), and `bin/console cache:pool:clear --all` (object cache only).", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/reverse-http-cache.md:1-89"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"Varnish\\|reverse proxy\\|reverse-proxy\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/hosting/infrastructure/reverse-http-cache.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-42": {"query": "How do I check extension compatibility before upgrading with shopware-cli, and why does it report my plugins in custom/plugins as blocking?", "category": "dev", "option": "fs-wiki", "answer": "Use `shopware-cli project upgrade` (interactive, six phases: readiness, version choice, extension/Composer analysis, plan review, apply, report), or preview it without changes via `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run`. One of the prerequisites the wizard checks before it will proceed is that all extensions are Composer-managed \u2014 plugins that are only dropped into `custom/plugins` without being wired into Composer are not Composer-managed, so the wizard reports them as blocking readiness. The fix is to migrate locally managed extensions first with `shopware-cli project autofix composer-plugins` before re-running the upgrade. You can also run `shopware-cli project validate --only phpstan /path/to/your/project` before a Shopware upgrade specifically to detect breaking changes in custom code, and `shopware-cli extension validate --full /path/to/your/extension` (with `--check-against lowest` or `highest` to test against dependency boundaries) for a full technical check per extension (metadata, packaging, phpstan, eslint, stylelint, admin-twig, storefront-twig; full mode needs PHP 8.2+, Node.js 20+, Composer and npm on the host).", "citations": ["platform/dev/6.7/products/tools/cli/project-commands/upgrade.md:19-69", "platform/dev/6.7/products/tools/cli/validation.md:19-77"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"shopware-cli|extension compat\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/tools/cli/project-commands/upgrade.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/tools/cli/validation.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-67": {"query": "What does a minimal app folder and `manifest.xml` need to contain, and which console commands install and activate the app on my local Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "A minimal app lives at `custom/apps/<TechnicalName>/manifest.xml`, where the technical name is UpperCamelCase (e.g. `MyExampleApp`). The `manifest.xml` needs a `<meta>` block containing `name`, `label`, `description`, `author`, `copyright`, `version`, `icon`, and `license` \u2014 the folder name must match `<meta><name>`, and `<author>`/`<copyright>` are required or `bin/console app:refresh` fails. To install and activate on a local Shopware 6.7: run `bin/console app:refresh` to refresh the app registry, then `bin/console app:install --activate MyExampleApp` to install and activate in one step (or install without `--activate` and activate later via Extensions \u2192 My Extensions \u2192 Apps, or `bin/console app:activate MyExampleApp`). Use `bin/console app:list` to inspect installed apps, `bin/console app:validate` to find configuration issues, and `--no-validate` on `app:install` to skip validation while debugging. After activating, clear caches with `bin/console cache:clear` (or `cache:clear:http`/`cache:clear:all`). These commands must be run from inside the PHP container at the project root, and installation uses the app's technical name (`<meta><name>`), not a filesystem path.", "citations": ["platform/dev/6.7/guides/plugins/apps/app-base-guide.md:19-42"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/apps -maxdepth 2"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/apps/app-base-guide.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-11": {"query": "How do I create an integration for Admin API access in the administration and give it the right privileges?", "category": "func", "option": "fs-wiki", "answer": "Go to Settings > System > Integrations and use 'Create integration'. Assign it a name, then decide whether it should have full administrator permissions or instead select an existing role for scoped access. On creation Shopware issues an access ID and a security key; the security key is shown only once at creation time, so it must be saved immediately, and it can never be retrieved again afterward (only rotated via 'Regenerate API access key', which invalidates the old access ID and key together). The overview lists integrations by name and permissions, and you can edit or delete them via the context menu. To give the integration the right privileges without granting full Administrator rights, create a Role under Settings > System > Users & Permissions ('New role'): give it a name/description, then assign Authorisations per area (e.g. Catalogues) using View, Edit, Create, Delete or All \u2014 granting Edit also grants View, granting Create also grants Edit and View, while Delete only automatically grants View (not Edit/Create). There are also Additional permissions not tied to one area (e.g. Basic configurations, Import/Export, Apps, Clear cache) which are edit-only rights, and a Detailed permissions view exposing every technical permission with read/write/create/delete rights for cases where an extension didn't declare privileges cleanly. Once the role is defined, select it for the integration instead of the Administrator flag so the integration is limited to that role's privileges.", "citations": ["platform/func/settings/system/integrationen.md:21-45", "platform/func/settings/system/user.md:36-76"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"integration\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md"}, {"tool": "Read", "args": "platform/func/settings/system/integrationen.md"}, {"tool": "Read", "args": "platform/func/settings/system/user.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-03": {"query": "Where do the `#[ORM\\Entity]` mapping attributes for my plugin's entity go in Shopware 6, and how do I get Doctrine's `EntityManager` injected into my service so I can persist it?", "category": "edge", "option": "fs-wiki", "answer": "There is no place for `#[ORM\\Entity]` attributes and no `EntityManager` to inject, because Shopware 6 explicitly does not use an ORM like Doctrine for entity persistence. The corpus's Data Abstraction Layer (DAL) page states it is 'Shopware's thin, non-ORM interface for database access, used instead of an ORM like Doctrine.' Instead, you define a plugin entity via an `EntityDefinition` class (registered as a DAL entity) and interact with it through `EntityRepository`, which is 'the recommended way to interact with the DAL/database.' You get a repository by constructor injection with autowiring (e.g. `public function __construct(EntityRepository $productRepository)`) or by wiring it explicitly in `services.xml`/PHP config, e.g. `$services->set(Swag\\ExamplePlugin\\Service\\DalExampleService::class)->args([service('product.repository')]);`. To persist data you call methods like `upsert()`/`create()` on the repository with a `Context` object, not an `EntityManager::persist()`/`flush()` call.", "citations": ["platform/dev/6.7/concepts/framework/data-abstraction-layer.md:18-64"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"doctrine|EntityManager\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/"}, {"tool": "Read", "args": "platform/dev/6.7/concepts/framework/data-abstraction-layer.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-05": {"query": "How does theme inheritance work in Shopware \u2014 theme.json and SCSS overrides?", "category": "dev", "option": "fs-wiki", "answer": "Theme inheritance lets a theme extend an existing, installed theme, reusing its templates, styles, scripts, assets, and config while adding its own changes \u2014 useful for a variant of an already-used theme (e.g. a dark version, per-sales-channel differences, or a customized store-bought theme) without duplicating or modifying the original theme's code. It's configured by editing `theme.json` in `<plugin root>/src/Resources` of the extending theme and inserting the base theme's technical name into each relevant section, before the extending theme's own alias, e.g.:\n```javascript\n{\n  \"name\": \"SwagBasicExampleThemeExtend\",\n  \"views\": [\"@Storefront\", \"@Plugins\", \"@SwagBasicExampleTheme\", \"@SwagBasicExampleThemeExtend\"],\n  \"style\": [\"app/storefront/src/scss/overrides.scss\", \"@SwagBasicExampleTheme\", \"app/storefront/src/scss/base.scss\"],\n  \"script\": [\"@Storefront\", \"@SwagBasicExampleTheme\", \"app/storefront/dist/storefront/js/.../file.js\"],\n  \"asset\": [\"@Storefront\", \"@SwagBasicExampleTheme\", \"app/storefront/src/assets\"],\n  \"configInheritance\": [\"@Storefront\", \"@SwagBasicExampleTheme\"]\n}\n```\n`views` renders in order: Storefront base, then plugin extensions, then the referenced base theme, then the current theme. `script` follows the same layered order \u2014 Storefront JS, then the base theme's JS, then the current theme's JS. For `style`, `overrides.scss` is kept first because it can affect SCSS variables like `$border-radius` that later imports depend on. `asset` requires the base theme to be added explicitly (e.g. `@SwagBasicExampleTheme`) to reuse its assets. For `configInheritance`, the last listed theme that differs from the current one becomes the parent theme for config values, and the `Storefront` theme's config is always inherited even without an explicit `configInheritance` entry.", "citations": ["platform/dev/6.7/guides/plugins/themes/inheritance/add-theme-inheritance.md:1-54"], "toolCallLog": [{"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -ipath \"*theme*\" -iname \"*.md\" | grep -iE \"inherit|scss|theme.json|config\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/themes/inheritance/add-theme-inheritance.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-35": {"query": "How do I load entities from the Admin API inside an Administration component using the repository factory and a Criteria?", "category": "dev", "option": "fs-wiki", "answer": "Inject the factory with `inject: ['repositoryFactory']`, then create a repository for the entity you need, e.g. `this.repositoryFactory.create('product')` (a third parameter accepts `{ version: 1 }`). Build a `Criteria` (from `Shopware.Data.Criteria`) to filter, sort, and paginate: `criteria.setPage(1); criteria.setLimit(10); criteria.setTerm('foo'); criteria.setTotalCountMode(2); criteria.addFilter(Criteria.equals('product.active', true)); criteria.addSorting(Criteria.sort('product.name', 'DESC')); criteria.addAggregation(Criteria.avg('average_price', 'product.price'));` \u2014 `setTotalCountMode` accepts `0` (no total count, fastest), `1` (exact total count), or `2` (`limit * 5 + 1`, fast 'next page exists' check). Load associations by calling `criteria.addAssociation('manufacturer')` before searching. Then fetch data with `productRepository.search(criteria, Shopware.Context.api)` for a list, or `productRepository.get(entityId, Shopware.Context.api)` for a single record. To write data, call `productRepository.save(entity, Shopware.Context.api)` (only changed properties are sent, and saving is manual \u2014 not automatic) or `productRepository.delete(id, Shopware.Context.api)` (bulk deletes use `syncDeleted` with an array of ids). Entities are stateless, so after `save()` related data must be re-fetched from the server if it's needed again; for a new, unsaved entity, associations can't be sent to the server yet \u2014 they're stored locally on the parent and sent together when the parent is saved.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md:14-59"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"repositoryFactory\\|repository-factory\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration -i"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/administration/services-utilities/making-api-requests.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-05": {"query": "My plugin decorates `CachedProductRoute` to add cache tags \u2014 where did the `Cached*Route` classes go in Shopware 6.7 and how do I cache a Store API route now?", "category": "gap", "option": "fs-wiki", "answer": "The corpus's 6.7 Caching guide does not mention `Cached*Route` decorator classes at all \u2014 instead it documents the current mechanism directly: cache tags are added at the point data is loaded/computed via `$this->cacheTagCollector->addTag('my-custom-entity-' . $id)`, and invalidated later via `$this->cacheInvalidator->invalidate(['my-custom-entity-' . $id])` (pass `true` as a second argument, or set the `sw-force-cache-invalidate: 1` request header, to force immediate invalidation instead of the default 5-minute batched invalidation). Default tag invalidation is driven by `CacheInvalidationSubscriber`, whose listener tags are configured via DI service definition and can be tweaked with a compiler pass (`Shopware\\Core\\Framework\\DependencyInjection\\CompilerPass\\RemoveEventListener`). For caching a Storefront controller that consumes a Store API route, mark the controller's route `_httpCache => true` in the `#[Route(...)]` attribute \u2014 cache invalidation for it then follows the Store API route's cache tags automatically, since the controller's cache entry inherits the tags of whatever Store API routes it called; a controller that loads data exclusively through Store API routes needs no additional invalidation logic of its own. The corpus's cache key/hash computation is separately customizable via `HttpCacheCookieEvent` (adds custom hash parts or disables caching) and `HttpCacheKeyEvent` (computes the exact Symfony HTTP-cache key). This confirms `Cached*Route` decoration is not the documented pattern for 6.7 \u2014 the corpus only shows the `CacheTagCollector`/`CacheInvalidator` tag-based approach and the `_httpCache` route flag for controllers, with no reference to a decoratable cached-route class anywhere in the 6.7 tree.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/caching/_index.md:20-79", "platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-caching-to-custom-controller.md:17-48"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"CachedProductRoute\\|Cached.*Route\\|cache.*store api\\|http-cache\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/caching/_index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-caching-to-custom-controller.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-14": {"query": "I wrote a subscriber class in my plugin but it never fires \u2014 which interface and which service tag (`shopware.event_subscriber`?) register it?", "category": "dev", "option": "fs-wiki", "answer": "The subscriber class must implement Symfony's `EventSubscriberInterface` (`Symfony\\Component\\EventDispatcher\\EventSubscriberInterface`), returning a map of event names to handler methods from a static `getSubscribedEvents()` method, e.g. `ProductEvents::PRODUCT_LOADED_EVENT => 'onProductsLoaded'`. The correct service tag is not `shopware.event_subscriber` but `kernel.event_subscriber` \u2014 the class must be registered in `src/Resources/config/services.php` and tagged with it, e.g. `$services->set(MySubscriber::class)->tag('kernel.event_subscriber');`. If the class is missing from `services.php` or lacks this tag, Shopware will never call it, and there is typically no obvious error indicating the event was unhandled. For versioned entities (orders, products, etc.) the same event can fire for multiple versions, so check `$event->getContext()->getVersionId() !== Defaults::LIVE_VERSION` to react only to the live version.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/event/listening-to-events.md:17-63"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"event.subscriber\\|EventSubscriberInterface\\|listening-to-events\\|event_subscriber\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/event/listening-to-events.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-47": {"query": "My payment plugin implements `AsynchronousPaymentHandlerInterface` and is tagged `shopware.payment.method.async` \u2014 how do I write a payment handler for Shopware 6.7 instead?", "category": "dev", "option": "fs-wiki", "answer": "From Shopware 6.7.0.0 onward, all payment handling goes through a single `Shopware\\Core\\Checkout\\Payment\\Cart\\PaymentHandler\\AbstractPaymentHandler` class instead of the multiple pre-6.7 interfaces (`SynchronousPaymentHandlerInterface`, `AsynchronousPaymentHandlerInterface`, `PreparedPaymentHandlerInterface`, `RecurringPaymentHandlerInterface`, `RefundPaymentHandlerInterface`), each of which used to be registered with its own tag (`shopware.payment.method.sync`, `.async`, `.prepared`, `.recurring`, `.refund`). To migrate: 1) Create a class extending `AbstractPaymentHandler` and implement `supports(PaymentHandlerType $type, string $paymentMethodId, Context $context): bool` plus the relevant method(s) \u2014 `pay(Request, PaymentTransactionStruct, Context, ?Struct): ?RedirectResponse` (always called during checkout; return `null` for synchronous flows or a `RedirectResponse` to trigger `finalize` afterward), `finalize(Request, PaymentTransactionStruct, Context): void` (called after redirect back from an external provider \u2014 this replaces your old `finalize` from `AsynchronousPaymentHandlerInterface`), plus optionally `validate`, `refund`, `recurring`. 2) Replace the old `shopware.payment.method.async` tag registration with the single `shopware.payment.method` tag: `$services->set(MyCustomPaymentHandler::class)->tag('shopware.payment.method');`. 3) Use `Shopware\\Core\\Checkout\\Order\\Aggregate\\OrderTransaction\\OrderTransactionStateHandler` to update the transaction state (e.g. `->process(...)`, `->paid(...)`), and throw `PaymentException` (e.g. `PaymentException::asyncProcessInterrupted`, `::customerCanceled`) to fail the transaction. 4) Register the payment method itself in the plugin lifecycle (install/activate/deactivate) via `payment_method.repository`, providing `handlerIdentifier`, `name`, `description`, `pluginId`, `afterOrderEnabled`, and \u2014 required from 6.7 onward \u2014 a unique `technicalName` with a plugin-specific prefix (an omitted `technicalName` can prevent the plugin from being installed or activated). Never remove the payment method on uninstall \u2014 only set it inactive, since orders may still reference it.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:17-72"], "toolCallLog": [{"tool": "Bash", "args": "grep -n -i \"payment\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-24": {"query": "How do I get readable SEO URLs generated for the detail pages of my plugin's own entity?", "category": "dev", "option": "fs-wiki", "answer": "For a custom DAL entity, dynamic SEO URLs are generated by implementing Shopware\\Core\\Content\\Seo\\SeoUrlRoute\\SeoUrlRouteInterface with three methods: getConfig() (returns a SeoUrlRouteConfig with the entity definition, route name, and template), prepareCriteria() (narrow/extend the fetch criteria), and getMapping() (returns a SeoUrlMapping with the template variables; it must verify the entity type it receives since the method can be invoked for other entities too). Register the class with the container tag shopware.seo_url.route. Add a seo_url_template table entry via a plugin migration, setting route_name, entity_name, and template. Then subscribe to the entity's written DAL event and call Shopware\\Core\\Content\\Seo\\SeoUrlUpdater::update($routeName, $ids), and do the same on the .deleted event so removed entities' URLs are updated too. Note a German SEO URL is only reachable if a German domain is configured on the respective sales channel, and marking a seo_url entry deleted only sets is_deleted = 1 -- the route stays reachable, so the controller still needs to check whether the underlying content exists.", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/seo/add-custom-seo-url.md:19-73"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"SEO URL\\|SeoUrl\\|seo_url\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -30"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/content/seo/add-custom-seo-url.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-06": {"query": "How do I create a shipping method from my plugin's installer or migration, including the `technicalName` that 6.7 requires?", "category": "gap", "option": "fs-wiki", "answer": "The corpus has no dedicated guide for creating a shipping method from a plugin's PHP installer/migration (no `shipping_method.repository` usage is documented anywhere in the 6.7 tree). The only shipping-method creation path documented in 6.7 is for apps, not plugins: an app's `manifest.xml` can declare a `<shipping-methods><shipping-method>` block (experimental since 6.5.7.0) with `<identifier>`, `<name>`, a `<delivery-time>` (whose `<id>` must be generated once and never changed), plus optional `<description>`, `<icon>`, `<active>`, `<tracking-url>`, and `<position>` \u2014 but this page does not mention a `technicalName` field, and it is not the mechanism a plugin's installer/migration would use. What the corpus does confirm, for the closely analogous payment-method case, is that Shopware 6.7 added a required `technicalName` field: when registering a payment method via `payment_method.repository` in a plugin's lifecycle (install/activate/deactivate), the array must include `'technicalName' => 'swag_example-example_payment'` (unique, plugin-specific prefix) \u2014 an omitted `technicalName` can prevent the plugin from being installed or activated in 6.7, whereas older versions allowed omitting it. By analogy this same `technicalName` requirement plausibly also applies to shipping methods registered via `shipping_method.repository` in 6.7, since both are checkout method entities, but the corpus does not document this for shipping methods specifically, so I cannot confirm the exact field/array shape for a shipping-method plugin installer. [from memory]", "citations": ["platform/dev/6.7/guides/plugins/apps/checkout/shipping-methods.md:15-51", "platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:17-72"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"shipping method\\|technicalName\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/checkout -type f"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/apps/checkout/shipping-methods.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"}, {"tool": "Bash", "args": "grep -rln \"shipping_method\\b\\|ShippingMethodEntity\\|shipping_method.repository\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}], "notFoundClaim": true, "memoryClaims": ["By analogy this same `technicalName` requirement plausibly also applies to shipping methods registered via `shipping_method.repository` in 6.7, since both are checkout method entities, but the corpus does not document this for shipping methods specifically, so I cannot confirm the exact field/array shape for a shipping-method plugin installer."], "sourceVerdict": "partial"}, "edge-07": {"query": "How do I set up Shopware PWA as the storefront for a Shopware 6.7 shop?", "category": "edge", "option": "fs-wiki", "answer": "There is no setup guide because Shopware PWA is in maintenance mode and is not the recommended path, especially not for a current 6.7 shop. The only PWA page in the corpus (`platform/dev/6.6/products/pwa.md`) describes it as 'a Single Page Application built with JavaScript and Vue.js that provides a decoupled storefront, integrating Shopware functionality into an extensible frontend application,' based on the Store API, and its Gotchas explicitly state: 'Shopware PWA is currently in maintenance mode; Composable Frontends is recommended as the future direction for headless commerce with Shopware.' Notably this page exists only under the `dev/6.6` directory \u2014 there is no PWA page at all under `dev/6.7`, while the 6.7 tree does have dedicated Composable Frontends pages (e.g. `platform/dev/6.7/products/paas/shopware/composable-frontends/_index.md` and its performance sub-page), consistent with Composable Frontends having superseded Shopware PWA as the supported decoupled-storefront option by 6.7. So for a 6.7 shop the corpus points you toward setting up Composable Frontends rather than Shopware PWA.", "citations": ["platform/dev/6.6/products/pwa.md:15-26"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln -i \"shopware pwa|\\bpwa\\b\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/"}, {"tool": "Bash", "args": "grep -rln -i \"shopware pwa|\\bpwa\\b\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/"}, {"tool": "Read", "args": "platform/dev/6.6/products/pwa.md"}, {"tool": "Bash", "args": "grep -rln -i \"composable frontends\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/"}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "partial"}, "dev-17": {"query": "How do I overwrite the price of a product line item in the cart at runtime from a plugin?", "category": "dev", "option": "fs-wiki", "answer": "Use one class that acts as both a cart collector and a cart processor (this technique is only for changing an existing line item's price itself, e.g. for a live-shopping plugin \u2014 not for discounts/surcharges, which should be modeled as separate line items via the cart-discounts guide instead). First implement `Shopware\\Core\\Checkout\\Cart\\CartDataCollectorInterface::collect` to fetch product IDs from the cart (`$original->getLineItems()->filterType(LineItem::PRODUCT_LINE_ITEM_TYPE)->getReferenceIds()`), skip IDs already fetched, and store each new price in `CartDataCollection` under a prefixed key (e.g. `'price-overwrite-'.$id`) to avoid duplicate lookups and key collisions with other collectors. Then implement `Shopware\\Core\\Checkout\\Cart\\CartProcessorInterface::process` on the same class: for each product line item in `$toCalculate`, read the stored price from `CartDataCollection`, build a `Shopware\\Core\\Checkout\\Cart\\Price\\Struct\\QuantityPriceDefinition` from the new price plus the item's existing tax rules and quantity, calculate it via an injected `Shopware\\Core\\Checkout\\Cart\\Price\\QuantityPriceCalculator`, then call `$product->setPrice($calculated)` and `$product->setPriceDefinition($definition)`. Register the combined class under both tags, ordered after the core product collector/processor: `$services->set(OverwritePriceCollector::class)->args([service(QuantityPriceCalculator::class)])->tag('shopware.cart.processor', ['priority' => 4500])->tag('shopware.cart.collector', ['priority' => 4500]);`. Always compute/query prices in the collector, not the processor \u2014 querying data inside `process()` is discouraged since it may run repeatedly \u2014 and always mutate `$toCalculate`, not `$original`, in `process()`, since `$toCalculate` is the instance actually used.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md:17-48"], "toolCallLog": [{"tool": "Bash", "args": "grep -n \"change-price\\|overwrite.*price\\|line item.*price\\|cart.*price\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-08": {"query": "Which service do I type-hint to read products \u2014 `EntityRepositoryInterface` \u2014 and how do I inject it into my plugin service?", "category": "edge", "option": "fs-wiki", "answer": "The corpus does not use the name `EntityRepositoryInterface` \u2014 Shopware's Data Abstraction Layer repositories are exposed as services named `<entity_name>.repository` (e.g. `product.repository`), not as a fixed interface type-hint. To read products, inject the entity repository via `services.php` using `service('product.repository')` as a constructor argument (or rely on autowire/autoconfigure for other injected services), then call `$this->productRepository->search(new Criteria(), $context)`, which returns an `EntitySearchResult`. General dependency injection into a plugin service follows the same pattern: add the dependency as a typed constructor parameter and either let autowire/autoconfigure resolve it, or declare it explicitly in `services.php` with `->args([service(ServiceOrRepositoryId::class-or-id)])`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md:20-56", "platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md:17-58"], "toolCallLog": [{"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"EntityRepositoryInterface\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Bash", "args": "grep -rln \"EntityRepository\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Bash", "args": "find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/data-handling -type f"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md"}, {"tool": "Read", "args": "path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md"}, {"tool": "Bash", "args": "grep -rn \"EntityRepository \\$\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "partial"}, "dev-33": {"query": "How do I register a custom Administration module from my plugin, and what has to line up for it to actually show up after a build?", "category": "dev", "option": "fs-wiki", "answer": "Create `<plugin root>/src/Resources/app/administration/src/module/<module-name>/index.js` and import it from `main.js` (e.g. `import './module/swag-example';`). In `index.js`, register the module with `Shopware.Module.register('swag-example', { type: 'plugin', name: 'Example', title: 'swag-example.general.mainMenuItemGeneral', description: '...', color: '#ff3d58', icon: 'regular-shopping-bag', ... })`, setting `color`, `icon`, `title`, `description`, a unique `name`, and `type` (`plugin` for third-party modules \u2014 `core` is reserved and `type` itself is a naming convention rather than an enforced value). Add `routes` and a menu `navigation` entry, and add translation `snippets` per locale (typically `snippet/de-DE.json` and `snippet/en-GB.json`), keyed under the module name, matching the snippet keys used in `title`/`description`. Optionally, link the module into Settings via the `settingsItem` array (`group`: `shop`, `system`, or `plugins`; `icon`; `to` \u2014 the route name). Finally, build the Administration JS with `shopware-cli project admin-build` (or `composer run build:js:admin` in the platform contribution setup); the plugin must be activated for the build to apply and the built assets must ship with the plugin. For the module to actually appear after the build, everything has to line up: the `index.js` entry point must be imported from `main.js` (Shopware 6 requires an `index.js` per module), the module must be registered via `Shopware.Module.register`, its routes/components and snippet keys must be correctly wired, and the plugin must be active \u2014 the Administration build step only compiles the assets, it does not fix missing wiring.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/add-custom-module.md:19-77"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"add-custom-module\\|register.*module\\|Module.register\\|main-module\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration -i"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/add-custom-module.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-54": {"query": "How do I register a plugin cookie in the storefront cookie consent manager in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Register a listener for `Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent` in your services config, e.g. `$services->set(CookieListener::class)->tag('kernel.event_listener', ['event' => 'Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent']);`. In the listener's `__invoke(CookieGroupCollectEvent $event)`, fetch a group from `$event->cookieGroupCollection` (e.g. via `CookieProvider::SNIPPET_NAME_COOKIE_GROUP_COMFORT_FEATURES`), get or create its `CookieEntryCollection`, and add a `CookieEntry`, for example: `$cookieEntry = new CookieEntry('my-cookie-key'); $cookieEntry->name = 'cookie.myCookieName'; $cookieEntry->value = '1'; $cookieEntry->expiration = 30; $entries->add($cookieEntry);`. Cookie groups must not carry the `cookie`, `value`, `expiration`, or `isRequired` parameters \u2014 those belong only on individual `CookieEntry` objects. Since Shopware 6.7.3.0, cookies use these structured `CookieEntry`/`CookieGroup` objects instead of the older array format; the deprecated `CookieProviderInterface` still works for backward compatibility with array-based definitions (used in 6.7.2 and earlier) but `CookieGroupCollectEvent` is now preferred. Also since 6.7.3.0, cookie configurations carry a hash stored client-side in the `cookie-config-hash` cookie (keyed per language ID); any configuration change updates the hash and triggers a re-consent prompt for the affected language.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md:1-63"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"cookie consent\\|CookieConfiguration\\|cookie-configuration\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-01": {"query": "How do I extend the product entity with a new association in Shopware's Data Abstraction Layer?", "category": "dev", "option": "fs-wiki", "answer": "Create an `EntityExtension` class in your plugin (e.g. under `<plugin root>/src/Extension/...`) that extends `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityExtension`. Implement `getDefinitionClass()` to point at the entity's definition to extend (e.g. `ProductDefinition::class`), and override `extendFields(FieldCollection $collection)` to add the new fields. Register the class with the `shopware.entity.extension` service tag. To add an association backed by a database column, add a `OneToOneAssociationField('exampleExtension', 'id', 'product_id', ExampleExtensionDefinition::class, true)` flagged with `CascadeDelete()`, define the linked entity definition (with an `FkField`, a `ReferenceVersionField` if the base entity is versioned, and the inverse `OneToOneAssociationField`), register that definition with the `shopware.entity.definition` tag, and add the new table via a database migration; you can then write to it via `$this->productRepository->upsert([['id' => '<product id>', 'exampleExtension' => ['customString' => 'foo bar']]], $context)`. For a runtime-only (non-persisted) association, subscribe to the entity's loaded event (e.g. `ProductEvents::PRODUCT_LOADED_EVENT`) and call `$productEntity->addExtension('custom_string', new ArrayEntity([...]))` \u2014 the value must be a struct, not a scalar. Since Shopware 6.6.10.0, a `BulkEntityExtension` subclass can extend multiple entities at once via `collect()`, tagged `shopware.bulk.entity.extension`. Important gotcha: setting `autoload` to `true` on both the `EntityExtension` side and the target `EntityDefinition` side for the same association causes recursion/out-of-memory errors \u2014 to auto-load on every fetch, set `autoload` to `true` only on the `EntityExtension` side. If two brand-new custom entities need to be related to each other (rather than extending an existing core entity), the general association types \u2014 `OneToOneAssociationField`, `OneToManyAssociationField`/`ManyToOneAssociationField`, and `ManyToManyAssociationField` (the latter via a `MappingEntityDefinition`) \u2014 are declared directly on the entities' own definitions.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md:1-72", "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-associations.md:1-58"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"association\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework; find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*association*\""}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-associations.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-57": {"query": "B2B Suite support ends with 6.8 \u2014 how do I run the B2B Suite Migration to B2B Components and check that it finished?", "category": "dev", "option": "fs-wiki", "answer": "After configuring migration configurators and XML mappings, run the B2B Suite to B2B Commercial migration in this sequence: 1) Validate the configuration with `bin/console b2b:migrate:validate` (checks XML well-formedness/schema and that referenced fields/tables exist). 2) In a separate terminal, monitor progress with `bin/console b2b:migrate:progress --watch`. 3) Start the migration with `bin/console b2b:migrate:commercial` \u2014 this requires the queue worker to be running. 4) Review any errors logged in the `b2b_components_migration_errors` table to check completion status. 5) If needed, roll back with `bin/console b2b:migrate:rollback`.", "citations": ["platform/dev/6.7/products/extensions/b2b-suite-migration/development/validation-and-run.md:1-49"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"B2B Suite\\|B2B Components\\|b2b-components\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/products/extensions/b2b-suite-migration/development/validation-and-run.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-53": {"query": "My theme config labels disappeared from the Theme Manager after 6.7 \u2014 how do I define `theme.json` config fields and where do their translations go now?", "category": "dev", "option": "fs-wiki", "answer": "`theme.json` lives at `<plugin root>/src/Resources/theme.json`; after changes run `bin/console theme:refresh` to apply them (this also updates `configInheritance` relationships). Config fields are defined under `config.fields.<field-key>` with parameters `type` (`color`, `text`, `number`, `fontFamily`, `media`, `checkbox`, `switch`, `url`), `editable`, `tab`, `block`, `section`, `custom` (raw data exposed via API only), `scss` (set `false` to skip SCSS variable injection), and `fullWidth`; these entries appear in the Administration Theme Manager and are merged with (inherit from) the Storefront config. Field definitions changed around v6.7.1.0: since 6.7.1.0, `label`/`helpText` are omitted from `theme.json` field objects entirely (they were inline translation objects in `theme.json` before that). Translations now live as snippet keys instead, stored in files such as `<plugin root>/src/Resources/app/administration/src/app/snippet/de.json` (locale-specific `de-DE.json`/`en-GB.json` also supported), using the key structure: tab `sw-theme.<technicalName>.<tabName>.label`, block `sw-theme.<technicalName>.<tabName>.<blockName>.label`, section `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.label`, field `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.<fieldName>.label`/`.helpText`, and option `...<fieldName>.<index>.label` (unnamed tab/block/section segments use `default` in the key). This is why labels disappeared after upgrading \u2014 the old inline `label`/`helpText` in `theme.json` are deprecated (for v6.8) in favor of these Administration snippets.", "citations": ["platform/dev/6.7/guides/plugins/themes/configuration/theme-configuration.md:1-78"], "toolCallLog": [{"tool": "Bash", "args": "grep -rln \"theme.json\\|Theme Manager\\|theme config\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/themes/configuration/theme-configuration.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-62": {"query": "I changed a setting in `.env` on a deployed 6.7 shop but it still behaves the old way \u2014 what takes precedence between `.env`, `.env.local` and the real environment variables, and which settings does Shopware not read from `.env` at all?", "category": "dev", "option": "fs-wiki", "answer": "The corpus confirms `.env`, `.env.local`, and the real server/container/deployment-platform environment variables are all valid places Shopware environment variables can live (`.env`, `.env.local`, server/container environment, deployment platform), but it does not spell out an explicit precedence order between them. Following standard Symfony Dotenv component behavior (which Shopware is built on), real environment variables set on the server/container always take precedence over `.env.local`, which in turn takes precedence over `.env` \u2014 so a change only to `.env` will be silently overridden if the same variable is already set as a real environment variable in the deployment. [from memory] As for what Shopware does not read from `.env` at all: shop settings that merchants can change in the Administration (or via Admin API/plugin code) come from the database-backed system configuration, not from environment variables \u2014 that mechanism is explicitly separate from `.env`/`.env.local`/server environment variables in the configuration-mechanisms table. There is also a separate override layer, static system configuration (`config/packages/*.yaml` under `shopware.system_config`), which itself can pull from env vars via Symfony processors (e.g. `'%env(bool:ALLOW_BUY_IN_LISTING)%'`) but overlays the database value directly rather than being an `.env` file lookup, and once set this way the value can no longer be edited in the Administration.", "citations": ["platform/dev/6.7/guides/hosting/configurations/shopware/_index.md:20-34", "platform/dev/6.7/guides/hosting/configurations/shopware/static-system-config.md:23-51"], "toolCallLog": [{"tool": "Read", "args": "platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md"}, {"tool": "Bash", "args": "grep -rln \"\\.env\\.local\\|env.local\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"}, {"tool": "Read", "args": "platform/dev/6.7/guides/hosting/configurations/shopware/static-system-config.md"}, {"tool": "Bash", "args": "grep -n \"\\.env\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/configurations/shopware/_index.md"}, {"tool": "Read", "args": "platform/dev/6.7/guides/hosting/configurations/shopware/_index.md"}, {"tool": "Bash", "args": "grep -n -B2 -A5 \"\\.env\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/installation/legacy-setups/symfony-cli-setup.md"}], "notFoundClaim": false, "memoryClaims": ["Following standard Symfony Dotenv component behavior (which Shopware is built on), real environment variables set on the server/container always take precedence over `.env.local`, which in turn takes precedence over `.env` \u2014 so a change only to `.env` will be silently overridden if the same variable is already set as a real environment variable in the deployment."], "sourceVerdict": "partial"}, "dev-51": {"query": "Custom entities declared in `Resources/config/entities.xml` no longer work for my plugin in Shopware 6.7 \u2014 how do I define and register a DAL entity with PHP attributes instead?", "category": "dev", "option": "fs-wiki", "answer": "Since Shopware v6.6.3.0, entities can be registered via PHP attributes on a class extending `Entity`, instead of writing separate `EntityDefinition`, `EntityEntity`, and `EntityCollection` classes (the old XML config approach). Steps: 1) Define the entity by extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity` and add `#[Entity('entity_name', collectionClass: ...)]` (class `Shopware\\Core\\Framework\\DataAbstractionLayer\\Attribute\\Entity`, aliased `EntityAttribute`); `name` is required/unique, `collectionClass` defaults to `EntityCollection` (custom collection classes need 6.6.9.0+). 2) Add a primary key with `#[PrimaryKey]` on a property (typically a `string` UUID). 3) Register the class in `services.php` with the `shopware.entity` tag, e.g. `$services->set(Examples\\ExampleEntity::class)->tag('shopware.entity');` \u2014 Shopware then auto-registers an `EntityDefinition` and `EntityRepository` named `example_entity.definition`/`example_entity.repository`. 4) Define fields with `#[Field(type: FieldType::...)]`, where `type` accepts a `FieldType` constant or, since 6.6.9.0, any FQCN extending `Field` directly (e.g. `#[Field(type: PriceField::class)]`). 5) Use special attributes `AutoIncrement` and `ForeignKey(entity: '...')` where needed, and `#[Serialized(serializer: ...)]` for JSON fields needing custom (de)serialization. 6) For custom fields, use `EntityCustomFieldsTrait` or the `#[CustomFields]` attribute on a nullable `array` property. 7) Fields are hidden from the API by default \u2014 expose with `#[Field(..., api: true)]` or scope with `api: [AdminApiSource::class]`/`api: [SalesChannelApiSource::class]`. 8) For translations, set `translated: true` on a nullable `#[Field]` property to get an auto-created `TranslatedField`/`EntityTranslationDefinition`, and add `#[Translations]` on a nullable array property for the `translations` association. 9) Non-nullable properties are required by default; add `#[Required]` explicitly where needed (mandatory for translated fields, which must be nullable). 10) Associations use `OneToOne`, `OneToMany`, `ManyToOne`, `ManyToMany` attributes paired with `#[ForeignKey(entity: '...')]`. With this approach there is no need to write getters/setters, `EntityTranslationDefinition`, or `EntityCollection` classes by hand.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md:1-62"], "toolCallLog": [{"tool": "Read", "args": "platform/index.md"}, {"tool": "Bash", "args": "grep -rln \"entities.xml\\|DAL entity\\|EntityDefinition\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}, {"tool": "Read", "args": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-38": {"query": "How do I write Jest unit tests for my Administration components in Shopware 6.7?", "category": "dev", "option": "fs-wiki", "answer": "Put test files next to the file under test, named with suffix `.spec.js` or `.spec.ts`. Services and isolated ES modules can be imported and tested directly without mocking, e.g. `import Sanitizer from 'src/core/helper/sanitizer.helper';`. Components are registered globally via `Shopware.Component.register('name', {...})` and built into a real Vue component via `Shopware.Component.build('name')`, which resolves template inheritance/overrides \u2014 you can generate test boilerplate with `composer run admin:create:test` (paste the component/service path when prompted). Install JS dependencies with `composer run init:js`, then run all tests with coverage via `composer run admin:unit`, or only changed-file tests in watch mode via `composer run admin:unit:watch`. Mount components with `mount()` or `shallowMount()` (preferred, since it stubs child components) from `@vue/test-utils`, passing `props`, `stubs`, `mocks`, and `attachTo: document.body` as needed. Several preconfigured mocks/globals are available: `global.activeAclRoles = ['product.editor']` for ACL, `global.activeFeatureFlags = ['FEATURE_NEXT_12345']` for feature flags, and `global.repositoryFactoryMock.responses.addResponse({ method, url, status, response })` for repository factory calls (disable the missing-mock warning with `global.repositoryFactoryMock.showWarning = false`). Global mocks like `$tc`, `$device`, `$store`, `$router` can be overridden via `mount`'s `mocks` option; missing directives (e.g. `clipboard`) require `createLocalVue()` and `
