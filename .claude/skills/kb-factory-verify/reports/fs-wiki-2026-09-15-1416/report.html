report delta includes an unusual self-inspection call (Read of edge-06's own raw report file)","dev-11: findability recorded fail — agent settled on a different page than the named target (drift, not resolved by auditor)","dev-16: findability recorded fail — agent settled on a different page than the named target (drift, not resolved by auditor)","rule-02: findability recorded fail — agent settled on a different page than the named target (drift, not resolved by auditor)","rule-03: findability recorded fail — agent settled on a different page than the named target (drift, not resolved by auditor)","rule-06: findability recorded fail — agent settled on a different page than the named target (drift, not resolved by auditor)"]},"raw":{"fs-wiki":{"dev-61":{"query":"After the upgrade my Elasticsearch index has to be rebuilt — where do I set the shard and replica counts and which reindex command do I run?","category":"dev","option":"fs-wiki","answer":"Shard and replica counts are set in `config/packages/elasticsearch.yml` under `elasticsearch.index_settings` (`number_of_shards`, `number_of_replicas`) — the default since 6.4.12.0 is three shards and three replicas. To rebuild the index after a change, first run `bin/console cache:clear` so any `.env` changes apply, then `bin/console es:index` to index to Elasticsearch; use `bin/console dal:refresh:index --use-queue` to reindex the whole shop (ES, SEO URLs, product index, etc.) through the message queue. If indexing finished without errors but the Storefront still shows no products, run `bin/console es:create:alias` manually. For Administration search, use `bin/console es:admin:index` (plus `es:admin:reset`/`es:admin:test`) instead.","citations":["platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md:40-55","platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md:68-68"],"toolCallLog":[{"tool":"Read","args":"path=platform/index.md"},{"tool":"Bash","args":"grep -rln \"elasticsearch\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i"},{"tool":"Read","args":"path=platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md"},{"tool":"Read","args":"path=platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-29":{"query":"How do I add my own data to an existing Storefront page or pagelet from a plugin without overriding the core controller?","category":"dev","option":"fs-wiki","answer":"Subscribe to the page's or pagelet's Loaded event (e.g. Shopware\\Storefront\\Pagelet\\Footer\\FooterPageletLoadedEvent) in an EventSubscriberInterface tagged kernel.event_subscriber. Fetch the extra data via a store-api route rather than the DAL directly — if an existing route would return more than you need, define your own: an abstract route (e.g. AbstractProductCountRoute) with getDecorated() and load(Criteria $criteria, SalesChannelContext $context), annotated with #[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]])], and a concrete implementation whose getDecorated() throws DecorationPatternException and whose load() is routed (path, name, methods) and uses repository aggregate() (not search()) plus a response class extending Shopware\\Core\\System\\SalesChannel\\StoreApiResponse wrapping the result (getObject() returns it). Register the route service (e.g. service('product.repository'), ->public()) and let routes.php import it via attribute routing. In the listener, call the route and attach the result as an extension on the page/pagelet struct: $response = $this->productCountRoute->load(new Criteria(), $event->getSalesChannelContext()); $event->getPagelet()->addExtension('product_count', $response->getObject()); — addExtension() comes from ExtendableTrait and requires a Struct. Then, without touching the core controller, extend the corresponding Twig template with sw_extends, call {{ parent() }}, and read the data via the extensions map, e.g. {% if footer.extensions.product_count %}{{ footer.extensions.product_count.count }}{% endif %} in the block layout_footer_navigation_columns.","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md:15-56"],"toolCallLog":[{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*page-loaded*\" -o -iname \"*add-data-to*\" -o -iname \"*page-events*\""},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-66":{"query":"Which request headers change Admin API behaviour for language, entity version, parent-child inheritance and skipping flow triggers during a bulk import?","category":"dev","option":"fs-wiki","answer":"`sw-language-id` (constant `HEADER_LANGUAGE_ID`) returns entities in the given language instead of the system language. `sw-version-id` (`HEADER_VERSION_ID`) reads a specific entity version (e.g. orders); the default without it is the most recent record. `sw-inheritance` (`HEADER_INHERITANCE`) makes the request consider parent-child inheritance for products/variants — send `1`. `sw-skip-trigger-flow` (`HEADER_SKIP_TRIGGER_FLOW`) stops flows from being triggered, which is the header to use for a bulk import via `POST /api/_action/sync` — send `1`. All four are defined as constants on `Shopware\\Core\\PlatformRequest`. Note that with `sw-language-id`, a translatable plain field (e.g. `product.name`) can be `null` when no explicit translation exists for that language, while the nested `translated` object always carries a value with inheritance applied — so display clients should read `product.translated.<field>` rather than the plain field.","citations":["platform/dev/6.7/guides/development/integrations-api/request-headers.md:25-44","platform/dev/6.7/guides/development/integrations-api/request-headers.md:54-54"],"toolCallLog":[{"tool":"Read","args":"path=platform/dev/6.7/guides/development/integrations-api/request-headers.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-12":{"query":"A spec asks for customer-specific pricing and for a flow that calls an external URL when an order is placed — before I build either of them, does Shopware already ship them, and what has to be licensed or installed for them to exist in the shop?","category":"func","option":"fs-wiki","answer":"Both already exist in Shopware, but each needs a commercial add-on, not just core. Customer Specific Pricing lets merchants offer individually calculated prices per customer (list prices, graduated prices, or currency-dependent prices), synced into Shopware entirely via the Admin API (there is no Store extension and no dedicated Administration module — creating, reading, changing and deleting custom prices is API-only, and a bulk-edit-custom-prices API reference is published as part of the Admin API docs). It requires a Shopware Beyond plan and the Shopware Commercial extension; note that product-variant price inheritance is not applied to custom prices, so each variant needs its own ID-targeted price entry, and once a customer with stored individual prices logs out, the standard price is shown again. For the flow that calls an external URL on order placement: Flow Builder itself (Settings > Automation) is core/built-in — it lets you pick the `checkout.order.placed` trigger, add rule-based conditions, and attach actions with no extra license. However, the specific action needed here, 'Call URL (Webhook)' (supporting GET/POST/PUT/PATCH/DELETE with configurable URL, parameters, headers, body and Basic Auth), is a Webhook Action that requires the Evolve plan and the Shopware Commercial extension to be installed/licensed; without that extension the webhook-calling action is not available, though other flow actions (send mail, assign tags, etc.) remain available on core.","citations":["platform/func/extensions/customer-specific-pricing.md:18-38","platform/func/settings/Flow-Builder.md:18-40"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"individual price|customer-specific price|customer specific pricing|advanced pricing\" platform/func"},{"tool":"Bash","args":"grep -rli \"webhook|call url|external url\" platform/func"},{"tool":"Read","args":"platform/func/features/customer-specific-pricing.md"},{"tool":"Read","args":"platform/func/features/webhook-actions-in-flow-builder.md"},{"tool":"Read","args":"platform/func/extensions/customer-specific-pricing.md"},{"tool":"Read","args":"platform/func/settings/Flow-Builder.md (offset 1, limit 40)"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-13":{"query":"There is no event for what I need to change in a core Shopware service — how do I decorate or replace that service from my plugin?","category":"dev","option":"fs-wiki","answer":"Use Symfony service decoration. Register the decorator in `src/Resources/config/services.php`: `$services->set(ExampleServiceDecorator::class)->decorate(ExampleService::class)->args([service('.inner')]);`. The contract to decorate is an abstract class (from core or another plugin) declaring `abstract public function getDecorated(): AbstractExampleService;` plus its abstract business methods; the base implementation's `getDecorated()` throws `Shopware\\Core\\Framework\\Plugin\\Exception\\DecorationPatternException`. Your decorator extends the same abstract class, takes the inner `AbstractExampleService` in its constructor via `.inner`, returns it from `getDecorated()`, and delegates to it (e.g. `return $this->decoratedService->doSomething() . ' ...';`) so it can add behavior before/after or fully replace the call. Always type-hint the abstract class in constructors, never the concrete class, or you bypass the decoration chain — decorators nest (plugin B wraps plugin A wraps core), and a decorator that does not call the inner service silently drops the rest of the chain with no runtime warning. Use `bin/console debug:container --show-arguments <service-id>` to inspect the chain. Prefer decoration to change how a service behaves; prefer events/extension points to react to something Shopware does without altering behavior.","citations":["platform/dev/6.7/guides/plugins/plugins/services/adjusting-service.md:1-85"],"toolCallLog":[{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/services/adjusting-service.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-07":{"query":"How do I import products from a CSV with an import/export profile — column mapping, matching identifiers and a dry run?","category":"func","option":"fs-wiki","answer":"The Settings > Automation > Import/Export module imports/exports data via CSV files and configurable profiles. The CSV file must be UTF-8 encoded, use a semicolon field separator, a quotation-mark string separator, and decimal prices with a point (e.g. `5.00`, not `5,00`). A profile is created on the Profiles tab with: Profile name, Usage (import/export/both), Object type (e.g. Product, Customer), Separator character (default semicolon), Enclosure character, and Import settings (Create new records / Update existing data). Column mapping is done row by row via 'Add new mapping', where each row sets the Database mapping, whether it's Required, a Default Value, and its Position. To use a different matching identifier than the row's UUID, use the 'Second Unique Identifier' field on the profile's Advanced Settings tab (e.g. map import rows by `productNumber` instead of `id`) — though this isn't always sensible: if multiple products share the same value on that field (e.g. `translation.DEFAULT.name`), only the first matching record is identified. Product imports require mandatory fields `id`, `taxId`, `productNumber`, `stock`, `name`; the default product CSV columns also include `parent_id`, `active`, `description`, `price_net`, `price_gross`, `tax_rate`, `tax_name`, `cover_media_id`, `cover_media_url`, `manufacturer_id`, `categories`, and `sales_channels` (multi-value fields are pipe-separated with `|`). On the Import tab, the flow is: Upload CSV file, Select profile, Start import (validates and imports error-free records, collecting erroneous ones into a downloadable CSV with an `_error` column), Start dry run (tests the import without writing any data), then check Import activity (last 30 days, with re-download of source/profile or an error-only CSV) or Abort process. Importing product variants specifically requires 4 steps in order: import products, import properties, import variant configuration (mapping `option_id`/`product_id`), then either import the variants themselves via the default product profile with 'Import product variants' checked (mandatory fields `parent_id`, `product_number`, `active`, `stock`, `optionIds`) or generate them via the product's 'generate variants' tab. Gotchas: import can only add information, never remove it (e.g. an existing sales channel assignment on a product cannot be removed via import); and before importing customers (from 6.4.9.0), emailing should be disabled under Settings > System > Mailer to avoid sending registration emails to every imported customer.","citations":["platform/func/shopware-en/settings/importexport.md:18-64"],"toolCallLog":[{"tool":"Read","args":"platform/func/shopware-en/settings/importexport.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-44":{"query":"After the Vue 3 upgrade my admin plugin broke — this.$parent resolves to the wrong component and a prop default that calls this.$tc throws. What do I have to change?","category":"dev","option":"fs-wiki","answer":"Both symptoms are documented Vue 2 to Vue 3 migration gotchas for the Shopware Administration (Vue 3 from 6.6 onward). For `this.$parent`: async component wrappers change the component tree, so the immediate parent may now be an `AsyncComponentWrapper` instead of the component you expect — you may need `this.$parent.$parent`, but the guide's real recommendation is to prefer services or events instead of relying on `$parent` at all. For the prop default calling `this.$tc`: prop default functions have no `this` in Vue 3, so `this.$tc` is unavailable there — use `Shopware.Snippet.tc` instead (confirmed in code: `Shopware.Snippet.tc` is mapped to `i18n.global.t` at `vendor/shopware/administration/Resources/app/administration/src/core/shopware.ts:274`). More generally, the migration guide says to search your plugin code for any `this.$` usage — internal Vue API calls are very likely to break in Vue 3, except `this.$tc` itself (which still works inside normal component methods, just not in contexts without `this`, like prop defaults). Also check `this.$slots` — having a key is not sufficient, verify the slot actually yields a vnode — and be aware mutating props now throws hard errors, and Vuex stores can lose reactivity if getters alter state.","citations":["platform/dev/6.7/guides/upgrades-migrations/administration/vue3.md:14-67"],"toolCallLog":[{"tool":"Read","args":"platform/dev/6.7/guides/upgrades-migrations/administration/vue3.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-04":{"query":"What does the Shopware Migration Assistant transfer automatically from Shopware 5, and what has to be mapped by hand before the migration starts?","category":"func","option":"fs-wiki","answer":"Automatically migrated groups are: Basic data (categories, customer groups, currencies, sales channels, number ranges — mandatory), Products (products, properties, product options/properties, translations, cross-selling, main variant relations), Customers & orders (customers, shipping methods, orders, order documents), Promotions (customers, promotions), SEO URLs, and Product reviews (plus media). Manual mapping is required before starting the migration for: payment methods, a Standard Payment Method, Salutation, Delivery time, and a Standard delivery time — these target entries must already exist in Shopware 6 before the migration begins, and once mapped they cannot be remapped without deleting and recreating the whole migration. Beyond the mapping step, several things are not transferred automatically at all and must be recreated manually afterwards: shipping costs (as opposed to shipping methods, which do migrate), payment methods' actual configuration, document templates, and email templates (which use Twig in Shopware 6); shopping worlds/shop pages must be rebuilt under Shopping Experiences because of a different technical structure; old Shopware 5 templates cannot be reused or migrated (Shopware 6 ships its own default template as a starting basis); and B2B Suite data cannot be transferred from Shopware 5 to Shopware 6 at all. Also note that two default sales channels already exist on a fresh Shopware 6 install alongside the migrated Shopware 5 shops/subshops, and the domain settings of newly created sales channels must be adjusted to actually see the migrated data in the storefront.","citations":["platform/func/migration-en/what-is-migrated.md:18-43"],"toolCallLog":[{"tool":"Read","args":"platform/func/migration-en/what-is-migrated.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-18":{"query":"My plugin's cart processor adds a surcharge line item, but it is added again on every recalculation and its price is stale after the customer changes the quantity — how do I split the work between the collector and the processor?","category":"dev","option":"fs-wiki","answer":"Split responsibilities strictly: the collector (`Shopware\\Core\\Checkout\\Cart\\CartDataCollectorInterface::collect`) is the only place that fetches data — from the database or an API — and stores it in `CartDataCollection` under a unique key with `$data->set('uniqueKey', ...)`; that collection is then shared with every processor. The processor (`Shopware\\Core\\Checkout\\Cart\\CartProcessorInterface::process`) must never query data itself, because it can run many times per request — instead it reads the already-collected value with `$data->get('uniqueKey')` and applies the actual change to `Cart $toCalculate` (never `$original`, which is input-only). For a surcharge specifically, follow the 'Add Cart Discounts' pattern: in `process()`, build the surcharge/discount `LineItem` fresh each run from current cart data (using `PercentagePriceDefinition`/`PercentagePriceCalculator` or `QuantityPriceDefinition`/`QuantityPriceCalculator` and a `LineItemRule` filter so the price recalculates against the current, up-to-date quantity/price) and `$toCalculate->add($item)` it — because `process()` runs on every recalculation against a fresh `$toCalculate`, this naturally avoids duplicate additions and stale prices as long as the item is derived from `$toCalculate`'s current state rather than cached from an earlier run. Register both the collector and processor with DI tags `shopware.cart.collector` / `shopware.cart.processor`; tag priority decides execution order (higher runs first) — core registers the product collector/processor at `5000` and the delivery collector/processor at `-5000`, so pick a priority between them (e.g. `4500`) if the surcharge needs already-calculated product data but must still run before delivery calculation. Core autoconfigures both interfaces with their tags, so an explicit `->tag()` is needed only to set a priority.","citations":["platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md:1-82","platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-discounts.md:1-79"],"toolCallLog":[{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-discounts.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-48":{"query":"After upgrading, my storefront JavaScript plugin no longer loads — how do I register it asynchronously with `PluginManager` and where does the compiled file have to be shipped?","category":"dev","option":"fs-wiki","answer":"Registration happens in the entry file `<plugin root>/src/Resources/app/storefront/src/main.js` (a `main.ts` there takes precedence if both exist). Normal registration: `import ExamplePlugin from './example-plugin/example-plugin.plugin'; const PluginManager = window.PluginManager; PluginManager.register('ExamplePlugin', ExamplePlugin, '[data-example-plugin]');` — signature `register(pluginName, pluginClass, selector = document, options = {})`; without a selector the plugin runs on `document` on every page, with one it runs only where a matching element exists. For asynchronous registration, pass a dynamic import instead of the class: `PluginManager.register('ExamplePlugin', () => import('./example-plugin/example-plugin.plugin'), '[data-example-plugin]');` — the installed code detects this because the value has no `prototype` (an arrow function), so it is treated as async, is not bundled into the main JS, and is downloaded only when the selector matches on the page. Registering the same name + selector twice only logs 'already registered' and is ignored. The plugin class itself extends `window.PluginBaseClass` and must override `init()` (the default implementation only logs a warning) — this is a common reason a plugin 'doesn't load' even though it's registered. Build with `shopware-cli project storefront-build` (project template) or `composer run build:js:storefront` (platform contribution setup). The compiled file must be shipped at `<plugin root>/src/Resources/app/storefront/dist/storefront/js/<plugin-name>/<plugin-name>.js`, where `<plugin-name>` is the plugin's technical name converted from camelCase to snake_case with `_` replaced by `-` (e.g. `SwagExample` -> `swag-example`); Shopware picks the compiled file up automatically if it exists at that path.","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md:15-93"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"PluginManager\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront/"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-58":{"query":"My shopware.yaml still uses redis_url — how do I define the named Redis connections in Shopware 6.7 and which eviction policy does each one need?","category":"dev","option":"fs-wiki","answer":"Since 6.6.8.0, Redis is configured via named connections under `shopware.redis.connections` in `config/packages/shopware.yaml`; each connection only requires a `dsn` key, e.g.:\n```yaml\nshopware:\n    redis:\n        connections:\n            ephemeral:\n                dsn: 'redis://host1:port/dbindex'\n            persistent:\n                dsn: 'redis://host2:port/dbindex?persistent=1'\n            ephemeral_2:\n                dsn: '%env(REDIS_EPHEMERAL)%/2'\n```\nEach connection becomes a container service `shopware.redis.connection.<name>` (names must be unique and follow service-naming rules), and subsystems reference a connection by name (e.g. number ranges: `increment_storage: redis` plus `config.connection: <name>`, mandatory when storage is redis). Since one Redis instance cannot mix eviction policies per database, use separate instances/connections by data category: ephemeral data (HTTP cache, object cache) — memory-only persistence, `volatile-lru` eviction; durable, aging data (sessions) — RDB snapshots and/or AOF persistence, `allkeys-lru` eviction; durable, critical data (cart, number range, lock store, increment) — persisted, `volatile-lru` eviction. For high load, append `?persistent=1` to the DSN for connection pooling (not data persistence). Watch out for a cache Redis hitting its memory limit from keys without a TTL (Symfony's tag-aware cache adapter stores tag-index sets without TTL that need pruning), since `volatile-lru` only evicts keys that have a TTL.","citations":["platform/dev/6.7/guides/hosting/infrastructure/redis.md:1-78"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"redis_url\\|named.*redis\\|redis connection\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | head -20"},{"tool":"Read","args":"platform/dev/6.7/guides/hosting/infrastructure/redis.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-41":{"query":"`composer update` to Shopware 6.7 aborts on a platform requirement and my admin build then fails too — which PHP, database and Node versions does 6.7 actually require, and how do I check the machine I am on against them before I retry?","category":"dev","option":"fs-wiki","answer":"Shopware 6.7's server stack table gives minimum/recommended versions: PHP minimum 8.2, recommended 8.4 (the installed core's composer.json actually accepts `~8.2.0 || ~8.3.0 || ~8.4.0 || ~8.5.0`), with `memory_limit` >= 512M and `max_execution_time` >= 30s, plus Composer 2.2+ recommended. SQL: minimum MariaDB 10.11 (docs say 10.11.6, but the code check confirms the DatabaseConnectionFactory only enforces 10.11) or MySQL 8.0.22, recommended MariaDB 11.4 / MySQL 8.4; MySQL Innovation releases are unsupported and `max_allowed_packet` must be >= 32M. Node.js/npm (required for the admin/storefront build): minimum Node 20.0.0, recommended Node 24 with npm 10. Required PHP extensions per the installed shopware/core package: ctype, curl, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, openssl, pdo, pdo_mysql, session, simplexml, sodium, xml, xmlreader, zip, zlib (amqp optional). To check your machine before retrying, the page recommends running `php -v`, `php -m`, `php -i | grep memory_limit`, `composer -V`, `node -v`, `npm -v` — and watching for CLI vs FPM php.ini differences or multiple PHP binaries. Shopware CLI's dev-environment TUI Config tab also shows/limits the containerized PHP version to the 8.2–8.5 range if you use the Docker dev environment.","citations":["platform/dev/6.7/guides/hosting/_index.md:15-66","platform/dev/6.7/guides/development/dev-environment.md:26-30"],"toolCallLog":[{"tool":"Read","args":"platform/index.md"},{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -maxdepth 2 -type d"},{"tool":"Read","args":"platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md"},{"tool":"Bash","args":"grep -rli \"requirement\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/installation/; find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/installation -maxdepth 2"},{"tool":"Read","args":"platform/dev/6.7/guides/installation/system-requirements.md"},{"tool":"Bash","args":"grep -rli \"php version\\|node version\\|mysql\\|mariadb\\|requirements\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/"},{"tool":"Read","args":"platform/dev/6.7/guides/installation/project-overview.md"},{"tool":"Read","args":"platform/dev/6.7/guides/development/dev-environment.md"},{"tool":"Read","args":"platform/dev/6.7/guides/hosting/_index.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-59":{"query":"After upgrading to Shopware 6.7 my Varnish cache is never invalidated — what changed in the reverse proxy configuration?","category":"dev","option":"fs-wiki","answer":"The most likely cause is that your Varnish VCL/config still relies on the removed Redis/BAN (LUA) Varnish integration. In 6.7.13 the `ban_method: \"BAN\"` and `use_varnish_xkey: true` reverse-proxy options are deprecated, have no effect, and are removed entirely in 6.8.0 — Shopware 6.7 always purges via the `xkey` module (a `PURGE` request carrying an `xkey` header) regardless of these settings, so a VCL still built around the old BAN method will never receive working invalidations. Fix: install the Varnish `xkey` vmod (Varnish 6.0+, not in Varnish's default install) or switch to the Shopware Varnish Docker image (`github.com/shopware/varnish-shopware`), which ships a default VCL already wired for xkey purges; replace its `__XXX__` placeholders. Also check the config key location: since 6.6.0.0 it is `shopware.http_cache.reverse_proxy` (no longer `storefront.reverse_proxy`), with `enabled: true`, `hosts: [...]`, and `max_parallel_invalidations` (default 2). Ensure `SHOPWARE_HTTP_CACHE_ENABLED=1` is set and `SYMFONY_TRUSTED_PROXIES` is configured (the old bare `TRUSTED_PROXIES` env var stopped being read out of the box since 6.6). To debug, curl the app server directly and check for a `Cache-Control: public, s-maxage=...` response plus an `Xkey:` header — a persistent `Age: 0` everywhere means reverse-proxy mode isn't actually enabled or `Cache-Control: public` is missing from the app response. Note also that since 6.7, `bin/console cache:clear` no longer clears the HTTP cache — use `bin/console cache:clear:http` (reverse-proxy cache when enabled) or `cache:clear:all` for everything.","citations":["platform/dev/6.7/guides/hosting/infrastructure/reverse-http-cache.md:1-98"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"varnish\\|reverse proxy\\|reverse-http-cache\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | head -20"},{"tool":"Read","args":"platform/dev/6.7/guides/hosting/infrastructure/reverse-http-cache.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-42":{"query":"How do I check extension compatibility before upgrading with shopware-cli, and why does it report my plugins in custom/plugins as blocking?","category":"dev","option":"fs-wiki","answer":"Use `shopware-cli project upgrade` (interactively) or its non-interactive preflight `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run`. It runs six phases — readiness, target version choice, extension compatibility + Composer resolution check, plan review, local apply, and report — and the readiness/preparation phases are read-only, so `--dry-run` is safe to run repeatedly. Before running it, the docs recommend `shopware-cli project validate` (finds removed/renamed Shopware PHP types in custom code) and `shopware-cli project autofix composer-plugins` (migrates extensions from custom/plugins into Composer). The wizard's prerequisite check requires that 'all discovered extensions are Composer-managed'; per the Gotchas, 'Extensions outside vendor/ (e.g. custom/plugins) block the readiness check' — that is exactly why plugins living in custom/plugins (not installed via Composer) are reported as blocking. The generated report is written to `.shopware-cli/upgrade/report.md` and lists each extension's status as blocked / needs review / needs update / OK.","citations":["platform/dev/6.7/products/tools/cli/project-commands/upgrade.md:15-79"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"compat\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/tools/cli/"},{"tool":"Read","args":"platform/dev/6.7/products/tools/cli/project-commands/upgrade.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-67":{"query":"What does a minimal app folder and `manifest.xml` need to contain, and which console commands install and activate the app on my local Shopware 6.7?","category":"dev","option":"fs-wiki","answer":"Create the app folder at `custom/apps/<TechnicalName>/` (UpperCamelCase name, e.g. `MyExampleApp`) with a `manifest.xml` inside it validated against `manifest-3.0.xsd`. The minimal manifest is a `<meta>` block: `<name>`, `<label>` (optionally per-language, e.g. `lang=\"de-DE\"`), `<description>`, `<author>`, `<copyright>`, `<version>`, `<icon>`, `<license>`. `author`, `copyright`, `label`, `name`, `license` and `version` are required meta fields — if `author`/`copyright` are missing or empty, `app:refresh` fails. The folder name and `<meta><name>` must match. Commands: `bin/console app:refresh` (alias `app:update`) registers/refreshes the app and validates the manifest; `bin/console app:install --activate MyExampleApp` (using the technical name, not the folder path) installs and activates it in one step — omit `--activate` to install inactive and activate later via Extensions > My Extensions > Apps or `bin/console app:activate MyExampleApp`; `bin/console app:list` shows installed apps; `bin/console app:validate` reports manifest configuration issues. `app:install` asks interactively to accept requested permissions/hosts unless `--force`/`-f` is passed, and `--no-validate` skips manifest validation (debugging only). Clear caches afterward with `bin/console cache:clear` (or `cache:clear:http`/`cache:clear:all`) if changes do not show.","citations":["platform/dev/6.7/guides/plugins/apps/app-base-guide.md:23-50","platform/dev/6.7/guides/plugins/apps/app-base-guide.md:60-66"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"manifest.xml\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"},{"tool":"Read","args":"path=platform/dev/6.7/guides/plugins/apps/app-base-guide.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-11":{"query":"How do I create an integration for Admin API access in the administration and give it the right privileges?","category":"func","option":"fs-wiki","answer":"Go to Settings > System > Integrations and click 'Create integration'. Give it a name, then decide its permissions: either grant it full administrator permissions, or assign it a specific, previously-defined role instead so it only gets the privileges that role grants (roles with granular privileges are configured elsewhere in the administration and then selected here). On creation an access ID and a security key are issued for API authentication; the security key is shown only once and must be saved immediately, since it is never displayed again afterward. The integrations overview lists all integrations by name and permissions, and you can click a name (or use its context menu) to edit or delete it. If credentials are compromised or lost, use 'Regenerate API access key' on the integration's edit screen — this regenerates both the access ID and the security key, so any client using the old credentials must be updated afterward.","citations":["platform/func/settings/system/integrationen.md:22-45"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"integration\" platform/func"},{"tool":"Read","args":"platform/func/settings/system/integrationen.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-03":{"query":"Where do the `#[ORM\\Entity]` mapping attributes for my plugin's entity go in Shopware 6, and how do I get Doctrine's `EntityManager` injected into my service so I can persist it?","category":"edge","option":"fs-wiki","answer":"That premise does not apply to Shopware 6: per the Data Abstraction Layer page, 'Shopware uses no ORM but a thin data abstraction layer (DAL) built for its needs; developers access the database through pre-defined interfaces' — there is no Doctrine `EntityManager` and no `#[ORM\\Entity]` attribute mapping anywhere in Shopware's persistence layer (only its Criteria concept 'resembles Doctrine'). Instead, a plugin entity is defined via an `EntityDefinition` class (registering fields such as `IdField`, `StringField`, associations, etc.) and persisted through an `EntityRepository`, which you get by constructor-injecting `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository` from the DI container — autowiring works when the type/argument name matches, otherwise you wire the service id `<entity>.repository` explicitly (e.g. `product.repository`) in your service definition. CRUD is done through repository methods (`search`, `create`, `update`, `upsert`, `delete`, `createVersion`, `merge`), each taking a `Shopware\\Core\\Framework\\Context` argument that carries request-level state (language chain, currency, etc.) rather than an `EntityManager`.","citations":["platform/dev/6.7/concepts/framework/data-abstraction-layer.md:15-58"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"doctrine|EntityManager\" platform"},{"tool":"Read","args":"platform/dev/6.7/concepts/framework/data-abstraction-layer.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-05":{"query":"How does theme inheritance work in Shopware — theme.json and SCSS overrides?","category":"dev","option":"fs-wiki","answer":"Inheritance is declared in the extending theme's `<plugin root>/src/Resources/theme.json`: each section (`views`, `style`, `script`, `asset`, `configInheritance`) lists placeholders (`@Storefront`, `@Plugins`, `@<ThemeTechnicalName>`) plus its own files, in the order they are applied. Example: `\"views\": [\"@Storefront\", \"@Plugins\", \"@SwagBasicExampleTheme\", \"@SwagBasicExampleThemeExtend\"]` — templates render from Storefront, then installed plugin extensions, then the parent theme, then the current theme. For SCSS: `\"style\": [\"app/storefront/src/scss/overrides.scss\", \"@SwagBasicExampleTheme\", \"app/storefront/src/scss/base.scss\"]` — an `overrides.scss` placed first can set Bootstrap/SCSS variables (e.g. `$border-radius`) before the parent theme's styles are compiled in, since layering follows list order. `asset` works the same way to reuse the parent theme's assets. The Storefront base theme is always inherited even without `@Storefront` in `configInheritance` — an empty list falls back to `@Storefront` for every theme except Storefront itself; a section missing `@Storefront` simply won't get the default theme's files for that section. For `configInheritance` specifically: list the parent theme(s), e.g. `\"configInheritance\": [\"@Storefront\", \"@SwagBasicExampleTheme\"]`, and the extending theme's own `config.fields` in theme.json only needs to declare overrides or genuinely new fields — every inherited field shows in the Administration with an inherit anchor using the parent's value until changed; a field re-declared with a new value in the child is no longer inherited even if the parent also defines it. The last listed theme that differs from the current theme becomes the parent theme for config purposes. `configInheritance` has been available since Shopware 6.4.8.0; run `bin/console theme:refresh` after changing it, since the parent relationship is set at theme installation.","citations":["platform/dev/6.7/guides/plugins/themes/inheritance/add-theme-inheritance.md:15-59","platform/dev/6.7/guides/plugins/themes/configuration/theme-inheritance-configuration.md:15-70"],"toolCallLog":[{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -ipath '*theme*' -iname '*inherit*'"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/themes/configuration/theme-inheritance-configuration.md"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/themes/inheritance/add-theme-inheritance.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-35":{"query":"How do I load entities from the Admin API inside an Administration component using the repository factory and a Criteria?","category":"dev","option":"fs-wiki","answer":"Inject the repositoryFactory DI service in your component (it's a BottleJS container wrapped into Vue inject/provide) and create a repository for your entity, e.g. inject: ['repositoryFactory'], computed: { productRepository() { return this.repositoryFactory.create('product'); } }. The signature is create(entityName, route = '', options = {}); route defaults to /<entity-name-with-dashes> and is overridden for association repositories, and options is read for useSync (save via _action/sync), keepApiErrors and compatibility. Build a Criteria (const { Criteria } = Shopware.Data;) to filter/sort/paginate/associate: criteria.setPage(1), setLimit(10), setTerm('foo'), setIds([...]), setTotalCountMode(2) (0 = no total/fastest, 1 = exact total/slow, 2 = fetches limit*5+1 to know if a next page exists, fast), addFilter(Criteria.equals('product.active', true)), addSorting(Criteria.sort('product.name', 'DESC')), addAggregation(Criteria.avg(...)), and addAssociation/getAssociation for related entities. Then call this.productRepository.search(criteria, Shopware.Context.api).then(result => { ... }) — Shopware.Context.api carries language, version and auth state; search resolves to an EntityCollection (not a SearchResult class, despite what older docs describe). To fetch a single record use repository.get(id, Shopware.Context.api, criteria?), which internally runs search with setIds([id]). Other repository methods: save(entity, Context.api) for manual saves after change tracking, delete(id, Context.api), syncDeleted(ids, Context.api) for bulk deletes, create(Context.api) to build a new local entity, and assign(id, Context.api) to link a ManyToMany association. Associations can be loaded by adding new Criteria().addAssociation('manufacturer') to the request passed to get/search.","citations":["platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md:1-110"],"toolCallLog":[{"tool":"Bash","args":"cd .../wiki/platform && grep -rln \"repositoryFactory\\|repository factory\" dev/6.7/guides/plugins/plugins/administration | head -20"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-05":{"query":"My plugin decorates `CachedProductRoute` to add cache tags — where did the `Cached*Route` classes go in Shopware 6.7 and how do I cache a Store API route now?","category":"gap","option":"fs-wiki","answer":"The corpus's ADR 'Caching Strategy for Store API' (2025-09-15) confirms Shopware moved Store API caching away from decorator classes like `CachedProductRoute` to a route-attribute + reverse-proxy model, reusing the Storefront HTTP cache approach ('route flag, cache tags') but differentiating contexts via headers instead of cookies. Concretely: mark a route cacheable with the `_httpCache` route default (`PlatformRequest::ATTRIBUTE_HTTP_CACHE => true`), the same way core product listing/search/detail routes do — extensions opt in the same way, rather than by decorating a `Cached*Route` class. Only `GET` responses get cache headers, so non-mutating endpoints should support `GET` (a single `_criteria` query parameter carries base64url(gzip(JSON Criteria))) . Context is carried via `sw-language-id`/`sw-currency-id` response headers and a `sw-cache-hash` header/cookie (the ADR calls it `sw-context-hash`, but code uses `sw-cache-hash` and deprecates the old header for 6.8.0), and `Vary` is extended with the access key header plus these context headers. Cache-Control policy is configured under `shopware.http_cache.policies` (e.g. `store_api.cacheable` with `public: true`, `s_maxage: 1800`, `stale_while_revalidate: 86400`, `stale_if_error: 7200`) and mapped via `default_policies.store_api`; invalidation reuses the existing cache-tag mechanism. Gotcha: in 6.7.13.0 this Store API caching only actually applies cache headers when the feature flag `CACHE_REWORK` is active (default `false`) or on `v6.8.0.0` — otherwise Store API responses remain `no-cache`, so the new mechanism may not be doing anything yet on a stock 6.7 install unless that flag is enabled.","citations":["platform/dev/6.7/resources/references/adr/2025-09-15-store-api-cache-strategy.md:14-77"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"CachedProductRoute|Cached.*Route|cache.*store api route|store-api.*cach\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/resources/references/adr/2025-09-15-store-api-cache-strategy.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-14":{"query":"I wrote a subscriber class in my plugin but it never fires — which interface and which service tag (`shopware.event_subscriber`?) register it?","category":"dev","option":"fs-wiki","answer":"The class must implement `Symfony\\Component\\EventDispatcher\\EventSubscriberInterface` and return `<event name> => <method>` from a static `getSubscribedEvents()`. The correct DI tag is `kernel.event_subscriber` (not `shopware.event_subscriber`), applied in `<plugin root>/src/Resources/config/services.php`: `$services->set(MySubscriber::class)->tag('kernel.event_subscriber');`. Creating the subscriber class alone does nothing — if it is not registered and tagged `kernel.event_subscriber` in `services.php`, Shopware never calls it and there may be no obvious error. Also note that versioned entities (orders, products) dispatch some events once per version, so a subscriber reacting to product/order events should check `$event->getContext()->getVersionId() !== Defaults::LIVE_VERSION` and return early for non-live versions.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/event/listening-to-events.md:1-88"],"toolCallLog":[{"tool":"Bash","args":"grep -n \"listening-to-events|event_subscriber|EventSubscriberInterface\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/framework/event/listening-to-events.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-47":{"query":"My payment plugin implements `AsynchronousPaymentHandlerInterface` and is tagged `shopware.payment.method.async` — how do I write a payment handler for Shopware 6.7 instead?","category":"dev","option":"fs-wiki","answer":"6.7.0.0 replaced the whole `Shopware\\Core\\Checkout\\Payment\\Cart\\PaymentHandler\\PaymentHandlerInterface` family (including `AsynchronousPaymentHandlerInterface`) with a single `AbstractPaymentHandler` base class — none of the old interfaces exist in 6.7.13.0 (confirmed absent in code). Also drop the old tags `shopware.payment.method.sync`, `.async`, `.prepared`, `.recurring`, `.refund`; handlers now load order data themselves and are registered with the single tag `shopware.payment.method` (core also autoconfigures this tag for `AbstractPaymentHandler` subclasses). To migrate: 1) Extend `AbstractPaymentHandler` and implement the required abstract methods `supports(PaymentHandlerType $type, string $paymentMethodId, Context $context): bool` and `pay(Request $request, PaymentTransactionStruct $transaction, Context $context, ?Struct $validateStruct): ?RedirectResponse`; optionally override `validate()`, `finalize()`, `refund()`, `recurring()`. 2) Register it in `services.php` tagged `shopware.payment.method`, e.g. `$services->set(MyCustomPaymentHandler::class)->tag('shopware.payment.method')->args([service(OrderTransactionStateHandler::class)]);`. 3) For the asynchronous flow specifically (what `AsynchronousPaymentHandlerInterface` used to cover): `pay` sends `$transaction->getReturnUrl()` to the PSP and returns `new RedirectResponse($redirectUrl)` (throw `PaymentException::asyncProcessInterrupted($orderTransactionId, $message)` on error); `finalize` runs after the redirect back to the shop — throw `PaymentException::customerCanceled(...)` on cancellation, or mark it e.g. `paid(...)` on success. `finalize` is only called when `pay` returned a `RedirectResponse`, while `validate` is always called. 4) The payment method entity is still created in the plugin's `install()` via `payment_method.repository` with fields `handlerIdentifier` (your handler's FQCN), `technicalName` (Required — use a unique plugin-specific prefix), `pluginId`, `afterOrderEnabled`; never delete the payment method on uninstall — deactivate it instead (`uninstall()`/`deactivate()` set `active` false).","citations":["platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:15-93"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"payment\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/checkout/; find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins -maxdepth 1 -type d"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-24":{"query":"How do I get readable SEO URLs generated for the detail pages of my plugin's own entity?","category":"dev","option":"fs-wiki","answer":"Implement Shopware\\Core\\Content\\Seo\\SeoUrlRoute\\SeoUrlRouteInterface for your entity's detail route. Provide getConfig() (inherited via EntitySeoUrlRouteInterface) returning a SeoUrlRouteConfig built from your entity definition, the route name (e.g. 'frontend.example.example') and a default Twig template (e.g. '{{ example.name }}'); implement prepareCriteria(Criteria $criteria, SalesChannelEntity $salesChannel) to add any needed filters/associations (note the installed 6.7.13.0 signature adds the SalesChannelEntity parameter that the docs omit); and implement getMapping(Entity $example, ?SalesChannelEntity $salesChannel): SeoUrlMapping, returning new SeoUrlMapping($example, ['exampleId' => $example->getId()], ['example' => $example->jsonSerialize()]) — getMapping must supply every variable used in the template (a template referencing example.name needs a top-level 'example' key) and should reject other entity types. Register the class with the service tag shopware.seo_url.route. Subscribe to your entity's written and deleted events (e.g. swag_example.written / swag_example.deleted) and call Shopware\\Core\\Content\\Seo\\SeoUrlUpdater::update(ExamplePageSeoUrlRoute::ROUTE_NAME, $event->getIds()) to regenerate URLs when records change — note SeoUrlUpdater::update() silently does nothing without a matching seo_url_template row, so ship a migration inserting into seo_url_template (id, sales_channel_id null, route_name, entity_name = your entity's technical name, template = your default template, created_at). The German/other-locale variant only resolves if the sales channel has a matching domain.","citations":["platform/dev/6.7/guides/plugins/plugins/content/seo/add-custom-seo-url.md:15-91"],"toolCallLog":[{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*seo*\""},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/content/seo/add-custom-seo-url.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-06":{"query":"How do I create a shipping method from my plugin's installer or migration, including the `technicalName` that 6.7 requires?","category":"gap","option":"fs-wiki","answer":"The corpus has no dedicated 'add a shipping method from a plugin' how-to, but its ADR 'Introduction of Unique Identifiers for Checkout Methods' fully documents the `technicalName` requirement referenced in the query: a `technicalName` property (DB column `technical_name`) exists on `Shopware\\Core\\Checkout\\Shipping\\ShippingMethodDefinition` guarded by a unique index `uniq.technical_name`; since migration `Migration1697112044PaymentAndShippingTechnicalNameRequired` (6.7.0.0) the field is `NOT NULL` in the database and declared `Required`+`ApiAware` in the API, so 'Plugins must supply a `technicalName` for their payment and shipping methods (at the latest from 6.7.0.0)'. Shopware's own default shipping methods were migrated to `shipping_standard` / `shipping_express`; app-provided shipping methods get an auto-generated `shipping_<AppName>_<manifest-identifier>` name. There is no corpus page showing the exact `shipping_method.repository`->upsert() call inside a plugin's `install()`/migration, but the sibling documented pattern for payment methods (`add-payment-plugin.md`) creates the analogous `payment_method` entity via `payment_method.repository` in the plugin's `install()`, passing a `pluginId` (from `PluginIdProvider::getPluginIdByBaseClass()`) and a unique `technicalName`; the same repository-upsert shape (`shipping_method.repository`, with fields like `name`, `active`, `technicalName`, and a `deliveryTime`/rule associations) would be used for shipping methods, by analogy [from memory].","citations":["platform/dev/6.7/resources/references/adr/2023-10-17-add-unique-identifiers-for-checkout-methods.md:14-65","platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:45-58"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"shipping.method|technicalName\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"},{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/checkout -type f"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"},{"tool":"Bash","args":"grep -rln \"shipping_method\\.repository|ShippingMethodDefinition|shipping_method\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/resources/references/adr/2023-10-17-add-unique-identifiers-for-checkout-methods.md"}],"notFoundClaim":false,"memoryClaims":["There is no corpus page showing the exact `shipping_method.repository`->upsert() call inside a plugin's `install()`/migration, but the sibling documented pattern for payment methods (`add-payment-plugin.md`) creates the analogous `payment_method` entity via `payment_method.repository` in the plugin's `install()`, passing a `pluginId` (from `PluginIdProvider::getPluginIdByBaseClass()`) and a unique `technicalName`; the same repository-upsert shape (`shipping_method.repository`, with fields like `name`, `active`, `technicalName`, and a `deliveryTime`/rule associations) would be used for shipping methods, by analogy"],"sourceVerdict":"partial"},"edge-07":{"query":"How do I set up Shopware PWA as the storefront for a Shopware 6.7 shop?","category":"edge","option":"fs-wiki","answer":"The corpus has no setup guide for Shopware PWA, and the only page about it lives under `platform/dev/6.6/products/pwa.md`, with no equivalent under `dev/6.7` at all. That page itself explains why: Shopware PWA is a Vue.js Single Page Application built on the Store API for a decoupled/headless storefront, but 'the documentation states that Shopware PWA is currently in maintenance mode, and recommends using Composable Frontends instead as the future of headless commerce with Shopware.' So for a 6.7 shop there is no current, actively-developed setup path via Shopware PWA in this corpus — new decoupled-storefront projects are directed toward Composable Frontends instead, which is itself built on the same Store API.","citations":["platform/dev/6.6/products/pwa.md:15-31"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"shopware pwa|shopware-pwa\" platform"},{"tool":"Read","args":"platform/dev/6.6/products/pwa.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"dev-17":{"query":"How do I overwrite the price of a product line item in the cart at runtime from a plugin?","category":"dev","option":"fs-wiki","answer":"Implement one class for both roles: `Shopware\\Core\\Checkout\\Cart\\CartDataCollectorInterface` and `Shopware\\Core\\Checkout\\Cart\\CartProcessorInterface` (the docs' worked example calls it `OverwritePriceCollector`). In `collect()`, get product IDs via `$original->getLineItems()->filterType(LineItem::PRODUCT_LINE_ITEM_TYPE)->getReferenceIds()`, skip IDs already in `CartDataCollection` (since `collect` can run several times per request), fetch the new price for each remaining ID and store it with `$data->set('price-overwrite-'.$id, $newPrice)` (prefix the key so it doesn't clash with other collectors). In `process()`, inject `Shopware\\Core\\Checkout\\Cart\\Price\\QuantityPriceCalculator`, iterate `$toCalculate->getLineItems()->filterType(LineItem::PRODUCT_LINE_ITEM_TYPE)`, look up the stored price by the same key, build a `new QuantityPriceDefinition($data->get($key), $product->getPrice()->getTaxRules(), $product->getPrice()->getQuantity())`, then `$product->setPrice($this->calculator->calculate($definition, $context))` and `$product->setPriceDefinition($definition)`. Register the service in `services.php` with both `shopware.cart.processor` and `shopware.cart.collector` tags at priority `4500` (below the core product collector/processor's `5000`, so product prices/tax rules already exist when it runs): `->tag('shopware.cart.processor', ['priority' => 4500])->tag('shopware.cart.collector', ['priority' => 4500])`. Always change prices on `$toCalculate`, never `$original`, and never query the database inside `process()` — fetch data in `collect()`. This pattern is meant to be used rarely and with caution (e.g. live-shopping); for discounts/surcharges, add a separate discount line item instead of overwriting the price.","citations":["platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md:1-92"],"toolCallLog":[{"tool":"Bash","args":"grep -n \"cart|line item|Collector|Processor\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-08":{"query":"Which service do I type-hint to read products — `EntityRepositoryInterface` — and how do I inject it into my plugin service?","category":"edge","option":"fs-wiki","answer":"There is no `EntityRepositoryInterface` in Shopware 6.7 — repositories are typed against the concrete class `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository`. To read products, inject the generated repository service `product.repository` (service id pattern `entity_name.repository`) into your service, e.g. via `$services->set(ReadingData::class)->args([service('product.repository')])` in the plugin's `services.xml`/PHP config, type-hinted as `EntityRepository`. Then call `$this->productRepository->search(new Criteria(), $context)->getEntities()` to read products.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md:23-37"],"toolCallLog":[{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"},{"tool":"Bash","args":"grep -rln \"EntityRepository\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-33":{"query":"How do I register a custom Administration module from my plugin, and what has to line up for it to actually show up after a build?","category":"dev","option":"fs-wiki","answer":"Create <plugin root>/src/Resources/app/administration/src/module/swag-example/index.js and import it from main.js (e.g. import './module/swag-example';) — the module is unknown to the Administration until it is imported. In index.js call Shopware.Module.register('swag-example', config) — the plugin-facing wrapper of ModuleFactory.registerModule on the global Shopware object. The module id (first argument) must follow the format [namespace]-[name] (at least one hyphen) and be unique, or registration aborts. The config object needs: type ('plugin' for third-party modules, defaults to 'plugin' if omitted), name, title, description, color, icon; routes (object keyed by route key — required unless a routeMiddleware is set, or registration aborts; route names become <id with '-' replaced by '.'>.<routeKey>, e.g. swag.example.list, paths prefixed /swag/example/); navigation entries (each needs label and path/id/link, and for type: 'plugin' each entry additionally needs a parent — entries without one are silently dropped with a console warning, and plugin navigation entry positions are offset by 1000); and snippets (per-locale objects, e.g. { 'de-DE': deDE, 'en-GB': enGB }, keys prefixed with the extension name) which must be passed via the snippets config key — the module factory does not auto-load a snippet folder despite what the docs imply. To surface the module under Settings, add a settingsItem with group (one of general, localization, customer, commerce, content, automation, system, account, plugins — not 'shop' as older docs state), to (a route name) and either icon or iconComponent; missing any of group, to, or both icon/iconComponent means it is not registered. Finally build the Administration assets with the plugin active, via shopware-cli project admin-build (project template) or composer run build:js:admin (platform contribution setup); for a plugin named e.g. 'AdministrationNewModule' this outputs <plugin root>/src/Resources/public/administration/js/administration-new-module.js, which must ship with the plugin and gets copied to <shopware root>/public/bundles/administrationnewmodule/administration/js/administration-new-module.js. A successful build alone is not enough — the module also needs the main.js import, correct registration id, routes/components, and snippets wired correctly, and a duplicate module id or display: false in the config both skip registration.","citations":["platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/add-custom-module.md:1-83"],"toolCallLog":[{"tool":"Bash","args":"cd .../wiki/platform && grep -rln \"custom module\\|add-custom-module\\|register.*module\" dev/6.7/guides/plugins/plugins/administration | head -20"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/add-custom-module.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-54":{"query":"How do I register a plugin cookie in the storefront cookie consent manager in Shopware 6.7?","category":"dev","option":"fs-wiki","answer":"Register an invokable listener for `Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent` in `<plugin root>/src/Resources/config/services.php`: `$services->set(CookieListener::class)->tag('kernel.event_listener', ['event' => 'Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent']);`. In `__invoke(CookieGroupCollectEvent $event)`, get the target group from `$event->cookieGroupCollection` by its technical name (default comfort group is `'cookie.groupComfortFeatures'`; other keys are `cookie.groupRequired`, `cookie.groupStatistical`, `cookie.groupMarketing`), create a `CookieEntryCollection` on the group if `getEntries()` is null, then add a `new CookieEntry('my-cookie-key')` with `$name`, `$value`, `$expiration` (int, days) set, and call `$entries->add($cookieEntry)`. A `CookieGroup` is either a standalone cookie or a container of entries — setting both throws. Since 6.7.3.0 cookies must use these `CookieEntry`/`CookieGroup` objects (the old array format is deprecated), and a hash of the cookie configuration is stored in the `cookie-config-hash` browser cookie (JSON keyed by language ID) so that a changed configuration re-shows the consent banner. The Store API route is `/store-api/cookie-groups` (`store-api.cookie.groups`); `Shopware\\Storefront\\Framework\\Cookie\\CookieProviderInterface` is deprecated for removal in 6.8.0.","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md:1-80"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"cookie\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | head -20"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-01":{"query":"How do I extend the product entity with a new association in Shopware's Data Abstraction Layer?","category":"dev","option":"fs-wiki","answer":"Create an EntityExtension subclass (e.g. `src/Extension/Content/Product/CustomExtension.php`) extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityExtension`, implement `getEntityName()` returning `ProductDefinition::ENTITY_NAME`, and add the association field inside `extendFields(FieldCollection $collection)`, e.g. `$collection->add((new OneToOneAssociationField('exampleExtension', 'id', 'product_id', ExampleExtensionDefinition::class, true))->addFlags(new CascadeDelete()));`. Register the class with the tag `shopware.entity.extension` (EntityExtension subclasses are auto-tagged). You must not add columns directly to the `product` table; instead create a new table/EntityDefinition (with an `IdField`, an `FkField` back to product, a `ReferenceVersionField` if product is versioned, and the inverse `OneToOneAssociationField`), register it with tag `shopware.entity.definition`, and add a migration that creates the table with a foreign key to `product (id, version_id)` ON DELETE CASCADE. You can then write through the product repository, e.g. `upsert([['id' => $productId, 'exampleExtension' => ['customString' => 'foo bar']]], $context)`. For simpler One-to-One/One-to-Many/Many-to-One/Many-to-Many wiring between two of your own custom DAL entity definitions (not extending an existing core entity), use `FkField`, `OneToOneAssociationField`, `OneToManyAssociationField`, `ManyToOneAssociationField`, and for Many-to-Many a `MappingEntityDefinition` plus `ManyToManyAssociationField` on both sides, inside each definition's `defineFields()`.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md:15-69","platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-associations.md:22-75"],"toolCallLog":[{"tool":"Read","args":"platform/index.md"},{"tool":"Bash","args":"grep -rln 'association' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | grep -i 'dal|entity|extend'"},{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname '*extend*entit*' -o -iname '*add-data-associated*'"},{"tool":"Bash","args":"grep -rln 'OneToMany|ManyToMany|ManyToOne' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/data-handling; find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework -maxdepth 1 -type d"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-associations.md"},{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname '*complex-data*' -o -iname '*custom-complex*'"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-57":{"query":"B2B Suite support ends with 6.8 — how do I run the B2B Suite Migration to B2B Components and check that it finished?","category":"dev","option":"fs-wiki","answer":"Run the migration and check its progress in two separate terminals at the same time (not one after the other). Start it with `bin/console b2b:migrate:commercial` — with no arguments it migrates all components/entities from the configuration; pass technical component names to migrate only specific ones, e.g. `bin/console b2b:migrate:commercial quote_management shopping_list` (names must match the configurator's technical name); `employee_management` is a prerequisite for all other components and is always migrated first regardless of argument order (actual sequence follows configurator priority in the service definition, highest priority first). Tune the batch with `--batch-size=100`. The command just dispatches work to the message queue, so it can still be running after it returns. Monitor with `bin/console b2b:migrate:progress` (add `--watch` to auto-refresh every 5 seconds); its table shows Total/Valid/Newly/Migrated/Pending/Error counts and a Status column with values `Complete`, `Pending`, `In progress`, `Complete with error` (check the `b2b_components_migration_errors` table), and `Has new records`. Migration finished successfully once every component's Status shows `Complete`. Note: Budget Management leaves the budget's Organization Unit empty after migration by design — assign it manually afterwards in B2B Commercial, and Budget Management migration requires Commercial 7.6.0 or above.","citations":["platform/dev/6.7/products/extensions/b2b-suite-migration/execution/running-migration.md:1-73"],"toolCallLog":[{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/extensions/b2b-suite-migration -type f | head -40"},{"tool":"Read","args":"platform/dev/6.7/products/extensions/b2b-suite-migration/execution/running-migration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-53":{"query":"My theme config labels disappeared from the Theme Manager after 6.7 — how do I define `theme.json` config fields and where do their translations go now?","category":"dev","option":"fs-wiki","answer":"Since 6.7.1.0, the `label`/`helpText` arrays on `theme.json` `config.fields` entries (and `label` under `config.blocks`/`sections`/`tabs`) are deprecated for removal in 6.8; the Administration now takes translations from Administration snippet files instead, e.g. `<plugin root>/src/Resources/app/administration/src/app/snippet/en.json` (locale-specific files like `en-GB.json` override the base file). Field entries in `theme.json` still declare `type` (`color`, `text`, `number`, `fontFamily`, `media`, `checkbox`, `switch`, `url`), `value`, `editable`, `tab`, `block`, `section`, `custom`, `scss`, `fullWidth` — just without the inline `label`/`helpText`. Snippet keys are built as `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.<fieldName>.label` (or with an option index for `custom` option lists, e.g. `...<fieldName>.0.label`); unnamed tab/block/section parts become `default`, and fields can also use a `helpText` suffix. The Administration looks up the theme's own technical name first, then any `configInheritance` theme names (last listed first, `@` stripped). After changing `theme.json`, run `bin/console theme:refresh`.","citations":["platform/dev/6.7/guides/plugins/themes/configuration/theme-configuration.md:1-99"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"theme.json\\|theme config\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | grep -i theme | head -20"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/themes/configuration/theme-configuration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-62":{"query":"I changed a setting in `.env` on a deployed 6.7 shop but it still behaves the old way — what takes precedence between `.env`, `.env.local` and the real environment variables, and which settings does Shopware not read from `.env` at all?","category":"dev","option":"fs-wiki","answer":"Shopware runs on Symfony's standard dotenv loading order, so real OS/container environment variables always win over anything in the `.env*` files, and among the files `.env.local` overrides `.env` (with `.env.local` ignored in the `test` environment) [from memory]. The wiki's environment-variables reference documents infrastructure/runtime variables (app paths, database, messenger, OpenSearch/Elasticsearch, HTTP cache, build) that Shopware reads from `.env`/`.env.local`, but plenty of shop-facing settings are not `.env` values at all: normal system config (shop settings like `core.listing.allowBuyInListing`, payment/shipping config, etc.) is stored in the database and managed via the Administration or `SystemConfigService`, not `.env`. If a config key was pinned in `config/packages/*.yaml` under `shopware.system_config` (static system configuration, available since 6.6.4.0), that YAML value becomes an overlay that wins over the database value and the key becomes read-only in the Administration — so changing `.env` (or even the database) would not visibly change behaviour if the key is statically overridden that way; that YAML can itself pull from an env var via a Symfony processor like `%env(bool:ALLOW_BUY_IN_LISTING)%`.","citations":["platform/dev/6.7/guides/hosting/configurations/shopware/static-system-config.md:14-50","platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md:15-34"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"\\.env\\.local\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"},{"tool":"Bash","args":"grep -rln \"precedence\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"},{"tool":"Read","args":"path=platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md"},{"tool":"Read","args":"path=platform/dev/6.7/guides/hosting/configurations/shopware/static-system-config.md"},{"tool":"Bash","args":"grep -n -B2 -A5 \"\\.env\\.local\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/performance/caches.md"}],"notFoundClaim":false,"memoryClaims":["Shopware runs on Symfony's standard dotenv loading order, so real OS/container environment variables always win over anything in the `.env*` files, and among the files `.env.local` overrides `.env` (with `.env.local` ignored in the `test` environment) [from memory]."],"sourceVerdict":"partial"},"dev-51":{"query":"Custom entities declared in `Resources/config/entities.xml` no longer work for my plugin in Shopware 6.7 — how do I define and register a DAL entity with PHP attributes instead?","category":"dev","option":"fs-wiki","answer":"Since Shopware 6.6.3.0 you no longer need a separate EntityDefinition/entity/collection class or entities.xml: declare a single PHP class extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity` and annotate it with attributes from `Shopware\\Core\\Framework\\DataAbstractionLayer\\Attribute\\*`. Put `#[Entity('example_entity', collectionClass: ExampleEntityCollection::class)]` on the class, add a `#[PrimaryKey]` property (UUID recommended), and declare fields with `#[Field(type: FieldType::..., translated:, api:, column:, maxLength:)]`; use `#[ForeignKey]`, `#[ManyToOne]`, `#[OneToOne]`, `#[OneToMany]`, `#[ManyToMany]` for associations, `#[Serialized]` for a JSON field with a custom serializer, `#[Translations]`/`translated: true` for translated fields, and `EntityCustomFieldsTrait` or `#[CustomFields]` for custom fields. Register the class in `services.php` with `$services->set(Examples\\ExampleEntity::class)->tag('shopware.entity');` (autoconfiguration tags classes carrying the Entity attribute automatically); this auto-generates `<name>.definition` and `<name>.repository` (plus translation services when translated fields exist). Non-nullable properties are required by default; translated and Translations-array properties must be nullable. Since 6.6.9.0, `collectionClass` and field `type` can also be the FQCN of any class extending the DAL `Field` class.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md:1-92"],"toolCallLog":[{"tool":"Read","args":"platform/index.md"},{"tool":"Bash","args":"grep -rln \"entities.xml\\|entity.*attribute\\|DAL entity\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | head -20"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-38":{"query":"How do I write Jest unit tests for my Administration components in Shopware 6.7?","category":"dev","option":"fs-wiki","answer":"Place the test next to the tested file with the same name plus suffix .spec.js or .spec.ts. For plain services/ES modules, import directly and test normally. For components, mount them via the component factory rather than a direct import: Shopware.Component.build('sw-your-component-for-test') resolves the Twig template plus all overrides/extensions into a Vue component; in 6.7 it is async and returns a Promise, so it must be awaited, e.g. async function createWrapper() { return shallowMount(await Shopware.Component.build('sw-your-component-for-test'), { props: {...}, stubs: { 'sw-missing-component-one': await Shopware.Component.build('sw-missing-component-one') }, mocks: {...}, attachTo: document.body }); }. Prefer shallowMount() (children stubbed) over mount(); create the wrapper in beforeEach and await flushPromises(), tear it down and flush again in afterEach; a minimal first assertion is expect(wrapper.vm).toBeTruthy(). Common Vue warnings and fixes: a missing required prop needs to be passed in props; an unknown custom element (e.g. <sw-select-base>) needs to be stubbed (a dummy stub, or the real Shopware.Component.build() output if the real child is needed); a render TypeError on a missing function needs a mock function added; a failed directive resolution needs a directive mock; and a missing injection (e.g. \"mediaService\" not found) can be muted with provide: { mediaService: {} } or given a realistic stub with the used methods mocked — if the code calls Shopware.Service('mediaService') directly, register the mock in beforeAll via Shopware.Service.register('mediaService', {...}). Mount slots via slots: { default: 'My custom message' } and assert the rendered text. The preconfigured Admin Jest environment provides: global.activeAclRoles = ['product.editor'] for ACL (no rights by default), global.activeFeatureFlags = ['FEATURE_NEXT_12345'] for feature flags, a working repository factory mock generated from the entity schema (add canned responses via global.repositoryFactoryMock.responses.addResponse({ method, url, status, response: { data: [...] } }), silence warnings with global.repositoryFactoryMock.showWarning = false), plus auto-mocked $tc, $device, $store, $router and registered global directives/filters — all overridable in the mount/shallowMount options. To scaffold a new spec, run composer run admin:create:test in the Shopware root and paste the path of the untested component/service. Install JS dependencies with composer run init:js, and run tests with composer run admin:unit (all tests plus coverage) or composer run admin:unit:watch (re-runs changed files on save) — these scripts target the Shopware-provided Administration; plugins may need their own equivalent scripts. Since 6.7's Administration runs on Vue 3 (createApp), avoid Vue-2-era Vue Test Utils helpers like createLocalVue or wrapper.destroy() shown in some older doc snippets.","citations":["platform/dev/6.7/guides/development/testing/unit/jest-admin.md:1-84"],"toolCallLog":[{"tool":"Bash","args":"cd .../wiki/platform && grep -rln \"jest|Jest\" dev/6.7/guides/development/testing dev/6.7/guides/plugins/plugins/administration | head -20"},{"tool":"Read","args":"platform/dev/6.7/guides/development/testing/unit/jest-admin.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-65":{"query":"What can I put in the JSON body of `POST /api/search/{entity}` for filtering, associations, sorting, aggregations and getting an exact total count?","category":"dev","option":"fs-wiki","answer":"The body is parsed server-side by `RequestCriteriaBuilder` into a DAL `Criteria` and accepts these top-level keys: `associations` (load related entities; key = association property, value = nested criteria with its own `limit`/`filter`/`sort`/...), `includes` (restrict output fields per `apiAlias`, e.g. `\"product\": [\"id\", \"name\"]`), `ids` (limit search to a list of IDs), `total-count-mode` (`0`/`none` = no count (default), `1`/`exact` = exact total via an extra COUNT query, `2`/`next-pages` = cheap 'is there a next page' check; out-of-range numbers fall back to none), `page`/`limit` for pagination (`page` is 1-indexed), `filter` (filters both result and aggregations, DAL filter types), `post-filter` (filters only the result, not aggregations — used for facets), `query` (weighted querie
