s, each `{score, query}`, scores summed into `extensions.search._score`, default score 1 if omitted), `term` (text search over fields flagged `SearchRanking`; don't combine with `query`), `sort` (list of `{field, order, naturalSorting, type}`, where `type: \"count\"` sorts by association count, added in 6.4.12.0), `aggregations` (on-the-fly DAL aggregations), and `grouping` (list of fields to group by). The installed builder also recognizes undocumented `excludes` and `fields` keys. Example skeleton: `{\"page\":1,\"limit\":10,\"total-count-mode\":1,\"associations\":{\"manufacturer\":{}},\"filter\":[{\"type\":\"multi\",\"operator\":\"and\",\"queries\":[{\"type\":\"equals\",\"field\":\"active\",\"value\":true}]}],\"sort\":[{\"field\":\"name\",\"order\":\"ASC\"}],\"aggregations\":[{\"name\":\"average-price\",\"type\":\"avg\",\"field\":\"price\"}],\"grouping\":[\"active\"]}`. For an exact total count, set `\"total-count-mode\": 1` (or `\"exact\"`), keeping in mind it is the more expensive mode since it runs an extra count query — use it only when you actually display total pages.","citations":["platform/dev/6.7/guides/development/integrations-api/search-criteria.md:25-60","platform/dev/6.7/guides/development/integrations-api/search-criteria.md:69-74"],"toolCallLog":[{"tool":"Read","args":"path=platform/dev/6.7/guides/development/integrations-api/search-criteria.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-63":{"query":"I deployed a plugin update to a 6.7 staging shop and my new migration never ran — which `bin/console` command applies the pending migrations of that one plugin, and what do I have to pass to it?","category":"dev","option":"fs-wiki","answer":"Run `bin/console database:migrate SwagBasicExample --all`, passing the plugin's technical name as the `identifier` argument (it defaults to `core` if you omit it, which would skip your plugin) and `--all` to apply every pending migration. Normally install/update already runs `migrateInPlace()` on the plugin's `MigrationCollection` automatically (only new migrations on update), so if it 'never ran' automatically, check whether the plugin's lifecycle code called `$updateContext->setAutoMigrate(false)` — that disables the automatic run and requires manual `migrateInPlace()`/`database:migrate` invocation. Also note migrations are only picked up from the plugin's `src/Migration` directory (or the namespace returned by `getMigrationNamespace()`), keyed by their `Migration<timestamp><Description>` class name.","citations":["platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md:44-59"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"migration:migrate\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"},{"tool":"Bash","args":"grep -rli \"migration\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | grep -i plugin"},{"tool":"Read","args":"path=platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-02":{"query":"Shopware 6.7 removed the RSA JWT key files and `system:generate-jwt-secret` — what signs Admin API tokens now, and what do I have to do when upgrading?","category":"gap","option":"fs-wiki","answer":"The corpus does not have a page dedicated to this specific 6.7 change, but the evidence it does have is consistent with the premise: the 6.7 Environment Variables reference (`platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md`) no longer lists `JWT_PRIVATE_KEY`/`JWT_PUBLIC_KEY` among its App variables — it only lists `APP_SECRET` and `INSTANCE_ID` there — whereas the equivalent 6.6 page still documents `JWT_PRIVATE_KEY` / `JWT_PUBLIC_KEY` ('generatable with `shopware-cli project generate-jwt --env`'). The 6.7 `shopware-cli` Helper Commands page still documents a `shopware-cli project generate-jwt <path-to-project>` command (writes keys to `config/jwt/`, `--env` prints the keys base64-encoded) but notes under Version notes that '`generate-jwt` is only needed for Shopware before 6.5; 6.5+ generates JWT secrets automatically' — its own code check marks `JWT_PRIVATE_KEY` as 'no occurrence in vendor/shopware/core; project-level config, out of scope', i.e. that variable is no longer read by 6.7 core. Beyond this the corpus has no page stating explicitly that Admin API tokens are now signed symmetrically with `APP_SECRET` instead of an RSA keypair, or listing upgrade steps for this change (e.g. removing old `config/jwt/` keys, ensuring `APP_SECRET` is set) — that specific mechanism and its upgrade checklist are from my own knowledge, not verified in this corpus [from memory].","citations":["platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md:23-38","platform/dev/6.6/guides/hosting/configurations/shopware/environment-variables.md:9-39","platform/dev/6.7/products/tools/cli/project-commands/helper-commands.md:49-90"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"generate-jwt-secret|JWT.*key|jwt secret\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"},{"tool":"Bash","args":"grep -in \"jwt\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md; find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*upgrade*\" -o -iname \"*breaking*\" -o -iname \"*changelog*\""},{"tool":"Bash","args":"grep -in \"jwt\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md; find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform -iname \"synonyms*\""},{"tool":"Bash","args":"grep -il \"jwt\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/*.md; cat .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/index.md"},{"tool":"Bash","args":"grep -n -i \"jwt\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/part-1.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/synonyms/part-2.md"},{"tool":"Bash","args":"grep -n -i \"jwt\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.6/guides/hosting/configurations/shopware/environment-variables.md"},{"tool":"Bash","args":"grep -rn -i \"generate-jwt|jwt secret|system:generate\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/tools/cli/project-commands/helper-commands.md"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md"}],"notFoundClaim":true,"memoryClaims":["Beyond this the corpus has no page stating explicitly that Admin API tokens are now signed symmetrically with `APP_SECRET` instead of an RSA keypair, or listing upgrade steps for this change (e.g. removing old `config/jwt/` keys, ensuring `APP_SECRET` is set) — that specific mechanism and its upgrade checklist are from my own knowledge, not verified in this corpus"],"sourceVerdict":"partial"},"edge-05":{"query":"How do I enable Shopware's built-in MCP server on a Shopware 6.6 shop?","category":"edge","option":"fs-wiki","answer":"The built-in MCP server does not exist on Shopware 6.6: the corpus's MCP documentation lives only under `platform/dev/6.7/products/tools/mcp-server/` (no `dev/6.6` equivalent), and its 'Version notes' explicitly state the feature was '6.7.11.0: introduced behind `MCP_SERVER`', with the endpoint returning 404 unless the flag is set — so a 6.6 shop has no `MCP_SERVER` flag, no `/api/_mcp`/`/store-api/_mcp` routes, and no `symfony/mcp-bundle` dependency to enable. On a shop that is on 6.7.11.0 or later instead, the process is: set `MCP_SERVER=1` in `.env` and confirm `symfony/mcp-bundle` is installed (`composer show symfony/mcp-bundle`), create integration credentials with `bin/console integration:create \"My MCP Client\" --admin`, point an MCP client at `<shop-url>/api/_mcp` using the `sw-access-key`/`sw-secret-access-key` headers, and verify with `bin/console debug:mcp`; the feature is marked experimental until Shopware 6.8.","citations":["platform/dev/6.7/products/tools/mcp-server/intro.md:16-61","platform/dev/6.7/products/tools/mcp-server/getting-started.md:16-61"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"mcp server|model context protocol\" platform"},{"tool":"Bash","args":"grep -rli \"mcp\" platform/dev/6.6 (no hits)"},{"tool":"Read","args":"platform/dev/6.7/products/tools/mcp-server/getting-started.md"},{"tool":"Read","args":"platform/dev/6.7/products/tools/mcp-server/intro.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"yes"},"func-01":{"query":"How do I create a product with variants and configure its visibility per sales channel, and why might it not show up in the storefront?","category":"func","option":"fs-wiki","answer":"In the product create/edit mask, the required fields before the first save are Name, Product number, Tax rate, Price (gross and net) and Stock; once saved, additional tabs open up including Specifications, Extended Prices, Variants, Layout, SEO and Cross Selling. Variants are generated from Properties via the Variant Generator: you select the property values to combine, can add price surcharges per value, and can exclude specific value combinations; bulk edit of variants supports Overwrite/Clear/Add/Remove per field block, for up to 1000 selected variants at once (note: bulk edit cannot set the cover image across multiple variants, and updating the gross price via bulk edit does not update the net price). Per-sales-channel visibility is configured in the 'Visibility & structure' section of the product: you assign the product to one or more Sales channels, toggle 'Active for all selected sales channels', assign Categories, and set extended visibility per listing (Visible / hide in listing / hide in listing and search), plus Tags and Search keywords. If a product does not show up in the storefront, the wiki page's documented fields point to the likely causes: the product is not assigned to that sales channel (or 'Active for all selected sales channels' is off), the extended visibility is set to hide it from listing/search, it lacks required fields, or its category assignment doesn't place it in a navigated category for that sales channel. [from memory: additional common causes not covered in this wiki page include stock being 0 with 'hide when out of stock' enabled, the product being outside its active sales period/release date, or the search index not yet having run.]","citations":["platform/func/catalogues/products.md:18-52"],"toolCallLog":[{"tool":"Bash","args":"grep -n -i \"variant\\|sales channel visibility\\|product visibility\" <home>/projects/host-project/.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md"},{"tool":"Read","args":"platform/func/catalogues/products.md"},{"tool":"Bash","args":"grep -n -i \"not show\\|not visible\\|not showing\\|troubleshoot\" <home>/projects/host-project/.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md"}],"notFoundClaim":false,"memoryClaims":["additional common causes not covered in this wiki page include stock being 0 with 'hide when out of stock' enabled, the product being outside its active sales period/release date, or the search index not yet having run."],"sourceVerdict":"partial"},"dev-22":{"query":"How do I give my plugin a settings page the shop operator can fill in, and what field types are available?","category":"dev","option":"fs-wiki","answer":"Declare the page in <plugin root>/src/Resources/config/config.xml (Shopware renders it dynamically in the Administration and stores values in the system config, so no custom Administration module is needed). The root <config> element needs at least one <card>, each with a translatable <title>; group your fields inside cards. Each field is an <input-field> whose first child must be the technical <name> (pattern [a-zA-Z][a-zA-Z0-9]*, unique across all input fields); supported type values are text (default), textarea, text-editor, url, password, int, float, bool, checkbox, datetime, date, time, colorpicker, single-select, multi-select and price (the schema also accepts price even though the docs table omits it). Fields can carry translatable <label>, <placeholder>, <helpText>; a <defaultValue> imported into the DB on install/update; boolean <disabled>, <required>, <copyable> (copyable only for text and its extensions); <minLength>/<maxLength> for text/url/password or <min>/<max> for int/float; and <options> (each with an <id> and one or more <name>) for single-select/multi-select. Marking a field cache-relevant=\"true\" (on <input-field> or <component>, available since 6.7.12.0) triggers system-config cache invalidation on save — from 6.8.0.0 system config writes no longer invalidate caches by default, so this attribute matters for anything affecting cached Storefront output; leave it off for credentials/internal values. For richer UI you can use an advanced <component name=\"…\"> block instead of input-field — supported components are sw-entity-single-select, sw-entity-multi-id-select, sw-media-field, sw-text-editor and sw-snippet-field (the last edits translations for a snippet key rather than writing system config; sw-entity-single-select needs <label-property> for entities without a name field, e.g. mail_template). The operator fills the page in under Extensions → My extensions → Plugins → Configure, tab Configuration.","citations":["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md:15-85"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"system config|plugin configuration|Configuration\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/config; find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*config*\" | grep -i plugin"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-01":{"query":"How do I configure Shopware 6's built-in GraphQL API for the Store API?","category":"edge","option":"fs-wiki","answer":"Nothing in the corpus documents a built-in GraphQL API, and a full-text search for 'graphql' across the entire platform layer (dev, func, hubs, and the synonyms fallback) returned zero matches. Shopware 6's Store API and Admin API are REST/JSON-based (documented via OpenAPI), not GraphQL, so there is no built-in GraphQL API to configure. [from memory]","citations":[],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"graphql\" platform (no hits)"},{"tool":"Bash","args":"ls platform/synonyms*"},{"tool":"Bash","args":"grep -rli \"graphql\" platform/synonyms (no hits)"}],"notFoundClaim":true,"memoryClaims":["Shopware 6's Store API and Admin API are REST/JSON-based (documented via OpenAPI), not GraphQL, so there is no built-in GraphQL API to configure."],"sourceVerdict":"no"},"dev-39":{"query":"How do I write end-to-end Cypress tests for my plugin against a Shopware 6.7 store?","category":"dev","option":"fs-wiki","answer":"In Shopware 6.7 the corpus states that Cypress E2E testing has been deprecated and is no longer maintained; the 'Legacy' testing page explicitly recommends using Playwright for new projects instead of Cypress, and the Cypress pages themselves live under the 'legacy' section (superseded by the Playwright E2E section). For new plugin E2E tests against a 6.7 store, the documented path is the Shopware Acceptance Test Suite (ATS), a Playwright-based toolkit that adds Shopware-specific fixtures so tests can start against a shop right away — it provides page contexts and Page Object Model page objects for both Storefront and Administration, API clients, test data creation helpers, and reusable test logic for browser-driven E2E/acceptance tests. The corpus's Cypress-specific pages found under platform/dev/6.7/guides/development/testing/legacy/cypress/ (e.g. cypress-best-practises.md) still exist for reference on existing Cypress-based suites, but are not the recommended approach for 6.7. The corpus does not contain a step-by-step 'write your first Cypress test against 6.7' walkthrough beyond the best-practices page and the deprecation notice; the more concrete getting-started material available for 6.7 is for Playwright/ATS, not Cypress.","citations":["platform/dev/6.7/guides/development/testing/legacy/_index.md:1-29","platform/dev/6.7/guides/development/testing/e2e-playwright/_index.md:1-32"],"toolCallLog":[{"tool":"Bash","args":"cd .../wiki/platform && grep -rln \"cypress|Cypress\" dev/6.7/guides/development/testing | head -20"},{"tool":"Read","args":"platform/dev/6.7/guides/development/testing/legacy/_index.md"},{"tool":"Read","args":"platform/dev/6.7/guides/development/testing/e2e-playwright/_index.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"gap-01":{"query":"How do I add my own Admin API endpoint under `/api/...` from a plugin — a controller with the api route scope and its ACL?","category":"gap","option":"fs-wiki","answer":"The corpus does not have a dedicated 'add an Admin API route from a plugin' how-to (there is a store-api equivalent, `add-store-api-route.md`, but no `add-admin-api-route.md`), so the concrete steps below combine what the corpus does confirm plus reasonable extrapolation from the Store API pattern [from memory for the extrapolated parts]. The Admin API concept page confirms routes under `/api` use the route scope `api`, identified by `Shopware\\Core\\Framework\\Routing\\ApiRouteScope` (`ApiRouteScope::ID`), and that access requires an authenticated `AdminApiSource` context; generic CRUD is served by `Shopware\\Core\\Framework\\Api\\Controller\\ApiController`. By the same pattern the Store API guide documents for `store-api`, a plugin's Admin API controller would carry `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [ApiRouteScope::ID]])]` on the class and a method-level `#[Route(path: '/api/your-path', name: 'api.your.route', methods: [...])]`, be registered as a service, and be discovered via a `routes.php` import (`Resources/Schema/AdminApi` is the OpenAPI schema location for the Admin API per that guide's step 7) [from memory]. For ACL, the corpus's `add-acl-rules.md` explains that API-level permissions use the identifier `entity_name:operation` (e.g. `product:read`) referenced from an Administration privilege mapping's `privileges` array — Administration ACL only guards the admin UI, not the API itself; to actually deny API access at the route/controller level would need a server-side ACL check in the controller (`Shopware\\Core\\Framework\\Api\\Acl\\AclRoleDefinition` / permission checks), which is not documented in this corpus [from memory].","citations":["platform/dev/6.7/concepts/api/admin-api.md:14-33","platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md:26-43","platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:24-44"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"api route scope|RouteScope.*api\\b|admin-api.*controller\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"},{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*controller*\""},{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins -iname \"*admin-api*\" -o -iname \"*add-acl*\" -o -iname \"*acl-privilege*\""},{"tool":"Bash","args":"grep -rln \"route_scope.*api\\b|routeScope.*api\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/concepts/api/admin-api.md"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}],"notFoundClaim":true,"memoryClaims":["By the same pattern the Store API guide documents for `store-api`, a plugin's Admin API controller would carry `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [ApiRouteScope::ID]])]` on the class and a method-level `#[Route(path: '/api/your-path', name: 'api.your.route', methods: [...])]`, be registered as a service, and be discovered via a `routes.php` import (`Resources/Schema/AdminApi` is the OpenAPI schema location for the Admin API per that guide's step 7)","To actually deny API access at the route/controller level would need a server-side ACL check in the controller (`Shopware\\Core\\Framework\\Api\\Acl\\AclRoleDefinition` / permission checks), which is not documented in this corpus"],"sourceVerdict":"partial"},"edge-02":{"query":"How do I get the DI container with `Shopware()->Container()` and override the product listing Smarty template in Shopware 6?","category":"edge","option":"fs-wiki","answer":"The corpus has no matches anywhere for 'Smarty' or 'Shopware()->Container()' — a search across the whole platform layer returned nothing. That is because both belong to legacy Shopware 5, not Shopware 6: Shopware 5 used the global `Shopware()` helper to reach a Pimple-based container and Smarty as its templating engine, but Shopware 6 replaced this with the Symfony service container (services/DI are configured via `services.xml`/autowiring and injected through constructor injection, not a global `Shopware()->Container()` call) and replaced Smarty with Twig templates that are overridden/extended via `.html.twig` files in a plugin's `Resources/views` directory. [from memory]","citations":[],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"smarty|Shopware()->Container\" platform (no hits)"},{"tool":"Bash","args":"grep -rli \"product listing|dependency injection container|DI container\" platform/dev/6.7"}],"notFoundClaim":true,"memoryClaims":["Shopware 5 used the global `Shopware()` helper to reach a Pimple-based container and Smarty as its templating engine, but Shopware 6 replaced this with the Symfony service container (services/DI are configured via `services.xml`/autowiring and injected through constructor injection, not a global `Shopware()->Container()` call) and replaced Smarty with Twig templates that are overridden/extended via `.html.twig` files in a plugin's `Resources/views` directory."],"sourceVerdict":"no"},"dev-20":{"query":"How do I add my own condition to the Rule Builder from a plugin so shop owners can select it?","category":"dev","option":"fs-wiki","answer":"Create a PHP rule class under `<plugin root>/src/Core/Rule` extending `Shopware\\Core\\Framework\\Rule\\Rule`, implementing the two required abstract members `match(RuleScope $scope): bool` (evaluate only from the scope, e.g. `$scope->getSalesChannelContext()->getCustomer()` — never run database queries or other slow operations here) and `getConstraints(): array` (maps each configurable field to Symfony validation constraints, e.g. `['isFirstMondayOfTheMonth' => [new Type('bool')]]`). The rule name comes from `getName()`, which the base class resolves from a `RULE_NAME` constant (e.g. `final public const RULE_NAME = 'first_monday';`) — define the constant or override `getName()`, or the base throws `RuleException::ruleNameNotImplemented()`. Rule properties must be `protected`, not `private`. Register the class in the plugin's `services.php` — services extending `Rule` are auto-tagged `shopware.rule.definition` when autoconfigured. Optionally override `getConfig(): ?RuleConfig` (e.g. `(new RuleConfig())->booleanField('isFirstMondayOfTheMonth')`) so the Administration renders the generic `sw-condition-generic` component and no custom JS/Twig is needed. Otherwise, add Administration integration: in a decorator file (e.g. `src/Resources/app/administration/src/decorator/rule-condition-service-decoration.js`, imported from `main.js`) call `Shopware.Application.addServiceProviderDecorator('ruleConditionDataProviderService', (ruleConditionService) => { ruleConditionService.upsertGroup('days_of_the_month', {...}); ruleConditionService.addCondition('first_monday', { component: 'swag-first-monday', label: '...', scopes: ['global'], group: 'days_of_the_month' }); return ruleConditionService; });` — the condition type string must equal the PHP rule name. Build a custom Vue component (e.g. `Shopware.Component.extend('swag-first-monday', 'sw-condition-base', {...})`) and a Twig template overriding the `sw_condition_value_content` block if the generic component isn't used. Optionally restrict where the condition is selectable via context awareness: `ruleConditionService.addAwarenessConfiguration('productPrices', { notEquals: ['first_monday'], equalsAny: [], snippet: '...' })` (assignment names are associations of `Shopware\\Core\\Content\\Rule\\RuleDefinition`; available since 6.5.0.0).","citations":["platform/dev/6.7/guides/plugins/plugins/framework/rule/add-custom-rules.md:1-90"],"toolCallLog":[{"tool":"Bash","args":"grep -n \"rule builder|add.*rule|custom rule\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"},{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/rule -type f"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/framework/rule/add-custom-rules.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-46":{"query":"sw-button and sw-card are deprecated in Shopware 6.7 — how do I migrate my plugin's admin templates to the Meteor components, and is there a codemod that does it?","category":"dev","option":"fs-wiki","answer":"Yes, there is a codemod. Shopware 6.7 replaces several core `sw-*` Administration components with the Meteor Component Library (`mt-*` prefix, e.g. `mt-url-field`, `mt-number-field`); the old wrapper components such as `sw-url-field` are themselves marked `@deprecated tag:v6.8.0` ('Will be removed, use mt-url-field instead') in the installed code. To migrate a plugin (prerequisites: a development installation of Shopware, plugin located in `custom/plugins`): run `composer run admin:code-mods` to see the help text, then `composer run admin:code-mods -- --plugin-name example-plugin --fix -v 6.7` with your plugin's name and target version. The tool replaces compatible components with Meteor Components automatically, adds guidance comments where manual migration is required, and fixes some other deprecated code where possible; per-component migration details live in the technical upgrade documentation of the release. If you need one plugin codebase to support both 6.6 and 6.7, the wrapper components expose a `deprecated` prop (Boolean, default `false`): leaving it `false` renders the Meteor component, setting it `true` renders the old component (e.g. `sw-url-field-deprecated`) instead — but the docs recommend migrating to Meteor Components rather than relying on this prop, since it exists only as a bridge between 6.6 and 6.7.","citations":["platform/dev/6.7/guides/upgrades-migrations/administration/meteor-components.md:14-62"],"toolCallLog":[{"tool":"Read","args":"platform/dev/6.7/guides/upgrades-migrations/administration/meteor-components.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-28":{"query":"How do I override an existing Storefront JavaScript plugin, such as the cookie permission bar, from my own plugin instead of registering a new one?","category":"dev","option":"fs-wiki","answer":"Storefront JS plugins are plain ES classes, so subclass the original, override the methods you need (calling super where you want the original behavior to still run), and swap its registration using window.PluginManager.override() instead of PluginManager.register(). Example: create <plugin root>/src/Resources/app/storefront/src/my-cookie-permission/my-cookie-permission.plugin.js with `import CookiePermissionPlugin from 'src/plugin/cookie/cookie-permission.plugin'; export default class MyCookiePermission extends CookiePermissionPlugin { init() { ...; super.init(); } _hideCookieBar() { if (confirm(...)) super._hideCookieBar(); } }`. If the original class can't be imported (e.g. a third-party plugin without a module alias), fetch it from the registry instead: window.PluginManager.getPlugin('CookiePermission').get('class'). Then in <plugin root>/src/Resources/app/storefront/src/main.js (main.ts is also picked up), call window.PluginManager.override('CookiePermission', () => import('./my-cookie-permission/my-cookie-permission.plugin'), '[data-cookie-permission]') — matching core's async/dynamic-import registration of CookiePermission (an async-registered plugin needs an async override import too); for a synchronously-registered plugin pass the class directly, PluginManager.override('Name', MyClass, '[selector]'). Rebuild the Storefront (shopware-cli project storefront-build, or composer run build:js:storefront in a platform contribution checkout) and reload. Note override() only works on an already-registered name (otherwise it logs a warning and does nothing — core only registers CookiePermission when window.useDefaultCookieConsent is set), and each plugin name can only be overridden once: if two plugins override the same name, only the last registration wins because override() deregisters and re-registers under that name.","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md:15-64"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"override.*plugin|overrideComponent|PluginManager\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront; find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/storefront -iname \"*javascript*\" -o -iname \"*plugin*js*\""},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-05":{"query":"How do I set up a sales channel — storefront versus headless type, domains, languages and currencies — and where do I get its API access key?","category":"func","option":"fs-wiki","answer":"A sales channel connects a Shopware store to a distribution channel — the storefront, comparison portals, social shopping integrations, or a headless API-only channel — and is created and managed from the 'Sales Channel' menu item in the Administration. To add one, click the plus icon next to Sales Channel and choose between an HTML storefront channel, a headless (API-only) channel, or a product comparison export. General settings include Name, Mark as favourite, Entry point (main/footer/service navigation), Navigation levels, default Customer group for new/anonymous visitors, Countries, Languages, and Standard units of measurement; Payment and shipping settings define the available payment methods (plus a default), available shipping methods (plus a default), available currencies (plus a default), and the tax calculation method. Domains are configured under the channel's Domains section: self-hosted installs add each domain via 'Add Domain', with its own URL, language, currency, snippet set, and unit system; on cloud, a default URL is auto-generated and custom domains are added the same way after being registered under Settings > System > Domains (a proxy setup additionally needs the proxy IP recorded via the `TRUSTED_PROXIES` env entry in `.env` for IP whitelisting to work). The API access key/ID for the channel is generated under the channel's 'API access' section. Gotchas: the preinstalled Headless sales channel should never be deleted since many extensions (including the B2B Suite) depend on it — hide it instead by marking other channels as favourites; and a domain should be stored with only one protocol (https or http) to avoid duplicate content (cloud instances always route via https server-side).","citations":["platform/func/settings/saleschannel.md:18-47"],"toolCallLog":[{"tool":"Bash","args":"grep -n -i \"sales channel\\|headless\\|access key\" <home>/projects/host-project/.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md"},{"tool":"Read","args":"platform/func/settings/saleschannel.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-26":{"query":"How do I add a custom document type such as a pro-forma invoice in Shopware 6.7?","category":"dev","option":"fs-wiki","answer":"In 6.7 this goes through the experimental Document System v2 (guarded by the DOCUMENT_GENERATION_REWORK feature flag; it becomes default in 6.8). A document type in the installed 6.7.13 code is just a technical-name string (lowercase letters, digits, underscores) — there is no type class or type tag, despite what some source examples suggest. Build: (1) a render-data DTO extending Shopware\\Core\\Checkout\\DocumentV2\\Struct\\AbstractRenderData whose public properties are flattened onto the template's config variable; (2) a data provider extending Shopware\\Core\\Checkout\\DocumentV2\\Provider\\AbstractDocumentDataProvider implementing getKey(), supports(string $documentType) (matching your type's technical name, e.g. 'pro_forma_invoice'), the optional enrichOrderCriteria(Criteria $criteria) (runs before the order loads), and provideRenderingData(OrderEntity $order, DocumentGenerationRequest $generationRequest, Context $context): AbstractRenderData; (3) a renderer for each output format you need — the built-in HtmlRenderer, PdfRenderer, ZugferdXmlRenderer and ZugferdEmbeddedPdfRenderer are final and only list 'invoice' in getDocumentTypes(), so a new type needs its own renderer declaring getFormat(), getDocumentTypes() and renderToString() (a PDF renderer also declares getDependencies() returning ['html']); (4) register the provider and renderer as services in PLUGIN_ROOT/src/Resources/config/services.php, tagged shopware.document_v2.provider and shopware.document_v2.renderer respectively; (5) a Twig template — the HTML renderer resolves @Framework/documents/<technical_name>.html.twig (ZUGFeRD XML uses @Framework/documents/zugferd/<technical_name>.xml.twig), placed at PLUGIN_ROOT/src/Resources/views/documents/<technical_name>.html.twig and extending @Framework/documents/base.html.twig; and (6) a migration inserting a document_type row whose technical_name matches your type (persisting throws 'document type not found' otherwise) plus a number range of type document_<technical_name>. Watch for provider-key collisions, duplicate renderers for the same type/format, and DTO property names colliding with shared config keys like companyName/pageSize.","citations":["platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md:15-77"],"toolCallLog":[{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*document*\""},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-50":{"query":"My `ScheduledTaskHandler` stopped running after the upgrade — how must a scheduled task and its handler be declared in Shopware 6.7?","category":"dev","option":"fs-wiki","answer":"A likely cause: the docs' Gotchas explicitly warn to tag the handler `messenger.message_handler` — the core compiler pass only injects the `ScheduledTaskExecutor` into handlers carrying that tag (confirmed at `vendor/shopware/core/Framework/DependencyInjection/CompilerPass/ScheduledTaskExecutorCompilerPass.php:29`); otherwise the handler falls back to a deprecated inline execution path that throws once v6.8.0.0 is active. The correct declaration in `<plugin root>/src/Resources/config/services.php` is: `$services->set(ExampleTask::class)->tag('shopware.scheduled.task');` and `$services->set(ExampleTaskHandler::class)->args([service('scheduled_task.repository'), service('logger')])->tag('messenger.message_handler');` — the handler constructor args map to the base `ScheduledTaskHandler(EntityRepository $scheduledTaskRepository, LoggerInterface $exceptionLogger)`. The task class extends `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTask` and implements the abstract statics `getTaskName(): string` and `getDefaultInterval(): int` (seconds). The handler extends `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTaskHandler`, implements `run()`, and is marked `#[AsMessageHandler(handles: ExampleTask::class)]`; optionally it implements `DynamicallyScheduledTaskHandler::getNextExecutionTime()` (available since 6.7.13.0) to compute the next run dynamically — returning `null` falls back to the default schedule (`nextExecutionTime + runInterval`, capped to now if in the past), and status is set to `scheduled`. Note that the task service and handler service are separate: registering the task makes it persistable/schedulable (saved to the database once the plugin is activated), but only the tagged handler actually executes `run()`. Also verify the task's `status` in the `scheduled_task` table is `scheduled` (not required with the admin worker), and run `bin/console scheduled-task:register` to re-register tasks without reinstalling the plugin, `bin/console scheduled-task:run` to dispatch due tasks, and `bin/console messenger:consume` to execute dispatched messages. The older approach of overriding `ScheduledTaskHandler::rescheduleTask()` is deprecated for 6.8.0.","citations":["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md:15-97"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"ScheduledTask\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-68":{"query":"How does the registration handshake between Shopware and my app backend work — shop id, proof, shop secret and the confirmation call?","category":"dev","option":"fs-wiki","answer":"1) Registration request: Shopware sends a `GET` to the manifest's registration URL with query params `shop-id`, `shop-url`, `timestamp`, plus headers `shopware-app-signature` (HMAC-SHA256 of the query string using the app secret) and `sw-version`; on re-registration it also adds `shopware-shop-signature` (query string signed with the current shop secret). Your app verifies with `hash_hmac('sha256', $queryString, $appSecret)`. The app secret is issued by the Shopware Account, except for local dev or private apps with an external server, where you set `<secret>` directly in the manifest (store apps cannot). 2) Registration response: your app returns JSON `{ \"proof\": ..., \"secret\": \"<new shop-secret>\", \"confirmation_url\": \"https://my.example.com/registration/confirm\" }`, where `proof = hash_hmac('sha256', shop-id . shop-url . appName, $appSecret)`; the shop secret should be unique per shop and 64–255 characters, stored alongside `shopId`/`shopUrl`. Return `{\"error\": \"...\"}` to abort installation. Registration fails if the returned `secret` equals the current app secret. 3) Confirmation request: Shopware then `POST`s to your `confirmation_url` with JSON body `apiKey`, `secretKey`, `timestamp`, `shopUrl`, `shopId`, and header `shopware-shop-signature` (HMAC-SHA256 of the body using the new shop secret), plus `shopware-shop-signature-previous` (signed with the previous secret) on re-registration; `apiKey`/`secretKey` become the `client_id`/`client_secret` for Admin API OAuth. 4) On secret rotation / shop-url change, the shop re-registers with the known shop ID; your app must validate both signatures, issue and return a new secret, activate the new secret/URL only after a valid confirmation, and accept the old secret for a short grace period (e.g. one minute).","citations":["platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md:23-34","platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md:61-63"],"toolCallLog":[{"tool":"Read","args":"path=platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-21":{"query":"My plugin dispatches its own domain event — how do I make it show up as a trigger in the Flow Builder?","category":"dev","option":"fs-wiki","answer":"Since Shopware 6.4.6.0, make your event implement Shopware\\Core\\Framework\\Event\\FlowEventAware plus whichever Aware interfaces cover the data actions need (e.g. CustomerAware, ProductAware) — each core Aware interface has a matching Storer class (e.g. CustomerAware/CustomerStorer, OrderAware/OrderStorer) responsible for writing/restoring its data into the StorableFlow that actions read via $flow->getStore()/$flow->getData(). For genuinely custom data, mark your own interface with #[IsFlowEventAware] and write a FlowStorer subclass, which is autoconfigured with the tag flow.storer. Finally, subscribe to BusinessEventCollectorEvent::NAME ('collect.business-events') with a high priority (docs recommend 1000), call $this->businessEventCollector->define(ExampleEvent::class), and if the resulting definition is not null add it via $event->getCollection()->set($definition->getName(), $definition); register that subscriber with the BusinessEventCollector service argument and tag kernel.event_subscriber. The trigger then appears under Settings > Flow Builder > Add flow. Note that since 6.5.0.0 actions only get data through StorableFlow — getAvailableData() no longer delivers data to actions directly — and BusinessEventCollector::define() only counts interfaces carrying #[IsFlowEventAware] as awareness, since core Aware interfaces do not themselves extend FlowEventAware.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md:15-75"],"toolCallLog":[{"tool":"Read","args":"platform/index.md"},{"tool":"Bash","args":"grep -rln \"Flow Builder\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | grep -i flow"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-25":{"query":"How do I add a `bin/console` command to my plugin for a maintenance task?","category":"dev","option":"fs-wiki","answer":"Shopware CLI commands are plain Symfony Console commands, so register your command class as a service tagged console.command in <plugin root>/src/Resources/config/services.php, e.g. $services->set(Swag\\BasicExample\\Command\\ExampleCommand::class)->tag('console.command'). Create the command class (e.g. at src/Command/ExampleCommand.php) extending Symfony\\Component\\Console\\Command\\Command, annotated with #[AsCommand(name: 'swag:example', description: '...')] from Symfony\\Component\\Console\\Attribute\\AsCommand, and implement execute(InputInterface $input, OutputInterface $output): int, returning Command::SUCCESS. It then runs as bin/console swag:example. No extra wiring is needed: the plugin base class (Shopware\\Core\\Framework\\Bundle::build()) globs and loads every Resources/config/services.* file next to the plugin class. Use a vendor-specific command-name prefix (e.g. swag:) to avoid collisions with core commands (which use prefixes like scheduled-task:); for recurring background work use a scheduled task instead of a manually-run command.","citations":["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md:15-64"],"toolCallLog":[{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*command*\" | grep -i plugin"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-09":{"query":"Why doesn't my payment method appear in the checkout — what has to be configured in the administration?","category":"func","option":"fs-wiki","answer":"Under Settings > Commerce > Payment methods, the wiki page notes that by default cash on delivery, invoice, prepayment and direct debit are active — but a payment method must also be assigned in the sales channel's payment settings to appear in the storefront; being 'Active' at the global payment-method level is not sufficient on its own. Each payment method also has an 'Active' enable/disable toggle that must be on, and an Availability rule (built via the Rule Builder) that, if set, restricts when the method is offered — leaving it blank/NULL means unrestricted availability, but a configured rule that doesn't match the current cart/customer/country will hide the method from checkout. So to make a payment method appear: (1) ensure it is Active, (2) assign it to the relevant sales channel's available payment methods, and (3) check whether an Availability rule is excluding the current checkout context (e.g. a billing-country condition, as covered in the wiki's rule-builder examples for restricting payment methods by country). Related settings pages under Settings > Shop > Payment methods also govern sales-channel payment configuration and fallback payment methods. [from memory: other common causes not documented on this specific page include the payment method's underlying plugin/extension being deactivated or uninstalled, and payment methods added by an app requiring that app to still be active/connected.]","citations":["platform/func/settings/Paymentmethods.md:18-47"],"toolCallLog":[{"tool":"Bash","args":"empty - reused Paymentmethods.md already read for func-02"}],"notFoundClaim":false,"memoryClaims":["other common causes not documented on this specific page include the payment method's underlying plugin/extension being deactivated or uninstalled, and payment methods added by an app requiring that app to still be active/connected."],"sourceVerdict":"partial"},"dev-08":{"query":"In a plugin service, what is the Shopware 6 equivalent of Doctrine's `findBy()` — how do I read products with filters, associations and sorting?","category":"dev","option":"fs-wiki","answer":"Shopware's DAL has no ORM and no `findBy()`; instead you inject the entity's repository (service id pattern `entity_name.repository`, e.g. `product.repository`, typed `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository`) and search it with a `Criteria` object. Basic search: `$this->productRepository->search(new Criteria(), $context)->getEntities();` or by ID `new Criteria([$myId])` then `->getEntities()->first()` (null if none). Filter with `$criteria->addFilter(new EqualsFilter('name', 'Example name'))`, combinable via `OrFilter`/`AndFilter`/`NandFilter`, and `RangeFilter` for ranges; field names come from the entity definition. `addPostFilter(...)` filters the result set without affecting aggregations. Add associations with `addAssociation('productReviews')` (chainable as `'productReviews.customer'`); `getAssociation('productReviews')` returns that association's own nested `Criteria` so you can filter which associated rows are attached, separately from a root filter that limits which root entities are returned. Add aggregations with `addAggregation(new AvgAggregation('avg-rating', 'productReviews.points'))`, then read `->getAggregations()->get('avg-rating')` off the result. Page and sort with `setLimit()`, `setOffset()`, and `addSorting(new FieldSorting('createdAt', FieldSorting::ASCENDING))`. For very large result sets, use `RepositoryIterator` (`new RepositoryIterator($this->productRepository, $context, $criteria)`, then loop `$iterator->fetch()` until null) with a deterministic sort including a unique field like `id` as a secondary sort key. Many-to-many mapping entities (e.g. `product_category.repository`) cannot be read with `search()` — use `searchIds()` instead. Note: `EntitySearchResult::first()` and its EntityCollection methods are deprecated (removed in 6.8) — always call `getEntities()` first.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md:15-65"],"toolCallLog":[{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-32":{"query":"How do I define a custom field set for products from my plugin so merchants can edit the values in the Administration?","category":"dev","option":"fs-wiki","answer":"Products already support customFields (a JSON column) out of the box, so you only need to define the custom field set, not extend the entity. Since 6.7.13.0, declare it declaratively: place a Resources/config/custom-fields.xml file in your plugin root (same XML format as the app manifest's custom fields). On plugin install/update, Shopware syncs the sets automatically — present sets/fields are created or updated, and ones removed from the XML are deleted; on uninstall (without keeping user data) the plugin's sets are removed too, with no lifecycle hooks or installer service required. Alternatively, define sets imperatively by injecting the custom_field_set.repository service and calling create() in a plugin lifecycle method, e.g. create a set like {'name' => 'swag_example_set', 'global' => true, 'config' => ['label' => [...]], 'customFields' => [['name' => 'swag_example_size', 'type' => CustomFieldTypes::INT, 'includeInSearch' => true, 'config' => ['label' => [...], 'customFieldPosition' => 1]]]}. Custom field and set names are global across the shop, so always use a vendor prefix (e.g. swag_). The field's type matters because the Administration renders the input by type and validates writes against it. Set 'global' to false if merchants should be able to edit/delete the set in the Administration (global:true sets are locked). Custom fields are not searchable by default (includeInSearch defaults to false); turning it on for an existing product field requires rebuilding the search index or re-saving products. Deleting a set does not clean up stored values in the entities' custom_fields JSON — those must be removed separately, e.g. via batched SQL UPDATE using JSON_REMOVE for large tables like products.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/custom-field/add-custom-field.md:1-107"],"toolCallLog":[{"tool":"Bash","args":"cd .../wiki/platform && grep -rln \"custom field\" dev/6.7 | head -20"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/framework/custom-field/add-custom-field.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-10":{"query":"How do I write an indexer that precomputes derived data for my custom entity on write, and how do I trigger a full reindex?","category":"dev","option":"fs-wiki","answer":"Extend `Shopware\\Core\\Framework\\DataAbstractionLayer\\Indexing\\EntityIndexer` (e.g. `ExampleIndexer`) and implement all six abstract methods: `getName(): string` — a unique name used by `EntityIndexerRegistry` to route messages (e.g. `'swag.basic.example.indexer'`); `iterate(?array $offset): ?EntityIndexingMessage` — drives a full reindex, using `IteratorFactory->createIterator(..., $offset)->fetch()` and returning `new EntityIndexingMessage(array_values($ids), $iterator->getOffset())` or `null` when done; `update(EntityWrittenContainerEvent $event): ?EntityIndexingMessage` — called on DAL writes, filtering `$event->getPrimaryKeys(CustomerDefinition::ENTITY_NAME)` (or your entity) as tightly as possible; `handle(EntityIndexingMessage $message): void` — processes messages from `iterate`/`update`, reading `$message->getData()` and writing with `Connection` directly rather than the DAL (writing through the DAL here re-emits `EntityWrittenContainerEvent` and can loop forever — use `Connection`, which is also faster, or wrap DAL calls with `$context->addState(EntityIndexerRegistry::DISABLE_INDEXING)`); `getTotal(): int` — record count for progress, via `iterator->fetchCount()`; `getDecorated(): EntityIndexer` — throw `DecorationPatternException(static::class)` as core indexers do. Register the service with its dependencies (e.g. `IteratorFactory`, your repository, `Doctrine\\DBAL\\Connection`) tagged `shopware.entity_indexer` — with autoconfiguration this tag is applied automatically to `EntityIndexer` subclasses. `update()` messages are handled synchronously by default; the `EntityIndexingMessage` constructor is `($data, $offset = null, $context = null, $forceQueue = false, $isFullIndexing = false)` — pass `forceQueue: true` to route through the message queue instead. To trigger a full reindex, run `bin/console dal:refresh:index` (or use the Administration's index refresh), which calls `iterate()` across all registered indexers. If you only need to react to writes on an existing core entity rather than your own, prefer subscribing to the indexer event the relevant core indexer already dispatches in its `handle()` (e.g. `Shopware\\Core\\Checkout\\Customer\\Event\\CustomerIndexerEvent`, reading `getIds()`), batching writes with `MultiInsertQueryQueue` (`addInsert(...)` then `execute()`), rather than writing a whole new indexer.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-indexer.md:15-68"],"toolCallLog":[{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname '*indexer*' -o -iname '*indexing*'"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-indexer.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-60":{"query":"Which transports do my Shopware message queue workers have to consume in production, and how do I turn off the admin worker?","category":"dev","option":"fs-wiki","answer":"Out of the box, Shopware stores messages via the Doctrine transport and consumes them with the admin worker (browser polling while someone is logged into the Administration); this causes CPU load with many admin users and stops entirely when nobody is logged in, so production setups should run CLI workers instead. Run one or more CLI workers, restarted by systemd/supervisor (or cron, which doesn't limit concurrency): `bin/console messenger:consume async --time-limit=60 --memory-limit=128M`, and consume several transports in priority order in one call, e.g. `bin/console messenger:consume async low_priority`. The installed default `shopware.admin_worker.transports` list is `[\"webhook\", \"async\", \"low_priority\"]`, so a CLI worker should cover at least `async` and `low_priority` (plus `webhook` if you rely on it), and you should also run a worker for the `failed` transport or failed messages are never retried/processed. Transports map to DSNs via env vars: `MESSENGER_TRANSPORT_DSN` → `async` (default `doctrine://default?auto_setup=false`), `MESSENGER_TRANSPORT_LOW_PRIORITY_DSN` → `low_priority`, `MESSENGER_TRANSPORT_FAILURE_DSN` → `failed` (`failure_transport: failed`); a `webhook` transport (`shopware-webhook://default`, no retries) also exists. `async`/`low_priority` retry 3 times (1000ms delay, multiplier 2) before landing in `failed`. To turn off the admin worker once CLI workers are running, set in `config/packages/shopware.yaml`:\n```yaml\nshopware:\n    admin_worker:\n        enable_admin_worker: false\n```\n(the installed default is `true`). If you keep it, `poll_interval` (installed default 20s, must stay below PHP `max_execution_time`) and `transports` are also configurable under `shopware.admin_worker`.","citations":["platform/dev/6.7/guides/hosting/infrastructure/message-queue.md:1-86"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"admin worker\\|messenger:consume\\|message queue.*transport\\|transports\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | head -20"},{"tool":"Read","args":"platform/dev/6.7/guides/hosting/infrastructure/message-queue.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-09":{"query":"Where do I configure Business Events so that a mail is sent when an order is placed in Shopware 6.7?","category":"edge","option":"fs-wiki","answer":"In Shopware 6.7 you no longer configure this under Business Events — Business Events (Settings > Shop > Business Events) were superseded by the Flow Builder starting with major release 6.4.8.0 and are now only used for the B2B-Suite. To send a mail when an order is placed on 6.7, use Flow Builder instead: go to Settings > Automation > Flow Builder, create a flow, pick the trigger `checkout.order.placed` on the Flow tab, optionally add Rule Builder conditions, and add the 'Send mail' action with the desired email template. (If the shop still genuinely relies on the legacy Business Events screen for the B2B-Suite, that screen is at Settings > Shop > Business Events, where the 'Add Business-Event' form lets you pick the event 'Order placed' — technical name `checkout.order.placed` — an email template, sales channel and rules.)","citations":["platform/func/settings/Business-Events.md:18-38","platform/func/settings/Flow-Builder.md:18-34"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"Business Event|business-events\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func | head -20"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/Business-Events.md"},{"tool":"Bash","args":"grep -rln \"Flow Builder|Flow-Builder\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func | head -20"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/settings/Flow-Builder.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-70":{"query":"How do I implement a payment method in an app with `pay-url` and `finalize-url`, and what must the app server return in Shopware 6.7?","category":"dev","option":"fs-wiki","answer":"Declare the payment method under `<payments><payment-method>` in `manifest.xml`, identified by app name + `<identifier>` (never change the identifier after release, or new payment methods get created); URL elements `<pay-url>`, `<finalize-url>`, `<validate-url>`, `<refund-url>`, `<recurring-url>` are all optional. Having `pay-url` alone with no `finalize-url` makes the flow synchronous; having both makes it asynchronous (redirect-based). Synchronous: Shopware POSTs `{\"source\": {url, shopId, appVersion}, \"orderTransaction\": ..., \"order\": ..., \"requestData\": ..., \"returnUrl\": ...}` to `pay-url`, and the app must respond `{\"status\": \"authorize\"}` (optionally with `message`). Asynchronous: the same request is sent to `pay-url` (including `returnUrl`), and the app must respond `{\"redirectUrl\": \"...\"}`; once the shopper returns to `returnUrl`, Shopware POSTs to `finalize-url` with `orderTransaction` and `requestData` (the provider's query params, with `_sw_payment_token` stripped), and the app must respond with a `status` such as `paid`, `authorize`, `fail`, or `cancel`. From 6.7.0.0 the app server must return a non-empty `status` for the transaction state to change (`status` is passed directly to the state machine as a transition action, e.g. `paid`, `paid_partially`, `authorize`, `process`, `fail`, `cancel`, `remind`, `chargeback`, `reopen` on `order_transaction`); an empty `status` leaves the state untouched. Any non-empty `message` in the response makes core throw and treats the payment as failed, even alongside a success status; `status: cancel` throws a customer-canceled exception; `status: fail` without a message fails with 'Payment was reported as failed.' Payment requests to the app server time out after 20 seconds. Note: `capture-url` was deprecated with manifest v3.0/Shopware 6.7 — do capture logic inside `pay-url` instead.","citations":["platform/dev/6.7/guides/plugins/apps/checkout/payment.md:24-49","platform/dev/6.7/guides/plugins/apps/checkout/payment.md:61-67"],"toolCallLog":[{"tool":"Read","args":"path=platform/dev/6.7/guides/plugins/apps/checkout/payment.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-06":{"query":"Which triggers and actions does the Flow Builder offer, and how do I make it send a mail when an order is placed?","category":"func","option":"fs-wiki","answer":"Flow Builder (Settings > Automation) automates business processes without programming: a trigger fires on a Shopware event, optional conditions built from the Rule Builder narrow when it applies, and one or more actions then run. Example triggers (technical names): `checkout.order.placed`, `checkout.customer.register`, `checkout.customer.login`, `state_enter.order.state.completed`, `mail.before.send`, `newsletter.register` (note: `checkout.order.payment_method.changed` automatically sets order status to 'Open' and must not be set to 'Open' again via a flow action). Available actions include: Assign account status, Assign affiliate/campaign code, Assign customer group, Generate a document, Send mail, Assign status (payment/shipping/order), Stop flow, Set download access, Change custom field content, and Add Tag/Remove Tag; 'Stop flow' halts the entire flow regardless of parallel branches, skipping any later conditions/actions. Additional capabilities: Delayed Actions (Beyond plan) fire an action after a delay (Hour/Day/Week/Month or custom `SS.TT.WW.MM` format, shown under Scheduled Actions); Custom Trigger (since 6.5.3.0) lets apps register their own triggers; Webhook Actions (Evolve plan, requires Shopware Commercial) add a 'Call URL (Webhook)' action supporting GET/POST/PUT/PATCH/DELETE with configurable URL, parameters, headers, body and Basic Auth; and Share Flows (since 6.4.19.0, Rise plan) lets flows be downloaded/uploaded, though references to categories/products/properties may be dropped and need reassigning on import. To send a mail when an order is placed: create a flow, on the General tab set Name/Description/Priority/Active, then on the Flow tab select the trigger `checkout.order.placed`, and use the plus symbol to add the 'Send mail' action (optionally add Rule Builder conditions first to narrow when the mail is sent). Gotcha: if 'Administrator' is selected as the mail recipient, all users with the admin flag receive the email, including external users using an admin account for API access.","citations":["platform/func/settings/Flow-Builder.md:18-57"],"toolCallLog":[{"tool":"Read","args":"platform/func/settings/Flow-Builder.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-08":{"query":"How do I set up a Nuxt project with Shopware Composable Frontends against my shop's Store API — endpoint, access token, and why do I get HTTP 412?","category":"gap","option":"fs-wiki","answer":"The corpus confirms Composable Frontends is 'a headless frontend implementation built on the Store API' and that Store API requests identify the sales channel via the `sw-access-key` header (`Shopware\\Core\\PlatformRequest::HEADER_ACCESS_KEY`) while the customer/cart session is carried in `sw-context-token`; a sales channel's API access key is copied from Sales Channels > your channel > API access. The corpus also has a PaaS-specific page on deploying a composable (Node.js) frontend such as Nuxt on Shopware PaaS Native (`application.yaml` with `kind: cfe`, listen on port 3000, expose `/api/healthz`, Node 22/24/26, ISR/`Surrogate-Control` caching headers via `routeRules` in `nuxt.config.ts`), but that page is about hosting/deployment, not about wiring a local Nuxt project to a Store API endpoint and access token, and it does not mention any HTTP 412 error. I could not find any page in this corpus explaining a Nuxt + Composable Frontends local setup (env vars for the Store API base URL / access token) or an HTTP 412 ('Precondition Failed') error from the Store API — this appears to be outside the corpus's coverage, so I cannot answer the 412 part from these sources.","citations":["platform/dev/6.7/concepts/api/store-api.md:14-34","platform/dev/6.7/products/paas/shopware/composable-frontends/_index.md:15-53"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"Composable Frontends|composable frontend|Nuxt|HTTP 412|412\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/paas/shopware/composable-frontends/_index.md"},{"tool":"Bash","args":"grep -n -i \"412|access.*token|sw-access-key\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/concepts/api/store-api.md"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/concepts/api/store-api.md"},{"tool":"Bash","args":"grep -rn \"412\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"rule-02":{"query":"Where should cleanup of my plugin's own data on uninstall go, and what must I respect?","category":"rule","option":"fs-wiki","answer":"Cleanup goes in the plugin base class's `uninstall(UninstallContext $uninstallContext): void` lifecycle hook (the class extends `Shopware\\Core\\Framework\\Plugin`, which extends `Bundle`). The example pattern is: `if ($uninstallContext->keepUserData()) { return; } // Remove or deactivate the data created by the plugin`. You must respect `UninstallContext::keepUserData()` — if it is true you must never delete persistent plugin data; if it is false, the core itself removes the plugin's migrations before calling `uninstall()` and deletes the plugin's system config, custom entities and custom fields afterward, so your `uninstall()` only needs to handle what the core doesn't. Also, do not blindly delete entities in `uninstall()` — for example a payment method used by real orders would break those orders, so deactivate such entities instead of deleting them.","citations":["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md:37-70"],"toolCallLog":[{"tool":"Bash","args":"grep -n \"uninstall\" -r .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/guidelines/6.7/ .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -l"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"rule-01":{"query":"May I extend (subclass) a concrete Shopware core service to change its behaviour, or what should I do instead?","category":"rule","option":"fs-wiki","answer":"No. Shopware's extension-point ladder says to use the least invasive extension point first (event subscriber, then a tagged service in a registry/adapter such as LineItemFactoryRegistry or cart processors), and only resort to decoration when needed; the guideline explicitly states: 'Never extend a concrete core service; decorate its abstract contract or compose.' For decoration, you must type-hint and extend the `Abstract*` class, never an interface — the abstract class declares `abstract public function getDecorated()`, the core implementation throws `DecorationPatternException` there, and your decorator returns the injected inner service and delegates to it. You must never mark a decoratable abstract class `@internal`/`@final`, never add public methods the abstract class lacks, and never make a decorator an event subscriber. This decoration rule is enforced by PHPStan (DecorationPatternRule).","citations":["platform/guidelines/6.7/architecture-guidelines.md:18-37"],"toolCallLog":[{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/index.md"},{"tool":"Bash","args":"ls .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/guidelines/6.7/"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/guidelines/6.7/architecture-guidelines.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-19":{"query":"I need to move long-running work in my plugin out of the request into the message queue — what does the handler class look like and how is it registered?","category":"dev","option":"fs-wiki","answer":"First define a message class carrying whatever data the handler needs, implementing `Shopware\\Core\\Framework\\MessageQueue\\AsyncMessageInterface` (routes to the `async` transport) or `Shopware\\Core\\Framework\\MessageQueue\\LowPriorityMessageInterface` (routes to `low_priority`, available since 6.5.7.0) — without either interface (or an explicit routing entry) a message is handled synchronously. Dispatch it via `Symfony\\Component\\Messenger\\MessageBusInterface` (service id `messenger.default_bus`) injected into a service: `$this->bus->dispatch(new SmsNotification($message));`, or wrap it in an `Envelope` with stamps (e.g. `DelayStamp`) for metadata like delayed processing. Route specific message classes/interfaces to a transport via `shopware.messenger.routing_overwrite` in `config/packages/shopware.yaml` (exact-class entries win over interface entries). The handler class itself, e.g. `<plugin root>/src/MessageQueue/Handler/SmsHandler.php`, is marked with the `Symfony\\Component\\Messenger\\Attribute\\AsMessageHandler` attribute and implements `__invoke()` typed to the message class: `#[AsMessageHandler] class SmsHandler { public function __invoke(SmsNotification $message) { /* do the work */ } }`. It is then registered as a service tagged `messenger.message_handler` in the plugin's DI configuration; Shopware's `Shopware\\Core\\Framework\\MessageQueue\\MessageHandlerCompilerPass` merges the `#[AsMessageHandler]` attribute's arguments into that tag (an explicit tag attribute wins over the attribute's arguments in a merge).","citations":["platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md:1-80","platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-handler.md:1-61"],"toolCallLog":[{"tool":"Bash","args":"grep -n \"message queue|MessageHandler|AsyncMessageInterface|messenger.message_handler\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-handler.md"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-12":{"query":"I am on Shopware 6.6 — which file do I declare my plugin's service dependencies in, and how do I pass another service into the constructor?","category":"dev","option":"fs-wiki","answer":"Declare services in `<plugin root>/src/Resources/config/services.xml` — Shopware automatically loads a file with exactly this name from that directory. Register a service with a `<service id=\"...\" />` element under `<services>` in the Symfony DI XML schema (`http://symfony.com/schema/dic/services/services-1.0.xsd`). To pass another service into the constructor, add an `<argument type=\"service\" id=\"...\" />` child of the `<service>` element, e.g. `<service id=\"Swag\\\\BasicExample\\\\Subscriber\\\\MySubscriber\"><argument type=\"service\" id=\"Shopware\\\\Core\\\\System\\\\SystemConfig\\\\SystemConfigService\" /><\/service>` — the class then receives that service through constructor injection (store it in a property in `__construct()`). All services declared in Shopware 6 are private by default, so they can only be injected as a dependency of another service, not fetched directly from the container.","citations":["platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/add-custom-service.md:1-50","platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/use-plugin-configuration.md:1-52"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"services.xml\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.6"},{"tool":"Read","args":"platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/add-custom-service.md"},{"tool":"Bash","args":"grep -n \"argument|constructor\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/add-custom-service.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/adjusting-service.md"},{"tool":"Bash","args":"grep -rln 'type=\"service\"|__construct' .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/ .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.6/guides/plugins/plugins/framework/"},{"tool":"Read","args":"platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/use-plugin-configuration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-07":{"query":"My plugin needs to store its own data in a new table — how do I define a custom DAL entity with its definition, entity and collection class so I get a repository for it?","category":"dev","option":"fs-wiki","answer":"First create the table via a plugin migration, prefixing it with your vendor (e.g. `swag_example`): extend `Shopware\\Core\\Framework\\Migration\\MigrationStep`, implement `getCreationTimestamp()` and `update(Connection $connection)` executing the `CREATE TABLE` statement (id BINARY(16) primary key, your columns, `created_at`/`updated_at`); reinstall the plugin to run it. Then define `ExampleDefinition extends Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityDefinition` implementing the two required abstract members: `getEntityName(): string` returning a constant like `ExampleDefinition::ENTITY_NAME = 'swag_example'` (this doubles as the table name and, appended with `.repository`, the repository service id — here `swag_example.repository`), and `defineFields(): FieldCollection` returning a `FieldCollection` with an `IdField('id','id')` flagged `Required()`/`PrimaryKey()` plus your other fields (e.g. `StringField`, `BoolField`) — `created_at`/`updated_at` need no field definitions, they're added by default. Register it as a service tagged `shopware.entity.definition` with an `entity` attribute matching `getEntityName()`: `$services->set(ExampleDefinition::class)->tag('shopware.entity.definition', ['entity' => 'swag_example']);`. To get typed results instead of the generic `ArrayEntity`/`EntityCollection`, add an `Entity` class (`ExampleEntity extends Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity`, `use EntityIdTrait;`, protected properties with getters/setters — properties must be at least `protected` and not `readonly`) wired via `getEntityClass()`, and an `EntityCollection` class (`ExampleCollection extends EntityCollection`, overriding `protected function getExpectedClass(): string { return ExampleEntity::class; }`) wired via `getCollectionClass()`. Once registered, the DAL compiler pass wires up the `<entityName>.repository` service automatically, giving you a full `EntityRepository` for CRUD and search.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md:15-121"],"toolCallLog":[{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-06":{"query":"How do I add a custom Flow Builder action?","category":"dev","option":"fs-wiki","answer":"Create a class extending `Shopware\\Core\\Content\\Flow\\Dispatching\\Action\\FlowAction`, e.g. `CreateTagAction`, implementing static `getName(): string` (e.g. `'action.create.tag'`), `requirements(): array` (aware interfaces the action needs — `[]` means all triggers, `[OrderAware::class, CustomerAware::class]` restricts to those, `[TagAware::class]` to events implementing a custom aware interface), and `handleFlow(StorableFlow $flow): void`, where `$flow->getConfig()` returns the sequence's admin config, `$flow->getStore($key)` reads aware-interface values, `$flow->getData($key)` reads original event/extra data, and `$flow->getContext()` gives the Context. Register it as a service tagged `flow.action` with `priority` (order shown in `/api/_info/flow-actions.json`) and `key` equal to `getName()`, e.g. `$services->set(CreateTagAction::class)->args([service('tag.repository')])->tag('flow.action', ['priority' => 600, 'key' => 'action.create.tag']);` — `FlowExecutor` indexes `flow.action` services by `key`, so omitting it breaks execution. To scope the action to a custom aware interface, define one (e.g. `TagAware extends Shopware\\Core\\Framework\\Event\\FlowEventAware`, marked `#[IsFlowEventAware]`) with named constants and a getter. Optionally define a custom trigger event implementing that aware interface with `getAvailableData()`/`getContext()`, registered to Flow Builder via a subscriber on `BusinessEventCollectorEvent::NAME` calling `$this->businessEventCollector->define(...)` and adding it to `$event->getCollection()` (tag `kernel.event_subscriber`). In the Administration, define the action's label/group constants and snippets, override `sw-flow-sequence-action` (via `Component.override`, not `Component.register` since core already registers it) to add computed `groups`/`modalName` and `getActionDescriptions`/`getActionTitle` (falling back to `this.$super(...)`), then register a config modal component (e.g. `sw-flow-create-tag-modal`) that emits `process-finish` with `{ ...this.sequence, config }` and `modal-close`; both must be imported in `main.js`. `flowBuilderService.getActionName(...)` only resolves after calling `flowBuilderService.addActionNames({...})`.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-action.md:15-71"],"toolCallLog":[{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/flow -maxdepth 2"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-action.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-04":{"query":"After upgrading to 6.7 my plugin fatals on load because core class properties now have native PHP types — which properties must I retype in my subclasses?","category":"gap","option":"fs-wiki","answer":"The corpus confirms the general trend but has no page enumerating which specific core class properties gained native PHP types in 6.7, nor an upgrade guide entry for this. The static-analysis code guideline notes that '[b]eyond this guideline, the installed core ships its own PHPStan rules, e.g. `PropertyNativeTypeRule` reports class properties without a native type (except `@var resource`/`@var callable`)' — its code check confirms `PropertyNativeTypeRule` exists at `vendor/shopware/core/DevOps/StaticAnalyze/PHPStan/Rules/PropertyNativeTypeRule.php:26`, i.e. Shopware's own tooling enforces native property types across the core codebase. The general Upgrades and Migrations overview page lists 'Core (framework, DAL, feature removals, backend behavior)' as one of the standard breaking-change categories per release, and recommends reading `UPGRADE-6.7.md`/`RELEASE_INFO-6.7.md` in the shopware/shopware repository and running `shopware-cli project upgrade` to surface such incompatibilities — but neither page names the affected properties or classes, so I could not answer 'which properties must I retype' from this corpus.","citations":["platform/dev/6.7/resources/guidelines/code/core/writing-code-for-static-analysis.md:55-64","platform/dev/6.7/guides/upgrades-migrations/_index.md:15-52"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"native.*type|property type|typed propert\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"},{"tool":"Bash","args":"grep -n -i \"native.*type|property type\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"},{"tool":"Bash",
