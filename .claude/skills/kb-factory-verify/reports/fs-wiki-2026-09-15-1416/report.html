"args":"grep -rln \"upgrade-shopware|6.7.0.0|major release\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations; find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations -type f"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/upgrades-migrations/_index.md"},{"tool":"Bash","args":"grep -n -i \"native.*type|readonly|property type\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/resources/guidelines/code/core/writing-code-for-static-analysis.md"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/resources/guidelines/code/core/writing-code-for-static-analysis.md, offset=50, limit=15"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"rule-05":{"query":"Which test level should I pick for a change to a DAL entity definition, and how do I keep the test deterministic?","category":"rule","option":"fs-wiki","answer":"Per the test-pyramid rule, 'SQL/DBAL adapters, DAL definitions, custom entities' should be covered by a PHP integration test against a real database — not a unit test and not E2E (the guideline says to pick the lowest level that proves the behaviour, and integration/API tests sit above pure-logic unit tests but well below E2E). To keep it deterministic and isolated: make the test independent of execution order (never depend on files, storage records or listeners left by another test); clean up every artifact by removing dynamically registered event listeners in teardown and rolling back database writes and schema changes; keep the test compatible with the paratest (parallel) setup so it runs without shared-state collisions; never let code under test call `exit()`/`die()`, since PHPUnit would terminate and later tests would silently never run. Migration/DAL versioned-entity test classes must also carry `CoversClass`, `CoversFunction` or `CoversNothing`.","citations":["platform/guidelines/6.7/qa-guidelines.md:18-76"],"toolCallLog":[],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"rule-03":{"query":"Which annotations mark a core class or method as off-limits for extensions, and what does each mean for me?","category":"rule","option":"fs-wiki","answer":"The 'public api and annotations' section of the architecture guidelines lays these out. Every public/protected member is public API unless marked otherwise. `@internal` marks an implementation detail (with a reason given) — you must never use, extend or decorate a core class marked `@internal`; it must never be combined with `@final`. Native `final class` is used for DTOs, structs and subscribers (cannot be extended at all); `@final` marks a service that callers may use but must not extend. `@experimental stableVersion:vX.Y.Z feature:FLAG` marks unreleased code, which you should treat as `@internal` (do not build on it). `@deprecated tag:vX.Y.0 - <replacement>` marks removed/replaced code that will only actually be removed in a major version. DI service constructors are not public API even without an annotation, whereas constructors of DTOs you're meant to instantiate (e.g. `CalculatedPrice`, `QuantityPriceDefinition`) are public API. These rules are enforced by PHPStan.","citations":["platform/guidelines/6.7/architecture-guidelines.md:79-92"],"toolCallLog":[],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-36":{"query":"How do I register ACL privileges for my plugin's Administration module and check them in a component or template?","category":"dev","option":"fs-wiki","answer":"Register a privilege mapping (recommended in <your-component>/acl/index.js, imported by the component's index.js reachable from main.js, and it must run before the role detail page opens): Shopware.Service('privileges').addPrivilegeMappingEntry({ category: 'permissions', parent: null, key: 'your_key', roles: { viewer: { privileges: ['product_review:read'], dependencies: [] }, editor: { privileges: ['product_review:update'], dependencies: ['your_key.viewer'] } } }). An admin privilege identifier has the form <key>.<role>; category 'permissions' uses roles viewer/editor/creator/deleter, while 'additional_permissions' accepts any role name (e.g. system.clear_cache) for non-CRUD rights. 'privileges' inside a role are API permissions in entity_name:operation form; 'dependencies' are other admin identifiers auto-checked alongside the role. Calling addPrivilegeMappingEntry again with an existing category+key deep-merges roles into that entry. addPrivilegeMappingEntry silently skips (with a console warning) an entry missing category, parent, or key, so pass parent: null when there is no parent. Protect routes/navigation/settingsItem/shortcuts by adding a privilege (or meta.privilege for routes) property, e.g. routes: { detail: { ..., meta: { privilege: 'your_key.your_role' } } }, navigation: [{ id: '...', privilege: 'your_key.your_role' }], settingsItem: [{ ..., privilege: 'your_key.your_role' }], and shortcuts: { 'SYSTEMKEY+S': { active() { return this.acl.can('product.editor'); }, method: 'onSave' } }. Add snippets under the sw-privileges namespace: group label sw-privileges.<category>.<key>.label, and for additional_permissions a role label sw-privileges.additional_permissions.<key>.<role>. To check rights in a component, inject: ['acl'] (or Shopware.Service('acl')) and call this.acl.can('sales_channel.creator'); in a template use v-if=\"acl.can('review.editor')\" or disable an element and show a warning tooltip via v-tooltip with message: $tc('sw-privileges.tooltip.warning') and showOnDisabledElements: true. acl.can returns true for admin users and also for an empty identifier. To automatically grant your plugin's API privileges to existing roles (e.g. product.viewer) from PHP, override enrichPrivileges(): array in your Shopware\\Core\\Framework\\Plugin subclass, returning role identifier => extra privileges (e.g. 'product.viewer' => ['my_custom_privilege:read']); a core subscriber merges these into ACL roles when roles are loaded, for active plugins. Note: Administration ACL only controls UI elements and can be bypassed by direct API calls.","citations":["platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:1-96"],"toolCallLog":[{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-27":{"query":"In Shopware 6.7, how do I extend a Storefront Twig template from my plugin with `{% extends %}` so I keep the core markup and other plugins' changes?","category":"dev","option":"fs-wiki","answer":"Shopware looks for templates in each bundle's Resources/views directory, so a plugin's own view root is <plugin root>/src/Resources/views. Find the core template you want to change (e.g. by searching <shopware root>/src/Storefront for a term), then mirror its exact relative path under your plugin's views directory — the override only loads when the path below views matches the original exactly (e.g. Storefront/Resources/views/storefront/layout/header/logo.html.twig becomes <plugin root>/src/Resources/views/storefront/layout/header/logo.html.twig). Rather than plain Twig {% extends %}, Shopware provides {% sw_extends %} — a multi-inheritance-aware extends tag — to use for this: {% sw_extends '@Storefront/storefront/layout/header/logo.html.twig' %}, then redefine only the block(s) you want to change, e.g. {% block layout_header_logo_link %}...{% endblock %}; call {{ parent() }} inside a block to append to the original content instead of replacing it. sw_extends is what lets multiple plugins' overrides of the same template stack, keeping both the core markup and other plugins' changes — a plain Twig extends would not. An extending file with no block overrides changes nothing. After editing, clear the cache with ./bin/console cache:clear and reload the Storefront (activate the plugin; for theme-scoped assets, assign the theme in the sales channel too); use {{ dump() }} in a template to inspect available variables. Since Shopware 6.7.11.0 a newer Storefront component system for reusable atomic template components also exists as an alternative mechanism.","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-templates.md:15-60"],"toolCallLog":[{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*template*\" | grep -i storefront"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-templates.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"rule-04":{"query":"How should my plugin throw exceptions so they follow Shopware's conventions?","category":"rule","option":"fs-wiki","answer":"Create one exception factory class per top-level domain, stored directly in that domain's namespace root, named `<Domain>Exception`, extending the abstract `Shopware\\Core\\Framework\\HttpException` (constructor: `int $statusCode, string $errorCode, string $message, array $parameters = [], ?\\Throwable $previous = null`). Expose every error as a `public static function` factory returning the exception, and throw via the factory (e.g. `throw CustomerException::customerGroupNotFound($id)`) — never `new \\RuntimeException(...)` or a generic `\\InvalidArgumentException`. Pass dynamic values as `{{ placeholder }}` parameters in the message plus the `$parameters` array, not string concatenation. Declare each error code as a `public const` on the domain exception, unique within the domain, prefixed with the area/domain in upper snake case as core does (e.g. `CHECKOUT__CUSTOMER_GROUP_NOT_FOUND`); in a plugin use your own unique prefix. Give each exception a specific HTTP status via `Symfony\\Component\\HttpFoundation\\Response` constants, never a blanket 500 — `getStatusCode()` and `getErrorCode()` are what the API error response exposes, so never reuse one code for two different failures. Do not add a dedicated exception class for an error nothing catches — the factory method is enough; only when code must catch a specific case, add a subclass under the domain's `Exception` sub-namespace and let the domain factory return that subclass, and catch the subclass (not the domain class) so unrelated errors aren't swallowed. To branch on a caught `HttpException` without a subclass, compare `$e->is(CustomerException::CUSTOMER_GROUP_NOT_FOUND)` or `getErrorCode()`.","citations":["platform/guidelines/6.7/code-guidelines.md:19-67"],"toolCallLog":[],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-69":{"query":"How does an app subscribe to an event like `product.written`, what does Shopware POST to the webhook URL, and how do I verify the request is genuine?","category":"dev","option":"fs-wiki","answer":"Declare a `<webhook>` element inside `<webhooks>` in `manifest.xml` with required attributes `name`, `url`, and `event` (e.g. `event=\"product.written\"`), and optionally `onlyLiveVersion` (default `false`, since 6.5.7.0; when true, non-live-version payload entries are stripped and the webhook is skipped if all versioned entries are non-live, though unversioned writes still send). Example: `<webhook name=\"product-changed\" url=\"https://example.com/event/product-changed\" event=\"product.written\"/>`. Written-event webhooks are only delivered if the app has read permission on the entity, and deactivated apps only get app lifecycle events. When the event fires, Shopware POSTs a JSON body: `{\"data\": {\"payload\": [{\"entity\": \"product\", \"operation\": ..., \"primaryKey\": ..., \"updatedFields\": []}], \"event\": \"product.written\"}, \"source\": {\"url\": ..., \"appVersion\": ..., \"shopId\": ..., \"eventId\": ...}, \"timestamp\": 123123123}` — `entity.written` payloads carry only `entity`/`operation`/`primaryKey`/`updatedFields` (plus `versionId` when written), never the full entity, and `updatedFields` is omitted for delete operations; `source.eventId` (since 6.4.11.0) is unique and stable across retries, useful for de-duplication, and `timestamp` (since 6.4.1.0) can be used for replay protection. To verify authenticity, check the `shopware-shop-signature` header, which is an HMAC-SHA256 of the request body computed with the shop's app secret (the same mechanism as the registration confirmation request); also read `sw-version` and, since 6.4.5.0, `sw-context-language`/`sw-user-language` headers. The App PHP SDK's `ShopResolver::resolveShop()`/`ContextResolver::assembleWebhook()` (or the Symfony bundle's `WebhookAction` type-hint) handle this for you.","citations":["platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md:25-46","platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md:58-61"],"toolCallLog":[{"tool":"Read","args":"path=platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-04":{"query":"How do I create a custom CMS element for Shopping Experiences?","category":"dev","option":"fs-wiki","answer":"A CMS element is the smallest content unit of Shopping Experiences (Page → Section → Block → Slots → Elements); it's a content primitive rendered inside a block's slot. Layout: `<plugin root>/src/Resources/app/administration/src/module/sw-cms/elements/<name>/` with `index.js`, `component/`, `config/`, `preview/` folders, imported in `main.js` via `import './module/sw-cms/elements/<name>';`. In the element's `index.js`, register it: `Shopware.Service('cmsService').registerCmsElement({ name: 'dailymotion', label: 'cms.elements.dailymotion.label', component: 'cms-el-dailymotion', configComponent: 'cms-el-config-dailymotion', previewComponent: 'cms-el-preview-dailymotion', defaultConfig: { url: { source: 'static', value: '' } } });` — `name` and `component` are mandatory (registration returns `false` without them); optional `hidden` (excludes it from the replace-element selector) and `removable: false` (no remove action on the slot); `defaultConfig` entries are `{ source, value }` with `source` one of `static`, `mapped`, `default`. Build a preview component (thumbnail shown when selecting/swapping elements), a main component with `mixins: ['cms-element']` calling `this.initElementConfig()` in `created()` and reading `element.config.<key>.value` (with fallback content when empty), and a config component using the same mixin plus form fields (e.g. `mt-text-field` bound with `v-model=\"element.config.<key>.value\"`) for every `defaultConfig` key, wrapping individual fields in `sw-cms-inherit-wrapper` (props `field`, `:element`, `:label`) so values can inherit from the base layout or be overridden per page. For the Storefront, add `<plugin root>/src/Resources/views/storefront/element/cms-element-<name>.html.twig` (the `cms-element-` prefix is mandatory — blocks include templates by that name pattern, so a wrong filename renders nothing); the `element` variable (a `CmsSlotDefinition`) is passed automatically. Clear the Storefront cache afterward. Note: in 6.7 `initElementConfig()` takes no parameter even though some docs show it called with the element name.","citations":["platform/dev/6.7/guides/plugins/plugins/content/cms/add-cms-element.md:15-61"],"toolCallLog":[{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -ipath '*cms*element*' | grep -v adr"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/content/cms/add-cms-element.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-06":{"query":"I'm coming from Magento — what are the Shopware equivalents of store views, extensions, attribute sets and `di.xml`?","category":"edge","option":"fs-wiki","answer":"The corpus's Magento-to-Shopware dictionary (a merchant migration guide) maps most of these: Magento 'Websites/Manage Stores' (store views) map to Shopware Sales Channels, configured in the left admin bar; new sales channels come in three types — Storefront (URL-accessible shop), Product comparison (exports to price portals/marketplaces), and Headless (API-only, e.g. ERP connections). Magento 'Extension' maps to Shopware's 'Plugin', and Magento's Local Code Pool maps to Shopware 'Extensions' (installed under Settings > My extensions). Magento 'Attribute Sets' map to Shopware 'Custom field sets' — the dictionary notes Magento attribute sets and its 'hard' product-type separation do not exist in Shopware; advanced prices, properties, and cross-selling instead live in their own tabs on the product itself, and general Magento 'Attributes' split into Shopware Properties (drive variants/filtering) or Custom fields (extend the product), which is a different meaning than the single Magento 'attribute' concept. `di.xml` (Magento's dependency-injection/service configuration) is not itself in the migration dictionary, but Shopware's developer docs describe its equivalent: plugin services are registered in `<plugin root>/src/Resources/config/services.php` (or the XML form) using the Symfony service container, with services either autowired/autoconfigured automatically or wired explicitly via `service(...)` calls, and are then obtained through constructor injection — there is no single global `di.xml`, configuration is per-plugin via `services.php`/`services.xml`. [from memory, for the di.xml equivalence characterization]","citations":["platform/func/migration-en/magento-keywords.md:18-56","platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md:15-40"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"magento\" platform"},{"tool":"Read","args":"platform/func/migration-en/magento-keywords.md"},{"tool":"Bash","args":"grep -rli \"services.xml\" platform/dev/6.7"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md (offset 1, limit 40)"}],"notFoundClaim":false,"memoryClaims":["di.xml (Magento's dependency-injection/service configuration) equivalence characterization — there is no single global di.xml in Shopware, configuration is per-plugin via services.php/services.xml."],"sourceVerdict":"yes"},"dev-30":{"query":"How do I add a custom filter to the Storefront product listing from my plugin, both the criteria side and the filter panel?","category":"dev","option":"fs-wiki","answer":"For the criteria side, create a subscriber to \\Shopware\\Core\\Content\\Product\\Events\\ProductListingCollectFilterEvent (ProductListingCollectFilterEvent::class => 'addFilter'). In the listener, read $event->getFilters() (a FilterCollection) and $event->getRequest(), then build and add a Shopware\\Core\\Content\\Product\\SalesChannel\\Listing\\Filter — constructor args in order: name (unique string), filtered (bool, true when active), aggregations (DAL aggregations list), filter (DAL filter added to the criteria), values (exposed as currentFilter in the result), exclude (bool, default true). Example for a boolean isCloseout filter: $filtered = (bool) $request->get('isCloseout'); $filters->add(new Filter('isCloseout', $filtered, [new FilterAggregation('active-filter', new MaxAggregation('active', 'product.isCloseout'), [new EqualsFilter('product.isCloseout', true)])], new EqualsFilter('product.isCloseout', true), $filtered)); a multi-value example uses EntityAggregation and EqualsAnyFilter (e.g. for manufacturer). Core decides whether and how the filter is actually applied. For the panel side, create src/Resources/views/storefront/component/listing/filter-panel.html.twig in your plugin, sw_extend the core file and override block component_filter_panel_items: {% sw_extends '@Storefront/storefront/component/listing/filter-panel.html.twig' %} {% block component_filter_panel_items %} {{ parent() }} {% sw_include '@Storefront/storefront/component/listing/filter/filter-boolean.html.twig' with { name: 'isCloseout', displayName: 'Closeout' } %} {% endblock %} — the name passed to the Twig component should match the filter name/request parameter used in the subscriber. Available filter components under component/listing/filter/ are filter-boolean, filter-multi-select, filter-property-select, filter-range, filter-rating-select and filter-rating-select-item. {{ parent() }} placement controls filter order — call it first to append at the end, or last to place your filter first; to position relative to a specific filter (e.g. after price), extend that filter's own block (e.g. component_filter_panel_item_price) instead. Block component_filter_panel_items is available since Shopware 6.4.8.0.","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/howto/add-listing-filters.md:15-72"],"toolCallLog":[{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*filter*\" | grep -i listing"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/storefront/howto/add-listing-filters.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-03":{"query":"How do promotions and discount codes work, including individually generated codes?","category":"func","option":"fs-wiki","answer":"Promotions are created under Marketing > Promotions via 'Create action', which after the first save unlocks a General, Conditions and Discounts tab. General settings cover Name, Priority (higher priority applies first when several rules match), Valid from/until, Max. total uses, Max. uses per customer, and Active. Promotion codes offer three modes: 'No promotional code required', a single Fixed promotion code (manually set or system-generated randomly), or 'Individual promotion codes' generated per order via 'generate codes'/'add codes' — individual codes are single-use, and custom code patterns can use `%s` for a random letter (A-Z) and `%d` for a random digit (0-9), e.g. `SW-%s%d%s%d%s-TEST`. Conditions restrict the promotion to specific sales channels, can prevent combination with other promotions or explicitly exclude specific other promotions, and support rule-based conditions via the Rule Builder across customer rules, shopping cart rules, order rules, and product sets (a set group defined by Mode — Number/Value(Gross)/Value(Net) —, Value, Sorting, and Product rules); if several rules of the same type are selected, only one needs to match. Discounts define what the discount applies to (entire cart, shipping costs, entire product set, or a specific set group), optionally restricted to a specific range of products, plus a discount Type (absolute, percentage, fixed price, or fixed unit price), a Value, and an optional Maximum discount value cap for percentage discounts. Customers redeem a code in the storefront via the 'Enter voucher code' field in the OffCanvas or full shopping cart. Gotchas: only one individual code from a promotion can be redeemed per order at a time; regenerating promotion codes invalidates previously generated codes; discount settings cannot be changed once the promotion has been used in an order; and excluding products via a shopping-cart-rule condition (rather than a discount product rule) blocks the whole promotion when an excluded product is present, instead of merely excluding that product from the discount. Redeemed individual and fixed codes can be looked up per order from the promotion's Redeemed list, or by filtering the order overview on the promotion code field.","citations":["platform/func/marketing/promotions.md:18-55"],"toolCallLog":[{"tool":"Read","args":"platform/func/marketing/promotions.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-40":{"query":"How do I upgrade a Composer-based Shopware project from 6.6 to 6.7 — which composer.json constraint do I change, and which console commands do I run afterwards?","category":"dev","option":"fs-wiki","answer":"The recommended route is the Shopware CLI upgrade wizard: from a clean Git working tree run shopware-cli project upgrade (or shopware-cli project upgrade --no-interaction --target latest-patch --dry-run for a CI/read-only preflight). It checks readiness, lets you pick the target version, checks Composer-managed extensions and verifies the dependency set before touching files; it does not deploy, so you still test, review the report, commit and deploy yourself. For a manual Composer-based update: (1) on running environments, put the shop into maintenance mode with bin/console sales-channel:maintenance:enable --all (or -a; alternatively pass specific sales channel ids); (2) raise the Shopware version constraint in composer.json (and in shopware/commercial if used) to the 6.7 constraint, then run composer update --no-scripts (the --no-scripts flag is needed because scripts may call Shopware commands that only work after recipes are updated — without raising the constraint, composer update just resolves to the already-installed version and nothing is upgraded); (3) optionally but recommended, run composer recipes:update and review the changes; (4) run bin/console system:update:finish, which runs migrations and asset installation (the storefront reacts to the post-finish event to recompile themes) — it takes options --skip-migrations, --skip-asset-build, and --version-selection-mode (default 'safe'), and it skips itself entirely if DATABASE_URL is not defined; (5) finally bin/console sales-channel:maintenance:disable --all. Best practices around the upgrade: back up the database, test on staging with production-like data first, read release notes/UPGRADE files, check extension compatibility, use Rector and Administration codemods, avoid skipping major versions, and commit composer.json/composer.lock. Afterward, clear caches, rebuild assets if required, and test checkout/login/API flows plus extensions, reviewing logs for errors and deprecations.","citations":["platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md:1-72"],"toolCallLog":[{"tool":"Bash","args":"cd .../wiki/platform && grep -rln \"6.6 to 6.7|upgrade.*6.7|composer.json.*6.7\" dev/6.7 | head -20"},{"tool":"Read","args":"platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-23":{"query":"How do I ship a mail template with my plugin so it is installed automatically, including a custom mail template type?","category":"dev","option":"fs-wiki","answer":"Write a plugin database migration (a class extending Shopware\\Core\\Framework\\Migration\\MigrationStep, declaring getCreationTimestamp() and update()) that inserts rows directly into the mail template tables rather than creating the template in the Administration. First obtain a mail_template_type id — either look up an existing one (e.g. SELECT id FROM mail_template_type WHERE technical_name = \"contact_form\", converted with Uuid::fromBytesToHex) or create a custom type. Then insert into mail_template (id, mail_template_type_id, system_default = 0, created_at). Look up the language id per locale (join language to locale on locale.code, e.g. en-GB, de-DE) and, only for languages that exist in the shop, insert into mail_template_translation (mail_template_id, language_id, sender_name, subject, description, content_html, content_plain, created_at) — sender_name may use Twig such as {{ salesChannel.name }}. Use INSERT IGNORE INTO for every insert (so reinstall doesn't error) and (new DateTime())->format(Defaults::STORAGE_DATE_TIME_FORMAT) for created_at; do not delete templates on uninstall since they may be referenced elsewhere. To ship a custom mail template type, instead insert into mail_template_type (id, technical_name, available_entities, created_at) — e.g. technical_name = 'custom_mail_template_type', available_entities = json_encode(['product' => 'product']) defining which entities are available to templates of that type — plus one mail_template_type_translation row (mail_template_type_id, language_id, name, created_at) per existing language, then use the new type's id when creating the mail_template row.","citations":["platform/dev/6.7/guides/plugins/plugins/content/mail/add-mail-template.md:15-61"],"toolCallLog":[{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname \"*mail-template*\""},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/content/mail/add-mail-template.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-02":{"query":"How do Rule Builder conditions work for shipping and payment methods?","category":"func","option":"fs-wiki","answer":"Both shipping and payment methods use an 'Availability rule' field, built via the Rule Builder, to decide when the method can be used/offered — for payment methods, leaving the Availability rule blank/NULL means unrestricted availability. For shipping methods (Settings > Commerce > Shipping), the Availability rule decides when the method can be used, and a new rule can be created inline while editing the method; separately, the shipping method's price matrix can also have its own optional 'restriction' (another Rule Builder rule) that scopes when a given matrix applies, and the matrix itself can be built either from properties (number of items, cart value, weight, volume) or from Rule Builder rules for pricing levels. For payment methods (Settings > Commerce > Payment methods), by default cash on delivery, invoice, prepayment and direct debit are active, but a method must also be explicitly assigned in the sales channel's payment settings to appear in the storefront — the Rule Builder availability rule alone is not sufficient; sales-channel assignment is required too. In both cases the method also needs to be assigned to the relevant sales channel (shipping methods are assigned from the sales channel's general settings, where a default shipping method is also chosen) for it to be offered there at all, independent of what the Rule Builder condition evaluates to.","citations":["platform/func/settings/shipping.md:18-47","platform/func/settings/Paymentmethods.md:18-47"],"toolCallLog":[{"tool":"Bash","args":"grep -n -i \"rule builder\\|shipping method\\|payment method\" <home>/projects/host-project/.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/func/index.md"},{"tool":"Read","args":"platform/func/settings/shipping.md"},{"tool":"Read","args":"platform/func/settings/Paymentmethods.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"rule-06":{"query":"Can a storefront controller contain business logic, or where should that logic live?","category":"rule","option":"fs-wiki","answer":"No. The 'headless first apis and thin controllers' rule states: 'No business logic or repositories in storefront controllers: read via route/page loader, write via a Store API route, respond with createActionResponse(), report errors via flash bags.' The guideline requires building each storefront feature on a Store API route first, with controllers and page loaders only calling those routes; storefront controllers must extend `StorefrontController`, use `StorefrontRouteScope::ID`, name routes `frontend.*`, restrict HTTP methods, declare return types, and inject dependencies via constructor into private properties. So business logic belongs in a Store API route (for writes) or is read through a route/page loader (for reads), not in the controller itself.","citations":["platform/guidelines/6.7/architecture-guidelines.md:57-67"],"toolCallLog":[],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-03":{"query":"How do I add a custom Store API route for a headless storefront?","category":"dev","option":"fs-wiki","answer":"Define an abstract class (e.g. `AbstractExampleRoute`) declaring `getDecorated(): AbstractExampleRoute` and `load(Criteria $criteria, SalesChannelContext $context): ExampleRouteResponse`. Implement it as `ExampleRoute extends AbstractExampleRoute`, tagged with the route scope attribute `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]])]` on the class, `getDecorated()` throwing `DecorationPatternException(self::class)`, and the actual endpoint method annotated `#[Route(path: '/store-api/example', name: 'store-api.example.search', methods: ['GET','POST'], defaults: ['_entity' => 'swag_example'])]` performing a repository search. Register the service with its repository dependency, e.g. `$services->set(ExampleRoute::class)->args([service('swag_example.repository')]);`. The response class `ExampleRouteResponse` extends `Shopware\\Core\\System\\SalesChannel\\StoreApiResponse`, passing the `EntitySearchResult` as `$object` to the parent constructor and exposing accessors like `getExamples()` returning `$this->object->getEntities()`. The route must be discovered via `<plugin root>/src/Resources/config/routes.php` with `$routes->import('../../Core/**/*Route.php', 'attribute');`, and can be verified with `./bin/console debug:router store-api.example.search` (this proves discovery only, not that requests succeed). Document it with an OpenAPI JSON schema file under `<plugin root>/src/Resources/Schema/StoreApi/` (inspectable at `/store-api/_info/stoplightio.html`). Optionally wrap it for the Storefront with `ExampleController extends StorefrontController` using `StorefrontRouteScope::ID`, injecting `AbstractExampleRoute`, and importing `../../Storefront/**/*Controller.php` in routes.php, calling it from JS with `fetch('/example', { method: 'POST' })`. Gotchas: fields need the `ApiAware` flag in the entity definition to be exposed via the API, and `_entity` is required in the route defaults or the `Criteria` argument resolver throws.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md:16-67"],"toolCallLog":[{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/framework/store-api -maxdepth 2"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-64":{"query":"How do I get an Admin API OAuth token — with client_credentials for an integration, or the password grant for local testing — and how long is each token valid?","category":"dev","option":"fs-wiki","answer":"POST to `/api/oauth/token` (unauthenticated route) to get a token; the Admin API concept page confirms integrations should use the `client_credentials` grant, while the password grant with `client_id: administration` is documented as a local-only shortcut using the default admin user. The password-grant request body is: `{\"grant_type\": \"password\", \"client_id\": \"administration\", \"scopes\": \"write\", \"username\": \"admin\", \"password\": \"shopware\"}`, and the response is `{ \"token_type\": ..., \"expires_in\": 600, \"access_token\": ..., \"refresh_token\": ... }`. Both grant types produce tokens with the same lifetimes: the access token's TTL is controlled by `shopware.api.access_token_ttl`, default `PT10M` (600 seconds, matching `expires_in: 600`), and the refresh token's TTL is `shopware.api.refresh_token_ttl`, default `P1W` (one week). For 'reproducible setups' (i.e. real integrations), the docs say to keep using `client_credentials` rather than the password shortcut.","citations":["platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md:25-39","platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md:76-79","platform/dev/6.7/concepts/api/admin-api.md:22-27"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"client_credentials\\|oauth\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"},{"tool":"Read","args":"path=platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md"},{"tool":"Read","args":"path=platform/dev/6.7/concepts/api/admin-api.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-08":{"query":"How do custom field sets work — entity assignment, field types and technical name — and can a custom field be written through the Store API?","category":"func","option":"fs-wiki","answer":"Custom fields let merchants add their own data fields to entities like products or categories, for use in the Rule Builder, storefront templates, or the Store API, and are managed under Settings > System > Custom fields. Custom fields are grouped into Sets, created via 'New set'; each set requires a unique, immutable technical name, a position, a label (optionally per admin language), and the program areas (entities, e.g. products, categories) the set applies to — a set with no area selected is created but unavailable anywhere, i.e. entity assignment happens at the set level. Within a set, 'New custom field' opens a type-specific form; common options across field types are Technical name (required, unique, immutable), Position, 'Available in shopping carts' (needed for Rule Builder/template use), 'Modifiable via Store API' (makes the field publicly writable/readable — must not be used for sensitive data), Label, Help text, and type-specific options like Placeholder. Field types include: Select (single/multi option list), Object selection (references entities such as dynamic product group, experience world, manufacturer, category, customer, country, delivery method, product, sales channel, payment method — the object type is fixed after creation), Text field, Media, Number (integer/float, with Steps/Min/Maximum), Date/Time, Checkbox, Active/Inactive switch (stores 0/1), Text Editor, and Color picker. So yes — a custom field can be written through the Store API, but only if its 'Modifiable via Store API' toggle is explicitly enabled; the wiki page warns this must not be used for sensitive data since it makes the field publicly writable and readable. Gotchas: custom fields should always be edited in the store's default language since inheritance to other languages depends on it, otherwise Rule Builder rules relying on the value may not apply in all languages; technical names must not contain Twig special characters such as `-` or `#`, or product exports can error; and when a custom field is created it is automatically added as a snippet in all snippet sets without needing database changes.","citations":["platform/func/settings/custom-fields.md:18-45"],"toolCallLog":[{"tool":"Read","args":"platform/func/settings/custom-fields.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-55":{"query":"How do the breaking storefront accessibility changes reach my theme in Shopware 6.7, and what must an extension that overrides the affected Twig blocks do?","category":"dev","option":"fs-wiki","answer":"The breaking HTML/Twig/CSS accessibility changes (WCAG 2.1 AA / BITV 2.0 work: carousel focused slides, 200% text resizing, pagination with links, no empty nav in top-bar, keyboard-operable content, etc.) were introduced across 6.6.1.0–6.6.6.0 gated behind a feature flag, and became the default (active) behaviour with 6.7.0 — on an installed 6.7 core they are already on, no `.env` change is needed (the `ACCESSIBILITY_TWEAKS` flag is declared `default: true` and, per the code check, no code in core/storefront/administration actually reads it any more). In templates the new branch was rendered behind the Twig `feature('<FLAG>')` function. The 6.6 pattern for extensions overriding a restructured block: the new markup got a new inner block while the old block was marked `@deprecated tag:v6.7.0`; an extension could support both during the transition by extending the new inner block (e.g. `component_list_items_inner`) with `{% sw_extends %}` and `{{ parent() }}`, and removing its override of the old, now-deprecated block after 6.7.0. After adapting overridden blocks, recompile the theme with `bin/console theme:compile` so styling changes (e.g. adjusted font sizes) apply, and test with Lighthouse/AXE DevTools/WAVE plus manual keyboard and screen-reader checks.","citations":["platform/dev/6.7/guides/development/accessibility/storefront-accessibility.md:1-76"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"accessib\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | head -20"},{"tool":"Read","args":"platform/dev/6.7/guides/development/accessibility/storefront-accessibility.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-07":{"query":"How do I create a media entity from a file on disk in PHP from my plugin (e.g. during an import) and generate its thumbnails?","category":"gap","option":"fs-wiki","answer":"The corpus has no plugin-developer how-to for creating a `media` entity from a local file in PHP (e.g. no `MediaService`/`saveFile` guide). Its Media section index only lists three narrower extension-point guides — preventing deletion of plugin-referenced media by `media:delete-unused`, adding custom file extensions (`shopware.filesystem.allowed_extensions`, `MediaFileExtensionWhitelistEvent`), and remote thumbnail generation (`shopware.media.remote_thumbnails`) — none of which is a 'create + upload + thumbnail' walkthrough. The only file-on-disk-to-media pipeline documented in this corpus is the Migration Assistant's internal one (`platform/dev/6.7/products/extensions/migration-assistant/concept/media-processing.md`): it queues file metadata with `MediaFileService::saveMediaFile(['runId', 'entity', 'uri', 'fileName', 'fileSize', 'mediaId', ...])` and then a `MediaFileProcessorInterface` implementation (`LocalMediaProcessor`/`HttpMediaDownloadService`) actually copies or downloads the bytes — but this is Migration Assistant's own plugin-internal pipeline, not the general core API a third-party plugin would call, and thumbnail generation is not covered there either. I could not find the core `Shopware\\Core\\Content\\Media\\MediaService::saveFile()`/`generateThumbnails` API documented anywhere in this corpus, so I can't give verified steps for the actual question asked; the generic approach (inject `Shopware\\Core\\Content\\Media\\MediaService`, call `saveFile($stream/$fileContents, $extension, $mimeType, $fileName, $context, $folderName, $mediaId, $keepAspectRatio)` to both create the `media` row and store the file, then call `Shopware\\Core\\Content\\Media\\Thumbnail\\ThumbnailService::updateThumbnails()` or run `bin/console media:generate-thumbnails`) is from my own knowledge, not this corpus [from memory].","citations":["platform/dev/6.7/guides/plugins/plugins/content/media/_index.md:14-38","platform/dev/6.7/products/extensions/migration-assistant/concept/media-processing.md:14-51"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"MediaService|upload.*media|from.*url|generateThumbnails|thumbnail\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/plugins/plugins/content/media/_index.md"},{"tool":"Bash","args":"grep -rln \"saveFile|saveMediaFile|MediaService\\b\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/products/extensions/migration-assistant/concept/media-processing.md"},{"tool":"Bash","args":"grep -rln \"media:generate-thumbnails|GenerateThumbnailsCommand|ThumbnailService\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head"}],"notFoundClaim":true,"memoryClaims":["The generic approach (inject `Shopware\\Core\\Content\\Media\\MediaService`, call `saveFile($stream/$fileContents, $extension, $mimeType, $fileName, $context, $folderName, $mediaId, $keepAspectRatio)` to both create the `media` row and store the file, then call `Shopware\\Core\\Content\\Media\\Thumbnail\\ThumbnailService::updateThumbnails()` or run `bin/console media:generate-thumbnails`) is from my own knowledge, not this corpus"],"sourceVerdict":"no"},"dev-15":{"query":"How do I work out which event Shopware actually dispatches for a given action, for example after a product is loaded or a page is rendered?","category":"dev","option":"fs-wiki","answer":"Shopware groups events into several families, each found differently. **DAL events** follow the auto-generated pattern `entity_name.event` (e.g. `product.written`, `product.deleted`); some entities also have constants classes like `ProductEvents` (`ProductEvents::PRODUCT_LOADED_EVENT` = `product.loaded`), and written listeners receive an `EntityWrittenEvent`. **General PHP events** are found by searching core source for `$this->eventDispatcher->dispatch($event, $name)`, `extends NestedEvent`, `extends Event`, or `implements ShopwareEvent`; without an explicit name the event class name is the event name. **Page-loaded events** are dispatched as `*PageLoadedEvent` (e.g. `GenericPageLoader` dispatches `GenericPageLoadedEvent`) — search `PageLoadedEvent`. **Criteria events** (hand-written, so not guaranteed to exist for a given entity) fire before entities load with a `Criteria`, e.g. `ProductListingCriteriaEvent`. **Route events** fire as `{route}.request` (`RequestEvent`), `{route}.response` (`ResponseEvent`), `{route}.render` (Storefront `StorefrontRenderEvent`), `{route}.encode` (Store-API `ResponseEvent`), and `{route}.controller` (`ControllerEvent`) — substitute the Symfony route name, e.g. `store-api.product.listing.request`. **Business/flow events** implement `FlowEventAware` (and `MailAware` for mail-triggering ones) — search for those interfaces, not the outdated `BusinessEventInterface`/`MailActionInterface` docs terms which don't exist in the installed code. Practically, the fastest way to find what actually fires for a specific request is the **Symfony profiler's \"Events\" tab**, which lists every event dispatched during that request by name. For Storefront JS, plugins publish via `this.$emitter.publish('someEvent', ...)`; for Administration, Vue components use `this.$emit('some-event', ...)` (searchable in the Administration `src`, or inspect with Vue devtools).","citations":["platform/dev/6.7/guides/plugins/plugins/framework/event/finding-events.md:1-96"],"toolCallLog":[{"tool":"Bash","args":"grep -n \"debug:event|event dispatched|find.*event|which event\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/framework/event/finding-events.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-52":{"query":"What must a plugin database migration class implement in Shopware 6.7, and where does the database cleanup on uninstall belong?","category":"dev","option":"fs-wiki","answer":"A plugin migration class extends `Shopware\\Core\\Framework\\Migration\\MigrationStep`, lives under `<plugin root>/src/Migration`, and is named `Migration<timestamp><Description>.php`. It must implement both abstract methods: `getCreationTimestamp(): int` (return the timestamp from the class name/skeleton) and `update(Connection $connection): void` (all schema and data changes go here); `updateDestructive()` is optional and non-abstract — plugin install/update never run it. Migrations have no rollback, so database cleanup (e.g. dropping the plugin's tables) belongs in the plugin's lifecycle `uninstall` method, not in a migration. Install and update run `migrateInPlace()` on the plugin's `MigrationCollection` automatically (only new ones on update); this can be generated with `bin/console database:create-migration -p <plugin> --name <Description>` or, from entity definitions, `bin/console dal:migration:create --bundle=<plugin> <entity>[,<entity>...]`, and run manually with `bin/console database:migrate <plugin> --all`. Manual control is available via `$updateContext->setAutoMigrate(false)` and `$updateContext->getMigrationCollection()->migrateInPlace($timestamp)` in the plugin base class.","citations":["platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md:1-85"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"MigrationStep\\|database migration\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -i | head -20"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-02":{"query":"What's the plugin lifecycle in Shopware — install, activate, uninstall — and how does `keepUserData` work?","category":"dev","option":"fs-wiki","answer":"A Shopware plugin's base class extends `Shopware\\Core\\Framework\\Plugin` (which extends `Bundle`) and can override optional no-op hooks: `install(InstallContext)`, `postInstall(InstallContext)`, `activate(ActivateContext)`, `deactivate(DeactivateContext)`, `update(UpdateContext)`, `postUpdate(UpdateContext)` and `uninstall(UninstallContext)`. `install()` should register entities/prepare requirements but keep created data inactive (the plugin isn't active yet); `activate()` activates that data or creates data requiring the active plugin; `deactivate()` deactivates/removes data that would interfere while inactive; `update()` should hold non-database adjustments (schema/data changes belong in plugin migrations); `postInstall()`/`postUpdate()` run only after the whole process completes successfully. `InstallContext` exposes `getContext()`, `getCurrentShopwareVersion()`, `getCurrentPluginVersion()`, `getMigrationCollection()`, `isAutoMigrate()`/`setAutoMigrate()`; `UpdateContext` adds `getUpdatePluginVersion()` (target version); `UninstallContext` adds `keepUserData()`. For `uninstall()`: `if ($uninstallContext->keepUserData()) { return; }` else remove/deactivate the plugin's data — never blindly delete entities that might be referenced elsewhere (e.g. a payment method used by real orders), deactivate instead. When `keepUserData()` is false, the core itself removes the plugin's migrations before calling `uninstall()` and deletes the plugin's system config, custom entities and custom fields after `uninstall()` runs. In the installed code, `activate()` actually runs after the plugin is flagged active and the container is rebuilt (with auto-migrate disabled, migrations run right after), and `deactivate()` runs before the plugin is flagged inactive — this differs from the docs' description of `activate()` running before activation.","citations":["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md:15-82"],"toolCallLog":[{"tool":"Bash","args":"find .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 -iname '*lifecycle*' -path '*plugin*'"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-71":{"query":"How does an app define its own custom entities in Shopware 6.7 and read them back through the API?","category":"dev","option":"fs-wiki","answer":"An app defines its own data structures by declaring them in `Resources/entities.xml` (validated against `entity-1.0.xsd`), giving each `<entity>` a `name` that must start with the prefix `custom_entity_` or the shorthand `ce_` (available since 6.4.15.0, to avoid DB name-length limits) — any other name is rejected. Inside `<fields>` you declare typed field elements (`int`, `float`, `string`, `text`, `bool`, `many-to-many`, `many-to-one`, `one-to-many`, `one-to-one`, `json`, `email`, `price`, `date`); `store-api-aware` is a required attribute on each field, while `required` and `translatable` default to `false`. Shopware generates a real database table, an entity repository, and Admin API routes for the entity automatically. To read the data back: from app scripts, use the auto-registered repository service `<entity name>.repository`, e.g. `services.repository.search('custom_entity_blog', criteria)` (using the underscore name, or the `ce_` shorthand if that prefix was used in the definition); via the Admin API, call `POST /api/search/custom-entity-{entityName}` (or `POST /api/search/ce-{entityName}` for shorthand-named entities — the docs source shows `ce_blog` with an underscore but the installed route actually uses a hyphen, `ce-{entityName}`). Optionally, adding `custom-fields-aware=\"true\"` and `label-property=\"name\"` (the named field must exist in `<fields>` and be of type string) on the `<entity>` element makes the custom entity selectable in 'Entity Select' custom fields (since 6.5.1.0); an Administration snippet should also be added so the entity type isn't shown as a raw label key. The app automatically has full rights on its own custom entities, but associations to core tables (e.g. `product`) require matching `<permissions>` entries such as `<read>product<\/read>` in `manifest.xml`. Gotchas: existing custom entities cannot be renamed (renaming deletes all existing data); `custom-fields-aware` without a valid `label-property` (missing, not in `<fields>`, or non-string) throws an exception.","citations":["platform/dev/6.7/guides/plugins/apps/custom-data/custom-entities.md:15-78"],"toolCallLog":[{"tool":"Read","args":"platform/index.md"},{"tool":"Bash","args":"grep -n \"custom entit\" <home>/projects/host-project/.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/apps/custom-data/custom-entities.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-04":{"query":"How do I fetch products with `GET /sales-channel-api/v3/product` on Shopware 6.7?","category":"edge","option":"fs-wiki","answer":"That path does not exist on 6.7. The Store API concept page for 6.7 states routes live under the `/store-api` prefix (route scope `store-api`, `Shopware\\Core\\Framework\\Routing\\StoreApiRouteScope`), identified by the `sw-access-key` header with cart/session state carried in `sw-context-token` — there is no `/sales-channel-api/v3/...` prefix documented for 6.7, and the corpus's own grep for 'sales-channel-api' across dev/6.7 only turns up the term inside an ADR title referencing both 'store-api and sales-channel-api' historically, not as a current route. `sales-channel-api` was the old name for this customer-facing API before Shopware renamed it to `store-api`; on 6.7 the equivalent product-listing call is `GET /store-api/product` (or the more common `POST /store-api/product` search endpoint), authenticated with the `sw-access-key` header, with the corpus deferring endpoint/schema details to the Stoplight Store API reference. [from memory]","citations":["platform/dev/6.7/concepts/api/store-api.md:14-41"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"sales-channel-api\" platform/dev"},{"tool":"Bash","args":"grep -n \"sales-channel-api\" platform/dev/6.7/index.md"},{"tool":"Bash","args":"grep -rli \"store api|store-api\" platform/dev/6.7"},{"tool":"Read","args":"platform/dev/6.7/concepts/api/store-api.md"}],"notFoundClaim":false,"memoryClaims":["`sales-channel-api` was the old name for this customer-facing API before Shopware renamed it to `store-api`; on 6.7 the equivalent product-listing call is `GET /store-api/product` (or the more common `POST /store-api/product` search endpoint), authenticated with the `sw-access-key` header, with the corpus deferring endpoint/schema details to the Stoplight Store API reference."],"sourceVerdict":"partial"},"dev-37":{"query":"How do I set up and run PHPUnit integration tests for my Shopware plugin, including tests that boot the kernel?","category":"dev","option":"fs-wiki","answer":"Run bin/console plugin:create to scaffold <plugin root>/phpunit.xml and <plugin root>/tests/TestBootstrap.php. The generated phpunit.xml points bootstrap at tests/TestBootstrap.php, sets server KERNEL_CLASS=Shopware\\Core\\Kernel and env APP_ENV=test / SYMFONY_DEPRECATIONS_HELPER=weak, and defines one testsuite (<PluginName> Testsuite over the tests directory) — add further <testsuite> entries yourself (e.g. a 'migration' suite) if needed, since the generator only creates the one suite despite older docs describing two. In tests/TestBootstrap.php, use Shopware\\Core\\TestBootstrapper: $loader = (new TestBootstrapper())->addCallingPlugin()->addActivePlugins('BasicExample')->setForceInstallPlugins(true)->bootstrap()->getClassLoader(); then $loader->addPsr4('Swag\\\\BasicExample\\\\Tests\\\\', __DIR__);. addCallingPlugin() locates the plugin via the nearest composer.json's extra.shopware-plugin-class; setForceInstallPlugins(true) installs and activates the plugin even if the test database already exists. For an integration test that boots the kernel, extend PHPUnit\\Framework\\TestCase and use Shopware\\Core\\Framework\\Test\\TestCaseBase\\IntegrationTestBehaviour, which bundles database transaction, cache, kernel, request stack, session and translation behaviours. For a migration test, use KernelTestBehaviour instead, fetch the DBAL Connection via $this->getContainer() (which returns the test.service_container and throws if the kernel has none), run $migration->update($conn), and compare SHOW CREATE TABLE output before/after. To override services only for tests, add <plugin root>/Resources/config/services_test.php, which overrides arguments/aliases/parameters of services.php in the test environment only. Run tests from the project root with ./vendor/bin/phpunit --configuration=\"custom/plugins/SwagBasicExample\" --testsuite \"migration\" (omit --testsuite to run all suites), or target a single class/method with --filter testNoChanges or --filter Migration1611740369ExampleDescriptionTest. In a Flex/project-template setup, composer require --dev dev-tools provides PHPUnit.","citations":["platform/dev/6.7/guides/development/testing/unit/php-unit.md:1-89"],"toolCallLog":[{"tool":"Bash","args":"cd .../wiki/platform && grep -rln \"phpunit|PHPUnit|IntegrationTestBehaviour|KernelTestBehaviour\" dev/6.7/guides/plugins/plugins/testing dev/6.7/guides/development/testing"},{"tool":"Bash","args":"cd .../wiki/platform && find dev/6.7/guides/plugins/plugins -iname \"*test*\"; grep -rln \"integration test|write-unit-tests|plugin.*phpunit\" dev/6.7/guides/plugins/plugins"},{"tool":"Read","args":"platform/dev/6.7/guides/development/testing/unit/php-unit.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-49":{"query":"My storefront controller still uses the `@Route` and `@RouteScope` annotations from 6.4 — what is the attribute form in Shopware 6.7 and how are the routes wired?","category":"dev","option":"fs-wiki","answer":"Before Shopware 6.4.11.0, route scope used the `@RouteScope` annotation, which was deprecated for 6.5; in 6.7 use the `_routeScope` route default instead, and `@Route` becomes the PHP 8 attribute `#[Route(...)]` from `Symfony\\Component\\Routing\\Attribute\\Route`. A controller extending `Shopware\\Storefront\\Controller\\StorefrontController` sets the scope on the class (or per route via the `defaults` argument): `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]])]` — confirmed in code, `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE` has value `_routeScope` and `StorefrontRouteScope::ID` has value `storefront`. Individual actions get `#[Route(path: '/example', name: 'frontend.example.example', methods: ['GET'])]` and typically call `$this->renderStorefront('@SwagBasicExample/storefront/page/example.html.twig', [...])`. Route names should use the prefix matching their purpose (`frontend`, `widgets`, `payment`, `api`, `store-api`) — confirmed in code, only `frontend.`, `widgets.` and `payment.` prefixes (or entries in `storefront.router.allowed_routes`, available since 6.7.2.0) identify a Storefront route. Wiring: register the controller as a service in `services.php` with `->public()->call('setContainer', [service('service_container')])` (needed to set the DI container), then import the routes in `routes.php` via `$routes->import('../../Storefront/Controller/*Controller.php', 'attribute');` — without this import step the controller exposes no URL at all. If you need a custom route name without one of the standard prefixes, add `src/Resources/config/packages/storefront.yaml` with `storefront: router: allowed_routes: [your.route.name]` and load it via a `DelegatingLoader` in the plugin base class's `build()`.","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:15-89"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"RouteScope\\|#\\[Route\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-11":{"query":"On Shopware 6.7, which file do I declare my plugin's services in, and how do I get a core service passed into my service's constructor?","category":"dev","option":"fs-wiki","answer":"Declare services in `src/Resources/config/services.php` — the plugin's `Bundle` base class automatically loads any `Resources/config/services.*` file. Use a `ContainerConfigurator` closure: either `->defaults()->autowire()->autoconfigure()` with `$services->load('Swag\\\\BasicExample\\\\', '../../')->exclude('../../{Resources,Migration,*.php}')` to register every class under `src` automatically (autowiring passes matching services, including core ones, into constructors by type-hint), or an explicit `$services->set(ExampleService::class)` declaration for more control per service. XML/YAML service files (`services.xml`) are still supported but XML is deprecated as of Symfony 7.4 (removed in 8.0), so `services.php` is preferred for new 6.7 plugins; Shopware 6.7.13.0 requires `symfony/dependency-injection` ~7.4.0. All services are private by default, so a core service must be obtained via injection (constructor type-hint), not fetched from the container directly.","citations":["platform/dev/6.7/guides/plugins/plugins/services/add-custom-service.md:1-84"],"toolCallLog":[{"tool":"Read","args":"platform/index.md"},{"tool":"Bash","args":"grep -rln \"services.xml\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7"},{"tool":"Bash","args":"grep -n \"add-custom-service|adjusting-service\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/index.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.6/index.md"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/services/add-custom-service.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-34":{"query":"How do I extend an existing Administration component and its Twig blocks from my plugin, for example to change the dashboard headline?","category":"dev","option":"fs-wiki","answer":"Use Shopware.Component.override('sw-dashboard-index', { template }) to change the existing component in place for all usages (import your overridden template with import template from './sw-dashboard-index.html.twig';), or Shopware.Component.extend('sw-custom-field', '<existing-component>', { template }) to create a new component based on an existing one while leaving the base untouched. Inside your override template, TwigJS blocks are used purely for block extending/overriding: redeclare the target block to replace it, e.g. { % block sw_dashboard_index_content_intro_content_headline %}<h1>Welcome to a customized component<\/h1>{% endblock %} — this is the exact block that renders the dashboard's welcome headline (it currently outputs {{ welcomeMessage }}, not a translation call as older docs describe). Put { % parent %} inside the block if you want to keep the original markup alongside your addition. To override or add methods/computed properties, redefine them under methods/computed in the override or extend config; call this.$super('onInput') (or this.$super('<computedName>')) inside your replacement to still run the inherited implementation — without it the inherited logic is dropped entirely. Place the override file at, e.g., <plugin root>/src/Resources/app/administration/src/sw-dashboard-index-override/index.js and import it from main.js (import './sw-dashboard-index-override/';) so it registers. There is also an experimental Composition API extension mechanism (Shopware.Component.overrideComponentSetup()(...) and createExtendableSetup) for components specifically built to support it, but it only supports overriding, not extending, and is marked experimental/stableVersion v6.8.0.","citations":["platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-components.md:1-85"],"toolCallLog":[{"tool":"Bash","args":"cd .../wiki/platform && grep -rln \"override.*component\\|Component.override\\|twig block\\|sw-dashboard\" dev/6.7/guides/plugins/plugins/administration | head -20"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-components.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-03":{"query":"My ERP integration stopped logging in after the 6.7 upgrade — what changed in the Admin API OAuth flow (`/api/oauth/authorize`, the `scope` format)?","category":"gap","option":"fs-wiki","answer":"Nothing in the corpus documents an `/api/oauth/authorize` endpoint or any 6.7 change to a `scope` format for the Admin API OAuth flow. What the corpus does document for 6.7's Admin API auth is the token endpoint `POST /api/oauth/token` with `grant_type: client_credentials` (integration `client_id`/`client_secret`) or the local-only `grant_type: password` (`client_id: administration`, `scopes: write`); the code check for the quick-start guide confirms `client_credentials` is 'validated against the integration's access key and secret' and that `access_token_ttl` defaults to `PT10M` (600s) for every grant type. Neither the quick-start page nor the follow-up authentication page mentions an authorization-code/`/authorize` step or any breaking change to how `scope`/`scopes` is passed between 6.6 and 6.7, so I could not confirm or deny the specific regression described from this corpus.","citations":["platform/dev/6.7/guides/development/integrations-api/_index.md:23-46","platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md:25-63"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"oauth/authorize|integration.*scope|OAuth\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md"},{"tool":"Bash","args":"grep -n -i \"client_credentials|scope\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/integrations-api/_index.md .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/concepts/api/_index.md"},{"tool":"Read","args":"path=.claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7/guides/development/integrations-api/_index.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"dev-43":{"query":"My admin plugin still ships a webpack.config.js — how do I move the administration build to Vite for Shopware 6.7?","category":"dev","option":"fs-wiki","answer":"Shopware 6.7 builds the Administration with Vite instead of Webpack; plugins with a custom webpack.config.js must migrate it. Steps: 1) Create `vite.config.mts` in `YourApp/src/Resources/app/administration/src` (the old `webpack.config.js` previously lived in `YourApp/src/Resources/app/administration/build/`). 2) Remove the old `webpack.config.js`. 3) Remove all webpack-related dependencies from `package.json`. 4) Add the Vite dependencies to `package.json`. A minimal config looks like `export default defineConfig({ resolve: { alias: { '@example': 'src/example' } } })` using `defineConfig` from `vite`. Under the hood, `php bin/console bundle:dump` (`Shopware\\Core\\Framework\\Plugin\\Command\\BundleDumpCommand`) writes active bundles/plugins to `var/plugins.json`, which `build/plugins.vite.ts` reads to call Vite `build` per plugin (or `createServer` per plugin during `composer watch:admin`); this is invoked as part of `composer build:js:admin` / `composer watch:admin`. Note apps are not affected since their build is decoupled, and note HMR only reloads `*.vue` files so it stays limited until components move to single-file components. The doc's mention of an `ADMIN_VITE` feature flag for testing is outdated — that flag no longer exists in 6.7's installed code; Vite is simply the build.","citations":["platform/dev/6.7/guides/upgrades-migrations/administration/vite.md:14-73"],"toolCallLog":[{"tool":"Read","args":"platform/dev/6.7/guides/upgrades-migrations/administration/vite.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-45":{"query":"Shopware.State is deprecated in 6.7 — how do I convert my administration Vuex module into a Pinia store?","category":"dev","option":"fs-wiki","answer":"Shopware 6.7 uses Pinia as the Administration state management library, replacing Vuex; `Shopware.State` (previously `Shopware.State.registerModule('product', productsStore)` / `Shopware.State.get(...)`) is marked `@deprecated tag:v6.8.0 - Will be removed, use Store instead.` in the installed code. Migration steps: 1) Register the store with `Shopware.Store.register('<storeName>', { state: () => ({...}), getters: {...}, actions: {...} })` (either the `(id, definition)` form or a definition object carrying `id`), then export it and import the store file from a component/index file to register it, e.g. `import './state/products.state';`. 2) `state` must be a function returning the initial state; drop `mutations` entirely and mutate state directly inside actions (e.g. `this.productName = newName`). 3) Getters must not share a name with a state property, and should only compute rather than modify. 4) Registering an existing id overwrites it; remove a store with `Shopware.Store.unregister('<storeName>')`. 5) Read it with `Shopware.Store.get('<storeName>')` — the installed code throws `Store with id \"...\" not found` for unknown ids. 6) For TypeScript, export `StoreType` via `ReturnType<typeof store>` and augment the global `PiniaRootState` interface. 7) For composable stores, pass a setup function or an external composable as the second argument to `Shopware.Store.register`. 8) For tests, import the store and call `store.$reset()` in `beforeEach`, or for components use `createPinia()`/`setActivePinia(pinia)` from `pinia` and mount with `global: { plugins: [pinia] }`. `Shopware.State` and `VuexRootState` still exist in 6.7 but are deprecated for removal in 6.8.0.","citations":["platform/dev/6.7/guides/upgrades-migrations/administration/pinia.md:14-69"],"toolCallLog":[{"tool":"Read","args":"platform/dev/6.7/guides/upgrades-migrations/administration/pinia.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-56":{"query":"Header and footer are loaded through ESI sub-requests in Shopware 6.7, so page data is gone in my header template — how do I pass my own data into the header/footer now?","category":"dev","option":"fs-wiki","answer":"Header and footer are rendered as ESI sub-requests (routes `frontend.header` / `frontend.footer`, `/_esi/global/header` and `/_esi/global/footer`) so they can be cached independently of the page, which means their templates no longer see the current page's data directly. To pass page-dependent data in, extend `@Storefront/storefront/base.html.twig` and override the `base_esi_header` (or `base_esi_footer`) block, merging your data into the `headerParameters` (or `footerParameters`) Twig variable before calling `parent()`, e.g. `{% set headerParameters = headerParameters|merge({'vendorPrefixPluginName': {'activeRoute': activeRoute}}) %}`. These parameters are sent as query parameters to the ESI route and become available in `@Storefront/storefront/layout/header.html.twig`'s `header` block as `headerParameters.vendorPrefixPluginName.activeRoute` — so values must be scalar only. Plugins can alternatively listen to `StorefrontRenderEvent`, check the request's `_route` attribute equals `frontend.header`, read `$event->getParameter('headerParameters') ?? []`, add data (e.g. from `$event->getSalesChannelContext()`), and call `$event->setParameter('headerParameters', $headerParameters)`. To fully replace the header/footer, override `base_esi_header`/`base_esi_footer` without an ESI render (as the checkout confirm page does with `header-minimal.html.twig`), but note this overwrites other extensions' customizations, and if your custom template extends the original you must load the header/footer pagelet data yourself.","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-header-footer.md:1-63"],"toolCallLog":[{"tool":"Bash","args":"grep -rln \"ESI\\|sub-request\\|esi\" .claude/extras/ShopwareDevKnowledgeBase/wiki/platform/dev/6.7 | head -20"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-header-footer.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-16":{"query":"How do I run plugin logic whenever an order is written, and find out exactly which fields changed?","category":"dev","option":"fs-wiki","answer":"Subscribe to the per-entity DAL event `order.written`, which dispatches `Shopware\\Core\\Framework\\DataAbstractionLayer\\Event\\EntityWrittenEvent` (definition, written data, context, primary keys, errors). Register the subscriber with `getSubscribedEvents()` returning `[OrderEvents::ORDER_WRITTEN_EVENT => 'onOrderWritten']` (or the class-name key if no constants class is used), then tag the service `kernel.event_subscriber` in `services.php`: `$services->set(OrderSubscriber::class)->tag('kernel.event_subscriber');`. To see exactly what fields are changing, subscribe instead (or additionally) to the generic batch event `Shopware\\Core\\Framework\\DataAbstractionLayer\\Event\\EntityWriteEvent`, which fires before insert/update/delete commands are written: filter by entity with `$event->getCommandsForEntity('order')` and read each `WriteCommand`'s payload via `$command->getPayload()` — this is the pre-write mechanism for capturing changed field values (e.g. an old value before it's overwritten), with `addSuccess()`/`addError()` callbacks that run after the write succeeds or fails. Note `EntityWriteEvent::getIds()` and `getCommandsForEntity()` both require the entity name argument, and `EntityDeletedEvent` extends `EntityWrittenEvent`.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/using-database-events.md:1-97"],"toolCallLog":[{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/framework/data-handling/using-database-events.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-10":{"query":"How do dynamic product groups work in the administration and where can the resulting group be used?","category":"func","option":"fs-wiki","answer":"Dynamic product groups live under Catalogues > Dynamic product groups in the administration. Each group is a set of products formed by rule-based conditions rather than manual assignment: you pick a property and a condition, combine further conditions with AND/OR, and nest conditions with SUB-CONDITION (the item must meet the main condition and the sub-condition); a live Preview shows the currently matching products. Multi-value properties (products, categories, manufacturers, tags, properties) support operators 'Is equal to', 'Is not equal to', 'Is equal to any of', 'Is not equal to any of', 'Is equal to all of', 'Is not equal to all of' — the 'all of' variants should be used instead of chaining multiple AND conditions on the same property. Custom fields and the product's delivery time can also be used as conditions, but if a delivery time used in a condition is later removed, the condition remains configured but stops functioning correctly. Each group has a Name (required), optional Description, and a 'Keep matching variants grouped' toggle: enabled keeps variants under a shared main product in categories/cross-selling/CMS product sliders, disabled shows variants individually. The overview list shows name, description, last-change date and status, flags a group invalid if it relies on rules from a deactivated plugin, and offers duplicate/edit/delete plus 'Save and duplicate'. The resulting dynamic product group can be used for dynamic categories, product comparison feeds, and Shopping Experiences (CMS) product sliders.","citations":["platform/func/shopware-6-de/Catalogues/Dynamicproductgroups.md:22-46"],"toolCallLog":[{"tool":"Read","args":"platform/index.md"},{"tool":"Bash","args":"grep -rli \"dynamic product group\" platform/func"},{"tool":"Bash","args":"find platform/func -iname \"*dynamic*\""},{"tool":"Read","args":"platform/func/shopware-6-de/Catalogues/Dynamicproductgroups.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-31":{"query":"How do I expose a plugin configuration value, such as a colour picked in the Administration, as an SCSS variable in my Storefront styling?","category":"dev","option":"fs-wiki","answer":"Add a field to your plugin's config.xml using an input-field of type colorpicker (e.g. name sassPluginHeaderBgColor), which merchants set in the Administration. Then in a plugin subscriber, listen to Shopware\\Storefront\\Theme\\Event\\ThemeCompilerEnrichScssVariablesEvent, inject SystemConfigService, read the value with $this->systemConfig->get('SwagBasicExample.config.sassPluginHeaderBgColor', $event->getSalesChannelId()), and call $event->addVariable('sass-plugin-header-bg-color', $color) to inject it as an SCSS variable during theme compilation. Give the SCSS variable a fallback default in the plugin's src/Resources/app/storefront/src/scss/base.scss (e.g. $sass-plugin-header-bg-color: #ffcc00 !default;), which the subscriber's value overrides once the plugin is active. Register the subscriber in src/Resources/config/services.php tagged kernel.event_subscriber, with SystemConfigService injected as an argument if config is read. addVariable(string $name, string $value, bool $sanitize = false) auto-prefixes $ to the name; kebab-case with a plugin/company prefix is recommended, and $sanitize (when true) escapes the value with addslashes() and wraps it in single quotes rather than stripping special characters as the official docs claim. Note plugins are not sales-channel specific by default: a variable added without a sales-channel lookup is global to all themes/sales channels; using getSalesChannelId() makes it per-sales-channel. The config.xml-declarative approach (a separate 'Add SCSS variables' guide) is the recommended way for simple, static config-to-SCSS mapping; the subscriber approach is for cases needing more flexibility (computed values, looping over fields, conditional variables, or per-sales-channel values).","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md:1-86"],"toolCallLog":[{"tool":"Read","args":"platform/index.md"},{"tool":"Bash","args":"cd .../wiki/platform && grep -rln \"config.*scss\\|scss.*variable\\|theme.json\" dev/6.7 | head -20"},{"tool":"Read","args":"platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-09":{"query":"How do I make a field on my plugin's own entity translatable per language?","category":"dev","option":"fs-wiki","answer":"For an existing custom entity (e.g. `swag_example`), create a `_translation` table via a migration: `swag_example_translation` with `swag_example_id` BINARY(16), `language_id` BINARY(16), your translated column(s) (e.g. `name` VARCHAR(255)), `created_at`/`updated_at`, primary key `(swag_example_id, language_id)`, and FKs to `swag_example(id)` and `language
