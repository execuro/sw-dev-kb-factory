pp's manifest. If a `finalize-url` is defined, the payment method is asynchronous; if not, it defaults to synchronous. Not providing a `pay-url` at all means the payment stays open on checkout with no app communication. Asynchronous flow: (1) Shopware POSTs to `pay-url` with `source`, `order`, `orderTransaction`, and a `returnUrl` (where the customer returns after the payment provider). (2) The app server responds with `{\"redirectUrl\": \"...\"}` pointing to the payment provider. (3) The browser redirects there, then the provider redirects the customer back to `returnUrl`. (4) Shopware then POSTs to `finalize-url` with `source`, `orderTransaction`, and `requestData` (the query params from the provider). (5) The app server responds with a `status` (and optional `message` on failure). Possible payment statuses are `open`, `paid`, `cancelled`, `refunded`, `failed`, `authorize`, `unconfirmed`, `in_progress`, `reminded`, `chargeback`. For synchronous payments (only `pay-url`, no `finalize-url`), the app can simply respond with a `status` such as `authorize` or `paid` directly from the `pay-url` call, or ignore the call entirely and the transaction stays open. Important: from Shopware 6.7.0.0 onwards, the app server MUST respond with a payment state in its response if it intends to change the transaction state — this applies to `pay`, `finalize`, prepared-payment `validate`/`pay`, `refund`, and recurring-capture calls alike.","citations":["developer/guides/plugins/apps/checkout/payment.md:8-272"],"toolCallLog":[{"tool":"Bash","args":"grep -rli 'pay-url|finalize-url' docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/apps/checkout/payment.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-71":{"query":"How does an app define its own custom entities in Shopware 6.7 and read them back through the API?","category":"dev","option":"fs-docs","answer":"An app defines custom entities in a `Resources/entities.xml` file at the app root, e.g. `<entities>` with an `<entity name=\"custom_entity_bundle\">` containing `<fields>` such as `<string>`, `<price>`, `<many-to-many reference=\"product\">`, each optionally marked `required`, `translatable`, and `store-api-aware`. Registered entities automatically get a repository, accessible from App Scripts via `services.repository.search('custom_entity_blog', criteria)`, and via the Admin API with `POST /api/search/custom-entity-blog` (entity name with underscores becomes hyphenated in the API route). Custom entities can also be made usable as an 'Entity Select' custom field type by adding `custom-fields-aware=\"true\"` and `label-property=\"name\"` to the entity element (available since 6.5.1.0), with the label field being a required string field, and can get a display snippet in `Resources/app/administration/snippet/en-GB.json`. Apps have full access rights to their own custom entities by default (permissions for own entities are automatically set), but need explicit manifest permissions if the entity has associations referencing core tables (e.g. `<read>product<\/read>`). Since v6.4.15.0, entity names can use the `ce_` shorthand prefix (e.g. `ce_bundle`) to avoid DB name length restrictions — if used, the same prefix must be used consistently in the repository calls and API routes (e.g. `POST /api/search/ce_blog`). Custom entities can't be renamed after creation without losing existing data.","citations":["developer/guides/plugins/apps/custom-data/custom-entities.md:8-127"],"toolCallLog":[{"tool":"Bash","args":"grep -rli 'custom.*entit' docs/shopware-knowledge-bases/developer/guides/plugins/apps --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/apps/custom-data/custom-entities.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-01":{"query":"How do I create a product with variants and configure its visibility per sales channel, and why might it not show up in the storefront?","category":"func","option":"fs-docs","answer":"To create a product in the Shopware 6 admin, go to Catalogues > Products > Create Product and fill in the mandatory fields (Name, Product number, Tax rate, Price gross/net, Stock). After first saving, additional tabs become available: Specifications, Extended Prices, Variants, Layout, SEO, Cross-Selling. To create variants, open the product's Variants tab and use the Variant Generator: under 'Select values' choose the property/properties to use (e.g. colour, size) and activate the desired options as checkboxes for variant generation; you can define price surcharges per option before generating, and use 'Value exclusion' to exclude specific option combinations (e.g. no blue T-shirt in size L) using AND-linked rules similar to the Rule Builder. Clicking 'Generate variants' creates the variant table, where you can set the storefront display order of properties/options, assign per-variant images, and choose the storefront presentation mode (Single main variant with either 'Main product' — no preselected variant in listing — or 'Single Variant' — a variant preselected via dropdown in the listing) or 'Fan out properties in product list' to show separate listing entries per property value. Individual variants can have their inheritance from the main product removed (via the chain icon) to set custom name, description, price, stock, product number, media, or active status; Quick changes and Bulk edit let you change many variants at once (Overwrite/Clear/Add/Remove options per field block).\n\nVisibility per sales channel is configured in the General > 'Visibility & structure' section of the product: 'Sales channel' assigns the product to the desired sales channels so it can be available there; 'Active for all selected sales channels' determines whether the product is actually displayed in the storefront and purchasable; 'Categories' assigns the product to categories so it can be found via the category tree; and 'Configure extended visibility' controls search/listing visibility per sales channel with three options — Visible (default, shown in both listing and search), Hide in listing (still findable via search), and Hide in listing and search (only reachable via the exact product URL).\n\nReasons a product might not show up in the storefront therefore include: it is not assigned to the relevant sales channel; the 'Active for all selected sales channels' toggle is off; extended visibility is set to hide it from listing/search; it is not assigned to any category so it cannot be browsed via the category tree (though it may still be found by direct URL or search depending on extended visibility); or its Release date has not yet been reached (the product detail page shows a message and it cannot yet be purchased, though this is separate from being findable). Digital/variant edge cases: a variant's own Active flag (settable per row in Quick changes) can also be turned off independently of the parent product.","citations":["merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md:177-190","merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md:353-425","merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md:427-448","merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md:235-237"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/index.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/catalogues -maxdepth 2 -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/catalogues/products/v1-4-2-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-02":{"query":"How do Rule Builder conditions work for shipping and payment methods?","category":"func","option":"fs-docs","answer":"The Rule Builder (Settings > Automation > Rule Builder) lets you define reusable rules that determine, among other things, the availability of shipping methods and payment methods, plus the calculation of shipping costs. A rule consists of general information (Name, Description, Priority, Type, Tags) and conditions. Each condition has a Condition (the parameter queried, e.g. 'Applied shipping method' or 'Applied payment method'), an Operator (e.g. Is equal to, Is one of, Is greater than, At least one, All, etc.), and an Input value; multiple conditions can be linked with AND (all must be true) or OR (only one must be true), and switching between AND/OR automatically creates subconditions for nested grouping. To build a rule: go to Rule Builder, click Create Rule, fill in the general information, select at least one condition, choose an operator, specify at least one input value, then Save so it can be assigned.\n\nFor shipping and payment specifically, the 'Shopping cart' condition group includes 'Applied shipping method' (compares a specific shipping method with the one used in the evaluation context, e.g. Express) and 'Applied payment method' (compares a specific payment method with the one used, e.g. Invoice) as multi-selection conditions, alongside cart-level conditions like Shipping costs, Cart total (incl. shipping), and Cart sum of items. Once a rule is created, it is not assigned from the rule itself but is referenced from the target module (e.g. in a shipping method's or payment method's own configuration) to control its Availability of shipping methods / Availability of payment methods / Calculation of shipping costs. The rule's own 'Assignments' tab then shows an overview of everywhere it is used (e.g. which shipping/payment methods, promotions, or flows reference it) as a navigation aid, not as the place to create the assignment. Preview mode (Rise plan and higher) lets you test a rule's conditions in real time against a selected existing order and optionally simulate a specific date/time, showing TRUE/FALSE per condition.","citations":["merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md:33-94","merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md:112-135","merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md:207-209","merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md:249-251"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/rules -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/rules/v1-6-1-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-03":{"query":"How do promotions and discount codes work, including individually generated codes?","category":"func","option":"fs-docs","answer":"Promotions are created in the admin under Marketing > Promotions by clicking 'Create action'. The General tab holds Name, Priority (higher priority is applied first), Valid from/Valid until, Max. total uses, Max. uses per customer, and an Active switch (a deactivated promotion is not applied during its valid period). Advanced configuration (Conditions and Discounts tabs) becomes available once the promotion is saved for the first time.\n\nPromotion codes: by default a promotion can require no code (applies automatically once conditions are met), a Fixed promotion code (one code shared by all customers, either entered manually, e.g. 'EASTER21', or generated randomly), or Individual promotion codes (a unique code per order/customer). Individual codes can only be redeemed once each; the admin's code list shows whether a given code has already been redeemed and by which customer. Only one individual code from a given promotion can be applied at a time. To generate individual codes, click 'generate codes' the first time, configure code length, an optional prefix and suffix (these characters do not count toward the code length), or use a custom pattern where %s inserts a random letter (A-Z) and %d a random number (0-9) — e.g. pattern 'SW-%s%d%s%d%s-TEST'. A preview shows an example code, and you set the total number of promotion codes to generate. If you already have codes, 'add codes' generates more following the same pattern (useful when most codes have been used before the campaign ends). Note: regenerating/adjusting the codes invalidates the previously generated codes.\n\nThe Conditions tab restricts when a promotion applies: general Conditions (which sales channels the promotion applies to, whether it prevents combination with other promotions, and which specific promotions it cannot be combined with) and Rule-based conditions using the Rule Builder — Customer rules (who is eligible), Shopping cart rules (e.g. cart total or item count thresholds; if multiple rules are selected, only one needs to match), Order rules (conditions on the whole order, e.g. required/excluded payment or shipping methods), and 'Promote sets of products' to define complex multi-product set groups (Mode: Number/Value gross/Value net, Value, Sorting, and Product rules) for things like 'buy 3 get 1 free' logic.\n\nThe Discounts tab defines what is discounted: Apply to (entire cart, shipping costs, entire product set, or a specific set group), optional 'Apply to specific range of products only' with its own Product rules/Apply to/Sort by settings, Type (absolute, percentage, fixed price, or fixed unit price — fixed price/unit price cannot exceed the normal price), Value, an optional Maximum discount value for percentage discounts, and per-currency advanced pricing. Multiple discounts can run within a single promotion via 'Add Discount'; discount settings cannot be changed once the promotion has been used in an order.\n\nIn the storefront, customers redeem a code (if required) in the 'Enter voucher code' field in the OffCanvas cart or full shopping cart view; after successful entry the discount appears in the article overview. Already-redeemed codes can be traced: for individual codes, open the promotion in Marketing > Promotions and check the 'Redeemed' list which shows which codes were used and can be cross-referenced via the order overview's promotion-code filter; for a fixed code, the order overview filter can show all orders that used that shared code.","citations":["merchant/content/en/shopware-6/marketing/promotions/v1-7-0-0.md:29-82","merchant/content/en/shopware-6/marketing/promotions/v1-7-0-0.md:84-141","merchant/content/en/shopware-6/marketing/promotions/v1-7-0-0.md:143-166","merchant/content/en/shopware-6/marketing/promotions/v1-7-0-0.md:256-303"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/marketing -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/marketing/promotions/v1-7-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-04":{"query":"What does the Shopware Migration Assistant transfer automatically from Shopware 5, and what has to be mapped by hand before the migration starts?","category":"func","option":"fs-docs","answer":"When migrating from Shopware 5 to Shopware 6, not everything is transferred automatically: some data (payment methods, shipping methods) needs to be mapped, and it is mandatory to create these in Shopware 6 before starting the migration to ensure a smooth transition. Other things (e.g. Shopping Worlds) cannot be migrated at all and must be recreated manually.\n\nAutomatically migrated data (selectable in the migration data selection screen), grouped by category:\n- Basic data (mandatory): Categories, Customer groups, Currencies, Sales channels, Number ranges.\n- Products: Products, Properties, Product options, Product properties, Translations, Cross-selling, Main variant relations.\n- Customers & orders: Customers, Shipping methods, Orders, Order documents.\n- Promotions: Customers, Promotions.\n- SEO URLs: Products, Properties, Product options, Product properties, Translations, Cross-selling, Main variant relations, SEO URLs.\n- Product reviews: Products, Properties, Product options, Product properties, Translations, Cross-selling, Main variant relations, Customers, Reviews.\n- Media.\n\nManual mapping required before migration starts: the migration wizard will prompt you to map Payment methods, a Standard Payment Method, Salutation, Delivery time, and a Standard delivery time to their Shopware 6 equivalents. These target entries must already exist/be created in Shopware 6 before starting the migration; if Shopware 5 extensions were used, additional fields may need mapping too. This mapping is mandatory — skipping it causes problems since the fields still need something to map to — and if you reset the migration you cannot re-map the fields; to map again you must delete and recreate the migration.\n\nAfter running the migration, manual checks/adjustments are still needed for: Sales channels (each Shopware 5 shop/subshop becomes its own sales channel, but Shopware 6 ships with two pre-installed sales channels; if migrated data isn't visible in the frontend, you may be viewing the pre-installed sales channel via the standard domain — adjust domain settings for the new sales channels); Shipping (shipping costs cannot be transferred automatically due to technical changes and Rule Builder integration — must be recreated under Settings > Commerce > Shipping); Payment methods (also cannot be automatically transferred due to Rule Builder-based risk management — check/add under Settings > Commerce > Payment methods); Countries (verify relevant countries are present/active under Settings > Localisation > Countries); Documents (document templates were redesigned — add header/account data under Settings > Commerce > Documents); Email templates (Shopware 6 uses Twig, so old templates can't be reused — recreate under Settings > Content > Email templates); Shopping worlds/Shop pages (bundled into the new Shopping Experiences, cannot be transferred — recreate under Content > Shopping Experiences); and Templates (Shopware 6's redesigned architecture means old themes cannot be reused or migrated — the included default template can be used as a basis for a custom theme). Note that B2B Suite data cannot be transferred from Shopware 5 to Shopware 6 at all.","citations":["merchant/content/en/shopware-6/migration-en/what-is-migrated/v1-1-0-0.md:10-186"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"migration\" docs/shopware-knowledge-bases/merchant/content/en"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/migration-en/what-is-migrated/v1-1-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-05":{"query":"How do I set up a sales channel — storefront versus headless type, domains, languages and currencies — and where do I get its API access key?","category":"func","option":"fs-docs","answer":"In the Shopware Administration, go to Sales Channel in the menu and click the plus symbol to create a new sales channel. In the pop-up you choose whether to create a Sales Channel with HTML storefront or a headless sales channel that only provides an API interface (you can also create a product comparison here to export products to comparison portals/marketplaces).\n\nGeneral settings for a sales channel include: Name (internal identifier), 'Mark Sales Channel as favourite' (shows it in the admin sidebar), Entry point main/footer/service navigation (which category level each navigation area starts from), Navigation levels, Customer group (default group for new/anonymous visitors), Countries (which are available plus a default), Languages (which are available plus a default), and Standard units of measurement.\n\nUnder Payment and shipping you specify which Payment methods are available and the default one (editable under Settings > Payment methods), which Shipping methods are available and the default (Settings > Shipping methods), which Currencies are available and the default (Settings > Currencies), and how Tax calculation should work for orders in this channel.\n\nDomains: a self-hosted instance lets you create several domains for the sales channel via 'Add Domain', each with its own virtual URL, language, currency, snippet set, and unit system — useful for running multiple language shops off one sales channel; it's recommended each domain use only one protocol (https or http) to avoid duplicate content. A cloud instance already has an auto-generated URL; to use your own domain, click 'Add domain', having first added the domain under Settings > System > Domains (or via the 'Set up individual domain' link) — server-side forwarding always redirects to https. When assigning a domain you set its URL, Language (from those available in the sales channel), Currency (from Settings > Localisation > Currencies), Snippet set, and Hreflang localisation (ISO standard vs. browser language) for that domain.\n\nAPI access: under the 'API access' section of the sales channel settings, you can generate an API Access ID for that sales channel; further usage details are referenced in the developer documentation on the sales-channel API.\n\nOther settings include Status (temporarily disable the channel, enable maintenance mode with an IP whitelist — noting that a proxy's IP must be added to TRUSTED_PROXIES in .env or via PHP trusted-proxy settings for whitelisting to work correctly behind a proxy), a Products tab to assign products/categories/dynamic product groups directly to the sales channel, a Theme tab to assign an installed theme, Analytics (Google Analytics 4 tracking configuration), and Agentic files (llms.txt, agents.md, ai-catalog.json for AI discoverability). Note: the preinstalled Headless sales channel should never be deleted, as extensions (e.g. B2B-Suite) rely on it; it can instead be hidden from the sidebar by marking other channels as favourites.","citations":["merchant/content/en/shopware-6/settings/saleschannel/v1-5-2-0.md:39-141","merchant/content/en/shopware-6/settings/saleschannel/v1-5-2-0.md:143-164"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/saleschannel -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/saleschannel/v1-5-2-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-06":{"query":"Which triggers and actions does the Flow Builder offer, and how do I make it send a mail when an order is placed?","category":"func","option":"fs-docs","answer":"The Flow Builder is found under Settings > Automation > Flow Builder. It lets you automate business processes without programming: an event trigger, optionally refined with Rule Builder conditions, executes one or more actions (e.g. sending emails, calling URLs, or changing order status). Creating/editing a flow has a General tab (Name, Description, Priority for when multiple flows share a trigger, and an Active toggle) and a Flow tab where you build the trigger/condition/action logic.\n\nTriggers: every flow starts with a trigger selecting when it runs. Available triggers include customer events (checkout.customer.before.login, .login, .logout, .register, .deleted, .guest_register, double-opt-in variants, recovery.request), order/checkout events (checkout.order.placed — triggers when an order is placed; checkout.order.payment_method.changed — note this automatically sets order status to 'Open' so a flow should not try to set it to Open again), contact_form.send, review_form.send, customer.group.registration.accepted/declined, mail.after.create.message, mail.before.send, mail.sent, newsletter.confirm/register/unsubscribe, product_export.log, user.recovery.request, and a large set of order/order_delivery/order_transaction/order_transaction_capture state_enter.* and state_leave.* triggers (e.g. state_enter.order.state.completed, state_enter.order_transaction.state.paid, etc.).\n\nConditions: built from Rule Builder rules (existing or newly created) to refine whether/which action runs; each condition evaluates True or False, and further conditions/actions can be attached to each branch. Delayed Actions (Beyond plan) let you trigger an action after a set delay (Hour, Day, Week, Month, or custom SS.TT.WW.MM format) — pending delayed actions appear under 'Scheduled Actions' with order number, customer, delay condition, time remaining and scheduled time.\n\nActions available (availability depends on the chosen trigger) include: Assign account status (activate/deactivate a customer), Assign affiliate and campaign code (with an override option), Assign customer group, Generate a document (choose document type), Send mail (choose reply-to address, recipient — administrator, customer, or custom email address(es); note selecting 'Administrator' sends to all admin-flagged users including external/API users — plus an email template and optional attached documents), Assign status (change payment/shipping/order status, subject to state-dependency rules, e.g. Refunded/Partially Refunded/Chargeback require a prior Paid/Partially Paid status), Stop flow (halts the entire flow and skips remaining actions/conditions), Set download access (grant/revoke a digital product's download link after payment), Change custom field content (on customer or order), and Add Tag/Remove Tag. Custom triggers from apps/extensions (since 6.5.3.0) let flows start from or call out to third-party systems via webhooks. With the Shopware Commercial extension (Evolve plan+), a Webhook 'Call URL' action is also available, supporting GET/POST/PUT/PATCH/DELETE methods, URL, parameters, header parameters, body, and Basic Auth. Flows can be shared (download/upload as files, Rise plan+), and a Flow templates library provides ready-made standard and Shopware-defined flows.\n\nTo send a mail when an order is placed: create a new flow (Add Flow), in General give it a name/description and set Active; in the Flow tab select the trigger 'checkout.order.placed'; optionally add a condition using a Rule Builder rule to further restrict when the mail is sent; then add the action 'Send mail', configure the reply-to address, choose the recipient (e.g. Customer or Administrator or a specific address), select the desired email template, and optionally attach documents; save the flow.","citations":["merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:9-31","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:41-165","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:167-249"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-07":{"query":"How do I import products from a CSV with an import/export profile — column mapping, matching identifiers and a dry run?","category":"func","option":"fs-docs","answer":"The Import/Export module is under Settings > Automation > Import/Export. Before importing, the CSV must be UTF-8 encoded with semicolon field separators and quotation marks as the string/enclosure separator (some tools like Excel don't natively produce UTF-8 CSVs, so care is needed with umlauts). Decimal places in prices must use a dot, not a comma, or the price will not import correctly. Note: import can only add/update information, not remove it — e.g. an existing sales channel assignment on a product cannot be removed via import.\n\nIn the Import tab: 'Upload CSV file' selects the native CSV file to import (use a tool that produces native CSVs, e.g. Open Office Calc, since some spreadsheet programs mangle separators/leading zeros); 'Select profile' chooses the import/export profile that determines which CSV columns map to which database tables/fields; 'Start import' validates and imports all error-free records, bundling erroneous records into a downloadable CSV; 'Start dry run' lets you fully test the import before committing, to check the whole file can be imported without errors and avoid partial imports; 'Import activity' shows a 30-day history of past imports (with the ability to re-download the source CSV, reopen the profile used, download error-only CSVs, or abort an in-progress import, noting some data may already be imported by the time of an abort).\n\nProfiles (tab 'Profile') manage the reusable import/export configurations; profiles indicate whether they're a standard (Shopware-provided) or user-created profile, and can be opened, deleted, or duplicated via the context menu, or created new via 'Create new profile'. To create an individual profile you must have the default system language selected in the language selector (this applies even to profiles meant for another language) — otherwise import/export won't work. A new profile lets you configure: Profile name; Usage (import, export, or both — import-only profiles cannot be used for export); Object type (which database tables/columns the profile can access, e.g. Product or Customer); Separator character (default semicolon); Enclosure character; and Import settings, where 'Create new records' allows creating new records (leave the ID column empty in the CSV for this) and 'Update existing data' allows overwriting existing records. You can optionally seed the profile's field list by uploading an existing CSV file, from which the profile then extracts column names for you to map to database fields, or skip this and build the profile from scratch.\n\nColumn mapping ('Mappings' tab): 'Add new mapping' adds a row where you pick a database field to map and enter the corresponding CSV column name (this CSV name must exactly match the column header used in the CSV file for this profile); 'Required' marks whether a field must be filled in the import file for the import to succeed; 'Default Value' supplies a fallback value used when the import file leaves the field blank; 'Position' defines the expected column order/position in the CSV; entries can be removed via the context menu. Mandatory fields for a given object type are automatically added when creating a new profile — for the Product object type these are at least id, taxId, productNumber, stock, and name (the id column should be left empty when creating new products, since the system generates it).\n\nMatching/identifying records ('Advanced settings' > 'Second Unique Identifier'): historically the import always matched rows to entities via a UUID, which meant every CSV row needed a cryptic UUID. With a second unique identifier you can instead choose another field to use for matching — e.g. specifying that productNumber (instead of the UUID) is used to identify which product a row updates. This is configured per entity in the profile's Advanced Settings tab by selecting an available identifier from a dropdown next to each entity. Caution: choosing a non-unique field (e.g. product name when duplicate names exist) means only the first matching record can be reliably identified/imported.\n\nSeparately, the Export tab lets you export existing data to CSV using a chosen profile (which determines what is exported), with a 30-day export activity history and, for Rise-plan stores with the Commercial extension enabled, an AI Copilot-powered Export assistant supporting customer, product, order, category, newsletter, promotion code/discount, properties, cross-selling, and product price exports.","citations":["merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md:12-56","merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md:93-173","merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md:175-202"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/shopware-en/settings/importexport -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/shopware-en/settings/importexport/v1-4-0-0.md (partial, lines 1-235)"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-08":{"query":"How do custom field sets work — entity assignment, field types and technical name — and can a custom field be written through the Store API?","category":"func","option":"fs-docs","answer":"Custom fields (additional fields) are managed under Settings > System > Custom fields and let you add your own fields to program areas such as products or categories to store information not covered by the standard system; these values can also be used in the Rule Builder or displayed in the storefront. Custom fields should be edited in the store's default language so that value inheritance applies to all languages; a value entered while switched to a specific language overrides the default only for that language, and without inheritance, rules relying on the field may not work correctly in languages where no value was entered.\n\nEntity assignment: custom fields are organized into 'Sets' — a set groups several thematically related custom fields and is then assigned to one or more program areas (entities) such as products or categories; you fill in the actual field values within those program areas. To create a set, click 'New set' and provide a unique, permanent technical name (cannot be changed later), a Position (controls display order in the admin — higher values appear further back), an optional Label (can be defined per administration language), and select which program areas the set should be available in — if no area is selected, the set is created but not usable anywhere. Custom field technical names must avoid Twig special characters like '-' or '#', or product exports can break.\n\nField types: within a set you create individual custom fields via 'New custom field'; the configuration options shown depend on the chosen type, but a unique, permanent Technical name is always mandatory. The available types are: Select (single- or multi-select from defined options, each option itself needing its own technical name and label), Object selection (direct reference to another data entity — dynamic product group, experience world, manufacturer, category, customer, country, delivery method, product, sales channel, or payment method; the Object type cannot be changed after creation; supports single or multiple selection), Text field, Media (attach a media file, requires a storefront template adjustment to display), Number (integer or float, with Steps, Min and Maximum), Date/Time, Checkbox, Active/Inactive switch (boolean 0/1), Text Editor (rich/styled text), and Color picker (palette or HEX code). Common options across most types include Position, Label, Placeholder, Help text, 'Available in shopping carts' (needed to use the field in the Rule Builder or custom templates), and 'Modifiable via Store API'.\n\nStore API writability: yes — a custom field can be exposed to the Store API by enabling the 'Modifiable via Store API' option when creating/editing it. This sets the field to 'public', meaning the Store API can both read and modify the stored value (e.g. to add custom data via new storefront fields such as an extended registration form). Because this makes the field publicly accessible, critical or sensitive information (e.g. certain customer data) should not have this option enabled.\n\nCustom field values can also be dynamically shown in a Shopping Experience by linking a Text or Text & images block's content to a custom field via 'Data Mapping' in the block's editing modal (selecting the desired custom field, with an option to remove the mapping later), and displaying a custom field's content directly in the storefront requires a template adjustment.","citations":["merchant/content/en/shopware-6/settings/custom-fields/v1-3-2-0.md:10-35","merchant/content/en/shopware-6/settings/custom-fields/v1-3-2-0.md:36-68","merchant/content/en/shopware-6/settings/custom-fields/v1-3-2-0.md:95-241"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/custom-fields -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/custom-fields/v1-3-2-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-09":{"query":"Why doesn't my payment method appear in the checkout — what has to be configured in the administration?","category":"func","option":"fs-docs","answer":"Payment methods are managed under Settings > Commerce > Payment methods. In the overview, each method is listed with its name, active status, and a short description; by default Shopware ships with four active payment methods: cash on delivery, invoice, prepayment, and direct debit.\n\nHowever, a payment method being 'Active' in this list does not automatically make it available to customers in the storefront checkout. There are three things that must be configured for a payment method to actually appear in checkout:\n\n1. Active flag: the payment method itself must be switched on via the Active button in its configuration.\n2. Sales channel assignment: the decisive factor for whether an active payment method shows up in the storefront is whether it is assigned to the relevant sales channel — this is configured in the sales channel's 'Payment and shipping' settings, where you specify which payment methods are available for that channel and pick a default one. A payment method that is active but not assigned to the sales channel being used will not appear.\n3. Availability rule: each payment method can have an availability rule built with the Rule Builder that determines under what conditions it should be offered (e.g. restricted by cart value, customer group, shipping country, etc. depending on the rule's conditions). If an availability rule is set and its conditions are not met by the current cart/customer/order context, the payment method will not be shown. For a payment method that should always be available without restriction, the availability rule field should be left blank (NULL) — an unintentionally configured or overly restrictive rule is a common reason a payment method silently fails to appear.\n\nOther configuration fields when adding/editing a payment method include Name, Technical name (changing this can break an existing payment method's operation, so it's recommended to set the technical name early and avoid changing it later, especially for extension-provided methods), Position (display order in the shop), Description, Logo, and the switch 'Allow change of payment method after order completion' (controls whether customers can switch to this payment method after the order is completed, via their account's Orders section).","citations":["merchant/content/en/shopware-6/settings/Paymentmethods/v1-4-0-0.md:10-57"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Paymentmethods -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Paymentmethods/v1-4-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-10":{"query":"How do dynamic product groups work in the administration and where can the resulting group be used?","category":"func","option":"fs-docs","answer":"Dynamic product groups are found in the admin under Catalogues > Dynamic product groups. They are groups of products formed by dynamic rules rather than manual selection, so they automatically update as products start/stop matching the defined conditions; they can be played out at different places in the shop. The overview lists each group's name, description, date of last change, and status (a group can become invalid if it relies on rules from a deactivated plugin, in which case it cannot be used); groups can be edited, duplicated, or deleted via the context menu, and new ones created via 'Create product group'.\n\nCreating a group: under General information you set a required unique Name, an optional Description, and 'Keep matching variants grouped' — when enabled, matching product variants stay grouped under their shared main product in categories, cross-selling, and CMS product sliders; when disabled, matching variants are shown individually. 'Save and duplicate' lets you save and immediately clone the group.\n\nConditions: in the Conditions area you build rules (based on Rule Builder-style logic) selecting a property (e.g. product, category, manufacturer, tag, property, price, stock, delivery time, or a custom field) and a condition/operator, then link additional conditions with AND or OR, or nest them with sub-conditions (an item must meet the main condition and the sub-condition, and sub-conditions can themselves contain further nested sub-conditions to any depth). A Preview button shows which products currently match the defined conditions.\n\nOperators depend on the property type; for multi-value properties (products, categories, manufacturers, tags, properties) the available operators are: Is equal to (matches the single selected value), Is not equal to (does not match it), Is equal to any of (matches at least one of several selected values), Is not equal to any of (matches none of the selected values), Is equal to all of (must match every selected value, though additional assignments are still allowed), and Is not equal to all of (included as soon as at least one selected value does not apply). Example conditions shown include: specific products; products in selected categories (a category path helps disambiguate); products with a certain property or property value; products with a specific tag AND being a sale item; price above a threshold; stock above a threshold; combined multi-condition rules (e.g. tagged as promotional AND (sale item OR from a given manufacturer), noting that combining conditions purely with AND across multiple values should instead use 'Is equal to all of'/'Is not equal to all of'); custom fields (e.g. a checkbox-type custom field); and a product's configured delivery time (if a delivery time option used in a group's condition is later removed from the system, that condition stops working correctly).\n\nWhere dynamic product groups can be used: Categories — to dynamically fill a category's product listing (useful for sale or manufacturer-specific categories); Product comparison — dynamic product groups are used to populate the feed sent to comparison portals/marketplaces; and Shopping Experiences — a Product slider element (found in the Commerce block category) can be filled using a dynamic product group.","citations":["merchant/content/en/shopware-6/shopware-6-de/Catalogues/Dynamicproductgroups/v1-3-0-0.md:9-42","merchant/content/en/shopware-6/shopware-6-de/Catalogues/Dynamicproductgroups/v1-3-0-0.md:44-135","merchant/content/en/shopware-6/shopware-6-de/Catalogues/Dynamicproductgroups/v1-3-0-0.md:137-149"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"dynamic product group\" docs/shopware-knowledge-bases/merchant/content/en"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en -iname \"*dynamicproduct*\" -not -path '*/.git/*'"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/shopware-6-de/Catalogues/Dynamicproductgroups -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/shopware-6-de/Catalogues/Dynamicproductgroups/v1-3-0-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-11":{"query":"How do I create an integration for Admin API access in the administration and give it the right privileges?","category":"func","option":"fs-docs","answer":"Go to Settings > System > Integrations and click 'Create integration'. Assign a name, then decide whether it should have administrator permissions, or instead select a specific role from the dropdown (roles are defined under Settings > System > Users & Permissions > Roles). Once created, Shopware issues an access ID and a security key for the integration; the security key is shown only once, so save it immediately. Existing integrations can later be edited/deleted via the overview, and the access key can be regenerated (which invalidates the old key/ID pair) via 'Regenerate API access key'. To control what the integration can do, create/edit a Role under Settings > System > Users & Permissions > Roles: for each admin area you can grant View, Edit, Create and/or Delete (permissions build left-to-right: Edit implies View, Create implies Edit+View; Delete only implies View), or check 'All' for full area access. There are also 'Additional permissions' (e.g. Basic configurations, Run Updates, Maintain/Upload extensions, Logging, Clear cache, Import/Export, Shopware Store, Apps) that are all-or-nothing. If a permission is still missing for a specific technical entity (e.g. added by an extension), it can be granted under 'Detailed permissions' with read/write/create/delete on the specific technical name. Assign that role to the integration instead of the admin flag to scope its Admin API access precisely.","citations":["merchant/content/en/shopware-6/settings/system/integrationen/v1-1-0.md:1-36","merchant/content/en/shopware-6/settings/system/user/v1-3-0.md:53-146"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/index.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"grep -ril 'integration' docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings; find docs/shopware-knowledge-bases/merchant/content/en/shopware-6 -iname '*integration*' -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/system/integrationen/v1-1-0.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/system/user/v1-3-0.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-12":{"query":"A spec asks for customer-specific pricing and for a flow that calls an external URL when an order is placed — before I build either of them, does Shopware already ship them, and what has to be licensed or installed for them to exist in the shop?","category":"func","category_note":"func","option":"fs-docs","answer":"Both requirements already exist as built-in/licensable Shopware functionality, so neither needs custom development. 1) Customer-specific pricing: Shopware's B2B Components ship an 'Individual Pricing' feature (from Shopware 6.7.8.0) found in the admin under Catalogues > Individual pricing. You can configure percentage-based, fixed, or tiered (volume) discounts driven by Rule Builder-style conditions and assign them to specific companies/organisation units or customer tags, so negotiated prices show automatically in the storefront. Prerequisite: organisation units must be activated in employee management for the customer. B2B Components as a whole require the Shopware Evolve plan via the Shopware Commercial extension. 2) A flow that calls an external URL on order placement: the Flow Builder (Settings > Automation > Flow Builder) already has a 'checkout.order.placed' trigger, and the 'Call URL (Webhook)' action lets you fire a GET/POST/PUT/PATCH/DELETE request to a URL with parameters, headers, body and Basic Auth when the flow runs. However, this specific action ('Webhook Actions in Flow Builder') is an extension of the Flow Builder available only from the Evolve plan and requires installing/activating the Shopware Commercial extension. So both features exist out of the box in terms of concept, but require the Shopware Commercial extension on an Evolve-tier plan/license to actually use Individual Pricing and the webhook Call URL action.","citations":["merchant/content/en/shopware-6/commercial-features/b2b-components/v1-2-5-0.md:9-13","merchant/content/en/shopware-6/commercial-features/b2b-components/v1-2-5-0.md:538-577","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:62-62","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:251-297"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/commercial-features -not -path '*/.git/*'; find docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/commercial-features/b2b-components/v1-2-5-0.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-01":{"query":"How do I configure Shopware 6's built-in GraphQL API for the Store API?","category":"edge","option":"fs-docs","answer":"The premise is incorrect: Shopware 6 does not have a built-in GraphQL API for the Store API. Per the developer docs, the Store API is a JSON-over-HTTP (REST-style) interface: it 'enables headless frontends (such as SPAs or native apps) to consume Shopware functionality via JSON over HTTP', exposing core business logic through HTTP routes so that the Storefront and API consumers rely on the same underlying services. There is no mention of GraphQL anywhere in the developer documentation corpus (a targeted search for 'graphql' under docs/shopware-knowledge-bases/developer returned no hits). Configuring a GraphQL endpoint for the Store API is therefore not something Shopware ships or documents; there is nothing to configure.","citations":["developer/concepts/api/store-api.md:8-17"],"toolCallLog":[{"tool":"Bash","args":"grep -ril 'graphql' docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"grep -ril 'store api' docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname '*store-api*' -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/concepts/api/store-api.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"edge-02":{"query":"How do I get the DI container with `Shopware()->Container()` and override the product listing Smarty template in Shopware 6?","category":"edge","option":"fs-docs","answer":"Both parts of the question describe Shopware 5 mechanics that do not exist in Shopware 6; there is no `Shopware()->Container()` global function and no Smarty templating engine in Shopware 6. In Shopware 6, dependency injection is done via Symfony's service container: services are declared/autowired (e.g. via `services.xml`/`services.php` with `autowire`/`autoconfigure`) and injected as constructor parameters into your own service classes rather than fetched through a global container-accessor function — for example `ExampleService` receives `SystemConfigService` as a constructor argument. Templates in Shopware 6's Storefront are Twig files (`*.html.twig`), not Smarty. To override a template such as the product listing, you register your plugin's own view path (`<plugin root>/src/Resources/views`), locate the original Twig file under `<shopware root>/src/Storefront/Resources/views/...`, and recreate the same relative directory/file path inside your plugin's `views` directory to override it (as shown with `storefront/layout/header/logo.html.twig`).","citations":["developer/guides/plugins/plugins/services/dependency-injection.md:8-53","developer/guides/plugins/plugins/storefront/templates/customize-templates.md:8-50"],"toolCallLog":[{"tool":"Bash","args":"grep -ril 'smarty' docs/shopware-knowledge-bases/developer; grep -ril 'Shopware()->Container' docs/shopware-knowledge-bases/developer; find docs/shopware-knowledge-bases/developer -iname '*dependency-injection*' -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/services/dependency-injection.md, limit=60"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname '*twig*' -not -path '*/.git/*'"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -path '*storefront/templates*' -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/templates/customize-templates.md, limit=50"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"edge-03":{"query":"Where do the `#[ORM\\Entity]` mapping attributes for my plugin's entity go in Shopware 6, and how do I get Doctrine's `EntityManager` injected into my service so I can persist it?","category":"edge","option":"fs-docs","answer":"This premise does not apply to Shopware 6: plugins do not use Doctrine ORM entity mapping attributes (`#[ORM\\Entity]`) or a Doctrine `EntityManager` to persist custom data. Instead, Shopware 6 ships its own Data Abstraction Layer (DAL), which 'fully supports custom entities, so you don't have to take care of the data handling at all.' To persist custom plugin data you: 1) create the database table yourself via a plugin migration (a `MigrationStep` class using `Doctrine\\DBAL\\Connection::executeStatement()` to run raw SQL, e.g. a `CREATE TABLE` statement), and 2) introduce that table to Shopware by writing an `EntityDefinition` class (e.g. `<plugin root>/src/Core/Content/Example/ExampleDefinition.php`) that defines the entity's fields and name (which must match the table name), registered as a service via dependency injection. So Doctrine's DBAL `Connection` is used only for the migration/table creation step, not a Doctrine ORM `EntityManager`, and there is no `#[ORM\\Entity]` attribute involved anywhere in this flow.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md:8-79"],"toolCallLog":[{"tool":"Bash","args":"grep -ril 'EntityManager' docs/shopware-knowledge-bases/developer; find docs/shopware-knowledge-bases/developer -iname '*entity-definition*' -not -path '*/.git/*'"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname '*data-abstraction*' -not -path '*/.git/*'; find docs/shopware-knowledge-bases/developer -ipath '*custom*entity*' -not -path '*/.git/*'"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -ipath '*add-custom-complex-data*' -o -ipath '*data-model*' -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md, limit=80"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"edge-04":{"query":"How do I fetch products with `GET /sales-channel-api/v3/product` on Shopware 6.7?","category":"edge","option":"fs-docs","answer":"The developer documentation corpus does not describe a `sales-channel-api` route for fetching products; a scoped search for 'sales-channel-api' under docs/shopware-knowledge-bases/developer only turns up two old (2020) architecture decision records discussing the historical sales-channel-api/store-api split, and no current reference page for it. The current, documented API surface for Shopware 6 consists of two APIs: the Store API, described as 'the customer-facing surface of Shopware... for storefront/frontend-related interactions such as product browsing, cart handling, checkout,' which 'enables headless frontends... to consume Shopware functionality via JSON over HTTP,' and the Admin API, 'the administrative and integration surface of Shopware' providing 'CRUD operations for every entity within Shopware' for backend integrations. Both pages point to the Shopware Stoplight reference docs for concrete endpoints/schemas rather than documenting exact paths in this corpus. Based on what is present, fetching products as a storefront/headless client would be done via the Store API's product routes (e.g. product listing/search endpoints), not a `sales-channel-api/v3/product` path, since no such path or version is documented here.","citations":["developer/concepts/api/store-api.md:8-17","developer/concepts/api/admin-api.md:8-18","developer/resources/references/adr/2020-07-02-implement-sales-channel-context-token-requirement.md:1-34"],"toolCallLog":[{"tool":"Bash","args":"grep -ril 'sales-channel-api' docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/resources/references/adr/2020-07-02-implement-sales-channel-context-token-requirement.md"},{"tool":"Bash","args":"grep -rli 'sales-channel-api' docs/shopware-knowledge-bases/developer/resources; find docs/shopware-knowledge-bases/developer -iname '*upgrade*' -not -path '*/.git/*'; find docs/shopware-knowledge-bases/developer -iname '*api-reference*' -o -iname '*api.md' -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/concepts/api/admin-api.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"edge-05":{"query":"How do I enable Shopware's built-in MCP server on a Shopware 6.6 shop?","category":"edge","option":"fs-docs","answer":"This is not possible: the built-in MCP server does not exist on Shopware 6.6. Per the developer docs, the Shopware MCP Server was 'Introduced in Shopware 6.7.11.0', with progressive tool discovery and removal of the `MCP_SERVER` feature flag arriving in 6.7.14.0; it is currently an experimental feature available through the `/api/_mcp` and `/store-api/_mcp` endpoints. The Getting Started guide's prerequisites explicitly require 'Shopware 6.7.14.0 or later' (or 6.7.11.0-6.7.13.x with the `MCP_SERVER=1` env flag set) plus the `symfony/mcp-bundle` package installed via Composer. On a genuinely 6.7-eligible shop, enabling it involves: creating a Shopware integration for the MCP client (`bin/console integration:create \"My MCP Client\" --admin`, or preferably a scoped ACL role instead of `--admin` for production), then configuring the AI client (e.g. Claude Desktop or Cursor) with a streamable-http MCP server entry pointing at `https://your-shop.example.com/api/_mcp` using the generated `sw-access-key`/`sw-secret-access-key` headers. None of this is available on Shopware 6.6.x per this documentation.","citations":["developer/products/tools/mcp-server/index.md:155-166","developer/products/tools/mcp-server/getting-started.md:8-34"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/products/tools/mcp-server -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/tools/mcp-server/getting-started.md, limit=60"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/tools/mcp-server/index.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"no"},"edge-06":{"query":"I'm coming from Magento — what are the Shopware equivalents of store views, extensions, attribute sets and `di.xml`?","category":"edge","option":"fs-docs","answer":"Not found: the developer documentation corpus contains no Magento comparison or migration guide. A scoped search for 'magento' under docs/shopware-knowledge-bases/developer returned zero matches, so there is no documented mapping of Magento concepts (store views, extensions, attribute sets, di.xml) to Shopware terminology in this corpus. Answering this would require piecing together Shopware's own concepts (e.g. Sales Channels, Plugins/Apps, custom fields/properties, and the Symfony service container/services.xml) from general knowledge rather than a documented equivalence table, which is out of scope for a citation-backed answer here.","citations":[],"toolCallLog":[{"tool":"Bash","args":"grep -ril 'magento' docs/shopware-knowledge-bases/developer"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"corpus-missing"},"edge-07":{"query":"How do I set up Shopware PWA as the storefront for a Shopware 6.7 shop?","category":"edge","option":"fs-docs","answer":"The developer documentation corpus does not describe 'Shopware PWA' as a current storefront option; a scoped search for 'pwa'/'shopware-pwa' under docs/shopware-knowledge-bases/developer found no dedicated setup guide (the only hits were incidental, e.g. package-lock.json). Instead, the documented headless frontend built on the Store API is called Composable Frontends: 'Shopware provides Composable Frontends as a headless frontend implementation based on the Store API.' Composable Frontends have their own setup path, e.g. on Shopware PaaS Native they are deployed like any Shopware application but require an `application.yaml` at the repo root with `kind: cfe` and a Node.js runtime version specified (a minimal example sets `app.node.version: \"24\"`), following the same project/deployment lifecycle as other PaaS applications. If the intent was the community 'shopware-pwa' project, that is not documented anywhere in this corpus, so no setup steps can be cited for it.","citations":["developer/concepts/api/store-api.md:17-17","developer/products/paas/shopware/composable-frontends/index.md:7-39"],"toolCallLog":[{"tool":"Bash","args":"grep -ril 'shopware pwa\\|shopware-pwa' docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"grep -rli 'pwa' docs/shopware-knowledge-bases/developer; find docs/shopware-knowledge-bases/developer -ipath '*frontend*' -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/paas/shopware/composable-frontends/index.md, limit=40"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"edge-08":{"query":"Which service do I type-hint to read products — `EntityRepositoryInterface` — and how do I inject it into my plugin service?","category":"edge","option":"fs-docs","answer":"The premise is slightly off: the class to type-hint is `EntityRepository`, not `EntityRepositoryInterface` (no such interface is used in this docs corpus; a search for 'EntityRepositoryInterface' under docs/shopware-knowledge-bases/developer returned no hits). Shopware 6 uses no ORM but a thin Data Abstraction Layer (DAL); each entity gets an automatically generated repository service named `<entity_name>.repository` (for products this is `product.repository`). To inject it into a plugin service: 1) register your service in `services.php`/`services.xml` and pass the repository as a constructor argument, e.g. `$services->set(ReadingData::class)->args([service('product.repository')]);`, and 2) in the service class, import and type-hint the constructor parameter as `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository`, e.g. `public function __construct(EntityRepository $productRepository)`. To read a different entity, swap the service id (e.g. `order.repository` for orders) and keep the same `EntityRepository` type-hint.","citations":["developer/guides/plugins/plugins/framework/data-handling/reading-data.md:8-66"],"toolCallLog":[{"tool":"Bash","args":"grep -ril 'EntityRepositoryInterface' docs/shopware-knowledge-bases/developer; grep -rl 'EntityRepository ' docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/reading-data.md, limit=70"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"edge-09":{"query":"Where do I configure Business Events so that a mail is sent when an order is placed in Shopware 6.7?","category":"edge","option":"fs-docs","answer":"In Shopware 6.7 you no longer configure this under the old 'Business Events' section — that feature was replaced by the Flow Builder starting with major release 6.4.8.0 (Business Events are only still used by the B2B-Suite). To send a mail when an order is placed, go to Settings > Automation > Flow Builder, create a new flow, and in the Flow tab select the trigger 'checkout.order.placed' (Triggers when an order is placed). Then add the action 'Send mail', choosing a reply-to address, a recipient (administrator, customer, or defined email addresses), and the email template to send, optionally attaching documents. You can further restrict when the flow runs by adding conditions from the Rule Builder.","citations":["merchant/content/en/shopware-6/settings/Business-Events/v1-0-0.md:10-13","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:1-62","merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md:198-206"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/ ; ls docs/shopware-knowledge-bases/developer ; ls docs/shopware-knowledge-bases/merchant"},{"tool":"Bash","args":"grep -ril \"business event\" docs/shopware-knowledge-bases/merchant; grep -ril \"business event\" docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"merchant/content/en/shopware-6/settings/Business-Events/v1-0-0.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/merchant/content/en -iname \"*Flow-Builder*\" -not -path '*/.git/*'"},{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/merchant/content/en/shopware-6/settings/Flow-Builder"},{"tool":"Read","args":"merchant/content/en/shopware-6/settings/Flow-Builder/v1-3-0-1.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-01":{"query":"How do I add my own Admin API endpoint under `/api/...` from a plugin — a controller with the api route scope and its ACL?","category":"gap","option":"fs-docs","answer":"I could not find a dedicated developer-docs guide for creating a custom Admin API (`/api/...`) controller from a plugin in this corpus. The corpus does have the closely related building blocks documented separately: (1) route scopes and the `_acl` / `_routeScope` request defaults are documented at an architectural level — Symfony `#[Route]` attribute `defaults` carry `_loginRequired`, `_acl`, `_contextTokenRequired`, and `_routeScope` (replacing the old `@LoginRequired`/`@Acl`/`@RouteScope` annotations) — but no admin-api-specific route scope constant or example controller is shown; (2) the Store API route guide shows the parallel pattern for a different scope (`#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]])]` on the route class, plus a `routes.php` import) but this is for `/store-api/...`, not `/api/...`, and no `ApiRouteScope`-style constant for the Admin API appears anywhere in the developer corpus; (3) the Admin permissions guide documents Administration ACL privileges (`addPrivilegeMappingEntry`, `enrichPrivileges`) but this protects the Vue Administration UI/menu/routes, not a backend PHP `/api` controller, and it explicitly notes 'ACL Rules in the Administration can be circumnavigated by making direct API calls to your backend' — i.e. it is not the same mechanism as the `_acl` route default. No page assembles these into a complete 'create a custom Admin API endpoint + ACL' walkthrough, so I'm reporting this as not found in the corpus rather than guessing the missing scope class name or wiring.","citations":["developer/resources/references/adr/2022-02-09-controller-configuration-route-defaults.md:15-61","developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md:57-98","developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:10-25"],"toolCallLog":[{"tool":"Bash","args":"grep -ril \"RouteScope\" docs/shopware-knowledge-bases/developer/guides"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides -iname '*admin-api*' -o -iname '*administration-api*'; grep -rl \"api_scope|'api'\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework"},{"tool":"Bash","args":"grep -ril \"add.*acl|ACL privilege|acl-privileges\" docs/shopware-knowledge-bases/developer/guides/plugins"},{"tool":"Bash","args":"grep -rl \"#\\[Route(\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins | xargs grep -l api"},{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/; find docs/shopware-knowledge-bases/developer -iname '*add-admin*' -o -iname '*api-controller*'"},{"tool":"Bash","args":"grep -rl \"RouteScope\" docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"developer/resources/references/adr/2022-02-09-controller-configuration-route-defaults.md"},{"tool":"Read","args":"developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"},{"tool":"Read","args":"developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md"},{"tool":"Bash","args":"grep -rln \"ApiRouteScope\" docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"grep -n \"ApiRouteScope\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/store-api/index.md docs/shopware-knowledge-bases/developer/resources/guidelines/code/store-api.md"},{"tool":"Bash","args":"grep -rn \"admin-api|Admin API\" docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/index.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"gap-02":{"query":"Shopware 6.7 removed the RSA JWT key files and `system:generate-jwt-secret` — what signs Admin API tokens now, and what do I have to do when upgrading?","category":"gap","option":"fs-docs","answer":"I could not find any page in the developer corpus documenting this specific 6.7 change. The only JWT-related content found is the shopware-cli helper command `shopware-cli project generate-jwt`, whose description says JWT secret generation is 'required only for Shopware versions before 6.5; in 6.5+, JWT secrets are generated automatically' — this describes the pre-6.7 (6.5/6.6) automatic-generation behavior, not a 6.7 removal of RSA key files or of a `system:generate-jwt-secret` console command, and it does not name what mechanism signs Admin API tokens in 6.7 or list upgrade steps. No file matching 'breaking', '6.7', or '6-7' exists under the developer docs tree, and the upgrade guide (`developer/guides/upgrades-migrations/upgrade-shopware.md`) and the core commands reference contain no mention of 'jwt' at all. I'm reporting this as not found rather than guessing the new signing mechanism.","citations":["developer/products/tools/cli/project-commands/helper-commands.md:236-250"],"toolCallLog":[{"tool":"Bash","args":"grep -rli jwt docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"grep -rn jwt docs/shopware-knowledge-bases/developer/products/tools/cli/project-commands/helper-commands.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname '*upgrade*' -o -iname '*changelog*'"},{"tool":"Bash","args":"grep -n 'jwt\\|JWT\\|6.7' docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/upgrade-shopware.md"},{"tool":"Bash","args":"grep -rln 'generate-jwt-secret\\|jwt secret\\|JWT secret' docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"developer/products/tools/cli/project-commands/helper-commands.md (offset 225, limit 30)"},{"tool":"Bash","args":"grep -rn 'generate-jwt-secret\\|jwt' docs/shopware-knowledge-bases/developer/resources/references/core-reference/commands-reference.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname '*breaking*' -o -iname '*6.7*' -o -iname '*6-7*'"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"gap-03":{"query":"My ERP integration stopped logging in after the 6.7 upgrade — what changed in the Admin API OAuth flow (`/api/oauth/authorize`, the `scope` format)?","category":"gap","option":"fs-docs","answer":"I could not find any documentation of a 6.7 change to the Admin API OAuth flow, the `/api/oauth/authorize` endpoint, or the `scope` parameter format in the developer corpus. The two pages that document Admin API OAuth (`developer/guides/development/integrations-api/index.md` and `developer/guides/development/integrations-api/auth-api-requests.md`) only describe the current `client_credentials` and password-grant requests against `/api/oauth/token` (with a `scopes` field given as the string `\"write\"` in the password-grant example) and do not mention `/api/oauth/authorize`, any 6.7-specific change, or a prior/legacy scope format. No file matching 'breaking', '6.7', or '6-7' exists anywhere under the developer docs tree, and the upgrade guide contains no OAuth-related content. I'm reporting this as not found rather than speculating about what changed.","citations":["developer/guides/development/integrations-api/index.md:76-107","developer/guides/development/integrations-api/auth-api-requests.md:11-40"],"toolCallLog":[{"tool":"Bash","args":"grep -rli oauth docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"developer/guides/development/integrations-api/auth-api-requests.md"},{"tool":"Read","args":"developer/guides/development/integrations-api/index.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname '*breaking*' -o -iname '*6.7*' -o -iname '*6-7*'"},{"tool":"Read","args":"developer/concepts/api/index.md"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"gap-04":{"query":"After upgrading to 6.7 my plugin fatals on load because core class properties now have native PHP types — which properties must I retype in my subclasses?","category":"gap","option":"fs-docs","answer":"I could not find a 6.7-specific list of which core class properties gained native PHP types (and therefore need retyping in plugin subclasses) anywhere in the developer corpus. What the corpus does document is the general mechanism Shopware uses to announce this kind of change: `developer/resources/guidelines/code/backward-compatibility.md` describes `#[PropertyTypeNarrowing]` and `#[PropertyTypeWidening]` attributes (from the `Shopware\\Core\\Framework\\Deprecation\\BCChange` namespace) that mark a property's type as about to narrow or widen in a stated future version, and explicitly instructs: 'Stop redeclaring the property. PHP property types are invariant, so no redeclaration can use both the current and announced type. Move the extension state to a differently named property or a separate object.' Separately, `developer/resources/guidelines/code/core/6.5-new-php-language-features.md` explains the general PHP 8.1 push toward native types ('Everything else should be natively typed') as of Shopware 6.5, but this is about coding-guideline intent for new/changed code in 6.5, not a 6.7 changelog of specific retyped properties. No file matching '6.7', '6-7', or 'breaking' exists in the developer docs tree to check for a concrete list. I'm reporting the specific 'which properties' list as not found, while the general remediation approach (stop redeclaring the property; use a differently named property/object) is documented.","citations":["developer/resources/guidelines/code/backward-compatibility.md:376-406","developer/resources/guidelines/code/core/6.5-new-php-language-features.md:202-221"],"toolCallLog":[{"tool":"Bash","args":"grep -rli 'native.*type|typed propert|property type' docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"grep -n type docs/shopware-knowledge-bases/developer/resources/guidelines/code/backward-compatibility.md"},{"tool":"Read","args":"developer/resources/guidelines/code/core/6.5-new-php-language-features.md"},{"tool":"Read","args":"developer/resources/guidelines/code/backward-compatibility.md (offset 375, limit 40)"}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"gap-05":{"query":"My plugin decorates `CachedProductRoute` to add cache tags — where did the `Cached*Route` classes go in Shopware 6.7 and how do I cache a Store API route now?","category":"gap","option":"fs-docs","answer":"According to the two ADRs describing the reworked HTTP cache layer, the old per-route `Cached*Route` decorator pattern is being replaced by a configuration- and header-driven caching mechanism rather than route-class decoration. The 'Improved HTTP Cache Layer' ADR (2025-11-03) states the caching policies used are 'moved from the code directly to the configuration', with default caching policies defined per area (storefront or store-api) and per use-case (cached/uncached), plus optional route-level overrides — and that HTTP-cache support is extended to the store-api using the same patterns as storefront, adjusting store-api routes to support GET where possible. The companion 'Caching Strategy for Store API' ADR (2025-09-15) spells out the mechanics: cacheable Store API routes are marked with the `'_httpCache' => true` route default attribute (the same attribute used by the Storefront's `CacheResponseSubscriber`), the subscriber is extended to add a `Cache-Control` header to Store API responses (default `public, max-age=0, s-maxage=1800, stale-while-revalidate=86400, stale-if-error=7200` for cacheable routes, `no-cache, private` otherwise), context differentiation is done via the `sw-currency-id`, `sw-language-id`, and `sw-context-hash` headers (with a matching `Vary` header) instead of cookies, and invalidation reuses the existing cache-tags implementation. It explicitly notes under 'Extensions': 'Custom Store API endpoints can opt into caching using the same route flags' — i.e. you mark your route cacheable and use cache tags for invalidation rather than decorating a `Cached*Route` class. Both ADRs also flag this is a breaking change: Store API routes will be cached by default going forward, and the whole rework can currently be opted into via the `CACHE_REWORK` feature flag.","citations":["developer/resources/references/adr/2025-11-03-improved-http-cache-layer.md:23-59","developer/resources/references/adr/2025-11-03-improved-http-cache-layer.md:74-81","developer/resources/references/adr/2025-09-15-store-api-cache-strategy.md:65-91"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"CachedProductRoute|Cached.*Route\" docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"developer/resources/references/adr/2025-11-03-improved-http-cache-layer.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/resources/references/adr -iname '*2025-09-15*'"},{"tool":"Read","args":"developer/resources/references/adr/2025-09-15-store-api-cache-strategy.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-06":{"query":"How do I create a shipping method from my plugin's installer or migration, including the `technicalName` that 6.7 requires?","category":"gap","option":"fs-docs","answer":"The corpus documents the `technicalName` requirement itself in an ADR, and shows the full installer pattern for the sibling entity (payment methods) that shipping methods follow. The ADR 'Introduction of Unique Identifiers for Checkout Methods' (2023-10-17) explains that a new `technicalName` property was added to both the `payment_method` and `shipping_method` entities as a stable identifier; it stayed optional in the database/API but mandatory in the Administration, and 'Starting from version 6.7.0.0, this technicalName field will also become required within the database and the API.' Default Shopware shipping methods were auto-migrated to technical names like `shipping_standard` and `shipping_express`, and app-provided shipping methods get names like `shipping_MyApp_my_shipping_method`; the ADR states plainly: 'Plugin developers will be required to supply a technicalName for their payment and shipping methods, at least beginning with version 6.7.0.0.' The developer guide 'Add Payment Plugin' shows the concrete installer pattern to follow (the same repository-based approach applies to `shipping_method.repository` for a shipping method): in your plugin's base class, override `install()` to call a private method that checks for an existing method (via a Criteria filter/searchIds)
