Shopware.Component.overrideComponentSetup`) intended for components written with the Composition API, but the Options API `Component.override`/`Component.extend` system remains fully supported and is what should still be used for Options API components.","citations":["developer/guides/plugins/plugins/administration/module-component-management/customizing-components.md:1-492"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/module-component-management/customizing-components.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-35":{"query":"How do I load entities from the Admin API inside an Administration component using the repository factory and a Criteria?","category":"dev","option":"fs-docs","answer":"Inject the `repositoryFactory` service into your component via `inject: ['repositoryFactory']` (it comes from the BottleJS DI container, wired into Vue's provide/inject). Create a repository for an entity with `this.repositoryFactory.create('product')` (optionally passing a source route and an options object like `{ version: 1 }` as extra parameters). To fetch a list, build a `Criteria` object - `const { Criteria } = Shopware.Data; const criteria = new Criteria();` - and configure it with `setPage()`, `setLimit()`, `setTerm()`, `setIds()`, `setTotalCountMode()`, `addFilter(Criteria.equals('product.active', true))`, `addSorting(Criteria.sort('product.name', 'DESC'))`, `addAggregation(...)`, and `getAssociation('categories').addSorting(...)`, then call `this.productRepository.search(criteria, Shopware.Context.api).then(result => ...)`. To load a single known entity by id, call `this.productRepository.get(entityId, Shopware.Context.api)` (or pass a Criteria as a third argument to also eager-load associations via `criteria.addAssociation('manufacturer')` etc.). The repository also exposes `save()` (only changed properties are sent; updates are not automatic), `delete()`/`syncDeleted()` for removal, `create()` to instantiate a new entity, and `assign()` for many-to-many relations. Associations retrieved from an entity carry `.entity` and `.source` properties that let you build a nested repository via `this.repositoryFactory.create(association.entity, association.source)` for OneToMany/ManyToMany data.","citations":["developer/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md:20-323"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-36":{"query":"How do I register ACL privileges for my plugin's Administration module and check them in a component or template?","category":"dev","option":"fs-docs","answer":"Register privileges using the `privileges` service's `addPrivilegeMappingEntry` method, typically in a file at `<plugin root>/src/Resources/app/administration/src/<your-component>/acl/index.js` that gets imported by your component/module index.js and ultimately main.js (must run before a user opens the Roles detail page). An entry has: `category` ('permissions' for normal CRUD-style privileges or 'additional_permissions' for non-CRUD actions), `parent` (a parent key for nesting, or null), `key` (groups privileges together - normally the module name), and `roles` - for normal permissions use the four fixed roles `viewer`/`editor`/`creator`/`deleter`, each with a `privileges` array of `entity_name:operation` strings (e.g. 'product:read') and an optional `dependencies` array referencing other identifiers like 'review.viewer'; for additional_permissions you can use any custom role key. Example: `Shopware.Service('privileges').addPrivilegeMappingEntry({ category: 'permissions', parent: 'catalogues', key: 'review', roles: { viewer: { privileges: ['product_review:read', ...], dependencies: [] }, editor: {...}, ... } });`. You can reuse other modules' privileges via `Shopware.Service('privileges').getPrivileges('rule.viewer')`. Protect routes by adding `meta: { privilege: 'your_key.your_role' }` to a route definition, protect menu/navigation entries or settingsItem entries with a `privilege` property, and protect keyboard shortcuts by giving the shortcut an `active()` method that checks `this.acl.can(...)`. Add snippet translations at `sw.privileges.${category}.${key}.label` (and `sw.privileges.${category}.${key}.${role_key}` for additional_permissions). To check privileges in a component, inject the `acl` service (`inject: ['acl']`) and call `this.acl.can('your_key.your_role')` in methods, or use `acl.can('review.editor')` directly in a template (e.g. `v-if=\"acl.can('review.editor')\"` or bound to a button's `:disabled`). Finally, to make sure custom privileges are added to existing roles at the PHP level, override the plugin's `enrichPrivileges()` method (extending Shopware\\Core\\Framework\\Plugin) returning an array keyed by role identifier (e.g. 'product.viewer') mapping to an array of additional privilege strings; an event subscriber adds these at runtime.","citations":["developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:1-448"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-37":{"query":"How do I set up and run PHPUnit integration tests for my Shopware plugin, including tests that boot the kernel?","category":"dev","option":"fs-docs","answer":"Create a `phpunit.xml` in the plugin root (this and a bootstrap file can be auto-generated by `bin/console plugin:create`). It should set `bootstrap=\"tests/TestBootstrap.php\"`, define `<php>` entries including `<server name=\"KERNEL_CLASS\" value=\"Shopware\\Core\\Kernel\"/>`, `<env name=\"APP_ENV\" value=\"test\"/>`, `<env name=\"APP_DEBUG\" value=\"1\"/>`, and `<env name=\"SYMFONY_DEPRECATIONS_HELPER\" value=\"weak\"/>`, plus `<testsuites>` pointing at directories such as `Test` and `Migration/Test`. The generated `tests/TestBootstrap.php` uses `Shopware\\Core\\TestBootstrapper` - `(new TestBootstrapper())->addCallingPlugin()->addActivePlugins('YourPlugin')->setForceInstallPlugins(true)->bootstrap()->getClassLoader()` - registering a PSR-4 autoload for your test namespace; `setForceInstallPlugins(true)` ensures the plugin is installed/active even if the test database already existed. For an integration test, extend PHPUnit's `TestCase` and use the `IntegrationTestBehaviour` trait, which provides conveniences like automatic DB transactions and cache clearing per test (example: a test that instantiates every plugin class via reflection/mock builder to confirm nothing is broken). For a test that needs the kernel's container/DB connection (e.g. a migration test), use the `KernelTestBehaviour` trait instead, and fetch services via `$this->getContainer()->get(Connection::class)`. To swap service behavior only during tests (e.g. avoid real file deletion or API calls), add a `<plugin root>/Resources/config/services_test.php` which overrides `services.php` just for the test environment. Run tests with the PHPUnit binary in `vendor/bin`: `./vendor/bin/phpunit --configuration=\"custom/plugins/SwagBasicExample\" --testsuite \"migration\"` for one testsuite, omit `--testsuite` to run all, or use `--filter <ClassOrMethodName>` for a single class/method. To run PHPUnit tests at all (project-side tooling), install the flex template's dev-tools package via `composer require --dev dev-tools`.","citations":["developer/guides/development/testing/unit/php-unit.md:1-215"],"toolCallLog":[{"tool":"Bash","args":"find developer/guides/development/testing -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/testing/unit/php-unit.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-38":{"query":"How do I write Jest unit tests for my Administration components in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Shopware's Administration uses Jest with Vue Test Utils. Test files sit next to the file under test with the suffix `.spec.js` or `.spec.ts`. You can scaffold a test with `composer run admin:create:test` (paste the component/service path when prompted) to get the recommended boilerplate. Before running tests, install JS dependencies with `composer run init:js`; run all unit tests with `composer run admin:unit` (full run with coverage) or `composer run admin:unit:watch` (watch mode for development) - note these PSH commands apply to the Shopware-provided Administration itself, plugin unit tests may need their own scripts. Services/ES modules can be imported and tested directly (no mocking needed). For components, first import the component module for its side effect of calling `Shopware.Component.register(...)`, then get a working Vue component via `Shopware.Component.build('component-name')` (this resolves twig template inheritance/overrides) and mount it with `shallowMount`/`mount` from `@vue/test-utils` (prefer `shallowMount`, which stubs child components). A typical structure: `createWrapper()` helper that calls `shallowMount(await Shopware.Component.build(...), { localVue, stubs, mocks, attachTo: document.body })`, used in `beforeEach`, destroyed and `flushPromises()`-awaited in `afterEach`. Provide required props via the `props` option to silence 'Missing required prop' warnings, and stub missing child components (import and `Shopware.Component.build` them) to resolve 'Unknown custom element' warnings. You can also assert on rendered slot content, e.g. mounting with `slots: { default: 'My custom message' }` and checking `wrapper.find('.sw-alert__message').text()`. Built-in preconfigured mocks/helpers include: `global.activeAclRoles` to set active ACL privileges per test (empty by default), `global.activeFeatureFlags` to enable feature flags, an automatic repository-factory mock that logs a console warning with example code (`global.repositoryFactoryMock.responses.addResponse({...})`) whenever an unmocked API route is requested (can be silenced via `global.repositoryFactoryMock.showWarning = false`), auto-registered global directives/filters and mocks like `$tc`, `$device`, `$store`, `$router` (overridable via the `mocks` option), and an auto-prepared global `Shopware` context. For missing custom directives (e.g. 'Failed to resolve directive: clipboard'), use `createLocalVue()` and `localVue.directive('clipboard', {})`, then pass `localVue` to the mount options. For missing injections (e.g. 'Injection \"mediaService\" not found'), provide a stub via the `provide` option (e.g. `provide: { mediaService: { renameMedia: () => Promise.resolve() } }`) or register a mock service ahead of time with `Shopware.Service.register('mediaService', { ... })` in `beforeAll`.","citations":["developer/guides/development/testing/unit/jest-admin.md:1-600"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/testing/unit/jest-admin.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-39":{"query":"How do I write end-to-end Cypress tests for my plugin against a Shopware 6.7 store?","category":"dev","option":"fs-docs","answer":"Important caveat found in the corpus: the Cypress-based E2E guide lives under a 'Legacy' section, which states explicitly: 'Cypress has been deprecated and is no longer maintained. We recommend using Playwright for new projects.' So for a Shopware 6.7 store, the documentation's current recommendation is to use the Playwright-based Acceptance Test Suite instead of Cypress. That said, the corpus still documents the legacy Cypress approach in full: you need a clean running Shopware 6 install (via `composer run init`), install E2E deps with `npm install` in the plugin's `Resources/app/<environment>/test/e2e` folder, and add the `@shopware-ag/e2e-testsuite-platform` npm package, which provides Cypress commands/fixtures for Shopware. For a plugin, create the folder structure `Resources/app/<environment>/test/e2e/cypress/{fixtures,integration,plugins,support}`, run `npm init -y`, add an `open` script (`cypress open`), install the testsuite package, and add `e2e/cypress/plugins/index.js` (`module.exports = require('@shopware-ag/e2e-testsuite-platform/cypress/plugins');`) and `e2e/cypress/support/index.js` (`require('@shopware-ag/e2e-testsuite-platform/cypress/support');`). Run the tests from that e2e folder with `CYPRESS_baseUrl=<your-url> npm run open` to launch the Cypress test runner against your storefront URL. Tests are written as `*.spec.js` files using Mocha-style `describe()`/`it()` blocks, Cypress commands like `cy.get(...).type(...).click()`, and Chai/BDD assertions (`expect(...).to.have.length(1)`); use `beforeEach`/`afterEach` hooks to clean up state (preferring `beforeEach` cleanup over `after` since failed tests may skip `after`). Test data is created via the REST API (using the testsuite's ApiService/axios-based services) rather than through the UI, either via `cy.fixture()`-based static JSON fixtures loaded from `e2e/cypress/fixtures` plus `cy.createDefaultFixture('endpoint')`, or via custom fixture services (extending `AdminFixtureService`) for entities that need related IDs resolved first.","citations":["developer/guides/development/testing/legacy/index.md:1-13","developer/guides/development/testing/legacy/cypress/index.md:1-549","developer/guides/development/testing/e2e-playwright/index.md:1-12"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/testing/legacy/index.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/testing/legacy/cypress/index.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/testing/e2e-playwright/index.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"dev-40":{"query":"How do I upgrade a Composer-based Shopware project from 6.6 to 6.7 — which composer.json constraint do I change, and which console commands do I run afterwards?","category":"dev","option":"fs-docs","answer":"The recommended path is the Shopware CLI upgrade wizard (`shopware-cli project upgrade`, or non-interactively with `--no-interaction --target latest-patch --dry-run` for CI/preflight), which handles readiness checks, extension compatibility, and Composer resolution for you. If you cannot use that tool, the manual Composer procedure is: 1) (for a running environment) enable maintenance mode with `bin/console sales-channel:maintenance:enable --all`; 2) before updating, adjust the required Shopware version constraint in `composer.json` to the target version (and, if using the Commercial plugin, also update the `shopware/commercial` requirement to a compatible version) - the doc warns that failing to change these constraints means `composer update` will just resolve back to the currently installed version and no real upgrade happens; 3) run `composer update --no-scripts` (the `--no-scripts` flag avoids running scripts that reference Shopware CLI commands, which only work once updated recipes are installed); 4) optionally run `composer recipes:update` to force-update Symfony-Flex-managed configuration files (review changes before committing); 5) finalize the update by running `bin/console system:update:finish`, which applies required update routines for the new version, including database migrations and recompiling themes; 6) afterwards disable maintenance mode with `bin/console sales-channel:maintenance:disable --all`. Post-upgrade, clear caches, rebuild Administration/Storefront assets if required, and test critical flows (checkout, login, API integrations) plus installed extensions.","citations":["developer/guides/upgrades-migrations/upgrade-shopware.md:1-109"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/upgrade-shopware.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-41":{"query":"`composer update` to Shopware 6.7 aborts on a platform requirement and my admin build then fails too — which PHP, database and Node versions does 6.7 actually require, and how do I check the machine I am on against them before I retry?","category":"dev","option":"fs-docs","answer":"The officially supported stack (developer/guides/hosting/index.md) requires: PHP 8.2+ (recommended 8.4) with memory_limit >= 512M, max_execution_time >= 30s, and extensions ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, openssl, pcre, pdo_mysql, phar, simplexml, xml, xmlreader, zip, zlib (optional amqp), plus Composer 2.2+; SQL: MariaDB >= 10.11.6 or MySQL >= 8.0.22 (Innovation releases not supported), recommended MariaDB 11.4 / MySQL 8.4, with max_allowed_packet >= 32M; Node.js/npm: Node 20.0.0+ required, recommended Node 24 / npm 10. To check your machine before retrying, the same page lists verification commands: `php -v` (CLI PHP version), `php -m` (list PHP modules), `php -i | grep memory_limit` (memory limit), `composer -V` (Composer version), `node -v` and `npm -v` (Node/npm versions). Note the doc warns that CLI and FPM PHP binaries/php.ini often differ, so make sure you check the binary actually used to run Composer/console commands. Separately, developer/guides/installation/system-requirements.md covers only the physical machine (hardware/OS) requirements, not the application stack versions.","citations":["developer/guides/hosting/index.md:15-47","developer/guides/installation/system-requirements.md:1-54"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"grep -rl \"6.7\" docs/shopware-knowledge-bases/developer --include=*.md -i | grep -i -E \"upgrade|migrat|require\" | head -50"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/upgrades-migrations -not -path '*/.git/*' | sort"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/index.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/upgrade-shopware.md"},{"tool":"Bash","args":"grep -rl -i \"system requirement\" docs/shopware-knowledge-bases/developer --include=*.md | head -20"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/installation/system-requirements.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/index.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-42":{"query":"How do I check extension compatibility before upgrading with shopware-cli, and why does it report my plugins in custom/plugins as blocking?","category":"dev","option":"fs-docs","answer":"Run `shopware-cli project upgrade` (interactive wizard) or its non-interactive preflight form `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run` to check readiness and extension compatibility without changing project files; it also lets you run `shopware-cli project validate` beforehand to find references to removed/renamed Shopware PHP types in your custom code. During the wizard's 'Analyze extension compatibility and run a Composer resolution check' phase, it combines extension/repository metadata with a real Composer dry run to classify each extension as ready, needs update, needs manual review, or blocking. Extensions in `custom/plugins` block the upgrade readiness check specifically because the wizard resolves and pins extension versions through Composer, and extensions living outside `vendor/` (e.g. in custom/plugins) are not managed by Composer and therefore cannot participate in that resolution. The fix is to migrate eligible locally managed extensions to Composer first with `shopware-cli project autofix composer-plugins` (documented further at autofix.md#migrate-customplugins-extensions-to-composer). The generated report at `.shopware-cli/upgrade/report.md` also lists extensions grouped as blocked, needs review, needs update, or OK, plus raw Composer conflict output when resolution fails.","citations":["developer/products/tools/cli/project-commands/upgrade.md:15-160"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/tools/cli/project-commands/upgrade.md"},{"tool":"Bash","args":"grep -n \"Detecting breaking changes\\|## \" docs/shopware-knowledge-bases/developer/products/tools/cli/project-commands/validation.md | head -30 (file not found, no output used)"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-43":{"query":"My admin plugin still ships a webpack.config.js — how do I move the administration build to Vite for Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Shopware 6.7 switches the administration build from Webpack to Vite. If your plugin only extends the webpack config via a custom `webpack.config.js`, you must migrate: 1) create a new `vite.config.mts` in `YourApp/src/Resources/app/administration/src` (the old webpack.config.js lived in `YourApp/src/Resources/app/administration/build/`); 2) remove the old `webpack.config.js`; 3) remove webpack-related dependencies from `package.json`; 4) add the Vite dependencies to `package.json`. A basic config migrates from `module.exports = () => ({ resolve: { alias: {...} } })` to `import { defineConfig } from 'vite'; export default defineConfig({ resolve: { alias: {...} } });` — more complex webpack configs vary in how they migrate; see the Vite docs for config options. The feature flag `ADMIN_VITE` already exists to test the new system. Build commands stay the same for you as a plugin author: `composer build:js:admin` still builds the administration with all extensions, and `composer watch:admin` still serves the dev/HMR server. Internally, bundle/plugin info comes from `var/plugins.json` (written by `Shopware\\Core\\Framework\\Plugin\\Command\\BundleDumpCommand`, runnable via `php bin/console bundle:dump`), and extensions are built via the script at `src/Administration/Resources/app/administration/build/plugins.vite.ts`, which loads a `vite.config` from each entry file's path. Apps are unaffected since their build process is already decoupled from Shopware.","citations":["developer/guides/upgrades-migrations/administration/vite.md:1-159"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/administration/vite.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-44":{"query":"After the Vue 3 upgrade my admin plugin broke — this.$parent resolves to the wrong component and a prop default that calls this.$tc throws. What do I have to change?","category":"dev","option":"fs-docs","answer":"Both issues are documented known issues of the Vue 2 -> Vue 3 upgrade (administration uses Vue 3 from Shopware 6.6 onward). `this.$parent`: Vue 3 wraps asynchronous components in an `AsyncWrapperComponent`, so the virtual DOM tree differs from Vue 2 — where a single `this.$parent` worked in Vue 2, in Vue 3 you may need `this.$parent.$parent` instead. The doc recommends avoiding `this.$parent` communication altogether as an anti-pattern, using services or event communication instead. Prop default calling `this.$tc`: prop default functions no longer have access to the component's `this` scope in Vue 3, so `this.$tc` inside a default function throws — use `Shopware.Snippet.tc` instead. More broadly, the doc suggests searching your code for `this.$` since that indicates use of Vue's internal API, which is very likely to break except for `this.$tc` used outside prop defaults.","citations":["developer/guides/upgrades-migrations/administration/vue3.md:88-126"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/administration/vue3.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-45":{"query":"Shopware.State is deprecated in 6.7 — how do I convert my administration Vuex module into a Pinia store?","category":"dev","option":"fs-docs","answer":"With Shopware 6.7, Vuex is replaced by Pinia as the admin state management library. To migrate: instead of exporting a Vuex module object with `namespaced: true, state: {...}, mutations: {...}, getters: {...}, actions: {...}`, register a Pinia store with `Shopware.Store.register('<storeName>', { state: () => ({...}), getters: {...}, actions: {...} })` and export it (state must now be a function returning the initial state, not a static object). You can also pass an object with an `id` property instead of a string name, and unregister a store with `Shopware.Store.unregister('<storeName>')`. Registration from a component/index file changes from `Shopware.State.registerModule('product', productsStore)` to simply importing the store file (`import './state/products.state'`). Mutations are no longer needed — modify state directly inside actions. Getters cannot share a name with a state property since both are exposed at the same level. TypeScript stores can export `type StoreType = ReturnType<typeof store>` and extend the global `PiniaRootState` interface. Stores can also be defined as composables (returning refs/computed/functions from a setup-style function passed to `Shopware.Store.register`). Access changes from `Shopware.State.get('<storeName>')` to `Shopware.Store.get('<storeName>')`. For tests, import the store to register it and call `store.$reset()` before each test; for component tests, create a Pinia instance with `createPinia()`, call `setActivePinia(pinia)`, and pass `plugins: [pinia]` in the mount's global options.","citations":["developer/guides/upgrades-migrations/administration/pinia.md:1-263"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/administration/pinia.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-46":{"query":"sw-button and sw-card are deprecated in Shopware 6.7 — how do I migrate my plugin's admin templates to the Meteor components, and is there a codemod that does it?","category":"dev","option":"fs-docs","answer":"Yes, Shopware 6.7 replaces several current administration components with components from the Meteor Component Library, and a codemod tool exists. Prerequisites: a development installation of Shopware must be installed and your plugin must be located in `custom/plugins`. Run `composer run admin:code-mods` (running it alone prints help text); a full invocation example is `composer run admin:code-mods -- --plugin-name example-plugin --fix -v 6.7`, supplying your plugin name and target Shopware version. The tool automatically replaces compatible components with Meteor Components, adds guidance comments for components that need manual migration, and fixes some other deprecated code where possible. To keep a single codebase compatible with both 6.6 and 6.7 without migrating immediately, a new `deprecated` prop (default `false`) was added to Shopware components: `<sw-button />` renders as `mt-button` in 6.7 (and `sw-button-deprecated` in 6.6), while `<sw-button deprecated />` forces the old `sw-button-deprecated` rendering in both 6.6 and 6.7. The docs still recommend migrating to Meteor Components fully whenever possible. Individual component-by-component upgrade guides are referenced as being in the technical upgrade documentation for the release (not detailed further on this page).","citations":["developer/guides/upgrades-migrations/administration/meteor-components.md:1-85"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/upgrades-migrations/administration/meteor-components.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-47":{"query":"My payment plugin implements `AsynchronousPaymentHandlerInterface` and is tagged `shopware.payment.method.async` — how do I write a payment handler for Shopware 6.7 instead?","category":"dev","option":"fs-docs","answer":"From Shopware 6.7.0.0, payment handling uses a single `Shopware\\Core\\Checkout\\Payment\\Cart\\PaymentHandler\\AbstractPaymentHandler` abstract class instead of the old interfaces. You must: 1) extend `AbstractPaymentHandler` instead of implementing `PaymentHandlerInterface`-family interfaces — your old `AsynchronousPaymentHandlerInterface`'s `pay`/`finalize` methods map onto `AbstractPaymentHandler`'s `pay` (always called during checkout, return a `RedirectResponse` for async flows) and `finalize` (only called if `pay` returned a `RedirectResponse`); 2) implement a `supports(PaymentHandlerType $type, string $paymentMethodId, Context $context): bool` method to declare which handler types you support (sync/async needs no special check, but recurring/refund must check `PaymentHandlerType::RECURRING`/`::REFUND`); 3) replace the service tag: remove `shopware.payment.method.async` (and any of `shopware.payment.method.sync`, `.prepared`, `.recurring`, `.refund`) and use the single new tag `shopware.payment.method` instead; 4) for errors, throw `PaymentException` (e.g. `PaymentException::asyncProcessInterrupted(...)`, `PaymentException::customerCanceled(...)`) rather than returning error states manually. Also note: from 6.7 a `technicalName` is required on plugin-provided payment methods (must be unique, plugin-specific prefix) — omitting it can prevent the plugin from installing/activating. An example async handler shows `pay()` returning a `RedirectResponse` after calling the external gateway, and `finalize()` checking `$request->query->getBoolean('cancel')` and calling `$this->transactionStateHandler->paid(...)` on success.","citations":["developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:1-33","developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:146-233","developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:791-847"],"toolCallLog":[{"tool":"Bash","args":"grep -rl -i \"AsynchronousPaymentHandlerInterface\\|shopware.payment.method.async\\|PaymentHandler\" docs/shopware-knowledge-bases/developer --include=*.md | head -30"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-48":{"query":"After upgrading, my storefront JavaScript plugin no longer loads — how do I register it asynchronously with `PluginManager` and where does the compiled file have to be shipped?","category":"dev","option":"fs-docs","answer":"Shopware auto-loads a `main.js` file from `<plugin root>/src/Resources/app/storefront/src`, and inside it you get `window.PluginManager` and call `PluginManager.register(name, PluginClass, selector)`. To register asynchronously, instead of a static top-of-file import, pass a dynamic import function as the second argument: `PluginManager.register('ExamplePlugin', () => import('./example-plugin/example-plugin.plugin'), '[data-example-plugin]')`. Providing a dynamic/async import makes the PluginManager automatically recognize the plugin as async, so it is excluded from the main bundled `storefront.js` and only downloaded on demand when an element matching the given selector (e.g. `[data-example-plugin]`) is present on the page — useful for reducing initial JS payload. In contrast, a normal static `import ExamplePlugin from './example-plugin/example-plugin.plugin'` bundles the plugin on every page. For the compiled file location: source lives in `<plugin root>/src/Resources/app/storefront/src`, and Shopware compiles it to `<plugin root>/src/Resources/app/storefront/dist/storefront/js/<plugin-name>/<plugin-name>.js` — these compiled files are automatically recognized by Shopware, and the docs explicitly instruct to make sure to ship the compiled file with your plugin. To rebuild after changes, run `shopware-cli project storefront-build` (template setups) or `composer run build:js:storefront` (platform/contribution setups).","citations":["developer/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md:65-274"],"toolCallLog":[{"tool":"Bash","args":"grep -rl -i \"PluginManager|register.*plugin.*storefront|window.PluginManager\" docs/shopware-knowledge-bases/developer --include=*.md | head -20"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-49":{"query":"My storefront controller still uses the `@Route` and `@RouteScope` annotations from 6.4 — what is the attribute form in Shopware 6.7 and how are the routes wired?","category":"dev","option":"fs-docs","answer":"Both the `@Route` and `@RouteScope` docblock annotations are replaced by PHP 8 attributes. The `@RouteScope` annotation specifically was deprecated as of Shopware 6.4.11.0/6.5 in favor of setting `_routeScope` inside the `Route` attribute's `defaults`. On the controller class you define a class-level attribute using `Symfony\\Component\\Routing\\Attribute\\Route`: `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]])]` above `class ExampleController extends StorefrontController`. On each action method you add a method-level attribute: `#[Route(path: '/example', name: 'frontend.example.example', methods: ['GET'])]`, optionally repeating the `defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]]` per-route if you want to define the scope per route instead of per class. Route names must use one of the prefixes `frontend`, `widgets`, `payment`, `api` or `store-api` to be recognized as Storefront (etc.) routes — the first three identify a Storefront route; if you don't want to use those prefixes, you can allow specific custom route names via a `storefront.router.allowed_routes` config entry in `Resources/config/packages/storefront.yaml` (available since Shopware 6.7.2.0), loaded by overriding the plugin's `build()` method to load `Resources/config/{packages}/*.yaml`. Wiring: the controller must be registered as a public service in `Resources/config/services.php` with `->public()->call('setContainer', [service('service_container')])`, and a `routes.php` file at `<plugin root>/src/Resources/config/routes.php` must import the controller so Shopware discovers the attribute-defined routes: `$routes->import('../../Storefront/Controller/*Controller.php', 'attribute');`.","citations":["developer/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:23-320"],"toolCallLog":[{"tool":"Bash","args":"grep -rl -i \"RouteScope|#\\[Route|Route attribute\" docs/shopware-knowledge-bases/developer --include=*.md | head -20"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/controllers/add-custom-controller.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-50":{"query":"My `ScheduledTaskHandler` stopped running after the upgrade — how must a scheduled task and its handler be declared in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"A ScheduledTask and its handler are declared in the plugin's `services.php` (placed under `<plugin root>/src/Resources/config/`) with two separate service tags: the task class must be tagged `shopware.scheduled.task`, and the handler class must be tagged `messenger.message_handler` (with its constructor args, e.g. `scheduled_task.repository` and `logger`, wired via `->args([...])`). The task class must extend `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTask` and implement `getTaskName(): string` (with a vendor-prefixed technical name to avoid collisions) and `getDefaultInterval(): int` (interval in seconds). The handler class must extend `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTaskHandler`, be annotated with the PHP attribute `#[AsMessageHandler(handles: ExampleTask::class)]` from `Symfony\\Component\\Messenger\\Attribute\\AsMessageHandler`, and implement a `run(): void` method containing the task logic. If both the tag and the `AsMessageHandler` attribute/class inheritance aren't correctly set, the task won't be dispatched or executed. Since Shopware 6.7.13.0, a handler can optionally implement `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\DynamicallyScheduledTaskHandler` and add `getNextExecutionTime(ScheduledTask $task, ScheduledTaskEntity $taskEntity): ?\\DateTimeInterface` (called after `run()`) to control the next run time dynamically instead of the default `nextExecutionTime + runInterval` schedule; returning null falls back to the default interval. To operationally verify things after an upgrade: `bin/console scheduled-task:register` re-registers the task without reinstalling the plugin, `bin/console scheduled-task:run` starts the ScheduledTaskRunner that dispatches due tasks to the message bus, and `bin/console messenger:consume` actually executes dispatched messages (not needed if using the admin worker) — also check that the task's `status` is `scheduled` in the `scheduled_task` database table, otherwise it won't run.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md:8-173"],"toolCallLog":[{"tool":"Bash","args":"grep -rl -i \"ScheduledTaskHandler|ScheduledTask\" docs/shopware-knowledge-bases/developer --include=*.md | head -20"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-51":{"query":"Custom entities declared in `Resources/config/entities.xml` no longer work for my plugin in Shopware 6.7 — how do I define and register a DAL entity with PHP attributes instead?","category":"dev","option":"fs-docs","answer":"Since Shopware v6.6.3.0 (well before 6.7), the XML-based entity definitions have been superseded by defining entities via PHP attributes. To define an entity, create a class extending `Entity` and add the `#[Entity('entity_name')]` attribute (imported as `Shopware\\Core\\Framework\\DataAbstractionLayer\\Attribute\\Entity`), optionally supplying a `collectionClass`. Define a primary key by adding `#[PrimaryKey]` plus `#[Field(type: FieldType::UUID)]` to a property (usually `$id`, typed `string`). Add more properties using the `#[Field(type: FieldType::...)]` attribute (or a field class directly, e.g. `PriceField::class`), special attributes like `#[AutoIncrement]` or `#[ForeignKey(entity: '...')]`, `#[Serialized(serializer: ...)]` for JSON fields, `EntityCustomFieldsTrait` or `#[CustomFields]` for custom fields, `api: true`/scope classes on `#[Field]` to expose fields via the API, `translated: true` plus `#[Translations]` for translatable fields (translated properties must be nullable), `#[Required]` to force validation, and `#[OneToOne]`, `#[OneToMany]`, `#[ManyToOne]`, `#[ManyToMany]` for associations (paired with `#[ForeignKey]`). With this pattern you no longer need to write getters/setters, a separate `EntityTranslationDefinition`, or (in most cases) an `EntityCollection` class. To register the entity, add the entity class to the DI container in `services.php` and tag it with `shopware.entity`, e.g. `$services->set(Examples\\ExampleEntity::class)->tag('shopware.entity');`. Shopware then automatically registers an `EntityDefinition` and `EntityRepository` for it, available in the container as `<entity_name>.definition` and `<entity_name>.repository`.","citations":["developer/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md:1-621"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"grep -rl \"entities.xml\" docs/shopware-knowledge-bases/developer"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname \"*upgrade*\" -not -path \"*/.git/*\""},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname \"*6.7*\" -not -path \"*/.git/*\"; find docs/shopware-knowledge-bases/developer -ipath \"*changelog*\" -not -path \"*/.git/*\"; grep -rl \"MappedSuperclass|#\\[Entity|EntityDefinition attribute\" docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-52":{"query":"What must a plugin database migration class implement in Shopware 6.7, and where does the database cleanup on uninstall belong?","category":"dev","option":"fs-docs","answer":"A plugin migration class must extend `Shopware\\Core\\Framework\\Migration\\MigrationStep` and live in the `Migration` directory relative to the plugin's base class, named `Migration<timestamp>DescriptiveName.php` (generated via `./bin/console database:create-migration -p <Plugin> --name <Description>`). It must implement `getCreationTimestamp(): int` (returning the timestamp embedded in the file name, not changed manually) and `update(Connection $connection): void`, where all schema and data changes for the plugin are implemented; Shopware runs `update()` automatically on plugin install/update. There is no migration rollback — do not reverse migrations inside the migration class. `MigrationStep` also defines an optional `updateDestructive()` method used by Shopware core for delayed, major-version destructive changes, but plugin install/update never runs `updateDestructive()`, and merchants/platforms generally don't run `database:migrate-destructive` for plugins either — so all needed plugin changes must go in `update()`. Cleaning up the database when the plugin is removed belongs in the plugin lifecycle method `uninstall()`, as described in the Plugin Lifecycle guide.","citations":["developer/guides/plugins/plugins/database/database-migrations.md:65-104"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"MigrationStep|class Migration\" docs/shopware-knowledge-bases/developer/guides"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/database/database-migrations.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-53":{"query":"My theme config labels disappeared from the Theme Manager after 6.7 — how do I define `theme.json` config fields and where do their translations go now?","category":"dev","option":"fs-docs","answer":"Theme config fields are still defined in `<plugin root>/src/Resources/theme.json` under the `config.fields` object, each keyed by the field's technical name, with parameters like `type` (color, text, number, fontFamily, media, checkbox, switch, url), `editable`, `tab`, `block`, `section`, `custom`, `scss`, and `fullWidth`. The `label` and `helpText` parameters (arrays of translations keyed by locale, e.g. `en-GB`/`de-DE`) are deprecated as of v6.8: translations are now handled via Administration snippets instead of inline in theme.json. That is why inline labels no longer show up as before — as of v6.7.1.0 the recommended `theme.json` examples for fields, blocks, sections and tabs no longer include a `label` object at all. Instead, store the translated labels as Administration snippet keys, e.g. in `<plugin root>/src/Resources/app/administration/src/app/snippet/de.json` and `en.json` (locale-specific files like `de-DE.json`/`en-GB.json` are also supported and override the base language files). Each key starts with `sw-theme`, followed by the theme's technical name (or its parent theme's, since snippets inherit from parent themes), then the relevant `tab`, `block`, `section`, and `field` names (using `default` for any unnamed element), ending in `.label` (or `.helpText` for fields, or a numeric option index for field options). For example: `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.<fieldName>.label`. After adding or changing fields (and their snippets), run `bin/console theme:refresh` to apply the changes.","citations":["developer/guides/plugins/themes/configuration/theme-configuration.md:207-322"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"theme.json\" docs/shopware-knowledge-bases/developer/guides"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/themes/configuration/theme-configuration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-54":{"query":"How do I register a plugin cookie in the storefront cookie consent manager in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"In Shopware 6.7, register a plugin cookie by listening to the `Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent` (the old `CookieProviderInterface` is deprecated, though still supported for backward compatibility with the old array syntax). First register an event listener in `<plugin root>/src/Resources/config/services.php` tagged with `kernel.event_listener` for the `CookieGroupCollectEvent` event. Then implement the listener class with an `__invoke(CookieGroupCollectEvent $event)` method: get the target cookie group from `$event->cookieGroupCollection` (e.g. via `CookieProvider::SNIPPET_NAME_COOKIE_GROUP_COMFORT_FEATURES`), get or create its `CookieEntryCollection` via `getEntries()`/`setEntries()`, then build a `new CookieEntry('my-cookie-key')` and set its `name`, `value`, and `expiration` properties, and add it to the entries collection. Since Shopware 6.7.3.0, cookies use structured objects (`CookieEntry` and `CookieGroup`) instead of arrays for type safety, and the array format is deprecated; cookie groups themselves should not carry `cookie`, `value`, `expiration`, or `isRequired` parameters — those only apply to individual `CookieEntry` objects. Also since 6.7.3.0, cookie configurations include an automatically calculated hash; changing a plugin's cookie configuration changes the hash and triggers a re-consent flow for users (hash stored per-language in the browser's `cookie-config-hash` cookie, and exposed via the Store API `/store-api/cookie/groups` endpoint). After registering, the new cookie appears in the cookie consent manager on the storefront.","citations":["developer/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md:1-155"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"cookie consent|CookieConfiguration|addCookieGroup|cookie configuration\" docs/shopware-knowledge-bases/developer/guides"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-55":{"query":"How do the breaking storefront accessibility changes reach my theme in Shopware 6.7, and what must an extension that overrides the affected Twig blocks do?","category":"dev","option":"fs-docs","answer":"Because accessibility fixes can change HTML/Twig structure or CSS in ways that break extensions overriding the affected areas, breaking accessibility changes are not enabled by default before 6.7 — they ship behind the `ACCESSIBILITY_TWEAKS` feature flag (set `ACCESSIBILITY_TWEAKS=1` in `.env`, the same mechanism used for major feature flags like `V6_7_0_0`). While the flag is active, the old markup/blocks are still used unless the flag is enabled, letting developers check whether their project/extension is affected and prepare in advance. With the major version v6.7.0, all these accessibility improvements become the default (the flag-gated behavior turns on for everyone). Typically the old Twig block (e.g. `component_list_items`) is marked `@deprecated tag:v6.7.0` and kept inside an `{% else %}` branch, while the new, accessible markup lives inside `{% if feature('ACCESSIBILITY_TWEAKS') %}` in a new block (e.g. `component_list_items_inner`). An extension/theme that overrides the affected block must therefore override both blocks during the transition: keep overriding the old deprecated block for pre-6.7 behavior, and add an override of the new inner block using the new markup (e.g. `<li>` instead of `<div>`), so the extension works correctly both before and after the flag/major version flips. Once the project is fully on 6.7+ (where the change is default), the old block override can be removed. Also note theme recompilation (`bin/console theme:compile`) is needed after enabling the flag to apply styling improvements.","citations":["developer/guides/development/accessibility/storefront-accessibility.md:19-99"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"accessibility\" docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/accessibility/storefront-accessibility.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-56":{"query":"Header and footer are loaded through ESI sub-requests in Shopware 6.7, so page data is gone in my header template — how do I pass my own data into the header/footer now?","category":"dev","option":"fs-docs","answer":"With ESI loading of header and footer, they are rendered as separate sub-requests so they are cacheable independently and no longer automatically get the current page's data. To pass custom data into them: 1) Extend `Storefront/Resources/views/storefront/base.html.twig` in your plugin/app and override the `base_esi_header` (or `base_esi_footer`) block, merging extra entries into the `headerParameters` variable, e.g. `{% set headerParameters = headerParameters|merge({ 'vendorPrefixPluginName': { 'activeRoute': activeRoute } }) %}` followed by `{{ parent() }}`. These `headerParameters` are passed to the header route as query parameters and forwarded into the header template, where you can then access them, e.g. `{{ dump(headerParameters.vendorPrefixPluginName.activeRoute) }}` inside an override of the `header` block in `layout/header.html.twig`. This approach works in both plugins and apps. 2) In plugins specifically, you can alternatively listen to the `StorefrontRenderEvent`, check that `$event->getRequest()->attributes->get('_route')` is `frontend.header` (or `frontend.footer`), then read/modify the `headerParameters` array via `$event->getParameter('headerParameters')` and `$event->setParameter('headerParameters', $headerParameters)`. Important: `headerParameters` and `footerParameters` can only contain scalar values because they double as query parameters for the ESI routes. If you need data unrelated to the header/footer ESI request but tied to the main page, use the general 'Add data to storefront page' approach. It is also possible to load an entirely custom header/footer template (as the checkout confirm page does), but this overwrites customizations from every other extension, and you must ensure the `header`/`footer` data is still available if your custom template extends the original.","citations":["developer/guides/plugins/plugins/storefront/templates/customize-header-footer.md:1-104"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"ESI|esi_include|sw_include\" docs/shopware-knowledge-bases/developer/guides"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/templates/customize-header-footer.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-57":{"query":"B2B Suite support ends with 6.8 — how do I run the B2B Suite Migration to B2B Components and check that it finished?","category":"dev","option":"fs-docs","answer":"B2B Suite will no longer be supported starting Shopware 6.8, so migration to B2B Components should be planned promptly. Two console commands drive the process, and it's recommended to run them simultaneously in separate terminal windows: `bin/console b2b:migrate:commercial` starts the migration, transferring all components and entities as defined in the configuration; you can restrict it to specific components by appending their technical names (e.g. `bin/console b2b:migrate:commercial quote_management shopping_list`) — note that `employee_management` is always migrated first regardless of the order given, since it's a prerequisite for all other components, and the actual migration order is governed by configurator priority in the service definition file, not the CLI argument order. You can also control batch size with `--batch-size=100` to manage memory/performance. This command uses the message queue system to process migration in the background, so the migration may still be running after the command exits. To check that it finished, run `bin/console b2b:migrate:progress` (optionally with `--watch` to auto-refresh every 5 seconds) in a separate terminal. It shows a table with Total, Valid, Newly, Migrated, Pending, and Error record counts, plus a Status column with values `Complete` (migration completed successfully), `Pending`, `In progress`, `Complete with error` (check the `b2b_components_migration_errors` table), or `Has new records` (new records detected in B2B Suite since migration started). Note: for Budget Management specifically, the Organization Unit of each budget is empty after migration by design and must be manually reassigned in B2B Commercial afterward (feature available from Commercial 7.6.0+).","citations":["developer/products/extensions/b2b-suite-migration/index.md:1-23","developer/products/extensions/b2b-suite-migration/execution/running-migration.md:1-102"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"B2B Suite Migration|b2b-suite-migration|Migration to B2B\" docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/extensions/b2b-suite-migration/index.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/products/extensions/b2b-suite-migration -not -path \"*/.git/*\" -type f"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/products/extensions/b2b-suite-migration/execution/running-migration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-58":{"query":"My shopware.yaml still uses redis_url — how do I define the named Redis connections in Shopware 6.7 and which eviction policy does each one need?","category":"dev","option":"fs-docs","answer":"Starting with v6.6.8.0 (available in 6.7), Shopware supports configuring multiple reusable, named Redis connections in `config/packages/shopware.yaml` under `shopware.redis.connections`, each with its own `dsn`, e.g.: `shopware: redis: connections: ephemeral: {dsn: 'redis://host1:port/dbindex'}, persistent: {dsn: 'redis://host2:port/dbindex'}`. Connection names should reflect their purpose, be unique, and follow service naming conventions since they become part of container service names; you then reference a connection by name in the configuration of the relevant subsystem. Environment variables can be used in the DSN (e.g. `%env(REDIS_EPHEMERAL)%/1`), and for high-load scenarios you can enable connection pooling by adding `?persistent=1` to the DSN (this affects connection pooling, not data persistence). Because current Redis versions cannot use different eviction policies per database within the same instance, Shopware recommends separate Redis instances per data category, each with a specific eviction policy: (1) Ephemeral data (HTTP cache & object cache) — no disk persistence needed, use eviction policy `volatile-lru` (only evicts keys that have a TTL, since the app manages TTL explicitly); (2) Durable but 'aging' data (sessions) — persist to disk (RDB/AOF) and use `allkeys-lru` since more recent data is more valuable and the oldest values should be discarded first; (3) Durable and critical data (cart, number ranges, lock store, increment data) — persist to disk and use `volatile-lru` so non-expired critical data is never evicted.","citations":["developer/guides/hosting/infrastructure/redis.md:14-109"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"redis_url|redis:\" docs/shopware-knowledge-bases/developer"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/infrastructure/redis.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-59":{"query":"After upgrading to Shopware 6.7 my Varnish cache is never invalidated — what changed in the reverse proxy configuration?","category":"dev","option":"fs-docs","answer":"Two related things changed for 6.7. First, the older Varnish + Redis (BAN) integration method is deprecated as of 6.6.x and removed entirely in v6.7.0: that method used LUA scripts to determine URLs for the BAN request, which could cause problems depending on setup/network, and it does not support Redis clusters. If a project was still relying on this Redis/BAN-based invalidation, it will stop working in 6.7, since the mechanism itself was removed — the documentation says to use the Varnish `XKey` integration instead, enabled in `config/packages/shopware.yml` via `shopware.http_cache.reverse_proxy` with `enabled: true`, `use_varnish_xkey: true`, and the `hosts` list pointing at your Varnish host(s) (requires the Varnish `xkey` module, Varnish 6.0+). Second, the cache-clearing commands changed behavior around invalidation: `bin/console cache:clear` cleared the HTTP cache too in versions before 6.7, but that is no longer automatically the case; to explicitly clear the reverse proxy/HTTP cache use `bin/console cache:clear:http` (available since 6.6.10), and `bin/console cache:clear:all` clears everything including HTTP cache, application cache, cache pools and other kernel cache directories (since 6.6.8). The Reverse Proxy Cache still shares the same invalidation mechanism/tags as the Object Cache, so when a product is invalidated the object cache and HTTP cache should both be invalidated together — but this relies on the XKey-based setup being correctly configured rather than the removed Redis/BAN method.","citations":["developer/guides/hosting/infrastructure/reverse-http-cache.md:38-44","developer/guides/hosting/infrastructure/reverse-http-cache.md:219-237"],"toolCallLog":[{"tool":"Bash","args":"grep -rli \"varnish\" docs/shopware-knowledge-bases/developer/guides"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/infrastructure/reverse-http-cache.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-60":{"query":"Which transports do my Shopware message queue workers have to consume in production, and how do I turn off the admin worker?","category":"dev","option":"fs-docs","answer":"On production, the message queue should be processed via CLI workers instead of the Administration's admin worker. The recommended approach is to run one or more `bin/console messenger:consume` workers, e.g. `bin/console messenger:consume async --time-limit=60 --memory-limit=128M`. You can consume multiple prioritized transports in one command as recommended by Symfony, e.g. `bin/console messenger:consume async low_priority` — out of the box Shopware defines the `async` transport (via `MESSENGER_TRANSPORT_DSN`) and the `low_priority` transport (via `MESSENGER_TRANSPORT_LOW_PRIORITY_DSN`), and you must also set up a CLI worker for the failed transport (`MESSENGER_TRANSPORT_FAILURE_DSN`) or failed messages will never be processed. Use a process control system like systemd or supervisor to auto-restart workers that stop due to time/memory limits, or a cron job (though cron won't cap the number of concurrent workers the way supervisor does). Once the CLI worker(s) are set up, turn off the admin worker by setting `enable_admin_worker: false` under `shopware.admin_worker` in `config/packages/shopware.yaml`: \n```yaml\nshopware:\n    admin_worker:\n        enable_admin_worker: false\n```\n(If you instead want to keep using the admin worker, you must set `enable_admin_worker: true`, a `poll_interval`, and list every transport it should consume under `transports`, e.g. `transports: [\"async\", \"low_priority\"]`.)","citations":["developer/guides/hosting/infrastructure/message-queue.md:14-67","developer/guides/hosting/infrastructure/message-queue.md:115-126","developer/guides/hosting/infrastructure/message-queue.md:149-153"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"admin worker|messenger:consume|scheduler_worker|low_priority\" docs/shopware-knowledge-bases/developer/guides"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/infrastructure/message-queue.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-61":{"query":"After the upgrade my Elasticsearch index has to be rebuilt — where do I set the shard and replica counts and which reindex command do I run?","category":"dev","option":"fs-docs","answer":"Shard and replica counts are set by default to three shards and three replicas, but you can override them in a config file at `config/packages/elasticsearch.yml` with `elasticsearch.index_settings.number_of_shards` and `number_of_replicas` (available since Shopware 6.4.12.0). To rebuild/reindex, the basic command is `bin/console es:index`. To reindex the whole shop (Elasticsearch, SEO-URLs, product index, etc.) use `bin/console dal:refresh:index --use-queue` (the `--use-queue` option is recommended because of the message queue). If the index was created but products still don't show in the Storefront, you may also need to run `bin/console es:create:alias`. It's also recommended to clear the cache first with `bin/console cache:clear` before indexing.","citations":["developer/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md:140-175"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides -maxdepth 2 -not -path '*/.git/*'"},{"tool":"Bash","args":"grep -ril 'elasticsearch' docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-62":{"query":"I changed a setting in `.env` on a deployed 6.7 shop but it still behaves the old way — what takes precedence between `.env`, `.env.local` and the real environment variables, and which settings does Shopware not read from `.env` at all?","category":"dev","option":"fs-docs","answer":"The corpus does not explicitly document a precedence order between `.env`, `.env.local`, and real (server/container) environment variables — that Symfony-standard behavior (real env vars > `.env.local` > `.env`) is not stated in the fs-docs corpus, so I cannot cite it; it is only from general Symfony/Shopware knowledge [from memory]. What the corpus does establish is the broader configuration model: Shopware configuration can come from several mechanisms — database-backed system configuration (shop settings changeable in the Administration/Admin API/app code, stored in the DB), static system configuration (`config/packages/*.yaml` under `shopware.system_config`, which is an overlay that wins over the database value and then can no longer be changed in the Administration), Symfony/bundle configuration (`config/packages/*.yaml`), and environment variables (`.env`, `.env.local`, server/container env, or deployment platform) which are meant for secrets, infrastructure values, and deployment-specific values. So settings that are shop/merchant settings managed via the Administration (i.e. database-backed system configuration such as `core.listing.allowBuyInListing` and similar `core.*` settings) are not read from `.env` at all unless you explicitly wire them via a static system config override using `%env(...)%` in a `config/packages/<name>.yaml` file, e.g. `core.listing.allowBuyInListing: '%env(bool:ALLOW_BUY_IN_LISTING)%'` with `ALLOW_BUY_IN_LISTING` then set in `.env.local`. Only infrastructure/environment variables listed in the Environment Variables reference (e.g. `APP_ENV`, `DATABASE_URL`, `SHOPWARE_ES_ENABLED`, `REDIS_URL`, etc.) are read directly from `.env`.","citations":["developer/guides/hosting/configurations/shopware/index.md:14-30","developer/guides/hosting/configurations/shopware/static-system-config.md:8-58","developer/guides/hosting/configurations/shopware/environment-variables.md:8-67"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/configurations/shopware/environment-variables.md"},{"tool":"Bash","args":"grep -ril '\\.env\\.local' docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/configurations/shopware/index.md"},{"tool":"Bash","args":"grep -n '\\.env' docs/shopware-knowledge-bases/developer/guides/development/start-developing.md"},{"tool":"Bash","args":"grep -n '\\.env' docs/shopware-knowledge-bases/developer/guides/hosting/configurations/shopware/static-system-config.md; grep -n -B2 -A5 'precedence|override|takes priority|priority' docs/shopware-knowledge-bases/developer/guides/hosting/infrastructure/database.md"},{"tool":"Bash","args":"grep -n -B3 -A8 '\\.env' docs/shopware-knowledge-bases/developer/guides/installation/legacy-setups/symfony-cli-setup.md"},{"tool":"Bash","args":"grep -rn 'real environment|system environment variable|takes precedence|override.*\\.env|\\.env.*override' docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/hosting/configurations/shopware/static-system-config.md"},{"tool":"Bash","args":"grep -n -B3 -A10 '\\.env' docs/shopware-knowledge-bases/developer/guides/hosting/installation-updates/deployments/deployment-with-deployer.md"}],"notFoundClaim":false,"memoryClaims":["Standard Symfony precedence: real server/container environment variables override `.env.local`, which overrides `.env` — this is not explicitly documented in the fs-docs corpus for Shopware."],"sourceVerdict":"partial"},"dev-63":{"query":"I deployed a plugin update to a 6.7 staging shop and my new migration never ran — which `bin/console` command applies the pending migrations of that one plugin, and what do I have to pass to it?","category":"dev","option":"fs-docs","answer":"Use `bin/console database:migrate <identifier> --all`, where `<identifier>` is your plugin's bundle name (e.g. `SwagBasicExample`). By default the identifier is set to run Shopware Core migrations, so to run pending migrations for a specific plugin you must pass that plugin's bundle name as the identifier argument (the `--all` flag runs all unhandled migrations for it). Normally migrations run automatically when a plugin is installed, and any NEW migrations run automatically when the plugin is updated via the Plugin Manager — if they didn't run automatically, running `database:migrate <PluginName> --all` manually applies the pending ones.","citations":["developer/guides/plugins/plugins/database/database-migrations.md:162-178"],"toolCallLog":[{"tool":"Bash","args":"grep -rln 'migration:migrate|plugin.*migration' docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/database/database-migrations.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-64":{"query":"How do I get an Admin API OAuth token — with client_credentials for an integration, or the password grant for local testing — and how long is each token valid?","category":"dev","option":"fs-docs","answer":"For an integration (the recommended default approach), create an integration in the Administration under Settings → System → Integrations with the 'Administrator' toggle enabled, then use its Access key ID as `client_id` and Secret access key as `client_secret` in a `client_credentials` grant request: `curl -s \"http://127.0.0.1:8000/api/oauth/token\" -H \"Content-Type: application/json\" -d '{\"grant_type\": \"client_credentials\", \"client_id\": \"YOUR_ACCESS_KEY_ID\", \"client_secret\": \"YOUR_SECRET_ACCESS_KEY\"}'`. The response includes `token_type: Bearer`, `access_token`, and `expires_in: 3600` (1 hour). For local development only, there is a password-grant shortcut using the default Administration credentials: `curl -X POST \"http://localhost:8000/api/oauth/token\" -H \"Content-Type: application/json\" -d '{\"grant_type\": \"password\", \"client_id\": \"administration\", \"scopes\": \"write\", \"username\": \"admin\", \"password\": \"shopware\"}'`, which returns `token_type: Bearer`, `expires_in: 600` (10 minutes), an `access_token`, and a `refresh_token`. The docs note `client_credentials` should remain the default approach, and the password grant is only a local shortcut.","citations":["developer/guides/development/integrations-api/index.md:60-109","developer/guides/development/integrations-api/auth-api-requests.md:11-40"],"toolCallLog":[{"tool":"Bash","args":"grep -rln 'client_credentials|password grant|grant_type' docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/auth-api-requests.md"},{"tool":"Bash","args":"grep -n 'client_credentials|expires_in|oauth/token' -A15 -B5 docs/shopware-knowledge-bases/developer/guides/development/integrations-api/index.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/index.md, offset=60, limit=50"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-65":{"query":"What can I put in the JSON body of `POST /api/search/{entity}` for filtering, associations, sorting, aggregations and getting an exact total count?","category":"dev","option":"fs-docs","answer":"The search criteria JSON body supports: `associations` (loads additional related data, like a SQL join, and can carry nested criteria such as limit/filter/sort for that association), `includes` (restricts returned fields per apiAlias/entity type), `ids` (limit search to a list of IDs), `total-count-mode` (0 = no total computed, the default and most performant; 1 = exact total via SQL_CALC_FOUND_ROWS, needed for exact pagination; 2 = only determines if there's a next page, good for infinite scroll), `page`/`limit` for pagination (page is 1-indexed), `filter` (filters results and aggregations, same filter types as the DAL, e.g. `equals`, `multi` with `and`/`or` operators, referencing nested association fields once those associations are loaded), `post-filter` (same as filter but does not apply to aggregations, useful for facet navigation), `query` (weighted search returning `_score` per matched record, each sub-query has its own `score`), `term` (full text ranking search using the entity's SearchRanking field weighting — not to be combined with `query`), `sort` (array of `{field, order}`, plus optional `naturalSorting: true` and `type: count` to sort by association count), `aggregations` (compute metrics like avg, terms, count on the fly), and `grouping` (array of field names to group records by, e.g. one product per manufacturer).","citations":["developer/guides/development/integrations-api/search-criteria.md:8-442"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/development/integrations-api/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/search-criteria.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-66":{"query":"Which request headers change Admin API behaviour for language, entity version, parent-child inheritance and skipping flow triggers during a bulk import?","category":"dev","option":"fs-docs","answer":"`sw-language-id` — by default the API returns entities in the system language; sending this header with a language ID returns that language's translation (the plain field is null if no explicit translation exists, whereas `translated.[value]` always resolves with inheritance). `sw-version-id` — since entities can have multiple versions (e.g. orders), the API returns only the most recent record by default; include this header to select a specific version. `sw-inheritance` — parent-child inheritance (e.g. products/variants) isn't considered by default; send `sw-inheritance: 1` to make the API resolve inherited field values from the parent. `sw-skip-trigger-flow` — for bulk imports (e.g. via the sync API) where you don't want flows like 'send email on customer creation' to fire, send `sw-skip-trigger-flow: 1`, e.g. on `POST /api/_action/sync`.","citations":["developer/guides/development/integrations-api/request-headers.md:8-52"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/development/integrations-api/request-headers.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-67":{"query":"What does a minimal app folder and `manifest.xml` need to contain, and which console commands install and activate the app on my local Shopware 6.7?","category":"dev","option":"fs-docs","answer":"A minimal app lives under `custom/apps/<AppName>/` (technical name in UpperCamelCase, e.g. `MyExampleApp`), and each app folder must at least contain a `manifest.xml`. The folder name and the `<meta><name>` inside `manifest.xml` must match. A typical minimal manifest has a `<meta>` block with `<name>`, `<label>` (optionally per-locale), `<description>` (optionally per-locale), `<author>`, `<copyright>`, `<version>`, `<icon>`, and `<license>`. `<author>` and `<copyright>` are required — if missing or empty, `bin/console app:refresh` fails. To install and activate: run `bin/console app:refresh` first to register the app, then `bin/console app:install --activate MyExampleApp` (using the technical name, not the folder path) to install and activate it in one step. Without `--activate`, the app installs inactive and can be activated separately via `bin/console app:activate MyExampleApp` or through the Administration (Extensions → My Extensions → Apps). `bin/console app:list` shows currently registered apps, `bin/console app:validate` checks configuration issues, and `--no-validate` can be passed to `app:install` to skip validation while debugging. After activating, clear caches with `bin/console cache:clear` (and optionally `cache:clear:http` or `cache:clear:all`).","citations":["developer/guides/plugins/apps/app-base-guide.md:8-121"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/plugins/apps/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/apps/app-base-guide.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-68":{"query":"How does the registration handshake between Shopware and my app backend work — shop id, proof, shop secret and the confirmation call?","category":"dev","option":"fs-docs","answer":"Registration happens during app installation whenever the app backend and Shopware need to communicate (Admin Module, Payment Method, Tax providers, or Webhooks). Steps: (1) Registration request — Shopware sends a GET request to the URL from the app's manifest with query params `shop-id`, `shop-url`, `timestamp`, plus headers `shopware-app-signature` (HMAC-SHA256 of the query string, keyed with the app's `app-secret`), `sw-version`, and (on re-registration only) `shopware-shop-signature` signed with the shop's current `shop-secret`. The app must recompute `hash_hmac('sha256', $queryString, $appSecret)` and compare it to `shopware-app-signature` to verify the request came from an authenticated shop. (2) Registration response — if valid, the app responds with JSON containing `proof` (SHA-256 HMAC of the concatenation of `shopId`, `shopUrl`, and the app's name, keyed with `app-secret`), a randomly generated `secret` (called the `shop-secret`, unique per shop, 64-255 characters, used to sign all future requests from this shop), and a `confirmation_url`. (3) Confirmation request — if the proof matches what Shopware computes, Shopware issues a POST to the `confirmation_url` with body containing `apiKey`, `secretKey` (used as `client_id`/`client_secret` for Admin API OAuth), `timestamp`, `shopUrl`, `shopId`; this request is signed with the shop-secret in the `shopware-shop-signature` header, which the app must recompute (`hash_hmac('sha256', $requestBody, $shopSecret)`) and verify. On re-registration, an additional `shopware-shop-signature-previous` header (signed with the prior shop-secret) lets the app validate continuity. The whole exchange has a 5-second timeout against the app server, and secret rotation/shop-URL changes reuse this re-registration flow, requiring the app to accept both old and new secrets briefly during rotation.","citations":["developer/guides/plugins/apps/lifecycle/app-registration-setup.md:8-269"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/plugins/apps/lifecycle/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/apps/lifecycle/app-registration-setup.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-69":{"query":"How does an app subscribe to an event like `product.written`, what does Shopware POST to the webhook URL, and how do I verify the request is genuine?","category":"dev","option":"fs-docs","answer":"You subscribe by adding a `<webhooks>` element to the app's manifest.xml, defining a webhook name, target URL, and the `event` it reacts to, e.g. a webhook named `product-changed` at `https://example.com/event/product-changed` triggered by `event=\"product.written\"`; then every time a product is changed, Shopware POSTs to that URL. The request body is JSON with a `data` object containing `event` (event name) and `payload` (an array of change entries — for `entity.written` events each entry has `entity`, `operation`, `primaryKey` and `updatedFields`, since payloads carry only the entity id/primaryKey rather than the full entity, so the app must fetch fresh data via the Shop API), a `source` object with `url` (the Shopware instance's API URL), `appVersion`, `shopId`, and `eventId` (stable across retries, since 6.4.1.0... actually since 6.4.11.0), and a top-level `timestamp` (to guard against replay attacks — reject requests with too-old timestamps). Headers include `sw-version` (since 6.4.1.0), and since 6.4.5.0 `sw-context-language` and `sw-user-language`. To verify authenticity, check the `shopware-shop-signature` header, which is a SHA-256 HMAC of the request body signed with the shop-secret the app generated for that shop during registration — the verification mechanism is identical to that used for the registration confirmation request. Optionally, a webhook can be restricted to the live version only by adding `onlyLiveVersion=\"true\"` to the webhook definition (since 6.5.7.0), which filters the payload to only entries with the live version ID and only applies to `HookableEntityWrittenEvent`-based events.","citations":["developer/guides/plugins/apps/lifecycle/webhook.md:8-146"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/apps/lifecycle/webhook.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-70":{"query":"How do I implement a payment method in an app with `pay-url` and `finalize-url`, and what must the app server return in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Define the payment method in the a
