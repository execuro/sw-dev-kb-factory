wn reports directory, apparently self-correcting an earlier malformed Write path): rm -rf \"<home>/projects/","dev-57: auditNote — cases.md lists this case's status as 'contradictory' (requires human audit per case-status lifecycle).","dev-59: auditNote — Ground-truth log shows a housekeeping Bash call outside the corpus (rm -rf against its own reports directory, apparently self-correcting an earlier malformed Write path): rm -rf \"<home>/projects/","edge-05: auditNote — Ground-truth log shows the agent re-reading its own just-written raw report (edge-05.json) — excluded from retrieval/findability/self-report-delta computation as housekeeping, not corpus retrieval.","edge-06: auditNote — Agent self-report sourceVerdict='corpus-missing' with notFoundClaim=true, based on grepping only developer/ for 'magento'. The docs target for this case maps to merchant/content/en/shopware-6/migratio","gap-01: selfReportDelta reported=12 actual=13, missing=1 call(s)","gap-02: selfReportDelta reported=8 actual=12, missing=4 call(s)","gap-03: auditNote — ground-truth extract attributes only housekeeping calls (the report Write) to this caseId; no Read/Bash retrieval call carries this caseId. The case's real research reads may have been attributed to a","rescore dev-08: accuracy 70 -> 40","rescore dev-08: total/verdict 85/pass -> 77/partly","rescore dev-48: accuracy 70 -> 40","rescore dev-48: actionability 100 -> 70","rescore dev-48: total/verdict 85/pass -> 74/partly","rescore func-12: accuracy 70 -> 40","rescore func-12: actionability 100 -> 70","rescore func-12: total/verdict 83/partly -> 73/partly"]},"raw":{"fs-docs":{"dev-01":{"query":"How do I extend the product entity with a new association in Shopware's Data Abstraction Layer?","category":"dev","option":"fs-docs","answer":"To add a new association to the product entity, create an EntityExtension class in `<plugin root>/src/Extension/Content/Product/`, extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityExtension`, implement `getDefinitionClass()` returning `ProductDefinition::class`, and override `extendFields(FieldCollection $collection)` to add your association field (e.g. an `OneToOneAssociationField('exampleExtension', 'id', 'product_id', ExampleExtensionDefinition::class, true)` with `CascadeDelete` flag if you want automatic loading). Register the extension in `services.php` tagged with `shopware.entity.extension`. If the association points to a new table, create a corresponding entity definition (e.g. `ExampleExtensionDefinition`) with an `FkField` pointing back to `product_id`, a `ReferenceVersionField` for `product_version_id` (needed because product is versioned), and the inverse `OneToOneAssociationField`; register that definition too, tagged `shopware.entity.definition`. Add the new table via a database migration, including foreign key constraints referencing `product` (id, version_id). You then write to the association through the product repository, e.g. `$this->productRepository->upsert([['id' => ..., 'exampleExtension' => ['customString' => 'foo bar']]], $context)`. Since Shopware 6.6.10.0, you can alternatively register a `BulkEntityExtension` (tagged `shopware.bulk.entity.extension`) to extend multiple entities including product at once by yielding `ProductDefinition::ENTITY_NAME => [ ...fields... ]` from a `collect()` generator. Note: adding a database column directly to `product` is not allowed; new data must live in a separate table connected via association. For non-persisted associations, you can instead subscribe to `ProductEvents::PRODUCT_LOADED_EVENT` and call `$productEntity->addExtension()` on load.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md:1-367","developer/guides/plugins/plugins/framework/data-handling/add-data-associations.md:94-137"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -maxdepth 3 -type d -not -path '*/.git/*' | sort"},{"tool":"Bash","args":"ls on developer/guides/plugins/plugins/framework/data-handling, plugin-fundamentals, framework/store-api, content/cms, plugins/themes, framework/flow"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/add-data-associations.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-02":{"query":"What's the plugin lifecycle in Shopware — install, activate, uninstall — and how does `keepUserData` work?","category":"dev","option":"fs-docs","answer":"A Shopware plugin extends `Shopware\\Core\\Framework\\Plugin` (which extends `Bundle`, which extends Symfony's `Bundle`) and goes through the stages Install, Activate, Deactivate, Update, Uninstall, with lifecycle methods `install()`, `activate()` (before activation), `deactivate()` (before deactivation), `update()`, `postInstall()` (after successful install), `postUpdate()` (after successful update), and `uninstall()`, implemented in the plugin's base bootstrap class (`<plugin root>/src/SwagBasicExample.php`). `install(InstallContext $installContext)` is used to register entities (e.g. payment methods), create initial data and prepare system requirements; the docs advise against creating fully active business data here since the plugin isn't active yet — create it but keep it inactive until `activate()`. `activate(ActivateContext $context)` activates entities created during install or creates new ones now that the plugin is active. `deactivate(DeactivateContext $context)` is the opposite: deactivate or remove entities that would otherwise interfere while inactive. `update(UpdateContext $context)` handles non-database adjustments (database changes should go through plugin migrations instead); `UpdateContext` additionally exposes `getUpdatePluginVersion()` and `getCurrentPluginVersion()`. `uninstall(UninstallContext $context)` is the opposite of `install()` and should remove or clean up plugin data — but the docs warn not to blindly delete entities that may be referenced elsewhere (e.g. a payment method used in real orders) — better to deactivate than delete in such cases. `UninstallContext` provides everything `InstallContext` does plus a `keepUserData()` flag: if `$uninstallContext->keepUserData()` returns true, the plugin must not delete its persistent data (the example shows returning early from `uninstall()` when this flag is true), so respecting this flag is required to avoid unintended data loss.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md:1-188"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-03":{"query":"How do I add a custom Store API route for a headless storefront?","category":"dev","option":"fs-docs","answer":"Build the route as a decoratable service: first create an abstract class (e.g. `AbstractExampleRoute`) in `<plugin root>/src/Core/Content/Example/SalesChannel/` declaring an abstract `getDecorated(): AbstractExampleRoute` and an abstract `load(Criteria $criteria, SalesChannelContext $context): ExampleRouteResponse`. Then implement `ExampleRoute extends AbstractExampleRoute`, tagged with the PHP attribute `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]])]` on the class and `#[Route(path: '/store-api/example', name: 'store-api.example.search', methods: ['GET','POST'], defaults: ['_entity' => 'swag_example'])]` on the `load` method; inject the relevant `EntityRepository`, have `getDecorated()` throw `DecorationPatternException`, and return a custom `ExampleRouteResponse` wrapping `$this->exampleRepository->search($criteria, $context->getContext())`. Note: all fields you want exposed through the API need the `ApiAware` flag in their entity definition. Create the response class extending `Shopware\\Core\\System\\SalesChannel\\StoreApiResponse`, which wraps an `EntitySearchResult` in `$object`, and expose a getter (e.g. `getExamples()`) returning the entity collection. Register the route class in `services.php` with its repository dependency. Finally, add a `routes.php` file at `<plugin root>/src/Resources/config/` that imports route classes for discovery: `$routes->import('../../Core/**/*Route.php', 'attribute');` — a route class can be a correctly registered service without becoming an actual endpoint until this import happens. Verify registration with `./bin/console debug:router store-api.example.search` (this only confirms discovery, not that the service can be constructed or a request will succeed). Optionally document the route for Stoplight/OpenAPI by adding a JSON schema file under `<plugin root>/src/Resources/Schema/StoreApi/`. To also expose the route to the (non-headless) Storefront, wrap it in a Storefront controller with the `StorefrontRouteScope`, but for a purely headless storefront the Store API route itself (reachable at `/store-api/example`) is what a headless client (e.g. a decoupled frontend) calls directly.","citations":["developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md:1-421"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-04":{"query":"How do I create a custom CMS element for Shopping Experiences?","category":"dev","option":"fs-docs","answer":"A CMS element is the smallest content primitive in the Shopping Experience (CMS) hierarchy (Page > Section > Block > Slot > Element), placed inside a block's slot. Recommended plugin structure is `<plugin root>/src/Resources/app/administration/src/module/sw-cms/elements/<element-name>/` with `index.js`, and `component/`, `config/`, and `preview/` subfolders each containing their own `index.js` (plus twig/scss for the storefront-facing pieces). Steps: 1) Import the element folder in `main.js` (`import './module/sw-cms/elements/dailymotion';`). 2) In the element's `index.js`, call `Shopware.Service('cmsService').registerCmsElement({ name, label, component, configComponent, previewComponent, defaultConfig, hidden?, removable? })` to register it — `name` is the technical name, `component` is the Vue component that renders it in the editor, `configComponent` renders the config modal, `previewComponent` shows the thumbnail in the element picker, and `defaultConfig` defines default config keys each with `source`/`value`. 3) Create the preview component via `Shopware.Component.register('cms-el-preview-<name>', {...})`. 4) Create the main editor component similarly, using the `cms-element` mixin and calling `this.initElementConfig('<name>')` in `created()`. 5) Create the configuration component (form fields for the `defaultConfig` options), also using the `cms-element` mixin. 6) Optionally support field inheritance between base layout and content pages using the `sw-cms-inherit-wrapper` component wrapped around individual config fields. For the Storefront side, create a Twig template at `src/Resources/views/storefront/element/cms-element-<name>.html.twig` (the `cms-element-` prefix plus the technical `name` is mandatory); the `element` variable is auto-passed to the template with its config and metadata (see `CmsSlotDefinition.php`). Existing core element code can be referenced under `src/Administration/Resources/app/administration/src/module/sw-cms/elements/` (admin), `src/Storefront/Resources/views/storefront/element/` (storefront), and `Shopware\\Core\\Content\\Cms\\SalesChannel\\SalesChannelCmsPageLoader::load` (core loading logic). After adding a new element, the natural next step is to add or reuse a CMS block to host it.","citations":["developer/guides/plugins/plugins/content/cms/add-cms-element.md:1-253"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/content/cms/add-cms-element.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-05":{"query":"How does theme inheritance work in Shopware — theme.json and SCSS overrides?","category":"dev","option":"fs-docs","answer":"Theme inheritance is configured in `theme.json`, located in `<plugin root>/src/Resources`. Every theme already inherits Shopware's default theme via the `@Storefront` placeholder in its `views`, `style`, `script` and `asset` arrays. To inherit from another custom theme (e.g. `SwagBasicExampleTheme`) you add its `@ThemeName` placeholder into the inheritance chain of these arrays. Order matters and determines precedence: in `views`, the Storefront template is rendered first as the base, then installed plugin extensions apply, then the parent theme (`@SwagBasicExampleTheme`) changes, and finally the current (child) theme's changes are applied last. The `script` section works the same way (Storefront JS base, then parent theme JS, then current theme JS). The `style` (SCSS) section is similar, but with one difference: an `overrides.scss` file is placed at the very top of the list (before `@SwagBasicExampleTheme`/`@Storefront`) because it can affect SCSS variables such as `$border-radius`, which need to be defined before the rest of the styles compile — this is covered further in the 'Override Bootstrap variables in a theme' guide. The `asset` section requires you to explicitly list the parent theme if you want to reuse its assets. A separate `configInheritance` array (available since Shopware 6.4.8.0) controls inheritance of the theme's *configuration fields* (e.g. colors, logos defined under `config.fields` in theme.json): it lists which themes' field configuration values to inherit, with the last theme in the list acting as parent; the Storefront's theme configuration is always inherited even without a `configInheritance` entry. Fields inherited this way show an 'inherit' anchor in the Administration and use the parent's value until overridden; a child theme can override individual fields (e.g. redefining `sw-brand-icon` with a new value) while still inheriting others, and can also add entirely new fields not present in the parent.","citations":["developer/guides/plugins/themes/inheritance/add-theme-inheritance.md:1-123","developer/guides/plugins/themes/configuration/theme-inheritance-configuration.md:1-200"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/plugins/themes/inheritance, styling, configuration"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/themes/inheritance/add-theme-inheritance.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/themes/configuration/theme-inheritance-configuration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-06":{"query":"How do I add a custom Flow Builder action?","category":"dev","option":"fs-docs","answer":"Backend (PHP) part: 1) Define an 'aware' interface for your action's data (e.g. `TagAware` in `<plugin root>/src/Core/Framework/Event/`), extending `Shopware\\Core\\Framework\\Event\\FlowEventAware` and annotated with `#[IsFlowEventAware]`, exposing constants for store keys (e.g. `TAG`, `TAG_ID`) and a getter. 2) Create the action class (e.g. `CreateTagAction`) in `<plugin root>/src/Core/Content/Flow/Dispatching/Action/`, extending `Shopware\\Core\\Content\\Flow\\Dispatching\\Action\\FlowAction`, implementing: `getName(): string` (a unique technical action name like `action.create.tag`), `requirements(): array` (which Aware interfaces the action needs — empty array means available for all triggers, a list of interfaces like `[OrderAware::class, CustomerAware::class]` restricts it to matching events, or your own new Aware interface for a brand-new event), and `handleFlow(StorableFlow $flow): void` which reads `$flow->getConfig()`, `$flow->getStore($key)` (data from aware interfaces) and `$flow->getData($key)` (data from the original event) to perform the actual work (e.g. creating tags via an injected `EntityRepository`). 3) Register the action as a service tagged `flow.action` with a `priority` and `key` matching the action name, e.g. `->tag('flow.action', ['priority' => 600, 'key' => 'action.create.tag'])`; this makes it appear in `/api/_info/flow-actions.json`. If you want the action tied to a brand-new event, that event class must implement your Aware interface, and you register a `BusinessEventCollectorSubscriber` listening to `BusinessEventCollectorEvent::NAME` to add the event definition, plus a snippet for the trigger label. Administration (UI) part: 4) Define a JS constant for the action name and add it to the `actionGroups`/label via overriding the core `sw-flow-sequence-action` component (`Component.override('sw-flow-sequence-action', {...})`), providing `getActionTitle`, `getActionDescriptions`, and `modalName` (pointing to your custom modal, e.g. `sw-flow-create-tag-modal`) — grouped under an existing group like `customer`/`order`/`tag` or defaults to `general`. 5) Add snippet translations (`en-GB.json`, `de-DE.json`) for labels. 6) Build the configuration modal component (Vue component + Twig template) that collects config and emits `process-finish` with the config object, or alternatively skip the modal entirely by overriding `openDynamicModal` to directly call `onSaveActionSuccess({config})` with a hardcoded/derived config. 7) Import new files in `main.js`.","citations":["developer/guides/plugins/plugins/framework/flow/add-flow-builder-action.md:1-735"],"toolCallLog":[{"tool":"Bash","args":"ls docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/flow/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/flow/add-flow-builder-action.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-07":{"query":"My plugin needs to store its own data in a new table — how do I define a custom DAL entity with its definition, entity and collection class so I get a repository for it?","category":"dev","option":"fs-docs","answer":"First create the database table via a plugin migration (e.g. `<plugin root>/src/Migration/Migration1611664789Example.php` extending `MigrationStep`), prefixed with your vendor/plugin name (e.g. `swag_example`), with an `id BINARY(16)` primary key plus your columns and the standard `created_at`/`updated_at` columns. Then: 1) Create an `EntityDefinition` (e.g. `ExampleDefinition` in `<plugin root>/src/Core/Content/Example/ExampleDefinition.php`) extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityDefinition`, implementing `getEntityName(): string` returning the table name (`swag_example` — this string is also used to build the repository service ID `swag_example.repository`), and `defineFields(): FieldCollection` returning field objects such as `IdField` (flagged `Required`+`PrimaryKey`), `StringField`, `BoolField`, etc. — storage names in snake_case, property names in lowerCamelCase; `created_at`/`updated_at` are included automatically and don't need to be defined. 2) Register the definition in `services.php` tagged `shopware.entity.definition` with `['entity' => 'swag_example']` — this alone is technically enough to start using the repository (e.g. for reading/writing data), but data will come back as generic `ArrayEntity` instances without further classes. 3) Create an `Entity` class (e.g. `ExampleEntity` extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity`, using the `EntityIdTrait`) with `protected` (not `readonly`) properties matching each field except the id, plus getters/setters, and point your definition to it by overriding `getEntityClass()` to return `ExampleEntity::class`. 4) Create an `EntityCollection` class (e.g. `ExampleCollection` extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityCollection`), overriding `getExpectedClass()` to return `ExampleEntity::class`, and point your definition to it via `getCollectionClass()` returning `ExampleCollection::class`. Once registered, the entity is fully accessible through the API and CRUD-capable via its auto-generated repository (`swag_example.repository`), injectable via dependency injection.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md:1-316"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-08":{"query":"In a plugin service, what is the Shopware 6 equivalent of Doctrine's `findBy()` — how do I read products with filters, associations and sorting?","category":"dev","option":"fs-docs","answer":"Shopware 6 uses no ORM but a thin Data Abstraction Layer (DAL); instead of Doctrine's `findBy()`, you inject the entity's auto-generated repository (service name pattern `entity_name.repository`, e.g. `product.repository`, an `EntityRepository`) into your service via `services.php`/constructor, and call `$this->productRepository->search(new Criteria(), $context)`, which returns an `EntitySearchResult` (a collection). To find by ID: `$this->productRepository->search(new Criteria([$myId]), $context)->first()` — `Criteria`'s constructor accepts an array of IDs. To filter by another field, add a filter object to the `Criteria`, e.g. `$criteria->addFilter(new EqualsFilter('name', 'Example name'))` (from `Shopware\\Core\\Framework\\DataAbstractionLayer\\Search\\Filter\\EqualsFilter`); filters can be combined with `OrFilter`/`AndFilter`/`NandFilter`, and `addPostFilter` applies a filter without affecting aggregations. For associations, call `$criteria->addAssociation('productReviews')` (dot-chainable, e.g. `'productReviews.customer'`), and to filter within an association use `$criteria->getAssociation('productReviews')->addFilter(new RangeFilter('points', [RangeFilter::GTE => 4]))` — note the difference between filtering the association's own criteria (still returns the parent entity, just narrows which associated rows are attached) versus filtering the parent via `productReviews.points` in the main criteria (which narrows the parent results themselves). Many-to-many mapping entities (e.g. `ProductCategoryDefinition`) cannot be read via `search()`, only via `searchIds()`. Aggregations use `$criteria->addAggregation(new AvgAggregation('avg-rating', 'productReviews.points'))`, retrieved via `$products->getAggregations()->get('avg-rating')`. Sorting/paging/limiting use `$criteria->setLimit()`, `$criteria->setOffset()`, and `$criteria->addSorting(new FieldSorting('createdAt', FieldSorting::ASCENDING))`. For huge datasets, use `RepositoryIterator` (`new RepositoryIterator($this->productRepository, $context, $criteria)`, then loop `$iterator->fetch()`), ensuring the criteria's sorting is deterministic (e.g. always add a sort by `id` as a tiebreaker) to avoid entities appearing in multiple batches or being skipped.","citations":["developer/guides/plugins/plugins/framework/data-handling/reading-data.md:1-391"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/reading-data.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-09":{"query":"How do I make a field on my plugin's own entity translatable per language?","category":"dev","option":"fs-docs","answer":"Given an existing custom entity (e.g. `swag_example`), create a `_translation` table via migration (e.g. `swag_example_translation`) with columns `swag_example_id` (FK to the parent entity, cascading on delete/update), `language_id` (FK to `language`), the translatable column(s) (e.g. `name`), plus `created_at`/`updated_at`; the primary key is the composite `(swag_example_id, language_id)`. Then create a translation `EntityDefinition` (e.g. `ExampleTranslationDefinition` in `<plugin root>/src/Core/Content/Example/Aggregate/ExampleTranslation/`) extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityTranslationDefinition` (not the plain `EntityDefinition`), overriding `getParentDefinitionClass()` to return the parent's definition class (`ExampleDefinition::class`) and `defineFields()` to return only the translatable fields as e.g. `StringField` (base fields like `language_id` are added automatically by `EntityTranslationDefinition`). Register it in `services.php` tagged `shopware.entity.definition` — importantly, after the entity it translates. Create a translation `Entity` class extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\TranslationEntity` (which already provides `language_id` handling), with properties/getters/setters for the foreign id (e.g. `exampleId`), the translated value (e.g. `name`), and an association property to the parent entity; wire it via `getEntityClass()` on the translation definition. Create a translation `EntityCollection` extending `EntityCollection`, overriding `getExpectedClass()`. Finally, in the main entity's `EntityDefinition`, add a `TranslatedField('name')` (flagged `ApiAware`+`Required`) instead of a plain field for the translatable property, plus a `TranslationsAssociationField(ExampleTranslationDefinition::class, 'swag_example_id')` (also flagged `ApiAware`+`Required`) to associate it with its translations. When reading translated data, prefer `entity.translated.field` in storefront/sales-channel contexts, and use the plain `entity.field` in Admin/CRUD flows where you need the value for the current language specifically.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-data-translations.md:1-298"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/add-data-translations.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-10":{"query":"How do I write an indexer that precomputes derived data for my custom entity on write, and how do I trigger a full reindex?","category":"dev","option":"fs-docs","answer":"Create a class (e.g. `ExampleIndexer` in `<plugin root>/src/Core/Framework/DataAbstractionLayer/Indexing/`) extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Indexing\\EntityIndexer` and implement: `getName(): string` returning a unique indexer name (used by `EntityIndexerRegistry` to route messages); `iterate($offset): ?EntityIndexingMessage`, called for a full reindex, which uses `IteratorFactory::createIterator($this->repository->getDefinition(), $offset)` to fetch a batch of IDs and returns an `EntityIndexingMessage` (or null when exhausted); `update(EntityWrittenContainerEvent $event): ?EntityIndexingMessage`, called whenever entities are written via the DAL — read `$event->getPrimaryKeys(YourDefinition::ENTITY_NAME)` to get changed IDs (you can inspect the event further to filter by which columns changed, to minimize work), and return an `EntityIndexingMessage` with those IDs (or null if none); and `handle(EntityIndexingMessage $message): void`, called by message queue workers (or synchronously) to actually perform the precomputation — the docs recommend manipulating data here via the injected `Doctrine\\DBAL\\Connection` directly rather than the DAL, to avoid triggering `EntityWrittenContainerEvent` again and causing an infinite indexing loop (if you must use the DAL, disable indexing by calling `$context->addState(EntityIndexerRegistry::DISABLE_INDEXING)` on the context passed into the `EntityIndexingMessage`). Register the indexer as a service tagged `shopware.entity_indexer` (with dependencies like `IteratorFactory`, the entity's `EntityRepository`, and `Connection` injected). By default messages from `update()` are handled synchronously (handle() runs right after update()); passing `true` as the 4th constructor argument (`$forceQueue`) of `EntityIndexingMessage` routes it through the async Message Queue instead. To trigger a full reindex, run the console command `bin/console dal:refresh:index`, which calls `iterate()` across all registered indexers (a user can also trigger this from the Administration settings). If you only need to react to changes on *existing* core entities (not build your own indexer), the guide recommends instead subscribing to existing indexer events (e.g. `CustomerIndexerEvent`, dispatched by `CustomerIndexer`, `CategoryIndexer`, `ProductIndexer`, etc. in their `handle()` methods) via a normal event subscriber tagged `kernel.event_subscriber`, again preferring the plain `Connection` over the DAL inside the listener for the same infinite-loop and performance reasons.","citations":["developer/guides/plugins/plugins/framework/data-handling/add-data-indexer.md:1-289"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/data-handling/add-data-indexer.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-11":{"query":"On Shopware 6.7, which file do I declare my plugin's services in, and how do I get a core service passed into my service's constructor?","category":"dev","option":"fs-docs","answer":"On Shopware 6.7 you declare plugin services in a PHP config file at PLUGIN_ROOT/src/Resources/config/services.php, using Symfony's ContainerConfigurator (the plugin.md guide shows creating this file with `return static function (ContainerConfigurator $configurator): void { ... }`). Plugin XML service configuration is deprecated in 6.7 and removed in 6.8, so services.php is the correct file for 6.7. To get a core service (e.g. SystemConfigService) injected into your own service's constructor: if your services.php uses `->defaults()->autowire()->autoconfigure()` with `$services->load(...)`, you simply type-hint the core service as a constructor parameter and it is injected automatically. If you declared the service explicitly (no autowiring), you must add it as an argument: `$services->set(ExampleService::class)->args([service(SystemConfigService::class)]);` and then type-hint the same service class in the constructor, e.g. `public function __construct(private SystemConfigService $systemConfigService) {}`.","citations":["developer/guides/plugins/plugins/services/dependency-injection.md:1-79","developer/guides/plugins/plugins/services/add-custom-service.md:1-124","developer/resources/references/adr/2026-07-30-migrate-container-configuration-from-xml-to-php.md:1-37"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -iname '*services.xml*' -not -path '*/.git/*'"},{"tool":"Bash","args":"grep -rl 'services.xml' docs/shopware-knowledge-bases/developer --include=*.md -l"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -ipath '*dependency-injection*' -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/services/dependency-injection.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/services/add-custom-service.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/resources/references/adr/2026-07-30-migrate-container-configuration-from-xml-to-php.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-12":{"query":"I am on Shopware 6.6 — which file do I declare my plugin's service dependencies in, and how do I pass another service into the constructor?","category":"dev","option":"fs-docs","answer":"The corpus's current guides (dependency-injection.md, add-custom-service.md) only document the PHP services.php format used from 6.7 onward, and no longer contain the older XML plugin example. However, the ADR 'Migrate container configuration from XML to PHP' explicitly states the prior convention: 'plugins ship Resources/config/services.xml by convention' and that 'Plugin XML configuration is deprecated in 6.7 and removed in 6.8' — meaning on Shopware 6.6, plugin services are declared in PLUGIN_ROOT/src/Resources/config/services.xml, an XML Symfony DI container file. This file's exact syntax for injecting one service into another's constructor (a <service> definition with an <argument type=\"service\" id=\"...\"/> pointing at the core service id, matching a constructor parameter) is not shown anywhere in the corpus, since current docs only show the services.php equivalent — that specific XML syntax detail is from general Symfony/Shopware knowledge, not from this corpus [from memory].","citations":["developer/resources/references/adr/2026-07-30-migrate-container-configuration-from-xml-to-php.md:16-30"],"toolCallLog":[{"tool":"Bash","args":"grep -rn 'services.xml|services.yaml' docs/shopware-knowledge-bases/developer/guides --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/architecture/dependency-injection-dependency-handling.md"},{"tool":"Bash","args":"grep -n 'services.xml' -A5 -B5 docs/shopware-knowledge-bases/developer/guides/installation/legacy-setups/migrate-zip-to-composer-project.md"}],"notFoundClaim":false,"memoryClaims":["The XML syntax for injecting a service into another service's constructor in a plugin's services.xml uses a <service> tag with an <argument type=\"service\" id=\"...\"/> child element referencing the target service id, matching constructor parameter order."],"sourceVerdict":"partial"},"dev-13":{"query":"There is no event for what I need to change in a core Shopware service — how do I decorate or replace that service from my plugin?","category":"dev","option":"fs-docs","answer":"Use service decoration in your plugin's services.php. Register your decorator class and call ->decorate(TargetService::class)->args([service('.inner')]) so Symfony passes the original ('inner') service into your decorator's constructor. Example: `$services->set(ExampleServiceDecorator::class)->decorate(ExampleService::class)->args([service('.inner')]);`. Shopware services designed for decoration expose an abstract class (with a getDecorated(): self method) rather than a plain interface, so new non-abstract methods can be added later without breaking existing decorators. Your decorator class should extend that abstract class, accept the decorated instance (typed as the abstract class, never the concrete class) in its constructor, return it from getDecorated(), and delegate to it inside overridden methods before/after adding your own logic — a decorator that never calls the inner service silently discards the rest of the chain (core logic and any other plugin's decorator). Decorators nest: if multiple plugins decorate the same service, each only sees the next inner one, and you can inspect the chain with 'Navigate → Implementations' in PHPStorm or `bin/console debug:container --show-arguments <service-id>`. Prefer a designed extension point (Shopware's `.pre/.post/.error` events) over decoration when one exists; use decoration only when there is no extension point and you need to change how the existing service behaves.","citations":["developer/guides/plugins/plugins/services/adjusting-service.md:24-166"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -ipath '*decorat*' -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/services/adjusting-service.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-14":{"query":"I wrote a subscriber class in my plugin but it never fires — which interface and which service tag (`shopware.event_subscriber`?) register it?","category":"dev","option":"fs-docs","answer":"Your class must implement Symfony's `EventSubscriberInterface` (`Symfony\\Component\\EventDispatcher\\EventSubscriberInterface`) and define a static `getSubscribedEvents()` method mapping event names to handler methods. That alone is not enough: the class must also be registered as a service in your plugin's src/Resources/config/services.php and tagged with `kernel.event_subscriber` (not `shopware.event_subscriber`) — e.g. `$services->set(MySubscriber::class)->tag('kernel.event_subscriber');`. If the subscriber is missing from services.php or lacks that tag, Shopware never calls it, and there is often no obvious error indicating the event was not handled.","citations":["developer/guides/plugins/plugins/framework/event/listening-to-events.md:41-145"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -ipath '*listening-to-events*' -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/event/listening-to-events.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-15":{"query":"How do I work out which event Shopware actually dispatches for a given action, for example after a product is loaded or a page is rendered?","category":"dev","option":"fs-docs","answer":"The 'Finding Events' guide lists several approaches: (1) DAL entity events follow the fixed pattern `entity_name.event`, e.g. `product.written`/`product.deleted`; default entities also ship an 'Event class' with constants for every possible event (e.g. ProductEvents::PRODUCT_LOADED_EVENT) — find these classes by searching for the term `@Event`. (2) For general PHP events, look at the core code you want to extend for `$this->eventDispatcher->dispatch($someEvent, $someEvent->getName())` calls (the event's name is the second dispatch argument, or the class name if omitted), or search the shopware source for `extends NestedEvent`, `extends Event`, `implements ShopwareEvent`, or `->dispatch`, or inspect a service's DI definition/constructor to see if it has an `event_dispatcher`/`EventDispatcherInterface` argument (meaning it can fire events). (3) 'Page loaded' events: storefront pages loaded via GenericPageLoader-style loaders fire a `*PageLoadedEvent`; find them by searching for the term 'PageLoadedEvent'. (4) Criteria-loading events (search term `CriteriaEvent`) fire whenever a Criteria is used to load an entity, e.g. `ProductListingCriteriaEvent` in the product listing route. (5) Route-level events named `{route}.request`, `{route}.response`, `{route}.render` (Shopware\\Storefront\\Event\\StorefrontRenderEvent, thrown before Twig rendering in the storefront), `{route}.encode`, and `{route}.controller` are fired for every Symfony route — substitute the actual route name, e.g. `store-api.product.listing.request`. (6) Business events (e.g. CustomerBeforeLoginEvent/CustomerLoginEvent) can be found via `implements BusinessEventInterface` or `implements MailActionInterface`. (7) Simplest of all: use the Symfony profiler's 'Events' tab, which lists every event actually fired during the current request along with its name.","citations":["developer/guides/plugins/plugins/framework/event/finding-events.md:1-259"],"toolCallLog":[{"tool":"Bash","args":"grep -rln 'debug:event-dispatcher|events-reference|list of events|Events Reference' docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Bash","args":"grep -n 'debug:event' docs/shopware-knowledge-bases/developer/resources/references/core-reference/commands-reference.md"},{"tool":"Bash","args":"grep -rln 'xdebug|breakpoint|find out which event|discover events|EventDispatcher::dispatch' docs/shopware-knowledge-bases/developer/guides --include=*.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -ipath '*event*' -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/event/finding-events.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-16":{"query":"How do I run plugin logic whenever an order is written, and find out exactly which fields changed?","category":"dev","option":"fs-docs","answer":"Subscribe to `OrderEvents::ORDER_WRITTEN_EVENT` (an `EntityWrittenEvent`) in an event subscriber, and inside the handler check `$event->getContext()->getVersionId() !== Defaults::LIVE_VERSION` to skip non-live versions (e.g. admin edit drafts). By default no changeset is generated for performance reasons, so to see exactly which fields changed you must also subscribe to `PreWriteValidationEvent` (fired before the write result set is generated). In that handler, iterate `$event->getCommands()`, skip any command that isn't `ChangeSetAware`, filter for `OrderDefinition::ENTITY_NAME`, and call `$command->requestChangeSet()`. Then, back in the `onOrderWritten` handler for `ORDER_WRITTEN_EVENT`, loop over `$event->getWriteResults()` and call `$result->getChangeSet()` on each write result to read the generated changeset. Both handlers are registered the normal subscriber way (implement `EventSubscriberInterface`, list both events in `getSubscribedEvents()`, and tag the service `kernel.event_subscriber` in services.php).","citations":["developer/guides/plugins/plugins/checkout/order/listen-to-order-changes.md:19-138"],"toolCallLog":[{"tool":"Bash","args":"grep -rln 'getChangeSet|ChangeSet|EntityWriteResult' docs/shopware-knowledge-bases/developer --include=*.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/order/listen-to-order-changes.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-17":{"query":"How do I overwrite the price of a product line item in the cart at runtime from a plugin?","category":"dev","option":"fs-docs","answer":"Implement a cart collector and a cart processor (they can be the same class implementing both interfaces). The collector implements `Shopware\\Core\\Checkout\\Cart\\CartDataCollectorInterface::collect(CartDataCollection $data, Cart $original, SalesChannelContext $context, CartBehavior $behavior)`: filter the cart's line items to `LineItem::PRODUCT_LINE_ITEM_TYPE`, fetch the new price for each product (from wherever you source it), and store it in `$data` (the `CartDataCollection`) keyed by a prefixed line-item/product id (e.g. `'price-overwrite-'.$id`) so it survives into the processor and avoids duplicate lookups across recalculations. The processor implements `Shopware\\Core\\Checkout\\Cart\\CartProcessorInterface::process(CartDataCollection $data, Cart $original, Cart $toCalculate, SalesChannelContext $context, CartBehavior $behavior)`: iterate the product line items of `$toCalculate` (not `$original` — `$toCalculate` is the cart that is actually used), look up the stored new price by the same key, build a `Shopware\\Core\\Checkout\\Cart\\Price\\Struct\\QuantityPriceDefinition` with that price, the item's existing tax rules and quantity, run it through an injected `Shopware\\Core\\Checkout\\Cart\\Price\\QuantityPriceCalculator::calculate()`, and then call `$product->setPrice($calculated)` and `$product->setPriceDefinition($definition)`. Never query the database inside `process()` — always fetch data via the collector. Finally register the class in `src/Resources/config/services.php`, injecting `QuantityPriceCalculator`, and tag it with both `shopware.cart.processor` and `shopware.cart.collector` (giving it a priority, e.g. 4500, so it runs after the core product collector/processor).","citations":["developer/guides/plugins/plugins/checkout/cart/change-price-of-item.md:24-289"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -ipath '*cart*' -not -path '*/.git/*' | grep -i 'price|processor|collector'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/cart/change-price-of-item.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-18":{"query":"My plugin's cart processor adds a surcharge line item, but it is added again on every recalculation and its price is stale after the customer changes the quantity — how do I split the work between the collector and the processor?","category":"dev","option":"fs-docs","answer":"The corpus's cart guides confirm the intended split but do not spell out an explicit duplicate-guard example for a surcharge scenario, so this is a partial match. Per the documented pattern: the collector (implementing `CartDataCollectorInterface::collect(CartDataCollection $data, Cart $original, SalesChannelContext $context, CartBehavior $behavior)`) is the only place that should do data lookups — it should compute/fetch whatever the surcharge depends on and store it in `$data` (the shared `CartDataCollection`) under a unique key, e.g. `$data->set('uniqueKey', $newData)`; the guide explicitly warns 'Do not query data in the process method, since it may be executed a lot of times. Always use the collect method of a collector for this case!'. The processor (`CartProcessorInterface::process(CartDataCollection $data, Cart $original, Cart $toCalculate, SalesChannelContext $context, CartBehavior $behavior)`) then reads that data from `$data` and applies the actual change to `$toCalculate` (never to `$original`) — for a discount/surcharge line item this means building a `PercentagePriceDefinition` (or a `QuantityPriceDefinition` for an absolute surcharge, as shown in the price-overwrite guide) and calling `$this->calculator->calculate(...)` inside `process()`, using the definition and the calculator rather than a cached price, so the amount is recalculated from current cart state (including quantity) on every run — this is how staleness after a quantity change is avoided. Since `process()` runs on every cart recalculation, adding the line item unconditionally each time will duplicate it; the docs' own discount example only shows the unconditional `$toCalculate->add($discountLineItem)` call without demonstrating a guard against re-adding on subsequent calculations, so the specific 'check if the line item already exists in $toCalculate before adding it' step is not something the corpus documents explicitly [from memory] — both example processors register with tag `shopware.cart.processor` (priority 4500, after the core product processor) and `shopware.cart.collector`.","citations":["developer/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md:17-105","developer/guides/plugins/plugins/checkout/cart/add-cart-discounts.md:18-121"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -ipath '*cart*discount*' -o -ipath '*cart*surcharge*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/cart/add-cart-discounts.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md"},{"tool":"Bash","args":"grep -rln 'already exists|LineItemCollection has|toCalculate->has|remove.*lineItem|getLineItems()->has|idempotent' docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout --include=*.md"}],"notFoundClaim":false,"memoryClaims":["To avoid re-adding a surcharge/discount line item on every cart recalculation, a cart processor should check whether the line item (by its unique key/id) already exists in the $toCalculate cart before adding it, e.g. via $toCalculate->has($id) or checking the LineItemCollection, and update its price in place instead of always calling add()."],"sourceVerdict":"partial"},"dev-19":{"query":"I need to move long-running work in my plugin out of the request into the message queue — what does the handler class look like and how is it registered?","category":"dev","option":"fs-docs","answer":"First create a message class (a plain, serializable PHP object carrying the data the handler needs), e.g. `<plugin root>/src/MessageQueue/Message/SmsNotification.php`. By default messages are handled synchronously; implement `Shopware\\Core\\Framework\\MessageQueue\\AsyncMessageInterface` to make it asynchronous (or `LowPriorityMessageInterface` for the low-priority async queue, 6.5.7.0+). Dispatch it from a service by injecting `Symfony\\Component\\Messenger\\MessageBusInterface` and calling `$this->bus->dispatch(new SmsNotification($content));` (optionally wrapping it in an `Envelope` with stamps like `DelayStamp` for metadata/delay). The handler class itself needs no interface — mark it with the PHP attribute `#[AsMessageHandler]` and implement `__invoke(SmsNotification $message)`, which does the actual work, e.g.: `#[AsMessageHandler] class SmsHandler { public function __invoke(SmsNotification $message) { /* do work */ } }` placed at `<plugin root>/src/MessageQueue/Handler/SmsHandler.php`. Registration is via the DI container tag `messenger.message_handler`; multiple handlers can be registered for the same message. The handler is invoked once the message is dispatched by the `handle_messages` middleware.","citations":["developer/guides/plugins/plugins/framework/message-queue/add-message-handler.md:16-45","developer/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md:16-99"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -ipath '*message-queue*' -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/message-queue/add-message-handler.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-20":{"query":"How do I add my own condition to the Rule Builder from a plugin so shop owners can select it?","category":"dev","option":"fs-docs","answer":"Two parts are needed: PHP backend logic and an Administration UI registration. PHP: create a rule class in `<plugin root>/src/Core/Rule` extending `Shopware\\Core\\Framework\\Rule\\Rule`. Implement `getName(): string` (a unique technical name, e.g. 'first_monday'), `match(RuleScope $scope): bool` (the actual matching logic — never run database queries or other time-consuming operations here), and `getConstraints(): array` (the fields and their validation types, e.g. `['isFirstMondayOfTheMonth' => [new Type('bool')]]`). Fields used by the rule must be declared `protected`, not `private`. Register the class in `services.php` tagged as `shopware.rule.definition`. Optionally implement `getConfig(): RuleConfig` (e.g. `(new RuleConfig())->booleanField('isFirstMondayOfTheMonth')`) to let Shopware render the generic `sw-condition-generic` component and skip building a custom Administration component. Administration: decorate the `ruleConditionDataProviderService` (the RuleConditionService) via `Shopware.Application.addServiceProviderDecorator('ruleConditionDataProviderService', (ruleConditionService) => { ruleConditionService.addCondition('first_monday', { component: 'swag-first-monday', label: 'Is first monday of the month', scopes: ['global'] }); return ruleConditionService; });` in a decorator file under `src/Resources/app/administration/src/decorator/`, imported from `main.js`. The `component` name must match a custom Vue component (extending `sw-condition-base`, overriding the `sw_condition_value_content` twig block) that you build unless you used `getConfig()` for the generic renderer. Optionally group conditions with `ruleConditionService.upsertGroup(...)` and link via a `group` property on the condition. Because rules are 'context-aware', a newly added condition may not be selectable in every assignment location (e.g. promotions) unless you also configure awareness restrictions via `getAwarenessConfigurationByAssignmentName` / `addAwarenessConfiguration` on `ruleConditionDataProviderService`.","citations":["developer/guides/plugins/plugins/framework/rule/add-custom-rules.md:24-341"],"toolCallLog":[{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer -ipath '*rule*' -not -path '*/.git/*' | grep -iv 'reference|b2b'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/rule/add-custom-rules.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-21":{"query":"My plugin dispatches its own domain event — how do I make it show up as a trigger in the Flow Builder?","category":"dev","option":"fs-docs","answer":"Make your event class implement the FlowEventAware interface (and any other relevant Aware interfaces like CustomerAware, OrderAware, MailAware, etc. for the data/actions you need), giving it a getName() and static getAvailableData() (pre-6.5) or relying on Aware interfaces plus a FlowStorer (6.5+) to expose data to Flow Builder. Then register the event with the flow trigger list by creating an event subscriber that listens to Shopware\\Core\\Framework\\Event\\BusinessEventCollectorEvent, calling $businessEventCollector->define(YourEvent::class) and adding the resulting definition to the collection — with a high priority (e.g. 1000) so it registers before other subscribers. Register this subscriber in services.xml/php tagged 'kernel.event_subscriber'. Once installed, the event appears as a selectable trigger under Settings → Flow Builder → Add flow in the Administration.","citations":["developer/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md:1-409"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"find docs/shopware-knowledge-bases/developer/guides/plugins -maxdepth 3 -not -path '*/.git/*' | head -100"},{"tool":"Bash","args":"find developer/guides/plugins/plugins/framework, content, storefront, checkout subdirs -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-22":{"query":"How do I give my plugin a settings page the shop operator can fill in, and what field types are available?","category":"dev","option":"fs-docs","answer":"Create a src/Resources/config/config.xml file in your plugin; its contents are dynamically rendered as a configuration page in the Administration, no custom module or templating needed. Organize the page into one or more <card> elements (each needs a <title> and at least one <input-field>). Each <input-field> needs a unique <name> (4+ chars, letters/numbers, not starting with a number) and can take a type attribute; available input-field types are: text, textarea, text-editor, url, password, int, float, bool, checkbox, datetime, date, time, colorpicker, single-select, and multi-select. Fields also support label/placeholder/helpText (translatable via lang attribute), defaultValue, disabled, required, copyable, min/maxLength (text/url/password), min/max (int/float), and options (for single/multi-select). For more complex UI you can use a <component name=\"...\"> element to render supported admin components: sw-entity-single-select, sw-entity-multi-id-select, sw-media-field, sw-text-editor, and sw-snippet-field. Fields that affect cached storefront output should be marked cache-relevant=\"true\" (available from 6.7.12.0). After defining the config.xml and refreshing the Administration, the shop operator fills in values via Extensions → My extensions → Plugins → Configure.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md:1-478"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-23":{"query":"How do I ship a mail template with my plugin so it is installed automatically, including a custom mail template type?","category":"dev","option":"fs-docs","answer":"Use a plugin database migration (not the Administration) to insert the mail template. In the migration's update() method: (1) get an existing mail_template_type id (e.g. query mail_template_type WHERE technical_name = 'contact_form'), or create your own custom type by inserting a row into mail_template_type with a unique technical_name and an available_entities JSON column listing which entities the template may use (e.g. {'product':'product'}), plus corresponding mail_template_type_translation rows per language; (2) insert an entry into mail_template using that mail_template_type_id and system_default = 0; (3) insert a mail_template_translation row for each supported language (join language/locale to find the language_id) with sender_name, subject, description, content_html and content_plain. Use INSERT IGNORE so reinstalling/uninstalling the plugin doesn't throw errors, and never delete these templates on uninstall since other entities may reference them. Once the plugin is installed, the mail template (and custom type, if created) is available in Shopware automatically.","citations":["developer/guides/plugins/plugins/content/mail/add-mail-template.md:1-309"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/content/mail/add-mail-template.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-24":{"query":"How do I get readable SEO URLs generated for the detail pages of my plugin's own entity?","category":"dev","option":"fs-docs","answer":"For a custom DAL entity with its own storefront detail route, implement dynamic SEO URLs for entities: (1) Create a class implementing SeoUrlRouteInterface (e.g. ExamplePageSeoUrlRoute) with getConfig() returning a SeoUrlRouteConfig (entity definition, route technical name, default SEO template like '{{ example.name }}', and canonical flag), prepareCriteria() to filter/add associations to the entities used for generation, and getMapping() returning a SeoUrlMapping with the route parameters (e.g. ['exampleId' => $entity->getId()]) and the template data (e.g. ['example' => $exampleJson]). Register this class in services.php tagged 'shopware.seo_url.route'. (2) Add an event subscriber listening to your entity's '<entity>.written' (and '.deleted') DAL events that calls Shopware\\Core\\Content\\Seo\\SeoUrlUpdater::update($routeName, $event->getIds()) to regenerate/update SEO URLs whenever entities are written, and mark is_deleted accordingly on deletion. (3) Add a plugin migration inserting a row into seo_url_template with route_name, entity_name (your entity's technical name) and template (matching the DEFAULT_TEMPLATE constant). After this, every time the entity is written, Shopware automatically generates a readable SEO URL for its detail page.","citations":["developer/guides/plugins/plugins/content/seo/add-custom-seo-url.md:150-408"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/content/seo/add-custom-seo-url.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-25":{"query":"How do I add a `bin/console` command to my plugin for a maintenance task?","category":"dev","option":"fs-docs","answer":"Shopware CLI commands are based on Symfony Console, so plugin commands follow the standard Symfony approach: create a command class (e.g. src/Command/ExampleCommand.php) extending Symfony\\Component\\Console\\Command\\Command, using the #[AsCommand(name: 'swag:example', description: '...')] attribute, and implementing execute(InputInterface $input, OutputInterface $output): int. Then register the class as a service in the plugin's src/Resources/config/services.php and tag it with 'console.command', e.g. $services->set(Swag\\BasicExample\\Command\\ExampleCommand::class)->tag('console.command'). Commands registered this way are automatically available via bin/console once the plugin is installed/active.","citations":["developer/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md:1-48"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-26":{"query":"How do I add a custom document type such as a pro-forma invoice in Shopware 6.7?","category":"dev","option":"fs-docs","answer":"Shopware 6.7 includes a reworked Document System (v2), which is experimental and activated with the DOCUMENT_GENERATION_REWORK feature flag (its API can change until it becomes the default in 6.8). To add a custom document type: (1) Create a document type class extending Shopware\\Core\\Checkout\\DocumentV2\\Type\\AbstractDocumentType, defining a TECHNICAL_NAME constant, getTechnicalName(), and getSupportedFormats() (e.g. ['html','pdf']). (2) Provide the data: create a render data DTO extending AbstractRenderData with public properties that will be exposed to the template's config variable, and a data provider extending AbstractDocumentDataProvider implementing getKey(), supports(string $documentType), enrichOrderCriteria(Criteria $criteria) (to add needed associations like lineItems), and provideRenderingData(ProviderInput $input, Context $context) returning your render data DTO. (3) Register both the type (tag 'shopware.document_v2.type') and the provider (tag 'shopware.document_v2.provider') as services in services.php. (4) Add an HTML template at src/Resources/views/documents/<technical_name>.html.twig extending '@Framework/documents/base.html.twig' (and an XML template under documents/zugferd/ if the zugferd_xml format is supported), using {{ config.<property> }} to access DTO data. (5) Add database entries via migration: a document_type row whose technical_name matches your type (needed because the document table has a foreign key on it), and a number range of type document_<technical_name> to number generated documents — the migration code is identical to the legacy document system's document-type and number-range migrations.","citations":["developer/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md:1-162"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-27":{"query":"In Shopware 6.7, how do I extend a Storefront Twig template from my plugin with `{% extends %}` so I keep the core markup and other plugins' changes?","category":"dev","option":"fs-docs","answer":"In Shopware Storefront templates you should not use Twig's plain {% extends %} tag; instead use the custom {% sw_extends %} tag, which has the same API as Twig's default extends but adds support for multi inheritance so your override and other plugins'/apps' overrides of the same template can co-exist (official support for complete Twig multi inheritance using the sw_* equivalents like sw_extends, sw_include, sw_embed, sw_use, sw_import, sw_from is available since Shopware 6.7). To override a core template: register your plugin's view path (Shopware looks in <plugin root>/src/Resources/views), find the original file's path inside the Storefront bundle, recreate the identical directory structure under your plugin's views directory with a file of the same name, and begin that file with '{% sw_extends '@Storefront/<path>/<file>.html.twig' %}'. Then override individual Twig blocks from the original template in your file (optionally calling {{ parent() }} to keep the original block content and append to it) — this preserves the core markup and lets your changes stack with other plugins that also extend the same template via sw_extends. Clear the cache (bin/console cache:clear) and ensure your theme is assigned to the sales channel to see the change.","citations":["developer/guides/plugins/plugins/storefront/templates/twig-function-reference.md:1-40","developer/guides/plugins/plugins/storefront/templates/customize-templates.md:1-129"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/templates/customize-templates.md"},{"tool":"Bash","args":"grep -rn 'sw_extends|{% extends' docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/templates/"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/templates/twig-function-reference.md, limit=40"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-28":{"query":"How do I override an existing Storefront JavaScript plugin, such as the cookie permission bar, from my own plugin instead of registering a new one?","category":"dev","option":"fs-docs","answer":"Storefront JS plugins are vanilla JavaScript classes, so you extend them directly. Create a new class file (e.g. <plugin root>/src/Resources/app/storefront/src/my-cookie-permission/my-cookie-permission.plugin.js) that imports the original plugin (e.g. 'src/plugin/cookie/cookie-permission.plugin') and extends it, e.g. 'export default class MyCookiePermission extends CookiePermissionPlugin {}'. If you can't import the original class directly (e.g. third-party plugin with no alias), retrieve it via window.PluginManager.getPlugin('CookiePermission').get('class'). Override whichever methods you need (calling super.methodName() to preserve/extend original behavior, e.g. overriding init() or _hideCookieBar()). Then, in your plugin's main.js entry point, register the override using PluginManager.override('CookiePermission', MyCookiePermission, '[data-cookie-permission]') instead of PluginManager.register() — this tells Shopware to replace the existing plugin rather than add a new one. If the original plugin is registered asynchronously, use an async/dynamic import in the override call as well. Note: each JS plugin can only be overridden once — if two Shopware plugins try to override the same plugin, only the last one actually takes effect. Rebuild the Storefront (e.g. shopware-cli project storefront-build) to see the change.","citations":["developer/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md:1-151"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-29":{"query":"How do I add my own data to an existing Storefront page or pagelet from a plugin without overriding the core controller?","category":"dev","option":"fs-docs","answer":"Every page and pagelet fires a 'Loaded' event once it's built (e.g. FooterPageletLoadedEvent for the FooterPagelet). Create an event subscriber implementing EventSubscriberInterface that listens to that Loaded event and register it in services (tag 'kernel.event_subscriber'). Since you're inside a page/pagelet event you should not call the DAL directly — instead fetch your additional data through an existing or new store-api route (see the store-api route guide for creating one if no suitable route exists). In the subscriber's handler method, load the data via the route and attach it to the page/pagelet using $event->getPagelet()->addExtension('your_key', $data) (or $event->getPage()->addExtension(...) for pages) — this makes the data available in the template under <page/pagelet>.extensions.your_key. Finally, extend the relevant Storefront Twig template with {% sw_extends %} and override the appropriate block to render the new extension data (e.g. {{ footer.extensions.product_count.count }}), calling {{ parent() }} to keep the original block content. This approach adds data without touching or overriding the core controller.","citations":["developer/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md:1-322"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-30":{"query":"How do I add a custom filter to the Storefront product listing from my plugin, both the criteria side and the filter panel?","category":"dev","option":"fs-docs","answer":"Criteria side: create an event subscriber (e.g. ExampleListingSubscriber) listening to Shopware\\Core\\Content\\Product\\Events\\ProductListingCollectFilterEvent. In the handler, get the existing filters via $event->getFilters() and the request via $event->getRequest(), then build a new Shopware\\Core\\Content\\Product\\SalesChannel\\Listing\\Filter (or equivalent Filter class) with: name (unique filter name), filtered (bool, whether it's currently active, typically derived from the request parameter), aggregations (array of aggregations backing the filter, e.g. a FilterAggregation wrapping a MaxAggregation), filter (the actual DAL filter to add to the criteria, e.g. EqualsFilter('product.isCloseout', true)), and values (the values added as currentFilter to the result). Add it to the collection with $filters->add($filter).\n\nFilter panel UI side: extend the core template src/Storefront/Resources/views/storefront/component/listing/filter-panel.html.twig using {% sw_extends %}, and override the block component_filter_panel_items (available since Shopware 6.4.8.0) — call {{ parent() }} first/last to control ordering, then use {% sw_include %} to include one of the built-in filter components (filter-boolean, filter-multi-select, filter-property-select, filter-range, filter-rating-select/filter-rating-select-item) with your filter's name and displayName. To position your filter next to a specific existing filter (e.g. right after price), instead override that filter's specific block, e.g. component_filter_panel_item_price.","citations":["developer/guides/plugins/plugins/storefront/howto/add-listing-filters.md:1-182"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/howto/add-listing-filters.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-31":{"query":"How do I expose a plugin configuration value, such as a colour picked in the Administration, as an SCSS variable in my Storefront styling?","category":"dev","option":"fs-docs","answer":"The recommended way is to declare it directly in your plugin's config.xml: add a <css> tag inside the <input-field> whose value is the SCSS variable name (e.g. sass-plugin-header-bg-color), alongside a <defaultValue>. Shopware exposes this config value as an SCSS variable automatically, taking either the value set in the Administration or the default value. Note the theme must be recompiled manually after the value changes for the change to take effect. You should also provide a fallback in your own base.scss using `!default` (e.g. `$sass-plugin-header-bg-color: #ffcc00 !default;`). If you need more flexibility (e.g. computing the value, or reading it per sales channel with custom logic), you can instead use a subscriber listening to the ThemeCompilerEnrichScssVariablesEvent, inject SystemConfigService, read the config value via `$this->systemConfig->get('YourPlugin.config.fieldName', $event->getSalesChannelId())`, and call `$event->addVariable('sass-plugin-header-bg-color', $value)`. This subscriber approach also allows looping over all config fields and converting camelCase names to kebab-case via CamelCaseToSnakeCaseNameConverter.","citations":["developer/guides/plugins/plugins/storefront/styling/add-scss-variables.md:1-57","developer/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md:1-250"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/index.md"},{"tool":"Bash","args":"find developer/guides/plugins -maxdepth 4 -not -path '*/.git/*'"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/storefront/styling/add-scss-variables.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-32":{"query":"How do I define a custom field set for products from my plugin so merchants can edit the values in the Administration?","category":"dev","option":"fs-docs","answer":"There are two supported ways to declare a custom field set that becomes editable in the Administration (products already ship with a generic 'Custom fields' tab, so no custom module code is required for the set itself to appear). 1) Declarative (recommended, available since Shopware 6.7.13.0): ship a `Resources/config/custom-fields.xml` file under your plugin's `src` directory; Shopware automatically creates/updates/removes the defined sets and fields during the plugin lifecycle (install/update/uninstall) - no CustomFieldsInstaller service or lifecycle hook code needed. The XML format matches the one used in app manifests for custom fields. 2) Imperative: inject the `custom_field_set.repository` service (via `services.php`) and, typically in a plugin lifecycle hook such as install/activate, call `$this->customFieldSetRepository->create([...], $context)` with a payload containing `name` (vendor-prefixed, e.g. swag_example_set), `config.label` translations, and a `customFields` array where each field has a `name`, a `type` (from `CustomFieldTypes`), a `config.label` translation, and optionally `config.customFieldPosition` to order fields and `includeInSearch` (since 6.7.6.0) to make it searchable. To restrict the set to products, its `relations` must reference the `product` entity (the Administration's custom-field-set-renderer filters by `relations.entityName == 'product'`). Custom field names must be globally unique and vendor-prefixed. On uninstall, remove the custom field set (and clean up existing customFields JSON data) via the repository's delete method or a batched SQL JSON_REMOVE update for large tables. Setting `global` to false lets merchants edit/delete the set themselves in the Administration.","citations":["developer/guides/plugins/plugins/framework/custom-field/add-custom-field.md:179-374"],"toolCallLog":[{"tool":"Bash","args":"grep -rl \"custom_field_set\" docs/shopware-knowledge-bases/developer --include=*.md | grep -v administration"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/framework/custom-field/add-custom-field.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/data-handling-processing/using-custom-fields.md"},{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/module-component-management/add-custom-field.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-33":{"query":"How do I register a custom Administration module from my plugin, and what has to line up for it to actually show up after a build?","category":"dev","option":"fs-docs","answer":"Create a directory `<plugin root>/src/Resources/app/administration/src/module/swag-example` with an `index.js` file (Shopware requires each module to have an index.js). Import that module directory from your plugin's `main.js` entry point (`import './module/swag-example';`) so it gets picked up. Inside index.js, register the module with `Shopware.Module.register('swag-example', { ... })`, a wrapper around the internal ModuleFactory's registerModule. The configuration object needs: a `type` ('plugin' for third-party modules, by convention only, not strictly validated except for the special 'plugin' case), a unique `name`, `title`/`description` (as Vue-i18n snippet keys), `color` and `icon` (used for the module's main icon, global search tag, and smart bar accent - not the menu icon, which is configured separately via the menu entry guide), a `routes` object defining list/detail/create routes tied to components, and optionally a `navigation` entry or `settingsItem` (with group 'shop'/'system'/'plugins', icon, and `to` route name) to link it into Settings. Translation snippets are provided via a `snippets` object (or a `snippet/de-DE.json` and `snippet/en-GB.json` pair loaded automatically by folder structure), keyed and prefixed by your module/extension name. For the module to actually appear after a build: the main.js entry point must import the module, `Shopware.Module.register()` must be called with correctly named routes and existing components, and snippets must supply the text used in title/description/menu label - build success (via `shopware-cli project admin-build` or, in a platform/contribution setup, `composer run build:js:admin`) only means the assets compiled; the module still depends on its entry-point import, registration, routes/components, and snippets being correctly wired at runtime. The plugin must also be activated for the JS to be picked up, and the compiled file (e.g. `<plugin root>/src/Resources/public/administration/js/<plugin-name>.js`) must be included when publishing the plugin so it is copied to `<shopware root>/public/bundles/administration/<plugin>/administration/js/...` for production.","citations":["developer/guides/plugins/plugins/administration/module-component-management/add-custom-module.md:1-319"],"toolCallLog":[{"tool":"Read","args":"file_path=docs/shopware-knowledge-bases/developer/guides/plugins/plugins/administration/module-component-management/add-custom-module.md"}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-34":{"query":"How do I extend an existing Administration component and its Twig blocks from my plugin, for example to change the dashboard headline?","category":"dev","option":"fs-docs","answer":"Use `Shopware.Component.override('component-name', { template })` to overwrite an existing component's behavior in place, or `Shopware.Component.extend('new-name', 'existing-name', { template })` to create a brand new component based on an existing one. To customize just the markup, find the Twig block you want to change in the target component's original template, then declare a template file that redeclares that same block name; you can either replace its content entirely or call `{% parent %}` inside your block to keep the original markup and add to it. For methods/computed properties, extend the component and override the method; call `this.$super('methodName')` inside it to still invoke the original implementation if you only want to augment rather than replace behavior. For the concrete dashboard-headline example: the dashboard template is `sw-dashboard-index`, and the specific block controlling the headline is `sw_dashboard_index_content_intro_content_headline` (found by inspecting the core sw-dashboard-index.html.twig). Steps: 1) create `<plugin root>/src/Resources/app/administration/src/sw-dashboard-index-override/sw-dashboard-index.html.twig` containing `{% block sw_dashboard_index_content_intro_content_headline %} <h1>Welcome to a customized component<\/h1> {% endblock %}` (optionally include `{% parent %}` to retain original content); 2) create `.../sw-dashboard-index-override/index.js` with `import template from './sw-dashboard-index.html.twig'; Shopware.Component.override('sw-dashboard-index', { template });`; 3) import that index.js from your plugin's `main.js` entry point (`import './sw-dashboard-index-override/';`), which Shopware automatically discovers under `<plugin root>/src/Resources/app/administration/src`. There is also a newer, experimental Composition API extension system (`Shopware.Component.createExtendableSetup` / `
