omponent or template?","category":"dev","option":"mcp-wiki","answer":"Admin privileges are identifiers made of a key and a role joined by a dot (e.g. product.viewer). Register a privilege with the privilege service's addPrivilegeMappingEntry, conventionally from a <component>/acl/index.js imported by <component>/index.js, called before the roles detail page is visited: `Shopware.Service('privileges').addPrivilegeMappingEntry({ category: 'permissions', parent: null, key: 'your_key', roles: { viewer: { privileges: ['entity_name:operation'], dependencies: [] }, editor: {...}, creator: {...}, deleter: {...} } });` — use category 'permissions' for normal CRUD-style roles (viewer/editor/creator/deleter) or 'additional_permissions' for a non-CRUD custom role key. You can reuse another mapping's privileges with `Shopware.Service('privileges').getPrivileges('rule.viewer')`. Protect a route, menu entry, or settings item by adding `meta: { privilege: 'your_key.your_role' }` to its config; protect a shortcut by giving it an object with an active() method instead of a plain key binding. Add snippet translations at `sw.privileges.${category}.${key}.label` (and `.${role_key}` for additional_permissions). To check a privilege anywhere, inject the acl service and call `acl.can('key.role')`, e.g. `this.acl.can('sales_channel.creator')` in a component method, or `v-if=\"acl.can('review.editor')\"` in a template. To ship additional privileges onto existing roles from PHP, override `Plugin::enrichPrivileges()`, returning e.g. `['product.viewer' => ['my_custom_privilege:read']]`. Note: ACL rules in the Administration UI only gate visibility/behavior in the UI — they can be bypassed via direct API calls, which are not gated by them; and granting a role's viewer privilege does not by itself grant access to a related Administration module, which must be granted separately.","citations":["platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:1-72"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"ACL privileges","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-37":{"query":"How do I set up and run PHPUnit integration tests for my Shopware plugin, including tests that boot the kernel?","category":"dev","option":"mcp-wiki","answer":"Create a phpunit.xml in the plugin root — it can be autogenerated via `bin/console plugin:create` — pointing bootstrap at tests/TestBootstrap.php and setting KERNEL_CLASS to Shopware\\Core\\Kernel and APP_ENV to test, e.g.: `<phpunit bootstrap=\"tests/TestBootstrap.php\" executionOrder=\"random\"><coverage><include><directory>./src/<\/directory><\/include><\/coverage><php><server name=\"KERNEL_CLASS\" value=\"Shopware\\Core\\Kernel\"/><env name=\"APP_ENV\" value=\"test\"/><\/php><testsuites><testsuite name=\"migration\"><directory>Migration/Test<\/directory><\/testsuite><testsuite name=\"Example Testsuite\"><directory>Test<\/directory><\/testsuite><\/testsuites><\/phpunit>`. `plugin:create` also generates tests/TestBootstrap.php, which uses Shopware\\Core\\TestBootstrapper with ->addCallingPlugin(), ->addActivePlugins(...), and ->setForceInstallPlugins(true) — the last of which ensures your plugin gets installed and activated even when the test database already exists. For an integration test that boots the kernel, extend PHPUnit\\Framework\\TestCase and use the Shopware\\Core\\Framework\\Test\\TestCaseBase\\IntegrationTestBehaviour trait, which gives automatic database transactions and cache clearing per test; for a migration test, use the KernelTestBehaviour trait for container/database access and name the test class <MigrationClassName>Test. To vary service wiring only for tests, add <plugin root>/Resources/config/services_test.php, which overrides Resources/config/services.php in the test environment (arguments, aliases, or parameters). Run the tests with `./vendor/bin/phpunit --configuration=\"custom/plugins/SwagBasicExample\" --testsuite \"migration\"` (omit --testsuite to run all suites, or use --filter <ClassOrMethod> to run a single class/method). To use PHPUnit at all you need the flex template's dev-tools package, installed via `composer require --dev dev-tools`.","citations":["platform/dev/6.7/guides/development/testing/unit/php-unit.md:1-62"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"integration test","path":"platform/dev/6.7/guides/development/testing","mode":"files"}},{"tool":"list_docs","args":{"path":"platform/dev/6.7/guides/development/testing"}},{"tool":"grep_docs","args":{"pattern":"integration test","path":"platform/dev/6.7/guides/plugins","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/development/testing/unit/php-unit.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-38":{"query":"How do I write Jest unit tests for my Administration components in Shopware 6.7?","category":"dev","option":"mcp-wiki","answer":"Test files live next to the file under test, named with suffix .spec.js or .spec.ts. Plain services and isolated ES modules can be imported and tested directly without mocking, e.g. `import Sanitizer from 'src/core/helper/sanitizer.helper'; describe('core/helper/sanitizer.helper.js', () => { it('should sanitize the html', () => { ... }); });`. Administration components are registered globally via `Shopware.Component.register('name', {...})` and built into a real Vue component with `Shopware.Component.build('name')`, which resolves template inheritance/overrides — this is important because Administration components support template inheritance and third-party extendability, so tests are more involved than plain Vue tests. You can generate test boilerplate with `composer run admin:create:test` (paste the component/service path when prompted), after installing JS dependencies with `composer run init:js`. Mount the built component with `mount()` or `shallowMount()` (preferred, since it stubs child components) from @vue/test-utils, passing props, stubs, mocks, and attachTo: document.body as needed. Several preconfigured mocks/globals are available: `global.activeAclRoles = ['product.editor']` for ACL, `global.activeFeatureFlags = ['FEATURE_NEXT_12345']` for feature flags, and `global.repositoryFactoryMock.responses.addResponse({ method, url, status, response })` to mock repository calls (disable the missing-mock warning via `global.repositoryFactoryMock.showWarning = false`). Global mocks like $tc, $device, $store, $router can be overridden via mount's mocks option; missing directives (e.g. clipboard) require createLocalVue() plus localVue.directive(...); missing injections (e.g. mediaService) can be stubbed via a `provide` option or registered globally with `Shopware.Service.register('mediaService', {...})` in beforeAll. Run all tests with coverage via `composer run admin:unit`, or only changed-file tests in watch mode via `composer run admin:unit:watch`. Unresolved child components, directives, injections, or services surface as [Vue warn] messages during test runs and must be stubbed or mocked explicitly.","citations":["platform/dev/6.7/guides/development/testing/unit/jest-admin.md:1-57"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"jest","path":"platform/dev/6.7/guides/development/testing","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/development/testing/unit/jest-admin.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-39":{"query":"How do I write end-to-end Cypress tests for my plugin against a Shopware 6.7 store?","category":"dev","option":"mcp-wiki","answer":"Important caveat first: in the 6.7 docs, Cypress-based E2E testing is explicitly marked legacy — 'Cypress has been deprecated and is no longer maintained; use Playwright for new projects instead.' If you still need to work with an existing Cypress suite, the (legacy) approach is: start from a clean Shopware installation (no categories, products, or settings) initialized with `composer run init`, and install E2E dependencies with `npm install` in the relevant E2E folder (e.g. src/Administration/Resources/app/administration/test/e2e); tests run against production mode and a theme must be assigned. The test suite package is @shopware-ag/e2e-testsuite-platform, built on Cypress plus the plugins cypress-select-tests, cypress-log-to-output, and cypress-file-upload; it provides commands, helpers, and test-data management. For a plugin, create the folder structure Resources/app/<environment>/test/e2e/cypress/{fixtures,integration,plugins,support}, run npm init -y, install @shopware-ag/e2e-testsuite-platform, then create e2e/cypress/plugins/index.js requiring @shopware-ag/e2e-testsuite-platform/cypress/plugins and e2e/cypress/support/index.js requiring @shopware-ag/e2e-testsuite-platform/cypress/support. On the platform project (Docker), run `composer run e2e:setup` (outside the container, first-time prep), `composer run e2e:prepare` (inside the container if already clean), then `composer run e2e:open` (outside, opens the runner), or in CLI: `composer e2e:cypress -- run --spec=\"cypress/e2e/administration/**/*.cy.js\"`. Test files go under fixtures (static JSON via cy.fixture), integration (*.spec.js test files, placed in one of the recognized subfolders — catalogue, content, customer, general, media-marketing, order, rule-product-stream, settings — or CI won't pick them up), plugins, and support (custom commands/global overrides). Use describe()/context() to group tests and it() (Shopware's convention, over specify()) for individual tests; prefer beforeEach cleanup over after/afterEach since a failed test can skip the latter. Create test fixtures through the REST API rather than the UI, via ApiService (wraps axios) and cy.createDefaultFixture(endpoint, data, jsonPath); custom fixture services extend AdminFixtureService/FixturesService under cypress/support/service/. Avoid relying on UUID-based IDs as test selectors since they can change between installations.","citations":["platform/dev/6.7/guides/development/testing/legacy/_index.md:1-22","platform/dev/6.7/guides/development/testing/legacy/cypress/_index.md:1-46"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"cypress","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/development/testing/legacy/cypress/_index.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/development/testing/legacy/_index.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-40":{"query":"How do I upgrade a Composer-based Shopware project from 6.6 to 6.7 — which composer.json constraint do I change, and which console commands do I run afterwards?","category":"dev","option":"mcp-wiki","answer":"The recommended path, from a clean Git working tree, is the Shopware CLI upgrade wizard: `shopware-cli project upgrade` (it checks readiness, target version selection, Composer-managed extension compatibility, and resolves the target dependency set before applying the upgrade locally); for CI or a read-only check use `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run`. If the wizard can't be used, the manual Composer process is: (1) enable maintenance mode with `bin/console sales-channel:maintenance:enable --all`; (2) adjust the shopware (and shopware/commercial, if used) version constraints in composer.json, then run `composer update --no-scripts` (the --no-scripts flag avoids running scripts that depend on not-yet-updated recipes) — failing to bump the composer.json constraints first means composer update just resolves to the currently installed version and no real upgrade happens; (3) optionally force-update Symfony Flex-managed config files with `composer recipes:update`; (4) finalize with `bin/console system:update:finish`, which runs the database migrations and recompiles themes; (5) disable maintenance mode with `bin/console sales-channel:maintenance:disable --all`. Also avoid skipping major versions unless the full upgrade path has been explicitly tested.","citations":["platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md:1-55"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"upgrade","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-41":{"query":"`composer update` to Shopware 6.7 aborts on a platform requirement and my admin build then fails too — which PHP, database and Node versions does 6.7 actually require, and how do I check the machine I am on against them before I retry?","category":"dev","option":"mcp-wiki","answer":"Shopware 6.7's recommended production/dev stack (minimum → recommended) is: PHP `8.2+` → `8.4`, with `memory_limit >= 512M` and `max_execution_time >= 30s`, and required extensions `ctype`, `curl`, `dom`, `fileinfo`, `gd`, `iconv`, `intl`, `mbstring`, `openssl`, `pcre`, `pdo_mysql`, `phar`, `simplexml`, `xml`, `xmlreader`, `zip`, `zlib` (optional `amqp`); Composer `2.2+` is recommended. Database: MariaDB `>= 10.11.6` or MySQL `>= 8.0.22` (Innovation releases are unsupported) → MariaDB `11.4` / MySQL `8.4`, with `max_allowed_packet >= 32M`. Node.js/npm (needed for the admin/storefront build): `Node 20.0.0+` → `Node 24 / npm 10`. To check your own machine against these before retrying `composer update`, run: `php -v`, `php -m` (and `php -i | grep memory_limit` to confirm the memory limit), `composer -V`, `node -v`, and `npm -v`. Note that multiple PHP versions/php.ini files can coexist on one machine, so make sure the CLI and FPM binaries you're checking are the ones actually used for the update and build. On macOS with Homebrew PHP, the `intl` extension often needs a separate `brew install php-intl`. These stack requirements are listed separately from pure workstation hardware/OS requirements (CPU, RAM, disk, OS) which are covered on a different system-requirements page.","citations":["platform/dev/6.7/guides/hosting/_index.md:1-40"],"toolCallLog":[{"tool":"kb_status","args":{}},{"tool":"read_doc","args":{"path":"platform/index.md"}},{"tool":"grep_docs","args":{"pattern":"system requirements","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"PHP","path":"platform/dev/6.7","glob":"**/*requirement*"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/installation/system-requirements.md"}},{"tool":"grep_docs","args":{"pattern":"PHP","path":"platform/dev/6.7","glob":"**/hosting/**"}},{"tool":"grep_docs","args":{"pattern":"Node","path":"platform/dev/6.7","glob":"**/hosting/**"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/hosting/_index.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-42":{"query":"How do I check extension compatibility before upgrading with shopware-cli, and why does it report my plugins in custom/plugins as blocking?","category":"dev","option":"mcp-wiki","answer":"Use `shopware-cli project upgrade`, which runs a local-first, six-phase wizard (readiness, version choice, extension/Composer analysis, plan review, apply, report) — the extension/Composer analysis phase is exactly what surfaces extension compatibility issues before any files change. It requires that `composer.lock` already contains an installed `shopware/core` version, that the Git working tree is clean, that all extensions are Composer-managed, and that PHP/Composer are available. You can preflight it non-interactively with `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run`, and it writes a report to `.shopware-cli/upgrade/report.md`. For static-analysis-level compatibility checking of your own code against a target Shopware version, also run `shopware-cli project validate --only phpstan` before upgrading to detect breaking changes in custom code. The reason plugins under `custom/plugins/` block the upgrade is the 'all extensions are Composer-managed' prerequisite: plugins that are only locally managed (not required via Composer) fail that readiness check, so they have to be migrated to Composer management first with `shopware-cli project autofix composer-plugins` before the upgrade wizard can proceed. Also note that `shopware-cli extension validate` (basic mode needs no local PHP/Node; `--full` mode adds phpstan/eslint/stylelint/twig linters and needs PHP 8.2+, Node.js 20+, Composer and npm on the host) is the per-extension counterpart used to validate an individual plugin/app before upload or upgrade, with per-extension overrides in `.shopware-extension.yml` (e.g. `validation.php_version`) and ignorable findings via `validation.ignore`.","citations":["platform/dev/6.7/products/tools/cli/project-commands/upgrade.md:1-69","platform/dev/6.7/products/tools/cli/validation.md:1-77"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"extension compatibility","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"shopware-cli","path":"platform/dev/6.7","glob":"**/*compat*"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/products/tools/cli/project-commands/upgrade.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/products/tools/cli/validation.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-43":{"query":"My admin plugin still ships a webpack.config.js — how do I move the administration build to Vite for Shopware 6.7?","category":"dev","option":"mcp-wiki","answer":"Shopware 6.7 replaces the Webpack-based build for the Administration's Vue.js application with Vite (Webpack had become slow and its maintainers/loaders stopped receiving significant updates); this is noted as a future-development-roadmap article, so timelines/details may still change. This matters if your plugin extends the Administration build via a custom `webpack.config.js` — apps are unaffected since their build is already decoupled from Shopware. To migrate: (1) create `vite.config.mts` in `YourApp/src/Resources/app/administration/src` (replacing the old `webpack.config.js` that lived under `YourApp/src/Resources/app/administration/build/`); (2) remove the old `webpack.config.js`; (3) remove Webpack-related dependencies from `package.json`; (4) add the Vite dependencies to `package.json`. A minimal `vite.config.mts` looks like:\n```typescript\nimport { defineConfig } from 'vite';\n\nexport default defineConfig({\n    resolve: {\n        alias: {\n            '@example': 'src/example',\n        },\n    },\n});\n```\nYou can test the new system via the feature flag `ADMIN_VITE`. Bundle/plugin info is written to `<shopwareRoot>/var/plugins.json` by `Shopware\\Core\\Framework\\Plugin\\Command\\BundleDumpCommand` (`bin/console bundle:dump`, or as part of `composer build:js:admin`/`watch:admin`). The core Vite config is at `<shopwareRoot>/src/Administration/Resources/app/administration/vite.config.mts` (core only); extensions are built via `<shopwareRoot>/src/Administration/Resources/app/administration/build/plugins.vite.ts`, still invoked through `composer build:js:admin`. In production, asset info comes from the `/api/_info/config` API call and is loaded through the Symfony bundle `pentatrion_vite` plus its `entrypoints.json` (generated by `vite-plugin-symfony`); in dev/HMR mode, `shopware-vite-plugin-serve-multiple-static` serves an `sw-plugin-dev.json` requested by `application.ts`. Gotcha: Vite can only hot-reload `.vue` files, so HMR stays limited until templates fully move to Single File Components; the `vue-globals` plugin rewrites Vue imports to destructure from `Shopware.Vue` to avoid multiple Vue instances, and `override-component` auto-registers `*.override.vue` files via `Shopware.Component.registerOverrideComponent`.","citations":["platform/dev/6.7/guides/upgrades-migrations/administration/vite.md:1-58"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"Vite","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/upgrades-migrations/administration/vite.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-44":{"query":"After the Vue 3 upgrade my admin plugin broke — this.$parent resolves to the wrong component and a prop default that calls this.$tc throws. What do I have to change?","category":"dev","option":"mcp-wiki","answer":"The Shopware Administration moved from Vue.js 2 (EOL December 31, 2023) to Vue.js 3 starting with Shopware 6.6, and plugins with custom Administration code generally need refactoring (app-based extensions are unaffected). Both symptoms you describe are documented, known pitfalls: `this.$parent` is unreliable in Vue 3 because Vue 3 wraps components in an `AsyncComponentWrapper`, so `this.$parent` can point to the wrapper instead of the real parent — sometimes you need `this.$parent.$parent`, but the recommended fix is to stop relying on `$parent` and use services or event communication instead. For the prop-default `this.$tc` failure: prop default functions in Vue 3 no longer have access to `this`, so calling `this.$tc` inside a prop default throws — replace it with `Shopware.Snippet.tc` (which does not depend on the component instance) instead of `this.$tc`. More broadly, when migrating: align your plugin's npm dependencies with the Administration's `package.json`, replace all `sw-field` usages with their dedicated component replacements, check `v-model` usage, event listeners, deprecated slot syntax, `router-view` transition combinations, `key` attributes and filter usages against the official Vue 3 migration guide, and search your code for other `this.$` internal-API calls (most break except `this.$tc` itself when called from a normal method, as opposed to a prop default). Also note lifecycle hooks like `@hook:mounted` may fire twice for async components (once for the wrapper, once for the underlying component), Vuex stores lose reactivity if a getter mutates state, checking `this.$slots` for a slot name is no longer sufficient (verify it contains an actual v-node), form fields no longer keep the previous DOM id (add a unique `name` attribute), and mutating props now throws hard errors instead of being silently allowed. Test with `composer run watch:admin` and optionally enable the Vue 3 ESLint rule set. A single plugin version cannot support both 6.5 and 6.6+; you need separate Store versions (e.g. `1.x` for 6.5.x, `2.0` for 6.6+).","citations":["platform/dev/6.7/guides/upgrades-migrations/administration/vue3.md:1-48"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"Vue 3","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/upgrades-migrations/administration/vue3.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-45":{"query":"Shopware.State is deprecated in 6.7 — how do I convert my administration Vuex module into a Pinia store?","category":"dev","option":"mcp-wiki","answer":"With Shopware 6.7, Vuex is replaced by Pinia as the Administration's state management library. To migrate a Vuex module to Pinia, register the store with `Shopware.Store.register('<storeName>', { state, getters, actions })`, where `state` must be a function returning the initial state (not a static object), for example:\n```javascript\nconst store = Shopware.Store.register('<storeName>', {\n    state: () => ({ /* initial state */ }),\n    getters: { /* ... */ },\n    actions: { /* ... */ },\n});\nexport default store;\n```\nA store can also be registered with an `id` property instead of a name argument; re-registering an existing store id overwrites it, and `Shopware.Store.unregister('<storeName>')` removes one. To actually register the store, simply import its file — `import './state/products.state'` replaces the old `Shopware.State.registerModule('product', productsStore)` call. Key differences from Vuex: mutations are removed entirely — update state directly inside actions (e.g. `this.productName = newName`); getters cannot share a name with a state property since both are exposed at the same level; for TypeScript, define `StoreType` via `ReturnType<typeof store>` and extend the global `PiniaRootState` interface with it; stores can also be defined as composables returning reactive refs/computed/functions (Pinia devtools only track returned variables/functions); and all read access changes from `Shopware.State.get('<storeName>')` to `Shopware.Store.get('<storeName>')`. For tests, import the store file to register it and call `store.$reset()` in `beforeEach`; component tests using Pinia stores should call `setActivePinia(pinia)` with a `createPinia()` instance and pass `plugins: [pinia]` to the mount config. Gotcha: a Pinia `getters` entry with the same name as a `state` property is not allowed, and Vuex `mutations` have no Pinia equivalent.","citations":["platform/dev/6.7/guides/upgrades-migrations/administration/pinia.md:1-55"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"Pinia","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/upgrades-migrations/administration/pinia.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-46":{"query":"sw-button and sw-card are deprecated in Shopware 6.7 — how do I migrate my plugin's admin templates to the Meteor components, and is there a codemod that does it?","category":"dev","option":"mcp-wiki","answer":"Yes, there is a codemod. With Shopware 6.7, several Administration components are being replaced with components from the Meteor Component Library, Shopware's official reusable component collection built on the Shopware Design System. To migrate, run the codemod tool against a plugin located under `custom/plugins`:\n```bash\ncomposer run admin:code-mods\n# Example: composer run admin:code-mods -- --plugin-name example-plugin --fix -v 6.7\n```\nThe tool replaces compatible components automatically, adds guidance comments where manual migration is required, and fixes some other deprecated code. To support cross-version compatibility while you migrate, Shopware components gained a `deprecated` prop (default `false`, meaning the new Meteor Component is used by default); setting `deprecated: true` renders the old component instead, letting a plugin support both Shopware 6.6 and 6.7 from a single codebase without migrating immediately. The old components remain usable via the `deprecated` prop, but Shopware recommends migrating to Meteor Components as soon as possible to stay aligned with future development; note that timelines and specific implementation details for this migration are subject to change.","citations":["platform/dev/6.7/guides/upgrades-migrations/administration/meteor-components.md:1-43"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"Meteor","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"codemod","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/upgrades-migrations/administration/meteor-components.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-47":{"query":"My payment plugin implements `AsynchronousPaymentHandlerInterface` and is tagged `shopware.payment.method.async` — how do I write a payment handler for Shopware 6.7 instead?","category":"dev","option":"mcp-wiki","answer":"From Shopware 6.7.0.0 onward, all payment handling goes through a single class extending `Shopware\\Core\\Checkout\\Payment\\Cart\\PaymentHandler\\AbstractPaymentHandler` instead of the multiple pre-6.7 interfaces. Before 6.7, handlers implemented separate interfaces registered with separate tags: `SynchronousPaymentHandlerInterface` (`pay`) tagged `shopware.payment.method.sync`, `AsynchronousPaymentHandlerInterface` (`finalize`) tagged `shopware.payment.method.async`, `PreparedPaymentHandlerInterface` (`validate`, and previously `capture`) tagged `shopware.payment.method.prepared`, `RecurringPaymentHandlerInterface` (`recurring`) tagged `shopware.payment.method.recurring`, and `RefundPaymentHandlerInterface` (`refund`) tagged `shopware.payment.method.refund`. To migrate: 1) extend `AbstractPaymentHandler` and implement `supports(PaymentHandlerType $type, string $paymentMethodId, Context $context): bool` plus the relevant method(s) — `pay(Request, PaymentTransactionStruct, Context, ?Struct): ?RedirectResponse` (always called during checkout; return `null` for synchronous flows or a `RedirectResponse` to trigger `finalize`), `finalize(Request, PaymentTransactionStruct, Context): void` (called after redirect back from the external provider — this replaces your old `AsynchronousPaymentHandlerInterface::finalize`), `validate(...)` for prepared payments, `refund(...)` only if `supports()` returns true for `PaymentHandlerType::REFUND`, and `recurring(...)` only if `supports()` returns true for `PaymentHandlerType::RECURRING`. 2) Register the handler with the single tag `shopware.payment.method` (replacing `shopware.payment.method.async`):\n```php\n$services->set(MyCustomPaymentHandler::class)\n    ->tag('shopware.payment.method');\n```\n3) Use `OrderTransactionStateHandler` (e.g. `->process(...)`, `->paid(...)`) to update transaction state, and throw `PaymentException` (e.g. `::asyncProcessInterrupted`, `::customerCanceled`) to fail the transaction. 4) Register the payment method itself via the `payment_method.repository` in the plugin lifecycle, including a required `technicalName` (unique, plugin-prefixed — from 6.7 onward an omitted `technicalName` can prevent install/activation) and `handlerIdentifier` pointing at your new class. Never remove the payment method on `uninstall`, only set it inactive, since orders may still reference it. For a former `capture()` implementation (previously part of `PreparedPaymentHandlerInterface`), that logic is now folded into `pay()`.","citations":["platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:1-72"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"AsynchronousPaymentHandlerInterface","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"payment.method.async","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-48":{"query":"After upgrading, my storefront JavaScript plugin no longer loads — how do I register it asynchronously with `PluginManager` and where does the compiled file have to be shipped?","category":"dev","option":"mcp-wiki","answer":"A Storefront JavaScript plugin is a vanilla ES6 class extending the base `PluginBaseClass`, placed at `<plugin root>/src/Resources/app/storefront/src/<plugin-dir>/example-plugin.plugin.js`, e.g.:\n```javascript\nconst { PluginBaseClass } = window;\n\nexport default class ExamplePlugin extends PluginBaseClass {\n    init() {\n        window.addEventListener('scroll', this.onScroll.bind(this));\n    }\n}\n```\n`init()` runs on `DOMContentLoaded`. It is registered in `main.js` (auto-loaded from `<plugin root>/src/Resources/app/storefront/src`). A synchronous (top-level import) registration looks like:\n```javascript\nimport ExamplePlugin from './example-plugin/example-plugin.plugin';\nconst PluginManager = window.PluginManager;\nPluginManager.register('ExamplePlugin', ExamplePlugin);\n```\nBut synchronously imported plugins are always bundled into `storefront.js` on every page. To register it asynchronously instead — so it's excluded from the main `storefront.js` bundle and downloaded on demand only when its DOM selector is present — use a dynamic import in place of the class reference, together with a selector:\n```javascript\nPluginManager.register('ExamplePlugin', () => import('./example-plugin/example-plugin.plugin'), '[data-example-plugin]');\n```\nOnly elements matching `[data-example-plugin]` then trigger it (accessible inside the plugin as `this.el`). The plugin can also be configured via a static `options` object and a `data-{plugin-name-kebab-case}-options` JSON attribute, and existing options can be extended without overwriting them using the `replace_recursive` Twig filter before JSON-encoding into the `data-*-options` attribute. After changing registration, rebuild the Storefront with `shopware-cli project storefront-build` (template/project setups) or `composer run build:js:storefront` (platform contribution setups). The compiled output must be shipped with the plugin at `<plugin root>/src/Resources/app/storefront/dist/storefront/js/<plugin-name>/<plugin-name>.js` — if your plugin no longer loads after upgrading, check that this compiled file exists at that exact path and was rebuilt/shipped, since Shopware loads the storefront bundle from `dist`, not from `src`.","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md:1-80"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"PluginManager","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-49":{"query":"My storefront controller still uses the `@Route` and `@RouteScope` annotations from 6.4 — what is the attribute form in Shopware 6.7 and how are the routes wired?","category":"dev","option":"mcp-wiki","answer":"Prior to Shopware 6.4.11.0 the route scope was set via the `@RouteScope` annotation; this was replaced by the `_routeScope` route default (deprecated as of the 6.5 major version) in favor of the `#[Route(defaults: ...)]` PHP attribute, and in Shopware 6.7 you use PHP 8 attributes throughout instead of annotations. A Storefront controller extends `StorefrontController` and declares its scope like this:\n```php\n#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]])]\nclass ExampleController extends StorefrontController\n{\n    #[Route(path: '/example', name: 'frontend.example.example', methods: ['GET'])]\n    public function showExample(): Response\n    {\n        return $this->renderStorefront('@SwagBasicExample/storefront/page/example.html.twig', [\n            'example' => 'Hello world'\n        ]);\n    }\n}\n```\nThe class-level `#[Route(defaults: ...)]` sets `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE` to `[StorefrontRouteScope::ID]` (equivalent to the old `@RouteScope(scopes={\"storefront\"})`), and the method-level `#[Route(...)]` replaces the old `@Route` annotation; the scope can also be set per-route instead of class-wide. Route names should use the `frontend`, `widgets`, `payment`, `api` or `store-api` prefix so the router recognizes it as a Storefront route. Wiring: register the controller as a public service in `services.php`, calling `setContainer`:\n```php\n$services->set(ExampleController::class)\n    ->public()\n    ->call('setContainer', [service('service_container')]);\n```\nand import the controller's routes in `routes.php`:\n```php\n$routes->import('../../Storefront/Controller/*Controller.php', 'attribute');\n```\n(the `'attribute'` type tells Symfony's routing loader to read the PHP attributes rather than annotations). Since Shopware 6.7.2.0, a plugin can also allow custom route names without one of the standard prefixes by adding a `storefront.router.allowed_routes` config entry loaded from the plugin's `build()` method, e.g.:\n```yaml\nstorefront:\n    router:\n        allowed_routes:\n            - swag.test.foo-bar\n```","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:1-83"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"RouteScope","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"#[Route","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-50":{"query":"My `ScheduledTaskHandler` stopped running after the upgrade — how must a scheduled task and its handler be declared in Shopware 6.7?","category":"dev","option":"mcp-wiki","answer":"In Shopware 6.7, a scheduled task and its handler are two separate runtime roles that must both be wired, even when generated together: the task describes when work is due, and the handler is the Messenger consumer that executes it. Register both in the plugin's `services.php`:\n```php\n$services->set(ExampleTask::class)\n    ->tag('shopware.scheduled.task');\n\n$services->set(ExampleTaskHandler::class)\n    ->args([service('scheduled_task.repository'), service('logger')])\n    ->tag('messenger.message_handler');\n```\nThe task class extends `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTask` and implements `getTaskName()` (a vendor-prefixed technical name, e.g. `swag.example_task`) and `getDefaultInterval()` (in seconds). The handler extends `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTaskHandler`, is annotated `#[AsMessageHandler(handles: ExampleTask::class)]`, and implements `run()`. If your handler stopped running after upgrading, check specifically that: (1) the task is still tagged `shopware.scheduled.task` and the handler is still tagged `messenger.message_handler` in your service definitions, (2) the handler carries the `#[AsMessageHandler(handles: ExampleTask::class)]` attribute pointing at the correct task class, and (3) the task's `status` is `scheduled` in the `scheduled_task` table — `scheduled-task:run` only picks up tasks whose status is `scheduled` (unless using the admin worker). Since Shopware 6.7.13.0, a handler can additionally implement `DynamicallyScheduledTaskHandler` and its `getNextExecutionTime(ScheduledTask $task, ScheduledTaskEntity $taskEntity): ?\\DateTimeInterface`, called after `run()` finishes, to control the next run time from domain data instead of a fixed interval (returning `null` falls back to `nextExecutionTime + runInterval`, capped to now if that's in the past). To register and test without reinstalling the plugin, run: `bin/console scheduled-task:register`, `bin/console scheduled-task:run`, and `bin/console messenger:consume`.","citations":["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md:1-70"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"ScheduledTask","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-51":{"query":"Custom entities declared in `Resources/config/entities.xml` no longer work for my plugin in Shopware 6.7 — how do I define and register a DAL entity with PHP attributes instead?","category":"dev","option":"mcp-wiki","answer":"Since Shopware 6.6.3.0, entities can be registered via PHP attributes on a class extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity`, instead of writing separate EntityDefinition/EntityEntity/EntityCollection classes (and instead of entities.xml). Steps: 1) Define the entity class extending `Entity` and add `#[Entity('entity_name', collectionClass: ...)]` (name is required and unique; collectionClass defaults to EntityCollection, custom collection classes need 6.6.9.0+). 2) Add a primary key property with `#[PrimaryKey]` (typically a string UUID). 3) Register the class in services.php with the `shopware.entity` tag, e.g. `$services->set(Examples\\ExampleEntity::class)->tag('shopware.entity');` — Shopware then auto-registers an EntityDefinition and EntityRepository named `example_entity.definition` / `example_entity.repository`. 4) Define fields with `#[Field(type: FieldType::...)]` (the type accepts a FieldType constant or, since 6.6.9.0, any FQCN extending Field, e.g. PriceField::class). 5) Special attributes: `AutoIncrement`, `ForeignKey(entity: '...')`. 6) JSON fields with custom (de)serialization use `#[Serialized(serializer: ...)]`. 7) Custom fields: use the `EntityCustomFieldsTrait` or `#[CustomFields]` directly on a nullable array property. 8) Fields are hidden from the API by default — set `api: true` to expose everywhere, or scope with `api: [AdminApiSource::class]` / `api: [SalesChannelApiSource::class]`. 9) For translations, set `translated: true` on `#[Field]` (property must be nullable) to get an auto-created TranslatedField/EntityTranslationDefinition, and add `#[Translations]` on a nullable array property to load all translations via the `translations` association. 10) Non-nullable properties are required by default; use `#[Required]` explicitly where needed (e.g. for translated fields). 11) Associations use `OneToOne`, `OneToMany`, `ManyToOne`, `ManyToMany` attributes paired with `#[ForeignKey(entity: '...')]`. Gotchas: translated properties must be nullable; custom collection classes and direct Field-subclass type references require 6.6.9.0+; with attribute-based entities you no longer need to hand-write getters/setters, EntityTranslationDefinition, or EntityCollection classes. Source: https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/entities-via-attributes.html","citations":["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md:1-61"],"toolCallLog":[{"tool":"kb_status","args":{}},{"tool":"read_doc","args":{"path":"platform/index.md"}},{"tool":"grep_docs","args":{"pattern":"entities.xml","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"attribute","path":"platform/dev/6.7","glob":"**/*entit*","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-52":{"query":"What must a plugin database migration class implement in Shopware 6.7, and where does the database cleanup on uninstall belong?","category":"dev","option":"mcp-wiki","answer":"Every plugin migration class extends `Shopware\\Core\\Framework\\Migration\\MigrationStep` and implements two methods: `getCreationTimestamp(): int` (returns the timestamp embedded in the class name, e.g. `Migration1611740369ExampleDescription`) and `update(Connection $connection): void`, where all schema/data changes go. Migration files live by default in `<plugin root>/src/Migration`, named `Migration<timestamp><Description>.php`. A skeleton can be generated with `./bin/console database:create-migration -p SwagBasicExample --name ExampleDescription`, or a full migration including SQL can be generated from an entity definition with `./bin/console dal:migration:create --bundle=SwagBasicExample --entities=your_entity,your_other_entity`. Migrations run automatically on plugin install/update, or manually via `./bin/console database:migrate SwagBasicExample --all`. There is no migration rollback mechanism, and `MigrationStep::updateDestructive()` is only used by Shopware core for delayed major-version destructive changes (plugin install/update never runs it). Consequently, database cleanup on plugin uninstall does NOT belong in a migration — it belongs in the plugin's `uninstall` lifecycle method instead.","citations":["platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md:1-77"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"migration","path":"platform/dev/6.7","glob":"**/*migrat*","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-53":{"query":"My theme config labels disappeared from the Theme Manager after 6.7 — how do I define `theme.json` config fields and where do their translations go now?","category":"dev","option":"mcp-wiki","answer":"`theme.json` lives at `<plugin root>/src/Resources/theme.json`; after changes run `bin/console theme:refresh` to apply them (this also updates `configInheritance` relationships). Config fields are defined under `config.fields.<field-key>` with parameters `type` (`color`, `text`, `number`, `fontFamily`, `media`, `checkbox`, `switch`, `url`), `editable`, `tab`, `block`, `section`, `custom` (raw data exposed only via API), `scss` (set false to skip SCSS variable injection), and `fullWidth`. These fields appear in the Administration Theme Manager and merge with (inherit from) the Storefront config — only changed values need to be supplied. Field definitions changed between versions: before v6.8.0.0, fields (and their tabs/blocks/sections) carried inline `label`/`helpText` translation objects directly inside `theme.json`; but since v6.7.1.0, `label`/`helpText` are already omitted from `theme.json` field objects — this is exactly why labels disappear after upgrading to 6.7 if the theme wasn't updated. Translations now go into Administration snippet files instead, e.g. `<plugin root>/src/Resources/app/administration/src/app/snippet/de.json` (or locale-specific `de-DE.json`/`en-GB.json`), using the snippet key structure: Tab `sw-theme.<technicalName>.<tabName>.label`, Block `sw-theme.<technicalName>.<tabName>.<blockName>.label`, Section `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.label`, Field `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.<fieldName>.label` / `.helpText`, and Option `...<fieldName>.<index>.label`. Unnamed tab/block/section segments use `default` in the key. `label`/`helpText` inside `theme.json` are deprecated for v6.8 in favor of these Administration snippets.","citations":["platform/dev/6.7/guides/plugins/themes/configuration/theme-configuration.md:1-77"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"theme.json","path":"platform/dev/6.7","glob":"**/*theme*","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/themes/configuration/theme-configuration.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-54":{"query":"How do I register a plugin cookie in the storefront cookie consent manager in Shopware 6.7?","category":"dev","option":"mcp-wiki","answer":"Register a listener for `Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent`, e.g. tagged in services.php: `$services->set(CookieListener::class)->tag('kernel.event_listener', ['event' => 'Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent']);`. In the listener's `__invoke(CookieGroupCollectEvent $event)`, fetch a group from `$event->cookieGroupCollection` (e.g. via `CookieProvider::SNIPPET_NAME_COOKIE_GROUP_COMFORT_FEATURES`), get or create its `CookieEntryCollection`, and add a `CookieEntry`, e.g.: `$cookieEntry = new CookieEntry('my-cookie-key'); $cookieEntry->name = 'cookie.myCookieName'; $cookieEntry->value = '1'; $cookieEntry->expiration = 30; $entries->add($cookieEntry);`. Cookie groups themselves must not carry the `cookie`, `value`, `expiration`, or `isRequired` parameters — those belong only on individual `CookieEntry` objects. Since Shopware 6.7.3.0, cookies use these structured `CookieEntry`/`CookieGroup` objects instead of the old array format; the previously used `CookieProviderInterface` with array-based cookie definitions still works for backward compatibility but is deprecated in favor of `CookieGroupCollectEvent`. Since 6.7.3.0, cookie configurations also carry a hash (stored client-side in the `cookie-config-hash` cookie, keyed per language ID); any configuration change alters the hash and triggers a re-consent prompt for the affected language. The relevant store API endpoint is `/store-api/cookie/groups`.","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md:1-62"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"cookie consent","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-55":{"query":"How do the breaking storefront accessibility changes reach my theme in Shopware 6.7, and what must an extension that overrides the affected Twig blocks do?","category":"dev","option":"mcp-wiki","answer":"Shopware rolls out storefront accessibility improvements (including breaking ones) via the `ACCESSIBILITY_TWEAKS` feature flag rather than in one big accessibility release. Breaking accessibility changes ship inside regular minor releases but stay inactive by default until the flag is set — the flag can be enabled in `.env` (`ACCESSIBILITY_TWEAKS=1`) the same way as major-version flags like `V6_7_0_0`. With major version v6.7.0, these accessibility changes become the default (the flag is effectively on). A typical change implements both old and new markup guarded by `feature('ACCESSIBILITY_TWEAKS')` in Twig, for example old markup wrapped in `{% block component_list_items %}` inside a `<div>` versus new markup wrapped in `{% block component_list_items_inner %}` inside a `<ul>`. An extension that overrides the old block (e.g. `component_list_items`) must also implement the new block (`component_list_items_inner`) via `{% sw_extends %}` so it keeps working once the flag/version default flips — otherwise, once the core switches structure, an extension still assuming the old markup can render incorrect HTML. Testing tooling referenced includes Google Lighthouse, AXE DevTools, WAVE, and manual keyboard/screen-reader checks (NVDA, VoiceOver); the target standards are WCAG 2.1 AA and BITV 2.0.","citations":["platform/dev/6.7/guides/development/accessibility/storefront-accessibility.md:1-80"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"accessibility","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/development/accessibility/storefront-accessibility.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-56":{"query":"Header and footer are loaded through ESI sub-requests in Shopware 6.7, so page data is gone in my header template — how do I pass my own data into the header/footer now?","category":"dev","option":"mcp-wiki","answer":"Since the header and footer are now loaded via ESI sub-requests, they no longer depend directly on the current page's data by default. To pass current-page data into the ESI request, extend `base.html.twig` and override the `base_esi_header` (or `base_esi_footer`) block to merge extra parameters into `headerParameters`/`footerParameters`: `{% sw_extends '@Storefront/storefront/base.html.twig' %} {% block base_esi_header %} {% set headerParameters = headerParameters|merge({ 'vendorPrefixPluginName': { 'activeRoute': activeRoute } }) %} {{ parent() }} {% endblock %}`. Because `headerParameters`/`footerParameters` are passed as query parameters to the header/footer ESI route, they must contain scalar values only. The value can then be read back in the header template by extending `layout/header.html.twig`: `{% sw_extends '@Storefront/storefront/layout/header.html.twig' %} {% block header %} {{ dump(headerParameters.vendorPrefixPluginName.activeRoute) }} {{ parent() }} {% endblock %}`. In plugins, `StorefrontRenderEvent` can also inject data, guarded by checking the current route is `frontend.header`, e.g. setting `$event->setParameter('headerParameters', $headerParameters)` after reading/merging `$event->getParameter('headerParameters')`. It is also possible to load an entirely custom header/footer template (as core does for the checkout confirm page), but this overwrites customizations from every other extension, and any custom template must still receive the `header`/`footer` data it extends. (For data unrelated to the current page, the wiki points to a separate 'Add data to storefront page' guide instead.)","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-header-footer.md:1-74"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"ESI","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-header-footer.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-57":{"query":"B2B Suite support ends with 6.8 — how do I run the B2B Suite Migration to B2B Components and check that it finished?","category":"dev","option":"mcp-wiki","answer":"Run the migration with the `b2b:migrate:commercial` console command: `bin/console b2b:migrate:commercial` migrates everything; you can instead target specific components (the names must match the configurator's technical name), e.g. `bin/console b2b:migrate:commercial quote_management shopping_list` — note that `employee_management` is always migrated first regardless of argument order, since it is a prerequisite for all other components, and the overall order otherwise follows configurator priority. Batch size can be tuned with `bin/console b2b:migrate:commercial --batch-size=100`. Because `b2b:migrate:commercial` queues work and returns before the migration actually finishes, completion must be checked separately: run `bin/console b2b:migrate:progress --watch` in a separate terminal to watch live status. Its output columns are Total, Valid, Newly, Migrated, Pending, Error, with status values `Complete`, `Pending`, `In progress`, `Complete with error`, and `Has new records` — wait until the relevant component(s) show `Complete`. One gotcha to be aware of: Budget Management leaves the Organization Unit empty on migrated budgets (this requires B2B Commercial 7.6.0+ to resolve).","citations":["platform/dev/6.7/products/extensions/b2b-suite-migration/execution/running-migration.md:1-53"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"running-migration","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/products/extensions/b2b-suite-migration/execution/running-migration.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-58":{"query":"My shopware.yaml still uses redis_url — how do I define the named Redis connections in Shopware 6.7 and which eviction policy does each one need?","category":"dev","option":"mcp-wiki","answer":"Since v6.6.8.0 (carried into 6.7), Redis connections are defined as named entries under `shopware.redis.connections`, each with its own `dsn`, instead of the old single `redis_url`: \n```yaml\nshopware:\n    redis:\n        connections:\n            ephemeral:\n                dsn: 'redis://host1:port/dbindex'\n            persistent:\n                dsn: 'redis://host2:port/dbindex'\n```\nEnv vars can be used in the DSN, e.g. `dsn: '%env(REDIS_EPHEMERAL)%/1'`, and connection pooling can be enabled by adding the `persistent=1` DSN flag, e.g. `dsn: 'redis://host:port/dbindex?persistent=1'`. Because a single Redis instance cannot apply different eviction policies to different databases, Shopware recommends separate Redis instances/connections per data category, each with its own policy: 1) Ephemeral data (HTTP cache, object cache) needs `volatile-lru`, and needs no persistence. 2) Durable-but-aging data (sessions) needs `allkeys-lru`, persisted via RDB/AOF. 3) Durable-and-critical data (cart, number range, lock store, increment) also needs `volatile-lru`. Gotcha: a cache Redis hitting its memory limit is expected behaviour under `volatile-lru`, but it can only evict keys that carry a TTL — Symfony's tag-aware cache adapter stores tag-index sets without a TTL, which accumulate as orphaned entries and can starve eviction if never pruned.","citations":["platform/dev/6.7/guides/hosting/infrastructure/redis.md:1-71"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"eviction","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/hosting/infrastructure/redis.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-59":{"query":"After upgrading to Shopware 6.7 my Varnish cache is never invalidated — what changed in the reverse proxy configuration?","category":"dev","option":"mcp-wiki","answer":"Two things changed that commonly cause this. First, the config key was renamed: it was `storefront.reverse_proxy` up to 6.5.x, then `shopware.http_cache.reverse_proxy` starting 6.6.0.0 — a config left under the old key on 6.7 will simply not be read, so invalidation looks broken. The current config shape is: `shopware: http_cache: reverse_proxy: { enabled: true, ban_method: \"BAN\", hosts: [\"http://varnish\"], max_parallel_invalidations: 3, use_varnish_xkey: true }`, alongside `SHOPWARE_HTTP_CACHE_ENABLED=1` in `.env`. Second, the old Varnish-with-Redis/LUA-based BAN approach is deprecated from v6.6.x and was fully removed in v6.7.0, in favor of `XKey`-based invalidation (`use_varnish_xkey: true`) — a Varnish VCL still wired for the old Redis/LUA BAN method will no longer receive invalidations on 6.7 and needs to be updated to the XKey-based VCL. Also relevant: since Shopware 6.6, `TRUSTED_PROXIES` is no longer read automatically — `SYMFONY_TRUSTED_PROXIES` must be set instead so Symfony reads the real client IP and the proxy is trusted at all. For soft purge instead of hard purge, the VCL should call `xkey.softpurge(req.http.xkey)` instead of `xkey.purge(req.http.xkey)`. Cache-clear commands worth checking: `bin/console cache:clear:http` (since 6.6.10) clears just the reverse proxy cache, and `bin/console cache:clear:all` (since 6.6.8) clears everything including the HTTP cache.","citations":["platform/dev/6.7/guides/hosting/infrastructure/reverse-http-cache.md:1-88"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"reverse proxy","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"Varnish","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/hosting/infrastructure/reverse-http-cache.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-60":{"query":"Which transports do my Shopware message queue workers have to consume in production, and how do I turn off the admin worker?","category":"dev","option":"mcp-wiki","answer":"By default Shopware stores async messages in the database (Symfony Messenger + Enqueue) and works them off in the browser via the admin worker while a user is logged into the Administration; this is not recommended for production because it only runs while someone is logged in and can cause high CPU load with multiple concurrent admin users. Instead, run one or more CLI workers consuming the relevant transports, e.g.: `bin/console messenger:consume async --time-limit=60 --memory-limit=128M` and `bin/console messenger:consume async low_priority`. A CLI worker must also be set up for the failed-message transport, otherwise failed messages are never processed (failed messages are retried automatically 3 times, then deleted, via the Doctrine-backed failed transport configured through `MESSENGER_TRANSPORT_FAILURE_DSN`). Cron jobs are discouraged for running workers since they won't cap the maximum number of workers the way supervisor/systemd can; overlapping long-running messages risk starting an unwanted number of workers. To turn off the admin worker once CLI workers are running, set in `config/packages/shopware.yaml`: `shopware: admin_worker: enable_admin_worker: false`. If the admin worker is still used, it can be configured with `enable_admin_worker: true`, `poll_interval: 30`, and `transports: [\"async\", \"low_priority\"]`. Additional relevant env vars are `MESSENGER_TRANSPORT_DSN` and `MESSENGER_TRANSPORT_LOW_PRIORITY_DSN` for the transport DSNs.","citations":["platform/dev/6.7/guides/hosting/infrastructure/message-queue.md:1-94"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"admin worker","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"message queue","path":"platform/dev/6.7","glob":"**/*worker*","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/hosting/infrastructure/message-queue.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-61":{"query":"After the upgrade my Elasticsearch index has to be rebuilt — where do I set the shard and replica counts and which reindex command do I run?","category":"dev","option":"mcp-wiki","answer":"Set shard/replica counts in `config/packages/elasticsearch.yml` under `elasticsearch.index_settings.number_of_shards` / `number_of_replicas` (default is 3/3, since Shopware 6.4.12.0), e.g. `elasticsearch: { index_settings: { number_of_shards: 1, number_of_replicas: 0 } }`. To rebuild the index: first clear the cache (`bin/console cache:clear`), then run `bin/console es:index` for basic indexing, or `bin/console dal:refresh:index --use-queue` to reindex the whole shop (Elasticsearch, SEO URLs, product index, etc. — always with `--use-queue`). Some systems also need `bin/console es:create:alias` afterward, and indexing jobs are processed by `bin/console messenger:consume` workers. Source: https://developer.shopware.com/docs/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.html","citations":["platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md:1-74"],"toolCallLog":[{"tool":"kb_status","args":{}},{"tool":"read_doc","args":{"path":"platform/index.md"}},{"tool":"grep_docs","args":{"pattern":"shard","path":"platform/dev/6.7"}},{"tool":"read_doc","args":{"path":"platform/hubs/elasticsearch.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-62":{"query":"I changed a setting in `.env` on a deployed 6.7 shop but it still behaves the old way — what takes precedence between `.env`, `.env.local` and the real environment variables, and which settings does Shopware not read from `.env` at all?","category":"dev","option":"mcp-wiki","answer":"Shopware's configuration overview page lists five configuration mechanisms and says environment variables (`.env`, `.env.local`, server/container environment, deployment platform) are meant for secrets, infrastructure values and deployment-specific values — while shop settings that merchants change in the Administration, via the Admin API, or in app/plugin code are database-backed 'system configuration' and are read from the database, not from `.env` at all; a static system configuration file under `config/packages/*.yaml` (`shopware.system_config`) can overlay and win over the database value, and once overwritten that way the setting can no longer be changed in the Administration. So: settings exposed in Administration/system config (e.g. `core.listing.allowBuyInListing`) are not read from `.env` at all — they live in the database (optionally overridden by `config/packages`), whereas `.env`/`.env.local`/real env vars are used for infrastructure/secrets settings like `APP_ENV`, `DATABASE_URL`, `SHOPWARE_ES_ENABLED`, etc. The exact precedence order among `.env`, `.env.local` and real (server/container) environment variables is standard Symfony Dotenv behaviour — real environment variables always win over `.env.local`, which wins over `.env` — and is not spelled out as such in the wiki pages found. [from memory]","citations":["platform/dev/6.7/guides/hosting/configurations/shopware/_index.md:1-40","platform/dev/6.7/guides/hosting/configurations/shopware/static-system-config.md:1-66"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":".env.local","path":"platform/dev/6.7"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/hosting/configurations/shopware/static-system-config.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/hosting/configurations/shopware/_index.md"}},{"tool":"grep_docs","args":{"pattern":"precedence","path":"platform/dev/6.7"}},{"tool":"grep_docs","args":{"pattern":"real environment variable","path":"platform/dev/6.7"}}],"notFoundClaim":false,"memoryClaims":["The exact precedence order among `.env`, `.env.local` and real (server/container) environment variables is standard Symfony Dotenv behaviour — real environment variables always win over `.env.local`, which wins over `.env` — and is not spelled out as such in the wiki pages found."],"sourceVerdict":"partial"},"dev-63":{"query":"I deployed a plugin update to a 6.7 staging shop and my new migration never ran — which `bin/console` command applies the pending migrations of that one plugin, and what do I have to pass to it?","category":"dev","option":"mcp-wiki","answer":"Run `./bin/console database:migrate <PluginName> --all`, e.g. `./bin/console database:migrate SwagBasicExample --all` — pass the plugin's technical name and `--all` to apply all of that plugin's pending migrations manually. (Normally Shopware runs each migration's `update()` method automatically on plugin install/update, so a manual run is only needed if that didn't happen, e.g. because auto-migrate was disabled via `$updateContext->setAutoMigrate(false)`.) Note also that a migration only ever runs once and is never modified afterward, and migration classes live by default in `<plugin root>/src/Migration`.","citations":["platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md:1-77"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"migration","path":"platform/dev/6.7","glob":"**/*migration*","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-64":{"query":"How do I get an Admin API OAuth token — with client_credentials for an integration, or the password grant for local testing — and how long is each token valid?","category":"dev","option":"mcp-wiki","answer":"For an integration, create an Integration in Administration under Settings → System → Integrations with the 'Administrator' toggle enabled; note the access key ID (maps to OAuth `client_id`) and secret access key (maps to `client_secret`). Then POST to `/api/oauth/token` with `{\"grant_type\": \"client_credentials\", \"client_id\": \"...\", \"client_secret\": \"...\"}`; the response contains `token_type`, `expires_in`, and `access_token`. For local development only, there is a password-grant shortcut: POST to `/api/oauth/token` with `grant_type: password`, `client_id: administration`, `scopes: write`, and the default Administration `username`/`password`; the response contains `token_type`, `expires_in`, `access_token`, and `refresh_token`. The docs explicitly say `client_credentials` remains the default/recommended approach and the password grant should not replace it for integrations or reproducible setups. Neither page states a fixed number of seconds for token validity — both flows return an `expires_in` field in the response indicating the token's lifetime rather than documenting a fixed duration in the guide text.","citations":["platform/dev/6.7/guides/development/integrations-api/_index.md:1-47","platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md:1-44"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"client_credentials","path":"platform/dev/6.7"}},{"tool":"list_docs","args":{"path":"platform/hubs","glob":"*admin-api*"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/development/integrations-api/_index.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"dev-65":{"query":"What can I put in the JSON body of `POST /api/search/{entity}` for filtering, associations, sorting, aggregations and getting an exact total count?","category":"dev","option":"mcp-wiki","answer":"The POST search endpoints accept a JSON 'search criteria' object with the same shape as a DAL criteria: `associations` to load related data (like a SQL join, with nested criteria per association), `includes` to restrict returned fields per type keyed by each response's `apiAlias`, `ids` to look up records directly by ID, `filter` to filter results and aggregations (same filter types as the DAL — nested/association fields must first be requested via `associations`), `post-filter` which filters like `filter` but does not affect aggregations, `query` for a weighted search (each sub-query has a `score`, summed into `extensions.search._score`; don't combine with `term`), `term` for a text search across fields flagged `SearchRanking`, `sort` — one or more `{field, order}` entries, supporting `naturalSorting: true` and (since 6.4.12.0) a `type: \"count\"` sort, `aggregations` for metrics/facets (same aggregation types as the DAL), `grouping` to group results by field(s), and `page`/`limit` for pagination. For an exact total count, set `total-count-mode: 1`, which runs `SQL_CALC_FOUND_ROWS` for an exact total (used for exact pagination) — the default `0` returns no total for best performance, and `2` only reports whether a next page exists (useful for infinite scroll); mode 1 is performance-intensive so should only be used when an exact count is required.","citations":["platform/dev/6.7/guides/development/integrations-api/search-criteria.md:1-65"],"toolCallLog":[{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/development/integrations-api/search-criteria.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-66":{"query":"Which request headers change Admin API behaviour for language, entity version, parent-child inheritance and skipping flow triggers during a bulk import?","category":"dev","option":"mcp-wiki","answer":"Use `sw-language-id` to return entities in a given language ID instead of the system language (e.g. `sw-language-id: be01bd336c204f20ab86eab45bbdbe45`). Use `sw-version-id` to tell the API which entity version to return (e.g. `sw-version-id: 0fa91ce3e96a4bc2be4bd9ce752c3425`). Use `sw-inheritance: 1` to make the API consider parent-child inheritance (e.g. for product variants). Use `sw-skip-trigger-flow: 1` to skip flow triggers (e.g. 'send email on customer creation') during bulk imports via the sync API.","citations":["platform/dev/6.7/guides/development/integrations-api/request-headers.md:1-37"],"toolCallLog":[{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/development/integrations-api/request-headers.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-67":{"query":"What does a minimal app folder and `manifest.xml` need to contain, and which console commands install and activate the app on my local Shopware 6.7?","category":"dev","option":"mcp-wiki","answer":"Create the app folder under `custom/apps/<TechnicalName>/manifest.xml`, choosing a technical name in UpperCamelCase (e.g. `MyExampleApp`) — the folder name must match `<meta><name>` inside the manifest. The manifest needs a `<meta>` block with `name`, `label`, `description`, `author`, `copyright`, `version`, `icon`, and `license`; `<author>` and `<copyright>` are required or `bin/console app:refresh` fails. To install: refresh the app registry with `bin/console app:refresh`, then install and activate with `bin/console app:install --activate MyExampleApp` (using the technical name, not a filesystem path). Without `--activate`, activate later via Extensions → My Extensions → Apps in the Administration, or `bin/console app:activate MyExampleApp`. Inspect installed apps with `bin/console app:list`, clear caches after activating with `bin/console cache:clear` (or `cache:clear:http`/`cache:clear:all`), and use `--no-validate` with `app:install` to skip manifest validation while debugging, or `bin/console app:validate` to find configuration issues. All commands must be run from inside the PHP container at the project root.","citations":["platform/dev/6.7/guides/plugins/apps/app-base-guide.md:1-42"],"toolCallLog":[{"tool":"read_doc","args":{"path":"platform/hubs/apps.md"}},{"tool":"grep_docs","args":{"pattern":"app:install","path":"platform/dev/6.7"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/apps/app-base-guide.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-68":{"query":"How does the registration handshake between Shopware and my app backend work — shop id, proof, shop secret and the confirmation call?","category":"dev","option":"mcp-wiki","answer":"Registration is a GET request from Shopware to the URL declared in the manifest, carrying query parameters `shop-id`, `shop-url`, `timestamp`, plus headers `shopware-app-signature` (an HMAC-SHA256 of the query string signed with the app's `app-secret`, computed as `hash_hmac('sha256', $queryString, $appSecret)`), `sw-version` (since 6.4.1.0), and, on re-registration, `shopware-shop-signature` (signed with the shop's current `shop-secret`). On success the app backend responds with a `proof` (a SHA-256 HMAC of `shopId . shopUrl . appName`, using the `app-secret`), a generated `shop-secret` (64–255 characters), and a `confirmation_url`, e.g. `{ \"proof\": \"...\", \"secret\": \"random secret string\", \"confirmation_url\": \"https://my.example.com/registration/confirm\" }`; on a failed setup precondition it responds `{\"error\": \"...\"}` instead. If the proof matches, Shopware then sends a POST to that `confirmation_url` with `apiKey`, `secretKey`, `timestamp`, `shopUrl`, `shopId` in the body, signed via the `shopware-shop-signature` header (HMAC-SHA256 of the body using `shop-secret`); the app backend then uses `apiKey`/`secretKey` as the OAuth `client_id`/`client_secret` against the Admin API. On re-registration, Shopware also sends a `shopware-shop-signature-previous` header signed with the previous `shop-secret`, so the backend can validate both and accept the old secret for a short grace period (e.g. 1 minute) to handle secret rotation. Registration and confirmation requests time out after 5 seconds, and the `app-secret` must never be published — it stays with the Shopware Account.","citations":["platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md:1-96"],"toolCallLog":[{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-69":{"query":"How does an app subscribe to an event like `product.written`, what does Shopware POST to the webhook URL, and how do I verify the request is genuine?","category":"dev","option":"mcp-wiki","answer":"The app subscribes by declaring a webhook in the manifest's `<webhooks>` section, naming the webhook and the `event` it listens to (e.g. `product.written`). Shopware then POSTs a payload shaped like: `{ \"data\": { \"payload\": [ { \"entity\": \"...\", \"operation\": \"...\", \"primaryKey\": \"...\", \"updatedFields\": [] } ], \"event\": \"...\" }, \"source\": { \"url\": \"...\", \"appVersion\": \"...\", \"shopId\": \"...\", \"eventId\": \"...\" }, \"timestamp\": 0 }`. `source.url`/`appVersion`/`shopId`/`eventId` identify the sending shop instance (`eventId` stays stable across retries, since 6.4.11.0), and `timestamp` (since 6.4.1.0) records when the webhook was handled — use it to reject stale/replayed requests. Additional headers sent are `sw-version` (since 6.4.1.0) and `sw-context-language`/`sw-user-language` (since 6.4.5.0). Note that `entity.written` payloads (like `product.written`) reference the changed record only by `primaryKey`, not the full entity, so the app must fetch it/associations itself via the shop API — and that record may already be outdated by fetch time. To verify authenticity, check the `shopware-shop-signature` header: a SHA-256 HMAC of the request body, signed with the `shop-secret` assigned during app registration — the same mechanism used for the registration confirmation request. Optionally, a webhook can be restricted to the live version only by adding `onlyLiveVersion` (since 6.5.7.0, default false) to its manifest definition, though this is only checked for `HookableEntityWrittenEvent`-type events.","citations":["platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md:1-66"],"toolCallLog":[{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-70":{"query":"How do I implement a payment method in an app with `pay-url` and `finalize-url`, and what must the app server return in Shopware 6.7?","category":"dev","option":"mcp-wiki","answer":"Define the payment method in the app manifest with `pay-url` (and `finalize-url` for asynchronous flows) as attributes — presence of `finalize-url` is what distinguishes an asynchronous payment method from a synchronous one, and omitting `pay-url` leaves the transaction open with no app communication. The app server must be reachable from Shopware (e.g. via a tunneling service in development). For a synchronous method (only `pay-url` set), Shopware calls `pay-url` and expects a JSON response with a `status` field (and optional `message` on failure), e.g. `{\"status\": \"authorize\", \"message\": \"optional failure reason\"}`. For an asynchronous method, Shopware POSTs to the pay endpoint with `order`, `orderTransaction`, and a `returnUrl`; the app responds with a `redirectUrl` to send the customer to the payment provider; after the provider redirects the customer back, Shopware POSTs to `finalize-url` with `orderTransaction` and the provider's query parameters, and the app must respond with `status`/`message` again. Available payment states include `open`, `paid`, `cancelled`, `refunded`, `failed`, `authorize`, `unconfirmed`, `in_progress`, `reminded`, `chargeback`. On the App PHP SDK, resolve the shop and stage-specific context and sign the response, e.g. `$shop = $shopResolver->resolveShop($serverRequest); $payment = $contextResolver->assemblePaymentPay($serverRequest, $shop); return $signer->signResponse(PaymentResponse::paid(), $shop);` (or with the Symfony Bundle, type-hint `PaymentPayAction`/`PaymentFinalizeAction` etc. as controller arguments and return `PaymentResponse` directly). Important gotchas: never change a payment method's manifest identifier after release (Shopware would create a new payment method instead of reusing it), and from Shopware 6.7.0.0 onward the app server must respond with a payment state whenever it intends to change the transaction state.","citations":["platform/dev/6.7/guides/plugins/apps/checkout/payment.md:1-66"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"finalize-url","path":"platform/dev/6.7"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/apps/checkout/payment.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-71":{"query":"How does an app define its own custom entities in Shopware 6.7 and read them back through the API?","category":"dev","option":"mcp-wiki","answer":"An app defines new, entirely custom data structures (managed in the Administration, alongside custom fields on existing entities) by registering them in the app's Resources/entities.xml file, validated against the entity-1.0.xsd schema. Each <entity> element (e.g. name=\"custom_entity_bundle\") declares <fields> such as string, price, and many-to-many relations, each of which can be marked store-api-aware=\"true\" to expose it through the Store API. Once registered, Shopware automatically generates a repositor
