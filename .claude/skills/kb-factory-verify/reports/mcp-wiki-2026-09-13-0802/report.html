y for the entity, which can be read back in two ways: (1) from App Scripts via services.repository.search('custom_entity_bundle', criteria), and (2) via the Admin API at POST /api/search/custom-entity-bundle (entity name converted to kebab-case in the route). To let a custom field reference a custom entity via an 'Entity Select', add custom-fields-aware=\"true\" and label-property=\"name\" to the <entity> element (the label-property field must exist and be of type string); without a snippet the entity shows as custom_entity_bundle.label, so a label should be added under Resources/app/administration/snippet/en-GB.json. Since Shopware 6.4.15.0, entities may use the ce_ shorthand prefix (e.g. ce_bundle) to avoid database name-length restrictions, which must then be used consistently in repository and API calls (e.g. POST /api/search/ce_blog). Custom entities with custom-field support requires Shopware 6.5.1.0+, custom entities cannot be renamed once created (renaming deletes all existing data), and associations referencing core tables still require the corresponding manifest permissions.","citations":["platform/dev/6.7/guides/plugins/apps/custom-data/custom-entities.md:1-54"],"toolCallLog":[{"tool":"kb_status","args":{}},{"tool":"read_doc","args":{"path":"platform/index.md"}},{"tool":"grep_docs","args":{"pattern":"custom entities","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/apps/custom-data/custom-entities.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-01":{"query":"How do I create a product with variants and configure its visibility per sales channel, and why might it not show up in the storefront?","category":"func","option":"mcp-wiki","answer":"To create a product go to Catalogues > Products; the mask requires Title, Product number, Tax rate, Price (gross and net) and Stock before the first save — other tabs (Specifications, Extended Prices, Variants, Layout, SEO, Cross Selling, Bundles) only appear after that first save. In the Variants tab, use the Variant Generator to pick properties/options, define price surcharges, optionally exclude combinations under Value exclusion, then click Generate variants; product-list display can show a Single main variant (Main product or Single Variant preselection) or fan out properties in the list. New products are linked to sales channels by default according to the settings chosen once in the First Run Wizard's 'Default values' step (Settings > System > First Run Wizard), where per sales channel you can set Visible (default), Hide in listings, or Hide in listings and search — these same values can also be set per product. If the Dynamic Access extension (Shopware Evolve plan) is installed, product- and variant-level visibility can additionally be controlled per Rule Builder rule under Catalogues > Products > General tab > Visibility & structure section, and per variant in that variant's own Visibility & structure section (a purple chain icon shows the setting is still inherited from the main product). Reasons a product might not appear in the storefront include: the product not being assigned/visible for the relevant sales channel (wrong visibility setting); a Dynamic Access rule hiding it for the customer's group (note that hiding a category does not automatically hide the products inside it from search — the same rule must be applied to the products too, and mutually exclusive rules can make a product never appear); or, for variants, that the whole product is only hidden once all its variants have become unavailable due to rules (individual unavailable variants just cannot be selected on the product page, they are not hidden separately).","citations":["platform/func/catalogues/products.md:1-60","platform/func/first-steps/first-run-wizard.md:1-56","platform/func/extensions/dynamiccontent.md:1-37"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"variant","path":"platform/func","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"visibility","path":"platform/func","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/func/catalogues/products.md"}},{"tool":"grep_docs","args":{"pattern":"assign.*sales channel|visibilit","path":"platform/func","regex":true,"mode":"content"}},{"tool":"read_doc","args":{"path":"platform/func/extensions/dynamiccontent.md"}},{"tool":"read_doc","args":{"path":"platform/func/first-steps/first-run-wizard.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-02":{"query":"How do Rule Builder conditions work for shipping and payment methods?","category":"func","option":"mcp-wiki","answer":"The Rule Builder (Settings > Automation > Rule Builder) lets merchants define reusable rules — combinations of conditions and operators — used to control, among other things, the availability of payment and shipping methods. A rule consists of General information (Name, Description, Priority, Type, Tags) plus Conditions; conditions are combined with AND (all must match) or OR (any must match), and switching between AND/OR automatically creates subconditions. The condition catalog spans General (e.g. Sales Channel, Currency, Date range, Day of the week, Time range), Orders, Customers, Marketing & Promotions, Items in shopping cart, and Shopping cart groups, combined with operators such as Is equal to, Is not equal to, Is one of, Is greater/less than (or equal to), At least one, All. Some conditions accept an optional narrowing filter (marked with a filter icon). For shipping methods, under Settings > Commerce > Shipping each method has an 'Availability rule' field that uses a Rule Builder rule to determine when the method can be selected at checkout (a new rule can be created directly from that field); the method must additionally be assigned to a sales channel in that sales channel's general settings to actually appear at checkout. A shipping method's price matrix can likewise be restricted with a rule, and price tiers can themselves be based on Rule Builder rules rather than simple properties. For payment methods, under Settings > Commerce > Payment methods each method similarly has an 'Availability rule' field using Rule Builder conditions to control when the method is offered; leaving it blank (NULL) means unrestricted availability. As with shipping, a payment method also needs to be assigned to the relevant sales channel to actually appear to customers there. The Rule Builder's Assignments tab (read-only) shows every place a given rule is currently used, including payment/shipping method availability and shipping cost calculation, and a rule that is in use cannot be deleted.","citations":["platform/func/settings/rules.md:1-68","platform/func/settings/shipping.md:1-48","platform/func/settings/Paymentmethods.md:1-32"],"toolCallLog":[{"tool":"read_doc","args":{"path":"platform/func/settings/rules.md"}},{"tool":"grep_docs","args":{"pattern":"availability rule","path":"platform/func","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/func/settings/shipping.md"}},{"tool":"read_doc","args":{"path":"platform/func/settings/Paymentmethods.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-03":{"query":"How do promotions and discount codes work, including individually generated codes?","category":"func","option":"mcp-wiki","answer":"Promotions are configured under Marketing > Promotions. The General tab sets Name, Priority (a higher priority number applies before a lower one), Valid from/until, Max. total uses, Max. uses per customer, and an Active toggle. For codes, a promotion can have: no code (automatic), a single Fixed promotion code shared by all customers (optionally auto-generated), or Individual promotion codes generated per order/customer — each individual code can only be redeemed once. Individual code generation can be configured via code length, an optional prefix/suffix, or a custom pattern using %s for a random letter (A-Z) and %d for a random digit (0-9), e.g. SW-%s%d%s%d%s-TEST; regenerating codes invalidates the previous ones. The Conditions tab lets you restrict which sales channels the promotion applies to, prevent combination with other promotions or specific named promotions, and add rule-based conditions via the Rule Builder (Customer rules, Shopping cart rules, Order rules) plus 'Promote sets of products' (set groups with Mode — Number/Value Gross/Value Net —, Value, Sorting, and Product rules); if multiple rules of the same type are selected only one needs to match (OR logic) — to require all conditions together you must create separate promotions. The Discounts tab defines what the discount applies to (entire cart, shipping costs, entire product set, or a specific set group), optionally restricts to a specific range of products, and sets the discount Type (Absolute, Percentage, Fixed price, or Fixed unit price — a fixed price cannot exceed the normal price), Value, an optional Maximum discount value (percentage type only), and per-currency overrides; discount settings become read-only once the promotion has been used in an order. In the storefront, customers enter a code via 'Enter voucher code' in the shopping cart or OffCanvas cart and confirm it, after which the discount appears in the article overview. To track redeemed individual codes, open the promotion in the admin and check the 'Redeemed' count, then filter the order overview by promotion code (fixed codes are tracked the same way). Only one individual promotion code can be redeemed per promotion at a time, and placing an exclusion rule in the shopping-cart conditions (rather than the discount's own product rules) will block the whole promotion instead of just excluding that product from the discount.","citations":["platform/func/marketing/promotions.md:1-51"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"individual.*code|promotion","path":"platform/func","regex":true,"mode":"files"}},{"tool":"read_doc","args":{"path":"platform/func/marketing/promotions.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-04":{"query":"What does the Shopware Migration Assistant transfer automatically from Shopware 5, and what has to be mapped by hand before the migration starts?","category":"func","option":"mcp-wiki","answer":"The Migration Assistant transfers several selectable data groups automatically, of which Basic data is mandatory: Basic data (categories, customer groups, currencies, sales channels, number ranges), Products (products, properties, product options, product properties, translations, cross-selling, main variant relations), Customers & orders (customers, shipping methods, orders, order documents), Promotions (customers, promotions), SEO URLs (products, properties, product options, product properties, translations, cross-selling, main variant relations, SEO URLs), and Product reviews (products, properties, product options, product properties, translations, cross-selling, main variant relations, customers, reviews, media). Before the migration starts, the following must be manually mapped by first creating the matching entities in Shopware 6: payment methods, the standard payment method, salutation, delivery time, and the standard delivery time — fields cannot be re-mapped after the migration has run, even after a reset; remapping requires deleting and recreating the migration entirely. Note that although 'shipping methods' appears in the automatically migrated Customers & orders group, shipping and payment methods are not actually functionally transferred because Shopware 6 now uses Rule Builder-based shipping cost and payment risk-management rules — these must be recreated under Settings > Commerce > Shipping and Settings > Commerce > Payment methods. Other things that need manual rework after migration (not transferred at all) include document templates (redesigned, reconfigure under Settings > Commerce > Documents), email templates (now Twig-based, cannot reuse Shopware 5 templates, managed under Settings > Content > Email templates), Shopping Worlds/shop pages (become Shopping Experiences and must be recreated under Content > Shopping Experiences), storefront templates (cannot be reused due to the redesigned architecture), and the B2B Suite (cannot be transferred at all). Migrated shops/subshops become additional sales channels alongside Shopware 6's two default sales channels created on install, so domain settings need adjusting afterward, and countries should be checked under Settings > Localisation > Countries.","citations":["platform/func/migration-en/what-is-migrated.md:1-64"],"toolCallLog":[{"tool":"read_doc","args":{"path":"platform/func/migration-en/what-is-migrated.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-05":{"query":"How do I set up a sales channel — storefront versus headless type, domains, languages and currencies — and where do I get its API access key?","category":"func","option":"mcp-wiki","answer":"Create a sales channel via the plus icon next to 'Sales Channel' in the administration main menu, choosing either 'Sales Channel with HTML storefront', a 'headless sales channel' (API only), or a product comparison export channel. In General settings you configure the Name, whether it's a favourite, the entry-point main/footer/service navigation, navigation levels, the default Customer group for new/anonymous customers, Countries, Languages, and Standard units of measurement. Under Payment and shipping you assign the available Payment methods (and default), Shipping methods (and default), Currencies (and default), and the Tax calculation method. For multi-language, self-hosted shops, each Domain is configured with its own URL, Language, Currency, Snippet set, and unit system — this is how a shop on separate URLs per language is set up (cloud instances instead get an auto-generated URL with all traffic forwarded over an encrypted connection). After enabling Hreflang you pick a default domain used as a fallback for all languages, to avoid duplicate-content classification across language versions. The API access key/ID for the channel is generated under the sales channel's 'API access' section — an API Access ID is generated there for the channel. The Status area lets you temporarily disable the channel, enable maintenance mode, and IP-whitelist access (behind a proxy, whitelisting requires TRUSTED_PROXIES=IP_of_the_proxy in .env or the equivalent Symfony trusted-proxies config). The preinstalled headless sales channel should never be deleted since several extensions (including the B2B Suite) depend on it — hide it from the sidebar via favourites instead if you don't need it visible, and deleting any sales channel via 'Delete Sales Channel' is irrevocable.","citations":["platform/func/settings/saleschannel.md:1-68"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"sales channel","path":"platform/func","glob":"**/*saleschannel*","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"access key","path":"platform/func","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/func/settings/saleschannel.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-06":{"query":"Which triggers and actions does the Flow Builder offer, and how do I make it send a mail when an order is placed?","category":"func","option":"mcp-wiki","answer":"Flow Builder (Settings > Automation > Flow Builder) automates business processes by combining an event trigger, optional Rule Builder conditions, and one or more actions. Example trigger names include checkout.order.placed, checkout.customer.register, state_enter.order.state.completed, state_leave.order_transaction.state.paid, newsletter.register, mail.before.send, and checkout.order.payment_method.changed (this last one already sets order status to 'Open' automatically, so a flow on it must not also try to set that status). Available actions (depending on the chosen trigger) are: Assign account status, Assign affiliate and campaign code (with an override option), Assign customer group, Generate a document, Send mail (to Administrator — reaching all admin-flagged users including external API users —, Customer, or custom addresses), Assign status (payment/shipping/order status, with interdependent rules e.g. Refunded/Partially Refunded/Chargeback require a prior Paid/Partially Paid status), Stop flow (halts the whole flow including parallel branches), Set download access, Change custom field content (customer or order), and Add Tag/Remove Tag. Delayed Actions (Shopware Beyond plan) let you add a delay (Hour/Day/Week/Month/User defined, custom format SS.TT.WW.MM) before an action fires. Webhook Actions (Evolve plan + Shopware Commercial) add a 'Call URL (Webhook)' action supporting GET/POST/PUT/PATCH/DELETE with parameters, headers, body and Basic Auth. To send a mail when an order is placed: create a new flow (Add Flow), fill in the General tab (Name, Description, Priority, Active), then in the Flow tab select the trigger checkout.order.placed, optionally add Rule Builder conditions, and add the action Send mail, choosing the recipient (Customer, Administrator, or custom addresses) and the mail/document template to use.","citations":["platform/func/settings/Flow-Builder.md:1-52"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"flow builder","path":"platform/func","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/func/settings/Flow-Builder.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-07":{"query":"How do I import products from a CSV with an import/export profile — column mapping, matching identifiers and a dry run?","category":"func","option":"mcp-wiki","answer":"Import/Export is managed under Settings > Automation > Import/Export. The CSV file must be UTF-8, use a semicolon as field separator and quotation marks as the string separator, and prices must use a dot as decimal separator (e.g. 5.00, not 5,00). On the Profiles tab you can use a standard profile or create a new one: set Profile name, Usage (import/export/both), Object type (e.g. Product, Customer), Separator character (default semicolon), Enclosure character, and Import settings (Create new records / Update existing data) — you must also pick the default system language or import/export won't work. Column mapping happens in the profile's Mappings section: 'Add new mapping' lets you map a CSV column name to a database entry (field), and mark it Required, give it a Default Value, and set its Position. For products, the mandatory fields are id, taxId, productNumber, stock, and name; a typical default product CSV also has columns like parent_id, active, description, price_net, price_gross, tax_rate, tax_name, cover_media_id/url, manufacturer_id/name, categories, and sales_channels. To match rows to existing entities via an identifier other than the internal UUID (e.g. productNumber), use the 'Second Unique Identifier' setting on the profile's Advanced Settings tab — note that if the chosen identifier is not actually unique, only the first matching record is resolved. On the Import tab you upload the CSV file, select the profile, and then either 'Start import' or 'Start dry run' — the dry run validates the file without writing any data, which is the safe way to check mapping/identifiers before committing. Import activity for the last 30 days is listed with a per-row context menu to re-download the source or erroneous CSV files, and the process can be aborted. Note that import can only add data, not remove it — e.g. it will not clear an existing sales channel assignment. For product variants specifically, a four-step process is used: import products with id/parent_id empty via the default product profile, import properties with group_id empty via the default properties profile, link products and properties via option_id/product_id using the default variant configuration settings profile, then import the variants themselves via the Default product profile with 'Import product variants' enabled (mandatory: parent_id, product_number, active, stock, optionIds pipe-separated) or generate them via the product's 'Generate variants' tab.","citations":["platform/func/shopware-en/settings/importexport.md:1-79"],"toolCallLog":[{"tool":"read_doc","args":{"path":"platform/func/shopware-en/settings/importexport.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-08":{"query":"How do custom field sets work — entity assignment, field types and technical name — and can a custom field be written through the Store API?","category":"func","option":"mcp-wiki","answer":"Custom fields (Settings > System > Custom fields) let merchants add their own data fields to entities like products or categories, for use in the Rule Builder, storefront templates, or Shopping Experiences. Custom fields are grouped into sets: a set is created via 'New set' with a unique, unchangeable technical name, a Position, a translatable Label, and the program areas (entities) it is assigned to — e.g. products, categories; a set with no assigned area is created but unavailable anywhere. Within a set, individual fields are created via 'New custom field'; a technical name is always required and, like the set's, cannot be changed later. Field types include: Select, Object selection (references products, categories, countries, shipping/payment methods, etc. — the object type cannot change after creation), Text field, Media, Number (integer/float, with Steps, Min, Max), Date/Time, Checkbox, Active/Inactive switch (boolean '0'/'1'), Text Editor, and Color picker. Common per-field options are Technical name, Position, 'Available in shopping carts' (required to use the field in the Rule Builder or custom templates), 'Modifiable via Store API' (marks the field public), Label, Placeholder, and Help text. Regarding the Store API question: yes — a custom field can be exposed and written through the Store API by enabling the 'Modifiable via Store API' option on that field, which marks it public; the documentation explicitly warns not to enable this for sensitive data such as customer information, since it makes the field publicly writable. Other gotchas: custom fields must be edited in the store's default language (other-language edits only override that language and can silently break rule evaluation for un-maintained languages); technical names must avoid Twig special characters such as '-' or '#' or product exports can error; and custom fields are automatically created as snippets in all snippet sets with no database changes needed. (On the app/plugin developer side, custom field sets are instead registered via a <custom-fields> element with name, label, related-entities and fields, either inline in manifest.xml — deprecated since 6.7.13.0 — or in a dedicated Resources/config/custom-fields.xml file, with field and set names required to carry a vendor prefix for global uniqueness.)","citations":["platform/func/settings/custom-fields.md:1-65","platform/dev/6.7/guides/plugins/apps/custom-data/custom-fields.md:1-60"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"custom field","path":"platform/func","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"custom field","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/func/settings/custom-fields.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/apps/custom-data/custom-fields.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-09":{"query":"Why doesn't my payment method appear in the checkout — what has to be configured in the administration?","category":"func","option":"mcp-wiki","answer":"Payment methods are managed under Settings > Commerce > Payment methods. For a method to appear at checkout, several things need to be configured: (1) the method must have its Active toggle enabled in the payment method overview/edit form; (2) it must actually be assigned to the relevant sales channel — a method that is active but not assigned to the sales channel a customer is shopping in will not appear there, since 'a method also needs to be assigned in the relevant sales channel to actually appear to customers there'; (3) its Availability rule field (a Rule Builder rule) must not be excluding the current cart/customer/country — leaving it blank (NULL) means unrestricted availability, but a configured rule (e.g. a billing-country condition using 'Is one of'/'Is none of', commonly used for geoblocking-style restrictions) can hide the method for a given checkout context; and (4) if it's meant to be selectable as a subsequent/later payment method on an existing order, 'Allow as subsequent payment method' must be enabled on the method in addition to it being assigned to the sales channel. When troubleshooting a missing payment method in the admin's own order-creation screen, the documentation specifically notes: if a payment method doesn't appear in the options list, check that 'Allow as subsequent payment method' is enabled and that the method is assigned to the sales channel. Also note that changing a payment method's Technical name after creation can make it stop working entirely — that field should be set as early as possible and not changed later.","citations":["platform/func/settings/Paymentmethods.md:1-32","platform/func/tutorials-and-faq/payment-methods-for-several-countries.md:1-40"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"doesn't appear|does not appear|not appear","path":"platform/func","regex":true,"mode":"content"}},{"tool":"read_doc","args":{"path":"platform/func/tutorials-and-faq/payment-methods-for-several-countries.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-10":{"query":"How do dynamic product groups work in the administration and where can the resulting group be used?","category":"func","option":"mcp-wiki","answer":"Dynamic product groups are found under Catalogues > Dynamic product groups in the administration. Each group is a set of products formed by rule-based conditions rather than a manual list. When creating/editing a group you set General information (Name, Description, and 'Keep matching variants grouped' which controls whether matching variants are shown grouped under the shared main product or individually — this affects categories, cross-selling and CMS product sliders). In Conditions you pick a property and a condition, chain further conditions with AND/OR, and can nest indefinitely with SUB-CONDITION (an item must satisfy both the main condition and the sub-condition); a Preview button shows the currently matching products. Available operators for multi-value properties (products, categories, manufacturers, tags, properties) are: Is equal to, Is not equal to, Is equal to any of, Is not equal to any of, Is equal to all of, Is not equal to all of. Custom fields can also be used as condition properties, and delivery-time conditions use the merchant's defined delivery times (deleting a delivery time used in a condition breaks that condition). The overview list shows each group's status, which becomes 'invalid' if the group depends on rules from a currently deactivated plugin. The resulting dynamic product group can then be used to dynamically fill category content (e.g. sale or manufacturer categories), to feed product comparison content, and to power the product slider CMS element in Shopping Experiences.","citations":["platform/func/shopware-6-de/Catalogues/Dynamicproductgroups.md:1-70"],"toolCallLog":[{"tool":"kb_status","args":{}},{"tool":"read_doc","args":{"path":"platform/index.md"}},{"tool":"grep_docs","args":{"pattern":"dynamic product group","path":"platform/func","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/func/shopware-6-de/Catalogues/Dynamicproductgroups.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-11":{"query":"How do I create an integration for Admin API access in the administration and give it the right privileges?","category":"func","option":"mcp-wiki","answer":"Go to Settings > System > Integrations and use 'Create integration'. Give it a name, then decide whether it gets Administrator permissions (full access) or assign it an existing role instead. On creation Shopware issues an access ID and a security key; the security key is shown only once at creation time, so it must be saved immediately — it cannot be retrieved again later, and using 'Regenerate API access key' rotates both the security key and the access ID, invalidating the old credentials. To give the integration the right privileges without making it a full administrator, create a role first under Settings > System > Users & Permissions ('New role'): give it a name/description, then assign Authorisations per functional area using the rights View, Edit, Create, Delete, or All — permissions build left to right (Edit implies View; Create implies Edit and View), except Delete, which only implicitly grants View. There are also 'Additional permissions' not tied to one area (e.g. Basic configurations, Run Updates, Maintain extensions, Upload extensions, Logging, Clear cache, Import/Export, Shopware Store, Update own profile, Create discounts, Apps), and 'Detailed permissions' that expose every permission by technical name with read/write/create/delete rights, useful when an extension doesn't declare privileges correctly. Once the role is created, assign that role to the integration on the Integrations screen instead of granting it Administrator status.","citations":["platform/func/settings/system/integrationen.md:1-44","platform/func/settings/system/user.md:1-75"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"integration","path":"platform/func","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/func/settings/system/integrationen.md"}},{"tool":"grep_docs","args":{"pattern":"privilege","path":"platform/func/settings/system","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/func/settings/system/user.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"func-12":{"query":"A spec asks for customer-specific pricing and for a flow that calls an external URL when an order is placed — before I build either of them, does Shopware already ship them, and what has to be licensed or installed for them to exist in the shop?","category":"func","option":"mcp-wiki","answer":"Both are already built into Shopware, but with different licensing/setup requirements. Customer-specific pricing (letting a shop offer individually calculated prices — list prices, graduated prices, or currency-dependent prices — per customer, synced from an external system such as an ERP) is only available from the Shopware Beyond plan via the Shopware Commercial extension. It has no storefront module entry and no dedicated Administration UI: creating, reading, changing and deleting the custom prices is only possible via the Admin API's bulk-edit-custom-prices endpoint, and variant inheritance does not apply (each variant needs its own priced entry); the individual price is shown in the storefront only while the matching customer is logged in. So to have this feature exist in the shop you need a Shopware Beyond subscription plus the Shopware Commercial extension installed/activated — no custom development needed for the pricing mechanism itself, only API integration work. Calling an external URL when an order is placed is covered by Flow Builder's built-in Webhook action: you create a flow triggered on the order-placed event and add a webhook action, which forwards data to an API-based third-party provider/URL, either as a notification or as a request for the receiving server to act on the data. This is a native Flow Builder capability and requires no additional license or extension — just building the flow in the administration.","citations":["platform/func/extensions/customer-specific-pricing.md:1-43","platform/func/features/webhook-actions-in-flow-builder.md:1-36"],"toolCallLog":[{"tool":"read_doc","args":{"path":"platform/func/features/customer-specific-pricing.md"}},{"tool":"read_doc","args":{"path":"platform/func/features/webhook-actions-in-flow-builder.md"}},{"tool":"read_doc","args":{"path":"platform/func/extensions/customer-specific-pricing.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-01":{"query":"How do I configure Shopware 6's built-in GraphQL API for the Store API?","category":"edge","option":"mcp-wiki","answer":"Nothing relevant was found in the wiki: there is no mention of GraphQL anywhere in the platform layer (developer docs for 6.6/6.7, functional docs, hubs, or the synonyms index). Shopware 6's Store API is a REST-based JSON API, not GraphQL; there is no built-in GraphQL API to configure. The premise of the question does not match what this corpus documents, so this appears to be a feature that does not exist in Shopware 6 as covered by this documentation set. [from memory] Shopware's Store API, Admin API and Sales Channel API are all REST/OpenAPI based; Shopware has never shipped a first-party GraphQL endpoint. [from memory]","citations":[],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"graphql","path":"platform","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"graphql","path":"platform/synonyms.md"}},{"tool":"list_docs","args":{"path":"platform","glob":"synonyms*"}},{"tool":"grep_docs","args":{"pattern":"graphql","path":"platform/synonyms"}}],"notFoundClaim":true,"memoryClaims":["Shopware's Store API, Admin API and Sales Channel API are all REST/OpenAPI based; Shopware has never shipped a first-party GraphQL endpoint."],"sourceVerdict":"no"},"edge-02":{"query":"How do I get the DI container with `Shopware()->Container()` and override the product listing Smarty template in Shopware 6?","category":"edge","option":"mcp-wiki","answer":"Nothing relevant was found for either part of this question, because both `Shopware()->Container()` and Smarty templates are Shopware 5 concepts, not Shopware 6. A search for 'smarty' across the whole platform layer (developer docs, functional docs, hubs) returned no matches, and a search for the `Shopware()->Container()` global-function pattern also returned nothing. [from memory] In Shopware 6, the templating engine is Twig, not Smarty, and the dependency injection container is Symfony's service container, accessed inside services via constructor injection or, in a pinch, by injecting the `service_container`/`Psr\\Container\\ContainerInterface` — there is no `Shopware()` global helper function; that pattern belonged to the legacy Shopware 5 architecture. To override the storefront's product listing template in Shopware 6, a plugin/theme extends the relevant Twig template (e.g. `storefront/component/product/listing.html.twig`) using Twig's `{% sw_extends %}`/block mechanism, not a Smarty override. [from memory] Since this documentation set has no content on Smarty or the legacy container accessor, I could not confirm exact syntax from the corpus itself — the answer above is from general Shopware knowledge, not a corpus citation.","citations":[],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"smarty","path":"platform","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"Shopware\\(\\)->Container\\(\\)","path":"platform","regex":true,"mode":"files"}},{"tool":"grep_docs","args":{"pattern":"product listing template|listing.html.twig","path":"platform/dev/6.7","regex":true,"mode":"files"}}],"notFoundClaim":true,"memoryClaims":["In Shopware 6, the templating engine is Twig, not Smarty, and the dependency injection container is Symfony's service container, accessed inside services via constructor injection or, in a pinch, by injecting the `service_container`/`Psr\\Container\\ContainerInterface` — there is no `Shopware()` global helper function; that pattern belonged to the legacy Shopware 5 architecture.","To override the storefront's product listing template in Shopware 6, a plugin/theme extends the relevant Twig template (e.g. `storefront/component/product/listing.html.twig`) using Twig's `{% sw_extends %}`/block mechanism, not a Smarty override."],"sourceVerdict":"no"},"edge-03":{"query":"Where do the `#[ORM\\Entity]` mapping attributes for my plugin's entity go in Shopware 6, and how do I get Doctrine's `EntityManager` injected into my service so I can persist it?","category":"edge","option":"mcp-wiki","answer":"The premise does not hold: Shopware 6 explicitly does not use Doctrine ORM for entities. The wiki's Data Abstraction Layer page states it describes 'the Data Abstraction Layer (DAL), Shopware's thin, non-ORM interface for database access, used instead of an ORM like Doctrine' — so there is no `#[ORM\\Entity]` mapping attribute location and no Doctrine `EntityManager` to inject. Instead, a plugin entity is defined as a DAL `EntityDefinition` (fields declared in PHP, not attributes) and persisted through an `EntityRepository`, injected via constructor injection with autowiring (e.g. `public function __construct(EntityRepository $productRepository)`) or wired explicitly in `services.xml`/PHP config as `$services->set(...)->args([service('product.repository')])`. The DAL also handles translations, entity versioning, product/variant inheritance and an Entity Indexer pattern that pre-computes aggregations on write — none of which are Doctrine ORM constructs.","citations":["platform/dev/6.7/concepts/framework/data-abstraction-layer.md:1-63"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"Doctrine","path":"platform","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/concepts/framework/data-abstraction-layer.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"edge-04":{"query":"How do I fetch products with `GET /sales-channel-api/v3/product` on Shopware 6.7?","category":"edge","option":"mcp-wiki","answer":"The Sales Channel API is deprecated as of Shopware 6.4, and the developer docs explicitly say new/plugin routes must not implement it — it is not the interface to use on 6.7. The wiki's Store API plugin-conventions page states as a core principle: 'Do not implement the Sales Channel API — deprecated as of 6.4,' repeated again under Gotchas: 'The Sales Channel API is deprecated as of Shopware 6.4 — new routes must not implement it.' The modern replacement for customer-facing/product-fetching calls is the Store API. To fetch products on 6.7 you call the Store API's product search route (e.g. `POST /store-api/product` or `/store-api/search`, authenticated with the sales-channel `sw-access-key` header) rather than the legacy `/sales-channel-api/v3/...` endpoints. The hub notes a full worked example exists at 'Create a Product and Complete Checkout,' which creates a product via the Admin API and then reads/carts/checks out via Store API endpoints such as `/store-api/context` and `/store-api/search`.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/store-api/_index.md:1-53","platform/hubs/store-api.md:1-83"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"sales-channel-api","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"sales-channel-api","path":"platform","mode":"content"}},{"tool":"grep_docs","args":{"pattern":"Sales Channel API","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/hubs/store-api.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/store-api/_index.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"edge-05":{"query":"How do I enable Shopware's built-in MCP server on a Shopware 6.6 shop?","category":"edge","option":"mcp-wiki","answer":"This cannot be done: Shopware's built-in MCP server is a 6.7 feature and does not exist on 6.6. All MCP-server documentation in the corpus lives exclusively under `platform/dev/6.7/` (e.g. `products/tools/mcp-server/getting-started.md`, `configuration.md`, `intro.md`); a search for 'mcp' across the entire `platform/dev/6.6` directory returned no matches at all. The 6.7 getting-started guide states the prerequisites as 'Shopware 6.7.14.0+ (on 6.7.11.0–6.7.13.x, set `MCP_SERVER=1` in `.env` first and skip discovery)' plus the `symfony/mcp-bundle` package — i.e. even within the 6.7 line it only became available from 6.7.11.0 onward (behind a flag) and fully from 6.7.14.0. Since 6.6 predates all of these versions, the MCP server cannot be enabled on a 6.6 shop through documented means. On a 6.7 shop meeting the version prerequisite, the process is: install/verify `symfony/mcp-bundle`, create an integration with `bin/console integration:create \"My MCP Client\" --admin` (scoped ACL role instead of `--admin` in production), configure the AI client (Claude Desktop/Cursor via `streamable-http`, Claude Code via `http` transport in `.mcp.json`, Codex via `config.toml`) pointing at `/api/_mcp` with `sw-access-key`/`sw-secret-access-key` headers, verify with `bin/console debug:mcp`, and discover tools via `shopware-tool-search`/`shopware-toolsets-list`/`shopware-toolset-enable`.","citations":["platform/dev/6.7/products/tools/mcp-server/getting-started.md:1-47"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"MCP server","path":"platform","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/products/tools/mcp-server/getting-started.md"}},{"tool":"grep_docs","args":{"pattern":"mcp","path":"platform/dev/6.6","mode":"files"}}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"edge-06":{"query":"I'm coming from Magento — what are the Shopware equivalents of store views, extensions, attribute sets and `di.xml`?","category":"edge","option":"mcp-wiki","answer":"The wiki's Magento-to-Shopware migration dictionary maps 'Magento's Manage Stores' (store views/store groups) to Shopware **Sales channels**, configured in the left sidebar, with sales channel types Storefront (public URL shop), Product comparison (exports to price portals/marketplaces), and Headless (API-only). For attribute sets, the same page states: 'No \"attribute set\" or hard product-type separation exists in Shopware. Variants are generated on a base product via Properties and are not independent products, unlike in Magento' — so Shopware's closest equivalent is the Properties system used to generate variants on a base product, not a separate attribute-set concept. Magento modules ('extensions') correspond to Shopware plugins (installed into the codebase, similar to Magento modules) or apps (installed via manifest, more decoupled/API-driven); the migration page itself doesn't use the word 'plugin' explicitly but frames Magento's modular customization concept as mapping onto Shopware's own extension system reachable via the Shopware Store. [from memory: the plugin-vs-app distinction and the general 'Magento module → Shopware plugin/app' mapping is general Shopware knowledge, not stated verbatim on the migration page.] For `di.xml`, Shopware plugins configure their Symfony dependency-injection container via `services.xml`/`services.php` (PHP configurator syntax), not an XML di.xml grammar: the developer docs show declaring `autowire`/`autoconfigure` in `services.php` for automatic constructor injection, or explicit registration such as `$services->set(ExampleService::class)->args([service(SystemConfigService::class)])` using Symfony's `Loader\\Configurator\\service()` function — this is Shopware/Symfony's equivalent of Magento's `di.xml` preference/argument wiring.","citations":["platform/func/migration-en/magento-firststeps.md:1-42","platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md:1-57"],"toolCallLog":[{"tool":"read_doc","args":{"path":"platform/func/migration-en/magento-firststeps.md"}},{"tool":"grep_docs","args":{"pattern":"di.xml","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"Magento","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"services.xml","path":"platform/dev/6.7/guides/plugins/plugins/plugin-base-guide.md"}},{"tool":"grep_docs","args":{"pattern":"services.xml","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md"}}],"notFoundClaim":false,"memoryClaims":["the plugin-vs-app distinction and the general 'Magento module → Shopware plugin/app' mapping is general Shopware knowledge, not stated verbatim on the migration page."],"sourceVerdict":"partial"},"edge-07":{"query":"How do I set up Shopware PWA as the storefront for a Shopware 6.7 shop?","category":"edge","option":"mcp-wiki","answer":"There is no setup guide in this corpus, and for good reason: Shopware PWA is in maintenance mode and is not documented at all under the 6.7 developer directory (a search for 'Shopware PWA' across `platform/dev/6.7` returned zero hits). It only appears as a 6.6 product page, which itself says: 'Shopware PWA is a Single Page Application built with JavaScript and Vue.js that provides a decoupled storefront, integrating Shopware functionality into an extensible frontend application. It is based on the Store API,' and under Gotchas: 'Shopware PWA is currently in maintenance mode; Composable Frontends is recommended as the future direction for headless commerce with Shopware.' So for a 6.7 shop, Shopware's own documentation does not offer a Shopware PWA setup path — the recommended decoupled/headless storefront approach going forward is Composable Frontends, built on the same Store API, rather than Shopware PWA.","citations":["platform/dev/6.6/products/pwa.md:1-25"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"Shopware PWA","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.6/products/pwa.md"}}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"edge-08":{"query":"Which service do I type-hint to read products — `EntityRepositoryInterface` — and how do I inject it into my plugin service?","category":"edge","option":"mcp-wiki","answer":"There is no `EntityRepositoryInterface` in Shopware 6 — the wiki documents the concrete `EntityRepository` (DAL repository) as the class/service you use to read entities such as products. Product data is exposed as the service `product.repository` (pattern `<entity_name>.repository`). To inject it into your own plugin service, declare it as a constructor argument and wire it in `services.php` via `service('product.repository')` (Symfony DI `service()` helper from `Symfony\\Component\\DependencyInjection\\Loader\\Configurator`). Once injected you call e.g. `$this->productRepository->search(new Criteria(), $context)` to read products. More generally, if your plugin's DI config already has `autowire`/`autoconfigure` enabled, a type-hinted constructor argument is enough for services that are autowired; for repositories you still reference them by their `<entity>.repository` service id (not by an interface type-hint) either implicitly via autowiring on the id or explicitly via `->args([service('product.repository')])`.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md:1-55","platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md:1-57"],"toolCallLog":[{"tool":"kb_status","args":{}},{"tool":"read_doc","args":{"path":"platform/index.md"}},{"tool":"grep_docs","args":{"pattern":"EntityRepository","path":"platform/dev/6.7","glob":"**/*plugin*","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"EntityRepository","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"product.repository","path":"platform/dev/6.7","mode":"files"}},{"tool":"list_docs","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/data-handling"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"partial"},"edge-09":{"query":"Where do I configure Business Events so that a mail is sent when an order is placed in Shopware 6.7?","category":"edge","option":"mcp-wiki","answer":"In Shopware 6.7 the legacy \"Business Events\" screen (Settings > Shop > Business Events) still exists but is only meant for shops still using the B2B-Suite — for everything else it was superseded by the Flow Builder as of major release 6.4.8.0. On the Business Events screen itself you would click 'Add Business-Event', set a Title, mark it Active, pick the triggering Event 'Order placed' (technical name `checkout.order.placed`), choose the Email template to send, and optionally scope it to a Sales Channel and/or restrict it with Rule Builder rules; if you also fill in internal Email recipients, the customer will not automatically get the mail unless you add a second, otherwise identical event. For a normal (non-B2B-Suite) 6.7 shop, the recommended and current place to do this is Settings > Automation > Flow Builder: create a flow with trigger `checkout.order.placed`, optionally add Rule Builder conditions, and add the action 'Send mail' (choosing Administrator, Customer, or custom addresses as recipients).","citations":["platform/func/settings/Business-Events.md:1-42","platform/func/settings/Flow-Builder.md:1-52"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"Business Event","path":"platform/func","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"order placed","path":"platform/func","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/func/settings/Business-Events.md"}},{"tool":"grep_docs","args":{"pattern":"checkout.order.placed","path":"platform/func/settings/Flow-Builder.md"}},{"tool":"read_doc","args":{"path":"platform/func/settings/Flow-Builder.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"gap-01":{"query":"How do I add my own Admin API endpoint under `/api/...` from a plugin — a controller with the api route scope and its ACL?","category":"gap","option":"mcp-wiki","answer":"The wiki has no dedicated guide for adding a custom Admin API (`/api/...`) controller from a plugin — I searched `platform/dev/6.7` for route-scope, admin-api and controller terms and only found the analogous Storefront guide and the Store API guide, plus a separate ACL guide; there is no `add-custom-admin-api-controller`-style page. From the pieces that do exist: the documented pattern for any custom route in a plugin is to extend the appropriate base controller and tag the class or route with `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [<Scope>::ID]])]` — for Storefront routes this is `StorefrontRouteScope::ID`, for Store API routes `StoreApiRouteScope::ID`; by the same convention an Admin API controller would use `Shopware\\Core\\Framework\\Api\\Acl\\...`/`AdminApiRouteScope::ID` and a route name starting with `api.` so the router recognizes it, though the wiki itself does not show this admin-scope example. [from memory] The controller must be registered as a public service in `services.php` (`->public()->call('setContainer', [service('service_container')])`) and its routes imported via `routes.php` (`$routes->import('.../Controller/*Controller.php', 'attribute')`), per the Storefront controller guide. For access control, the wiki's ACL guide documents registering a privilege via `Shopware.Service('privileges').addPrivilegeMappingEntry()` (Administration UI gating) and `Plugin::enrichPrivileges()` to add privileges to existing roles from PHP — but it explicitly warns that Administration ACL rules only gate the UI, not the API: 'ACL rules in the Administration UI can be bypassed by making direct API calls to the backend — they only gate visibility/behavior in the UI, not the API itself.' Enforcing ACL on a custom Admin API route itself (e.g. via the `Acl` route defaults/`#[Acl(['my_privilege'])]` attribute) is not documented on any page this search reached. [from memory]","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:1-83","platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:1-72","platform/dev/6.7/guides/plugins/plugins/framework/store-api/_index.md","platform/hubs/admin-api.md:1-96"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"route_scope.*api","path":"platform/dev/6.7","regex":true,"mode":"files"}},{"tool":"grep_docs","args":{"pattern":"Admin API","path":"platform/dev/6.7","glob":"**/*controller*","mode":"files"}},{"tool":"list_docs","args":{"path":"platform/dev/6.7/guides/plugins/plugins/administration"}},{"tool":"grep_docs","args":{"pattern":"api-route","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"RouteScope","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"add.*acl.*privilege|Acl.*privilege","path":"platform/dev/6.7","regex":true,"mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}},{"tool":"grep_docs","args":{"pattern":"ApiRouteScope","path":"platform/dev/6.7","mode":"content"}},{"tool":"grep_docs","args":{"pattern":"_acl","path":"platform/dev/6.7/resources/references/security.md"}},{"tool":"grep_docs","args":{"pattern":"ApiRouteScope::ID","path":"platform/dev/6.7","mode":"content"}},{"tool":"read_doc","args":{"path":"platform/hubs/admin-api.md"}},{"tool":"grep_docs","args":{"pattern":"admin.*route.*scope|api route scope","path":"platform/dev/6.7","regex":true,"mode":"content"}},{"tool":"grep_docs","args":{"pattern":"admin api endpoint|custom admin api|api route in plugin","path":"platform/synonyms.md","regex":true}}],"notFoundClaim":true,"memoryClaims":["for Storefront routes this is `StorefrontRouteScope::ID`, for Store API routes `StoreApiRouteScope::ID`; by the same convention an Admin API controller would use `Shopware\\Core\\Framework\\Api\\Acl\\...`/`AdminApiRouteScope::ID` and a route name starting with `api.` so the router recognizes it, though the wiki itself does not show this admin-scope example.","Enforcing ACL on a custom Admin API route itself (e.g. via the `Acl` route defaults/`#[Acl(['my_privilege'])]` attribute) is not documented on any page this search reached."],"sourceVerdict":"partial"},"gap-02":{"query":"Shopware 6.7 removed the RSA JWT key files and `system:generate-jwt-secret` — what signs Admin API tokens now, and what do I have to do when upgrading?","category":"gap","option":"mcp-wiki","answer":"Nothing relevant was found in the served wiki. I grepped `platform/dev/6.7` and `platform/dev/6.6` for `jwt`, `generate-jwt-secret`, `system:generate-jwt-secret`, `JWT_PRIVATE_KEY`/`JWT_PUBLIC_KEY`, and `RSA`, and read the Admin API concept page (`platform/dev/6.7/concepts/api/admin-api.md`), which only points to the external Stoplight reference for authentication details and says nothing about JWT signing internals. The only JWT-related material in the corpus is the `shopware-cli project generate-jwt` helper command page, which is about the third-party Shopware CLI tool (not the Shopware core `system:generate-jwt-secret` console command) and states 'generate-jwt is only required for Shopware versions before 6.5 — 6.5+ generates JWT secrets automatically' — it does not mention any 6.7 change to RSA key files or token signing. There is no page in this wiki documenting the removal of RSA JWT key files, the removal of `system:generate-jwt-secret`, what now signs Admin API tokens in 6.7, or any related upgrade steps. This appears to be a genuine gap in the served corpus for this topic.","citations":["platform/dev/6.7/products/tools/cli/project-commands/helper-commands.md","platform/dev/6.7/concepts/api/admin-api.md:1-28"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"generate-jwt-secret","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"jwt","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"jwt","path":"platform/dev/6.7/products/tools/cli/project-commands/helper-commands.md"}},{"tool":"grep_docs","args":{"pattern":"JWT_PRIVATE_KEY|JWT_PUBLIC_KEY|jwt.*key|RSA","path":"platform/dev/6.7","regex":true,"mode":"files"}},{"tool":"grep_docs","args":{"pattern":"6.7","path":"platform/dev/6.7/concepts/api","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"system:generate-jwt-secret","path":"platform/dev","mode":"files"}},{"tool":"list_docs","args":{"path":"platform/dev/6.7","glob":"**/*upgrade*"}},{"tool":"grep_docs","args":{"pattern":"jwt","path":"platform/dev/6.7/resources/references/core-reference/commands-reference.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/concepts/api/admin-api.md"}}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"gap-03":{"query":"My ERP integration stopped logging in after the 6.7 upgrade — what changed in the Admin API OAuth flow (`/api/oauth/authorize`, the `scope` format)?","category":"gap","option":"mcp-wiki","answer":"Nothing relevant was found. I grepped `platform/dev/6.7` for `oauth/authorize`, `authorize`, `client_credentials`/`OAuth2`, and `scope`, and read the page that came back on OAuth token requests, `platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md`. That page documents only `/api/oauth/token` with `grant_type=password` (local dev shortcut, `client_id: administration`, `scopes: write`) versus `grant_type=client_credentials` (the default for real integrations) — it does not mention an `/api/oauth/authorize` endpoint at all, nor any 6.7-specific change to the OAuth flow or to the `scope` parameter's format. No page anywhere under `platform/dev/6.7` mentions `/api/oauth/authorize`. There is no documented explanation in this wiki of an Admin API OAuth-flow or scope-format change between 6.6 and 6.7 — this is a gap in the served corpus for this specific topic.","citations":["platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md:1-44"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"oauth/authorize","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"client_credentials|OAuth2","path":"platform/dev/6.7","regex":true,"mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md"}},{"tool":"grep_docs","args":{"pattern":"authorize","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"scope","path":"platform/dev/6.7/guides/development/integrations-api","mode":"files"}}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"gap-04":{"query":"After upgrading to 6.7 my plugin fatals on load because core class properties now have native PHP types — which properties must I retype in my subclasses?","category":"gap","option":"mcp-wiki","answer":"Nothing relevant was found. I checked the wiki's Upgrades and Migrations section for 6.7 (`platform/dev/6.7/guides/upgrades-migrations/`) — it only has pages on the country-independent snippet/translation base layer and on the general `shopware-cli project upgrade`/Composer update process, neither mentioning typed properties. I also read `platform/dev/6.7/guides/development/extensions/architecture/final-and-internal.md`, the page on `@final`/`@internal` class-extension rules, which discusses allowed changes to public/protected members in general terms (e.g. 'widening the type of public method params' is allowed, 'narrowing the type... is not allowed') but does not mention a 6.7-specific change adding native PHP types to core class properties, nor any list of properties that need retyping in subclasses. Regex/keyword searches for 'typed properties', 'native type', 'strict type', 'property type', 'upgrade guide', and 'breaking change' across `platform/dev/6.7` returned no page describing this specific change. This is a gap in the served corpus — I could not find any documentation of this 6.7 change or which properties are affected.","citations":["platform/dev/6.7/guides/development/extensions/architecture/final-and-internal.md:1-48","platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md:1-55","platform/dev/6.7/guides/upgrades-migrations/extension-translation.md:1-56"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"native.*type|strict.*type|property type","path":"platform/dev/6.7","regex":true,"mode":"files"}},{"tool":"grep_docs","args":{"pattern":"upgrade guide|breaking change","path":"platform/dev/6.7","regex":true,"mode":"files"}},{"tool":"list_docs","args":{"path":"platform/dev/6.7/guides/upgrades-migrations"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/upgrades-migrations/extension-translation.md"}},{"tool":"grep_docs","args":{"pattern":"typed properties","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/development/extensions/architecture/final-and-internal.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md"}}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"gap-05":{"query":"My plugin decorates `CachedProductRoute` to add cache tags — where did the `Cached*Route` classes go in Shopware 6.7 and how do I cache a Store API route now?","category":"gap","option":"mcp-wiki","answer":"The wiki does not document a `CachedProductRoute`/`Cached*Route` decorator class at all — searching `platform/dev/6.7` for `Cached.*Route`/`CachedProductRoute` only turned up the general caching guide and the extendability concept page, with no reference to that specific decoration pattern. What the current caching guide (`platform/dev/6.7/guides/plugins/plugins/framework/caching/_index.md`) describes instead is a tag-based mechanism: add cache tags directly via `$this->cacheTagCollector->addTag('my-custom-entity-' . $id)` and invalidate them later with `$this->cacheInvalidator->invalidate(['my-custom-entity-' . $id])` (optionally passing `true` to force immediate invalidation instead of the default 5-minute batched invalidation, or setting the `sw-force-cache-invalidate: 1` header) — there is no need to decorate a route class just to add cache tags. For a Storefront controller specifically, the related guide (`add-caching-to-custom-controller.md`) says to mark the route cacheable with the route default `_httpCache: true`; a controller that loads its data exclusively through Store API routes needs no extra invalidation logic because 'the HTTP cache entry's tags are the sum of the Store API tags generated or loaded during the request.' Neither page mentions `Cached*Route` classes being removed or renamed, nor gives the modern replacement class name for `CachedProductRoute` specifically — so while the general cache-tag/`CacheTagCollector`+`CacheInvalidator` mechanism is documented, the exact fate of the `Cached*Route` decoration pattern for Store API routes in 6.7 is not covered in this corpus.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/caching/_index.md:1-79","platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-caching-to-custom-controller.md:1-47"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"Cached.*Route|CachedProductRoute","path":"platform/dev/6.7","regex":true,"mode":"files"}},{"tool":"grep_docs","args":{"pattern":"cache.*store api route|http cache|reverse proxy","path":"platform/dev/6.7","regex":true,"mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/caching/_index.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-caching-to-custom-controller.md"}}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"partial"},"gap-06":{"query":"How do I create a shipping method from my plugin's installer or migration, including the `technicalName` that 6.7 requires?","category":"gap","option":"mcp-wiki","answer":"The wiki has no dedicated guide for creating a shipping method from a plugin (there is no `add-shipping-method.md` analogous to the payment-method guide; searches for `shipping method`, `shipping_method.repository`, and `ShippingMethodEntity` across `platform/dev/6.7` returned no such page). What is confirmed by the corpus is only that the requirement exists: the plugin-creation guide's Gotchas note that 'Shopware 6.7 also introduced a related `technicalName` requirement for payment and shipping methods' alongside the existing requirement that a plugin's own technical name stay stable after distribution. The sibling, fully documented case — adding a payment method — shows the general pattern that likely also applies to shipping methods: register the entity (there, via `payment_method.repository`) during the plugin lifecycle (`install`/`activate`/`deactivate`), supplying a `technicalName` field that is 'required for plugin-provided payment methods from Shopware 6.7 onward and must be unique with a plugin-specific prefix; an omitted `technicalName` can prevent the plugin from being installed or activated,' and never removing the record on `uninstall`, only deactivating it since orders may still reference it. Applying that same pattern to shipping methods (using `shipping_method.repository` and a shipping-method-specific technicalName) is a reasonable inference but is not itself documented anywhere in this wiki. [from memory]","citations":["platform/dev/6.7/guides/plugins/plugins/creating-plugins.md:70-89","platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:1-72"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"shipping method","path":"platform/dev/6.7","mode":"fil ed up only that CDN-offload guide, a Jest testing page, and Migration Assistant's own internal `MediaFileService`/`LocalMediaProcessor` plumbing (which is specific to the Migration Assistant extension's import pipeline, not a general-purpose plugin API for saving a file to a new media entity). No page documents the `MediaService`/`FileSaver` API, its `saveMediaFile()`/`generateThumbnails()` methods, or a complete example of importing a file from disk into a Shopware media entity from a plugin. This is a gap in the served corpus.","citations":["platform/dev/6.7/guides/plugins/plugins/content/media/_index.md:1-30","platform/dev/6.7/products/extensions/migration-assistant/concept/media-processing.md:1-31"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"MediaService|generateThumbnails|saveMediaFile","path":"platform/dev/6.7","regex":true,"mode":"files"}},{"tool":"list_docs","args":{"path":"platform/dev/6.7/guides/plugins/plugins/content/media"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/products/extensions/migration-assistant/concept/media-processing.md"}},{"tool":"grep_docs","args":{"pattern":"FileSaver|UploadedFile|MediaService","path":"platform/dev/6.7","regex":true,"mode":"files"}},{"tool":"grep_docs","args":{"pattern":"thumbnail","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/content/media/_index.md"}}],"notFoundClaim":true,"memoryClaims":[],"sourceVerdict":"no"},"gap-08":{"query":"How do I set up a Nuxt project with Shopware Composable Frontends against my shop's Store API — endpoint, access token, and why do I get HTTP 412?","category":"gap","option":"mcp-wiki","answer":"The wiki has no dedicated 'getting started with Composable Frontends/Nuxt' guide, and nothing at all about an HTTP 412 error. What exists under `platform/dev/6.7/products/paas/.../composable-frontends/` only covers deploying an already-built Node.js/Nuxt frontend on Shopware PaaS Native (`kind: cfe`, `application.yaml`, Fastly caching, ISR headers) — not local project setup or Store API credentials. For the Store API connection details themselves (endpoint and access token), the quick-start integrations guide says: copy the sales channel's API access key from Sales Channels > [channel] > API access, and send it in the `sw-access-key` header against the base path `/store-api/*`, e.g. `GET /store-api/product`; regenerating the key immediately invalidates the previous one, which would break any client still using it. The Store API hub page confirms the same: 'Store API uses the sales-channel `sw-access-key` header against `/store-api/*`.' Neither page, nor any other page found by searching `platform/dev/6.7` for `Composable Frontends`, `Nuxt`, `sw-access-key`, and `412`, explains a 412 (Precondition Failed) response or ties it to a specific misconfiguration (e.g. stale/invalidated access key, missing headers, or a domain mismatch) — that explanation is not present in this corpus.","citations":["platform/dev/6.7/guides/development/integrations-api/_index.md:1-47","platform/hubs/store-api.md:1-83","platform/dev/6.7/products/paas/shopware/composable-frontends/_index.md:1-68","platform/dev/6.7/products/paas/shopware-paas/composable-frontends/performance.md:1-62"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"Composable Frontends|Nuxt","path":"platform/dev/6.7","regex":true,"mode":"files"}},{"tool":"grep_docs","args":{"pattern":"412","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/products/paas/shopware/composable-frontends/_index.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/products/paas/shopware-paas/composable-frontends/performance.md"}},{"tool":"grep_docs","args":{"pattern":"sw-access-key","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/concepts/api/store-api.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/apps/app-sdks/javascript/07-ext <script>

  function dash(v) { return (v === undefined || v === null || v === '') ? '—' : v; }
  function pct(v) { return (v === undefined || v === null || v === '') ? '—' : (v + '%'); }
  function num(v) { return (v === undefined || v === null) ? '—' : v; }
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k === 'html') { /* not used — kept out for safety */ }
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function text(t) { return document.createTextNode(dash(t)); }
  function td(content, cls) {
    var cell = document.createElement('td');
    if (cls) cell.className = cls;
    if (content instanceof Node) cell.appendChild(content);
    else cell.textContent = dash(content);
    return cell;
  }
  function th(content) {
    var cell = document.createElement('th');
    cell.textContent = content;
    return cell;
  }
  function verdictClass(v) {
    var s = String(v || '').toLowerCase();
    if (['pass', 'partly', 'fail', 'unavailable', 'unscored'].indexOf(s) >= 0) return 'verdict-' + s;
    return '';
  }
  function statusClass(v) {
    var s = String(v || '').toLowerCase();
    if (s.indexOf('ready') === 0) return 'status-pass';
    if (s.indexOf('usable') === 0) return 'status-partly';
    if (s.indexOf('not ready') === 0) return 'status-fail';
    return '';
  }
  function findClass(v) {
    var s = String(v || '').toLowerCase();
    if (s === 'pass') return 'find-pass';
    if (s === 'fail') return 'find-fail';
    return '';
  }
  function heatColor(v) {
    if (v === undefined || v === null || isNaN(v)) return { bg: 'transparent', fg: 'inherit' };
    var clamped = Math.max(0, Math.min(100, Number(v)));
    var hue = (clamped / 100) * 120; // 0=red .. 120=green
    var bg = 'hsl(' + hue.toFixed(0) + ', 55%, 45%)';
    return { bg: bg, fg: '#fff' };
  }
  function prettyJson(obj) {
    var pre = document.createElement('pre');
    try { pre.textContent = JSON.stringify(obj, null, 2); } catch (e) { pre.textContent = String(obj); }
    return pre;
  }
  function sortableTable(container, columns, rows, defaultKey, defaultDir) {
    var wrap = el('div', { class: 'table-wrap' });
    var table = document.createElement('table');
    var thead = document.createElement('thead');
    var trh = document.createElement('tr');
    var sortKey = defaultKey;
    var sortDir = defaultDir || -1;
    columns.forEach(function (c) {
      var cell = th(c.label);
      cell.dataset.key = c.key;
      cell.addEventListener('click', function () {
        if (sortKey === c.key) sortDir *= -1; else { sortKey = c.key; sortDir = -1; }
        draw();
      });
      trh.appendChild(cell);
    });
    thead.appendChild(trh);
    var tbody = document.createElement('tbody');
    table.appendChild(thead);
    table.appendChild(tbody);
    wrap.appendChild(table);
    container.appendChild(wrap);
    function draw() {
      var sorted = rows.slice().sort(function (a, b) {
        var av = a[sortKey], bv = b[sortKey];
        if (av === undefined || av === null) av = '';
        if (bv === undefined || bv === null) bv = '';
        if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sortDir;
        return String(av).localeCompare(String(bv)) * sortDir;
      });
      tbody.innerHTML = '';
      if (sorted.length === 0) {
        var tr = document.createElement('tr');
        var cell = document.createElement('td');
        cell.colSpan = columns.length;
        cell.className = 'empty';
        cell.textContent = 'No data.';
        tr.appendChild(cell);
        tbody.appendChild(tr);
        return;
      }
      sorted.forEach(function (r) {
        var tr = document.createElement('tr');
        columns.forEach(function (c) {
          tr.appendChild(c.render ? c.render(r) : td(r[c.key]));
        });
        tbody.appendChild(tr);
      });

    draw();
    return { redraw: draw };

  (function renderHeaderBar() {

        span.className = statusClass(r.status);
        span.textContent = dash(r.status);
        li.appendChild(span);
        list.appendChild(li);
      });
      panel.appendChild(list);
    }

    panel.appendChild(el('h2', { text: 'Comparison' }));
    var compareRows = optionKeys.map(function (key) {

      { key: 'gap', label: 'Gap' },
