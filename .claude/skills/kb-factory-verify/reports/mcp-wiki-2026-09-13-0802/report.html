) differs from scorer's (83/partly)","rescore func-12: accuracy 0 → 0","rescore func-12: completeness 0 → 0","rescore func-12: actionability 100 → 40","func-12: recomputed total/verdict (54/fail) differs from scorer's (60/partly)"]},"raw":{"mcp-wiki":{"dev-01":{"query":"How do I extend the product entity with a new association in Shopware's Data Abstraction Layer?","category":"dev","option":"mcp-wiki","answer":"Create an extension class under `<plugin root>/src/Extension/...` that extends `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityExtension`. Implement `getDefinitionClass()` to point at the definition you want to extend (e.g. `ProductDefinition::class`) and override `extendFields(FieldCollection $collection)` to add the new field(s) to the collection. Register the class with the `shopware.entity.extension` service tag. To add an association backed by a database column, add e.g. `new OneToOneAssociationField('exampleExtension', 'id', 'product_id', ExampleExtensionDefinition::class, true)` flagged with `CascadeDelete()`; define the linked `ExampleExtensionDefinition` with its own `FkField`, a `ReferenceVersionField` if the extended entity is versioned, and the inverse `OneToOneAssociationField`; register that new definition with the `shopware.entity.definition` tag; and add the new database table via a migration. You then write the associated data like `$this->productRepository->upsert([['id' => '<product id>', 'exampleExtension' => ['customString' => 'foo bar']]], $context)`. If you don't need a database column at all, you can instead subscribe to the entity's loaded event (e.g. `ProductEvents::PRODUCT_LOADED_EVENT`) and call `$productEntity->addExtension('custom_string', new ArrayEntity([...]))` — the extension value must be a struct, not a scalar. Since Shopware 6.6.10.0 a `BulkEntityExtension` subclass can extend multiple entities at once via `collect()`, tagged `shopware.bulk.entity.extension`. A key gotcha: setting `autoload` to `true` on both the `EntityExtension` and the target `EntityDefinition` side for the same association causes recursion/out-of-memory errors — to auto-load on every fetch, set `autoload` true only on the `EntityExtension` side. If instead you are relating two entities that already both exist (rather than bolting new data onto an existing core entity), the general One-to-One/One-to-Many/Many-to-One/Many-to-Many association patterns (using `FkField` plus the matching `*AssociationField` classes, and a `MappingEntityDefinition` for many-to-many) apply the same way.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md:1-71","platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-associations.md:1-57"],"toolCallLog":[{"tool":"kb_status","args":{}},{"tool":"read_doc","args":{"path":"platform/index.md"}},{"tool":"grep_docs","args":{"pattern":"association","path":"platform/dev/6.7","glob":"**/*entit*","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"add.*association","path":"platform/dev/6.7","regex":true,"mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-associations.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-02":{"query":"What's the plugin lifecycle in Shopware — install, activate, uninstall — and how does `keepUserData` work?","category":"dev","option":"mcp-wiki","answer":"A Shopware plugin's base class (`Shopware\\Core\\Framework\\Plugin`, which itself extends `Shopware\\Core\\Framework\\Bundle`/Symfony's `Bundle`), implemented in `<plugin root>/src/SwagBasicExample.php`, exposes several lifecycle methods: `install(InstallContext $installContext)` registers entities (e.g. payment methods), creates initial data, and prepares requirements — `InstallContext` exposes plugin/Shopware versions, system `Context`, plugin migrations, and auto-migration control. `activate(ActivateContext $context)` activates entities created during install, or creates data that requires the plugin to be active. `deactivate(DeactivateContext $context)` deactivates entities created in install, or removes entities that cannot safely remain active. `update(UpdateContext $context)` handles non-database adjustments, feature toggles, or logic dependent on old/new plugin versions (database changes belong in plugin migrations instead); `UpdateContext` adds `getUpdatePluginVersion()`/`getCurrentPluginVersion()`. `postInstall(InstallContext $context)` and `postUpdate(UpdateContext $context)` run after a successful install/update completes. Finally, `uninstall(UninstallContext $context)` removes or cleans up plugin data. `UninstallContext` adds a `keepUserData()` method: if the merchant chose to keep user data during uninstall, `keepUserData()` returns true, and the plugin's `uninstall()` implementation must respect that and skip deleting persistent plugin data, e.g. `if ($uninstallContext->keepUserData()) { return; }` before removing data. The docs also caution against creating fully active business data in `install()` since the plugin isn't yet enabled, and against blindly deleting entities in `uninstall()` (e.g. a payment method used on real orders should be deactivated rather than removed, to avoid leaving orders in a broken state).","citations":["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md:1-61"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"keepUserData","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-03":{"query":"How do I add a custom Store API route for a headless storefront?","category":"dev","option":"mcp-wiki","answer":"Follow the decoratable-route pattern Shopware uses internally: 1) Define an abstract route class with a `getDecorated(): AbstractExampleRoute` method and a `load(Criteria $criteria, SalesChannelContext $context): ExampleRouteResponse` method. 2) Implement a concrete route class tagged with the `#[Route(...)]` attribute, scoping it via `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]`, e.g. `#[Route(path: '/store-api/example', name: 'store-api.example.search', methods: ['GET','POST'], defaults: ['_entity' => 'swag_example'])]` on `load()`; `getDecorated()` should throw `DecorationPatternException` while nothing decorates it yet, and every field you want returned via the API needs the `ApiAware` flag in its definition. 3) Register the route class as a service, constructor-injecting the needed repository (e.g. `swag_example.repository`). 4) Create an `ExampleRouteResponse extends StoreApiResponse` class exposing the search result via a getter. 5) Import the route via `<plugin root>/src/Resources/config/routes.php` using `$routes->import('../../Core/**/*Route.php', 'attribute');`, and verify discovery with `bin/console debug:router store-api.example.search` (this confirms discovery only, not that the service constructs or the request succeeds). 6) Optionally document the route for the OpenAPI schema by adding a JSON file under `<plugin root>/src/Resources/Schema/StoreApi/` (use `AdminApi` for Admin API endpoints instead), picked up by the internal `OpenApi3Generator`, viewable at `/store-api/_info/stoplightio.html`. 7) To expose it to a (headless) storefront/frontend, add a controller extending `StorefrontController`, scoped with `StorefrontRouteScope::ID`, that calls the route, and import it separately via `$routes->import('../../Storefront/**/*Controller.php', 'attribute');`; request it client-side with the existing `http-client` service or `fetch`. Note that registering the service and importing routes.php are separate steps — a route class can be a registered service without yet being a reachable endpoint until its attributes are imported via routes.php.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md:1-57"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"custom store api route","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-04":{"query":"How do I create a custom CMS element for Shopping Experiences?","category":"dev","option":"mcp-wiki","answer":"A CMS element is the smallest content primitive (text, image, video, product listing, etc.) placed inside a block's slot in Shopware's Shopping Experience (CMS) system; elements have no knowledge of their context and are always rendered inside a parent block's slot. Recommended Administration directory layout is `src/Resources/app/administration/src/module/sw-cms/elements/<name>/` with `index.js`, a `component/` folder (`index.js` + `.html.twig` + `.scss`), a `config/` folder (`index.js` + `.html.twig`) and a `preview/` folder (`index.js` + `.html.twig` + `.scss`). Steps: 1) Import the element folder in `main.js`. 2) Register it via `Shopware.Service('cmsService').registerCmsElement({...})` with keys `name`, `label`, `component`, `configComponent`, `previewComponent`, `defaultConfig` (a map of config key to `{ source, value }`), and optionally `hidden`/`removable`. 3) Create the preview component (the thumbnail shown in the element picker). 4) Create the main component, mixing in the `cms-element` mixin and calling `this.initElementConfig('<name>')` in `created()`, providing fallback content so the element isn't invisible in the editor when unconfigured. 5) Create the config component, also mixing in `cms-element` and calling `initElementConfig`, providing form fields for each `defaultConfig` key (Shopware Meteor components are recommended). 6) For inheritance-aware fields (content inherited from the base layout vs. overridden per page) wrap them with the `sw-cms-inherit-wrapper` component, passing `field` and `element`. 7) For the Storefront, add a Twig template at `src/Resources/views/storefront/element/cms-element-<name>.html.twig` — the `cms-element-` filename prefix is required. Gotchas: the Storefront template filename must include the exact `cms-element-` prefix (e.g. `cms-element-dailymotion.html.twig`), the Storefront cache must be cleared after adding new element templates, and by default element configuration is inherited from the base layout unless explicitly overridden via the inherit-wrapper component.","citations":["platform/dev/6.7/guides/plugins/plugins/content/cms/add-cms-element.md:1-58"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"custom cms element","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/content/cms/add-cms-element.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-05":{"query":"How does theme inheritance work in Shopware — theme.json and SCSS overrides?","category":"dev","option":"mcp-wiki","answer":"Theme inheritance lets a new theme extend an already-installed base theme, reusing its templates, styles, scripts, assets and config while adding its own changes — used for e.g. a dark variant, per-sales-channel differences, or customizing a store-bought theme without touching its code. You configure it by editing `theme.json` in `<plugin root>/src/Resources` of the extending theme, inserting the base theme's technical name into each relevant section before the extending theme's own alias, e.g.: `\"views\": [\"@Storefront\", \"@Plugins\", \"@SwagBasicExampleTheme\", \"@SwagBasicExampleThemeExtend\"]`, `\"style\": [\"app/storefront/src/scss/overrides.scss\", \"@SwagBasicExampleTheme\", \"app/storefront/src/scss/base.scss\"]`, `\"script\": [\"@Storefront\", \"@SwagBasicExampleTheme\", \"app/storefront/dist/storefront/js/.../file.js\"]`, `\"asset\": [\"@Storefront\", \"@SwagBasicExampleTheme\", \"app/storefront/src/assets\"]`, and `\"configInheritance\": [\"@Storefront\", \"@SwagBasicExampleTheme\"]`. For `views`, rendering order is Storefront base to plugin extensions to the base theme to the current theme. For `script`, the layering is the same: Storefront JS, then base theme JS, then current theme JS. For `style` (SCSS), `overrides.scss` is kept first in the list because it can affect SCSS variables such as `$border-radius` that later files depend on. For `asset`, you must add the base theme explicitly to reuse its assets. For `configInheritance`, the last listed theme that differs from the current one becomes the parent theme for configuration values, and the `Storefront` theme's config is always inherited even without an explicit `configInheritance` entry. The general workflow for building a theme is: create the theme, configure it via `theme.json`, add SCSS styling and JavaScript, add assets/icons, override Bootstrap variables or responsive breakpoints, customize Storefront templates, and finally use theme inheritance if needed.","citations":["platform/dev/6.7/guides/plugins/themes/inheritance/add-theme-inheritance.md:1-53","platform/dev/6.7/guides/plugins/themes/theme-base-guide.md:1-40"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"theme inheritance","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/themes/inheritance/add-theme-inheritance.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/themes/theme-base-guide.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-06":{"query":"How do I add a custom Flow Builder action?","category":"dev","option":"mcp-wiki","answer":"Building a custom Flow Builder action (example: `action.create.tag`) has both a PHP backend part and an Administration UI part. Backend: 1) Define an `Aware` interface for the data your action needs, extending `Shopware\\Core\\Framework\\Event\\FlowEventAware` and marked with `#[IsFlowEventAware]`, e.g. `TagAware` exposing `TAG`/`TAG_ID` constants and a `getTag()` method. 2) Implement the action by extending `Shopware\\Core\\Content\\Flow\\Dispatching\\Action\\FlowAction`, providing `getName(): string` (e.g. returns `'action.create.tag'`), `requirements(): array` (the list of required Aware interfaces), and `handleFlow(StorableFlow $flow): void`, which reads config via `$flow->getConfig()`, data stored by Aware interfaces via `$flow->getStore($key)`, and data from the original event/extra data via `$flow->getData($key)`. 3) Register the action as a service tagged `flow.action` with a `priority` and a `key` matching its name, e.g. `$services->set(CreateTagAction::class)->args([service('tag.repository')])->tag('flow.action', ['priority' => 600, 'key' => 'action.create.tag']);` — this tag is what makes the action appear in the `/api/_info/flow-actions.json` response, and `priority` determines its ordering. `requirements()` controls scope: an empty array makes the action available for every trigger, a list of Aware interfaces (e.g. `[OrderAware::class, CustomerAware::class]`) restricts it to matching trigger events, and a brand-new trigger event can be added by implementing a custom Aware interface and registering a subscriber on `BusinessEventCollectorEvent::NAME`. Administration UI: define an action name constant and a `GROUP` (defaults to `general` if not set; existing groups include `general`, `tag`, `customer`, `order`), add snippet labels, and override the `sw-flow-sequence-action` component to map the action name to a config modal (or straight to `onSaveActionSuccess` if no modal is needed); import the override and any new component into `main.js`. Gotcha: a subscriber adding a new trigger event to the trigger list must run with sufficiently high priority to register before other `BusinessEventCollectorEvent` subscribers, or awareness/actions may end up missing.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-action.md:1-93"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"custom flow.*action","path":"platform/dev/6.7","regex":true,"mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-action.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-07":{"query":"My plugin needs to store its own data in a new table — how do I define a custom DAL entity with its definition, entity and collection class so I get a repository for it?","category":"dev","option":"mcp-wiki","answer":"First create the table via a plugin migration (prefixing the table name, e.g. `swag_example`). Then create an `EntityDefinition` subclass implementing `getEntityName()` — which returns the table name and also becomes the `<name>.repository` DI service id — and `defineFields()`, e.g.: `class ExampleDefinition extends EntityDefinition { const ENTITY_NAME = 'swag_example'; public function getEntityName(): string { return self::ENTITY_NAME; } protected function defineFields(): FieldCollection { return new FieldCollection([ (new IdField('id','id'))->addFlags(new Required(), new PrimaryKey()), new StringField('name','name'), new StringField('description','description'), new BoolField('active','active') ]); } }`. `created_at`/`updated_at` columns need no explicit field definitions. Register the definition with the `shopware.entity.definition` service tag and an `entity` attribute matching the entity name: `$services->set(ExampleDefinition::class)->tag('shopware.entity.definition', ['entity' => 'swag_example']);`. Add a custom `Entity` class (extends `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity`, uses the `EntityIdTrait`, and declares one protected property plus getter/setter per field) and wire it in via `getEntityClass()` on the definition. Add a custom `EntityCollection` class (extends `EntityCollection`, overriding `getExpectedClass()`) and wire it via `getCollectionClass()`. If you skip the custom `Entity`/`EntityCollection` classes, generic `ArrayEntity`/`EntityCollection` instances are used instead. Once registered this way, the DAL automatically exposes a `<entity-name>.repository` service you can inject and use like any core repository. Gotchas: entity class properties must be at least `protected` (never `readonly`), or the DAL cannot set values — this applies to any class extending the generic `Struct` class; field `storageName` is snake_case while `propertyName` is lowerCamelCase; and `getEntityName()`'s return value doubles as both the database table name and the repository service id, so the two must match exactly.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md:1-71"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"EntityDefinition","path":"platform/dev/6.7/guides/plugins/plugins/framework/data-handling","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-08":{"query":"In a plugin service, what is the Shopware 6 equivalent of Doctrine's `findBy()` — how do I read products with filters, associations and sorting?","category":"dev","option":"mcp-wiki","answer":"Shopware 6 uses no ORM, only a thin Data Abstraction Layer (DAL) — the equivalent of Doctrine's `findBy()` is building a `Shopware\\Core\\Framework\\DataAbstractionLayer\\Search\\Criteria` object and passing it to an injected entity repository's `search()` method. Inject the repository named `entity_name.repository` (e.g. `product.repository`) via `services.php` using `service('product.repository')`. A basic unfiltered read is `$this->productRepository->search(new Criteria(), $context)`, which returns an `EntitySearchResult` (always a collection, even for a single-ID search — call `first()` to get the entity). Search by ID(s) with `new Criteria([$myId])`. Filter by field with `$criteria->addFilter(new EqualsFilter('name', 'Example name'))`; combine multiple filters with `OrFilter`, `AndFilter`, `NandFilter`, etc. `addPostFilter()` instead of `addFilter()` applies a filter to the result but not to aggregations. Add associations with `$criteria->addAssociation('productReviews')`, chainable for nested relations as `'productReviews.customer'`; you can filter an association alone via `$criteria->getAssociation('productReviews')->addFilter(...)` (does not restrict the parent entity) versus adding a filter on the dotted path like `'productReviews.points'` directly on the main criteria (which does restrict the parent entity). Mapping/join-table entities cannot be read with `search()` — use `searchIds()` instead. Aggregations are added via `$criteria->addAggregation(new AvgAggregation('avg-rating', 'productReviews.points'))` and read back via `$products->getAggregations()->get('avg-rating')`. Paging and sorting use `setLimit()`, `setOffset()`, and `addSorting(new FieldSorting('createdAt', FieldSorting::ASCENDING))`. For large datasets, use `RepositoryIterator($this->productRepository, $context, $criteria)` and call `->fetch()` in a loop until it returns `null` — this issues one DB request per iteration and requires a deterministic sort (always add `id` as a secondary sort) to avoid entities being skipped or duplicated across batches.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md:1-55"],"toolCallLog":[{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-09":{"query":"How do I make a field on my plugin's own entity translatable per language?","category":"dev","option":"mcp-wiki","answer":"To make a field on a custom entity translatable per language: 1) Create a migration for a `<entity>_translation` table, named by appending `_translation` to the entity's table name (e.g. `swag_example_translation`), with required columns `<entity>_id` (FK to the entity), `language_id` (FK to `language`), the translated column(s) (e.g. `name`), plus `created_at`/`updated_at`; the primary key is the composite `(<entity>_id, language_id)`. 2) Create `ExampleTranslationDefinition extends Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityTranslationDefinition`, override `getParentDefinitionClass()` to return the parent entity's definition class, and define the translated column(s) with `StringField`. 3) Register both definitions in `services.php` with the `shopware.entity.definition` tag, registering the translation definition after the parent entity's own definition. 4) Create `ExampleTranslationEntity extends Shopware\\Core\\Framework\\DataAbstractionLayer\\TranslationEntity` with getters/setters for the translated field(s) plus the association back to the parent entity, and override `getEntityClass()` on the translation definition to return it. 5) Create an `ExampleTranslationCollection extends EntityCollection`, same as for a normal entity. 6) On the main entity's definition, add a `TranslatedField('name')` for the translated field and a `TranslationsAssociationField(ExampleTranslationDefinition::class, 'swag_example_id')` to link to the translation table. When reading the data afterward, prefer `entity.translated.field` in storefront/sales-channel contexts, and `entity.field` in Admin/CRUD flows. Gotchas: the translation definition must be registered in `services.php` after the entity it translates, and the translation table's foreign keys (`<entity>_id`, `language_id`) both cascade on delete and update.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-translations.md:1-53"],"toolCallLog":[{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-translations.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-10":{"query":"How do I write an indexer that precomputes derived data for my custom entity on write, and how do I trigger a full reindex?","category":"dev","option":"mcp-wiki","answer":"Data indexers optimize recurring, complex calculations (e.g. a product's `cheapest_price`) by computing them once whenever the entity is written via the DAL, instead of recomputing on every read. Prefer subscribing to an existing indexer's dispatched event (e.g. `CustomerIndexerEvent`) instead of writing a new indexer when the target entity already has one (Shopware ships `CustomerIndexer`, `CategoryIndexer`, `LandingPageIndexer`, `ProductIndexer`, `ProductStreamIndexer`, `PromotionIndexer`, `RuleIndexer`, `MediaIndexer`, `MediaFolderIndexer`, `MediaFolderConfigurationIndexer`, `SalesChannelIndexer`, `BreadcrumpIndexer`). To write a custom one, create a class extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Indexing\\EntityIndexer` and register it tagged `shopware.entity_indexer`. It must implement: `getName(): string` (a unique indexer name, used by `EntityIndexerRegistry` to route messages to the right indexer), `iterate($offset): ?EntityIndexingMessage` (drives a full reindex, using `IteratorFactory::createIterator($definition, $offset)` to page through IDs), `update(EntityWrittenContainerEvent $event): ?EntityIndexingMessage` (reacts to DAL writes, extracting changed primary keys via `$event->getPrimaryKeys(SomeDefinition::ENTITY_NAME)` — filter entities/columns as much as possible here for performance), and `handle(EntityIndexingMessage $message): void` (does the actual computation/write work). By default, messages produced by `update()` are handled synchronously; pass `$forceQueue = true` as `EntityIndexingMessage`'s fourth constructor argument to process them asynchronously over the message queue instead. To manipulate data with the DAL from inside `handle()` without re-triggering the indexer (which would otherwise cause an infinite loop, since writing through the DAL fires `EntityWrittenContainerEvent` again), disable indexing on the context first: `$context->addState(EntityIndexerRegistry::DISABLE_INDEXING);` — or use the injected `Connection` directly instead of the DAL. To trigger a full reindex, run `bin/console dal:refresh:index` (this calls `iterate()` for every registered indexer), or trigger an index rebuild from the Administration.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-indexer.md:1-66"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"indexer","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-indexer.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-11":{"query":"On Shopware 6.7, which file do I declare my plugin's services in, and how do I get a core service passed into my service's constructor?","category":"dev","option":"mcp-wiki","answer":"On Shopware 6.7, plugin services are declared in `src/Resources/config/services.php`, a PHP file returning a closure that receives a Symfony `ContainerConfigurator`. You register services via `$configurator->services()`; the recommended approach is to set `->defaults()->autowire()->autoconfigure()` and then `->load('Your\\\\Namespace\\\\', '../../')->exclude('../../{Resources,Migration,*.php}')` so every class under `src` is registered automatically. With autowire/autoconfigure on, a core service like `SystemConfigService` is injected into your service's constructor automatically just by type-hinting it as a constructor parameter, e.g. `public function __construct(private SystemConfigService $systemConfigService) {}` — nothing else is needed. If a service was declared explicitly instead (via `$services->set(ExampleService::class)`), you add the dependency yourself: `$services->set(ExampleService::class)->args([service(SystemConfigService::class)]);` using the `service()` function from `Symfony\\Component\\DependencyInjection\\Loader\\Configurator`. Note that XML service configuration (`services.xml`, used in 6.6) is deprecated starting with Symfony 7.4 and unsupported in Symfony 8.0, so 6.7 documents `services.php` as the way forward. All Shopware 6 services are private by default.","citations":["platform/dev/6.7/guides/plugins/plugins/services/add-custom-service.md:1-49","platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md:1-57"],"toolCallLog":[{"tool":"kb_status","args":{}},{"tool":"read_doc","args":{"path":"platform/index.md"}},{"tool":"grep_docs","args":{"pattern":"services.xml","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"dependency injection","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/administration/services-utilities/add-custom-service.md"}},{"tool":"grep_docs","args":{"pattern":"services.xml|services.php","path":"platform/dev/6.7/guides/plugins/plugins/plugin-base-guide.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/services/_index.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/services/add-custom-service.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-12":{"query":"I am on Shopware 6.6 — which file do I declare my plugin's service dependencies in, and how do I pass another service into the constructor?","category":"dev","option":"mcp-wiki","answer":"On Shopware 6.6, plugin service dependencies are declared in `<plugin root>/src/Resources/config/services.xml`, an XML file using the Symfony DI schema (`http://symfony.com/schema/dic/services/services-1.0.xsd`). To pass another service into a constructor, add an `<argument type=\"service\" id=\"...\"/>` element inside the `<service>` definition, referencing the target service by its fully-qualified class/id. For example: `<service id=\"Swag\\BasicExample\\Service\\ExampleService\"><argument type=\"service\" id=\"Shopware\\Core\\System\\SystemConfig\\SystemConfigService\"/><\/service>`. Then add the injected service as a typed constructor parameter and store it on a property: `public function __construct(SystemConfigService $systemConfigService) { $this->systemConfigService = $systemConfigService; }`.","citations":["platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/dependency-injection.md:1-55"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"dependency-injection","path":"platform/dev/6.6","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/dependency-injection.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-13":{"query":"There is no event for what I need to change in a core Shopware service — how do I decorate or replace that service from my plugin?","category":"dev","option":"mcp-wiki","answer":"Use service decoration, one of the two main ways (alongside events) to extend Shopware behavior from a plugin — prefer it when the existing service's behavior itself must change rather than reacting to something Shopware already does. Decoratable Shopware services expose an abstract class as their contract (with a `getDecorated()` method) instead of a plain interface, so new non-abstract methods can be added later without breaking existing decorators. In your plugin's service config, register your decorator pointing at the original service with `decorate()` and pass the original instance through `.inner`: `$services->set(ExampleServiceDecorator::class)->decorate(ExampleService::class)->args([service('.inner')]);`. Your decorator implements the abstract contract, e.g. `abstract class AbstractExampleService { abstract public function getDecorated(): AbstractExampleService; abstract public function doSomething(): string; }` — the base implementation's `getDecorated()` throws `Shopware\\Core\\Framework\\Plugin\\Exception\\DecorationPatternException` (no decorator yet), while the decorator's `getDecorated()` returns the wrapped instance, and its own logic should typically delegate to it, e.g. `return $this->decoratedService->doSomething() . ' Did something additionally.';`. Gotchas: decorators nest (plugin A wraps core, plugin B wraps A, etc.) and a decorator that doesn't call the inner service silently breaks the chain with no runtime warning — inspect with `bin/console debug:container --show-arguments <service-id>` or PHPStorm's Navigate → Implementations; always type-hint the abstract class, never the concrete class, in constructors, since type-hinting the concrete class removes the service from the decoration chain; and where a designed extension point exists (subscribed as `.pre`/`.post`/`.error` events), prefer that over decoration since multiple extensions can participate without forming a chain.","citations":["platform/dev/6.7/guides/plugins/plugins/services/adjusting-service.md:1-74"],"toolCallLog":[{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/services/adjusting-service.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-14":{"query":"I wrote a subscriber class in my plugin but it never fires — which interface and which service tag (`shopware.event_subscriber`?) register it?","category":"dev","option":"mcp-wiki","answer":"Your subscriber class must implement Symfony's `EventSubscriberInterface` (`Symfony\\Component\\EventDispatcher\\EventSubscriberInterface`), with a static `getSubscribedEvents()` method mapping event names to handler methods, e.g. returning `[ProductEvents::PRODUCT_LOADED_EVENT => 'onProductsLoaded']`. The tag is not `shopware.event_subscriber` — it is `kernel.event_subscriber`. You must register the class in `src/Resources/config/services.php` and tag it explicitly: `$services->set(MySubscriber::class)->tag('kernel.event_subscriber');`. Creating the class alone is not enough — if it's missing from `services.php` (or missing the tag), Shopware never calls it and there is no obvious error indicating the event went unhandled. For versioned entities (orders, products, etc.), the same event can fire for multiple versions of the entity, so check `$event->getContext()->getVersionId() !== Defaults::LIVE_VERSION` if you only want to react to the live version.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/event/listening-to-events.md:1-63"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"EventSubscriberInterface","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/event/listening-to-events.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-15":{"query":"How do I work out which event Shopware actually dispatches for a given action, for example after a product is loaded or a page is rendered?","category":"dev","option":"mcp-wiki","answer":"Several complementary ways: 1) Use the CLI: `bin/console debug:event-dispatcher` lists all registered listeners/subscribers for the Symfony event dispatcher (grouped under the 'Debug' command namespace alongside `debug:container`, `debug:router`, `debug:autowiring`, `debug:business-events`). 2) For Shopware's dedicated \"Extension Point\" mechanism (a newer, structured alternative to plain events used for things like product price calculation, listing resolution, checkout placement and CMS slot data), search the core codebase for `extends Extension`, `Extension<`, or `ExtensionDispatcher` — common locations are `src/Core/Content/*/Extension/`, `src/Core/Checkout/*/Extension/`, `src/Core/Content/Cms/Extension/`, `src/Core/Content/Product/Extension/`. Each extension class exposes a `NAME` constant used as the event name, dispatched with lifecycle suffixes `{name}.pre`, `{name}.post`, `{name}.error` (e.g. `ResolveListingExtension::NAME = 'listing-loader.resolve'`, `ProductPriceCalculationExtension::NAME = 'product.calculate-prices'`, `CheckoutPlaceOrderExtension::NAME = 'checkout.place-order'`, `CmsSlotsDataEnrichExtension::NAME = 'cms.slots.data-enrich'`). 3) The Symfony profiler's 'Events' tab lists all dispatched extension events at runtime, identifiable by their `.pre`/`.post`/`.error` suffixes — this is a practical way to see exactly what fires for a given request, such as after a product is loaded or a page is rendered.","citations":["platform/dev/6.7/resources/references/core-reference/commands-reference.md:30-49","platform/dev/6.7/guides/plugins/plugins/framework/extension/finding-extensions.md:1-59"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"debug:event-dispatcher","path":"platform/dev/6.7"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/extension/finding-extensions.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/resources/references/core-reference/commands-reference.md","offset":30,"limit":20}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-16":{"query":"How do I run plugin logic whenever an order is written, and find out exactly which fields changed?","category":"dev","option":"mcp-wiki","answer":"Implement `Symfony\\Component\\EventDispatcher\\EventSubscriberInterface` and subscribe to `Shopware\\Core\\Checkout\\Order\\OrderEvents::ORDER_WRITTEN_EVENT`; inside the handler check `$event->getContext()->getVersionId() !== Defaults::LIVE_VERSION` so you only react to the live version (editing an order in the admin creates a new draft version merged later into live, which is usually not the state to react to). A changeset of exactly which fields changed is not generated by default for performance reasons — to force one, also subscribe to `PreWriteValidationEvent::class`, and in that listener, for each `$event->getCommands()` that is `instanceof ChangeSetAware` and whose `getEntityName() === OrderDefinition::ENTITY_NAME`, call `$command->requestChangeSet()`. Then, in the `ORDER_WRITTEN_EVENT` handler, read the changeset via `$result->getChangeSet()` on each item of `$event->getWriteResults()`. Note an 'insert' command cannot produce a changeset since nothing changed yet, and you should narrow changeset generation to the entity and version you actually need since it has a performance cost.","citations":["platform/dev/6.7/guides/plugins/plugins/checkout/order/listen-to-order-changes.md:1-52"],"toolCallLog":[{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/checkout/order/listen-to-order-changes.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-17":{"query":"How do I overwrite the price of a product line item in the cart at runtime from a plugin?","category":"dev","option":"mcp-wiki","answer":"Use one class that acts as both a cart collector and a cart processor (this is only for changing an existing line item's own price, e.g. for a live-shopping plugin — not for discounts/surcharges, which should be separate line items instead). Implement `Shopware\\Core\\Checkout\\Cart\\CartDataCollectorInterface::collect` to fetch the product IDs from the cart (`$original->getLineItems()->filterType(LineItem::PRODUCT_LINE_ITEM_TYPE)->getReferenceIds()`), skip IDs already fetched, and store each new price in `CartDataCollection` under a prefixed key (e.g. `'price-overwrite-'.$id`) to avoid duplicate lookups/key collisions with other collectors — always compute prices in the collector, not the processor, since querying data inside `process` may run repeatedly. Then implement `Shopware\\Core\\Checkout\\Cart\\CartProcessorInterface::process` on the same class: for each product line item in `$toCalculate` (not `$original`, since `$toCalculate` is the instance actually used), read the stored price from `CartDataCollection`, build a `Shopware\\Core\\Checkout\\Cart\\Price\\Struct\\QuantityPriceDefinition` from the new price plus the item's existing tax rules and quantity, calculate it via an injected `Shopware\\Core\\Checkout\\Cart\\Price\\QuantityPriceCalculator`, then call `$product->setPrice($calculated)` and `$product->setPriceDefinition($definition)`. Register the combined class under both tags with a priority ordered after the product collector/processor: `$services->set(OverwritePriceCollector::class)->args([service(QuantityPriceCalculator::class)])->tag('shopware.cart.processor', ['priority' => 4500])->tag('shopware.cart.collector', ['priority' => 4500]);`","citations":["platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md:1-48"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"cart","path":"platform/dev/6.7","glob":"**/cart/**","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-18":{"query":"My plugin's cart processor adds a surcharge line item, but it is added again on every recalculation and its price is stale after the customer changes the quantity — how do I split the work between the collector and the processor?","category":"dev","option":"mcp-wiki","answer":"Shopware splits cart work into two roles precisely to prevent this class of bug: a collector implements `Shopware\\Core\\Checkout\\Cart\\CartDataCollectorInterface` and its `collect(CartDataCollection $data, Cart $original, SalesChannelContext $context, CartBehavior $behavior)` method, whose only job is to fetch additional data (e.g. querying the database or an API) and store it with `$data->set('uniqueKey', $newData)` — the wiki explicitly warns not to query data inside `process`, since it may run many times per request. A processor implements `Shopware\\Core\\Checkout\\Cart\\CartProcessorInterface` and its `process(CartDataCollection $data, Cart $original, Cart $toCalculate, SalesChannelContext $context, CartBehavior $behavior)` method, which is where you actually add/modify line items, and all changes must be made on `$toCalculate` (not `$original`), since `$toCalculate` is the cart instance considered in the end. Concretely for a surcharge: read/compute the surcharge amount in `collect()` (based on current cart contents) and store it in `CartDataCollection`; in `process()`, read that stored value back and rebuild the surcharge line item and its price definition from it every time `process()` runs (each recalculation re-derives the price from current quantities via the collected data, rather than reusing a stale cached price) — this is the same pattern the wiki's discount guide uses: build a fresh `PercentagePriceDefinition`/price and call `$toCalculate->add($discountLineItem)` inside `process()` for a percentage discount line item, marking it `setStackable(false)`/`setRemovable(false)`, and registering the processor tagged `shopware.cart.processor` with priority `4500` so it runs after the core product processor. The wiki's own worked example for changing an existing line item's price (not adding a new one) follows the identical split: fetch/compute the price once in `collect()` (storing it keyed to avoid duplicate lookups) and apply it in `process()` using an injected `QuantityPriceCalculator`, registering the combined class under both `shopware.cart.collector` and `shopware.cart.processor` tags. I could not find a wiki page that names the specific 'added twice on recalculation' bug for a surcharge line item verbatim, so the fix for duplicate-add (checking `$toCalculate->getLineItems()->has($surchargeId)` before adding, or removing and re-adding your own surcharge item by a fixed id each `process()` run) is inferred from the documented collector/processor contract rather than quoted directly. [from memory]","citations":["platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md:1-44","platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-discounts.md:1-54","platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md:1-48"],"toolCallLog":[{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-items.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-discounts.md"}},{"tool":"grep_docs","args":{"pattern":"surcharge|already exist|getLineItems()->has|removeLineItem","path":"platform/dev/6.7/guides/plugins/plugins/checkout/cart","regex":true}}],"notFoundClaim":false,"memoryClaims":["I could not find a wiki page that names the specific 'added twice on recalculation' bug for a surcharge line item verbatim, so the fix for duplicate-add (checking `$toCalculate->getLineItems()->has($surchargeId)` before adding, or removing and re-adding your own surcharge item by a fixed id each `process()` run) is inferred from the documented collector/processor contract rather than quoted directly."],"sourceVerdict":"partial"},"dev-19":{"query":"I need to move long-running work in my plugin out of the request into the message queue — what does the handler class look like and how is it registered?","category":"dev","option":"mcp-wiki","answer":"Create a handler class (e.g. `SmsHandler`) at `<plugin root>/src/MessageQueue/Handler/SmsHandler.php`, mark it with the PHP attribute `#[AsMessageHandler]`, and implement `__invoke(SmsNotification $message)` to do the actual processing when a matching message is dispatched — the `handle_messages` middleware calls it. Multiple handlers can be defined for the same message. Registration is automatic: classes marked `#[AsMessageHandler]` are auto-tagged with the `messenger.message_handler` service tag, so no explicit tagging in `services.php` is needed (only normal DI-container registration/autowiring for the class itself, as in the plugin's general dependency-injection setup). This guide assumes a message class has already been defined (see the related 'Adding a message to queue' guide) and can be followed by adding custom middleware for the bus afterward. One gotcha: parts of related guidance reference a `low_priority` queue, which only exists from Shopware 6.5.7.0 onward — configuring the messenger to consume it fails on older versions.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-handler.md:1-46"],"toolCallLog":[{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-handler.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-20":{"query":"How do I add my own condition to the Rule Builder from a plugin so shop owners can select it?","category":"dev","option":"mcp-wiki","answer":"Combine a PHP rule class with an Administration component. 1) Create a rule class under `<plugin root>/src/Core/Rule` extending `Shopware\\Core\\Framework\\Rule\\Rule`, implementing `getName()` (a unique technical name), `match(RuleScope $scope): bool`, and `getConstraints(): array` (field-name to constraints map) — rule variables must be declared `protected`, never `private`, or they won't work correctly; never run database queries or other slow operations inside `match()` since it directly impacts store performance. Register the class in `services.php` tagged `shopware.rule.definition`. 2) Optionally implement `getConfig(): RuleConfig` returning something like `(new RuleConfig())->booleanField('isFirstMondayOfTheMonth')` to skip building a custom Administration component entirely — Shopware then renders the generic `sw-condition-generic` component for it. 3) To make it appear in the Administration, decorate the `ruleConditionDataProviderService` (`RuleConditionService`) and call `addCondition()`, naming the condition to match `getName()` and pointing it at an Administration component (e.g. `swag-first-monday`) with a `label`, `scopes`, and optional `group` (create new groups via `upsertGroup()`); load this decorator from a `main.js` entry point under `<plugin root>/src/Resources/app/administration/src/`. 4) Build the Administration component by extending `sw-condition-base` and overriding the `sw_condition_value_content` Twig block with your input control (e.g. `sw-single-select`). 5) Optionally restrict where the condition can be assigned (context awareness, available since Shopware 6.5.0.0) via `ruleConditionService.getAwarenessConfigurationByAssignmentName()` and `addAwarenessConfiguration()` (with `notEquals`/`equalsAny`/`snippet`), reading possible relations from `Shopware\\Core\\Content\\Rule\\RuleDefinition` — otherwise the condition may unexpectedly not be selectable in every context (e.g. inside the promotion module) since rules are context-aware by default.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/rule/add-custom-rules.md:1-65"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"rule builder","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/rule/add-custom-rules.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-21":{"query":"My plugin dispatches its own domain event — how do I make it show up as a trigger in the Flow Builder?","category":"dev","option":"mcp-wiki","answer":"Implement one of the Aware interfaces on your event (e.g. Shopware\\Core\\Framework\\Event\\CustomerAware plus FlowEventAware) so the event can carry data flows use. Since Shopware 6.5.0.0 event data is stored in a StorableFlow rather than read via getAvailableData(); each Aware interface has a matching FlowStorer that copies its data into the store (CustomerAware -> CustomerStorer, MailAware -> MailStorer, OrderAware -> OrderStorer, UserAware -> UserStorer). If your data has no existing Aware interface, define a new Aware interface plus your own FlowStorer subclass implementing store() and restore(). Flow actions then read the stored data via $flow->getStore($key) or $flow->getData($key). Finally, register the event as a Flow Builder trigger with a subscriber on BusinessEventCollectorEvent::NAME that calls $businessEventCollector->define(ExampleEvent::class) and adds it to the collection, giving the subscriber a high priority (e.g. 1000) so it registers before other trigger subscribers. This functionality is available starting with Shopware 6.4.6.0, with the StorableFlow/FlowStorer model replacing getAvailableData() from 6.5.0.0 onward.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md:1-68"],"toolCallLog":[{"tool":"kb_status","args":{}},{"tool":"read_doc","args":{"path":"platform/index.md"}},{"tool":"grep_docs","args":{"pattern":"flow builder trigger own event","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"custom flow trigger","path":"platform/dev/6.7"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-22":{"query":"How do I give my plugin a settings page the shop operator can fill in, and what field types are available?","category":"dev","option":"mcp-wiki","answer":"Create src/Resources/config/config.xml in your plugin; the Administration renders it dynamically under Extensions -> My extensions -> Plugins -> Configure, with no custom Administration module needed. The file must contain at least one <card> with a <title> and at least one <input-field>, each with a unique <name> (min 4 characters, matching [a-zA-Z][a-zA-Z0-9]*). Card and field labels (<title>, <label>, <placeholder>, <helpText>) are translatable via the lang attribute (default en-GB). The <input-field> type defaults to text; supported types are: text, textarea, text-editor, url, password, int, float, bool, checkbox, datetime, date, time, colorpicker, single-select, and multi-select. Common settings include label/placeholder/helpText, defaultValue, disabled, required, copyable (text-like fields), minLength/maxLength (text/url/password), min/max (int/float), and <options> with <option><id>/<name> pairs for single/multi-select. For advanced UI you can instead use <component name=\"componentName\"> to embed one of the supported Administration components directly: sw-entity-single-select, sw-entity-multi-id-select, sw-media-field, sw-text-editor, or sw-snippet-field (for entities without a name field, use <label-property>). Fields whose value affects cached Storefront output should be marked cache-relevant=\"true\" (available since Shopware 6.7.12.0; required from 6.8.0.0 onward since system config writes no longer invalidate caches by default).","citations":["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md:1-80"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"plugin config system.xml field types","path":"platform/dev/6.7"}},{"tool":"grep_docs","args":{"pattern":"plugin configuration","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-23":{"query":"How do I ship a mail template with my plugin so it is installed automatically, including a custom mail template type?","category":"dev","option":"mcp-wiki","answer":"Ship the mail template via a database migration (a MigrationStep subclass), not through the Administration, so it installs automatically on plugin install. To reuse an existing mail template type, look up its ID with SELECT id FROM mail_template_type WHERE technical_name = \"contact_form\", then insert a row into mail_template (id, mail_template_type_id, system_default which must be 0, created_at) and one row per supported language into mail_template_translation (mail_template_id, language_id, sender_name, subject, description, content_html, content_plain, created_at), looking up each language_id via the language/locale tables. Use INSERT IGNORE INTO so re-running the migration on reinstall does not throw. To ship a completely new mail template type instead of reusing one, first insert into mail_template_type (id, technical_name, available_entities as a JSON map like {\"product\": \"product\"}, created_at) and mail_template_type_translation (mail_template_type_id, language_id, name, created_at), before creating the template entry itself. Do not remove mail templates on plugin uninstall, since other entities may still reference them, causing data inconsistency.","citations":["platform/dev/6.7/guides/plugins/plugins/content/mail/add-mail-template.md:1-46"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"mail template","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/content/mail/add-mail-template.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-24":{"query":"How do I get readable SEO URLs generated for the detail pages of my plugin's own entity?","category":"dev","option":"mcp-wiki","answer":"For a custom DAL entity, implement Shopware\\Core\\Content\\Seo\\SeoUrlRoute\\SeoUrlRouteInterface with three methods: getConfig() (returns a SeoUrlRouteConfig with the entity definition, route name, and template), prepareCriteria() (narrow/extend the fetch criteria), and getMapping() (returns a SeoUrlMapping with the template variables); getMapping() must verify the entity type it receives since it can be invoked for other entities too. Register the class with the container tag shopware.seo_url.route. Add a seo_url_template table entry via a plugin migration, setting route_name, entity_name, and template. Subscribe to the entity's written DAL event and call Shopware\\Core\\Content\\Seo\\SeoUrlUpdater::update($routeName, $ids); do the same on the .deleted event so URLs are regenerated automatically as entities are written or deleted. A German (or any locale) SEO URL is only reachable if a matching domain is configured on the sales channel, and marking a seo_url entry deleted only sets is_deleted = 1 rather than removing the row, so the controller must still check whether the underlying content exists.","citations":["platform/dev/6.7/guides/plugins/plugins/content/seo/add-custom-seo-url.md:1-72"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"seo url custom entity","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"SeoUrlRoute","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/content/seo/add-custom-seo-url.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-25":{"query":"How do I add a `bin/console` command to my plugin for a maintenance task?","category":"dev","option":"mcp-wiki","answer":"Register a standard Symfony Console command as a service in your plugin's src/Resources/config/services.php, tagging it with console.command, e.g. $services->set(Swag\\BasicExample\\Command\\ExampleCommand::class)->tag('console.command'); commands registered this way are automatically available via bin/console. The command class itself uses the normal Symfony shape, e.g. an #[AsCommand(name: 'swag:example', description: 'Example command')] attribute on a class extending Symfony\\Component\\Console\\Command\\Command, implementing execute(InputInterface $input, OutputInterface $output): int and returning Command::SUCCESS.","citations":["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md:1-54"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"console command","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-26":{"query":"How do I add a custom document type such as a pro-forma invoice in Shopware 6.7?","category":"dev","option":"mcp-wiki","answer":"In Shopware 6.7 there are two document systems: the legacy one and the reworked Document System (v2); new plugin work should target v2, since the legacy system is deprecated and scheduled for removal in Shopware 6.9 (Document System v2 is still experimental and gated by the DOCUMENT_GENERATION_REWORK feature flag until it becomes default in 6.8). To add a new document type such as a pro-forma invoice under v2: 1) Extend Shopware\\Core\\Checkout\\DocumentV2\\Type\\AbstractDocumentType, implementing getTechnicalName(): string and getSupportedFormats(): array (e.g. ['html', 'pdf']). 2) Create a render data DTO extending Shopware\\Core\\Checkout\\DocumentV2\\Struct\\AbstractRenderData with public properties, which get flattened onto the template's config variable. 3) Create a data provider extending Shopware\\Core\\Checkout\\DocumentV2\\Provider\\AbstractDocumentDataProvider implementing getKey(), supports(string $documentType): bool, enrichOrderCriteria(Criteria $criteria): void, and provideRenderingData(ProviderInput $input, Context $context): AbstractRenderData. 4) Register both services with tags shopware.document_v2.type and shopware.document_v2.provider. 5) Add a Twig template at @Framework/documents/<technical_name>.html.twig extending @Framework/documents/base.html.twig (plus a zugferd XML template if that format is supported). 6) Separately, via a plugin migration, insert a document_type row whose technical_name matches the type (the document table has a foreign key on it) and create a number range of type document_<technical_name> — these are not created by the code above.","citations":["platform/dev/6.7/guides/plugins/plugins/checkout/documents/_index.md:1-28","platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md:1-52"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"custom document type","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"pro-forma invoice","path":"platform/dev/6.7"}},{"tool":"list_docs","args":{"path":"platform/dev/6.7/guides/plugins/plugins/checkout/documents","depth":2}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/checkout/documents/_index.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-27":{"query":"In Shopware 6.7, how do I extend a Storefront Twig template from my plugin with `{% extends %}` so I keep the core markup and other plugins' changes?","category":"dev","option":"mcp-wiki","answer":"Use the sw_extends Twig tag rather than plain extends — it is Shopware's Twig tag for extending a core template with multi-inheritance support, so both the core markup and any other plugin's block overrides are preserved in the inheritance chain. Shopware looks for plugin templates in <plugin root>/src/Resources/views by default. Find the core template you want to change (e.g. storefront/layout/header/logo.html.twig) and recreate the identical relative path under your plugin's views directory (<plugin root>/src/Resources/views/storefront/layout/header/logo.html.twig). In that new file, extend the original and override just the block you need: {% sw_extends '@Storefront/storefront/layout/header/logo.html.twig' %} followed by a {% block layout_header_logo_link %}...{% endblock %}. Use {{ parent() }} inside the override to append to, rather than replace, the original block content. After changes, clear the cache with ./bin/console cache:clear, and make sure the plugin is active (and its theme, if any, assigned to the sales channel). To discover the available Twig variables on a page, call {{ dump() }} inside the template. Since Shopware 6.7.11.0 there is also a separate Storefront Components system for building reusable, atomic template components.","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-templates.md:1-55"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"extend storefront template","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"override template","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"sw_extends","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-templates.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-28":{"query":"How do I override an existing Storefront JavaScript plugin, such as the cookie permission bar, from my own plugin instead of registering a new one?","category":"dev","option":"mcp-wiki","answer":"Extend the original plugin's vanilla JS class directly if it is importable, e.g. import CookiePermissionPlugin from 'src/plugin/cookie/cookie-permission.plugin' and export class MyCookiePermission extends CookiePermissionPlugin {}. If the class is not importable (for example a third-party plugin without an alias), retrieve it at runtime via PluginManager: const Plugin = window.PluginManager.getPlugin('CookiePermission'); const PluginClass = Plugin.get('class'). Override the methods you need (e.g. init() to always clear the cookie so the bar shows, calling super.init() afterward, and _hideCookieBar() to add a confirm dialog before calling super._hideCookieBar()). Register the override in main.js with PluginManager.override('CookiePermission', MyCookiePermission, '[data-cookie-permission]') instead of PluginManager.register(); if the original plugin registers asynchronously, the override's import must also be a dynamic import: PluginManager.override('CookiePermission', () => import('./my-cookie-permission/my-cookie-permission.plugin'), '[data-cookie-permission]'). Note that each JavaScript plugin can only be overridden once — if two Shopware plugins override the same plugin, only the last override actually takes effect.","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md:1-83"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"override.*plugin.*javascript","path":"platform/dev/6.7","regex":true,"mode":"files"}},{"tool":"grep_docs","args":{"pattern":"cookie permission","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"override existing plugin","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"PluginManager.override","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-29":{"query":"How do I add my own data to an existing Storefront page or pagelet from a plugin without overriding the core controller?","category":"dev","option":"mcp-wiki","answer":"Subscribe to the page's or pagelet's Loaded event (e.g. FooterPageletLoadedEvent for the footer pagelet) with an event subscriber tagged kernel.event_subscriber, rather than overriding the controller. If an existing Store API route would return more data than needed, add a new dedicated Store API route for just the missing data (the example uses a route built on EntityRepository::aggregate() with a CountAggregation and an EqualsFilter, since only an aggregate count is needed, not the full product dataset — avoid calling the DAL directly from a page/pagelet subscriber). In the subscriber, call the route and attach the result to the page/pagelet via $event->getPagelet()->addExtension('product_count', $response->getProductCount()) (or the equivalent getPage() for a page). In the Twig template, the added data is then available under the extensions namespace, e.g. footer.extensions.product_count.count, guarded by an {% if footer.extensions.product_count %} check.","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md:1-70"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"add data to storefront page","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-30":{"query":"How do I add a custom filter to the Storefront product listing from my plugin, both the criteria side and the filter panel?","category":"dev","option":"mcp-wiki","answer":"Criteria side: subscribe to \\Shopware\\Core\\Content\\Product\\Events\\ProductListingCollectFilterEvent and add a Filter instance to the event's filters via $event->getFilters()->add($filter). A Filter is built from: name (unique filter name), filtered (true if the filter is currently active, typically derived from the request), aggregations (the aggregations backing the filter, e.g. a FilterAggregation wrapping a MaxAggregation with an EqualsFilter), filter (the actual DAL filter added to the criteria, e.g. new EqualsFilter('product.isCloseout', true)), values (values added as currentFilter to the result), and exclude (exclusion configuration). Example: new Filter('isCloseout', (bool) $event->getRequest()->get('isCloseout'), [new FilterAggregation(...)], new EqualsFilter('product.isCloseout', true), $filtered). Filter panel side: extend src/Storefront/Resources/views/storefront/component/listing/filter-panel.html.twig and override the component_filter_panel_items block (available since Shopware 6.4.8.0), calling {{ parent() }} then including one of the existing filter components via sw_include, e.g. {% sw_include '@Storefront/storefront/component/listing/filter/filter-boolean.html.twig' with { name: 'isCloseout', displayName: 'Closeout' } %}. Other filter components available are filter-multi-select, filter-property-select, filter-range, and filter-rating-select. To position a new filter relative to an existing one, extend that filter's own block instead (e.g. component_filter_panel_item_price).","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/howto/add-listing-filters.md:1-73"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"listing filter","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/storefront/howto/add-listing-filters.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-31":{"query":"How do I expose a plugin configuration value, such as a colour picked in the Administration, as an SCSS variable in my Storefront styling?","category":"dev","option":"mcp-wiki","answer":"The recommended way is to declare the config.xml field with a <css> tag naming the SCSS variable: set a fallback in base.scss (e.g. `$sass-plugin-header-bg-color: #ffcc00 !default;`), then in config.xml add an <input-field> with <name>sassPluginHeaderBgColor<\/name>, a <css>sass-plugin-header-bg-color<\/css> tag, and a <defaultValue>. The value chosen in the Administration (or the defaultValue if unset) is then exposed as that SCSS variable during theme compilation; note the theme still needs to be manually recompiled for a changed value to take effect, and the <css> tag has been available since Shopware 6.4.13.0. For cases needing more flexibility (e.g. computing the value per sales channel, or exposing all config fields at once), you can instead subscribe to the ThemeCompilerEnrichScssVariablesEvent, inject SystemConfigService, and call $event->addVariable('sass-plugin-header-bg-color', $this->systemConfig->get('SwagBasicExample.config.sassPluginHeaderBgColor', $event->getSalesChannelId())) inside a kernel.event_subscriber-tagged listener; addVariable() accepts an optional $sanitize flag to strip special characters and quote the value.","citations":["platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables.md:1-57","platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md:1-63"],"toolCallLog":[{"tool":"kb_status","args":{}},{"tool":"read_doc","args":{"path":"platform/index.md"}},{"tool":"grep_docs","args":{"pattern":"scss variable","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"config.theme.json","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-32":{"query":"How do I define a custom field set for products from my plugin so merchants can edit the values in the Administration?","category":"dev","option":"mcp-wiki","answer":"There are two ways to define a custom field set from a plugin. The declarative way (available since Shopware 6.7.13.0) is to ship a Resources/config/custom-fields.xml file in the plugin; Shopware syncs the defined field sets on install/update and removes them (without keeping user data) on uninstall, with no CustomFieldsInstaller service needed — the XML format matches the one used by apps in their manifest. The imperative way is to use the custom_field_set.repository service, e.g. `$this->customFieldSetRepository->create([[ 'name' => 'swag_example_set', 'global' => true, 'config' => ['label' => [...]], 'customFields' => [[ 'name' => 'swag_example_size', 'type' => CustomFieldTypes::INT, 'includeInSearch' => true, 'config' => ['label' => [...], 'customFieldPosition' => 1] ]] ]], $context);`. To delete a set use `$this->customFieldSetRepository->delete([['id' => $setId]], $context)` and separately clean up any leftover values stored in entities' customFields JSON column. Custom field and set names are global and should carry a vendor prefix (e.g. swag) to stay unique. By default custom fields are not searchable — set includeInSearch to true (requires Shopware 6.7.6.0+ and a search index rebuild / manual product update for existing fields), and set global to false to make the field set deletable/editable in the Administration. The declarative custom-fields.xml approach is recommended for most plugins; the imperative repository approach is only needed when creating sets dynamically at runtime. This mechanism works for any entity, including products, since custom fields are stored as scalar values in a JSON custom_fields column rather than requiring an entity-specific setup.","citations":["platform/dev/6.7/guides/plugins/plugins/framework/custom-field/add-custom-field.md:1-90"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"custom field set","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/framework/custom-field/add-custom-field.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-33":{"query":"How do I register a custom Administration module from my plugin, and what has to line up for it to actually show up after a build?","category":"dev","option":"mcp-wiki","answer":"Create <plugin root>/src/Resources/app/administration/src/module/<module-name>/index.js and import it from main.js (e.g. `import './module/swag-example';`). In index.js, register the module with `Shopware.Module.register('swag-example', { type: 'plugin', name: 'Example', title: 'swag-example.general.mainMenuItemGeneral', description: '...', color: '#ff3d58', icon: 'regular-shopping-bag', ... })`, configuring a unique name plus color, icon, title and description; `type` is conventionally 'plugin' for third-party modules ('core' is reserved for core code, though this isn't enforced by validation). Add routes (see the Add Custom Route guide) and a menu entry (see Add Menu Entry), and add translation snippets per locale (e.g. de-DE.json/en-GB.json under a snippet/ directory), keyed under the module name, e.g. `{ \"swag-example\": { \"general\": { \"mainMenuItemGeneral\": \"My custom module\" } } }`. Optionally add a settingsItem entry (group: shop/system/plugins, icon, to: route name) to link the module into Settings. Finally build the Administration JS with `shopware-cli project admin-build` (or `composer run build:js:admin` in the platform contribution setup); the plugin must be activated for the build to apply and the built file must ship with the plugin. For the module to actually show up: an index.js is required (Shopware 6 auto-requires it), it must be imported from main.js, the module must be registered via Shopware.Module.register with routes/components and snippets correctly wired, and the admin build must have run with the plugin active — the build only compiles assets, it does not fix missing registration or wiring.","citations":["platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/add-custom-module.md:1-77"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"add custom module","path":"platform/dev/6.7","mode":"files"}},{"tool":"grep_docs","args":{"pattern":"register module","path":"platform/dev/6.7","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/add-custom-module.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-34":{"query":"How do I extend an existing Administration component and its Twig blocks from my plugin, for example to change the dashboard headline?","category":"dev","option":"mcp-wiki","answer":"Use `Shopware.Component.override(name, config)` to replace an existing component's behavior in place, or `Shopware.Component.extend(newName, baseName, config)` to create a new component based on an existing one; register the file from main.js. To override a template: `import template from './sw-text-field-new.html.twig'; Shopware.Component.override('sw-text-field', { template });`. Within the twig template, use `{% block %}` / `{% parent %}` to keep or replace inherited markup, e.g. overriding a block like `card_header` to change a headline, or calling `{% parent %}` inside `card_content` to keep the original content and append to it. You can extend a method or computed property while keeping the original logic via `this.$super('methodName')`. There is also an experimental Composition API extension system (`Shopware.Component.createExtendableSetup` / `Shopware.Component.overrideComponentSetup()`), but it is only for components already written with the Composition API, only supports overriding (not extending), has no committed release timeline, and accessing its `_private` state has no TypeScript support — not recommended for production use. Multiple plugins overriding the same component are applied in registration order.","citations":["platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-components.md:1-73"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"override.*component","path":"platform/dev/6.7/guides/plugins/plugins/administration","mode":"files","regex":true}},{"tool":"list_docs","args":{"path":"platform/dev/6.7/guides/plugins/plugins/administration/module-component-management"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-components.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-35":{"query":"How do I load entities from the Admin API inside an Administration component using the repository factory and a Criteria?","category":"dev","option":"mcp-wiki","answer":"Inject the factory in the component with `inject: ['repositoryFactory']`, then create a repository for the entity, e.g. `this.repositoryFactory.create('product')` (a third argument accepts `{ version: 1 }`). Build a `Criteria` for filtering, sorting, pagination, and associations, for example: `criteria.setPage(1); criteria.setLimit(10); criteria.setTerm('foo'); criteria.setTotalCountMode(2); criteria.addFilter(Criteria.equals('product.active', true)); criteria.addSorting(Criteria.sort('product.name', 'DESC')); criteria.addAggregation(Criteria.avg('average_price', 'product.price'));` — setTotalCountMode 0 skips the total count (fastest), 1 gives the exact total count, and 2 returns `limit * 5 + 1` (fast, useful only to know whether a next page exists). Then search with `productRepository.search(criteria, Shopware.Context.api)`, or fetch a single record with `productRepository.get(entityId, Shopware.Context.api)`. Load associations by calling `criteria.addAssociation('manufacturer')` on the criteria before searching. To write data back: `productRepository.save(entity, Shopware.Context.api)` sends only changed properties and must be called manually (updates are not automatic); delete via `productRepository.delete(id, Shopware.Context.api)`, or bulk delete via `syncDeleted` with an array of ids. Entities are stateless — after save(), related data must be re-fetched from the server if needed, and for a new (unsaved) entity, associations can't be sent to the server directly since the parent isn't persisted yet; they're stored locally and sent together with the parent on save.","citations":["platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md:1-59"],"toolCallLog":[{"tool":"grep_docs","args":{"pattern":"repositoryFactory","path":"platform/dev/6.7/guides/plugins/plugins/administration","mode":"files"}},{"tool":"read_doc","args":{"path":"platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md"}}],"notFoundClaim":false,"memoryClaims":[],"sourceVerdict":"yes"},"dev-36":{"query":"How do I register ACL privileges for my plugin's Administration module and check them in a c
