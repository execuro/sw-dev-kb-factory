mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "nuxt", "path": "platform/dev/6.7", "mode": "files"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "dev-19": {"query": "I need to move long-running work in my plugin out of the request into the message queue \u2014 what does the handler class look like and how is it registered?", "category": "dev", "option": "mcp-wiki", "answer": "First define a message class implementing `Shopware\\Core\\Framework\\MessageQueue\\AsyncMessageInterface` (for standard async handling) or `LowPriorityMessageInterface` (to route it to the `low_priority` queue, available from Shopware 6.5.7.0), e.g. `class SmsNotification implements AsyncMessageInterface { public function __construct(private string $content) {} ... }`, and dispatch it from your service via an injected `Symfony\\Component\\Messenger\\MessageBusInterface` (bus id `messenger.default_bus`): `$this->bus->dispatch(new SmsNotification($message));`. To add metadata such as a delay, dispatch a `Symfony\\Component\\Messenger\\Envelope` with a stamp, e.g. `(new Envelope($message))->with(new DelayStamp(5000))`. The handler class \u2014 the code that actually runs once the message is dispatched \u2014 is placed at `<plugin root>/src/MessageQueue/Handler/SmsHandler.php`, marked with the PHP attribute `#[AsMessageHandler]`, and implements `__invoke(SmsNotification $message)` to process it; multiple handlers can exist for the same message class. Registration is automatic: a handler class carrying `#[AsMessageHandler]` is auto-tagged with the service tag `messenger.message_handler` \u2014 no manual `services.php` tagging is required (ordinary constructor dependency injection via `services.php`/autowiring still applies as with any other service). A message can also be routed to the `low_priority` queue purely via config instead of the interface: `shopware.messenger.routing_overwrite: { 'Your\\Custom\\Message': low_priority }` in `config/packages/shopware.yaml`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-handler.md:1-46", "platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md:1-84"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-handler.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-12": {"query": "I am on Shopware 6.6 \u2014 which file do I declare my plugin's service dependencies in, and how do I pass another service into the constructor?", "category": "dev", "option": "mcp-wiki", "answer": "On Shopware 6.6, plugin service dependencies are declared in `<plugin root>/src/Resources/config/services.xml` (Symfony's XML DI format, schema `http://symfony.com/schema/dic/services/services-1.0.xsd`). To pass another service into a constructor, add an `<argument type=\"service\" id=\"...\">` element under the `<service>` definition, referencing the target service's fully-qualified class id, e.g. `<argument type=\"service\" id=\"Shopware\\Core\\System\\SystemConfig\\SystemConfigService\"/>` inside `<service id=\"Swag\\BasicExample\\Service\\ExampleService\">`. The PHP class then declares the same type as a constructor parameter (`public function __construct(SystemConfigService $systemConfigService)`) and stores it on a property for later use.", "citations": ["platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/dependency-injection.md:1-55"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "dependency-injection", "path": "platform/dev/6.6", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/dependency-injection.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-07": {"query": "My plugin needs to store its own data in a new table \u2014 how do I define a custom DAL entity with its definition, entity and collection class so I get a repository for it?", "category": "dev", "option": "mcp-wiki", "answer": "First create the table via a plugin database migration (prefix the table name, e.g. `swag_example`). Then add an `EntityDefinition` implementing `getEntityName()` (returns the table name, which also becomes the `<name>.repository` service id in the DI container) and `defineFields()`: `class ExampleDefinition extends EntityDefinition { public const ENTITY_NAME = 'swag_example'; public function getEntityName(): string { return self::ENTITY_NAME; } protected function defineFields(): FieldCollection { return new FieldCollection([ (new IdField('id', 'id'))->addFlags(new Required(), new PrimaryKey()), (new StringField('name', 'name')), (new StringField('description', 'description')), (new BoolField('active', 'active')), ]); } }` \u2014 `created_at`/`updated_at` columns don't need explicit field declarations. Register the definition with the `shopware.entity.definition` tag and an `entity` attribute matching the entity name: `$services->set(ExampleDefinition::class)->tag('shopware.entity.definition', ['entity' => 'swag_example']);`. Add a custom `Entity` class (extends `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity`, uses the `EntityIdTrait`, and has one protected property plus getter/setter per field) and wire it into the definition via `getEntityClass()`. Add a custom `EntityCollection` (extends `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityCollection`, overrides `getExpectedClass()`) and wire it via `getCollectionClass()`; without these overrides, Shopware falls back to generic `ArrayEntity`/`EntityCollection` instances. Once registered this way, Shopware automatically exposes a repository service named `<entity-name>.repository` (e.g. `swag_example.repository`) that you can inject like any core repository. Gotchas: entity class properties must be at least `protected` (never `readonly`), or the DAL cannot set values (this applies to any class extending the generic `Struct` class); a field's `storageName` is snake_case while its `propertyName` is lowerCamelCase; and `getEntityName()`'s return value doubles as both the database table name and the repository service id, so the two must match exactly. Source: https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md:1-71"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "EntityDefinition", "path": "platform/dev/6.7", "glob": "**/custom*", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "add custom complex data", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "EntityCollection", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-06": {"query": "How do I add a custom Flow Builder action?", "category": "dev", "option": "mcp-wiki", "answer": "For a PHP plugin: 1) define an `Aware` interface for the data the action needs, extending `Shopware\\Core\\Framework\\Event\\FlowEventAware` and marked `#[IsFlowEventAware]`, e.g. `#[IsFlowEventAware] interface TagAware extends FlowEventAware { public const TAG = 'tag'; public const TAG_ID = 'tagId'; public function getTag(); }`. 2) Implement the action by extending `Shopware\\Core\\Content\\Flow\\Dispatching\\Action\\FlowAction`, implementing `getName()` (returns a unique technical name like `action.create.tag`), `requirements()` (an array of required `Aware` interfaces), and `handleFlow(StorableFlow $flow)`, where `$flow->getStore($key)` reads data supplied via Aware interfaces and `$flow->getData($key)` reads data from the original event or extra data. 3) Register the action as a service tagged `flow.action` with `priority` and `key`, e.g. `$services->set(CreateTagAction::class)->args([service('tag.repository')])->tag('flow.action', ['priority' => 600, 'key' => 'action.create.tag']);` \u2014 this tag makes the action appear in the `/api/_info/flow-actions.json` response, and `priority` controls ordering. 4) `requirements()` controls scope: an empty array makes the action available for every trigger, a list of Aware interfaces (e.g. `[OrderAware::class, CustomerAware::class]`) restricts it to matching trigger events, and a brand-new custom Aware/event needs a `BusinessEventCollectorSubscriber` listening on `BusinessEventCollectorEvent::NAME` to be added to the trigger list (this subscriber must run with sufficiently high priority or the action/awareness can be missing). 5) In the Administration, define an action constant and a `GROUP` (defaults to `general` if undefined; existing groups include `general`, `tag`, `customer`, `order`), add snippet labels, and override the `sw-flow-sequence-action` component to map the action name to a config modal (or to `onSaveActionSuccess` directly if no modal is needed), then import the override/new component in `main.js`. Alternatively, an app (no PHP) can add a webhook-based custom flow action by shipping a `Resources/flow.xml` in the app with a `<flow-actions><flow-action>` block containing `<meta>` (`name`, `label`, `description`, `requirements` such as `orderAware`, `url` \u2014 the webhook Shopware calls), `<headers>`/`<parameters>` (string-typed, can reference variables like `{{ order.orderNumber }}`), and `<config>` input fields (`text`, `int`, `bool`, `single-select`, etc.) rendered as Administration form fields; this app-based approach is available since Shopware 6.4.10.0 and is installed with `bin/console app:install --activate <AppName>`. Sources: https://developer.shopware.com/docs/guides/plugins/plugins/framework/flow/add-flow-builder-action.html and https://developer.shopware.com/docs/guides/plugins/apps/flow-builder/add-custom-flow-actions-from-app-system.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-action.md:1-93", "platform/dev/6.7/guides/plugins/apps/flow-builder/add-custom-flow-actions-from-app-system.md:1-70"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "custom flow action", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/flow/_index.md"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/flow"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/flow-builder/add-custom-flow-actions-from-app-system.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-action.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-04": {"query": "After upgrading to 6.7 my plugin fatals on load because core class properties now have native PHP types \u2014 which properties must I retype in my subclasses?", "category": "gap", "option": "mcp-wiki", "answer": "I found nothing in the wiki naming a specific set of core class properties that gained native PHP types in 6.7, nor a list of which properties plugin subclasses must retype. The general 'Upgrades and Migrations' overview page only gives a generic upgrade workflow (review release notes and `UPGRADE-6.7.md`/`RELEASE_INFO-6.7.md`, check breaking changes per layer, run `shopware-cli project upgrade` preflight, avoid internal APIs) and does not itemize a native-typed-properties breaking change. The documented 6.7 breaking changes I could find are all Administration-framework-side (Vue 3 migration, Vue Migration Build removal, Meteor Components, Pinia, Vite) \u2014 none of them describe Core PHP class property typing changes. I searched for 'native type', 'property types', 'typed propert*', 'strict types', 'scalar type' and 'deprecated type' across the 6.7 developer docs with no relevant hits. This is a genuine gap in the served corpus: it has nothing on this specific PHP-typing breaking change, so I cannot say which properties need retyping.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/_index.md:1-53"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "native type", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "property types", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "typed propert", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "strict types|scalar type", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/_index.md"}}, {"tool": "grep_docs", "args": {"pattern": "property", "path": "platform/dev/6.7/guides/development/extensions/architecture", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "deprecated.*type|typed.*deprecat", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "dev-36": {"query": "How do I register ACL privileges for my plugin's Administration module and check them in a component or template?", "category": "dev", "option": "mcp-wiki", "answer": "Admin privileges are identifiers made of a `key` and a `role` joined by a dot (e.g. `product.viewer`). Register a privilege with the privilege service's `addPrivilegeMappingEntry`, conventionally from a `<component>/acl/index.js` file imported by `<component>/index.js`, called before the roles detail page is visited: `Shopware.Service('privileges').addPrivilegeMappingEntry({ category: 'permissions', parent: null, key: 'your_key', roles: { viewer: { privileges: ['entity_name:operation'], dependencies: [] }, editor: {...}, creator: {...}, deleter: {...} } });` \u2014 use `category: 'permissions'` for normal CRUD-style roles (viewer/editor/creator/deleter) or `additional_permissions` for a non-CRUD custom role key. You can reuse another mapping's privileges via `Shopware.Service('privileges').getPrivileges('rule.viewer')`. Add snippet translations at `sw.privileges.${category}.${key}.label` (and `sw.privileges.${category}.${key}.${role_key}` for additional_permissions). Protect a route, menu entry, or settings item by adding `privilege` to its `meta`/config, e.g. `meta: { privilege: 'your_key.your_role' }`; protect a shortcut by giving it an object with an `active()` method instead of a plain key binding. To check a privilege in a component or template, inject the `acl` service and call `acl.can('key.role')`, e.g. `this.acl.can('sales_channel.creator')` in JS or `v-if=\"acl.can('review.editor')\"` in a template. To ship additional privileges to existing roles from PHP, override `Plugin::enrichPrivileges()`, returning a map like `['product.viewer' => ['my_custom_privilege:read']]`. Note: ACL rules in the Administration UI only gate visibility/behavior in the UI and can be bypassed via direct API calls; also, granting a role's viewer privilege does not automatically grant access to a related Administration module \u2014 module access must be granted separately. Source: https://developer.shopware.com/docs/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:1-72"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "acl privilege", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-27": {"query": "In Shopware 6.7, how do I extend a Storefront Twig template from my plugin with `{% extends %}` so I keep the core markup and other plugins' changes?", "category": "dev", "option": "mcp-wiki", "answer": "Rather than plain Twig {% extends %}, Shopware Storefront templates use the {% sw_extends %} tag, which supports multi-inheritance so the core markup and every other plugin's overrides are preserved together. Shopware looks for plugin templates under <plugin root>/src/Resources/views by default. Find the core template to override, e.g. storefront/layout/header/logo.html.twig, and recreate the identical relative path under the plugin's views directory: <plugin root>/src/Resources/views/storefront/layout/header/logo.html.twig. In that new file, extend the original and override the desired block: {% sw_extends '@Storefront/storefront/layout/header/logo.html.twig' %} followed by {% block layout_header_logo_link %}...{% endblock %}. Use {{ parent() }} inside the override to append to, rather than replace, the original block content. After editing, clear the cache with ./bin/console cache:clear, and make sure the plugin is active and (if it ships a theme) that theme is assigned to the sales channel. To discover which Twig variables are available on a given page, call {{ dump() }} inside the template. Since Shopware 6.7.11.0 a separate Storefront Components system is also available for building reusable, atomic template components.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-templates.md:1-55"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "sw_extends", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-templates.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-69": {"query": "How does an app subscribe to an event like `product.written`, what does Shopware POST to the webhook URL, and how do I verify the request is genuine?", "category": "dev", "option": "mcp-wiki", "answer": "Declare the webhook in the manifest's `<webhooks>` section, naming it and giving the `event` it listens to (e.g. `product.written`).\n\nShopware then POSTs a payload shaped like:\n```json\n{\n  \"data\": {\n    \"payload\": [ { \"entity\": \"...\", \"operation\": \"...\", \"primaryKey\": \"...\", \"updatedFields\": [] } ],\n    \"event\": \"...\"\n  },\n  \"source\": { \"url\": \"...\", \"appVersion\": \"...\", \"shopId\": \"...\", \"eventId\": \"...\" },\n  \"timestamp\": 0\n}\n```\n`source.url`/`appVersion`/`shopId`/`eventId` identify the sending shop instance (`eventId` is stable across retries, since 6.4.11.0); `timestamp` (since 6.4.1.0) records when the webhook was handled and can be used to reject stale/replayed requests. Headers sent include `sw-version` (since 6.4.1.0) and `sw-context-language`/`sw-user-language` (since 6.4.5.0). `entity.written` events like `product.written` only carry the changed record's `primaryKey`, not the full entity \u2014 the app must fetch it (and its associations) itself via the Admin API, and by the time it does the record may already be outdated again.\n\nTo verify authenticity, check the `shopware-shop-signature` header: it's a SHA-256 HMAC of the request body, signed with the `shop-secret` assigned during app registration \u2014 the same mechanism used for the registration confirmation request. You can also restrict a webhook to only fire for the live version by setting `onlyLiveVersion` (since 6.5.7.0, default `false`) in the manifest, though this is only honored for `HookableEntityWrittenEvent`-type events.", "citations": ["platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md:1-66"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-04": {"query": "How do I create a custom CMS element for Shopping Experiences?", "category": "dev", "option": "mcp-wiki", "answer": "A CMS element is the smallest content primitive (text, image, video, product listing, etc.) placed inside a block's slot in Shopware's Shopping Experience (CMS) system; elements have no knowledge of their context and are always rendered inside a parent block's slot. Recommended Administration directory layout: `src/Resources/app/administration/src/module/sw-cms/elements/<name>/` containing `index.js`, `component/index.js + .html.twig + .scss`, `config/index.js + .html.twig`, and `preview/index.js + .html.twig + .scss`. Steps: 1) import the element folder in `main.js`; 2) register it via `Shopware.Service('cmsService').registerCmsElement({...})` with keys `name`, `label`, `component`, `configComponent`, `previewComponent`, `defaultConfig` (a map of config key to `{ source, value }`), and optionally `hidden`/`removable`; 3) create the preview component (the thumbnail shown in the element picker); 4) create the main component, mixing in the `cms-element` mixin and calling `this.initElementConfig('<name>')` in `created()`, providing fallback content so the element isn't invisible in the editor when unconfigured; 5) create the config component, also mixing in `cms-element` and calling `initElementConfig`, with form fields for each `defaultConfig` key (Shopware Meteor components are recommended); 6) for fields that can be inherited from the base layout or overridden per page, wrap them with the `sw-cms-inherit-wrapper` component, passing `field` and `element`; 7) for the Storefront, add a Twig template at `src/Resources/views/storefront/element/cms-element-<name>.html.twig` \u2014 the `cms-element-` filename prefix is required. Gotchas: the Storefront template filename must include the `cms-element-` prefix exactly (e.g. `cms-element-dailymotion.html.twig`), and the Storefront cache must be cleared after adding new element templates; by default element configuration is inherited from the base layout unless explicitly overridden. Source: https://developer.shopware.com/docs/guides/plugins/plugins/content/cms/add-cms-element.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/cms/add-cms-element.md:1-58"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "custom cms element", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/content/cms/add-cms-element.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-06": {"query": "I'm coming from Magento \u2014 what are the Shopware equivalents of store views, extensions, attribute sets and `di.xml`?", "category": "edge", "option": "mcp-wiki", "answer": "According to the wiki's Magento-to-Shopware migration dictionaries: Store View/Store/Website maps to a Shopware Sales channel (with different languages and domains) \u2014 a sales channel can be of type Storefront (public shop URL), Product comparison (export to price portals/marketplaces), or Headless (API-only). Magento's 'Extension' maps to Shopware's Plugin concept \u2014 Community Code Pool corresponds to Extensions/Community Store (Extensions > Store) and Local Code Pool to Extensions under Settings > My extensions. Attribute Sets map to Custom field sets (groups of custom fields) in Shopware \u2014 the migration page also notes there is no 'attribute set' or hard product-type separation in Shopware at all; instead, Attributes generally map to Properties (which drive variants and filtering) or Custom fields (which extend a product with information), and Catalog > Attributes (Manage Attributes / Attribute Sets) is configured under Settings > Content > Custom fields. The wiki's dictionaries do not mention `di.xml` at all \u2014 a grep for it across the whole platform layer returned no hits. [from memory] Shopware 6 has no direct equivalent of Magento's `di.xml`; instead of XML-based dependency-injection configuration, Shopware plugins register services via Symfony's DI container, typically through a `services.xml` file (or PHP-based service configuration) in the plugin's `Resources/config` directory, following standard Symfony conventions rather than Magento's `di.xml` preference/plugin/virtualType system.", "citations": ["platform/func/migration-en/magento-keywords.md:1-60", "platform/func/migration-en/magento-firststeps.md:1-42"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "di.xml", "path": "platform", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "attribute set", "path": "platform", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/migration-en/magento-keywords.md"}}, {"tool": "read_doc", "args": {"path": "platform/func/migration-en/magento-firststeps.md"}}], "notFoundClaim": false, "memoryClaims": ["Shopware 6 has no direct equivalent of Magento's `di.xml`; instead of XML-based dependency-injection configuration, Shopware plugins register services via Symfony's DI container, typically through a `services.xml` file (or PHP-based service configuration) in the plugin's `Resources/config` directory, following standard Symfony conventions rather than Magento's `di.xml` preference/plugin/virtualType system."], "sourceVerdict": "partial"}, "dev-30": {"query": "How do I add a custom filter to the Storefront product listing from my plugin, both the criteria side and the filter panel?", "category": "dev", "option": "mcp-wiki", "answer": "Criteria side: subscribe to \\Shopware\\Core\\Content\\Product\\Events\\ProductListingCollectFilterEvent and add a Filter instance built from: name (unique filter name), filtered (true if currently active), aggregations (the aggregations behind the filter), filter (the DAL filter added to the criteria), values (values added as currentFilter to the result), and exclude (exclusion configuration). Example: build a Filter('isCloseout', (bool) $event->getRequest()->get('isCloseout'), [new FilterAggregation('active-filter', new MaxAggregation('active', 'product.isCloseout'), [new EqualsFilter('product.isCloseout', true)])], new EqualsFilter('product.isCloseout', true), $filtered) and add it with $event->getFilters()->add($filter). Filter-panel side: extend src/Storefront/Resources/views/storefront/component/listing/filter-panel.html.twig and its component_filter_panel_items block (available since Shopware 6.4.8.0), calling parent() and then {% sw_include '@Storefront/storefront/component/listing/filter/filter-boolean.html.twig' with { name: 'isCloseout', displayName: 'Closeout' } %}, choosing from the available filter components: filter-boolean, filter-multi-select, filter-property-select, filter-range, filter-rating-select. To position your filter relative to a specific existing one instead of appending at the end, extend that filter's own block, e.g. component_filter_panel_item_price.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/howto/add-listing-filters.md:1-73"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "listing filter", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/howto/add-listing-filters.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-03": {"query": "How do promotions and discount codes work, including individually generated codes?", "category": "func", "option": "mcp-wiki", "answer": "Promotions are configured under Marketing > Promotions. The General tab sets Name, Priority (a higher priority number is applied before a lower one), Valid from/until, Max. total uses, Max. uses per customer, and an Active toggle. For codes there are three options: no code (the discount applies automatically), a single Fixed promotion code shared by all customers (optionally auto-generated), or Individual promotion codes generated per order, where each individual code can only be redeemed once. Individual codes are generated from a pattern: code length, an optional prefix/suffix, or a custom pattern using %s for a random letter (A-Z) and %d for a random digit (0-9), e.g. SW-%s%d%s%d%s-TEST; regenerating the codes invalidates the previously generated ones. The Conditions tab restricts which sales channels the promotion applies to, whether it can be combined with other promotions ('Prevent combination with other promotions', 'Do not combine with' specific promotions), and adds Rule Builder-based conditions: Customer rules, Shopping cart rules, Order rules, and 'Promote sets of products' (set groups, each with a Mode of Number/Value(Gross)/Value(Net), a Value, a Sorting direction, and Product rules). If multiple rules of the same type are selected, only one needs to match (OR logic) \u2014 to require all conditions together, separate promotions must be created. The Discounts tab defines what the discount applies to (entire cart, shipping costs, entire product set, or a specific set group), optionally restricted to a specific range of products (with its own Product rules, 'Apply to Nth item', and Sort by), a discount Type (Absolute, Percentage, Fixed price \u2014 capped at the normal price, or Fixed unit price), a Value, an optional Maximum discount value (percentage type only), and per-currency value overrides; discount settings become read-only once the promotion has been used in an order. In the storefront, customers enter a code via 'Enter voucher code' in the OffCanvas or normal shopping cart and confirm with the tick button, after which the discount appears in the article overview. To track redemption of individual codes, open the promotion in Marketing > Promotions and check the Redeemed count, or filter the order overview by promotion code (fixed codes are tracked the same way). Only one individual promotion code can be redeemed per promotion at a time, and a common configuration mistake is placing product-exclusion rules in the shopping-cart conditions instead of the discount's own product rules \u2014 the former blocks the whole promotion whenever an excluded product is in the cart, while the latter only excludes that product from the discount.", "citations": ["platform/func/marketing/promotions.md:1-51"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "individual code", "path": "platform/func", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/marketing/promotions.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-40": {"query": "How do I upgrade a Composer-based Shopware project from 6.6 to 6.7 \u2014 which composer.json constraint do I change, and which console commands do I run afterwards?", "category": "dev", "option": "mcp-wiki", "answer": "The recommended path is the Shopware CLI upgrade wizard, run from a clean Git working tree: `shopware-cli project upgrade` \u2014 it checks readiness, lets you pick the target version, checks Composer-managed extension compatibility, and resolves the target dependency set before applying the upgrade locally (a CI/read-only variant is `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run`). If the wizard cannot be used, the manual Composer process is: 1) enable maintenance mode on a running environment with `bin/console sales-channel:maintenance:enable --all`; 2) adjust the Shopware version constraint (and `shopware/commercial`'s, if used) in `composer.json` to the 6.7 constraint, then run `composer update --no-scripts` (the `--no-scripts` flag avoids running scripts that depend on not-yet-updated recipes); 3) optionally force-update Symfony Flex-managed config files with `composer recipes:update`; 4) finalize with `bin/console system:update:finish`, which runs the database migrations and recompiles themes; 5) disable maintenance mode with `bin/console sales-channel:maintenance:disable --all`. A key gotcha: failing to update the version constraint in composer.json before `composer update` means the command just resolves back to the currently installed Shopware version, so no actual upgrade happens \u2014 and skipping major versions should be avoided unless the full upgrade path has been explicitly tested. Source: https://developer.shopware.com/docs/guides/upgrades-migrations/upgrade-shopware.html", "citations": ["platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md:1-55"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "upgrade.*6.6.*6.7", "path": "platform/dev/6.7", "mode": "files", "regex": true}}, {"tool": "grep_docs", "args": {"pattern": "composer.json constraint", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "update to shopware 6.7", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/installation", "depth": 2}}, {"tool": "grep_docs", "args": {"pattern": "system:update:finish", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "upgrade guide", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-23": {"query": "How do I ship a mail template with my plugin so it is installed automatically, including a custom mail template type?", "category": "dev", "option": "mcp-wiki", "answer": "Ship the mail template via a database migration (a MigrationStep subclass) rather than creating it through the Administration, so it installs automatically with the plugin. To reuse an existing mail template type, look up its ID with SELECT id FROM mail_template_type WHERE technical_name = \"contact_form\", then insert into mail_template (columns id, mail_template_type_id, system_default \u2014 must be 0 for plugin-provided templates, created_at) and into mail_template_translation once per supported language (columns mail_template_id, language_id, sender_name, subject, description, content_html, content_plain, created_at), resolving each language_id from the language/locale tables by locale code. Use INSERT IGNORE INTO so re-running the migration on reinstall doesn't throw on duplicate rows. To define a brand-new mail template type instead, first insert into mail_template_type (columns id, technical_name, available_entities \u2014 a JSON map such as {\"product\": \"product\"}, created_at) and mail_template_type_translation (columns mail_template_type_id, language_id, name, created_at), then create the mail_template entry as above referencing the new type. Never delete mail templates on plugin uninstall, since other entities may still reference them, causing data inconsistency.", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/mail/add-mail-template.md:1-46"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "mail template", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/content/mail/add-mail-template.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-02": {"query": "How do Rule Builder conditions work for shipping and payment methods?", "category": "func", "option": "mcp-wiki", "answer": "The Rule Builder lives under Settings > Automation > Rule Builder and lets merchants build reusable rules out of conditions combined with AND (all must match) or OR (any must match) operators; switching between AND/OR on a condition group automatically creates subconditions. A rule consists of General information (Name, Description, Priority \u2014 higher priority runs sooner, Type, Tags) plus at least one condition, each with a chosen operator (At least one, All, Is equal to, Is not equal to, Is one of, Is not one of, Is greater than, Is greater than/equal to, Is less than, Is lower than/equal to) and an input value. The condition catalog spans General (Triggered by Admin API, Date range, Language, Tax display, Sales Channel, Currency, Day of the week, Time range), Orders, Flow Builder, Customers, Marketing & Promotions, Items in shopping cart, and Shopping cart groups; some conditions accept an optional narrowing filter (e.g. limiting 'Subtotal of all items' to a specific category). For payment methods specifically, each method (Settings > Commerce > Payment methods) has an Availability rule field that uses Rule Builder conditions to control when the method is offered \u2014 a new rule can be created directly from that field, and leaving it blank (NULL) means unrestricted availability; a payment method also still needs to be assigned in the relevant sales channel to actually appear there. For shipping methods (Settings > Commerce > Shipping), the Availability rule field works the same way to determine when a shipping method can be selected, and its price matrix can additionally use Rule Builder rules (or Properties like item count, cart value, weight, volume) to build tiered pricing, with an optional restriction rule so a given matrix only applies when fulfilled; a shipping method must likewise be assigned to a sales channel (in that sales channel's general settings, shipping methods section) to be available at checkout. Rules currently assigned somewhere (including to payment/shipping methods) cannot be deleted, and deletion is otherwise irreversible; the Rule Builder's read-only Assignments tab lists every place a given rule is in use, including payment/shipping method availability.", "citations": ["platform/func/settings/rules.md:1-68", "platform/func/settings/Paymentmethods.md:1-32", "platform/func/settings/shipping.md:1-48"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/func/settings/rules.md"}}, {"tool": "grep_docs", "args": {"pattern": "availability rule", "path": "platform/func", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/Paymentmethods.md"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/shipping.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-03": {"query": "How do I add a custom Store API route for a headless storefront?", "category": "dev", "option": "mcp-wiki", "answer": "Follow Shopware's decoratable-route pattern. 1) Define an abstract route with a `getDecorated()` method and a `load(Criteria $criteria, SalesChannelContext $context): ExampleRouteResponse` method, e.g. `abstract class AbstractExampleRoute { abstract public function getDecorated(): AbstractExampleRoute; abstract public function load(Criteria $criteria, SalesChannelContext $context): ExampleRouteResponse; }`. 2) Implement the concrete route class, tagging it with the `#[Route(...)]` attribute using `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]`, and put `#[Route(path: '/store-api/example', name: 'store-api.example.search', methods: ['GET','POST'], defaults: ['_entity' => 'swag_example'])]` on the `load()` method; `getDecorated()` should throw `DecorationPatternException` while nothing decorates it yet, and every field you want returned via the API needs the `ApiAware` flag set in its entity definition. 3) Register the route class as a service, constructor-injecting the repository it needs (e.g. `swag_example.repository`). 4) Create a response class `ExampleRouteResponse extends StoreApiResponse` exposing the result via a getter. 5) Import the route via `<plugin root>/src/Resources/config/routes.php` using `$routes->import('../../Core/**/*Route.php', 'attribute');`, and verify discovery with `bin/console debug:router store-api.example.search` (this only proves the route was discovered, not that the service constructs or a request succeeds \u2014 the DI service registration and the routes.php import are two separate steps). 6) Optionally document the route by adding a JSON OpenAPI file under `<plugin root>/src/Resources/Schema/StoreApi/` (use `AdminApi` for Admin API endpoints instead) so Shopware's internal `OpenApi3Generator` picks it up; check the generated docs at `/store-api/_info/stoplightio.html`. 7) If you also want to expose it to the (non-headless) Storefront, add a controller extending `StorefrontController` scoped with `StorefrontRouteScope::ID` that calls the route and import it via `$routes->import('../../Storefront/**/*Controller.php', 'attribute');` \u2014 for a purely headless storefront this step is unnecessary since the route is already reachable directly under `/store-api/...`. Source: https://developer.shopware.com/docs/guides/plugins/plugins/framework/store-api/add-store-api-route.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md:1-57"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "Store API route", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-64": {"query": "How do I get an Admin API OAuth token \u2014 with client_credentials for an integration, or the password grant for local testing \u2014 and how long is each token valid?", "category": "dev", "option": "mcp-wiki", "answer": "For a real integration, create an integration in Administration under Settings \u2192 System \u2192 Integrations (with the \"Administrator\" toggle enabled) to get an access key ID (= OAuth `client_id`) and secret access key (= `client_secret`), then POST to `/api/oauth/token` with `{\"grant_type\": \"client_credentials\", \"client_id\": \"...\", \"client_secret\": \"...\"}`. The response contains `token_type`, `expires_in`, and `access_token`. `client_credentials` remains the default/recommended approach for integrations and reproducible setups.\n\nFor local development only, there is a password-grant shortcut: POST to `/api/oauth/token` with `grant_type: password`, `client_id: administration`, `scopes: write`, and the default Administration `username`/`password`. That response additionally contains a `refresh_token`. The wiki explicitly flags this as a local-only shortcut that should not replace `client_credentials` for integrations or reproducible setups.\n\nThe exact numeric token lifetime (the value returned in `expires_in`) is not stated in either wiki page \u2014 only that both responses include an `expires_in` field, so the source has the mechanism but not a documented TTL number for either grant type.", "citations": ["platform/dev/6.7/guides/development/integrations-api/_index.md:1-47", "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md:1-44"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "client_credentials|password grant", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "grant_type|oauth", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/hubs/admin-api.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/integrations-api/_index.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md"}}, {"tool": "grep_docs", "args": {"pattern": "expires_in|600 seconds|10 minutes", "path": "platform/dev/6.7"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "partial"}, "func-08": {"query": "How do custom field sets work \u2014 entity assignment, field types and technical name \u2014 and can a custom field be written through the Store API?", "category": "func", "option": "mcp-wiki", "answer": "Custom fields are managed under Settings > System > Custom fields and let merchants add their own data fields to entities such as products or categories, for use in the Rule Builder, storefront templates, or Shopping Experiences. Custom fields are grouped into sets; a set is created via New set with a unique, unchangeable technical name, a Position, a translatable Label, and the program areas (entities, e.g. products, categories) it applies to \u2014 a set created with no assigned area exists but is unavailable anywhere. Within a set, individual fields are created via New custom field; each field also requires a technical name that is always required and cannot be changed later. Available field types are: Select, Object selection (references products, categories, countries, shipping/payment methods, etc. \u2014 the object type cannot be changed after creation), Text field, Media, Number (with Number type integer/float, Steps, Min, Max), Date/Time, Checkbox, Active/Inactive switch (boolean 0/1), Text Editor, and Color picker. Common per-field options include Technical name, Position, 'Available in shopping carts' (required to use the field in the Rule Builder or custom templates), 'Modifiable via Store API', Label, Placeholder, and Help text. So yes \u2014 a custom field can be written through the Store API, but only if the 'Modifiable via Store API' flag is explicitly enabled on that field; enabling it marks the field as public, and the wiki explicitly warns never to enable it for sensitive data such as customer information. Custom fields are automatically created as snippets in all snippet sets with no database changes needed, and can be shown in the storefront by linking a Text or Text & images block in Shopping Experiences via the gear icon's Data Mapping option (plus a template adjustment to actually render it). Gotchas: custom fields must be edited in the store's default language for rules to work consistently across other languages; technical names for both sets and fields cannot be changed after creation and must avoid Twig special characters like '-' or '#' (or product exports can error); and an Object selection field's object type cannot be changed once created.", "citations": ["platform/func/settings/custom-fields.md:1-65"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "custom field set", "path": "platform/func", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/custom-fields.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-55": {"query": "How do the breaking storefront accessibility changes reach my theme in Shopware 6.7, and what must an extension that overrides the affected Twig blocks do?", "category": "dev", "option": "mcp-wiki", "answer": "Shopware rolls out storefront accessibility improvements \u2014 including breaking ones \u2014 via the `ACCESSIBILITY_TWEAKS` feature flag rather than in one big 'accessibility release'; breaking changes ship inside regular minor releases but stay inactive by default until the flag is set (`ACCESSIBILITY_TWEAKS=1` in `.env`, the same mechanism as major-version flags like `V6_7_0_0`). With major version v6.7.0, these previously flag-gated breaking changes become the default (they were not enabled by default before v6.7.0). A typical change implements both old and new markup guarded by `feature('ACCESSIBILITY_TWEAKS')` in Twig, e.g.: `{% if feature('ACCESSIBILITY_TWEAKS') %}<ul class=\"sidebar-list\">{% block component_list_items_inner %}{% endblock %}<\/ul>{% else %}<div class=\"sidebar-list\">{% block component_list_items %}{% endblock %}<\/div>{% endif %}`. An extension that overrides the old block (e.g. `component_list_items`) must also implement the new block (e.g. `component_list_items_inner`) via `{% sw_extends %}` so it keeps working once the flag/version default flips \u2014 otherwise, if the breaking change ships without the extension adapting, the extension's assumption of old markup (e.g. `<div class=\"list-item\">`) can render incorrect HTML once the core switches structure. Testing tooling referenced includes Google Lighthouse, AXE DevTools, WAVE, and manual keyboard/screen-reader checks (NVDA, VoiceOver), aiming for WCAG 2.1 AA and BITV 2.0 compliance. Source: https://developer.shopware.com/docs/guides/development/accessibility/storefront-accessibility.html", "citations": ["platform/dev/6.7/guides/development/accessibility/storefront-accessibility.md:1-80"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "accessibility", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/accessibility/storefront-accessibility.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-07": {"query": "How do I create a media entity from a file on disk in PHP from my plugin (e.g. during an import) and generate its thumbnails?", "category": "gap", "option": "mcp-wiki", "answer": "I could not find a wiki page describing the PHP-side API for creating a media entity from a file on disk (e.g. `Shopware\\Core\\Content\\Media\\File\\FileSaver::persistFileToMedia()`, or building a `MediaFile` struct from a local path) during an import. The Media guide landing page (`content/media/_index.md`) only links to three unrelated guides: preventing deletion of plugin-referenced media, adding a custom media file extension, and remote/CDN thumbnail generation. The only 'upload' content in the corpus is Administration-side (Vue): the `sw-media-upload-v2` / `sw-upload-listener` / `sw-media-preview-v2` components for uploading through the browser UI, which is not applicable to a server-side PHP import. The migration-assistant's internal concept page mentions `MediaFileService::saveMediaFile()` and `MediaConverter::convert()`, but that is documented only as an internal mechanism of the Migration Assistant extension, not as a general-purpose guide for plugin authors. For thumbnails, the corpus documents `ThumbnailService::generate()`, `updateThumbnails()`, and `deleteThumbnails()` as the relevant identifiers (surfaced only in the context of the remote-thumbnail-generation feature, where enabling remote thumbnails makes these methods throw instead of generating locally), plus the CLI commands `bin/console media:generate-thumbnails` and `media:delete-local-thumbnails` \u2014 but there is no guide showing how to call `ThumbnailService` yourself after creating a media entity. Overall this is a genuine gap: the corpus confirms the relevant service names exist but has no how-to guide for the PHP create-from-disk-file + generate-thumbnails workflow an importer would need.", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/media/_index.md:1-30", "platform/dev/6.7/guides/plugins/plugins/content/media/remote-thumbnail-generation.md:1-77", "platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/handling-media.md:1-47"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "MediaService|thumbnail", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/content/media/_index.md"}}, {"tool": "grep_docs", "args": {"pattern": "FileSaver|saveMediaFile|MediaService", "path": "platform/dev/6.7", "regex": true}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/content/media/remote-thumbnail-generation.md"}}, {"tool": "grep_docs", "args": {"pattern": "persistFileToMedia|MediaFile\\(|upload", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/handling-media.md"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "partial"}, "dev-15": {"query": "How do I work out which event Shopware actually dispatches for a given action, for example after a product is loaded or a page is rendered?", "category": "dev", "option": "mcp-wiki", "answer": "Several techniques, depending on the kind of event: (1) DAL events are named `entity_name.event`, e.g. `product.written`/`product.deleted`; many entities also have a constants class (e.g. `ProductEvents`, with `PRODUCT_LOADED_EVENT`) found by searching for `@Event`. (2) General PHP events are found by reading core code for `$this->eventDispatcher->dispatch($someEvent, $someEvent->getName())` calls, or by searching for `extends NestedEvent`, `extends Event`, `implements ShopwareEvent`, or `->dispatch`; check a service's constructor for `EventDispatcherInterface` to find where it's used. (3) Page-load events: `GenericPageLoader` dispatches a `GenericPageLoadedEvent` on page load \u2014 search for `PageLoadedEvent`. (4) Criteria events (e.g. `ProductListingCriteriaEvent`) fire only for specific hand-written entities/routes \u2014 search for `CriteriaEvent`; they are not auto-generated for every entity. (5) Route events are fine-grained per-route aliases of Symfony kernel events: `{route}.request`, `{route}.response`, `{route}.render` (Storefront, before Twig rendering), plus (since 6.6.11.0) `{route}.encode` (Store-API, before JSON encoding) and `{route}.controller` \u2014 substitute the Symfony route name for `{route}`, e.g. `store-api.product.listing.request`. (6) Business/ecommerce events (registration, order placement, etc.) are found via `implements BusinessEventInterface` or `implements MailActionInterface` (the latter triggers an email). (7) The Symfony profiler's \"Events\" tab lists every event fired during a request with its name \u2014 a quick way to confirm what actually dispatched. (8) In storefront JS, custom events use `this.$emitter.publish('someEvent', ...)`; in the Administration (Vue), two-way events fire via `this.$emit('some-event', ...)` \u2014 grep for those calls.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/event/finding-events.md:1-66"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "debug:event", "path": "platform/dev/6.7", "mode": "content"}}, {"tool": "grep_docs", "args": {"pattern": "finding events", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/event/finding-events.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-52": {"query": "What must a plugin database migration class implement in Shopware 6.7, and where does the database cleanup on uninstall belong?", "category": "dev", "option": "mcp-wiki", "answer": "A plugin migration class must extend `Shopware\\Core\\Framework\\Migration\\MigrationStep` and implement two methods: `getCreationTimestamp(): int` (returning the timestamp embedded in the class name) and `update(Connection $connection): void`, which contains every schema/data change; migration files live by default in `<plugin root>/src/Migration`, named `Migration<timestamp><Description>.php`. `MigrationStep::updateDestructive()` also exists but is only used by Shopware core itself for delayed, major-version destructive changes \u2014 plugin install/update never calls it. Migrations can be scaffolded with `./bin/console database:create-migration -p SwagBasicExample --name ExampleDescription` or generated with SQL from an entity definition via `./bin/console dal:migration:create --bundle=SwagBasicExample --entities=your_entity`, and run manually with `./bin/console database:migrate SwagBasicExample --all`. There is no migration rollback, and a migration that has already run must never be modified. Database cleanup when a plugin is removed does NOT belong in a migration \u2014 it belongs in the plugin's `uninstall` lifecycle method instead. Source: https://developer.shopware.com/docs/guides/plugins/plugins/database/database-migrations.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md:1-77"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-02": {"query": "What's the plugin lifecycle in Shopware \u2014 install, activate, uninstall \u2014 and how does `keepUserData` work?", "category": "dev", "option": "mcp-wiki", "answer": "A Shopware plugin's base class (`Shopware\\Core\\Framework\\Plugin`, which itself extends `Shopware\\Core\\Framework\\Bundle` and Symfony's `Bundle`) implements a set of lifecycle methods, typically in `<plugin root>/src/SwagBasicExample.php`: `install(InstallContext $installContext)` registers entities (e.g. payment methods), creates initial data and prepares requirements \u2014 `InstallContext` exposes plugin/Shopware versions, the system `Context`, plugin migrations, and auto-migration control (`isAutoMigrate`/`setAutoMigrate`); `activate(ActivateContext $context)` activates entities created in `install()` or creates data that requires the plugin to be active; `deactivate(DeactivateContext $context)` deactivates those entities, or removes ones that cannot safely stay active; `update(UpdateContext $context)` handles non-database adjustments, feature toggles, or version-dependent logic (database changes belong in plugin migrations instead), and `UpdateContext` adds `getUpdatePluginVersion()`/`getCurrentPluginVersion()`; `postInstall(InstallContext $context)`/`postUpdate(UpdateContext $context)` run after a successful install/update completes; and `uninstall(UninstallContext $context)` removes or cleans up plugin data. `UninstallContext` adds a `keepUserData()` method: if it returns true, the plugin must not delete its persistent data, e.g. `if ($uninstallContext->keepUserData()) { return; } // otherwise remove or deactivate the data created by the plugin`. Best practice is to avoid creating fully active business data in `install()` (the plugin isn't enabled yet) and to deactivate rather than delete entities in `uninstall()` when they may be referenced by real records (e.g. a payment method used on existing orders), so as not to leave data in a broken state; `keepUserData()` must always be respected when it returns true. Source: https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md:1-61"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "keepUserData", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-71": {"query": "How does an app define its own custom entities in Shopware 6.7 and read them back through the API?", "category": "dev", "option": "mcp-wiki", "answer": "An app defines new data structures by registering entities in the app's Resources/entities.xml file, validated against the entity-1.0.xsd schema. For example, an <entity name=\"custom_entity_bundle\"> element can declare fields such as a translatable required string, a price field, and a many-to-many relation to an existing entity like product, each optionally marked store-api-aware=\"true\" to expose it via the Store API. Once registered, the entity automatically gets a repository, accessible from App Scripts via services.repository.search('custom_entity_bundle', criteria), and via the Admin API at POST /api/search/custom-entity-bundle (i.e. the entity name with underscores converted to hyphens in the route). To let a custom field reference a custom entity (an 'Entity Select'), the entity element also needs custom-fields-aware=\"true\" and label-property=\"name\" (the referenced field must exist and be of type string); without an admin snippet the entity displays as custom_entity_bundle.label, so a snippet should be added under Resources/app/administration/snippet/en-GB.json. Since Shopware 6.4.15.0, entity names may use a ce_ shorthand prefix (e.g. ce_bundle) to avoid database name-length restrictions, and this prefix must then be used consistently in repository calls and API routes (e.g. POST /api/search/ce_blog). Gotchas: custom entities with custom-fields support requires Shopware 6.5.1.0+, custom entities cannot be renamed once created (renaming deletes all existing data), and associations referencing core tables still require the corresponding manifest permissions.", "citations": ["platform/dev/6.7/guides/plugins/apps/custom-data/custom-entities.md:1-54"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "custom entities", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/custom-data/custom-entities.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-04": {"query": "How do I fetch products with `GET /sales-channel-api/v3/product` on Shopware 6.7?", "category": "edge", "option": "mcp-wiki", "answer": "This route is not the way to fetch products on Shopware 6.7. The wiki's Store API hub explicitly says that Store API plugin routes 'must not implement the deprecated Sales Channel API' \u2014 the Sales Channel API is deprecated in favor of the Store API. The functional Security Measures page also lists `/store-api` and `/sales-channel-api` side by side while treating the latter as the older interface, and the Store API hub's 6.7 quick-start describes the current pattern instead: the Store API is accessed at `/store-api/*` and authenticated with the sales-channel `sw-access-key` header (plus `sw-context-token` for customer-specific state), e.g. `/store-api/search` or `/store-api/product` for product queries, as shown in the 6.7 'Create a Product and Complete Checkout' worked example which reads products via `/store-api/search`. So on 6.7 you should call the `/store-api/...` product endpoints rather than `/sales-channel-api/v3/product`. A grep for the literal `sales-channel-api` term across the whole platform layer found only a passing mention in a functional security page, not a dedicated 6.7 product-fetch guide for that old route \u2014 confirming it isn't the current, documented way to fetch products.", "citations": ["platform/hubs/store-api.md:1-83", "platform/func/tutorials-and-faq/security-measures.md:1-64"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "sales-channel-api", "path": "platform", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/tutorials-and-faq/security-measures.md"}}, {"tool": "read_doc", "args": {"path": "platform/hubs/store-api.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "partial"}, "dev-37": {"query": "How do I set up and run PHPUnit integration tests for my Shopware plugin, including tests that boot the kernel?", "category": "dev", "option": "mcp-wiki", "answer": "Create a `phpunit.xml` in the plugin root (it can be autogenerated via `bin/console plugin:create`) with a bootstrap pointing at `tests/TestBootstrap.php`, the `KERNEL_CLASS` server variable set to `Shopware\\Core\\Kernel`, `APP_ENV` set to `test`, and one or more `<testsuite>` entries (e.g. a `migration` suite pointing at `Migration/Test` and a general suite pointing at `Test`). `plugin:create` also generates `tests/TestBootstrap.php`, which uses `Shopware\\Core\\TestBootstrapper` with `->addCallingPlugin()`, `->addActivePlugins(...)`, and `->setForceInstallPlugins(true)` \u2014 the latter is what ensures your plugin gets installed and activated even when the test database already exists. For integration tests that need database/container access and kernel boot behavior, write a `PHPUnit\\Framework\\TestCase` using the `Shopware\\Core\\Framework\\Test\\TestCaseBase\\IntegrationTestBehaviour` trait (gives automatic database transaction handling and cache clearing per test); for migration tests specifically, use the `Shopware\\Core\\Framework\\Test\\TestCaseBase\\KernelTestBehaviour` trait instead, naming the test class `<MigrationClassName>Test`. To vary service configuration only for the test environment, add `<plugin root>/Resources/config/services_test.php`, which overrides `Resources/config/services.php` (arguments, aliases, parameters) when running tests. Run tests with `./vendor/bin/phpunit --configuration=\"custom/plugins/SwagBasicExample\" --testsuite \"migration\"` (omit `--testsuite` to run all suites; use `--filter <ClassOrMethod>` to run a single class or method). To use PHPUnit at all you need the flex template's dev-tools package: `composer require --dev dev-tools`. Source: https://developer.shopware.com/docs/guides/development/testing/unit/php-unit.html", "citations": ["platform/dev/6.7/guides/development/testing/unit/php-unit.md:1-62"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "phpunit", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/testing/unit/php-unit.md"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/development/testing", "depth": 2}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-49": {"query": "My storefront controller still uses the `@Route` and `@RouteScope` annotations from 6.4 \u2014 what is the attribute form in Shopware 6.7 and how are the routes wired?", "category": "dev", "option": "mcp-wiki", "answer": "Prior to Shopware 6.4.11.0 the route scope was set via the `@RouteScope` annotation; this was replaced by the `_routeScope` route default and is deprecated as of the 6.5 major version in favor of the PHP 8 `#[Route(defaults: ...)]` attribute (the modern replacement for both `@Route` and `@RouteScope`). In Shopware 6.7, a Storefront controller extending `StorefrontController` declares its route scope like this:\n\n```php\n#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]])]\nclass ExampleController extends StorefrontController\n{\n    #[Route(path: '/example', name: 'frontend.example.example', methods: ['GET'])]\n    public function showExample(): Response\n    {\n        return $this->renderStorefront('@SwagBasicExample/storefront/page/example.html.twig', [\n            'example' => 'Hello world'\n        ]);\n    }\n}\n```\n\nThe route scope attribute can be set class-wide (as above) or per individual route method instead. Route names should use one of the `frontend`, `widgets`, `payment`, `api` or `store-api` prefixes so the router recognizes it as belonging to that scope. Wiring: register the controller as a public service in `services.php`, calling `setContainer`:\n\n```php\n$services->set(ExampleController::class)\n    ->public()\n    ->call('setContainer', [service('service_container')]);\n```\n\nThen import the controller's routes in `routes.php` using the `attribute` type loader:\n\n```php\n$routes->import('../../Storefront/Controller/*Controller.php', 'attribute');\n```\n\nSince Shopware 6.7.2.0, a plugin can also allow custom route names that don't use one of the standard prefixes, by adding a `storefront.router.allowed_routes` config entry (loaded from the plugin's `build()` method):\n\n```yaml\nstorefront:\n    router:\n        allowed_routes:\n            - swag.test.foo-bar\n```\n\nSource: https://developer.shopware.com/docs/guides/plugins/plugins/storefront/controllers/add-custom-controller.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:1-83"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "RouteScope", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/controllers"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-11": {"query": "On Shopware 6.7, which file do I declare my plugin's services in, and how do I get a core service passed into my service's constructor?", "category": "dev", "option": "mcp-wiki", "answer": "In Shopware 6.7, plugin services are declared in `src/Resources/config/services.php` using Symfony's PHP-based DI configuration (ContainerConfigurator). If `autowire()` and `autoconfigure()` are set on the service defaults and the plugin namespace is loaded (`$services->load('Vendor\\\\Plugin\\\\', '../../')->exclude(...)`), a core service such as `SystemConfigService` is injected automatically just by type-hinting it as a constructor parameter \u2014 nothing else is needed. If the service was declared explicitly instead (`$services->set(ExampleService::class)`), add the dependency as an argument: `$services->set(ExampleService::class)->args([service(SystemConfigService::class)])`, using the `service()` function from `Symfony\\Component\\DependencyInjection\\Loader\\Configurator`. Note that XML service configuration (services.xml) is deprecated starting with Symfony 7.4 and unsupported in Symfony 8.0, so services.php is the current file for 6.7.", "citations": ["platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md:1-57", "platform/dev/6.7/guides/plugins/plugins/services/add-custom-service.md:1-49"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7", "glob": "**/*dependency-injection*"}}, {"tool": "grep_docs", "args": {"pattern": "services.xml", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "dependency injection", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "services.xml", "path": "platform/dev/6.7", "mode": "count"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/services/_index.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/services/add-custom-service.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-34": {"query": "How do I extend an existing Administration component and its Twig blocks from my plugin, for example to change the dashboard headline?", "category": "dev", "option": "mcp-wiki", "answer": "Use `Shopware.Component.override('component-name', { template })` to replace an existing component's behavior in place (e.g. to override `sw-dashboard-index` and change its headline), or `Shopware.Component.extend('new-name', 'base-name', { template })` to create a new component based on an existing one under a different name. To customize just the markup, write a Twig template that redefines the block you want to change, e.g. `{% block card_header %}<h1 class=\"custom-header\">{{ header }}<\/h1>{% endblock %}`, or keep the inherited markup and add to it using `{% parent %}` inside the block, e.g. `{% block card_content %}{% parent %}<div class=\"card-custom-content\">...<\/div>{% endblock %}`. You can also extend a method or computed property while keeping the original logic via `this.$super('methodName')`. The override/extension file must be registered/imported from the plugin's `main.js`. Multiple plugins overriding the same component are applied in registration order. There is also an experimental Composition API extension system (`Shopware.Component.createExtendableSetup` / `Shopware.Component.overrideComponentSetup()`) intended for components already written with the Composition API, but it only supports overriding (not extending) and has no committed release timeline \u2014 Options API components should keep using the override/extend factory approach. Source: https://developer.shopware.com/docs/guides/plugins/plugins/administration/module-component-management/customizing-components.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-components.md:1-73"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "override.*component", "path": "platform/dev/6.7/guides/plugins/plugins/administration", "mode": "files", "regex": true}}, {"tool": "grep_docs", "args": {"pattern": "sw-dashboard", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-components.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-03": {"query": "My ERP integration stopped logging in after the 6.7 upgrade \u2014 what changed in the Admin API OAuth flow (`/api/oauth/authorize`, the `scope` format)?", "category": "gap", "option": "mcp-wiki", "answer": "I found nothing in the wiki describing a 6.7 change to the Admin API OAuth flow, to `/api/oauth/authorize`, or to the `scope` parameter's format. The corpus's OAuth-related material (`platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md` and `.../flows/create-product.md`) only documents the existing `POST /api/oauth/token` endpoint with `grant_type: client_credentials` (the default for integrations) or the local-only `grant_type: password` shortcut (`client_id: administration`, `scopes: write`), and does not mention `/api/oauth/authorize` at all, nor any breaking change to scopes between versions. I searched both pages plus a direct grep for `oauth/authorize` and `scope` across the integrations-api guides with no relevant hits. This looks like a genuine gap in the served corpus \u2014 the wiki gives the standard client_credentials/password-grant flow but has no content on a 6.7-specific OAuth/scope breaking change, so I cannot answer what actually changed for the ERP integration.", "citations": ["platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md:1-44"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "oauth", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md"}}, {"tool": "grep_docs", "args": {"pattern": "oauth/authorize", "path": "platform/dev/6.7"}}, {"tool": "grep_docs", "args": {"pattern": "scope", "path": "platform/dev/6.7/guides/development/integrations-api"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "dev-43": {"query": "My admin plugin still ships a webpack.config.js \u2014 how do I move the administration build to Vite for Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "Shopware 6.7 replaces the Webpack-based Administration build with Vite. To migrate: 1) create a `vite.config.mts` in `YourApp/src/Resources/app/administration/src` (this replaces the old `webpack.config.js` that lived under `YourApp/src/Resources/app/administration/build/`); 2) remove the old `webpack.config.js`; 3) remove Webpack-related dependencies from `package.json`; 4) add the Vite dependencies to `package.json`. A minimal `vite.config.mts` uses `defineConfig` from `vite`, e.g. to set up a `resolve.alias`. You can test the new system via the `ADMIN_VITE` feature flag. Bundle/plugin info is written to `<shopwareRoot>/var/plugins.json` by `Shopware\\Core\\Framework\\Plugin\\Command\\BundleDumpCommand`, runnable standalone via `bin/console bundle:dump` or as part of `composer build:js:admin` / `watch:admin`. Extensions (plugins) are built via `<shopwareRoot>/src/Administration/Resources/app/administration/build/plugins.vite.ts`, still invoked through `composer build:js:admin`; the core's own Vite config only covers the core, not extensions. In production, asset info is loaded via the Symfony bundle `pentatrion_vite` and its `entrypoints.json` (generated by `vite-plugin-symfony`); in dev/HMR mode a `shopware-vite-plugin-serve-multiple-static` plugin serves `sw-plugin-dev.json`. Gotcha: Vite can only hot-reload `.vue` files, so HMR stays limited until templates fully move to Single File Components; the `vue-globals` plugin rewrites Vue imports to destructure from `Shopware.Vue` to avoid multiple Vue instances, and `override-component` auto-registers `*.override.vue` files via `Shopware.Component.registerOverrideComponent`. This is described as a future-development-roadmap article, so timelines/details may still change; it does not affect Apps, since their build is already decoupled from Shopware. Source: https://developer.shopware.com/docs/guides/upgrades-migrations/administration/vite.html", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/vite.md:1-58"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "vite", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/administration/vite.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-45": {"query": "Shopware.State is deprecated in 6.7 \u2014 how do I convert my administration Vuex module into a Pinia store?", "category": "dev", "option": "mcp-wiki", "answer": "With Shopware 6.7, Vuex is replaced by Pinia as the Administration's state management library. Register a store with `Shopware.Store.register('<storeName>', { state, getters, actions })`, where `state` must be a function returning the initial state (not a static object), e.g.:\n\n```javascript\nconst store = Shopware.Store.register('<storeName>', {\n    state: () => ({ /* initial state */ }),\n    getters: { /* ... */ },\n    actions: { /* ... */ },\n});\nexport default store;\n```\n\nA store can also be registered with an `id` property instead of a name argument; re-registering an existing store id overwrites it, and `Shopware.Store.unregister('<storeName>')` removes one. To register the store, simply import its file \u2014 `import './state/products.state'` replaces the old `Shopware.State.registerModule('product', productsStore)`. Key differences from Vuex: mutations are removed entirely \u2014 update state directly inside actions (`this.productName = newName`); getters cannot share a name with a state property since both are exposed at the same level; for TypeScript, define `StoreType` via `ReturnType<typeof store>` and extend the global `PiniaRootState` interface with it; stores can also be defined as composables returning reactive refs/computed/functions (Pinia devtools only track returned variables/functions); and store access changes from `Shopware.State.get('<storeName>')` to `Shopware.Store.get('<storeName>')`. For tests, import the store file to register it and call `store.$reset()` in `beforeEach`; component tests using Pinia stores should call `setActivePinia(pinia)` with a `createPinia()` instance and pass `plugins: [pinia]` to the mount config. Source: https://developer.shopware.com/docs/guides/upgrades-migrations/administration/pinia.html", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/pinia.md:1-55"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/administration/pinia.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-56": {"query": "Header and footer are loaded through ESI sub-requests in Shopware 6.7, so page data is gone in my header template \u2014 how do I pass my own data into the header/footer now?", "category": "dev", "option": "mcp-wiki", "answer": "To pass current-page data into the ESI request, extend `base.html.twig` and override the `base_esi_header` (or `base_esi_footer`) block to merge extra parameters, e.g.: `{% sw_extends '@Storefront/storefront/base.html.twig' %}{% block base_esi_header %}{% set headerParameters = headerParameters|merge({ 'vendorPrefixPluginName': { 'activeRoute': activeRoute } }) %}{{ parent() }}{% endblock %}`. `headerParameters` (and `footerParameters`) are passed as query parameters to the header/footer ESI route, so they must contain scalar values only. Read the value back in the header template by extending `@Storefront/storefront/layout/header.html.twig` and accessing e.g. `headerParameters.vendorPrefixPluginName.activeRoute` inside the `header` block. In plugins, `StorefrontRende
