rted": 6, "actual": 6, "missing": []}, "fenceDenials": 0, "citationsVerified": "3/3", "memoryClaims": 0, "findings": ["Clean gap handling: correctly states no PHP media-creation guide exists, carefully attributes MediaFileService::saveMediaFile() to the Migration Assistant's internal mechanism rather than presenting it as a general guide, and does not claim thumbnails appear instantly."], "officialReferences": [{"url": "https://developer.shopware.com/docs/guides/plugins/plugins/storefront/howto/use-media-thumbnails.html", "quote": "`MediaService::saveMediaFile(MediaFile $mediaFile, string $filename, Context $context, ?string $folder = null, ?string $mediaId = null, bool $private = true): string`"}], "notes": "accuracyNeedsCheck true per blanket edge/gap rule."}, {"caseId": "gap-08", "category": "gap", "area": "Gap", "status": "confirmed", "scores": {"groundingRelevance": 100, "accuracy": 100, "completeness": 100, "citation": 100, "honesty": 100, "actionability": 100}, "points": {"groundingRelevance": 25.0, "accuracy": 25.0, "completeness": 15.0, "citation": 10.0, "honesty": 15.0, "actionability": 10.0}, "total": 100, "verdict": "pass", "scorerTotal": 100, "scorerVerdict": "pass", "discrepancy": false, "provisionalAccuracy": 100, "findability": "n/a", "pageReached": null, "target": "none \u2014 the `developer.shopware.com/frontends/` documentation is not part of the corpus", "notFoundClaim": true, "sourceAbsentOverrideApplied": false, "selfReportDelta": {"reported": 6, "actual": 6, "missing": []}, "fenceDenials": 0, "citationsVerified": "2/2", "memoryClaims": 0, "findings": ["Clean gap handling: correctly states the corpus has no Composable Frontends/Nuxt setup guide (only the PaaS Native deployment page), and explicitly declines to explain HTTP 412 rather than inventing an explanation."], "officialReferences": [], "notes": "accuracyNeedsCheck true per blanket edge/gap rule."}], "findability": {"pass": 69, "fail": 14, "n/a": 17}, "accessCost": {"callsToTarget": {"mean": 0.94, "median": 1.0, "p90": 1}, "retrievalCalls": {"mean": 2.99, "median": 2.0, "p90": 5}, "retrievalBytes": {"mean": 9257.6, "total": 740612}, "retrievalLines": {"mean": 3.3, "total": 264}, "deadEndRate": 0.0, "retrievalTurns": {"mean": 2.99}, "toolLatencyMsP50": 2332, "toolLatencyMsP90": 112309, "warmCasesExcluded": 3}, "counts": {"partly": 31, "pass": 61, "fail": 8}, "edge": {"pass": 8, "total": 9}, "gap": {"pass": 6, "total": 8, "passIds": ["gap-02", "gap-04", "gap-05", "gap-06", "gap-07", "gap-08"]}, "averages": {"developer": 80.77, "functional": 70.75, "overall": 81.25, "byDimension": {"groundingRelevance": 94.1, "accuracy": 58.4, "completeness": 78, "citation": 94.4, "honesty": 90, "actionability": 86.4}}, "byArea": {"DAL": 81.71, "Plugin fundamentals": 88, "Store API & headless": 92, "Content": 85, "Theme": 88.5, "Events": 79.83, "Services & DI": 62.67, "Orders": 86, "Checkout & Cart": 89, "Config & CLI": 70.2, "Content (CMS/mail/SEO/media/sitemap)": 68, "Storefront": 88.56, "Administration": 90.25, "Testing": 75.67, "Platform upgrade": 92.5, "Hosting & ops": 75, "Admin migration (Vue 3 / Vite / Pinia / Meteor)": 73.25, "Payment & Shipping": 50, "Core breaking changes": 89.67, "Admin API": 81, "App system": 83.4, "Merchant": 70.75, "Trap": 90.89, "Gap": 90.38}, "weakestDimension": "accuracy", "status": "Not ready", "accuracyChecks": {"flagged": 77, "fetched": 0, "cached": 0, "bandsChanged": 0}, "fenceDenialCount": 0, "warmCasesExcluded": 3, "costs": {"totalTokens": 29334453, "totalToolCalls": 338, "agentTimeSecondsSummed": 6935.9, "usageComplete": true}}}, "matrix": null, "costs": {"wallClockSeconds": 1233.0}, "warnings": ["rescore gap-03: confirmed at 83 (partly), no change", "audit: 14 cases showed a self-report delta (audit-detected gap between toolCallLog and ground truth): dev-05, dev-09, dev-11, dev-13, dev-17, dev-24, dev-25, dev-46, dev-47, dev-55, dev-66, func-02, func-12, gap-02 \u2014 cases with a material delta were scored honesty=0 by the shard scorer; smaller (1-call) deltas were judged non-material and honesty kept at 100", "audit: fenceDenialsTotal=0 across all 100 cases (mcp-wiki agents have no Read/Grep/Glob/Bash tools, so the fence cannot fire)", "audit: queryDrift=[] (no blind-brief drift detected), unexpectedFiles=[] , reportsMissing=[], reportsUnparsable=[]", "accuracy pass: all 77 flagged cases were confirmed status and settled from expected-answer [code: ...] evidence with no live fetch; no accuracy bands changed from the shard pass's provisional value", "aggregation override dev-66: accuracy pass raised accuracy 40->70 without addressing the shard's own 'materially wrong scope claim' finding; restored to 40 per nothing-softened rule, total recomputed to 73 (partly)"]}, "raw": {"mcp-wiki": {"dev-61": {"query": "After the upgrade my Elasticsearch index has to be rebuilt \u2014 where do I set the shard and replica counts and which reindex command do I run?", "category": "dev", "option": "mcp-wiki", "answer": "Override the shard/replica counts in `config/packages/elasticsearch.yml` (available since Shopware 6.4.12.0), e.g.\n```yaml\nelasticsearch:\n  index_settings:\n    number_of_shards: 1\n    number_of_replicas: 0\n```\nThe default is 3 shards / 3 replicas. To rebuild the index: clear the cache first (`bin/console cache:clear`), then run `bin/console dal:refresh:index --use-queue` to reindex the whole shop (Elasticsearch, SEO URLs, product index, etc.) \u2014 always with `--use-queue`. A narrower `bin/console es:index` also does basic Elasticsearch indexing, and some systems additionally need `bin/console es:create:alias` afterward. Indexing writes to the message queue, so run `bin/console messenger:consume` (add `-vv` for output) to actually process it; failed messages land in `dead_messages` and are retried.", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md:1-74"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "SHOPWARE_ES_INDEXING_ENABLED|number_of_shards|number_of_replicas", "path": "platform/dev/6.7"}}, {"tool": "list_docs", "args": {"path": "platform/hubs", "glob": "*elastic*"}}, {"tool": "read_doc", "args": {"path": "platform/hubs/elasticsearch.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-29": {"query": "How do I add my own data to an existing Storefront page or pagelet from a plugin without overriding the core controller?", "category": "dev", "option": "mcp-wiki", "answer": "Subscribe to the page's or pagelet's ...LoadedEvent (e.g. FooterPageletLoadedEvent for the footer pagelet) rather than overriding the controller. If an existing Store API route would return more data than needed, add a dedicated new Store API route for just the missing data (built with EntityRepository::aggregate() and something like CountAggregation plus an EqualsFilter, rather than search(), when only an aggregate is needed \u2014 do not call the DAL directly from the subscriber). In the subscriber, call the route and attach the result to the page/pagelet via $event->getPagelet()->addExtension('product_count', $response->getProductCount()); register the subscriber with the kernel.event_subscriber tag and getSubscribedEvents() mapping the LoadedEvent class to your handler method. In the Twig template, the added data is then available under the extensions namespace, e.g. {% if footer.extensions.product_count %}{{ footer.extensions.product_count.count }}{% endif %}. Key identifiers: Shopware\\Storefront\\Pagelet\\Footer\\FooterPageletLoadedEvent, addExtension(name, value) / extensions.<name>, kernel.event_subscriber, and EntityRepository::aggregate() with CountAggregation.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md:1-70"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-66": {"query": "Which request headers change Admin API behaviour for language, entity version, parent-child inheritance and skipping flow triggers during a bulk import?", "category": "dev", "option": "mcp-wiki", "answer": "- `sw-language-id` \u2014 returns entities in the given language ID instead of the system language, e.g. `sw-language-id: be01bd336c204f20ab86eab45bbdbe45`.\n- `sw-version-id` \u2014 tells the API which entity version to return, e.g. `sw-version-id: 0fa91ce3e96a4bc2be4bd9ce752c3425`.\n- `sw-inheritance` \u2014 makes the API consider parent-child inheritance (e.g. product variants), e.g. `sw-inheritance: 1`.\n- `sw-skip-trigger-flow` \u2014 skips flow triggers (e.g. \"send email on customer creation\") during bulk imports via the sync API, e.g. `sw-skip-trigger-flow: 1`.\n\nGotcha: a translatable field (e.g. `product.name`) is only populated if an explicit translation exists for the requested `sw-language-id`, otherwise it's `null`; the nested `translated` object always resolves via language inheritance, so use `product.translated.[value]` for display and the plain field only in Admin/CRUD flows.", "citations": ["platform/dev/6.7/guides/development/integrations-api/request-headers.md:1-37"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/integrations-api/request-headers.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-12": {"query": "A spec asks for customer-specific pricing and for a flow that calls an external URL when an order is placed \u2014 before I build either of them, does Shopware already ship them, and what has to be licensed or installed for them to exist in the shop?", "category": "func", "option": "mcp-wiki", "answer": "Both already exist in Shopware, with different prerequisites. Customer-specific pricing (bespoke, per-customer prices such as list prices, graduated prices, or currency-dependent prices synced from an external system like an ERP) is available only from the Shopware Beyond plan via the Shopware Commercial extension \u2014 it requires that plan/extension to exist at all. It is API-only: creating, reading, changing and deleting custom prices is possible only through the Admin API 'bulk edit custom prices' endpoint; there is no dedicated Administration module and no storefront configuration UI. It also ignores variant inheritance (each variant needs its own priced entry), and the individual price is shown in the storefront only while the matching customer is logged in. Calling an external URL when an order is placed is covered by Flow Builder's webhook action: a flow with an order-placed trigger and a webhook action forwards data to a third-party API/server, telling it that the event occurred (as a notification or a request to act on the data) \u2014 no plugin or paid extension is needed for this, it's a core Flow Builder feature. So: the webhook/flow capability ships in core and just needs to be configured as a flow; customer-specific pricing needs the Shopware Beyond plan plus the Shopware Commercial extension and is driven entirely via the Admin API, not built by hand.", "citations": ["platform/func/extensions/customer-specific-pricing.md:1-43", "platform/func/features/webhook-actions-in-flow-builder.md:1-36"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/func/features/customer-specific-pricing.md"}}, {"tool": "read_doc", "args": {"path": "platform/func/features/webhook-actions-in-flow-builder.md"}}, {"tool": "read_doc", "args": {"path": "platform/func/extensions/customer-specific-pricing.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-13": {"query": "There is no event for what I need to change in a core Shopware service \u2014 how do I decorate or replace that service from my plugin?", "category": "dev", "option": "mcp-wiki", "answer": "Use service decoration, one of the two main ways (alongside events) to extend Shopware from a plugin, used specifically when an existing service's own behavior must change rather than just reacting to something it does. Decoratable Shopware services expose an abstract class as their contract (with a `getDecorated()` method) instead of a plain interface, so new non-abstract methods can be added later without breaking existing decorators. To decorate: register both the original and your decorator service, pointing the decorator at the original with `decorate()` and passing the original instance in via `.inner`: `$services->set(ExampleServiceDecorator::class)->decorate(ExampleService::class)->args([service('.inner')]);`. Your decorator implements the same abstract class (e.g. `AbstractExampleService`), its `getDecorated()` returns the wrapped instance, and its overridden methods should normally delegate to `$this->decoratedService->doSomething()` before/after adding behavior \u2014 a decorator that never calls the inner service silently breaks the rest of the decoration chain, with no runtime warning. Always type-hint the abstract class, never the concrete class, in constructors, or the service is removed from the decoration chain. If multiple plugins decorate the same service they nest (B wraps A wraps core), and each only sees the next inner service \u2014 inspect the chain with `bin/console debug:container --show-arguments <service-id>`. Where a designed extension point already exists (subscribed to as `.pre`/`.post`/`.error` events), prefer that over decoration since it lets multiple extensions participate without forming a chain.", "citations": ["platform/dev/6.7/guides/plugins/plugins/services/adjusting-service.md:1-74"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/services/adjusting-service.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-07": {"query": "How do I import products from a CSV with an import/export profile \u2014 column mapping, matching identifiers and a dry run?", "category": "func", "option": "mcp-wiki", "answer": "Import/Export is configured under Settings > Automation > Import/Export. The CSV file itself must be UTF-8, use a semicolon field separator and quotation marks as the string separator, and prices must use a dot as the decimal separator (e.g. 5.00, not 5,00). On the Profiles tab you manage standard or user-created profiles (open/delete/duplicate/modify via the row menu, or Create new profile); when creating a profile you must select the default system language or import/export will not be possible. A profile has: Profile name, Usage (import/export/both), Object type (e.g. Product, Customer), Separator character (default semicolon), Enclosure character, and Import settings (Create new records, Update existing data). Column mapping is done via Add new mapping, mapping a CSV column name to a database entry, with Required, Default Value and Position settings per mapping. To match rows to existing entities by something other than the internal UUID, the Advanced Settings tab of a profile offers a Second Unique Identifier \u2014 e.g. productNumber instead of the product's UUID \u2014 though a non-unique identifier value means only the first matching record gets resolved. For a plain product import, select the Default product profile and leave 'Import product variants' unchecked; mandatory product fields are id, taxId, productNumber, stock and name (the default product CSV also commonly includes parent_id, active, description, price_net, price_gross, tax_rate, tax_name, cover_media_id/url, manufacturer_id/name, categories, sales_channels). Importing variants is a 4-step process: 1) import the products with id/parent_id left empty using the default product profile, 2) import properties with group_id left empty (auto-creates the group) using the default properties profile, 3) link products and properties via option_id/product_id using the default variant configuration settings profile, and 4) either import variants using the Default product profile with 'import product variants' enabled (mandatory: parent_id, product_number, active, stock, and pipe-separated optionIds), or generate them from the product's own Generate variants tab instead. On the Import tab, upload the CSV, select the profile, then either Start import or Start dry run \u2014 the dry run validates the file without writing any data; Import activity (last 30 days) lets you re-download the source or erroneous CSV per row, and a process can be aborted. Import only adds data, it cannot remove existing assignments (e.g. it will not clear an existing sales-channel link on a product).", "citations": ["platform/func/shopware-en/settings/importexport.md:1-79"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/func/shopware-en/settings/importexport.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-44": {"query": "After the Vue 3 upgrade my admin plugin broke \u2014 this.$parent resolves to the wrong component and a prop default that calls this.$tc throws. What do I have to change?", "category": "dev", "option": "mcp-wiki", "answer": "Both symptoms are documented, known Vue 2\u21923 migration pitfalls in the Shopware Administration (Vue 3 is used from Shopware 6.6 upwards). `this.$parent` is unreliable in Vue 3 because Vue wraps async components, so `this.$parent` sometimes needs to be `this.$parent.$parent` to reach the component you expect \u2014 the recommended fix is to stop relying on `$parent` altogether and use services or event communication instead. Prop default functions in Vue 3 no longer have access to `this` at all, so `this.$tc` inside a prop default throws; replace it with `Shopware.Snippet.tc` instead of `this.$tc`. More generally, search your plugin's code for any `this.$` usage (an indicator of Vue's internal API) since most such calls will break except `this.$tc` itself (when used in normal component methods, not prop defaults). Other related gotchas to check: `@hook:mounted` and similar lifecycle hooks may now fire twice for async components (once for the `AsyncComponentWrapper`, once for the real component); checking `this.$slots` for a slot name is no longer sufficient \u2014 verify it contains an actual v-node; Vuex stores lose reactivity if a getter mutates state; and mutating props now throws hard errors instead of being silently allowed. Test changes by running `composer run watch:admin` locally, and consider enabling the Vue 3 ESLint rule set. Source: https://developer.shopware.com/docs/guides/upgrades-migrations/administration/vue3.html", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/vue3.md:1-48"], "toolCallLog": [{"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/administration"}}, {"tool": "grep_docs", "args": {"pattern": "\\$parent", "path": "platform/dev/6.7/guides/upgrades-migrations", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/administration/vue3.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-04": {"query": "What does the Shopware Migration Assistant transfer automatically from Shopware 5, and what has to be mapped by hand before the migration starts?", "category": "func", "option": "mcp-wiki", "answer": "The Migration Assistant extension is installed both in the target Shopware 6 shop (from the Community Store) and in the source Shopware 5 shop; a connection is then created under Settings > Extensions > Migration, either via an API connection (the Shopware 5 API key and username of a user belonging to the local_admins group, plus the shop domain) or a Local/DB connection (DB host, port, user, password, name, and the absolute installation root path). Automatically migrated data is grouped into selectable categories, of which 'Basic data' is mandatory: Basic data (categories, customer groups, currencies, sales channels, number ranges); Products (products, properties, product options, product properties, translations, cross-selling, main variant relations); Customers & orders (customers, shipping methods, orders, order documents); Promotions (customers, promotions); SEO URLs (products, properties, product options, product properties, translations, cross-selling, main variant relations, SEO URLs); and Product reviews (products, properties, product options, product properties, translations, cross-selling, main variant relations, customers, reviews, media). Before the migration starts, certain things must be created in Shopware 6 and manually mapped: payment methods, the standard payment method, salutations, delivery times, and the standard delivery time \u2014 these mappings cannot be changed after the migration has been executed, even after a reset; remapping requires deleting and recreating the migration entirely. Several things are documented as NOT transferred automatically and must be reconfigured by hand after migration: shipping and payment methods themselves are not carried over because Shopware 6 uses the Rule Builder for shipping-cost rules and payment risk management, so they must be recreated under Settings > Commerce > Shipping / Payment methods; document templates were redesigned and must be reconfigured under Settings > Commerce > Documents; email templates use Twig and cannot reuse Shopware 5 templates, so they must be set up under Settings > Content > Email templates; Shopware 5 shopping worlds/shop pages become Shopping Experiences and must be recreated under Content > Shopping Experiences; storefront templates cannot be reused due to the redesigned architecture; and the B2B Suite cannot be transferred at all. Also note: Shopware 6 already creates two default sales channels on install, so migrated shops/subshops arrive as additional sales channels and domain settings must be adjusted to see the migrated data in the frontend; countries must be re-checked under Settings > Localisation > Countries; and connection names must not contain hyphens, since Shopware 5 free-text fields are migrated as custom fields named after the connection, and a hyphen breaks their storefront display. A database column-type change (mediumtext to varchar(255)) also causes s_articledescriptions_categories.metadescription and metakeywords to be truncated to 255 characters during migration.", "citations": ["platform/func/migration-en/what-is-migrated.md:1-64", "platform/func/migration-en/Migrationprocess.md:1-41"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "migration assistant", "path": "platform/func", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/migration-en/what-is-migrated.md"}}, {"tool": "read_doc", "args": {"path": "platform/func/migration-en/Migrationprocess.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-18": {"query": "My plugin's cart processor adds a surcharge line item, but it is added again on every recalculation and its price is stale after the customer changes the quantity \u2014 how do I split the work between the collector and the processor?", "category": "dev", "option": "mcp-wiki", "answer": "The collector and processor have distinct, non-overlapping jobs, and both run on every cart recalculation, which is the root of both symptoms. A collector implements `Shopware\\Core\\Checkout\\Cart\\CartDataCollectorInterface::collect(CartDataCollection $data, Cart $original, SalesChannelContext $context, CartBehavior $behavior)` and is where you fetch or (re)calculate the data the surcharge depends on \u2014 e.g. the current quantity-derived amount \u2014 storing it with `$data->set('uniqueKey', $newData)`; never query data (database/API) inside `process`, since it may run repeatedly and is the wrong layer for that cost. A processor implements `Shopware\\Core\\Checkout\\Cart\\CartProcessorInterface::process(CartDataCollection $data, Cart $original, Cart $toCalculate, SalesChannelContext $context, CartBehavior $behavior)`, and every mutation must happen on `$toCalculate` (never `$original`), since `$toCalculate` is the cart instance actually used going forward. The related 'Add Cart Discounts' guide shows the same split for a discount line item: the processor builds a fresh price definition (e.g. `PercentagePriceDefinition`) from the collected data and calls a calculator (there `PercentagePriceCalculator`; for a plain surcharge the equivalent is `QuantityPriceCalculator`/`QuantityPriceDefinition` as shown in the price-overwrite guide) every time `process` runs, so the price is recalculated fresh against the current quantity/cart state on every pass rather than reused stale. For the duplicate-line-item symptom specifically: since `process` runs on every recalculation, the processor must check whether a line item with your surcharge's unique ID already exists in `$toCalculate` before adding it, and either update that existing item's price/definition in place or remove-and-re-add it, rather than unconditionally calling `$toCalculate->add(...)` each time \u2014 the retrieved guides do not spell this idempotency check out explicitly for a surcharge, so this closing sentence is stated from general Shopware cart-processor practice. [from memory]", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md:1-44", "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-discounts.md:1-54", "platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md:1-48"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-processor-collector.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-discounts.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-items.md"}}], "notFoundClaim": false, "memoryClaims": ["For the duplicate-line-item symptom specifically: since `process` runs on every recalculation, the processor must check whether a line item with your surcharge's unique ID already exists in `$toCalculate` before adding it, and either update that existing item's price/definition in place or remove-and-re-add it, rather than unconditionally calling `$toCalculate->add(...)` each time \u2014 the retrieved guides do not spell this idempotency check out explicitly for a surcharge, so this closing sentence is stated from general Shopware cart-processor practice."], "sourceVerdict": "partial"}, "dev-48": {"query": "After upgrading, my storefront JavaScript plugin no longer loads \u2014 how do I register it asynchronously with `PluginManager` and where does the compiled file have to be shipped?", "category": "dev", "option": "mcp-wiki", "answer": "A Storefront JavaScript plugin is a vanilla ES6 class extending the base `PluginBaseClass` (`window.PluginBaseClass`), placed at `<plugin root>/src/Resources/app/storefront/src/<plugin-dir>/example-plugin.plugin.js`; its `init()` method runs on `DOMContentLoaded`. Registration happens in `main.js` (auto-loaded from `<plugin root>/src/Resources/app/storefront/src`) via `window.PluginManager`. A normal (synchronous) registration is `PluginManager.register('ExamplePlugin', ExamplePlugin, '[data-example-plugin]')`, but synchronously imported plugins are always bundled into `storefront.js` on every page. To register it asynchronously instead, pass a dynamic import in place of the plugin class: `PluginManager.register('ExamplePlugin', () => import('./example-plugin/example-plugin.plugin'), '[data-example-plugin]')`. An async plugin registered this way is excluded from the main `storefront.js` bundle and is downloaded on demand only when its DOM selector (e.g. `[data-example-plugin]`) is present on the page \u2014 so if that selector is missing or wrong after an upgrade, the plugin simply never loads. After building, the compiled output must be shipped at `<plugin root>/src/Resources/app/storefront/dist/storefront/js/<plugin-name>/<plugin-name>.js`. Rebuild it with `shopware-cli project storefront-build` (template setups) or `composer run build:js:storefront` (platform contribution setups). Source: https://developer.shopware.com/docs/guides/plugins/plugins/storefront/javascript/add-custom-javascript.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md:1-80"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "PluginManager.register", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "storefront javascript plugin", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-58": {"query": "My shopware.yaml still uses redis_url \u2014 how do I define the named Redis connections in Shopware 6.7 and which eviction policy does each one need?", "category": "dev", "option": "mcp-wiki", "answer": "Since v6.6.8.0, Redis connections are configured as named connections under `shopware.redis.connections` in shopware.yaml, e.g.: `shopware: redis: connections: ephemeral: { dsn: 'redis://host1:port/dbindex' } persistent: { dsn: 'redis://host2:port/dbindex' }`. DSNs can use env vars, e.g. `dsn: '%env(REDIS_EPHEMERAL)%/1'`, and connection pooling can be enabled with the `persistent=1` DSN flag (e.g. `redis://host:port/dbindex?persistent=1`). Shopware categorizes Redis data into three types, each needing a separate connection/instance because current Redis versions cannot apply different eviction policies to different databases within the same instance: 1) Ephemeral data (HTTP cache, object cache) \u2014 eviction policy `volatile-lru`, no persistence needed; 2) Durable but aging data (sessions) \u2014 eviction policy `allkeys-lru`, persisted via RDB/AOF; 3) Durable and critical data (cart, number range, lock store, increment) \u2014 eviction policy `volatile-lru`. Gotcha: a cache Redis hitting its memory limit is normal for `volatile-lru`, but it can only evict keys that have a TTL \u2014 Symfony's tag-aware cache adapter stores tag-index sets without a TTL, which accumulate as orphaned entries and can starve eviction if never pruned. Source: https://developer.shopware.com/docs/guides/hosting/infrastructure/redis.html", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/redis.md:1-71"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "redis_url|eviction", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/infrastructure/redis.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-41": {"query": "`composer update` to Shopware 6.7 aborts on a platform requirement and my admin build then fails too \u2014 which PHP, database and Node versions does 6.7 actually require, and how do I check the machine I am on against them before I retry?", "category": "dev", "option": "mcp-wiki", "answer": "Shopware 6.7's recommended stack (minimum \u2192 recommended) is: PHP 8.2+ (recommended 8.4) with memory_limit >= 512M, max_execution_time >= 30s, and required extensions ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, openssl, pcre, pdo_mysql, phar, simplexml, xml, xmlreader, zip, zlib (amqp optional), plus Composer 2.2+ recommended. Database: MariaDB >= 10.11.6 or MySQL >= 8.0.22 (Innovation releases unsupported), recommended MariaDB 11.4 / MySQL 8.4, with max_allowed_packet >= 32M. Node.js/npm: Node 20.0.0+ minimum, recommended Node 24 / npm 10 (this is what the admin build needs, so an outdated Node is the likely cause of the admin build failure). To check your machine against these before retrying `composer update`, run: `php -v`, `php -m` (to confirm the required extensions are present), `php -i | grep memory_limit`, `composer -V`, `node -v`, and `npm -v`. Note that multiple PHP versions may be installed on one system, and CLI vs FPM often use different php.ini files, so make sure the binary/ini you check is the one actually used. Source: https://developer.shopware.com/docs/guides/hosting/", "citations": ["platform/dev/6.7/guides/hosting/_index.md:1-40"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "requirement", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "PHP version", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/installation/system-requirements.md"}}, {"tool": "grep_docs", "args": {"pattern": "PHP 8", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "shopware-cli", "path": "platform/dev/6.7", "glob": "**/upgrades-migrations/**", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/hosting"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/installation"}}, {"tool": "grep_docs", "args": {"pattern": "Node.js", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/_index.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-59": {"query": "After upgrading to Shopware 6.7 my Varnish cache is never invalidated \u2014 what changed in the reverse proxy configuration?", "category": "dev", "option": "mcp-wiki", "answer": "Two things likely broke your invalidation. First, the config key changed from `storefront.reverse_proxy` (up to 6.5.x) to `shopware.http_cache.reverse_proxy` (from 6.6.0.0) \u2014 an old key will silently be ignored, requiring a config update on upgrade. Second, and more significant for 6.7 specifically: the Varnish-with-Redis/LUA-based BAN approach is deprecated from v6.6.x and fully removed in v6.7.0, in favor of `XKey`-based invalidation. The correct 6.7 configuration in `config/packages/storefront.yaml` (with `SHOPWARE_HTTP_CACHE_ENABLED=1` in `.env`) is: `shopware: http_cache: reverse_proxy: { enabled: true, ban_method: \"BAN\", hosts: [\"http://varnish\"], max_parallel_invalidations: 3, use_varnish_xkey: true }`. Also set `SYMFONY_TRUSTED_PROXIES` (e.g. `127.0.0.1,10.0.0.0/8` or `REMOTE_ADDR`) so Symfony reads the real client IP \u2014 since Shopware 6.6, plain `TRUSTED_PROXIES` is no longer read automatically. For soft purge (serve stale while refreshing) instead of hard purge, change the Varnish VCL from `xkey.purge(req.http.xkey)` to `xkey.softpurge(req.http.xkey)`. Relevant cache-clear commands: `bin/console cache:clear` (before 6.7 also cleared the HTTP cache), `bin/console cache:clear:all` (clears everything including HTTP cache, since 6.6.8), `bin/console cache:clear:http` (clears only the reverse proxy cache, since 6.6.10), `bin/console cache:pool:clear --all` (object cache only). Shopware also provides a Varnish Docker image at `github.com/shopware/varnish-shopware` implementing the XKey approach. Source: https://developer.shopware.com/docs/guides/hosting/infrastructure/reverse-http-cache.html", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/reverse-http-cache.md:1-88"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "varnish|reverse proxy", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/infrastructure/reverse-http-cache.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-42": {"query": "How do I check extension compatibility before upgrading with shopware-cli, and why does it report my plugins in custom/plugins as blocking?", "category": "dev", "option": "mcp-wiki", "answer": "Use `shopware-cli project upgrade` (or its non-interactive/dry-run form `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run`) which runs a six-phase, local-first wizard: it checks readiness, analyzes Composer-managed extensions, verifies the target dependency set with Composer, lets you review the plan, applies the upgrade locally, and writes a shareable report to `.shopware-cli/upgrade/report.md`. You can also run `shopware-cli project validate --only phpstan` to detect breaking changes in custom code ahead of an upgrade. The wizard's prerequisites include that `composer.lock` contains an installed `shopware/core` version, the Git working tree is clean, and \u2014 critically \u2014 that all extensions are Composer-managed. Plugins sitting only in `custom/plugins` without being pulled in via Composer are not Composer-managed, so the wizard flags/blocks on them. The fix is to migrate locally managed extensions first with `shopware-cli project autofix composer-plugins` before rerunning the upgrade. Note the wizard does not rewrite incompatible custom extension code itself \u2014 it only surfaces compatibility and Composer-resolution issues before files change. Source: https://developer.shopware.com/docs/products/tools/cli/project-commands/upgrade.html", "citations": ["platform/dev/6.7/products/tools/cli/project-commands/upgrade.md:1-69"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/products/tools/cli/validation.md"}}, {"tool": "grep_docs", "args": {"pattern": "extension compatib", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/products/tools/cli/project-commands/upgrade.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-67": {"query": "What does a minimal app folder and `manifest.xml` need to contain, and which console commands install and activate the app on my local Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "Choose a technical name in UpperCamelCase (e.g. `MyExampleApp`) and create the app folder `custom/apps/MyExampleApp/manifest.xml`. The `manifest.xml` needs a `<meta>` block with `name`, `label`, `description`, `author`, `copyright`, `version`, `icon`, and `license` \u2014 the folder name must match `<meta><name>`, and `<author>`/`<copyright>` are required or `bin/console app:refresh` will fail.\n\nCommands:\n1. `bin/console app:refresh` \u2014 refreshes the app registry so Shopware picks up the new app.\n2. `bin/console app:install --activate MyExampleApp` \u2014 installs and activates it in one step (use the technical name, not a filesystem path). Without `--activate`, activate later via Extensions \u2192 My Extensions \u2192 Apps in the Administration, or `bin/console app:activate MyExampleApp`.\n3. `bin/console app:list` \u2014 inspect installed apps.\n4. `bin/console cache:clear` (or `cache:clear:http`/`cache:clear:all`) after activating.\n5. Apps are validated on install; pass `--no-validate` to `app:install` to skip validation while debugging, or run `bin/console app:validate` to find configuration issues directly.\n\nRun the install/refresh commands from inside the PHP container at the project root.", "citations": ["platform/dev/6.7/guides/plugins/apps/app-base-guide.md:1-42"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/hubs/apps.md"}}, {"tool": "grep_docs", "args": {"pattern": "app-base-guide|App Base Guide", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/_index.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/app-base-guide.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-11": {"query": "How do I create an integration for Admin API access in the administration and give it the right privileges?", "category": "func", "option": "mcp-wiki", "answer": "Go to Settings > System > Integrations and use 'Create integration': give it a name, then either grant it Administrator permissions or assign an existing role instead. On save, Shopware issues an access ID and a security key \u2014 the security key is shown only at creation time, so it must be saved immediately since it cannot be retrieved again afterward. The overview lists integrations with name and permissions; you can edit/delete via the context menu, and 'Regenerate API access key' rotates both the security key and the access ID (invalidating the old credentials). To give the integration the right privileges (rather than full Administrator access), create a role first under Settings > System > Users & Permissions ('New role'): name and describe it, then assign Authorisations per area (e.g. Catalogues) using the rights View, Edit, Create, Delete, or All. Permissions build left to right (Edit implies View; Create implies Edit and View), except Delete, which only implicitly grants View. There are also Additional permissions not tied to one area (Basic configurations, Run Updates, Maintain extensions, Upload extensions, Logging, Clear cache, Import/Export, Shopware Store, Update own profile, Create discounts, Apps), and Detailed permissions that expose every technical permission with read/write/create/delete rights for extensions that don't declare privileges properly. Assign that role to the integration instead of the Administrator flag to scope its API access.", "citations": ["platform/func/settings/system/integrationen.md:1-44", "platform/func/settings/system/user.md:1-75"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "integration", "path": "platform/func", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/system/integrationen.md"}}, {"tool": "grep_docs", "args": {"pattern": "role", "path": "platform/func/settings/system/user.md"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/system/user.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-03": {"query": "Where do the `#[ORM\\Entity]` mapping attributes for my plugin's entity go in Shopware 6, and how do I get Doctrine's `EntityManager` injected into my service so I can persist it?", "category": "edge", "option": "mcp-wiki", "answer": "This premise does not match Shopware 6: greps for 'EntityManager' and for 'ORM\\Entity' across the whole platform layer (all dev versions, functional docs, hubs) returned zero matches. Shopware 6 does not use Doctrine ORM entities/attributes or an injected `EntityManager` for plugin persistence; instead it uses its own Data Abstraction Layer (DAL). To persist a plugin's own data model you create the database table via a plugin migration, then write an `EntityDefinition` class implementing `getEntityName()` (which doubles as the table name and the `<name>.repository` DI service id) and `defineFields()` (declaring fields like `IdField`, `StringField`, `BoolField` with flags such as `Required()`/`PrimaryKey()`). This definition is registered in the DI container with the `shopware.entity.definition` tag and an `entity` attribute matching the entity name. You can additionally add a custom `Entity` class (extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity`, using `EntityIdTrait`) and a custom `EntityCollection`, wired via `getEntityClass()`/`getCollectionClass()` \u2014 without them generic `ArrayEntity`/`EntityCollection` are used. The entity is then read and written through the auto-generated `<entity-name>.repository` service (dependency-injected), not through a Doctrine `EntityManager`. Entity class properties must be at least `protected` (never `readonly`) or the DAL cannot set values.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md:1-71"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "EntityManager", "path": "platform", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "ORM\\\\Entity", "path": "platform", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "EntityDefinition", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "partial"}, "dev-05": {"query": "How does theme inheritance work in Shopware \u2014 theme.json and SCSS overrides?", "category": "dev", "option": "mcp-wiki", "answer": "Theme inheritance lets a new theme extend an existing, installed theme, reusing its templates, styles, scripts, assets, and config while adding its own changes \u2014 useful for a variant of an already-used theme (dark mode, per-sales-channel differences, customizing a store-bought theme) without duplicating or modifying the original theme's code. It is configured entirely in `theme.json` (in `<plugin root>/src/Resources` of the extending theme) by inserting the base theme's technical name into each relevant section before the extending theme's own alias: `views` (rendering order: Storefront base -> plugin extensions -> base theme -> current theme), `style`, `script` (same layered order: Storefront JS, then base theme JS, then current theme JS), `asset` (add the base theme name explicitly to reuse its assets), and `configInheritance` (the last listed theme that differs from the current one becomes the parent for config values; the `Storefront` theme's config is always inherited even without an explicit `configInheritance` entry). Example: `{\"name\": \"SwagBasicExampleThemeExtend\", \"views\": [\"@Storefront\", \"@Plugins\", \"@SwagBasicExampleTheme\", \"@SwagBasicExampleThemeExtend\"], \"style\": [\"app/storefront/src/scss/overrides.scss\", \"@SwagBasicExampleTheme\", \"app/storefront/src/scss/base.scss\"], \"script\": [...], \"asset\": [...], \"configInheritance\": [\"@Storefront\", \"@SwagBasicExampleTheme\"]}`. For SCSS overrides specifically: the Storefront theme is a skin on top of Bootstrap 4, whose variables use the `!default` flag, so overrides must be declared before Bootstrap's own SCSS loads. `theme.json`'s `style` array already places an `overrides.scss` entry point before `@Storefront`, e.g. `[\"app/storefront/src/scss/overrides.scss\", \"@Storefront\", \"app/storefront/src/scss/base.scss\"]`; in `<plugin root>/src/Resources/app/storefront/src/scss/overrides.scss` you set variables like `$border-radius: 0;`, then run `bin/console theme:compile` to see the effect. Only variable overrides belong in `overrides.scss` \u2014 plain CSS selector/property rules should not go there, and when a webpack watch process injects SCSS variables dynamically, code in `overrides.scss` can end up duplicated in the built CSS. Sources: https://developer.shopware.com/docs/guides/plugins/themes/inheritance/add-theme-inheritance.html and https://developer.shopware.com/docs/guides/plugins/themes/styling/override-bootstrap-variables-in-a-theme.html", "citations": ["platform/dev/6.7/guides/plugins/themes/inheritance/add-theme-inheritance.md:1-53", "platform/dev/6.7/guides/plugins/themes/styling/override-bootstrap-variables-in-a-theme.md:1-58"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "theme.json", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/themes/inheritance/add-theme-inheritance.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/themes/theme-base-guide.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/themes/styling/override-bootstrap-variables-in-a-theme.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-35": {"query": "How do I load entities from the Admin API inside an Administration component using the repository factory and a Criteria?", "category": "dev", "option": "mcp-wiki", "answer": "Inject the repository factory service into your component with `inject: ['repositoryFactory']`. Create a repository for the entity you need, e.g. `this.repositoryFactory.create('product')` (an optional third parameter accepts `{ version: 1 }`). Build a `Criteria` instance to filter, sort, and paginate: `criteria.setPage(1); criteria.setLimit(10); criteria.setTerm('foo'); criteria.setTotalCountMode(2); criteria.addFilter(Criteria.equals('product.active', true)); criteria.addSorting(Criteria.sort('product.name', 'DESC')); criteria.addAggregation(Criteria.avg('average_price', 'product.price'));` \u2014 `setTotalCountMode` accepts `0` (no total count, fastest), `1` (exact total count), or `2` (`limit * 5 + 1`, fast, useful for 'next page exists' checks). Then search with `productRepository.search(criteria, Shopware.Context.api)`, or fetch a single record with `productRepository.get(entityId, Shopware.Context.api)`. To load associations, add them to the criteria with `criteria.addAssociation('manufacturer')`. Relevant classes involved are `Repository`, `Entity`, `EntityCollection`, `SearchResult`, `RepositoryFactory`, `Context`, and `Criteria`. Note that entities are stateless \u2014 after any save, related data must be re-fetched from the server if it's needed again. Source: https://developer.shopware.com/docs/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md:1-59"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "repositoryFactory", "path": "platform/dev/6.7/guides/plugins/plugins/administration", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-05": {"query": "My plugin decorates `CachedProductRoute` to add cache tags \u2014 where did the `Cached*Route` classes go in Shopware 6.7 and how do I cache a Store API route now?", "category": "gap", "option": "mcp-wiki", "answer": "The wiki does not document a removal of `Cached*Route` classes as a 6.7 breaking change, and one page (`extendability.md`, a mirror of the core coding guidelines) still lists the Decoration pattern with an `AbstractCategoryRoute` / `CategoryRoute` / `CachedCategoryRoute` triad as the general example of how Store API route caching is structured \u2014 so I cannot confirm from this corpus that `Cached*Route` classes were literally removed in 6.7. What the corpus does document as the current (6.7) caching mechanism, however, is tag-based: caching is driven by `CacheTagCollector` and `CacheInvalidator` rather than by writing your own cache-decorator class \u2014 you add a tag with `$this->cacheTagCollector->addTag('my-custom-entity-' . $id)` and later invalidate it with `$this->cacheInvalidator->invalidate(['my-custom-entity-' . $id])` (pass `true` as a second argument, or send header `sw-force-cache-invalidate: 1`, to force immediate rather than delayed/batched invalidation). For the HTTP cache specifically, the wiki explains that a Storefront controller's cache invalidation 'follows Store API route cache invalidation: all data loaded by a controller comes from Store API routes, so the HTTP cache entry's tags are the sum of the Store API tags generated or loaded during the request' \u2014 meaning a route/controller that loads data exclusively through Store API routes needs no additional invalidation logic of its own; you mark a route cacheable via the `_httpCache: true` route default rather than by decorating a `Cached*Route` class. I found no page explicitly discussing migrating away from decorating `CachedProductRoute`, so the specific 'where did it go' claim is not confirmed by this source.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/caching/_index.md:1-79", "platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-caching-to-custom-controller.md:1-47", "platform/dev/6.7/guides/development/extensions/architecture/extendability.md:1-52"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "Cached.*Route", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "cache tag", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/caching/_index.md"}}, {"tool": "grep_docs", "args": {"pattern": "CachedProductRoute|Cached.*Route", "path": "platform/dev/6.7", "regex": true}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-caching-to-custom-controller.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/extensions/architecture/extendability.md"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "partial"}, "dev-14": {"query": "I wrote a subscriber class in my plugin but it never fires \u2014 which interface and which service tag (`shopware.event_subscriber`?) register it?", "category": "dev", "option": "mcp-wiki", "answer": "The class must implement Symfony's `EventSubscriberInterface` (`Symfony\\Component\\EventDispatcher\\EventSubscriberInterface`) and return the events it listens to from its static `getSubscribedEvents()` method, e.g. `ProductEvents::PRODUCT_LOADED_EVENT => 'onProductsLoaded'`. The tag is not `shopware.event_subscriber` \u2014 it is the Symfony core tag `kernel.event_subscriber`, and it must be applied explicitly in the plugin's `src/Resources/config/services.php`: `$services->set(MySubscriber::class)->tag('kernel.event_subscriber');`. Creating the subscriber class alone is not enough: if it is missing from `services.php` (or not tagged), Shopware never calls it, and there is typically no obvious error indicating the event went unhandled \u2014 that omission is the most likely reason a subscriber \"never fires\". For versioned entities (orders, products), also check `$event->getContext()->getVersionId() !== Defaults::LIVE_VERSION` if the handler should only react to the live version.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/event/listening-to-events.md:1-63"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "EventSubscriberInterface", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/event/listening-to-events.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-47": {"query": "My payment plugin implements `AsynchronousPaymentHandlerInterface` and is tagged `shopware.payment.method.async` \u2014 how do I write a payment handler for Shopware 6.7 instead?", "category": "dev", "option": "mcp-wiki", "answer": "From Shopware 6.7.0.0 onward, all payment handling goes through a single class, `Shopware\\Core\\Checkout\\Payment\\Cart\\PaymentHandler\\AbstractPaymentHandler`, instead of the multiple pre-6.7 interfaces. Before 6.7, handlers implemented separate interfaces \u2014 `SynchronousPaymentHandlerInterface` (`pay`), `AsynchronousPaymentHandlerInterface` (`finalize`), `PreparedPaymentHandlerInterface` (`validate` and, previously, `capture`), `RecurringPaymentHandlerInterface` (`recurring`), and `RefundPaymentHandlerInterface` (`refund`) \u2014 each registered with its own tag (`shopware.payment.method.sync`, `.async`, `.prepared`, `.recurring`, `.refund`). To migrate: 1) create a class extending `AbstractPaymentHandler` and implement `supports(PaymentHandlerType $type, string $paymentMethodId, Context $context): bool` plus the relevant method(s): `pay(Request, PaymentTransactionStruct, Context, ?Struct): ?RedirectResponse` (always called during checkout \u2014 return `null` for synchronous flows or a `RedirectResponse` to trigger `finalize` afterward), `finalize(Request, PaymentTransactionStruct, Context): void` (called after redirect back from an external provider \u2014 this replaces your existing `finalize` implementation), `validate(...)`, `refund(...)`, `recurring(...)` as needed. 2) Register the handler with the single tag `shopware.payment.method` (replacing `shopware.payment.method.async`):\n\n```php\n$services->set(MyCustomPaymentHandler::class)\n    ->tag('shopware.payment.method');\n```\n\n3) Use `OrderTransactionStateHandler` to update transaction state and throw `PaymentException` (e.g. `::asyncProcessInterrupted`, `::customerCanceled`) to fail the transaction. 4) Register the payment method itself via `payment_method.repository` in the plugin lifecycle, and from 6.7 onward you must also supply a unique `technicalName` (e.g. `swag_example-example_payment`) \u2014 omitting it can prevent installation/activation. Never remove the payment method on `uninstall`, only set it inactive, since orders may still reference it. Source: https://developer.shopware.com/docs/guides/plugins/plugins/checkout/payment/add-payment-plugin.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:1-72"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "AsynchronousPaymentHandlerInterface", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/payment"}}, {"tool": "grep_docs", "args": {"pattern": "PaymentHandlerInterface", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-24": {"query": "How do I get readable SEO URLs generated for the detail pages of my plugin's own entity?", "category": "dev", "option": "mcp-wiki", "answer": "For a custom DAL entity's detail pages, use dynamic SEO URLs generated automatically when entities are written or deleted. Implement Shopware\\Core\\Content\\Seo\\SeoUrlRoute\\SeoUrlRouteInterface with three methods: getConfig() (returns a SeoUrlRouteConfig with the entity definition, route name and template), prepareCriteria() (narrow/extend the fetch criteria) and getMapping() (returns a SeoUrlMapping with the template variables) \u2014 note getMapping() must verify the entity type it receives since the interface can be invoked for entities other than your own. Register the class with the container tag shopware.seo_url.route. Add a seo_url_template table entry via a migration, setting route_name, entity_name, and template. Then subscribe to the entity's written DAL event and call Shopware\\Core\\Content\\Seo\\SeoUrlUpdater::update($routeName, $ids), and do the same on the .deleted event so URLs are kept in sync. (For a fixed/rarely-changing route instead, you can seed a static SEO URL via a plugin migration inserting a seo_url row per sales channel/language using ImportTranslationsTrait::importTranslation(), with key columns route_name, path_info, seo_path_info, is_canonical, is_modified, is_deleted.) Note: a German SEO URL is only reachable if a German domain is configured on the respective sales channel, and marking a seo_url entry deleted only sets is_deleted = 1 without removing the route, so the controller must still check whether the underlying content exists.", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/seo/add-custom-seo-url.md:1-72"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "seo url", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/content/seo/add-custom-seo-url.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-06": {"query": "How do I create a shipping method from my plugin's installer or migration, including the `technicalName` that 6.7 requires?", "category": "gap", "option": "mcp-wiki", "answer": "The wiki has no dedicated guide for creating a shipping method via PHP from a plugin's `install()`/migration (only an app-manifest-based way to declare shipping methods, and a PHP-based guide for the analogous payment-method case). It does confirm the `technicalName` requirement: the plugin scaffolding guide's gotchas state 'Shopware 6.7 also introduced a related `technicalName` requirement for payment and shipping methods,' alongside the general rule that a plugin's technical name must stay stable and consistent across directory, namespace, base class and configuration. The documented pattern for the equivalent case (payment methods) is to write to the entity's repository during the plugin lifecycle (`install`/`activate`/`deactivate`), e.g. for payment: `$paymentMethodRepository->upsert([['handlerIdentifier' => ..., 'name' => ..., 'pluginId' => $pluginId, 'technicalName' => 'swag_example-example_payment', ...]], $context)`, with the guide warning that `technicalName` is required from 6.7 onward, must be unique with a plugin-specific prefix, and an omitted value can prevent the plugin from installing/activating; also, never delete the record on `uninstall`, only deactivate it (existing orders may reference it) [from memory: applying the same repository-upsert-in-install()-with-a-unique-prefixed-technicalName pattern to `shipping_method.repository`, since the wiki does not show the exact shipping-method code, only that the same technicalName requirement was introduced for shipping methods in 6.7]. For an app (no plugin) you can instead declare shipping methods declaratively in `manifest.xml` under `<shipping-methods><shipping-method>` with a required, permanently-stable `<identifier>` and a `<delivery-time>` block, but that identifier is not the same thing as the PHP entity's `technicalName` field.", "citations": ["platform/dev/6.7/guides/plugins/plugins/creating-plugins.md:70-89", "platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:1-72", "platform/dev/6.7/guides/plugins/apps/checkout/shipping-methods.md:1-51"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "shipping method", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "technicalName", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout", "depth": 2}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"}}, {"tool": "grep_docs", "args": {"pattern": "shipping_method.repository|shipping method", "path": "platform/dev/6.7/guides/plugins/plugins/creating-plugins.md", "regex": true}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/checkout/shipping-methods.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/creating-plugins.md", "offset": 70, "limit": 30}}], "notFoundClaim": false, "memoryClaims": ["[from memory: applying the same repository-upsert-in-install()-with-a-unique-prefixed-technicalName pattern to `shipping_method.repository`, since the wiki does not show the exact shipping-method code, only that the same technicalName requirement was introduced for shipping methods in 6.7]"], "sourceVerdict": "partial"}, "edge-07": {"query": "How do I set up Shopware PWA as the storefront for a Shopware 6.7 shop?", "category": "edge", "option": "mcp-wiki", "answer": "The wiki has no setup guide for Shopware PWA, and only documents it under 6.6, not 6.7 \u2014 a grep for 'Shopware PWA' across the whole platform layer returned hits only in `platform/dev/6.6/products/pwa.md` (plus a passing mention in a 6.6 CMS page and the Store API hub), nothing under `platform/dev/6.7`. The 6.6 page describes what Shopware PWA is (a Vue.js Single Page Application providing a decoupled storefront, built on the Store API) but its only 'Gotchas' note is that Shopware PWA is currently in maintenance mode, with Composable Frontends recommended as the future direction for headless commerce with Shopware \u2014 so the corpus does not offer a set-up procedure, and for a 6.7 shop the documented recommendation is to use Composable Frontends instead of Shopware PWA.", "citations": ["platform/dev/6.6/products/pwa.md:1-25"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "Shopware PWA", "path": "platform", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.6/products/pwa.md"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "partial"}, "dev-17": {"query": "How do I overwrite the price of a product line item in the cart at runtime from a plugin?", "category": "dev", "option": "mcp-wiki", "answer": "Use one class that acts as both a cart collector and a cart processor (this technique is only for changing a line item's own price, e.g. a live-shopping plugin \u2014 not for discounts/surcharges, which should be separate line items instead). In `Shopware\\Core\\Checkout\\Cart\\CartDataCollectorInterface::collect`, fetch product IDs from the cart (`$original->getLineItems()->filterType(LineItem::PRODUCT_LINE_ITEM_TYPE)->getReferenceIds()`), skip already-fetched IDs, and store each new price in the `CartDataCollection` under a prefixed key (e.g. `'price-overwrite-'.$id`) to avoid duplicate lookups and key collisions. Then in `Shopware\\Core\\Checkout\\Cart\\CartProcessorInterface::process` on the same class, for each product line item in `$toCalculate`, read the stored price from `CartDataCollection`, build a `Shopware\\Core\\Checkout\\Cart\\Price\\Struct\\QuantityPriceDefinition` from the new price plus the item's existing tax rules and quantity, calculate it with an injected `Shopware\\Core\\Checkout\\Cart\\Price\\QuantityPriceCalculator`, then call `$product->setPrice($calculated)` and `$product->setPriceDefinition($definition)`. Register the combined class under both service tags (ordered after the product collector/processor with a lower priority number running later): `$services->set(OverwritePriceCollector::class)->args([service(QuantityPriceCalculator::class)])->tag('shopware.cart.processor', ['priority' => 4500])->tag('shopware.cart.collector', ['priority' => 4500]);`. Always compute prices in the collector, not the processor (querying data such as the database inside `process` is discouraged since it may run repeatedly), and always mutate `$toCalculate` in `process`, not `$original`, since `$toCalculate` is the instance actually used.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md:1-48"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "line item price", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "cart processor", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-08": {"query": "Which service do I type-hint to read products \u2014 `EntityRepositoryInterface` \u2014 and how do I inject it into my plugin service?", "category": "edge", "option": "mcp-wiki", "answer": "The wiki does not use `EntityRepositoryInterface` anywhere \u2014 that interface does not appear in the Shopware 6.7 developer docs. For reading products you type-hint the concrete `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository` class (in older Shopware versions this was `EntityRepositoryInterface`, but current docs and guides only reference `EntityRepository`) [from memory]. To inject it into your plugin service: register the product repository in the DI container by its service id `product.repository` (entities are always registered as `<entity_name>.repository`), and reference it in your `services.php` via the Symfony `service()` helper, e.g. `service('product.repository')` as a constructor argument, or simply type-hint it and rely on `autowire`/`autoconfigure` if the service id can be autowired by class/alias. Once injected as `private EntityRepository $productRepository`, call `$this->productRepository->search(new Criteria(), $context)` to read products, which returns an `EntitySearchResult`. More generally, any service dependency (e.g. `SystemConfigService`) is added as a typed constructor property; if `autowire`/`autoconfigure` are enabled nothing else is needed, otherwise declare it explicitly in `services.php` with `$services->set(ExampleService::class)->args([service(SystemConfigService::class)]);`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md:1-55", "platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md:1-57"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "EntityRepository", "path": "platform/dev/6.7", "glob": "**/*repository*", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "product.repository", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md"}}, {"tool": "grep_docs", "args": {"pattern": "EntityRepository", "path": "platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md"}}, {"tool": "grep_docs", "args": {"pattern": "EntityRepositoryInterface", "path": "platform/dev/6.7"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md"}}], "notFoundClaim": false, "memoryClaims": ["The wiki does not use `EntityRepositoryInterface` anywhere \u2014 that interface does not appear in the Shopware 6.7 developer docs. For reading products you type-hint the concrete `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository` class (in older Shopware versions this was `EntityRepositoryInterface`, but current docs and guides only reference `EntityRepository`) [from memory]."], "sourceVerdict": "partial"}, "dev-33": {"query": "How do I register a custom Administration module from my plugin, and what has to line up for it to actually show up after a build?", "category": "dev", "option": "mcp-wiki", "answer": "Create the module's index.js at `<plugin root>/src/Resources/app/administration/src/module/<module-name>/index.js` and import it from `main.js` (e.g. `import './module/swag-example';`) \u2014 this entry-point import is required, since Shopware 6 does not auto-discover module folders. In the module's index.js register it via `Shopware.Module.register('swag-example', { type: 'plugin', name: 'Example', title: '...', description: '...', color: '#ff3d58', icon: 'regular-shopping-bag', ... })`, configuring a unique `name`, `title`, `description`, `color`, `icon`, and `type` (`plugin` for third-party modules; `type` is a naming convention, not enforced). Add `routes` and a menu entry (`navigation`) so the module is reachable, and add translation `snippets` per locale (e.g. de-DE.json/en-GB.json under a snippet/ directory), keyed under the module name, matching the snippet keys referenced in `title`/`description`. Optionally expose it under Settings via the `settingsItem` array (`group`, `icon`, `to` route name). Finally, build the Administration JS with `shopware-cli project admin-build` (or `composer run build:js:admin` for platform contributions) and ensure the built file ships with the plugin, and that the plugin is activated \u2014 the build only compiles assets, so the module still depends on the entry-point import, registration, routes/components and snippets all being wired up correctly for it to actually appear. Source: https://developer.shopware.com/docs/guides/plugins/plugins/administration/module-component-management/add-custom-module.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/add-custom-module.md:1-77"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "add-custom-module", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "register a module", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/add-custom-module.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-54": {"query": "How do I register a plugin cookie in the storefront cookie consent manager in Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "Register a listener for `Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent`, e.g. `$services->set(CookieListener::class)->tag('kernel.event_listener', ['event' => 'Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent']);`. In the listener's `__invoke(CookieGroupCollectEvent $event)`, fetch a group from `$event->cookieGroupCollection` (e.g. via `CookieProvider::SNIPPET_NAME_COOKIE_GROUP_COMFORT_FEATURES`), get or create its `CookieEntryCollection`, and add a `CookieEntry`: `$cookieEntry = new CookieEntry('my-cookie-key'); $cookieEntry->name = 'cookie.myCookieName'; $cookieEntry->value = '1'; $cookieEntry->expiration = 30; $entries->add($cookieEntry);`. Cookie groups must not carry the `cookie`, `value`, `expiration`, or `isRequired` parameters \u2014 those belong only on individual `CookieEntry` objects. Since Shopware 6.7.3.0, cookies use the structured `CookieEntry`/`CookieGroup` objects instead of the older array format; the deprecated `CookieProviderInterface` (array-based) still works for backward compatibility with 6.7.2 and earlier but should be replaced by `CookieGroupCollectEvent`. Since 6.7.3.0 cookie configurations also carry a hash stored client-side in the `cookie-config-hash` cookie keyed per language ID, and any configuration change triggers a re-consent prompt for the affected language. The relevant Store API endpoint is `/store-api/cookie/groups`. Source: https://developer.shopware.com/docs/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md:1-62"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "cookie", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-01": {"query": "How do I extend the product entity with a new association in Shopware's Data Abstraction Layer?", "category": "dev", "option": "mcp-wiki", "answer": "To add a new association to an existing entity like `product` without owning its definition, create a class extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityExtension` and implement `extendFields()` (add the association field, e.g. `$collection->add(new OneToOneAssociationField('exampleExtension', 'id', 'product_id', ExampleExtensionDefinition::class, true));`) and `getDefinitionClass()` (return `ProductDefinition::class`). Register the extension class with the `shopware.entity.extension` tag, and register the new target entity's definition (e.g. `ExampleExtensionDefinition`) with `shopware.entity.definition`. You then read/write the association through the extended entity's own repository, e.g. `$this->productRepository->upsert([['id' => '<product id>', 'exampleExtension' => ['customString' => 'foo bar']]], $context);`. If instead the extra data has no database table at all, subscribe to the entity's loaded event (`ProductEvents::PRODUCT_LOADED_EVENT` for products) and call `$productEntity->addExtension('custom_string', new ArrayEntity([...]))` \u2014 the value must be a `Struct`, not a scalar. Since Shopware 6.6.10.0 you can extend many entities at once via a `BulkEntityExtension` tagged `shopware.bulk.entity.extension`. Use an entity extension (rather than a custom field) whenever the new data needs associations to other entities or is more complex than a scalar admin-editable value. When defining the association itself between two entity definitions you use the standard DAL association field types: `OneToOneAssociationField` (with an `FkField` on the owning side), `OneToManyAssociationField`/`ManyToOneAssociationField` for one-to-many/many-to-one, and `ManyToManyAssociationField` plus a `MappingEntityDefinition` for many-to-many; `autoload` on these association fields defaults to `false` to avoid performance issues, and enabling `autoload` on both the `EntityExtension` and `EntityDefinition` side of the same association at once can cause recursion/out-of-memory errors.", "citations": ["platform/dev/6.6/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md:1-77", "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-associations.md:1-57"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "association", "path": "platform/dev/6.7", "glob": "**/*extend*", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7", "glob": "**/*association*"}}, {"tool": "grep_docs", "args": {"pattern": "OneToManyAssociationField", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/hubs/dal.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-associations.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.6/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-57": {"query": "B2B Suite support ends with 6.8 \u2014 how do I run the B2B Suite Migration to B2B Components and check that it finished?", "category": "dev", "option": "mcp-wiki", "answer": "Run the migration with `bin/console b2b:migrate:commercial` (migrates everything), or restrict it to specific components by naming them with the configurator's technical name, e.g. `bin/console b2b:migrate:commercial quote_management shopping_list`. `employee_management` is always migrated first regardless of argument order since it's a prerequisite for all other components; overall order otherwise follows configurator priority. Batch size can be tuned with `bin/console b2b:migrate:commercial --batch-size=100`. `b2b:migrate:commercial` queues work and returns before the migration actually finishes, so to check completion watch progress in a separate terminal with `bin/console b2b:migrate:progress --watch`, which shows columns Total, Valid, Newly, Migrated, Pending, Error and status values `Complete`, `Pending`, `In progress`, `Complete with error`, `Has new records`. Note: Budget Management leaves the Organization Unit empty on migrated budgets (requires B2B Commercial 7.6.0+). Source: https://developer.shopware.com/docs/products/extensions/b2b-suite-migration/execution/running-migration.html", "citations": ["platform/dev/6.7/products/extensions/b2b-suite-migration/execution/running-migration.md:1-53"], "toolCallLog": [{"tool": "list_docs", "args": {"path": "platform/dev/6.7/products/extensions/b2b-suite-migration", "depth": 3}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/products/extensions/b2b-suite-migration/execution/running-migration.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-53": {"query": "My theme config labels disappeared from the Theme Manager after 6.7 \u2014 how do I define `theme.json` config fields and where do their translations go now?", "category": "dev", "option": "mcp-wiki", "answer": "`theme.j
