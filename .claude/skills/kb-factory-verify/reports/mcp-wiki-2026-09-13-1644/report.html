son` lives at `<plugin root>/src/Resources/theme.json`; run `bin/console theme:refresh` after any change to apply it. Config fields go under `config.fields.<field-key>` and appear in the Administration Theme Manager, merged with (inheriting from) the Storefront config \u2014 only changed values need to be provided. Each field supports parameters `type` (`color`, `text`, `number`, `fontFamily`, `media`, `checkbox`, `switch`, `url`), `editable`, `tab`, `block`, `section`, `custom` (raw data exposed via API only), `scss` (set `false` to skip SCSS variable injection), and `fullWidth`. Fields also used to support inline `label`/`helpText` translation objects directly in `theme.json`, but this is why the labels disappeared: field definitions differ before/after v6.7.1.0 \u2014 since v6.7.1.0, `label`/`helpText` are omitted from `theme.json` field objects, and since v6.8.0.0 translations no longer live in theme.json at all. Instead, translations now use Administration snippet keys stored in files like `<plugin root>/src/Resources/app/administration/src/app/snippet/de.json` (or locale-specific `de-DE.json`/`en-GB.json`), with the key structure: Tab `sw-theme.<technicalName>.<tabName>.label`; Block `sw-theme.<technicalName>.<tabName>.<blockName>.label`; Section `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.label`; Field `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.<fieldName>.label`/`.helpText`; Option `...<fieldName>.<index>.label`. Unnamed tab/block/section segments use `default` in the key. `configInheritance` (available since 6.4.8.0) lists additional themes whose field config and snippets this theme inherits, besides the always-inherited Storefront. Source: https://developer.shopware.com/docs/guides/plugins/themes/configuration/theme-configuration.html", "citations": ["platform/dev/6.7/guides/plugins/themes/configuration/theme-configuration.md:1-77"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "theme.json", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/themes/configuration/theme-configuration.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-62": {"query": "I changed a setting in `.env` on a deployed 6.7 shop but it still behaves the old way \u2014 what takes precedence between `.env`, `.env.local` and the real environment variables, and which settings does Shopware not read from `.env` at all?", "category": "dev", "option": "mcp-wiki", "answer": "Shopware is a Symfony application, so it follows Symfony's standard dotenv precedence: real environment variables set by the OS/webserver/container/PaaS always win over anything in the `.env*` files; among the files, `.env.local` overrides `.env` (and `.env.<APP_ENV>.local` overrides `.env.<APP_ENV>`, which overrides `.env`), and `.env.local` is meant to be untracked/deployment-specific while `.env` holds the committed defaults. [from memory] The wiki's Shopware PaaS setup page confirms this same layering pattern at the platform level: `.platform/applications.yaml` `variables` (real environment variables injected by the platform) override `.env` (platform/dev/6.7/products/paas/shopware-paas/setup-template.md line 41, matched via grep \u2014 not read in full this session, so not independently citable here).\n\nSeparately, many Shopware settings are **not** environment-driven at all \u2014 they live in the database as `system_config` (Settings entries editable in the Administration, e.g. `core.listing.allowBuyInListing` and similar `core.*` config keys) and are loaded from there, not from `.env`. You can only make such a DB-backed setting environment-controlled by explicitly overlaying it via `config/packages/<name>.yaml` with `shopware.system_config.default.<key>: '%env(...)%'`, which then also disables editing that key in the Administration UI. Simply exporting an env var with a matching name does nothing for a `system_config` key unless it's wired this way.", "citations": ["platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md:1-41", "platform/dev/6.7/guides/hosting/configurations/shopware/static-system-config.md:1-66"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": ".env.local", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7", "glob": "**/*environment*"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/configurations/shopware/static-system-config.md"}}, {"tool": "grep_docs", "args": {"pattern": "precedence|real environment variable|override.*\\.env", "path": "platform/dev/6.7", "regex": true}}, {"tool": "grep_docs", "args": {"pattern": "\\.env", "path": "platform/dev/6.7/guides/hosting/configurations", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/hosting/configurations/shopware"}}], "notFoundClaim": false, "memoryClaims": ["Shopware is a Symfony application, so it follows Symfony's standard dotenv precedence: real environment variables set by the OS/webserver/container/PaaS always win over anything in the `.env*` files; among the files, `.env.local` overrides `.env` (and `.env.<APP_ENV>.local` overrides `.env.<APP_ENV>`, which overrides `.env`), and `.env.local` is meant to be untracked/deployment-specific while `.env` holds the committed defaults."], "sourceVerdict": "partial"}, "dev-51": {"query": "Custom entities declared in `Resources/config/entities.xml` no longer work for my plugin in Shopware 6.7 \u2014 how do I define and register a DAL entity with PHP attributes instead?", "category": "dev", "option": "mcp-wiki", "answer": "Since Shopware v6.6.3.0, entities can be registered via PHP attributes on a class extending `Entity`, instead of writing separate `EntityDefinition`, `EntityEntity`, and `EntityCollection` classes (the old XML-based entities.xml approach is superseded). Steps: 1) Extend `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity` and add `#[Entity('entity_name', collectionClass: ...)]` (attribute class `Shopware\\Core\\Framework\\DataAbstractionLayer\\Attribute\\Entity`); `name` is required and unique, `collectionClass` defaults to `EntityCollection` (custom collection class support since 6.6.9.0). 2) Add a primary key with `#[PrimaryKey]` on a property, typically a `string` UUID. 3) Register the class in `services.php` tagged `shopware.entity`, e.g. `$services->set(Examples\\ExampleEntity::class)->tag('shopware.entity');` \u2014 Shopware then auto-registers an `EntityDefinition` and `EntityRepository` named e.g. `example_entity.definition`/`example_entity.repository`. 4) Define fields with `#[Field(type: FieldType::...)]`, where `type` accepts a `FieldType` constant or (since 6.6.9.0) any FQCN extending `Field` directly, e.g. `#[Field(type: PriceField::class)]`. 5) Special attributes: `AutoIncrement`, `ForeignKey(entity: '...')`. 6) JSON fields with custom (de)serialization use `#[Serialized(serializer: ...)]`. 7) Custom fields: use `EntityCustomFieldsTrait` or `#[CustomFields]` on a nullable array property. 8) Fields are hidden from the API by default; add `#[Field(..., api: true)]` to expose everywhere, or scope with `api: [AdminApiSource::class]` / `api: [SalesChannelApiSource::class]`. 9) Translations: set `translated: true` on a nullable `#[Field]` property to get an auto-created `TranslatedField`/`EntityTranslationDefinition`, and add `#[Translations]` on a nullable array property to load all translations via the `translations` association. 10) Non-nullable properties are required by default; use `#[Required]` explicitly where needed (mandatory for translated fields, which must be nullable). 11) Associations use `OneToOne`, `OneToMany`, `ManyToOne`, `ManyToMany` attributes paired with `#[ForeignKey(entity: '...')]`. Gotchas: translated properties must be nullable; custom collection classes and direct Field-class references require 6.6.9.0+; no manual getters/setters, EntityTranslationDefinition, or EntityCollection classes are needed. Source: https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/entities-via-attributes.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md:1-61"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "custom entity", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "EntityCustomFields|#\\[Entity|Attribute.*Entity", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-38": {"query": "How do I write Jest unit tests for my Administration components in Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "Test files live next to the file under test, named with the suffix `.spec.js` or `.spec.ts`. Plain services and isolated ES modules can be imported and tested directly (e.g. `import Sanitizer from 'src/core/helper/sanitizer.helper';`). Administration components are registered globally via `Shopware.Component.register('name', {...})` and built into a real Vue component via `Shopware.Component.build('name')`, which resolves template inheritance/overrides \u2014 you can generate a test boilerplate with `composer run admin:create:test` (paste the component/service path when prompted). Install JS dependencies first with `composer run init:js`. Mount the built component with `mount()` or (preferred, since it stubs child components) `shallowMount()` from `@vue/test-utils`, passing `props`, `stubs`, `mocks`, and `attachTo: document.body` as needed. Several preconfigured mocks/globals are available: ACL roles via `global.activeAclRoles = ['product.editor']`, feature flags via `global.activeFeatureFlags = ['FEATURE_NEXT_12345']`, a mockable repository factory via `global.repositoryFactoryMock.responses.addResponse({ method, url, status, response })` (disable its missing-mock warning with `global.repositoryFactoryMock.showWarning = false`), and global mocks like `$tc`, `$device`, `$store`, `$router` overridable through `mount`'s `mocks` option. Missing directives (e.g. `clipboard`) can be added via `createLocalVue()` and `localVue.directive('clipboard', {})`; missing injections (e.g. `mediaService`) can be stubbed via `provide: { mediaService: { renameMedia: () => Promise.resolve() } }` or registered globally with `Shopware.Service.register('mediaService', {...})` in `beforeAll`. Run the full suite with coverage using `composer run admin:unit`, or only changed-file tests in watch mode with `composer run admin:unit:watch`. Because the Administration supports template inheritance and third-party extendability, unresolved child components, directives, injections, or services will surface as `[Vue warn]` messages during test runs and must be stubbed/mocked explicitly. Source: https://developer.shopware.com/docs/guides/development/testing/unit/jest-admin.html", "citations": ["platform/dev/6.7/guides/development/testing/unit/jest-admin.md:1-57"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/testing/unit/jest-admin.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-65": {"query": "What can I put in the JSON body of `POST /api/search/{entity}` for filtering, associations, sorting, aggregations and getting an exact total count?", "category": "dev", "option": "mcp-wiki", "answer": "The body is a DAL search-criteria object, and can contain: `associations` to load related data like a SQL join (nested criteria \u2014 sort/filter/limit \u2014 can be applied per association); `includes` to restrict returned fields per entity type, keyed by each response's `apiAlias` (e.g. `product`, `product_manufacturer`); `ids` to look up records directly by ID; `page` (1-indexed) and `limit` for pagination; `filter` to filter both results and aggregations (same filter types as the DAL \u2014 nested-field filters like `transactions.stateMachineState.technicalName` require the association to be requested first); `post-filter`, which filters results the same way but does not affect aggregations; `query` for a weighted search (each sub-query has a `score`, summed into `extensions.search._score` on each result \u2014 don't combine with `term`); `term` for a text search across fields flagged `SearchRanking` in the entity definition; `sort` \u2014 one or more `{field, order}` entries, supporting `naturalSorting: true` and (since 6.4.12.0) a `type: \"count\"` sort; `aggregations` for metrics/facets using the same aggregation types as the DAL; and `grouping` to group results by one or more fields.\n\nFor an exact total count, set `total-count-mode: 1` \u2014 it runs `SQL_CALC_FOUND_ROWS` for an exact total (needed for exact pagination), but is performance-intensive; the default `total-count-mode: 0` returns no total for best performance, and `2` only reports whether a next page exists (for infinite scroll).", "citations": ["platform/dev/6.7/guides/development/integrations-api/search-criteria.md:1-65"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/integrations-api/search-criteria.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-63": {"query": "I deployed a plugin update to a 6.7 staging shop and my new migration never ran \u2014 which `bin/console` command applies the pending migrations of that one plugin, and what do I have to pass to it?", "category": "dev", "option": "mcp-wiki", "answer": "Run `bin/console database:migrate <PluginName> --all`, e.g. `./bin/console database:migrate SwagBasicExample --all` \u2014 pass the plugin's technical name and `--all` to apply every pending migration for that one plugin. This is normally run automatically on plugin install/update, but can be run manually with this command. Note that migrations only ever run once and there is no rollback: don't edit an already-executed migration, add a new one instead; and `updateDestructive()` is a Shopware-core-only mechanism for delayed major-version destructive changes, not something plugin install/update or a normal `database:migrate` run triggers.", "citations": ["platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md:1-77"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "database:migrate", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-02": {"query": "Shopware 6.7 removed the RSA JWT key files and `system:generate-jwt-secret` \u2014 what signs Admin API tokens now, and what do I have to do when upgrading?", "category": "gap", "option": "mcp-wiki", "answer": "I found nothing in the wiki about a 6.7 change to how Admin API OAuth tokens are signed, about removal of RSA JWT key files, or about a `system:generate-jwt-secret` command. The only JWT-related material in the corpus is the CLI helper-commands page, which describes `shopware-cli project generate-jwt <path> [--env]` (setting `JWT_PRIVATE_KEY`/`JWT_PUBLIC_KEY`) and states this is 'only required for Shopware versions before 6.5 \u2014 6.5+ generates JWT secrets automatically' \u2014 it does not describe any further 6.7-specific change to the signing mechanism, nor mention removal of key files or of a `system:generate-jwt-secret` console command. I searched the 6.7 upgrades-migrations section (Vue 3/Meteor/Pinia/Vite/vue-migration-build/extension-translation/language-pack-migration/upgrade-shopware pages), the Admin API hub, and the synonyms path with no hits on `jwt`, `oauth`, `RSA`, or key-file terms in that context. This looks like a genuine gap in the served corpus: I cannot state what actually signs Admin API tokens in 6.7 or the required upgrade steps from this source.", "citations": ["platform/dev/6.7/products/tools/cli/project-commands/helper-commands.md:1-70"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "jwt", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "generate-jwt-secret", "path": "platform/dev/6.7"}}, {"tool": "grep_docs", "args": {"pattern": "jwt", "path": "platform/dev/6.7/products/tools/cli/project-commands/helper-commands.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/products/tools/cli/project-commands/helper-commands.md"}}, {"tool": "grep_docs", "args": {"pattern": "jwt", "path": "platform/dev/6.7", "glob": "**/{changelog,upgrade,breaking,migration}*/**"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7", "glob": "**/*upgrade*"}}, {"tool": "grep_docs", "args": {"pattern": "upgrade", "path": "platform/dev/6.7/index.md", "maxMatches": 30}}, {"tool": "grep_docs", "args": {"pattern": "jwt", "path": "platform/dev/6.7/guides/upgrades-migrations"}}, {"tool": "grep_docs", "args": {"pattern": "oauth", "path": "platform/dev/6.7/guides/upgrades-migrations"}}, {"tool": "grep_docs", "args": {"pattern": "jwt", "path": "platform/synonyms.md"}}, {"tool": "grep_docs", "args": {"pattern": "private.pem|public.pem|RSA", "path": "platform/dev/6.7", "regex": true}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "edge-05": {"query": "How do I enable Shopware's built-in MCP server on a Shopware 6.6 shop?", "category": "edge", "option": "mcp-wiki", "answer": "This is not possible: Shopware's built-in MCP server is documented only under the 6.7 developer docs (`platform/dev/6.7/products/tools/mcp-server/...`), and its own getting-started guide states the prerequisite is Shopware 6.7.14.0+ (with a narrower window of 6.7.11.0\u20136.7.13.x usable only by manually setting `MCP_SERVER=1` in `.env` and skipping discovery), plus the `symfony/mcp-bundle` package. A grep for 'MCP server' across the whole platform layer returned hits only inside `platform/dev/6.7/...` paths (plus hub/index pages referencing them) \u2014 nothing under `platform/dev/6.6`. So there is no documented way to enable the built-in MCP server on Shopware 6.6; it requires being on a 6.7.11+ release. For reference, the 6.7 procedure is: create an integration with `bin/console integration:create \"My MCP Client\" --admin` (omit `--admin` in production and assign a scoped ACL role instead), configure the AI client (Claude Desktop/Cursor use `streamable-http` type against `/api/_mcp` with `sw-access-key`/`sw-secret-access-key` headers; Claude Code uses `http` type in `.mcp.json`; Codex uses `~/.codex/config.toml`), verify with `bin/console debug:mcp`, and discover tools via `shopware-tool-search`/`shopware-toolsets-list`/`shopware-toolset-enable`.", "citations": ["platform/dev/6.7/products/tools/mcp-server/getting-started.md:1-47"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "MCP server", "path": "platform", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/products/tools/mcp-server/getting-started.md"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "yes"}, "func-01": {"query": "How do I create a product with variants and configure its visibility per sales channel, and why might it not show up in the storefront?", "category": "func", "option": "mcp-wiki", "answer": "To create a product, go to Catalogues > Products and fill in the required fields before the first save: Title, Product number, Tax rate, Price (gross and net) and Stock; only after that first save do the other tabs (Specifications, Extended Prices, Variants, Layout, SEO, Cross Selling) become available. To generate variants, use the Variant Generator on the Variants tab: pick the properties/options that should form the variant axes, define any price surcharges, optionally exclude specific combinations under Value exclusion, then click Generate variants; the product list can then display either a Single main variant (Main product or Single Variant preselection) or Fan out properties in product list. Sales-channel assignment for a whole category (and hence the products under it) is done on the category itself: under Catalogues > Categories, a newly created category is inactive by default and not shown in the frontend until activated, and its Entry point setting (for Page/List or Structuring element/entry point types) lets you choose Main navigation, Footer navigation, Service navigation and the Sales channels it belongs to; landing pages likewise have their own Sales channels field. Common reasons a product does not show up in the storefront, based on what the wiki documents: the category it lives in is inactive or not assigned to the sales channel's navigation entry point, or (if the Products tab was switched from manual assignment to a Dynamic product group) the product got removed from that specific category's manual assignment. The separate Dynamic Access extension (Shopware Evolve plan, since 6.4.6.0) can also hide a product from the storefront: it is configured per product under Catalogues > Products > General tab > Visibility & structure section by assigning Rule Builder rules; a category with no rule assigned is always visible, but hiding a category does not hide the products inside it from search \u2014 the same rule must also be applied directly to the products, and selecting mutually exclusive rules can make a category or product never appear at all. Beyond what the wiki documents explicitly, other classic causes of a missing product in the storefront are: the product itself was never assigned to the sales channel (the product's own Sales Channel/visibility field), the product is inactive, or its stock/availability settings prevent display. [from memory]", "citations": ["platform/func/catalogues/products.md:1-60", "platform/func/catalogues/categories.md:1-55", "platform/func/extensions/dynamiccontent.md:1-37"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "variant", "path": "platform/func", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "sales channel visibility", "path": "platform/func", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/catalogues/products.md"}}, {"tool": "grep_docs", "args": {"pattern": "visibilit", "path": "platform/func", "context": 2}}, {"tool": "read_doc", "args": {"path": "platform/func/catalogues/product-overview.md"}}, {"tool": "grep_docs", "args": {"pattern": "sales channel", "path": "platform/func/catalogues", "context": 2}}, {"tool": "grep_docs", "args": {"pattern": "not show", "path": "platform/func", "context": 2}}, {"tool": "read_doc", "args": {"path": "platform/func/catalogues/categories.md"}}, {"tool": "read_doc", "args": {"path": "platform/func/extensions/dynamiccontent.md"}}], "notFoundClaim": false, "memoryClaims": ["Beyond what the wiki documents explicitly, other classic causes of a missing product in the storefront are: the product itself was never assigned to the sales channel (the product's own Sales Channel/visibility field), the product is inactive, or its stock/availability settings prevent display."], "sourceVerdict": "partial"}, "dev-22": {"query": "How do I give my plugin a settings page the shop operator can fill in, and what field types are available?", "category": "dev", "option": "mcp-wiki", "answer": "Create src/Resources/config/config.xml in your plugin; it is rendered dynamically as an Administration configuration page (Extensions -> My extensions -> Plugins -> Configure) without needing a custom Administration module. The file needs at least one <card> with a <title> and at least one <input-field>, e.g. <config xsi:noNamespaceSchemaLocation=\"https://raw.githubusercontent.com/shopware/shopware/trunk/src/Core/System/SystemConfig/Schema/config.xsd\"><card><title>Minimal configuration<\/title><input-field><name>example<\/name><\/input-field><\/card><\/config>. Card <title>, <label>, <placeholder>, and <helpText> are translatable via the lang attribute (default en-GB). Every <input-field> needs a unique <name> of at least 4 characters matching [a-zA-Z][a-zA-Z0-9]*. Field type defaults to text; supported types are text, textarea, text-editor, url, password, int, float, bool, checkbox, datetime, date, time, colorpicker, single-select, multi-select. Common settings include label/placeholder/helpText, defaultValue, disabled, required, copyable (text-like fields), minLength/maxLength (text/url/password), min/max (int/float), and <options> with <option><id>/<name> pairs for single/multi-select. For advanced UI you can instead use <component name=\"componentName\"> to embed one of the supported Administration components: sw-entity-single-select, sw-entity-multi-id-select, sw-media-field, sw-text-editor, sw-snippet-field (for entities without a name field use <label-property>; sw-snippet-field edits snippet translations rather than a system config value, available since 6.3.4.0). Mark a field cache-relevant=\"true\" if its value affects cached Storefront output; this attribute is available since Shopware 6.7.12.0, and from 6.8.0.0 onward it becomes necessary because system config writes no longer invalidate caches by default.", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md:1-80"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "plugin configuration", "path": "platform/dev/6.7", "glob": "**/config*", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "plugin config.*field", "path": "platform/dev/6.7", "regex": true}}, {"tool": "grep_docs", "args": {"pattern": "config.xml", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-01": {"query": "How do I configure Shopware 6's built-in GraphQL API for the Store API?", "category": "edge", "option": "mcp-wiki", "answer": "Nothing relevant was found in the wiki, and this premise appears to be false: Shopware 6 does not ship a built-in GraphQL API. A grep for 'graphql' across the entire platform layer (developer docs for 6.5/6.6/6.7, functional docs, hubs, and the synonyms index) returned zero matches. Shopware 6's Store API (and Admin API) are REST/JSON based, documented under the store-api and admin-api hubs; there is no GraphQL configuration to perform because no such built-in API exists in the corpus. [from memory] Shopware's officially documented APIs (Store API, Admin API) are REST-based, not GraphQL, and no core GraphQL endpoint exists as of my knowledge.", "citations": [], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "graphql", "path": "platform", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform", "glob": "synonyms*"}}, {"tool": "grep_docs", "args": {"pattern": "graphql", "path": "platform/synonyms"}}], "notFoundClaim": true, "memoryClaims": ["Shopware's officially documented APIs (Store API, Admin API) are REST-based, not GraphQL, and no core GraphQL endpoint exists as of my knowledge."], "sourceVerdict": "no"}, "dev-39": {"query": "How do I write end-to-end Cypress tests for my plugin against a Shopware 6.7 store?", "category": "dev", "option": "mcp-wiki", "answer": "Note first: in Shopware 6.7's docs, Cypress-based E2E testing is marked legacy \u2014 Cypress has been deprecated and is no longer maintained, and new projects should use Playwright instead. That said, the legacy Cypress guide is still documented: start from a clean Shopware installation (no categories, products, or settings), initialized with `composer run init`; tests run against production mode and a theme must be assigned. Install E2E dependencies with `npm install` in the relevant E2E folder (e.g. `src/Administration/Resources/app/administration/test/e2e`). The `@shopware-ag/e2e-testsuite-platform` package (built on Cypress plus `cypress-select-tests`, `cypress-log-to-output`, `cypress-file-upload`) provides commands, helpers, and test data management. For a plugin, create the folder structure `Resources/app/<environment>/test/e2e/cypress/{fixtures,integration,plugins,support}`, run `npm init -y`, install `@shopware-ag/e2e-testsuite-platform`, then create `e2e/cypress/plugins/index.js` requiring `@shopware-ag/e2e-testsuite-platform/cypress/plugins` and `e2e/cypress/support/index.js` requiring `@shopware-ag/e2e-testsuite-platform/cypress/support`. Run tests with `composer run e2e:setup` (outside the container, first-time prep), `composer run e2e:prepare` (inside the container, if already clean), then `composer run e2e:open` (opens the interactive runner), or headlessly via `composer e2e:cypress -- run --spec=\"cypress/e2e/administration/**/*.cy.js\"`. Test files go under `fixtures` (static JSON via `cy.fixture`), `integration` (`*.spec.js` files \u2014 must be placed in one of the recognized subfolders like `catalogue`, `content`, `customer`, `general`, `media-marketing`, `order`, `rule-product-stream`, `settings`, or CI won't consider them), `plugins`, and `support` (custom commands/overrides), configured via `cypress.json`/`cypress.env.json`. Use `describe()`/`context()` to group tests and `it()` (Shopware's preferred convention over `specify()`) for individual tests; prefer `beforeEach` cleanup over `after`/`afterEach` since a failed test can skip the latter. Create test data through the REST API rather than the UI, using `ApiService` (wraps axios) and `cy.createDefaultFixture(endpoint, data, jsonPath)`, extending `AdminFixtureService`/`FixturesService` for custom fixture services. Avoid relying on UUID-based IDs as selectors since they can change between installations. Source: https://developer.shopware.com/docs/guides/development/testing/legacy/cypress/", "citations": ["platform/dev/6.7/guides/development/testing/legacy/cypress/_index.md:1-46", "platform/dev/6.7/guides/development/testing/legacy/_index.md:1-22"], "toolCallLog": [{"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/development/testing/legacy/cypress", "depth": 2}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/testing/legacy/cypress/_index.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/testing/legacy/_index.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-01": {"query": "How do I add my own Admin API endpoint under `/api/...` from a plugin \u2014 a controller with the api route scope and its ACL?", "category": "gap", "option": "mcp-wiki", "answer": "The wiki has no dedicated guide for adding a custom Admin API controller/endpoint from a plugin (the closest documented pattern is the Store API route guide, and the Administration ACL guide covers only Vue/UI privilege gating). By close analogy to the documented Store API route pattern: define a controller/route class tagged with the `#[Route(...)]` attribute whose `defaults` set `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE` \u2014 for the Admin API this is `Shopware\\Core\\Framework\\Api\\Route\\ApiRouteScope::ID` instead of `StoreApiRouteScope::ID` used for Store API routes \u2014 and register/import the route class the same way, via `<plugin root>/src/Resources/config/routes.php` (`$routes->import(...)`), verifying discovery with `bin/console debug:router` [from memory, by analogy with the documented Store API pattern]. The wiki explicitly notes that for Admin API endpoints the OpenAPI schema file goes under `src/Resources/Schema/AdminApi/` instead of `Schema/StoreApi/`. Regarding ACL: the wiki's ACL guide is explicit that Administration UI privileges (`acl.can()`, `meta.privilege`, `Plugin::enrichPrivileges()`) only gate visibility/behavior inside the Administration SPA and do **not** protect the API itself \u2014 'ACL rules in the Administration UI can be bypassed by making direct API calls to the backend.' To actually gate a custom Admin API controller action by ACL you need the PHP `#[Acl(['your_privilege:read'])]` attribute on the controller method, which is not documented anywhere in this corpus [from memory] \u2014 I could not find any page describing that attribute or its registration.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md:1-57", "platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:1-72"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "api route scope", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "add-custom-controller", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "RouteScope", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/hubs/admin-api.md"}}, {"tool": "grep_docs", "args": {"pattern": "acl", "path": "platform/dev/6.7/guides/plugins/plugins/administration", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration"}}, {"tool": "grep_docs", "args": {"pattern": "Acl(", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}}, {"tool": "grep_docs", "args": {"pattern": "ApiRouteScope", "path": "platform/dev/6.7"}}, {"tool": "grep_docs", "args": {"pattern": "#\\[Acl", "path": "platform/dev/6.7", "regex": true}}], "notFoundClaim": true, "memoryClaims": ["By close analogy to the documented Store API route pattern: define a controller/route class tagged with the `#[Route(...)]` attribute whose `defaults` set `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE` \u2014 for the Admin API this is `Shopware\\Core\\Framework\\Api\\Route\\ApiRouteScope::ID` instead of `StoreApiRouteScope::ID` used for Store API routes \u2014 and register/import the route class the same way, via `<plugin root>/src/Resources/config/routes.php` (`$routes->import(...)`), verifying discovery with `bin/console debug:router` [from memory, by analogy with the documented Store API pattern].", "To actually gate a custom Admin API controller action by ACL you need the PHP `#[Acl(['your_privilege:read'])]` attribute on the controller method, which is not documented anywhere in this corpus [from memory] \u2014 I could not find any page describing that attribute or its registration."], "sourceVerdict": "partial"}, "edge-02": {"query": "How do I get the DI container with `Shopware()->Container()` and override the product listing Smarty template in Shopware 6?", "category": "edge", "option": "mcp-wiki", "answer": "Nothing relevant was found for either term in the wiki: greps for 'Smarty' and for 'Shopware()->Container()' across the whole platform layer (dev docs for 6.5/6.6/6.7, functional docs, hubs) returned zero matches. That is consistent with the premise being wrong for Shopware 6: `Shopware()->Container()` and Smarty templating are Shopware 5 (legacy) concepts. [from memory] In Shopware 6, the DI container is not accessed via a global `Shopware()` function; services are retrieved through Symfony's dependency injection (constructor injection or, in limited legacy contexts, a container-aware kernel), and templates use Twig, not Smarty \u2014 a storefront/product-listing template is overridden by extending the relevant `.html.twig` block in a plugin/theme, not a `.tpl` Smarty file. Since the corpus has no content on Smarty or the old `Shopware()->Container()` global for Shopware 6, I could not find a corpus-backed procedure for this exact (outdated) approach.", "citations": [], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "Smarty", "path": "platform", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "Shopware()->Container()", "path": "platform", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "Container()", "path": "platform/dev/6.7", "mode": "files"}}], "notFoundClaim": true, "memoryClaims": ["In Shopware 6, the DI container is not accessed via a global `Shopware()` function; services are retrieved through Symfony's dependency injection (constructor injection or, in limited legacy contexts, a container-aware kernel), and templates use Twig, not Smarty \u2014 a storefront/product-listing template is overridden by extending the relevant `.html.twig` block in a plugin/theme, not a `.tpl` Smarty file."], "sourceVerdict": "no"}, "dev-20": {"query": "How do I add my own condition to the Rule Builder from a plugin so shop owners can select it?", "category": "dev", "option": "mcp-wiki", "answer": "Create a rule class in `<plugin root>/src/Core/Rule` extending `Shopware\\Core\\Framework\\Rule\\Rule`, implementing `getName()` (a unique technical name), `match(RuleScope $scope): bool`, and `getConstraints(): array` (field => constraints); rule instance variables must be declared `protected`, not `private`, or they will not work. Register the class in `services.php` tagged `shopware.rule.definition`. If you don't want to build a custom Administration component, add `getConfig(): RuleConfig` returning e.g. `(new RuleConfig())->booleanField('isFirstMondayOfTheMonth')` \u2014 Shopware then renders the built-in `sw-condition-generic` component for it. To surface the condition in the Administration rule editor, decorate `ruleConditionDataProviderService` (the `RuleConditionService`) and call `addCondition()`, naming the condition to match your rule's `getName()`, pointing it at an Administration component (e.g. `swag-first-monday`) with a `label`, `scopes`, and optional `group` (create new groups via `upsertGroup()`); load the decorator from a `main.js` entry point under `<plugin root>/src/Resources/app/administration/src/`. Build the custom component by extending `sw-condition-base` and overriding the `sw_condition_value_content` Twig block with your input control (e.g. `sw-single-select`). Since 6.5.0.0, context awareness lets you restrict where a rule containing your condition can be assigned: read possible relations from `Shopware\\Core\\Content\\Rule\\RuleDefinition`, then call `ruleConditionService.getAwarenessConfigurationByAssignmentName()` and `addAwarenessConfiguration()` with `notEquals`/`equalsAny`/`snippet`, and use `sw-select-rule-create` with a matching `rule-aware-group-key` prop wherever rules are selected \u2014 without this, a new condition may not be selectable everywhere (e.g. inside the promotion module). Never run database queries or other slow operations inside `match()`, since it directly impacts storefront performance.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/rule/add-custom-rules.md:1-65"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "custom rule", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/rule/add-custom-rules.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-46": {"query": "sw-button and sw-card are deprecated in Shopware 6.7 \u2014 how do I migrate my plugin's admin templates to the Meteor components, and is there a codemod that does it?", "category": "dev", "option": "mcp-wiki", "answer": "Yes \u2014 with Shopware 6.7, several Administration components (such as sw-button and sw-card) are being replaced with components from the Meteor Component Library, Shopware's official reusable component collection built on the Shopware Design System, and there is a codemod tool for the migration. Run it on a plugin located under `custom/plugins`:\n\n```bash\ncomposer run admin:code-mods\n# Example: composer run admin:code-mods -- --plugin-name example-plugin --fix -v 6.7\n```\n\nThe tool replaces compatible components automatically, adds guidance comments where manual migration is still required, and fixes some other deprecated code. To support cross-version compatibility (running on both 6.6 and 6.7 from one codebase without migrating immediately), Shopware components gained a `deprecated` prop, defaulting to `false` (meaning the new Meteor Component is used by default); setting `deprecated: true` on a component renders the old component instead. Shopware recommends migrating to Meteor Components as soon as possible since the old components are only kept for backward compatibility, and notes that timelines/implementation details for this migration are still subject to change. Source: https://developer.shopware.com/docs/guides/upgrades-migrations/administration/meteor-components.html", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/meteor-components.md:1-43"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/administration/meteor-components.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-28": {"query": "How do I override an existing Storefront JavaScript plugin, such as the cookie permission bar, from my own plugin instead of registering a new one?", "category": "dev", "option": "mcp-wiki", "answer": "Extend the original plugin's vanilla JS class directly if it is importable, e.g. import CookiePermissionPlugin from 'src/plugin/cookie/cookie-permission.plugin'; export default class MyCookiePermission extends CookiePermissionPlugin {}. If the class can't be imported (e.g. a third-party plugin with no alias), retrieve it at runtime via PluginManager: const Plugin = window.PluginManager.getPlugin('CookiePermission'); const PluginClass = Plugin.get('class'). Override the methods you need \u2014 for example override init() to clear the cookie via the CookieStorage helper (src/helper/storage/cookie-storage.helper) before calling super.init(), and override _hideCookieBar() to add a confirm() dialog before calling super._hideCookieBar(). Then, in main.js, register the override using PluginManager.override(...) instead of PluginManager.register(...): PluginManager.override('CookiePermission', MyCookiePermission, '[data-cookie-permission]'). If the original plugin was registered asynchronously, the override's import must also be a dynamic import: PluginManager.override('CookiePermission', () => import('./my-cookie-permission/my-cookie-permission.plugin'), '[data-cookie-permission]'). Important gotcha: each JavaScript plugin can only be overridden once \u2014 if two Shopware plugins override the same plugin, only the last override actually takes effect.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md:1-83"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "override.*plugin", "path": "platform/dev/6.7", "regex": true, "glob": "**/*js*/**", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "override.*storefront.*plugin", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-05": {"query": "How do I set up a sales channel \u2014 storefront versus headless type, domains, languages and currencies \u2014 and where do I get its API access key?", "category": "func", "option": "mcp-wiki", "answer": "A sales channel is created via the plus icon next to Sales Channel in the admin main menu, choosing between a Sales Channel with HTML storefront, a headless sales channel (API only), or a product-comparison export channel. General settings cover Name, marking it as favourite, Entry point main navigation, Navigation levels, Entry point footer navigation, Entry point service navigation, the default Customer group for new/anonymous customers, Countries, Languages, and Standard units of measurement. Payment and shipping settings assign Payment methods (with a default), Shipping methods (with a default), Currencies (with a default), and the Tax calculation method. For multi-language shops on self-hosted instances, Domains are configured individually \u2014 each domain gets its own URL, Language, Currency, Snippet set, and unit system; using one consistent protocol across domains avoids duplicate-content issues, and Hreflang can be activated with a chosen default domain as fallback to further prevent duplicate-content classification across language versions (cloud instances instead get an auto-generated URL forwarding all traffic over an encrypted connection). The channel's API Access ID (used for API access, e.g. Store API calls) is generated under the channel's own API access section. Additional configuration includes a Status area to temporarily disable the channel, enable maintenance mode, or IP-whitelist access (behind a proxy this needs TRUSTED_PROXIES=IP_of_the_proxy set in .env), a Products tab to assign/remove individual products, categories, or dynamic product groups without editing each product, a Theme tab, and optional Google Analytics 4 and 'agentic files' (llms.txt, agents.md, ai-catalog.json) settings. Notable gotchas: with 'Bind customers to Sales Channel' enabled, the same email address can register as separate customers across different channels, and that split persists even if the option is later disabled; the preinstalled headless sales channel should never be deleted since several extensions (including the B2B Suite) depend on it \u2014 hide it from the sidebar via favourites instead; and deleting a sales channel is irrevocable.", "citations": ["platform/func/settings/saleschannel.md:1-68"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "sales channel", "path": "platform/func", "mode": "files", "glob": "**/salesc*"}}, {"tool": "list_docs", "args": {"path": "platform/func", "glob": "**/*sales*"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/saleschannel.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-26": {"query": "How do I add a custom document type such as a pro-forma invoice in Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "In Shopware 6.7 there are two document systems: the legacy one (still the default, deprecated and slated for removal in 6.9) and the experimental Document System (v2, gated by the DOCUMENT_GENERATION_REWORK feature flag, expected to become the default in 6.8). Legacy approach: add a plugin migration inserting a row into document_type (with a technical_name), translations into document_type_translation via Shopware\\Core\\Migration\\Traits\\ImportTranslationsTrait/Translations, and a default config into document_base_config plus document_base_config_sales_channel. Create a renderer implementing Shopware\\Core\\Checkout\\Document\\Renderer\\AbstractDocumentRenderer, with getDecorated(), supports(): string (returning the type's technical name), and render(array $operations, Context $context, DocumentRendererConfig $rendererConfig): RendererResult, using DocumentFileRendererRegistry to produce the PDF/HTML content; register it with the service tag document.renderer. Add a Twig template at src/Resources/views/documents/<name>.html.twig starting with {% sw_extends '@Framework/documents/base.html.twig' %}. Finally add a number range via migration (rows in number_range_type, number_range, number_range_sales_channel, plus translations). Every document type needs a matching AbstractDocumentRenderer or it will show up in the Administration but not work, and it needs a number range or no document number can be generated. Document System (v2) approach instead: extend Shopware\\Core\\Checkout\\DocumentV2\\Type\\AbstractDocumentType (getTechnicalName(), getSupportedFormats() e.g. ['html','pdf']), create a render-data DTO extending AbstractRenderData, and a data provider extending AbstractDocumentDataProvider (getKey(), supports(), enrichOrderCriteria(), provideRenderingData()); register both with tags shopware.document_v2.type and shopware.document_v2.provider; add a Twig template at @Framework/documents/<technical_name>.html.twig (plus a zugferd XML template if that format is supported); and still add, via migration, a document_type row with matching technical_name and a number range of type document_<technical_name>. Since v2 is experimental in 6.7, the legacy path is the currently stable option for a production plugin, but new development is steered toward v2.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/documents/legacy/add-custom-document-type.md:1-55", "platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md:1-52", "platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/_index.md:1-32"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "document type", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/_index.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/documents/legacy/add-custom-document-type.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-50": {"query": "My `ScheduledTaskHandler` stopped running after the upgrade \u2014 how must a scheduled task and its handler be declared in Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "In Shopware 6.7, a scheduled task and its handler are two separate runtime roles that must both be wired, even when generated together: the task describes when work is due, the handler is the Messenger consumer that executes it. Register both in the plugin's `services.php`:\n\n```php\n$services->set(ExampleTask::class)\n    ->tag('shopware.scheduled.task');\n\n$services->set(ExampleTaskHandler::class)\n    ->args([service('scheduled_task.repository'), service('logger')])\n    ->tag('messenger.message_handler');\n```\n\nThe task class extends `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTask` and implements `getTaskName()` (a vendor-prefixed technical name, e.g. `swag.example_task`) and `getDefaultInterval()` (in seconds). The handler class extends `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTaskHandler`, must be annotated `#[AsMessageHandler(handles: ExampleTask::class)]`, and implements `run()`. A missing `messenger.message_handler` tag, missing `#[AsMessageHandler]` attribute, or a broken link between handler and task class is the likely cause of a handler that silently stops running after an upgrade. Since Shopware 6.7.13.0 a handler can additionally implement `DynamicallyScheduledTaskHandler` with `getNextExecutionTime(ScheduledTask $task, ScheduledTaskEntity $taskEntity): ?\\DateTimeInterface`, called after `run()` finishes, to control the next run time from domain data instead of a fixed interval (returning `null` falls back to `nextExecutionTime + runInterval`, capped to now if in the past). To register and test without reinstalling the plugin: `bin/console scheduled-task:register`, `bin/console scheduled-task:run`, `bin/console messenger:consume`. Gotcha: the task's `status` must be `scheduled` in the `scheduled_task` table for `scheduled-task:run` to pick it up (unless using the admin worker) \u2014 check this if the task simply isn't firing after the upgrade. Source: https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md:1-70"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "ScheduledTaskHandler", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-68": {"query": "How does the registration handshake between Shopware and my app backend work \u2014 shop id, proof, shop secret and the confirmation call?", "category": "dev", "option": "mcp-wiki", "answer": "Shopware sends a `GET` request to the URL declared in the manifest, with query parameters `shop-id`, `shop-url`, `timestamp`, and a `shopware-app-signature` header (HMAC-SHA256 of the query string, signed with the app's `app-secret`; PHP: `hash_hmac('sha256', $queryString, $appSecret)`), plus an `sw-version` header (since 6.4.1.0). On re-registration it also carries a `shopware-shop-signature` header signed with the shop's current `shop-secret`.\n\nOn success, the app backend must respond with:\n```json\n{ \"proof\": \"...\", \"secret\": \"random secret string\", \"confirmation_url\": \"https://my.example.com/registration/confirm\" }\n```\nwhere `proof` is a SHA-256 HMAC of `shopId . shopUrl . appName` using the `app-secret`, and `secret` is a newly generated `shop-secret` (64\u2013255 characters). On a failed setup precondition, respond `{\"error\": \"...\"}` instead.\n\nIf the proof matches, Shopware then sends a `POST` to the given `confirmation_url` with body `apiKey`, `secretKey`, `timestamp`, `shopUrl`, `shopId`, signed via a `shopware-shop-signature` header (HMAC-SHA256 of the body, using `shop-secret`). The app backend uses that `apiKey`/`secretKey` pair as the OAuth `client_id`/`client_secret` for subsequent Admin API calls. Re-registration also sends a `shopware-shop-signature-previous` header signed with the previous `shop-secret`, so the backend can validate both and accept the old secret for a short grace period (e.g. 1 minute) during secret rotation.\n\nGotcha: the `app-secret` must never be published \u2014 it stays with the Shopware Account \u2014 and registration/confirmation requests time out after 5 seconds.", "citations": ["platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md:1-96"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-21": {"query": "My plugin dispatches its own domain event \u2014 how do I make it show up as a trigger in the Flow Builder?", "category": "dev", "option": "mcp-wiki", "answer": "Implement one of the Flow 'Aware' interfaces on your event (e.g. Shopware\\Core\\Framework\\Event\\CustomerAware plus FlowEventAware for a customer-related event), giving the event a getCustomerId()-style accessor and an EVENT_NAME constant. Since Shopware 6.5.0.0, event data for Flow Builder is carried via a StorableFlow rather than getAvailableData(); each Aware interface has a matching FlowStorer that copies its data into the store (CustomerAware -> Shopware\\Core\\Content\\Flow\\Dispatching\\Storer\\CustomerStorer, MailAware -> MailStorer, OrderAware -> OrderStorer, UserAware -> UserStorer). If your data doesn't fit an existing Aware interface, define your own Aware interface plus a FlowStorer subclass implementing store() and restore(). Flow actions can then read the data via $flow->getStore($key) (Aware-sourced data) and $flow->getData($key) (original event/additional data). Finally, register the event as a trigger with a subscriber on BusinessEventCollectorEvent::NAME that calls $businessEventCollector->define(ExampleEvent::class) and adds it to the collection; give the subscriber a high priority (e.g. 1000) so it registers before other trigger subscribers. This custom-flow-trigger functionality is available starting with Shopware 6.4.6.0, and the StorableFlow/FlowStorer model replaces getAvailableData() from 6.5.0.0 onward.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md:1-68"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "custom event", "path": "platform/dev/6.7", "glob": "**/flow*/**"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7", "glob": "**/*flow*"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-25": {"query": "How do I add a `bin/console` command to my plugin for a maintenance task?", "category": "dev", "option": "mcp-wiki", "answer": "Follow the standard Symfony approach: register your command class as a service in src/Resources/config/services.php tagged console.command, e.g. $services->set(Swag\\BasicExample\\Command\\ExampleCommand::class)->tag('console.command');. Commands registered this way are automatically available via bin/console. Write a minimal command class using the #[AsCommand(name: 'swag:example', description: 'Example command')] attribute on a class extending Symfony\\Component\\Console\\Command\\Command, implementing execute(InputInterface $input, OutputInterface $output): int, writing output and returning Command::SUCCESS. The key identifiers are the console.command service tag, the Symfony\\Component\\Console\\Attribute\\AsCommand attribute, and the Symfony\\Component\\Console\\Command\\Command base class.", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md:1-54"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "console command", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-09": {"query": "Why doesn't my payment method appear in the checkout \u2014 what has to be configured in the administration?", "category": "func", "option": "mcp-wiki", "answer": "Payment methods are managed under Settings > Commerce > Payment methods, and several things in the administration must line up for one to actually appear at checkout. First, the method's own Active toggle must be on \u2014 the overview lists each method's active status, and the four standard active methods are cash on delivery, invoice, prepayment, and direct debit. Second, and critically, a method also needs to be assigned in the relevant sales channel to actually appear to customers there \u2014 being active globally is not enough by itself. Third, the method's Availability rule field uses Rule Builder conditions to control when it is offered; if a rule is assigned and its conditions are not met by the current cart/customer/context, the method will be hidden even though it exists and is active \u2014 leaving this field blank (NULL) means unrestricted availability. Other relevant fields on the payment method itself are Technical name (a unique identifier \u2014 changing it on an existing method can make it inoperable, so for a self-created method it should be set as early as possible, and for a method from an installed extension you should wait for the manufacturer to update it rather than rename it yourself), Position (its storefront display order), description, logo, and 'Allow change of payment method after order completion'. In short: to fix a missing payment method, check in order that it is Active, that it is assigned to the sales channel used for checkout, and that its Availability rule (if any) actually matches the current cart/customer conditions.", "citations": ["platform/func/settings/Paymentmethods.md:1-32"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "checkout", "path": "platform/func/settings/Paymentmethods.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-08": {"query": "In a plugin service, what is the Shopware 6 equivalent of Doctrine's `findBy()` \u2014 how do I read products with filters, associations and sorting?", "category": "dev", "option": "mcp-wiki", "answer": "Shopware 6 uses no ORM, only its own Data Abstraction Layer (DAL); there is no `findBy()` \u2014 you inject the generated `product.repository` service (named `<entity_name>.repository`) and search it with a `Criteria` object. A plain read with no filtering is `$this->productRepository->search(new Criteria(), $context)`, which returns an `EntitySearchResult` (always a collection, even for a single-ID search \u2014 call `->first()` to get the entity). Search by id(s) via `new Criteria([$myId])`. Filter by field with `$criteria->addFilter(new EqualsFilter('name', 'Example name'))` (`Shopware\\Core\\Framework\\DataAbstractionLayer\\Search\\Filter\\EqualsFilter`); combine multiple filters with `OrFilter`, `AndFilter`, `NandFilter`, etc.; use `addPostFilter()` instead of `addFilter()` when the filter should apply to the result but not to aggregations. Load associations with `$criteria->addAssociation('productReviews')` (chainable, e.g. `'productReviews.customer'`); to filter an association without restricting the parent entity use `$criteria->getAssociation('productReviews')->addFilter(...)`, whereas adding a filter on `'productReviews.points'` directly to the main criteria does restrict the parent entity. Mapping entities (e.g. `ProductCategoryDefinition`, the join table for a `ManyToMany`) cannot be read with `search()` \u2014 use `searchIds()` instead, since they only have primary keys. Aggregate with `$criteria->addAggregation(new AvgAggregation('avg-rating', 'productReviews.points'))` and read the result via `$products->getAggregations()->get('avg-rating')`. Page and sort with `setLimit()`, `setOffset()`, and `addSorting(new FieldSorting('createdAt', FieldSorting::ASCENDING))`. For large datasets, use `RepositoryIterator($this->productRepository, $context, $criteria)` and call `->fetch()` in a loop until it returns `null`; this issues a new DB request per iteration and requires a deterministic sort (e.g. always add `id` as a secondary sort) to avoid entities being skipped or duplicated across batches. Source: https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/reading-data.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md:1-55"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-32": {"query": "How do I define a custom field set for products from my plugin so merchants can edit the values in the Administration?", "category": "dev", "option": "mcp-wiki", "answer": "To make a custom field set editable in the Administration for an existing entity like product, use the `custom_field_set.repository` service to create the set and attach it to the entity, e.g.: `$this->customFieldSetRepository->create([['name' => 'swag_example_set', 'global' => true, 'config' => ['label' => [...]], 'customFields' => [['name' => 'swag_example_size', 'type' => CustomFieldTypes::INT, 'includeInSearch' => true, 'config' => ['label' => [...], 'customFieldPosition' => 1]]]]], $context);` \u2014 you need to relate the set to the product entity so it shows up there (via the set's `relations`). Custom field names should carry a vendor prefix (e.g. `swag`) since names are global. Since Shopware 6.7.13.0 you can alternatively declare the set declaratively by shipping a `Resources/config/custom-fields.xml` file in the plugin; Shopware then syncs the defined sets on install/update and removes them on uninstall, without needing a `CustomFieldsInstaller` service. Setting `global` to `false` makes the set deletable/editable directly in the Administration UI. If you also build a custom Administration module and want to render/edit these fields there yourself, use the built-in `sw-custom-field-set-renderer` component: pass it the loaded entity and the custom field sets (`:entity=\"customEntity\" :sets=\"sets\"`), and in the component's index.js create the `custom_field_set` repository via `this.repositoryFactory.create('custom_field_set')`, build a `Criteria` filtered with `Criteria.equals('relations.entityName', 'product')` and sorted by `config.customFieldPosition`, then search it with `this.customFieldSetRepository.search(criteria, Shopware.Context.api)` to load the sets. Sources: https://developer.shopware.com/docs/guides/plugins/plugins/framework/custom-field/add-custom-field.html and https://developer.shopware.com/docs/guides/plugins/plugins/administration/data-handling-processing/using-custom-fields.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/custom-field/add-custom-field.md:1-90", "platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-custom-fields.md:1-48"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "custom field set product", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "custom field", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/custom-field/add-custom-field.md"}}, {"tool": "grep_docs", "args": {"pattern": "custom field set", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-custom-fields.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-10": {"query": "How do I write an indexer that precomputes derived data for my custom entity on write, and how do I trigger a full reindex?", "category": "dev", "option": "mcp-wiki", "answer": "Data indexers optimize recurring, complex calculations (e.g. a product's `cheapest_price`) by computing them once whenever the entity is written via the DAL, instead of recalculating on every read. Prefer subscribing to an existing indexer's dispatched event instead of writing a new one when the target entity already has an indexer (`CustomerIndexer`, `CategoryIndexer`, `LandingPageIndexer`, `ProductIndexer`, `ProductStreamIndexer`, `PromotionIndexer`, `RuleIndexer`, `MediaIndexer`, `MediaFolderIndexer`, `MediaFolderConfigurationIndexer`, `SalesChannelIndexer`, `BreadcrumpIndexer`). For a custom entity, create a class extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Indexing\\EntityIndexer` and register it tagged `shopware.entity_indexer`, implementing: `getName()` (a unique name \u2014 `EntityIndexerRegistry` routes messages by it), `iterate($offset): ?EntityIndexingMessage` (drives a full reindex, using `IteratorFactory::createIterator($definition, $offset)` to page through IDs), `update(EntityWrittenContainerEvent $event): ?EntityIndexingMessage` (reacts to DAL writes, extracting changed primary keys via `$event->getPrimaryKeys(SomeDefinition::ENTITY_NAME)` \u2014 filter entities/columns as much as possible here for performance), and `handle(EntityIndexingMessage $message): void` (does the actual precomputation work). By default messages produced from `update()` are handled synchronously; pass `$forceQueue = true` as `EntityIndexingMessage`'s fourth constructor argument to process them asynchronously over the message queue instead. To trigger a full reindex, run `bin/console dal:refresh:index` (this calls each registered indexer's `iterate()`), or trigger an index rebuild from the Administration. Gotchas: writing data through the DAL from inside `handle()` re-triggers `EntityWrittenContainerEvent`, which can cause the same indexer to loop infinitely \u2014 use the injected `Connection` directly instead, or if the DAL must be used, disable indexing on the context first with `$context->addState(EntityIndexerRegistry::DISABLE_INDEXING);`. Source: https://developer.shopware.com/docs/guides/plugins/plugins/framework/data-handling/add-data-indexer.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-indexer.md:1-66"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "EntityIndexer", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-indexer.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-60": {"query": "Which transports do my Shopware message queue workers have to consume in production, and how do I turn off the admin worker?", "category": "dev", "option": "mcp-wiki", "answer": "Shopware processes async tasks via Symfony Messenger; by default messages are stored in the database and worked off via the browser (the 'admin worker') while a user is logged into the Administration, but the admin worker is not recommended in production since it only runs while someone is logged in and can cause high CPU load with multiple concurrent admin users. Instead, run one or more CLI workers, e.g.: `bin/console messenger:consume async --time-limit=60 --memory-limit=128M` and `bin/console messenger:consume async low_priority` \u2014 i.e. the standard transports to consume are `async` and `low_priority`. A CLI worker must also be set up for the failed queue, otherwise failed messages are never processed (failed messages are retried automatically 3 times, then deleted, via the Doctrine-backed failed transport configured with `MESSENGER_TRANSPORT_FAILURE_DSN`). To turn off the admin worker once CLI workers are running, set in `config/packages/shopware.yaml`: `shopware: admin_worker: enable_admin_worker: false`. If the admin worker is still used, it can be tuned with `poll_interval` and `transports` (e.g. `transports: [\"async\", \"low_priority\"]`). Note: cron jobs don't cap the maximum number of workers the way supervisor/systemd can, so overlapping long-running messages risk starting an unwanted number of workers. Source: https://developer.shopware.com/docs/guides/hosting/infrastructure/message-queue.html", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/message-queue.md:1-94"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "admin worker", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/infrastructure/message-queue.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-09": {"query": "Where do I configure Business Events so that a mail is sent when an order is placed in Shopware 6.7?", "category": "edge", "option": "mcp-wiki", "answer": "In Shopware 6.7, Business Events are configured under Settings > Shop > Business Events, but this feature is legacy: it was superseded by the Flow Builder as of major release 6.4.8.0, and Business Events remain in use only for the B2B-Suite \u2014 for everything else (including a plain 'send mail on order placed' rule) you should use the Flow Builder instead. If you are still using Business Events (B2B-Suite scenario), click 'Add Business-Event', set a Title, mark it Active, choose the triggering Event 'Order placed' (technical name `checkout.order.placed`), pick the Email template to send, and optionally scope it to a Sales Channel and/or restrict it with Rule Builder rules. Note that if you fill in internal 'Email recipients' on that event, the customer will no longer automatically receive the mail \u2014 you would need a second, otherwise identical event to also notify the customer while separately notifying internal recipients.", "citations": ["platform/func/settings/Business-Events.md:1-42"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "Business Event", "path": "platform/func", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "business event", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/Business-Events.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-70": {"query": "How do I implement a payment method in an app with `pay-url` and `finalize-url`, and what must the app server return in Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "Since 6.4.1.0, apps integrate payment providers by defining payment methods in the manifest and exposing signed JSON endpoints for the different payment stages (pay, finalize, validate, refund, recurring capture). Whether `finalize-url` is present distinguishes an asynchronous method from a synchronous one; omitting `pay-url` leaves the transaction open with no app communication, and the app server must be reachable from Shopware (e.g. via a tunneling service during development).\n\n- **Synchronous**: if only `pay-url` is set, Shopware calls it and expects a JSON response with a `status` (and optional `message` on failure).\n- **Asynchronous**: Shopware `POST`s to `pay-url` with `order`, `orderTransaction`, and a `returnUrl`; the app responds with a `redirectUrl` so the customer is sent to the payment provider. After the provider redirects the customer back, Shopware `POST`s to `finalize-url` with `orderTransaction` plus the provider's query parameters, and the app again responds with `status`/`message`.\n\nResponse envelope (fields vary by stage): `{\"status\": \"authorize\", \"message\": \"optional failure reason\"}`. Payment states include `open`, `paid`, `cancelled`, `refunded`, `failed`, `authorize`, `unconfirmed`, `in_progress`, `reminded`, `chargeback`.\n\nOn the App PHP SDK: resolve the shop, assemble the stage-specific context, and sign the response, e.g.\n```php\n$shop = $shopResolver->resolveShop($serverRequest);\n$payment = $contextResolver->assemblePaymentPay($serverRequest, $shop);\nreturn $signer->signResponse(PaymentResponse::paid(), $shop);\n```\nThe Symfony Bundle instead type-hints the action class as a controller argument (`PaymentPayAction`, `PaymentCaptureAction`, `PaymentValidateAction`, `PaymentFinalizeAction`) and returns the `PaymentResponse`/`RefundResponse` directly.\n\nGotchas: never change a payment method's manifest identifier after release, or Shopware creates a new payment method instead of reusing it. From 6.7.0.0 onward, the app server must respond with a payment state whenever it intends to change the transaction state.", "citations": ["platform/dev/6.7/guides/plugins/apps/checkout/payment.md:1-66"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "pay-url|finalize-url", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "payUrl|finalizeUrl|payment method", "path": "platform/dev/6.7/guides/plugins/apps", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "payment", "path": "platform/dev/6.7/guides/plugins/apps", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/plugins/apps", "depth": 2}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/checkout/payment.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-06": {"query": "Which triggers and actions does the Flow Builder offer, and how do I make it send a mail when an order is placed?", "category": "func", "option": "mcp-wiki", "answer": "The Flow Builder (Settings > Automation > Flow Builder) automates business processes by combining an event trigger, optional Rule Builder conditions, and one or more actions. A new flow is created via Add Flow, configured on a General tab (Name, Description, Priority \u2014 the processing order when several flows share a trigger, Active) and a Flow tab where you pick the trigger and then add conditions/actions via the plus symbol. Example trigger names include checkout.order.placed, checkout.customer.register, state_enter.order.state.completed, state_leave.order_transaction.state.paid, newsletter.register, checkout.order.payment_method.changed, and mail.before.send. Conditions use Rule Builder rules and branch True/False, letting further conditions or actions be chained on either branch. Available actions (their availability depends on the chosen trigger) include: Assign account status, Assign affiliate and campaign code (with an override option), Assign customer group, Generate a document, Send mail (to Administrator \u2014 which reaches every admin-flagged user including external API users, to the Customer, or to custom addresses), Assign status (payment/shipping/order status, with interdependent rules \u2014 e.g. Refunded/Partially Refunded/Chargeback require a prior Paid/Partially Paid status), Stop flow (halts the whole flow including parallel branches), Set download access, Change custom field content (customer or order), and Add Tag/Remove Tag. Delayed Actions (Shopware Beyond plan) can postpone an action by an Hour/Day/Week/Month/User-defined delay. Webhook Actions (Evolve plan plus Shopware Commercial) add a Call URL action supporting GET/POST/PUT/PATCH/DELETE with parameters, headers, body and Basic Auth. To send a mail when an order is placed: create a new flow, set the trigger to checkout.order.placed, optionally add a Rule Builder condition to narrow when it fires, then add the Send mail action and choose the recipient (Administrator, Customer, or a custom address) and the mail template to use.", "citations": ["platform/func/settings/Flow-Builder.md:1-52"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "flow builder", "path": "platform/func", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/Flow-Builder.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-08": {"query": "How do I set up a Nuxt project with Shopware Composable Frontends against my shop's Store API \u2014 endpoint, access token, and why do I get HTTP 412?", "category": "gap", "option": "mcp-wiki", "answer": "The wiki has no getting-started guide for the Composable Frontends Nuxt SDK itself (project scaffolding, `.env` Store API endpoint/access-token configuration, or an explanation of an HTTP 412 error). What exists under 'Composable Frontends' in this corpus is only the Shopware PaaS Native deployment guide, which covers deploying an already-built Node.js frontend as a `kind: cfe` application (Node version, `application.yaml`, `/api/healthz`, read-only filesystem, Fastly/ISR cache headers) \u2014 not how to build or configure the Nuxt app against the Store API. Separately, the Store API concept page confirms that 'Shopware provides Composable Frontends as a headless frontend implementation based on the Store API,' and that the Store API supports both anonymous and authenticated customers, but gives no endpoint-configuration or access-token detail (that is deferred to the Store API Stoplight reference, an external link). I found no mention anywhere in the corpus of an HTTP 412 status code in this context. This is a genuine gap: the corpus cannot answer the Nuxt setup, endpoint/access-token configuration, or 412 troubleshooting parts of this question.", "citations": ["platform/dev/6.7/products/paas/shopware/composable-frontends/_index.md:1-68", "platform/dev/6.7/concepts/api/store-api.md:1-29"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "Composable Frontend", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "412", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/products/paas/shopware/composable-frontends/_index.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/concepts/api/store-api.md"}}, {"tool": "grep_docs", "args": {"pattern": "sw-access-key|access token", "path": "platform/dev/6.7", "regex": true, "
