"administration\", \"scopes\": \"write\", \"username\": \"admin\", \"password\": \"shopware\"}` (the default Administration credentials). Both grant types return an access token valid for `shopware.api.access_token_ttl`, whose default is PT10M (600 seconds) \u2014 the same TTL applies to every grant type, contrary to an outdated docs example showing 3600s. The password-grant response additionally includes a refresh_token, valid P1W (one week) by default. Send the access_token as a bearer token in the Authorization header for subsequent requests.", "citations": ["platform/dev/6.7/guides/development/integrations-api/_index.md:1-67", "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md:1-85"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "client_credentials", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/integrations-api/_index.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-65": {"query": "What can I put in the JSON body of `POST /api/search/{entity}` for filtering, associations, sorting, aggregations and getting an exact total count?", "category": "dev", "option": "mcp-wiki", "answer": "The JSON body is a search 'criteria' payload parsed server-side by RequestCriteriaBuilder into a DAL Criteria object. Top-level keys: `associations` (load related entities; key = association property, value = nested criteria with its own limit/filter/sort/...), `includes` (restrict output fields per apiAlias, e.g. `\"product\": [\"id\",\"name\"]`), `ids` (limit search to a list of IDs), `total-count-mode` (`0`/`none` = no count [default], `1`/`exact` = exact total via an extra COUNT(*) query, `2`/`next-pages` = just enough to know if there's a next page), `page`/`limit` (pagination, page is 1-indexed), `filter` (filters both result and aggregations, using DAL filter types), `post-filter` (filters the result but not aggregations, for facets), `query` (weighted queries: each entry has `score` + `query`, summed into `extensions.search._score`), `term` (text search over fields flagged SearchRanking \u2014 do not combine with `query`), `sort` (list of `{field, order, naturalSorting, type}`; `type: \"count\"` sorts by association count, added in 6.4.12.0), `aggregations` (on-the-fly DAL aggregations), and `grouping` (fields to group records by). Example skeleton: `{\"page\":1,\"limit\":10,\"total-count-mode\":1,\"associations\":{\"manufacturer\":{}},\"filter\":[{\"type\":\"multi\",\"operator\":\"and\",\"queries\":[{\"type\":\"equals\",\"field\":\"active\",\"value\":true}]}],\"sort\":[{\"field\":\"name\",\"order\":\"ASC\",\"naturalSorting\":true}],\"aggregations\":[{\"name\":\"average-price\",\"type\":\"avg\",\"field\":\"price\"}]}`. For exact total counts use `total-count-mode: 1` (or the string `exact`), noting it's the expensive option since it runs an additional count query; when filtering nested values also request that path in `associations`. The builder also supports undocumented `excludes` and `fields` keys.", "citations": ["platform/dev/6.7/guides/development/integrations-api/search-criteria.md:1-90"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/integrations-api/search-criteria.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-66": {"query": "Which request headers change Admin API behaviour for language, entity version, parent-child inheritance and skipping flow triggers during a bulk import?", "category": "dev", "option": "mcp-wiki", "answer": "`sw-language-id` (PlatformRequest::HEADER_LANGUAGE_ID) returns entities in the given language instead of the system language. `sw-version-id` (HEADER_VERSION_ID) reads a specific entity version (e.g. orders); the default is the most recent record. `sw-inheritance` (HEADER_INHERITANCE) makes the API consider parent-child inheritance for products/variants \u2014 send `1`. `sw-skip-trigger-flow` (HEADER_SKIP_TRIGGER_FLOW) suppresses flow triggering, e.g. for `POST /api/_action/sync` bulk imports \u2014 send `1`. Example: `POST /api/search/product` with headers `sw-language-id: <language-id>` and `sw-inheritance: 1`.", "citations": ["platform/dev/6.7/guides/development/integrations-api/request-headers.md:1-69"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/integrations-api/request-headers.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-67": {"query": "What does a minimal app folder and `manifest.xml` need to contain, and which console commands install and activate the app on my local Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "Create the app under `custom/apps/<Name>/manifest.xml` (`shopware.app_dir` resolves to `%kernel.project_dir%/custom/apps`), where `<Name>` (the folder name) must match `<meta><name>` inside the manifest. A minimal manifest needs a `<meta>` block against schema manifest-3.0.xsd with `name`, `label`, `description`, `author`, `copyright`, `version`, `icon` and `license`; `author` and `copyright` are required (Metadata::REQUIRED_FIELDS also lists `label`, `name`, `license`, `version`) \u2014 app:refresh fails if they're missing or empty. Example: `<manifest xsi:noNamespaceSchemaLocation=\"...manifest-3.0.xsd\"><meta><name>MyExampleApp<\/name><label>Label<\/label><description>...<\/description><author>...<\/author><copyright>...<\/copyright><version>1.0.0<\/version><icon>Resources/config/plugin.png<\/icon><license>MIT<\/license><\/meta><\/manifest>`. Then, from the project root/PHP container: run `bin/console app:refresh` (alias `app:update`) to register it, fixing any validation errors it reports; then `bin/console app:install --activate MyExampleApp` (short form `-a`) to install and activate by technical name (not path) \u2014 installing without `--activate` leaves it inactive, and you can activate later via Extensions > My Extensions > Apps or `bin/console app:activate MyExampleApp`. Verify with `bin/console app:list`, and clear caches with `bin/console cache:clear` if changes don't show. `bin/console app:validate` reports configuration issues, and `--no-validate` (debugging only) skips manifest validation on install; `app:install` also asks interactively to accept requested permissions/hosts unless `--force`/`-f` is passed.", "citations": ["platform/dev/6.7/guides/plugins/apps/app-base-guide.md:1-78"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "manifest.xml", "path": "platform/hubs/apps.md"}}, {"tool": "grep_docs", "args": {"pattern": "app:install", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/app-base-guide.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-68": {"query": "How does the registration handshake between Shopware and my app backend work \u2014 shop id, proof, shop secret and the confirmation call?", "category": "dev", "option": "mcp-wiki", "answer": "1) Registration request: Shopware sends a GET to the manifest's registration URL with query parameters shop-id, shop-url, timestamp; headers include shopware-app-signature (HMAC-SHA256 of the query string using the app secret) and sw-version, plus shopware-shop-signature on re-registration (query signed with the current shop secret). Verify it server-side with hash_hmac('sha256', $queryString, $appSecret). The app secret comes from the Shopware Account, or for local dev/private apps with an external server can be set as <secret> in the manifest (store apps cannot do this). 2) Registration response: the app server replies with a proof computed as hash_hmac('sha256', shop-id . shop-url . appName, $appSecret), a new shop-secret, and a confirmation_url, e.g. `{\"proof\": \"...\", \"secret\": \"<new shop-secret>\", \"confirmation_url\": \"https://my.example.com/registration/confirm\"}` (return `{\"error\": \"...\"}` to abort installation). The shop-secret should be unique per shop and 64-255 characters, stored keyed by shopId and shopUrl; registration fails if the returned secret equals the current app secret. 3) Confirmation request: Shopware POSTs to confirmation_url a JSON body with apiKey, secretKey, timestamp, shopUrl, shopId, signed via header shopware-shop-signature (HMAC-SHA256 of the body with the new shop-secret); on re-registration it also sends shopware-shop-signature-previous (the previous secret). The apiKey/secretKey pair is then used as client_id/client_secret for Admin API OAuth. 4) Secret rotation / shop-url change: when a shop re-registers with a known shop ID, validate both signatures, return a new secret, and activate the new secret/URL only after a valid confirmation \u2014 accepting the old secret for a short grace period (e.g. 1 minute). If APP_URL changes so the shop ID no longer matches, resolve via the Administration modal or `bin/console app:shop-id:change [strategy]` (move-shop-permanently / reinstall-apps / uninstall-apps).", "citations": ["platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md:1-83"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/lifecycle/app-registration-setup.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-69": {"query": "How does an app subscribe to an event like `product.written`, what does Shopware POST to the webhook URL, and how do I verify the request is genuine?", "category": "dev", "option": "mcp-wiki", "answer": "Declare the webhook in manifest.xml: `<webhooks><webhook name=\"product-changed\" url=\"https://example.com/event/product-changed\" event=\"product.written\"/><\/webhooks>` \u2014 attributes name, url and event are required; the optional onlyLiveVersion (default false, since 6.5.7.0) filters HookableEntityWrittenEvent payloads to only the live version, skipping the webhook entirely if all versioned entries are non-live. When the event fires, Shopware POSTs a signed JSON body: `{\"data\": {\"payload\": [{\"entity\": \"product\", \"operation\": \"...\", \"primaryKey\": \"...\", \"updatedFields\": []}], \"event\": \"product.written\"}, \"source\": {\"url\": \"...\", \"appVersion\": \"...\", \"shopId\": \"...\", \"eventId\": \"...\"}, \"timestamp\": 123123123}`. entity.written payloads carry only entity/operation/primaryKey/updatedFields (plus versionId when written) \u2014 never full entity data (updatedFields is omitted for deletes, despite an older doc sample) \u2014 so fetch full data via the API using source.url. source.eventId (since 6.4.11.0) is stable across retries for dedup, and timestamp can be used for replay protection. To verify authenticity, check the `shopware-shop-signature` header, an HMAC-SHA256 of the request body computed with the shop's app secret (same mechanism as the registration confirmation request). Additional headers sw-version (since 6.4.1.0) and sw-context-language/sw-user-language (since 6.4.5.0) are also sent. Written-event webhooks are only delivered if the app holds read permission on that entity; deactivated apps receive only app lifecycle events. Handle it with the App PHP SDK (ShopResolver::resolveShop(), ContextResolver::assembleWebhook()) or, in the Symfony bundle, by type-hinting Shopware\\\\App\\\\SDK\\\\Context\\\\Webhook\\\\WebhookAction in a controller.", "citations": ["platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md:1-80"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/lifecycle/webhook.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-70": {"query": "How do I implement a payment method in an app with `pay-url` and `finalize-url`, and what must the app server return in Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "Declare the payment method under `<payments><payment-method>` in manifest.xml with a stable `<identifier>` (never change it after release \u2014 a new identifier creates a new payment method) plus `<name>`, `<description>`, `<pay-url>`, `<finalize-url>`, `<validate-url>`, `<refund-url>`, `<recurring-url>`, `<icon>`. All URL elements are optional: no pay-url leaves the transaction open; pay-url alone is synchronous; pay-url plus finalize-url makes it asynchronous (redirect flow). For asynchronous pay, Shopware POSTs to pay-url a body including `source` (url, shopId, appVersion), `orderTransaction`, `order`, `requestData`, and `returnUrl`; the app server must respond `{\"redirectUrl\": \"...\"}` to send the shopper to the payment provider. After the shopper returns to returnUrl, Shopware POSTs to finalize-url with `orderTransaction` and `requestData` (the provider's query params, with `_sw_payment_token` stripped); the app server must respond with a `status` such as `paid`, `authorize`, `fail`, or `cancel` \u2014 since 6.7.0.0 an empty status leaves the transaction state unchanged. That `status` value is passed directly as a transition action to the order_transaction state machine (e.g. paid, paid_partially, authorize, process, fail, cancel, remind, chargeback, reopen) \u2014 it is an action name, not a payment-state name. Any non-empty `message` in the response makes core treat the payment as failed/interrupted even alongside a success status; `status: cancel` throws a customer-canceled exception. Payment requests to the app server time out after 20 seconds. Note: capture-url is deprecated as of manifest v3.0/6.7 \u2014 do capture logic inside pay-url instead.", "citations": ["platform/dev/6.7/guides/plugins/apps/checkout/payment.md:1-85"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "pay-url", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/checkout/payment.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-71": {"query": "How does an app define its own custom entities in Shopware 6.7 and read them back through the API?", "category": "dev", "option": "mcp-wiki", "answer": "An app declares custom entities in its own `Resources/entities.xml` file, validated against the `entity-1.0.xsd` schema. Each `<entity>` element's `name` must start with the `custom_entity_` prefix (or the shorthand `ce_`, available since 6.4.15.0, which avoids DB name-length limits) \u2014 other names are rejected. Fields are declared inside `<fields>` with types such as `int`, `float`, `string`, `text`, `bool`, `many-to-many`, `many-to-one`, `one-to-many`, `one-to-one`, `json`, `email`, `price`, `date`; the `store-api-aware` attribute is required on each field, while `required` and `translatable` default to false. Shopware auto-generates a database table, a repository service (id `<entity name>.repository`), and an Admin API for the entity \u2014 it can also be managed in the Administration. To read the data back: from app scripts, use the auto-registered repository, e.g. `services.repository.search('custom_entity_blog', criteria)` (Twig); via the Admin API, call `POST /api/search/custom-entity-{entityName}` with the entity name's underscores hyphenated (e.g. `/api/search/custom-entity-blog`), or `POST /api/search/ce-{entityName}` for shorthand entities \u2014 the repository call itself still uses the underscore form (`'ce_blog'`). Optionally, adding `custom-fields-aware=\"true\"` and `label-property=\"name\"` (the named field must be of type string) to `<entity>` makes the custom entity selectable in an 'Entity Select' custom field (since 6.5.1.0); an admin snippet should then be added so the entity type isn't shown as a raw label key. Associations to core entities (e.g. `product`) additionally require matching `<permissions>` entries in the app's `manifest.xml`. Gotchas: existing custom entities cannot be renamed (renaming deletes existing data), and if the shorthand `ce_` prefix is used in the definition it must be used consistently in repository and API calls too.", "citations": ["platform/dev/6.7/guides/plugins/apps/custom-data/custom-entities.md:1-77"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "custom entit", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/apps/custom-data/custom-entities.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-01": {"query": "How do I create a product with variants and configure its visibility per sales channel, and why might it not show up in the storefront?", "category": "func", "option": "mcp-wiki", "answer": "In the product create/edit mask, before the first save you must fill in Name, Product number, Tax rate, Price (gross and net) and Stock; after saving, additional tabs become available including Specifications, Extended Prices, Variants, Layout, SEO and Cross Selling. Variants are generated from Properties via the Variant Generator: select the property values to combine, optionally set price surcharges per value, and use 'Value exclusion' to prevent specific combinations from being generated; bulk edit of generated variants supports Overwrite/Clear/Add/Remove per field block, up to 1000 variants at once (though the cover image cannot be set via bulk edit, and updating the gross price via bulk edit does not update the net price). Visibility & structure settings on the product control storefront display per sales channel: you assign the product to one or more Sales channels, toggle 'Active for all selected sales channels', assign Categories, and set extended visibility to Visible / hide in listing / hide in listing and search; Tags and Search keywords are also configured here. A product may fail to show up in the storefront for several reasons visible in this configuration: it is not assigned to (or not marked active for) the relevant sales channel, it lacks a category assignment used for storefront navigation, or its extended visibility is set to hide it from listing/search. In the product list overview (Catalogues > Products), products with variants show an extra icon before the name that opens a modal listing all variants for inline or extended editing.", "citations": ["platform/func/catalogues/products.md:1-51", "platform/func/catalogues/product-overview.md:1-39"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "variant", "path": "platform/func", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "visibility", "path": "platform/func", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/catalogues/products.md"}}, {"tool": "read_doc", "args": {"path": "platform/func/catalogues/product-overview.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-02": {"query": "How do Rule Builder conditions work for shipping and payment methods?", "category": "func", "option": "mcp-wiki", "answer": "Shopware's Rule Builder (Settings > Automation > Rule Builder) lets merchants build reusable rules made of conditions and operators; these rules are what govern, among other things, the availability of payment and shipping methods. A rule has general information (Name, Description, Priority, Type, Tags) plus a set of Conditions, which can be joined with AND (all must match) or OR (any must match) \u2014 switching the connector automatically nests the existing conditions as a subcondition. Each condition needs an operator and an input value; some conditions also accept an optional filter (shown via a filter icon) to further narrow the input, e.g. limiting a subtotal condition to a category or tag. On a payment or shipping method, the rule is attached as an 'Availability rule' \u2014 if left blank/NULL, the method is available without restriction. The Rule Builder's Assignments tab lists every place a given rule is already used or can be used, including payment/shipping method availability and shipping cost calculation, though it is read-only navigation rather than an assignment tool. Preview mode (Rise plan and higher) can evaluate a rule's conditions in real time against a chosen order, showing TRUE/FALSE per condition, and even simulate a specific point in time. Two gotchas: the 'Item available' condition changed meaning in 6.6 (it now mirrors stock directly rather than stock minus unshipped sold items \u2014 use 'Item in stock' from 6.6 onward), and a rule that is still assigned somewhere cannot be deleted. Separately, for a payment method to actually appear in the storefront it must both be Active and be assigned in the relevant sales channel's payment settings \u2014 being active alone is not enough.", "citations": ["platform/func/settings/rules.md:1-52", "platform/func/settings/Paymentmethods.md:1-47"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/func/settings/rules.md"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/Paymentmethods.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-03": {"query": "How do promotions and discount codes work, including individually generated codes?", "category": "func", "option": "mcp-wiki", "answer": "The Promotions module (Marketing > Promotions) lets a merchant create discount actions for sales channels, restrict them with rules, and limit them to a time frame. Clicking 'Create action' and saving unlocks further tabs: General (Name, Priority \u2014 higher priority applies first when several rules match, Valid from/Valid until, Max. total uses, Max. uses per customer, Active), Promotion codes, Conditions and Discounts. In the Promotion codes tab you choose one of: 'No promotional code required', a single Fixed promotion code (custom or system-generated random), or Individual promotion codes generated per order via 'generate codes'/'add codes' \u2014 individual codes are single-use, and only one individual code from a promotion can be redeemed per order at a time; regenerating codes invalidates the previously generated ones. Custom code patterns use `%s` for a random letter (A-Z) and `%d` for a random digit (0-9), e.g. `SW-%s%d%s%d%s-TEST`. Conditions restrict the promotion by sales channel, 'Prevent combination with other promotions', an explicit 'Do not combine with' exclusion list, and Rule-Builder-based rules across customer rules, shopping cart rules, order rules and product sets (a set group defined by Mode \u2014 Number/Value(Gross)/Value(Net) \u2014, Value, Sorting and Product rules); if several rules of the same type are selected, only one needs to match. Discounts define what the promotion applies to (entire cart, shipping costs, entire product set, or a specific set group), optionally restricted to a specific range of products, a discount Type (absolute, percentage, fixed price, or fixed unit price), a Value, and an optional Maximum discount value for percentage discounts \u2014 discount settings cannot be changed once the promotion has been used in an order. In the storefront, customers enter the code in the 'Enter voucher code' field of the OffCanvas or full shopping cart and confirm; the discount then appears in the article overview. Redeemed codes can be looked up per order from the promotion's Redeemed list, or by filtering the order overview on the promotion code field.", "citations": ["platform/func/marketing/promotions.md:1-54"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "promotion", "path": "platform/func", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/marketing/promotions.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-04": {"query": "What does the Shopware Migration Assistant transfer automatically from Shopware 5, and what has to be mapped by hand before the migration starts?", "category": "func", "option": "mcp-wiki", "answer": "Automatically migrated data groups from Shopware 5 to Shopware 6 are: Basic data (categories, customer groups, currencies, sales channels, number ranges \u2014 mandatory), Products (products, properties, product options/properties, translations, cross-selling, main variant relations), Customers & orders (customers, shipping methods, orders, order documents), Promotions (customers, promotions), SEO URLs, and Product reviews (plus media). Manual mapping is required, before the migration starts, for payment methods, a Standard Payment Method, Salutation, Delivery time, and a Standard delivery time \u2014 these must already exist as entries in Shopware 6 before migrating, and once mapped they cannot be remapped without deleting and recreating the whole migration. Several things cannot be transferred automatically at all and must be recreated by hand afterwards: shipping costs, payment methods, document templates and email templates (email templates use Twig) cannot be transferred; shopping worlds/shop pages must be rebuilt under Shopping Experiences due to a different technical structure; old Shopware 5 templates cannot be reused (Shopware 6 ships its own default template as a starting basis); and B2B Suite data cannot be transferred from Shopware 5 to Shopware 6 at all. Also note that two default sales channels already exist on a fresh Shopware 6 install alongside the migrated Shopware 5 shops/subshops, and the domain settings of newly created sales channels must be adjusted to see the migrated data in the storefront.", "citations": ["platform/func/migration-en/what-is-migrated.md:1-42"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "promotion", "path": "platform/func", "mode": "files", "note": "reused from func-03 discovery, list included migration-en/what-is-migrated.md"}}, {"tool": "read_doc", "args": {"path": "platform/func/migration-en/what-is-migrated.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-05": {"query": "How do I set up a sales channel \u2014 storefront versus headless type, domains, languages and currencies \u2014 and where do I get its API access key?", "category": "func", "option": "mcp-wiki", "answer": "A sales channel connects a Shopware store to a distribution channel \u2014 the storefront, comparison portals, social shopping integrations, or a headless API-only channel \u2014 and is created/managed from the Sales Channel menu item in the Administration. To add one, click the plus icon next to Sales Channel and choose between an HTML storefront channel, a headless (API-only) channel, or a product comparison export. General settings cover Name, Mark as favourite, Entry point main/footer/service navigation, Navigation levels, the default Customer group for new/anonymous visitors, Countries, Languages, and Standard units of measurement. Payment and shipping settings let you pick the available payment methods and shipping methods (each with a default), the available currencies (with a default), and the tax calculation method. Domains are configured per sales channel: on self-hosted instances each domain gets its own URL, language, currency, snippet set and unit system, added via 'Add Domain'; on cloud instances a default URL is auto-generated and custom domains are added the same way after being registered under Settings > System > Domains \u2014 a domain should be stored with only one protocol (https or http) to avoid duplicate content, and proxy setups need the proxy IP recorded via the `TRUSTED_PROXIES` env entry in `.env`. Hreflang settings mark language versions for search engines and require selecting a default domain as fallback. The API access key/ID is generated under the sales channel's API access section, which produces an API Access ID for that channel. A Status section lets you disable the channel temporarily or enable maintenance mode (with IP whitelisting), and Analytics settings integrate Google Analytics 4 via a Measurement/Tracking ID. One gotcha: the preinstalled Headless sales channel should never be deleted since extensions such as the B2B Suite depend on it \u2014 hide it instead by marking other channels as favourites.", "citations": ["platform/func/settings/saleschannel.md:1-46"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "sales channel", "path": "platform/func", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/func", "glob": "**/*sales-channel*"}}, {"tool": "list_docs", "args": {"path": "platform/func/settings"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/saleschannel.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-06": {"query": "Which triggers and actions does the Flow Builder offer, and how do I make it send a mail when an order is placed?", "category": "func", "option": "mcp-wiki", "answer": "Flow Builder, under Settings > Automation, lets merchants automate business processes without programming: a trigger fires on a Shopware event, optional conditions built with the Rule Builder narrow when it applies, and one or more actions are then executed. Example triggers (technical names) include `checkout.order.placed`, `checkout.customer.register`, `checkout.customer.login`, `state_enter.order.state.completed`, `mail.before.send`, and `newsletter.register`; a Custom Trigger feature (since 6.5.3.0) also lets apps register their own triggers. Available actions include: Assign account status, Assign affiliate/campaign code, Assign customer group, Generate a document, Send mail, Assign status (payment/shipping/order), Stop flow, Set download access, Change custom field content, Add Tag/Remove Tag, and \u2014 on the Evolve plan with the Shopware Commercial extension \u2014 a Call URL (Webhook) action supporting GET/POST/PUT/PATCH/DELETE with configurable URL, parameters, headers, body and Basic Auth. Delayed Actions (Beyond plan) let an action fire after a configurable delay. To send a mail when an order is placed: create a new flow (Settings > Automation > Flow Builder), fill in the General tab (Name, Description, Priority, Active), then on the Flow tab select the `checkout.order.placed` trigger, optionally add Rule-Builder conditions to narrow when it fires, and add the 'Send mail' action (configuring the mail template and recipient). One gotcha: if 'Administrator' is selected as the mail recipient, all users flagged as admin receive the email, including external users using an admin account for API access.", "citations": ["platform/func/settings/Flow-Builder.md:1-57"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/func/settings/Flow-Builder.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-07": {"query": "How do I import products from a CSV with an import/export profile \u2014 column mapping, matching identifiers and a dry run?", "category": "func", "option": "mcp-wiki", "answer": "The Import/Export module (Settings > Automation > Import/Export) imports and exports Shopware 6 data, including products, via CSV files and configurable profiles. CSV preparation requirements: UTF-8 encoding, semicolon field separator, quotation-mark string separator, and decimal prices always with a point (e.g. `5.00`, not `5,00`). Profiles are managed in the Profiles tab: creating a new profile requires a Profile name, Usage (import/export/both), Object type (e.g. Product), Separator character (default semicolon), Enclosure character, and Import settings (Create new records / Update existing data). Column mapping is done row by row with 'Add new mapping', each row specifying a Database mapping, whether it is Required, a Default Value, and Position. For matching identifiers, a profile's Advanced Settings tab offers a 'Second Unique Identifier' that lets you map import rows by a chosen field (e.g. `productNumber`) instead of the row's UUID \u2014 though this isn't sensible for fields that aren't unique, since if multiple products share the same value only the first matching record is identified. The mandatory fields for the Product object type are `id`, `taxId`, `productNumber`, `stock`, `name`; default product CSV columns also include `parent_id`, `active`, `description`, `price_net`, `price_gross`, `tax_rate`, `tax_name`, `cover_media_id`, `manufacturer_id`, `categories`, and `sales_channels` (multi-value fields are pipe-`|`-separated). On the Import tab the workflow is: upload the CSV file, select the profile, then either 'Start import' (validates and imports error-free records, collecting erroneous ones into a downloadable CSV with an `_error` column) or 'Start dry run' to test the import without writing any data. Import activity for the last 30 days can be reviewed, re-downloading the source/profile or an error-only CSV, and a running process can be aborted. Note that import can only add information, never remove it (e.g. an existing sales channel assignment cannot be removed via import), and before importing customers (as of 6.4.9.0) emailing should be disabled under Settings > System > Mailer to avoid sending registration emails to every imported customer.", "citations": ["platform/func/shopware-en/settings/importexport.md:1-63"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/func/shopware-en/settings/importexport.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-08": {"query": "How do custom field sets work \u2014 entity assignment, field types and technical name \u2014 and can a custom field be written through the Store API?", "category": "func", "option": "mcp-wiki", "answer": "Custom fields let merchants add their own data fields to entities such as products or categories, for use in the Rule Builder, storefront templates, or the Store API; they are managed under Settings > System > Custom fields. Custom fields are grouped into Sets, created via 'New set'; each set requires a unique technical name (cannot be changed later), a position, a label (optionally per admin language), and the program areas (entities, e.g. products, categories) the set applies to \u2014 a set with no area selected is created but stays unavailable everywhere. Within a set, 'New custom field' opens a type-specific form; common options across all field types are Technical name (required, unique, immutable), Position, 'Available in shopping carts' (needed for Rule Builder/template use), 'Modifiable via Store API' (makes the field publicly writable/readable \u2014 must not be used for sensitive data), Label, Help text, and type-specific options like Placeholder. Available field types include Select (single/multi option list), Object selection (references entities such as dynamic product group, experience world, manufacturer, category, customer, country, delivery method, product, sales channel, payment method \u2014 the referenced object type is fixed after creation), Text field, Media, Number (integer/float with Steps/Min/Maximum), Date/Time, Checkbox, Active/Inactive switch (stores 0/1), Text Editor, and Color picker. So yes \u2014 a custom field can be written through the Store API, but only if its 'Modifiable via Store API' toggle is explicitly enabled on that field, which also makes it publicly readable; it should therefore never be used for sensitive data. Custom fields can also be linked to text blocks in Shopping Experiences via that block's Data Mapping setting. Gotchas: custom fields should always be edited in the store's default language since inheritance to other languages depends on it; technical names must not contain Twig special characters such as `-` or `#` or product exports can error; and a new custom field is automatically added as a snippet in all snippet sets without any database changes needed.", "citations": ["platform/func/settings/custom-fields.md:1-45"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/func/settings/custom-fields.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-09": {"query": "Why doesn't my payment method appear in the checkout \u2014 what has to be configured in the administration?", "category": "func", "option": "mcp-wiki", "answer": "Payment methods are managed under Settings > Commerce > Payment methods, where the overview lists each method's name, active status and short description. By default, cash on delivery, invoice, prepayment and direct debit are active out of the box \u2014 but being active is not sufficient: a payment method must also be assigned in the relevant sales channel's payment settings to actually appear in that channel's storefront checkout. So if a payment method is missing from checkout, check two things in the administration: (1) that the method's Active toggle is enabled in Settings > Commerce > Payment methods, and (2) that it is selected among the available payment methods for the sales channel being used (Sales Channel > [channel] > Payment and shipping). A payment method can also be restricted further by an Availability rule (built via the Rule Builder) attached to it \u2014 if this rule's conditions aren't met for the current cart/customer/context, the method is hidden from checkout even though it is active and assigned to the channel; leaving the availability rule blank/NULL means unrestricted availability. Also note the Technical name field, a unique identifier for the payment method \u2014 changing it after it has been set can break existing payment method references, so it should be changed only once, early on for self-created methods (or left alone, waiting for a vendor update, for plugin-added methods).", "citations": ["platform/func/settings/Paymentmethods.md:1-47", "platform/func/settings/rules.md:1-52"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/func/settings/Paymentmethods.md", "note": "read earlier in this batch for func-02; reused here, no new call"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/rules.md", "note": "read earlier in this batch for func-02; reused here, no new call"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-10": {"query": "How do dynamic product groups work in the administration and where can the resulting group be used?", "category": "func", "option": "mcp-wiki", "answer": "Dynamic product groups (Administration > Catalogues > Dynamic product groups) are groups of products formed by dynamic rules. To create one, click 'create product group', set General information (Name required, Description optional, and 'Keep matching variants grouped' \u2014 when enabled variants stay grouped under a shared main product in categories/cross-selling/CMS product sliders, when disabled variants display individually). In Conditions, you pick a property and a condition, combine further conditions with AND or OR, and can nest conditions with SUB-CONDITION (the item must meet both the main condition and the sub-condition); a Preview panel shows matching products live. For multi-value properties (products, categories, manufacturers, tags, properties) the available operators are: Is equal to, Is not equal to, Is equal to any of, Is not equal to any of, Is equal to all of, Is not equal to all of. Custom fields and the product's 'delivery time' can also be used as conditions, but if a delivery time used in a condition is later removed, the condition remains but stops functioning correctly. The overview list shows name, description, last-change date, and status (a group becomes invalid if it depends on rules from a now-deactivated plugin). The resulting dynamic product group can be used for dynamic categories, product comparison feeds, and Shopping Experiences product sliders.", "citations": ["platform/func/shopware-6-de/Catalogues/Dynamicproductgroups.md:1-46"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "dynamic product group", "path": "platform/func", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/shopware-6-de/Catalogues/Dynamicproductgroups.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-11": {"query": "How do I create an integration for Admin API access in the administration and give it the right privileges?", "category": "func", "option": "mcp-wiki", "answer": "In the administration, go to Settings > System > Integrations. Click 'Create integration', assign it a name, and decide whether it should get administrator permissions or a specific, previously-defined role instead \u2014 this is how you give the integration the right privileges (roles are defined elsewhere in the system and then attached here). On creation, Shopware issues an access ID and a security key; the security key is shown only once and must be saved immediately, since it is not displayed again afterward. The overview lists integrations by name and permissions, and you can click a name to edit it or use the context menu to edit/delete it. If a key is lost or compromised, use 'Regenerate API access key' on the integration's edit screen \u2014 this regenerates both the access ID and the security key, so any client using the old credentials must be updated with the new ones.", "citations": ["platform/func/settings/system/integrationen.md:1-45"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "integration", "path": "platform/func", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/system/integrationen.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "func-12": {"query": "A spec asks for customer-specific pricing and for a flow that calls an external URL when an order is placed \u2014 before I build either of them, does Shopware already ship them, and what has to be licensed or installed for them to exist in the shop?", "category": "func", "option": "mcp-wiki", "answer": "Yes, Shopware already ships both, but both are gated behind commercial licensing/plans rather than being available in a plain open-source install. Customer Specific Pricing lets merchants offer individually calculated prices per customer (list prices, graduated prices, or currency-dependent prices), typically synced in from an external system such as an ERP; it requires the Shopware Beyond plan plus the Shopware Commercial extension, and is API-only \u2014 there is no Store extension and no dedicated Administration module, so prices can only be created, read, changed or deleted via the Admin API ('bulk edit custom prices'). Note that price inheritance used for product variants does not apply to custom prices, so each variant needs its own ID-targeted price entry, and once a customer with stored individual prices logs out, the standard price is shown again. For calling an external URL when an order is placed, Flow Builder already supports this via its 'Call URL (Webhook)' action, which can be attached to the checkout.order.placed trigger (among others) and supports GET/POST/PUT/PATCH/DELETE with configurable URL, parameters, header parameters, body, and Basic Auth \u2014 but this Webhook Actions feature requires the Evolve plan and the Shopware Commercial extension to be installed/licensed; it is not part of the base Flow Builder actions available without that license.", "citations": ["platform/func/extensions/customer-specific-pricing.md:1-38", "platform/func/settings/Flow-Builder.md:30-57"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/func/extensions/customer-specific-pricing.md"}}, {"tool": "grep_docs", "args": {"pattern": "webhook|call url|external url", "path": "platform/func", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/features/webhook-actions-in-flow-builder.md"}}, {"tool": "grep_docs", "args": {"pattern": "webhook", "path": "platform/func/settings/Flow-Builder.md"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/Flow-Builder.md", "offset": 30, "limit": 30}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-01": {"query": "How do I configure Shopware 6's built-in GraphQL API for the Store API?", "category": "edge", "option": "mcp-wiki", "answer": "Nothing relevant was found, and the premise appears false: Shopware 6 does not ship a built-in GraphQL API. A wiki-wide grep for 'GraphQL' across the entire platform layer (developer docs 6.6/6.7, functional docs, hubs, guidelines) returned zero matches, and the platform/synonyms.md alias file does not exist to check either. The dedicated Store API hub (platform/hubs/store-api.md) describes the Store API explicitly as 'Shopware's customer-facing JSON/HTTP layer for headless storefronts, SPAs and native apps: browsing, cart, checkout and account operations over routes prefixed /store-api', authenticated via the sw-access-key header \u2014 a REST-style JSON/HTTP API, not GraphQL. There is no configuration path for a GraphQL variant of the Store API in this corpus.", "citations": ["platform/hubs/store-api.md:1-56"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "GraphQL", "path": "platform", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "graphql", "path": "platform/synonyms.md"}}, {"tool": "read_doc", "args": {"path": "platform/hubs/store-api.md"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "edge-02": {"query": "How do I get the DI container with `Shopware()->Container()` and override the product listing Smarty template in Shopware 6?", "category": "edge", "option": "mcp-wiki", "answer": "Nothing matching this exists in Shopware 6 \u2014 the premise is based on Shopware 5, not Shopware 6. A wiki-wide grep for 'Smarty' and for the literal call 'Shopware()->Container()' across the whole platform layer returned zero matches. Shopware 5 used the global Shopware()->Container() legacy container and Smarty templates; Shopware 6 replaced both. Per the dependency-injection hub, Shopware 6 plugins are Symfony bundles that register services into the Symfony DI container \u2014 via PHP config (src/Resources/config/services.php with ContainerConfigurator, autowiring/autoconfigure or explicit set(), for 6.7) or the older XML form (services.xml, still valid on 6.6, deprecated in 6.7, removed in 6.8) \u2014 and services are obtained through constructor injection/autowiring, not a global Shopware()->Container() call; Administration-side services use a separate BottleJS container instead, injected into Vue components via the `inject` property or `Shopware.Application.getContainer`. For templating, Shopware 6's Storefront uses Twig, not Smarty; overriding a template (e.g. the product listing) is done by extending/overriding the relevant Twig template file in a plugin/theme, not a Smarty template.", "citations": ["platform/hubs/dependency-injection.md:1-64"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "Smarty", "path": "platform", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "Shopware\\(\\)->Container\\(\\)", "path": "platform", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/hubs/dependency-injection.md"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "partial"}, "edge-03": {"query": "Where do the `#[ORM\\Entity]` mapping attributes for my plugin's entity go in Shopware 6, and how do I get Doctrine's `EntityManager` injected into my service so I can persist it?", "category": "edge", "option": "mcp-wiki", "answer": "Shopware 6 does not use Doctrine ORM's `#[ORM\\Entity]` attribute or its `EntityManager` for plugin persistence \u2014 a wiki-wide grep for 'EntityManager' and for 'ORM\\\\Entity' across the whole platform layer returned zero matches, confirming this Doctrine ORM pattern does not apply. Shopware 6 instead has its own Data Abstraction Layer (DAL). Since Shopware 6.6.3.0 you can declare a DAL entity as a single PHP class extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity`, annotated with attributes from the `Shopware\\Core\\Framework\\DataAbstractionLayer\\Attribute\\*` namespace: `#[Entity('example_entity')]` on the class, `#[PrimaryKey]` plus `#[Field(type: FieldType::UUID, api: true)]` for the id, `#[Field(...)]` for other properties, and association attributes `#[OneToOne]`, `#[ManyToOne]`, `#[OneToMany]`, `#[ManyToMany]` for relations (with `onDelete` behaviour from the `OnDelete` enum). You register the entity by tagging it in `services.php`: `$services->set(Examples\\ExampleEntity::class)->tag('shopware.entity');` \u2014 with autoconfiguration, a class carrying the `Entity` attribute gets this tag automatically. This auto-generates the `EntityDefinition` and a repository service named `<entity_name>.repository` (plus a translation definition if any field is `translated: true`); you get that repository injected into your service (via constructor autowiring/`services.php`) and call its `upsert()`/`create()` methods to persist data \u2014 there is no separate Doctrine `EntityManager` to inject. Fields default to hidden from the API unless marked `api: true`; translated fields must be nullable.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md:1-91"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "EntityManager", "path": "platform", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "ORM\\\\Entity", "path": "platform", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "custom entity|EntityDefinition", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-04": {"query": "How do I fetch products with `GET /sales-channel-api/v3/product` on Shopware 6.7?", "category": "edge", "option": "mcp-wiki", "answer": "That exact route does not exist on Shopware 6.7 \u2014 a grep for 'sales-channel-api' across the whole platform/dev/6.7 and platform/dev/6.6 directories found no endpoint documentation using that prefix (the only two 6.7 hits are an index line and one ADR title mentioning the term in passing, not a route reference). The current, code-checked route to fetch products via the customer-facing API in 6.7 is the Store API's `GET /store-api/product` (route name `store-api.product.search`, confirmed against `vendor/shopware/core/Content/Product/SalesChannel/ProductListRoute.php:36`), not `/sales-channel-api/v3/product`. To call it: take the sales channel's 'API access key' from Administration under Sales Channels > your channel > API access, and send it in the `sw-access-key` header on a GET (or POST) request to `/store-api/product`; an empty `elements` array in the response still means the call succeeded. (Historically, Shopware's early customer-facing API was called the 'Sales Channel API' and used a `/sales-channel-api/v<n>/` prefix before it was renamed/replaced by the Store API in later 6.x releases, but the corpus's 6.6/6.7 developer docs document only `/store-api/*` as the current customer-facing endpoint \u2014 no `/sales-channel-api/v3/` route is documented for 6.7.)", "citations": ["platform/dev/6.7/guides/development/integrations-api/_index.md:1-67"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "sales-channel-api", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "sales-channel-api", "path": "platform/dev/6.7/index.md", "context": 2}}, {"tool": "grep_docs", "args": {"pattern": "sales-channel-api", "path": "platform/dev/6.6", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/concepts/api/store-api.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/integrations-api/_index.md"}}], "notFoundClaim": true, "memoryClaims": ["Historically, Shopware's early customer-facing API was called the 'Sales Channel API' and used a /sales-channel-api/v<n>/ prefix before it was renamed/replaced by the Store API in later 6.x releases."], "sourceVerdict": "partial"}, "edge-05": {"query": "How do I enable Shopware's built-in MCP server on a Shopware 6.6 shop?", "category": "edge", "option": "mcp-wiki", "answer": "You can't \u2014 the built-in MCP server does not exist on Shopware 6.6. A grep for 'MCP' across the whole platform/dev/6.6 directory returned zero matches, while platform/dev/6.7 has a full MCP Server product section. Per the 6.7 intro page's version notes, the native MCP server was introduced in Shopware 6.7.11.0 behind the `MCP_SERVER` feature flag (default false) and remains experimental until 6.8 \u2014 it is not part of 6.6 at all. On a 6.7.11.0+ shop you would enable it by setting `MCP_SERVER=1` in `.env` (the endpoint /api/_mcp returns 404 without it), ensuring `symfony/mcp-bundle` is installed, creating an integration with `bin/console integration:create \"My MCP Client\" --admin` for credentials, configuring your AI client to call `<shop-url>/api/_mcp` (or `/store-api/_mcp` for the sales-channel-facing variant) with the `sw-access-key`/`sw-secret-access-key` headers, and verifying with `bin/console debug:mcp` \u2014 but none of this is available on 6.6.", "citations": ["platform/dev/6.7/products/tools/mcp-server/intro.md:1-73", "platform/dev/6.7/products/tools/mcp-server/getting-started.md:1-73"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "MCP server", "path": "platform", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "MCP", "path": "platform/dev/6.6", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/products/tools/mcp-server/getting-started.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/products/tools/mcp-server/intro.md"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-06": {"query": "I'm coming from Magento \u2014 what are the Shopware equivalents of store views, extensions, attribute sets and `di.xml`?", "category": "edge", "option": "mcp-wiki", "answer": "The wiki has a dedicated Magento-to-Shopware migration section that covers three of these four directly. Store views: per the migration first-steps page, a Magento 'Store' migrates to a Shopware sales channel, and the store's assigned language comes from its Magento shop view (falling back to Magento's default language if no shop view exists) \u2014 so a Magento store view corresponds roughly to a sales channel's language/domain assignment in Shopware, since Shopware itself does not have a separate 'store view' concept beneath the sales channel. Extensions: per the Magento Keywords dictionary, a Magento 'Extension' maps to a Shopware Plugin, and Magento's Local Code Pool maps to Shopware's Extensions area (installed under Settings > My extensions). Attribute Sets: the same dictionary maps Magento 'Attribute Sets' to Shopware 'Custom field sets' \u2014 note Magento attributes themselves split in Shopware into either Properties (filterable info driving variants) or Custom fields depending on how they were used, and Shopware has no 'hard' product-type separation or attribute-set-per-product-type system like Magento's. `di.xml`: nothing about `di.xml` or a direct equivalent term appears in this corpus (a wiki-wide grep for 'di.xml' found no matches), so this part is answered from general knowledge only: Magento's `di.xml` (dependency injection / plugin/preference configuration per module) corresponds to Shopware 6's Symfony-based service configuration \u2014 a plugin's `src/Resources/config/services.php` (or the older `services.xml` on 6.6) where services are registered/autowired into the Symfony DI container, plus service decoration for overriding existing services, rather than a single global di.xml file per module. [from memory]", "citations": ["platform/func/migration-en/magento-keywords.md:1-56", "platform/func/migration-en/magento-firststeps.md:1-47"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "Magento", "path": "platform", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/migration-en/magento-keywords.md"}}, {"tool": "grep_docs", "args": {"pattern": "store view", "path": "platform", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/migration-en/magento-firststeps.md"}}], "notFoundClaim": false, "memoryClaims": ["Magento's di.xml (dependency injection / plugin/preference configuration per module) corresponds to Shopware 6's Symfony-based service configuration \u2014 a plugin's src/Resources/config/services.php (or the older services.xml on 6.6) where services are registered/autowired into the Symfony DI container, plus service decoration for overriding existing services, rather than a single global di.xml file per module."], "sourceVerdict": "partial"}, "edge-07": {"query": "How do I set up Shopware PWA as the storefront for a Shopware 6.7 shop?", "category": "edge", "option": "mcp-wiki", "answer": "The corpus has no setup guide for this, and for a reason: Shopware PWA is documented only under the 6.6 developer docs, not under 6.7 (a grep for 'Shopware PWA' across the whole platform layer returns only platform/dev/6.6/index.md, platform/dev/6.6/products/pwa.md and a synonyms entry \u2014 nothing under platform/dev/6.7). The 6.6 PWA page describes Shopware PWA as a Vue.js Single Page Application decoupled storefront built on the Store API, but explicitly states it is now in maintenance mode, and the documentation directs new decoupled-storefront projects toward Composable Frontends instead as the current recommended headless-storefront path. Consistent with that, the corpus has an entire product section for Composable Frontends under platform/dev/6.7/products/paas/shopware/composable-frontends/ (plus PaaS-specific pages like blackfire.md, performance.md, faq.md), but no equivalent 'how to set up Shopware PWA' guide for 6.7. In short: there is no documented setup path for Shopware PWA on 6.7 \u2014 it is a maintenance-mode product without current-version guides, and the corpus points instead to Composable Frontends for a 6.7 headless storefront.", "citations": ["platform/dev/6.6/products/pwa.md:1-31"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "Shopware PWA", "path": "platform", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.6/products/pwa.md"}}, {"tool": "grep_docs", "args": {"pattern": "Composable Frontends", "path": "platform/dev/6.7", "mode": "files"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "partial"}, "edge-08": {"query": "Which service do I type-hint to read products \u2014 `EntityRepositoryInterface` \u2014 and how do I inject it into my plugin service?", "category": "edge", "option": "mcp-wiki", "answer": "In current Shopware (6.7) the type to hint is `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository`, not `EntityRepositoryInterface` (that interface is an older/outdated name and is not what the DAL docs reference here). You inject it via the DI container using the service id pattern `entity_name.repository` (e.g. `product.repository`), for example in your `services.xml`/PHP service config: `$services->set(ReadingData::class)->args([service('product.repository')]);`. Then call `$this->productRepository->search(new Criteria(), $context)->getEntities()` to read products, optionally building the `Criteria` with filters (`EqualsFilter`, `OrFilter`, `RangeFilter`), associations (`addAssociation`), aggregations, sorting and paging.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md:1-77"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "EntityRepository", "path": "platform/dev/6.7", "mode": "files", "glob": "**/*reading*"}}, {"tool": "grep_docs", "args": {"pattern": "product.repository", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "edge-09": {"query": "Where do I configure Business Events so that a mail is sent when an order is placed in Shopware 6.7?", "category": "edge", "option": "mcp-wiki", "answer": "In Shopware 6.7 you no longer configure this under 'Business Events' \u2014 that screen (Settings > Shop > Business Events, mapping events like the technical event `checkout.order.placed` to an email template with optional Rule Builder conditions and sales-channel scoping) was superseded by the Flow Builder starting with major release 6.4.8.0, and Business Events is now used only for the B2B-Suite. To send a mail when an order is placed on 6.7, configure a flow instead: go to Settings > Automation > Flow Builder, create a new flow, choose the trigger `checkout.order.placed`, optionally add Rule Builder conditions, and add the 'Send mail' action (choosing the appropriate email template). Flows have a General tab (Name, Description, Priority, Active) and a Flow tab where the trigger, conditions and actions are configured.", "citations": ["platform/func/settings/Business-Events.md:1-38", "platform/func/settings/Flow-Builder.md:1-57"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "Business Event", "path": "platform/func", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/Business-Events.md"}}, {"tool": "grep_docs", "args": {"pattern": "Flow Builder", "path": "platform/func", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/func/settings/Flow-Builder.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-01": {"query": "How do I add my own Admin API endpoint under `/api/...` from a plugin \u2014 a controller with the api route scope and its ACL?", "category": "gap", "option": "mcp-wiki", "answer": "The wiki does not have a dedicated 'Add Admin API Route' how-to guide for plugins (only a Store API equivalent exists), but the pieces to combine are documented. The Admin API concept page confirms routes live under the `/api` prefix using route scope `api`, identified by `Shopware\\Core\\Framework\\Routing\\ApiRouteScope` (`ID = 'api'`), and that access requires an authenticated `AdminApiSource` context. The plugin 'Add Store API Route' guide shows the mechanism you'd mirror for Admin API: declare an abstract route class, put `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]])]` on the class (swap in `ApiRouteScope::ID` for an Admin API route) and a method-level `#[Route(path: '/api/...', name: '...', methods: [...])]`, register the route class as a service, and import it via `<plugin root>/src/Resources/config/routes.php` (`$routes->import('../../Core/**/*Route.php', 'attribute');`) so it is discoverable (verify with `./bin/console debug:router <route-name>`); for OpenAPI documentation of an Admin API route the schema JSON goes under `<plugin root>/src/Resources/Schema/AdminApi/` instead of `Resources/Schema/StoreApi/`. Admin API access itself is authorized purely by the caller's OAuth scopes/integration permissions on the `AdminApiSource` context (not by an in-controller ACL attribute documented here) \u2014 [from memory: on 6.7 you can additionally restrict a route with the `#[Acl(['your_permission'])]` PHP attribute so unauthorized integrations get a 403, but this attribute is not covered in the retrieved wiki pages].", "citations": ["platform/dev/6.7/concepts/api/admin-api.md:1-41", "platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md:1-67"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "RouteScope", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "admin api controller", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework", "depth": 2}}, {"tool": "read_doc", "args": {"path": "platform/hubs/admin-api.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}}, {"tool": "grep_docs", "args": {"pattern": "_action|Acl::isAllowed|RouteScope", "path": "platform/dev/6.7/resources/guidelines/code/routing.md", "regex": true}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/resources/guidelines/code/routing.md"}}, {"tool": "grep_docs", "args": {"pattern": "AdminApiRouteScope|privileges|acl", "path": "platform/dev/6.7/guides", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}}, {"tool": "grep_docs", "args": {"pattern": "AdminApiRouteScope", "path": "platform/dev/6.7"}}, {"tool": "grep_docs", "args": {"pattern": "#\\[Acl\\(", "path": "platform/dev/6.7", "regex": true}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/concepts/api/admin-api.md"}}], "notFoundClaim": false, "memoryClaims": ["on 6.7 you can additionally restrict a route with the `#[Acl(['your_permission'])]` PHP attribute so unauthorized integrations get a 403, but this attribute is not covered in the retrieved wiki pages"], "sourceVerdict": "partial"}, "gap-02": {"query": "Shopware 6.7 removed the RSA JWT key files and `system:generate-jwt-secret` \u2014 what signs Admin API tokens now, and what do I have to do when upgrading?", "category": "gap", "option": "mcp-wiki", "answer": "The wiki has nothing on this specific 6.7 change. Grepping for `jwt`/`generate-jwt-secret` across the whole `platform/dev/6.7` tree, the hosting environment-variables reference, and the resources/ADR directory turns up no page describing removal of RSA JWT key files or the `system:generate-jwt-secret` console command, and no page naming what now signs Admin API OAuth tokens. The only related material found is the `shopware-cli` tool's own `generate-jwt` helper command (unrelated core console command), whose page notes 'generate-jwt is only needed for Shopware before 6.5; 6.5+ generates JWT secrets automatically' \u2014 a much older change, not the 6.7 RSA-removal behavior asked about, and it does not explain what mechanism replaces it or what an upgrading site must do. I could not find relevant material in the served wiki for the actual question asked.", "citations": ["platform/dev/6.7/products/tools/cli/project-commands/helper-commands.md:1-89"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "generate-jwt-secret|jwt", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "jwt", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "jwt", "path": "platform/dev/6.6", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/products/tools/cli/project-commands/helper-commands.md"}}, {"tool": "grep_docs", "args": {"pattern": "APP_SECRET|symmetric|HS256|JWT_PRIVATE_KEY|jwt secret", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "generate-jwt-secret", "path": "platform", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "JWT", "path": "platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md", "context": 3}}, {"tool": "grep_docs", "args": {"pattern": "SECRET", "path": "platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md", "context": 3}}, {"tool": "grep_docs", "args": {"pattern": "jwt", "path": "platform/dev/6.7/resources", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "jwt", "path": "platform/synonyms.md"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "gap-03": {"query": "My ERP integration stopped logging in after the 6.7 upgrade \u2014 what changed in the Admin API OAuth flow (`/api/oauth/authorize`, the `scope` format)?", "category": "gap", "option": "mcp-wiki", "answer": "The wiki does not document any 6.7-specific change to the Admin API OAuth flow, the `/api/oauth/authorize` endpoint, or the `scope` request format. Grepping the whole `platform/dev/6.7` tree for `oauth/authorize` returns no page at all, and the two pages that do cover Admin API authentication (the integrations-api quick start and 'Authentication and API Requests') only describe the unchanged `client_credentials` grant against `/api/oauth/token` (integration Access key ID/Secret access key as `client_id`/`client_secret`) for normal integrations, and a local-only `password` grant with `client_id: administration` and `scopes: \"write\"` for development \u2014 neither page mentions `/api/oauth/authorize`, an authorization-code flow, or any scope-format change between 6.6 and 6.7. I could not find relevant material in the served wiki for the specific breaking change described in the question; it may be a genuine gap in this corpus or the described behavior may not exist as stated.", "citations": ["platform/dev/6.7/guides/development/integrations-api/_index.md:1-67", "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md:1-85"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "oauth/authorize|scope", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/integrations-api/auth-api-requests.md"}}, {"tool": "grep_docs", "args": {"pattern": "client_credentials", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "oauth/authorize", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/integrations-api/_index.md"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "gap-04": {"query": "After upgrading to 6.7 my plugin fatals on load because core class properties now have native PHP types \u2014 which properties must I retype in my subclasses?", "category": "gap", "option": "mcp-wiki", "answer": "The wiki has no page listing which core class properties gained native PHP types in 6.7 or which subclass properties a plugin must retype. Grepping `platform/dev/6.7` for 'native type'/'native PHP type'/'property type' only turns up an enum-field DAL reference page and generic code-style guidelines (6.5 new PHP language features, static-analysis writing guidance, documentation guidelines) \u2014 none of them enumerate specific retyped core properties. The general 'Upgrades and Migrations' index describes the upgrade workflow (review `UPGRADE-6.7.md`/`RELEASE_INFO-6.7.md` in the shopware/shopware repo, run `shopware-cli project upgrade`, check breaking changes per layer) but does not itself list PHP-typed-property breaking changes. I could not find relevant material in the served wiki for this specific question; the corpus does not cover it.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/_index.md:1-64"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "native type|native PHP type|property type", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "upgrade", "path": "platform/dev/6.7", "mode": "files", "glob": "**/*6.7*"}}, {"tool": "grep_docs", "args": {"pattern": "breaking change|BC break|upgrade guide", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/_index.md"}}, {"tool": "grep_docs", "args": {"pattern": "typed propert|property type|readonly|nullable", "path": "platform/dev/6.7/resources/guidelines/code/backward-compatibility.md", "regex": true}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "no"}, "gap-05": {"query": "My plugin decorates `CachedProductRoute` to add cache tags \u2014 where did the `Cached*Route` classes go in Shopware 6.7 and how do I cache a Store API route now?", "category": "gap", "option": "mcp-wiki", "answer": "The wiki does not have a page discussing `CachedProductRoute` or the old `Cached*Route` decorator classes by name (no hit for that pattern anywhere in `platform/dev/6.7`), but it documents the mechanism that replaced per-route caching decorators: Shopware's HTTP cache layer, described in the 'Caching' plugin guide and the 'Improved HTTP Cache Layer' ADR. Instead of decorating a `Cached*Route` class to add cache tags, a plugin now tags cached data with `Shopware\\Core\\Framework\\Adapter\\Cache\\CacheTagCollector::addTag('my-custom-entity-' . $id)` and invalidates it via `Shopware\\Core\\Framework\\Adapter\\Cache\\CacheInvalidator::invalidate(array $tags, bool $force = false)` (e.g. from an `EntityWrittenContainerEvent` subscriber), rather than by decorating a per-entity cached-route class. What varies the cache (the hash/context cookie) is controlled via `HttpCacheCookieEvent` (add parts with `$event->add('customer-group', ...)`) and `CacheHashRequiredExtension`; the internal Symfony HTTP cache key can additionally be extended via `HttpCacheKeyEvent`. On 6.7, Store API routes are cached the same way as storefront routes once the (currently opt-in, feature-flagged) `CACHE_REWORK` improved cache layer is enabled \u2014 cache-control behavior is then configured declaratively via `shopware.http_cache.policies` / `default_policies` (areas `storefront`, `store_api`) / `route_policies`, and a reverse proxy only needs to respect the `sw-cache-hash` header/cookie/Vary value, instead of route-specific decorator classes. Default cache invalidation runs through `Shopware\\Core\\Framework\\Adapter\\Cache\\CacheInvalidationSubscriber`, which a plugin can trim via `RemoveEventListener::remove()` in a compiler pass if the default invalidation is too aggressive.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/caching/_index.md:1-105", "platform/dev/6.7/resources/references/adr/2025-11-03-improved-http-cache-layer.md:1-84"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "CachedProductRoute|Cached.*Route", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "cache", "path": "platform/dev/6.7/guides/plugins/plugins/framework/caching", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/resources/references/adr/2025-11-03-improved-http-cache-layer.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/caching/_index.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "gap-06": {"query": "How do I create a shipping method from my plugin's installer or migration, including the `technicalName` that 6.7 requires?", "category": "gap", "option": "mcp-wiki", "answer": "The wiki has no single step-by-step guide titled for this, but the pieces are documented across three pages. Use your plugin's lifecycle hooks (base class extending `Shopware\\Core\\Framework\\Plugin`): register the shipping method inactive in `install(InstallContext $installContext)`, then activate it in `activate(ActivateContext $activateContext)` (deactivate the reverse in `deactivate()`), per the 'Plugin Lifecycle Methods' guide's guidance not to create fully active business data in `install()`. To actually persist the entity, inject `shipping_method.repository` (service id pattern `entity_name.repository`, typed `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository`) as shown in the 'Writing Data' guide, and call `upsert()` (creates if the `id` doesn't exist yet, updates otherwise) with an array of field data, e.g. `id`, `name`, `active` and any required associations. Since Shopware 6.7.0.0 the `technicalName` field (DB column `technical_name`) on `shipping_method` is required in both the database and the API \u2014 it's a `StringField` flagged `ApiAware()` and `Required()`, backed by a unique index `uniq.technical_name` \u2014 so your create/upsert array must include a stable `technicalName` (e.g. `my_plugin_my_shipping_method`); omitting it will fail validation on 6.7, whereas on 6.5/6.6 it was only optional in the DB/API (though still required in the Administration UI).", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md:1-82", "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/writing-data.md:1-84", "platform/dev/6.7/resources/references/adr/2023-10-17-add-unique-identifiers-for-checkout-methods.md:1-65"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "shipping_method|shipping method", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/_index.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/resources/references/adr/2023-10-17-add-unique-identifiers-for-checkout-methods.md"}}, {"tool": "grep_docs", "args": {"pattern": "shipping_method.repository|ShippingMethodDefinition::ENTITY_NAME|shippingMethodRepository", "path": "platform/dev/6.7", "regex": true}}, {"tool": "grep_docs", "args": {"pattern": "install(InstallContext", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "InstallContext|ActivateContext", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/writing-data.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "partial"}, "gap-07": {"query": "How do I create a media entity from a file on disk in PHP from my plugin (e.g. during an import) and generate its thumbnails?", "category": "gap", "option": "mcp-wiki", "answer": "The wiki has no plugin guide describing the generic core PHP API for creating a media entity from a local file (`Shopware\\Core\\Content\\Media\\MediaService`/`FileSaver`) and generating its thumbnails. The 'Media' plugin-guide index only lists three narrower extension points \u2014 preventing deletion of referenced media by `media:delete-unused`, adding a custom allowed file extension, and remote (externally generated) thumbnails via `shopware.media.remote_thumbnails` \u2014 none of which is 'save a local file as a media entity'. The only page found with an actual save-a-file-from-disk code path is Migration Assistant's media-processing concept, which is specific to that extension: it queues file metadata via `$this->mediaFileService->saveMediaFile([...])` (a `SwagMigrationAssistant`-only service, not core) and later a processor (`HttpMediaDownloadService`/`LocalMediaProcessor`) actually copies/downloads the bytes \u2014 this is not a general-purpose, reusable pattern for a plugin's own import code. [from memory: in core Shopware, the standard way is to inject `Shopware\\Core\\Content\\Media\\MediaService`, call `createMediaInFolder()`/`saveFile()` (or the lower-level `Shopware\\Core\\Content\\Media\\File\\FileSaver::persistFileToMedia()`) with a `MediaFile` built from the file's path/mimeType/size/extension and a target media id, which triggers thumbnail generation as part of the write pipeline (or you can call `Shopware\\Core\\Content\\Media\\Thumbnail\\ThumbnailService::updateThumbnails()` explicitly) \u2014 but none of this is backed by a citation from the served wiki.]", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/media/_index.md:1-47", "platform/dev/6.7/products/extensions/migration-assistant/concept/media-processing.md:1-68"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "MediaService|thumbnail|upload media", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "r
