nField` for the versioned `product_version_id`, and the inverse `OneToOneAssociationField` back to product), registered with tag `shopware.entity.definition`, and a `MigrationStep` to create the table with a foreign key to `product (id, version_id)` ON DELETE CASCADE. Write through the product repository, e.g. `upsert([['id' => $productId, 'exampleExtension' => ['customString' => 'foo bar']]], $context)`. Alternatively, for data without a database, subscribe to `ProductEvents::PRODUCT_LOADED_EVENT` and call `$productEntity->addExtension('custom_string', new ArrayEntity([...]))` (value must be a `Struct`). Since 6.6.10.0, `BulkEntityExtension` (tag `shopware.bulk.entity.extension`) lets you extend many entities at once via a `collect(): Generator` yielding `EntityName => [fields...]`. Gotcha: `CascadeDelete` associations are cloned along with the product unless you pass `new CascadeDelete(false)` or omit the flag. For associations between two custom (non-core) entities, use `FkField` plus `OneToOneAssociationField`/`OneToManyAssociationField`/`ManyToOneAssociationField`/`ManyToManyAssociationField` directly inside `defineFields()` of the entity definitions, with a `MappingEntityDefinition` for many-to-many relations.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md:1-107", "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-associations.md:1-102"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "association", "path": "platform/dev/6.7", "glob": "**/*entity-extension*", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "EntityDefinition", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-associations.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-02": {"query": "What's the plugin lifecycle in Shopware \u2014 install, activate, uninstall \u2014 and how does `keepUserData` work?", "category": "dev", "option": "mcp-wiki", "answer": "A Shopware plugin's base class extends `Shopware\\Core\\Framework\\Plugin` (which extends `Bundle`) and can override optional, no-op lifecycle hooks, each taking a context object: `install(InstallContext)` on install, `postInstall(InstallContext)` after a successful install, `activate(ActivateContext)` during activation, `deactivate(DeactivateContext)` during deactivation, `update(UpdateContext)` on update, `postUpdate(UpdateContext)` after a successful update, and `uninstall(UninstallContext)` on uninstall. Recommended usage: in `install()` register entities/create initial data but keep them inactive; in `activate()` activate what was created in `install()` (or create data that needs the plugin active); in `deactivate()` deactivate/remove data that would interfere while inactive; put schema/data changes in plugin migrations rather than `update()`; use `postInstall()`/`postUpdate()` for actions that must run only after the whole process completed. `InstallContext` (and its subclasses) exposes `getContext()`, `getCurrentShopwareVersion()`, `getCurrentPluginVersion()`, `getMigrationCollection()`, `isAutoMigrate()`/`setAutoMigrate()`; `UpdateContext` adds `getUpdatePluginVersion()` (the target version). `UninstallContext` adds `keepUserData(): bool` \u2014 in `uninstall()` you should check it and return early without deleting anything if it is true: `if ($uninstallContext->keepUserData()) { return; }`. When it is `false`, the Shopware core itself removes the plugin's migrations before calling `uninstall()`, and deletes the plugin's system config, custom entities and custom fields afterward \u2014 so plugin code should clean up any of its own custom tables/data in that branch. Gotcha: do not blindly delete business entities in `uninstall()` (e.g. a payment method referenced by real orders) \u2014 deactivate instead. Also, in the installed code, `activate()` actually runs after the plugin is already flagged active and the container rebuilt (with auto-migrate disabled), with migrations running right after it \u2014 contrary to a docs description that it runs 'before' activation.", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md:1-82"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "keepUserData", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-03": {"query": "How do I add a custom Store API route for a headless storefront?", "category": "dev", "option": "mcp-wiki", "answer": "Define an abstract class (e.g. `AbstractExampleRoute`) declaring `getDecorated(): AbstractExampleRoute` and `load(Criteria $criteria, SalesChannelContext $context): ExampleRouteResponse`. Implement it in a concrete route class tagged with the store-api scope: `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]])] class ExampleRoute extends AbstractExampleRoute`, with `getDecorated()` throwing `DecorationPatternException(self::class)`, and the actual endpoint method annotated `#[Route(path: '/store-api/example', name: 'store-api.example.search', methods: ['GET','POST'], defaults: ['_entity' => 'swag_example'])]` performing a repository search. Register the service with its repository injected, e.g. `$services->set(ExampleRoute::class)->args([service('swag_example.repository')]);`. The response class `ExampleRouteResponse` must extend `Shopware\\Core\\System\\SalesChannel\\StoreApiResponse`, passed the `EntitySearchResult` as `$object` in its constructor, with a `getExamples()` accessor returning `$this->object->getEntities()`. Routes are only discovered once imported in `<plugin root>/src/Resources/config/routes.php` via `$routes->import('../../Core/**/*Route.php', 'attribute');`. Verify registration with `./bin/console debug:router store-api.example.search` (this proves discovery only, not that requests succeed). Document the endpoint with an OpenAPI JSON file under `<plugin root>/src/Resources/Schema/StoreApi/` (inspectable at `/store-api/_info/stoplightio.html`). Gotchas: fields must carry the `ApiAware` flag in the entity definition to be exposed in the response; `_entity` is required in the route defaults or the `Criteria` argument resolver throws. Optionally, for a Storefront (non-headless) wrapper, add a `StorefrontController` subclass scoped `StorefrontRouteScope::ID` that injects the `AbstractExampleRoute` and delegates to it, imported via `$routes->import('../../Storefront/**/*Controller.php', 'attribute');` and called client-side with `fetch('/example', { method: 'POST' })`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md:1-67"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "Store API route", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/store-api/add-store-api-route.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-04": {"query": "How do I create a custom CMS element for Shopping Experiences?", "category": "dev", "option": "mcp-wiki", "answer": "A CMS element is the smallest content unit of Shopping Experiences (Page -> Section -> Block -> Slots -> Elements) and is always rendered inside a block's slot. Layout the plugin's Administration code under `<plugin root>/src/Resources/app/administration/src/module/sw-cms/elements/<name>/` with `index.js`, `component/`, `config/`, `preview/` subfolders, then import it from `main.js` (`import './module/sw-cms/elements/dailymotion';`). In the element's `index.js`, after importing `./component`, `./config`, `./preview`, register it: `Shopware.Service('cmsService').registerCmsElement({ name: 'dailymotion', label: 'cms.elements.dailymotion.label', component: 'cms-el-dailymotion', configComponent: 'cms-el-config-dailymotion', previewComponent: 'cms-el-preview-dailymotion', defaultConfig: { url: { source: 'static', value: '' } } });` \u2014 `name` and `component` are mandatory or registration silently returns false; optional flags are `hidden` (excludes it from the replace-element picker) and `removable: false`. `defaultConfig` entries are `{ source, value }` objects with `source` one of `static`, `mapped`, `default`. Build a preview component (thumbnail shown when selecting/swapping elements), a main component with `mixins: ['cms-element']` that calls `this.initElementConfig()` in `created()` and reads `element.config.url.value` (rendering fallback content when empty), and a config component with the same mixin plus form fields (e.g. `mt-text-field` bound with `v-model=\"element.config.url.value\"`) for every `defaultConfig` key, wrapping fields in `sw-cms-inherit-wrapper` (props `field`, `:element`, `:label`) so values can inherit from the base layout or be overridden per page. For the Storefront, add `<plugin root>/src/Resources/views/storefront/element/cms-element-<name>.html.twig` (the `cms-element-` prefix is mandatory or the block template renders nothing) and clear the Storefront cache; the `element` variable (a `CmsSlotDefinition`) is passed automatically. Note: in 6.7 the `initElementConfig()` mixin method takes no parameter, unlike some older doc examples that pass the element name.", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/cms/add-cms-element.md:1-73"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "custom cms element", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/content/cms"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/content/cms/add-cms-element.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-05": {"query": "How does theme inheritance work in Shopware \u2014 theme.json and SCSS overrides?", "category": "dev", "option": "mcp-wiki", "answer": "Theme inheritance is declared in the extending theme's `theme.json` (`<plugin root>/src/Resources/theme.json`, scaffolded by `bin/console theme:create`). Each of its sections (`views`, `style`, `script`, `asset`, `configInheritance`) is an ordered array of placeholders and own files; entries are applied in the listed order. Placeholders are `@Storefront` (Shopware's default base theme, which every theme ultimately inherits from), `@Plugins` (installed non-theme plugin extensions), and `@<ThemeTechnicalName>` for any other installed theme you want to inherit from. Example: `\"views\": [\"@Storefront\", \"@Plugins\", \"@SwagBasicExampleTheme\", \"@SwagBasicExampleThemeExtend\"]` renders templates from Storefront first, then plugin extensions, then the base theme, then the current theme's own templates (later entries can override earlier ones). `script` layers Storefront JS as the base, then the base theme's JS, then the current theme's own JS. `style` works the same way; an `overrides.scss` is typically listed first because it can set SCSS/Bootstrap variables (e.g. `$border-radius`) that the later-loaded SCSS partials then consume. `asset` needs the base theme's placeholder added to reuse its assets. `configInheritance` controls which theme's admin-configurable field configuration/values are inherited \u2014 the last listed theme that differs from the current one becomes its parent theme; even with an empty `configInheritance` list, the installed code falls back to inheriting from `@Storefront` for every theme except the Storefront base theme itself. Gotcha: a `theme.json` section that omits `@Storefront` will not receive the default theme's files for that section at all.", "citations": ["platform/dev/6.7/guides/plugins/themes/inheritance/add-theme-inheritance.md:1-69", "platform/dev/6.7/guides/plugins/themes/theme-base-guide.md:1-50"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "theme.json", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/themes/inheritance/add-theme-inheritance.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/themes/theme-base-guide.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-06": {"query": "How do I add a custom Flow Builder action?", "category": "dev", "option": "mcp-wiki", "answer": "Create a PHP action class extending `Shopware\\Core\\Content\\Flow\\Dispatching\\Action\\FlowAction` (e.g. `src/Core/Content/Flow/Dispatching/Action/CreateTagAction.php`) implementing: `public static function getName(): string { return 'action.create.tag'; }`, `public function requirements(): array` (the aware interfaces the action needs, e.g. `[TagAware::class]`; empty array means it applies to all triggers), and `public function handleFlow(StorableFlow $flow): void` where you read `$flow->getConfig()` for the sequence's configured values, `$flow->getStore($key)`/`$flow->hasStore(...)` for aware-interface values, and `$flow->getData($key)` for original event/extra data, then perform the action (e.g. write via a repository using `$flow->getContext()`). If scoping to a custom aware interface, define one (e.g. `TagAware extends Shopware\\Core\\Framework\\Event\\FlowEventAware`, marked with the `#[IsFlowEventAware]` attribute) with the constants/getter your action needs. Register the action service in `src/Resources/config/services.php` with the tag `flow.action`, passing `key` (must equal `getName()`, since `FlowExecutor` indexes actions by this key) and `priority` (its ordering in `/api/_info/flow-actions.json`): `$services->set(CreateTagAction::class)->args([service('tag.repository')])->tag('flow.action', ['priority' => 600, 'key' => 'action.create.tag']);`. Optionally define a custom trigger event implementing the aware interface and subscribing to `BusinessEventCollectorEvent::NAME` to register it via `$this->businessEventCollector->define(YourEvent::class)`. On the Administration side, add the action's label/group and snippets, then override the `sw-flow-sequence-action` component (`Component.override`, not `register` \u2014 core already registers it) to extend `getActionDescriptions()`/`getActionTitle()` and (if a new group is needed) the `groups` computed property and `modalName`; build a config modal component (`Component.register('sw-flow-create-tag-modal', ...)`) using `sw-modal`, taking a `sequence` prop and emitting `process-finish` with `{ ...this.sequence, config }` plus `modal-close`; import both in `main.js`. `flowBuilderService.getActionName(...)` only resolves after registering the name via `flowBuilderService.addActionNames({...})`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-action.md:1-83"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "flow builder action", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-action.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-07": {"query": "My plugin needs to store its own data in a new table \u2014 how do I define a custom DAL entity with its definition, entity and collection class so I get a repository for it?", "category": "dev", "option": "mcp-wiki", "answer": "First create the table with a migration: extend `Shopware\\Core\\Framework\\Migration\\MigrationStep` (e.g. `src/Migration/Migration1611664789Example.php`), implement `getCreationTimestamp()` and `update(Connection $connection)` running a `CREATE TABLE IF NOT EXISTS` statement (prefix the table name with your vendor, e.g. `swag_example`, with at minimum a `BINARY(16)` `id` primary key plus `created_at`/`updated_at`); reinstall the plugin to run it. Then define an `EntityDefinition` (e.g. `src/Core/Content/Example/ExampleDefinition.php`) extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityDefinition`, implementing the two required abstract members `getEntityName(): string` (returning the table name, e.g. `self::ENTITY_NAME = 'swag_example'` \u2014 this also becomes the repository service id, `<name>.repository`) and `defineFields(): FieldCollection` (listing an `IdField` flagged `Required`+`PrimaryKey`, plus e.g. `StringField`/`BoolField`; `created_at`/`updated_at` are added automatically and need no field). Also override `getEntityClass()` and `getCollectionClass()` to return your custom Entity/Collection classes (they default to the generic `ArrayEntity`/`EntityCollection` otherwise). Register the definition in `services.php` with the tag `shopware.entity.definition` and an `entity` attribute matching `getEntityName()` exactly: `$services->set(ExampleDefinition::class)->tag('shopware.entity.definition', ['entity' => 'swag_example']);` \u2014 this auto-generates the `swag_example.repository` service. For the Entity class, extend `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity`, use the `EntityIdTrait`, and declare `protected` (never `readonly`) properties with getters/setters matching your fields, since the DAL must be able to set them. For the Collection class, extend `EntityCollection` and override `protected function getExpectedClass(): string { return ExampleEntity::class; }`. Gotcha: the entity name registered on the definition must exactly match the created table name, and the `entity` tag attribute should match `getEntityName()`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md:1-121"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-custom-complex-data.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-08": {"query": "In a plugin service, what is the Shopware 6 equivalent of Doctrine's `findBy()` \u2014 how do I read products with filters, associations and sorting?", "category": "dev", "option": "mcp-wiki", "answer": "Shopware 6 has no ORM; reads go through the generated repository of each entity plus a `Criteria` object carrying IDs, filters, associations, aggregations, paging and sorting. Inject the repository by its service id (pattern `entity_name.repository`, e.g. `product.repository`), typed as `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityRepository`: `$services->set(ReadingData::class)->args([service('product.repository')]);`. Then build a `Criteria` (`Shopware\\Core\\Framework\\DataAbstractionLayer\\Search\\Criteria`) and call `search()`, taking the collection via `getEntities()`: `$products = $this->productRepository->search(new Criteria(), $context)->getEntities();` or, to load one entity by id, `new Criteria([$myId])` then `->getEntities()->first()`. Filter with `$criteria->addFilter(new EqualsFilter('name', 'Example name'))`, combined with `OrFilter`/`AndFilter`/`NandFilter`, or use `RangeFilter`; `addPostFilter(...)` filters the result set without affecting aggregations; field names come straight from the entity definition (e.g. `ProductDefinition`). Load related data with `addAssociation('productReviews')` (chainable, e.g. `'productReviews.customer'`); `getAssociation('productReviews')` returns that association's own nested `Criteria` so you can filter which related rows get attached (a filter on the root Criteria for `productReviews.points` instead limits which products are returned at all). Aggregate with `addAggregation(new AvgAggregation('avg-rating', 'productReviews.points'))` and read it off the search result via `->getAggregations()->get('avg-rating')`. Page and sort with `setLimit()`, `setOffset()`, and `addSorting(new FieldSorting('createdAt', FieldSorting::ASCENDING))`. For very large result sets, use `Shopware\\Core\\Framework\\DataAbstractionLayer\\Dbal\\Common\\RepositoryIterator`, which returns one batch per `fetch()` call until `null` \u2014 it needs a deterministic sort (add a unique field like `id` as a secondary sort) or entities repeat/get skipped across batches; without an explicit limit it defaults to 50 per batch. Gotchas: many-to-many mapping entities (e.g. `product_category.repository`) cannot be read with `search()` \u2014 use `searchIds()` instead; and in 6.7.13.0 `EntitySearchResult` is deprecated to no longer extend `EntityCollection` in 6.8, so call `getEntities()` before `->first()` rather than calling `first()`/iterating directly on the search result.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md:1-77"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "Criteria", "path": "platform/dev/6.7", "glob": "**/*reading*", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/reading-data.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-09": {"query": "How do I make a field on my plugin's own entity translatable per language?", "category": "dev", "option": "mcp-wiki", "answer": "Add a `_translation` table and matching definitions alongside your custom entity (e.g. `swag_example`). 1) Migration: create `swag_example_translation` with `swag_example_id BINARY(16)`, `language_id BINARY(16)`, the translated column(s) (e.g. `name VARCHAR(255)`), `created_at`/`updated_at`, primary key `(swag_example_id, language_id)`, and foreign keys to `swag_example(id)` and `language(id)` with `ON DELETE CASCADE`. 2) Translation definition class extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\EntityTranslationDefinition` (e.g. `ExampleTranslationDefinition`), implementing `getEntityName()` (returns `swag_example_translation`), `getParentDefinitionClass()` (returns `ExampleDefinition::class` \u2014 protected in the base class, throws a `RuntimeException` if not overridden), `getEntityClass()`, and `defineFields()` listing only the translated columns as fields (e.g. `(new StringField('name', 'name'))->addFlags(new Required())`) \u2014 the parent FK, `language_id` FK, and both `ManyToOneAssociationField`s are added automatically by `EntityTranslationDefinition::getBaseFields()`. 3) Register both definitions in `services.php`, the main definition first, then the translation definition, each tagged `shopware.entity.definition` with its own `entity` attribute. 4) A translation entity class extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\TranslationEntity` (which already provides `languageId` accessors), with properties/getters/setters for the parent id, the translated field(s), and the parent entity. 5) A translation collection extending `EntityCollection` overriding `getExpectedClass()`. 6) On the main entity's `defineFields()`, add `(new TranslatedField('name'))->addFlags(new ApiAware(), new Required())` and `(new TranslationsAssociationField(ExampleTranslationDefinition::class, 'swag_example_id'))->addFlags(new ApiAware(), new Required())`. Gotcha: the base FK column/property name is derived from the parent's entity name (`<entityName>_id`), so the parent entity's technical name must exactly match the translation table's prefix. When reading, prefer `entity.translated.field` in Storefront/sales-channel contexts and the plain `entity.field` in Admin/CRUD flows.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-translations.md:1-71"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "translat", "path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-translations.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-10": {"query": "How do I write an indexer that precomputes derived data for my custom entity on write, and how do I trigger a full reindex?", "category": "dev", "option": "mcp-wiki", "answer": "Data indexers precompute expensive values whenever entities are written through the DAL (like the product `cheapest_price` column) so reads stay cheap. Create a class extending `Shopware\\Core\\Framework\\DataAbstractionLayer\\Indexing\\EntityIndexer` and implement its six abstract methods: `getName(): string` (a unique name used by `EntityIndexerRegistry` to route messages, e.g. `'swag.basic.example.indexer'`); `iterate(?array $offset): ?EntityIndexingMessage` for a full reindex \u2014 build it with `IteratorFactory->createIterator(..., $offset)->fetch()` and return `new EntityIndexingMessage(array_values($ids), $iterator->getOffset())`, or `null` when done; `update(EntityWrittenContainerEvent $event): ?EntityIndexingMessage`, called on DAL writes \u2014 filter `$event->getPrimaryKeys(YourDefinition::ENTITY_NAME)` as tightly as possible; `handle(EntityIndexingMessage $message): void`, which processes messages from `iterate`/`update` \u2014 read `$message->getData()` and write with the `Connection` directly (not the DAL) to avoid retriggering indexing/`EntityWrittenContainerEvent` loops; `getTotal(): int` (record count for progress, e.g. `$iterator->fetchCount()`); and `getDecorated(): EntityIndexer` (throw `DecorationPatternException(static::class)`, the standard decoration hook). Register the service with its dependencies (`IteratorFactory`, your repository, `Doctrine\\DBAL\\Connection`) tagged `shopware.entity_indexer` \u2014 with autoconfiguration, `EntityIndexer` subclasses get this tag automatically. `update()` messages are handled synchronously by default; `EntityIndexingMessage`'s constructor is `($data, $offset = null, $context = null, $forceQueue = false, $isFullIndexing = false)` \u2014 pass `forceQueue: true` to process asynchronously via the message queue instead. If you must use the DAL inside an indexer without retriggering indexing, call `$context->addState(EntityIndexerRegistry::DISABLE_INDEXING);`. To trigger a full reindex, run `bin/console dal:refresh:index` (or use the Administration's index-refresh action) \u2014 this drives `iterate()` across all indexers. Alternative for existing core entities: instead of writing a new indexer, subscribe (tag `kernel.event_subscriber`) to the relevant core indexer's event (e.g. `Shopware\\Core\\Checkout\\Customer\\Event\\CustomerIndexerEvent`), read `getIds()`, and batch your writes with `Shopware\\Core\\Framework\\DataAbstractionLayer\\Doctrine\\MultiInsertQueryQueue` (`addInsert(...)` then `execute()`).", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-indexer.md:1-80"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "indexer", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-data-indexer.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-11": {"query": "On Shopware 6.7, which file do I declare my plugin's services in, and how do I get a core service passed into my service's constructor?", "category": "dev", "option": "mcp-wiki", "answer": "In Shopware 6.7, plugin services are declared in `<plugin root>/src/Resources/config/services.php`, a PHP service configuration file (the plugin's Bundle base class auto-loads any `Resources/config/services.*` file). You either use autowire/autoconfigure (`$configurator->services()->defaults()->autowire()->autoconfigure()` plus `->load('Your\\\\Namespace\\\\', '../../')->exclude('../../{Resources,Migration,*.php}')`, making every class under `src` a service automatically) or declare explicitly with `$services->set(YourService::class)`. To get a core service (e.g. `Shopware\\Core\\System\\SystemConfig\\SystemConfigService`) into your service's constructor: add it as a typed constructor parameter (constructor property promotion), e.g. `public function __construct(private SystemConfigService $systemConfigService) {}`. If `services.php` already uses autowire/autoconfigure, nothing else is needed \u2014 the container injects it automatically by type. If the service is declared explicitly instead, add the dependency as an argument using the `service()` helper: `$services->set(ExampleService::class)->args([service(SystemConfigService::class)]);`. All Shopware 6 services are private by default, so they must be obtained via injection, not fetched from the container at runtime. YAML/XML service files are still supported but XML is deprecated as of Symfony 7.4, so `services.php` is preferred for new 6.7 plugins.", "citations": ["platform/dev/6.7/guides/plugins/plugins/services/add-custom-service.md:1-83", "platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md:1-71"], "toolCallLog": [{"tool": "kb_status", "args": "{}"}, {"tool": "read_doc", "args": "{path: 'platform/index.md'}"}, {"tool": "grep_docs", "args": "{pattern: 'services.xml', path: 'platform/dev/6.7', mode: 'files'}"}, {"tool": "list_docs", "args": "{path: 'platform/dev/6.7', glob: '**/*dependency*'}"}, {"tool": "grep_docs", "args": "{pattern: 'dependency injection', path: 'platform/dev/6.7/guides/plugins', mode: 'files'}"}, {"tool": "read_doc", "args": "{path: 'platform/dev/6.7/guides/plugins/plugins/services/dependency-injection.md'}"}, {"tool": "read_doc", "args": "{path: 'platform/dev/6.7/guides/plugins/plugins/services/add-custom-service.md'}"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-12": {"query": "I am on Shopware 6.6 \u2014 which file do I declare my plugin's service dependencies in, and how do I pass another service into the constructor?", "category": "dev", "option": "mcp-wiki", "answer": "On Shopware 6.6, a plugin service is declared in `<plugin root>/src/Resources/config/services.xml` \u2014 Shopware automatically loads a file with exactly this name from that directory. Minimal declaration: `<service id=\"Swag\\BasicExample\\Service\\ExampleService\" />` inside a `<container><services>` block. To pass another service into the constructor, add it as a typed constructor parameter of the class (e.g. `public function __construct(private SystemConfigService $systemConfigService) {}`); Symfony autowiring is enabled core-wide in Shopware, so a typed constructor argument without an explicit registered argument is autowired automatically \u2014 you only need an explicit `<argument>`/`service()` wiring when autowiring cannot resolve the dependency unambiguously. All services in Shopware 6 are private by default, so they can only be obtained via injection into another service, not fetched directly from the container.", "citations": ["platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/add-custom-service.md:1-49", "platform/dev/6.6/resources/references/adr/2023-05-16-symfony-dependency-management.md:1-38"], "toolCallLog": [{"tool": "grep_docs", "args": "{pattern: 'dependency-injection', path: 'platform/dev/6.6', mode: 'files'}"}, {"tool": "grep_docs", "args": "{pattern: 'services.php', path: 'platform/dev/6.6/index.md'}"}, {"tool": "grep_docs", "args": "{pattern: 'add-custom-service', path: 'platform/dev/6.6/index.md'}"}, {"tool": "grep_docs", "args": "{pattern: 'services/dependency-injection', path: 'platform/dev/6.6/index.md'}"}, {"tool": "read_doc", "args": "{path: 'platform/dev/6.6/guides/plugins/plugins/plugin-fundamentals/add-custom-service.md'}"}, {"tool": "grep_docs", "args": "{pattern: 'constructor', path: 'platform/dev/6.6/index.md'}"}, {"tool": "grep_docs", "args": "{pattern: 'inject', path: 'platform/dev/6.6/index.md'}"}, {"tool": "grep_docs", "args": "{pattern: 'autowir', path: 'platform/dev/6.6/index.md'}"}, {"tool": "read_doc", "args": "{path: 'platform/dev/6.6/resources/references/adr/2023-05-16-symfony-dependency-management.md'}"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-13": {"query": "There is no event for what I need to change in a core Shopware service \u2014 how do I decorate or replace that service from my plugin?", "category": "dev", "option": "mcp-wiki", "answer": "Use Symfony service decoration on the core service's abstract-class contract. In `src/Resources/config/services.php`, register your decorator with `->decorate(ExampleService::class)->args([service('.inner')])`. Shopware's decoratable services follow an abstract-class pattern: the contract (usually shipped by core, e.g. `AbstractProductDetailRoute`) declares `abstract public function getDecorated(): AbstractExampleService;` plus its business methods; the base implementation's `getDecorated()` throws `Shopware\\Core\\Framework\\Plugin\\Exception\\DecorationPatternException`. Your decorator extends the same abstract class, takes the inner `AbstractExampleService` via constructor injection (using the `.inner` service id), returns it from `getDecorated()`, and delegates to it \u2014 e.g. `return $this->decoratedService->doSomething() . ' Did something additionally.'`. Decorators nest (plugin B can wrap plugin A which wraps core); if a decorator never calls the inner service it silently drops the rest of the chain with no runtime warning. Always type-hint the abstract class in constructors, never the concrete class, or you bypass the chain. Use `bin/console debug:container --show-arguments <service-id>` to inspect the wiring. Prefer decoration over events specifically when you need to change how a service behaves rather than just react to something it does; if only reacting is needed, prefer an event or an extension point (which dispatches `.pre`/`.post`/`.error` events) instead.", "citations": ["platform/dev/6.7/guides/plugins/plugins/services/adjusting-service.md:1-84"], "toolCallLog": [{"tool": "grep_docs", "args": "{pattern: 'decorat', path: 'platform/dev/6.7/guides/plugins/plugins/services', mode: 'files'}"}, {"tool": "read_doc", "args": "{path: 'platform/dev/6.7/guides/plugins/plugins/services/adjusting-service.md'}"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-14": {"query": "I wrote a subscriber class in my plugin but it never fires \u2014 which interface and which service tag (`shopware.event_subscriber`?) register it?", "category": "dev", "option": "mcp-wiki", "answer": "Your subscriber class must implement `Symfony\\Component\\EventDispatcher\\EventSubscriberInterface` (with a static `getSubscribedEvents()` returning `<event name> => <method>`), and it must be registered in `<plugin root>/src/Resources/config/services.php` tagged with `kernel.event_subscriber` \u2014 not `shopware.event_subscriber` (that tag does not exist; the correct DI tag is `kernel.event_subscriber`, the same tag Shopware's own subscriber scaffolding generator uses). Example registration: `$services->set(MySubscriber::class)->tag('kernel.event_subscriber');`. If the class exists but is not registered and tagged this way, Shopware never calls it, and there is often no obvious error \u2014 this is the most common reason a subscriber silently never fires. Also check whether you're listening on a versioned entity's events (orders, products): they dispatch once per version, so check `$event->getContext()->getVersionId() !== Defaults::LIVE_VERSION` and return early for non-live versions if you only care about the live one.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/event/listening-to-events.md:1-87"], "toolCallLog": [{"tool": "read_doc", "args": "{path: 'platform/dev/6.7/guides/plugins/plugins/framework/event/listening-to-events.md'}"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-15": {"query": "How do I work out which event Shopware actually dispatches for a given action, for example after a product is loaded or a page is rendered?", "category": "dev", "option": "mcp-wiki", "answer": "There is no single catalog; you locate the event by type. DAL events are auto-generated per entity following the pattern `entity_name.event` (e.g. `product.written`, `product.deleted`); some core entities also have a constants class such as `ProductEvents` (`ProductEvents::PRODUCT_LOADED_EVENT` = `product.loaded`), and written listeners receive an `EntityWrittenEvent`. General PHP events are found by searching core source for `$this->eventDispatcher->dispatch($event, $name)`, `extends NestedEvent`, `extends Event`, or `implements ShopwareEvent`; if no explicit name is passed, the event class name is the event name. Page-loaded events: Storefront pages dispatch a `*PageLoadedEvent` (e.g. `GenericPageLoader` dispatches `GenericPageLoadedEvent`) \u2014 search for `PageLoadedEvent`. Criteria events (dispatched before entities load with a `Criteria`, e.g. `ProductListingCriteriaEvent`) are hand-written per route, so one may not exist for every entity \u2014 search `CriteriaEvent`. Route events use the pattern `{route}.request` / `.response` / `.render` (Storefront, `StorefrontRenderEvent`) / `.encode` (Store-API) / `.controller`, substituting the Symfony route name, e.g. `store-api.product.listing.request`. Business/flow events (e.g. `CustomerBeforeLoginEvent`, `CustomerLoginEvent`) implement `FlowEventAware` (and `MailAware` for mail-related ones) \u2014 search for those interfaces, not the outdated `BusinessEventInterface`/`MailActionInterface` names some older docs mention (neither exists in installed 6.7 code). For a concrete request, the fastest practical route is the Symfony profiler's \"Events\" tab, which lists every event actually fired during that request with its name. Storefront JS events are published via `this.$emitter.publish('someEvent', ...)` \u2014 grep for that in the storefront JS sources; Administration events are mostly Vue `this.$emit(...)` calls, found by grepping the Administration `src` or using Vue.js devtools.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/event/finding-events.md:1-95"], "toolCallLog": [{"tool": "grep_docs", "args": "{pattern: 'debug:event', path: 'platform/dev/6.7', mode: 'files'}"}, {"tool": "grep_docs", "args": "{pattern: 'find.*event|which event', path: 'platform/dev/6.7/guides/plugins', regex: true}"}, {"tool": "read_doc", "args": "{path: 'platform/dev/6.7/guides/plugins/plugins/framework/event/finding-events.md'}"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-16": {"query": "How do I run plugin logic whenever an order is written, and find out exactly which fields changed?", "category": "dev", "option": "mcp-wiki", "answer": "To react to order writes, subscribe to `Shopware\\Core\\Checkout\\Order\\OrderEvents::ORDER_WRITTEN_EVENT` (`order.written`), which delivers an `EntityWrittenEvent`. Shopware does not generate a changeset for performance reasons by default, so to see which fields changed you must also subscribe to `Shopware\\Core\\Framework\\DataAbstractionLayer\\Write\\Validation\\PreWriteValidationEvent` (fired before the write result set is generated): for each command in `getCommands()`, skip it unless it implements `ChangeSetAware` and unless `getEntityName()` equals `OrderDefinition::ENTITY_NAME`, then call `$command->requestChangeSet()`. In the `ORDER_WRITTEN_EVENT` listener, iterate `$event->getWriteResults()` and read `$result->getChangeSet()` to get the actual changed values. In both listeners, return early unless `$event->getContext()->getVersionId() === Defaults::LIVE_VERSION`, since editing an order in the Administration creates a draft version that is later merged into the live version. Register both subscriber methods via `getSubscribedEvents()` returning `[PreWriteValidationEvent::class => 'triggerChangeSet', OrderEvents::ORDER_WRITTEN_EVENT => 'onOrderWritten']`, on a class implementing `EventSubscriberInterface` and tagged `kernel.event_subscriber` in `services.php`. Note: insert commands (brand-new entities) cannot produce a changeset, and requesting changesets has a performance cost, so scope the entity/condition checks as narrowly as possible.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/order/listen-to-order-changes.md:1-70"], "toolCallLog": [{"tool": "grep_docs", "args": "{pattern: 'order.written|changed fields|getPayload', path: 'platform/dev/6.7', regex: true, mode: 'files'}"}, {"tool": "read_doc", "args": "{path: 'platform/dev/6.7/guides/plugins/plugins/checkout/order/listen-to-order-changes.md'}"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-17": {"query": "How do I overwrite the price of a product line item in the cart at runtime from a plugin?", "category": "dev", "option": "mcp-wiki", "answer": "Implement one class with two roles: a collector (`Shopware\\Core\\Checkout\\Cart\\CartDataCollectorInterface::collect`) and a processor (`Shopware\\Core\\Checkout\\Cart\\CartProcessorInterface::process`). In `collect`, get product line item IDs via `$original->getLineItems()->filterType(LineItem::PRODUCT_LINE_ITEM_TYPE)->getReferenceIds()`, skip IDs already present in the `CartDataCollection` (`$data->has($key)` \u2014 collect can run several times per request), fetch the new price for each remaining ID and store it with `$data->set($key, $newPrice)` under a prefixed key like `'price-overwrite-'.$id` to avoid clashing with other collectors. In `process`, iterate `$toCalculate->getLineItems()->filterType(LineItem::PRODUCT_LINE_ITEM_TYPE)`, build a `QuantityPriceDefinition($data->get($key), $product->getPrice()->getTaxRules(), $product->getPrice()->getQuantity())`, calculate it with an injected `Shopware\\Core\\Checkout\\Cart\\Price\\QuantityPriceCalculator`, and then `$product->setPrice(...)` and `$product->setPriceDefinition($definition)`. Register the class in `services.php` tagged both `shopware.cart.processor` and `shopware.cart.collector` with `priority: 4500` (below the core product collector/processor's priority 5000, so product prices/tax rules already exist when your processor runs). Only mutate `$toCalculate`, never `$original`; never query the database inside `process` \u2014 always fetch data in the collector. This approach is intended for rare cases like live-shopping/dynamic pricing plugins; for discounts or surcharges, add a discount line item instead of overwriting prices.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md:1-91"], "toolCallLog": [{"tool": "grep_docs", "args": "{pattern: 'setPriceDefinition|line item price', path: 'platform/dev/6.7/guides/plugins/plugins/checkout/cart', regex: true, mode: 'files'}"}, {"tool": "read_doc", "args": "{path: 'platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md'}"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-18": {"query": "My plugin's cart processor adds a surcharge line item, but it is added again on every recalculation and its price is stale after the customer changes the quantity \u2014 how do I split the work between the collector and the processor?", "category": "dev", "option": "mcp-wiki", "answer": "Both symptoms trace back to using `Cart $toCalculate` vs `Cart $original` wrong and to doing the wrong work in the wrong phase, per Shopware's collector/processor cart pattern (`CartDataCollectorInterface::collect` + `CartProcessorInterface::process`). The rule the docs state explicitly is: always add/modify line items on `Cart $toCalculate`, never on `$original` \u2014 `$original` is only a read-only data source. If the surcharge item is added to `$original` (or otherwise persisted outside `$toCalculate`), it survives into the next calculation's `$original` and your processor adds a fresh copy on top of it every recalculation, producing duplicates; adding it only to `$toCalculate` each run avoids that because `$toCalculate` is rebuilt for every calculation. For the stale-price problem, split responsibilities: the collector (`collect(CartDataCollection $data, Cart $original, SalesChannelContext $context, CartBehavior $behavior)`) is where you fetch or compute data that does not depend on the current cart state (e.g. an external rate, a config value) and cache it in `$data` keyed with a plugin-prefixed key, guarding with `$data->has($key)` since `collect` can run multiple times per request; the processor (`process(CartDataCollection $data, Cart $original, Cart $toCalculate, SalesChannelContext $context, CartBehavior $behavior)`) is where you must recompute the actual price every single run, using the current line item state (quantity, tax rules) from `$toCalculate` \u2014 e.g. build a fresh `QuantityPriceDefinition($data->get($key), $product->getPrice()->getTaxRules(), $product->getPrice()->getQuantity())` and call `$this->calculator->calculate($definition, $context)` inside `process`, not once inside `collect`. Because `process` runs on every cart recalculation (including after a quantity change) while `collect`'s cached value is only the input data, doing the actual `calculate()` call in `process` each time is what keeps the surcharge price in sync with the current quantity. Register the class in `services.php` tagged both `shopware.cart.processor` and `shopware.cart.collector` with a priority below the core product collector/processor's `5000` (the docs use `4500`), so product prices and tax rules already exist when your processor runs. Also filter to the correct line item type (`LineItem::PRODUCT_LINE_ITEM_TYPE`) so unrelated items are not touched, and never query the database inside `process` \u2014 only inside `collect`.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/cart/change-price-of-item.md:1-91", "platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-discounts.md:1-78"], "toolCallLog": [{"tool": "read_doc", "args": "{path: 'platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-discounts.md'}"}, {"tool": "read_doc", "args": "{path: 'platform/dev/6.7/guides/plugins/plugins/checkout/cart/add-cart-items.md'}"}, {"tool": "grep_docs", "args": "{pattern: 'already exists|toCalculate->has|remove.*before.*add', path: 'platform/dev/6.7/guides/plugins/plugins/checkout/cart', regex: true}"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "partial"}, "dev-19": {"query": "I need to move long-running work in my plugin out of the request into the message queue \u2014 what does the handler class look like and how is it registered?", "category": "dev", "option": "mcp-wiki", "answer": "First define a message class (e.g. `<plugin root>/src/MessageQueue/Message/SmsNotification.php`) implementing `Shopware\\Core\\Framework\\MessageQueue\\AsyncMessageInterface` (routes to the `async` transport) or `LowPriorityMessageInterface` (routes to `low_priority`, available from 6.5.7.0) \u2014 without one of these interfaces (or explicit routing), the message is handled synchronously. Dispatch it from a service with `Symfony\\Component\\Messenger\\MessageBusInterface` injected (service id `messenger.default_bus`): `$this->bus->dispatch(new SmsNotification($message));`. For metadata like delays, dispatch a `Symfony\\Component\\Messenger\\Envelope` with stamps, e.g. `(new Envelope($message))->with(new DelayStamp(5000))`. Specific messages can be routed via `config/packages/shopware.yaml` under `shopware.messenger.routing_overwrite`. The handler class itself: create e.g. `<plugin root>/src/MessageQueue/Handler/SmsHandler.php`, mark it with the `#[Symfony\\Component\\Messenger\\Attribute\\AsMessageHandler]` attribute, and implement `__invoke(SmsNotification $message)` doing the actual work. Registration: the class must also be registered as a service tagged `messenger.message_handler` (via `services.php`, same DI mechanism as any other plugin service) \u2014 Shopware's `Shopware\\Core\\Framework\\MessageQueue\\MessageHandlerCompilerPass` merges the `#[AsMessageHandler]` attribute's arguments into that tag for tagged services (an explicit tag attribute wins over the attribute's own arguments when both are present). Messages must be serializable since core transports use a JSON symfony_serializer. Optionally add custom Messenger bus middleware, and see the hosting guide for queue/worker configuration in production.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-handler.md:1-60", "platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md:1-79"], "toolCallLog": [{"tool": "grep_docs", "args": "{pattern: 'message queue|MessageHandler', path: 'platform/dev/6.7/guides/plugins/plugins/framework', mode: 'files'}"}, {"tool": "grep_docs", "args": "{pattern: 'message queue', path: 'platform/dev/6.7/index.md'}"}, {"tool": "read_doc", "args": "{path: 'platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-handler.md'}"}, {"tool": "read_doc", "args": "{path: 'platform/dev/6.7/guides/plugins/plugins/framework/message-queue/add-message-to-queue.md'}"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-20": {"query": "How do I add my own condition to the Rule Builder from a plugin so shop owners can select it?", "category": "dev", "option": "mcp-wiki", "answer": "Two parts: a PHP rule class and its Administration registration. PHP: create a class in `<plugin root>/src/Core/Rule` extending `Shopware\\Core\\Framework\\Rule\\Rule`, implementing the two required abstract methods `match(RuleScope $scope): bool` (evaluate only from the scope, e.g. `$scope->getSalesChannelContext()->getCustomer()` \u2014 never run DB queries or slow operations here) and `getConstraints(): array` (maps each configurable field to its Symfony validation constraints, e.g. `['isFirstMondayOfTheMonth' => [new Type('bool')]]`). Define a `RULE_NAME` constant (the base class's `getName()` reads `static::RULE_NAME`, or override `getName()` yourself); rule properties must be `protected`, not `private`. Register the class in the plugin's `services.php` tagged `shopware.rule.definition` (autoconfigured services extending `Rule` get this tag automatically). Optionally override `getConfig(): ?RuleConfig`, e.g. `return (new RuleConfig())->booleanField('isFirstMondayOfTheMonth');`, which lets the Administration render the generic `sw-condition-generic` component so no custom JS/template is needed. Administration (if not using the generic config): in a decorator file imported from `main.js`, call `Shopware.Application.addServiceProviderDecorator('ruleConditionDataProviderService', (ruleConditionService) => { ruleConditionService.upsertGroup('your_group', {...}); ruleConditionService.addCondition('your_rule_name', { component: 'your-component', label: '...', scopes: ['global'], group: 'your_group' }); return ruleConditionService; });` \u2014 the condition's type string must equal the PHP rule's name. Build the component by extending `sw-condition-base` (`Shopware.Component.extend('your-component', 'sw-condition-base', {...})`, reading/writing `this.condition.value.<field>` via `this.ensureValueExist()`) and a template overriding block `sw_condition_value_content`. Optionally restrict where the condition is selectable ('context awareness') via `ruleConditionService.addAwarenessConfiguration('productPrices', { notEquals: ['your_rule_name'], ... })`, using `<sw-select-rule-create rule-aware-group-key=\"productPrices\">` in your own rule-select UI to auto-disable restricted rules.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/rule/add-custom-rules.md:1-89"], "toolCallLog": [{"tool": "read_doc", "args": "{path: 'platform/dev/6.7/guides/plugins/plugins/framework/rule/add-custom-rules.md'}"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-21": {"query": "My plugin dispatches its own domain event \u2014 how do I make it show up as a trigger in the Flow Builder?", "category": "dev", "option": "mcp-wiki", "answer": "Since 6.4.6.0, a custom event becomes a Flow Builder trigger by implementing Shopware\\Core\\Framework\\Event\\FlowEventAware plus the relevant Aware interfaces (e.g. CustomerAware) on your event class, giving it a getName()/EVENT_NAME and a static getAvailableData(): EventDataCollection. Each Aware interface has a matching storer (e.g. CustomerAware -> CustomerStorer) that writes/reads data into the StorableFlow (since 6.5, actions only get data via StorableFlow, not getAvailableData directly). For fully custom data, define an interface marked with the #[IsFlowEventAware] attribute plus a FlowStorer subclass (autoconfigured with the flow.storer tag) implementing store()/restore(); actions then read it via $flow->getStore()/$flow->getData(). Finally, register a subscriber for BusinessEventCollectorEvent::NAME ('collect.business-events') with priority 1000, tagged kernel.event_subscriber, that calls $this->businessEventCollector->define(ExampleEvent::class) and adds the resulting definition to $event->getCollection(). The trigger then appears under Settings > Flow Builder > Add flow. Gotcha: BusinessEventCollector::define() only recognizes interfaces carrying #[IsFlowEventAware] as awareness \u2014 core Aware interfaces themselves don't extend FlowEventAware. Source: https://developer.shopware.com/docs/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md:1-87"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "custom event.*flow builder", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "FlowEventAware", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/flow/add-flow-builder-trigger.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-22": {"query": "How do I give my plugin a settings page the shop operator can fill in, and what field types are available?", "category": "dev", "option": "mcp-wiki", "answer": "Create <plugin root>/src/Resources/config/config.xml (with xsi:noNamespaceSchemaLocation pointing at the shopware config.xsd for IDE autocompletion). Shopware renders the page dynamically from this file \u2014 no custom Administration module needed \u2014 and stores the values in system config. The <config> root needs at least one <card>, each with a <title> (translatable via lang attribute, pattern xx-XX, default en-GB). Inside a card, add <input-field> elements: <name> must be the first child, the technical key, matching pattern [a-zA-Z][a-zA-Z0-9]*, unique across all fields. The type attribute (default text) supports: text, textarea, text-editor, url, password, int, float, bool, checkbox, datetime, date, time, colorpicker, single-select, multi-select, price. Other settings: <label>/<placeholder>/<helpText> (translatable), <defaultValue> (imported into the DB on install/update), <disabled>/<required>/<copyable> (booleans), <minLength>/<maxLength> for text/url/password, <min>/<max> for int/float, and <options> with <option><id>/<name> entries for single-select/multi-select. Setting cache-relevant=\"true\" on an input-field or component marks a value whose change should trigger cache invalidation for cached Storefront output (available since 6.7.12.0; from 6.8.0.0 system config writes no longer invalidate caches by default unless flagged). For advanced fields beyond plain input types, use <component name=\"...\"> (name must match an allowed Administration component: sw-entity-single-select, sw-entity-multi-id-select, sw-media-field, sw-text-editor, sw-snippet-field), e.g. sw-entity-single-select with an <entity> and <label-property> to pick a related entity. Merchants fill in the values under Extensions -> My extensions -> Plugins -> Configure -> Configuration tab. Gotcha: sw-entity-single-select shows the entity's 'name' field by default, so entities without one (e.g. mail_template) need label-property or the select stays empty; sw-snippet-field does not write system config at all, it edits snippet translations. Source: https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md:1-97"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "plugin config", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-plugin-configuration.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-23": {"query": "How do I ship a mail template with my plugin so it is installed automatically, including a custom mail template type?", "category": "dev", "option": "mcp-wiki", "answer": "Ship the template by writing rows directly into the mail template tables from a plugin database migration (a class extending Shopware\\Core\\Framework\\Migration\\MigrationStep, implementing getCreationTimestamp() and update()) rather than creating it in the Administration. Steps: 1) Get a mail_template_type id \u2014 either look up an existing one (e.g. SELECT id FROM mail_template_type WHERE technical_name = 'contact_form', converted with Uuid::fromBytesToHex) or create a new type. 2) Insert a row into mail_template (id, mail_template_type_id, system_default = 0, created_at). 3) Look up language ids per locale (join language with locale on locale.code, e.g. en-GB, de-DE) and, only for languages that exist, insert into mail_template_translation (mail_template_id, language_id, sender_name, subject, description, content_html, content_plain, created_at) \u2014 sender_name can use Twig like {{ salesChannel.name }}; subject, content_html and content_plain are required. Use INSERT IGNORE INTO for all inserts and (new DateTime())->format(Defaults::STORAGE_DATE_TIME_FORMAT) for created_at. To also ship a custom mail template type, instead of looking up an existing type, insert into mail_template_type (id, technical_name, available_entities, created_at) \u2014 e.g. technical_name = 'custom_mail_template_type', available_entities = json_encode(['product' => 'product']) defining which entities the template can access \u2014 then insert one mail_template_type_translation row (mail_template_type_id, language_id, name, created_at) per existing language, and use that new type id for the mail_template insert. Gotcha: never delete mail templates on plugin uninstall since they may be referenced by other entities (causing inconsistency); INSERT IGNORE also makes reinstalls safe. Source: https://developer.shopware.com/docs/guides/plugins/plugins/content/mail/add-mail-template.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/mail/add-mail-template.md:1-73"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "mail template", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/content/mail/add-mail-template.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-24": {"query": "How do I get readable SEO URLs generated for the detail pages of my plugin's own entity?", "category": "dev", "option": "mcp-wiki", "answer": "For dynamic SEO URLs tied to a DAL entity (e.g. a detail page per entity record): 1) Implement Shopware\\Core\\Content\\Seo\\SeoUrlRoute\\SeoUrlRouteInterface on a route class with getConfig() (returns a SeoUrlRouteConfig built from your entity definition, a route name like 'frontend.example.example', a default template such as '{{ example.name }}', and a skipInvalid flag), prepareCriteria(Criteria $criteria, SalesChannelEntity $salesChannel) to add filters/associations, and getMapping(Entity $example, ?SalesChannelEntity $salesChannel): SeoUrlMapping which must supply every variable used in the template (e.g. key 'example' for '{{ example.name }}') via 'new SeoUrlMapping($example, [\"exampleId\" => $example->getId()], [\"example\" => $example->jsonSerialize()])'. 2) Register the class with the DI tag shopware.seo_url.route. 3) Subscribe to your entity's <entity>.written and <entity>.deleted events and call Shopware\\Core\\Content\\Seo\\SeoUrlUpdater::update(RouteName, $event->getIds()) to (re)generate the URLs \u2014 note this silently does nothing unless a matching seo_url_template row exists. 4) Ship a migration inserting into seo_url_template (id, sales_channel_id null, route_name, entity_name = your entity's technical name, template = the default template, created_at). Once wired, Shopware generates and persists rows in the seo_url table whenever entities are written/deleted, and detail pages resolve via the translated seo_path_info. Gotcha (code-checked against 6.7.13.0): the installed SeoUrlRouteInterface::prepareCriteria() and SeoUrlPersister::updateSeoUrls() signatures both require an extra SalesChannelEntity parameter beyond what the docs show. For purely static/non-entity URLs, use a migration writing directly into seo_url, or SeoUrlPersister::updateSeoUrls() for non-DAL dynamic content. Source: https://developer.shopware.com/docs/guides/plugins/plugins/content/seo/add-custom-seo-url.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/content/seo/add-custom-seo-url.md:1-103"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "seo url", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/content/seo/add-custom-seo-url.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-25": {"query": "How do I add a `bin/console` command to my plugin for a maintenance task?", "category": "dev", "option": "mcp-wiki", "answer": "Shopware CLI commands are plain Symfony Console commands, so a plugin adds one by registering the command class as a service tagged console.command; it then shows up automatically in bin/console (the plugin's Resources/config/services.* files are globbed and loaded by Bundle::build(), no extra wiring needed). Steps: 1) Register the service in <plugin root>/src/Resources/config/services.php: $services->set(Swag\\BasicExample\\Command\\ExampleCommand::class)->tag('console.command');. 2) Create the command class at <plugin root>/src/Command/ExampleCommand.php extending Symfony\\Component\\Console\\Command\\Command, decorated with #[AsCommand(name: 'swag:example', description: 'Example command')] from Symfony\\Component\\Console\\Attribute\\AsCommand, and implement protected function execute(InputInterface $input, OutputInterface $output): int returning Command::SUCCESS (execute() must return an int exit code). 3) Run it with bin/console swag:example. Gotcha: use a vendor-specific prefix in the command name (e.g. swag:) to avoid collisions with core or other plugins' commands \u2014 core commands use prefixes like scheduled-task:. For recurring/background maintenance work, prefer a scheduled task instead of a manually-run command. Source: https://developer.shopware.com/docs/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md:1-74"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "console command", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-custom-commands.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-26": {"query": "How do I add a custom document type such as a pro-forma invoice in Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "In 6.7, Shopware's Document System v2 (experimental, requires the DOCUMENT_GENERATION_REWORK feature flag; default from 6.8) treats a document type as just a technical-name string (lowercase letters/digits/underscores) \u2014 there is no type class or type tag. A type is 'supported' when renderers and providers accept it. Steps: 1) Create a render data DTO extending Shopware\\Core\\Checkout\\DocumentV2\\Struct\\AbstractRenderData; its public properties are flattened onto the template's config variable. 2) Create a data provider extending Shopware\\Core\\Checkout\\DocumentV2\\Provider\\AbstractDocumentDataProvider implementing getKey(), supports(string $documentType) (return true for e.g. 'proforma_invoice'), the optional enrichOrderCriteria(Criteria $criteria) (runs before the order loads), and provideRenderingData(OrderEntity $order, DocumentGenerationRequest $generationRequest, Context $context): AbstractRenderData. 3) Create a renderer for each output format you need, extending/implementing Shopware\\Core\\Checkout\\DocumentV2\\Renderer\\AbstractDocumentRenderer (declaring getFormat(), getDocumentTypes(), renderToString(); a PDF renderer also declares getDependencies() returning ['html']) \u2014 the built-in HtmlRenderer/PdfRenderer/ZugferdXmlRenderer/ZugferdEmbeddedPdfRenderer are final and only list 'invoice', so a new type needs its own renderer(s). 4) Register the provider tagged shopware.document_v2.provider and the renderer(s) tagged shopware.document_v2.renderer in PLUGIN_ROOT/src/Resources/config/services.php. 5) Add a Twig template at PLUGIN_ROOT/src/Resources/views/documents/<technical_name>.html.twig extending @Framework/documents/base.html.twig via {% sw_extends %} (the HTML renderer resolves @Framework/documents/%s.html.twig with the technical name). 6) Ship a migration inserting a document_type row whose technical_name matches your type (persisting throws 'document type not found' otherwise) and a number range of type document_<technical_name> (prefix document_). Gotchas: two renderers for the same format+type throw duplicateRenderer; provider keys must be unique per type; DTO property names must not collide with shared config keys like companyName/pageSize (templateContextPropertyCollision); DocumentMetaProvider (key meta) supports every type and is required by the built-in HTML/PDF renderers. Source: https://developer.shopware.com/docs/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md:1-88"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "document type", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/documents/v2/add-a-document-type.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-27": {"query": "In Shopware 6.7, how do I extend a Storefront Twig template from my plugin with `{% extends %}` so I keep the core markup and other plugins' changes?", "category": "dev", "option": "mcp-wiki", "answer": "Use Shopware's own multi-inheritance-aware tag sw_extends instead of plain Twig {% extends %} \u2014 sw_extends is what lets multiple plugins/themes each extend and override the same template without clobbering each other's changes. Steps: 1) Shopware looks for templates in each bundle's Resources/views directory, i.e. <plugin root>/src/Resources/views. 2) Find the original template's path under the core/other bundle's Resources/views (e.g. Storefront/Resources/views/storefront/layout/header/logo.html.twig). 3) Mirror that exact relative path under your plugin's views directory: <plugin root>/src/Resources/views/storefront/layout/header/logo.html.twig \u2014 the override only loads when the path below 'views' matches the original exactly. 4) In that file, extend the original and override only the block you need: {% sw_extends '@Storefront/storefront/layout/header/logo.html.twig' %} then {% block layout_header_logo_link %}...{% endblock %}. To append to the existing content rather than replace it, call {{ parent() }} inside the block. An extending file with no block overrides changes nothing. 5) Run ./bin/console cache:clear and reload the Storefront. Use {{ dump() }} in a template to inspect available variables. Gotchas: activate the plugin, and if working with a theme also assign it to the sales channel. Since 6.7.11.0 there is also a Storefront component system for reusable atomic template components as an alternative approach. Source: https://developer.shopware.com/docs/guides/plugins/plugins/storefront/templates/customize-templates.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-templates.md:1-67"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "extend.*template", "path": "platform/dev/6.7/guides/plugins/plugins/storefront", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-templates.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-28": {"query": "How do I override an existing Storefront JavaScript plugin, such as the cookie permission bar, from my own plugin instead of registering a new one?", "category": "dev", "option": "mcp-wiki", "answer": "Storefront JS plugins are plain ES classes: subclass the original, override its methods (calling super where needed), and swap the registration with PluginManager.override(). Example overriding the core CookiePermission plugin: 1) Create <plugin root>/src/Resources/app/storefront/src/my-cookie-permission/my-cookie-permission.plugin.js with a class extending the original, e.g. 'import CookiePermissionPlugin from \"src/plugin/cookie/cookie-permission.plugin\"; export default class MyCookiePermission extends CookiePermissionPlugin { init() { ...; super.init(); } _hideCookieBar() { if (confirm(...)) super._hideCookieBar(); } }'. If the original class cannot be imported (e.g. from a third-party plugin without an alias), fetch it at runtime instead: window.PluginManager.getPlugin('CookiePermission').get('class'). 2) Register the override in <plugin root>/src/Resources/app/storefront/src/main.js (main.ts also picked up), matching how the original was registered \u2014 core registers CookiePermission with a dynamic import, so override the same way: window.PluginManager.override('CookiePermission', () => import('./my-cookie-permission/my-cookie-permission.plugin'), '[data-cookie-permission]'); for a synchronously-registered plugin pass the class directly: PluginManager.override('Name', MyClass, '[selector]'). 3) Build the Storefront JS (shopware-cli project storefront-build for an extension, or composer run build:js:storefront in a platform checkout) and reload. Gotchas: override() only works on an already-registered plugin name, otherwise it logs 'Trying to extend non-registered plugin' and does nothing (core only registers CookiePermission when window.useDefaultCookieConsent is set); each plugin can only be overridden once \u2014 if two plugins override the same name, only the last registration wins, since override() deregisters and re-registers under that name; an async (dynamic-import) registered plugin needs an async override import too. Source: https://developer.shopware.com/docs/guides/plugins/plugins/storefront/javascript/override-existing-javascript.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md:1-76"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "override.*plugin", "path": "platform/dev/6.7/guides/plugins/plugins/storefront/javascript", "regex": true, "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/javascript"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/javascript/override-existing-javascript.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-29": {"query": "How do I add my own data to an existing Storefront page or pagelet from a plugin without overriding the core controller?", "category": "dev", "option": "mcp-wiki", "answer": "The pattern is: listen to the page's/pagelet's Loaded event, fetch the data through a store-api route (not the DAL directly), attach it via addExtension(), and render it in Twig \u2014 no controller override needed. Example, adding an active-product count to the footer pagelet: 1) Subscribe to the relevant Loaded event (e.g. Shopware\\Storefront\\Pagelet\\Footer\\FooterPageletLoadedEvent) in an EventSubscriberInterface (FooterPageletLoadedEvent::class => 'addActiveProductCount'), tag the subscriber kernel.event_subscriber. 2) If no existing store-api route returns exactly what you need, define your own: an abstract base with getDecorated() and load(Criteria, SalesChannelContext), routed with #[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StoreApiRouteScope::ID]])], and a concrete class whose getDecorated() throws DecorationPatternException and whose load() is routed e.g. path: '/store-api/get-active-product-count', methods: ['GET','POST']; it builds a Criteria (e.g. EqualsFilter('product.active', true) plus a CountAggregation) and calls $this->productRepository->aggregate(...)->get(...) (aggregate, not search), wrapped in a response class extending Shopware\\Core\\System\\SalesChannel\\StoreApiResponse whose inherited getObject() returns the result struct. Register the repository service and inject the route into the subscriber; routes.php must import the plugin's Core/**/*Route.php with attribute loading. 3) In the event listener: call $this->myRoute->load(new Criteria(), $event->getSalesChannelContext()) and then $event->getPagelet()->addExtension('product_count', $response->getObject()) (same addExtension() call works on a page via $event->getPage()). 4) In the template, sw_extends the original, call {{ parent() }} inside the block you extend, and read the data via the pagelet's/page's extensions, e.g. {% if footer.extensions.product_count %}{{ footer.extensions.product_count.count }}{% endif %}. Gotcha: addExtension() requires the value to be a Struct. Source: https://developer.shopware.com/docs/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md:1-73"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "page loaded event", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "pagelet", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-data-to-storefront-page.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-30": {"query": "How do I add a custom filter to the Storefront product listing from my plugin, both the criteria side and the filter panel?", "category": "dev", "option": "mcp-wiki", "answer": "Criteria side: create a subscriber (e.g. <plugin root>/src/Subscriber/ExampleListingSubscriber.php) listening to Shopware\\Core\\Content\\Product\\Events\\ProductListingCollectFilterEvent (ProductListingCollectFilterEvent::class => 'addFilter'). Core decides whether/how the filter is applied to the listing; you only register its metadata. In the listener, read $event->getFilters() (a FilterCollection) and $event->getRequest(), build a Shopware\\Core\\Content\\Product\\SalesChannel\\Listing\\Filter and add it: $filters->add($filter). Filter's constructor args in order are: name (unique string), filtered (bool, true when active/selected), aggregations (list of DAL aggregations used to compute facet counts/state), filter (the DAL filter added to the search criteria), values (added to the result as currentFilter), exclude (bool, default true). Example boolean filter on product.isCloseout: $filtered = (bool) $request->get('isCloseout'); new Filter('isCloseout', $filtered, [new FilterAggregation('active-filter', new MaxAggregation('active', 'product.isCloseout'), [new EqualsFilter('product.isCloseout', true)])], new EqualsFilter('product.isCloseout', true), $filtered). A multi-value example uses EntityAggregation + EqualsAnyFilter, e.g. for manufacturer ids. Filter panel side: create src/Resources/views/storefront/component/listing/filter-panel.html.twig, sw_extends '@Storefront/storefront/component/listing/filter-panel.html.twig', override block component_filter_panel_items, call {{ parent() }}, then sw_include one of the filter components under component/listing/filter/ (filter-boolean, filter-multi-select, filter-property-select, filter-range, filter-rating-select, filter-rating-select-item) passing at least name and displayName, e.g. sw_include '@Storefront/storefront/component/listing/filter/filter-boolean.html.twig' with { name: 'isCloseout', displayName: 'Closeout' }. The name passed to the Twig component should match the filter name/request parameter used in the subscriber. Gotchas: placing {{ parent() }} first puts your new filter after the existing ones \u2014 move it to the end of the block to put your filter first, or extend a more specific block (e.g. component_filter_panel_item_price) to position it relative to a particular existing filter; block component_filter_panel_items is available since Shopware 6.4.8.0. Source: https://developer.shopware.com/docs/guides/plugins/plugins/storefront/howto/add-listing-filters.html", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/howto/add-listing-filters.md:1-87"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "listing filter", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/howto/add-listing-filters.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-31": {"query": "How do I expose a plugin configuration value, such as a colour picked in the Administration, as an SCSS variable in my Storefront styling?", "category": "dev", "option": "mcp-wiki", "answer": "Use the declarative <css> approach in your plugin's config.xml. 1) In src/Resources/app/storefront/src/scss/base.scss provide a fallback value marked !default, e.g. `$sass-plugin-header-bg-color: #ffcc00 !default;`. 2) In src/Resources/config/config.xml, add a <css> element inside the <input-field> (e.g. a colorpicker field) whose content is the SCSS variable name without the $, e.g. `<css>sass-plugin-header-bg-color<\/css>`, plus a <defaultValue>. During theme compilation, Shopware's ThemeCompilerEnrichScssVarSubscriber listens to ThemeCompilerEnrichScssVariablesEvent, reads the resolved plugin config per sales channel, and for every field with a css entry calls addVariable(<css>, value ?? defaultValue), so the configured value overrides the SCSS default. 3) Recompile the theme afterwards (bin/console theme:compile) \u2014 changing the configured value does not trigger an automatic recompile. Only string values are applied; non-string values are skipped, and this css flag is available since Shopware 6.4.13.0. If you need more flexibility (computed values, looping over multiple config fields, conditional variables, or values that differ per sales channel without a dedicated config field), you can instead write an event subscriber on Shopware\\Storefront\\Theme\\Event\\ThemeCompilerEnrichScssVariablesEvent and call $event->addVariable('name', $value) yourself, reading values via SystemConfigService::get('Plugin.config.field', $salesChannelId).", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables.md:1-76", "platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables-via
