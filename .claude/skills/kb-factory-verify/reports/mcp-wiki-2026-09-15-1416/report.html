-subscriber.md:1-85"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "scss variable", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "config to scss", "path": "platform/dev/6.7"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables-via-subscriber.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/styling/add-scss-variables.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-32": {"query": "How do I define a custom field set for products from my plugin so merchants can edit the values in the Administration?", "category": "dev", "option": "mcp-wiki", "answer": "Products already support custom fields (the DAL's product entity has the customFields property backed by the custom_fields JSON column), so you only need to register a custom field set, not modify the entity. Two ways: (1) Declarative, since 6.7.13.0: place a file at <plugin root>/src/Resources/config/custom-fields.xml (same XML format as the app manifest's custom fields, which lets a field set declare which entity it applies to, e.g. product). On plugin install/update Shopware syncs the sets \u2014 present sets/fields are created or updated, ones removed from the XML are deleted; on uninstall (without 'keep user data') the plugin's sets are removed automatically. No lifecycle hooks or installer service are needed. (2) Imperative, for older versions or dynamic needs: inject the custom_field_set.repository and call create() in a plugin lifecycle method, e.g. `['name' => 'swag_example_set', 'global' => true, 'config' => ['label' => ['en-GB' => '...']], 'customFields' => [['name' => 'swag_example_size', 'type' => CustomFieldTypes::INT, 'includeInSearch' => true, 'config' => ['label' => [...], 'customFieldPosition' => 1]]]]`. Always use a vendor-specific name prefix (e.g. swag_) since field and set names are global. The Administration renders each field according to its declared CustomFieldTypes type and validates writes against that type. Setting global: true makes the set non-editable/non-deletable in the Administration UI; set global to false if merchants should be able to edit/delete the set itself there (the field values on the product are still editable either way once the set is assigned to the product entity). Custom fields are not searchable by default \u2014 set includeInSearch to true (available since 6.7.6.0) and rebuild the search index for existing data. On deleting a set, stored values remain in entities' custom_fields JSON and must be cleaned up manually, e.g. via a batched SQL UPDATE using JSON_REMOVE/JSON_CONTAINS_PATH.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/custom-field/add-custom-field.md:1-106"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "custom field set", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/custom-field/add-custom-field.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-33": {"query": "How do I register a custom Administration module from my plugin, and what has to line up for it to actually show up after a build?", "category": "dev", "option": "mcp-wiki", "answer": "Create <plugin root>/src/Resources/app/administration/src/module/swag-example/index.js and import it from main.js (`import './module/swag-example';`) \u2014 the module is unknown to the Administration until imported. In that index.js call Shopware.Module.register(id, config): the id must have the format [namespace]-[name] (contain at least one hyphen) and be unique, or registration aborts. Key config options: type ('plugin' for third-party modules, default when omitted), name, title (browser title/snippet key), description, color, icon; routes (object keyed by route key \u2014 required unless a routeMiddleware is set; route names become '<id with - replaced by .>.<routeKey>', e.g. swag.example.list, paths prefixed /swag/example/); navigation (array of entries with label/path/id/link \u2014 for type 'plugin' every entry needs a parent, otherwise the core factory drops it with a warning 'Navigation entries from plugins are not allowed on the first level'; plugin entry positions are also offset by 1000); snippets (per-locale objects, e.g. { 'de-DE': deDE, 'en-GB': enGB }, merged into the Administration translations, keys prefixed with the module/extension name); and optionally settingsItem (group, to, icon or iconComponent, plus id/name/label falling back to the module's own) to link the module into Settings \u2014 valid group values are general, localization, customer, commerce, content, automation, system, account, plugins (not 'shop'/'system'/'plugins' as older docs said). A settingsItem missing group, to, or both icon and iconComponent is not registered, and display: false in the module config skips registration entirely, as does a duplicate module id. Finally, build the Administration assets with the plugin active: `shopware-cli project admin-build` (project template) or `composer run build:js:admin` (platform contribution setup). For a plugin named e.g. AdministrationNewModule, the build outputs to <plugin root>/src/Resources/public/administration/js/administration-new-module.js, which must ship with the plugin \u2014 it gets copied to <shopware root>/public/bundles/administrationnewmodule/administration/js/administration-new-module.js. A successful build alone is not enough: the module must actually be imported in main.js, correctly registered, and its routes/components/snippets wired up, or it still won't appear.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/add-custom-module.md:1-82"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "add custom module", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/add-custom-module.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-34": {"query": "How do I extend an existing Administration component and its Twig blocks from my plugin, for example to change the dashboard headline?", "category": "dev", "option": "mcp-wiki", "answer": "Use Shopware.Component.override() to modify an existing component in place (affects every usage) or Shopware.Component.extend() to create a new component based on an existing one while leaving the original untouched. Example for the dashboard headline: create a template override file (e.g. <plugin root>/src/Resources/app/administration/src/sw-dashboard-index-override/sw-dashboard-index.html.twig) that redeclares the block sw_dashboard_index_content_intro_content_headline: `{% block sw_dashboard_index_content_intro_content_headline %}<h1>Welcome to a customized component<\/h1>{% endblock %}` \u2014 put `{% parent %}` inside the block if you want to keep the original markup alongside your changes. Then register it in an index.js: `import template from './sw-dashboard-index.html.twig'; Shopware.Component.override('sw-dashboard-index', { template });` and import that index.js from your plugin's main.js (e.g. `import './sw-dashboard-index-override/';`). To also change logic, redefine methods or computed properties in the override/extend config; call this.$super('methodName') inside your override to still run the inherited implementation, otherwise the inherited logic is dropped entirely. There is also an experimental Composition API extension mechanism (Shopware.Component.overrideComponentSetup(), Shopware.Component.createExtendableSetup) for components built with createExtendableSetup, but it only supports overriding, not extending, and its API may still change (marked experimental, stableVersion v6.8.0).", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-components.md:1-84"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "override.*component", "path": "platform/dev/6.7/guides/plugins/plugins/administration", "mode": "files", "regex": true}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/module-component-management/customizing-components.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-35": {"query": "How do I load entities from the Admin API inside an Administration component using the repository factory and a Criteria?", "category": "dev", "option": "mcp-wiki", "answer": "Inject the repositoryFactory DI service into your component and create a repository for the entity, e.g. `inject: ['repositoryFactory'], computed: { productRepository() { return this.repositoryFactory.create('product'); } }`. The signature is create(entityName, route = '', options = {}); route defaults to /<entity-name-with-dashes> (used for association repositories otherwise), and options can carry useSync, keepApiErrors, compatibility. Build a Criteria via `const { Criteria } = Shopware.Data; const criteria = new Criteria();` and configure it with setPage(), setLimit(), setTerm(), setIds(), setTotalCountMode() (0 = no total/fastest, 1 = exact total/slow, 2 = fetch limit*5+1 to check whether a next page exists/fast), addFilter(Criteria.equals('product.active', true)), addSorting(Criteria.sort('product.name', 'DESC')), addAggregation(...), and addAssociation('manufacturer') (or getAssociation('categories').addSorting(...) to refine an association's own criteria). Then call `this.productRepository.search(criteria, Shopware.Context.api).then(result => { ... })` \u2014 search resolves to an EntityCollection (not a SearchResult class, despite older docs). For a single record use `repository.get(id, Shopware.Context.api, criteria?)`, which internally runs search with setIds([id]). To create, call `repository.create(Shopware.Context.api)`, fill the fields, then `repository.save(entity, Shopware.Context.api)`; to delete, `repository.delete(id, Shopware.Context.api)` or, for several at once, `repository.syncDeleted(ids, Shopware.Context.api)`. Associations loaded via addAssociation come back as an entity for ManyToOne relations or an EntityCollection (carrying entity and source, e.g. /product/{id}/categories) for ToMany; a ManyToOne is set by writing the foreign key field and saving, while a persisted ManyToMany/OneToMany association gets its own repository created with `repositoryFactory.create(collection.entity, collection.source)` and manipulated with search/create+save/delete, or assign(id, Context.api)/delete(id, Context.api) for ManyToMany links. Entities in the Administration are stateless, so change tracking only sends changed fields but saving must be triggered manually, and after save you should re-fetch with get if you need fresh data.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md:1-109"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "repositoryFactory", "path": "platform/dev/6.7/guides/plugins/plugins/administration", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/data-handling-processing/using-data-handling.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-36": {"query": "How do I register ACL privileges for my plugin's Administration module and check them in a component or template?", "category": "dev", "option": "mcp-wiki", "answer": "An admin privilege identifier has the form <key>.<role>, e.g. product.viewer. Category 'permissions' fixes the roles to viewer/editor/creator/deleter; category 'additional_permissions' accepts any role name (e.g. system.clear_cache). These privileges gate the Administration UI only, not API access (which is enforced separately). Register a mapping \u2014 recommended in <your-component>/acl/index.js, imported by the component's index.js, reachable transitively from main.js, and it must run before the role detail page is opened: `Shopware.Service('privileges').addPrivilegeMappingEntry({ category: 'permissions', parent: null, key: 'your_key', roles: { viewer: { privileges: ['product_review:read'], dependencies: [] }, editor: { privileges: ['product_review:update'], dependencies: ['your_key.viewer'] } } });` \u2014 privileges are API permissions in entity_name:operation form, dependencies are other admin identifiers auto-checked alongside the role; calling addPrivilegeMappingEntry again with an existing category+key deep-merges roles into that entry (a mapping missing category, parent or key is skipped with a warning, so always pass parent: null when there is no parent). You can reuse another module's mapping with Shopware.Service('privileges').getPrivileges('rule.viewer') inside a privileges array (a lazy resolver; it does not itself grant access to that module). Protect things by adding a privilege: routes get meta: { privilege: 'your_key.your_role' } (checked by the router guard), navigation entries get privilege: '...', settingsItem entries get privilege: '...', and shortcuts get an active() function such as `active() { return this.acl.can('product.editor'); }`. Add snippets under sw-privileges: group label at sw-privileges.<category>.<key>.label, and for additional_permissions also a per-role label at sw-privileges.additional_permissions.<key>.<role>. To check rights in a component, inject the acl service (`inject: ['acl']` or Shopware.Service('acl')) and call this.acl.can('sales_channel.creator'); in a template use v-if=\"acl.can('review.editor')\", and for a disabled-but-visible button add a v-tooltip with message: $tc('sw-privileges.tooltip.warning') and showOnDisabledElements: true. acl.can returns true for admin users and also for an empty identifier. Finally, to make an existing Administration role (e.g. product.viewer) automatically receive your plugin's extra API privileges, override enrichPrivileges(): array in your Shopware\\Core\\Framework\\Plugin subclass, returning a map of role identifier to extra privileges (e.g. 'product.viewer' => ['my_custom_privilege:read']); a core subscriber merges these into ACL roles when roles are loaded, for active plugins. Note: Administration ACL can be bypassed by direct API calls, so it is not a substitute for API-level authorization.", "citations": ["platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md:1-95"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "acl", "path": "platform/dev/6.7/guides/plugins/plugins/administration", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/administration/permissions-error-handling/add-acl-rules.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-37": {"query": "How do I set up and run PHPUnit integration tests for my Shopware plugin, including tests that boot the kernel?", "category": "dev", "option": "mcp-wiki", "answer": "Scaffold the config with `bin/console plugin:create`, which generates <plugin root>/phpunit.xml and <plugin root>/tests/TestBootstrap.php. The generated phpunit.xml sets bootstrap=\"tests/TestBootstrap.php\", server KERNEL_CLASS=Shopware\\Core\\Kernel, env APP_ENV=test and SYMFONY_DEPRECATIONS_HELPER=weak, and a single testsuite named '<PluginName> Testsuite' pointing at the tests directory (add further <testsuite> entries yourself, e.g. a 'migration' suite, if you need to run subsets separately). In TestBootstrap.php, bootstrap the kernel with Shopware\\Core\\TestBootstrapper: `$loader = (new TestBootstrapper())->addCallingPlugin()->addActivePlugins('BasicExample')->setForceInstallPlugins(true)->bootstrap()->getClassLoader(); $loader->addPsr4('Swag\\\\BasicExample\\\\Tests\\\\', __DIR__);` \u2014 addCallingPlugin() finds your plugin via the nearest composer.json's extra.shopware-plugin-class, and setForceInstallPlugins(true) installs/activates the plugin even against an existing test database. For an integration test that boots the kernel, extend PHPUnit\\Framework\\TestCase and use the trait Shopware\\Core\\Framework\\Test\\TestCaseBase\\IntegrationTestBehaviour, which bundles database transaction, cache, kernel, request stack, session and translation behaviours. For a migration test, use KernelTestBehaviour instead, fetch the DBAL Connection via $this->getContainer() (KernelTestBehaviour::getContainer() returns the test.service_container and throws if the kernel has none), run $migration->update($conn), and compare schema/state before and after. You can override services just for tests by adding <plugin root>/Resources/config/services_test.php, which overrides arguments/aliases/parameters of services.php only in the test environment. Run from the project root, e.g. `./vendor/bin/phpunit --configuration=\"custom/plugins/SwagBasicExample\" --testsuite \"migration\"` (omit --testsuite to run all suites), or target a single class/method with --filter testNoChanges or --filter Migration1611740369ExampleDescriptionTest. In a Flex/composer project template, `composer require --dev dev-tools` provides the PHPUnit binary.", "citations": ["platform/dev/6.7/guides/development/testing/unit/php-unit.md:1-88"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "phpunit", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/testing/unit/php-unit.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-38": {"query": "How do I write Jest unit tests for my Administration components in Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "Place the test file next to the file it tests, same name with a .spec.js or .spec.ts suffix. For plain services/ES modules, just import them directly and test normally. For a Vue component, run `composer run admin:create:test` (in the Shopware root, pasting the component/service path) to scaffold a .spec file with recommended boilerplate, and `composer run init:js` for dependencies. Never import the component file directly for mounting \u2014 build it through the global factory, since in 6.7 Shopware.Component.build() is async and returns a Promise resolving the Twig template plus all overrides/extensions into a Vue component: `async function createWrapper() { return shallowMount(await Shopware.Component.build('sw-your-component-for-test'), { props: {...}, stubs: { 'sw-missing-component-one': await Shopware.Component.build('sw-missing-component-one') }, mocks: {...}, attachTo: document.body }); }`. Prefer shallowMount() (children stubbed) over mount(); create the wrapper in beforeEach with await flushPromises(), tear it down and flush again in afterEach; a minimal first assertion is expect(wrapper.vm).toBeTruthy(). Fix common Vue warnings by passing missing props, stubbing unknown custom elements (with a dummy or a real Shopware.Component.build() child), adding function mocks for methods the render throws on, providing directive mocks for unresolved directives, and muting missing injections with e.g. provide: { mediaService: {} } or a realistic stub of the used methods; if code resolves a service via Shopware.Service('mediaService'), register a mock in beforeAll with Shopware.Service.register('mediaService', {...}). For slots, mount with slots: { default: 'My custom message' } and assert the rendered text. The preconfigured test environment gives you global.activeAclRoles = ['product.editor'] (default: no rights) to control ACL, global.activeFeatureFlags = ['FEATURE_NEXT_12345'] for flags, and a working repositoryFactoryMock generated from the entity schema \u2014 add fixture responses via global.repositoryFactoryMock.responses.addResponse({ method, url, status, response: { data: [...] } }) and silence unmocked-route warnings with global.repositoryFactoryMock.showWarning = false; global directives/filters, several service mocks, and auto-mocked $tc/$device/$store/$router are all provided and overridable in the mount/shallowMount options. Run tests with `composer run admin:unit` (all tests plus coverage) or `composer run admin:unit:watch` (re-run on save) \u2014 these scripts target the Shopware-provided Administration, so a plugin may need its own equivalent scripts. Note: the Administration runs on Vue 3, so Vue-2-era Vue Test Utils helpers like createLocalVue are not applicable \u2014 check current @vue/test-utils APIs for your setup.", "citations": ["platform/dev/6.7/guides/development/testing/unit/jest-admin.md:1-83"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "jest", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/testing/unit/jest-admin.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-39": {"query": "How do I write end-to-end Cypress tests for my plugin against a Shopware 6.7 store?", "category": "dev", "option": "mcp-wiki", "answer": "In the Shopware 6.7 developer docs, Cypress is filed under legacy testing and is deprecated/unmaintained \u2014 the official recommendation for new E2E tests is Playwright (see platform/dev/6.7/guides/development/testing/e2e-playwright/) \u2014 but the Cypress guide is still documented for maintaining existing tests. Setup uses the @shopware-ag/e2e-testsuite-platform package (its repository is archived), built on Cypress plus the cypress-select-tests, cypress-log-to-output and cypress-file-upload plugins. Prerequisites: a clean installation (composer run init without demo data), production mode, and a theme assigned to the shop. In your plugin, create Resources/app/<environment>/test/e2e/cypress/ (environment = administration or storefront) with fixtures/, integration/, plugins/ and support/ subfolders. Steps: 1) `npm init -y` and add a script `\"open\": \"node_modules/.bin/cypress open\"`; 2) `npm install @shopware-ag/e2e-testsuite-platform`; 3) in cypress/plugins/index.js: `module.exports = require('@shopware-ag/e2e-testsuite-platform/cypress/plugins');`; 4) in cypress/support/index.js: `require('@shopware-ag/e2e-testsuite-platform/cypress/support');`; 5) run with `CYPRESS_baseUrl=<your-url> npm run open`, where <your-url> is the Storefront URL. For the platform project itself (Docker-based), the composer scripts are e2e:setup (outside container, prepares a clean install and dependencies), e2e:prepare (inside container, when already clean), e2e:open (outside container, Test Runner UI), and e2e:cypress -- run --spec=\"cypress/e2e/administration/**/*.cy.js\" (or storefront/**) for headless runs. Tests use Mocha-style describe()/it() with BDD should/expect assertions; clean up state in beforeEach, not after. Test data is loaded from JSON fixtures in e2e/cypress/fixtures and sent to the Admin API with cy.createDefaultFixture(endpoint, data, jsonPath), which merges data into the fixture; entities needing existing foreign-key IDs get a custom fixture service extending AdminFixtureService that looks up related entities and posts via this.apiClient.post(). Do not use UUID-based IDs as selectors since they change between installations.", "citations": ["platform/dev/6.7/guides/development/testing/legacy/cypress/_index.md:1-93", "platform/dev/6.7/guides/development/testing/_index.md:1-37"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "cypress", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/testing/legacy/cypress/_index.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/testing/_index.md"}}, {"tool": "grep_docs", "args": {"pattern": "playwright", "path": "platform/dev/6.7/guides/development/testing", "mode": "files"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-40": {"query": "How do I upgrade a Composer-based Shopware project from 6.6 to 6.7 \u2014 which composer.json constraint do I change, and which console commands do I run afterwards?", "category": "dev", "option": "mcp-wiki", "answer": "The recommended way is the Shopware CLI upgrade wizard from a clean Git working tree: `shopware-cli project upgrade` (or, for CI/read-only preflight, `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run`). It checks readiness, lets you pick the target version, checks Composer-managed extensions and verifies the dependency set before touching files; it does not deploy, so you still test, review the report, commit and deploy yourself. For a manual Composer-based update: 1) on a running environment, enable maintenance mode first: `bin/console sales-channel:maintenance:enable --all` (or -a; you can target specific sales channel ids instead of --all). 2) Raise the Shopware version constraint in composer.json (and shopware/commercial's constraint too if that package is used) \u2014 without raising the constraint, composer update just resolves back to the currently installed version and nothing upgrades. Then run `composer update --no-scripts` (the --no-scripts flag is needed because some scripts call Shopware commands that only work after Composer recipes are updated). 3) Optionally, and recommended, run `composer recipes:update` and review the resulting changes. 4) Run `bin/console system:update:finish` \u2014 this runs the database migrations and asset installation, and the Storefront reacts to the post-finish event to recompile themes; it skips itself if DATABASE_URL is not defined. Useful options: --skip-migrations, --skip-asset-build, --version-selection-mode (default 'safe', controls how potentially destructive migrations are handled). 5) Disable maintenance mode again: `bin/console sales-channel:maintenance:disable --all`. Best practices around the upgrade: take a DB backup, test on staging with production-like data first, read the release notes/UPGRADE files, check extension compatibility, consider Rector and the Administration codemods for code migration, avoid skipping major versions, and commit composer.json/composer.lock. Afterwards, clear caches, rebuild assets if needed, and test checkout/login/API flows plus your extensions, reviewing logs for errors and deprecations.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md:1-71"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "upgrade", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/upgrade-shopware.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-41": {"query": "`composer update` to Shopware 6.7 aborts on a platform requirement and my admin build then fails too \u2014 which PHP, database and Node versions does 6.7 actually require, and how do I check the machine I am on against them before I retry?", "category": "dev", "option": "mcp-wiki", "answer": "Shopware 6.7 requires PHP 8.2 minimum (8.4 recommended); the installed shopware/core composer package actually accepts `~8.2.0 || ~8.3.0 || ~8.4.0 || ~8.5.0`, with `memory_limit` >= 512M and `max_execution_time` >= 30s, and Composer 2.2+ recommended. For the database, the minimum is MariaDB 10.11 (code checks 10.11 specifically, docs say 10.11.6) or MySQL 8.0.22, with MariaDB 11.4 / MySQL 8.4 recommended; MySQL 'Innovation' releases are unsupported and `max_allowed_packet` should be >= 32M. For Node.js/npm (required for the admin/storefront build), the minimum is Node 20.0.0, with Node 24 / npm 10 recommended. Required PHP extensions per the installed shopware/core composer.json: ctype, curl, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, openssl, pdo, pdo_mysql, session, simplexml, sodium, xml, xmlreader, zip, zlib (amqp optional for message queues). To check your machine before retrying: run `php -v`, `php -m` (and `php -m | grep intl` since Homebrew PHP on macOS often lacks intl), `php -i | grep memory_limit`, `composer -V`, `node -v`, and `npm -v`. Note that CLI and FPM often load different php.ini files and a host may have multiple PHP binaries, so check the one that actually runs Shopware.", "citations": ["platform/dev/6.7/guides/hosting/_index.md:1-66"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "system requirements", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "PHP 8", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/installation/system-requirements.md"}}, {"tool": "grep_docs", "args": {"pattern": "Node", "path": "platform/dev/6.7/guides/hosting", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/guides/hosting/infrastructure"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/_index.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/infrastructure/database.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-42": {"query": "How do I check extension compatibility before upgrading with shopware-cli, and why does it report my plugins in custom/plugins as blocking?", "category": "dev", "option": "mcp-wiki", "answer": "Use `shopware-cli project upgrade`, which runs a local-first upgrade wizard with six phases: readiness, target version choice, extension compatibility + Composer resolution check, plan review, local apply with live logs, and a report. As a preparation step before that, run `shopware-cli project validate` to find removed/renamed Shopware PHP types in custom code, and `shopware-cli project autofix composer-plugins` to migrate extensions from `custom/plugins` into Composer. For a non-destructive check, run it non-interactively as a preflight: `shopware-cli project upgrade --no-interaction --target latest-patch --dry-run` (`--target` is required with `--no-interaction`, and can be an exact version, `recommended`, or `latest-patch`); `--dry-run` runs the checks/analysis/Composer resolution, prints the plan and writes a report without changing files. The report is written to `.shopware-cli/upgrade/report.md` and includes readiness/PHP requirements, planned Composer changes, and per-extension results (blocked / needs review / needs update / OK). Plugins in `custom/plugins` are reported as blocking because the wizard's prerequisite check requires all discovered extensions to be Composer-managed; extensions outside `vendor/` (i.e. still living in `custom/plugins` rather than required via Composer) fail that readiness check and block the upgrade until migrated (e.g. via `shopware-cli project autofix composer-plugins`).", "citations": ["platform/dev/6.7/products/tools/cli/project-commands/upgrade.md:1-78"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "compatibility", "path": "platform/dev/6.7/products/tools/cli", "mode": "files"}}, {"tool": "list_docs", "args": {"path": "platform/dev/6.7/products/tools/cli"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/products/tools/cli/project-commands/upgrade.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-43": {"query": "My admin plugin still ships a webpack.config.js \u2014 how do I move the administration build to Vite for Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "Shopware 6.7 builds the Administration with Vite instead of Webpack (apps are unaffected, their build is decoupled). To migrate: 1) create `vite.config.mts` in `YourApp/src/Resources/app/administration/src` (previously `webpack.config.js` lived in `YourApp/src/Resources/app/administration/build/`); 2) remove the old `webpack.config.js`; 3) remove all webpack-related dependencies from `package.json`; 4) add the Vite dependencies to `package.json`. A minimal config looks like: `import { defineConfig } from 'vite'; export default defineConfig({ resolve: { alias: { '@example': 'src/example' } } });`. Behind the scenes, `php bin/console bundle:dump` (class `Shopware\\Core\\Framework\\Plugin\\Command\\BundleDumpCommand`) writes all active bundles/plugins to `var/plugins.json`, and this is part of `composer build:js:admin` / `composer watch:admin`. The core's own Vite config covers only the core; `build/plugins.vite.ts` reads `var/plugins.json` and calls Vite `build` per plugin (or `createServer` per plugin during `watch:admin`). Asset loading uses the `pentatrion_vite` Symfony bundle and `entrypoints.json` from `vite-plugin-symfony`; for plugins, `application.ts` injects entry files from `/api/_info/config` in production or from `sw-plugin-dev.json` in dev mode. Available Vite plugins with the `shopware-vite-plugin-` prefix include `asset-path`, `static-assets`, `serve-multiple-static`, `vue-globals`, `override-component`, and `twigjs`. Note: HMR only reloads `*.vue` files, so it is limited until components are moved to single-file components; and the `ADMIN_VITE` feature flag mentioned in older docs no longer exists in the installed 6.7.13.0 code because Vite is simply the build now.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/vite.md:1-73"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "vite", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/administration/vite.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-44": {"query": "After the Vue 3 upgrade my admin plugin broke \u2014 this.$parent resolves to the wrong component and a prop default that calls this.$tc throws. What do I have to change?", "category": "dev", "option": "mcp-wiki", "answer": "Both issues are known Vue 2 -> Vue 3 migration pitfalls documented for Shopware's Administration (Vue 3 is used from Shopware 6.6 onward, Administration continues on Vue 3 in 6.7). For `this.$parent`: async component wrappers change the component tree, so the immediate parent you expect may now be the AsyncComponentWrapper instead of the real parent \u2014 you may need `this.$parent.$parent`, but the guide recommends preferring services or events over relying on `$parent` at all. For the prop default calling `this.$tc`: prop default functions have no `this` context in Vue 3, so `this.$tc` is unavailable there \u2014 use `Shopware.Snippet.tc` instead (confirmed in the installed code: `Shopware.Snippet.tc` maps to `i18n.global.t`). More generally, the guide recommends searching your plugin code for any `this.$` usage, since Vue's internal API usage is very likely to break in Vue 3 \u2014 with the explicit exception of `this.$tc` itself (which still works in a normal component method/lifecycle context, just not inside a prop default function). Also note mutating props now throws hard errors in Vue 3, and `@hook:mounted`-style lifecycle hooks may fire twice for asynchronously loaded components.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/vue3.md:1-67"], "toolCallLog": [{"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/administration/vue-native.md"}}, {"tool": "grep_docs", "args": {"pattern": "\\$parent", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "Vue 3", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/administration/vue3.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-45": {"query": "Shopware.State is deprecated in 6.7 \u2014 how do I convert my administration Vuex module into a Pinia store?", "category": "dev", "option": "mcp-wiki", "answer": "In Shopware 6.7 Pinia replaces Vuex as the Administration state management library; `Shopware.State` (and `VuexRootState`) are marked `@deprecated tag:v6.8.0` in the installed code and will be removed, replaced by `Shopware.Store`. To migrate: 1) register the store with `Shopware.Store.register('<storeName>', { state: () => ({...}), getters: {...}, actions: {...} })` (or pass a single definition object carrying an `id` field) instead of `Shopware.State.registerModule('product', productsStore)`. 2) `state` must be a function returning the initial state (as in Vuex), but drop `mutations` entirely and modify state directly inside actions, e.g. `this.productName = newName`. 3) Getters must not share a name with a state property, since both are exposed at the same level, and getters should only compute rather than modify. 4) Import the store file from a component or index file to register it, e.g. `import './state/products.state';`. Registering an existing id overwrites it; remove a store with `Shopware.Store.unregister('<storeName>')`. 5) Read state with `Shopware.Store.get('<storeName>')` instead of `Shopware.State.get(...)` \u2014 the installed code throws `Store with id \"...\" not found` for unknown ids. 6) For TypeScript typing: `export type StoreType = ReturnType<typeof store>;` then `declare global { interface PiniaRootState { myStore: StoreType; } }`. 7) For composable stores, pass a setup function (or an external composable) as the second argument to `Shopware.Store.register`; only returned refs/functions are tracked in devtools. 8) For tests: import the store file and call `store.$reset()` in `beforeEach`; for components using the store, create a Pinia instance via `createPinia()`, call `setActivePinia(pinia)` in `beforeEach`, and mount with `global: { plugins: [pinia] }`.", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/pinia.md:1-70"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "Pinia", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/administration/pinia.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-46": {"query": "sw-button and sw-card are deprecated in Shopware 6.7 \u2014 how do I migrate my plugin's admin templates to the Meteor components, and is there a codemod that does it?", "category": "dev", "option": "mcp-wiki", "answer": "Yes, there is a codemod. In Shopware 6.7 several `sw-*` Administration components are being replaced by components from the Meteor Component Library (prefix `mt-`, e.g. `mt-url-field`, `mt-number-field`), built on the Shopware Design System. With a development installation of Shopware and the plugin located in `custom/plugins`, run `composer run admin:code-mods` to print help, then run it for real: `composer run admin:code-mods -- --plugin-name example-plugin --fix -v 6.7`. The tool automatically replaces compatible components with Meteor Components, adds guidance comments where manual migration is required, and fixes some other deprecated code where possible; per-component migration details live in the technical upgrade documentation of the release. To keep one plugin codebase working on both 6.6 and 6.7, the core wrapper components (e.g. the URL field wrapper) expose a `deprecated` Boolean prop, default `false`; leaving it `false` renders the Meteor component (`mt-url-field`), while setting it `true` renders the old component (`sw-url-field-deprecated`) \u2014 but the docs recommend migrating fully to Meteor Components rather than relying on this bridge, since it exists only to ease the 6.6/6.7 transition, and the installed code already marks wrappers like `sw-url-field` itself as `@deprecated tag:v6.8.0` ('Will be removed, use mt-url-field instead').", "citations": ["platform/dev/6.7/guides/upgrades-migrations/administration/meteor-components.md:1-62"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "Meteor", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/upgrades-migrations/administration/meteor-components.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-47": {"query": "My payment plugin implements `AsynchronousPaymentHandlerInterface` and is tagged `shopware.payment.method.async` \u2014 how do I write a payment handler for Shopware 6.7 instead?", "category": "dev", "option": "mcp-wiki", "answer": "In Shopware 6.7.0.0 the whole `PaymentHandlerInterface` family (including `SynchronousPaymentHandlerInterface`, `AsynchronousPaymentHandlerInterface`, `PreparedPaymentHandlerInterface`, `RecurringPaymentHandlerInterface`, `RefundPaymentHandlerInterface`) was replaced by a single abstract class `Shopware\\Core\\Checkout\\Payment\\Cart\\PaymentHandler\\AbstractPaymentHandler`; none of the old interfaces exist in the installed 6.7.13.0 code. You must drop the version-specific tags (`shopware.payment.method.sync`, `.async`, `.prepared`, `.recurring`, `.refund`) \u2014 the core now autoconfigures the single tag `shopware.payment.method` for any `AbstractPaymentHandler` subclass. Concretely: extend `AbstractPaymentHandler` and implement the two abstract required methods `supports(PaymentHandlerType $type, string $paymentMethodId, Context $context): bool` and `pay(Request $request, PaymentTransactionStruct $transaction, Context $context, ?Struct $validateStruct): ?RedirectResponse`; optionally override `validate()`, `finalize()`, `refund()`, `recurring()`. For your async case specifically: in `pay()` redirect the customer to the PSP using `$transaction->getReturnUrl()` and return `new RedirectResponse($redirectUrl)` (throw `PaymentException::asyncProcessInterrupted($orderTransactionId, $message)` on error); implement `finalize()` to run after the redirect back \u2014 throw `PaymentException::customerCanceled(...)` on cancellation or mark it paid otherwise. Note `finalize` is only called when `pay` returned a `RedirectResponse`, and `validate` is always called regardless of flow. Register the handler as a service tagged `shopware.payment.method` (e.g. via `services.php`: `$services->set(MyCustomPaymentHandler::class)->tag('shopware.payment.method')->args([service(OrderTransactionStateHandler::class)]);`), and create the payment method entity in your plugin's `install()` via `payment_method.repository` with a required, unique `technicalName` and `handlerIdentifier` set to your handler's class name. Never delete the payment method on uninstall (orders reference it) \u2014 deactivate it instead.", "citations": ["platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md:1-93"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "AsynchronousPaymentHandlerInterface", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/checkout/payment/add-payment-plugin.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-48": {"query": "After upgrading, my storefront JavaScript plugin no longer loads \u2014 how do I register it asynchronously with `PluginManager` and where does the compiled file have to be shipped?", "category": "dev", "option": "mcp-wiki", "answer": "Register the plugin in the Storefront entry file `<plugin root>/src/Resources/app/storefront/src/main.js` (a `main.ts` there takes precedence if both exist) using `window.PluginManager.register(pluginName, pluginClass, selector = document, options = {})`. For synchronous registration you pass the class directly: `PluginManager.register('ExamplePlugin', ExamplePlugin, '[data-example-plugin]');`. For asynchronous registration, pass a dynamic import instead of the class: `PluginManager.register('ExamplePlugin', () => import('./example-plugin/example-plugin.plugin'), '[data-example-plugin]');` \u2014 a value without a `prototype` (i.e. an arrow function) is treated as async by the plugin manager, is not bundled into the main JS, and is only downloaded when the selector matches an element on the page. Your plugin class must extend `window.PluginBaseClass` and override `init()` (the base class's default `init()` only logs a warning if not overridden). Build the JS with `shopware-cli project storefront-build` (project template) or `composer run build:js:storefront` (platform contribution setup). The compiled file must be shipped at `<plugin root>/src/Resources/app/storefront/dist/storefront/js/<plugin-name>/<plugin-name>.js`, where `<plugin-name>` is the plugin's technical name converted from camelCase to kebab-case (e.g. `SwagExample` -> `swag-example`); Shopware picks this file up automatically if it exists. Note: registering the same plugin name + selector twice is silently ignored (logged as 'already registered'), and invalid JSON in a `data-*-options` attribute is logged as an error and ignored rather than breaking the page.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md:1-93"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "PluginManager", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/javascript/add-custom-javascript.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-49": {"query": "My storefront controller still uses the `@Route` and `@RouteScope` annotations from 6.4 \u2014 what is the attribute form in Shopware 6.7 and how are the routes wired?", "category": "dev", "option": "mcp-wiki", "answer": "Before Shopware 6.4.11.0 the route scope was set with the `@RouteScope` annotation, which was deprecated for 6.5; in 6.7 you use the `_routeScope` route default together with the Symfony PHP attribute `#[Route(...)]` (from `Symfony\\Component\\Routing\\Attribute\\Route`), not doc-block annotations. Your controller extends `Shopware\\Storefront\\Controller\\StorefrontController`, and the route scope must be set for every route, either on the class or per-route via the `defaults` argument: `#[Route(defaults: [PlatformRequest::ATTRIBUTE_ROUTE_SCOPE => [StorefrontRouteScope::ID]])]`. `PlatformRequest::ATTRIBUTE_ROUTE_SCOPE` resolves to the string `_routeScope`, and `StorefrontRouteScope::ID` resolves to `storefront`. Individual actions get their own attribute, e.g. `#[Route(path: '/example', name: 'frontend.example.example', methods: ['GET'])]`, and render with `$this->renderStorefront('@SwagBasicExample/storefront/page/example.html.twig', [...])`. Required imports: `Shopware\\Core\\PlatformRequest`, `Shopware\\Storefront\\Framework\\Routing\\StorefrontRouteScope`, `Symfony\\Component\\Routing\\Attribute\\Route`. Route names should use a purpose prefix (`frontend`, `widgets`, `payment`, `api`, `store-api`); only `frontend.`, `widgets.`, and `payment.` identify a Storefront route in the router. Wiring: register the controller as a public service in `src/Resources/config/services.php` and call `setContainer` on it (`$services->set(ExampleController::class)->public()->call('setContainer', [service('service_container')]);`), then import the routes in `src/Resources/config/routes.php` \u2014 without this import the controller exposes no URL: `$routes->import('../../Storefront/Controller/*Controller.php', 'attribute');`. Since Shopware 6.7.2.0, a custom route name without one of the standard prefixes can instead be explicitly allow-listed via `storefront.router.allowed_routes` in a `src/Resources/config/packages/storefront.yaml` file, loaded from the plugin's `build()` method.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md:1-89"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "RouteScope", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/controllers/add-custom-controller.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-50": {"query": "My `ScheduledTaskHandler` stopped running after the upgrade \u2014 how must a scheduled task and its handler be declared in Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "A Shopware scheduled task needs two separate classes plus two separate service registrations in `<plugin root>/src/Resources/config/services.php`. 1) The task class extends `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTask` and implements the two abstract static methods `getTaskName(): string` (prefix it with your vendor, e.g. `swag.example_task`, to avoid collisions) and `getDefaultInterval(): int` (seconds); register it with the service tag `shopware.scheduled.task` \u2014 this makes the task persistable/schedulable but does not execute anything. 2) The handler class extends `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\ScheduledTaskHandler`, implements `run()`, and must be marked with the attribute `#[AsMessageHandler(handles: ExampleTask::class)]`; its constructor arguments map to the base `(EntityRepository $scheduledTaskRepository, LoggerInterface $exceptionLogger)`, injected via `service('scheduled_task.repository')` and `service('logger')`. Critically, the handler service must carry the `messenger.message_handler` tag \u2014 the core's `ScheduledTaskExecutorCompilerPass` only injects the `ScheduledTaskExecutor` into handlers carrying that tag; a handler missing this tag falls back to a deprecated inline execution path that throws once 6.8.0.0 is active. If your handler stopped running after the upgrade, check first that this tag is present on the handler's service definition. Optionally implement `Shopware\\Core\\Framework\\MessageQueue\\ScheduledTask\\DynamicallyScheduledTaskHandler` (available since 6.7.13.0) with `getNextExecutionTime(ScheduledTask $task, ScheduledTaskEntity $taskEntity): ?\\DateTimeInterface`, called after `run()` \u2014 returning `null` falls back to the default `nextExecutionTime + runInterval` schedule, and a past timestamp is capped to now. The older approach of overriding `ScheduledTaskHandler::rescheduleTask()` is deprecated for 6.8.0. To run/debug locally: `bin/console scheduled-task:register` (register tasks without reinstalling the plugin), `bin/console scheduled-task:run` (dispatches due tasks, requires status `scheduled` in the `scheduled_task` table unless using the admin worker), and `bin/console messenger:consume` (executes dispatched messages).", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md:1-97"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "ScheduledTaskHandler", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/add-scheduled-task.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-51": {"query": "Custom entities declared in `Resources/config/entities.xml` no longer work for my plugin in Shopware 6.7 \u2014 how do I define and register a DAL entity with PHP attributes instead?", "category": "dev", "option": "mcp-wiki", "answer": "Since Shopware 6.6.3.0 you can declare a DAL entity as a single PHP class instead of `entities.xml` (that filename is only for apps' custom entities, not plugins). Extend `Shopware\\Core\\Framework\\DataAbstractionLayer\\Entity` and annotate the class with `#[Entity('example_entity')]` (constructor params: `name` required/unique, `parent`, `since`, `collectionClass` \u2014 default `EntityCollection::class`, since 6.6.9.0 \u2014 `hydratorClass`, `inheritanceAware`). Declare the primary key property with `#[PrimaryKey]` (a UUID string is recommended). Fields use `#[Field(type: FieldType::..., translated: false, api: false, column: null, maxLength: 255)]`, with special attributes `#[AutoIncrement]`, `#[ForeignKey(entity: 'currency')]`, `#[Serialized(serializer: ...)]` for JSON with a custom serializer, and custom fields via `use EntityCustomFieldsTrait;` or `#[CustomFields]`. Associations use `#[OneToOne]`, `#[ManyToOne]`, `#[OneToMany]` (needs `ref`), `#[ManyToMany]`, with `onDelete` from the `OnDelete` enum. Translated fields need `#[Field(translated: true)]` plus a `#[Translations]` array property, and must be nullable (add `#[Required]` to still enforce a value). To register it, tag the service in `services.php`: `$services->set(Examples\\ExampleEntity::class)->tag('shopware.entity');` \u2014 with autoconfiguration this tag is applied automatically to classes carrying the `Entity` attribute. Registering it auto-creates `example_entity.definition` and `example_entity.repository` services (plus `example_entity_translation.*` when translated fields exist) \u2014 no manual `EntityDefinition`, entity/collection classes, or `EntityTranslationDefinition` needed. Note: the docs' example also shows a `#[State(machine: ...)]` attribute, but the wiki's code check flags `Shopware\\Core\\Framework\\DataAbstractionLayer\\Attribute\\State` as deprecated in 6.7.13.0 \u2014 avoid it in new entities.", "citations": ["platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md:1-91"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "entities.xml", "path": "platform/dev/6.7"}}, {"tool": "grep_docs", "args": {"pattern": "custom entity", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "#\\[Entity", "path": "platform/dev/6.7", "regex": true}}, {"tool": "grep_docs", "args": {"pattern": "DAL entity php attributes", "path": "platform/dev/6.7"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/entities-via-attributes.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-52": {"query": "What must a plugin database migration class implement in Shopware 6.7, and where does the database cleanup on uninstall belong?", "category": "dev", "option": "mcp-wiki", "answer": "A plugin migration class must extend `Shopware\\Core\\Framework\\Migration\\MigrationStep` and implement its two abstract methods: `getCreationTimestamp(): int` (return the timestamp encoded in the class name) and `update(Connection $connection): void`, where all schema and data changes go (e.g. `CREATE TABLE IF NOT EXISTS ...`). `updateDestructive()` is optional \u2014 it has a non-abstract, empty default implementation, and plugin install/update never run it in practice. Migrations live under `<plugin root>/src/Migration`, named `Migration<timestamp><Description>.php`, and can be scaffolded with `bin/console database:create-migration -p <PluginName> --name <Description>` or generated from entity definitions with `bin/console dal:migration:create --bundle=<PluginName> <entity1,entity2>`. Install and update run `migrateInPlace()` on the plugin's `MigrationCollection` automatically (on update, only new migrations); this can be controlled manually in the plugin's lifecycle `update()` method via `$updateContext->setAutoMigrate(false)` and `$updateContext->getMigrationCollection()->migrateInPlace($timestamp)`. Since migrations have no rollback and are never re-run, database cleanup on removal does not belong in a migration \u2014 it belongs in the plugin base class's lifecycle `uninstall()` method (see the Plugin Lifecycle guide, linked from this page as a related page).", "citations": ["platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md:1-84"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "MigrationStep", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-53": {"query": "My theme config labels disappeared from the Theme Manager after 6.7 \u2014 how do I define `theme.json` config fields and where do their translations go now?", "category": "dev", "option": "mcp-wiki", "answer": "Config fields are still declared in `<theme root>/src/Resources/theme.json` under `config.fields`, one entry per technical field name, with parameters `type` (`color`, `text`, `number`, `fontFamily`, `media`, `checkbox`, `switch`, `url`), `value`, `editable` (false hides it in the Administration), `tab`/`block`/`section` for grouping, `custom` (e.g. `componentName: sw-single-select`/`sw-multi-select` with `options[].value`), `scss` (false = not injected as an SCSS variable) and `fullWidth`. Run `bin/console theme:refresh` after any change. The reason labels disappeared: since Shopware 6.7.1.0 the old `label`/`helpText` arrays directly in `theme.json` (including `label` entries under `config.blocks`/`sections`/`tabs`) are deprecated for removal in 6.8, and the wiki's code check confirms `ThemeConfigField::$label` and `$helpText` are tagged deprecated for v6.8.0 in favor of `labelSnippetKey`/`helpTextSnippetKey`. Translations now come from Administration snippet files instead, e.g. `<plugin root>/src/Resources/app/administration/src/app/snippet/en.json` (locale-specific files like `en-GB.json` override base files). The snippet keys follow the pattern `sw-theme.<technicalName>.<tabName>.<blockName>.<sectionName>.<fieldName>.label` (or with an `.0.` index for custom option lists; use `.helpText` for help text); unnamed tab/block/section parts become `default`. The Administration looks up the theme's own technical name first, then any `configInheritance` theme names (last listed first, `@` stripped) \u2014 example key: `sw-theme.justAnotherTheme.default.exampleBlock.exampleSection.my-single-select-field.0.label`.", "citations": ["platform/dev/6.7/guides/plugins/themes/configuration/theme-configuration.md:1-98"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "theme.json", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/themes/configuration/theme-configuration.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-54": {"query": "How do I register a plugin cookie in the storefront cookie consent manager in Shopware 6.7?", "category": "dev", "option": "mcp-wiki", "answer": "Since 6.7.3.0, register your cookie by listening to `Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent` (the old array-based `CookieProviderInterface` is deprecated for removal in 6.8.0). Tag an invokable listener service in `<plugin root>/src/Resources/config/services.php`: `$services->set(CookieListener::class)->tag('kernel.event_listener', ['event' => 'Shopware\\Core\\Content\\Cookie\\Event\\CookieGroupCollectEvent']);`. In `__invoke(CookieGroupCollectEvent $event)`, get the target group from `$event->cookieGroupCollection` by its technical name (default comfort group key is `cookie.groupComfortFeatures`; other keys are `cookie.groupRequired`, `cookie.groupStatistical`, `cookie.groupMarketing`), create a `CookieEntryCollection` if `getEntries()` is null and `setEntries()` it, then build `$cookieEntry = new CookieEntry('my-cookie-key')` with public `$name`, `$value`, `$expiration` (int, days) properties and `$entries->add($cookieEntry)`. Note: `CookieGroup::setEntries()` throws if the group already has a standalone `cookie`/`value` set (a group is either a standalone cookie or a container of entries, not both). Changing a plugin's cookie configuration is picked up automatically for re-consent: a hash per language is stored in the `cookie-config-hash` browser cookie, and a changed hash re-shows the banner. The consent groups are served via the Store API route `store-api.cookie.groups` at `/store-api/cookie-groups` (the wiki's code check corrects the official docs, which give `/store-api/cookie/groups`).", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md:1-79"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "cookie consent", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/advanced/add-cookie-to-manager.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-55": {"query": "How do the breaking storefront accessibility changes reach my theme in Shopware 6.7, and what must an extension that overrides the affected Twig blocks do?", "category": "dev", "option": "mcp-wiki", "answer": "Shopware's Storefront targets WCAG 2.1 AA and BITV 2.0. Breaking accessibility improvements (HTML/Twig/CSS structure changes, e.g. carousel focused slides, 200% text resizing, pagination with links, no empty nav in top-bar, keyboard-operable content) were introduced through 6.6 minors (6.6.1.0-6.6.6.0) gated behind the `ACCESSIBILITY_TWEAKS` feature flag, and became the default in 6.7.0. On the installed 6.7 core the tweaks are simply active by default \u2014 no `.env` change is needed; the wiki's code check found that in core 6.7.13.0 the flag is declared `default: true` and no code in core, storefront or administration actually reads it any more, so setting `ACCESSIBILITY_TWEAKS=1` (as the official docs instruct) changes nothing. An extension that overrode a restructured Twig block must adapt: the pattern used during the 6.6 transition was that new markup got a new inner block while the old block was annotated `@deprecated tag:v6.7.0` (illustrative example: `component_list_items_inner` alongside the old `component_list_items`), so an extension still assuming the old markup (e.g. rendering `<div class=\"list-item\">` instead of the new `<li>`) now produces invalid HTML. After adapting, recompile the theme with `bin/console theme:compile` so styling changes (e.g. adjusted font sizes) apply, and test with Lighthouse/AXE DevTools/WAVE automated tools plus manual keyboard-navigation and screen-reader checks.", "citations": ["platform/dev/6.7/guides/development/accessibility/storefront-accessibility.md:1-75"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "accessibility", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/accessibility/storefront-accessibility.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-56": {"query": "Header and footer are loaded through ESI sub-requests in Shopware 6.7, so page data is gone in my header template \u2014 how do I pass my own data into the header/footer now?", "category": "dev", "option": "mcp-wiki", "answer": "Since header and footer render via ESI sub-requests (routes `frontend.header` at `/_esi/global/header`, `frontend.footer` at `/_esi/global/footer`), they no longer see the current page's data \u2014 data must be passed explicitly. Two ways: 1) In your plugin, extend `@Storefront/storefront/base.html.twig` and override the `base_esi_header` (or `base_esi_footer`) block, merging into the `headerParameters` (or `footerParameters`) Twig variable before calling `parent()`, e.g. `{% set headerParameters = headerParameters|merge({ 'vendorPrefixPluginName': { 'activeRoute': activeRoute } }) %}`. These parameters are sent as query parameters to the ESI route and passed into the header/footer template, where you read them in `@Storefront/storefront/layout/header.html.twig` block `header`, e.g. `headerParameters.vendorPrefixPluginName.activeRoute`; this works for both plugins and apps. Important gotcha: `headerParameters`/`footerParameters` may only contain scalar values, since they become ESI query parameters. 2) Plugins can alternatively listen to `StorefrontRenderEvent`, check `$event->getRequest()->attributes->get('_route') === 'frontend.header'`, read the existing array with `$event->getParameter('headerParameters') ?? []`, add values (e.g. from `$event->getSalesChannelContext()`), and write it back with `$event->setParameter('headerParameters', $headerParameters)`. For a fully custom header/footer, override `base_esi_header`/`base_esi_footer` without calling the ESI render (as the checkout confirm page does, replacing it with `header-minimal.html.twig`) \u2014 but then you must load the header/footer pagelet data yourself, and doing this overwrites customizations from every other extension.", "citations": ["platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-header-footer.md:1-62"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "ESI", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "header.*footer", "path": "platform/dev/6.7", "mode": "files", "regex": true}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/storefront/templates/customize-header-footer.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-57": {"query": "B2B Suite support ends with 6.8 \u2014 how do I run the B2B Suite Migration to B2B Components and check that it finished?", "category": "dev", "option": "mcp-wiki", "answer": "Use two console commands, ideally in separate terminals run at the same time: `bin/console b2b:migrate:commercial` starts the migration of all components/entities defined in the configuration (or pass specific technical component names, e.g. `bin/console b2b:migrate:commercial quote_management shopping_list`; `employee_management` is a prerequisite for every other component and is always migrated first regardless of argument order \u2014 order is determined by configurator priority, not CLI order). Control batch size with `--batch-size=<n>`. The command dispatches work to the message queue, so the migration can still be running after the command returns \u2014 check real status with `bin/console b2b:migrate:progress` (add `--watch` to auto-refresh every 5 seconds). The progress table shows columns Total, Valid, Newly, Migrated, Pending, Error per component, and a Status of `Complete`, `Pending`, `In progress`, `Complete with error` (check the `b2b_components_migration_errors` table for details), or `Has new records`. A migration is finished when every component's status reads `Complete`. Note: Budget Management migration requires Commercial 7.6.0+ and leaves the budget's Organization Unit empty after migration by design \u2014 assign it manually afterwards. The wiki's code check flags these B2B commands/tables as living in the Shopware Commercial plugin, not verifiable against the installed core/storefront/administration vendor code.", "citations": ["platform/dev/6.7/products/extensions/b2b-suite-migration/execution/running-migration.md:1-72"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "B2B Suite Migration", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/products/extensions/b2b-suite-migration/execution/running-migration.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-58": {"query": "My shopware.yaml still uses redis_url \u2014 how do I define the named Redis connections in Shopware 6.7 and which eviction policy does each one need?", "category": "dev", "option": "mcp-wiki", "answer": "Since 6.6.8.0, replace the legacy single `redis_url` with named connections under `shopware.redis.connections` in `config/packages/shopware.yaml`, one entry per data category (Shopware cannot mix eviction policies within one Redis instance): `shopware: redis: connections: { ephemeral: { dsn: 'redis://host1:port/dbindex' }, persistent: { dsn: 'redis://host2:port/dbindex?persistent=1' }, ephemeral_2: { dsn: '%env(REDIS_EPHEMERAL)%/2' } }`. `dsn` is the only, required key per connection, env vars can be used inside it, and each named connection becomes a container service `shopware.redis.connection.<name>` (so names must be unique and follow service-naming rules). Recommended split by category: 1) Ephemeral data (HTTP cache, object cache) \u2014 memory-only persistence, eviction policy `volatile-lru`. 2) Durable, aging data (sessions) \u2014 RDB snapshots and/or AOF persistence, eviction policy `allkeys-lru`. 3) Durable, critical data (cart, number range, lock store, increment) \u2014 persisted, eviction policy `volatile-lru`. Subsystems reference a connection by name, e.g. the number range config accepts `increment_storage: redis` plus `config.connection: <name>` (a connection name is mandatory once storage is `redis`). For high load add `?persistent=1` to the DSN for connection pooling (reusing connections, not extra data persistence). Gotcha: `volatile-lru` only evicts keys that carry a TTL, and Symfony's tag-aware cache adapter stores tag-index sets without a TTL that can accumulate and exhaust memory if not pruned.", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/redis.md:1-77"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "redis_url", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "eviction policy", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/infrastructure/redis.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-59": {"query": "After upgrading to Shopware 6.7 my Varnish cache is never invalidated \u2014 what changed in the reverse proxy configuration?", "category": "dev", "option": "mcp-wiki", "answer": "Several things changed that commonly break Varnish invalidation after upgrading to 6.7: 1) The config key moved (since 6.6.0.0) from `storefront.reverse_proxy` to `shopware.http_cache.reverse_proxy` \u2014 an old key is silently ignored. 2) The Redis/BAN (LUA) Varnish integration is gone in 6.7: the options `ban_method: \"BAN\"` and `use_varnish_xkey: true` (still shown in some example configs) are deprecated with no effect and are removed entirely in 6.8.0 \u2014 Shopware 6.7 always purges via the `xkey` module instead (a `PURGE` request carrying an `xkey` header, handled by `VarnishReverseProxyGateway`), so your VCL and Varnish instance must have the `xkey` vmod (Varnish 6.0+, not in the default install) or you should use Shopware's Varnish Docker image (`github.com/shopware/varnish-shopware`), which ships a compatible default VCL. 3) `TRUSTED_PROXIES` is no longer read out of the box since 6.6 \u2014 use `SYMFONY_TRUSTED_PROXIES=127.0.0.1,10.0.0.0/8` (or `REMOTE_ADDR`) so Symfony trusts the `Forwarded`/`X-Forwarded-*` headers coming from Varnish. 4) `bin/console cache:clear` no longer clears the HTTP cache as of 6.7 (it used to before); use `bin/console cache:clear:http` to clear only the reverse-proxy/HTTP cache, or `cache:clear:all` for everything including pools and HTTP cache. Minimal working config: `shopware: http_cache: reverse_proxy: { enabled: true, hosts: ['varnish-host'], max_parallel_invalidations: 3 }` plus `SHOPWARE_HTTP_CACHE_ENABLED=1` in `.env`. To debug, curl the app server directly with the sales-channel Host header and confirm you get `Cache-Control: public, s-maxage=...` and an `Xkey:` response header \u2014 if `Age: 0` shows everywhere, reverse-proxy mode or the cache-control header is missing at the app level, not at Varnish.", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/reverse-http-cache.md:1-97"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "Varnish", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/infrastructure/reverse-http-cache.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-60": {"query": "Which transports do my Shopware message queue workers have to consume in production, and how do I turn off the admin worker?", "category": "dev", "option": "mcp-wiki", "answer": "In production, run one or more CLI workers (restarted by systemd/supervisor) consuming the transports in priority order, e.g. `bin/console messenger:consume async low_priority --time-limit=60 --memory-limit=128M`. The default admin worker consumes `webhook`, `async`, `low_priority` (installed default; the official docs only mention `async`/`low_priority`, omitting `webhook`), so your CLI workers should cover the same set \u2014 plus you must also run a worker for the `failed` transport, otherwise failed messages are never processed/retried. `async`/`low_priority` messages retry 3 times (1000ms delay, multiplier 2) before landing in `failed`. Transport DSNs are set via env vars: `MESSENGER_TRANSPORT_DSN` for `async` (default `doctrine://default?auto_setup=false`), `MESSENGER_TRANSPORT_LOW_PRIORITY_DSN` for `low_priority`, `MESSENGER_TRANSPORT_FAILURE_DSN` for `failed`; a `webhook` transport (`shopware-webhook://default`, no retries) also exists. Core routes `Shopware\\Core\\Framework\\MessageQueue\\AsyncMessageInterface` to `async` and `LowPriorityMessageInterface` to `low_priority` by default; you can replace a specific class's route with `shopware.messenger.routing_overwrite` (available since 6.6.4.0/6.5.12.0). To disable the admin worker (browser-polling consumption while an admin user is logged in \u2014 causes CPU load with many admin users and stops when nobody is logged in) once CLI workers are running, set in `config/packages/shopware.yaml`: `shopware: admin_worker: enable_admin_worker: false` (its installed default is `true`). If kept enabled, `shopware.admin_worker.poll_interval` defaults to 20 seconds (must stay below PHP `max_execution_time`).", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/message-queue.md:1-85"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "admin worker", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/infrastructure/message-queue.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-61": {"query": "After the upgrade my Elasticsearch index has to be rebuilt \u2014 where do I set the shard and replica counts and which reindex command do I run?", "category": "dev", "option": "mcp-wiki", "answer": "Set shard/replica counts in config/packages/elasticsearch.yml under elasticsearch.index_settings.number_of_shards and elasticsearch.index_settings.number_of_replicas (default is three shards, three replicas since Shopware 6.4.12.0). To rebuild the index after an upgrade: run `bin/console cache:clear` so .env changes apply, then `bin/console es:index` to index to Elasticsearch, or `bin/console dal:refresh:index --use-queue` to reindex the whole shop (ES, SEO URLs, product index, etc.) through the message queue. If indexing finished without errors but the Storefront shows no products, also run `bin/console es:create:alias` manually.", "citations": ["platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md:1-102"], "toolCallLog": [{"tool": "kb_status", "args": {}}, {"tool": "read_doc", "args": {"path": "platform/index.md"}}, {"tool": "grep_docs", "args": {"pattern": "shard", "path": "platform/dev/6.7"}}, {"tool": "grep_docs", "args": {"pattern": "reindex", "path": "platform/hubs/elasticsearch.md"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-62": {"query": "I changed a setting in `.env` on a deployed 6.7 shop but it still behaves the old way \u2014 what takes precedence between `.env`, `.env.local` and the real environment variables, and which settings does Shopware not read from `.env` at all?", "category": "dev", "option": "mcp-wiki", "answer": "The environment-variables reference page for 6.7 does not itself state the Symfony precedence order of .env vs .env.local vs real OS/container environment variables (that is Symfony's standard dotenv behaviour: real environment variables always win over .env.local, which wins over .env) [from memory]. What the wiki page does confirm concretely: some database TLS settings (DATABASE_SSL_CA, DATABASE_SSL_CERT, DATABASE_SSL_KEY, DATABASE_SSL_DONT_VERIFY_SERVER_CERT) are applied by MySQLFactory directly and are explicitly 'not DSN query params' \u2014 i.e. not read the normal query-string way. Also relevant: BLUE_GREEN_DEPLOYMENT is documented as default 0, but the code shows that when unset it actually falls back to true (shopware.deployment.blue_green resolves via defaults_bool_true) \u2014 a discrepancy the page flags and corrects, meaning an unset .env value does not behave the way the variable's stated default implies; set it explicitly. Also, after changing .env values, Shopware requires `bin/console cache:clear` for them to take effect (noted on the Elasticsearch setup page), which is a common reason a changed .env setting appears to have no effect on a deployed shop.", "citations": ["platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md:1-57", "platform/dev/6.7/guides/hosting/infrastructure/elasticsearch/elasticsearch-setup.md:1-102"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": ".env.local", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/hosting/configurations/shopware/environment-variables.md"}}], "notFoundClaim": false, "memoryClaims": ["The environment-variables reference page for 6.7 does not itself state the Symfony precedence order of .env vs .env.local vs real OS/container environment variables (that is Symfony's standard dotenv behaviour: real environment variables always win over .env.local, which wins over .env)."], "sourceVerdict": "partial"}, "dev-63": {"query": "I deployed a plugin update to a 6.7 staging shop and my new migration never ran \u2014 which `bin/console` command applies the pending migrations of that one plugin, and what do I have to pass to it?", "category": "dev", "option": "mcp-wiki", "answer": "Run `bin/console database:migrate <PluginName> --all` (e.g. `bin/console database:migrate SwagBasicExample --all`), passing the plugin's name as the `identifier` argument \u2014 it defaults to `core` if omitted, which is why nothing appears to happen if you forget it \u2014 plus `--all` to apply every pending migration for that plugin. Note that install/update normally run migrations automatically via `migrateInPlace()` on the plugin's MigrationCollection, unless the plugin's lifecycle code called `setAutoMigrate(false)`; new migrations only get picked up if they were created/registered after the plugin was installed, since Shopware discovers them from the `<plugin root>/src/Migration` directory registered at install time.", "citations": ["platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md:1-84"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "database:migrate", "path": "platform/dev/6.7"}}, {"tool": "grep_docs", "args": {"pattern": "plugin migration", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/database/database-migrations.md"}}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "dev-64": {"query": "How do I get an Admin API OAuth token \u2014 with client_credentials for an integration, or the password grant for local testing \u2014 and how long is each token valid?", "category": "dev", "option": "mcp-wiki", "answer": "For integrations (production use), create an integration under Settings > System > Integrations with the 'Administrator' toggle on; the Access key ID becomes client_id and the Secret access key becomes client_secret. POST to /api/oauth/token with `{\"grant_type\": \"client_credentials\", \"client_id\": \"<access key id>\", \"client_secret\": \"<secret access key>\"}`. For local testing only, POST the same endpoint with `{\"grant_type\": \"password\", \"client_id\": \
