ead_doc", "args": {"path": "platform/dev/6.7/guides/plugins/plugins/content/media/_index.md"}}, {"tool": "grep_docs", "args": {"pattern": "saveMediaFile|FileSaver|MediaService", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/products/extensions/migration-assistant/concept/media-processing.md"}}], "notFoundClaim": true, "memoryClaims": ["in core Shopware, the standard way is to inject `Shopware\\Core\\Content\\Media\\MediaService`, call `createMediaInFolder()`/`saveFile()` (or the lower-level `Shopware\\Core\\Content\\Media\\File\\FileSaver::persistFileToMedia()`) with a `MediaFile` built from the file's path/mimeType/size/extension and a target media id, which triggers thumbnail generation as part of the write pipeline (or you can call `Shopware\\Core\\Content\\Media\\Thumbnail\\ThumbnailService::updateThumbnails()` explicitly) \u2014 but none of this is backed by a citation from the served wiki."], "sourceVerdict": "no"}, "gap-08": {"query": "How do I set up a Nuxt project with Shopware Composable Frontends against my shop's Store API \u2014 endpoint, access token, and why do I get HTTP 412?", "category": "gap", "option": "mcp-wiki", "answer": "The wiki only has a 'Composable Frontends' page in the PaaS product docs, and it is about deploying an already-built Node.js/Nuxt frontend on Shopware PaaS Native (`application.yaml` with `kind: cfe`, Node 22/24/26, listening on port 3000, exposing `/api/healthz`, Fastly/CDN caching headers) \u2014 it does not cover creating/configuring a Nuxt project against the Store API, does not name an npm package or scaffolding command for 'Shopware Composable Frontends', and does not mention HTTP 412 anywhere in the corpus. What the wiki does confirm about the Store API endpoint/auth piece of the question: Store API requests are authenticated with the `sw-access-key` header (`Shopware\\Core\\PlatformRequest::HEADER_ACCESS_KEY`) \u2014 copied from Sales Channels \u2192 your channel \u2192 API access in the Administration \u2014 sent against routes under `/store-api/*` (e.g. `/store-api/product`), and customer/cart state is carried via the `sw-context-token` header. No page explains what causes an HTTP 412 response from the Store API. I could not find relevant material in the served wiki for the Nuxt/Composable-Frontends setup workflow or the 412 error specifically; this is a gap in the corpus.", "citations": ["platform/dev/6.7/products/paas/shopware/composable-frontends/_index.md:1-71", "platform/dev/6.7/guides/development/integrations-api/request-headers.md:1-69"], "toolCallLog": [{"tool": "grep_docs", "args": {"pattern": "Composable Frontends|composable-frontends", "path": "platform/dev/6.7", "regex": true, "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/products/paas/shopware/composable-frontends/_index.md"}}, {"tool": "grep_docs", "args": {"pattern": "412", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "nuxt", "path": "platform/dev/6.7", "mode": "files"}}, {"tool": "grep_docs", "args": {"pattern": "sw-access-key", "path": "platform/dev/6.7/guides/development/integrations-api/request-headers.md"}}, {"tool": "grep_docs", "args": {"pattern": "412", "path": "platform/dev/6.6", "mode": "files"}}, {"tool": "read_doc", "args": {"path": "platform/dev/6.7/guides/development/integrations-api/request-headers.md"}}], "notFoundClaim": true, "memoryClaims": [], "sourceVerdict": "partial"}, "rule-01": {"query": "May I extend (subclass) a concrete Shopware core service to change its behaviour, or what should I do instead?", "category": "rule", "option": "mcp-wiki", "answer": "No \u2014 never extend a concrete core service. Use the least invasive extension point first (an event subscriber, then a tagged service in a registry/adapter such as LineItemFactoryRegistry or cart processors), and only decorate as a last resort. When you decorate, type-hint and extend the class's Abstract* contract (never an interface): the abstract class declares `abstract public function getDecorated()`, the core implementation throws DecorationPatternException there, and your decorator injects and delegates to the inner service via getDecorated(). Never mark a decoratable abstract class @internal/@final, never add public methods the abstract class lacks, and never make a decorator an event subscriber. This is also enforced by PHPStan's DecorationPatternRule.", "citations": ["platform/guidelines/6.7/architecture-guidelines.md#extension-point-ladder", "platform/guidelines/6.7/architecture-guidelines.md#decoration-pattern"], "toolCallLog": [{"tool": "kb_status", "args": "{}"}, {"tool": "read_doc", "args": "{path: platform/index.md}"}, {"tool": "list_docs", "args": "{path: guidelines/6.7}"}, {"tool": "grep_docs", "args": "{pattern: decorat, path: guidelines/6.7/architecture-guidelines.md}"}, {"tool": "read_doc", "args": "{path: guidelines/6.7/architecture-guidelines.md, section: extension-points}"}, {"tool": "read_doc", "args": "{path: guidelines/6.7/architecture-guidelines.md, section: decoration-pattern}"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "rule-02": {"query": "Where should cleanup of my plugin's own data on uninstall go, and what must I respect?", "category": "rule", "option": "mcp-wiki", "answer": "Cleanup goes into the plugin base class's `uninstall(UninstallContext $uninstallContext): void` hook (the class extends `Shopware\\Core\\Framework\\Plugin`). The one thing you must respect is `UninstallContext::keepUserData()`: if it returns true, you must never delete persistent plugin data and should return early; only when it is false should you remove or deactivate the data the plugin created. Example from the docs:\n```php\npublic function uninstall(UninstallContext $uninstallContext): void\n{\n    if ($uninstallContext->keepUserData()) {\n        return;\n    }\n    // Remove or deactivate the data created by the plugin\n}\n```\nBe careful about what you delete versus deactivate \u2014 e.g. blindly deleting a payment method entity used by real orders would break those orders, so deactivate rather than hard-delete where the data is referenced elsewhere. When keepUserData() is false, the core itself already removes the plugin's migrations before calling uninstall(), and deletes the plugin's system config, custom entities and custom fields afterwards \u2014 your uninstall() only needs to handle the plugin's own business data beyond that.", "citations": ["platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md:1-82"], "toolCallLog": [{"tool": "grep_docs", "args": "{pattern: uninstall, path: platform/dev/6.7, mode: files}"}, {"tool": "read_doc", "args": "{path: platform/dev/6.7/guides/plugins/plugins/plugin-fundamentals/plugin-lifecycle.md}"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "rule-03": {"query": "Which annotations mark a core class or method as off-limits for extensions, and what does each mean for me?", "category": "rule", "option": "mcp-wiki", "answer": "Every public/protected member is public API unless explicitly marked otherwise, and you may never use, extend or decorate a core class marked @internal. The relevant markers are: @internal \u2014 marks an implementation detail (with a reason); never combine it with @final. Native `final class` is used for DTOs, structs and subscribers, meaning you cannot subclass them at all. @final (as a docblock annotation rather than native `final`) marks a service callers may use but not extend. @experimental stableVersion:vX.Y.Z feature:FLAG marks unreleased code, which you should treat as if it were @internal. @deprecated tag:vX.Y.0 - <replacement> marks removed/replaced code, which will only actually be removed in a major version. DI service constructors are not considered public API, while constructors of DTOs you're meant to instantiate yourself (e.g. CalculatedPrice, QuantityPriceDefinition) are. This is enforced by PHPStan.", "citations": ["platform/guidelines/6.7/architecture-guidelines.md#public-api-and-annotations"], "toolCallLog": [{"tool": "grep_docs", "args": "{pattern: '@internal|@final|@experimental|annotation', path: guidelines/6.7/code-guidelines.md, regex: true}"}, {"tool": "read_doc", "args": "{path: guidelines/6.7/architecture-guidelines.md, offset: 80, limit: 40}"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "rule-04": {"query": "How should my plugin throw exceptions so they follow Shopware's conventions?", "category": "rule", "option": "mcp-wiki", "answer": "Shopware's domain-exception convention: create one exception factory class per top-level domain (e.g. Checkout\\Cart, Checkout\\Customer, Content\\Category, Content\\Product), stored directly in that domain's namespace root and named <Domain>Exception. It must extend the abstract `Shopware\\Core\\Framework\\HttpException` (constructor takes int $statusCode, string $errorCode, string $message, array $parameters = [], ?Throwable $previous = null). Expose every error as a `public static function` factory that returns the exception, and throw via that factory (e.g. `throw CustomerException::customerGroupNotFound($id)`) \u2014 never `new \\RuntimeException(...)` or a generic `\\InvalidArgumentException`. Pass dynamic values as `{{ placeholder }}` tokens in the message plus the $parameters array, not by string concatenation. The rationale is that every failure then gets a traceable, unique error code that can be surfaced to API consumers, and avoids a proliferation of exception classes nobody reacts to. This is enforced by review, not tooling.", "citations": ["platform/guidelines/6.7/code-guidelines.md#domain-exceptions"], "toolCallLog": [{"tool": "grep_docs", "args": "{pattern: uninstall, path: guidelines/6.7}"}, {"tool": "read_doc", "args": "{path: guidelines/6.7/code-guidelines.md, section: domain-exceptions}"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "rule-05": {"query": "Which test level should I pick for a change to a DAL entity definition, and how do I keep the test deterministic?", "category": "rule", "option": "mcp-wiki", "answer": "Pick the lowest level that proves the behaviour, per Shopware's test pyramid: SQL/DBAL adapters, DAL definitions and custom entities are tested with a PHP integration test against a real database \u2014 not a unit test (mocking DBAL Connection to assert SQL is explicitly disallowed; instead push SQL into a database adapter and cover it with an integration test) and not an E2E test (E2E is reserved for whole features crossing Storefront/Administration). To keep it deterministic and isolated: make the test independent of execution order (never depend on files, storage records or listeners left by another test), clean up every artifact by removing dynamically registered event listeners in teardown and rolling back database writes and schema changes, and keep the test compatible with the parallel (paratest) setup so it runs without shared-state collisions. Never let code under test call exit()/die() \u2014 for a Symfony console Application use setAutoExit(false) or CommandTester instead, since PHPUnit would otherwise terminate and silently skip later tests. Watch test speed, since slow suites are what pushed flaky E2E tests into distrust in Shopware's own history.", "citations": ["platform/guidelines/6.7/qa-guidelines.md#test-pyramid", "platform/guidelines/6.7/qa-guidelines.md#determinism-and-isolation"], "toolCallLog": [{"tool": "grep_docs", "args": "{pattern: 'entity definition', path: guidelines/6.7}"}, {"tool": "grep_docs", "args": "{pattern: 'deterministic|randomId|Uuid', path: guidelines/6.7/qa-guidelines.md, regex: true}"}, {"tool": "read_doc", "args": "{path: guidelines/6.7/qa-guidelines.md}"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}, "rule-06": {"query": "Can a storefront controller contain business logic, or where should that logic live?", "category": "rule", "option": "mcp-wiki", "answer": "No \u2014 storefront controllers must not contain business logic or repository access. Shopware follows a headless-first approach: every storefront feature is built on a Store API route first, and controllers/page loaders only call those routes. Storefront controllers extend StorefrontController, use StorefrontRouteScope::ID, name routes frontend.*, restrict HTTP methods and declare return types, but they read data via a route/page loader, write via a Store API route, respond with createActionResponse(), and report errors via flash bags. Dependencies are injected via the constructor into private properties. The actual business logic belongs in the Store API route/service layer, not the controller.", "citations": ["platform/guidelines/6.7/architecture-guidelines.md#headless-first-apis-and-thin-controllers"], "toolCallLog": [{"tool": "read_doc", "args": "{path: guidelines/6.7/architecture-guidelines.md, section: headless-first-apis-and-thin-controllers}"}], "notFoundClaim": false, "memoryClaims": [], "sourceVerdict": "yes"}}}, "scored": {"mcp-wiki": {"dev-01": {"caseId": "dev-01", "scores": {"groundingRelevance": 100, "accuracy": 40, "completeness": 70, "citation": 100, "honesty": 100, "actionability": 100}, "points": {"groundingRelevance": 25, "accuracy": 10, "completeness": 10.5, "citation": 10, "honesty": 15, "actionability": 10}, "total": 80, "verdict": "partly", "scorerTotal": 80, "scorerVerdict": "partly", "discrepancy": false, "provisionalAccuracy": 40, "findability": "pass", "pageReached": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md", "target": "platform/dev/6.7/guides/plugins/plugins/framework/data-handling/add-complex-data-to-existing-entities.md", "notFoundClaim": false, "sourceAbsentOverrideApplied": false, "selfReportDelta": {"reported": 6, "actual": 6, "missing": []}, "fenceDenials": 0, "citationsVerified": " <script>
(function () {
  'use strict';

  // ---- load + defend ----
  var dataEl = document.getElementById('report-data');
  var payload = {};
  try { payload = JSON.parse(dataEl.textContent || '{}') || {}; } catch (e) { payload = {}; }
  var scores = payload.scores || {};
  var raw = payload.raw || {};
  var scoredRaw = payload.scored || {};
  var options = scores.options || {};
  var optionKeys = Object.keys(options);
  var matrix = scores.matrix || {};
  var warnings = scores.warnings || [];

  function dash(v) { return (v === undefined || v === null || v === '') ? '—' : v; }
  function uniqueValues(values) {
    var seen = {}, out = [];
    values.forEach(function (v) {
      if (v === null || v === undefined || v === '') return;
      if (!seen[v]) { seen[v] = true; out.push(v); }
    });
    return out;
  }
  function pct(v) { return (v === undefined || v === null || v === '') ? '—' : (v + '%'); }
  function num(v) { return (v === undefined || v === null) ? '—' : v; }
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k === 'html') { /* not used — kept out for safety */ }
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function text(t) { return document.createTextNode(dash(t)); }
  function td(content, cls) {
    var cell = document.createElement('td');
    if (cls) cell.className = cls;
    if (content instanceof Node) cell.appendChild(content);
    else cell.textContent = dash(content);
    return cell;
  }
  function th(content) {
    var cell = document.createElement('th');
    cell.textContent = content;
    return cell;
  }
  function verdictClass(v) {
    var s = String(v || '').toLowerCase();
    if (['pass', 'partly', 'fail', 'unavailable', 'unscored'].indexOf(s) >= 0) return 'verdict-' + s;
    return '';
  }
  function statusClass(v) {
    var s = String(v || '').toLowerCase();
    if (s.indexOf('ready') === 0) return 'status-pass';
    if (s.indexOf('usable') === 0) return 'status-partly';
    if (s.indexOf('not ready') === 0) return 'status-fail';
    return '';
  }
  function findClass(v) {
    var s = String(v || '').toLowerCase();
    if (s === 'pass') return 'find-pass';
    if (s === 'fail') return 'find-fail';
    return '';
  }
  function heatColor(v) {
    if (v === undefined || v === null || isNaN(v)) return { bg: 'transparent', fg: 'inherit' };
    var clamped = Math.max(0, Math.min(100, Number(v)));
    var hue = (clamped / 100) * 120; // 0=red .. 120=green
    var bg = 'hsl(' + hue.toFixed(0) + ', 55%, 45%)';
    return { bg: bg, fg: '#fff' };
  }
  function prettyJson(obj) {
    var pre = document.createElement('pre');
    try { pre.textContent = JSON.stringify(obj, null, 2); } catch (e) { pre.textContent = String(obj); }
    return pre;
  }
  function sortableTable(container, columns, rows, defaultKey, defaultDir) {
    var wrap = el('div', { class: 'table-wrap' });
    var table = document.createElement('table');
    var thead = document.createElement('thead');
    var trh = document.createElement('tr');
    var sortKey = defaultKey;
    var sortDir = defaultDir || -1;
    columns.forEach(function (c) {
      var cell = th(c.label);
      cell.dataset.key = c.key;
      cell.addEventListener('click', function () {
        if (sortKey === c.key) sortDir *= -1; else { sortKey = c.key; sortDir = -1; }
        draw();
      });
      trh.appendChild(cell);
    });
    thead.appendChild(trh);
    var tbody = document.createElement('tbody');
    table.appendChild(thead);
    table.appendChild(tbody);
    wrap.appendChild(table);
    container.appendChild(wrap);
    function draw() {
      var sorted = rows.slice().sort(function (a, b) {
        var av = a[sortKey], bv = b[sortKey];
        if (av === undefined || av === null) av = '';
        if (bv === undefined || bv === null) bv = '';
        if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sortDir;
        return String(av).localeCompare(String(bv)) * sortDir;
      });
      tbody.innerHTML = '';
      if (sorted.length === 0) {
        var tr = document.createElement('tr');
        var cell = document.createElement('td');
        cell.colSpan = columns.length;
        cell.className = 'empty';
        cell.textContent = 'No data.';
        tr.appendChild(cell);
        tbody.appendChild(tr);
        return;
      }
      sorted.forEach(function (r) {
        var tr = document.createElement('tr');
        columns.forEach(function (c) {
          tr.appendChild(c.render ? c.render(r) : td(r[c.key]));
        });
        tbody.appendChild(tr);
      });
    }
    draw();
    return { redraw: draw };
  }

  // ---- header ----

      ? 'Comparison across ' + (optionKeys.length || '?') + ' option(s). Data is embedded below and this file is self-contained.'
      : 'Single run report. Data is embedded below and this file is self-contained.';

  (function renderHeaderBar() {
    var bar = document.getElementById('header-bar');

    var fields = [

      ['Model', scores.model],
      ['Corpus', corpus.name],

      ['Probe', probe && (probe.ok !== undefined) ? (probe.ok ? 'ok' : 'failed') + (probe.detail ? ' — ' + probe.detail : '') : null],
      ['Wall clock (s)', scores.costs && scores.costs.wallClockSeconds]
    ];
    fields.forEach(function (f) {
      var field = el('div', { class: 'field' });
      var b = document.createElement('b');
      b.textContent = dash(f[1]);
      var lbl = document.createElement('span');
      lbl.textContent = f[0];
      field.appendChild(b);
      field.appendChild(lbl);
      bar.appendChild(field);
    });
  })();

  // ---- tabs ----
  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (b) { b.setAttribute('aria-selected', 'false'); });
      document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
      btn.setAttribute('aria-selected', 'true');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ================= SUMMARY =================
  (function renderSummary() {
    var panel = document.getElementById('tab-summary');

    if (warnings.length) {
      var w = el('div', { class: 'warnings' });
      w.appendChild(el('h3', { text: 'Warnings' }));
      var ul = document.createElement('ul');
      warnings.forEach(function (msg) { ul.appendChild(el('li', { text: msg })); });
      w.appendChild(ul);
      panel.appendChild(w);
    }

    var ranking = matrix.ranking || [];
    if (ranking.length) {
      panel.appendChild(el('h2', { text: 'Ranking' }));
      var list = document.createElement('ol');
      ranking.forEach(function (r) {
        var li = document.createElement('li');
        li.textContent = dash(r.option) + ' — ' + pct(r.overall) + ' ';
        var span = document.createElement('span');
        span.className = statusClass(r.status);
        span.textContent = dash(r.status);
        li.appendChild(span);
        list.appendChild(li);
      });
      panel.appendChild(list);
    }

    panel.appendChild(el('h2', { text: 'Comparison' }));
    var compareRows = optionKeys.map(function (key) {
      var o = options[key] || {};
      var counts = o.counts || {};
      var findability = o.findability || {};
      var edge = o.edge || {};
      var gap = o.gap || {};
      var rule = o.rule || {};
      var averages = o.averages || {};
      var costs = o.costs || {};
      var costTokens = costs.tokens || {};
      return {
        option: o.option || key,
        access: o.access, corpus: o.corpus,
        overall: averages.overall, status: o.status,
        developer: averages.developer, functional: averages.functional,
        findable: (findability.pass != null && findability.total != null) ? (findability.pass + '/' + findability.total) : null,
        edge: (edge.pass != null && edge.total != null) ? (edge.pass + '/' + edge.total) : null,
        gap: (gap.pass != null && gap.total != null) ? (gap.pass + '/' + gap.total) : null,
        rule: (rule.pass != null && rule.total != null) ? (rule.pass + '/' + rule.total) : null,
        pass: counts.pass, partly: counts.partly, fail: counts.fail,
        unavailable: counts.unavailable, unscored: counts.unscored,
        weakest: o.weakestDimension,
        nonCacheTokens: costTokens.nonCache, cacheReadTokens: costTokens.cacheRead,
        cacheHitPct: costs.cacheHitRate != null ? costs.cacheHitRate * 100 : null,
        costUsd: costs.costUsdEstimate ? costs.costUsdEstimate.total : null,
        requests: costs.requests, toolCalls: costs.toolCalls, agentSeconds: costs.agentTimeSecondsSummed,
        costsSchemaVersion: costs.schemaVersion, costsScope: costs.scope, costsSource: costs.source
      };
    });
    sortableTable(panel, [
      { key: 'option', label: 'Option' },
      { key: 'access', label: 'Access' },
      { key: 'corpus', label: 'Corpus' },
      { key: 'overall', label: 'Overall %', render: function (r) { return td(pct(r.overall)); } },
      { key: 'status', label: 'Status', render: function (r) { return td(r.status, statusClass(r.status)); } },
      { key: 'developer', label: 'Dev %', render: function (r) { return td(pct(r.developer)); } },
      { key: 'functional', label: 'Func %', render: function (r) { return td(pct(r.functional)); } },
      { key: 'findable', label: 'Findable' },
      { key: 'edge', label: 'Edge' },
      { key: 'gap', label: 'Gap' },
      { key: 'rule', label: 'Rule' },
      { key: 'pass', label: 'Pass' },
      { key: 'partly', label: 'Partly' },
      { key: 'fail', label: 'Fail' },
      { key: 'unavailable', label: 'Unavail.' },
      { key: 'unscored', label: 'Unscored' },
      { key: 'weakest', label: 'Weakest dim.' },
      { key: 'nonCacheTokens', label: 'Non-cache tokens' },
      { key: 'cacheReadTokens', label: 'Cache-read tokens' },
      { key: 'cacheHitPct', label: 'Cache hit %', render: function (r) { return td(r.cacheHitPct != null ? r.cacheHitPct.toFixed(1) + '%' : null); } },
      { key: 'costUsd', label: 'Est. USD', render: function (r) { return td(r.costUsd != null ? '$' + r.costUsd.toFixed(2) : null); } },
      { key: 'requests', label: 'Requests' },
      { key: 'toolCalls', label: 'Tool calls' },
      { key: 'agentSeconds', label: 'Agent (s)' }
    ], compareRows, 'overall', -1);

    var costCaption = document.createElement('p');
    costCaption.className = 'sub';
    costCaption.style.cssText = 'margin:-8px 0 16px; font-size:12px;';
    var costRowsWithSchema = compareRows.filter(function (r) { return r.costsSchemaVersion; });
    if (costRowsWithSchema.length) {
      var scopes = uniqueValues(costRowsWithSchema.map(function (r) { return r.costsScope; }));
      var sources = uniqueValues(costRowsWithSchema.map(function (r) { return r.costsSource; }));
      costCaption.textContent = 'Cost scope: ' + (scopes.join(', ') || '—') + ' agents only · source: ' +
        (sources.join(', ') || '—') + ' · schema v' + costRowsWithSchema[0].costsSchemaVersion + '. "—" = not measured under this accounting.';
    } else {
      costCaption.textContent = 'Cost columns: legacy accounting — not comparable across runs (no costs.schemaVersion recorded).';
    }
    panel.appendChild(costCaption);

    var deltas = matrix.deltas || {};
    if (deltas.mcpMinusFs || deltas.wikiMinusDocs) {
      panel.appendChild(el('h2', { text: 'Deltas' }));
      var cards = el('div', { class: 'cards' });
      function deltaCard(label, obj) {
        if (!obj) return;
        Object.keys(obj).forEach(function (k) {
          var c = el('div', { class: 'card' });
          c.appendChild(el('div', { class: 'label', text: label + ' (' + k + ')' }));
          var v = obj[k];
          c.appendChild(el('div', { class: 'value', text: (v === undefined || v === null) ? '—' : (v > 0 ? '+' + v : String(v)) }));
          cards.appendChild(c);
        });
      }
      deltaCard('mcp − fs', deltas.mcpMinusFs);
      deltaCard('wiki − docs', deltas.wikiMinusDocs);
      panel.appendChild(cards);
    }
  })();

  // ================= DIMENSIONS =================
  (function renderDimensions() {
    var panel = document.getElementById('tab-dimensions');
    var byDimension = matrix.byDimension || {};
    var dims = Object.keys(byDimension);
    if (!dims.length) {
      // derive from any option's averages.byDimension if matrix lacks it
      optionKeys.forEach(function (key) {
        var bd = (options[key] && options[key].averages && options[key].averages.byDimension) || {};
        Object.keys(bd).forEach(function (d) { if (dims.indexOf(d) < 0) dims.push(d); });
      });
    }

    panel.appendChild(el('h2', { text: 'Dimension heatmap' }));

      panel.appendChild(el('p', { class: 'empty', text: 'No dimension data.' }));
    } else {
      var wrap = el('div', { class: 'table-wrap' });
      var table = document.createElement('table');
      var thead = document.createElement('tr');
      thead.appendChild(th('Dimension'));
      optionKeys.forEach(function (k) { thead.appendChild(th(k)); });
      var theadWrap = document.createElement('thead');
      theadWrap.appendChild(thead);

      var tbody = document.createElement('tbody');
      dims.forEach(function (d) {
        var tr = document.createElement('tr');
        tr.appendChild(td(d));
        optionKeys.forEach(function (k) {
          var v = (byDimension[d] && byDimension[d][k] !== undefined)
            ? byDimension[d][k]
            : ((options[k] && options[k].averages && options[k].averages.byDimension) ? options[k].averages.byDimension[d] : null);
          var cell = document.createElement('td');
          cell.className = 'heat-cell';
          if (v === undefined || v === null) {
            cell.textContent = '—';
          } else {
            var col = heatColor(v);
            cell.style.background = col.bg;
            cell.style.color = col.fg;
            cell.textContent = v;
          }
          tr.appendChild(cell);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      panel.appendChild(wrap);
    }

    var anyByArea = optionKeys.some(function (k) { return options[k] && options[k].byArea; });
    if (anyByArea) {
      panel.appendChild(el('h2', { text: 'By area' }));
      var areas = [];
      optionKeys.forEach(function (k) {
        var ba = (options[k] && options[k].byArea) || {};
        Object.keys(ba).forEach(function (a) { if (areas.indexOf(a) < 0) areas.push(a); });
      });
      var wrap2 = el('div', { class: 'table-wrap' });
      var table2 = document.createElement('table');
      var thr = document.createElement('tr');
      thr.appendChild(th('Area'));
      optionKeys.forEach(function (k) { thr.appendChild(th(k)); });
      var thead2 = document.createElement('thead');
      thead2.appendChild(thr);
      table2.appendChild(thead2);
      var tbody2 = document.createElement('tbody');
      areas.forEach(function (a) {
        var tr = document.createElement('tr');
        tr.appendChild(td(a));
        optionKeys.forEach(function (k) {
          var entry = (options[k] && options[k].byArea && options[k].byArea[a]) || null;
          tr.appendChild(td(entry ? (dash(entry.average) + ' (' + dash(entry.pass) + '/' + dash(entry.cases) + ')') : null));
        });
        tbody2.appendChild(tr);
      });
      table2.appendChild(tbody2);
      wrap2.appendChild(table2);
      panel.appendChild(wrap2);
    }
  })();

  // ================= CASES =================
  (function renderCases() {
    var panel = document.getElementById('tab-cases');

    var allCases = scores.cases || [];
    if (!allCases.length) {
      var seen = {};
      optionKeys.forEach(function (k) {
        ((options[k] && options[k].cases) || []).forEach(function (c) {
          if (c.caseId && !seen[c.caseId]) { seen[c.caseId] = true; allCases.push(c.caseId); }
        });
      });
    }

    // index scorecards by option -> caseId
    var byOptCase = {};
    optionKeys.forEach(function (k) {
      byOptCase[k] = {};
      ((options[k] && options[k].cases) || []).forEach(function (c) { byOptCase[k][c.caseId] = c; });
    });

    var categories = [];
    var verdicts = [];
    allCases.forEach(function (cid) {
      optionKeys.forEach(function (k) {
        var c = byOptCase[k][cid];
        if (c) {
          if (c.category && categories.indexOf(c.category) < 0) categories.push(c.category);
          if (c.verdict && verdicts.indexOf(c.verdict) < 0) verdicts.push(c.verdict);
        }
      });
    });

    var activeCategory = null;
    var activeVerdict = null;

    var chips = el('div', { class: 'chips' });
    var catGroup = el('span', { class: 'chip-group-label', text: 'Category' });
    chips.appendChild(catGroup);
    var catChipEls = [];
    categories.forEach(function (cat) {
      var chip = el('button', { class: 'chip', type: 'button', text: cat });
      chip.setAttribute('aria-pressed', 'false');
      chip.addEventListener('click', function () {
        activeCategory = (activeCategory === cat) ? null : cat;
        catChipEls.forEach(function (c) { c.setAttribute('aria-pressed', String(c.textContent === activeCategory)); });
        drawGrid();
      });
      catChipEls.push(chip);
      chips.appendChild(chip);
    });
    var verdictGroup = el('span', { class: 'chip-group-label', text: 'Verdict' });
    chips.appendChild(verdictGroup);
    var verdictChipEls = [];
    verdicts.forEach(function (v) {
      var chip = el('button', { class: 'chip', type: 'button', text: v });
      chip.setAttribute('aria-pressed', 'false');
      chip.addEventListener('click', function () {
        activeVerdict = (activeVerdict === v) ? null : v;
        verdictChipEls.forEach(function (c) { c.setAttribute('aria-pressed', String(c.textContent === activeVerdict)); });
        drawGrid();
      });
      verdictChipEls.push(chip);
      chips.appendChild(chip);
    });
    panel.appendChild(chips);

    var gridWrap = el('div', { class: 'table-wrap' });
    panel.appendChild(gridWrap);
    var drilldown = el('div', { class: 'drilldown', id: 'case-drilldown' });
    drilldown.appendChild(el('p', { class: 'empty', text: 'Click a cell to see the case detail.' }));
    panel.appendChild(drilldown);

    function drawGrid() {
      gridWrap.innerHTML = '';
      var visibleCases = allCases.filter(function (cid) {
        if (!activeCategory && !activeVerdict) return true;
        return optionKeys.some(function (k) {
          var c = byOptCase[k][cid];
          if (!c) return false;
          if (activeCategory && c.category !== activeCategory) return false;
          if (activeVerdict && c.verdict !== activeVerdict) return false;
          return true;
        });
      });
      if (!visibleCases.length || !optionKeys.length) {
        gridWrap.appendChild(el('p', { class: 'empty', text: 'No cases match the filters.' }));
        return;
      }
      var table = document.createElement('table');
      var thead = document.createElement('thead');
      var trh = document.createElement('tr');
      trh.appendChild(th('Case'));
      optionKeys.forEach(function (k) { trh.appendChild(th(k)); });
      thead.appendChild(trh);
      table.appendChild(thead);
      var tbody = document.createElement('tbody');
      visibleCases.forEach(function (cid) {
        var tr = document.createElement('tr');
        tr.appendChild(td(cid));
        optionKeys.forEach(function (k) {
          var c = byOptCase[k][cid];
          var cell = document.createElement('td');
          if (!c) { cell.textContent = '—'; tr.appendChild(cell); return; }
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cell-btn ' + verdictClass(c.verdict);
          btn.textContent = pct(c.total) + (c.findability ? (c.findability === 'pass' ? ' ✓' : c.findability === 'fail' ? ' ✗' : '') : '');
          btn.addEventListener('click', function () { renderDrilldown(k, cid, c); });
          cell.appendChild(btn);
          tr.appendChild(cell);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      gridWrap.appendChild(table);
    }

    function highlightMemory(text) {
      var frag = document.createDocumentFragment();
      if (!text) { frag.appendChild(document.createTextNode('—')); return frag; }
      var sentences = String(text).split(/(?<=[.!?])\s+/);
      sentences.forEach(function (s, i) {
        var span = document.createElement('span');
        span.textContent = s + (i < sentences.length - 1 ? ' ' : '');
        if (/\[from memory\]/i.test(s)) span.className = 'mem-highlight';
        frag.appendChild(span);
      });
      return frag;
    }

    function renderDrilldown(optKey, caseId, scoreCard) {
      drilldown.innerHTML = '';
      drilldown.appendChild(el('h3', { text: optKey + ' — ' + caseId }));

      var rawCase = (raw[optKey] && raw[optKey][caseId]) || {};
      var scoredCase = (scoredRaw[optKey] && scoredRaw[optKey][caseId]) || {};

      var kv = el('dl', { class: 'kv' });
      function kvRow(k, v) {
        kv.appendChild(el('dt', { text: k }));
        kv.appendChild(el('dd', { text: dash(v) }));
      }
      kvRow('Query', rawCase.query);
      kvRow('Category', scoreCard.category);
      kvRow('Target', scoreCard.target);
      kvRow('Page reached', scoreCard.pageReached);
      kvRow('Verdict', scoreCard.verdict);
      kvRow('Total', pct(scoreCard.total));
      kvRow('Findability', scoreCard.findability);
      kvRow('Not-found claim', rawCase.notFoundClaim);
      drilldown.appendChild(kv);

      if (scoreCard.discrepancy) {
        var disc = el('p', { class: 'warnings' });
        disc.textContent = 'Discrepancy: recomputed total ' + pct(scoreCard.total) + ' vs scorer total ' + pct(scoreCard.scorerTotal) + ' (' + dash(scoreCard.scorerVerdict) + ')';
        drilldown.appendChild(disc);
      }

      drilldown.appendChild(el('h3', { text: 'Answer' }));
      var answerP = document.createElement('p');
      answerP.appendChild(highlightMemory(rawCase.answer));
      drilldown.appendChild(answerP);

      drilldown.appendChild(el('h3', { text: 'Citations' }));
      var citationsList = document.createElement('ul');
      var citations = rawCase.citations || [];
      if (!citations.length) citationsList.appendChild(el('li', { text: '—' }));
      citations.forEach(function (c) {
        citationsList.appendChild(el('li', { text: (typeof c === 'string') ? c : JSON.stringify(c) }));
      });
      drilldown.appendChild(citationsList);
      var verified = document.createElement('p');
      verified.textContent = 'Verified: ' + dash(scoreCard.citationsVerified);
      drilldown.appendChild(verified);

      drilldown.appendChild(el('h3', { text: 'Tool call log' }));
      var toolCalls = rawCase.toolCallLog || [];
      // Ground-truth calls (from the transcript extract) when present, keyed by case id.
      var gtCalls = ((payload.calls || {})[optKey] || {})[caseId] || [];
      if (!toolCalls.length) {
        drilldown.appendChild(el('p', { class: 'empty', text: 'No tool calls recorded.' }));
      } else {
        var tcWrap = el('div', { class: 'table-wrap' });
        var tcTable = document.createElement('table');
        var tcHead = document.createElement('tr');
        tcHead.appendChild(th('Tool'));
        tcHead.appendChild(th('Args'));
        tcHead.appendChild(th('Round trip'));
        tcHead.appendChild(th('Returned'));
        var tcTheadWrap = document.createElement('thead');
        tcTheadWrap.appendChild(tcHead);
        tcTable.appendChild(tcTheadWrap);
        var tcBody = document.createElement('tbody');
        toolCalls.forEach(function (call, i) {
          var argsStr = JSON.stringify(call.args || {});
          var gt = gtCalls[i] || null;
          var tr = document.createElement('tr');
          tr.appendChild(td(call.tool));
          tr.appendChild(td(argsStr));
          tr.appendChild(td(gt && gt.latencyMs != null ? gt.latencyMs + ' ms' : '—'));
          tr.appendChild(td(gt && gt.resultBytes != null
            ? gt.resultBytes.toLocaleString() + ' B / ' + (gt.resultLines || 0) + ' ln' + (gt.empty ? ' (no hits)' : '')
            : '—'));
          tcBody.appendChild(tr);
        });
        tcTable.appendChild(tcBody);
        tcWrap.appendChild(tcTable);
        drilldown.appendChild(tcWrap);
      }

      drilldown.appendChild(el('h3', { text: 'Findings' }));
      var findingsList = document.createElement('ul');
      var findings = scoreCard.findings || [];
      if (!findings.length) findingsList.appendChild(el('li', { text: '—' }));
      findings.forEach(function (f) { findingsList.appendChild(el('li', { text: typeof f === 'string' ? f : JSON.stringify(f) })); });
      drilldown.appendChild(findingsList);

      drilldown.appendChild(el('h3', { text: 'Official references' }));
      var refs = scoreCard.officialReferences || [];
      if (!refs.length) {
        drilldown.appendChild(el('p', { class: 'empty', text: '—' }));
      } else {
        var refList = document.createElement('ul');
        refs.forEach(function (r) {
          refList.appendChild(el('li', { text: dash(r.url) + ' — ' + dash(r.quote) }));
        });
        drilldown.appendChild(refList);
      }

      drilldown.appendChild(el('h3', { text: 'Notes' }));
      drilldown.appendChild(el('p', { text: scoreCard.notes }));

      if (Object.keys(scoredCase).length) {
        var scoredDetails = document.createElement('details');
        scoredDetails.appendChild(el('summary', { text: 'Scored JSON (verbatim)' }));
        scoredDetails.appendChild(prettyJson(scoredCase));
        drilldown.appendChild(scoredDetails);
      }
    }

    drawGrid();
  })();

  // ================= RAW DATA =================
  (function renderRaw() {
    var panel = document.getElementById('tab-raw');
    if (!optionKeys.length) {
      panel.appendChild(el('p', { class: 'empty', text: 'No raw data.' }));
      return;
    }
    optionKeys.forEach(function (k) {
      panel.appendChild(el('h2', { text: k }));
      var caseIds = Object.keys(raw[k] || {});
      var scoredIds = Object.keys(scoredRaw[k] || {});
      var allIds = caseIds.concat(scoredIds.filter(function (id) { return caseIds.indexOf(id) < 0; }));
      if (!allIds.length) {
        panel.appendChild(el('p', { class: 'empty', text: 'No cases.' }));
        return;
      }
      allIds.forEach(function (cid) {
        var details = document.createElement('details');
        details.appendChild(el('summary', { text: cid }));
        var rawDetails = document.createElement('details');
        rawDetails.appendChild(el('summary', { text: 'Raw' }));
        rawDetails.appendChild(prettyJson((raw[k] && raw[k][cid]) || {}));
        details.appendChild(rawDetails);
        var scoredDetails = document.createElement('details');
        scoredDetails.appendChild(el('summary', { text: 'Scored' }));
        scoredDetails.appendChild(prettyJson((scoredRaw[k] && scoredRaw[k][cid]) || {}));
        details.appendChild(scoredDetails);
        panel.appendChild(details);
      });
    });
  })();

  // ================= RUN =================
  (function renderRun() {
    var panel = document.getElementById('tab-run');
    var corpus = scores.corpus || {};
    var fp = corpus.fingerprint || {};
    var probe = corpus.probe || {};

    panel.appendChild(el('h2', { text: 'Corpus' }));
    var corpusKv = el('dl', { class: 'kv' });
    corpusKv.appendChild(el('dt', { text: 'Name' }));
    corpusKv.appendChild(el('dd', { text: corpus.name }));
    corpusKv.appendChild(el('dt', { text: 'Probe' }));
    corpusKv.appendChild(el('dd', { text: probe && probe.ok !== undefined ? ((probe.ok ? 'ok' : 'failed') + (probe.detail ? ' — ' + probe.detail : '')) : null }));
    Object.keys(fp).forEach(function (k) {
      corpusKv.appendChild(el('dt', { text: k }));
      corpusKv.appendChild(el('dd', { text: fp[k] }));
    });
    panel.appendChild(corpusKv);

    panel.appendChild(el('h2', { text: 'Yardstick' }));
    var yardstick = scores.yardstick || {};
    var ykv = el('dl', { class: 'kv' });
    ['casesMdSha', 'rubricSha', 'briefSha'].forEach(function (k) {
      ykv.appendChild(el('dt', { text: k }));
      ykv.appendChild(el('dd', { text: yardstick[k] }));
    });
    panel.appendChild(ykv);

    if (scores.runs && Object.keys(scores.runs).length) {
      panel.appendChild(el('h2', { text: 'Runs (compare)' }));
      var rkv = el('dl', { class: 'kv' });
      Object.keys(scores.runs).forEach(function (k) {
        rkv.appendChild(el('dt', { text: k }));
        rkv.appendChild(el('dd', { text: scores.runs[k] }));
      });
      panel.appendChild(rkv);
    }

    panel.appendChild(el('h2', { text: 'Selector' }));
    panel.appendChild(el('p', { text: dash(scores.casesSelector) }));

    if (warnings.length) {
      panel.appendChild(el('h2', { text: 'Warnings' }));
      var ul = document.createElement('ul');
      warnings.forEach(function (msg) { ul.appendChild(el('li', { text: msg })); });
      panel.appendChild(ul);
    }

    panel.appendChild(el('h2', { text: 'scores.json' }));
    var details = document.createElement('details');
    details.appendChild(el('summary', { text: 'Show raw scores.json' }));
    details.appendChild(prettyJson(scores));
    panel.appendChild(details);
  })();

})();
</script>
</body>
</html>
